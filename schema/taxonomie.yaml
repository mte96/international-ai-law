# =====================================================================
# THEMENACHSEN — die zweite Dimension. Ohne sie entstehen
# Ländermonographien statt vergleichbarer Expertise.
# =====================================================================
themenachsen:
  - id: marktzugang
    name: Marktzugang und Produktregulierung
    beschreibung: >
      Risikoklassifizierung, Konformitätsbewertung, CE-Kennzeichnung,
      notifizierte Stellen, Registrierung, Marktüberwachung.
  - id: gpai
    name: GPAI und Basismodelle
    beschreibung: >
      Transparenzpflichten, systemische Risiken, Compute-Schwellen,
      Modelldokumentation, Code of Practice, Evaluierungspflichten.
  - id: urheberrecht
    name: Urheberrecht und Trainingsdaten
    beschreibung: >
      TDM-Schranken, Fair Use, Opt-out, Lizenzmärkte, Schutzfähigkeit
      von Output, Leistungsschutz. Der aktivste Streitgegenstand weltweit.
  - id: datenschutz
    name: Datenschutz und automatisierte Entscheidungen
    beschreibung: >
      Rechtsgrundlagen für Training, Zweckbindung, Betroffenenrechte,
      Art. 22 DSGVO und Äquivalente, grenzüberschreitende Transfers.
  - id: haftung
    name: Haftung
    beschreibung: >
      Produkthaftung, Deliktsrecht, Vertragshaftung, Beweislast,
      Kausalität bei opaken Systemen, Versicherbarkeit.
  - id: grundrechte
    name: Grundrechte und Diskriminierung
    beschreibung: >
      Antidiskriminierung bei Beschäftigung, Kredit und Wohnraum,
      biometrische Erkennung, Überwachung, Rechtsschutz.
  - id: sektor-medizin
    name: Gesundheit und Medizinprodukte
  - id: sektor-finanz
    name: Finanzdienstleistungen
  - id: sektor-oeffentlich
    name: Öffentliche Verwaltung und Justiz
  - id: berufsrecht
    name: Anwaltliches Berufsrecht und KI in Gerichtsverfahren
    beschreibung: >
      Sorgfaltspflichten beim KI-Einsatz, Sanktionen wegen erfundener
      Fundstellen, Gerichtsverfügungen zur KI-Nutzung, unerlaubte
      Rechtsberatung durch Software.
  - id: sicherheit-export
    name: Sicherheit, Exportkontrolle und Dual Use
  - id: wettbewerb
    name: Wettbewerb und Marktmacht
  - id: arbeit
    name: Arbeitsrecht und Mitbestimmung
  - id: content
    name: Content, Deepfakes, Wahlen und Kennzeichnung
  - id: vertrag
    name: Vertragsgestaltung und Beschaffung
    beschreibung: >
      KI-Klauseln, Rollenverteilung in der Wertschöpfungskette,
      Musterklauseln für öffentliche Beschaffung, Haftungsallokation.
  - id: governance
    name: Governance, Normung und Compliance-Praxis
    beschreibung: >
      ISO/IEC 42001, NIST AI RMF, harmonisierte Normen, Audits,
      KI-Kompetenz, interne Verantwortlichkeiten.

