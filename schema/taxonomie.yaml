# --- Gliederung der Rechtsordnungen fuer die Auswahl -------------------
# Die Reihenfolge hier ist die Reihenfolge in der App. Uebernationales
# zuerst, weil dort das Recht entsteht, das die uebrigen uebernehmen.
# Transkontinentale Faelle: Russland steht bei Europa (Gesetzgeber und
# Gerichte sitzen in Moskau), Tuerkei und die Golfstaaten bei Asien
# (UN-Gliederung: Westasien), Kasachstan und Usbekistan ebenso.
