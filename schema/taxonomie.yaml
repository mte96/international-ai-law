# =====================================================================
# taxonomie.yaml — Kontrolliertes Vokabular des Projekts
# Jede id hier ist ein stabiler Schluessel. Aendern bricht Verknuepfungen.
# =====================================================================

jurisdiktionen:
  # --- TIER 1: Volltiefe + laufendes Monitoring ---------------------
  - id: eu
    name: Europäische Union
    kontinent: uebernational
    tier: 1
    typ: supranational
    sprachen: [de, en]
    begruendung: >
      Globaler Referenzrahmen. Der AI Act ist das dichteste
      Regelwerk weltweit und wird in Drittstaaten als Vorlage
      benutzt (Brüsseler Effekt).
  - id: us
    name: Vereinigte Staaten
    kontinent: nordamerika
    tier: 1
    typ: bundesstaat
    subjurisdiktionen: [us-ca, us-co, us-tx, us-il, us-ny, us-ut]
    begruendung: >
      Innovationszentrum und Litigation-Hotspot. Hier entsteht das
      Fallrecht, das weltweit zitiert wird. Kein Bundesgesetz,
      dafür ein Flickenteppich aus Staatenrecht und Exekutivakten.
  - id: uk
    name: Vereinigtes Königreich
    kontinent: europa
    tier: 1
    typ: nationalstaat
    begruendung: >
      Bewusstes Gegenmodell zur EU: sektoral statt horizontal.
      Common Law, eigene Rechtsprechung zu Training und IP.
  - id: au
    name: Australien
    kontinent: ozeanien
    tier: 1
    typ: bundesstaat
    subjurisdiktionen: [au-wa]
    begruendung: >
      Regulierung im Entstehen: das Land hat den Pfad verbindlicher
      Guardrails 2025 verlassen und setzt auf freiwillige Standards.
      Ein eigenstaendiges Modell neben EU und USA.
  - id: de
    name: Deutschland
    kontinent: europa
    tier: 1
    typ: nationalstaat
    begruendung: >
      Nationale Durchfuehrung der KI-VO, dichte Rechtsprechung zu
      Training und Datenschutz, eigenstaendige TDM-Schranke.

  # --- TIER 2: Dossier-Tiefe, kein Volltextmonitoring ---------------
  - id: cn
    name: China
    kontinent: asien
    tier: 2
    typ: nationalstaat
    begruendung: >
      Nach der EU die höchste Regelungsdichte weltweit, eigene
      Doktrin (u.a. Urheberrechtsschutz KI-generierter Werke).
      Ohne China ist das Feld nicht vollstaendig zu ueberblicken.
  - id: kr
    name: Südkorea
    kontinent: asien
    tier: 2
    typ: nationalstaat
    begruendung: Erstes umfassendes KI-Rahmengesetz nach der EU. Modell für Asien.
  - id: jp
    name: Japan
    kontinent: asien
    tier: 2
    typ: nationalstaat
    begruendung: Bewusster Soft-Law-Ansatz, weitreichende TDM-Schranke (Art. 30-4).
  - id: sg
    name: Singapur
    kontinent: asien
    tier: 2
    typ: nationalstaat
    begruendung: >
      APAC-Governance-Hub mit AI Verify als Pruefrahmen, der in der
      Region als Vorlage benutzt wird.
  - id: ca
    name: Kanada
    kontinent: nordamerika
    tier: 2
    typ: bundesstaat
    begruendung: AIDA gescheitert, Neuanlauf. Lehrreiches Negativbeispiel.
  - id: ru
    name: Russland
    kontinent: europa
    tier: 2
    begruendung: >
      Seit dem 01.09.2026 gilt ein eigenes KI-Gesetz (243-FZ), das nach
      Herkunft statt nach Risiko anknüpft und eine Trainingsschranke nur
      für russische Entwickler kennt. Das dritte eigenständige
      Regulierungsmodell neben dem europäischen und dem chinesischen.
  - id: br
    name: Brasilien
    kontinent: suedamerika
    tier: 2
    typ: bundesstaat
    begruendung: PL 2338, EU-nahes Modell mit Ausstrahlung auf Lateinamerika.
  - id: in
    name: Indien
    kontinent: asien
    tier: 2
    typ: bundesstaat
    begruendung: DPDP-Regime plus Governance Guidelines, sehr großer Markt.

  # --- TIER 3: Transnationale Ebene ---------------------------------
  - id: coe
    name: Europarat
    kontinent: uebernational
    tier: 3
    typ: international
    begruendung: >
      Rahmenkonvention über KI (CETS 225) — der einzige
      völkerrechtlich verbindliche KI-Vertrag.
  - id: oecd
    name: OECD
    kontinent: uebernational
    tier: 3
    typ: international
    begruendung: AI Principles als Referenz fast aller nationalen Regime; Policy Observatory.
  - id: un
    name: Vereinte Nationen
    kontinent: uebernational
    tier: 3
    typ: international
    begruendung: Global Digital Compact, Scientific Panel, Global Dialogue.
  - id: iso
    name: ISO/IEC, CEN-CENELEC, NIST
    kontinent: uebernational
    tier: 3
    typ: normung
    begruendung: >
      Die harmonisierten Normen zum AI Act sind faktisch das
      anwendbare Recht. Sie liest fast niemand. Genau darin liegt
      eine systematische Luecke der Literatur.
  - id: g7
    name: G7 / Hiroshima-Prozess
    kontinent: uebernational
    tier: 3
    typ: international
  - id: unesco
    name: UNESCO
    kontinent: uebernational
    tier: 3
    typ: international
  - id: wipo
    name: WIPO
    kontinent: uebernational
    tier: 3
    typ: international
    begruendung: KI und geistiges Eigentum, Konversationsprozess.

  # --- TIER 4: Beobachtungsliste ------------------------------------
  - id: mx
    name: Mexiko
    kontinent: nordamerika
    tier: 4
    begruendung: >
      Bindende Rechtsprechung zum KI-Einsatz in der Justiz (Jurisprudencia
      2026) — weltweit bislang einzigartig, mit ausdrücklichem Bezug auf
      die KI-VO.
  - id: nz
    name: Neuseeland
    kontinent: ozeanien
    tier: 4
  - id: co
    name: Kolumbien
    kontinent: suedamerika
    tier: 4
    begruendung: Frühe Verfassungsrechtsprechung zum KI-Einsatz durch Richter.
  - id: ar
    name: Argentinien
    kontinent: suedamerika
    tier: 4
  - id: intl
    name: Übergreifend und international
    kontinent: uebernational
    tier: 3
    typ: international
    begruendung: >
      Sammelposten für Befunde, die keiner einzelnen Rechtsordnung
      zuzuordnen sind — etwa jurisdiktionsübergreifende Falldatenbanken.
  - id: gr
    name: Griechenland
    kontinent: europa
    tier: 3
    begruendung: >
      N. 4961/2022 regelt Verwaltungs- und Beschaeftigten-KI drei Jahre
      vor der KI-VO - der einzige Mitgliedstaat mit materiellem KI-Recht
      vor der Behoerdenbenennung.
  - id: hu
    name: Ungarn
    kontinent: europa
    tier: 4
    begruendung: Gesichtserkennung bei verbotenen Versammlungen - erster offener Konflikt mit Art. 5 KI-VO.
  - id: pt
