    typ: konsolidiert
    titel: Lei nº 13.718, de 24 de setembro de 2018 — Einfügung des Art. 218-C
    url: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/L13718.htm
    sprache: pt
    urheber: Presidência da República
    verifiziert: true
    notiz: Amtlicher Wortlaut des Art. 218-C mit Straferhöhung und Ausschluss der Rechtswidrigkeit.
  - datum: 2024-01-12
    typ: konsolidiert
    titel: Lei nº 14.811, de 12 de janeiro de 2024
    url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14811.htm
    sprache: pt
    urheber: Presidência da República
    verifiziert: true
    notiz: Amtlicher Wortlaut; belegt, dass die Lei keine ausdrückliche Regelung zu künstlicher Intelligenz
      oder Deepfakes enthält.
