  jurisdiktion: in
  kurztitel: DPDP Act 2023 — indisches Datenschutzgesetz
  offizieller_titel: The Digital Personal Data Protection Act, 2023
  fundstelle: Act No. 22 of 2023
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'Am 11.08.2023 ausgefertigt, aber erst mit den Durchführungsregeln vom 14.11.2025 gestaffelt
    in Kraft gesetzt. Am 14.11.2025 traten nur die Einleitungsvorschriften, die Errichtung des Data Protection
    Board und die Folgeänderungen des Right to Information Act 2005 und des TRAI Act 1997 in Kraft. Die
    materiellen Pflichten folgen am 14.05.2027.

    '
  kurzbeschreibung: 'Der DPDP Act regelt die Verarbeitung digitaler personenbezogener Daten. Er kennt
    nur zwei Rechtsgrundlagen — Einwilligung und "legitimate uses" (ein abschließender Katalog) —, keine
    Interessenabwägung wie Art. 6 Abs. 1 lit. f DSGVO und keine Kategorie besonderer Daten. Er verpflichtet
    Data Fiduciaries zu Zweckbindung, Datenminimierung, Richtigkeit, Sicherheit, Löschung nach Zweckerreichung
    und Meldung von Verletzungen. Besondere Pflichten treffen "Significant Data Fiduciaries": unabhängige
    Prüfungen, Datenschutz-Folgenabschätzungen und — für KI entscheidend — die Pflicht zu Sorgfaltsmaßnahmen,
    mit denen überprüft wird, dass die eingesetzten technischen Mittel Einschließlich ALGORITHMISCHER
    SOFTWARE kein Risiko für die Rechte der betroffenen Personen begründen. Für Daten von Kindern gilt
    verifizierte elterliche Einwilligung und ein Verbot von Verhaltensbeobachtung und zielgerichteter
    Werbung. Bußgelder bis 250 Crore INR (Sicherheitsverstöße), 200 Crore (Meldepflicht, Kinderschutz)
    und 50 Crore (übrige Verstöße). Ein Recht auf Auskunft über die Logik automatisierter Entscheidungen
    fehlt.

    '
  inkrafttreten:
    datum: 2025-11-14
    verifiziert: true
    quelle: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2190655&reg=48&lang=2
  anwendungsdaten:
  - datum: 2025-11-14
    was_gilt: Einleitungsvorschriften, Errichtung des Data Protection Board, Änderungen des RTI Act 2005
      und des TRAI Act 1997.
    verifiziert: false
    quelle: https://www.amsshardul.com/insight/enforcement-of-the-dpdp-act-and-notification-of-the-dpdp-rules/
  - datum: 2026-11-14
    was_gilt: Registrierung der Consent Manager; Untersuchungs- und Sanktionsbefugnis des Board gegenüber
      Consent Managern.
    verifiziert: false
    quelle: https://www.amsshardul.com/insight/enforcement-of-the-dpdp-act-and-notification-of-the-dpdp-rules/
  - datum: 2027-05-14
    was_gilt: 'Materielle Kernpflichten: Information und Einwilligung, Meldung von Datenschutzverletzungen,
      Sicherheitsmaßnahmen, verifizierte Einwilligung für Kinder und Menschen mit Behinderungen, Pflichten
      der Significant Data Fiduciaries einschließlich der algorithmischen Sorgfaltsprüfung, Rechte der
      betroffenen Personen, Beschränkungen der Auslandsübermittlung, volle Befugnisse des Board.

      '
    verifiziert: false
    quelle: https://www.amsshardul.com/insight/enforcement-of-the-dpdp-act-and-notification-of-the-dpdp-rules/
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - gpai
  regelungsschwerpunkte:
  - 'Algorithmische Sorgfaltsprüfung für Significant Data Fiduciaries: Nachweis, dass die eingesetzten
    technischen Mittel einschließlich algorithmischer Software kein Risiko für die Rechte der betroffenen
    Personen begründen. Das ist die einzige KI-spezifische Pflicht des indischen Datenschutzrechts — und
    sie ist in den Regeln 2025 weiter gefasst als im Entwurf.'
  - 'KEINE Interessenabwägung: Ohne Einwilligung und ohne einschlägigen ''legitimate use'' gibt es keine
    Rechtsgrundlage. Für Trainingsdaten aus Bestandsdaten ist das strenger als Art. 6 Abs. 1 lit. f DSGVO
    — es gibt keine Auffanggrundlage.'
  - Keine besonderen Datenkategorien und kein Recht auf Auskunft über die Logik automatisierter Verarbeitung.
    Wer ein Art.-22-DSGVO-Äquivalent sucht, findet keines.
  - 'Kinderdaten: verifizierte elterliche Einwilligung; die Regeln lassen virtuelle Alters- und Identitätstoken
    zugelassener Aussteller zu. Verbot von Tracking und zielgerichteter Werbung — praktisch ein Verbot
    personalisierter Empfehlungssysteme für Minderjährige.'
  - 'Rechtsschutz: Data Protection Board, Beschwerde online, Berufung zum TDSAT (Telecom Disputes Settlement
    and Appellate Tribunal). Kein privates Klagerecht.'
  - 'Übergangsfrist von 18 Monaten: Wer heute plant, hat bis zum 14.05.2027 Zeit — die längste Umsetzungsfrist
    eines großen Datenschutzgesetzes seit der DSGVO.'
