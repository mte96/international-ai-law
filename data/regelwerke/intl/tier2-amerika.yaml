- id: uk-enterprise-act-2002
  jurisdiktion: uk
  kurztitel: Enterprise Act 2002 — Fusionskontrolle
  offizieller_titel: Enterprise Act 2002
  fundstelle: 2002 c. 40
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Für KI ist es das Instrument, mit dem die Competition and Markets Authority
    die Partnerschaften zwischen Basismodellanbietern und Cloud-Konzernen geprüft hat — zuletzt am 05.03.2025
    mit dem Ergebnis, dass die Beziehung zwischen Microsoft und OpenAI keine "relevant merger situation"
    begründet.

    '
  kurzbeschreibung: 'Part 3 des Enterprise Act regelt die britische Fusionskontrolle. Maßgeblich sind
    ss. 22 und 23 (relevant merger situation, Umsatz- und Anteilsschwellen), s. 26 (Erlangung von Kontrolle,
    einschließlich der Stufe des "material influence" — der niedrigsten Kontrollstufe, die es im europäischen
    Recht so nicht gibt) und s. 29 (sukzessiver Erwerb). Die CMA kann Zusammenschlüsse auch ohne Anmeldung
    aufgreifen; das britische System ist freiwillig, aber mit Aufgreifermessen. Für KI hat das zur Folge,
    dass Minderheitsbeteiligungen, exklusive Rechenkapazitätsverträge und Gewinnbeteiligungen an Modellanbietern
    geprüft werden können, ohne dass eine Mehrheit erworben wird.

    '
  inkrafttreten:
    datum: 2003-06-20
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/2003/1397/article/2/made
    fundstelle_norm: 'Art. 2(1) der Enterprise Act 2002 (Commencement No. 3, Transitional and Transitory
      Provisions and Savings) Order 2003, SI 2003/1397: "the 20th June 2003 is the appointed day for the
      coming into force of the provisions of the Act listed in the first column of the Schedule" — darunter
      Part 3 (Fusionskontrolle).'
  anwendungsdaten:
  - datum: 2025-03-05
    was_gilt: 'CMA: Die Partnerschaft Microsoft/OpenAI begründet keine relevant merger situation; ein
      material influence Microsofts wurde nach den Änderungen seit November 2023 verneint.

      '
    verifiziert: false
    quelle: https://www.legislation.gov.uk/ukpga/2002/40/contents
  themenachsen:
  - wettbewerb
  - gpai
  - marktzugang
  regelungsschwerpunkte:
  - 's. 26 ''material influence'': die niedrigste Kontrollschwelle des britischen Rechts. Sie erlaubt
    es der CMA, Beteiligungen weit unterhalb der europäischen Kontrollschwelle zu prüfen — das Instrument,
    mit dem die KI-Partnerschaften überhaupt aufgegriffen werden konnten.'
  - 'Freiwilliges Anmeldesystem mit Aufgreifermessen: Es gibt keine Anmeldepflicht, aber die CMA kann
    bis vier Monate nach Vollzug eingreifen. Für KI-Beteiligungen bedeutet das dauerhafte Unsicherheit
    ohne freiwillige Vorabklärung.'
  - 'Bedeutung des Ergebnisses von 2025: Die Prüfungen der KI-Partnerschaften sind europaweit ohne Untersagung
    geblieben. Der Befund ist nicht, dass die Fusionskontrolle KI nicht erfasst, sondern dass die geprüften
    Strukturen bewusst unterhalb der Kontrollschwelle gestaltet wurden.'
  - Ergänzend gilt seit 2024 das Digital Markets, Competition and Consumers Act 2024-Regime mit dem SMS-Status
    — für KI derzeit noch ohne benannten Adressaten.
  dokumente:
  - datum: 2002-11-07
    typ: konsolidiert
    titel: Enterprise Act 2002 (2002 c. 40)
    url: https://www.legislation.gov.uk/ukpga/2002/40/contents
    sprache: en
    urheber: The National Archives
    verifiziert: false
    notiz: Amtliche konsolidierte Fassung;
  bedeutung_eu_anbieter: 'Wer Kapital von einem Cloud- oder Plattformkonzern aufnimmt oder exklusive Rechenkapazität
    einkauft, sollte die britische Aufgreifschwelle im Blick behalten: "material influence" liegt deutlich
    unter der Kontrolle im Sinne der FKVO. Eine Struktur, die in Brüssel nicht anmeldepflichtig ist, kann
    in London geprüft werden.

    '
  offene_punkte:
  - Ob die CMA einen KI-Anbieter mit SMS-Status nach dem DMCCA 2024 benennt.
  monitoring_quellen:
  - https://www.gov.uk/government/organisations/competition-and-markets-authority
  bezug_regelwerke:
  - uk-sektorregulierer-ki
  - uk-ai-opportunities-action-plan
