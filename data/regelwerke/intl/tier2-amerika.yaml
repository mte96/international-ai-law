  kurztitel: Brasilianisches Urheberrechtsgesetz (LDA)
  offizieller_titel: Lei de Direitos Autorais — Lei nº 9.610, de 19 de fevereiro de 1998
  originaltitel: Lei nº 9.610/1998
  fundstelle: Lei nº 9.610/1998
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Unverändert und ohne KI-Bezug. Es gibt keine Text- und Data-Mining-Schranke; der Schrankenkatalog
    des Art. 46 ist abschließend und eng. Eine Vergütungsregel für die Nutzung geschützter Werke im KI-Training
    ist nur im Entwurf PL 2338/2023 vorgesehen und damit nicht geltendes Recht.

    '
  kurzbeschreibung: 'Das brasilianische Urheberrecht schützt Werke des menschlichen Geistes (Art. 7) und
    weist die Rechte dem Urheber als natürlicher Person zu (Art. 11); eine Urheberschaft von Maschinen
    ist ausgeschlossen. Die Vervielfältigung ist dem Urheber vorbehalten (Art. 29 I). Der Schrankenkatalog
    des Art. 46 nennt abschließend unter anderem Zitat, Berichterstattung, Kopie kleiner Auszüge zum privaten
    Gebrauch und Nutzung in Schulen; eine Forschungs- oder TDM-Schranke fehlt. Das brasilianische Recht
    kennt zudem keine Generalklausel wie fair use oder fair dealing. Daraus folgt: Das Training generativer
    Modelle mit geschützten brasilianischen Werken ist ohne Lizenz nach dem Wortlaut rechtswidrig — eine
    Rechtslage, die strenger ist als in den USA, in Japan und in der EU.

    '
  inkrafttreten:
    datum: 1998-06-20
    verifiziert: true
    quelle: https://www.planalto.gov.br/ccivil_03/leis/l9610.htm
