  bedeutung_eu_anbieter: 'Das Gegenstück zum DSA fehlt in Kanada. Wer dort eine Plattform oder einen Chatbot
    betreibt, unterliegt weder Risikobewertungs- noch Meldepflichten; die einzige Grenze ist das allgemeine
    Straf- und Deliktsrecht. Das ist kurzfristig entlastend und mittelfristig ein Planungsrisiko: Die
    Strategie vom Juni 2026 kündigt Online-Sicherheitsregeln ausdrücklich auch für Chatbots an, und der
    Zuschnitt wird sich an C-63 orientieren.

    '
  offene_punkte:
