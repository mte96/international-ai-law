- id: us-ca-ab-2655
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: AB 2655 — Defending Democracy from Deepfake Deception Act (aufgehoben)
  offizieller_titel: Defending Democracy from Deepfake Deception Act of 2024 (AB 2655)
  fundstelle: Cal. Elections Code §§ 20510 ff. (durch Urteil außer Anwendung)
  verfahrensnummer: AB 2655 (2023-2024 Regular Session)
  status: aufgehoben
  status_detail: 'Am 03.01.2025 einstweilen außer Vollzug gesetzt, am 06.08.2025 vom U.S. District Court
    for the Eastern District of California (Richter John Mendez) für durch 47 U.S.C. § 230 verdrängt erklärt.
    Das Gesetz ist nicht anwendbar.

    '
  kurzbeschreibung: 'AB 2655 hätte große Online-Plattformen verpflichtet, wesentlich täuschende, KI-erzeugte
    politische Inhalte über Kandidaten zu erkennen, zu kennzeichnen oder zu entfernen, Beschwerdewege
    einzurichten und Berichte zu veröffentlichen. Das Gericht hielt diese Pflichten für unvereinbar mit
    § 230: Der Bund verbiete es den Staaten, Plattformen als Herausgeber nutzererzeugter Inhalte zu behandeln,
    und genau das tue eine Entfernungspflicht.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.mediapost.com/publications/article/407997/
  anwendungsdaten:
  - datum: 2025-01-03
    was_gilt: Aussetzung der Vollziehung insgesamt.
    verifiziert: false
    quelle: https://www.techpolicy.press/tracker/kohls-v-bonta/
  - datum: 2025-08-06
    was_gilt: 'Endgültige Entscheidung: Verdrängung durch § 230 CDA.'
    verifiziert: false
    quelle: https://www.mediapost.com/publications/article/407997/
  themenachsen:
  - content
  - haftung
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'WARUM ES GESCHEITERT IST: nicht am First Amendment, sondern an der bundesrechtlichen Verdrängung.
    Eine Löschpflicht für nutzererzeugte Inhalte behandelt die Plattform als Herausgeber — das verbietet
    § 230(c)(1).'
  - 'Die dogmatische Konsequenz ist weitreichend: Solange § 230 gilt, kann KEIN US-Bundesstaat Plattformen
    zur Entfernung KI-erzeugter Falschinhalte verpflichten. Landesrechtliche Deepfake-Regulierung kann
    nur beim Ersteller oder beim Werbetreibenden ansetzen.'
  - 'Das erklärt die Struktur der überlebenden US-Gesetze: Kennzeichnungspflichten für Erzeuger (Kalifornien
    SB 942/AB 853), Persönlichkeitsrechte (Tennessee ELVIS Act), Strafnormen (TAKE IT DOWN Act auf Bundesebene)
    — aber keine Plattformpflichten.'
  - 'Der Kontrast zur EU ist damit strukturell und nicht politisch: Was Art. 34, 35 DSA europäischen Plattformen
    abverlangt, ist in den USA bundesrechtlich versperrt.'
