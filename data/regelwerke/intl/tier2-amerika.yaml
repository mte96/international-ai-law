  - grundrechte
  regelungsschwerpunkte:
  - 'Consent Manager als eigenes reguliertes Institut: eine indische Besonderheit ohne europäische Entsprechung.
    Einwilligungen werden über eine interoperable Plattform verwaltet, die selbst registrierungspflichtig
    ist.'
  - 'Sorgfaltsprüfung algorithmischer Software: gegenüber dem Entwurf erweitert; sie erfasst nicht nur
    Empfehlungssysteme, sondern jede technische Maßnahme.'
  - Virtuelle Alters- und Identitätstoken für die elterliche Einwilligung — ein Verfahren, das die europäische
    Diskussion um Altersverifikation (Art. 28 DSA) vorwegnimmt.
  - Vollständig digitales Verfahren vor dem Data Protection Board mit Portal und App; Berufung zum TDSAT.
