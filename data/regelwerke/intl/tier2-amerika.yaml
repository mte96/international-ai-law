- id: in-patents-act-1970
  jurisdiktion: in
  kurztitel: Patents Act 1970 — indisches Patentgesetz
  offizieller_titel: The Patents Act, 1970
  fundstelle: Act No. 39 of 1970
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Unverändert. Zwei Vorschriften bestimmen die indische Lage zu KI: s. 3(k) schließt mathematische
    Methoden, Geschäftsmethoden, Computerprogramme "per se" und Algorithmen von der Patentierbarkeit aus;
    s. 2(1)(y) definiert den "true and first inventor" — die Rechtsprechung und die Praxis des Patentamts
    verlangen eine natürliche Person. Der indische DABUS-Antrag ist entsprechend zurückgewiesen worden.

    '
  kurzbeschreibung: 'Der Patents Act ist für KI in zwei Richtungen relevant. Erstens der Ausschluss des
    s. 3(k): Softwarebezogene Erfindungen sind nur patentierbar, wenn sie einen technischen Beitrag über
    das Programm als solches hinaus leisten; die Richtlinien für die Prüfung computerbezogener Erfindungen
    (CRI Guidelines, zuletzt 2017) konkretisieren das. Für KI-Modelle als solche ist der Weg damit weitgehend
    versperrt; patentierbar sind konkrete technische Anwendungen. Zweitens die Erfinderschaft: Ein KI-System
    kann nicht Erfinder sein — dieselbe Linie wie im Vereinigten Königreich (Thaler, UKSC 2023), in Australien
    (Thaler, Full Court 2022) und in den USA (Thaler, Fed. Cir. 2022).

    '
  inkrafttreten:
    datum: 1972-04-20
    verifiziert: false
    quelle: https://www.indiacode.nic.in/handle/123456789/1392
  anwendungsdaten: []
  themenachsen:
  - urheberrecht
  - marktzugang
  - gpai
  regelungsschwerpunkte:
  - 's. 3(k): Ausschluss von Algorithmen und Computerprogrammen ''per se''. Der Zusatz ''per se'' ist
    der Ansatzpunkt für die Patentierung technischer Anwendungen; die Auslegung ist restriktiver als beim
    EPA.'
  - 's. 2(1)(y) ''true and first inventor'': natürliche Person erforderlich. Indien hat sich damit der
    internationalen Mehrheitslinie angeschlossen, ohne dies bis 2026 höchstrichterlich zu entscheiden.'
  - 'Praktische Folge: Wer ein KI-Verfahren in Indien schützen will, muss es als technisches Verfahren
    mit konkretem Anwendungsbezug formulieren; Ansprüche auf Modellarchitekturen als solche scheitern
    an s. 3(k).'
  - 'Unterschied zum Urheberrecht: Während s. 2(d)(vi) Copyright Act computergenerierte Werke ausdrücklich
    zuordnet, kennt das Patentrecht keine entsprechende Öffnung. Die indische Rechtsordnung behandelt
    beide Materien also gegenläufig.'
  dokumente:
  - datum: 1970-09-19
    typ: konsolidiert
    titel: The Patents Act, 1970 (Act No. 39 of 1970)
    url: https://www.indiacode.nic.in/handle/123456789/1392
    sprache: en
    urheber: Government of India
    verifiziert: false
    notiz: Amtliche Fundstelle;
  bedeutung_eu_anbieter: 'Für die Schutzrechtsstrategie: Indien ist beim Softwarepatent restriktiver als
    das EPA und beim computergenerierten Werk offener als jede EU-Rechtsordnung. Wer ein KI-Portfolio
    aufbaut, sollte in Indien auf Anwendungsansprüche setzen und den urheberrechtlichen Weg über s. 2(d)(vi)
    Copyright Act nicht übersehen.

    '
  offene_punkte:
  - Ob die CRI Guidelines nach den India AI Governance Guidelines überarbeitet werden.
  - Ob ein indisches Gericht über die Erfinderschaft eines KI-Systems entscheidet.
  - 'Inkrafttreten nicht belegbar: indiacode.nic.in: Sammelseite (handle/123456789/1392), drei PDF-Varianten
    (A1970-39.pdf, AA1970___39.pdf, a1970-39.pdf) und der Einzelparagraphen-Aufruf (show-data?actid=AC_CEN_11_61_00002_197039_...)
    antworten durchgaengig mit 404 bzw. 500 — sowohl ueber WebFetch als auch im Browser. ipindia.gov.in
    (Portal-PDF des Patentgesetzes): 404. egazette.gov.in: nicht erreichbar. Nach zwei Versuchen je Quelle
    abgebrochen. Die uebrigen vier indischen Eintraege liessen sich ueber dieselben India-Code-Bitstreams
    belegen, dieser nicht. Der Wert ist der allgemein zitierte (s. 1(3) delegiert an eine Bekanntmachung
    der Zentralregierung), aber nicht am amtlichen Text gesichert. Empfehlung: erneuter Versuch, wenn
    India Code wieder antwortet; die Bekanntmachung selbst ist im Gazette of India, Extraordinary, Part
    II, sec. 3(ii) zu suchen.'
