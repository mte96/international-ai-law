  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - 'Am amtlichen konsolidierten Text des Planalto geprueft. Der Wert war inhaltlich richtig, lag im Bestand
    aber als Zeichenkette statt als Datum vor und ist nun als Datum gefuehrt. Status ''anwendbar'' bleibt
    richtig; ein KI-spezifischer Straftatbestand fehlt weiterhin. Vorher: ''1942-01-01'' (als Zeichenkette,
    nicht als Datum gefuehrt).'
