  kurztitel: PL 2338/2023 — brasilianisches KI-Rahmengesetz (Entwurf)
  offizieller_titel: 'Projeto de Lei nº 2.338, de 2023 — Dispõe sobre o uso da Inteligência Artificial

    '
  originaltitel: Projeto de Lei nº 2.338/2023 — Marco Legal da Inteligência Artificial
  fundstelle: noch keine — Gesetzentwurf
  verfahrensnummer: PL 2338/2023 (Senat); Câmara dos Deputados, idProposicao 2487262
  status: verfahren
  status_detail: 'NICHT GESETZ GEWORDEN. Vom Senat am 10.12.2024 angenommen, am 17.03.2025 an das Abgeordnetenhaus
    übermittelt, dort am 04.04.2025 verteilt und am 29.04.2025 einem Sonderausschuss zugewiesen (Vorsitz
    Luísa Canziani, Berichterstatter Aguinaldo Ribeiro, benannt am 20.05.2025). Die amtliche Verfahrensdatenbank
    weist am 01.09.2026 als Stand aus: "Aguardando Parecer do(a) Relator(a)" — der Bericht des Berichterstatters
    ist nicht angenommen. 37 Vorlagen sind angehängt. Die für Dezember 2025 vorgesehene Abstimmung wurde
    auf Februar 2026 verschoben, dann auf Mai 2026, dann auf das Jahresende 2026.

    '
  kurzbeschreibung: 'Der vom Senat beschlossene Text folgt der Systematik der KI-VO: Risikostufen mit
    verbotenen Praktiken (übermäßiges Risiko) und einer Liste hochriskanter Anwendungen, Pflichten zu
    Governance, algorithmischer Folgenabschätzung, Transparenz und Kennzeichnung synthetischer Inhalte,
    Rechte der betroffenen Personen (Information, Erklärung, Anfechtung, menschliche Überprüfung), Urheberrechtsvorschriften
    mit Vergütungsanspruch für die Nutzung geschützter Werke im Training, sowie ein Aufsichtssystem (SIA)
    unter Koordination der Datenschutzbehörde ANPD. Vorgesehen sind Bußgelder bis 50 Mio. BRL je Verstoß
    oder 2 % des Umsatzes der Gruppe in Brasilien. Im Abgeordnetenhaus ist der Text seither umgearbeitet
    worden; Kritik richtet sich gegen die Abschwächung des Risikomodells, die faktische Freigabe biometrischer
    Fernidentifizierung für Sicherheitsbehörden, die Streichung arbeitsrechtlicher Mindestgarantien und
    die unzureichende Behandlung des Urheberrechts.

    '
