  - grundrechte
  regelungsschwerpunkte:
  - 'Nota Técnica 12/2025 bündelt die Eingaben der Anhörung: übermäßige Nutzung personenbezogener Daten
    im Training ohne Klarheit über Zweck, Aufbewahrung, Rechtsgrundlage und internationale Übermittlung;
    fehlende Anfechtungs- und Überprüfungswege bei Klassifizierung, Kredit, Einstellung und Verhaltensüberwachung.'
  - Der Sandkasten ist das erste Instrument dieser Art in Lateinamerika und liefert die empirische Grundlage
    der künftigen Regulierung — Brasilien reguliert also erst, nachdem es getestet hat. Art. 57-63 KI-VO
    sehen Reallabore vor, aber erst nach Erlass des Gesetzes.
  - 'Residuale Zuständigkeit im SIA-Modell: Die ANPD reguliert nur, wo keine Sektoraufsicht zuständig
    ist. Das ist die Gegenkonstruktion zur KI-VO, die eine durchgehende Produktregulierung mit sektoraler
    Marktüberwachung verbindet.'
  - 'Bisher keine bindenden KI-Vorschriften: Alles, was die ANPD zu KI erlassen hat, sind technische Noten,
    Studien und Verfahrensdokumente. Sanktioniert wird über die LGPD.'
