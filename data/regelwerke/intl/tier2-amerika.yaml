- id: us-cda-230
  jurisdiktion: us
  kurztitel: Section 230 Communications Decency Act
  offizieller_titel: 'Section 230 of the Communications Act of 1934, eingefügt durch den Communications
    Decency Act als Teil des Telecommunications Act of 1996

    '
  fundstelle: 47 U.S.C. § 230
  verfahrensnummer: Pub. L. 104-104, Title V, § 509
  status: anwendbar
  status_detail: 'Geltendes Recht und das meistdiskutierte Haftungsprivileg des US-Rechts. Für KI ist
    die Lage 2026 im Kern geklärt, ohne dass ein Gericht sie ausdrücklich entschieden hätte: In den großen
    Chatbot-Verfahren — Garcia gegen Character Technologies, Raine gegen OpenAI — haben sich die Beklagten
    NICHT auf § 230 berufen, weil die Ausgaben eines generativen Systems vom Betreiber selbst hervorgebracht
    werden. Zugleich ist § 230 in Kohls gegen Bonta zur Grundlage geworden, mit der ein kalifornisches
    Deepfake-Gesetz gekippt wurde.

    '
  kurzbeschreibung: '§ 230(c)(1) bestimmt, dass Anbieter oder Nutzer eines interaktiven Computerdienstes
    nicht als Herausgeber oder Sprecher von Informationen behandelt werden, die von einem anderen Informationsanbieter
    stammen. § 230(c)(2) schützt gutgläubige Moderationsentscheidungen. § 230(e) nimmt Bundesstrafrecht,
    Immaterialgüterrecht, bestimmte Datenschutzgesetze und seit 2018 Sexhandelstatbestände aus; § 230(f)(3)
    definiert den "information content provider" als denjenigen, der ganz oder teilweise zur Schaffung
    oder Entwicklung der Information beiträgt. An dieser Definition entscheidet sich die KI-Frage: Wer
    den Inhalt selbst erzeugt, ist Inhaltsanbieter und nicht privilegiert.

    '
  inkrafttreten:
    datum: 1996-02-08
    verifiziert: true
    quelle: https://www.congress.gov/bill/104th-congress/senate-bill/652
    fundstelle_norm: '47 U.S.C. § 230 wurde durch sec. 509 des Telecommunications Act of 1996 eingefügt.
      Congress.gov zu S.652, 104. Kongress: "02/08/1996 Became Public Law No: 104-104." Das Gesetz enthält
      für sec. 509 keine abweichende Wirksamkeitsbestimmung, es gilt daher ab Inkraftsetzung am 08.02.1996.'
  anwendungsdaten:
  - datum: 2025-08-06
    was_gilt: 'E.D. Cal. (Richter John Mendez), Kohls gegen Bonta: Das kalifornische AB 2655 ist durch
      § 230 verdrängt, weil es großen Plattformen die Entfernung nutzererzeugter politischer Inhalte vorschreibt.

      '
    verifiziert: false
    quelle: https://www.mediapost.com/publications/article/407997/
  themenachsen:
  - haftung
  - content
  - grundrechte
  - wettbewerb
  regelungsschwerpunkte:
  - Die entscheidende KI-Grenze verläuft zwischen Kuratierung und Erzeugung. Kuratierte, algorithmisch
    verstärkte Fremdinhalte bleiben privilegiert (Patterson gegen Meta); selbst erzeugte Ausgaben nicht.
    Deshalb wird § 230 in den Chatbot-Verfahren gar nicht erst geltend gemacht.
  - 'Produkthaftung als Umgehung: In Garcia gegen Character Technologies hat das Gericht die Einordnung
    als Produkt (statt Dienstleistung) zugelassen und Konstruktionsfehler — fehlende Altersprüfung, fehlende
    Meldewege — für haftungsbegründend gehalten. Produktdesign ist keine Herausgebertätigkeit und deshalb
    nicht privilegiert (so auch State of North Carolina gegen TikTok).'
  - 'Verdrängungswirkung gegenüber Landesrecht: § 230 hat 2025 ein Deepfake-Gesetz eines Bundesstaates
    zu Fall gebracht. Wer Plattformpflichten auf Landesebene schafft, kollidiert mit Bundesrecht — die
    strukturelle Schranke jeder US-Plattformregulierung.'
  - 'Ausnahme Immaterialgüterrecht (§ 230(e)(2)): Urheberrechtsklagen gegen Plattformen sind nicht privilegiert;
    für KI-Trainingsklagen war § 230 deshalb nie relevant.'
  - 'Es gibt kein europäisches Äquivalent: Art. 6 DSA privilegiert Hosting nur bei Unkenntnis und verlangt
    Handeln nach Kenntnis. § 230 privilegiert unabhängig von Kenntnis — der Unterschied wird bei KI-Ausgaben
    bedeutungslos, weil beide Regime den Selbsterzeuger nicht schützen.'
  dokumente:
  - datum: 2023-01-01
    typ: bericht
    titel: Section 230 Immunity and Generative Artificial Intelligence (CRS Legal Sidebar LSB11097)
    url: https://www.congress.gov/crs-product/LSB11097
    sprache: en
    urheber: Congressional Research Service
    verifiziert: false
    notiz: Die maßgebliche amtliche Analyse der Frage. Nicht abrufbar (robots.txt).
