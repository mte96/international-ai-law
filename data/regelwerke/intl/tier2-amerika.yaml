    was_gilt: 'Abschluss der Anhörung zu KI und der Überprüfung automatisierter Entscheidungen (124 Beiträge;
      56 % Privatwirtschaft, 22 % Zivilgesellschaft). Punkt 7 der Regulierungsagenda 2025/26 betrifft
      Art. 20 LGPD. Streitpunkte: Einwilligung oder berechtigtes Interesse als Grundlage für Trainingsdaten,
      Reichweite der menschlichen Überprüfung, Umgang mit Daten schutzbedürftiger Gruppen.

      '
    verifiziert: false
    quelle: https://convergenciadigital.com.br/governo/anpd-avanca-na-regulacao-de-decisoes-automatizadas-por-ia/
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - gpai
  - arbeit
  regelungsschwerpunkte:
  - 'Art. 20: Recht auf ÜBERPRÜFUNG, kein Verbot. Der ursprüngliche § 3, der die Überprüfung durch eine
    natürliche Person vorschrieb, wurde 2019 durch die Lei 13.853 gestrichen (Veto, im Kongress nicht
    aufgehoben). Seither ist ungeklärt, ob eine automatisierte Überprüfung einer automatisierten Entscheidung
    genügt — die praktisch folgenreichste Lücke des brasilianischen Rechts und der Kernunterschied zu
    Art. 22 Abs. 3 DSGVO.'
  - 'Art. 20 § 1: Auskunft über Kriterien und Verfahren, begrenzt durch Geschäfts- und Betriebsgeheimnisse.
    Diese Schranke ist weiter formuliert als in Erwägungsgrund 63 DSGVO und wird von Verantwortlichen
    entsprechend genutzt.'
  - 'Art. 20 § 2: Prüfbefugnis der ANPD auf diskriminierende Aspekte, wenn die Auskunft unter Berufung
    auf Geheimnisschutz verweigert wird — der Ausgleichsmechanismus zu § 1.'
  - Art. 7 IX (berechtigtes Interesse) ist die praktisch einzige tragfähige Grundlage für Modelltraining
    mit vorhandenen Datenbeständen; die ANPD hat sie im Meta-Verfahren 2024 beanstandet und erwägt ausweislich
    der Fachpresse, sie unter Auflagen zuzulassen.
  - Art. 33 (internationale Übermittlung) und die Übermittlungsverordnung von 2024 sind für Cloud-gestützte
    Modellnutzung relevant; die ANPD hat Standardvertragsklauseln nach europäischem Vorbild erlassen.
  - 'Sanktionsniveau: bis 2 % des brasilianischen Gruppenumsatzes, höchstens 50 Mio. BRL je Verstoß —
    deutlich unter dem DSGVO-Rahmen, aber der schärfste brasilianische Hebel gegen KI-Datenverarbeitung.'
