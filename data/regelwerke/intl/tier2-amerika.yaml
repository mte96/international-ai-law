- id: ca-osfi-e23
  jurisdiktion: ca
  kurztitel: OSFI Guideline E-23 — Modellrisikomanagement
  offizieller_titel: Guideline E-23 — Model Risk Management (2027)
  fundstelle: OSFI Guideline E-23, Fassung vom 11.09.2025
  verfahrensnummer: null
  status: verabschiedet
  status_detail: 'Endfassung am 11.09.2025 veröffentlicht, anwendbar ab dem 01.05.2027. Sie löst die Fassung
    von 2017 ab, die nur auf Eigenmittelmodelle großer Banken zielte, und erstreckt das Modellrisikomanagement
    erstmals ausdrücklich auf KI- und ML-Modelle sowie auf alle bundesregulierten Finanzinstitute.

    '
  kurzbeschreibung: 'E-23 gilt für alle bundesregulierten Finanzinstitute — Banken, Zweigstellen ausländischer
    Banken, Lebens-, Sach- und Haftpflichtversicherer, Treuhand- und Kreditgesellschaften. Sie verlangt
    eine dokumentierte Steuerung des gesamten Modelllebenszyklus (Entwurf, Prüfung, Freigabe, Einsatz,
    Überwachung, Außerbetriebnahme), eine Risikoeinstufung jedes Modells nach quantitativen (Portfoliogröße,
    finanzielle Wirkung) und qualitativen Kriterien (Komplexität, Datenqualität, Regulierungsrisiko),
    ein zentrales Modellinventar für alle Modelle mit nicht unerheblichem Risiko sowie Rollen, Ausstattung
    und Berichtswege bis zum Verwaltungsrat. KI/ML-Modelle sind ausdrücklich erfasst, mit besonderem Augenmerk
    auf Transparenz, Verzerrungsrisiken und autonome Entscheidungsfähigkeit. Alles gilt verhältnismäßig
    zu Größe, Strategie, Risikoprofil und Komplexität des Instituts.

    '
  inkrafttreten:
    datum: 2027-05-01
    verifiziert: true
    quelle: https://www.osfi-bsif.gc.ca/en/guidance/guidance-library/guideline-e-23-model-risk-management-2027
  anwendungsdaten:
  - datum: 2027-05-01
    was_gilt: Vollständige Anwendung auf alle bundesregulierten Finanzinstitute und alle Modelltypen einschließlich
      KI/ML.
    verifiziert: true
    quelle: https://www.osfi-bsif.gc.ca/en/guidance/guidance-library/guideline-e-23-model-risk-management-2027
  themenachsen:
  - sektor-finanz
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Technologieneutraler Modellbegriff: Erfasst wird jede quantitative Methode, die Eingaben in Schätzungen
    überführt — vom Regressionsmodell bis zum Sprachmodell. Damit fällt der Einsatz eines Fremdmodells
    (Drittanbieter-LLM) unter dieselbe Governance wie ein Eigenmodell.'
  - 'Modellinventar: zentrale, laufend fortgeschriebene Aufstellung aller Modelle mit nicht unerheblichem
    Risiko. Das ist praktisch das Gegenstück zum Register nach Art. 49 KI-VO — nur unternehmensintern
    statt behördlich.'
  - 'Risikoeinstufung als Steuerungsgröße: Alle Pflichten skalieren mit der Einstufung. Anders als die
    KI-VO gibt es keine feste Hochrisikoliste; die Einstufung ist Sache des Instituts und wird aufsichtlich
    überprüft.'
  - 'Ausdrückliche Nennung KI/ML-spezifischer Faktoren: Transparenz, Verzerrung, autonome Entscheidungen.
    OSFI hat damit als eine der ersten Finanzaufsichten weltweit KI-Modelle nicht separat, sondern als
    Teil des Modellrisikorahmens geregelt.'
  - 'Verhältnismäßigkeit: proportional zu Größe, Strategie, Risikoprofil, Art, Umfang und Komplexität.
    Kleine Institute können ein schlankes Verfahren fahren; die Pflicht selbst entfällt nicht.'
  - 'Vorlauf: 20 Monate zwischen Veröffentlichung und Anwendung — bewusst gewählt, weil das Inventar und
    die Lebenszyklusdokumentation für die meisten Institute Neuland sind.'
