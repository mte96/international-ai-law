- id: ca-copyright-act
  jurisdiktion: ca
  kurztitel: Copyright Act — kanadisches Urheberrechtsgesetz
  offizieller_titel: Copyright Act / Loi sur le droit d'auteur
  fundstelle: R.S.C. 1985, c. C-42
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Unverändert in Bezug auf KI. Die Konsultation "Copyright in the Age of Generative Artificial
    Intelligence" lief vom 12.10.2023 bis 15.01.2024; die Regierung hat am 08.05.2025 einen Bericht über
    die Eingaben vorgelegt, aber KEINE Entscheidung getroffen — weder zu einer Text- und Data-Mining-Schranke
    noch zur Urheberschaft an KI-Ausgaben. Die Rechtslage wird deshalb derzeit vor Gericht geklärt, insbesondere
    im Verfahren kanadischer Nachrichtenverlage gegen OpenAI vor dem Ontario Superior Court of Justice.

    '
  kurzbeschreibung: 'Das kanadische Urheberrecht kennt keine TDM-Schranke. Die Vervielfältigung geschützter
    Werke zum Training ist deshalb grundsätzlich zustimmungspflichtig, soweit nicht "fair dealing" nach
    s. 29 (Forschung, private Studien, Bildung, Parodie, Satire) oder eine der weiteren Schranken eingreift
    — der kanadische fair dealing ist im Unterschied zum US-amerikanischen fair use an einen geschlossenen
    Zweckkatalog gebunden, was die Berufung darauf für kommerzielles Modelltraining erschwert. Für die
    Urheberschaft gilt nach der Konsultation der Konsens, dass menschliche Urheberschaft Voraussetzung
    des Schutzes bleibt; eine gesetzliche Klarstellung fehlt. Die Registrierung eines KI-Miturhebers durch
    das kanadische Urheberamt (Fall Suryast, 2021) beruhte auf einer reinen Formalprüfung ohne materielle
    Aussage.

    '
  inkrafttreten:
    datum: 1924-01-01
    verifiziert: false
    quelle: https://digitalcommons.osgoode.yorku.ca/cgi/viewcontent.cgi?article=1654&context=scholarly_works
    fundstelle_norm: 'Copyright Act, S.C. 1921, c. 24, durch Proklamation in Kraft gesetzt am 01.01.1924
      (''It came into force on January 1, 1924''). Heutige Fassung R.S.C. 1985, c. C-42. Canadian Heritage
      bestaetigt: ''The Canadian Copyright Act came into force in 1924'''
  anwendungsdaten:
  - datum: 2024-01-15
    was_gilt: Ende der Konsultation zu Urheberrecht und generativer KI; rund 1.000 Einzeleingaben, 103
      Stellungnahmen von Organisationen und Sachverständigen, 62 Beteiligte in sieben Runden Tischen.
    verifiziert: false
    quelle: https://cassels.com/insights/update-from-the-government-of-canada-on-issues-of-copyright-in-the-age-of-generative-artificial-intelligence/
  - datum: 2025-05-08
    was_gilt: 'Bericht der Regierung über die Konsultation. Ergebnis: geteilte Auffassungen zu TDM, Prüfung
      von Optionen "to bring more clarity into the marketplace" zugesagt, aber keine Festlegung; keine
      Änderung zur Urheberschaft; keine Zeitschiene.

      '
    verifiziert: false
    quelle: https://cassels.com/insights/update-from-the-government-of-canada-on-issues-of-copyright-in-the-age-of-generative-artificial-intelligence/
  themenachsen:
  - urheberrecht
  - gpai
  - content
  regelungsschwerpunkte:
  - Keine TDM-Schranke, geschlossener Zweckkatalog beim fair dealing (s. 29 ff.) — Kanada ist damit für
    Trainingszwecke restriktiver als die USA (offener fair use) und als die EU (Art. 3, 4 DSM-RL mit Opt-out).
  - s. 3 (Vervielfältigungsrecht) ist der Anknüpfungspunkt für den Trainingsvorgang; s. 27 regelt die
    mittelbare Verletzung.
  - 'Urheberschaft: keine ausdrückliche Regelung für computergenerierte Werke — anders als s. 9(3) CDPA
    1988 (UK) oder s. 2(d)(vi) Copyright Act 1957 (Indien). Der Konsultationsbericht hält an der menschlichen
    Urheberschaft fest, ohne sie gesetzlich zu verankern.'
  - 'Der Stillstand hat einen Grund: Die Konsultation zeigte eine unauflösbare Front zwischen Kreativwirtschaft
    (Zustimmung und Vergütung) und Technologiesektor (Klarstellung, dass TDM nicht verletzt). Ohne politische
    Entscheidung bleibt es beim Gericht.'
  - 'Praktische Folge: Wer in Kanada trainiert, hat keine Schrankenregelung, auf die er sich verlassen
    kann; wer kanadische Werke im Ausland verwertet, muss die Zuständigkeitsfrage klären — der Ontario
    Superior Court hat sie im Verfahren gegen OpenAI zu entscheiden.'
