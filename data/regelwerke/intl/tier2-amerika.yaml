- id: ca-federal-courts-act
  jurisdiktion: ca
  kurztitel: Federal Courts Act — gerichtliche Kontrolle von Bundesverwaltungsakten
  offizieller_titel: Federal Courts Act
  fundstelle: R.S.C. 1985, c. F-7
  status: anwendbar
  status_detail: In Kraft. s. 18.1 wurde 1990 eingefügt und ist die Verfahrensgrundlage jeder gerichtlichen
    Kontrolle einer Bundesbehörde — und damit aller kanadischen Verfahren über algorithmisch vorbereitete
    Verwaltungsentscheidungen.
  kurzbeschreibung: 'Der Federal Courts Act regelt Zuständigkeit und Verfahren des Federal Court und des
    Federal Court of Appeal. Für die KI-Rechtsprechung ist s. 18.1 entscheidend: Abs. 1 die Antragsbefugnis,
    Abs. 2 die 30-Tage-Frist, Abs. 3 die Entscheidungsbefugnisse und Abs. 4 der Katalog der Aufhebungsgründe
    — Zuständigkeitsüberschreitung, Verletzung der Verfahrensfairness, Rechtsfehler, willkürliche Tatsachenfeststellung,
    Betrug und jedes sonstige rechtswidrige Handeln. Über diese Norm sind die Chinook-Entscheidungen (Haghshenas,
    Raja, Safarian, Khosravi) ergangen; der inhaltliche Prüfungsmaßstab folgt aus Canada (Minister of
    Citizenship and Immigration) v Vavilov, 2019 SCC 65.'
  inkrafttreten:
    datum: 1971-06-01
    verifiziert: false
    quelle: https://en.wikipedia.org/wiki/Federal_Court_of_Canada
    fundstelle_norm: Federal Court Act, S.C. 1970-71-72, c. 1 — in Kraft getreten am 01.06.1971; mit diesem
      Tag wurde der Exchequer Court als Federal Court of Canada fortgefuehrt. Heutige Fassung Federal
      Courts Act, R.S.C. 1985, c. F-7
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 's. 18.1(4)(b): Verletzung der Verfahrensfairness. Der Vorwurf, ein algorithmisches Vorsortierungswerkzeug
    entziehe der betroffenen Person die Möglichkeit, zu den entscheidungserheblichen Punkten gehört zu
    werden, wird hier geprüft — und ist in allen vier Chinook-Verfahren gescheitert, weil die Antragsteller
    den Einfluss des Werkzeugs nicht belegen konnten.'
  - 's. 18.1(4)(c) und (d): Rechtsfehler und willkürliche Tatsachenfeststellung. Über diese Buchstaben
    läuft die Begründungskontrolle, wenn Bescheide aus standardisierten Textbausteinen bestehen (Safarian).'
  - 'Die Beweislast liegt beim Antragsteller. Das ist der praktische Kern der kanadischen Chinook-Rechtsprechung:
    Ohne Offenlegung der Werkzeugarchitektur lässt sich der Einfluss nicht darlegen, und ohne Darlegung
    greift kein Aufhebungsgrund.'
