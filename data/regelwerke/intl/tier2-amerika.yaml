- id: in-ki-gesetz-status
  jurisdiktion: in
  kurztitel: Indisches KI-Gesetz — Stand und Ausschussempfehlungen
  offizieller_titel: 'Digital India Act (angekündigt, nicht eingebracht) und Bericht Nr. 18 des Standing
    Committee on Communications and Information Technology, "Impact of Emergence of Artificial Intelligence
    and Related Issues"

    '
  fundstelle: kein Gesetzentwurf; Ausschussbericht vom 02.04.2026
  verfahrensnummer: null
  status: idee
  status_detail: 'Es gibt in Indien KEINEN KI-Gesetzentwurf. Der seit 2023 angekündigte Digital India
    Act, der den IT Act 2000 ablösen soll, ist "under formulation" ohne Zeitplan. Der Parlamentsausschuss
    für Kommunikation und Informationstechnologie hat am 02.04.2026 in seinem 18. Bericht empfohlen, die
    Machbarkeit eines umfassenden KI-Gesetzes zu prüfen — ausdrücklich gegen die Position von MeitY, die
    bestehenden Gesetze reichten aus.

    '
  kurzbeschreibung: 'Die indische Regierung vertritt seit den India AI Governance Guidelines vom 05.11.2025
    offiziell, dass DPDP Act 2023, IT Rules 2021 sowie Straf-, Verbraucher- und Urheberrecht die Risiken
    der KI hinreichend erfassen und nur gezielte Änderungen nötig sind. Der Parlamentsausschuss hat dem
    im April 2026 widersprochen und zusätzlich altersbezogene Beschränkungen für soziale Netzwerke zum
    Schutz Minderjähriger angeregt. Ein Regierungsentwurf existiert nicht; der Digital India Act, der
    Intermediärshaftung, Nutzerrechte und neue Techniken neu ordnen soll, ist seit drei Jahren angekündigt.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.medianama.com/2026/04/223-parliamentary-committee-calls-comprehensive-ai-law-age-based-restrictions-social-media-platforms/
  anwendungsdaten:
  - datum: 2026-04-02
    was_gilt: 'Bericht Nr. 18 des Standing Committee on Communications and Information Technology: Empfehlung,
      ein umfassendes KI-Gesetz zu prüfen; Kritik an der Beschränkung auf bestehende Deepfake-Löschregeln;
      Anregung altersbezogener Beschränkungen für soziale Netzwerke.

      '
    verifiziert: false
    quelle: https://www.medianama.com/2026/04/223-parliamentary-committee-calls-comprehensive-ai-law-age-based-restrictions-social-media-platforms/
  themenachsen:
  - governance
  - marktzugang
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Der Konflikt ist institutionell, nicht inhaltlich: MeitY will Flexibilität und Standortvorteile,
    der Parlamentsausschuss will Rechtssicherheit. Da Ausschussberichte nicht binden, bleibt es bei der
    Regierungsposition.'
  - 'Digital India Act: seit 2023 angekündigt als Nachfolger des IT Act 2000. Er soll Intermediärshaftung
    neu ordnen und moderne Techniken erfassen. Ohne Entwurf und ohne Zeitplan.'
  - 'Faktische Regulierung erfolgt derweil untergesetzlich: IT-Änderungsregeln 2026, DPDP Rules 2025,
    Advisories. Das indische Modell ist Verordnungsrecht statt Parlamentsgesetz — schnell, anpassbar und
    ohne parlamentarische Kontrolle.'
  - 'Für die Vergleichung wichtig: Indien ist die einzige der drei hier behandelten Rechtsordnungen, in
    der das Fehlen eines KI-Gesetzes eine bewusste politische Entscheidung ist und kein Verfahrensunfall.'
  dokumente:
  - datum: 2026-04-02
    typ: ausschussbericht
    titel: Parliamentary panel calls for comprehensive AI law
    url: https://www.medianama.com/2026/04/223-parliamentary-committee-calls-comprehensive-ai-law-age-based-restrictions-social-media-platforms/
    sprache: en
    urheber: MediaNama
    verifiziert: false
    notiz: Auswertung des 18. Berichts; Quelle für Titel, Datum, Empfehlungen und den Gegensatz zur MeitY-Position.
  bedeutung_eu_anbieter: 'Wer auf ein indisches KI-Gesetz wartet, wartet vergeblich. Die Pflichten kommen
    aus Verordnungen, die binnen Wochen erlassen werden können — wie die IT-Änderungsregeln 2026 mit zehn
    Tagen Umsetzungsfrist gezeigt haben. Das ist das eigentliche indische Risiko: nicht die Strenge der
    Regeln, sondern ihre Geschwindigkeit.

    '
  offene_punkte:
  - Ob der Digital India Act 2026/27 eingebracht wird.
  - Ob die Regierung auf den Ausschussbericht förmlich antwortet.
