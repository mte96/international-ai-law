  bedeutung_eu_anbieter: 'Praktisch keine unmittelbare — es gibt nichts zu befolgen. Mittelbar aber erheblich:
    Wer 2023/24 kanadische Compliance nach AIDA aufgebaut hat, hat auf Sand gebaut. Für Kanada gilt bis
    auf Weiteres das allgemeine Recht: Datenschutz (PIPEDA, Quebec, Alberta, BC), Verbraucher- und Wettbewerbsrecht,
    Produkthaftung, sektorale Aufsicht (OSFI, Health Canada) und für Behördengeschäft die Directive on
    Automated Decision-Making. Wer in Kanada ein KI-Produkt anbietet, prüft daher zuerst, ob personenbezogene
    Daten im Spiel sind und ob der Kunde eine Bundesbehörde ist — nicht, ob das System "hochwirksam" ist.

    '
  offene_punkte:
  - 'Ob ein KI-Gesetz überhaupt wiederkommt: Die Strategie ''AI for All'' vom 04.06.2026 verspricht nur
    die Modernisierung bestehender Rahmen, keine horizontale KI-Regulierung.'
  - Ob Teile von AIDA in sektorale Gesetzgebung wandern (Online-Sicherheit für Chatbots wird in der Strategie
    ausdrücklich angekündigt).
