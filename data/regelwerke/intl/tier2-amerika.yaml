  bedeutung_eu_anbieter: 'Kanada ist für Trainingszwecke KEIN sicherer Hafen. Wer sich in Europa auf Art.
    4 DSM-RL stützt und den Opt-out beachtet, hat in Kanada keine entsprechende Grundlage; fair dealing
    nach s. 29 trägt kommerzielles Training nach herrschender Auffassung nicht. Wer kanadische Inhalte
    nutzt, sollte lizenzieren oder ausschließen. Für die Beobachtung wichtig: Kanada ist eine der wenigen
    Rechtsordnungen, in denen die Politik ausdrücklich offengelassen hat, welchen Weg sie geht — das Ergebnis
    der laufenden Verfahren wird die Antwort vorwegnehmen.

    '
  offene_punkte:
  - Ob die Regierung eine TDM-Schranke, ein Lizenzmodell oder gar nichts vorschlägt.
  - Ausgang des Verfahrens kanadischer Nachrichtenverlage gegen OpenAI (Zuständigkeitsentscheidung vom
    07.11.2025).
