  pruefvermerk:
  - 'Bestaetigt. Das Erlassjahr 1921 und das Inkrafttretensjahr 1924 fallen auseinander; eingetragen ist
    richtig das Inkrafttreten. In Bezug auf KI ist das Gesetz unveraendert: Die Konsultation ''Copyright
    in the Age of Generative Artificial Intelligence'' (12.10.2023 bis 15.01.2024) hat mit dem Bericht
    vom 08.05.2025 zu keiner Gesetzesaenderung gefuehrt.'
- id: ca-caisi
