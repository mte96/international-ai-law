  bedeutung_eu_anbieter: 'Wer in Brasilien nutzergenerierte oder KI-erzeugte Inhalte verbreitet, kann
    sich seit Juni 2025 nicht mehr auf den Richtervorbehalt zurückziehen. Praktisch braucht man dasselbe,
    was der DSA verlangt: einen erreichbaren Meldeweg, dokumentierte Bearbeitungsfristen, eine Risikobetrachtung
    für die schweren Deliktskategorien und besondere Vorsicht bei bezahlter Werbung und algorithmischer
    Verstärkung — dort gilt eine Verschuldensvermutung. Wer DSA-Prozesse betreibt, kann sie übertragen;
    die brasilianischen Kategorien sind enger und strafrechtlich definiert.

    '
  offene_punkte:
  - Ob der Kongress das Haftungsregime gesetzlich neu fasst.
  - Ob KI-erzeugte Inhalte eigens geregelt werden (PL 2338 sieht Kennzeichnung vor, keine Haftungsregel).
