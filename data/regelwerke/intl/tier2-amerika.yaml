  bedeutung_eu_anbieter: 'Für Anbieter generativer Bildmodelle ein Haftungsrisiko auf der Nutzerseite,
    nicht auf der Anbieterseite: Kanada bestraft die Verbreitung, nicht das Werkzeug. Wer Bildgenerierung
    in Kanada anbietet, sollte gleichwohl Schutzmechanismen gegen die Erzeugung intimer Darstellungen
    identifizierbarer Personen vorsehen — nicht wegen C-16, sondern weil die angekündigten Online-Sicherheitsregeln
    dort ansetzen werden und weil Art. 50 KI-VO und der GPAI-Verhaltenskodex ohnehin Missbrauchsminderung
    verlangen.

    '
