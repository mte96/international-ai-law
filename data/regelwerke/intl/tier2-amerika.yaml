- id: ca-quebec-law-25
  jurisdiktion: ca
  kurztitel: Québec Loi 25 — Datenschutz im Privatsektor
  offizieller_titel: 'Loi sur la protection des renseignements personnels dans le secteur privé (RLRQ
    c. P-39.1), geändert durch die Loi 25 (Loi modernisant des dispositions législatives en matière de
    protection des renseignements personnels, L.Q. 2021, c. 25)

    '
  originaltitel: Loi sur la protection des renseignements personnels dans le secteur privé
  fundstelle: RLRQ c. P-39.1; Änderungsgesetz L.Q. 2021, c. 25
  verfahrensnummer: Projet de loi n° 64 (2021)
  status: anwendbar
  status_detail: 'Vollständig in Kraft. Die für KI entscheidende Vorschrift, Art. 12.1 zu ausschließlich
    automatisierten Entscheidungen, gilt seit dem 22.09.2023 (L.Q. 2021, c. 25, Art. 110). Quebec hat
    damit die strengste und zugleich die einzige kanadische Vorschrift, die automatisierte Entscheidungen
    unmittelbar adressiert.

    '
  kurzbeschreibung: 'Wer ein Unternehmen betreibt und personenbezogene Daten verwendet, um eine Entscheidung
    ausschließlich auf der Grundlage einer automatisierten Verarbeitung zu treffen, muss die betroffene
    Person spätestens bei Mitteilung der Entscheidung darüber unterrichten. Auf Verlangen sind ihr die
    verwendeten personenbezogenen Daten, die Gründe und die maßgeblichen Faktoren und Parameter der Entscheidung
    mitzuteilen; sie kann die Berichtigung der verwendeten Daten verlangen und muss Gelegenheit erhalten,
    gegenüber einer Person, die die Entscheidung überprüfen kann, Bemerkungen anzubringen. Durchgesetzt
    wird das von der Commission d''accès à l''information mit Verwaltungsgeldbußen bis 10 Mio. CAD oder
    2 % des weltweiten Umsatzes und Strafen bis 25 Mio. CAD oder 4 %, dazu ein privates Klagerecht mit
    Mindestschadensersatz bei vorsätzlichen oder grob fahrlässigen Verstößen.

    '
  inkrafttreten:
    datum: 2023-09-22
    verifiziert: true
    quelle: https://www.legisquebec.gouv.qc.ca/en/document/cs/P-39.1?langCont=en
