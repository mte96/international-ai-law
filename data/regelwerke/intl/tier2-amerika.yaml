    url: https://www.ag.ky.gov/about/Office-Divisions/ODP/KCDPA/Pages/default.aspx
    sprache: en
    urheber: Kentucky Attorney General
    verifiziert: false
    notiz: Amtliche Verbraucherinformation der Durchsetzungsbehörde.
  bedeutung_eu_anbieter: 'Wenig eigenständiger Aufwand: Wer die Anforderungen Virginias, Colorados oder
    Connecticuts erfüllt, erfüllt auch Kentucky. Der einzige praktische Punkt ist die Aufnahme Kentuckys
    in die Opt-out-Mechanik und in die Liste der Staaten, für die Folgenabschätzungen vorzuhalten sind.

    '
  offene_punkte:
