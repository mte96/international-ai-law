- id: ca-irpa
  jurisdiktion: ca
  kurztitel: IRPA — kanadisches Einwanderungsgesetz
  offizieller_titel: Immigration and Refugee Protection Act
  fundstelle: S.C. 2001, c. 27
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Das Gesetz enthält KEINE Vorschrift über automatisierte Entscheidungen;
    es ermächtigt in s. 10.2(3) lediglich dazu, ministerielle Anweisungen "mittels eines elektronischen
    Systems" auszuführen. Die gesamte kanadische Rechtsprechung zu KI-gestützten Verwaltungsentscheidungen
    — Haghshenas, Raja, Safarian, Khosravi — ist deshalb ungeschriebenes Verwaltungsrecht auf der Grundlage
    von Vavilov und der Verfahrensfairness, nicht Anwendung einer KI-Norm.

    '
  kurzbeschreibung: 'IRPA regelt Einreise, Aufenthalt und Schutzgewährung. Für den KI-Bezug sind vier
    Punkte maßgeblich: s. 11(1) (Visumerteilung durch einen Beamten, wenn dieser überzeugt ist), s. 10.1
    und 10.2 (elektronisches Interessenbekundungssystem, elektronische Umsetzung ministerieller Anweisungen),
    s. 87.3 (Anweisungen des Ministers zur Bearbeitung von Anträgen) und s. 72 (gerichtliche Überprüfung
    durch den Federal Court mit Zulassung). IRCC setzt darauf gestützt Vorsortierungs- und Analysewerkzeuge
    ein: Advanced-Analytics-Modelle für Besuchervisa und Ehegattenanträge, das Integrity Trends Analysis
    Tool, ein Entscheidungsunterstützungswerkzeug für IEC-Arbeitserlaubnisse und den internen Chatbot
    "IRCC Assistant". Nach eigener Darstellung kann kein System einen Antrag ablehnen oder eine Ablehnung
    empfehlen; Ablehnungen treffen ausschließlich geschulte Beamte.

    '
  inkrafttreten:
    datum: 2002-06-28
    verifiziert: true
    quelle: https://laws-lois.justice.gc.ca/eng/acts/i-2.5/page-24.html
    fundstelle_norm: 'Immigration and Refugee Protection Act, S.C. 2001, c. 27, sec. 275 (Coming into
      force: "on a day to be fixed by order of the Governor in Council"). Die amtlichen Fußnoten nennen
      SI/2001-119 (06.12.2001), SI/2002-97 (28.06.2002) und SI/2012-94 (15.12.2012); der Hauptteil des
      Gesetzes trat am 28.06.2002 in Kraft.'
  anwendungsdaten:
  - datum: 2026-02-12
    was_gilt: 'Stand der von IRCC eingesetzten Systeme laut amtlicher Parlamentsnotiz: Advanced Analytics
      für Besuchervisa (China, Indien u. a.) und Ehegatten-/Partneranträge, ITAT (maschinelles Lernen
      zur Erkennung prüfbedürftiger Anträge), Werkzeug für Besuchsdokumente im Inland, Entscheidungsunterstützung
      für IEC-Arbeitserlaubnisse, GeoMatch (freiwilliger Pilot), IRCC Assistant (Beta, intern). Algorithmic
      Impact Assessment und GBA Plus vor jedem Einsatz; keine generative KI in Entscheidungsverfahren.

      '
    verifiziert: true
    quelle: https://search.open.canada.ca/qpnotes/record/cic,IRCC-2025-QP-00001
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 's. 10.2(3): ''The Minister is to use an electronic system to carry out any applicable instruction''
    — die einzige ausdrückliche Grundlage für elektronische Verfahrensabwicklung. Sie ermächtigt zur Automatisierung
    des Verfahrens, nicht der Entscheidung.'
  - 'Keine Rechtsgrundlage für automatisierte Entscheidungen: Anders als Australien (s. 6A Social Security
    (Administration) Act 1999) oder Deutschland (§ 35a VwVfG) kennt IRPA keine Norm, die eine vollautomatisierte
    Entscheidung zulässt. Die Verwaltung hat sich deshalb darauf festgelegt, dass Ablehnungen stets von
    Menschen getroffen werden — das ist die rechtliche Grundkonstruktion, nicht bloß eine Selbstbeschränkung.'
  - 'Kontrollmaßstab: Vavilov (2019 SCC 65) verlangt eine begründete, nachvollziehbare, den Tatsachen
    des Einzelfalls entsprechende Entscheidung. Genau hier setzt die erfolgreiche Angriffslinie an (Safarian,
    Khosravi): nicht das Werkzeug, sondern die Begründung.'
  - 'Beweislastproblem: Nach Raja muss der Betroffene den Verfahrensfehler konkret darlegen — bei einem
    Werkzeug, das er nicht kennt und dessen Ausgaben nicht Teil der Akte sind. Ein Auskunftsanspruch wie
    Art. 15 Abs. 1 lit. h DSGVO existiert im kanadischen Verwaltungsverfahren nicht.'
  - 'Chinook: IRCC bestreitet, dass Chinook KI oder Advanced Analytics einsetzt; es sei ein Darstellungswerkzeug.
    Diese Einordnung ist in der Literatur bestritten und ist der Kern des Streits um Haghshenas.'
  - Die Directive on Automated Decision-Making gilt für IRCC; die Algorithmic Impact Assessments der Visa-Modelle
    sind auf dem offenen Regierungsportal veröffentlicht.
