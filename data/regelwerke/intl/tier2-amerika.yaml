  - datum: 1957-06-04
    typ: konsolidiert
    titel: The Copyright Act, 1957 (Act No. 14 of 1957)
    url: https://www.indiacode.nic.in/handle/123456789/1367
    sprache: en
    urheber: Government of India
    verifiziert: false
    notiz: Amtliche Fundstelle.
  bedeutung_eu_anbieter: 'Indien bewegt sich in beide Richtungen zugleich: Die Gerichte öffnen die Schranke,
    das Ministerium bereitet eine Zwangslizenz mit Vergütungspflicht vor. Für einen europäischen Anbieter
    heißt das: kurzfristig günstige Rechtsprechung, mittelfristig ein Vergütungsrisiko, das an den Erlösen
    des KI-Systems bemessen wird — also nicht an der Zahl der genutzten Werke. Wer in Indien trainiert
    oder indische Bestände nutzt, sollte die Erlösströme dokumentieren, weil eine künftige Abgabe daran
    anknüpfen würde. Für Rechteinhaber ist das Hybrid Model die international interessanteste Alternative
    zum europäischen Opt-out.

    '
  offene_punkte:
  - Teil II des DPIIT-Arbeitspapiers (Urheberschaft an KI-Ausgaben).
  - Hauptsacheentscheidung in ANI Media gegen OpenAI und mögliche Rechtsmittel.
  - Ob die gesetzliche Lizenz in eine Novelle des Copyright Act 1957 überführt wird.
