- id: us-ca-cipa
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: California Invasion of Privacy Act (CIPA)
  offizieller_titel: California Invasion of Privacy Act
  fundstelle: Cal. Penal Code §§ 630-638.55
  verfahrensnummer: Änderungsvorhaben SB 690 (2025-2026)
  status: anwendbar
  status_detail: 'Geltendes Recht von 1967, seit 2023 die praktisch wichtigste Klagegrundlage gegen den
    Einsatz von Analyse-, Session-Replay- und KI-Werkzeugen auf Websites. Anfang 2026 waren bundesweit
    über 4.400 Verfahren dieses Typs anhängig. Der Änderungsentwurf SB 690 wurde am 02.07.2026 grundlegend
    umgearbeitet; er streicht nur noch das private Klagerecht für Ansprüche wegen "pen register" nach
    § 638.51 und war am 01.09.2026 noch nicht verabschiedet.

    '
  kurzbeschreibung: 'CIPA verbietet das Abhören und Aufzeichnen vertraulicher Kommunikation ohne Zustimmung
    aller Beteiligten. Zwei Vorschriften tragen die KI-Verfahren: § 631(a) (Anzapfen einer Leitung, unbefugtes
    Mitlesen von Inhalten während der Übertragung, auch durch Dritte) und § 638.51 (Einsatz von pen register
    und trap and trace devices, die Wähl-, Weg-, Adressierungs- oder Signalisierungsinformationen erfassen,
    ohne gerichtliche Anordnung oder ausdrückliche Zustimmung). Kläger machen geltend, dass Cookies, Pixel,
    Fingerprinting, Session-Replay und in Websites eingebettete KI-Assistenten diese Tatbestände erfüllen
    — insbesondere, wenn ein Drittanbieter die Chatprotokolle mitliest. Der Anreiz liegt im gesetzlichen
    Schadensersatz von 5.000 USD je Verstoß und der privaten Klagebefugnis.

    '
  inkrafttreten:
    datum: 1967-01-01
    verifiziert: false
    quelle: https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=PEN&division=&title=15&part=1&chapter=1.5
    fundstelle_norm: California Invasion of Privacy Act, Cal. Penal Code §§ 630-638.55, eingefügt durch
      Stats. 1967, ch. 1509. Das gespeicherte Datum 01.01.1967 ist nicht der Wirksamkeitstermin, sondern
      ein Platzhalter für das Erlassjahr.
  anwendungsdaten:
  - datum: 2026-07-02
    was_gilt: 'SB 690 in der Fassung vom 02.07.2026: Streichung des privaten Klagerechts NUR für pen-register-Ansprüche
      nach § 638.51, die aus Websites, Apps oder Online-Anwendungen hergeleitet werden; Durchsetzung insoweit
      allein durch den Attorney General. Rückwirkung auf anhängige Verfahren, die binnen zwei Jahren vor
      dem Wirksamwerden erhoben wurden. Geplantes Inkrafttreten 01.01.2027, Verabschiedung am 01.09.2026
      offen.

      '
    verifiziert: false
    quelle: https://www.enzuzo.com/blog/sb-690-and-cipa
  themenachsen:
  - datenschutz
  - haftung
  - content
  regelungsschwerpunkte:
  - § 631(a) bleibt von SB 690 UNBERÜHRT. Genau darauf stützen sich die Klagen gegen eingebettete KI-Chatbots,
    Session-Replay und Tracking-Pixel — sie machen den Großteil der Verfahren aus und bleiben mit 5.000
    USD je Verstoß bewehrt.
  - 'Der KI-spezifische Angriff: Ein Chatbot eines Drittanbieters, der Nutzereingaben verarbeitet, wird
    als ''dritte Partei'' behandelt, die Inhalte während der Übertragung mitliest — die Zustimmung des
    Websitebetreibers genügt nicht, weil CIPA die Zustimmung ALLER Beteiligten verlangt.'
  - 'Kein Personenbezug erforderlich: Anders als der CCPA knüpft CIPA nicht an personenbezogene Daten,
    sondern an das Abhören an. Anonymisierung hilft nicht.'
  - 'Strafnorm mit privatem Klagerecht (§ 637.2): die Kombination, die die Klagewelle trägt. Vergleichbare
    Gesetze gibt es in Florida (FSCA), Pennsylvania (WESCA), Illinois und New York.'
  - 'Für europäische Anbieter die praktisch relevanteste Erkenntnis: Die Einbindung eines KI-Assistenten
    in eine Website ist in Kalifornien ein eigenständiges Haftungsrisiko, das mit DSGVO-Compliance nicht
    abgedeckt ist.'
  dokumente:
  - datum: 2025-01-01
    typ: uebersicht
    titel: 'SB 690: A Potential Pause in CIPA Litigation'
    url: https://calawyers.org/privacy-law/sb-690-a-potential-pause-in-cipa-litigation/
    sprache: en
    urheber: California Lawyers Association
    verifiziert: false
    notiz: Struktur des CIPA, pen-register-Theorie, Klagewelle, Gesetzgebungsstand.
  - datum: 2026-08-01
    typ: uebersicht
    titel: 'SB 690 and CIPA: What Changed in July 2026 (and What Didn''t)'
    url: https://www.enzuzo.com/blog/sb-690-and-cipa
    sprache: en
    urheber: Enzuzo
    verifiziert: false
    notiz: Quelle für die Fassung vom 02.07.2026, den Fortbestand der § 631-Ansprüche und die Zahl der
      Verfahren.
  bedeutung_eu_anbieter: 'Wer eine Website oder App mit kalifornischem Publikum betreibt und dort einen
    KI-Assistenten, Session-Replay oder Analysewerkzeuge einsetzt, hat ein Risiko, das die DSGVO nicht
    abbildet: Zustimmung ALLER Gesprächsbeteiligten, gesetzlicher Schadensersatz je Verstoß, private Klagebefugnis.
    Die praktische Abhilfe ist ein ausdrücklicher, vorgeschalteter Hinweis auf die Verarbeitung durch
    Dritte samt Zustimmung — nicht der Cookie-Banner europäischer Bauart.

    '
  offene_punkte:
  - Ob SB 690 verabschiedet wird und ob die Rückwirkung Bestand hat.
  - Ob Gerichte den eingebetteten KI-Assistenten als 'Dritten' im Sinne des § 631(a) einordnen — die Rechtsprechung
    ist uneinheitlich.
  - 'Wirksamkeitsdatum des CIPA nicht geprüft und wahrscheinlich falsch: Kalifornische Gesetze der Session
    1967 wurden erst nach Sessionsende wirksam, das gespeicherte 01.01.1967 liegt vor dem Erlass (Stats.
    1967, ch. 1509). leginfo.legislature.ca.gov ist für WebFetch durch robots.txt gesperrt und im Browser
    für diese Sitzung nicht freigegeben. Zu prüfen an der chaptered-Fassung von AB 860 (1967) bzw. an
    Cal. Const. art. IV § 8 in der Fassung von 1966.'
  - 'Inkrafttreten nicht belegbar: leginfo.legislature.ca.gov (robots-Sperre auf billTextClient und codes_displayText),
    Justia (California Penal Code ch. 1.5 — fuehrt keine Wirksamkeitsdaten), FindLaw, CaseMine, Privacy
    Rights Clearinghouse, California Globe zur Systematik der Wirksamkeitsdaten. Belegt ist nur die Einfuegung
    durch Stats. 1967, ch. 1509. Der Wirksamkeitstermin folgt nicht aus dem Gesetz selbst, sondern aus
    der damals geltenden Fassung des Art. IV der kalifornischen Verfassung (Frist nach Vertagung der Sitzungsperiode);
    weder der Wortlaut dieser Fassung noch das Vertagungsdatum der Regular Session 1967 liessen sich belegen.
    Der eingetragene 01.01.1967 ist — wie der Eintrag selbst vermerkt — ein Platzhalter fuer das Erlassjahr
    und mit Sicherheit FALSCH, weil das Gesetz erst im Laufe des Jahres 1967 beschlossen wurde. Es wurde
    bewusst kein Ersatzdatum gesetzt. Empfehlung: ''Statutes and Amendments to the Codes 1967'' (Deering/West)
    oder eine kalifornische Entscheidung heranziehen, die den Wirksamkeitstermin nennt.'
  monitoring_quellen:
  - https://leginfo.legislature.ca.gov/
  - https://www.insideprivacy.com/
