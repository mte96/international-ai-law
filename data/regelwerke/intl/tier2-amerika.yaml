- id: br-eca-digital
  jurisdiktion: br
  kurztitel: ECA Digital — Kinder- und Jugendschutz im Netz
  offizieller_titel: 'Lei nº 15.211, de 2025 — Estatuto Digital da Criança e do Adolescente

    '
  originaltitel: Lei nº 15.211/2025
  fundstelle: Lei nº 15.211/2025
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Im September 2025 ausgefertigt, in Kraft seit dem 17.03.2026. Aufsichtsbehörde ist die
    ANPD. Wesentliche Durchführungsregeln — technische Standards der Altersverifikation, Verfahren der
    elterlichen Aufsicht, Durchsetzungsmechanismen — stehen noch aus.

    '
  kurzbeschreibung: 'Das Gesetz verpflichtet digitale Plattformen — soziale Medien, Anwendungen, Spiele,
    App-Stores und Betriebssysteme —, die sich an Kinder und Jugendliche richten oder wahrscheinlich von
    ihnen genutzt werden, unabhängig vom Sitz des Unternehmens. Grundsatz ist die jeweils schützendste
    Voreinstellung für Privatheit und personenbezogene Daten von Anfang an. Verlangt werden zuverlässige
    Altersverifikation (Selbstauskunft genügt nicht), Verknüpfung mit einem Elternkonto für unter 16-Jährige
    in sozialen Netzwerken, Beschränkung der Profilbildung zu Werbezwecken, Verbot von Lootboxen in Spielen
    für diese Zielgruppe und Entfernung rechtsverletzender Inhalte in angemessener Frist nach Anzeige.
    Bußgelder bis 10 % des Konzernumsatzes in Brasilien; Aussetzung oder Untersagung des Dienstes bedarf
    einer gerichtlichen Anordnung. Keine Regelung darf massenhafte, generische oder unterschiedslose Überwachung
    ermöglichen.

    '
  inkrafttreten:
    datum: 2026-03-17
    verifiziert: false
    quelle: https://www.dataprivacybr.org/eca-digital-entra-em-vigor-o-que-a-lei-preve-e-o-que-ainda-falta-regulamentar/
  anwendungsdaten:
  - datum: 2026-03-17
    was_gilt: Vollständige Anwendung; ANPD als zuständige Behörde; Durchführungsregeln ausstehend.
    verifiziert: false
    quelle: https://www.dataprivacybr.org/eca-digital-entra-em-vigor-o-que-a-lei-preve-e-o-que-ainda-falta-regulamentar/
  themenachsen:
  - content
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Keine ausdrückliche KI-Regelung, aber drei mittelbare Wirkungen: Altersverifikation zwingt zu Verfahren,
    die ihrerseits häufig auf Gesichtsanalyse oder Verhaltensschätzung beruhen; die Beschränkung der Profilbildung
    trifft Empfehlungssysteme; die Voreinstellungspflicht trifft personalisierende Modelle.'
  - Extraterritoriale Anknüpfung an die Ausrichtung des Angebots — dieselbe Logik wie Art. 3 Abs. 2 DSGVO
    und Art. 2 Abs. 1 lit. c KI-VO.
  - Bußgeldrahmen bis 10 % des brasilianischen Konzernumsatzes — deutlich schärfer als die LGPD (2 %,
    höchstens 50 Mio. BRL). Für Anbieter mit jugendlichem Publikum ist das ECA Digital damit das schärfste
    brasilianische Instrument, nicht die LGPD.
  - Ausdrückliches Verbot, Durchführungsregeln zur Massenüberwachung zu nutzen — die Antwort auf die Kritik
    am kalifornischen Altersverifikationsmodell.
  - Aussetzung des Dienstes nur mit gerichtlicher Anordnung — Rechtsschutzgarantie im Verwaltungsverfahren.
