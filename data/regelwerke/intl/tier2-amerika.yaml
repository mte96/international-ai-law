    notiz: Auswertung des Wortlauts und der Streichung der menschlichen Überprüfung.
  bedeutung_eu_anbieter: 'Wer DSGVO-konform arbeitet, erfüllt die LGPD weitgehend — mit drei Abweichungen,
    die man kennen muss. Erstens: Es gibt kein Verbot automatisierter Entscheidungen, sondern nur ein
    Überprüfungsrecht; ein Scoring, das in Europa an Art. 22 DSGVO scheitert, ist in Brasilien zulässig.
    Zweitens: Die Geheimnisschranke des Art. 20 § 1 erlaubt eine knappere Auskunft als Art. 15 Abs. 1
    lit. h DSGVO — aber nur um den Preis einer möglichen Diskriminierungsprüfung durch die ANPD. Drittens:
    Für Trainingsdaten aus bestehenden Beständen hat die ANPD 2024 gezeigt, dass sie das berechtigte Interesse
    vorsorglich aussetzen kann, bevor sie in der Sache entscheidet.

    '
  offene_punkte:
  - Wann die Verordnung zu Art. 20 kommt und ob sie menschliche Überprüfung vorschreibt.
  - Ob die ANPD berechtigtes Interesse für KI-Training förmlich anerkennt und unter welchen Auflagen.
  - Verhältnis zur künftigen Rolle der ANPD als Koordinatorin des SIA nach PL 2338.
  - 'Inkrafttreten der LGPD ist gestaffelt; das Feld inkrafttreten trägt jetzt die erste Stufe (28.12.2018,
    ANPD-Vorschriften) statt wie bisher das allgemeine Wirksamwerden. Offen bleibt, ob als allgemeines
    Wirksamwerden der 15./16.08.2020 (Wortlaut Art. 65 II: 24 Monate nach Veröffentlichung am 15.08.2018)
    oder der 18.09.2020 (Veröffentlichung der Lei nº 14.058/2020, die die Verschiebung durch MP 959/2020
    beseitigte) anzusetzen ist. Zu klären am Text der MP 959/2020 und der Lei 14.058/2020.'
