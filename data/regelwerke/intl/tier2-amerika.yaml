  regelungsschwerpunkte:
  - 'Sechs Grundsätze: Accountability, Safety, Fairness and Equity, Transparency, Human Oversight and
    Monitoring, Validity and Robustness.'
  - Zweiteilung Entwickler/Betreiber — dieselbe Rollenlogik wie Anbieter/Betreiber in der KI-VO, aber
    ohne Definitionen und ohne Zurechnungsregeln.
  - 'Kennzeichnungszusage: Systeme, die mit einem Menschen verwechselt werden könnten, sind deutlich und
    auffällig als KI zu kennzeichnen — inhaltlich Art. 50 Abs. 1 KI-VO, ohne Rechtsfolge.'
  - Vorfalldatenbank auf Entwicklerseite — der Ansatz, den die India AI Governance Guidelines 2025 als
    'incident database' aufgreifen und den die KI-VO in Art. 73 als Meldepflicht ausgestaltet.
  - 'Der Kodex überlebt das Gesetz, für das er als Übergang gedacht war. Das ist der eigentliche Befund:
    Kanada reguliert generative KI derzeit ausschließlich durch Selbstverpflichtung plus allgemeines Recht.'
