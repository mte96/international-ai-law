- id: in-it-act-2000
  jurisdiktion: in
  kurztitel: Information Technology Act 2000
  offizieller_titel: The Information Technology Act, 2000
  fundstelle: Act No. 21 of 2000, zuletzt wesentlich geändert durch den Information Technology (Amendment)
    Act 2008
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht und das Rückgrat der gesamten indischen KI-Regulierung: Jede KI-Vorschrift
    Indiens — die IT Rules 2021, die Änderungsregeln 2026, sämtliche MeitY-Advisories — beruht auf der
    Verordnungsermächtigung des s. 87. Ein KI-Gesetz gibt es nicht; das seit 2023 angekündigte Nachfolgegesetz
    (Digital India Act) ist am 01.09.2026 nicht eingebracht.

    '
  kurzbeschreibung: 'Der IT Act regelt elektronischen Rechtsverkehr, Computerdelikte und die Haftung von
    Intermediären. Für KI sind fünf Vorschriften maßgeblich: s. 79 gewährt Intermediären eine Haftungsfreistellung
    für Inhalte Dritter, sofern sie die vorgeschriebene Sorgfalt beachten — der Hebel, über den sämtliche
    Pflichten der IT Rules durchgesetzt werden; s. 69A ermöglicht die Sperrung von Inhalten im öffentlichen
    Interesse; ss. 66C und 66D stellen Identitätsdiebstahl und Täuschung durch Identitätsanmaßung mittels
    Computerressourcen unter Strafe (bis drei Jahre und Geldstrafe) — die praktisch wichtigsten Deepfake-Tatbestände;
    s. 66E schützt die Privatsphäre bei Bildaufnahmen; ss. 67, 67A und 67B betreffen obszöne und kinderpornografische
    Darstellungen. s. 43A (Schadensersatz bei unzureichendem Datenschutz) wurde durch den DPDP Act 2023
    aufgehoben.

    '
  inkrafttreten:
    datum: 2000-10-17
    verifiziert: true
    quelle: https://www.indiacode.nic.in/bitstream/123456789/13116/1/it_act_2000_updated.pdf
    fundstelle_norm: 'Information Technology Act 2000 (Act 21 of 2000), s. 1(3): ''It shall come into
      force on such date as the Central Government may, by notification, appoint [...]''. Fussnote: in
      Kraft getreten am 17.10.2000 durch Bekanntmachung G.S.R. 788(E) vom 17.10.2000, Gazette of India,
      Extraordinary, Part II, sec. 3(ii). Ausfertigung (assent) 09.06.2000.'
  anwendungsdaten:
  - datum: 2009-10-27
    was_gilt: 'Inkrafttreten der Änderungen von 2008: ss. 66C, 66D, 66E, 69A, 79 in der heutigen Fassung.'
    verifiziert: false
    quelle: https://en.wikipedia.org/wiki/Information_Technology_Act,_2000
  themenachsen:
  - content
  - haftung
  - grundrechte
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - 's. 79: bedingte Haftungsfreistellung. Sie entfällt, wenn die vorgeschriebene Sorgfalt (due diligence)
    nach den IT Rules nicht beachtet wird. Damit ist s. 79 keine Schutznorm, sondern das Druckmittel —
    Indien reguliert Plattformen und mittelbar KI, indem es die Freistellung an Verhaltenspflichten knüpft.'
  - 's. 87 Abs. 1 und Abs. 2 lit. z und zg: Verordnungsermächtigung, auf die die IT Rules 2021 gestützt
    sind. Sämtliche KI-Kennzeichnungspflichten Indiens sind untergesetzliches Recht — erlassen ohne Parlamentsbefassung.'
  - 'ss. 66C, 66D: die tatsächlich genutzten Deepfake-Straftatbestände. Sie erfassen Identitätsanmaßung,
    nicht die Erzeugung synthetischer Inhalte als solche.'
  - 's. 69A: Sperrverfügungen. Das Verfahren ist nicht öffentlich; die Verfassungsmäßigkeit wurde in Shreya
    Singhal (2015) bestätigt, die Praxis bleibt umstritten.'
  - 'Was FEHLT: keine Vorschrift zu automatisierten Entscheidungen, keine zu Trainingsdaten, keine zu
    Modellanbietern. Der IT Act adressiert Intermediäre, nicht Modellentwickler — die zentrale Konstruktionsschwäche
    des indischen Ansatzes.'
  - s. 43A wurde durch s. 44 des DPDP Act 2023 aufgehoben; der zivilrechtliche Datenschutzanspruch ist
    damit in den DPDP Act gewandert.
