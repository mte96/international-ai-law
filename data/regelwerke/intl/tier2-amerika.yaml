    typ: uebersicht
    titel: Kohls v. Bonta et al — Verfahrensverfolgung
    url: https://www.techpolicy.press/tracker/kohls-v-bonta/
    sprache: en
    urheber: Tech Policy Press
    verifiziert: false
    notiz: Vollständige Verfahrenschronologie einschließlich der Verbindung mit Babylon Bee und X Corp.
  bedeutung_eu_anbieter: 'Lehrreich, nicht verpflichtend. Wer Kennzeichnungs- und Moderationsregeln für
    Wahlkontexte entwirft, sollte inhaltsneutral arbeiten: Kennzeichnung statt Verbot, Transparenz statt
    Wahrheitsprüfung. Das ist zugleich der Grund, warum die europäischen Instrumente in den USA nicht
    spiegelbildlich umsetzbar sind.

    '
  offene_punkte:
  - Ob Kalifornien Berufung eingelegt hat.
  - Ob ein enger zugeschnittenes Gesetz folgt.
