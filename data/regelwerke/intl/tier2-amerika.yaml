  - datum: 2026-02-20
    was_gilt: Kennzeichnungs-, Erklärungs- und Verifikationspflichten wirksam.
    verifiziert: false
    quelle: https://www.khaitanco.com/thought-leadership/MeitY-notifies-the-IT-Amendment-Rules-2026
  - datum: 2026-03-02
    was_gilt: Ende der zehntägigen Umsetzungsfrist für technische und betriebliche Anpassungen (Berechnung
      aus dem Wirksamwerden; das genaue Fristende ist nicht amtlich bestätigt).
    verifiziert: false
    quelle: https://www.khaitanco.com/thought-leadership/MeitY-notifies-the-IT-Amendment-Rules-2026
  themenachsen:
  - content
  - gpai
  - haftung
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'DIE ENTSCHEIDENDE NEUERUNG: Verifikationspflicht der Plattform. Nicht nur der Nutzer muss erklären,
    ob ein Inhalt synthetisch ist — die Plattform muss diese Erklärung mit technischen Mitteln überprüfen.
    Weder Art. 50 KI-VO noch der DSA kennen eine Prüfpflicht dieser Art; sie zwingt zu Erkennungstechnik,
    deren Zuverlässigkeit umstritten ist.'
  - Definition über die WAHRNEHMUNG ('appear real, authentic or true', 'indistinguishable'), nicht über
    die Technik. Offensichtlich künstliche Darstellungen — Zeichentrick, stilisierte Bilder — fallen heraus;
    genau dort liegt die Umgehungsmöglichkeit.
  - 'Textausnahme: Reiner Text ist NICHT erfasst. Ein KI-geschriebener Falschbericht ist keine SGI; ein
    KI-erzeugtes Foto dazu schon. Das ist die größte inhaltliche Lücke.'
  - Die 10-%-Regel des Konsultationsentwurfs (Kennzeichnung über mindestens ein Zehntel der sichtbaren
    Fläche bzw. der ersten zehn Prozent der Tondauer) ist in der Endfassung durch einen Wahrnehmbarkeitsmaßstab
    ersetzt worden. Sekundärquellen tragen die 10-%-Regel weiter — sie ist Entwurfsstand.
  - Sanktion bleibt der Verlust der Haftungsfreistellung. Ein eigener Bußgeldtatbestand fehlt; die Wirkung
    entsteht über das Haftungsrisiko.
  - 'Zeitlicher Vergleich: Indien verlangt Kennzeichnung und Prüfung seit dem 20.02.2026; Art. 50 KI-VO
    gilt ab dem 02.08.2026 und verlangt maschinenlesbare Markierung durch den Anbieter sowie Offenlegung
    durch den Einsetzenden, aber keine Plattformprüfung.'
