  - datum: 2026-04-01
    typ: leitlinie
    titel: Pre-market guidance for machine learning-enabled medical devices (PDF)
    url: https://www.canada.ca/content/dam/hc-sc/documents/services/drugs-health-products/medical-devices/application-information/guidance-documents/pre-market-guidance-machine-learning-enabled-medical-devices/pre-market-guidance-machine-learning-enabled-medical-devices.pdf
    sprache: en
    urheber: Health Canada
    verifiziert: false
    notiz: Druckfassung.
  bedeutung_eu_anbieter: 'Für Hersteller von KI-Medizinprodukten der bequemste Drittmarktzugang: Wer eine
    MDR-Konformitätsbewertung und die KI-VO-Anforderungen für Hochrisikosysteme nach Anhang I erfüllt,
    hat den Großteil der kanadischen Unterlagen. Zwei Punkte fehlen typischerweise — der PCCP, den die
    MDR so nicht kennt und der in Kanada aktiv genutzt werden sollte, und die SGBA-Plus-Analyse, die über
    die Anforderungen des Art. 10 Abs. 2 lit. f KI-VO an Datenrepräsentativität hinausgeht, weil sie eine
    ausdrückliche geschlechts- und gruppenbezogene Wirkungsanalyse verlangt.

    '
  offene_punkte:
  - Verhältnis zu einer künftigen KI-Regulierung; der Leitfaden ist derzeit die einzige verbindlich gehandhabte
    KI-Vorgabe im kanadischen Gesundheitsbereich.
  - Behandlung von Basismodellen und generativen Assistenzsystemen im klinischen Umfeld.
