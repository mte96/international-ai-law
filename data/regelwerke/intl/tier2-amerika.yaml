  bedeutung_eu_anbieter: 'Brasilien ist für Trainingszwecke die restriktivste der drei hier behandelten
    Rechtsordnungen — restriktiver als Indien (offener fair-dealing-Zweck ''Forschung'', den der Delhi
    High Court 2026 auf Training angewandt hat) und als die EU (Art. 4 DSM-RL mit Opt-out). Wer brasilianische
    Bestände nutzt, sollte lizenzieren. Umgekehrt: Für Rechteinhaber ist Brasilien der günstigste Gerichtsstand
    der drei — es fehlt schlicht die Schranke, auf die sich ein Trainierer berufen könnte.

    '
