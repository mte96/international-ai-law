- id: ca-protecting-victims-act
  jurisdiktion: ca
  kurztitel: Protecting Victims Act (Bill C-16) — Deepfake-Strafrecht
  offizieller_titel: 'An Act to amend certain Acts in relation to criminal and correctional matters (child
    protection, gender-based violence, delays and other measures) — Kurztitel Protecting Victims Act

    '
  fundstelle: S.C. 2026, c. 19
  verfahrensnummer: Bill C-16, 45. Parlament, 1. Sitzungsperiode
  status: anwendbar
  status_detail: 'Erste Lesung am 09.12.2025, Annahme im Unterhaus am 11.06.2026, Zustimmung des Senats
    ohne Änderungen am 18.06.2026, Royal Assent am 18.06.2026. Das erste kanadische Bundesgesetz, das
    synthetisch erzeugte intime Darstellungen ausdrücklich erfasst.

    '
  kurzbeschreibung: 'Das Gesetz erweitert s. 162.1 des Criminal Code (nicht einvernehmliche Verbreitung
    intimer Bilder, eingeführt 2014) um einen neuen Absatz, der als intimes Bild auch eine mit elektronischen
    oder mechanischen Mitteln hergestellte Darstellung erfasst, die eine identifizierbare Person nackt,
    mit entblößten Geschlechtsteilen oder bei expliziter sexueller Handlung zeigt, wenn die Darstellung
    wahrscheinlich für eine echte Aufnahme gehalten wird. Damit sind rein synthetische Bilder erfasst,
    die bisher aus dem Tatbestand fielen. Neu ist außerdem s. 162.1(1.1): die Drohung mit der Offenbarung
    eines — echten oder synthetischen — intimen Bildes in Einschüchterungsabsicht, auch ohne Forderung
    von Geld oder weiteren Bildern. Daneben enthält das Gesetz umfangreiche, KI-fremde Änderungen zu Kinderschutz,
    geschlechtsbezogener Gewalt und Verfahrensdauer.

    '
