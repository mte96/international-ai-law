    betreibt, muss in den USA mit landesrechtlichen Entfernungspflichten nicht rechnen, solange § 230
    unverändert bleibt. Umgekehrt heißt das, dass die Erwartung, US-Bundesstaaten könnten Deepfake-Regeln
    nach europäischem Muster schaffen, rechtlich unbegründet ist.

    '
