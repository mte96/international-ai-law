- id: ca-health-canada-mlmd
  jurisdiktion: ca
  kurztitel: Health Canada — Leitfaden für ML-gestützte Medizinprodukte
  offizieller_titel: Pre-market guidance for machine learning-enabled medical devices
  fundstelle: Health Canada Guidance Document; Rechtsgrundlage Medical Devices Regulations (SOR/98-282)
    und Food and Drugs Act
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Endfassung veröffentlicht am 01.04.2026 nach vorangegangener Entwurfskonsultation. Ein
    Leitfaden bindet nicht unmittelbar, legt aber die Verwaltungspraxis fest, nach der Health Canada Lizenzanträge
    prüft; wer abweicht, muss die Gleichwertigkeit begründen.

    '
  kurzbeschreibung: 'Der Leitfaden gilt für Medizinprodukte der Klassen II, III und IV, die maschinelles
    Lernen ganz oder teilweise zur Erreichung ihres medizinischen Zwecks einsetzen. Anträge müssen den
    ML-Einsatz im Anschreiben ausdrücklich benennen, die Klassifizierung nach Schedule 1 begründen, Sicherheit
    und Wirksamkeit nach ss. 10-20 der Medical Devices Regulations belegen, Methode, Trainingsalgorithmus
    und Architektur beschreiben, die Daten charakterisieren und verwalten, Test- und Bewertungsergebnisse
    mit Leistungskennzahlen vorlegen und bei Klasse III/IV klinische Validierung nachweisen. Kennzeichnung
    und Gebrauchsanweisung müssen Betriebsparameter, Eigenschaften der Trainingsdaten, Leistungskennzahlen
    und bekannte Grenzen enthalten; eine strukturierte Zusammenfassung ("model card") wird empfohlen.
    Über einen Predetermined Change Control Plan können künftige Modelländerungen vorab genehmigt werden.

    '
  inkrafttreten:
    datum: 2026-04-01
    verifiziert: true
    quelle: https://www.canada.ca/en/health-canada/services/drugs-health-products/medical-devices/application-information/guidance-documents/pre-market-guidance-machine-learning-enabled-medical-devices.html
  anwendungsdaten:
  - datum: 2026-04-01
    was_gilt: Anwendung auf Lizenzanträge und Änderungsanträge für ML-gestützte Medizinprodukte der Klassen
      II bis IV.
    verifiziert: true
    quelle: https://www.canada.ca/en/health-canada/services/drugs-health-products/medical-devices/application-information/guidance-documents/pre-market-guidance-machine-learning-enabled-medical-devices.html
  themenachsen:
  - sektor-medizin
  - marktzugang
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - 'Predetermined Change Control Plan (PCCP): vorab beschriebene und genehmigte Änderungen samt Grenzen
    des Produkts. Damit kann ein lernendes System aktualisiert werden, ohne für jede Änderung einen Änderungsantrag
    zu stellen — die zentrale regulatorische Innovation, parallel zur FDA-Praxis und ohne Entsprechung
    in der MDR.'
  - SGBA Plus (sex- and gender-based analysis plus) über den gesamten Lebenszyklus; Nachweis der Leistung
    über demografische Untergruppen und unterrepräsentierte Bevölkerungsgruppen hinweg. Das ist eine Verzerrungsprüfung
    als Zulassungsvoraussetzung.
  - 'Transparenz in der Kennzeichnung: Trainingsdatencharakteristik, Leistungskennzahlen und bekannte
    Grenzen müssen dem Anwender mitgeteilt werden — inhaltlich das, was Art. 13 KI-VO als Gebrauchsanweisung
    verlangt, hier aber medizinprodukterechtlich verankert.'
  - 'Rechtsgrundlagen: ss. 10-20 (Sicherheit und Wirksamkeit), 21-23 (Kennzeichnung), 32 (Antragsangaben),
    36(2) (Auflagen zur Lizenz), Schedule 1 (Klassifizierung) der Medical Devices Regulations.'
  - Klasse I bleibt außen vor; reine Wellness- und Verwaltungssoftware ist nicht erfasst.
  dokumente:
  - datum: 2026-04-01
    typ: leitlinie
    titel: Pre-market guidance for machine learning-enabled medical devices
    url: https://www.canada.ca/en/health-canada/services/drugs-health-products/medical-devices/application-information/guidance-documents/pre-market-guidance-machine-learning-enabled-medical-devices.html
    sprache: en
