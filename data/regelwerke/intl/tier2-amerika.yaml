  bedeutung_eu_anbieter: 'Für europäische Anbieter die am leichtesten zu unterschätzende kanadische Vorschrift.
    Wer nach DSGVO ohnehin Art. 13/14- und Art. 15-Prozesse betreibt, muss für Quebec nur eines umbauen:
    Die Information über die Automatisierung muss AKTIV mit der Entscheidung ergehen, nicht erst auf Anfrage.
    Das ist ein Eingriff in die Bescheidvorlagen, nicht in die Modellarchitektur. Umgekehrt ist die Zulässigkeitsschwelle
    niedriger als in der EU: Wo Art. 22 DSGVO verbietet, erlaubt Quebec bei Einhaltung des Verfahrens.

    '
