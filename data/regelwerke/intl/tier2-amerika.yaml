  - datum: 2025-12-09
    was_gilt: 'Die Bundesregierung bringt einen eigenen Entwurf zur KI-Governance ein: nationales System
      zur Entwicklung, Regulierung und Governance der KI (SIA) mit einem Brasilianischen KI-Rat (CBIA);
      die ANPD wird Regulierer für Sektoren ohne eigene KI-Regeln. Der Entwurf wird an PL 2338 angehängt
      und in einen einheitlichen Ersetzungstext überführt.

      '
    verifiziert: false
    quelle: https://convergenciadigital.com.br/governo/inteligencia-artificial-projeto-do-governo-foi-articulado-com-relator-e-entra-no-pl-2338-23/
