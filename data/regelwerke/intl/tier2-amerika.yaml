  status: softlaw
  status_detail: 'Angekündigt im November 2024, tätig seit 2025; die amtliche Seite wurde zuletzt am 08.07.2026
    aktualisiert. Kanada ist Gründungsmitglied des International Network of AI Safety Institutes (AI Seoul
    Summit, Mai 2024). CAISI hat KEINE Aufsichts-, Anordnungs- oder Zulassungsbefugnis; es forscht und
    berät.

    '
  kurzbeschreibung: 'CAISI wird von ISED geführt, stützt sich auf die Forschungskapazität des National
    Research Council und betreibt über CIFAR ein eigenes KI-Sicherheitsforschungsprogramm mit zwei Strängen:
    von Forschenden initiierte angewandte Forschung und von der Regierung beauftragte Projekte. Aufgabe
    ist, die Wissenschaft der KI-Sicherheit voranzubringen, Risikobewertungsinstrumente zu entwickeln,
    Entwicklern und Öffentlichkeit Orientierung zu geben und sich an gemeinsamen internationalen Testvorhaben
    zu beteiligen. Die Strategie "AI for All" vom 04.06.2026 sieht einen Ausbau der CAISI-Kapazitäten
    vor.

    '
