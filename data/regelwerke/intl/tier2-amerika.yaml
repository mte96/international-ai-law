  bedeutung_eu_anbieter: 'Es gibt in Brasilien kein KI-Gesetz, auf das man sich einstellen könnte — und
    es ist offen, ob der Senatstext oder eine deutlich abgeschwächte Fassung Gesetz wird. Wer heute plant,
    sollte zweigleisig fahren: die Pflichten nach LGPD, Verbraucherschutzrecht (CDC), Marco Civil und
    — bei Angeboten für Minderjährige — dem ECA Digital erfüllen, und die KI-VO-Dokumentation bereithalten,
    weil der brasilianische Text ihr im Aufbau folgt. Konkret sinnvoll sind bereits jetzt: algorithmische
    Folgenabschätzung, Kennzeichnung synthetischer Inhalte, Erklärungs- und Anfechtungswege für automatisierte
    Entscheidungen. Wer das hat, wird beim Inkrafttreten keinen Neubau brauchen.

    '
  offene_punkte:
  - Ob der Sonderausschuss 2026 überhaupt abstimmt und mit welchem Text.
  - Ob die Vergütungsregel für Trainingsnutzungen geschützter Werke erhalten bleibt.
  - Ob eine Übergangsfrist vorgesehen wird und wie lang.
  - Verhältnis zum Plano Brasileiro de Inteligência Artificial (PBIA 2024-2028), das Förderung ohne Regulierung
    regelt.
