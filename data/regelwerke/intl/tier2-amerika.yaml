- id: in-copyright-act-1957
  jurisdiktion: in
  kurztitel: Copyright Act 1957 — indisches Urheberrecht
  offizieller_titel: The Copyright Act, 1957
  fundstelle: Act No. 14 of 1957
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Unverändert, aber im Umbruch. Am 24.07.2026 hat der Delhi High Court (Justice Amit Bansal)
    im Verfahren ANI Media gegen OpenAI den Antrag auf einstweilige Verfügung zurückgewiesen und prima
    facie entschieden, dass die Speicherung geschützter Werke zum Training unter die Schranke des s. 52(1)(a)
    (fair dealing, Forschung) fallen kann und die Ausgaben keine wesentliche Übernahme der originären
    Ausdrucksform darstellten. Parallel hat das Handelsministerium (DPIIT) am 08.12.2025 ein Arbeitspapier
    vorgelegt, das eine gesetzliche Lizenz mit Vergütungsanspruch empfiehlt.

    '
  kurzbeschreibung: 'Das indische Urheberrecht kennt in s. 2(d)(vi) eine Besonderheit: Bei computergenerierten
    literarischen, dramatischen, musikalischen oder künstlerischen Werken gilt als Urheber die Person,
    die die Schaffung des Werkes veranlasst hat. Diese Vorschrift ist die Grundlage der Registrierung
    des Werkes "Suryast" mit einem KI-System als Miturheber (2020/21) und der anschließenden Rücknahmeankündigung
    durch das Urheberamt. Für das Training ist s. 52(1)(a)(i) maßgeblich: fair dealing zu Zwecken der
    privaten oder persönlichen Nutzung einschließlich Forschung. Anders als der US-amerikanische fair
    use ist die Schranke zweckgebunden, aber weiter als in Brasilien und Kanada — der Delhi High Court
    hat sie 2026 erstmals auf KI-Training angewandt.

    '
  inkrafttreten:
    datum: 1958-01-21
    verifiziert: true
    quelle: https://www.indiacode.nic.in/bitstream/123456789/1367/1/A195714.pdf
    fundstelle_norm: 'Copyright Act 1957 (Act 14 of 1957), s. 1(3): ''It shall come into force on such
      date as the Central Government may, by notification in the Official Gazette, appoint.'' Fussnote:
      21.01.1958, vide notification No. S.R.O. 269 vom 21.01.1958, Gazette of India, Extraordinary, Part
      II, sec. 3. Ausfertigung (assent) 04.06.1957.'
  anwendungsdaten:
  - datum: 2026-07-24
    was_gilt: 'Delhi High Court, ANI Media gegen OpenAI: keine einstweilige Verfügung; Speicherung zum
      Training prima facie von der Forschungsschranke gedeckt; Ausgaben keine wesentliche Übernahme. Hauptsacheverfahren
      anhängig.

      '
    verifiziert: false
    quelle: https://asiaiplaw.com/article/delhi-high-courts-openai-ruling-may-become-asias-most-consequential-ai-copyright-decision
  themenachsen:
  - urheberrecht
  - gpai
  - content
  regelungsschwerpunkte:
  - 's. 2(d)(vi): Urheber computergenerierter Werke ist, wer die Schaffung veranlasst hat. Indien gehört
    damit zu der kleinen Gruppe von Rechtsordnungen (mit dem Vereinigten Königreich, Irland, Neuseeland,
    Hongkong), die computergenerierte Werke ausdrücklich zuordnen — ein Regelungsansatz, den die EU nicht
    kennt.'
  - 's. 52(1)(a)(i): fair dealing für private oder persönliche Nutzung einschließlich Forschung. Der Delhi
    High Court hat Training prima facie darunter subsumiert. Die Entscheidung ist nur eine Zwischenentscheidung,
    aber die erste positive Anwendung einer Schranke auf KI-Training in Asien außerhalb Japans.'
  - Kein TDM-Recht mit Opt-out wie Art. 4 DSM-RL. Rechteinhaber können sich nicht vorbehalten; sie müssen
    klagen.
  - 'DPIIT-Arbeitspapier vom 08.12.2025 (''Working Paper on Generative Artificial Intelligence and Copyright,
    Part I''): Eine TDM-Schranke wird VERWORFEN (sie unterminiere den Urheberrechtsschutz), Direktlizenzierung
    als praktisch undurchführbar verworfen, kollektive und erweiterte kollektive Lizenzierung als unzureichend
    eingestuft; EMPFOHLEN wird eine gesetzliche Lizenz im ''Hybrid Model'': obligatorische Pauschallizenz
    mit gesetzlichem Vergütungsanspruch, verwaltet durch eine staatlich benannte Verwertungsstelle (CRCAT),
    berechnet als fester Anteil an den Erlösen kommerzialisierter KI-Systeme. Die Frage der Urheberschaft
    an KI-Ausgaben ist Teil II vorbehalten. Konsultationsfrist bis 07.01.2026.'
  - Damit ist Indien die erste große Rechtsordnung, deren zuständiges Ministerium eine gesetzliche Lizenz
    mit Vergütungsanspruch für KI-Training öffentlich empfiehlt — die Lösung, über die in Europa nur diskutiert
    wird.
