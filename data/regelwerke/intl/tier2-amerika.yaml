  regelungsschwerpunkte:
  - Anknüpfung an die Verwechselbarkeit ('likely to be mistaken for a visual recording'), nicht an die
    Erzeugungstechnik. Damit ist das Gesetz technologieneutral und erfasst künftige Verfahren — anders
    als Regelungen, die auf 'KI' oder 'Deep Learning' abstellen.
  - 'Erfasst ist die VERBREITUNG, nicht die Herstellung zum Eigengebrauch. Das ist der Hauptkritikpunkt
    und der wesentliche Unterschied zum britischen Recht: s. 138 Data (Use and Access) Act 2025 stellt
    seit dem 06.02.2026 auch die Herstellung unter Strafe.'
  - 's. 162.1(1.1): Drohung mit Offenbarung in Einschüchterungsabsicht — schließt die Sextortion-Lücke,
    die keine Forderung voraussetzt.'
  - 'Verfassungsrechtliches Risiko: Die Verteidigung des ''public good'' (s. 162.1(3)) ist nach anwaltlicher
    Einschätzung zu eng, um politische Satire mit KI-erzeugten Bildern zu decken; eine Charter-Prüfung
    nach s. 2(b) ist zu erwarten.'
  - 'KEINE Plattformpflichten: Das Gesetz regelt Strafbarkeit, nicht Löschpflichten. Die Löschpflichten
    wären im Online Harms Act (C-63) gewesen — der gescheitert ist.'
