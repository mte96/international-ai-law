- id: in-ai-governance-guidelines-2025
  jurisdiktion: in
  kurztitel: India AI Governance Guidelines (November 2025)
  offizieller_titel: 'India AI Governance Guidelines: Enabling Safe and Trusted AI Innovation'
  fundstelle: Ministry of Electronics and Information Technology, veröffentlicht 05.11.2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 05.11.2025 unter dem Dach der IndiaAI Mission veröffentlicht, erarbeitet von einer
    multidisziplinären Gruppe unter Vorsitz von Prof. Balaraman Ravindran (IIT Madras) mit Beteiligung
    von MeitY, NITI Aayog, Microsoft Research India sowie Rechts- und Politikfachleuten. RECHTSNATUR:
    unverbindliche Leitlinien. Sie schaffen keine Pflichten, begründen keine Rechte und sind nicht einklagbar;
    sie beschreiben, wie bestehendes Recht angewandt und schrittweise angepasst werden soll.

    '
  kurzbeschreibung: 'Die Leitlinien stellen ausdrücklich fest, dass Indien vorerst KEIN eigenständiges
    KI-Gesetz braucht: Bestehende Gesetze — IT Act, IT Rules, DPDP Act, Verbraucher-, Wettbewerbs-, Straf-
    und Urheberrecht — seien anzuwenden, Lücken durch GEZIELTE Änderungen zu schließen. Sieben Leitsätze
    ("Sutras"): Vertrauen als Fundament; der Mensch zuerst; Innovation vor Zurückhaltung; Fairness und
    Gleichheit; Rechenschaft; verständlich durch Gestaltung; Sicherheit, Widerstandsfähigkeit und Nachhaltigkeit.
    Empfohlen wird eine dreiteilige Institutionenordnung: eine AI Governance Group (AIGG) unter Vorsitz
    des Principal Scientific Adviser zur ressortübergreifenden Koordinierung, ein Technology and Policy
    Expert Committee (TPEC) zur fachlichen Beratung und ein AI Safety Institute (AISI) für Forschung,
    Risikobewertung und Standards. Vorgesehen ist ferner ein abgestuftes Haftungssystem nach Funktion
    und Risiko, eine Vorfalldatenbank, freiwillige Selbstverpflichtungen und Reallabore. Der Umsetzungsplan
    ist in kurz-, mittel- und langfristige Schritte gegliedert; neue Gesetze sind ausdrücklich erst der
    langfristigen Stufe zugeordnet.

    '
  inkrafttreten:
    datum: 2025-11-05
    verifiziert: false
    quelle: https://www.scconline.com/blog/post/2025/11/06/meity-launches-india-ai-governance-guidelines-under-indiaai-mission-2025/
  anwendungsdaten:
  - datum: 2025-11-05
    was_gilt: Veröffentlichung; keine Rechtspflichten, Orientierungsrahmen für Verwaltung, Regulierer
      und Wirtschaft.
    verifiziert: false
    quelle: https://www.dsci.in/files/content/knowledge-centre/2025/summary-of-india-ai-governence-guidelines.pdf
  themenachsen:
  - governance
  - gpai
  - grundrechte
  - haftung
  - urheberrecht
  regelungsschwerpunkte:
  - 'RECHTSNATUR: Empfehlung, nicht Norm. Wer in Indien nach den Guidelines arbeitet, erwirbt keinen Rechtsanspruch
    und keine Vermutungswirkung — anders als bei einer harmonisierten Norm nach Art. 40 KI-VO.'
  - 'Ausdrückliche Absage an ein KI-Gesetz zum jetzigen Zeitpunkt: ''targeted amendments'' statt neuer
    Kodifikation. Das ist die offizielle Regierungsposition und steht im Widerspruch zur Empfehlung des
    Parlamentsausschusses vom 02.04.2026.'
  - Abgestufte Haftung nach Funktion und Risiko — der Ansatz, mit dem die fehlende Adressierung von Modellanbietern
    im IT Act geschlossen werden soll, ohne den IT Act zu ändern.
  - AI Safety Institute als Teil der Institutionenordnung; Indien reiht sich damit in das internationale
    Netzwerk der Sicherheitsinstitute ein.
  - 'Vorfalldatenbank: kurzfristig vorzubereiten, mittelfristig zu betreiben. Vergleichbar mit Art. 73
    KI-VO (Meldung schwerwiegender Vorfälle), aber ohne Meldepflicht.'
  - 'Der ''techno-legal'' Ansatz: Regelungsziele sollen soweit möglich technisch durchgesetzt werden (Kennzeichnung,
    Herkunftsnachweis, Einwilligungsinfrastruktur) statt durch Ge- und Verbote. Die IT-Änderungsregeln
    2026 sind die erste Umsetzung.'
  - Die sieben Sutras werden in Sekundärquellen abweichend wiedergegeben; maßgeblich ist die Fassung der
    amtsnahen Zusammenfassung (DSCI).
  dokumente:
  - datum: 2025-11-05
