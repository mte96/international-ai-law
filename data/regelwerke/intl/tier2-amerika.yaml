  bedeutung_eu_anbieter: 'Wer ein Modell mit gescrapten Daten trainiert und den Dienst in Kanada anbietet,
    hat mit 2026-002 einen Präzedenzfall gegen sich: Die Aufsichten halten breites Scraping für unangemessen
    im Sinne des s. 5(3), unabhängig von jeder Rechtsgrundlagenkonstruktion. Der praktische Ausweg ist
    derselbe wie in Europa — Herkunftsdokumentation der Trainingsdaten, Filter gegen personenbezogene
    Kennungen, Auskunfts- und Löschwege, Schutz Minderjähriger. Wer die Anforderungen des Art. 5 Abs.
    1 lit. a bis c DSGVO und der EDSA- Stellungnahme 28/2024 erfüllt, ist dem kanadischen Maßstab nahe,
    muss aber zusätzlich beachten, dass die Angemessenheitsprüfung einwilligungsfest ist.

    '
  offene_punkte:
  - Ob der Federal Court die Rechtsauffassung der Behörden bestätigt — bisher gibt es keine gerichtliche
    Entscheidung zu Trainingsdaten unter s. 5(3).
  - Ob Bill C-36 die Rechtslage für laufende Trainingsvorhaben ändert (Übergangsvorschriften).
