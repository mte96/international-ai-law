  status: teilanwendbar
  status_detail: 'In Kraft seit 23.06.2014, aber im Kern geändert durch die Rechtsprechung: Am 26.06.2025
    hat das Bundesverfassungsgericht (STF) in den Verfahren zu den Themen 987 (RE 1.037.396) und 533 (RE
    1.057.258) den Art. 19 mit 8 zu 3 Stimmen für teilweise verfassungswidrig erklärt. Am 11./12.06.2026
    hat das Gericht über die Anhörungsrügen entschieden und die Leitsätze am 17.06.2026 endgültig gefasst.

    '
  kurzbeschreibung: 'Der Marco Civil ist Brasiliens Internetgrundgesetz: Grundsätze (Art. 3), Nutzerrechte
    (Art. 7), Netzneutralität (Art. 9), Datenspeicherpflichten (Art. 13-15) und — für KI entscheidend
    — das Haftungsregime für Inhalte Dritter. Art. 19 machte die Haftung des Anwendungsanbieters von der
    Missachtung einer GERICHTLICHEN Anordnung abhängig; Art. 21 sah für nicht einvernehmliche Intimaufnahmen
    bereits die außergerichtliche Anzeige vor. Nach der Entscheidung des STF gilt nun: Für schwere Straftaten
    haften Plattformen bereits bei Untätigkeit nach außergerichtlicher Anzeige; für Werbung und algorithmisch
    verstärkte Inhalte besteht eine widerlegliche Verschuldensvermutung; bei systemischem Versagen gegenüber
    der massenhaften Verbreitung schwerer rechtswidriger Inhalte haftet die Plattform unmittelbar. Für
    Ehrverletzungen bleibt es beim Richtervorbehalt. E-Mail, private Nachrichtendienste und Anbieter ohne
    Eingriff in den Kommunikationsfluss sind ausgenommen.

    '
  inkrafttreten:
    datum: 2014-06-23
    verifiziert: true
    quelle: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/l12965.htm
    fundstelle_norm: 'Art. 32 Lei nº 12.965/2014 (Marco Civil da Internet): "Esta Lei entra em vigor após
      decorridos 60 (sessenta) dias de sua publicação oficial." Veröffentlichung im DOU am 24.04.2014
      — daher Inkrafttreten am 23.06.2014.'
  anwendungsdaten:
  - datum: 2025-06-26
    was_gilt: 'STF, Themen 987 und 533: Art. 19 teilweise verfassungswidrig. Ausdehnung des Art.-21-Modells
      (außergerichtliche Anzeige) auf schwere Straftaten — antidemokratische Handlungen, Terrorismus,
      Anstiftung zu Suizid und Selbstverletzung, Diskriminierung nach Rasse, Religion, sexueller Orientierung
      und Geschlechtsidentität, Gewalt gegen Frauen, Sexualdelikte gegen Minderjährige und Kinderpornografie,
      Menschenhandel.

      '
    verifiziert: false
    quelle: https://conjur.com.br/2025-jun-26/supremo-fixa-tese-sobre-responsabilizacao-de-plataformas-por-conteudo-de-usuarios/
  - datum: 2026-06-17
    was_gilt: 'Endgültige Fassung der Leitsätze nach den Anhörungsrügen: gesamtschuldnerische Haftung
      mit Ausnahme begründeter Zweifel an der Rechtswidrigkeit; relative Verschuldensvermutung für bezahlte
      Werbung und künstliche Verbreitungsmechanismen; Ausweitung der Ausnahme auf Anbieter ohne Eingriff
      in den Kommunikationsfluss; für zivilrechtliche Ehrverletzung bleibt die gerichtliche Anordnung
      erforderlich, außergerichtliche Anzeigen bleiben zulässig; 60 Tage Umsetzungsfrist für die Pflichten
      gegen die systematische Verbreitung schwerer rechtswidriger Inhalte.

      '
    verifiziert: false
    quelle: https://www.mattosfilho.com.br/unico/stf-atualiza-teses-fixadas/
  themenachsen:
  - content
  - haftung
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - Für KI-erzeugte Inhalte enthält weder das Gesetz noch die Entscheidung eine ausdrückliche Regelung.
    Die Verschuldensvermutung für 'künstliche Verbreitungsmechanismen' und bezahlte Werbung erfasst algorithmische
    Verstärkung, nicht die Erzeugung.
  - 'Praktische Folge für Deepfakes: Ein nicht einvernehmliches synthetisches Intimbild fällt unter Art.
    21 (schon immer außergerichtlich) und nach der STF-Entscheidung zusätzlich unter die erweiterten Deliktskategorien.
    Ein politischer Deepfake ohne Straftatbezug bleibt beim Richtervorbehalt für Ehrverletzungen.'
  - 'Systemisches Versagen als Haftungsgrund (''falha sistêmica'') ist der eigentliche dogmatische Sprung:
    Es geht nicht mehr um den Einzelinhalt, sondern um die Organisation der Plattform — inhaltlich die
    Logik der Art. 34, 35 DSA, richterrechtlich entwickelt.'
  - Der STF hat den Gesetzgeber ausdrücklich zur Regelung aufgefordert; die Zuständigkeit der Exekutive
    für untergesetzliche Regelungen nach Art. 84 IV und VI a) der Verfassung bleibt unberührt.
  - 'Ausnahmen: E-Mail, private Nachrichtendienste, Anbieter ohne Eingriff in den Kommunikations- oder
    Informationsfluss. Ein reines Sprachmodell-API-Angebot ohne Verbreitungsfunktion dürfte danach nicht
    erfasst sein.'
