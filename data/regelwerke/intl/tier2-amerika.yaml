  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: California Age-Appropriate Design Code Act (CAADCA)
  offizieller_titel: California Age-Appropriate Design Code Act (AB 2273, 2022)
  fundstelle: Cal. Civ. Code §§ 1798.99.28 ff.
  verfahrensnummer: AB 2273 (2021-2022 Regular Session)
  status: teilanwendbar
  status_detail: 'Seit 2023 in weiten Teilen durch einstweilige Verfügung außer Vollzug (NetChoice gegen
    Bonta). Am 12.03.2026 hat der Ninth Circuit die Verfügung teilweise aufgehoben: Altersschätzung, datenschutzfreundliche
    Voreinstellungen für Kinder, altersgerechte Datenschutzhinweise, Beschränkungen für Standortdaten,
    Signale elterlicher Überwachung sowie Melde- und Auskunftswerkzeuge dürfen wirksam werden; die Pflicht
    zur Datenschutz-Folgenabschätzung sowie die Verbote "wesentlich nachteiliger" Datennutzung, der Profilbildung
    entgegen dem "besten Interesse" des Kindes und der auf das "Wohlbefinden" bezogenen Dark Patterns
    bleiben wegen Unbestimmtheit untersagt.

    '
  kurzbeschreibung: 'Der CAADCA verpflichtet Unternehmen, die Online-Dienste anbieten, die "wahrscheinlich
    von Kindern genutzt werden", zu kindgerechter Gestaltung: höchstmögliche Datenschutzeinstellungen
    als Voreinstellung, Altersschätzung oder Anwendung der Kinderschutzregeln auf alle Nutzer, altersgerechte
    Sprache, Beschränkung von Profilbildung und Standortdatenverarbeitung. Für KI ist die Vorschrift doppelt
    relevant: Die Altersschätzung wird typischerweise mit Gesichts- oder Verhaltensanalyse umgesetzt,
    und die Beschränkung der Profilbildung trifft Empfehlungssysteme unmittelbar. Der Ninth Circuit hat
    die Reichweite des Anwendungsbereichs bestätigt: Sechs Indizien für "wahrscheinlich von Kindern genutzt"
    genügen, eines reicht.

    '
  inkrafttreten:
    datum: 2024-07-01
    verifiziert: false
    quelle: https://law.justia.com/codes/california/code-civ/division-3/part-4/title-1-81-47/section-1798-99-31/
    fundstelle_norm: 'Cal. Civ. Code § 1798.99.31(d): ''This section shall become operative on July 1,
      2024.'' Eingefuegt durch AB 2273 (Stats. 2022, ch. 320). Das Gesetz selbst ist als Statut am 01.01.2023
      wirksam geworden; die Pflichten sind erst ab dem 01.07.2024 operativ'
  anwendungsdaten:
  - datum: 2026-03-12
    was_gilt: 'Ninth Circuit: Verfügung gegen Altersschätzung (zur weiteren Prüfung zurückverwiesen),
      Voreinstellungen, Datenschutzhinweise, Standortdaten, elterliche Überwachungssignale und Auskunftswerkzeuge
      aufgehoben; Folgenabschätzung und die unbestimmten Verbote bleiben untersagt.

      '
    verifiziert: false
    quelle: https://www.hklaw.com/en/insights/publications/2026/03/ninth-circuit-issues-mixed-ruling-on-california-age-appropriate-design
  themenachsen:
  - datenschutz
  - content
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Die Folgenabschätzung bleibt untersagt — das ist für KI der wichtigste Punkt: Der Kernmechanismus,
    mit dem der CAADCA Empfehlungssysteme hätte erfassen sollen, ist nicht anwendbar.'
  - 'Was wirksam werden darf, ist Datenschutzrecht im engeren Sinn (Voreinstellungen, Standortdaten, Hinweise),
    nicht Inhalts- oder Algorithmensteuerung. Die US-Verfassung zieht damit dieselbe Grenze wie bei den
    Deepfake-Gesetzen: Datenverarbeitung ja, Inhaltsgestaltung nein.'
  - 'Altersschätzung zurückverwiesen: Sie ist nicht endgültig gebilligt. Ihre Umsetzung mit biometrischen
    Mitteln würde in Kalifornien zugleich CIPA- und CCPA-Fragen aufwerfen.'
  - Der britische Age Appropriate Design Code, der Vorbild war, gilt unangefochten — die Divergenz beruht
    allein auf dem First Amendment.
  dokumente:
  - datum: 2026-03-12
    typ: uebersicht
    titel: Ninth Circuit Issues Mixed Ruling on California Age-Appropriate Design Code Act
    url: https://www.hklaw.com/en/insights/publications/2026/03/ninth-circuit-issues-mixed-ruling-on-california-age-appropriate-design
    sprache: en
    urheber: Holland & Knight
    verifiziert: false
    notiz: Maßgeblich für die Aufteilung zwischen weiter untersagten und freigegebenen Vorschriften.
  - datum: 2026-03-30
    typ: uebersicht
    titel: 'NetChoice v. Bonta: Ninth Circuit Narrows Injunction Against California''s Age-Appropriate
      Design Code Act'
    url: https://www.cooley.com/news/insight/2026/2026-03-30-netchoice-v-bonta-ninth-circuit-narrows-injunction-against-californias-ageappropriate-design-code-act
    sprache: en
    urheber: Cooley LLP
    verifiziert: false
    notiz: Zweite Auswertung.
  bedeutung_eu_anbieter: 'Wer den britischen Children''s Code und Art. 28 DSA umgesetzt hat, erfüllt die
    freigegebenen Teile des CAADCA weitgehend. Zu beachten ist, dass die Altersschätzung in Kalifornien
    rechtlich unsicher bleibt und ihre biometrische Umsetzung eigene Risiken nach CIPA und dem Illinois
    BIPA schafft. Der Vergleich mit dem brasilianischen ECA Digital ist aufschlussreich: Dort ist genau
    das verbindlich, was in Kalifornien verfassungsrechtlich blockiert ist.

    '
  offene_punkte:
  - Ergebnis der Zurückverweisung zur Altersschätzung.
  - Ob Kalifornien die unbestimmten Begriffe nachbessert.
  - 'Wirksamkeitsdatum des CAADCA (01.07.2024) nicht am Normtext geprüft: leginfo.legislature.ca.gov ist
    für WebFetch durch robots.txt gesperrt und im Browser für diese Sitzung nicht freigegeben. Zu prüfen
    ist die operative-date-Klausel in Cal. Civ. Code § 1798.99.28 ff. Zu beachten: die Vollziehung ist
    durch NetChoice v. Bonta teilweise einstweilen untersagt.'
  monitoring_quellen:
  - https://netchoice.org/netchoice-v-bonta/
  bezug_regelwerke:
  - us-ca-cipa
  - us-il-bipa
  - br-eca-digital
  - uk-osa-2023
  - dsa-2022-2065
  letzte_pruefung: 2026-09-05
  pruefvermerk:
  - 'Bestaetigt. Zu unterscheiden sind ''effective date'' (01.01.2023, allgemeine kalifornische Regel)
    und ''operative date'' (01.07.2024, ausdruecklich in § 1798.99.31(d)). Eingetragen ist richtig der
    operative Termin. Status teilanwendbar bestaetigt: Die einstweilige Verfuegung in NetChoice v. Bonta
    wurde am 12.03.2026 vom Ninth Circuit nur teilweise aufgehoben; die Pflicht zur Datenschutz-Folgenabschaetzung
    bleibt ausser Vollzug.'
- id: us-tn-elvis-act
  jurisdiktion: us
  kurztitel: ELVIS Act (Tennessee)
  offizieller_titel: Ensuring Likeness Voice and Image Security Act of 2024
  fundstelle: Tenn. Code Ann. §§ 47-25-1101 ff.
  verfahrensnummer: HB 2091 / SB 2096 (2024)
  status: anwendbar
  status_detail: 'Am 21.03.2024 ausgefertigt, in Kraft seit dem 01.07.2024. Das erste US-Landesgesetz,
    das die Stimme ausdrücklich in das Recht am eigenen Bild und Namen einbezieht und die Bereitstellung
    von WERKZEUGEN zur Nachbildung unter Haftung stellt.

    '
  kurzbeschreibung: 'Der ELVIS Act erweitert das Persönlichkeitsrecht Tennessees um die Stimme und definiert
    sie als Klang, der einer bestimmten Person erkennbar zuzuordnen ist — unabhängig davon, ob es sich
    um die echte Stimme oder um eine Nachbildung handelt. Neu und international einmalig ist die Haftung
    desjenigen, der Algorithmen, Software oder technische Dienste bereitstellt, deren Hauptzweck oder
    Hauptfunktion die Erzeugung des Bildnisses, der Stimme oder des Erscheinungsbildes einer bestimmten,
    identifizierbaren Person ist. Verstöße können zivilrechtliche Ansprüche und eine Strafbarkeit als
    Vergehen auslösen. Das Gesetz enthält Ausnahmen nach Art des fair use für Nachrichten, Kritik, Kommentar
    und Satire.

    '
  inkrafttreten:
    datum: 2024-07-01
    verifiziert: false
    quelle: https://www.proskauer.com/blog/the-king-is-back-in-the-digital-era-the-elvis-act-generative-ai-and-right-of-publicity
  anwendungsdaten:
  - datum: 2024-07-01
    was_gilt: Vollständige Anwendung einschließlich der Werkzeughaftung.
    verifiziert: false
    quelle: https://www.proskauer.com/blog/the-king-is-back-in-the-digital-era-the-elvis-act-generative-ai-and-right-of-publicity
  themenachsen:
  - content
  - haftung
  - urheberrecht
  - grundrechte
  regelungsschwerpunkte:
  - 'Werkzeughaftung: Wer ein Werkzeug bereitstellt, dessen Hauptzweck die Nachbildung einer BESTIMMTEN
    Person ist, haftet. Allzweckmodelle sind nach dem Wortlaut nicht erfasst — die Abgrenzung ''primary
    purpose'' ist ungeklärt und der praktische Streitpunkt.'
  - Stimme als eigenständiges Schutzgut, unabhängig von der Verwendung einer echten Aufnahme. Das schließt
    die Lücke, an der urheberrechtliche Ansprüche gegen Stimmklonung scheitern.
  - 'Doppelte Sanktion: zivilrechtlicher Anspruch und Strafbarkeit als Vergehen — ungewöhnlich für ein
    Persönlichkeitsrecht.'
  - 'Systematischer Bezug: Der ELVIS Act ist das Landesvorbild für den bundesrechtlichen NO FAKES Act,
    der die Werkzeughaftung übernimmt. Wo die EU über Art. 50 KI-VO kennzeichnet, schützt Tennessee über
    ein Ausschließlichkeitsrecht.'
  dokumente:
  - datum: 2024-04-01
    typ: uebersicht
    titel: 'The King is Back (in the Digital Era): The ELVIS Act, Generative AI and Right of Publicity'
    url: https://www.proskauer.com/blog/the-king-is-back-in-the-digital-era-the-elvis-act-generative-ai-and-right-of-publicity
    sprache: en
    urheber: Proskaür Rose LLP
    verifiziert: false
    notiz: Quelle für Ausfertigungs- und Inkrafttretensdatum, Stimmdefinition und Werkzeughaftung.
  - datum: 2024-04-01
    typ: uebersicht
    titel: Tennessee, All Shook Up Over AI-Generated Voice Replicas, Passes ELVIS Act
    url: https://www.dwt.com/blogs/artificial-intelligence-law-advisor/2024/04/tennessee-elvis-act-ai-voice-replica
    sprache: en
    urheber: Davis Wright Tremaine LLP
    verifiziert: false
    notiz: Zweite Auswertung mit Blick auf die Musikindustrie.
  bedeutung_eu_anbieter: 'Wer Stimmklonung anbietet, muss den Anwendungsbereich prüfen: Ein Dienst, der
    auf die Nachbildung bestimmter Personen zugeschnitten ist — Prominentenstimmen, Sprecherprofile —,
    fällt unter die Werkzeughaftung; ein allgemeines Text-zu-Sprache-Modell nach dem Wortlaut nicht. In
    Europa gibt es kein Äquivalent: Der Schutz erfolgt über das allgemeine Persönlichkeitsrecht, § 22
    KUG und Art. 82 DSGVO, ohne Anspruch gegen den Werkzeuganbieter. Der ELVIS Act ist deshalb das schärfste
    Instrument gegen Stimmdeepfakes, das ein europäischer Anbieter derzeit zu beachten hat.

    '
  offene_punkte:
  - Auslegung von 'primary purpose or function' bei Allzweckmodellen mit Stimmklonfunktion.
  - Verhältnis zum bundesrechtlichen NO FAKES Act.
  monitoring_quellen:
  - https://rightofpublicityroadmap.com/state_page/tennessee/
  bezug_regelwerke:
  - us-no-fakes-act
  - us-take-it-down-act
  - us-ca-ab1008
  - in-it-rules-2021
  letzte_pruefung: 2026-09-01
- id: uk-equality-act-2010
  jurisdiktion: uk
  kurztitel: Equality Act 2010
  offizieller_titel: Equality Act 2010
  fundstelle: 2010 c. 15
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht und die praktisch wichtigste britische Grundlage gegen algorithmische
    Diskriminierung. Ein KI-spezifisches Antidiskriminierungsgesetz gibt es nicht und ist nicht geplant;
    die Regulierungsstrategie des Vereinigten Königreichs verweist ausdrücklich auf die bestehenden Aufsichts-
    und Gleichbehandlungsregeln.

    '
  kurzbeschreibung: 'Der Equality Act 2010 schützt neun geschützte Merkmale (Alter, Behinderung, Geschlechtsumwandlung,
    Ehe und eingetragene Partnerschaft, Schwangerschaft und Mutterschaft, Rasse, Religion oder Weltanschauung,
    Geschlecht, sexuelle Ausrichtung). Für KI sind drei Vorschriften maßgeblich: s. 13 (unmittelbare Diskriminierung),
    s. 19 (mittelbare Diskriminierung durch eine scheinbar neutrale Vorschrift, Kriterium oder Praxis
    — die Norm, unter die ein diskriminierendes Modell fällt) und s. 149 (Public Sector Equality Duty:
    die Pflicht öffentlicher Stellen, bei der Wahrnehmung ihrer Aufgaben Diskriminierung entgegenzuwirken
    und Chancengleichheit zu fördern). Hinzu kommt die Pflicht zu angemessenen Vorkehrungen für Menschen
    mit Behinderungen (ss. 20, 21). Die Beweislast kehrt sich nach s. 136 um, sobald der Kläger Tatsachen
    vorträgt, aus denen auf Diskriminierung geschlossen werden kann.

    '
  inkrafttreten:
    datum: 2010-10-01
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/2010/2317/article/2/made
    fundstelle_norm: 'Art. 2(1) der Equality Act 2010 (Commencement No. 4 ...) Order 2010, SI 2010/2317:
      "the relevant provisions of the 2010 Act ... come into force on 1st October 2010" (Ermächtigung:
      sec. 216 Equality Act 2010).'
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - arbeit
  - sektor-oeffentlich
  - haftung
  regelungsschwerpunkte:
  - 's. 149 (Public Sector Equality Duty) ist die schärfste Waffe gegen Verwaltungs-KI: Sie verlangt eine
    BEWUSSTE Auseinandersetzung mit den Gleichbehandlungsfolgen vor der Entscheidung. In R (Bridges) v
    South Wales Police (2020) hat der Court of Appeal die Pflicht verletzt gesehen, weil die Polizei nicht
    geprüft hatte, ob das Gesichtserkennungssystem nach Geschlecht oder Hautfarbe unterschiedlich zuverlässig
    arbeitet — dass entsprechende Nachweise fehlten, entlastete gerade nicht.'
  - s. 19 (mittelbare Diskriminierung) erfasst algorithmische Auswahl, ohne dass ein geschütztes Merkmal
    im Modell enthalten sein muss; entscheidend ist die Wirkung. Rechtfertigung ist möglich, verlangt
    aber Verhältnismäßigkeit im Einzelfall.
  - 's. 136 (Beweislastumkehr) ist der praktische Hebel: Statistische Auffälligkeiten in den Ergebnissen
    genügen, um die Darlegungslast auf den Betreiber zu verlagern. Das kompensiert die fehlende Transparenzpflicht.'
  - Die Kombination aus s. 149 und dem DPA 2018 hat 2020 zur Rücknahme der Visa-Streaming-Software des
    Innenministeriums geführt — der bislang wirksamste britische Angriff auf ein Verwaltungssystem.
  - Es fehlt eine Vorschrift, die den ANBIETER eines Systems verpflichtet. Der Equality Act adressiert
    den Arbeitgeber, Dienstleister und die öffentliche Stelle — der Modellhersteller ist nur mittelbar
    über Vertrag erreichbar. Anhang III Nr. 4 KI-VO knüpft dagegen beim Anbieter an.
  dokumente:
  - datum: 2010-04-08
    typ: konsolidiert
    titel: Equality Act 2010 (2010 c. 15)
    url: https://www.legislation.gov.uk/ukpga/2010/15/contents
    sprache: en
    urheber: The National Archives
    verifiziert: false
    notiz: Amtliche konsolidierte Fassung;
  bedeutung_eu_anbieter: 'Wer Auswahl-, Bewertungs- oder Erkennungssysteme im Vereinigten Königreich vertreibt,
    sollte davon ausgehen, dass der Kunde Nachweise zur Fehlerverteilung über geschützte Merkmale verlangen
    wird — öffentliche Stellen müssen sie nach s. 149 haben. Wer die Anforderungen des Art. 10 Abs. 2
    lit. f und g KI-VO (Untersuchung auf Verzerrungen) erfüllt und dokumentiert, kann genau diese Nachweise
    liefern. Das ist der Punkt, an dem KI-VO-Compliance im britischen Markt zum Vertriebsvorteil wird.

    '
  offene_punkte:
  - Ob die Equality and Human Rights Commission KI-spezifische Leitlinien erlässt.
  - Ob die Regierung eine Pflicht für Anbieter (statt nur für Nutzer) einführt.
  monitoring_quellen:
  - https://www.equalityhumanrights.com/
  - https://www.legislation.gov.uk/ukpga/2010/15/contents
  bezug_regelwerke:
  - uk-dpa-2018
  - uk-gdpr
  - uk-public-authority-adm-bill
  - ki-vo-2024-1689
  letzte_pruefung: 2026-09-05
- id: uk-patents-act-1977
  jurisdiktion: uk
  kurztitel: Patents Act 1977
  offizieller_titel: Patents Act 1977
  fundstelle: 1977 c. 37
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Durch Thaler gegen Comptroller-General (UKSC, 20.12.2023) ist höchstrichterlich
    geklärt, dass ein Erfinder im Sinne des s. 7 eine natürliche Person sein muss und ein KI-System deshalb
    nicht als Erfinder benannt werden kann; ein Anspruch des Eigentümers der Maschine auf die Erteilung
    besteht nicht.

    '
  kurzbeschreibung: 'Für KI sind zwei Regelungskomplexe maßgeblich. Erstens die Erfinderschaft: s. 7 bestimmt,
    wer ein Patent erhalten kann, s. 13 verlangt die Benennung des Erfinders. Der Supreme Court hat 2023
    entschieden, dass "inventor" den "deviser" der Erfindung meint und dies eine natürliche Person voraussetzt;
    die Anmeldung galt als zurückgenommen. Zweitens die Patentierbarkeit: s. 1(2) schließt mathematische
    Methoden und Computerprogramme "als solche" aus; die britische Praxis wendet den Aerotel/Macrossan-Test
    an, der strenger ist als der Ansatz des Europäischen Patentamts. Das Intellectual Property Office
    hat seine Leitlinien für KI-Erfindungen nach dem Verfahren Emotional Perception AI (Court of Appeal
    2024) angepasst.

    '
  inkrafttreten:
    datum: 1977-12-31
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/1977/2090/made
    fundstelle_norm: 'Erste Stufe: Patents Act 1977 (Commencement No. 1) Order 1977, SI 1977/2090 (auf
      Grundlage sec. 132(5) Patents Act 1977) — sec. 84, 85, 114 und 130 traten am 31.12.1977 in Kraft.
      Die praktisch massgeblichen sec. 1 bis 59 nebst Schedules folgten am 01.06.1978 (SI 1978/586).'
  anwendungsdaten:
  - datum: 1978-06-01
    was_gilt: Hauptteil des Patents Act 1977 (sec. 1 bis 52, 53 ohne Abs. 1, sec. 54 bis 59 und weitere
      nebst Schedules 1-6) tritt in Kraft — Art. 2 der Patents Act 1977 (Commencement No. 2) Order 1978,
      SI 1978/586, auf Grundlage sec. 132(5).
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/1978/586/made
  - datum: 2023-12-20
    was_gilt: 'Thaler gegen Comptroller-General, [2023] UKSC 49: KI kann nicht Erfinder sein.'
    verifiziert: false
    quelle: https://www.legislation.gov.uk/ukpga/1977/37/contents
  themenachsen:
  - urheberrecht
  - marktzugang
  - gpai
  regelungsschwerpunkte:
  - 's. 7 und 13: Erfinder muss natürliche Person sein (Thaler, UKSC 2023). Dieselbe Linie in Australien
    (Full Court 2022), den USA (Fed. Cir. 2022) und Indien; anders — und bis heute vereinzelt — Südafrika.'
  - 's. 1(2): Ausschluss von Computerprogrammen ''als solche''. Der britische Test (technischer Beitrag
    nach Aerotel) ist restriktiver als die EPA-Praxis; für neuronale Netze hat der Court of Appeal 2024
    in Emotional Perception die Ausschlusswirkung bejaht.'
  - 'Praktische Folge: Wer eine KI-gestützte Erfindung anmeldet, benennt die beteiligten Menschen als
    Erfinder und beschreibt den technischen Beitrag der Anwendung, nicht die Architektur.'
  dokumente:
  - datum: 1977-07-29
    typ: konsolidiert
    titel: Patents Act 1977 (1977 c. 37)
    url: https://www.legislation.gov.uk/ukpga/1977/37/contents
    sprache: en
    urheber: The National Archives
    verifiziert: false
    notiz: Amtliche konsolidierte Fassung;
  bedeutung_eu_anbieter: 'Keine Abweichung von der europäischen Praxis bei der Erfinderbenennung; Unterschiede
    bestehen bei der Patentierbarkeit softwarebezogener Erfindungen, wo das Vereinigte Königreich strenger
    ist als das EPA. Für ein europäisches Portfolio bedeutet das getrennte Anspruchsfassungen.

    '
  offene_punkte:
  - Ob das IPO nach Emotional Perception seine Leitlinien erneut ändert.
  monitoring_quellen:
  - https://www.gov.uk/government/organisations/intellectual-property-office
  bezug_regelwerke:
  - uk-cdpa-1988
  - au-patents-act-1990
  - in-patents-act-1970
  - us-uspto-erfinderschaft
  letzte_pruefung: 2026-09-05
- id: uk-tma-1994
  jurisdiktion: uk
  kurztitel: Trade Marks Act 1994
  offizieller_titel: Trade Marks Act 1994
  fundstelle: 1994 c. 26
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Seit dem Urteil Getty Images gegen Stability AI (High Court, 04.11.2025)
    ist es die einzige Anspruchsgrundlage, mit der ein Rechteinhaber in einem britischen KI-Verfahren
    durchgedrungen ist: Die urheberrechtlichen Ansprüche scheiterten, die markenrechtlichen hatten teilweise
    Erfolg, weil das Modell Wasserzeichen reproduzierte.

    '
  kurzbeschreibung: 'Der Trade Marks Act 1994 setzt das europäische Markenrecht in britisches Recht um.
    Für KI sind die drei Verletzungstatbestände des s. 10 maßgeblich: s. 10(1) Doppelidentität, s. 10(2)
    Verwechslungsgefahr, s. 10(3) Ausnutzung oder Beeinträchtigung der Unterscheidungskraft oder Wertschätzung
    bekannter Marken. Erzeugt ein generatives Modell Ausgaben, die eine geschützte Marke — typischerweise
    ein Wasserzeichen oder Logo — enthalten, kann darin eine Benutzung im geschäftlichen Verkehr liegen.
    Daneben steht der ungeschriebene Tatbestand des passing off.

    '
  inkrafttreten:
    datum: 1994-10-31
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/1994/2550/made
    fundstelle_norm: 'Art. 2 der Trade Marks Act 1994 (Commencement) Order 1994, SI 1994/2550: "All the
      provisions of the Trade Marks Act 1994 ... shall come into force on 31st October 1994" (Ermaechtigung:
      sec. 109 Trade Marks Act 1994).'
  anwendungsdaten:
  - datum: 2025-11-04
    was_gilt: 'Getty Images gegen Stability AI, IL-2023-000007: markenrechtliche Ansprüche nach ss. 10(1),
      10(2), 10(3) teilweise erfolgreich, urheberrechtliche Ansprüche abgewiesen.

      '
    verifiziert: false
    quelle: https://www.legislation.gov.uk/ukpga/1994/26/contents
  themenachsen:
  - urheberrecht
  - content
  - wettbewerb
  - gpai
  regelungsschwerpunkte:
  - Die Reproduktion von Wasserzeichen durch ein Bildmodell ist der praktisch erfolgreichste Angriffspunkt
    gegen generative Systeme im britischen Recht — nicht die Vervielfältigung des Werkes, sondern die
    Wiedergabe des Herkunftszeichens.
  - s. 10(3) erfasst auch Fälle ohne Verwechslungsgefahr, wenn die Wertschätzung der bekannten Marke beeinträchtigt
    wird — bei fehlerhaften Ausgaben mit fremdem Logo naheliegend.
  - 'Konsequenz für Anbieter: Trainingsdaten von Wasserzeichen und Logos zu bereinigen ist kein urheberrechtliches,
    sondern ein markenrechtliches Gebot.'
  - 'Kein europäisches Sonderrecht nötig: Das Markenrecht wirkt technologieneutral und war 2025 wirksamer
    als jede KI-spezifische Norm.'
  dokumente:
  - datum: 1994-07-21
    typ: konsolidiert
    titel: Trade Marks Act 1994 (1994 c. 26)
    url: https://www.legislation.gov.uk/ukpga/1994/26/contents
    sprache: en
    urheber: The National Archives
    verifiziert: false
    notiz: Amtliche konsolidierte Fassung;
  bedeutung_eu_anbieter: 'Wer Bildmodelle trainiert oder vertreibt, sollte die Ausgabe auf fremde Kennzeichen
    prüfen und Wasserzeichen aus Trainingsdaten entfernen. Der Anspruch besteht in nahezu identischer
    Form nach Art. 9 UMV; das britische Verfahren zeigt nur, dass er praktisch durchsetzbar ist, wo das
    Urheberrecht versagt.

    '
  offene_punkte:
  - Ausgang des Rechtsmittels in Getty gegen Stability.
  monitoring_quellen:
  - https://www.legislation.gov.uk/ukpga/1994/26/contents
  bezug_regelwerke:
  - uk-cdpa-1988
