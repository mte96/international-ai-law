  regelungsschwerpunkte:
  - 'WARUM ES NOCH KEIN GESETZ IST — Grund 1: Der Senat hat schnell und einvernehmlich beschlossen, das
    Abgeordnetenhaus arbeitet langsam und konfliktreich. Der Berichterstatter setzte auf zehn thematische
    Anhörungen, fünf Regionalseminare und ein internationales Seminar ab dem 10.06.2025; der Bericht war
    für den 25.11.2025 angekündigt.'
  - 'WARUM ES NOCH KEIN GESETZ IST — Grund 2: Wahljahr 2026. Bereits im Mai 2025 warnten Ausschussmitglieder,
    der Wahlkalender werde eine Entscheidung weiter verzögern.'
  - 'WARUM ES NOCH KEIN GESETZ IST — Grund 3: Verknüpfung mit anderen Vorhaben. Das Steuerregime für Rechenzentren
    (Redata, MP 1318/2025) lief am 25.02.2026 aus, weil der Senat nicht abstimmte; die Blockade zwischen
    den Kammern hat den Zeitplan des KI-Gesetzes mitgerissen.'
  - 'WARUM ES NOCH KEIN GESETZ IST — Grund 4: Streit über die Aufsicht. Erst der Regierungsentwurf vom
    09.12.2025 hat die Governance-Frage — wer reguliert, ANPD oder Sektoraufsichten — durch das SIA-Modell
    gelöst; bis dahin war sie der ''sensibelste Punkt'' des Vorhabens.'
  - 'Inhaltlich streitig geblieben: Vergütung für die Nutzung geschützter Werke im Training, Strenge der
    Hochrisikopflichten, biometrische Fernidentifizierung durch Sicherheitsbehörden (nach der Coalizão
    Direitos na Rede faktisch freigegeben, obwohl formal als übermäßiges Risiko eingestuft), gestrichene
    arbeitsrechtliche Mindestgarantien.'
  - 'Die brasilianische Konstruktion unterscheidet sich von der KI-VO in einem Punkt grundlegend: Sie
    ist als Rahmengesetz mit sektoraler Ausfüllung angelegt (SIA-Koordination, ANPD nur residual zuständig),
    nicht als unmittelbar anwendbare Produktregulierung.'
