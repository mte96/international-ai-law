  - datum: 2026-08-19
    was_gilt: 'Veröffentlichung der Testmethodik: sechs Zyklen, davon der erste vorbereitend; Schwerpunkte
      Risikosteuerung, Transparenz, Erklärbarkeit und Schutz personenbezogener Daten Minderjähriger.

      '
    verifiziert: true
    quelle: https://www.gov.br/anpd/pt-br/assuntos/noticias/anpd-publica-metodologia-de-testagem-do-sandbox-regulatorio-em-inteligencia-artificial-e-protecao-de-dados
  themenachsen:
