  bedeutung_eu_anbieter: 'Wer Software an kanadische Bundesbehörden verkauft, liefert nicht nur ein Produkt,
    sondern das Material für eine veröffentlichungspflichtige Folgenabschätzung: Systembeschreibung, Datenherkunft,
    Bias-Tests, Erklärbarkeit, Peer-Review-Fähigkeit. Wer eine Konformitätsdokumentation nach Art. 11
    und Anhang IV KI-VO besitzt, hat den größten Teil beisammen; was in Europa fehlt, ist die Bereitschaft
    zur Veröffentlichung. Zweite Konsequenz: Weil auch Entscheidungsunterstützung erfasst ist, genügt
