- id: br-codigo-penal
  jurisdiktion: br
  kurztitel: Brasilianisches Strafgesetzbuch
  offizieller_titel: Código Penal — Decreto-Lei nº 2.848, de 7 de dezembro de 1940
  fundstelle: Decreto-Lei nº 2.848/1940; Art. 216-B eingefügt durch die Lei nº 13.772/2018, Art. 218-C
    durch die Lei nº 13.718/2018, Art. 147-A durch die Lei nº 14.132/2021, Art. 146-A durch die Lei nº
    14.811/2024
  status: anwendbar
  status_detail: 'Brasilien hat keinen KI-spezifischen Straftatbestand. Der einzige Tatbestand, der synthetische
    Darstellungen unmittelbar erfasst, ist der parágrafo único des Art. 216-B von 2018 — er spricht von
    montagem und nennt weder Deepfakes noch künstliche Intelligenz. Die Lei nº 14.811 vom 12.01.2024,
    die häufig als Deepfake-Gesetz bezeichnet wird, enthält keine solche Regelung: Sie fügt den Cybermobbing-Tatbestand
    des Art. 146-A ein und ändert das Kinder- und Jugendstatut. Die Strafbarkeitslücke bei Deepfakes gegen
    Erwachsene außerhalb des sexuellen Bereichs wird in Brasilien seit 2026 offen diskutiert.'
  kurzbeschreibung: Für KI-erzeugte Inhalte sind sieben Tatbestände einschlägig. Art. 216-B parágrafo
    único erfasst die Bildmontage zur Einfügung einer Person in eine Szene mit Nacktheit oder sexueller
    Handlung — mit sechs Monaten bis einem Jahr die mildeste Deepfake-Strafdrohung der hier verglichenen
    Rechtsordnungen. Art. 218-C erfasst die Verbreitung solchen Materials mit einem bis fünf Jahren. Art.
    146-A stellt Cybermobbing unter Strafe. Art. 138 bis 140 schützen die Ehre, Art. 147-A erfasst die
    Nachstellung im Internet, Art. 171 § 2-A den elektronischen Betrug.
  inkrafttreten:
    datum: 1942-01-01
    verifiziert: true
    quelle: https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm
    fundstelle_norm: 'DISPOSIÇÕES FINAIS, Art. 361: ''Este Código entrará em vigor no dia 1º de janeiro
      de 1942.'' Decreto-Lei nº 2.848 vom 07.12.1940, DOU vom 31.12.1940, berichtigt am 03.01.1941'
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Der Vergleich der Strafdrohungen für dieselbe Handlung ist der aussagekräftigste Befund dieser Erhebung:
    Brasilien sechs Monate bis ein Jahr (Art. 216-B parágrafo único), Korea bis sieben Jahre (Art. 14-2
    Abs. 1 Sexualstrafsondergesetz), Japan überhaupt kein Sondertatbestand.'
  - Die Lei nº 14.811/2024 enthält entgegen verbreiteter Darstellung keine KI- oder Deepfake-Regelung;
    sie fügt Art. 146-A ein und ändert die Art. 240 und 241 des Kinder- und Jugendstatuts.
  - Für Deepfakes gegen Erwachsene ohne sexuellen Bezug gibt es keinen Tatbestand; erfasst wird nur, was
    ohnehin Ehrverletzung, Nachstellung oder Betrug ist.
  dokumente:
