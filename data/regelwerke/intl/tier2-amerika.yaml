- id: au-nsw-pn-sc-gen-23
  jurisdiktion: au
  kurztitel: Practice Note SC Gen 23 (NSW) — generative KI vor Gericht
  offizieller_titel: 'Practice Note SC Gen 23 — Use of Generative Artificial Intelligence (GenAI), Supreme
    Court of New South Wales

    '
  fundstelle: Practice Note SC Gen 23; gestützt auf die inhärente Verfahrensregelungsbefugnis und die
    Uniform Civil Procedure Rules 2005 (NSW)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Erlassen am 21.11.2024, ursprünglich mit Wirkung zum 03.02.2025, geändert durch die
    Fassung vom 28.01.2025; zum 01.09.2026 in Kraft. Der Chief Justice hat bis zum 18.12.2025 zur Überarbeitung
    der Klausel 26 konsultiert. Die weltweit strengste gerichtliche KI-Regelung.

    '
  kurzbeschreibung: 'Die Praxisanweisung VERBIETET den Einsatz generativer KI bei der Erstellung des Inhalts
    von eidesstattlichen Versicherungen, Zeugenaussagen, Leumundszeugnissen und anderen Beweismitteln
    sowie von Sachverständigengutachten. Für Schriftsätze, Zusammenfassungen und Schriftsatzverzeichnisse
    ist der Einsatz unter Überprüfungspflicht zulässig; sämtliche Zitate und Fundstellen sind gegen Primärquellen
    zu prüfen. Vertrauliche und mit Veröffentlichungsverbot belegte Informationen dürfen nicht in öffentlich
    zugängliche Systeme eingegeben werden.

    '
  inkrafttreten:
    datum: 2025-02-03
    verifiziert: true
    quelle: https://supremecourt.nsw.gov.au/practice-procedure/generative-artificial-intelligence.html
    fundstelle_norm: 'Practice Note SC Gen 23, erlassen vom Chief Justice gestuetzt auf die inhaerente
      Verfahrensregelungsbefugnis und die Uniform Civil Procedure Rules 2005 (NSW). Die Gerichtsseite
      weist aus: ''Practice Note SC Gen 23 was amended on 28 January 2025'' und ''Announcement of minor
      amendments to the AI Practice Note which came into effect on 3 February 2025'''
  anwendungsdaten:
  - datum: 2025-02-03
    was_gilt: Geltungsbeginn in der Fassung vom 28.01.2025.
    verifiziert: false
    quelle: https://supremecourt.nsw.gov.au/documents/Practice-and-Procedure/Practice-Notes/general/current/PN_SC_Gen_23.pdf
  - datum: 2025-12-18
    was_gilt: Ende der Konsultation des Chief Justice zur Überarbeitung der Klausel 26.
    verifiziert: false
    quelle: https://supremecourt.nsw.gov.au/practice-procedure/generative-artificial-intelligence.html
  themenachsen:
  - berufsrecht
  - governance
  - content
  regelungsschwerpunkte:
  - Das Verbot für Zeugenaussagen und Sachverständigengutachten ist ABSOLUT und nicht durch Offenlegung
    heilbar — anders als in England, wo die Judiciary-Leitlinien nur zur Sorgfalt anhalten, und anders
    als beim Federal Court, der auf Offenlegung setzt.
  - 'Praktische Folge: Der Einsatz eines KI-gestützten Diktier- oder Zusammenfassungswerkzeugs bei der
    Erstellung einer Zeugenaussage ist ein Regelverstoß, unabhängig von der Richtigkeit des Ergebnisses.'
  - Zulässig bleibt der Einsatz bei Schriftsätzen unter Überprüfungspflicht — die Regel unterscheidet
    also zwischen Beweismitteln (Authentizität) und Rechtsausführungen (Richtigkeit).
  - Diese Unterscheidung ist der begrifflich sauberste Ansatz unter den Gerichtsregeln weltweit und findet
    sich inzwischen in der GPN-AI des Federal Court und in SC GEN 25 (Victoria) wieder — dort jedoch als
    Warnung, nicht als Verbot.
  dokumente:
  - datum: 2025-01-28
    typ: leitlinie
    titel: Practice Note SC Gen 23 — Use of Generative Artificial Intelligence (GenAI)
    url: https://supremecourt.nsw.gov.au/documents/Practice-and-Procedure/Practice-Notes/general/current/PN_SC_Gen_23.pdf
    sprache: en
    urheber: Supreme Court of New South Wales
    verifiziert: false
    notiz: Amtlicher Text der geltenden Fassung. Aus dem im Bestand als verifiziert geführten Eintrag au-2024-nsw-pn-sc-gen-23
      übernommen;
  - datum: 2025-01-28
    typ: uebersicht
    titel: Generative Artificial Intelligence — Informationsseite des Gerichts
    url: https://supremecourt.nsw.gov.au/practice-procedure/generative-artificial-intelligence.html
    sprache: en
    urheber: Supreme Court of New South Wales
    verifiziert: false
    notiz: Fassungsgeschichte und Konsultationshinweise. Aus dem Bestandseintrag übernommen, nicht abgerufen.
  bedeutung_eu_anbieter: 'Für Anbieter von Kanzleisoftware die schärfste Anforderung weltweit: Ein Werkzeug,
    das bei der Erstellung von Zeugenaussagen mitwirkt, ist in New South Wales nicht einsetzbar — auch
    nicht als Transkriptions- oder Zusammenfassungshilfe. Produktseitig folgt daraus die Notwendigkeit,
    Arbeitsschritte nach Dokumenttyp zu trennen und abschaltbar zu machen.

    '
  offene_punkte:
  - Ergebnis der Konsultation zur Klausel 26.
  monitoring_quellen:
  - https://supremecourt.nsw.gov.au/practice-procedure/generative-artificial-intelligence.html
  bezug_regelwerke:
  - au-fedcourt-gpn-ai
  - au-vic-sc-ai-guidelines
  - au-gerichte-ki-2026
  - br-cnj-res-615-2025
  letzte_pruefung: 2026-09-01
  pruefvermerk:
  - Bestaetigt an der amtlichen Gerichtsseite. Der 21.11.2024 ist das Erlassdatum, der 28.01.2025 das
    Datum der Aenderungsfassung, der 03.02.2025 das Inkrafttreten — eingetragen ist richtig das Inkrafttreten.
    Die Practice Note gilt fort; cl. 26 sieht periodische Ueberpruefung vor, die Konsultationsfrist des
    Chief Justice lief bis 18.12.2025, eine Neufassung ist bis 06.09.2026 nicht ergangen (Seitenstand
    23.03.2026).
- id: au-fedcourt-gpn-ai
  jurisdiktion: au
  kurztitel: Federal Court of Australia — GPN-AI
  offizieller_titel: 'Use of Generative Artificial Intelligence Practice Note (GPN-AI), Federal Court
    of Australia

    '
  fundstelle: GPN-AI; gestützt auf s. 37M Federal Court of Australia Act 1976 (Cth) und die Central Practice
    Note
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Erlassen am 15.04.2026, in Kraft seit dem 16.04.2026. Bis dahin hatte der Federal Court
    nur eine Konsultationsfassung. Für bundesweite Verfahren — Migrationsrecht, Wettbewerbsrecht, geistiges
    Eigentum, Native Title — ist sie die maßgebliche Regelung.

    '
  kurzbeschreibung: 'Die GPN-AI setzt auf Offenlegung und Authentizität statt auf Verbote. Offenzulegen
    ist der KI-Einsatz, wenn KI genutzt wurde, um Informationen zusammenzufassen oder zu analysieren,
    auf die sich ein Zeuge stützt, oder um als Beweismittel vorgelegte multimediale Inhalte zu erzeugen
    (Ziff. 4.10). Zeugenaussagen müssen die eigene Erinnerung, Kenntnis oder Erfahrung des Zeugen wiedergeben,
    Sachverständigengutachten die eigene Meinung und den eigenen Gedankengang des Sachverständigen — KI
    darf die Urheberschaft nicht verfälschen. Vertrauliche, privilegierte und mit Veröffentlichungsverbot
    belegte Informationen dürfen nicht in öffentlich zugängliche Systeme eingegeben werden. Verstöße können
    nachteilige Kostenentscheidungen und berufsrechtliche Folgen nach sich ziehen (Ziff. 5.1).

    '
  inkrafttreten:
    datum: 2026-04-16
    verifiziert: true
    quelle: https://www.fedcourt.gov.au/law-and-practice/practice-documents/practice-notes/gpn-ai
    fundstelle_norm: Use of Generative Artificial Intelligence Practice Note (GPN-AI), gestuetzt auf s.
      37M Federal Court of Australia Act 1976 (Cth) und die Central Practice Note; unterzeichnet 'D S
      Mortimer, Chief Justice, 16 April 2026'
  anwendungsdaten:
  - datum: 2026-04-16
    was_gilt: Vollständige Anwendung in allen Verfahren des Federal Court.
    verifiziert: false
    quelle: https://www.fedcourt.gov.au/law-and-practice/practice-documents/practice-notes/gpn-ai
  themenachsen:
  - berufsrecht
  - governance
  - content
  regelungsschwerpunkte:
  - 'Offenlegung statt Verbot: Der Federal Court verlangt Transparenz über den Einsatz und verbietet nur
    die Verfälschung der Urheberschaft. Das ist der Gegenentwurf zu New South Wales.'
  - 'Ziff. 4.10: Offenlegungspflicht bei Zusammenfassung oder Analyse von Material, auf das sich ein Zeuge
    stützt, und bei der Erzeugung multimedialer Beweismittel. Die zweite Alternative ist die einzige Regel
    eines australischen Gerichts, die synthetische Beweismittel ausdrücklich adressiert.'
  - 'Ziff. 5.1: Kostenentscheidungen und berufsrechtliche Folgen als Sanktion.'
  - 'Praktischer Konflikt: Wer in Federal Court und Supreme Court of New South Wales tätig ist, unterliegt
    zwei unvereinbaren Regimen. Der strengere (NSW) muss zum Kanzleistandard werden.'
  dokumente:
  - datum: 2026-04-15
    typ: leitlinie
    titel: Use of Generative Artificial Intelligence Practice Note (GPN-AI)
    url: https://www.fedcourt.gov.au/law-and-practice/practice-documents/practice-notes/gpn-ai
    sprache: en
    urheber: Federal Court of Australia
    verifiziert: false
    notiz: Amtlicher Text; Quelle für Erlass- und Geltungsdatum sowie die Ziffern 4.10 und 5.1. Aus dem im
      Bestand als verifiziert geführten Eintrag au-2026-fedcourt-gpn-ai übernommen;
  bedeutung_eu_anbieter: 'Die Offenlegungspflicht für KI-erzeugte multimediale Beweismittel ist die für
    Anbieter interessanteste Regel: Sie verlangt faktisch eine Herkunftskennzeichnung, die dem Gericht
    gegenüber belegbar ist. Wer C2PA-Herkunftsnachweise erzeugt, liefert genau das — und kann damit in
    australischen Verfahren einen Vorteil ausspielen, den Art. 50 KI-VO ab August 2026 ohnehin verlangt.

    '
  offene_punkte:
  - Ob andere Bundesgerichte (Federal Circuit and Family Court) nachziehen.
  monitoring_quellen:
  - https://www.fedcourt.gov.au/law-and-practice/practice-documents/practice-notes
  bezug_regelwerke:
  - au-nsw-pn-sc-gen-23
  - au-vic-sc-ai-guidelines
  - au-gerichte-ki-2026
  - br-cnj-res-615-2025
  letzte_pruefung: 2026-09-01
  pruefvermerk:
  - 'Bestaetigt am amtlichen Text der Practice Note. Praezisierung: Die Practice Note traegt selbst das
    Datum 16.04.2026 (Unterzeichnung durch die Chief Justice); die im Eintrag genannte Unterscheidung
    ''erlassen 15.04.2026, in Kraft 16.04.2026'' laesst sich am Dokument nicht nachvollziehen — massgeblich
    ist der 16.04.2026.'
- id: ca-privacy-act
  jurisdiktion: ca
  kurztitel: Privacy Act — kanadisches Datenschutzgesetz für Bundesbehörden
  offizieller_titel: An Act to extend the present laws of Canada that protect the privacy of individuals
    and that provide individuals with a right of access to personal information about themselves (Privacy
    Act)
  fundstelle: R.S.C. 1985, c. P-21
  status: anwendbar
  status_detail: In Kraft seit 1983, seither nur punktuell geändert. Das Gegenstück zu PIPEDA für die
    Bundesverwaltung; es gilt für die Behörden, für die auch die Directive on Automated Decision-Making
    gilt, und ist deren datenschutzrechtliche Grundlage (Abschnitt 6.3.5 der Richtlinie verweist ausdrücklich
    darauf).
  kurzbeschreibung: 'Der Privacy Act begrenzt Erhebung, Nutzung und Offenlegung personenbezogener Daten
    durch Bundesbehörden und gibt kanadischen Staatsbürgern und Personen mit Daueraufenthalt ein Auskunfts-
    und Berichtigungsrecht. Für den KI-Einsatz sind drei Normen entscheidend: s. 4 begrenzt die Erhebung
    auf Daten mit unmittelbarem Bezug zu einem Programm der Behörde, s. 6(2) verpflichtet zu Richtigkeit
    und Aktualität der zu Verwaltungszwecken genutzten Daten, s. 7 bindet die Nutzung an den Erhebungszweck.
    Durchgesetzt wird das Gesetz durch den Privacy Commissioner of Canada; Verwaltungsgeldbußen kennt
    es nicht.'
  inkrafttreten:
    datum: 1983-07-01
    verifiziert: false
    quelle: https://en.wikipedia.org/wiki/Privacy_Act_(Canada)
    fundstelle_norm: Privacy Act, urspruenglich erlassen als Schedule II des Access to Information Act,
      S.C. 1980-81-82-83, c. 111; in Kraft getreten am 01.07.1983. Heutige Fassung R.S.C. 1985, c. P-21
  themenachsen:
  - datenschutz
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 's. 4: Erhebung nur bei unmittelbarem Bezug zu einem Programm oder einer Tätigkeit der Behörde. Ein
    Modelltraining auf breiterer Datengrundlage als der Programmzweck ist danach unzulässig — die schärfste
    Schranke behördlicher KI in Kanada und zugleich die am wenigsten diskutierte.'
  - 's. 6(2): Pflicht, alle zumutbaren Schritte für Richtigkeit, Aktualität und Vollständigkeit zu unternehmen.
    Der Anknüpfungspunkt für die Kontrolle von Modellausgaben, die in Verwaltungsakten einfließen.'
  - s. 12(1) gewährt das Auskunftsrecht NUR Staatsbürgern und Personen mit Daueraufenthalt. Visumantragsteller
    im Ausland — die Betroffenen der Chinook-Verfahren — haben es nicht; deshalb wurde dort über Verfahrensfairness
    und nicht über Datenschutz gestritten.
  - Keine Verwaltungsgeldbußen, keine Anordnungsbefugnis des Commissioner. Die Durchsetzung läuft über
    Empfehlungen und gerichtliche Verfahren — dieselbe strukturelle Schwäche wie bei PIPEDA.
  dokumente:
  - datum: 2026-09-06
    typ: konsolidiert
    titel: Privacy Act (R.S.C., 1985, c. P-21) — konsolidierte Fassung
    url: https://laws-lois.justice.gc.ca/eng/acts/p-21/
    sprache: en
    urheber: Department of Justice Canada
    verifiziert: true
    notiz: Grundlage der erfassten Vorschriften ss. 3, 4, 5(1), 6(2), 7, 8(1), 8(2)(a), 12(1), 12(2).
  bezug_regelwerke:
  - ca-pipeda
  - ca-directive-adm
  - ca-aida-c27
  - ca-charter
  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - Bestaetigt. Die konsolidierte Fassung auf laws-lois.justice.gc.ca fuehrt fuer die vor 1985 erlassenen
    Gesetze kein urspruengliches Inkrafttretensdatum mehr; belegt ist der 01.07.1983. Das Gesetz gilt
    fort und wurde seither nur punktuell geaendert (Fassung mit Stand 21.06.2026).
- id: ca-charter
  jurisdiktion: ca
  kurztitel: Canadian Charter of Rights and Freedoms
  offizieller_titel: Canadian Charter of Rights and Freedoms, Part I of the Constitution Act, 1982, being
    Schedule B to the Canada Act 1982 (UK), 1982, c. 11
  fundstelle: Part I of the Constitution Act, 1982, Schedule B to the Canada Act 1982 (UK), 1982, c. 11
  status: anwendbar
  status_detail: In Kraft seit dem 17.04.1982 (s. 15 seit dem 17.04.1985). Verfassungsrang; Bundes- und
    Provinzrecht, das mit ihr unvereinbar ist, ist unwirksam.
  kurzbeschreibung: 'Die Charta bindet nach s. 32(1) nur Parlament und Regierungen von Bund und Provinzen,
    nicht private Anbieter. Für den KI-Einsatz sind vier Normen maßgeblich: s. 7 (Leben, Freiheit, Sicherheit
    der Person und die principles of fundamental justice) als Maßstab automatisierter Verwaltungsentscheidungen,
    s. 8 (Schutz vor unangemessener Durchsuchung und Beschlagnahme) für biometrische Erkennung und polizeiliche
    Datenauswertung, s. 15 (Gleichheit) für algorithmische Diskriminierung und s. 1 als Schrankenvorbehalt
    mit dem Oakes-Test. Über Abschnitt 6.3.3 der Directive on Automated Decision-Making wirkt die Charta
    unmittelbar in die Verwaltungspraxis hinein.'
  inkrafttreten:
    datum: 1982-04-17
    verifiziert: true
    quelle: https://laws-lois.justice.gc.ca/eng/const/page-12.html
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - s. 32(1) begrenzt die Bindung auf staatliches Handeln. Der private Modellanbieter ist nicht Adressat
    — dieselbe Konstruktion wie bei der US-Verfassung und der Grund, weshalb Kanada den Schutz über das
    Datenschutz- und Verbraucherrecht organisieren muss.
  - s. 7 und die principles of fundamental justice sind der Ort, an dem sich die kanadische Diskussion
    über die Begründungspflicht bei automatisierten Verwaltungsentscheidungen abspielt — bislang ohne
    höchstrichterliche Entscheidung zu KI.
  - s. 15(2) erlaubt ausdrücklich Ausgleichsmaßnahmen. Bias-Korrekturen in Modellen sind danach nicht
    schon deshalb angreifbar, weil sie ungleich behandeln — anders als in Teilen der US-Debatte.
  - Abschnitt 6.3.3 der Directive on Automated Decision-Making verlangt, dass Tests und Überwachung automatisierter
    Entscheidungssysteme mit der Charta, dem Canadian Human Rights Act und dem UNDRIP Act vereinbar sind.
    Damit wird Verfassungsrecht zum Prüfmaßstab der Verwaltungspraxis.
