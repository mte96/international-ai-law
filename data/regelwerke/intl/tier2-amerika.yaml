- id: us-ky-kcdpa
  jurisdiktion: us
  kurztitel: Kentucky Consumer Data Protection Act (KCDPA)
  offizieller_titel: Kentucky Consumer Data Protection Act
  fundstelle: KRS 367.3611 ff.
  verfahrensnummer: HB 15 (2024 Regular Session)
  status: anwendbar
  status_detail: 'Am 27.03.2024 verabschiedet, am 04.04.2024 von Gouverneur Beshear ausgefertigt, anwendbar
    seit dem 01.01.2026 — zusammen mit den Datenschutzgesetzen von Indiana und Rhode Island.

    '
  kurzbeschreibung: 'Das KCDPA folgt dem Virginia-Modell. Es gilt für Unternehmen, die jährlich die personenbezogenen
    Daten von mindestens 100.000 Einwohnern Kentuckys verarbeiten oder von mindestens 25.000 und dabei
    mehr als 50 % ihres Bruttoumsatzes aus dem Verkauf personenbezogener Daten erzielen. Verbraucher haben
    Rechte auf Auskunft, Berichtigung, Löschung, Datenübertragbarkeit und — KI-relevant — auf Widerspruch
    gegen die Verarbeitung zum Zweck zielgerichteter Werbung, gegen den Verkauf und gegen PROFILING zur
    Vorbereitung von Entscheidungen mit rechtlicher oder ähnlich erheblicher Wirkung. Für sensible Daten
    (genetische, biometrische, Standortdaten) gilt Einwilligungsvorbehalt. Für bestimmte Verarbeitungen
    sind Datenschutz-Folgenabschätzungen zu erstellen. Durchsetzung ausschließlich durch den Attorney
    General mit 30-tägiger Heilungsfrist und Bußgeldern bis 7.500 USD je Verstoß; ein privates Klagerecht
    besteht nicht.

    '
  inkrafttreten:
    datum: 2026-01-01
    verifiziert: false
    quelle: https://www.koleyjessen.com/insights/publications/new-state-privacy-laws-effective-january-1-2026-indiana-kentucky-and-rhode-island
  anwendungsdaten:
  - datum: 2026-01-01
    was_gilt: Vollständige Anwendung einschließlich Widerspruchsrecht gegen Profiling und Pflicht zur
      Folgenabschätzung.
    verifiziert: false
    quelle: https://www.koleyjessen.com/insights/publications/new-state-privacy-laws-effective-january-1-2026-indiana-kentucky-and-rhode-island
  themenachsen:
  - datenschutz
  - grundrechte
  - arbeit
  regelungsschwerpunkte:
  - Widerspruchsrecht gegen Profiling zur Vorbereitung von Entscheidungen mit rechtlicher oder ähnlich
    erheblicher Wirkung — die Standardformel der US-Bundesstaatengesetze. Sie ist ein Opt-out, kein Verbot,
    und kennt keinen Erklärungsanspruch. Das ist der systematische Unterschied zu Art. 22 DSGVO und zum
    kalifornischen ADMT-Regime.
  - Datenschutz-Folgenabschätzung für Profiling mit vorhersehbarem Risiko unfairer oder täuschender Behandlung,
    ungesetzlicher Ungleichbehandlung, finanzieller, physischer oder Reputationsschäden oder unzumutbaren
    Eingriffs in die Privatsphäre.
  - Kein privates Klagerecht, 30-tägige Heilungsfrist — Kentucky gehört damit zu den unternehmensfreundlichsten
    Landesdatenschutzgesetzen.
  - 'Praktische Bedeutung für KI: gering im Einzelfall, erheblich in der Summe. Kentucky ist eines von
    inzwischen rund zwanzig Bundesstaatengesetzen mit gleichlautendem Profiling-Opt-out; wer eines erfüllt,
    erfüllt alle.'
  dokumente:
