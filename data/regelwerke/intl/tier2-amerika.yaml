- id: au-social-security-act-1991
  jurisdiktion: au
  kurztitel: Social Security Act 1991 und Social Security (Administration) Act 1999
  offizieller_titel: 'Social Security Act 1991 (Cth), ergänzt um den Social Security (Administration)
    Act 1999 (Cth)

    '
  fundstelle: Act No. 46 of 1991; Act No. 191 of 1999
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Die für automatisierte Entscheidungen maßgebliche Vorschrift ist s.
    6A des Social Security (Administration) Act 1999: Der Secretary kann Computerprogramme einsetzen,
    um Entscheidungen zu treffen, die dann als seine Entscheidungen gelten. Genau diese Konstruktion ist
    der rechtliche Kern des Robodebt-Skandals. Eine gesetzliche Reform der Verwaltungsautomatisierung
    (Empfehlung 17.1 der Royal Commission) ist konsultiert, aber nicht umgesetzt; die Ministererklärung
    vom 20.07.2026 führt sie erneut als Priorität.

    '
  kurzbeschreibung: 'Der Social Security Act 1991 regelt Leistungsansprüche und die Entstehung von Rückforderungen;
    ss. 1222A ff. bestimmen, wann eine Schuld entsteht und wie sie eingezogen wird. Der Social Security
    (Administration) Act 1999 regelt das Verfahren und enthält in s. 6A die Ermächtigung zur Entscheidung
    durch Computerprogramm. Im Robodebt-Verfahren wurden auf dieser Grundlage Schulden aus gemittelten
    Steuerdaten errechnet, ohne dass das Gesetz eine solche Mittelung erlaubte; die Beweislast wurde faktisch
    umgekehrt. Der Bund erkannte im Verfahren Amato (2019) und im Vergleich Prygodicz (2021) die Rechtswidrigkeit
    an; die Royal Commission legte am 07.07.2023 ihren Bericht vor.

    '
  inkrafttreten:
    datum: 1991-07-01
    verifiziert: false
    quelle: https://lawlex.com.au/tempstore/Consolidated120707/Social%20Security%20Act.pdf
    fundstelle_norm: 's. 2 Social Security Act 1991 (Act No. 46 of 1991): ''This Act commences on 1 July
      1991.'''
  anwendungsdaten:
  - datum: 2000-03-20
    was_gilt: Social Security (Administration) Act 1999 (Act No. 191 of 1999) — darin s. 6A, die Ermaechtigung
      des Secretary zum Einsatz von Computerprogrammen fuer Entscheidungen; das ist die eigentlich KI-relevante
      Norm des Eintrags
    verifiziert: false
    quelle: https://www.legislation.gov.au/C2004A00532/latest/text
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 's. 6A Social Security (Administration) Act 1999: gesetzliche Ermächtigung zur Entscheidung durch
    Computerprogramm mit Zurechnung an den Secretary. Australien hat damit — anders als Kanada (IRPA)
    — eine ausdrückliche Rechtsgrundlage. Robodebt zeigt, dass die Grundlage allein nichts nützt: Sie
    sagt nichts darüber, ob das Programm das Gesetz richtig anwendet.'
  - 'Der eigentliche Rechtsfehler von Robodebt lag nicht in der Automatisierung, sondern im materiellen
    Recht: Aus gemittelten Jahresdaten der Steuerverwaltung ließ sich keine Schuld nach dem Social Security
    Act 1991 herleiten. Die Automatisierung hat den Fehler nur skaliert.'
  - 'Umkehr der Beweislast: Betroffene mussten die Unrichtigkeit der errechneten Schuld nachweisen — die
    strukturelle Parallele zur kanadischen Lage nach Raja (Beweislast beim Betroffenen für Fehler eines
    unbekannten Werkzeugs).'
  - 'Empfehlung 17.1 der Royal Commission: einheitlicher gesetzlicher Rahmen für automatisierte Verwaltungsentscheidungen
    mit ausdrücklicher Ermächtigung, Transparenz, Begründbarkeit und wirksamem Rechtsschutz. Konsultation
    13.11.2024 bis 15.01.2025, seither kein Gesetzentwurf.'
  - 'Gegenläufige Entwicklung 2026: Während der allgemeine Rahmen aussteht, werden in Einzelgesetzen (NDIS)
    neue Automatisierungsbefugnisse geschaffen — nach Kritik von Menschenrechtsorganisationen ohne hinreichende
    Schutzvorkehrungen.'
  dokumente:
  - datum: 2026-07-20
    typ: bericht
    titel: Feds move to regulate automated decision-making
    url: https://www.itnews.com.au/news/feds-move-to-regulate-automated-decision-making-627504
    sprache: en
    urheber: iTnews
    verifiziert: false
    notiz: Stand des ADM-Rahmens im Juli 2026 und die parallelen Einzelgesetze (Aged Care, NDIS).
  - datum: 2024-11-13
    typ: konsultation
    titel: Use of automated decision-making by government — Consultation paper
    url: https://consultations.ag.gov.au/integrity/adm/user_uploads/consultation-paper-use-of-automated-decision-making-by-government.pdf
    sprache: en
    urheber: Attorney-General's Department
    verifiziert: false
    notiz: Konsultationspapier zur Umsetzung der Empfehlung 17.1.
  - datum: 1991-06-23
    typ: konsolidiert
    titel: Social Security Act 1991 — Federal Register of Legislation
    url: https://www.legislation.gov.au/Series/C2004A04121
    sprache: en
    urheber: Australian Government
    verifiziert: false
    notiz: Amtliche Fassung.
  bedeutung_eu_anbieter: 'Robodebt ist das wichtigste Lehrstück der englischsprachigen Welt zur Verwaltungsautomatisierung,
    und die Lehre ist unbequem: Eine ausdrückliche gesetzliche Ermächtigung zur automatisierten Entscheidung
    — wie sie § 35a VwVfG und s. 6A des australischen Gesetzes kennen — schützt nicht vor rechtswidrigen
    Ergebnissen. Wer Behördensoftware liefert, sollte die materielle Rechtsgrundlage jeder automatisierten
    Berechnung dokumentieren, nicht nur die Befugnis zur Automatisierung. Genau das verlangt Art. 26 Abs.
    2 KI-VO vom Betreiber, und genau daran ist Robodebt gescheitert.

    '
  offene_punkte:
  - Ob der ADM-Rahmen 2026/27 als Gesetzentwurf kommt.
  - Ob das NDIS Amendment Bill 2026 mit Schutzvorkehrungen verabschiedet wird.
  monitoring_quellen:
  - https://consultations.ag.gov.au/integrity/adm/
  - https://www.legislation.gov.au/
  bezug_regelwerke:
  - au-adm-reform-robodebt
  - au-public-service-act-1999
  - au-privacy-act-1988
  - au-dta-ai-policy-2025
  letzte_pruefung: 2026-09-01
  pruefvermerk:
  - 'Bestaetigt fuer das Stammgesetz. Hinweis: Der Eintrag buendelt ZWEI Gesetze; die KI-relevante Vorschrift
    (s. 6A) steht im Social Security (Administration) Act 1999, dessen Inkrafttreten (nach der ueblichen
    Angabe 20.03.2000) in dieser Sitzung nicht am amtlichen Text belegt werden konnte — daher in anwendungsdaten
    mit verifiziert: false. Erwaegenswert: den Eintrag aufteilen.'
- id: au-public-service-act-1999
  jurisdiktion: au
  kurztitel: Public Service Act 1999
  offizieller_titel: Public Service Act 1999 (Cth)
  fundstelle: Act No. 147 of 1999
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Im Robodebt-Zusammenhang die Grundlage der dienstrechtlichen Aufarbeitung:
    Die Royal Commission verwies Beamte an die Australian Public Service Commission zur Prüfung von Verstößen
    gegen den APS Code of Conduct.

    '
  kurzbeschreibung: 'Das Gesetz regelt Werte, Verhaltenskodex und Leitungsstruktur des australischen Bundesdienstes.
    Für KI sind zwei Vorschriften maßgeblich: s. 10 (APS Values, darunter Unparteilichkeit, Rechenschaft
    und Achtung vor den Menschen) und s. 13 (Code of Conduct, insbesondere die Pflicht zu Sorgfalt, zur
    Beachtung australischen Rechts und zu redlicher Beratung der Regierung). Verstöße können disziplinarisch
    bis zur Entlassung geahndet werden (s. 15). Die Bedeutung für KI liegt in der Zurechnung: Wenn eine
    Behörde ein rechtswidriges automatisiertes Verfahren betreibt, haftet nicht die Software, sondern
    der Beamte, der es eingeführt oder trotz Kenntnis fortgeführt hat.

    '
  inkrafttreten:
    datum: 1999-12-05
    verifiziert: true
    quelle: https://www.legislation.gov.au/C2004A00538/latest/text
    fundstelle_norm: 'Sec. 2(1) Public Service Act 1999 i.V.m. Endnote 3 der amtlichen Kompilation: "147,
      1999 | Assent 11 Nov 1999 | Commencement 5 Dec 1999 (s 2(1) and gaz 1999, No S584)".'
  anwendungsdaten: []
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - governance
  regelungsschwerpunkte:
  - 's. 13(4): Pflicht, bei der Ausübung des Amtes australisches Recht zu beachten — die Norm, an der
    die Robodebt-Verantwortlichen gemessen wurden.'
  - 's. 13(9): Pflicht zu redlicher, offener und rechtzeitiger Beratung der Minister. Die Royal Commission
    hat die Vorenthaltung rechtlicher Bedenken als Kernverstoß behandelt.'
  - 'Persönliche Verantwortung als Steuerungsinstrument: Australien hat nach Robodebt keinen KI-Rahmen
    geschaffen, aber die dienstrechtliche Verantwortung durchgesetzt. Das ist ein Mechanismus, den die
    KI-VO nicht kennt — sie adressiert Organisationen, nicht Amtsträger.'
  - Ergänzend gilt die Policy for the responsible use of AI in government der Digital Transformation Agency
    (seit 01.09.2024), die einen benannten Verantwortlichen je Behörde und Transparenzerklärungen verlangt.
  dokumente:
  - datum: 1999-11-11
    typ: konsolidiert
    titel: Public Service Act 1999 (Cth)
    url: https://www.legislation.gov.au/C2004A00538
    sprache: en
    urheber: Australian Government
    verifiziert: false
    notiz: Amtliche Fassung;
  bedeutung_eu_anbieter: 'Mittelbar bedeutsam: Wer australische Behörden beliefert, hat Ansprechpartner,
    die persönlich haften. Das verändert das Beschaffungsverhalten — verlangt werden Nachweise, die der
    Beamte in einer Disziplinaruntersuchung vorlegen kann. Wer eine Konformitätsdokumentation nach Art.
    11 KI-VO liefert, liefert genau solche Nachweise.

    '
  offene_punkte:
  - Ob die APS Commission KI-spezifische Verhaltensrichtlinien erlässt.
  monitoring_quellen:
  - https://www.apsc.gov.au/
