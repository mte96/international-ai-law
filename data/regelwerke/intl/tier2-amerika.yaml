  bedeutung_eu_anbieter: 'Wer bis Mai 2027 in Indien anbieten will, muss die Einwilligungsarchitektur
    neu denken: Einwilligungsmitteilungen nach indischem Muster, gegebenenfalls Anbindung an einen Consent
    Manager, verifizierte elterliche Einwilligung und — für große Anbieter — eine jährliche Folgenabschätzung
    samt Modellprüfung. Das ist mehr Aufwand als die DSGVO-Umsetzung an dieser Stelle, weil die Einwilligung
    nicht durch eine Abwägung ersetzt werden kann.

    '
