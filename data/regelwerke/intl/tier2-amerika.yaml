  - grundrechte
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'GRUND DES SCHEITERNS 1 — Bündelung: Das Gesetz vereinte Plattformregulierung, Strafrechtsverschärfung
    (Definition von Hass als ''the emotion that involves detestation or vilification'', neue Höchststrafen)
    und Änderungen des Menschenrechtsgesetzes in einem Text. Die Strafrechtsteile zogen die Kritik auf
    sich und blockierten den unstreitigen Teil.'
  - 'GRUND DES SCHEITERNS 2 — Vorbeugehaft: Die Möglichkeit einer Friedensbürgschaft bei befürchteten
    Hassverbrechen führte zu dem Vorwurf, es drohe Hausarrest vor jeder Tat (Margaret Atwood: ''Orwellian'').'
  - 'GRUND DES SCHEITERNS 3 — Kommissionsbefugnisse: Michael Geist und die Canadian Civil Liberties Association
    rügten zu weite Definitionen und zu große Befugnisse der Digital Safety Commission.'
  - 'GRUND DES SCHEITERNS 4 — Zeit: Wie AIDA fiel C-63 der Prorogation vom 06.01.2025 zum Opfer, bevor
    die Ausschussberatung abgeschlossen war.'
  - 'Was daraus wurde: Die unstreitigen Teile — Strafbarkeit synthetischer intimer Darstellungen — sind
    2025/26 als Bill C-16 zurückgekehrt und in Kraft. Die Plattformpflichten fehlen weiter; die Strategie
    ''AI for All'' kündigt sie für soziale Medien UND Chatbots erneut an.'
