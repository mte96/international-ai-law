- id: br-verfassung
  jurisdiktion: br
  kurztitel: Brasilianische Bundesverfassung
  offizieller_titel: Constituição da República Federativa do Brasil de 1988
  fundstelle: Verkündet am 05.10.1988; Art. 5 LXXIX eingefügt durch die Verfassungsänderung Nr. 115 vom
    10.02.2022
  status: anwendbar
  status_detail: 'Brasilien ist eine der wenigen Rechtsordnungen, in denen der Schutz personenbezogener
    Daten ausdrücklich Verfassungsrang hat (Art. 5 LXXIX seit 2022). Für die KI-Diskussion ist die Verfassung
    nicht Hintergrund, sondern unmittelbarer Prüfmaßstab: Das Bundesverfassungsgericht hat am 26.06.2025
    Art. 19 des Marco Civil an Art. 5 IX gemessen und teilweise für verfassungswidrig erklärt, und der
    Oberste Gerichtshof hat am 08.04.2026 ein KI-erzeugtes Beweismittel an Art. 5 LIV und LVI gemessen.'
  kurzbeschreibung: 'Art. 5 enthält den Grundrechtskatalog. Für KI sind vier Gruppen maßgeblich: die Kommunikations-
    und Meinungsfreiheiten (IV mit dem Anonymitätsverbot, IX ohne Zensurvorbehalt), der Persönlichkeitsschutz
    (X mit Intimsphäre, Privatleben, Ehre und Bild samt Entschädigungsanspruch, XII Fernmeldegeheimnis,
    LXXII Habeas Data, LXXIX Datenschutz), das Urheberrecht (XXVII und XXVIII) und die Verfahrensgarantien
    (LIV rechtsstaatliches Verfahren, LV rechtliches Gehör, LVI Beweisverwertungsverbot). Das Anonymitätsverbot
    des Art. 5 IV ist die brasilianische Besonderheit, aus der die Pflicht zur Kennzeichnung synthetischer
    Inhalte hergeleitet wird.'
  inkrafttreten:
    datum: 1988-10-05
    verifiziert: true
    quelle: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
  themenachsen:
  - grundrechte
  - content
  - datenschutz
  - urheberrecht
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - Art. 5 IV verbietet die Anonymität bei der Meinungsäußerung. Aus dieser Norm — nicht aus einem Spezialgesetz
    — leitet die brasilianische Diskussion die Pflicht zur Kennzeichnung KI-erzeugter Inhalte her.
  - Art. 5 IX untersagt Zensur und Erlaubnisvorbehalte ohne Schrankenvorbehalt. Das ist der Grund, weshalb
    das Bundesverfassungsgericht 2025 die Plattformhaftung neu geordnet, ein allgemeines Löschgebot aber
    abgelehnt hat.
  - Art. 5 LXXIX hebt den Datenschutz auf Verfassungsrang. Jedes künftige KI-Gesetz muss sich daran messen
    lassen — und die Auffangzuständigkeit der ANPD nach Art. 47 PL 2338/2023 findet hier ihre Rechtfertigung.
  - 'Art. 5 LVI kennt kein Abwägungsmodell: Rechtswidrig erlangte Beweise sind unzulässig. Deshalb konnte
    der Oberste Gerichtshof den mit generativer KI nachbearbeiteten Tonbefund ohne Interessenabwägung
    ausscheiden.'
