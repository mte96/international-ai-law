  bedeutung_eu_anbieter: 'Wer kanadische Trainingsdaten erhebt, sollte 2025 ABKB 287 kennen — es ist die
    einzige kanadische Entscheidung, die dem Argument "öffentlich zugängliche Daten" verfassungsrechtliches
    Gewicht gibt. Für die europäische Praxis ist sie ein Kontrapunkt zur EDSA-Linie: Was der EDSA als
    Abwägungsfrage im Rahmen des Art. 6 Abs. 1 lit. f DSGVO behandelt, ist in Alberta eine Frage der Grundrechte
    des Verarbeiters. Verlassen sollte man sich darauf nicht — die Angemessenheitsprüfung bleibt, und
    der Bundesmaßstab des s. 5(3) PIPEDA gilt parallel.

    '
