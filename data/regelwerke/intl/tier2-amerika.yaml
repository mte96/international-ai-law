- id: in-dpdp-rules-2025
  jurisdiktion: in
  kurztitel: DPDP Rules 2025 — Durchführungsregeln
  offizieller_titel: The Digital Personal Data Protection Rules, 2025
  fundstelle: Bekanntmachung vom 14.11.2025
  verfahrensnummer: Entwurf vom 03.01.2025, Konsultation bis 18.02.2025
  status: teilanwendbar
  status_detail: 'Am 14.11.2025 bekanntgemacht und zugleich das Instrument, das den DPDP Act 2023 gestaffelt
    in Kraft setzt. Vollständige Anwendung ab dem 14.05.2027.

    '
  kurzbeschreibung: 'Die Regeln konkretisieren Form und Inhalt der Einwilligungsmitteilung, die Registrierung
    und Pflichten der Consent Manager (nur in Indien ansässige Gesellschaften, interoperable Plattform),
    die Sicherheitsmaßnahmen, die Meldung von Datenschutzverletzungen (unverzügliche Unterrichtung der
    Betroffenen in einfacher Sprache mit Angaben zu Vorfall, möglichen Folgen, Abhilfe und Kontaktstelle),
    die Aufbewahrungs- und Löschfristen, die Verfahren der verifizierten elterlichen Einwilligung einschließlich
    virtueller Alters- und Identitätstoken, die zusätzlichen Pflichten der Significant Data Fiduciaries
    — jährliche Datenschutz-Folgenabschätzung, unabhängige Prüfung und die Sorgfaltsprüfung algorithmischer
    Software — sowie die Arbeitsweise des vollständig digital arbeitenden Data Protection Board mit vier
    Mitgliedern.

    '
  inkrafttreten:
    datum: 2025-11-14
    verifiziert: true
    quelle: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2190655&reg=48&lang=2
