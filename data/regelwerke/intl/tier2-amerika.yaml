  bedeutung_eu_anbieter: 'Das ist die anspruchsvollste Kennzeichnungspflicht, der ein europäischer Anbieter
    derzeit weltweit begegnen kann — und sie trifft ihn zeitlich vor Art. 50 KI-VO. Wer C2PA-Metadaten
    und Wasserzeichen implementiert hat, erfüllt den Erzeugerteil; neu ist, dass ein Dienst, der fremde
    Inhalte verbreitet, eine Erkennungstechnik betreiben muss. Praktisch heißt das: Wer in Indien eine
    Plattform betreibt, braucht Erkennung; wer nur ein Modell anbietet, braucht Markierung. Die Textausnahme
    ist der einzige Bereich, in dem Indien milder ist als die KI-VO, die auch für Textausgaben Kennzeichnung
    verlangt.

    '
  offene_punkte:
  - Welche Erkennungstechnik als ausreichend gilt — die Regeln nennen keine Norm; es gibt kein indisches
    Gegenstück zu GB 45438-2025 (China).
  - Ob die Textausnahme geschlossen wird.
  - Ob Modellanbieter ohne Plattformfunktion erfasst sind.
