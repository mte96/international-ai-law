  - datum: 2021-05-26
    was_gilt: Zusätzliche Pflichten für bedeutende Anbieter sozialer Medien nach Rule 4.
    verifiziert: false
    quelle: https://www.meity.gov.in/
  - datum: 2026-02-20
    was_gilt: 'Änderungsregeln 2026 wirksam: Kennzeichnung synthetisch erzeugter Information, Nutzererklärung,
      technische Verifikation (siehe in-it-amendment-rules-2026).'
    verifiziert: false
    quelle: https://www.khaitanco.com/thought-leadership/MeitY-notifies-the-IT-Amendment-Rules-2026
  themenachsen:
  - content
  - haftung
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Rule 3(2)(b) — 24-Stunden-Frist für Intimdarstellungen und Identitätsanmaßung: Das ist die Norm,
    auf die die indische Deepfake-Rechtsprechung zugreift. Sie deckt morphed images ausdrücklich ab und
    verlangt kein Gerichtsurteil, sondern nur eine Beschwerde.'
  - Rule 3(1)(d) — 36 Stunden nach gerichtlicher Anordnung oder behördlicher Mitteilung. In den Persönlichkeitsrechtsverfahren
    des Delhi High Court werden hierauf gestützte 'dynamische' Anordnungen erlassen, die auch künftige,
    gleichartige Inhalte erfassen.
  - 'Rule 4(4): Einsatz automatisierter Werkzeuge zur proaktiven Erkennung durch SSMI. Das ist eine gesetzliche
    Pflicht zum KI-Einsatz — die Gegenrichtung zur europäischen Debatte um Art. 8 DSA und das Verbot allgemeiner
    Überwachungspflichten.'
  - 'Rule 4(2): Rückverfolgbarkeit des Erstversenders bei Nachrichtendiensten — praktisch die Aufhebung
    der Ende-zu-Ende-Verschlüsselung; vor Gerichten angegriffen, nicht abschließend geklärt.'
  - 'Rule 7: Verlust der Haftungsfreistellung als einzige Sanktion. Es gibt kein Bußgeld — der Durchsetzungsmechanismus
    ist die Haftung selbst.'
  - Keine Definition des 'Intermediärs' für generative Dienste; MeitY behandelt sie in seinen Advisories
    als erfasst.
  dokumente:
  - datum: 2023-04-06
    typ: konsolidiert
    titel: Information Technology (Intermediary Guidelines and Digital Media Ethics Code) Rules, 2021
      (Fassung 06.04.2023)
    url: https://www.meity.gov.in/static/uploads/2024/02/Information-Technology-Intermediary-Guidelines-and-Digital-Media-Ethics-Code-Rules-2021-updated-06.04.2023-.pdf
    sprache: en
    urheber: Ministry of Electronics and Information Technology
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung; Grundlage aller Regelangaben hier.
  bedeutung_eu_anbieter: 'Wer in Indien einen Dienst mit nutzergenerierten oder KI-erzeugten Inhalten
    betreibt, braucht drei Dinge sofort: einen in Indien ansässigen Beschwerdebeauftragten, ein Verfahren,
    das Beschwerden über Intimdarstellungen und Identitätsanmaßungen binnen 24 Stunden erledigt, und einen
    Kanal für behördliche Mitteilungen mit 36-Stunden-Frist. Der DSA verlangt nichts Vergleichbares an
    Fristenschärfe; Art. 16 DSA kennt keine feste Frist. Wer die indischen Fristen einhält, erfüllt den
    DSA — nicht umgekehrt.

    '
  offene_punkte:
  - Reichweite der 'dynamischen' Anordnungen des Delhi High Court gegenüber Anbietern ohne indische Niederlassung.
  - Ob Rule 4(2) (Rückverfolgbarkeit) verfassungsgemäß ist.
