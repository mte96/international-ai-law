    typ: konsolidiert
    titel: Lei nº 13.772, de 19 de dezembro de 2018 — Einfügung des Art. 216-B
    url: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/L13772.htm
    sprache: pt
    urheber: Presidência da República
    verifiziert: true
    notiz: Amtlicher Wortlaut des Art. 216-B einschließlich des parágrafo único zur montagem.
