  - datum: 2025-11-20
    typ: uebersicht
    titel: Enforcement of the DPDP Act and notification of the DPDP Rules
    url: https://www.amsshardul.com/insight/enforcement-of-the-dpdp-act-and-notification-of-the-dpdp-rules/
    sprache: en
    urheber: Shardul Amarchand Mangaldas & Co
    verifiziert: false
    notiz: Maßgeblich für die exakte Zuordnung der Vorschriften zu den drei Stufen und für die algorithmische
      Sorgfaltspflicht.
  bedeutung_eu_anbieter: 'Zwei Dinge sind für europäische Anbieter neu. Erstens: Ohne Einwilligung geht
    in Indien fast nichts — die Konstruktion "Training auf Grundlage berechtigter Interessen", die in
    Europa trägt und in Brasilien diskutiert wird, hat im DPDP Act keine Entsprechung. Zweitens: Die algorithmische
    Sorgfaltsprüfung für Significant Data Fiduciaries ist eine Modellprüfpflicht im Datenschutzgesetz;
    wer eine Konformitätsdokumentation nach Art. 9 bis 15 KI-VO besitzt, kann sie dafür verwenden. Der
    Zeitplan ist komfortabel: Die materiellen Pflichten greifen erst am 14.05.2027, also nach dem Beginn
    der Hochrisikopflichten der KI-VO.

    '
  offene_punkte:
  - Ob 'legitimate uses' für Modelltraining ausgelegt werden kann.
  - Welche Unternehmen als Significant Data Fiduciaries benannt werden.
  - Ob die Sorgfaltsprüfung algorithmischer Software durch Leitlinien konkretisiert wird.
