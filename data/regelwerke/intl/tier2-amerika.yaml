- id: br-cpp
  jurisdiktion: br
  kurztitel: Código de Processo Penal (Strafprozessordnung)
  offizieller_titel: Código de Processo Penal — Decreto-Lei nº 3.689, de 3 de outubro de 1941
  originaltitel: Decreto-Lei nº 3.689/1941
  fundstelle: Decreto-Lei nº 3.689/1941
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, ohne KI-spezifische Vorschrift. Der Superior Tribunal de Justiça hat
    am 08.04.2026 erstmals über generative KI als Beweismittel entschieden und dabei allein auf die hergebrachten
    Beweisregeln und die Verfassung zurückgegriffen.

    '
  kurzbeschreibung: 'Für KI sind drei Vorschriften einschlägig. Art. 155 verbietet es, eine Verurteilung
    ausschließlich auf im Ermittlungsverfahren gewonnene Erkenntnisse zu stützen, und bindet den Richter
    an die freie, begründete Beweiswürdigung. Art. 158 verlangt bei Delikten, die Spuren hinterlassen,
    ein kriminaltechnisches Gutachten, das weder durch das Geständnis des Beschuldigten noch durch andere
    Beweismittel ersetzt werden kann. Art. 159 bestimmt, dass das Gutachten von einem amtlichen Sachverständigen
    mit Hochschulabschluss zu erstatten ist. Hinzu treten Art. 5 LIV und LVI der Verfassung (rechtliches
    Gehör, Verwertungsverbot für rechtswidrig erlangte Beweise). Auf dieser Grundlage hat der STJ eine
    von Ermittlern mit generativer KI erstellte Tonanalyse verworfen, die ein amtliches Gutachten entkräften
    sollte.

    '
  inkrafttreten:
    datum: 1942-01-01
    verifiziert: true
    quelle: https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689.htm
    fundstelle_norm: 'Art. 810 Decreto-Lei nº 3.689/1941 (Código de Processo Penal): "Este Código entrará
      em vigor no dia 1º de janeiro de 1942." Ausgefertigt in Rio de Janeiro am 03.10.1941.'
  anwendungsdaten:
  - datum: 2026-04-08
    was_gilt: 'STJ, Fünfte Kammer, Berichterstatter Reynaldo Soares da Fonseca: Eine mit generativen KI-Werkzeugen
      erstellte Analyse kann ein amtliches kriminaltechnisches Gutachten nach Art. 158, 159 CPP nicht
      ersetzen oder entkräften (siehe Entscheidung br-2026-stj-ia-beweis).

      '
    verifiziert: false
    quelle: https://www.stj.jus.br/
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Art. 158/159 sind der eigentliche Riegel: Wo das Gesetz ein amtliches Sachverständigengutachten verlangt,
    kann eine KI-Analyse es nicht ersetzen — unabhängig von ihrer Qualität. Das ist eine formale, keine
    materielle Schranke, und deshalb belastbarer als jede Zuverlässigkeitsdiskussion.'
  - 'Art. 155: freie, aber begründete Beweiswürdigung. Der Richter muss darlegen, warum er einer Analyse
    folgt — bei einem nicht nachvollziehbaren KI-Ergebnis ist das kaum möglich.'
  - Art. 5 LVI der Verfassung (Verwertungsverbot) ist die Reserveposition, wenn die Erlangung selbst rechtswidrig
    war.
  - Es fehlt jede Regelung zu KI-generierten Fälschungen als Beweismittel — die Authentizitätsprüfung
    von Audio- und Videobeweisen erfolgt nach allgemeinen Grundsätzen.
  dokumente:
  - datum: 1941-10-03
    typ: konsolidiert
    titel: Decreto-Lei nº 3.689, de 3 de outubro de 1941 (Código de Processo Penal)
    url: https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689.htm
    sprache: pt
    urheber: Presidência da República
    verifiziert: false
    notiz: Amtlicher Volltext;
  bedeutung_eu_anbieter: 'Für Anbieter forensischer KI-Werkzeuge eine Warnung: In Brasilien entscheidet
    nicht die Genauigkeit, sondern die Frage, wer das Gutachten erstattet. Ein Werkzeug, das amtliche
    Sachverständige unterstützt, ist verwertbar; ein Werkzeug, das sie ersetzt, ist es nicht. Dieselbe
    Struktur findet sich in § 244 StPO nicht, wohl aber in der deutschen Praxis zum Sachverständigenbeweis
    — die brasilianische Regelung ist nur ausdrücklicher.

    '
  offene_punkte:
  - Ob der STF die Linie des STJ bestätigt.
  - Ob eine Regelung zur Authentizitätsprüfung synthetischer Medien im Strafverfahren geschaffen wird.
