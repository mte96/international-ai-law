  kurztitel: Online Harms Act (Bill C-63) — gescheitert
  offizieller_titel: 'An Act to enact the Online Harms Act, to amend the Criminal Code, the Canadian Human
    Rights Act and An Act respecting the mandatory reporting of Internet child pornography by persons
    who provide an Internet service and to make consequential and related amendments to other Acts

    '
  fundstelle: kein — nie in Kraft getreten
  verfahrensnummer: Bill C-63, 44. Parlament, 1. Sitzungsperiode
  status: gescheitert
  status_detail: 'Eingebracht am 26.02.2024 durch Justizminister Arif Virani, mit der Prorogation am 06.01.2025
    verfallen — demselben Tag wie AIDA. Damit ist Kanada gleichzeitig sein KI-Gesetz und sein Plattformregulierungsgesetz
    verloren gegangen.

    '
  kurzbeschreibung: 'C-63 hätte eine Digital Safety Commission und ein Digital Safety Office geschaffen
    und Plattformen verpflichtet, das Risiko der Verbreitung von sieben Kategorien schädlicher Inhalte
    zu mindern: Hassrede, Aufstachelung zu Gewalt, gewaltbereiter Extremismus, Terrorismus, sexuelle Viktimisierung
    von Kindern, Rachepornografie und Inhalte, die zu Selbstverletzung anstiften. Für die beiden schwersten
    Kategorien war eine Löschpflicht binnen 24 Stunden vorgesehen, dazu altersgerechte Gestaltung für
    Minderjährige. Für KI entscheidend: Der Begriff der nicht einvernehmlichen intimen Darstellung umfasste
    ausdrücklich KI-veränderte Bilder — C-63 wäre das erste kanadische Gesetz mit einer Deepfake-Löschpflicht
    gewesen.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://en.wikipedia.org/wiki/Online_Harms_Act
  anwendungsdaten: []
