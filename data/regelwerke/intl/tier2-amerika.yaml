    Wer ihnen nicht folgt, riskiert den Vorwurf fehlender Sorgfalt nach den IT Rules und damit die Haftungsfreistellung.
    Für europäische Anbieter ist die Lehre aus 2024 die wertvollste: Indien kann binnen Tagen eine Marktzutrittsschranke
    errichten und wieder aufheben. Wer dort anbietet, braucht einen Ansprechpartner im Land, der solche
    Mitteilungen zeitnah bewertet.

    '
