- id: ca-gerichte-ki-praxishinweise
  jurisdiktion: ca
  kurztitel: Kanadische Gerichte — Praxishinweise zum Einsatz generativer KI
  offizieller_titel: Notices to the Parties and the Profession und Practice Directions der kanadischen
    Gerichte zum Einsatz künstlicher Intelligenz in gerichtlichen Verfahren
  fundstelle: Federal Court, Notice vom 20.12.2023 i.d.F. vom 07.05.2024; Ontario Superior Court of Justice,
    Consolidated Provincial Practice Direction, Abschnitt K, und Practice Directions vom 13.11.2025; Court
    of King's Bench of Manitoba, Practice Direction vom 23.06.2023; Alberta Courts, Notice vom 06.10.2023;
    British Columbia Court of Appeal, Registrar's Filing Directive vom 04.09.2025
  status: anwendbar
  status_detail: Sämtlich in Kraft. Kanada hat als erste Rechtsordnung überhaupt gerichtliche Offenlegungspflichten
    für KI-erzeugte Eingaben eingeführt (Manitoba, 23.06.2023) und mit den Interim Principles des Federal
    Court zugleich die erste gerichtliche Selbstbindung beim eigenen KI-Einsatz.
  kurzbeschreibung: 'Die Praxishinweise verpflichten die Verfahrensbeteiligten, den Einsatz generativer
    KI bei der Erstellung eingereichter Dokumente offenzulegen, und machen sie für die Richtigkeit jeder
    Fundstelle verantwortlich. Der Federal Court verlangt eine Erklärung im ersten Absatz des Dokuments
    und hat sich zugleich sieben Grundsätze für den eigenen KI-Einsatz gegeben — Rechenschaft, Achtung
    der Grundrechte, Nichtdiskriminierung, Richtigkeit, Transparenz, Cybersicherheit und human in the
    loop — samt der Zusage, ohne öffentliche Konsultation keine automatisierten Entscheidungswerkzeuge
    in Urteilen einzusetzen. Sanktioniert wird der Verstoß nicht in den Hinweisen selbst, sondern über
    das allgemeine Kosten- und Kontemptrecht: Zhang v. Chen (2024 BCSC 285), Ko v. Li (2025 ONSC 2965),
    Arbuckle v. Tanner (2026 NSCA 62).'
  inkrafttreten:
    datum: 2023-06-23
    verifiziert: false
    quelle: https://uwindsor-law.libguides.com/AI/Regulation
  themenachsen:
  - berufsrecht
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - Erklärung im ERSTEN ABSATZ des eingereichten Dokuments (Federal Court) — die konkreteste Ausgestaltung
    einer gerichtlichen KI-Offenlegungspflicht weltweit; die deutschen Gerichte kennen bislang nichts
    Vergleichbares.
  - Die Interim Principles and Guidelines des Federal Court betreffen den EIGENEN KI-Einsatz des Gerichts.
    Die Zusage, ohne vorherige öffentliche Konsultation keine automatisierten Entscheidungswerkzeuge zu
    verwenden, ist die weitgehendste gerichtliche Selbstbindung, die es dazu gibt.
  - Kein eigener Sanktionstatbestand. Die Durchsetzung läuft über special costs, indemnity costs und Kontemptverfahren
    — das ist der Grund, weshalb die kanadische Halluzinationsrechtsprechung im Kostenrecht angesiedelt
    ist.
  - 'Uneinheitlichkeit zwischen den Provinzen: Manitoba und Alberta setzen auf Offenlegung, Ontario auf
    Verantwortlichkeit für die Richtigkeit, British Columbia auf eine Einreichungsrichtlinie des Registrars.
    Eine gesamtkanadische Regel fehlt.'
