      Personal Information Protection Act (PIPA) in Alberta came into force'''
  anwendungsdaten:
  - datum: 2025-05-30
    was_gilt: 'Clearview AI Inc v Alberta (IPC), 2025 ABKB 287: PIPA gilt auch für ausländische Organisationen,
      die Waren oder Dienste an Einwohner Albertas richten ("sufficient connection"); die enge Auslegung
      des Begriffs "publicly available" durch die Behörde ist vertretbar; das pauschale Einwilligungserfordernis
      für im Internet öffentlich zugängliche Daten verletzt s. 2(b) Charter.

      '
    verifiziert: false
    quelle: https://www.blg.com/en/insights/2025/06/alberta-judgment-opens-the-door-to-the-legitimization-of-data-scraping-and-ai-model-training
  - datum: 2025-08-01
    was_gilt: 'Bericht des Information and Privacy Commissioner of Alberta: Empfehlung eines eigenständigen
      KI-Gesetzes und — unabhängig davon — Änderung von PIPA, POPA und HIA um Vorabinformation bei automatisierten
      Entscheidungen, Anfechtungsrecht, verständliche Erklärung, Prüf- und Untersagungsbefugnis der Behörde.

      '
    verifiziert: false
    quelle: https://www.millerthomson.com/en/insights/technology-ip-and-privacy/should-alberta-enact-a-standalone-ai-law-key-takeaways-from-the-oipc-report/
  themenachsen:
  - datenschutz
  - grundrechte
  - gpai
  - governance
  regelungsschwerpunkte:
  - '2025 ABKB 287 ist die für KI-Training folgenreichste kanadische Gerichtsentscheidung: Sie erkennt
    ein Meinungsfreiheitsinteresse an der Verarbeitung öffentlich zugänglicher Informationen an — die
    Argumentation stützt sich auf die Indexierungsfunktion von Suchmaschinen, ist aber auf Trainingsdatenerhebung
    übertragbar.'
  - 'Die Entscheidung LEGITIMIERT Scraping nicht: Der angemessene Zweck bleibt zu prüfen, die enge Auslegung
    von ''publicly available'' bleibt bestehen, und Clearview blieb an das Verfahren gebunden. Sie beseitigt
    nur die pauschale Einwilligungsschranke.'
  - 'Extraterritoriale Anknüpfung: ''sufficient connection'' durch Angebot an Einwohner der Provinz —
    dasselbe Anknüpfungsmodell wie Art. 3 Abs. 2 DSGVO, aber richterrechtlich entwickelt.'
  - 'OIPC-Empfehlung 2025: Sicherheits- und Sicherungsanforderungen für KI-Systeme, Transparenz und Erklärbarkeit
    gegenüber Nutzern UND Aufsicht, Nachverfolgbarkeit, Rechenschaft — inhaltlich eine Provinzfassung
    der KI-VO-Kernpflichten.'
  - Alberta hat 2024/25 eine Konsultation zur PIPA-Modernisierung durchgeführt; ein Gesetzentwurf lag
    am 01.09.2026 nicht vor.
