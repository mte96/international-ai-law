- id: au-patents-act-1990
  jurisdiktion: au
  kurztitel: Patents Act 1990
  offizieller_titel: Patents Act 1990 (Cth)
  fundstelle: Act No. 83 of 1990
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Durch Commissioner of Patents gegen Thaler (Full Court of the Federal
    Court, 13.04.2022) ist geklärt, dass ein Erfinder im Sinne des Gesetzes eine natürliche Person sein
    muss; der High Court hat die Zulassung der Revision am 11.11.2022 abgelehnt. Die erstinstanzliche
    Gegenentscheidung (Beach J, 30.07.2021), die weltweit einzige, die ein KI-System als Erfinder zuließ,
    ist damit aufgehoben.

    '
  kurzbeschreibung: 'Für KI sind zwei Komplexe maßgeblich. Erstens die Erfinderschaft: s. 15(1) bestimmt,
    wem ein Patent erteilt werden kann, und knüpft an den Erfinder an; das Full Court hat entschieden,
    dass daraus das Erfordernis einer natürlichen Person folgt, weil das Gesetz Ableitungen des Rechts
    vom Erfinder voraussetzt, die eine Maschine nicht vornehmen kann. Zweitens die Patentierbarkeit: s.
    18(1)(a) verlangt eine "manner of manufacture"; nach Commissioner of Patents gegen Aristocrat Leisure
    (High Court 2022) und der Rechtsprechung zu Encompass ist eine reine Rechenoperation ohne technische
    Wirkung nicht patentierbar — die australische Praxis ist softwarefeindlicher als die europäische.

    '
  inkrafttreten:
    datum: 1991-04-30
    verifiziert: true
    quelle: https://www.legislation.gov.au/C2004A04014/latest/text
    fundstelle_norm: 'Sec. 2(2) Patents Act 1990 i.V.m. Endnote 3 der amtlichen Kompilation: "83, 1990
      | Assent 30 Oct 1990 | Commencement 30 Apr 1991 (s 2(2))".'
  anwendungsdaten:
  - datum: 2022-04-13
    was_gilt: 'Full Court: Erfinder muss natürliche Person sein (Thaler).'
    verifiziert: false
    quelle: https://www.legislation.gov.au/C2004A04014
  themenachsen:
  - urheberrecht
  - marktzugang
  - gpai
  regelungsschwerpunkte:
  - Australien ist die einzige Rechtsordnung, in der ein Gericht erster Instanz DABUS als Erfinder anerkannt
    hat (Beach J, 2021) — und die einzige, in der diese Entscheidung binnen neun Monaten von der Berufungsinstanz
    aufgehoben wurde. Die beiden Urteile zusammen sind das beste Material zur Frage, ob die Erfindereigenschaft
    eine Rechts- oder eine Sprachfrage ist.
  - 's. 15(1): Ableitungskette vom Erfinder. Eine Maschine kann kein Recht übertragen; deshalb scheitert
    die Anmeldung nicht am Begriff des Erfinders allein, sondern an der Berechtigung.'
  - 's. 18(1)(a) ''manner of manufacture'': Nach Aristocrat ist die Schwelle für computerimplementierte
    Erfindungen hoch. Für KI-Anwendungen ist ein konkreter technischer Effekt darzulegen.'
  - IP Australia hat keine gesonderten KI-Prüfungsrichtlinien erlassen; es gilt die allgemeine Praxis.
  dokumente:
  - datum: 1990-10-30
    typ: konsolidiert
    titel: Patents Act 1990 (Cth)
    url: https://www.legislation.gov.au/C2004A04014
    sprache: en
    urheber: Australian Government
    verifiziert: false
    notiz: Amtliche Fassung;
  bedeutung_eu_anbieter: 'Keine praktische Abweichung bei der Erfinderbenennung; erhebliche Abweichung
    bei der Patentierbarkeit computerimplementierter Erfindungen, wo Australien restriktiver ist als das
    EPA. Für KI-Portfolios bedeutet das eigene Anspruchsfassungen mit ausgeprägtem technischen Anwendungsbezug.

    '
  offene_punkte:
  - Ob der Gesetzgeber auf die Thaler-Rechtsprechung reagiert (bislang nicht).
  monitoring_quellen:
  - https://www.ipaustralia.gov.au/
