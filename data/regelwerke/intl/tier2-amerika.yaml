  bedeutung_eu_anbieter: 'Der IT Act entscheidet darüber, OB man in Indien Adressat ist. Wer als Intermediär
    gilt — und das ist weit zu verstehen: Plattformen, Hosting, Suchmaschinen und nach der Auslegung von
    MeitY auch Anbieter generativer Dienste, die Inhalte für Nutzer verfügbar machen —, unterliegt den
    IT Rules mit allen Kennzeichnungs- und Prüfpflichten und riskiert bei Verstoß den Verlust der Haftungsfreistellung.
    Wer reines Modell-Hosting ohne Publikumsangebot betreibt, ist nach dem Wortlaut nicht erfasst. Diese
    Abgrenzung ist im indischen Recht nirgends definiert und der wichtigste Beratungspunkt.

    '
  offene_punkte:
  - Ob der Digital India Act den IT Act ersetzt und ob er Modellanbieter erfasst.
  - Ob generative KI-Anbieter Intermediäre im Sinne des s. 2(1)(w) sind — von MeitY vorausgesetzt, gerichtlich
    nicht geklärt.
