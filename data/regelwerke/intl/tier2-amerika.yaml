- id: us-ca-ab-2839
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: AB 2839 — kalifornisches Wahl-Deepfake-Gesetz (aufgehoben)
  offizieller_titel: 'Elections: deceptive media in advertisements (AB 2839, 2024)'
  fundstelle: Cal. Elections Code § 20012 (durch Urteil außer Anwendung)
  verfahrensnummer: AB 2839 (2023-2024 Regular Session)
  status: aufgehoben
  status_detail: 'Am 02.10.2024 im Wege der einstweiligen Verfügung außer Vollzug gesetzt, am 29.08.2025
    vom U.S. District Court for the Eastern District of California (Richter John Mendez) in Kohls gegen
    Bonta endgültig für verfassungswidrig erklärt. Das Gesetz ist nicht anwendbar.

    '
  kurzbeschreibung: 'AB 2839 untersagte die Verbreitung wesentlich täuschender KI-erzeugter Inhalte über
    Kandidaten, Wahlbeamte und Wahlvorgänge in einem Zeitfenster um Wahlen und gab Betroffenen einen Unterlassungsanspruch.
    Das Gericht wandte strenge Prüfung an, weil das Gesetz an Inhalt, Standpunkt und Sprecher anknüpfte,
    und hielt es für nicht hinreichend eng zugeschnitten: Gegenrede sei das mildere Mittel; die erfassten
    Äußerungen fielen nicht unter die anerkannten Ausnahmen vom Schutz der Meinungsfreiheit. Das Gericht
    deutete zugleich an, dass ein enger zugeschnittenes Gesetz über falsche Angaben zu Ort, Zeit und Art
    der Stimmabgabe verfassungsgemäß sein könnte.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.techpolicy.press/tracker/kohls-v-bonta/
  anwendungsdaten:
  - datum: 2024-10-02
    was_gilt: Einstweilige Verfügung gegen die Anwendung.
    verifiziert: false
    quelle: https://www.techpolicy.press/tracker/kohls-v-bonta/
  - datum: 2025-08-29
    was_gilt: 'Endgültige Entscheidung: Verstoß gegen den First Amendment; strenge Prüfung, kein enger
      Zuschnitt.'
    verifiziert: false
    quelle: https://reason.com/volokh/2025/08/29/california-law-restricting-materially-deceptive-election-related-deepfakes-violates-first-amendment/
  themenachsen:
  - content
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'WARUM ES GESCHEITERT IST: Anknüpfung an Inhalt, Standpunkt und Sprecher löst strenge Prüfung aus;
    politische Rede genießt den höchsten Schutz; Satire und Parodie waren nur unzureichend ausgenommen;
    Gegenrede ist das mildere Mittel.'
  - 'Der überlebende Hinweis des Gerichts: Gesetze gegen falsche Angaben über Ort, Zeit und Art der Stimmabgabe
    könnten Bestand haben. Das ist die Blaupause für künftige US-Wahl-Deepfake-Gesetze.'
  - 'Kontrast zur EU: Art. 50 KI-VO knüpft an die Kennzeichnung an, nicht an das Verbot des Inhalts; Art.
    26 DSA verlangt Werbetransparenz. Beides ist inhaltsneutral und deshalb im US-Verfassungsrecht eher
    haltbar — der eigentliche Grund, warum die europäische Regelungstechnik hier überlegen ist.'
  - 'Für die Praxis: Kalifornien hat mit AB 2839 und AB 2655 beide Wahl-Deepfake-Gesetze verloren. Wirksam
    bleiben die Offenlegungspflichten für Werbetreibende nach anderen Vorschriften und AB 3030 im Gesundheitsbereich.'
  dokumente:
  - datum: 2025-08-29
    typ: uebersicht
    titel: California Law Restricting 'Materially Deceptive' Election-Related Deepfakes Violates First
      Amendment
    url: https://reason.com/volokh/2025/08/29/california-law-restricting-materially-deceptive-election-related-deepfakes-violates-first-amendment/
