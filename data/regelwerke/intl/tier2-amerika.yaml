  kurztitel: ANPD — KI-Regulierung, Sandkasten, Regulierungsagenda
  offizieller_titel: 'Autoridade Nacional de Proteção de Dados — Agenda Regulatória 2025/2026, Nota Técnica
    nº 12/2025 und Sandbox Regulatório em Inteligência Artificial e Proteção de Dados

    '
  fundstelle: Autoridade Nacional de Proteção de Dados (ANPD)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Die ANPD ist die faktische KI-Aufsicht Brasiliens, ohne dafür eine KI-rechtliche Grundlage
    zu haben. Stand 01.09.2026 liegt KEINE Verordnung zu Art. 20 LGPD vor. Der Regulierungssandkasten
    zu KI und Datenschutz läuft: Pilot ab Juni 2025, Auswahl von drei Unternehmen im Oktober 2025, praktische
    Erprobung ab Februar 2026, Abschluss und Bericht für Dezember 2026 angekündigt; die Testmethodik wurde
    am 19.08.2026 veröffentlicht.

    '
  kurzbeschreibung: 'Die ANPD arbeitet auf drei Ebenen an KI. Erstens die Regulierungsagenda 2025/26,
    deren Punkt 7 die Überprüfung automatisierter Entscheidungen nach Art. 20 LGPD betrifft; die Anhörung
    lief von November bis Dezember 2024, die Auswertung wurde im Mai 2025 vorgelegt (Nota Técnica 12/2025).
    Zweitens der Regulierungssandkasten für KI und Datenschutz, der in sechs Zyklen mit je drei Phasen
    (Vorbereitung und Detaillierung, Erprobung und Risikosteuerung, Bewertung und Anpassung) Nachweise
    über Risikosteuerung, algorithmische Transparenz und den Schutz Minderjähriger erzeugen soll. Drittens
    die Vorbereitung auf die Rolle als residuale Regulierungsbehörde im künftigen SIA nach PL 2338 — mit
    Normsetzungs-, Aufsichts- und Sanktionsbefugnis für Sektoren ohne eigene KI-Regeln, Zertifizierung
    von KI-Systemen und internationaler Vertretung Brasiliens.

    '
