- id: ca-genai-code-of-conduct
  jurisdiktion: ca
  kurztitel: Freiwilliger Verhaltenskodex für generative KI
  offizieller_titel: 'Voluntary Code of Conduct on the Responsible Development and Management of Advanced
    Generative AI Systems

    '
  fundstelle: Innovation, Science and Economic Development Canada
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 27.09.2023 von Minister Champagne als Brücke bis zum Inkrafttreten von AIDA eingeführt.
    Die Brücke steht noch, das Ziel ist weg: AIDA ist tot, der Kodex gilt weiter. Die amtliche Seite wurde
    zuletzt am 04.06.2026 aktualisiert und führt 48 Unterzeichner, darunter IBM, Salesforce, Mastercard,
    CIBC, TELUS, Mila, Vector Institute und Cohere. CIBC trat im März 2025 als erste große kanadische
    Bank bei.

    '
  kurzbeschreibung: 'Der Kodex verpflichtet Unterzeichner auf sechs Grundsätze: Rechenschaft, Sicherheit,
    Fairness und Gleichbehandlung, Transparenz, menschliche Aufsicht und Überwachung sowie Validität und
    Robustheit. Er unterscheidet zwischen Entwicklern (Datensatzkuratierung, Verzerrungstests, adversariale
    Tests, Cybersicherheitsbewertungen, Nutzungshinweise, Vorfalldatenbank) und Betreibern (Überwachung
    schädlicher Nutzung, Nutzungskontrollen, deutliche und auffällige Kennzeichnung des Systems als KI,
    wo es mit einem Menschen verwechselt werden könnte). Rechtsfolgen gibt es keine; die einzige Sanktion
    ist der Austritt aus der Liste.

    '
  inkrafttreten:
    datum: 2023-09-27
    verifiziert: true
    quelle: https://ised-isde.canada.ca/site/ised/en/voluntary-code-conduct-responsible-development-and-management-advanced-generative-ai-systems
  anwendungsdaten:
