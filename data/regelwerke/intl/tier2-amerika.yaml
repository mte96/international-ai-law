  regelungsschwerpunkte:
  - Art. 46 ist ein GESCHLOSSENER Schrankenkatalog ohne Auffangklausel — der schärfste Unterschied zu
    den USA. Wer in Brasilien trainiert, kann sich weder auf fair use noch auf eine Forschungsschranke
    stützen.
  - 'Art. 11: Urheber ist die natürliche Person, die das Werk geschaffen hat. Für KI-Ausgaben folgt daraus,
    dass kein Urheberrechtsschutz entsteht, soweit keine schöpferische menschliche Leistung vorliegt —
    eine gesetzliche Klarstellung fehlt.'
  - 'Art. 29 I: Vervielfältigungsvorbehalt. Der Trainingsvorgang setzt Vervielfältigungen voraus; ohne
    Schranke bleibt nur die Lizenz.'
  - Der Vergütungsanspruch für Trainingsnutzungen im Senatstext von PL 2338 ist die politische Antwort
    auf diese Lage — und einer der Punkte, an denen der Text im Abgeordnetenhaus angegriffen wird.
  - 'Praktisch relevant für Persönlichkeitsrechte: Stimme und Bildnis sind über Art. 20 des Zivilgesetzbuchs
    (Código Civil) geschützt, nicht über die LDA; für Deepfakes ist das die einschlägige Anspruchsgrundlage.'
