  bedeutung_eu_anbieter: 'Wer in den USA einen generativen Dienst betreibt, sollte nicht mit § 230 planen:
    Für selbst erzeugte Ausgaben greift er nach einhelliger Praxis nicht, und die Verfahren werden über
    Produkthaftung, Verbraucherschutz und Fahrlässigkeit geführt. Für europäische Anbieter ist die Lage
    damit ähnlicher als sie scheint — auch Art. 6 DSA schützt keine eigenen Inhalte. Der praktische Unterschied
    liegt in den Folgen: US-Produkthaftung mit Geschworenen und Strafschadensersatz, europäische Aufsicht
    mit Bußgeld.

    '
  offene_punkte:
  - Ob ein Berufungsgericht ausdrücklich entscheidet, dass generative Ausgaben nicht privilegiert sind.
  - Ob der Kongress § 230 für KI ändert; entsprechende Entwürfe liegen seit 2023 vor, ohne Fortschritt.
