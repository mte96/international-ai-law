  bedeutung_eu_anbieter: 'Wer Modelle an kanadische Finanzinstitute liefert, wird ab 01.05.2027 vertraglich
    in deren Modellrisikorahmen eingebunden: Dokumentation der Methode, Trainings- und Validierungsdaten,
    Leistungskennzahlen, Überwachungsschnittstellen, Meldung wesentlicher Änderungen. Wer bereits nach
    DORA (VO (EU) 2022/2554) und den EBA-Leitlinien zum Auslagerungsmanagement liefert, kennt die Struktur;
    neu ist die ausdrückliche Einbeziehung generativer Modelle und die Pflicht zur Aufnahme ins Modellinventar
    des Instituts. Praktisch heißt das: Ein Vertrieb, der die Modellkarte nicht liefern kann, ist ab 2027
    nicht mehr anschlussfähig.

    '
  offene_punkte:
  - Wie OSFI mit Basismodellen Dritter umgeht, deren Innenleben das Institut nicht kennt.
  - Ob eine gesonderte Leitlinie zu generativer KI folgt.
