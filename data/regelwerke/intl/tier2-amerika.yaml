  bedeutung_eu_anbieter: 'Für Anbieter wenig, für die vergleichende Dogmatik viel. Kanada zeigt, was passiert,
    wenn eine Verwaltung KI ohne gesetzliche Grundlage und ohne Auskunftsanspruch einsetzt: Die Kontrolle
    verlagert sich vollständig auf die Begründungsqualität, und der Betroffene trägt die Beweislast für
    einen Fehler in einem System, das er nicht kennt. Wer in der EU Behörden beliefert, sollte umgekehrt
    argumentieren können: Art. 86 KI-VO (Recht auf Erläuterung bei Hochrisiko-Entscheidungen) und Art.
    15 Abs. 1 lit. h DSGVO sind genau die Instrumente, die Kanada fehlen.

    '
