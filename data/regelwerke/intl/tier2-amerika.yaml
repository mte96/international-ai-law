- id: ca-bill-c-36-ppcda
  jurisdiktion: ca
  kurztitel: Bill C-36 — Protecting Privacy and Consumer Data Act
  offizieller_titel: 'An Act to enact the Protecting Privacy and Consumer Data Act, to amend the Personal
    Information Protection and Electronic Documents Act and to make amendments to other Acts

    '
  fundstelle: noch keine — Gesetzentwurf
  verfahrensnummer: Bill C-36, 45. Parlament, 1. Sitzungsperiode
  status: verfahren
  status_detail: 'Erste Lesung am 15.06.2026, eingebracht vom Minister of Artificial Intelligence and
    Digital Innovation (Evan Solomon). Stand 01.09.2026 in zweiter Lesung im Unterhaus; Ausschussberatung
    für den Herbst 2026 erwartet. Dritter Anlauf zur Reform des Bundesdatenschutzrechts nach Bill C-11
    (2020) und Bill C-27 (2022), beide verfallen.

    '
  kurzbeschreibung: 'C-36 ersetzt die datenschutzrechtlichen Kernvorschriften des PIPEDA durch den Protecting
    Privacy and Consumer Data Act (PPCDA). Für KI ist s. 63 die entscheidende Vorschrift: Wer ein automatisiertes
    Entscheidungssystem einsetzt, das Vorhersagen, Empfehlungen oder Entscheidungen mit rechtlicher oder
    ähnlich erheblicher Wirkung hervorbringt, muss auf Verlangen erklären, welche Art personenbezogener
    Daten verwendet wurde, woher sie stammen und welches die maßgeblichen Faktoren waren; die betroffene
    Person kann schriftlich gegenüber einem Menschen Stellung nehmen, der die Entscheidung überprüfen
    kann. Die Definition des automatisierten Entscheidungssystems ist technologieoffen und umfasst regelbasierte
    Systeme, Regression, prädiktive Analytik, maschinelles Lernen, Deep Learning und neuronale Netze.
    Durchsetzung durch eine neue Digital Safety and Data Protection Commission of Canada mit Bußgeldern
    bis 10 Mio. CAD oder 3 % des weltweiten Bruttoumsatzes, bei schweren Verstößen bis 25 Mio. CAD oder
    5 %, dazu ein privates Klagerecht mit zweijähriger Verjährung.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.parl.ca/legisinfo/en/bill/45-1/c-36
  anwendungsdaten:
  - datum: 2026-06-15
    was_gilt: Erste Lesung. Keine materielle Wirkung; Vorschriften treten erst nach Royal Assent und gestaffelter
      Inkraftsetzung.
    verifiziert: true
    quelle: https://www.parl.ca/legisinfo/en/bill/45-1/c-36
  themenachsen:
  - datenschutz
  - governance
  - grundrechte
  - haftung
  - arbeit
  regelungsschwerpunkte:
  - 's. 63 PPCDA: Erklärungsanspruch bei automatisierten Entscheidungen mit rechtlicher oder ähnlich erheblicher
    Wirkung — Datenarten, Herkunft, maßgebliche Faktoren; Recht auf schriftliche Stellungnahme gegenüber
    einem überprüfungsbefugten Menschen. Das ist ein Transparenz- und Kontradiktionsmodell, KEIN Verbot
    wie Art. 22 DSGVO.'
  - 'Neue Aufsicht: Digital Safety and Data Protection Commission of Canada mit fünf Mitgliedern, darunter
    ein Privacy and Consumer Data Commissioner. Sie ersetzt das Office of the Privacy Commissioner. Anders
    als C-27 gibt es KEIN eigenes Tribunal — die Zwischeninstanz, an der die frühere Reform kritisiert
    wurde, entfällt.'
  - 'Bußgelder: bis 10 Mio. CAD oder 3 % Weltbruttoumsatz (Regelfall); bis 25 Mio. CAD oder 5 % bei schweren
    Verstößen, etwa wissentlicher Verletzung der Meldepflicht oder Missachtung von Anordnungen.'
  - 'Privates Klagerecht: Schadensersatzklage nach festgestelltem Verstoß, Verjährung zwei Jahre. PIPEDA
    kennt das nicht — das ist der praktisch größte Unterschied für die Risikobewertung.'
  - Kinderdaten und 'surveillance pricing' sind ausdrücklich adressiert; die Ausnahme vom Einwilligungserfordernis
    gilt NICHT für Tätigkeiten, die darauf angelegt sind, Verhalten oder Entscheidungen zu beeinflussen.
  - 'Ausdrücklich KEIN KI-Gesetz: C-36 enthält keinen AIDA-Nachfolger. Kanada reguliert KI damit über
    das Datenschutzrecht — genau der Weg, den die IAPP-Beobachter für 2026 vorhergesagt haben.'
