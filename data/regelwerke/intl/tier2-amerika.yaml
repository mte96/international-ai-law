- id: in-meity-ki-advisories
  jurisdiktion: in
  kurztitel: MeitY-Advisories zu KI und Deepfakes
  offizieller_titel: 'Advisories des Ministry of Electronics and Information Technology zu Deepfakes (November/Dezember
    2023) und zum Einsatz von KI-Modellen (01.03.2024, revidiert 15.03.2024)

    '
  fundstelle: MeitY-Advisories; gestützt auf IT Act 2000 und IT Rules 2021
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Advisories sind ministerielle Hinweise ohne eigene Ermächtigungsgrundlage. Ihre Verbindlichkeit
    ist ausdrücklich umstritten: Sie verweisen auf bestehende Pflichten der IT Rules und drohen mittelbar
    mit dem Verlust der Haftungsfreistellung. Der praktische Ertrag ist gleichwohl hoch — die Advisory
    vom 01.03.2024 hat international Aufsehen erregt und wurde binnen zwei Wochen entschärft.

    '
  kurzbeschreibung: 'Die Advisory vom 01.03.2024 verlangte, dass unerprobte oder unzuverlässige KI-Modelle,
    Sprachmodelle und generative Systeme in Indien nur mit ausdrücklicher Erlaubnis der Regierung öffentlich
    bereitgestellt werden dürfen; ferner Kennzeichnung KI-erzeugter oder -veränderter Inhalte, ein Einwilligungshinweis
    über die Unzuverlässigkeit der Ausgaben, Aufklärung über die Folgen rechtswidriger Inhalte und Statusberichte
    an das Ministerium. Die revidierte Fassung vom 15.03.2024 strich die Erlaubnispflicht ersatzlos, lockerte
    die Berichtspflicht und dehnte die Sorgfaltspflichten auf alle Intermediäre und Plattformen aus —
    nicht nur auf bedeutende. Die vorangegangenen Deepfake-Advisories vom November und Dezember 2023 wiesen
    Intermediäre auf die Pflichten nach Rule 3(1)(b) und Rule 3(2)(b) hin und forderten die Entfernung
    von Deepfakes binnen 24 bzw. 36 Stunden.

    '
  inkrafttreten:
    datum: 2024-03-01
    verifiziert: false
    quelle: https://www.jsalaw.com/newsletters-and-updates/revised-meity-advisory-on-deployment-of-ai-models/
  anwendungsdaten:
  - datum: 2024-03-01
    was_gilt: 'Erste Advisory: Erlaubnisvorbehalt für unerprobte Modelle, Kennzeichnung, Einwilligungshinweis,
      Berichtspflicht.'
    verifiziert: false
    quelle: https://www.jsalaw.com/newsletters-and-updates/revised-meity-advisory-on-deployment-of-ai-models/
  - datum: 2024-03-15
    was_gilt: 'Revidierte Advisory: Erlaubnisvorbehalt gestrichen, stattdessen Hinweis auf Unzuverlässigkeit;
      Ausdehnung auf alle Intermediäre.'
    verifiziert: false
    quelle: https://www.jsalaw.com/newsletters-and-updates/revised-meity-advisory-on-deployment-of-ai-models/
  themenachsen:
  - content
  - gpai
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 'Der Erlaubnisvorbehalt vom 01.03.2024 war weltweit einmalig: eine staatliche Vorabgenehmigung für
    die Bereitstellung generativer Modelle. Er wurde nach zwei Wochen zurückgenommen — der bislang deutlichste
    Beleg dafür, wie stark Indiens KI-Politik zwischen Kontrolle und Standortförderung schwankt.'
  - 'Was blieb: Kennzeichnungserwartung und Unzuverlässigkeitshinweis. Beides ist 2026 in die IT-Änderungsregeln
    überführt und damit verbindlich geworden — die Advisory war der Testlauf.'
  - 'Rechtsnatur: Advisories haben keine eigene Ermächtigungsgrundlage. Sie wirken über die Auslegung
    der Sorgfaltspflicht der IT Rules und über die Drohung mit dem Verlust der Haftungsfreistellung. Die
    anwaltliche Literatur hält die Verbindlichkeit für zweifelhaft.'
  - 'Muster: Indien reguliert erst per Advisory, prüft die Reaktion und gießt das Ergebnis dann in Regeln.
    Wer die Advisories beobachtet, kennt die Vorschriften des Folgejahres.'
