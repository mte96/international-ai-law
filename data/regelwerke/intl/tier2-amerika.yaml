    mit Regierungsauftrag — wie das britische AISI, anders als die künftige EU-Behörde nach Art. 64 ff.
    KI-VO.'
  - 'Zweigleisige Forschungsförderung über CIFAR: von Forschenden initiiert und von der Regierung beauftragt.'
  - 'Internationale Anschlussfähigkeit ist der eigentliche Zweck: gemeinsame Modelltests im Netzwerk der
