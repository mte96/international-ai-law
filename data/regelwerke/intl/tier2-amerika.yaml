- id: in-it-amendment-rules-2026
  jurisdiktion: in
  kurztitel: IT-Änderungsregeln 2026 — Kennzeichnung synthetischer Inhalte
  offizieller_titel: 'The Information Technology (Intermediary Guidelines and Digital Media Ethics Code)
    Amendment Rules, 2026

    '
  fundstelle: G.S.R. 120(E) vom 10.02.2026, Gazette of India; anwendbar ab 20.02.2026
  verfahrensnummer: Konsultationsentwurf Oktober 2025; erlassen auf Grundlage von s. 87 IT Act 2000
  status: anwendbar
  status_detail: 'Bekanntgemacht am 16.02.2026, wirksam ab dem 20.02.2026, mit einer Umsetzungsfrist von
    zehn Tagen für die technischen und betrieblichen Anpassungen der Intermediäre. Die weltweit schärfste
    Kennzeichnungsregelung für synthetische Inhalte, weil sie die Plattform zur ÜBERPRÜFUNG der Nutzerangaben
    verpflichtet.

    '
  kurzbeschreibung: 'Die Änderungsregeln führen den Begriff der "synthetically generated information"
    (SGI) in die IT Rules ein: Ton-, Bild- oder audiovisuelle Inhalte, die mit Computerressourcen künstlich
    erzeugt oder verändert wurden, so dass sie echt, authentisch oder wahr erscheinen und von natürlichen
    Personen oder realen Ereignissen nicht zu unterscheiden sind. Reiner Text, gewöhnliche Bearbeitung,
    Dokumentenerstellung sowie Barrierefreiheits- und Übersetzungswerkzeuge sind ausgenommen. Wer SGI
    verfügbar macht, muss sie kennzeichnen; die Kennzeichnung muss auffällig, leicht erkennbar und angemessen
    wahrnehmbar sein, bei Tonmaterial durch eine vorangestellte Ansage. Bedeutende Anbieter sozialer Medien
    müssen von Nutzern eine Erklärung über den SGI-Charakter einholen UND technische Maßnahmen einsetzen,
    um die Richtigkeit dieser Erklärung zu überprüfen; die frühere Formulierung "endeavour to deploy"
    wurde durch "deploy" ersetzt. Wer wissentlich rechtswidrige SGI zulässt, verletzt die Sorgfaltspflicht
    und verliert die Haftungsfreistellung nach s. 79 IT Act.

    '
  inkrafttreten:
    datum: 2026-02-20
    verifiziert: false
    quelle: https://www.khaitanco.com/thought-leadership/MeitY-notifies-the-IT-Amendment-Rules-2026
