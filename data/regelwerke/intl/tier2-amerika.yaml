    notiz: Amtsnahe Zusammenfassung; Grundlage für die Wiedergabe der sieben Sutras, der Institutionen
      und des Stufenplans.
  - datum: 2025-11-06
    typ: bericht
    titel: MeitY launches India AI Governance Guidelines under IndiaAI Mission
    url: https://www.scconline.com/blog/post/2025/11/06/meity-launches-india-ai-governance-guidelines-under-indiaai-mission-2025/
    sprache: en
    urheber: SCC Online
    verifiziert: false
    notiz: Quelle für Datum, Beteiligte und Entstehungszusammenhang. Die dort wiedergegebene Sutra-Liste
      weicht ab und ist nicht übernommen.
  - datum: 2026-02-15
    typ: pressemitteilung
    titel: India AI Governance Guidelines (PIB)
    url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2228315&reg=48&lang=2
    sprache: en
    urheber: Press Information Bureau, Government of India
    verifiziert: true
    notiz: Amtliche Wiedergabe im Umfeld des AI Impact Summit 2026; nennt sechs Empfehlungssäulen (Infrastruktur,
      Kapazitätsaufbau, Politik und Regulierung, Risikominderung, Rechenschaft, Institutionen).
  bedeutung_eu_anbieter: 'Die Guidelines sind das Lesezeichen für Indien: Sie sagen, was kommt, ohne zu
    binden. Wer dort plant, sollte drei Dinge daraus mitnehmen. Erstens: Es wird kein indisches Gegenstück
    zur KI-VO geben, an dem man Konformität ausrichten könnte — Compliance erfolgt sektor- und normspezifisch.
    Zweitens: Der Durchsetzungsweg ist die Technik (Kennzeichnung, Herkunftsnachweis, Einwilligung), nicht
    die Bescheinigung. Drittens: Wer eine abgestufte Verantwortungsverteilung in der Wertschöpfungskette
    dokumentiert — wie sie Art. 25 KI-VO für Anbieter, Einführer und Händler regelt —, ist auf das indische
    Haftungsmodell vorbereitet.

    '
  offene_punkte:
  - Ob AIGG, TPEC und AISI tatsächlich errichtet wurden und mit welchen Befugnissen.
  - Welche 'gezielten Änderungen' an IT Act, DPDP Act und Copyright Act kommen.
  - Ob die Regierung der Empfehlung des Parlamentsausschusses nach einem umfassenden KI-Gesetz folgt.
