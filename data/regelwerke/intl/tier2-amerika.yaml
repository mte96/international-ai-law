- id: au-defamation-act-2005
  jurisdiktion: au
  kurztitel: Defamation Act 2005 (Modellgesetz der Bundesstaaten)
  offizieller_titel: 'Defamation Act 2005 in den Fassungen der Bundesstaaten und Territorien (Model Defamation
    Provisions), mit den Stufe-1-Reformen (2021) und den Stufe-2-Reformen für digitale Intermediäre

    '
  fundstelle: z. B. Defamation Act 2005 (NSW) No 77
  verfahrensnummer: Model Defamation Amendment Provisions 2021 (Part A) und Stage 2 (Part B)
  status: teilanwendbar
  status_detail: 'Uneinheitlich in Kraft. Die Stufe-2-Reformen für digitale Intermediäre gelten in New
    South Wales und im Australian Capital Territory seit dem 01.07.2024, in Victoria seit dem 11.09.2024,
    im Northern Territory seit dem 11.08.2025, in Queensland und Tasmanien seit später im Jahr 2025. South
    Australia hat nur Teile übernommen und die Intermediärsausnahmen sowie die beschwerdegestützte Verteidigung
    nicht eingeführt; Western Australia steht außerhalb des Systems. Die angestrebte Einheitlichkeit besteht
    nicht.

    '
  kurzbeschreibung: 'Das Modellgesetz vereinheitlicht das australische Ehrschutzrecht. Für KI sind vier
    Vorschriften maßgeblich: s. 10A (seit 2021 Erfordernis eines ernsthaften Schadens für den Ruf — die
    Eingangsschwelle, an der Bagatellklagen wegen fehlerhafter KI-Ausgaben scheitern), s. 10D (bedingte
    Freistellung bestimmter Intermediäre, insbesondere von Suchmaschinen für organische Ergebnisse), s.
    31A (Verteidigung für digitale Intermediäre, die ein zugängliches Beschwerdeverfahren unterhalten
    und nach einer wirksamen schriftlichen Beschwerde binnen sieben Tagen angemessene Zugangsbeschränkungsmaßnahmen
    ergreifen) und s. 39A (Befugnis des Gerichts, auch nicht am Verfahren beteiligte digitale Intermediäre
    zur Entfernung oder Sperrung zu verpflichten).

    '
  inkrafttreten:
    datum: 2006-01-01
    verifiziert: true
    quelle: https://legislation.nsw.gov.au/view/pdf/asmade/act-2005-77
    fundstelle_norm: 's. 2 Defamation Act 2005 (NSW) No 77: ''This Act commences on 1 January 2006.''
      Assent 26.10.2005. Die uebrigen Bundesstaaten und Territorien haben inhaltsgleiche Modellgesetze
      mit eigenen, teils abweichenden Inkrafttretensdaten erlassen'
  anwendungsdaten:
  - datum: 2024-07-01
    was_gilt: Stufe-2-Reformen fuer digitale Intermediaere (u. a. Schutzeinrede fuer Plattformen, s. 31A
      ff.) in New South Wales und im Australian Capital Territory
    verifiziert: false
    quelle: https://www.recordinglaw.com/news/australia-digital-intermediary-defamation-reforms-commence/
  - datum: 2024-09-11
    was_gilt: Stufe-2-Reformen in Victoria
    verifiziert: false
    quelle: https://www.recordinglaw.com/news/australia-digital-intermediary-defamation-reforms-commence/
  - datum: 2025-08-11
    was_gilt: Stufe-2-Reformen im Northern Territory
    verifiziert: false
    quelle: https://www.recordinglaw.com/news/australia-digital-intermediary-defamation-reforms-commence/
  themenachsen:
  - content
  - haftung
  - grundrechte
  regelungsschwerpunkte:
  - 's. 31A ist die für generative KI entscheidende Norm — und zugleich die problematischste: Sie schützt
    den INTERMEDIÄR, der fremde Inhalte zugänglich macht. Ob der Betreiber eines Sprachmodells, dessen
    Ausgabe eine unwahre Tatsachenbehauptung enthält, Intermediär in diesem Sinne ist, ist ungeklärt.
    Nach der Konstruktion des Gesetzes eher nicht: Er macht keine Äußerung eines Dritten zugänglich, sondern
    erzeugt sie.'
  - 's. 10A (ernsthafter Schaden): Die praktische Hürde für Klagen wegen KI-Halluzinationen. Eine falsche
    Angabe, die nur der Prompt-Ersteller gesehen hat, wird die Schwelle regelmäßig nicht erreichen — deshalb
    gibt es bis 2026 keine australische Sachentscheidung zur Verleumdung durch KI-Ausgaben.'
  - 's. 10D: Freistellung von Suchmaschinen für organische Ergebnisse — die gesetzgeberische Antwort auf
    Google gegen Defteros (High Court 2022).'
  - 's. 39A: Anordnungen gegen nicht beteiligte Intermediäre. Für die Durchsetzung gegen Modellanbieter
    ohne australische Niederlassung die einzige praktikable Grundlage.'
  - 'Die Uneinheitlichkeit ist die praktische Hauptbotschaft: Wer australienweit anbietet, muss mit sechs
    verschiedenen Rechtslagen rechnen; Western Australia hat keine der Reformen.'
  dokumente:
  - datum: 2025-01-01
    typ: uebersicht
    titel: Australia's 'Stage 2' Defamation Reforms Take Effect, Rewriting When Online Platforms Are Liable
      for Other People's Posts
    url: https://www.recordinglaw.com/news/australia-digital-intermediary-defamation-reforms-commence/
    sprache: en
    urheber: Recording Law
    verifiziert: false
    notiz: Quelle für die Inkraftsetzungsdaten je Bundesstaat, ss. 10D, 31A, 39A und die abweichende Lage
      in South Australia und Western Australia.
  - datum: 2024-07-01
    typ: uebersicht
    titel: 'Intermediate Steps for Digital Intermediaries: The Stage 2 Defamation Reforms'
    url: https://www.ashurst.com/en/insights/intermediate-steps-for-digital-intermediaries-the-stage-2-defamation-reforms/
    sprache: en
    urheber: Ashurst
    verifiziert: false
    notiz: Anwaltliche Auswertung der Stufe-2-Reformen.
  bedeutung_eu_anbieter: 'Wer ein Sprachmodell in Australien anbietet, sollte NICHT damit rechnen, unter
    s. 31A zu fallen: Die Verteidigung ist auf Intermediäre zugeschnitten, die fremde Äußerungen verbreiten.
    Der praktische Schutz liegt in der Eingangsschwelle des s. 10A und in einem funktionierenden Beschwerdeverfahren,
    das binnen sieben Tagen reagiert — die Frist des s. 31A taugt als Maßstab, auch wenn die Norm nicht
    unmittelbar greift. In Europa gibt es keine Entsprechung; Ehrschutzansprüche gegen KI-Ausgaben laufen
    dort über das allgemeine Deliktsrecht.

    '
  offene_punkte:
  - Ob ein australisches Gericht entscheidet, dass ein Modellanbieter Intermediär im Sinne des s. 31A
    ist.
  - Ob Western Australia die Reformen übernimmt.
  monitoring_quellen:
  - https://dcj.nsw.gov.au/about-us/engage-with-us/public-consultations/statutory-reviews/review-model-defamation-provisions.html
  bezug_regelwerke:
  - au-acl-2010
  - au-online-safety-act-2021
  - us-cda-230
  - br-marco-civil
  letzte_pruefung: 2026-09-01
  pruefvermerk:
  - 'Bestaetigt fuer das Leitgesetz NSW (s. 2, Wortlaut geprueft am ''as made''-Text). Die eingetragenen
    Daten der Stufe-2-Reformen in den einzelnen Bundesstaaten beruhen auf einer Sekundaerquelle und sind
    hier als anwendungsdaten mit verifiziert: false uebernommen; sie waeren an den jeweiligen Landesgesetzblaettern
    zu pruefen. Status teilanwendbar bestaetigt (South Australia und Western Australia haben die Stufe-2-Reformen
    nicht umgesetzt).'
- id: au-vic-sc-ai-guidelines
  jurisdiktion: au
  kurztitel: Supreme Court of Victoria — KI-Regeln (SC GEN 25)
  offizieller_titel: 'Practice Note SC GEN 25 — The use of Artificial Intelligence by Court users; zuvor
    Guidelines for Litigants: Responsible Use of Artificial Intelligence in Litigation (Mai 2024)

    '
  fundstelle: Practice Note SC GEN 25, Supreme Court of Victoria
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Die Praxisanweisung SC GEN 25 gilt seit dem 14.05.2026 und ersetzt die Leitlinien vom
    Mai 2024. Sie richtet sich an alle Verfahrensbeteiligten — Rechtsanwälte, vertretene und selbstvertretene
    Parteien sowie Zeugen. Für Richter und Gerichtspersonal bestehen gesonderte Leitlinien.

    '
  kurzbeschreibung: 'SC GEN 25 verlangt keine generelle Offenlegung, sondern Verantwortung und Überprüfung:
    Verfahrensbeteiligte haften für den Inhalt ihrer Schriftsätze unabhängig davon, ob KI eingesetzt wurde;
    jeder KI-erzeugte Inhalt ist unter bedeutsamer menschlicher Kontrolle zu überprüfen, Fundstellen sind
    gegen autoritative Quellen wie AustLII abzugleichen. Vertrauliche und sensible Informationen dürfen
    nicht in öffentlich zugängliche Systeme eingegeben werden; die anwaltliche Verschwiegenheit gilt unverändert.
    Besondere Zurückhaltung ist bei eidesstattlichen Versicherungen, Zeugenaussagen und Sachverständigengutachten
    geboten — diese müssen die eigene Kenntnis und die eigenen Worte der Person wiedergeben. Wer sich
    auf ungeprüfte KI-Ausgaben stützt, riskiert die Verweisung an das Victorian Legal Services Board und
    persönliche Kostenentscheidungen.

    '
  inkrafttreten:
    datum: 2026-05-14
    verifiziert: true
    quelle: https://www.supremecourt.vic.gov.au/areas/legal-resources/practice-notes/sc-gen-25-the-use-of-artificial-intelligence-by-court-users
  anwendungsdaten:
  - datum: 2024-05-01
    was_gilt: Erste Fassung als Guidelines for Litigants.
    verifiziert: false
    quelle: https://www.supremecourt.vic.gov.au/forms-fees-and-services/forms-templates-and-guidelines/guideline-responsible-use-of-ai-in-litigation
  - datum: 2026-05-14
    was_gilt: SC GEN 25 in Kraft; die Leitlinien von 2024 sind ersetzt.
    verifiziert: true
    quelle: https://www.supremecourt.vic.gov.au/areas/legal-resources/practice-notes/sc-gen-25-the-use-of-artificial-intelligence-by-court-users
  themenachsen:
  - berufsrecht
  - governance
  - content
  regelungsschwerpunkte:
  - 'Victoria wählt den mittleren Weg: keine Offenlegungspflicht wie der Federal Court, kein Verbot für
    Zeugenaussagen wie New South Wales, sondern Verantwortungs- und Überprüfungspflicht mit ausdrücklicher
    Warnung für Beweismittel.'
  - 'Berufsrechtliche Verzahnung: Verweisung an das Victorian Legal Services Board — die Praxisanweisung
    wirkt damit über das Verfahren hinaus.'
  - Kostenentscheidung gegen den Anwalt persönlich als Sanktion — dieselbe Technik wie im englischen Recht
    (Ayinde) und im Federal Court (GPN-AI Ziff. 5.1).
  - 'Vertraulichkeit: Verbot der Eingabe vertraulicher oder sensibler Informationen in öffentlich zugängliche
    Systeme — praktisch ein Verbot der Nutzung kostenloser Chatbots für Mandatsarbeit.'
  - Wer in mehreren australischen Gerichtsbarkeiten tätig ist, muss die strengste Regel (New South Wales)
    als Kanzleistandard fahren; die Regelwerke sind nicht harmonisiert.
  dokumente:
  - datum: 2026-05-14
    typ: leitlinie
    titel: Practice Note SC GEN 25 — The use of Artificial Intelligence by Court users
    url: https://www.supremecourt.vic.gov.au/areas/legal-resources/practice-notes/sc-gen-25-the-use-of-artificial-intelligence-by-court-users
    sprache: en
    urheber: Supreme Court of Victoria
    verifiziert: true
    notiz: Amtlicher Text; Quelle für Geltungsbeginn, Adressaten, Prüfpflicht und Sanktionen.
  - datum: 2024-05-01
    typ: leitlinie
    titel: 'Guidelines for litigants: responsible use of artificial intelligence in litigation'
    url: https://www.supremecourt.vic.gov.au/forms-fees-and-services/forms-templates-and-guidelines/guideline-responsible-use-of-ai-in-litigation
    sprache: en
    urheber: Supreme Court of Victoria
    verifiziert: false
    notiz: Vorgängerfassung; für die Entwicklung der Anforderungen aufschlussreich.
  bedeutung_eu_anbieter: 'Für Anbieter juristischer KI-Werkzeuge ein Anforderungskatalog: Verifizierbarkeit
    von Fundstellen gegen autoritative Quellen, Datenisolierung ohne Trainingsnutzung, Protokollierung
    der menschlichen Überprüfung. Wer diese drei Funktionen nicht bietet, ist in australischen Kanzleien
    nicht einsetzbar — unabhängig von der Qualität der Ausgaben.

    '
  offene_punkte:
  - Ob Victoria dem NSW-Verbot für Zeugenaussagen folgt.
  monitoring_quellen:
  - https://www.supremecourt.vic.gov.au/news
  - https://www.lawreform.vic.gov.au/
