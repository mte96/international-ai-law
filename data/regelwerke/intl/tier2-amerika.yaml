  regelungsschwerpunkte:
  - 'Art. 12.1 Abs. 1: Informationspflicht von Amts wegen, spätestens zum Zeitpunkt der Entscheidungsmitteilung
    — anders als Art. 15 DSGVO nicht antragsabhängig. Das ist die praktisch wichtigste Abweichung.'
  - 'Art. 12.1 Abs. 2: auf Verlangen Auskunft über verwendete Daten, Gründe, maßgebliche Faktoren und
    Parameter; Recht auf Berichtigung der verwendeten Daten; Gelegenheit zur Stellungnahme gegenüber einer
    überprüfungsbefugten Person.'
  - 'KEIN Verbot: Anders als Art. 22 DSGVO untersagt Quebec die vollautomatisierte Entscheidung nicht.
    Der Schutz ist prozedural. Ein automatisiertes Kredit- oder Bewerbungsscoring, das in der EU nur unter
    Art. 22 Abs. 2 DSGVO zulässig wäre, ist in Quebec zulässig, sofern informiert und Stellungnahme ermöglicht
    wird.'
  - 'Sanktionsniveau: bis 10 Mio. CAD oder 2 % Weltumsatz (Verwaltungsgeldbuße), bis 25 Mio. CAD oder
    4 % (Strafe) — die einzige kanadische Datenschutzregelung mit europäischem Sanktionsniveau.'
  - Privates Klagerecht mit Mindestschadensersatz von 1.000 CAD bei vorsätzlicher oder grob fahrlässiger
    Verletzung — Grundlage für Sammelklagen.
  - 'Räumliche Reichweite: Anknüpfung an die Ausübung einer unternehmerischen Tätigkeit in Quebec, nicht
    an die Niederlassung. Ein europäischer Anbieter mit quebecer Kundschaft ist erfasst.'
