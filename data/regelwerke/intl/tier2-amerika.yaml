regelwerke:
- id: ca-aida-c27
  jurisdiktion: ca
  kurztitel: AIDA (Bill C-27) — Kanadas gescheitertes KI-Gesetz
  offizieller_titel: 'Artificial Intelligence and Data Act, Teil 3 des Bill C-27, An Act to enact the
    Consumer Privacy Protection Act, the Personal Information and Data Protection Tribunal Act and the
    Artificial Intelligence and Data Act and to make consequential and related amendments to other Acts

    '
  fundstelle: kein — nie in Kraft getreten
  verfahrensnummer: Bill C-27, 44. Parlament, 1. Sitzungsperiode
  status: gescheitert
  status_detail: 'Am 06.01.2025 (nach McInnes Cooper: 05.01.2025) mit der Prorogation des 44. Parlaments
    verfallen. Bill C-27 war seit dem 16.06.2022 anhängig, hatte im April 2023 die zweite Lesung passiert
    und lag seit September 2023 im Industrieausschuss INDU. Es wurde nie über die Klauseln abgestimmt.
    Ein Neuanlauf ist bis heute nicht erfolgt; die Nachfolgeregierung hat mit Bill C-36 am 15.06.2026
    nur den Datenschutzteil neu eingebracht, OHNE KI-Gesetz.

    '
  kurzbeschreibung: 'AIDA hätte "high-impact systems" reguliert, ohne im Gesetzestext zu definieren, welche
    das sind — die Einstufung sollte vollständig delegierten Verordnungen überlassen bleiben. Vorgesehen
    waren Pflichten zur Risikominderung, Aufzeichnung, Veröffentlichung einer Systembeschreibung und Meldung
    erheblicher Schäden, durchgesetzt von einem dem Industrieminister unterstellten AI and Data Commissioner,
    mit Bußgeldern bis 25 Mio. CAD oder 5 % des Weltumsatzes und eigenen Straftatbeständen für rechtswidrig
    beschaffte Daten und vorsätzliche Schädigung. Die Regierungsbehörden selbst waren ausdrücklich ausgenommen.
    Nichts davon ist geltendes Recht.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.parl.ca/legisinfo/en/bill/44-1/c-27
  anwendungsdaten: []
  themenachsen:
  - marktzugang
  - gpai
  - governance
  - haftung
  - grundrechte
  regelungsschwerpunkte:
  - 'GRUND DES SCHEITERNS 1 — leeres Gesetz: Der zentrale Begriff ''high-impact system'' war im eingebrachten
    Text nicht definiert; die gesamte materielle Regelung sollte durch Verordnung nachgeliefert werden.
    Der Ausschuss konnte deshalb über nichts Substanzielles abstimmen.'
  - 'GRUND DES SCHEITERNS 2 — Nachbesserung per Brief: Der Minister legte dem Ausschuss im November 2023
    umfangreiche Änderungen vor (Klassenliste hochwirksamer Systeme, eigener Abschnitt zu general-purpose
    systems). Ein per Ministerschreiben nachgereichtes halbes Gesetz war weder beraten noch konsultiert
    worden und verlängerte die Ausschussphase um über ein Jahr.'
  - 'GRUND DES SCHEITERNS 3 — keine unabhängige Aufsicht: Der AI and Data Commissioner sollte dem Industrieminister
    berichten, nicht dem Parlament. Damit hätte dieselbe Stelle KI gefördert und beaufsichtigt.'
  - 'GRUND DES SCHEITERNS 4 — Selbstausnahme des Staates: Bundesbehörden waren ausgenommen. Nach Robodebt-Erfahrung
    und angesichts der eigenen Directive on Automated Decision-Making war das politisch nicht zu halten.'
  - 'GRUND DES SCHEITERNS 5 — Kopplung: AIDA war Teil eines Omnibus mit der Datenschutzreform. Wer die
    Datenschutzreform wollte, musste AIDA mitnehmen und umgekehrt. Eine Abtrennung wurde erwogen, aber
    nie vollzogen.'
  - 'GRUND DES SCHEITERNS 6 — Zeitpunkt: Die Regierungskrise (Rücktritt der Finanzministerin Dezember
    2024, Rücktrittsankündigung des Premierministers Januar 2025) beendete das Parlament, bevor die Ausschussberatung
    abgeschlossen war. Kein Verfahrensschritt, sondern schlicht das Ende der Sitzungsperiode.'
  - 'Verhältnis zur KI-VO: AIDA hätte generative Allzwecksysteme in der Fassung der Ministeränderungen
    weitgehend pauschal erfasst — nach der Kritik ''radically out of step'' mit dem risikobasierten Ansatz
    der KI-VO. Die internationale Anschlussfähigkeit war das erste der fünf Lehrstücke.'
