  bedeutung_eu_anbieter: 'Das ist der Text, den man ab jetzt beobachtet. Wer in Kanada automatisierte
    Entscheidungen über Personen trifft — Kredit, Beschäftigung, Versicherung, Preisbildung —, muss auf
    einen Erklärungsanspruch vorbereitet sein, der inhaltlich dem Art. 15 Abs. 1 lit. h DSGVO nahekommt,
    aber prozedural anders wirkt: kein Verbot mit Erlaubnisvorbehalt, sondern Auskunft plus Anhörung.
    Wer DSGVO-konform dokumentiert (Datenherkunft, Faktoren, Logik), kann diese Dokumentation weitgehend
    wiederverwenden. Neu ist das private Klagerecht — es verschiebt das kanadische Risiko von der Behördenaufsicht
    zur Sammelklage.

    '
  offene_punkte:
  - Ob C-36 den Ausschuss übersteht — zwei Vorgänger sind gescheitert.
  - Ob eine gestaffelte Inkraftsetzung vorgesehen wird und mit welchen Fristen.
  - Ob KI-spezifische Vorschriften im Ausschuss nachgeschoben werden (der Fehler von C-27).
