  status_detail: Vierte Fassung in Kraft seit 24.06.2025. Neu sind Abschnitt 1.2.1/1.2.2 (Uebergangsfrist
    bis 24.06.2026), 6.3.3 (Bindung an Charter, Canadian Human Rights Act und UN Declaration on the Rights
    of Indigenous Peoples Act), 6.3.11 (Daten- und Modellintegritaet) und 8.3 (Agents of Parliament).
    Die Richtlinie bindet nur Bundesbehoerden, nicht die Privatwirtschaft.
  kurzbeschreibung: 'Die Richtlinie verpflichtet Bundesbehörden nach dem Financial Administration Act
    (rund 97 Institutionen; ausgenommen unter anderem Canada Revenue Agency und Canadian Armed Forces),
    vor dem Einsatz eines automatisierten Entscheidungssystems eine Algorithmic Impact Assessment durchzuführen
    und zu VERÖFFENTLICHEN, das Ergebnis einer der vier Wirkungsstufen zuzuordnen und je nach Stufe Peer
    Review, Vorabinformation der Betroffenen, Begründung, menschliches Eingreifen, Schulung, Wiederholungsprüfungen
    und Rechtsschutzwege vorzusehen. Erfasst ist jede Technologie, die menschliches Urteil, Ermessen oder
    kritisches Denken bei einer Verwaltungsentscheidung ersetzt ODER unterstützt — ausdrücklich auch Regelsysteme,
    Regression, maschinelles Lernen, neuronale Netze und generative KI. Teilautomatisierung genügt; die
    abschließende Prüfung durch einen Beamten schließt die Anwendung NICHT aus.

    '
  inkrafttreten:
    datum: 2019-04-01
    verifiziert: true
    quelle: https://www.canada.ca/en/treasury-board-secretariat/news/2019/03/ensuring-responsible-use-of-artificial-intelligence-to-improve-government-services-for-canadians.html
    fundstelle_norm: 'Abschnitt 4.1 der Directive on Automated Decision-Making: ''This directive takes
      effect on April 1, 2019.'' Erlassen vom Treasury Board unter dem Financial Administration Act; oeffentlich
      vorgestellt am 04.03.2019 durch Ministerin Jane Philpott'
  anwendungsdaten:
  - datum: 2023-04-25
    was_gilt: 'Zweite Fassung — Ausweitung auf interne Dienste (Einstellung, Leistungsbewertung, Sicherheitsueberpruefung),
      Veroeffentlichung der Algorithmic Impact Assessment vor Inbetriebnahme, Veroeffentlichung des Peer
      Review. Uebergangsfristen: neue Systeme bis 25.10.2023, bestehende Systeme bis 25.04.2024'
    verifiziert: true
    quelle: https://www.canada.ca/en/government/system/digital-government/policies-standards/policy-service-digital-announcements/amendments-directive-automated-decision-making.html
  - datum: 2025-06-24
    was_gilt: Vierte Fassung — Abschnitte 6.3.3 (Bindung an Charter, Canadian Human Rights Act und UN
      Declaration on the Rights of Indigenous Peoples Act), 6.3.11 (Daten- und Modellintegritaet), 8.3
      (Agents of Parliament); Uebergangsfrist nach 1.2.1/1.2.2 bis 24.06.2026
    verifiziert: false
    quelle: https://www.tbs-sct.canada.ca/pol/doc-eng.aspx?id=32592
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  - arbeit
  regelungsschwerpunkte:
  - Vier Wirkungsstufen (I bis IV) mit gestaffelten Pflichten — das Vorbild aller späteren risikobasierten
    Verwaltungsrahmen. Die Einstufung erfolgt über den standardisierten AIA-Fragebogen, dessen Ergebnis
    auf dem offenen Regierungsportal veröffentlicht wird.
  - Veröffentlichungspflicht der Folgenabschätzung VOR Inbetriebnahme — die KI-VO kennt für Betreiber
    öffentlicher Stellen nur die Grundrechte-Folgenabschätzung nach Art. 27, ohne Veröffentlichungspflicht.
    Das ist der Punkt, an dem Kanada strenger ist als die EU.
  - 'Anwendungsbereich weiter als ''KI'': erfasst jede Technologie, die menschliches Urteil ersetzt ODER
    unterstützt, einschließlich Regelsystemen. Wer nur KI reguliert, lässt die Mehrzahl der schädlichen
    Verwaltungsautomatisierungen aus — die kanadische Lehre aus der Praxis.'
  - 'Teilautomatisierung ausdrücklich erfasst: Bewertungen, Empfehlungen, Zusammenfassungen und Zwischenfeststellungen,
    die ein Beamter dann verwendet. Damit wäre Chinook nach dem Wortlaut erfasst — die Einordnung von
    IRCC ist deshalb streitig.'
  - 'Ausnahmen: Canada Revenue Agency, Invest in Canada Hub, Canadian Armed Forces; Verteidigungsministerium
    bleibt erfasst. Nationale Sicherheit ist nicht generell ausgenommen, aber der Anwendungsbereich endet
    bei Stellen außerhalb des Financial Administration Act.'
  - 'Vierte Überprüfung (Vorschläge, Stand 2025): Übernahme der OECD-Definition des KI-Systems, ausdrückliche
    Menschenrechtspflichten bei Test und Überwachung, Dokumentation von Systemversagen und Abhilfen, VERBOTENE
    ANWENDUNGEN (Deepfakes zur Manipulation, Social Scoring, biometrische Kategorisierung zur Ableitung
    geschützter Merkmale, ungezieltes Auslesen von Gesichtsbildern, biometrische Echtzeit-Fernidentifizierung
    im öffentlichen Raum, Emotionserkennung), verpflichtende Compliance-Berichte an das Treasury Board,
    jährliche öffentliche Zusammenfassung, zusätzliche AIA-Fragen zu Indigenen, rassifizierten Personen
    und Menschen mit Behinderungen.'
  - Die Liste der verbotenen Anwendungen der vierten Überprüfung ist praktisch eine Übernahme des Art.
    5 KI-VO in kanadisches Verwaltungsrecht — ohne Gesetz, per Richtlinie.
