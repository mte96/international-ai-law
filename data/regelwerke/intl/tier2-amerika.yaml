- id: br-cnj-res-615-2025
  jurisdiktion: br
  kurztitel: CNJ-Resolution 615/2025 — KI in der brasilianischen Justiz
  offizieller_titel: 'Resolução nº 615, de 11 de março de 2025 — Regulamenta o desenvolvimento, a governança
    e o uso de inteligência artificial no Poder Judiciário

    '
  originaltitel: Resolução CNJ nº 615/2025
  fundstelle: Resolução CNJ nº 615/2025, veröffentlicht am 14.03.2025
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Erlassen am 11.03.2025, veröffentlicht am 14.03.2025, in Kraft 120 Tage später (Mitte
    Juli 2025). Art. 46 hebt die Resolução 332/2020 auf; Art. 45 gibt bestehenden Vorhaben zwölf Monate
    zur Anpassung. Damit ist Brasilien die Rechtsordnung mit der detailliertesten verbindlichen Regelung
    von KI in der Justiz weltweit.

    '
  kurzbeschreibung: 'Die Resolution regelt Entwicklung, Einführung und Governance von KI-Lösungen in der
    gesamten brasilianischen Justiz. Sie klassifiziert nach Risiko: ÜBERMÄSSIGES Risiko (verboten) sind
    Systeme, die die menschliche Überprüfung beseitigen, Rückfallwahrscheinlichkeiten aus Persönlichkeitsmerkmalen
    vorhersagen, Personen nach Verhalten oder sozialem Status für richterliche Bewertungen ordnen oder
    Emotionen biometrisch erkennen. HOHES Risiko (AR1-AR5) sind Verhaltensprofilierung, Bewertung von
    Erheblichkeit und Gewicht von Beweismitteln, Subsumtion von Sachverhalten unter Straf- oder Ordnungstatbestände,
    Rechtsanwendung auf konkrete Sachverhalte und Schadensbemessung sowie biometrische Identifikation
    zur Verhaltensüberwachung. NIEDRIGES Risiko (BR1-BR8) sind Verfahrensverwaltung, Präzedenzsuche, Statistik,
    Textentwürfe, Transkription und Anonymisierung. Ein Nationales Komitee mit 14 stimmberechtigten Mitgliedern
    prüft und aktualisiert die Einstufungen jährlich, bewertet Sprachmodelle für den Justizeinsatz und
    legt Prüf- und Überwachungsprotokolle fest. Alle Lösungen sind auf der Plattform Sinapses zu registrieren;
    für hochriskante Systeme sind algorithmische Folgenabschätzungen zu veröffentlichen, regelmäßige Prüfungen
    durchzuführen und nachteilige Ereignisse binnen 72 Stunden zu melden.

    '
  inkrafttreten:
    datum: 2025-07-12
    verifiziert: true
    quelle: https://atos.cnj.jus.br/atos/detalhar/6001
    fundstelle_norm: 'Art. 47: ''Esta Resolução entra em vigor após decorridos 120 (cento e vinte) dias
      da data de sua publicação.'' Veroeffentlicht im DJe/CNJ Nr. 54/2025 vom 14.03.2025, S. 2-17; der
      120. Tag ist der 12.07.2025'
  anwendungsdaten:
  - datum: 2025-03-14
    was_gilt: Veroeffentlichung im DJe/CNJ Nr. 54/2025; Beginn der 120-Tage-Frist bis zum Wirksamwerden
      (Art. 47) und der zwoelfmonatigen Anpassungsfrist (Art. 45 parágrafo único).
    verifiziert: true
    quelle: https://atos.cnj.jus.br/atos/detalhar/6001
  - datum: 2026-03-14
    was_gilt: 'Ende der Anpassungsfrist des Art. 45 parágrafo único: Die Gerichte haben zwoelf Monate
      ''a partir de sua publicação'', um bereits in Entwicklung befindliche oder eingesetzte KI-Vorhaben
      und -Modelle an die Resolução anzupassen.'
    verifiziert: true
    quelle: https://atos.cnj.jus.br/atos/detalhar/6001
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 10: Verbot von Systemen, die eine Abhängigkeit vom vorgeschlagenen Ergebnis erzeugen, ohne dass
    es geändert oder überprüft werden kann. KI darf einen Fall nicht entscheiden; die Verantwortung bleibt
    beim Richter.'
  - 'Art. 19 (generative KI): Online verfügbare Sprachmodelle dürfen als Hilfsmittel genutzt werden, wenn
    die Nutzenden geschult sind; verboten sind die Verarbeitung von Verschlusssachen oder Daten aus Verfahren
    unter Ausschluss der Öffentlichkeit ohne Anonymisierung sowie jede Nutzung für hoch- oder übermäßig
    riskante Aufgaben. Werden keine hauseigenen Lösungen bereitgestellt, ist der Einsatz kommerzieller
    Dienste unter strengen Auflagen zulässig (privacy by design, Datenisolierung, keine vertraulichen
    Materialien, LGPD-Konformität).'
  - Datenweitergabe an externe Modelle zu Trainingszwecken ist untersagt, soweit die Daten nicht bereits
    an der Quelle anonymisiert sind.
  - 'Transparenz nach außen: Gerichte müssen Zweck und Risiken in einfacher Sprache veröffentlichen, Prüf-
    und Überwachungsergebnisse offenlegen und Nutzende darüber informieren, wenn KI an einer Dienstleistung
    mitwirkt. Die Offenlegung IN der Entscheidung ist fakultativ, wird aber intern protokolliert.'
  - 'Sinapses: zentrale Registrierungs- und Prüfplattform; niedrigriskante Systeme vor Produktivsetzung,
    hochriskante bereits vor Entwicklungsbeginn nach Vorprüfung. Öffentlicher Katalog mit Risikoeinstufung.'
  - 'Vergleich: Die Resolution nimmt Art. 5, 6 und 14 KI-VO für einen einzelnen Staatsapparat vorweg —
    mit Verbotsliste, Risikoklassen, Folgenabschätzung, Registrierung und Vorfallmeldung. Sie ist damit
    strenger als alles, was für die brasilianische Privatwirtschaft gilt.'
  dokumente:
  - datum: 2025-03-11
    typ: endfassung
    titel: Resolução CNJ nº 615/2025 (Volltext und Metadaten)
    url: https://atos.cnj.jus.br/atos/detalhar/6001
    sprache: pt
    urheber: Conselho Nacional de Justiça
    verifiziert: true
    notiz: Amtliche Fassung; Grundlage aller Angaben zu Risikoklassen, Art. 10, 19, 45, 46 und Sinapses.
  - datum: 2025-03-14
    typ: endfassung
    titel: Resolução nº 615, de 11 de março de 2025 (PDF)
    url: https://atos.cnj.jus.br/files/original1555302025031467d4517244566.pdf
    sprache: pt
    urheber: Conselho Nacional de Justiça
    verifiziert: false
    notiz: Druckfassung.
  bedeutung_eu_anbieter: 'Der interessanteste Text Brasiliens für europäische Leser — und ein Vertriebsproblem:
    Wer Justizsoftware nach Brasilien verkaufen will, muss die Registrierung in Sinapses, die Risikoeinstufung
    durch das Nationale Komitee und bei hochriskanten Anwendungen eine veröffentlichte algorithmische
    Folgenabschätzung mittragen. Für generative Assistenzsysteme gilt faktisch ein Verbot in allen entscheidungsnahen
    Aufgaben. Wer in Europa Justizprodukte anbietet, kann die Resolution als Vorlage lesen: Sie beschreibt
    präzise, was Anhang III Nr. 8 KI-VO für die Rechtspflege bedeuten könnte.

    '
  offene_punkte:
  - Wie das Nationale Komitee Sprachmodelle bewertet und ob eine Positivliste entsteht.
  - Ob die Vorgaben auf Staatsanwaltschaft und Rechtsanwaltschaft ausstrahlen.
  monitoring_quellen:
  - https://atos.cnj.jus.br/
  - https://www.cnj.jus.br/
