- id: ca-pipeda
  jurisdiktion: ca
  kurztitel: PIPEDA — kanadisches Bundesdatenschutzgesetz
  offizieller_titel: Personal Information Protection and Electronic Documents Act
  fundstelle: S.C. 2000, c. 5
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht und bis zum Inkrafttreten von Bill C-36 die maßgebliche Grundlage der
    kanadischen KI-Aufsicht im privaten Sektor. Praktisch bewiesen hat es das am 06.05.2026 mit den gemeinsamen
    Feststellungen von vier Aufsichtsbehörden zu OpenAI (PIPEDA Findings 2026-002).

    '
  kurzbeschreibung: 'PIPEDA gilt für Organisationen, die im Rahmen einer kommerziellen Tätigkeit personenbezogene
    Daten erheben, verwenden oder offenlegen; die Grundsätze stehen in Schedule 1. Zentral für KI sind
    s. 5(3) — Erhebung, Verwendung und Offenlegung nur zu Zwecken, die eine verständige Person unter den
    Umständen als angemessen ansehen würde — und das Einwilligungserfordernis. Der Privacy Commissioner
    kann untersuchen, Empfehlungen aussprechen und Berichte veröffentlichen, aber KEINE Anordnungen erlassen
    und KEINE Bußgelder verhängen; durchgesetzt wird über den Federal Court (s. 14, 16). Genau diese Zahnlosigkeit
    ist die Begründung für Bill C-36. Provinzen mit als "im Wesentlichen gleichwertig" anerkanntem Recht
    (Quebec, Alberta, British Columbia) verdrängen PIPEDA für Sachverhalte innerhalb der Provinz.

    '
  inkrafttreten:
    datum: 2001-01-01
    verifiziert: true
    quelle: https://laws-lois.justice.gc.ca/eng/acts/P-8.6/page-1.html
    fundstelle_norm: 'PIPEDA, S.C. 2000, c. 5. Amtliche Fußnote der konsolidierten Fassung bei laws-lois.justice.gc.ca:
      "Subsection 4(3) in force January 1, 2001, see SI/2000-29." Part 1 trat danach am 01.01.2001 in
      Kraft; die Ausdehnung auf provinziell regulierte Organisationen folgte gestaffelt bis 2004 (sec.
      30).'
  anwendungsdaten:
  - datum: 2026-05-06
    was_gilt: 'Gemeinsame Feststellungen von OPC, CAI Québec, OIPC British Columbia und OIPC Alberta zu
      OpenAI: Die Erhebung personenbezogener Daten aus öffentlich zugänglichen Websites und lizenzierten
      Quellen zum Modelltraining war "overbroad and therefore inappropriate" im Sinne des s. 5(3); eine
      wirksame Einwilligung lag weder für die Erhebung aus öffentlichen Quellen noch für die Nutzung von
      Nutzereingaben vor.

      '
    verifiziert: true
    quelle: https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/pipeda-2026-002-overview/
  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 's. 5(3) — der ''appropriate purposes''-Test ist der eigentliche kanadische Hebel gegen Trainingsdatenbeschaffung:
    Er greift UNABHÄNGIG von der Einwilligung. Auch mit Einwilligung bleibt eine unangemessene Verarbeitung
    rechtswidrig. Das ist strenger als das europäische Konzept des berechtigten Interesses, weil dort
    die Abwägung Teil der Rechtsgrundlage ist, hier eine zusätzliche Schranke.'
  - 'Web-Scraping: Nach 2026-002 erwarteten die Betroffenen nicht, dass öffentlich gepostete Angaben zum
    Modelltraining erhoben werden; darunter waren sensible Daten (Gesundheit, politische Auffassung).
    Die Minderungsmaßnahmen genügten nicht, der Nutzen wog die Risiken nicht auf.'
  - 'Zusagen OpenAIs mit Fristen: Filter zur Maskierung personenbezogener Kennungen in Trainingsdaten
    und Abkündigung von GPT-3.5/4 sofort; erweiterte Transparenzdokumentation zu Trainingsdatenquellen
    binnen drei Monaten; verbesserte Datenexportfunktion, förmliche Aufbewahrungsregeln und Schutztests
    für minderjährige Familienangehörige öffentlicher Personen binnen sechs Monaten; vierteljährliche
    Compliance-Berichte.'
  - 'Keine Anordnungsbefugnis, kein Bußgeld: Das Verfahren endete mit Zusagen, nicht mit einem Bescheid.
    Für europäische Verhältnisse ist das der auffälligste Unterschied — dieselbe Sachlage hätte in der
    EU ein Verfahren nach Art. 58 Abs. 2 DSGVO mit Untersagungsverfügung ermöglicht.'
  - 'Verhältnis zu den Provinzgesetzen: Die vier Behörden untersuchten gemeinsam, weil PIPEDA, Quebec,
    Alberta und BC nebeneinander anwendbar sind. Wer in Kanada trainiert oder anbietet, hat es faktisch
    mit vier Aufsichten zu tun.'
