  kurztitel: LGPD — brasilianisches Datenschutzgesetz
  offizieller_titel: Lei Geral de Proteção de Dados Pessoais
  originaltitel: Lei nº 13.709, de 14 de agosto de 2018
  fundstelle: Lei nº 13.709/2018, geändert durch Lei nº 13.853/2019
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht seit dem 18.09.2020, Sanktionen seit dem 01.08.2021. Bis zum Inkrafttreten
    eines KI-Gesetzes ist die LGPD der einzige horizontal wirkende brasilianische Rechtsrahmen für KI.
    Die ANPD hat KI und automatisierte Entscheidungen zum Schwerpunkt ihrer Regulierungsagenda 2025/26
    gemacht, eine Verordnung zu Art. 20 ist aber noch nicht erlassen.

    '
  kurzbeschreibung: 'Die LGPD folgt der DSGVO in Aufbau und Terminologie: zehn Verarbeitungsgrundlagen
    (Art. 7), Zweckbindung, Erforderlichkeit, Transparenz, Betroffenenrechte (Art. 18), Verantwortlicher
    und Auftragsverarbeiter, Datenschutzbeauftragter, Meldepflicht bei Vorfällen. Für KI ist Art. 20 zentral:
    Die betroffene Person kann die Überprüfung von Entscheidungen verlangen, die ausschließlich auf automatisierter
    Verarbeitung beruhen und ihre Interessen berühren, einschließlich solcher, die ihr persönliches, berufliches,
    Konsum- oder Kreditprofil oder Persönlichkeitsmerkmale bestimmen. Nach § 1 sind auf Verlangen klare
    und angemessene Informationen über die Kriterien und Verfahren mitzuteilen, begrenzt durch Geschäfts-
    und Betriebsgeheimnisse; nach § 2 kann die ANPD bei Verweigerung eine Prüfung auf diskriminierende
    Aspekte anordnen. Sanktionen: Geldbuße bis 2 % des Umsatzes der Gruppe in Brasilien, höchstens 50
    Mio. BRL je Verstoß, dazu Veröffentlichung, Sperrung und Löschung der Daten.

    '
  inkrafttreten:
