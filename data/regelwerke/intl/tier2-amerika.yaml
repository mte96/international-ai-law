- id: in-it-rules-2021
  jurisdiktion: in
  kurztitel: IT Rules 2021 — Intermediärspflichten
  offizieller_titel: 'The Information Technology (Intermediary Guidelines and Digital Media Ethics Code)
    Rules, 2021

    '
  fundstelle: G.S.R. 139(E), Gazette of India, Extra., Pt. II, Sec. 3(i), 25.02.2021
  verfahrensnummer: erlassen auf Grundlage von s. 87 Abs. 1 und Abs. 2 lit. z, zg IT Act 2000
  status: anwendbar
  status_detail: 'In Kraft seit dem 25.02.2021, mehrfach geändert (2022, 2023 und zuletzt durch die Änderungsregeln
    2026 mit Wirkung vom 20.02.2026). Die praktisch wichtigste Rechtsgrundlage der indischen KI-Rechtsprechung:
    Sämtliche Persönlichkeitsrechtsverfahren des Delhi High Court zu Stimm- und Bildnisdeepfakes stützen
    die Löschungs- und Sperranordnungen auf diese Regeln.

    '
  kurzbeschreibung: 'Die Regeln verpflichten Intermediäre zu Sorgfaltspflichten (Rule 3), darunter die
    Bemühungspflicht, Nutzer am Einstellen bestimmter Inhalte zu hindern — obszöne, pädophile, privatsphäreverletzende,
    geschlechts- oder ethniebezogen belästigende, verleumderische, identitätsanmaßende, zu Feindschaft
    aufstachelnde und nachweisbar falsche Inhalte (Rule 3(1)(b)) —, die Entfernung binnen 36 Stunden nach
    gerichtlicher Anordnung oder behördlicher Mitteilung (Rule 3(1)(d)) und die Entfernung binnen 24 Stunden
    nach Beschwerde über Intimdarstellungen und Identitätsanmaßungen (Rule 3(2)(b)). Bedeutende Anbieter
    sozialer Medien (SSMI) unterliegen zusätzlich Rule 4: Chief Compliance Officer, Kontaktstelle für
    Strafverfolgung und Beschwerdestelle jeweils mit Wohnsitz in Indien, monatliche Compliance-Berichte,
    Nutzerverifikation über indische Mobilnummern und Einsatz automatisierter Werkzeuge zur proaktiven
    Erkennung. Rule 7 bestimmt die Rechtsfolge: Bei Verstoß entfällt die Haftungsfreistellung des s. 79
    Abs. 1 IT Act.

    '
