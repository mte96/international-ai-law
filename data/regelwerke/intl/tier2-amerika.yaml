      "I - dia 28 de dezembro de 2018, quanto aos arts. 55-A [bis] 58-B" (Errichtung der ANPD) — das ist
      die erste Stufe und steht deshalb hier; "I-A - dia 1º de agosto de 2021, quanto aos arts. 52, 53
      e 54" (Sanktionen, eingefügt durch Lei nº 14.010/2020); "II - 24 (vinte e quatro) meses após a data
      de sua publicação, quanto aos demais artigos". Die weiteren Stufen stehen in anwendungsdaten.'
