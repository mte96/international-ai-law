    Alberta: Einwilligung, angemessene Zwecke, Auskunfts- und Berichtigungsrechte, Aufsicht durch einen
    Commissioner mit Anordnungsbefugnis, aber ohne Bußgeldkompetenz in europäischer Größenordnung. Für
    KI ist BC PIPA vor allem als Teil des Vier-Behörden-Verbunds bedeutsam, der die kanadische KI-Datenschutzaufsicht
    faktisch trägt.

    '
