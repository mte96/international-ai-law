  jurisdiktion: ca
  kurztitel: Alberta PIPA — Datenschutz Alberta
  offizieller_titel: Personal Information Protection Act (Alberta)
  fundstelle: S.A. 2003, c. P-6.5
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, aber seit dem 30.05.2025 in einem Kernpunkt verfassungswidrig: Der
    Court of King''s Bench of Alberta hat in Clearview AI Inc v Alberta (Information and Privacy Commissioner),
    2025 ABKB 287, entschieden, dass das ausnahmslose Einwilligungserfordernis für im Internet öffentlich
    zugängliche personenbezogene Daten die Meinungsfreiheit nach s. 2(b) der Charter unverhältnismäßig
    einschränkt; die Wendung "including, but not limited to, a magazine, book or newspaper" wurde aus
    der Definition der Verordnung gestrichen. Der Information and Privacy Commissioner hat im August 2025
    einen eigenständigen KI-Rechtsrahmen für Alberta empfohlen.

    '
  kurzbeschreibung: 'Alberta PIPA ist eines der drei Provinzgesetze, die PIPEDA für Sachverhalte innerhalb
    der Provinz verdrängen. Es folgt demselben Aufbau — Einwilligung, angemessene Zwecke, Auskunfts- und
    Berichtigungsrechte, Meldepflicht bei Vorfällen — kennt aber weder eine Vorschrift zu automatisierten
    Entscheidungen noch Bußgelder in europäischer Größenordnung. Für KI ist es aus zwei Gründen wichtig:
    Erstens ist Alberta die einzige kanadische Rechtsordnung, in der ein Gericht die Verfassungsmäßigkeit
    des Einwilligungserfordernisses für öffentlich zugängliche Daten geprüft hat — mit unmittelbaren Folgen
    für Web-Scraping zu Trainingszwecken. Zweitens hat die Aufsichtsbehörde als erste in Kanada ein eigenständiges
    KI-Gesetz auf Provinzebene vorgeschlagen.

    '
  inkrafttreten:
