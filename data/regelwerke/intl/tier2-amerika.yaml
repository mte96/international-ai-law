  - ki-vo-2024-1689
  - au-nsw-pn-sc-gen-23
  letzte_pruefung: 2026-09-01
  pruefvermerk:
  - 'Am amtlichen Text im Atos-Portal des CNJ geprueft. Datum richtig. Wichtige Klarstellung zur Fristberechnung:
    Die Zwoelfmonatsfrist des Art. 45 parágrafo único laeuft ab der VEROEFFENTLICHUNG (14.03.2025), nicht
    ab dem Inkrafttreten — sie lief also bereits, bevor die Resolução am 12.07.2025 wirksam wurde, und
    endete am 14.03.2026. Art. 46 hebt die Resolução 332/2020 mit Beginn der Geltung auf. Status ''anwendbar''
    bleibt richtig.'
- id: br-cpc
  jurisdiktion: br
  kurztitel: Código de Processo Civil (Zivilprozessordnung)
  offizieller_titel: Código de Processo Civil — Lei nº 13.105, de 16 de março de 2015
  originaltitel: Lei nº 13.105/2015
  fundstelle: Lei nº 13.105/2015
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht seit dem 18.03.2016. Ohne KI-spezifische Vorschrift, aber die praktisch
    wichtigste Grundlage für die Sanktionierung von KI-Fehlgebrauch durch Prozessbevollmächtigte in Brasilien:
    Die Gerichte stützen sich auf die Pflicht zur redlichen Prozessführung und den Tatbestand der bösgläubigen
    Prozessführung.

    '
  kurzbeschreibung: 'Für den KI-Bezug sind drei Vorschriften maßgeblich. Art. 77 legt den Verfahrensbeteiligten
    Pflichten auf, insbesondere zur Wahrhaftigkeit des Vorbringens und zur Unterlassung verfahrenswidrigen
    Verhaltens. Art. 80 zählt die Tatbestände der bösgläubigen Prozessführung (litigância de má-fé) auf,
    darunter das Vorbringen offensichtlich unbegründeter Behauptungen, die Veränderung des Sachverhalts
    und die Verwendung des Verfahrens zu verfahrensfremden Zwecken. Art. 81 ordnet die Geldbuße von 1
    % bis 10 % des Streitwerts, den Ersatz des Schadens und die Erstattung von Kosten und Anwaltshonoraren
    an. Auf dieser Grundlage haben brasilianische Gerichte 2026 sowohl die Einreichung erfundener KI-Fundstellen
    als auch den Versuch, gerichtseigene KI-Systeme durch versteckte Anweisungen im Schriftsatz zu manipulieren
    (Prompt Injection), sanktioniert.

    '
  inkrafttreten:
    datum: 2016-03-18
    verifiziert: true
    quelle: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105.htm
    fundstelle_norm: 'Art. 1.045 Lei nº 13.105/2015 (Código de Processo Civil): "Este Código entra em
      vigor após decorrido 1 (um) ano da data de sua publicação oficial." Veröffentlichung im DOU am 17.03.2015
      — Inkrafttreten am 18.03.2016 (so auch die Auslegung des Superior Tribunal de Justiça).'
  anwendungsdaten: []
  themenachsen:
  - berufsrecht
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'Art. 77: Redlichkeitspflichten der Verfahrensbeteiligten — die Generalklausel, unter die Halluzinationen
    und Manipulationsversuche subsumiert werden.'
  - 'Art. 80, 81: litigância de má-fé mit Geldbuße von 1 % bis 10 % des Streitwerts, Schadensersatz und
    Kostenerstattung. Anders als in den USA (Rule 11 FRCP) bedarf es keiner gesonderten Anordnung; die
    Sanktion kann von Amts wegen ergehen.'
  - 'Prompt Injection als Prozessbetrug: Die Entscheidung des TJMG vom 05.06.2026 ist die weltweit erste
    bekannte gerichtliche Sanktionierung eines Versuchs, gerichtsseitig eingesetzte KI durch versteckte
    Anweisungen im eigenen Schriftsatz zu beeinflussen. Sie ist nur denkbar, weil die brasilianische Justiz
    KI produktiv einsetzt — die CNJ-Resolution 615/2025 ist die Kehrseite.'
  - Es gibt keine brasilianische Offenlegungspflicht für den KI-Einsatz in Schriftsätzen, wie sie NSW,
    der Federal Court of Australia oder englische Gerichte kennen. Sanktioniert wird das Ergebnis, nicht
    die Nutzung.
  dokumente:
  - datum: 2015-03-16
    typ: konsolidiert
    titel: Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil)
    url: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105.htm
    sprache: pt
    urheber: Presidência da República
    verifiziert: false
    notiz: Amtlicher Volltext;
  bedeutung_eu_anbieter: 'Relevant für jede Kanzlei, die in Brasilien prozessiert oder brasilianische
    Korrespondenten steuert: Das Risiko liegt nicht in einer Offenlegungspflicht, sondern in einer scharfen
    Ergebnissanktion, die von Amts wegen ergeht und sich am Streitwert bemisst. Wer Textbausteine aus
    generativen Systemen übernimmt, muss jede Fundstelle prüfen — und darf keine für Maschinen bestimmten
    Anweisungen in Schriftsätzen hinterlassen.

    '
  offene_punkte:
  - Ob der CNJ eine Offenlegungspflicht für Verfahrensbeteiligte einführt (die Resolution 615/2025 richtet
    sich an die Gerichte, nicht an die Parteien).
