- id: ca-ai-strategy-2026
  jurisdiktion: ca
  kurztitel: AI for All — nationale KI-Strategie 2026
  offizieller_titel: 'AI for All: Canada''s Artificial Intelligence Strategy'
  fundstelle: Government of Canada, veröffentlicht 04.06.2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 04.06.2026 von Premierminister Carney vorgestellt, nach einer öffentlichen Beteiligung
    mit 64.600 Rückmeldungen von 11.300 Teilnehmenden zu acht Themenfeldern und der Arbeit einer im September
    2025 eingesetzten AI Strategy Task Force (28 Fachleute, acht Arbeitsgruppen, Vorsitz Diane Gutiw und
    Olivier Blais). Die Strategie ist ein Regierungsprogramm, kein Rechtsakt.

    '
  kurzbeschreibung: 'Fünfjahresstrategie mit den Zielen 200 Mrd. CAD zusätzliche Wirtschaftsleistung,
    250.000 neue KI-bezogene Arbeitsplätze und eine Steigerung der KI-Nutzung in Unternehmen von 12 %
    auf 60 % bis 2034. Drei Leitgedanken: Vertrauen schaffen, Chancen eröffnen, Souveränität stärken.
    Für das Recht sind vier Ankündigungen maßgeblich: Modernisierung der Gesetzesrahmen mit Vorrang für
    Vertrauen und Sicherheit, Stärkung des Schutzes personenbezogener Daten gegen Deepfakes und "surveillance
    pricing", Einführung von Online-Sicherheitsregeln für soziale Medien UND Chatbots sowie Ausweitung
    von Transparenzanforderungen und der Kapazitäten des KI-Sicherheitsinstituts. Ein horizontales KI-Gesetz
    wird nicht angekündigt.

    '
  inkrafttreten:
    datum: 2026-06-04
    verifiziert: true
    quelle: https://www.pm.gc.ca/en/news/news-releases/2026/06/04/prime-minister-carney-launches-ai-all-canadas-new-national-artificial
  anwendungsdaten:
  - datum: 2025-09-01
    was_gilt: Einsetzung der AI Strategy Task Force und Beginn der öffentlichen Beteiligung ('30-day national
      sprint').
    verifiziert: true
    quelle: https://ised-isde.canada.ca/site/ised/en/advisory-council-artificial-intelligence/ai-strategy-task-force
  - datum: 2026-06-04
    was_gilt: Veröffentlichung der Strategie; Zuständigkeiten bei Minister Solomon (KI und digitale Innovation),
      Ministerin Joly (Industrie), Ministerin Hajdu (Arbeit).
    verifiziert: true
    quelle: https://www.pm.gc.ca/en/news/news-releases/2026/06/04/prime-minister-carney-launches-ai-all-canadas-new-national-artificial
  themenachsen:
  - governance
  - marktzugang
  - arbeit
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Kein KI-Gesetz: Die Strategie verspricht ''modernisierte Gesetzesrahmen'', nicht ein horizontales
    KI-Gesetz. Damit ist die Frage ''kommt AIDA wieder'' vorerst beantwortet — nein.'
  - 'Regulierungsversprechen mit konkretem Gegenstand: Deepfakes und surveillance pricing im Datenschutzrecht
    (umgesetzt in Bill C-36), Online-Sicherheitsregeln für Chatbots (noch offen), erweiterte Transparenzanforderungen
    (noch offen).'
  - 'Institutioneller Befund: Kanada hat seit Mai 2025 einen eigenen Minister für KI und digitale Innovation
    (Evan Solomon) — als eines der ersten Länder überhaupt. Der KI-Minister ist zugleich der Einbringer
    des Datenschutzgesetzes; Förderung und Regulierung liegen in einer Hand.'
  - Die Task Force hat keinen veröffentlichten Abschlussbericht mit Regulierungsempfehlungen vorgelegt;
    ihre Arbeit ist in die Strategie eingegangen.
  dokumente:
  - datum: 2026-06-04
    typ: pressemitteilung
    titel: 'Prime Minister Carney launches AI for All: Canada''s new national artificial intelligence
      strategy'
    url: https://www.pm.gc.ca/en/news/news-releases/2026/06/04/prime-minister-carney-launches-ai-all-canadas-new-national-artificial
    sprache: en
