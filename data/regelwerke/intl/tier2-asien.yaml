  status_detail: 'Beschlossen am 24.09.2024, veröffentlicht am 30.09.2024, in Kraft seit 01.01.2025. Sie
    ist Durchführungsrecht zu Cybersicherheits-, Datensicherheits- und Persönlichkeitsdatenschutzgesetz
    zugleich und schließt damit die Lücken zwischen den drei Gesetzen.

    '
  kurzbeschreibung: 'Konkretisiert die Pflichten von Netzdatenverarbeitern: Meldepflichten bei Sicherheitsvorfällen,
    Anforderungen an Einwilligung und Transparenz, Umgang mit wichtigen Daten, Datenexport, Pflichten
    großer Plattformen und Regeln für Datenweitergabe und -zusammenführung. Sie erstreckt sich ausdrücklich
    auf Verarbeiter im Ausland, die Waren oder Dienste an Personen in China anbieten, deren Verhalten
    analysieren oder die nationale Sicherheit berühren; diese müssen eine Stelle oder einen Vertreter
    in China benennen und der örtlichen Internetbehörde melden. Für KI relevant sind die Vorschriften
    zur Sicherheit von Trainingsdaten und die Pflicht, bei der Entwicklung generativer Modelle die Herkunft
    und Rechtmäßigkeit der Daten zu sichern.

    '
