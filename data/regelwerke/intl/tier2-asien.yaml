    für Sicherheitspflichten, die Umsatz- und Nutzerschwellen für die Benennung eines inländischen Vertreters,
    Inhalt und Form der Kennzeichnung generativer Ausgaben sowie die Ausnahmen davon, ferner die Organisation
    der neu geschaffenen Einrichtungen — Nationales KI-Politikzentrum, KI-Sicherheitsforschungsinstitut,
    ehrenamtlicher KI-Ethikausschuss.

    '
