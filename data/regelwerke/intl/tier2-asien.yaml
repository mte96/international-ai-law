  - Ob die 5-%-Schwelle bei mehrsprachigen Korpora quellenweise oder insgesamt gilt, ist strittig.
  - Verhältnis zu ISO/IEC 42001 und zu den harmonisierten Normen nach der KI-VO nicht geklärt.
