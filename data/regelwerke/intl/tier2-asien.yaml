  - 'Dreiteilung: Training — Erzeugung und Nutzung — Schutzfähigkeit.'
  - 'Fallgruppen des Schrankenwegfalls: Stil-Feinabstimmung, genussdienende Datenbanken, Substitutionswirkung.'
  - Abhängigkeitsvermutung bei Vorhandensein des Werks im Trainingskorpus — beweisrechtlich der schärfste
    Punkt, weil er die Darlegungslast auf den Entwickler verschiebt.
  - Schutzfähigkeit von Ausgaben nur bei schöpferischem menschlichem Beitrag; bloße Prompteingabe genügt
    regelmäßig nicht — strenger als die chinesische Praxis.
  - Rund 25.000 Stellungnahmen im Konsultationsverfahren — Ausdruck der Politisierung des Themas in Japan.
