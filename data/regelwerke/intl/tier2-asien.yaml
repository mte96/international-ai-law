    und ähnlichen Einrichtungen muss stets eine Alternative ohne Gesichtserkennung angeboten werden. Gesichtserkennung
    in privaten Räumen wie Hotelzimmern, Umkleiden und Toiletten ist verboten. Wer Gesichtsinformationen
    von mehr als 100.000 Personen speichert, muss dies binnen 30 Werktagen bei der Internetbehörde der
    Provinz anmelden. Daten sind grundsätzlich lokal zu speichern und nicht ohne Weiteres über Netze zu
    übermitteln.

