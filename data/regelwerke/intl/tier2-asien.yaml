  bedeutung_eu_anbieter: 'Die praktisch nützlichste Einzelquelle für ein europäisches Unternehmen, das
    in Korea trainiert: Sie bestätigt einen Weg, den europäische Aufsichtsbehörden nur zögernd öffnen
    — Web-Scraping auf Grundlage berechtigter Interessen. Wer die dort geforderte Erforderlichkeits- und
    Schutzmaßnahmendokumentation erstellt, hat zugleich einen guten Teil dessen, was eine europäische
    Interessenabwägung nach Art. 6 Abs. 1 lit. f DSGVO verlangt.

    '
