  regelungsschwerpunkte:
  - 5-%-Schwelle für rechtswidrige oder schädliche Inhalte im Trainingskorpus, gemessen an Stichproben
    von 4.000 Elementen je Quelle — eine quantifizierte Trainingsdatenanforderung, die es sonst nirgends
    gibt.
  - Mindestens 2.000 menschlich geprüfte Testfragen über 31 Risikokategorien; Bestehensquote mindestens
    90 %.
  - Dokumentation der Rechtekette am Trainingskorpus — das ist die operative Konkretisierung von Art.
    7 der Interimsmaßnahmen und funktional das Gegenstück zur Trainingsdatenzusammenfassung nach Art.
    53 Abs. 1 lit. d KI-VO.
  - 'Anforderungen an Annotatoren: Schulung, Prüfung, Trennung von Annotation und Kontrolle.'
  - Formal empfohlen, faktisch bindend — das Muster 'weiches Recht mit harter Marktzutrittswirkung'.
