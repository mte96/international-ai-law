regelwerke:
- id: cn-genai-interim-measures
  jurisdiktion: cn
  kurztitel: Interimsmaßnahmen für generative KI-Dienste
  offizieller_titel: Interimsmaßnahmen für die Verwaltung generativer Dienste künstlicher Intelligenz
  originaltitel: 生成式人工智能服务管理暂行办法
  fundstelle: Erlass Nr. 15 der Staatlichen Internet-Informationsverwaltung und sechs weiterer Behörden
  verfahrensnummer: Konsultationsentwurf vom 11.04.2023
  status: anwendbar
  status_detail: 'Seit 15.08.2023 in Kraft und die praktisch wichtigste Grundlage der chinesischen KI-Aufsicht.
    Bis April 2025 waren 346 generative KI-Dienste registriert, bis Frühjahr 2026 kumuliert 868. Die Vorschrift
    ist ausdrücklich "vorläufig" (暂行) und gilt als Vorstufe eines künftigen KI-Gesetzes.

    '
  kurzbeschreibung: 'Erste dienstbezogene Vollregelung generativer KI weltweit. Sie verpflichtet Anbieter,
    die generative KI-Dienste für die Öffentlichkeit auf dem chinesischen Festland bereitstellen, zu rechtmäßiger
    Herkunft von Trainingsdaten und Basismodellen, zur Wahrung von Immaterialgüter- und Persönlichkeitsrechten,
    zur Kennzeichnung erzeugter Inhalte, zur Inhaltsmoderation und zur Meldung rechtswidriger Inhalte.
    Dienste mit "Meinungsbildungs- oder gesellschaftlicher Mobilisierungswirkung" müssen vor Marktzutritt
    eine Sicherheitsbewertung durchlaufen und ein Algorithmus-Filing vornehmen. Sanktionen richten sich
    nach Cybersicherheits-, Datensicherheits- und Persönlichkeitsdatenschutzgesetz; bei ausländischen
    Diensten, die die Maßnahmen verletzen, kann der Zugang technisch unterbunden werden (Art. 20).

    '
  inkrafttreten:
    datum: 2023-08-15
    verifiziert: true
    quelle: https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm
  anwendungsdaten:
  - datum: 2023-08-15
    was_gilt: 'Vollständige Anwendung aller 24 Artikel. Art. 2: Anwendung auch auf Anbieter außerhalb
      Chinas, soweit sie Dienste an die Öffentlichkeit des Festlands richten; reine Forschung und Entwicklung
      ohne Publikumsdienst ist ausgenommen.

      '
    verifiziert: true
    quelle: https://www.chinalawtranslate.com/en/generative-ai-interim/
  themenachsen:
  - marktzugang
  - gpai
  - content
  - urheberrecht
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - 'Art. 2: Räumlicher Anwendungsbereich — Dienste an die Öffentlichkeit der VR China, auch aus dem Ausland.
    Reine Inhouse-Entwicklung ohne Publikumsangebot ist ausgenommen.'
  - 'Art. 4: Inhaltsanforderungen — kernsozialistische Werte, kein Aufruf zum Umsturz, keine Diskriminierung
    nach Ethnie, Glaube, Land, Geschlecht, Alter, Beruf; Wahrheitsgehalt und Genauigkeit sind zu erhöhen.'
  - 'Art. 7: Trainingsdaten — rechtmäßige Herkunft von Daten und Basismodellen, keine Verletzung fremder
    Immaterialgüterrechte, Einwilligung bei personenbezogenen Daten, Maßnahmen zur Erhöhung von Qualität,
    Authentizität, Genauigkeit, Objektivität und Diversität.'
  - 'Art. 9: Der Anbieter ist Verantwortlicher im Sinne des PIPL für erzeugte Inhalte.'
  - 'Art. 12: Kennzeichnungspflicht — Verweis auf die Deep-Synthesis-Vorschriften, seit 2025 konkretisiert
    durch die Kennzeichnungsmaßnahmen und GB 45438-2025.'
  - 'Art. 14: Abhilfepflicht bei rechtswidrigen Inhalten binnen kurzer Frist, Modelloptimierung, Meldung
    an die Behörde.'
  - 'Art. 17: Sicherheitsbewertung und Algorithmus-Filing für Dienste mit Meinungsbildungs- oder Mobilisierungswirkung
    — faktische Marktzutrittsschranke.'
  - 'Art. 19: Auskunfts- und Erläuterungspflicht gegenüber der Aufsicht zu Trainingsdatenherkunft, Kennzeichnungsverfahren
    und Algorithmus.'
  - 'Art. 20: Bei Verstößen ausländischer Anbieter kann der Zugang technisch unterbunden werden.'
