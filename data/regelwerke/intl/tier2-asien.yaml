- id: cn-algorithmus-empfehlung
  jurisdiktion: cn
  kurztitel: Algorithmus-Empfehlungsvorschriften
  offizieller_titel: Vorschriften über die Verwaltung algorithmischer Empfehlungen bei Internet-Informationsdiensten
  originaltitel: 互联网信息服务算法推荐管理规定
  fundstelle: Erlass Nr. 9 der Staatlichen Internet-Informationsverwaltung, des MIIT, des Ministeriums
    für öffentliche Sicherheit und der Staatlichen Verwaltung für Marktregulierung
  verfahrensnummer: Konsultationsentwurf vom 27.08.2021
  status: anwendbar
  status_detail: 'Seit 01.03.2022 in Kraft, 35 Artikel in sechs Kapiteln. Sie haben das Algorithmus-Filing-System
    begründet, auf dem alle späteren KI-Vorschriften aufsetzen — die Registrierungsdatenbank der CAC ist
    aus dieser Verordnung hervorgegangen.

    '
  kurzbeschreibung: 'Erfasst fünf Typen von Empfehlungsalgorithmen — Generierung und Synthese, personalisierte
    Ausspielung, Sortierung und Auswahl, Suchfilterung, Disposition und Entscheidung. Anbieter müssen
    Nutzern die Abschaltung personalisierter Empfehlungen ermöglichen, Minderjährige vor Suchtmechanik
    schützen, Ältere vor Betrug schützen, bei Plattformarbeit Entgelt- und Ruhezeitrechte wahren und dürfen
    Preise nicht algorithmisch nach Nutzermerkmalen differenzieren. Dienste mit Meinungsbildungs- oder
    Mobilisierungswirkung müssen sich binnen zehn Werktagen registrieren. Bußgelder von 10.000 bis 100.000
    RMB, daneben Abmahnung, Dienstaussetzung und Entzug des Filings.

    '
  inkrafttreten:
    datum: 2022-03-01
    verifiziert: true
    quelle: https://www.chinalawtranslate.com/en/algorithms/
  anwendungsdaten:
  - datum: 2022-03-01
    was_gilt: Vollständige Anwendung; Beginn des Algorithmus-Filings nach Art. 24.
    verifiziert: true
  themenachsen:
  - governance
  - grundrechte
  - arbeit
  - wettbewerb
  - content
  - marktzugang
  regelungsschwerpunkte:
  - 'Art. 17: Recht, personalisierte Empfehlungen abzuschalten — die chinesische Vorschrift ist älter
    als Art. 38 DSA und geht insoweit weiter, als sie eine bequeme Abschaltoption verlangt.'
  - 'Art. 18: Minderjährigenschutz — Verbot suchtfördernder Empfehlungen.'
  - 'Art. 19: Schutz Älterer vor algorithmisch vermitteltem Betrug.'
  - 'Art. 20: Plattformarbeit — algorithmische Auftragsverteilung, Vergütung und Arbeitszeit müssen Entgelt-
    und Ruhezeitrechte wahren. Das ist eine arbeitsrechtliche Algorithmusregel, die die EU erst mit der
    Plattformarbeitsrichtlinie nachgezogen hat.'
  - 'Art. 21: Verbot unangemessener Preisdifferenzierung nach Nutzermerkmalen (大数据杀熟).'
  - 'Art. 24: Filing binnen zehn Werktagen mit Angaben zu Anbieter, Algorithmustyp, Selbstbewertung und
    Inhalten.'
  - 'Art. 31 ff.: Bußgeld 10.000 bis 100.000 RMB, Dienstaussetzung, Entzug des Filings.'
