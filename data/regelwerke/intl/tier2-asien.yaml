- id: cn-ai-labelling
  jurisdiktion: cn
  kurztitel: Kennzeichnungsmaßnahmen für KI-generierte Inhalte
  offizieller_titel: Maßnahmen zur Kennzeichnung von durch künstliche Intelligenz erzeugten und synthetisierten
    Inhalten
  originaltitel: 人工智能生成合成内容标识办法
  fundstelle: 国信办通字〔2025〕2号 — Mitteilung Nr. 2 (2025) der Staatlichen Internet-Informationsverwaltung
  verfahrensnummer: Konsultationsentwurf vom 14.09.2024
  status: anwendbar
  status_detail: 'Verkündet am 07.03.2025, veröffentlicht am 14.03.2025, in Kraft seit 01.09.2025 — zeitgleich
    mit der verbindlichen Norm GB 45438-2025, die das technische Verfahren vorschreibt. Damit gilt in
    China seit einem Jahr, was in der EU erst am 02.08.2026 anwendbar geworden ist.

    '
  kurzbeschreibung: 'Verpflichtet Anbieter von Internet-Informationsdiensten, die KI-generierte Inhalte
    erzeugen, zu zwei Kennzeichnungsarten: einer expliziten, für Nutzer wahrnehmbaren Kennzeichnung in
    Text, Ton, Bild oder Video und einer impliziten, in die Dateimetadaten eingebetteten Kennzeichnung
    mit Anbieterkennung und Inhalts-ID. Verbreitungsplattformen müssen die Metadaten prüfen und Inhalte
    je nach Befund als bestätigt, möglich oder vermutet KI-generiert auszeichnen; sie müssen Nutzern eine
    Selbstdeklaration ermöglichen. Nutzer müssen synthetische Inhalte bei Veröffentlichung aktiv deklarieren.
    App-Vertriebsplattformen müssen vor Aufnahme prüfen, ob eine App generative Dienste erbringt und wie
    sie kennzeichnet. Das böswillige Entfernen, Fälschen oder Verbergen von Kennzeichen ist jedermann
    verboten.

    '
  inkrafttreten:
    datum: 2025-09-01
    verifiziert: true
    quelle: https://www.chinalawtranslate.com/en/ai-labeling/
  anwendungsdaten:
  - datum: 2025-09-01
    was_gilt: 'Vollständige Anwendung, gemeinsam mit der verbindlichen Norm GB 45438-2025. Ab diesem Tag
      müssen alle in China angebotenen generativen Dienste explizit und implizit kennzeichnen; App-Stores
      dürfen nicht kennzeichnende Anwendungen nicht mehr aufnehmen.

      '
    verifiziert: true
    quelle: https://www.loeb.com/en/insights/publications/2025/03/chinas-ai-labeling-measures-and-mandatory-national-standards-take-effect-september-1
  themenachsen:
  - content
  - marktzugang
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - 'Explizite Kennzeichnung: wahrnehmbarer Hinweis, medienadäquat — Texthinweis, Sprachansage, sichtbare
    Markierung in Bild und Video, jeweils an Anfang, Ende oder geeigneter Stelle.'
  - 'Implizite Kennzeichnung: Metadaten mit Anbietername und Inhaltskennung; technisches Verfahren zwingend
    nach GB 45438-2025.'
  - 'Plattformpflicht: Prüfung der Metadaten und Auszeichnung als bestätigt / möglich / vermutet KI-generiert
    — eine Dreistufigkeit, die die KI-VO nicht kennt.'
  - Nutzerpflicht zur aktiven Deklaration; Bereitstellung einer Deklarationsfunktion durch die Plattform.
  - 'App-Store-Pflicht: Prüfung der Kennzeichnungsunterlagen vor Aufnahme — Durchsetzung über den Vertriebsweg
    statt über Bußgelder.'
  - Verbot der böswilligen Entfernung, Fälschung oder Verbergung von Kennzeichen — adressiert jedermann,
    nicht nur Anbieter.
