- id: cn-anthropomorphe-dienste
  jurisdiktion: cn
  kurztitel: Verordnung über anthropomorphe KI-Interaktionsdienste
  offizieller_titel: Vorläufige Maßnahmen zur Verwaltung anthropomorpher interaktiver Dienste künstlicher
    Intelligenz
  originaltitel: 人工智能拟人化互动服务管理暂行办法
  fundstelle: Erlass Nr. 21 der Staatlichen Internet-Informationsverwaltung und vier weiterer Behörden
  verfahrensnummer: Konsultationsentwurf vom 27.12.2025, Stellungnahmefrist bis 25.01.2026
  status: anwendbar
  status_detail: 'Verkündet am 10.04.2026, in Kraft seit 15.07.2026. 32 Artikel in vier Kapiteln. Weltweit
    die erste eigenständige Regelung für KI-Begleiter, virtuelle Partner und emotionale Interaktionsdienste
    — sie geht dem kalifornischen SB 243 sachlich deutlich voraus.

    '
  kurzbeschreibung: 'Erfasst Dienste, die menschliche Persönlichkeitsmerkmale, Denk- und Kommunikationsweisen
    simulieren und auf fortdauernde emotionale Interaktion angelegt sind — virtuelle Partner, Begleitdienste
    für Ältere, Lernbegleiter für Kinder, kulturell aufgeladene virtuelle Personen. Ausgenommen sind Kundendienst,
    Frage-Antwort-Systeme und Assistenten ohne fortdauernde emotionale Bindung sowie rein interne Anwendungen.
    Anbieter müssen Nutzer registrieren und Alter sowie Sorgeberechtigte erfassen, KI-Kennzeichnung sicherstellen,
    bei ununterbrochener Nutzung über zwei Stunden Hinweise ausspielen, Selbstgefährdung erkennen und
    einen menschlichen Eingriff vorsehen. Minderjährigen unter 14 Jahren dürfen keine virtuellen Verwandtschafts-
    oder Liebesbeziehungen angeboten werden; sonstige Dienste bedürfen der Einwilligung der Sorgeberechtigten.
    Für ältere Nutzer gelten eigene Hinweis- und Risikopflichten. Ab einer Million registrierter oder
    100.000 monatlich aktiver Nutzer ist eine Sicherheitsbewertung durchzuführen. Bußgelder von 10.000
    bis 100.000 RMB, bei Gefährdung von Leben und Gesundheit 100.000 bis 200.000 RMB.

    '
  inkrafttreten:
    datum: 2026-07-15
    verifiziert: true
    quelle: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
  anwendungsdaten:
  - datum: 2026-07-15
    was_gilt: 'Vollständige Anwendung aller 32 Artikel; Bestandsdienste mussten bis zu diesem Tag Alterserfassung,
      Kinderschutzmodus, Nutzungsdauerhinweise und Notfallverfahren eingerichtet haben.

      '
    verifiziert: true
    quelle: https://www.news.cn/fortune/20260715/99e7098330ec47a18057250f31129f98/c.html
  themenachsen:
  - grundrechte
  - content
  - marktzugang
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - 'Kapitel I (Art. 1-5): Anwendungsbereich — fortdauernde emotionale Interaktion; ausdrücklich ausgenommen
    Kundendienst, Q&A, Assistenten, Lerninhalte ohne emotionale Bindung sowie rein unternehmensinterne
    Nutzung.'
  - 'Art. 8: Verbotene Inhalte — Gefährdung der nationalen Sicherheit, Anleitung zu Selbstverletzung,
    Nötigung, Ausbeutung.'
  - 'Art. 12: Dienstevertrag und Registrierung mit Alters- und Sorgeberechtigtenangaben.'
  - 'Art. 14: Minderjährige unter 14 Jahren — Verbot virtueller Verwandtschafts- und Liebesbeziehungen;
    im Übrigen Einwilligung der Sorgeberechtigten, Pflicht zu Kinderschutzmodus mit Zeitbegrenzung und
    Elternaufsicht.'
  - 'Art. 15: Eigene Schutzpflichten gegenüber älteren Nutzern — erstmals in einer chinesischen KI-Vorschrift
    den Minderjährigenpflichten gleichgestellt.'
  - 'Art. 18: KI-Kennzeichnung im laufenden Dialog; Hinweis bei ununterbrochener Nutzung über zwei Stunden.'
  - 'Art. 22: Sicherheitsbewertung ab 1 Mio. registrierten oder 100.000 monatlich aktiven Nutzern, bei
    neuen Funktionen oder Risikoindikatoren — erste quantifizierte Schwelle in diesem Regelungsfeld.'
  - 'Art. 26: Algorithmus-Filing nach den Empfehlungsvorschriften.'
  - 'Art. 30: Bußgeld 10.000-100.000 RMB; 100.000-200.000 RMB bei Gefährdung von Leben oder Gesundheit.'
