  regelungsschwerpunkte:
  - Geltung für alle beaufsichtigten Institute mit Verhältnismäßigkeitsvorbehalt.
  - KI-Bestandsverzeichnis und Wesentlichkeitsbewertung nach Auswirkung, Komplexität und Abhängigkeit
    — konkreter als die Anforderungen der KI-VO an Betreiber.
  - Ausdrückliche Einbeziehung von KI-Agenten — eine der ersten aufsichtsrechtlichen Regelungen weltweit,
    die das tut.
  - Zwölfmonatige Übergangsfrist nach Erlass vorgesehen.
  - Aufbauend auf den FEAT-Grundsätzen (Fairness, Ethics, Accountability, Transparency) von 2018 und dem
    Veritas-Programm zu deren Operationalisierung.
