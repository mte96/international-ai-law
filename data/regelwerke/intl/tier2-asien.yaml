  - gpai
  regelungsschwerpunkte:
  - Grundlagengesetz ohne Sanktionen — der schärfste Gegensatz zur KI-VO. Es gibt keine Risikoklassen,
    keine Konformitätsbewertung, keine Marktüberwachung.
  - 'Art. 7: Bemühenspflicht der KI-Akteure, mit staatlichen Maßnahmen zusammenzuwirken; keine durchsetzbare
