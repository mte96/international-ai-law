- id: cn-urhg
  jurisdiktion: cn
  kurztitel: Chinesisches Urheberrechtsgesetz
  offizieller_titel: Urheberrechtsgesetz der Volksrepublik China (Fassung der Änderung von 2020)
  originaltitel: 中华人民共和国著作权法（2020年修正）
  fundstelle: Beschlossen am 07.09.1990; dritte Änderung durch Beschluss des Ständigen Ausschusses des
    Nationalen Volkskongresses vom 11.11.2020
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Stammfassung vom 07.09.1990, in Kraft seit 01.06.1991; Änderungen 2001, 2010 und zuletzt
    am 11.11.2020, letztere in Kraft seit 01.06.2021. Die Änderung von 2020 hat den Werkbegriff des Art.
    3 auf eine offene Definition umgestellt und die Kategorie "audiovisuelle Werke" eingeführt — beides
    ist für KI-erzeugte Inhalte entscheidungserheblich geworden.

    '
  kurzbeschreibung: 'Zentrale Anspruchsgrundlage der chinesischen KI-Rechtsprechung zu erzeugten Inhalten.
    Art. 3 definiert Werke als geistige Schöpfungen auf literarischem, künstlerischem oder wissenschaftlichem
    Gebiet, die Originalität (独创性) besitzen und in bestimmter Form ausdrückbar sind, und zählt neun Kategorien
    auf, darunter erstmals audiovisuelle Werke. Ein numerus clausus besteht seit 2020 nicht mehr: Die
    Auffangkategorie erlaubt es, neue Erscheinungsformen zu erfassen. Das Gesetz kennt keine Schrankenregelung
    für Text- und Data-Mining; die Zulässigkeit des Trainings wird über Art. 24 (Schrankenkatalog) und
    den Grundsatz der angemessenen Nutzung diskutiert, ohne dass eine gerichtliche Klärung vorläge. Die
    Urheberschaft setzt nach Art. 11 eine natürliche Person oder eine juristische Person voraus; die chinesischen
    Gerichte haben daraus in der Sache Li gegen Liu (Internetgericht Peking, 27.11.2023) abgeleitet, dass
    der menschliche Nutzer Urheber sein kann, wenn er hinreichende Ausdrucksentscheidungen trifft.

    '
  inkrafttreten:
    datum: 1991-06-01
    verifiziert: true
    quelle: https://www.wipo.int/wipolex/en/legislation/details/21065
  anwendungsdaten:
  - datum: 2021-06-01
    was_gilt: 'Fassung der Änderung vom 11.11.2020: offener Werkbegriff in Art. 3, Kategorie der audiovisuellen
      Werke, erhöhte Schadensersatzobergrenzen und Strafschadensersatz bei vorsätzlicher Verletzung.

      '
    verifiziert: false
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - 'Art. 3: Werkbegriff — Originalität (独创性) und Ausdrückbarkeit in bestimmter Form; neun Kategorien
    mit Auffangtatbestand, seit 2020 kein numerus clausus mehr.'
  - 'Art. 11: Urheber ist die natürliche Person, die das Werk geschaffen hat; unter Voraussetzungen auch
    eine juristische Person oder Organisation.'
  - Keine TDM-Schranke — anders als Art. 30-4 des japanischen und Art. 4 der DSM-Richtlinie. Die Trainingsfrage
    ist in China ungeklärt.
  - 'Art. 24: abschließender Schrankenkatalog; die dortige Auffangklausel wird für KI-Training diskutiert,
    ist aber nicht als Schranke anerkannt.'
  - Strafrechtlicher Flankenschutz über Art. 217 Strafgesetzbuch — im Urteil des Volksgerichts Huangpu
    vom 08.05.2026 erstmals auf KI-erzeugte Kurzdramen angewendet.
  dokumente:
  - datum: 2020-11-11
