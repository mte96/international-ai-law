- id: kr-urhg
  jurisdiktion: kr
  kurztitel: Koreanisches Urheberrechtsgesetz
  offizieller_titel: Urheberrechtsgesetz der Republik Korea
  originaltitel: 저작권법
  fundstelle: Gesetz Nr. 432 vom 28.01.1957, vollständig neu gefasst 2006, seither mehrfach geändert
  verfahrensnummer: Mehrere Änderungsanträge zur Einführung einer TDM-Schranke seit 2021, keiner beschlossen
  status: anwendbar
  status_detail: 'Geltendes Recht ohne KI-spezifische Vorschriften. Eine TDM-Schranke ist seit 2021 in
    mehreren Gesetzentwürfen vorgeschlagen und bis heute nicht beschlossen worden — Korea steht damit
    anders als Japan und die EU ohne gesetzliche Trainingsschranke da. Die Verwaltung arbeitet stattdessen
    mit Leitlinien; das Ministerium für Kultur, Sport und Tourismus hat am 18.05.2026 Leitlinien zur fairen
    Nutzung beim Training generativer KI veröffentlicht.

    '
  kurzbeschreibung: 'Schützt Werke als schöpferische Ausdrucksformen menschlicher Gedanken oder Gefühle;
    Urheber kann nur ein Mensch sein. Für die KI-Frage bedeutet das: Reine Modellausgaben ohne menschlichen
    schöpferischen Beitrag sind nicht schutzfähig und nicht registrierbar. Für das Training fehlt eine
    ausdrückliche Schranke; diskutiert wird die Anwendung der allgemeinen Fair-Use-Klausel des Art. 35-5,
    die 2011 nach amerikanischem Vorbild eingeführt wurde. Genau daran setzen die Leitlinien des Kulturministeriums
    an. Neben der Trainingsfrage stehen Offenlegungspflichten für Trainingsdaten und ein Persönlichkeitsverwertungsrecht
    auf der Reformagenda.

    '
