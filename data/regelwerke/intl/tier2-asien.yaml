  fundstelle: Gesetz Nr. 950 vom 31.12.1961, seither mehrfach geändert
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Das koreanische Patentamt hat die DABUS-Anmeldung am 28.09.2022 für
    nichtig erklärt; das Verwaltungsgericht Seoul hat die Klage am 30.06.2023 abgewiesen, das Obergericht
    Seoul die Berufung am 16.05.2024 zurückgewiesen. Damit steht fest, dass Erfinder nur eine natürliche
    Person sein kann. Das KIPO hat 2023 eine öffentliche Befragung zur Frage einer KI-Erfinderschaft durchgeführt;
    eine Gesetzesänderung steht nicht an.

    '
  kurzbeschreibung: 'Verlangt, dass als Erfinder eine natürliche Person benannt wird. Der Erfinderbegriff
    knüpft an eine tatsächliche schöpferische Beteiligung an; ein KI-System kann diese Voraussetzung nicht
    erfüllen und auch keine Rechte übertragen. Die koreanischen Entscheidungen fügen sich in die weltweit
    einheitliche DABUS-Linie ein — Australien, Vereinigtes Königreich, Vereinigte Staaten, Europäisches
    Patentamt, Japan und Korea kommen zum selben Ergebnis; einzig Südafrika hat erteilt.

    '
