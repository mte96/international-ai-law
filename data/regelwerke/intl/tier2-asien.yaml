  - 'FEHLER. Eingetragen war 2026-06-30 aus einer Sekundaerquelle (''Mitte 2026''). Amtlich ist der 29.06.2026
    — so der Kopfvermerk des Gesetzes in Singapore Statutes Online und die gemeinsame Mitteilung von MinLaw
    und MDDI. Die uebrigen acht Schadenskategorien werden schrittweise nachgezogen; ein amtliches Datum
    dafuer liegt nicht vor. Vorher: 2026-06-30.'
- id: in-constitution
  jurisdiktion: in
  kurztitel: Verfassung Indiens — Grundrechte und Rechtsschutz
  offizieller_titel: The Constitution of India
  fundstelle: Verkündet am 26.11.1949, in Kraft seit 26.01.1950
  status: anwendbar
  status_detail: In Kraft. Für die KI-Debatte maßgeblich sind Art. 14, 19 und 21 sowie die Rechtsschutzgarantien
    der Art. 32 und 226. Das Grundrecht auf Privatheit ist nicht geschrieben, sondern in K.S. Puttaswamy
    v. Union of India, (2017) 10 SCC 1, aus Art. 21 abgeleitet worden.
  kurzbeschreibung: Die Verfassung ist die eigentliche Grundlage des indischen KI-Rechts, weil das Gesetzesrecht
    lückenhaft ist. Aus Art. 21 leitet der Supreme Court seit Puttaswamy (2017) das Grundrecht auf Privatheit
    ab; auf ihm beruhen der DPDP Act 2023 und die Persönlichkeitsrechtsprechung der High Courts. Art.
    19 Abs. 1 lit. a und Art. 19 Abs. 2 setzen der Deepfake-Regulierung und den Persönlichkeitsrechtsverfügungen
    die Grenze der Meinungsfreiheit; Art. 14 ist der Maßstab willkürlichen — auch algorithmisch vermittelten
    — Staatshandelns. Art. 32 und Art. 226 tragen die Public Interest Litigation, mit der Mindestgarantien
    für den staatlichen KI-Einsatz erstritten werden.
  inkrafttreten:
    datum: 1950-01-26
    verifiziert: true
    quelle: https://www.mea.gov.in/Images/pdf1/Part22.pdf
    fundstelle_norm: 'Art. 394 der Verfassung Indiens (Commencement): ''the remaining provisions of this
      Constitution shall come into force on the twenty-sixth day of January, 1950''. Die Art. 5 bis 9,
      60, 324, 366, 367, 379, 380, 388, 391, 392 und 393 traten sofort mit der Annahme am 26.11.1949 in
      Kraft.'
  themenachsen:
  - grundrechte
  - datenschutz
  - content
  - governance
  regelungsschwerpunkte:
  - Art. 21 als ungeschriebene Datenschutzgrundlage. Puttaswamy verlangt für jeden Eingriff Gesetzesvorbehalt,
    legitimen Zweck und Verhältnismäßigkeit — der Maßstab, an dem die weiten Ausnahmen des s. 17 DPDP
    Act gemessen werden.
  - Art. 19 Abs. 2 enthält einen ABSCHLIESSENDEN Schrankenkatalog. Anders als in den USA sind inhaltsbezogene
    Beschränkungen möglich, aber nur aus den genannten Gründen — daran werden die Kennzeichnungs- und
    Sperrpflichten der IT Rules gemessen.
  - Die Persönlichkeitsrechtsprechung der High Courts stützt sich auf Art. 21 in Verbindung mit dem Common-Law-Publizitätsrecht
    und s. 27 Abs. 2 Trade Marks Act. Ein Gesetz zum Persönlichkeitsrecht gibt es in Indien nicht.
  - Art. 226 gibt jedem High Court eine eigene, von Art. 32 unabhängige Anordnungsbefugnis. Deshalb entstehen
    die Deepfake-Verfahren dezentral bei den High Courts von Delhi, Bombay und Gujarat, nicht beim Supreme
    Court.
  dokumente:
  - datum: '2026-09-06'
    typ: konsolidiert
    titel: The Constitution of India — India Code
    url: https://www.indiacode.nic.in/
    sprache: en
    urheber: Legislative Department, Ministry of Law and Justice
    verifiziert: false
    notiz: India Code war am 06.09.2026 zeitweise nicht erreichbar; die Artikelinhalte sind aus der Rechtsprechung
      und den einschlägigen Entscheidungen des Bestands belegt.
  bezug_regelwerke:
  - in-dpdp-act-2023
  - in-it-act-2000
  - in-it-rules-2021
  - in-trade-marks-act-1999
  letzte_pruefung: '2026-09-06'
  anwendungsdaten:
  - datum: 1949-11-26
    was_gilt: Annahme der Verfassung; sofortiges Inkrafttreten der in Art. 394 aufgezaehlten Artikel (u.a.
      Art. 5 bis 9, 324, 379, 393).
    verifiziert: true
    quelle: https://www.mea.gov.in/Images/pdf1/Part22.pdf
  pruefvermerk:
  - 'Am amtlichen Verfassungstext (Art. 394) bestaetigt. Praezisierung: die Verfassung trat gestaffelt
    in Kraft — ein Teil bereits am 26.11.1949.'
- id: in-bns-2023
  jurisdiktion: in
  kurztitel: Bharatiya Nyaya Sanhita 2023 — indisches Strafgesetzbuch
  offizieller_titel: The Bharatiya Nyaya Sanhita, 2023
  fundstelle: Act No. 45 of 2023; im Gazette of India veröffentlicht am 25.12.2023
  status: anwendbar
  status_detail: In Kraft seit dem 01.07.2024; ersetzt das Indian Penal Code 1860 vollständig. Für den
    KI-Bezug entscheidend ist, dass mehrere Tatbestände ausdrücklich auf elektronische Aufzeichnungen
    und elektronische Verbreitung erstreckt wurden.
  kurzbeschreibung: 'Die Bharatiya Nyaya Sanhita hat das Indian Penal Code am 01.07.2024 abgelöst. Deepfakes
    und Identitätsmissbrauch werden über vier Normen erfasst: s. 319 (Betrug durch Identitätsanmaßung,
    ausdrücklich auch bei erfundener Person), s. 336 mit den Qualifikationen in Abs. 3 und 4 (Fälschung
    einer elektronischen Aufzeichnung in Betrugsabsicht beziehungsweise in Rufschädigungsabsicht), s.
    340 Abs. 2 (Gebrauch einer gefälschten elektronischen Aufzeichnung als echt) und s. 356 (Verleumdung
    durch sichtbare Darstellungen). Hinzu treten s. 77 (Voyeurismus), s. 78 (Nachstellung), s. 79 (Ehrverletzung
    einer Frau), s. 294 (obszönes Material), s. 351 (Nötigung) und s. 353 (Äußerungen, die öffentliches
    Unheil begünstigen, ausdrücklich auch auf elektronischem Weg). Einen eigenen Deepfake-Tatbestand kennt
    das Gesetz nicht.'
  inkrafttreten:
    datum: '2024-07-01'
    verifiziert: true
    quelle: https://indiankanoon.org/doc/149679501/
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - KEIN eigener Deepfake-Tatbestand. Indien hat mit der größten Strafrechtsreform seit 1860 die Gelegenheit
    nicht genutzt, synthetische Medien eigenständig zu erfassen — die Regulierung ist stattdessen in die
    IT Rules gewandert, also in untergesetzliches Recht.
  - 's. 336 Abs. 4 ist die praktisch treffendste Norm: Fälschung einer elektronischen Aufzeichnung in
    der Absicht oder Kenntnis, dem RUF einer Person zu schaden. Genau das ist der Deepfake, und der Strafrahmen
    von drei Jahren ist der niedrigste der Fälschungsqualifikationen.'
  - s. 319 erfasst die Identitätsanmaßung ausdrücklich unabhängig davon, ob die vorgetäuschte Person real
    oder erfunden ist — damit sind auch vollsynthetische Personen erfasst.
  - s. 353 erweitert die alte Vorschrift des s. 505 IPC ausdrücklich um die Verbreitung auf elektronischem
    Weg. Das ist die Norm, die gegen KI-erzeugte Falschmeldungen in Wahlkämpfen eingesetzt wird — mit
    dem bekannten Missbrauchsrisiko gegenüber Presse und Opposition.
  - Rule 7 IT Rules 2021 verweist seit der Änderung vom 10.02.2026 auf die Bharatiya Nyaya Sanhita statt
    auf das Indian Penal Code; die Verzahnung von Plattformhaftung und Strafrecht ist damit nachgeführt.
