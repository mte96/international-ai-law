    notiz: Zweisprachige Wiedergabe; Beleg für den Wortlaut der Art. 1018, 1019, 1023, 1024, 1032, 1034.
  - datum: 2020-05-28
    typ: konsolidiert
    titel: 中华人民共和国民法典 (amtliche Textwiedergabe)
    url: https://www.cac.gov.cn/2020-06/01/c_15925617772683193.htm
    sprache: zh
    urheber: Staatliche Internet-Informationsverwaltung (国家互联网信息办公室)
    verifiziert: true
    notiz: Am 05.09.2026 abgerufen; belegt Art. 990, 1018, 1019 (Verbot der Fälschung des Bildnisses mit
      informationstechnischen Mitteln), 1020, 1023 (entsprechende Anwendung auf die Stimme), 1024 und
      1034. Die Seite gibt die Bücher des Kodex bis zum Persönlichkeitsrecht wieder; das siebte Buch (Deliktsrecht)
      ist dort nicht enthalten.
  bedeutung_eu_anbieter: 'Für Anbieter von Stimm-, Avatar- und Bildbearbeitungsfunktionen die schärfste
    Haftungsquelle Chinas — schärfer als die Verwaltungsvorschriften, weil sie einen individuellen Unterlassungs-
    und Schadensersatzanspruch begründet und die chinesischen Internetgerichte sie zügig durchsetzen.
    Der Unterschied zur EU: Dort ergibt sich der Schutz aus einem Zusammenspiel von DSGVO, allgemeinem
    Persönlichkeitsrecht und — seit 2026 — Art. 5 Abs. 1 lit. ba KI-VO; in China steht er in einer einzigen,
    ausdrücklich auf Technikfälschung gemünzten Norm.

    '
  offene_punkte:
  - Reichweite von Art. 1019 bei erkennbar fiktiven oder satirischen Darstellungen.
