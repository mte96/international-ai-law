  - grundrechte
  regelungsschwerpunkte:
  - Absolutes Verbot im 90-Tage-Zeitraum, unabhängig davon, ob der Inhalt jemanden täuscht oder schädigt.
    Keine Ausnahme für Satire, Parodie oder erkennbar überzeichnete Darstellungen.
  - Außerhalb des Zeitraums gilt eine Kennzeichnungspflicht — der Aufbau entspricht damit einer verschärften
    Variante des Art. 50 Abs. 4 KI-VO.
  - Art. 255 knüpft an das bloße Herstellen an. Eine Verbreitung ist nicht erforderlich.
