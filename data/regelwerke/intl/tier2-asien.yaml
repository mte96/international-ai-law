  bedeutung_eu_anbieter: 'Zwei praktische Folgen. Erstens ist die neue KI-Klausel ein Förderauftrag, keine
    Pflichtennorm — sie ändert für Anbieter nichts unmittelbar, verankert aber KI-Governance auf Gesetzesebene
    und ist der wahrscheinliche Andockpunkt eines künftigen KI-Gesetzes. Zweitens verändert die Bußgeldreform
    das Risikoprofil: 10 Mio. RMB sind zwar weit unter dem Niveau der KI-VO, aber die Möglichkeit sofortiger
    Bußgelder ohne Abmahnung nimmt der bisherigen Praxis den Puffer, in dem sich ausländische Anbieter
    eingerichtet hatten.

    '
