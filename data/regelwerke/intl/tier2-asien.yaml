  letzte_pruefung: 2026-09-01
  pruefvermerk:
  - 'FEHLER. Eingetragen war 2026-05-20 als Datum der Erstveroeffentlichung, gestuetzt auf eine Sekundaerquelle
    (regulations.ai). Amtlich: Das Rahmenwerk wurde am 22.01.2026 beim Weltwirtschaftsforum vorgestellt;
    der 20.05.2026 ist das Datum der ersten Fortschreibung (IMDA-Seite ''SINGAPORE - 20 MAY 2026'', zuletzt
    aktualisiert 21.05.2026). Beide Daten jetzt amtlich belegt; das spaetere gehoert in anwendungsdaten,
    nicht in inkrafttreten. Vorher: 2026-05-20.'
- id: sg-ai-verify
  jurisdiktion: sg
  kurztitel: AI Verify und Global AI Assurance
  offizieller_titel: AI Verify — Testrahmenwerk und Werkzeugkasten für vertrauenswürdige künstliche Intelligenz;
    AI Verify Foundation; Global AI Assurance Pilot und Sandbox
  fundstelle: Initiative der IMDA; AI Verify Foundation gegründet am 07.06.2023
  verfahrensnummer: null
  status: softlaw
  status_detail: 'AI Verify wurde im Mai 2022 als Pilot vorgestellt und 2023 in eine Stiftung mit offener
    Mitgliedschaft überführt. 2025 folgten der Global AI Assurance Pilot, ein Starter Kit für die Prüfung
    LLM-gestützter Anwendungen und die Global AI Assurance Sandbox. Ein Crosswalk zum NIST-Rahmenwerk
    vom 27.05.2025 verbindet AI Verify mit dem amerikanischen Standardwerk.

    '
  kurzbeschreibung: 'AI Verify ist kein Regelwerk im engeren Sinn, sondern ein Testrahmenwerk mit quelloffener
    Werkzeugsammlung: Es prüft, ob ein KI-System die behaupteten Eigenschaften — Fairness, Erklärbarkeit,
    Robustheit — tatsächlich aufweist, und erzeugt einen standardisierten Testbericht. Es zertifiziert
    nicht die Qualität eines Systems, sondern belegt, dass Aussagen darüber überprüft wurden. Der Global
    AI Assurance Pilot brachte 2025 erstmals reale Anwendungen generativer KI mit spezialisierten Prüfern
    zusammen; die daraus entwickelte Sandbox setzt das fort. Das Starter Kit for Testing LLM-Based Applications
    for Safety and Reliability übersetzt die Ergebnisse in eine Handreichung für Entwickler.

    '
  inkrafttreten:
    datum: 2023-06-07
    verifiziert: true
    quelle: https://aiverifyfoundation.sg/what-is-ai-verify/
    fundstelle_norm: 'AI Verify Foundation: ''On 7 June 2023, AI Verify testing framework and toolkit
      was open-sourced in GitHub'' — zugleich Ueberfuehrung in eine Stiftung mit offener Mitgliedschaft.'
