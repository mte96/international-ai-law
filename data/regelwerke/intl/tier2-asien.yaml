    titel: South Korea AI Regulation Tracker (Abschnitt PIPA)
    url: https://www.deep-lex.com/ai-regulation-tracker/south-korea
    sprache: en
    urheber: Deep Lex
    verifiziert: true
    notiz: Beleg für die Vertreterreform zum 02.10.2025 und die PIPC-Leitlinien von 2026.
  bedeutung_eu_anbieter: 'Wer DSGVO-konform ist, steht hier gut da — mit einer Ausnahme, die Geld kostet:
    Koreas Pseudonymisierungsregime ist großzügiger als das europäische und zugleich formalisierter. Es
    erlaubt Trainingsdatennutzung ohne Einwilligung, verlangt dafür aber ein dokumentiertes Verfahren
    und, bei Zusammenführung von Datensätzen verschiedener Verantwortlicher, die Einschaltung einer benannten
    Stelle. Wer europäische Trainingsdaten in Korea nutzt, sollte diesen Pfad prüfen, statt sich auf berechtigte
    Interessen zu berufen — die kennt PIPA in dieser Form nicht.

    '
