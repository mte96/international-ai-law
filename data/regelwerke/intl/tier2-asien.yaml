  bedeutung_eu_anbieter: 'Der praktisch wichtigste Text. Wer ein generatives Modell in China öffentlich
    anbieten will, braucht eine chinesische Rechtsperson, ein Algorithmus-Filing und — bei Meinungsrelevanz,
    also faktisch bei jedem Chatbot — eine bestandene Sicherheitsbewertung nach GB/T 45654-2025. Rechnen
    Sie mit sechs bis zwölf Monaten Vorlauf. Die inhaltlichen Anforderungen des Art. 4 sind mit einem
    in Europa trainierten Modell ohne erhebliche Nachjustierung nicht erfüllbar; in der Praxis führt das
    zu einer eigenen China-Modellvariante. Art. 20 bedeutet: Wer ohne Filing aus dem Ausland anbietet,
    wird gesperrt, nicht gebüßt.

    '
  offene_punkte:
  - Verhältnis zu einem künftigen KI-Gesetz — die Maßnahmen sind ausdrücklich vorläufig.
  - Ob die Sicherheitsbewertung für rein B2B-Angebote ohne Publikumszugang entfällt, ist in der Praxis
    uneinheitlich gehandhabt.
