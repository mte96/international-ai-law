  offizieller_titel: 공직선거법 (Public Official Election Act)
  fundstelle: Gesetz Nr. 4739 vom 16.03.1994; Art. 82-8 eingefügt durch Gesetz Nr. 19839 vom 29.12.2023,
    zuletzt geändert durch Gesetz Nr. 21577 vom 22.04.2026
  status: anwendbar
  status_detail: Art. 82-8 gilt seit dem 29.01.2024 und wurde erstmals bei der Parlamentswahl vom 10.04.2024
    angewandt. Die Änderung durch Gesetz Nr. 21577 vom 22.04.2026 ist am 01.07.2026 in Kraft getreten.
    Gegen das Verbot ist eine Verfassungsbeschwerde anhängig; beanstandet wird, dass es weder eine Ausnahme
    für Satire und Parodie noch eine Erheblichkeitsschwelle kennt.
  kurzbeschreibung: 'Art. 82-8 verbietet vom 90. Tag vor der Wahl bis zum Wahltag jede Herstellung, Bearbeitung,
    Verbreitung, Vorführung und Einstellung von mit KI erzeugten, von der Wirklichkeit kaum unterscheidbaren
    Tönen, Bildern und Videos zu Wahlkampfzwecken. Außerhalb dieses Zeitraums besteht eine Kennzeichnungspflicht.
    Die Strafdrohung des Art. 255 reicht bis zu sieben Jahren Freiheitsstrafe oder 10 bis 50 Mio. KRW
    Geldstrafe. Das ist das schärfste Wahlkampf-Deepfake-Verbot einer Demokratie: ein absolutes Verbot
    ohne Schadenserfordernis und ohne Ausnahme, während die KI-VO in Art. 50 Abs. 4 lediglich Kennzeichnung
    verlangt und der US-amerikanische Ansatz auf einzelstaatliche Offenlegungspflichten setzt.'
