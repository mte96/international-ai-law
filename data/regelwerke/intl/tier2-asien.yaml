- id: jp-appi
  jurisdiktion: jp
  kurztitel: APPI — japanisches Datenschutzgesetz
  offizieller_titel: Gesetz über den Schutz personenbezogener Informationen
  originaltitel: 個人情報の保護に関する法律
  fundstelle: Gesetz Nr. 57 vom 30.05.2003; Novelle 2026 vom Unterhaus am 26.05.2026 und vom Oberhaus
    am 12.06.2026 beschlossen
  verfahrensnummer: 221. Sitzungsperiode des Parlaments
  status: teilanwendbar
  status_detail: 'Geltendes Recht seit 2005, zuletzt umfassend novelliert 2020 (in Kraft 2022). Die Novelle
    2026 wurde am 26.05.2026 vom Repräsentantenhaus und am 12.06.2026 vom Rätehaus beschlossen; das Inkrafttreten
    wird für etwa 2028 erwartet, rund zwei Jahre nach Verkündung. Sie enthält die für KI wichtigste japanische
    Datenschutzänderung seit Jahren.

    '
  kurzbeschreibung: 'Die Novelle 2026 verfolgt vier Ziele: Förderung angemessener Datennutzung, risikoabhängige
    Regulierung, Verhinderung missbräuchlicher Nutzung und Stärkung der Durchsetzung. Für KI zentral ist
    der Wegfall des Einwilligungserfordernisses für die Weitergabe personenbezogener Daten an Dritte zum
    Zweck der Statistikerstellung und der KI-Entwicklung; sogar die Erhebung besonders schutzbedürftiger
    Informationen wird zulässig, wenn sichergestellt ist, dass sie ausschließlich zur Erstellung von Statistiken
    verwendet werden. Neu ist ferner ein Abschöpfungsbetrag: Die Datenschutzkommission kann bei großangelegten
    Verstößen — ab 1.000 Betroffenen, mit nachweisbarem Schaden und Verschulden — einen Geldbetrag festsetzen,
    bei Wiederholung mit dem Faktor 1,5. Für Personen unter 16 Jahren sind Einwilligung und Information
    an den gesetzlichen Vertreter zu richten. Bei biometrischen Daten kann die betroffene Person die Einstellung
    der Nutzung auch ohne Rechtsverstoß verlangen.

    '
  inkrafttreten:
    datum: 2005-04-01
    verifiziert: true
    quelle: https://laws.e-gov.go.jp/api/2/law_data/415AC0000000057?elm=SupplProvision
    fundstelle_norm: '附則第一条 個人情報の保護に関する法律 (Gesetz Nr. 57 vom 30.05.2003): 「この法律は、公布の日から施行する。ただし、第四章から第六章まで及び附則第二条から第六条までの規定は、公布の日から起算して二年を超えない範囲内において政令で定める日から施行する。」
      — Grundteil ab Verkuendung, die Pflichtenkapitel 4 bis 6 ab einem durch Rechtsverordnung bestimmten
      Tag binnen zwei Jahren; dieser Tag ist der 01.04.2005.'
  anwendungsdaten:
