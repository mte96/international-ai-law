  pruefvermerk:
  - Datum bestaetigt und praezisiert. Der Bestandswert 02.07.2014 ist als Beginn der Datenschutzpflichten
    richtig; das Gesetz als solches gilt jedoch schon seit dem 02.01.2013, das Do-Not-Call-Regime seit
    dem 02.01.2014. Die drei Stufen sind jetzt am amtlichen Kommencierungsvermerk belegt.
- id: sg-pdpc-ki-leitlinien
  jurisdiktion: sg
  kurztitel: PDPC-Leitlinien zu personenbezogenen Daten in KI-Systemen
  offizieller_titel: Advisory Guidelines on the Use of Personal Data in AI Recommendation and Decision
    Systems
  fundstelle: Veröffentlichung der Personal Data Protection Commission vom 01.03.2024
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 01.03.2024 veröffentlicht. Formal unverbindlich, praktisch maßgeblich: Die PDPC wird
    das PDPA in Vollzugsverfahren im Einklang mit ihnen auslegen. Eine gesonderte Handreichung zum Training
    generativer KI hat die Kommission angekündigt; sie ist nicht nachweisbar geworden.

    '
  kurzbeschreibung: 'Klären, wann Organisationen personenbezogene Daten für Empfehlungs- und Entscheidungssysteme
    ohne Einwilligung nutzen dürfen. Sie ordnen den Anwendungsbereich der Ausnahme zur Geschäftsverbesserung
    und der Forschungsausnahme, benennen die erwarteten technischen und organisatorischen Schutzmaßnahmen,
    sagen, welche Informationen Betroffene erhalten sollen und wie diese zu vermitteln sind, und formulieren
    Empfehlungen für Dienstleister, die KI-Systeme für Dritte entwickeln — sowohl zu deren eigener Einhaltung
    des PDPA als auch zur Unterstützung ihrer Kunden.

    '
  inkrafttreten:
    datum: 2024-03-01
    verifiziert: true
    quelle: https://www.twobirds.com/en/insights/2024/singapore/pdpc-advisory-guidelines-on-the-use-of-personal-data-in-ai-recommendation-and-decision-systems
  anwendungsdaten:
  - datum: 2024-03-01
    was_gilt: Veröffentlichung; unmittelbare Maßgeblichkeit für die Auslegungspraxis der PDPC.
    verifiziert: true
  themenachsen:
  - datenschutz
  - governance
  - gpai
  - vertrag
  regelungsschwerpunkte:
  - Abgrenzung von Geschäftsverbesserungs- und Forschungsausnahme, insbesondere hinsichtlich der zulässigen
    Empfängerkreise.
  - 'Konkretisierung der Transparenzpflichten: welche Informationen Betroffene über den KI-Einsatz erhalten
    sollen.'
  - Eigener Abschnitt für Dienstleister und Datenintermediäre — praktisch die Grundlage für die Ausgestaltung
    von Auftragsverarbeitungsverträgen in Singapur.
  - Angekündigte, aber noch nicht nachgewiesene gesonderte Handreichung zum Training generativer KI.
