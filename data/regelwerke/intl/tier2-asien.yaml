    typ: endfassung
    titel: 互联网信息服务深度合成管理规定 (amtlicher Volltext)
    url: https://www.cac.gov.cn/2022-12/11/c_1672221949354811.htm
    sprache: zh
    urheber: Staatliche Internet-Informationsverwaltung (国家互联网信息办公室)
    verifiziert: true
    notiz: Amtlicher Volltext. Erlass Nr. 12 der Staatlichen Internet-Informationsverwaltung, des MIIT
      und des Ministeriums für öffentliche Sicherheit, fünf Kapitel, 25 Artikel, in Kraft seit 10.01.2023.
      Grundlage der Normebene, insbesondere Art. 14 (gesonderte Einwilligung bei Bearbeitung von Gesicht
      und Stimme) und Art. 17 (auffällige Kennzeichnung bei fünf Dienstkategorien).
  bedeutung_eu_anbieter: 'Für jeden Anbieter von Stimm-, Avatar- oder Gesichtsfunktionen relevant, auch
    wenn er kein Sprachmodell betreibt. Die gesonderte Einwilligung nach Art. 14 ist strenger als Art.
    9 DSGVO, weil sie nicht der betroffenen Person gegenüber vom Verantwortlichen, sondern über den Nutzer
    eingeholt werden muss und der Anbieter dafür einstehen muss. Anders als die KI-VO adressieren die
    Vorschriften ausdrücklich auch den technischen Zulieferer, nicht nur den Dienstanbieter.

    '
  offene_punkte:
  - Abgrenzung zu den Interimsmaßnahmen für generative KI bei Diensten, die beides sind — nach herrschender
    Praxis kumulative Anwendung.
