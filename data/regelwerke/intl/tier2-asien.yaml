- id: sg-electronic-transactions-act
  jurisdiktion: sg
  kurztitel: Electronic Transactions Act 2010
  offizieller_titel: Electronic Transactions Act 2010
  fundstelle: Act 16 of 2010; Teil 2A (elektronische übertragbare Aufzeichnungen) eingefügt durch Act
    5 of 2021
  status: anwendbar
  status_detail: Das Gesetz setzt das UNCITRAL-Übereinkommen über elektronische Kommunikation bei internationalen
    Verträgen um. s. 15 ist die einzige gesetzliche Vorschrift Singapurs, die den Vertragsschluss durch
    autonom handelnde Systeme betrifft, und die Grundlage, auf der der Court of Appeal in Quoine Pte Ltd
    ./. B2C2 Ltd [2020] SGCA(I) 2 entschieden hat. Das Gesetz beantwortet die Wirksamkeits-, nicht die
    Zurechnungsfrage; die Lücke hat das Gericht mit dem Rückgriff auf den Kenntnisstand der Programmierer
    im Zeitraum von der Programmierung bis zum Vertragsschluss geschlossen.
  kurzbeschreibung: Teil 2 regelt elektronische Aufzeichnungen, Signaturen und Verträge. s. 11 erkennt
    den elektronischen Vertragsschluss an, s. 13 bestimmt Zeit und Ort von Absendung und Zugang, s. 14
    behandelt die Einladung zur Abgabe eines Angebots, s. 15 erklärt Verträge für wirksam, die durch das
    Zusammenwirken automatisierter Nachrichtensysteme untereinander oder mit einem Menschen zustande kommen,
    und s. 16 gibt bei Eingabefehlern einer natürlichen Person gegenüber einem automatisierten System
    ein Rücknahmerecht. s. 26 stellt Netzdiensteanbieter für fremde Inhalte frei. s. 4 nimmt bestimmte
    Rechtsgeschäfte — letztwillige Verfügungen, Immobiliengeschäfte und andere in der Ersten Anlage genannte
    — aus.
  inkrafttreten:
    datum: 2010-07-01
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/ETA2010
    fundstelle_norm: 'Electronic Transactions Act 2010 (Act 16 of 2010), Kommencierungsvermerk in Singapore
      Statutes Online: ''[1 July 2010]''.'
  themenachsen:
  - vertrag
  - haftung
  - sektor-finanz
  regelungsschwerpunkte:
  - s. 15 sagt, dass ein von Maschinen geschlossener Vertrag wirksam ist — nicht, wem die Kenntnis der
    Maschine zugerechnet wird. Diese Lücke ist der eigentliche Gegenstand von Quoine ./. B2C2 und bis
    heute die offene Frage jedes agentischen Systems.
  - s. 16 hilft nur der natürlichen Person gegenüber einem System, nicht im Verhältnis zweier Systeme.
    In Quoine ./. B2C2 handelten beide Seiten über deterministische Algorithmen — der gesetzliche Irrtumsbehelf
    griff nicht.
  - Der Court of Appeal hat auf deterministische Algorithmen abgestellt. Für lernende Systeme, deren Verhalten
    die Programmierer nicht mehr vorhersehen, ist die Entscheidung ausdrücklich nicht geschrieben; das
    ist die wichtigste offene Frage des singapurischen Vertragsrechts.
