- id: cn-ki-gesetz
  jurisdiktion: cn
  kurztitel: Umfassendes KI-Gesetz (Gesetzgebungsplan)
  offizieller_titel: Gesetz der Volksrepublik China über künstliche Intelligenz (Arbeitstitel)
  originaltitel: 中华人民共和国人工智能法（暂定名）
  fundstelle: Gesetzgebungsarbeitsplan des Staatsrats 2024, 2025 und 2026; Jahresarbeitsplan des Ständigen
    Ausschusses des Nationalen Volkskongresses
  verfahrensnummer: null
  status: idee
  status_detail: 'Seit 2023 in den Gesetzgebungsplänen, ohne dass je ein amtlicher Entwurf veröffentlicht
    worden wäre. Der Staatsratsplan vom Mai 2026 spricht erstmals davon, die "umfassende Gesetzgebung
    für die gesunde Entwicklung der KI zu beschleunigen" — eine Verschärfung gegenüber dem Vorjahr. Widersprüchliche
    Auswertung: Die Analyse des am 11.06.2026 veröffentlichten Plans durch Advant NCTM findet kein eigenständiges
    KI-Gesetz als Vorhaben, sondern nur Gesetzgebung zu "gemeinsamen Elementen" — Daten, Rechenleistung,
    Algorithmen. Beides ist miteinander vereinbar, wenn man annimmt, dass der Gesetzgeber die Sektoralregelung
    fortsetzt und den Rahmen offen lässt. Ein Zeitplan besteht nicht.

    '
  kurzbeschreibung: 'Vorhaben eines horizontalen Rahmengesetzes, das die derzeit auf vier Verordnungen
    und mehrere Normen verteilte Regulierung zusammenführen soll. Nach den Planangaben soll es Datenschutz,
    Rechenleistung, Algorithmensteuerung, Eigentumsrechte, Cybersicherheit und Lieferketten abdecken.
    Als Vorarbeiten liegen zwei akademische Modellgesetze vor: der "Modellentwurf eines KI-Gesetzes" der
    Chinesischen Akademie der Sozialwissenschaften (Version 1.0 vom August 2023, Version 2.0 vom 16.04.2024),
    der zwischen einem Erlaubnisvorbehalt für Hochrisikotätigkeiten und einer bloßen Registrierung im
    Übrigen unterscheidet, sowie ein Gelehrtenentwurf einer Gruppe um mehrere Universitäten. Beide sind
    nicht amtlich.

    '
  inkrafttreten: null
  anwendungsdaten: []
  themenachsen:
  - governance
  - marktzugang
  - gpai
  regelungsschwerpunkte:
  - Kein amtlicher Entwurf veröffentlicht — alle kursierenden Texte sind akademische Modellgesetze ohne
    Rechtswirkung.
  - 'Modellgesetz 2.0 (CASS, 16.04.2024): Erlaubnisvorbehalt für Hochrisiko-KI, Registrierung im Übrigen,
    ausdrücklich zur Vermeidung übermäßiger Belastung der Industrie.'
  - 'Planformulierung 2026: ''Beschleunigung der umfassenden Gesetzgebung für die gesunde Entwicklung
    der künstlichen Intelligenz'' sowie ''Gesetzgebung zu gemeinsamen Elementen'' (Daten, Rechenleistung,
    Algorithmen).'
  - Die Änderung des Cybersicherheitsgesetzes zum 01.01.2026 hat erstmals eine KI-Förder- und Sicherheitsklausel
    in ein Parlamentsgesetz aufgenommen — funktional ein Teilvorgriff.
