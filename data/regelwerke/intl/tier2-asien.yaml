  status: verfahren
  status_detail: 'Am 19.05.2026 berichtet: Peking hat 25 Gesetzgebungsvorhaben in den Jahresplan 2026
    aufgenommen, davon 13 Beratungs- und 12 Vorbereitungsvorhaben. Die KI-Industrieverordnung zählt zu
    den Beratungsvorhaben, also zur fortgeschrittenen Gruppe. Ein Text ist nicht veröffentlicht. Bis dahin
    steuert Peking über Maßnahmenpakete ohne Gesetzesrang.

    '
  kurzbeschreibung: 'Vorhaben einer kommunalen Rahmenverordnung für die Pekinger KI-Industrie, eingeordnet
    in den Schwerpunkt "Förderung hochqualitativen Wachstums und Stärkung der Innovationsfähigkeit". Peking
    hat bisher ohne Verordnungsrang gearbeitet: mit den "Maßnahmen zur Förderung der innovativen Entwicklung
    allgemeiner künstlicher Intelligenz" (Mai 2023), dem Aktionsplan "Künstliche Intelligenz plus" 2024-2025
    (März 2025) und den "Maßnahmen zur beschleunigten Entwicklung von KI-Agenten" (Juli 2026). Das macht
    Peking zum Beispiel dafür, dass in China ein erheblicher Teil der Steuerung unterhalb der Verordnungsebene
    stattfindet.

    '
