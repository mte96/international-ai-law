- id: cn-zgb
  jurisdiktion: cn
  kurztitel: Chinesisches Zivilgesetzbuch
  offizieller_titel: Zivilgesetzbuch der Volksrepublik China
  originaltitel: 中华人民共和国民法典
  fundstelle: Beschlossen vom 13. Nationalen Volkskongress am 28.05.2020
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.01.2021. Buch IV (Persönlichkeitsrechte) ist der weltweit erste kodifizierte
    Persönlichkeitsrechtsteil eines Zivilgesetzbuchs und enthält in Art. 1019 eine ausdrücklich auf informationstechnische
    Fälschung zugeschnittene Norm — sie ist vier Jahre älter als jede europäische Deepfake-Regelung.

    '
  kurzbeschreibung: 'Buch IV schützt Bildnis, Stimme, Ehre, Privatsphäre und personenbezogene Informationen.
    Art. 1019 verbietet ausdrücklich, das Bildnis eines anderen "durch Einsatz von Informationstechnik
    zu fälschen"; Art. 1023 Abs. 2 erklärt die Bildnisschutzvorschriften auf die Stimme für entsprechend
    anwendbar — die Grundlage der Entscheidung des Internetgerichts Peking vom 23.04.2024 zur geklonten
    Sprecherstimme. Art. 1024 schützt die Reputation, Art. 1032 die Privatsphäre, Art. 1034 personenbezogene
    Informationen. Für die Haftung greifen Art. 1165 (Verschuldenshaftung) und die Art. 1194 bis 1197
    (Verantwortlichkeit von Netzwerknutzern und Diensteanbietern, einschließlich Notice-and-Takedown).

    '
  inkrafttreten:
    datum: 2021-01-01
    verifiziert: true
    quelle: https://www.chinajusticeobserver.com/law/x/civil-code-of-china-part-iv-personality-rights-20200528
  anwendungsdaten:
  - datum: 2021-01-01
    was_gilt: Vollständige Anwendung; zugleich Außerkrafttreten der bisherigen Einzelgesetze (Allgemeine
      Grundsätze des Zivilrechts, Deliktshaftungsgesetz u. a.).
    verifiziert: true
  themenachsen:
  - grundrechte
  - haftung
  - content
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 1018: Recht am eigenen Bildnis.'
  - 'Art. 1019: Verbot, ein Bildnis zu verunglimpfen, zu entstellen oder ''durch Einsatz von Informationstechnik
    zu fälschen'' — die deutlichste Deepfake-Norm einer Zivilrechtskodifikation.'
  - 'Art. 1023 Abs. 2: Stimme genießt entsprechenden Schutz wie das Bildnis — Grundlage der Stimmklon-Rechtsprechung.'
  - 'Art. 1024: Ehrschutz; Art. 1032: Privatsphäre; Art. 1034: personenbezogene Informationen.'
  - 'Art. 1165: Verschuldenshaftung; Art. 1194-1197: Haftung von Netznutzern und Diensteanbietern mit
    Hinweis- und Weiterleitungsverfahren.'
  dokumente:
  - datum: 2020-05-28
    typ: konsolidiert
    titel: 'Civil Code of China: Book IV Personality Rights (2020) 民法典 第四编 人格权'
    url: https://www.chinajusticeobserver.com/law/x/civil-code-of-china-part-iv-personality-rights-20200528
    sprache: zh/en
    urheber: China Justice Observer
