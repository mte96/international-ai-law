- id: cn-deep-synthesis
  jurisdiktion: cn
  kurztitel: Deep-Synthesis-Vorschriften
  offizieller_titel: Vorschriften über die Verwaltung der Tiefensynthese bei Internet-Informationsdiensten
  originaltitel: 互联网信息服务深度合成管理规定
  fundstelle: Erlass Nr. 12 der Staatlichen Internet-Informationsverwaltung, des Ministeriums für Industrie
    und Informationstechnik und des Ministeriums für öffentliche Sicherheit
  verfahrensnummer: Konsultationsentwurf vom 28.01.2022
  status: anwendbar
  status_detail: 'Seit 10.01.2023 in Kraft, 25 Artikel. Sie sind die eigentliche Deepfake-Regelung Chinas
    und gehen den Interimsmaßnahmen für generative KI zeitlich wie sachlich voraus. Die Kennzeichnungsmaßnahmen
    von 2025 setzen unmittelbar auf ihnen auf.

    '
  kurzbeschreibung: 'Regelt Technologien, die mit generativen oder synthetisierenden Algorithmen Text,
    Bild, Ton, Video oder virtuelle Szenen erzeugen — Gesichtstausch, Stimmklonung, digitale Menschen,
    Szenenerzeugung. Anbieter und technische Zulieferer müssen Nutzer real identifizieren, Eingaben und
    Ausgaben prüfen, eine Datenbank rechtswidriger Inhalte führen und Verstöße melden. Bearbeitet ein
    Dienst biometrische Merkmale einer Person — Gesicht, Stimme —, muss er den Nutzer anhalten, die betroffene
    Person zu unterrichten und deren gesonderte Einwilligung einzuholen. Erzeugte Inhalte, die verwechselbar
    sind, müssen auffällig gekennzeichnet werden; jede Ausgabe trägt zusätzlich eine unauffällige Herkunftsmarkierung,
    die zu entfernen verboten ist.

    '
  inkrafttreten:
    datum: 2023-01-10
    verifiziert: true
    quelle: https://www.chinalawtranslate.com/en/deep-synthesis/
  anwendungsdaten:
  - datum: 2023-01-10
    was_gilt: Vollständige Anwendung. Filing-Pflicht (Art. 19) und Sicherheitsbewertung (Art. 15, 20)
      für Dienste mit Meinungsbildungswirkung.
    verifiziert: true
  themenachsen:
  - content
  - grundrechte
  - marktzugang
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - 'Art. 23: Legaldefinition der Tiefensynthese — generative und synthetisierende Algorithmen für Text,
    Bild, Ton, Video, virtuelle Szenen; ausdrücklich genannt: Textgenerierung, Sprachsynthese, Gesichtserzeugung
    und -tausch, Haltungsmanipulation, Szenenerzeugung.'
  - 'Art. 14: Bearbeitung biometrischer Merkmale (Gesicht, Stimme) nur nach gesonderter Einwilligung der
    betroffenen Person; der Anbieter muss den Nutzer dazu anhalten.'
  - 'Art. 16/17: Zweistufige Kennzeichnung — unauffällige Herkunftsmarkierung an jeder Ausgabe (Art. 16)
    und auffälliger Hinweis bei verwechselbaren Inhalten wie Dialogsystemen, synthetischer Stimme, Gesichtstausch,
    immersiven Szenen (Art. 17).'
  - 'Art. 18: Verbot, Kennzeichnungen zu entfernen, zu verändern oder zu verbergen.'
  - 'Art. 19: Filing-Pflicht binnen zehn Werktagen; die Filing-Nummer ist auf der Website anzugeben.'
  - 'Art. 10: Prüfpflicht für Eingaben und Ausgaben, Datenbank rechtswidriger Inhalte, Meldepflicht.'
  - 'Art. 15/20: Eigenständige Sicherheitsbewertung bei Diensten, die biometrische Informationen erzeugen
    oder Inhalte mit Bezug zu nationaler Sicherheit, Staatsbild und nationalen Interessen betreffen.'
