- id: kr-fsc-ki-leitlinie
  jurisdiktion: kr
  kurztitel: FSC-Leitlinie KI im Finanzsektor
  offizieller_titel: Leitlinie für künstliche Intelligenz im Finanzsektor
  originaltitel: 금융부문 인공지능 가이드라인
  fundstelle: Entwurf der Finanzdienstleistungskommission (FSC) vom 22.12.2025
  verfahrensnummer: Öffentliche Konsultation bis 31.01.2026
  status: softlaw
  status_detail: 'Am 22.12.2025 als Entwurf veröffentlicht, Konsultation bis 31.01.2026, Inkraftsetzung
    für das erste Quartal 2026 angekündigt. Ob die Endfassung inzwischen vorliegt, war nicht zu klären.
    Sie führt drei bisherige Leitlinien (Entwicklung, Betrieb, Sicherheit) zusammen.

    '
  kurzbeschreibung: 'Gilt für Finanzunternehmen — Banken, Versicherer, Wertpapierfirmen — und für Nichtfinanzunternehmen
    wie Fintechs, soweit ihre KI-Systeme Finanztransaktionen beeinflussen. Sie formuliert sieben Grundsätze:
    Governance mit Verantwortung der Geschäftsleitung, KI-Ethikausschuss und unabhängiger Risikomanagementeinheit;
    Rechtmäßigkeit einschließlich der Einhaltung des KI-Rahmengesetzes; Subsidiarität, wonach KI nur als
    Hilfsmittel dient und die Letztentscheidung beim Menschen bleibt; Verlässlichkeit mit Modellgütemanagement,
    Verzerrungserkennung und Erklärbarkeit; Finanzstabilität mit systematischer Risikobewertung und Vorfallmeldung;
    Redlichkeit mit einer Hinweispflicht gegenüber Verbrauchern bei allen KI-Diensten, die über die Pflichten
    des KI-Rahmengesetzes hinausgeht; und Sicherheit gegen Datenvergiftung, Prompt-Injection und Jailbreaking.

    '
  inkrafttreten:
    datum: 2026-06-22
    verifiziert: true
    quelle: https://www.fsc.go.kr/no010101/87142
    fundstelle_norm: '금융분야 인공지능 가이드라인 (Leitlinie fuer kuenstliche Intelligenz im Finanzsektor), Endfassung
      der Finanzdienstleistungskommission, bekanntgegeben am 18.06.2026, in Kraft ab 22.06.2026. Sie stellt
      sieben Grundsaetze auf: Governance, Rechtstreue, KI als Hilfsmittel, Verlaesslichkeit, Finanzstabilitaet,
      Redlichkeit und Sicherheit.'
