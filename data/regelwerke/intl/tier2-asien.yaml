  status_detail: 'Erster Basisplan, am 23.12.2025 vom Kabinett beschlossen; eine vorläufige englische
    Übersetzung datiert vom 19.06.2026. Der Plan soll grundsätzlich jährlich fortgeschrieben werden —
    die nächste Fassung ist damit gegen Ende 2026 zu erwarten.

    '
  kurzbeschreibung: 'Der Plan trägt die Politik, die das Förderungsgesetz offenlässt. Er ruht auf vier
    Säulen: Beschleunigung der KI-Nutzung, strategische Stärkung der KI-Entwicklung, Führungsrolle in
    der KI-Governance und nachhaltige gesellschaftliche Transformation. Für Juristen sind vier Zusagen
    bedeutsam: eine "verantwortliche agile Governance" mit institutionellen, technischen und organisatorischen
    Antworten statt starrer Regeln; die Förderung von Technologien zur Unterscheidung KI-erzeugter Inhalte
    einschließlich digitaler Wasserzeichen; der Aufbau von Beratungsstrukturen gegen Immaterialgüterrechtsverletzungen
    durch generative KI; sowie die fortlaufende Überprüfung, welche Regelungen die gesellschaftliche Umsetzung
    von KI ermöglichen oder hemmen.

    '
  inkrafttreten:
