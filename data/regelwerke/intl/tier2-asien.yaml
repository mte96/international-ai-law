  - 'Vier Säulen: Nutzung, Entwicklung, Governance, Transformation.'
  - Zusage zur Förderung von Herkunftsnachweistechnik einschließlich digitaler Wasserzeichen — Japans
    Antwort auf die chinesische Kennzeichnungspflicht und Art. 50 KI-VO, aber als Förderung statt als
    Pflicht.
  - Beratungsstrukturen gegen Immaterialgüterrechtsverletzungen durch generative KI statt gesetzlicher
    Neuregelung.
  - Fortlaufende Prüfung des Regelungsbedarfs — der Ort, an dem eine japanische Kehrtwende zu verbindlichen
    Regeln sichtbar würde.
