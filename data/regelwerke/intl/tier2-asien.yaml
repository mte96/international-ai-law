  status_detail: 'Verbindliche — nicht empfohlene — nationale Norm. Veröffentlicht am 14.03.2025, in Kraft
    seit 01.09.2025, zeitgleich mit den Kennzeichnungsmaßnahmen. Der Unterschied zur Kennzeichnung "GB/T"
    ist entscheidend: GB ohne "/T" ist zwingend.

    '
  kurzbeschreibung: 'Legt technisch fest, wie explizite und implizite Kennzeichnungen auszuführen sind:
    Position, Größe und Wortlaut sichtbarer Hinweise in Text, Bild, Audio und Video, Struktur der Metadatenfelder,
    Kodierung der Anbieterkennung und der Inhalts-ID, Anforderungen an digitale Wasserzeichen sowie das
    Verhalten von Verbreitungsplattformen bei Erkennung, Weitergabe und Ergänzung von Kennzeichen. Sie
    ist die technische Bedingung, ohne deren Erfüllung die Kennzeichnungsmaßnahmen nicht erfüllbar sind.
    Ergänzt wird sie durch sechs Praxisleitfäden des Normungsausschusses TC260.

    '
