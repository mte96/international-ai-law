- id: jp-urheberrechtsgesetz
  jurisdiktion: jp
  kurztitel: Japanisches Urheberrechtsgesetz
  offizieller_titel: 著作権法 (Chosakukenhō — Copyright Act)
  fundstelle: Gesetz Nr. 48 vom 06.05.1970 (昭和四十五年法律第四十八号), zuletzt geändert 2024
  status: anwendbar
  status_detail: Das vollständige Urheberrechtsgesetz, in dessen Rahmen Art. 30-4 steht. Der Bestand führte
    bislang nur Art. 30-4 als eigenes Regelwerk; die Anspruchsgrundlagen der beiden Perplexity-Verfahren
    — Art. 21 und Art. 23 — sowie die Rechtsfolgen in Art. 112, 114 und 119 hatten deshalb keinen Ort.
    Zuständige Behörde ist die Kulturbehörde (文化庁), deren Auslegungsrichtlinien als eigenes Regelwerk
    jp-bunka-ki-urheberrecht geführt werden.
  kurzbeschreibung: 'Das japanische Urheberrechtsgesetz schützt schöpferische Ausdrucksformen von Gedanken
    oder Gefühlen (Art. 2 Abs. 1 Nr. 1) und nimmt reine Tatsachenmitteilungen ausdrücklich aus (Art. 10
    Abs. 2). Die Verwertungsrechte sind in Art. 21 ff. einzeln aufgezählt. Die für KI entscheidende Besonderheit
    ist die Schrankensystematik: Art. 30-4 erlaubt jede Nutzung, die nicht auf den Genuss des Ausdrucksgehalts
    zielt, ohne Zweckkatalog, ohne Rechtsvorbehalt und ohne Vergütung; Art. 47-4 und Art. 47-5 decken
    beiläufige und geringfügige Nutzungen bei der Datenverarbeitung und der Ergebnisausgabe ab. Durchgesetzt
    wird das Gesetz zivilrechtlich über Art. 112 (Unterlassung) und Art. 114 (Schadensvermutungen); Art.
    119 stellt die Verletzung mit bis zu zehn Jahren Freiheitsstrafe unter Strafe, ist aber im Grundsatz
    Antragsdelikt.'
  inkrafttreten:
    datum: 1971-01-01
    verifiziert: true
    quelle: https://laws.e-gov.go.jp/api/2/law_data/345AC0000000048?elm=SupplProvision
    fundstelle_norm: '附則第一条 著作権法 (Gesetz Nr. 48 vom 06.05.1970): 「この法律は、昭和四十六年一月一日から施行する。」 — ''Dieses
      Gesetz tritt am 1. Januar Showa 46 (1971) in Kraft.'''
  themenachsen:
  - urheberrecht
  - gpai
  - haftung
  regelungsschwerpunkte:
  - Art. 2 Abs. 1 Nr. 1 knüpft den Werkbegriff an den Ausdruck von Gedanken oder Gefühlen — derselbe Begriff,
    an dem Art. 30-4 mit dem Merkmal des Genusses (享受) ansetzt. Beide Normen lesen sich nur zusammen.
  - Art. 10 Abs. 2 nimmt Tagesnachrichten und bloße Tatsachenmitteilungen vom Schutz aus. In den Perplexity-Verfahren
    entscheidet sich daran, wie viel von einem Zeitungsartikel überhaupt geschützt ist.
  - Art. 30-4 ist die weitreichendste Trainingsschranke einer großen Rechtsordnung; die einzige Grenze
    ist der Vorbehalt der unangemessenen Interessenbeeinträchtigung.
  - 'Art. 47-5 verlagert den Streit auf die Ausgabeseite: Ob die Antwort eines generativen Dienstes noch
    eine geringfügige Nutzung ist, ist die offene japanische Frage.'
  - Art. 112 Abs. 2 erlaubt die Vernichtung der ausschließlich der Verletzung dienenden Gegenstände. Ob
    ein trainiertes Modell darunter fällt, ist ungeklärt und wäre die schärfste denkbare Rechtsfolge.
