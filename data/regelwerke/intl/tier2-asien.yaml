    verifiziert: true
    quelle: https://sso.agc.gov.sg/SL/S47-2025?DocDate=20250120
    fundstelle_norm: 'Elections (Integrity of Online Advertising) (Amendment) Act 2024 (Commencement)
      Notification 2025, S 47/2025, erlassen am 16.01.2025: das Aenderungsgesetz tritt am 22.01.2025 in
      Kraft.'
  anwendungsdaten:
