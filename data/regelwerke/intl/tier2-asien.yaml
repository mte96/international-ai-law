  originaltitel: 中华人民共和国刑法
  fundstelle: Fassung vom 14.03.1997, zuletzt geändert durch die Zwölfte Strafrechtsänderung vom 29.12.2023
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Gesamtrevision vom 14.03.1997, in Kraft seit 01.10.1997; zwölf Änderungsgesetze, das
    letzte in Kraft seit 01.03.2024. Für KI einschlägig sind vor allem Art. 217 (gewerbsmäßige Urheberrechtsverletzung),
    Art. 253a (Verletzung personenbezogener Informationen), Art. 285 bis 287 (Computerdelikte), Art. 246
    (Beleidigung und Verleumdung) sowie Art. 363 f. (obszöne Erzeugnisse).

    '
  kurzbeschreibung: 'Strafrechtlicher Flankenschutz der chinesischen KI-Regulierung. Die praktische Bedeutung
    hat 2026 sprunghaft zugenommen: Das Volksgericht Huangpu (Shanghai) hat am 08.05.2026 erstmals wegen
    gewerbsmäßiger Vervielfältigung KI-erzeugter Kurzdramen nach Art. 217 verurteilt und dabei den Werkcharakter
    KI-erzeugter Inhalte bejaht. Daneben tragen Art. 253a die Fälle unbefugter Verarbeitung von Trainingsdaten,
    Art. 285 bis 287 den unbefugten Zugriff auf Systeme und die Bereitstellung von Werkzeugen dafür, Art.
    246 Fälle ehrverletzender Deepfakes und Art. 363 f. die Verbreitung synthetischer pornografischer
    Erzeugnisse. Art. 287a und 287b erfassen die Nutzung von Informationsnetzen zur Begehung von Straftaten
    und die Beihilfe dazu — die Vorschriften, über die Betreiber von Deepfake-Diensten belangt werden.

    '
  inkrafttreten:
    datum: 1997-10-01
    verifiziert: true
    quelle: https://www.gjxfj.gov.cn/gjxfj/xxgk/fgwj/flfg/webinfo/2016/03/1460585589827994.htm
    fundstelle_norm: '第四百五十二条 中华人民共和国刑法: 「本法自1997年10月1日起施行。」 — Gesamtrevision, beschlossen am 14.03.1997
      auf der 5. Sitzung des 8. Nationalen Volkskongresses.'
  anwendungsdaten:
  - datum: 2024-03-01
    was_gilt: Zwoelfte Strafrechtsaenderung (Beschluss vom 29.12.2023) in Kraft.
    verifiziert: false
    quelle: Bestandsangabe, in dieser Sitzung nicht gegengeprueft.
  themenachsen:
  - urheberrecht
  - content
  - datenschutz
  - sicherheit-export
  - haftung
  regelungsschwerpunkte:
  - 'Art. 217: gewerbsmäßige Urheberrechtsverletzung — Grundlage der ersten strafrechtlichen Verurteilung
    wegen Vervielfältigung KI-erzeugter Inhalte (Volksgericht Huangpu, 08.05.2026).'
  - 'Art. 253a: Verletzung personenbezogener Informationen — relevant für unbefugt beschaffte Trainingsdaten.'
  - 'Art. 285-287: unbefugter Systemzugriff, Bereitstellung von Eindringwerkzeugen, Datenmanipulation.'
  - 'Art. 287a/287b: Nutzung von Informationsnetzen zu Straftaten und Beihilfe — Zugriffsnorm gegen Betreiber
    von Deepfake-Diensten.'
  - 'Art. 246: Beleidigung und Verleumdung, auch als Privatklagedelikt; Art. 363 f.: obszöne Erzeugnisse.'
  dokumente:
  - datum: 2026-05-08
