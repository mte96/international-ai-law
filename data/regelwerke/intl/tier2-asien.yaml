  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  - sektor-medizin
  regelungsschwerpunkte:
  - Wegfall der Einwilligung bei Weitergabe an Dritte zu Statistik- und KI-Entwicklungszwecken — die weitreichendste
    Trainingsdatenerleichterung einer großen Rechtsordnung.
  - Erhebung besonders schutzbedürftiger Informationen ohne Einwilligung, sofern ausschließlich zur Statistikerstellung
    und mit nachweisbaren Schutzvorkehrungen.
  - Neuer Abschöpfungsbetrag der Datenschutzkommission ab 1.000 Betroffenen, Faktor 1,5 bei Wiederholung
    — Japan verlässt damit das bisherige, nahezu sanktionslose Modell.
  - 'Personen unter 16 Jahren: Einwilligung und Information an den gesetzlichen Vertreter.'
  - 'Biometrische Daten: Anspruch auf Nutzungseinstellung auch ohne Rechtsverstoß, begründet mit der Unabänderlichkeit
    kompromittierter biometrischer Merkmale.'
  dokumente:
  - datum: 2026-06-20
    typ: bericht
    titel: 'Making Sense of Japan''s 2026 APPI Amendment: Easier AI Training Data, a New Surcharge Regime,
      and Children''s Personal Information'
    url: https://timewell.jp/en/columns/personal-information-protection-law-2026-amendment
    sprache: en
    urheber: TIMEWELL Inc. (Kommentar von Hamamoto)
    verifiziert: true
    notiz: Beleg für die Beschlussdaten, die vier Säulen, die KI- und Statistikausnahme, den Abschöpfungsbetrag,
      die Kinderregelung und die Biometrieregelung.
  - datum: 2026-03-01
    typ: bericht
    titel: Proposed Amendments to Japan's Act on the Protection of Personal Information (APPI) (2026)
      — What You Need to Know
    url: https://www.morihamada.com/en/insights/newsletters/138006
    sprache: en
    urheber: Mori Hamada & Matsumoto
    verifiziert: false
    notiz: Kanzleianalyse des Regierungsentwurfs; Abruf in dieser Sitzung durch 403 blockiert.
  bedeutung_eu_anbieter: 'Die Novelle macht Japan zum attraktivsten Standort Asiens für die Beschaffung
    von Trainingsdaten: Weitergabe an Dritte zu KI-Entwicklungszwecken ohne Einwilligung ist in der DSGVO
    undenkbar. Zwei Einschränkungen sind zu beachten. Erstens ändert das nichts an der Rechtslage für
    Daten von Personen in der EU — Art. 3 Abs. 2 DSGVO gilt fort. Zweitens endet mit dem Abschöpfungsbetrag
    die bisherige japanische Sanktionsschwäche; wer sich auf die Duldsamkeit der japanischen Aufsicht
    eingerichtet hat, sollte das ab 2028 überdenken. Der Angemessenheitsbeschluss der Kommission für Japan
    wird die Novelle prüfen müssen.

    '
  offene_punkte:
  - Genaues Datum von Verkündung und Inkrafttreten der Novelle 2026 nicht bestimmt.
  - Auswirkungen auf den Angemessenheitsbeschluss EU–Japan nicht geprüft.
  - Volltext nicht abgerufen; Angaben aus zwei Sekundärquellen, davon eine nur mittelbar.
  monitoring_quellen:
  - https://www.ppc.go.jp/en/
