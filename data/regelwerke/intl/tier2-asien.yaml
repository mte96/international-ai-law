  letzte_pruefung: 2026-09-01
  pruefvermerk:
  - 'Hauptdatum bestaetigt und praezisiert (Teilinkrafttreten bereits am 30.05.2003). FEHLER bei den anwendungsdaten:
    der Bestand fuehrte ein selbst errechnetes Datum ''2028-06-12 — erwartetes Inkrafttreten der Novelle
    2026 (rund zwei Jahre nach Verkuendung)''. Das ist kein amtliches Datum. Amtlich (e-Gov Revisionsverzeichnis):
    die Novelle ist 令和八年法律第五十六号, verkuendet am 17.07.2026, gestaffelt in Kraft am 17.07.2026, 17.01.2027
    und 16.07.2028. Auch die Bestandsangabe zum Verfahren (''Raetehaus 12.06.2026'') passt nicht zur Verkuendung
