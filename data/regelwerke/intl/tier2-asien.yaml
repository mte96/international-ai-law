- id: kr-pipc-genai-leitlinie
  jurisdiktion: kr
  kurztitel: PIPC-Leitlinie zu generativer KI
  offizieller_titel: Leitfaden zur Verarbeitung personenbezogener Informationen bei Entwicklung und Nutzung
    generativer künstlicher Intelligenz
  originaltitel: 생성형 인공지능 개발·활용을 위한 개인정보 처리 안내서
  fundstelle: Veröffentlichung der Kommission zum Schutz personenbezogener Informationen (PIPC) vom 06.08.2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Veröffentlicht am 06.08.2025. Unverbindlich, aber sie fasst die bisherige Vollzugspraxis
    der PIPC zusammen und ist damit der verlässlichste Hinweis darauf, wie die Behörde prüfen wird.

    '
  kurzbeschreibung: 'Gliedert die Verarbeitung entlang von vier Phasen: Zweckfestlegung mit Bestimmung
    der Rechtsgrundlage, Strategiefestlegung mit Entwicklungsmethode und Risikomanagementplan, Training
    und Entwicklung mit Pseudonymisierung, Anonymisierung und Zugriffskontrollen sowie Anwendung und Betrieb
    mit Überwachung der Betroffenenrechte und Veröffentlichung einer Nutzungspolitik. Bemerkenswert ist
    die ausdrückliche Anerkennung, dass öffentlich zugängliche Webdaten auf Grundlage berechtigter Interessen
    genutzt werden dürfen, sofern Erforderlichkeit dargelegt und Schutzmaßnahmen getroffen werden. Die
    Rolle des Datenschutzbeauftragten wird über den gesamten Prozess betont. Ergänzt wird sie durch Empfehlungen
    der PIPC zu Datenschutzerklärungen generativer KI vom 04.03.2026.

    '
  inkrafttreten:
    datum: 2025-08-06
    verifiziert: true
    quelle: https://www.kimchang.com/en/insights/detail.kc?sch_section=4&idx=32699
  anwendungsdaten:
  - datum: 2025-08-06
    was_gilt: Veröffentlichung; unmittelbare Maßgeblichkeit für die Aufsichtspraxis der PIPC.
    verifiziert: true
  themenachsen:
  - datenschutz
  - gpai
  - governance
  regelungsschwerpunkte:
  - 'Vierphasenmodell: Zweck, Strategie, Training, Betrieb.'
  - Öffentlich zugängliche Webdaten dürfen auf Grundlage berechtigter Interessen (Art. 15 PIPA) verarbeitet
    werden — die koreanische Behörde geht damit weiter als die meisten europäischen Aufsichtsbehörden.
  - Unterschiedliche Regeln je nachdem, ob das Training mit dem ursprünglichen Erhebungszweck vereinbar
    ist.
  - Pflicht zur Veröffentlichung einer Nutzungspolitik und zur Sicherstellung der Betroffenenrechte im
    Betrieb.
