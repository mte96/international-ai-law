- id: jp-unlauterer-wettbewerb
  jurisdiktion: jp
  kurztitel: Gesetz gegen unlauteren Wettbewerb
  offizieller_titel: 不正競争防止法 (Fusei Kyōsō Bōshi Hō — Unfair Competition Prevention Act)
  fundstelle: Gesetz Nr. 47 vom 19.05.1993 (平成五年法律第四十七号)
  status: anwendbar
  status_detail: Die Kategorie der beschränkt bereitgestellten Daten (限定提供データ) wurde durch die Novelle
    von 2018 mit Wirkung vom 01.07.2019 eingefügt. Sie ist die japanische Antwort auf den Schutz von Datenbeständen
    unterhalb der Schwelle des Geschäftsgeheimnisses und damit die Norm, die beim Scrapen kommerzieller
    Datensätze eingreift, wo das Urheberrecht wegen Art. 30-4 nicht mehr hilft.
  kurzbeschreibung: 'Das Gesetz zählt in Art. 2 Abs. 1 die unlauteren Wettbewerbshandlungen abschließend
    auf. Für KI sind zwei Gruppen erheblich: die Nummern 1 und 2 schützen verkehrsbekannte und berühmte
    Kennzeichen gegen Verwechslung und Rufausbeutung — der praktisch wichtigste Hebel gegen KI-Doppelgänger
    von Personen und Marken, weil Japan kein Recht am eigenen Bild kodifiziert hat. Die Nummern 11 bis
    16 schützen beschränkt bereitgestellte Daten gegen unlautere Erlangung, Nutzung und Offenlegung. Rechtsfolgen
    sind Unterlassung und Beseitigung nach Art. 3 und Schadensersatz nach Art. 4.'
  inkrafttreten:
    datum: '1994-05-01'
    verifiziert: false
    quelle: https://laws.e-gov.go.jp/law/405AC0000000047
  themenachsen:
  - wettbewerb
  - urheberrecht
  - content
  - haftung
  regelungsschwerpunkte:
  - Art. 2 Abs. 7 definiert beschränkt bereitgestellte Daten als geschäftsmäßig einem bestimmten Personenkreis
    bereitgestellte, in erheblichem Umfang elektromagnetisch verwaltete technische oder geschäftliche
    Informationen. Frei zugängliche Inhalte fallen nicht darunter — die Grenze zwischen Scraping und Vertragsbruch.
  - Art. 2 Abs. 1 Nr. 14 erfasst die vertragswidrige Nutzung rechtmäßig erlangter Daten in Gewinnerzielungs-
    oder Schädigungsabsicht. Das ist der Tatbestand für lizenzierte Trainingsdatensätze.
  - Über die Nummern 1 und 2 läuft in Japan der Persönlichkeitsschutz gegen Stimm- und Gesichtsklone von
    Prominenten, weil das Recht am eigenen Bild nur richterrechtlich anerkannt ist.
