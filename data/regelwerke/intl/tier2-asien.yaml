    was_gilt: Sonderregelungen für digitale Medizinprodukte nach der Durchführungsverordnung.
    verifiziert: false
  - datum: 2027-01-22
    was_gilt: 'Voraussichtliches Ende der vom MSIT angekündigten einjährigen Übergangszeit, in der keine
      Bußgelder verhängt werden. Die Ankündigung ist verwaltungsintern, nicht im Gesetz verankert.

      '
    verifiziert: false
