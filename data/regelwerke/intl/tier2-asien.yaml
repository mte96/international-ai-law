  bedeutung_eu_anbieter: 'Die praktisch wichtigste Lektüre für jeden, der in Japan trainiert oder Ausgaben
    verwertet. Zwei Punkte haben europäische Relevanz über Japan hinaus. Erstens die Abhängigkeitsvermutung:
    Sie ist die schärfste beweisrechtliche Regel zu diesem Thema weltweit und wird in der europäischen
    Diskussion um die Darlegungslast bei Ausgabeähnlichkeit zunehmend zitiert. Zweitens die Behandlung
    der Stil-Feinabstimmung, die genau den Fall trifft, um den in Europa die Verfahren gegen Bildgeneratoren
    geführt werden.

    '
