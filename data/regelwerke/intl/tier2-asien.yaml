    was_gilt: Ende der Konsultationsfrist.
    verifiziert: true
    quelle: https://www.allenandgledhill.com/sg/publication/articles/31741/mas-consults-on-proposed-guidelines-for-artificial-intelligence-risk-management
  themenachsen:
