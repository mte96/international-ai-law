- id: sg-pdpa
  jurisdiktion: sg
  kurztitel: PDPA — singapurisches Datenschutzgesetz
  offizieller_titel: Personal Data Protection Act 2012
  fundstelle: Act 26 of 2012
  verfahrensnummer: Personal Data Protection (Amendment) Act 2020
  status: anwendbar
  status_detail: 'In Kraft seit 2014 (Datenschutzpflichten seit 02.07.2014). Die Novelle 2020 hat mit
    der Ausnahme zur Geschäftsverbesserung (business improvement exception) und der erweiterten Forschungsausnahme
    die Grundlage geschaffen, auf der die KI-Verarbeitung in Singapur heute ruht. Bußgelder erreichen
    seit Oktober 2022 bis zu 10 % des jährlichen Umsatzes in Singapur oder 1 Mio. SGD, je nachdem, welcher
    Betrag höher ist.

    '
  kurzbeschreibung: 'Regelt Erhebung, Nutzung und Weitergabe personenbezogener Daten durch Organisationen.
    Für KI entscheidend sind zwei Ausnahmen vom Einwilligungserfordernis in Anhang 1 Teil 5: die Ausnahme
    zur Geschäftsverbesserung, die die Entwicklung von KI-Systemen zur Verbesserung von Abläufen oder
    zur Personalisierung von Produkten erlaubt, allerdings die Weitergabe auf verbundene Unternehmen beschränkt,
    und die Forschungsausnahme, die auch die Weitergabe an Dritte erlaubt, aber kommerzielle Forschung
    ohne unmittelbare Anwendung voraussetzt. Datenintermediäre — also Auftragsverarbeiter — treffen eigene
    Schutz- und Aufbewahrungspflichten.

    '
  inkrafttreten:
    datum: 2014-07-02
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/PDPA2012
    fundstelle_norm: 'Personal Data Protection Act 2012 (Act 26 of 2012), Kommencierungsvermerk in Singapore
      Statutes Online: ''2 July 2014: Parts III to VII, and the Second to Sixth Schedules'' — die eigentlichen
      Datenschutzpflichten. Das Gesetz selbst ist bereits am 02.01.2013 in Kraft getreten.'
  anwendungsdaten:
  - datum: 2013-01-02
    was_gilt: 'Erste Stufe: Teile I, II, VIII, IX (ohne §§ 36 bis 38, 41 und 43 bis 48) und X.'
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/PDPA2012
  - datum: 2014-01-02
    was_gilt: 'Zweite Stufe: §§ 43 bis 48 und 67 Abs. 1 sowie der Achte Anhang (Do-Not-Call-Register).'
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/PDPA2012
  - datum: 2014-07-02
    was_gilt: 'Dritte Stufe: Teile III bis VII und der Zweite bis Sechste Anhang — die Datenschutzpflichten.
      Erkennbar auch an § 19 (''Personal data collected before 2 July 2014'').'
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/PDPA2012
  - datum: 2021-02-01
    was_gilt: 'Novelle 2020 in Kraft: Ausnahme zur Geschaeftsverbesserung, erweiterte Forschungsausnahme.'
    verifiziert: false
    quelle: Bestandsangabe, in dieser Sitzung nicht gegengeprueft.
  - datum: 2022-10-01
    was_gilt: Erhoehte Bussgeldobergrenze.
    verifiziert: false
    quelle: Bestandsangabe, in dieser Sitzung nicht gegengeprueft.
  themenachsen:
  - datenschutz
  - gpai
  - marktzugang
  regelungsschwerpunkte:
  - Ausnahme zur Geschäftsverbesserung als Rechtsgrundlage für die KI-Entwicklung — Weitergabe nur an
    verbundene Unternehmen.
  - Forschungsausnahme mit Weitergabemöglichkeit an Dritte, aber engerem Zweck.
  - Eigene Pflichten der Datenintermediäre; für KI-Dienstleister praktisch bedeutsam.
  - Bußgeld bis 10 % des Singapur-Umsatzes oder 1 Mio. SGD — deutlich unter dem DSGVO-Niveau, aber über
    dem koreanischen KI-Rahmengesetz.
  dokumente:
  - datum: 2024-03-05
    typ: bericht
    titel: PDPC Advisory Guidelines on the Use of Personal Data in AI Recommendation and Decision Systems
    url: https://www.twobirds.com/en/insights/2024/singapore/pdpc-advisory-guidelines-on-the-use-of-personal-data-in-ai-recommendation-and-decision-systems
    sprache: en
    urheber: Bird & Bird
    verifiziert: true
    notiz: Beleg für die beiden Ausnahmen und ihre unterschiedlichen Weitergaberegeln.
  bedeutung_eu_anbieter: 'Die Ausnahme zur Geschäftsverbesserung ist der wichtigste praktische Unterschied
    zur DSGVO: Sie erlaubt die Nutzung vorhandener Kundendaten zur Entwicklung eigener KI-Systeme ohne
    Einwilligung und ohne Interessenabwägung im europäischen Sinn. Wer eine Konzernstruktur mit singapurischer
    Gesellschaft hat, sollte prüfen, ob Entwicklungsschritte dorthin verlagert werden können — mit der
    Einschränkung, dass Daten von Personen in der EU der DSGVO unterliegen, unabhängig vom Verarbeitungsort.

    '
  offene_punkte:
  - Kein Volltextabruf des Gesetzes; Daten des Inkrafttretens aus allgemeiner Kenntnis.
  monitoring_quellen:
  - https://www.pdpc.gov.sg/
  - https://sso.agc.gov.sg/
