- id: in-trade-marks-act-1999
  jurisdiktion: in
  kurztitel: Trade Marks Act 1999 — gesetzliche Grundlage der passing-off-Klage
  offizieller_titel: The Trade Marks Act, 1999
  fundstelle: Act No. 47 of 1999
  status: anwendbar
  status_detail: In Kraft seit dem 15.09.2003. Aufgenommen, weil s. 27 Abs. 2 die gesetzliche Brücke ist,
    über die das indische Persönlichkeits- und Publizitätsrecht durchgesetzt wird — es gibt in Indien
    kein Gesetz über Persönlichkeitsrechte.
  kurzbeschreibung: 'Das Markengesetz selbst enthält keine Vorschrift über Persönlichkeitsrechte. Entscheidend
    ist s. 27 Abs. 2: Das Gesetz lässt Ansprüche wegen passing off ausdrücklich unberührt. Über diesen
    Vorbehalt setzen die High Courts von Delhi und Bombay das richterrechtliche Persönlichkeits- und Publizitätsrecht
    durch, mit dem sie seit 2023 KI-gestützte Nachahmung von Name, Bildnis, Stimme und Sprechweise untersagen
    — von Anil Kapoor (2023) über Arijit Singh und Asha Bhosle (Stimmklone) bis Alakh Pandey (2026), wo
    erstmals die Grenze zur Meinungsfreiheit gezogen wurde. Ergänzend tragen Art. 21 Verfassung (Privatheit)
    und bei Darbietungen s. 38B Copyright Act.'
  inkrafttreten:
    datum: 2003-09-15
    verifiziert: true
    quelle: https://www.indiacode.nic.in/bitstream/123456789/1993/1/a199947.pdf
    fundstelle_norm: 'Trade Marks Act 1999 (Act 47 of 1999), s. 1(3): ''It shall come into force on such
      date as the Central Government may, by notification in the Official Gazette, appoint''. Fussnote:
      in Kraft am 15.09.2003 durch Bekanntmachung S.O. 1048(E) vom 15.09.2003, Gazette of India, Extraordinary,
      Part II, sec. 3(ii). Ausfertigung (assent) 30.12.1999.'
  themenachsen:
  - grundrechte
  - content
  - urheberrecht
  regelungsschwerpunkte:
  - s. 27 Abs. 2 ist eine bloße Unberührtheitsklausel. Sie schafft kein Recht, sondern erhält den Common-Law-Anspruch
    — deshalb ist der Inhalt des indischen Persönlichkeitsrechts vollständig Richterrecht und von Gericht
    zu Gericht unterschiedlich weit.
  - 'Der Trinity-Test des passing off (goodwill, misrepresentation, damage) passt auf Deepfakes nur mit
    Mühe: Der Schaden liegt nicht in der Verwechslung von Waren, sondern in der Zuschreibung von Äußerungen.
    Die High Courts helfen sich mit einer weiten Auslegung des goodwill.'
  - Die Verfügungen ergehen regelmäßig gegen unbekannte Beklagte (John Doe / Ashok Kumar orders) und werden
    mit Sperranordnungen gegen Plattformen nach Rule 3 IT Rules 2021 kombiniert. Das ist der eigentliche
    Durchsetzungsmechanismus.
  dokumente:
