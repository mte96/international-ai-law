    Ein europäischer Anbieter eines Begleit- oder Rollenspiel-Chatbots kann in China nicht anbieten, ohne
    Altersverifikation, Sorgeberechtigten-Einwilligung, Kinderschutzmodus, Zwei-Stunden-Hinweis und eine
    Eskalationskette zu einem Menschen bei Suizidrisiko vorzuhalten. Die KI-VO enthält dazu nichts; Art.
    5 Abs. 1 lit. a und b greifen nur bei manipulativen oder ausnutzenden Praktiken. Wer den chinesischen
    Standard baut, erfüllt zugleich das kalifornische SB 243 und ist auf eine mögliche europäische Nachregulierung
    vorbereitet.

