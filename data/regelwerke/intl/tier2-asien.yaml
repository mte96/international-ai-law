  regelungsschwerpunkte:
  - Nicht genussgerichtete Nutzung (非享受目的) als Anknüpfungspunkt statt eines Katalogs erlaubter Zwecke
    — konzeptionell anders als Art. 3 und 4 DSM-Richtlinie.
  - 'Kein Rechtsvorbehalt: Anders als Art. 4 Abs. 3 DSM-RL und § 44b Abs. 3 UrhG kann der Rechtsinhaber
    die Nutzung nicht durch Vorbehalt ausschließen.'
  - 'Grenze: unangemessene Beeinträchtigung der Interessen des Rechtsinhabers; nach behördlicher Auslegung
    insbesondere bei Stil-Feinabstimmung, Datenbanken, die dem Genuss dienen, und bei Substitutionswirkung.'
  - 'Ausgabeseite bleibt unberührt: Ähnlichkeit und Abhängigkeit begründen Verletzung; bei Vorhandensein
    des Werks im Trainingskorpus wird Abhängigkeit vermutet.'
  - 'Praktische Folge: Japan ist der bevorzugte Trainingsstandort Asiens — die japanische Diskussion dreht
    sich fast ausschließlich um die Ausgabeseite.'
