  offene_punkte:
  - 'Inkrafttreten nicht belegbar: laws.e-gov.go.jp (API v2, elm=SupplProvision) liefert das amtliche
    附則 des 刑法 (Gesetz Nr. 45 vom 24.04.1907): 「本法施行ノ期日ハ勅令ヲ以テ之ヲ定ム」 — Verweis auf eine kaiserliche Verordnung.
