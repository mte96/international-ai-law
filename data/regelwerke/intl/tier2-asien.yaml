  status: anwendbar
  status_detail: 'Dreistufiges System aus Sicherheitsbewertung, Standardvertrag und Zertifizierung, seit
    dem 22.03.2024 durch die Erleichterungsbestimmungen deutlich entschärft: Unterhalb bestimmter Schwellen
    entfällt jeder Mechanismus. Freihandelszonen dürfen eigene Negativlisten aufstellen; Peking und Shanghai
    haben davon Gebrauch gemacht.

    '
  kurzbeschreibung: 'Grundlage sind Art. 38 bis 43 PIPL und Art. 37 Cybersicherheitsgesetz. Eine behördliche
    Sicherheitsbewertung ist erforderlich bei Betreibern kritischer Informationsinfrastruktur, bei der
    Ausfuhr wichtiger Daten sowie bei personenbezogenen Informationen von mehr als einer Million Personen
    oder sensiblen Informationen von mehr als 10.000 Personen im laufenden Jahr. Zwischen 100.000 und
    einer Million Personen genügt der Standardvertrag oder eine Zertifizierung; unterhalb von 100.000
    Personen entfällt der Mechanismus ganz. Hinzu treten Ausnahmen für die Vertragsdurchführung, grenzüberschreitende
    Personalverwaltung und Notfälle. Die Bewertung ist drei Jahre gültig und dauert in der Praxis mehrere
    Monate.

    '
