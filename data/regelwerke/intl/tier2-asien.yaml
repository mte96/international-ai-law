- id: kr-pipa
  jurisdiktion: kr
  kurztitel: PIPA — koreanisches Datenschutzgesetz
  offizieller_titel: Gesetz zum Schutz personenbezogener Informationen
  originaltitel: 개인정보 보호법
  fundstelle: Gesetz Nr. 10465 vom 29.03.2011; umfassende Änderung durch Gesetz vom 14.03.2023
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 30.09.2011. Die große Novelle vom 14.03.2023 ist seit 15.09.2023 anwendbar
    und hat mit Art. 37-2 ein eigenständiges Recht auf Ablehnung und Erläuterung automatisierter Entscheidungen
    eingeführt; die zugehörige Durchführungsverordnung gilt seit 15.03.2024. Seit 02.10.2025 gilt ein
    verschärftes System inländischer Vertreter für ausländische Verantwortliche. Die Aufsichtsbehörde
    PIPC ist neben dem MSIT die zweite KI-Aufsicht Koreas und in der Praxis die durchsetzungsstärkere.

    '
  kurzbeschreibung: 'Umfassendes Datenschutzgesetz mit extraterritorialer Wirkung. Für KI zentral ist
    Art. 37-2: Betroffene können eine ausschließlich automatisierte Entscheidung, die ihre Rechte oder
    Pflichten erheblich berührt, ablehnen und eine Erläuterung verlangen; der Verantwortliche muss Kriterien
    und Verfahren offenlegen. Daneben stehen die Regeln über pseudonymisierte Daten (Art. 28-2 ff.), die
    eine Verarbeitung zu Statistik-, Forschungs- und Archivierungszwecken ohne Einwilligung erlauben und
    in der KI-Praxis die wichtigste Rechtsgrundlage für Trainingsdaten sind. Bußgelder erreichen bis zu
    3 % des Gesamtumsatzes.

    '
  inkrafttreten:
    datum: 2011-09-30
    verifiziert: true
    quelle: https://www.law.go.kr/DRF/lawSearch.do?OC=test&target=lsHistory&type=XML&query=%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%20%EB%B3%B4%ED%98%B8%EB%B2%95
    fundstelle_norm: 개인정보 보호법, 제정 법률 제10465호, verkuendet 29.03.2011, in Kraft 30.09.2011 (sechs Monate
      nach Verkuendung).
  anwendungsdaten:
  - datum: 2023-09-15
    was_gilt: Grosse Novelle, verkuendet 14.03.2023, in Kraft 15.09.2023 — Art. 37-2 (Recht auf Ablehnung
      und Erlaeuterung automatisierter Entscheidungen).
    verifiziert: true
    quelle: https://www.law.go.kr/DRF/lawSearch.do?OC=test&target=lsHistory&type=XML&query=%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%20%EB%B3%B4%ED%98%B8%EB%B2%95
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - arbeit
  regelungsschwerpunkte:
  - 'Art. 37-2: Ablehnungs- und Erläuterungsrecht bei ausschließlich automatisierten Entscheidungen mit
    erheblicher Wirkung — strukturell wie Art. 22 DSGVO, aber mit ausdrücklichem Anspruch auf Offenlegung
    der Kriterien.'
  - 'Art. 28-2 ff.: Verarbeitung pseudonymisierter Daten ohne Einwilligung zu Statistik-, Forschungs-
    und Archivierungszwecken — die tragende Rechtsgrundlage koreanischer KI-Trainingsdaten.'
  - Bußgelder bis 3 % des Gesamtumsatzes — deutlich schärfer als die 30 Mio. KRW des KI-Rahmengesetzes.
  - 'Doppelaufsicht: PIPC für personenbezogene Daten, MSIT für KI-Systeme; keine gesetzliche Koordinierungsregel.'
  - Inländischer Vertreter seit 02.10.2025 auch dann erforderlich, wenn eine koreanische Tochtergesellschaft
    besteht.
