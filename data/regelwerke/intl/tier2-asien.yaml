- id: sg-online-safety-act-2025
  jurisdiktion: sg
  kurztitel: Online Safety (Relief and Accountability) Act 2025
  offizieller_titel: Online Safety (Relief and Accountability) Act 2025
  fundstelle: Beschluss des Parlaments vom 05.11.2025
  verfahrensnummer: Erste Lesung am 15.10.2025
  status: teilanwendbar
  status_detail: 'Am 05.11.2025 vom Parlament beschlossen. Die Inkraftsetzung erfolgt stufenweise; die
    erste Stufe war für das erste Halbjahr 2026 angekündigt, der Vollbetrieb für Mitte 2026. Ob die Online
    Safety Commission zum Recherchestand vollständig arbeitet, war nicht zu klären. Parallel erweitert
    das Criminal Law (Miscellaneous Amendments) Bill 2025 (erste Lesung 14.10.2025) die Tatbestände zu
    intimen Aufnahmen ausdrücklich auf KI-generiertes Material.

    '
  kurzbeschreibung: 'Errichtet eine Online Safety Commission mit Befugnissen zur Anordnung der Entfernung
    schädlicher Inhalte, zur Sperrung von Konten und zur Unterstützung Betroffener; sie soll Opfern einen
    schnellen, kostengünstigen Rechtsbehelf außerhalb des Zivilprozesses eröffnen. Für KI ist das Gesetz
    vor allem wegen nicht einvernehmlicher intimer Darstellungen und identitätsbezogener Fälschungen bedeutsam.
    Es fügt sich in ein Gefüge älterer Gesetze: Online Criminal Harms Act 2023 mit Anordnungsbefugnissen
    gegen Betrug und Cyberdelikte, POFMA 2019 mit Korrektur- und Sperranordnungen bei Falschaussagen,
    Protection from Harassment Act 2014 mit einem beschleunigten Verfahren, in dem Anordnungen binnen
    48 Stunden ergehen können, sowie die Betrugs- und Ehrschutztatbestände des Penal Code 1871.

    '
  inkrafttreten:
    datum: 2026-06-29
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/OSRAA2025
    fundstelle_norm: 'Online Safety (Relief and Accountability) Act 2025, Kopfvermerk in Singapore Statutes
      Online: ''Date of Commencement: 29 June 2026 — Part 1, Part 2, sections 9, 10, 12, 13, 14, 22(1),
      (2) and (4) [...]''. Zeitgleich nimmt die Online Safety Commission ihre Taetigkeit auf.'
  anwendungsdaten:
  - datum: 2025-11-05
    was_gilt: Beschluss des Parlaments.
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/OSRAA2025/Uncommenced/20251209131813?DocDate=20251208
  - datum: 2026-06-29
    was_gilt: 'Erste Stufe in Kraft: Teil 1, Teil 2 sowie §§ 9, 10, 12, 13, 14, 22 Abs. 1, 2 und 4 u.a.
      — die gesetzlichen Deliktstatbestaende und die Pflichten von Kommunikatoren, Administratoren und
      Plattformen. Zugleich Aufnahme der Taetigkeit der Online Safety Commission. Zunaechst nur fuenf
      der dreizehn Schadenskategorien: intimate image abuse, image-based child abuse, doxxing, online
      harassment, online stalking.'
    verifiziert: true
    quelle: https://www.mlaw.gov.sg/online-safety-commission-and-online-safety-relief-and-accountability-act-2025-to-start-on-29-june-2026/
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - Online Safety Commission als außergerichtliche Anlaufstelle mit Entfernungs- und Kontosperranordnungen.
  - Schwerpunkt bei nicht einvernehmlichen intimen Darstellungen und identitätsbezogenen Fälschungen —
    funktional das Gegenstück zu Art. 5 Abs. 1 lit. ba KI-VO, aber als Abhilfe- statt als Verbotsnorm.
  - Ergänzung durch das Criminal Law (Miscellaneous Amendments) Bill 2025, das intime Aufnahmen ausdrücklich
    auf KI-generiertes Material erstreckt.
  - 'Bestehendes Gefüge: Online Criminal Harms Act 2023, POFMA 2019, Protection from Harassment Act 2014
    mit 48-Stunden-Verfahren, Penal Code 1871.'
  dokumente:
  - datum: 2026-04-01
    typ: bericht
    titel: 'Deepfakes in Singapore: legal recourse, regulatory powers, and building long-term corporate
      resilience'
    url: https://conventuslaw.com/featured-content/deepfakes-in-singapore-legal-recourse-regulatory-powers-and-building-long-term-corporate-resilience/
    sprache: en
    urheber: Withers / Conventus Law
    verifiziert: true
    notiz: Beleg für Lesungen, Beschlussdatum, angekündigte Inkraftsetzung und das Gefüge der übrigen
      Gesetze.
  bedeutung_eu_anbieter: 'Für Plattformen und Diensteanbieter der wichtigste singapurische Text der nächsten
    Jahre: Die Kommission wird Anordnungen unmittelbar an Anbieter richten, auch ausländische. Anders
    als beim DSA gibt es keine abgestufte Verantwortlichkeit nach Größe und keine Haftungsprivilegierung
    nach Kenntnis — die Anordnung ist zu befolgen. Wer Meldeverfahren nach Art. 16 DSA betreibt, sollte
    sie um einen Kanal für behördliche Anordnungen aus Singapur ergänzen.

    '
  offene_punkte:
