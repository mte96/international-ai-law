  regelungsschwerpunkte:
  - Extraterritoriale Anwendung auf Handlungen im Ausland mit Wirkung auf den koreanischen Markt oder
    koreanische Nutzer; Ausnahme nur für Verteidigung und nationale Sicherheit.
  - 'Zwei Risikostufen statt vier: hochwirksame KI und generative KI. Es gibt keine verbotenen Praktiken
    — der schärfste konzeptionelle Unterschied zur KI-VO.'
  - 'Hochwirksame KI: Risikomanagementplan, Erklärungsplan zu Ausgaben, Einflussfaktoren und Trainingsdatenmerkmalen,
    Nutzerschutz, benannte Verantwortliche und Eingriffsverfahren, Dokumentation mit fünfjähriger Aufbewahrung,
    öffentliche Angaben zur Governance mit Schwärzungsmöglichkeit für Geschäftsgeheimnisse.'
  - 'Meldefristen nach den MSIT-Bekanntmachungen: schwerwiegende Vorfälle binnen 7 Tagen, wesentliche
    Änderungen und neue Risiken binnen einem Monat, Jahresberichte.'
  - Rechenschwelle 10^26 FLOP für Sicherheitspflichten — dieselbe Größenordnung wie Art. 51 Abs. 2 KI-VO
    (10^25 FLOP), aber um eine Zehnerpotenz höher angesetzt.
  - 'Kennzeichnung: Vorabhinweis auf KI-Einsatz, Kennzeichnung generativer Ausgaben, deutliche Kennzeichnung
    realistisch wirkender synthetischer Inhalte.'
  - Inländischer Vertreter für ausländische Anbieter ab Jahresumsatz über 1 Billion KRW, KI-Umsatz über
    10 Mrd. KRW oder über 1 Mio. täglichen Nutzern in Korea im Dreimonatsdurchschnitt.
  - 'Aufsicht: MSIT mit Untersuchungs-, Vor-Ort-Prüfungs-, Auskunfts- und Abhilfeanordnungsbefugnis; Bußgeld
    höchstens 30 Mio. KRW (rund 19.000 EUR) für Verstöße gegen Abhilfeanordnungen, Hinweispflichten und
    die Vertreterbenennung.'
  - 'Änderungsgesetz vom 30.12.2025: Verankerung des Präsidialrats für nationale KI-Strategie, erweiterte
    Kennzeichnungspflichten, Haftungsschutz für Amtsträger beim KI-Einsatz, Beschaffungsvorrang, Barrierefreiheit.'
