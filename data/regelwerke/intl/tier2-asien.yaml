- id: sg-model-ai-agentic
  jurisdiktion: sg
  kurztitel: Model AI Governance Framework für agentische KI
  offizieller_titel: Updated Model AI Governance Framework for Agentic AI
  fundstelle: Veröffentlichung der IMDA in Zusammenarbeit mit der PDPC vom 20.05.2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 20.05.2026 veröffentlicht — die dritte große Fortschreibung nach den Fassungen für
    herkömmliche KI (2019/2020) und für generative KI (2024). Freiwillig. Der Fund beruht auf einer Sekundärquelle;
    die Primärveröffentlichung der IMDA wurde nicht abgerufen.

    '
  kurzbeschreibung: 'Erste eigenständige Governance-Systematik für agentische Systeme, also KI, die eigenständig
    plant, schlussfolgert und handelt. Vier Schwerpunkte: eine anwendungsfallbezogene Risikobewertung,
    die Autonomiegrad, Datenzugriff und Umkehrbarkeit der Handlungen berücksichtigt; menschliche Rechenschaft
    mit klaren Rollen über den gesamten Lebenszyklus und wirksamer Aufsicht; technische Sicherungen einschließlich
    einer Prüfung vor dem Einsatz; und Verantwortung der Endnutzer mit Transparenz über die eingesetzten
    Regeln und Rückmeldekanälen. Der Leitsatz lautet, dass die Letztverantwortung für Handlungen agentischer
    Systeme beim Menschen bleibt. Rechtlich verbindlich ist das Rahmenwerk nicht, doch bestehende Gesetze
    — Datenschutz, Verbraucherschutz — greifen bei Schäden ein.

    '
  inkrafttreten:
    datum: 2026-01-22
    verifiziert: true
    quelle: https://www.imda.gov.sg/resources/press-releases-factsheets-and-speeches/press-releases/2026/new-model-ai-governance-framework-for-agentic-ai
    fundstelle_norm: 'Pressemitteilung der IMDA vom 22.01.2026: Vorstellung des Model AI Governance Framework
      for Agentic AI durch Ministerin Josephine Teo beim Weltwirtschaftsforum in Davos — ''the first in
      the world to include a comprehensive guide for enterprises to deploy Agentic AI responsibly''.'
  anwendungsdaten:
  - datum: 2026-01-22
    was_gilt: Erstveroeffentlichung des Rahmenwerks (Launch beim WEF in Davos).
    verifiziert: true
    quelle: https://www.imda.gov.sg/resources/press-releases-factsheets-and-speeches/press-releases/2026/new-model-ai-governance-framework-for-agentic-ai
  - datum: 2026-05-20
    was_gilt: 'Fortschreibung: aktualisierte Fassung mit ueber zehn Fallstudien und neuen best practices;
      eingearbeitet wurden Rueckmeldungen von mehr als 60 Organisationen (u.a. AWS, DBS, Google, Salesforce),
      namentlich zu Mehragentensystemen, Drittanbieter-Agenten und Automatisierungsverzerrung.'
    verifiziert: true
    quelle: https://www.imda.gov.sg/resources/press-releases-factsheets-and-speeches/updated-model-ai-governance-framework-for-agentic-ai
  themenachsen:
  - governance
  - gpai
  - haftung
  - vertrag
  regelungsschwerpunkte:
  - Erste eigenständige Governance-Systematik für agentische KI einer staatlichen Stelle.
  - Risikobewertung nach Autonomiegrad, Datenzugriff und Umkehrbarkeit der Handlungen — die Umkehrbarkeit
    als Kriterium fehlt in der KI-VO vollständig.
  - Letztverantwortung des Menschen als Leitsatz.
  - Verantwortung der Endnutzer als eigene Dimension — relevant für die Vertragsgestaltung zwischen Anbieter
    und geschäftlichem Nutzer.
  dokumente:
  - datum: 2026-05-20
    typ: leitlinie
    titel: Updated Model AI Governance Framework for Agentic AI
    url: https://regulations.ai/regulations/RAI-SG-NA-GOVERNA-2026
    sprache: en
    urheber: Regulations.AI zur Veröffentlichung von IMDA und PDPC
    verifiziert: true
    notiz: Sekundäre Quelle; Beleg für Datum, Herausgeber, vier Schwerpunkte und den unverbindlichen Charakter.
      Primärdokument der IMDA noch zu beschaffen.
  bedeutung_eu_anbieter: 'Der derzeit konkreteste öffentliche Text zur Governance agentischer Systeme.
    Für europäische Anbieter doppelt nützlich: als Muster für die eigene Risikodokumentation, weil die
    KI-VO agentische Systeme nicht eigenständig erfasst, und als Verhandlungsgrundlage gegenüber Kunden,
    die nach einem Maßstab fragen. Das Kriterium der Umkehrbarkeit lässt sich unmittelbar in eine europäische
    Risikobewertung übernehmen.

    '
  offene_punkte:
  - Primärdokument der IMDA nicht abgerufen; Datum und Inhalt beruhen auf einer Sekundärquelle.
  monitoring_quellen:
