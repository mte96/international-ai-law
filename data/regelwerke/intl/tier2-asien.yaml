- id: sg-model-ai-genai
  jurisdiktion: sg
  kurztitel: Model AI Governance Framework für generative KI
  offizieller_titel: Model AI Governance Framework for Generative AI — Fostering a Trusted Ecosystem
  fundstelle: Veröffentlichung der AI Verify Foundation und der IMDA; vorgestellt am 30.05.2024 auf der
    ATxSG, Dokumentfassung vom 19.06.2024
  verfahrensnummer: Entwurf zur öffentlichen Konsultation vom 16.01.2024
  status: softlaw
  status_detail: 'Vorgestellt am 30.05.2024, veröffentlichte Dokumentfassung vom 19.06.2024. Freiwillig.
    Sie ist international eine der meistzitierten Systematiken für generative KI und hat unter anderem
    die Diskussion um Herkunftsnachweise geprägt.

    '
  kurzbeschreibung: 'Neun Dimensionen einer vertrauenswürdigen Ordnung für generative KI: Rechenschaft
    entlang der Wertschöpfungskette; Daten mit Blick auf Trainingsdatenqualität, personenbezogene Daten
    und Urheberrecht; vertrauenswürdige Entwicklung und Bereitstellung mit Sicherheitsprüfungen und Offenlegung;
    Vorfallmeldung; Prüfung und Zertifizierung; Sicherheit gegen neuartige Angriffsarten; Herkunftsnachweis
    von Inhalten einschließlich digitaler Wasserzeichen und kryptografischer Provenienz; Forschung zu
    Sicherheit und Ausrichtung; sowie KI für das Gemeinwohl. Anders als die KI-VO adressiert das Rahmenwerk
    ausdrücklich die Rollenverteilung in der Wertschöpfungskette zwischen Modellentwickler, Anwendungsanbieter
    und Nutzer.

    '
  inkrafttreten:
    datum: 2024-05-30
    verifiziert: true
    quelle: https://aiverifyfoundation.sg/wp-content/uploads/2024/06/Model-AI-Governance-Framework-for-Generative-AI-19-June-2024.pdf
  anwendungsdaten:
  - datum: 2024-01-16
    was_gilt: Entwurf zur öffentlichen Konsultation.
    verifiziert: false
  - datum: 2024-05-30
    was_gilt: Vorstellung der Endfassung; Dokumentdatum 19.06.2024.
    verifiziert: true
  themenachsen:
  - governance
  - gpai
  - content
  - urheberrecht
  - datenschutz
  regelungsschwerpunkte:
  - 'Neun Dimensionen: Rechenschaft, Daten, vertrauenswürdige Entwicklung und Bereitstellung, Vorfallmeldung,
    Prüfung und Zertifizierung, Sicherheit, Herkunftsnachweis, Sicherheits- und Ausrichtungsforschung,
    KI für das Gemeinwohl.'
  - Ausdrückliche Adressierung der Rollenverteilung in der Wertschöpfungskette — der Punkt, an dem die
    KI-VO mit Art. 25 nur rudimentär arbeitet.
  - Herkunftsnachweis als eigene Dimension, mit digitalen Wasserzeichen und kryptografischer Provenienz;
    Grundlage der singapurischen Beteiligung an C2PA.
  - Trainingsdaten und Urheberrecht werden als Governance-Frage behandelt, ohne dass Singapur eine TDM-Schranke
    oder eine Offenlegungspflicht eingeführt hätte.
