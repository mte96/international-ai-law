    verifiziert: true
    quelle: https://www.law.go.kr/DRF/lawSearch.do?OC=test&target=lsHistory&type=HTML&query=%EA%B3%B5%EC%A7%81%EC%84%A0%EA%B1%B0%EB%B2%95&display=20&page=2
