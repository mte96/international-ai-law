  jurisdiktion: sg
  kurztitel: Deepfake-Verbot im Wahlkampf
  offizieller_titel: Elections (Integrity of Online Advertising) (Amendment) Act 2024
  fundstelle: Beschluss des Parlaments vom 15.10.2024
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Am 15.10.2024 beschlossen, in Kraft gesetzt für die Parlamentswahl im Mai 2025. Es ist
    eine der weltweit ersten Vorschriften, die die Verbreitung realistisch wirkender KI-generierter Darstellungen
    von Wahlkandidaten während der Wahlperiode ausnahmslos verbietet.

    '
  kurzbeschreibung: 'Verbietet während der Wahlperiode das Veröffentlichen, Bewerben, Teilen und Weiterverbreiten
    von Online-Wahlwerbung, die einen Kandidaten realistisch, aber unzutreffend darstellt — unabhängig
    davon, ob die Darstellung mit KI oder anderen Mitteln erzeugt wurde. Der Wahlleiter kann Entfernungsanordnungen
    gegen Personen, Plattformen und Internetzugangsanbieter erlassen. Verstöße von natürlichen Personen
    sind mit Geldstrafe bis 1.000 SGD und Freiheitsstrafe bis zwölf Monate bedroht; Plattformen drohen
    Geldstrafen bis 1 Mio. SGD.

    '
  inkrafttreten:
