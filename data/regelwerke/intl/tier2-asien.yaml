- id: jp-urhg-30-4
  jurisdiktion: jp
  kurztitel: Art. 30-4 japanisches Urheberrechtsgesetz
  offizieller_titel: Urheberrechtsgesetz, Artikel 30-4 (Nutzung ohne Genuss der ausgedrückten Gedanken
    oder Gefühle)
  originaltitel: 著作権法 第三十条の四
  fundstelle: Gesetz Nr. 48 vom 06.05.1970; Art. 30-4 eingefügt durch das Änderungsgesetz vom 25.05.2018
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Art. 30-4 gilt seit 01.01.2019 und ist die großzügigste Trainingsschranke einer großen
    Rechtsordnung — sie ist weder auf Forschung beschränkt noch mit einem Rechtsvorbehalt versehen. Die
    Auslegung ist seit 2024 durch die Kulturbehörde konkretisiert; nach einer Sekundärquelle liegt seit
    10.05.2026 eine Aktualisierung mit verschärfter Betrachtung der Ausgabeseite vor.

    '
  kurzbeschreibung: 'Erlaubt die Nutzung eines Werks in beliebiger Weise und in beliebigem Umfang, soweit
    sie nicht darauf gerichtet ist, die im Werk ausgedrückten Gedanken oder Gefühle selbst oder für Dritte
    zu genießen — ausdrücklich genannt ist die Datenanalyse. Damit ist das Training von KI-Modellen grundsätzlich
    zulässig, auch kommerziell, auch durch Dritte, ohne Vergütung und ohne Widerspruchsmöglichkeit. Der
    Vorbehalt am Ende der Vorschrift schließt Nutzungen aus, die die Interessen des Rechtsinhabers unangemessen
    beeinträchtigen. Nach der Auslegung der Kulturbehörde entfällt die Schranke, wenn ein Modell gezielt
    auf den Stil eines bestimmten Urhebers feinabgestimmt wird oder auf einer Datenbank trainiert wird,
    die gerade dem Genuss dient; ebenso, wenn das Training zugleich dem Aufbau eines konkurrierenden Angebots
    dient. Die Ausgabeseite bleibt vom Art. 30-4 unberührt: Wer ein Ergebnis erzeugt, das einem geschützten
    Werk wesentlich ähnlich ist und von ihm abhängt, verletzt.

    '
  inkrafttreten:
    datum: 2019-01-01
    verifiziert: true
    quelle: https://laws.e-gov.go.jp/api/2/law_revisions/345AC0000000048
