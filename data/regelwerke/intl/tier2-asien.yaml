  bedeutung_eu_anbieter: 'Zwei Punkte. Erstens: China schützt KI-erzeugte Inhalte, wenn der Nutzer Ausdrucksentscheidungen
    dokumentiert — das ist das Gegenteil der amerikanischen Linie und weiter als der derzeitige deutsche
    Diskussionsstand. Wer in China Inhalte erzeugt und verwertet, kann Rechte erwerben, muss dafür aber
    Prompt-, Auswahl- und Bearbeitungsschritte belegen können. Zweitens: Für das Training fehlt jede Schranke.
    Ein europäischer Anbieter, der sich in Europa auf Art. 4 DSM-RL und § 44b UrhG stützt, hat in China
    keine vergleichbare Grundlage; Art. 7 der Interimsmaßnahmen verlangt stattdessen positiv rechtmäßige
    Herkunft.

    '
  offene_punkte:
  - Keine höchstrichterliche Klärung zur Zulässigkeit des Trainings; die bisherigen Entscheidungen betreffen
    ausschließlich die Ausgabeseite.
  - Innerchinesischer Wertungsbruch zwischen Schutzbejahung (Peking, Changshu, Huangpu) und Schutzverneinung
    (Suzhou, Yangzhou) ungeklärt.
