    datum: 2026-01-22
    verifiziert: true
    quelle: https://www.cooley.com/news/insight/2026/2026-01-27-south-koreas-ai-basic-act-overview-and-key-takeaways
  anwendungsdaten:
  - datum: 2026-01-22
    was_gilt: 'Vollständige Anwendung des Gesetzes und der Durchführungsverordnung: Transparenz- und Kennzeichnungspflichten,
      Pflichten für hochwirksame KI, Sicherheitspflichten oberhalb 10^26 FLOP, Pflicht zur Benennung eines
      inländischen Vertreters.

      '
