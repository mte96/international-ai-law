- id: kr-strafgesetzbuch
  jurisdiktion: kr
  kurztitel: Koreanisches Strafgesetzbuch
  offizieller_titel: 형법 (Hyeongbeop — Criminal Act)
  fundstelle: Gesetz Nr. 293 vom 18.09.1953
  status: anwendbar
  status_detail: Das Strafgesetzbuch enthält keinen KI-spezifischen Tatbestand. Die Deepfake-Sondernormen
    stehen im Sexualstrafsondergesetz und im Wahlgesetz; das Strafgesetzbuch liefert die allgemeinen Auffangtatbestände.
  kurzbeschreibung: 'Vier Tatbestände sind für KI-Sachverhalte einschlägig: Art. 307 (üble Nachrede, mit
    erhöhter Strafe bei unwahren Behauptungen), Art. 311 (Beleidigung), Art. 314 (Geschäftsstörung durch
    Täuschung oder Gewalt) und Art. 347 (Betrug). Bei Verbreitung über Informationsnetze verdrängt die
    schärfere Sondernorm des Netzwerkgesetzes die üble Nachrede des Art. 307.'
  inkrafttreten:
    datum: 1953-10-03
    verifiziert: true
    quelle: https://www.law.go.kr/DRF/lawSearch.do?OC=test&target=lsHistory&type=XML&query=%ED%98%95%EB%B2%95
    fundstelle_norm: 형법, 제정 법률 제293호, verkuendet 18.09.1953, in Kraft 03.10.1953.
  themenachsen:
  - content
  - haftung
  - grundrechte
  regelungsschwerpunkte:
  - Art. 314 (업무방해) ist in Korea die Norm für automatisierte Massenanfragen und die Manipulation fremder
    Systeme — funktional das Gegenstück zum japanischen Art. 233 Keihō.
  - Art. 347 erfasst Stimmklon- und Videobetrug; einen eigenen Deepfake-Betrugstatbestand kennt Korea
    nicht.
  - Die Wahrheit der Behauptung schließt die Strafbarkeit nach Art. 307 Abs. 1 nicht aus — eine Besonderheit,
    die für Modellausgaben über reale Personen erhebliche Folgen hat.
