    verifiziert: false
    notiz: 'Beleg für die Anwendung des Art. 217 auf KI-erzeugte Inhalte; im Bestand als cn-2026-huangpu-strafurteil
      erfasst. Ortsangabe am 05.09.2026 korrigiert: Das Verfahren wurde vom Volksgericht des Bezirks Huangpu
      der Stadt Guangzhou entschieden, nicht in Shanghai; übereinstimmend berichtet von chinanews.com.cn
      (广州法院宣判全国首例AI短剧侵权刑案, 09.05.2026) und news.cnr.cn (07.05.2026). Die Entscheidung ist unter cn-2026-huangpu-strafurteil
      erfasst.'
