  regelungsschwerpunkte:
  - 'Erste KI-Klausel in einem chinesischen Parlamentsgesetz: Förderung von Grundlagenforschung, Algorithmeninnovation,
    Trainingsinfrastruktur, Ethiknormen und Risikoüberwachung.'
  - Bußgelder bis 2 Mio. RMB (schwer) und 10 Mio. RMB (besonders schwer); bis 1 Mio. RMB für natürliche
    Personen.
  - Sofortige Bußgeldverhängung ohne vorherige Abmahnung möglich; Milderung bei geringfügigen, sofort
    behobenen Verstößen bleibt.
  - Erweiterte extraterritoriale Durchsetzung gegen Akteure im Ausland, die die chinesische Cybersicherheit
    beeinträchtigen.
  - Verschärfte Lieferkettenkontrolle für Netzprodukte und -ausrüstung.
