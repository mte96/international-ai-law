  offene_punkte:
  - 'Inkrafttreten nicht belegbar: laws.e-gov.go.jp (API v2, elm=SupplProvision) liefert das amtliche
    附則 des 民法 (Gesetz Nr. 89 vom 27.04.1896): 「本法施行ノ期日ハ勅令ヲ以テ之ヲ定ム」 — das Gesetz nennt selbst kein Datum,
    sondern verweist auf eine kaiserliche Verordnung (勅令). Diese ist weder in e-Gov noch im Rechtsverzeichnis
    der Nationalen Parlamentsbibliothek (hourei.ndl.go.jp, Eintrag lawId 0000003534) enthalten; die NDL-Seite
    weist nur das Verkuendungsdatum aus. Der Wert ist der allgemein zitierte, aber nicht am amtlichen
    Text gesichert. Die Normenkette ist jetzt dokumentiert.'
- id: jp-strafgesetzbuch
  jurisdiktion: jp
  kurztitel: Japanisches Strafgesetzbuch
  offizieller_titel: 刑法 (Keihō — Penal Code)
  fundstelle: Gesetz Nr. 45 vom 24.04.1907 (明治四十年法律第四十五号)
  status: anwendbar
  status_detail: 'Japan hat bis zum 06.09.2026 keinen eigenen Deepfake-Straftatbestand. Synthetische Inhalte
    werden über die allgemeinen Tatbestände erfasst: obszöne Darstellungen über Art. 175, rufschädigende
    über Art. 230 und 231, geschäftsschädigende über Art. 233 und 234. Die Beleidigung nach Art. 231 wurde
    2022 auf Freiheitsstrafe hochgestuft. Das Sondergesetz gegen heimliche sexuelle Aufnahmen von 2023
    setzt eine reale Aufnahmehandlung voraus und erfasst rein generierte Bilder nicht.'
  kurzbeschreibung: Für KI-erzeugte Inhalte sind fünf Tatbestände einschlägig. Art. 175 stellt die Verbreitung
    obszöner Aufzeichnungen unter Strafe und schützt die öffentliche Sittlichkeit, nicht die abgebildete
    Person — weshalb Betroffene eines sexuellen Deepfakes in Japan keine Verletzten im Sinne dieser Norm
    sind. Art. 230 erfasst die üble Nachrede unabhängig von der Wahrheit der Behauptung, Art. 231 die
    Beleidigung. Art. 233 erfasst Kreditschädigung und Geschäftsstörung durch falsche Gerüchte oder List
    und ist das strafrechtliche Gegenstück zum Halluzinationsstreit; Art. 234 die Geschäftsstörung durch
    Gewalt oder Drohung, in der Praxis auch bei automatisierten Massenanfragen angewandt.
  inkrafttreten:
    datum: '1908-10-01'
    verifiziert: false
    quelle: https://laws.e-gov.go.jp/law/140AC0000000045
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - Kein Deepfake-Tatbestand. Der Vergleich mit Art. 14-2 des koreanischen Sexualstrafsondergesetzes —
    bis zu sieben Jahre, Besitz und Ansehen strafbar — zeigt die Lücke am deutlichsten.
  - Art. 175 schützt die öffentliche Sittlichkeit. Die abgebildete Person ist nicht Verletzte und kann
    den Strafantrag nicht steuern.
  - Art. 233 ist die einzige Norm, unter die eine falsche Tatsachenbehauptung eines KI-Dienstes über ein
    Unternehmen strafrechtlich fällt.
