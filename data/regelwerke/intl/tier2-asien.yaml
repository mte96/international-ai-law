  - jp-appi
  letzte_pruefung: '2026-09-06'
  offene_punkte:
  - 'Inkrafttreten nicht belegbar: laws.e-gov.go.jp (API v2, elm=SupplProvision) liefert das amtliche
    附則第一条 des 不正競争防止法 (Gesetz Nr. 47 vom 19.05.1993): 「この法律は、公布の日から起算して一年を超えない範囲内において政令で定める日から施行する。」 —
    das Gesetz delegiert an eine Rechtsverordnung (政令) binnen eines Jahres. Diese Verordnung war weder
    ueber e-Gov noch ueber meti.go.jp (Aenderungsarchiv, 403 bzw. leere Antwort) noch ueber hourei.ndl.go.jp
    (Eintrag lawId 0000079211 zeigt nur das Verkuendungsdatum) auffindbar. TEILERFOLG: das fuer KI einschlaegige
    Datum — Inkrafttreten der Kategorie der beschraenkt bereitgestellten Daten (限定提供データ) am 01.07.2019
    durch 平成三十年法律第三十三号 (verkuendet 30.05.2018) — ist am amtlichen Revisionsverzeichnis belegt (https://laws.e-gov.go.jp/api/2/law_revisions/405AC0000000047);
    dieselbe Novelle trat im Uebrigen bereits am 29.11.2018 in Kraft.'
- id: jp-zivilgesetzbuch
  jurisdiktion: jp
  kurztitel: Japanisches Zivilgesetzbuch
  offizieller_titel: 民法 (Minpō — Civil Code)
  fundstelle: Gesetz Nr. 89 vom 27.04.1896 (明治二十九年法律第八十九号), Schuldrechtsreform 2017 in Kraft seit 01.04.2020
  status: anwendbar
  status_detail: Japan hat kein KI-Haftungsgesetz und kein Produkthaftungsregime für Software. Das Produkthaftungsgesetz
    (製造物責任法) erfasst nur bewegliche Sachen; reine Software fällt nicht darunter. Damit läuft die gesamte
    japanische KI-Haftung über die deliktische Generalklausel des Art. 709 mit voller Beweislast des Geschädigten
    — der schärfste Gegensatz zur europäischen Produkthaftungsrichtlinie 2024/2853.
  kurzbeschreibung: Für den KI-Einsatz sind drei Normen maßgeblich. Art. 709 begründet die deliktische
    Haftung bei vorsätzlicher oder fahrlässiger Verletzung eines Rechts oder eines rechtlich geschützten
    Interesses; der Geschädigte trägt die Beweislast für Pflichtverletzung, Schaden und Kausalität. Art.
    710 erstreckt den Ersatz auf immaterielle Schäden und trägt die Geldentschädigung bei Deepfakes und
    rufschädigenden Modellausgaben. Art. 715 regelt die Haftung des Geschäftsherrn für Verrichtungsgehilfen
    und ist die Norm, an der die Zurechnung autonom handelnder Systeme diskutiert wird.
  inkrafttreten:
    datum: '1898-07-16'
    verifiziert: false
    quelle: https://laws.e-gov.go.jp/law/129AC0000000089
  themenachsen:
  - haftung
  - grundrechte
  - content
  regelungsschwerpunkte:
  - Art. 709 ist der einzige Haftungstatbestand, der in Japan bei KI-Schäden regelmäßig greift. Es gibt
    keine Beweislastumkehr und keine Offenlegungspflicht wie in Art. 3 der aufgehobenen KI-Haftungsrichtlinie
    oder in Art. 9 der Produkthaftungsrichtlinie 2024/2853.
  - Das japanische Produkthaftungsgesetz erfasst nur bewegliche Sachen. Ein reines Softwaremodell ist
    kein Produkt — die europäische Erstreckung auf Software hat in Japan keine Entsprechung.
  - Art. 710 trägt die Geldentschädigung wegen Persönlichkeitsverletzung; das Recht am eigenen Bild ist
    in Japan nicht kodifiziert, sondern vom Obersten Gerichtshof aus Art. 13 der Verfassung entwickelt
    worden.
