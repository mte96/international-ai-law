  verfahrensnummer: Öffentliche Konsultation Januar/Februar 2024 mit rund 25.000 Stellungnahmen
  status: softlaw
  status_detail: 'Kein Rechtsakt, sondern die maßgebliche Auslegungshilfe. Sie ist in Japan faktisch bestimmend,
    weil die Gerichte bislang nur wenige KI-Urheberrechtsfälle entschieden haben. Ergänzt durch eine Prüfliste
    für Nutzer vom 31.07.2024. Eine Aktualisierung vom 10.05.2026 ist nur mittelbar belegt.

    '
  kurzbeschreibung: 'Strukturiert die urheberrechtliche Prüfung in drei Abschnitte: Trainingsphase (Art.
    30-4), Erzeugungs- und Nutzungsphase (Ähnlichkeit und Abhängigkeit) und Schutzfähigkeit von KI-Ausgaben
    (menschlicher schöpferischer Beitrag). Für die Trainingsphase benennt sie die Fallgruppen, in denen
    die Schranke entfällt: Feinabstimmung auf den Stil eines bestimmten Urhebers, Training auf Datenbanken,
    die selbst dem Genuss dienen, sowie Nutzungen mit Substitutionswirkung. Für die Erzeugungsphase stellt
    sie klar, dass die Abhängigkeit vermutet wird, wenn das Werk im Trainingskorpus enthalten war; der
    Entwickler trägt dann die Darlegungslast. Für die Schutzfähigkeit verlangt sie einen schöpferischen
    menschlichen Beitrag, wobei die bloße Eingabe eines Prompts regelmäßig nicht genügt.

    '
  inkrafttreten:
