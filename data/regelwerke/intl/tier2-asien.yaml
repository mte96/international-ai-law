- id: cn-pipl
  jurisdiktion: cn
  kurztitel: PIPL — Persönlichkeitsdatenschutzgesetz
  offizieller_titel: Gesetz der Volksrepublik China zum Schutz personenbezogener Informationen
  originaltitel: 中华人民共和国个人信息保护法
  fundstelle: Beschlossen vom Ständigen Ausschuss des Nationalen Volkskongresses am 20.08.2021
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.11.2021, 74 Artikel. Es ist das chinesische Gegenstück zur DSGVO und
    die schärfste Sanktionsnorm des chinesischen KI-Rechts: bis 50 Mio. RMB oder 5 % des Umsatzes des
    Vorjahres. Seit 01.05.2025 gelten die Maßnahmen zur Compliance-Prüfung, seit 01.01.2025 die Netzdaten-Verordnung
    als Durchführungsrecht.

    '
  kurzbeschreibung: 'Regelt die Verarbeitung personenbezogener Informationen einschließlich der Verarbeitung
    im Ausland, soweit sie darauf gerichtet ist, natürlichen Personen in China Waren oder Dienstleistungen
    anzubieten oder deren Verhalten zu analysieren (Art. 3). Zentrale KI-Norm ist Art. 24: Automatisierte
    Entscheidungen müssen transparent, im Ergebnis fair und gerechtfertigt sein; unangemessene Ungleichbehandlung
    bei Transaktionspreisen ist verboten; bei Direktwerbung ist eine Option ohne persönliche Merkmale
    oder eine bequeme Ablehnungsmöglichkeit anzubieten; bei erheblicher Betroffenheit besteht ein Anspruch
    auf Erläuterung und ein Recht, die ausschließlich automatisierte Entscheidung abzulehnen. Art. 26
    begrenzt Bild- und Identifikationstechnik im öffentlichen Raum auf Zwecke der öffentlichen Sicherheit.
    Die Art. 38 bis 43 regeln den Datenexport, Art. 66 die Sanktionen.

    '
  inkrafttreten:
    datum: 2021-11-01
    verifiziert: true
    quelle: https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
    fundstelle_norm: '第七十四条 中华人民共和国个人信息保护法: 「本法自2021年11月1日起施行。」 — beschlossen am 20.08.2021 auf der 30.
      Sitzung des Staendigen Ausschusses des 13. Nationalen Volkskongresses.'
  anwendungsdaten:
  - datum: 2021-11-01
    was_gilt: Vollständige Anwendung einschließlich der extraterritorialen Erstreckung nach Art. 3.
    verifiziert: false
  - datum: 2025-05-01
    was_gilt: Maßnahmen zur Verwaltung von Compliance-Prüfungen zum Schutz personenbezogener Informationen
      (个人信息保护合规审计管理办法) in Kraft — regelmäßige Selbstprüfungspflicht ab 10 Mio. betroffenen Personen.
    verifiziert: false
    quelle: https://www.mayerbrown.com/en/insights/publications/2025/04/china-finalises-the-measures-for-personal-information-protection-compliance-audits
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 'Art. 3: extraterritoriale Anwendung bei Angebot an Personen in China oder Verhaltensanalyse; Art.
    53 verlangt eine Vertretung oder Niederlassung in China.'
  - 'Art. 24: automatisierte Entscheidungen — Transparenz, Ergebnisfairness, Verbot unangemessener Preisdifferenzierung,
    Werbung ohne Personalisierung, Erläuterungsanspruch und Ablehnungsrecht bei erheblicher Betroffenheit.
    Weiter als Art. 22 DSGVO, weil das Ablehnungsrecht nicht an eine rechtliche Wirkung gebunden ist.'
  - 'Art. 26: Bild- und Identifikationstechnik im öffentlichen Raum nur zur öffentlichen Sicherheit; konkretisiert
    durch die Gesichtserkennungsmaßnahmen von 2025.'
  - 'Art. 38-43: Datenexport über Sicherheitsbewertung, Zertifizierung oder Standardvertrag; Art. 41:
    kein Zugriff ausländischer Behörden ohne Genehmigung.'
  - 'Art. 66: bis 50 Mio. RMB oder 5 % des Vorjahresumsatzes; daneben Geschäftsverbot und persönliche
    Haftung Verantwortlicher bis 1 Mio. RMB.'
  - 'Verhältnis zur KI-Regulierung: Art. 9 der Interimsmaßnahmen macht den KI-Anbieter zum Verantwortlichen
    für erzeugte Inhalte.'
