  offizieller_titel: Maßnahmen zur Ethikprüfung wissenschaftlich-technischer Tätigkeiten (Versuchsweise)
  originaltitel: 科技伦理审查办法（试行）
  fundstelle: 国科发监〔2023〕167号
  verfahrensnummer: Konsultationsentwurf vom 04.04.2023, Frist bis 03.05.2023
  status: anwendbar
  status_detail: 'Erlassen vom Ministerium für Wissenschaft und Technik gemeinsam mit neun weiteren Behörden,
    veröffentlicht am 07.09.2023, in Kraft seit 01.12.2023. Ausdrücklich "versuchsweise" (试行). Die begleitende
    Liste prüfungspflichtiger Tätigkeiten wird fortlaufend angepasst.

    '
  kurzbeschreibung: 'Verpflichtet Hochschulen, Forschungseinrichtungen, Krankenhäuser und Unternehmen,
    die ethisch sensible Forschung betreiben, zur Einrichtung eines eigenen Ethikausschusses, zu dessen
    Registrierung binnen 30 Tagen auf der nationalen Plattform und zum Jahresbericht bis zum 31. März.
    Für Tätigkeiten auf der "Liste der wissenschaftlich-technischen Tätigkeiten, die einer Expertennachprüfung
    bedürfen" ist zusätzlich eine überörtliche Nachprüfung erforderlich. Die Liste nennt drei KI-Positionen:
    Entwicklung von Algorithmenmodellen, Anwendungen und Systemen mit der Fähigkeit, die öffentliche Meinung
    zu mobilisieren und das gesellschaftliche Bewusstsein zu lenken; invasive Gehirn-Computer-Schnittstellen
    in der klinischen Forschung; sowie hochautonome Entscheidungssysteme in Szenarien mit Gefahr für Sicherheit
    und Gesundheit.

    '
