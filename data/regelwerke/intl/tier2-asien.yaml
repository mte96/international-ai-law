  themenachsen:
  - content
  - grundrechte
  regelungsschwerpunkte:
  - Der Tatbestand knüpft an das Bearbeiten und Zusammensetzen an und setzt keine reale Aufnahme voraus.
    Rein generierte Darstellungen sind erfasst — der entscheidende Unterschied zum japanischen Recht.
  - Die Strafbarkeit des bloßen Ansehens (Abs. 4) ist international ohne Vorbild und wird auch in Korea
    als verfassungsrechtlich heikel diskutiert.
  - Die Einwilligung in die Herstellung schließt die Strafbarkeit der Verbreitung nicht aus (Abs. 2) —
    die Norm trennt beide Handlungen.
