  bedeutung_eu_anbieter: 'Für Anbieter, die koreanische Finanzinstitute beliefern, ist das der Maßstab,
    den der Kunde in den Vertrag schreiben wird — unabhängig davon, dass die Leitlinie formal unverbindlich
    ist. Der Subsidiaritätsgrundsatz schließt vollautomatisierte Kreditentscheidungen praktisch aus; wer
    ein solches Produkt in Europa anbietet, muss es für Korea umbauen. Die Sicherheitsanforderungen decken
    sich weitgehend mit dem, was DORA und die EBA-Leitlinien ohnehin verlangen.

    '
