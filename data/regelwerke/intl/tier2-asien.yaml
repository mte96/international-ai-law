  bedeutung_eu_anbieter: 'Wer eine Plattform mit Ranking, Feed oder Preisgestaltung betreibt, fällt hierunter,
    ohne je "KI" zu sagen. Der praktische Kern ist das Filing: Es ist der Schlüssel, den alle späteren
    KI-Vorschriften voraussetzen. Für einen europäischen Anbieter, der über einen lokalen Partner ausspielt,
    verschiebt sich die Pflicht nicht — sie trifft den, der den Dienst der Öffentlichkeit anbietet.

    '
