  status_detail: 'Geltendes Recht. Die Frage der KI-Erfinderschaft ist durch die DABUS-Kette abschließend
    geklärt: Bezirksgericht Tokio am 16.05.2024, Obergericht für geistiges Eigentum am 30.01.2025, und
    2026 auch durch den Obersten Gerichtshof. Der Immaterialgüterstrategieplan 2025 lehnt eine gesetzliche
    Anerkennung der KI-Erfinderschaft nicht grundsätzlich ab, verweist die Frage aber in den Patentsystemunterausschuss.

    '
  kurzbeschreibung: 'Der Erfinderbegriff des Art. 29 Abs. 1 setzt eine natürliche Person voraus; Art.
    36 Abs. 1 Nr. 2 verlangt die Angabe des Namens des Erfinders, was nach der Rechtsprechung nur bei
    natürlichen Personen möglich ist. Gestützt wird das durch Art. 35 Abs. 1 (Diensterfindung) und durch
    das Grundgesetz über geistiges Eigentum, das die Erfindung als Ergebnis schöpferischer menschlicher
    Tätigkeit begreift. Für die Praxis wichtiger als die Erfinderfrage ist die Prüfungspraxis des japanischen
    Patentamts zu KI-bezogenen Erfindungen: Sie verlangt für die Offenbarung einer maschinell gelernten
    Lösung regelmäßig, dass die Korrelation zwischen Eingangs- und Ausgangsdaten technisch plausibel dargelegt
    oder durch Ausführungsbeispiele belegt wird.

    '
