  originaltitel: AI事業者ガイドライン
  fundstelle: Gemeinsame Veröffentlichung des Ministeriums für Wirtschaft, Handel und Industrie (METI)
    und des Ministeriums für Inneres und Kommunikation (MIC)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Fassung 1.0 vom 19.04.2024, Fassung 1.01 vom 28.03.2025. Sie fassen die früheren Papiere
    zusammen — die KI-Nutzungsleitlinien des MIC (2019), die KI-Governance-Leitlinien des METI (2022)
    und die Sozialgrundsätze für menschenzentrierte KI (2019). Sie sind unverbindlich und werden vom KI-Förderungsgesetz
    vorausgesetzt, nicht ersetzt.

    '
  kurzbeschreibung: 'Dreistufiger Aufbau: gemeinsame Werte (Menschenwürde, Vielfalt und Inklusion, Nachhaltigkeit),
    zehn übergreifende Grundsätze — darunter Menschenzentrierung, Sicherheit, Fairness, Privatsphärenschutz,
    Transparenz, Rechenschaft und Innovation — und ein praktischer Teil mit Prüflisten und Anwendungsbeispielen,
    getrennt nach Entwicklern, Anbietern und geschäftlichen Nutzern. Kennzeichnend ist die Zuweisung der
    Governance-Verantwortung an die Unternehmensleitung: KI-Governance wird wie Cybersicherheit als Leitungsaufgabe
    behandelt und nicht als technische Einzelfunktion. Der Ansatz heißt "agile Governance" — laufende
    Anpassung statt einmaliger Konformitätsprüfung.

    '
