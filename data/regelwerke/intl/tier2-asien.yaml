  status_detail: 'Zwei Leitlinien vom 30.06.2025, aufbauend auf dem "Leitfaden zum Urheberrecht bei generativer
    KI" vom 27.12.2023. Die Trainingsphase ist ausdrücklich ausgespart und weiter Gegenstand der Beratungen
    eines Fachgremiums; hierzu ist nach Sekundärquellen am 18.05.2026 eine gesonderte Leitlinie zur fairen
    Nutzung ergangen.

    '
  kurzbeschreibung: 'Legen fest, wann ein unter Einsatz generativer KI entstandenes Werk registrierbar
    ist. Maßstab ist ein nachweisbarer menschlicher schöpferischer Beitrag: Ausgaben ohne menschliche
    schöpferische Einwirkung sind nicht registrierbar; registrierbar sind Inhalte, die durch schöpferische
    Eingaben geprägt sind, vom Menschen bearbeitet wurden oder in denen KI-Ausgaben schöpferisch ausgewählt
    und angeordnet werden. Die zweite Leitlinie behandelt die Vermeidung von Streitigkeiten in der Ausgabephase:
    Prüfpflichten vor kommerzieller Nutzung, Dokumentation des Entstehungsprozesses und Umgang mit Ähnlichkeiten
    zu vorbestehenden Werken.

    '
