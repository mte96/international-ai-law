- id: kr-ai-framework-act
  jurisdiktion: kr
  kurztitel: KI-Rahmengesetz (AI Basic Act)
  offizieller_titel: Rahmengesetz über die Entwicklung der künstlichen Intelligenz und die Schaffung einer
    Vertrauensgrundlage
  originaltitel: 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법
  fundstelle: Gesetz Nr. 20676, verkündet am 21.01.2025
  verfahrensnummer: Beschluss des Plenums der Nationalversammlung vom 26.12.2024; Änderungsgesetz beschlossen
    am 30.12.2025
  status: anwendbar
  status_detail: 'In Kraft seit 22.01.2026 — nach der KI-VO das zweite horizontale KI-Gesetz der Welt
    und das erste, das vollständig anwendbar ist. Die Durchführungsverordnung (Präsidialverordnung Nr.
    36053) wurde am 21.01.2026 erlassen und trat zeitgleich in Kraft. Das MSIT hat eine einjährige Übergangszeit
    angekündigt, in der keine Bußgelder verhängt, sondern beraten und zertifiziert wird; sie endet nach
    den Ankündigungen im Januar 2027. Vor Inkrafttreten wurde das Gesetz bereits einmal geändert (Beschluss
    vom 30.12.2025). Seit Juli 2026 liegen zwei weitere Änderungsanträge vor.

    '
  kurzbeschreibung: 'Horizontales Rahmengesetz mit Förder- und Pflichtenteil. Es gilt auch für Handlungen
    im Ausland, soweit sie den koreanischen Markt oder koreanische Nutzer betreffen (extraterritoriale
    Klausel); ausgenommen ist KI ausschließlich für Verteidigung und nationale Sicherheit. Es unterscheidet
    zwei Stufen: hochwirksame KI (고영향 인공지능) in den Bereichen Gesundheit, Energie, Kernkraft, Biometrie,
    hoheitliche Entscheidungen, Personalauswahl, Verkehr und Bildung sowie generative KI. Für hochwirksame
    KI gelten Risikomanagement, Erklärbarkeit, Nutzerschutz, menschliche Aufsicht, Dokumentation mit fünfjähriger
    Aufbewahrung und Folgenabschätzungen. Generative KI muss vorab als solche ausgewiesen und ihre Ausgaben
    gekennzeichnet werden; bei realistisch wirkenden synthetischen Inhalten ist eine deutliche Kennzeichnung
    erforderlich. Modelle oberhalb einer Rechenschwelle von 10^26 FLOP unterliegen einer lebenszyklusbezogenen
    Sicherheitspflicht mit Berichtspflicht gegenüber dem MSIT. Ausländische Anbieter oberhalb bestimmter
    Umsatz- oder Nutzerschwellen müssen einen inländischen Vertreter benennen. Bußgelder betragen höchstens
    30 Mio. KRW.

    '
