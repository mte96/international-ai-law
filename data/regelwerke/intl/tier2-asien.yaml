  bedeutung_eu_anbieter: 'Für die Compliance im engeren Sinn folgt aus diesem Gesetz nichts — es gibt
    nichts zu erfüllen. Für die Marktbeurteilung folgt viel: Japan hat sich bewusst gegen ein Pflichtenmodell
    entschieden und steuert über Basisplan, Leitlinien und bestehendes Sektorrecht. Ein europäisches Unternehmen,
    das seine KI-VO-Dokumentation mitbringt, ist in Japan mehr als ausreichend aufgestellt; der Wettbewerbsnachteil
    liegt umgekehrt bei europäischen Anbietern, die gegen japanische Wettbewerber ohne vergleichbare Lasten
    antreten. Beobachtungsbedürftig ist, ob der Basisplan die Einführung verbindlicher Regeln vorbereitet
    — er sagt bislang nur, dass die Notwendigkeit fortlaufend geprüft werde.

    '
