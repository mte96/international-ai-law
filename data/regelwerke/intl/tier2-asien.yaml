  bedeutung_eu_anbieter: 'Der Unterschied, den europäische Anbieter am meisten unterschätzen: In China
    ist die Rechtsdurchsetzung bei KI-Inhalten nicht nur verwaltungs- und zivilrechtlich, sondern strafrechtlich.
    Wer einen Dienst betreibt, über den Dritte in großem Umfang fremde Werke vervielfältigen oder Deepfakes
    verbreiten, kann über Art. 287b als Gehilfe erfasst werden. In Deutschland liefe dasselbe über § 106
    UrhG und die Haftungsprivilegierung des DSA — mit deutlich geringerer Praxisrelevanz.

    '
  offene_punkte:
  - Kein Volltextabruf; Artikelzuordnung beruht auf der erfassten Rechtsprechung und allgemeiner Kenntnis.
  - Ob Art. 217 auch bei rein KI-erzeugten Inhalten ohne dokumentierte Nutzerbeiträge greift, ist nach
    dem Huangpu-Urteil offen.
