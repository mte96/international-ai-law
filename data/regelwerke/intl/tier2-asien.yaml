- id: sg-model-ai-governance
  jurisdiktion: sg
  kurztitel: Model AI Governance Framework
  offizieller_titel: Model Artificial Intelligence Governance Framework
  fundstelle: Veröffentlichung der Personal Data Protection Commission (PDPC) und der Infocomm Media Development
    Authority (IMDA); erste Fassung vorgestellt am Weltwirtschaftsforum Davos
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Erste Fassung vom 23.01.2019, zweite Fassung vom 21.01.2020. Kein Rechtsakt und ausdrücklich
    freiwillig. Singapur hat bis heute kein bindendes KI-Gesetz und keinen entsprechenden Gesetzentwurf;
    die Steuerung erfolgt über dieses Rahmenwerk, seine Fortschreibungen, die Testinfrastruktur AI Verify
    und sektorales Aufsichtsrecht.

    '
  kurzbeschreibung: 'Übersetzt allgemeine KI-Grundsätze in betriebliche Praxis. Es ruht auf zwei Leitgedanken:
    Entscheidungen unter Einsatz von KI sollen erklärbar, transparent und fair sein, und KI-Lösungen sollen
    menschenzentriert bleiben. Vier Handlungsfelder werden entfaltet: interne Governance-Strukturen und
    -maßnahmen, Bestimmung des Grades menschlicher Beteiligung an KI-gestützten Entscheidungen anhand
    einer Matrix aus Schadenswahrscheinlichkeit und Schadensschwere, Betriebsmanagement einschließlich
    Datenqualität und Modellprüfung sowie Interaktion und Kommunikation mit Stakeholdern. Ergänzt wird
    es durch den Implementation and Self-Assessment Guide for Organisations (ISAGO) und eine Sammlung
    von Anwendungsbeispielen.

    '
  inkrafttreten:
    datum: 2019-01-23
    verifiziert: true
    quelle: https://www.aigovernancecore.com/ai-regulation-tracker/singapore-model-ai-governance
  anwendungsdaten:
  - datum: 2019-01-23
    was_gilt: Erste Fassung.
    verifiziert: true
  - datum: 2020-01-21
    was_gilt: Zweite Fassung mit erweiterten Beispielen und ISAGO.
    verifiziert: false
  themenachsen:
  - governance
  - grundrechte
  - marktzugang
  regelungsschwerpunkte:
  - Freiwillig, ohne Sanktion und ohne Registrierungspflicht — das Gegenmodell zu China und zur EU.
  - Matrix aus Schadenswahrscheinlichkeit und Schadensschwere zur Bestimmung des Grades menschlicher Beteiligung
    (human-in-the-loop, human-over-the-loop, human-out-of-the-loop) — praktisch brauchbarer als Art. 14
    KI-VO, weil sie eine Entscheidungsregel liefert.
  - 'Vier Handlungsfelder: interne Governance, menschliche Beteiligung, Betriebsmanagement, Stakeholder-Kommunikation.'
  - ISAGO als Selbstbewertungsinstrument.
  dokumente:
  - datum: 2026-02-01
    typ: uebersicht
    titel: Model AI Governance Framework (incl. Generative AI) — Status, Dates & Requirements
    url: https://www.aigovernancecore.com/ai-regulation-tracker/singapore-model-ai-governance
    sprache: en
    urheber: AI Governance Core
    verifiziert: true
    notiz: Beleg für die Erstfassung vom 23.01.2019 und die Fassung für generative KI vom 30.05.2024;
      die zweite Fassung von 2020 ist dort nicht datiert.
  bedeutung_eu_anbieter: 'Das Rahmenwerk erzeugt keine Pflichten, ist aber der Maßstab, an dem singapurische
    Kunden und Behörden Anbieter messen — insbesondere im öffentlichen Beschaffungswesen. Wer die KI-VO
    erfüllt, erfüllt es ohne Zusatzaufwand. Interessant ist die Beteiligungsmatrix als Argumentationshilfe
    für die Ausgestaltung menschlicher Aufsicht nach Art. 14 KI-VO, die selbst keine Zuordnungsregel enthält.

    '
  offene_punkte:
  - Datum der zweiten Fassung (21.01.2020) nur aus allgemeiner Kenntnis; nicht am Dokument geprüft.
  monitoring_quellen:
  - https://www.pdpc.gov.sg/
  - https://aiverifyfoundation.sg/
