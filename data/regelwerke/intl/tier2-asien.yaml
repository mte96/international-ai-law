- id: cn-dsg
  jurisdiktion: cn
  kurztitel: Datensicherheitsgesetz
  offizieller_titel: Datensicherheitsgesetz der Volksrepublik China
  originaltitel: 中华人民共和国数据安全法
  fundstelle: Beschlossen vom Ständigen Ausschuss des Nationalen Volkskongresses am 10.06.2021
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.09.2021. Es ordnet Daten nach Bedeutung für nationale Sicherheit und
    Wirtschaft in Kategorien; die Kategorien "wichtige Daten" (重要数据) und "nationale Kerndaten" (国家核心数据)
    lösen erhöhte Pflichten und Exportbeschränkungen aus. Die branchenspezifischen Kataloge wichtiger
    Daten werden seit 2024 schrittweise veröffentlicht.

    '
  kurzbeschreibung: 'Verpflichtet zur Klassifizierung und Abstufung von Daten, zu Risikobewertungen für
    wichtige Daten und zu Sicherheitsmaßnahmen entlang des gesamten Datenlebenszyklus. Für KI ist es doppelt
    relevant: Trainingskorpora können wichtige Daten enthalten, und Modellparameter und -gewichte werden
    in der Aufsichtspraxis zunehmend als wichtige Daten behandelt, was ihren Export genehmigungspflichtig
    macht. Art. 36 verbietet die Herausgabe in China gespeicherter Daten an ausländische Justiz- oder
    Vollzugsbehörden ohne Genehmigung der zuständigen chinesischen Behörde — eine Blockadenorm, die bei
    internationalen Verfahren mit US-amerikanischen Discovery-Anordnungen in Konflikt gerät.

    '
