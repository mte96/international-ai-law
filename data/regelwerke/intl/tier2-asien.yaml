  - datum: 2021-08-20
    typ: endfassung
    titel: 中华人民共和国个人信息保护法 (amtlicher Volltext)
    url: https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm
    sprache: zh
    urheber: Staatliche Internet-Informationsverwaltung (国家互联网信息办公室)
    verifiziert: true
    notiz: Amtlicher Volltext, acht Kapitel, 74 Artikel, in Kraft seit 01.11.2021. Am 05.09.2026 abgerufen
      und für die Normebene ausgewertet; belegt insbesondere den abschließenden Katalog der Verarbeitungsgrundlagen
      (Art. 13, ohne berechtigtes Interesse), die automatisierten Entscheidungen (Art. 24), die Bildaufnahme
      an öffentlichen Orten (Art. 26) und den Sanktionsrahmen (Art. 66).
  bedeutung_eu_anbieter: 'Wer DSGVO-konform arbeitet, hat einen Großteil der Struktur schon — aber drei
    Unterschiede kosten Geld. Erstens verlangt Art. 24 mehr als Art. 22 DSGVO: Das Ablehnungsrecht hängt
    nicht an rechtlicher Wirkung, sondern an "erheblicher Betroffenheit". Zweitens gibt es keine Interessenabwägung
    als Erlaubnistatbestand — China kennt nichts, was Art. 6 Abs. 1 lit. f DSGVO entspricht; die Verarbeitung
    stützt sich fast immer auf Einwilligung. Genau daran scheitert das europäische Modell "berechtigtes
    Interesse am Training". Drittens ist der Datenexport genehmigungsbedürftig statt bloß garantiebedürftig.

    '
  offene_punkte:
  - Kein Volltextabruf; Artikelangaben aus Sekundärquellen und allgemeiner Kenntnis.
  - Ob Modellgewichte, die aus personenbezogenen Trainingsdaten abgeleitet sind, selbst personenbezogene
    Informationen sind, ist ungeklärt.
