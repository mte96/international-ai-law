- id: cn-gbt-45654-2025
  jurisdiktion: cn
  kurztitel: GB/T 45654-2025 (Sicherheitsanforderungen generative KI)
  offizieller_titel: Cybersicherheitstechnik — Grundlegende Sicherheitsanforderungen an Dienste generativer
    künstlicher Intelligenz
  originaltitel: 网络安全技术 生成式人工智能服务安全基本要求
  fundstelle: GB/T 45654-2025 — empfohlene nationale Norm (推荐性国家标准); Vorläufer TC260-003-2024
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Veröffentlicht am 25.04.2025, in Kraft seit 01.11.2025. Formal eine empfohlene Norm
    (GB/T), praktisch verbindlich: Die CAC prüft Filing-Anträge und Sicherheitsbewertungen an ihr. Wer
    sie nicht erfüllt, erhält keine Freigabe. Vorläufer war die technische Spezifikation TC260-003 vom
    29.02.2024, die inhaltlich nahezu identisch ist.

    '
  kurzbeschreibung: 'Legt die Prüfmaßstäbe für die Sicherheitsbewertung generativer KI-Dienste fest. Für
    den Trainingskorpus gilt: Bei einer Stichprobe von 4.000 Elementen je Quelle darf der Anteil rechtswidriger
    oder schädlicher Informationen 5 % nicht überschreiten; Herkunftsnachweise und Rechtekette sind zu
    dokumentieren, die Quellenvielfalt zu belegen. Für die Modellprüfung ist ein menschlich geprüfter
    Testsatz von mindestens 2.000 Fragen über 31 Risikokategorien aufzubauen — Politik, Terrorismus, Diskriminierung,
    Pornografie, Persönlichkeitsrechte und weitere; die Quote sicherer Antworten muss mindestens 90 %
    betragen. Hinzu kommen Anforderungen an geschulte Annotatoren, Realnamenregistrierung, Erkennung rechtswidriger
    Inhalte und Notfallpläne.

    '
  inkrafttreten:
    datum: 2025-11-01
    verifiziert: true
