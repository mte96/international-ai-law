  bedeutung_eu_anbieter: 'Für ein europäisches Unternehmen der stärkste Grund, Training nach Japan zu
    verlagern — und zugleich die Falle. Der Trainingsvorgang ist dort zulässig; sobald das Modell in der
    EU in Verkehr gebracht wird, greift jedoch Art. 53 Abs. 1 lit. c KI-VO, der die Achtung von Rechtsvorbehalten
    nach Art. 4 Abs. 3 DSM-RL verlangt, und zwar unabhängig davon, wo trainiert wurde. Die japanische
    Schranke schützt also vor japanischen Ansprüchen, nicht vor europäischen Pflichten. Praktisch bleibt
    sie dennoch wertvoll: Sie erlaubt Experimente und Vorstudien ohne Lizenzverhandlungen.

    '
