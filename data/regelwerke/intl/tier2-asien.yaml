- id: kr-sexualstrafgesetz
  jurisdiktion: kr
  kurztitel: Koreanisches Sexualstrafsondergesetz
  offizieller_titel: 성폭력범죄의 처벌 등에 관한 특례법 (Act on Special Cases concerning the Punishment of Sexual Crimes)
  fundstelle: Gesetz Nr. 10258 vom 15.04.2010; Art. 14-2 eingefügt durch Gesetz Nr. 17264 vom 05.06.2020,
    zuletzt geändert durch Gesetz Nr. 20575 vom 20.12.2024
  status: anwendbar
  status_detail: Art. 14-2 ist der weltweit schärfste Deepfake-Straftatbestand. Die Novelle vom 16.10.2024
    — eine Reaktion auf die Welle sexueller Deepfakes an koreanischen Schulen und Universitäten im August
    2024 — hat die Strafrahmen angehoben und erstmals Besitz, Erwerb, Speicherung und bloßes Ansehen unter
    Strafe gestellt. Die zuletzt geänderte Fassung gilt seit dem 01.10.2025.
  kurzbeschreibung: 'Art. 14-2 stellt in fünf Absätzen die Herstellung, Verbreitung, gewerbsmäßige Verbreitung
    über Informationsnetze, den Besitz und das Ansehen sogenannter Falschbildwerke (허위영상물) unter Strafe:
    Bearbeitungen, Zusammensetzungen oder Veränderungen von Gesicht, Körper oder Stimme einer Person in
    sexuell erregender oder erniedrigender Form ohne deren Einwilligung. Die Herstellung ist mit bis zu
    sieben Jahren Freiheitsstrafe oder 50 Mio. KRW Geldstrafe bedroht, die gewerbsmäßige Verbreitung über
    Informationsnetze mit mindestens drei Jahren, Besitz und Ansehen mit bis zu drei Jahren. Art. 14-3
    erfasst Nötigung und Erpressung mit solchem Material.'
  inkrafttreten:
