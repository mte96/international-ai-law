- id: jp-ki-foerderungsgesetz
  jurisdiktion: jp
  kurztitel: KI-Förderungsgesetz
  offizieller_titel: Gesetz zur Förderung von Forschung, Entwicklung und Nutzung von Technologien mit
    Bezug zur künstlichen Intelligenz
  originaltitel: 人工知能関連技術の研究開発及び活用の推進に関する法律
  fundstelle: Gesetz Nr. 53 von 2025
  verfahrensnummer: Regierungsentwurf, beschlossen vom Parlament am 28.05.2025
  status: anwendbar
  status_detail: 'Vom Parlament am 28.05.2025 beschlossen, am 04.06.2025 verkündet und überwiegend an
    diesem Tag in Kraft getreten; die Kapitel über die KI-Strategiezentrale und den Basisplan folgten
    durch Kabinettsverordnung zum 01.09.2025. Der erste KI-Basisplan wurde am 23.12.2025 vom Kabinett
    beschlossen. Das Gesetz enthält keine durchsetzbaren Pflichten und keine Sanktionen — es ist ein Grundlagengesetz
    (基本法) im japanischen Sinne.

    '
  kurzbeschreibung: 'Erstes ausdrücklich auf KI gerichtetes Gesetz Japans. Es definiert KI weit, erklärt
    ihre Entwicklung zur staatlichen Aufgabe, richtet unter Vorsitz des Ministerpräsidenten und unter
    Beteiligung aller Kabinettsmitglieder eine KI-Strategiezentrale ein und verpflichtet diese, einen
    KI-Basisplan aufzustellen (Art. 18 Abs. 1). Unternehmen — Entwickler, Anbieter und Nutzer — trifft
    nach Art. 7 lediglich eine Bemühenspflicht, bei der Nutzung von KI zur Effizienz und zum Niveau ihres
    Geschäfts beizutragen und mit den staatlichen Maßnahmen zusammenzuwirken. Bußgelder oder Verwaltungssanktionen
    sieht das Gesetz nicht vor. Als einziges Druckmittel gilt die Möglichkeit der Regierung, bei schwerwiegenden
    Rechtsverletzungen Namen zu veröffentlichen.

    '
  inkrafttreten:
    datum: 2025-06-04
    verifiziert: true
    quelle: https://fpf.org/blog/understanding-japans-ai-promotion-act-an-innovation-first-blueprint-for-ai-regulation/
