    und nach welchen Kriterien ein System als hochwirksam einzustufen ist. Ergänzt werden sie durch die
    Hinweise der Rundfunk- und Medienkommission zur Anwendung des Telekommunikationsrechts auf KI-Dienste
    vom 20.01.2026 sowie durch einen zweiten Entwurf der KI-Ethikgrundsätze vom 14.08.2026.

