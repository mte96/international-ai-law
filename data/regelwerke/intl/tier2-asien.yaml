  regelungsschwerpunkte:
  - 'Subsidiaritätsgrundsatz: KI nur als Hilfsmittel, Letztentscheidung beim Menschen — schärfer als Art.
    14 KI-VO, der lediglich wirksame menschliche Aufsicht verlangt.'
  - Hinweispflicht gegenüber Verbrauchern bei allen KI-Diensten, nicht nur bei generativer KI — Übererfüllung
    des KI-Rahmengesetzes.
  - Sicherheitsanforderungen gegen Datenvergiftung, Prompt-Injection und Jailbreaking — eine der wenigen
    aufsichtsrechtlichen Vorschriften weltweit, die diese Angriffsarten ausdrücklich nennt.
  - Zusammenführung dreier bisheriger Leitlinien in ein Dokument.
