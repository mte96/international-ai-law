- id: cn-sicherheitsbewertung
  jurisdiktion: cn
  kurztitel: Sicherheitsbewertung und Algorithmus-Filing
  offizieller_titel: Vorschriften über die Sicherheitsbewertung von Internet-Informationsdiensten mit
    Meinungsbildungseigenschaften oder gesellschaftlicher Mobilisierungsfähigkeit
  originaltitel: 具有舆论属性或社会动员能力的互联网信息服务安全评估规定
  fundstelle: Gemeinsame Vorschrift der Staatlichen Internet-Informationsverwaltung und des Ministeriums
    für öffentliche Sicherheit vom 15.11.2018
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 30.11.2018. Sie ist die Grundnorm des chinesischen Vorabkontrollsystems:
    Sowohl die Deep-Synthesis-Vorschriften (Art. 15, 20) als auch die Interimsmaßnahmen für generative
    KI (Art. 17) und die Verordnung über anthropomorphe Dienste (Art. 22) verweisen auf sie. Das zugehörige
    Algorithmus-Filing-System der CAC ist seit März 2022 in Betrieb; bis April 2025 waren 346 generative
    KI-Dienste registriert, bis zum Frühjahr 2026 kumuliert 868.

    '
  kurzbeschreibung: 'Verpflichtet Anbieter von Internet-Informationsdiensten mit Meinungsbildungseigenschaften
    oder gesellschaftlicher Mobilisierungsfähigkeit, vor Aufnahme des Dienstes und bei jeder wesentlichen
    Änderung eine Sicherheitsbewertung durchzuführen, sie zu dokumentieren und bei der zuständigen Internet-
    und Sicherheitsbehörde einzureichen. Die Bewertung erfasst Nutzerregistrierung mit Realnamen, Inhaltsprüfmechanismen,
    Protokollierung, Notfallpläne und Personalqualifikation. Zusammen mit dem Algorithmus-Filing bildet
    sie die praktische Marktzutrittsschranke: Ohne Filing-Nummer ist kein öffentlicher KI-Dienst in China
    zulässig. Beides setzt eine chinesische Rechtsperson voraus.

    '
  inkrafttreten:
    datum: 2018-11-30
    verifiziert: true
    quelle: https://www.cac.gov.cn/2018-11/15/c_1123716072.htm
    fundstelle_norm: '第十七条 具有舆论属性或社会动员能力的互联网信息服务安全评估规定: 「本规定自2018年11月30日起施行。」 — gemeinsame Vorschrift
      der Staatlichen Internet-Informationsverwaltung und des Ministeriums fuer oeffentliche Sicherheit
      vom 15.11.2018.'
  anwendungsdaten:
