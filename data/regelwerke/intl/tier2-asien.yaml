  jurisdiktion: kr
  kurztitel: Koreanisches Netzwerkgesetz
  offizieller_titel: 정보통신망 이용촉진 및 정보보호 등에 관한 법률 (Act on Promotion of Information and Communications Network
    Utilization and Information Protection)
  fundstelle: Gesetz Nr. 6360 vom 16.01.2001 in der Fassung der Gesamtnovelle; ursprünglich Gesetz Nr.
    3848 von 1986
  status: anwendbar
  status_detail: 'Die datenschutzrechtlichen Sondervorschriften für Anbieter von Informations- und Kommunikationsdiensten
    sind durch die PIPA-Novelle vom 14.03.2023 mit Wirkung vom 15.09.2023 in das PIPA überführt und im
    Netzwerkgesetz gestrichen worden. Was bleibt, ist das Inhalte- und Plattformrecht: Löschungsverlangen,
    Verbot rechtswidriger Informationen, Werbebeschränkungen.'
  kurzbeschreibung: Das Netzwerkgesetz ist Koreas Plattform- und Inhalterecht. Art. 44-2 gibt dem in seinem
    Persönlichkeitsrecht Verletzten ein Löschungs- oder Gegendarstellungsverlangen gegen den Diensteanbieter,
    der den Zugang für bis zu dreißig Tage vorläufig sperren kann. Art. 44-7 verbietet die Verbreitung
    rechtswidriger Informationen in einem Katalog von Tatbeständen und gibt der Korea Communications Standards
    Commission die Befugnis zu Sperr- und Löschungsanordnungen. Art. 50 beschränkt die Übermittlung werblicher
    Informationen auf Empfänger, die vorher ausdrücklich eingewilligt haben. Für synthetische Inhalte
    ist es die verwaltungsrechtliche Schiene neben dem Strafrecht.
  inkrafttreten:
    datum: 2001-07-01
    verifiziert: true
    quelle: https://www.law.go.kr/DRF/lawSearch.do?OC=test&target=lsHistory&type=XML&query=%EC%A0%95%EB%B3%B4%ED%86%B5%EC%8B%A0%EB%A7%9D%20%EC%9D%B4%EC%9A%A9%EC%B4%89%EC%A7%84
    fundstelle_norm: Gesamtnovelle 전부개정 법률 제6360호, verkuendet 16.01.2001, in Kraft 01.07.2001 — mit ihr
      erhielt das Gesetz seinen heutigen Namen. Stammgesetz 제정 법률 제3848호, verkuendet 12.05.1986, in Kraft
      01.01.1987; fruehere Gesamtnovelle 법률 제5835호, verkuendet 08.02.1999, in Kraft 01.07.1999.
  themenachsen:
  - content
  - datenschutz
  - grundrechte
  regelungsschwerpunkte:
  - Art. 44-7 ist die Grundlage, auf der koreanische Aufsichtsstellen sexuelle Deepfakes und rufschädigende
    synthetische Inhalte sperren lassen — schneller und niedrigschwelliger als jedes Strafverfahren.
  - Art. 44-2 verpflichtet den Anbieter zum unverzüglichen Handeln und erlaubt die vorläufige Sperre für
    dreißig Tage. Anders als Art. 19 des brasilianischen Marco Civil verlangt Korea keine gerichtliche
    Anordnung.
  - Die Verlagerung der Datenschutzsondervorschriften ins PIPA 2023 hat das Gesetz auf Inhalte und Netzsicherheit
    zurückgeschnitten; Verweise auf Art. 39-3 in älteren Entscheidungen laufen seither ins Leere.
