- id: cn-ki-sicherheitsrahmen
  jurisdiktion: cn
  kurztitel: KI-Sicherheitsgovernance-Rahmenwerk 2.0
  offizieller_titel: Rahmenwerk für die Sicherheitsgovernance künstlicher Intelligenz, Fassung 2.0
  originaltitel: 人工智能安全治理框架 2.0
  fundstelle: Veröffentlichung des Nationalen Technischen Komitees für Cybersicherheitsnormung (TC260)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Fassung 1.0 vom 09.09.2024, Fassung 2.0 vom 15.09.2025. Kein Rechtsakt, sondern ein
    technisches Dokument. Fassung 1.0 war eine Grundsatzerklärung, Fassung 2.0 ist ein Handbuch mit über
    30 konkreten Maßnahmen entlang des Lebenszyklus.

    '
  kurzbeschreibung: 'Ordnet KI-Risiken in drei Klassen — technikimmanente Risiken, Anwendungsrisiken und
    abgeleitete gesellschaftliche und ökologische Risiken — und ordnet ihnen technische und organisatorische
    Gegenmaßnahmen zu. Fassung 2.0 nennt ausdrücklich Halluzinationen, die Verbreitung von Deepfakes und
    die Weitergabe von Wissen über nukleare, biologische und chemische Waffen; als Maßnahmen erscheinen
    Erklärbarkeit, adversariales Training, Wasserzeichen und Abschaltmechanismen. Das Dokument dient zugleich
    als chinesischer Beitrag in UN, APEC, G20 und BRICS und ist die Grundlage der "Globalen Initiative
    zur KI-Governance" sowie des Vorschlags einer Weltorganisation für KI-Zusammenarbeit vom Juli 2025.

    '
