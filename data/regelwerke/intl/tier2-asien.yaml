  regelungsschwerpunkte:
  - Auslösetatbestand 'Meinungsbildungseigenschaft oder gesellschaftliche Mobilisierungsfähigkeit' ist
    weit und in der Praxis bei jedem publikumsoffenen Chatbot erfüllt.
  - 'Vorabkontrolle: Die Bewertung ist vor Aufnahme des Dienstes und bei wesentlicher Änderung — etwa
    Modellwechsel — zu wiederholen.'
  - Inhaltlicher Maßstab ist seit 2025 GB/T 45654-2025 (Korpusprüfung, Testfragen, Bestehensquote).
