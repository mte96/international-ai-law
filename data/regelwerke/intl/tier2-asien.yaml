  - Keine TDM-Schranke; mehrere Änderungsanträge seit 2021 sind nicht beschlossen worden.
  - Art. 35-5 (Fair Use, seit 2011) als einzige diskutierte Grundlage für Trainingsnutzungen.
  - 'Reformagenda des Kulturministeriums: TDM-Schranke, Offenlegung von Trainingsdaten, Persönlichkeitsverwertungsrecht.'
