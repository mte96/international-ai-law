- id: sg-copyright-act-2021
  jurisdiktion: sg
  kurztitel: Copyright Act 2021
  offizieller_titel: Copyright Act 2021
  fundstelle: Act 22 of 2021, in Kraft seit 21.11.2021
  status: anwendbar
  status_detail: Die vollständige Neufassung des singapurischen Urheberrechts. Sie hat mit der Division
    8 (ss. 243 und 244) die weltweit erste ausdrücklich auf maschinelles Lernen zugeschnittene Schranke
    eingeführt — die amtliche Illustration zu s. 243 nennt das Training eines Programms auf Bildern zur
    Bilderkennung — und sie in s. 187 für unabdingbar erklärt. Der Singapore Academy of Law Reform Committee
    hat 2025 einen Bericht zur Reform der Schranke vorgelegt; eine Gesetzesänderung ist am 06.09.2026
    nicht ergangen.
  kurzbeschreibung: Der Copyright Act 2021 kennt drei einander ergänzende Freiräume für KI. Erstens die
    offene Fair-use-Schranke der ss. 190 und 191 mit vier Abwägungsfaktoren nach dem Vorbild des US-Rechts.
    Zweitens die Schranke für computational data analysis in ss. 243 und 244, die Vervielfältigung und
    öffentliche Übermittlung zu Analyse- und Trainingszwecken erlaubt, sofern rechtmäßiger Zugang zur
    Ausgangskopie besteht, die Kopie nicht anderweitig verwendet und nur zur Ergebnisüberprüfung oder
    gemeinschaftlichen Forschung weitergegeben wird. Drittens die Unabdingbarkeit dieser Schranke nach
    s. 187 samt Nichtigkeit von Umgehungsrechtswahlklauseln nach s. 188. Wer in Singapur trainiert, kann
    sich auf die Schranke also auch dann berufen, wenn die Nutzungsbedingungen der Quelle etwas anderes
    sagen — solange er nicht die Bezahlschranke umgeht.
  inkrafttreten:
    datum: '2021-11-21'
    verifiziert: true
    quelle: https://sso.agc.gov.sg/Act/CA2021
