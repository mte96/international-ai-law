  bedeutung_eu_anbieter: 'Das ist der eigentliche Marktzutrittsfilter, nicht das Bußgeldrecht. Wer in
    China anbieten will, braucht eine chinesische Rechtsperson — in der Regel eine WFOE oder ein Joint
    Venture, teils mit einem chinesischen Staatsangehörigen als gesetzlichem Vertreter —, ein Algorithmus-Filing
    (2 bis 4 Monate) und eine Sicherheitsbewertung (3 bis 6 Monate). Die EU kennt für KI-Systeme keine
    Vorabgenehmigung; selbst Hochrisiko-KI wird über Konformitätsbewertung und Registrierung, nicht über
    behördliche Zulassung gesteuert. Dieser Unterschied ist der wichtigste strukturelle Unterschied zwischen
    beiden Ordnungen.

    '
