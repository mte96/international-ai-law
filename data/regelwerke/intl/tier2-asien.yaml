  kurztitel: Cybersicherheitsgesetz (Fassung 2026)
  offizieller_titel: Cybersicherheitsgesetz der Volksrepublik China (Fassung der Änderung vom 28.10.2025)
  originaltitel: 中华人民共和国网络安全法（2025年修正）
  fundstelle: Beschlossen am 07.11.2016; erste Änderung durch Beschluss des Ständigen Ausschusses des
    Nationalen Volkskongresses vom 28.10.2025
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Stammfassung in Kraft seit 01.06.2017. Die erste Änderung überhaupt wurde am 28.10.2025
    beschlossen und ist seit 01.01.2026 in Kraft. Sie enthält erstmals eine ausdrückliche KI-Klausel in
    einem chinesischen Parlamentsgesetz und erhöht die Bußgelder erheblich.

    '
  kurzbeschreibung: 'Grundgesetz der chinesischen Netzsicherheit: Netzbetreiberpflichten, abgestuftes
    Schutzsystem, kritische Informationsinfrastruktur, Datenlokalisierung, Meldepflichten. Die Änderung
    von 2025 fügt eine Vorschrift ein, die die Förderung der KI-Grundlagenforschung, der Algorithmeninnovation,
    der Trainingsinfrastruktur sowie den Aufbau von Ethiknormen und Risikoüberwachung ausdrücklich zur
    staatlichen Aufgabe erklärt und den Einsatz von KI zur Verbesserung der Cybersicherheit fördert. Zugleich
    steigen die Bußgelder auf bis zu 2 Mio. RMB bei schweren und bis zu 10 Mio. RMB bei besonders schweren
    Verstößen; die Behörden können unmittelbar Bußgelder verhängen, ohne zuvor abzumahnen. Die extraterritoriale
    Durchsetzung gegen Akteure im Ausland wurde erweitert, die persönliche Verantwortlichkeit auf "sonstige
    unmittelbar verantwortliche Personen" ausgedehnt.

    '
  inkrafttreten:
    datum: 2017-06-01
    verifiziert: true
    quelle: https://www.cac.gov.cn/2016-11/07/c_1119867116_3.htm
    fundstelle_norm: '第七十九条 中华人民共和国网络安全法 (Stammfassung, beschlossen 07.11.2016): 「本法自2017年6月1日起施行。」'
  anwendungsdaten:
  - datum: 2026-01-01
    was_gilt: 'Erste Aenderung ueberhaupt: 全国人民代表大会常务委员会关于修改《中华人民共和国网络安全法》的决定, beschlossen am 28.10.2025
      auf der 18. Sitzung des Staendigen Ausschusses des 14. Nationalen Volkskongresses; Schlusssatz:
      「本决定自2026年1月1日起施行。」 — enthaelt die erstmalige KI-Klausel.'
    verifiziert: true
    quelle: https://www.gov.cn/yaowen/liebiao/202510/content_7046194.htm
  themenachsen:
  - sicherheit-export
