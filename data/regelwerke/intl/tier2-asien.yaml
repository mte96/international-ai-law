  bedeutung_eu_anbieter: 'Das Gesetz, das ein europäischer Anbieter am ehesten unterschätzt, weil die
    Bußgelder lächerlich wirken. Der eigentliche Hebel ist die Pflicht zum inländischen Vertreter und
    die Untersuchungsbefugnis des MSIT: Wer über eine Million tägliche Nutzer in Korea hat, braucht eine
    benannte Person vor Ort, die Auskunft geben und Abhilfeanordnungen umsetzen kann. Inhaltlich ist die
    Wiederverwendung der EU-Dokumentation hoch: Risikomanagement, Erklärbarkeit und Aufbewahrung entsprechen
    weitgehend den Art. 9 bis 18 KI-VO. Drei Abweichungen sind zu beachten. Erstens gibt es keine verbotenen
    Praktiken, dafür eine breitere Kennzeichnungspflicht — sie erfasst auch nicht täuschende generative
    Ausgaben. Zweitens liegt die Rechenschwelle bei 10^26 FLOP, also zehnmal höher als in Art. 51 KI-VO;
    wer in der EU als GPAI mit systemischem Risiko gilt, ist in Korea unter Umständen nicht erfasst. Drittens
    läuft parallel die PIPC mit eigener Zuständigkeit für personenbezogene Daten — die Doppelaufsicht
    ist real und nicht koordiniert.

    '
  offene_punkte:
  - Präziser Inhalt und Verkündungsdatum des Änderungsgesetzes vom Dezember 2025 nicht am Gesetzestext
    geprüft.
  - Die einjährige Bußgeldkarenz beruht auf einer Ankündigung des MSIT, nicht auf einer Übergangsvorschrift
    — ihr genaues Ende ist rechtlich nicht fixiert.
  - Zwei Änderungsanträge vom 27.07.2026 (Menschenrechts- und Antidiskriminierungsstandards; differenzierte
    Offenlegungspflichten für generative KI) sind noch nicht ausgewertet.
