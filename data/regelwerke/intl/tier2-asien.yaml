  bedeutung_eu_anbieter: 'Die Norm ist der konkreteste Text, den ein europäischer Anbieter zur Vorbereitung
    lesen sollte — konkreter als jedes chinesische Gesetz. Sie sagt, was der Prüfer im Filing-Verfahren
    sehen will. Zwei Punkte haben kein europäisches Gegenstück: die quantifizierte Korpusreinheit und
    die Prüfung gegen einen politisch definierten Risikokatalog. Ein europäisches Modell besteht Letzteren
    ohne gezieltes Alignment nicht. Umgekehrt ist die geforderte Herkunftsdokumentation weitgehend deckungsgleich
    mit dem, was Art. 53 KI-VO und der GPAI-Verhaltenskodex ohnehin verlangen — dieser Teil lässt sich
    wiederverwenden.

    '
