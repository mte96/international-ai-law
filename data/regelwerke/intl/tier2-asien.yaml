- id: sg-mas-ki-risiko
  jurisdiktion: sg
  kurztitel: MAS-Leitlinien zum KI-Risikomanagement
  offizieller_titel: Guidelines on Artificial Intelligence Risk Management (Konsultationsfassung)
  fundstelle: Konsultationspapier der Monetary Authority of Singapore vom 13.11.2025
  verfahrensnummer: Konsultation bis 31.01.2026
  status: entwurf
  status_detail: 'Konsultationspapier vom 13.11.2025, Stellungnahmefrist bis 31.01.2026. Widersprüchliche
    Datierung: Stephenson Harwood nennt Dezember 2025, Allen & Gledhill den 13.11.2025; dem singapurischen
    Kanzleihinweis wird gefolgt. Die Endfassung lag zum Recherchestand nicht vor. Vorgesehen ist eine
    Übergangsfrist von zwölf Monaten nach Erlass. Sie bauen auf den FEAT-Grundsätzen von 2018 und dem
    Veritas-Programm auf.

    '
  kurzbeschreibung: 'Erste umfassende aufsichtsrechtliche Regelung des KI-Einsatzes im singapurischen
    Finanzsektor. Sie sollen für alle von der MAS beaufsichtigten Institute gelten, mit Anwendung nach
    Verhältnismäßigkeit je nach Größe, Art der Tätigkeit und Risikoprofil. Vier Bereiche: Governance und
    Aufsicht mit Verantwortung von Vorstand und Geschäftsleitung und Prägung einer Risikokultur; Risikomanagementsysteme
    mit einem KI-Bestandsverzeichnis, klaren Identifikationsverfahren und einer Wesentlichkeitsbewertung
    nach Auswirkung, Komplexität und Abhängigkeit; Lebenszykluskontrollen für Datenmanagement, Fairness,
    Transparenz, menschliche Aufsicht, Drittparteienrisiko, Prüfung, Überwachung und Änderungsmanagement;
    sowie Fähigkeiten und Kapazitäten. Erfasst werden ausdrücklich generative KI, herkömmliche KI und
    KI-Agenten.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
  anwendungsdaten:
