  - vertrag
  regelungsschwerpunkte:
  - s. 243 definiert die computational data analysis in zwei Alternativen; die zweite — das Nutzen eines
    Werks als Beispiel für einen Datentyp zur Verbesserung eines Programms — ist die eigentliche Trainingserlaubnis
    und war 2021 die erste ihrer Art weltweit.
  - s. 244(2)(d) verlangt rechtmäßigen Zugang. Die amtlichen Illustrationen nennen die Umgehung von Bezahlschranken
    und den Verstoß gegen Datenbank-Nutzungsbedingungen als Gegenbeispiele — Letzteres jedoch unter Ausklammerung
    der nach s. 187 nichtigen Bedingungen.
  - 's. 187(1)(c) macht die gesamte Division 8 unabdingbar. Damit kennt Singapur das Gegenteil des Rechtsvorbehalts
    aus Art. 4 Abs. 3 DSM-Richtlinie: Der Rechtsinhaber kann das Training vertraglich nicht untersagen.'
  - s. 186 lässt vertragliche Einschränkungen der übrigen Schranken nur bei individuell ausgehandelten
    und angemessenen Klauseln zu — Nutzungsbedingungen im Netz genügen dem regelmäßig nicht.
  - Die Schranke deckt nur Vervielfältigung und Übermittlung, nicht die Ausgabe. Für Ausgaben, die einem
    Werk ähneln, bleibt es bei s. 146 und der Fair-use-Prüfung.
