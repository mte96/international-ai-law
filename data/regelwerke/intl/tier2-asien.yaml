      Datum nur aus einer Sekundärquelle belegt, deren übrige Angaben zum Gesetzesinhalt unzutreffend
      sind.

      '
    verifiziert: false
    quelle: https://techjacksolutions.com/ai-brief/japan-ai-regulation-news-ai-promotion-act-is-fully-enforced/
  - datum: 2025-12-23
    was_gilt: Kabinettsbeschluss über den ersten KI-Basisplan nach Art. 18 Abs. 1.
    verifiziert: true
