  offizieller_titel: Staatliche Registrierung von Software mit Technologien der künstlichen Intelligenz
    als Medizinprodukt
  originaltitel: Государственная регистрация программного обеспечения с технологиями искусственного интеллекта
    в качестве медицинского изделия
  transliteration: Gosudarstvennaja registracija programmnogo obespečenija s technologijami iskusstvennogo
    intellekta v kačestve medicinskogo izdelija
  fundstelle: Föderationsgesetz vom 21.11.2011 Nr. 323-FZ (Grundlagen des Gesundheitsschutzes), Art. 38;
    Registrierungsverfahren nach Regierungsverordnung; Normenreihe GOST R 59921.x
  status: anwendbar
  status_detail: 'KI-Anwendungen im Gesundheitswesen unterliegen in Russland der Registrierung als Medizinprodukt
    bei Roszdravnadzor. Der Bestand lag 2025/2026 bei über 50 registrierten Lösungen (Angaben schwanken
    zwischen 53 und 57), überwiegend Bildauswertung in der Radiologie. Die Registrierung folgt einem risikobasierten
    Verfahren mit drei Kontrollstufen. Das 243-FZ regelt den Gesundheitssektor nicht; die sektorspezifische
    KI-Regulierung wurde ausdrücklich vertagt, und die im Märzentwurf vorgesehene Kategorie des "vertrauenswürdigen"
    Modells für Gesundheitssysteme fiel weg.

    '
  kurzbeschreibung: 'Der einzige Bereich, in dem russisches Recht KI vor Markteinführung prüft. Funktional
    entspricht das der Konformitätsbewertung nach Anhang I der KI-VO in Verbindung mit der MDR — mit dem
    Unterschied, dass die Prüfung nicht durch benannte Stellen, sondern durch die Bundesbehörde selbst
    erfolgt. Nach dem Recherchestand ist damit die Registrierung als Medizinprodukt die einzige echte
    Marktzutrittsschranke für KI in Russland.

    '
