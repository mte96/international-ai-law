  bedeutung_eu_anbieter: 'Rechtsvergleichend das interessanteste Stück des Bestands: ein territorial begrenzter
    Sandkasten, der nicht Marktzugangsrecht, sondern Datenschutzrecht suspendiert — und zwar zugunsten
    der Verwaltung, nicht der Unternehmen. Ein europäisches Gegenstück gibt es nicht; Art. 59 KI-VO erlaubt
    im Reallabor die Weiterverarbeitung rechtmäßig erhobener Daten nur unter engen Voraussetzungen und
    unter Aufsicht der Datenschutzbehörde.

    '
  quellenlage: 'Gesetzestext über zwei Rechtsdatenbanken verifiziert. Die Fortgeltung nach dem 01.07.2025
    ist ausdrücklich NICHT verifiziert; die Quellen widersprechen sich.

