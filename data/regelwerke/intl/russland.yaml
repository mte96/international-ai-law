- id: ru-pp-861-zentrum
  jurisdiktion: ru
  kurztitel: Zentrum für KI-Entwicklung bei der Regierung (Verordnung 861/2025)
  offizieller_titel: Verordnung der Regierung der Russischen Föderation über das Zentrum für die Entwicklung
    der künstlichen Intelligenz bei der Regierung der Russischen Föderation
  originaltitel: Постановление Правительства Российской Федерации от 09.06.2025 № 861 «О Центре развития
    искусственного интеллекта при Правительстве Российской Федерации»
  transliteration: Postanovlenie Pravitel'stva Rossijskoj Federacii ot 09.06.2025 № 861 «O Centre razvitija
    iskusstvennogo intellekta pri Pravitel'stve Rossijskoj Federacii»
  fundstelle: Regierungsverordnung vom 09.06.2025 Nr. 861
  status: anwendbar
  status_detail: 'In Kraft. Errichtet auf Grundlage des bestehenden Analytischen Zentrums bei der Regierung
    ein Zentrum für die Entwicklung der künstlichen Intelligenz. Aufgaben: informatorisch-analytische
    Begleitung der KI-Prioritäten, internationale Zusammenarbeit, Erarbeitung der rechtlichen Rahmenbedingungen
    für KI-Sicherheit, Entwicklung und Verbreitung von KI-Lösungen, Umsetzung der Nationalen Strategie
    bis 2030, Einbindung von Fachexperten. Die Verordnung regelt zudem die Zusammenarbeit von Bundes-
    und Regionalbehörden und die Bildung von Projektgruppen.

    '
  kurzbeschreibung: 'Die exekutive Vorstufe zum KI-Gesetz. Ein Jahr vor dem 243-FZ und acht Monate vor
    der Präsidialkommission schuf die Regierung sich den Apparat, der die Regulierung erarbeiten und die
    Strategie umsetzen soll. Bemerkenswert ist die Aufgabenzuweisung "Erarbeitung der rechtlichen Rahmenbedingungen
    für KI-Sicherheit": Die Rechtsetzungsvorbereitung liegt damit bei einer Regierungseinrichtung, nicht
    beim Parlament oder bei einer unabhängigen Stelle. Zusammen mit dem Erlass 116/2026 und der Ermächtigung
    des 243-FZ zu Regierungsverordnungen ergibt sich ein durchgehend exekutiv organisiertes Steuerungssystem.

    '
