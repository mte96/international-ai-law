- id: ru-mintsifry-entwurf-2026
  jurisdiktion: ru
  kurztitel: Mintsifry-Entwurf zur staatlichen KI-Regulierung (März 2026)
  offizieller_titel: Entwurf eines Föderationsgesetzes über die Grundlagen der staatlichen Regulierung
    im Bereich der künstlichen Intelligenz
  originaltitel: Проект федерального закона «Об основах государственного регулирования в сфере искусственного
    интеллекта»
  transliteration: Prökt federal'nogo zakona «Ob osnovach gosudarstvennogo regulirovanija v sfere iskusstvennogo
    intellekta»
  fundstelle: Konsultationsentwurf des Ministeriums für digitale Entwicklung, Kommunikation und Massenmedien
    (Minzifry), veröffentlicht 18.03.2026
  verfahrensnummer: keine Duma-Vorlagennummer — nie in dieser Fassung eingebracht
  status: gescheitert
  status_detail: 'Nicht förmlich abgelehnt, sondern zwischen März und Juni 2026 entkernt. Die öffentliche
    Konsultation lief bis 15.04.2026, am 09.04.2026 fanden Parlamentsanhörungen statt. Am 22.06.2026 billigte
    die Regierungskommission für Gesetzgebungstätigkeit eine deutlich liberalisierte Fassung; Vizepremier
    Grigorenko erklärte, der Hauptakzent liege nun "auf der Unterstützung russischer KI-Modelle". Das
    Verbot ausländischer KI-Systeme wurde gestrichen, die Pflichtkennzeichnung fiel weg, aus den drei
    Modellkategorien (souverän / national / vertrauenswürdig) wurden zwei — die Kategorie "vertrauenswürdig"
    mit FSB- und FSTEK-Prüfung für kritische Infrastruktur verschwand. Was übrig blieb, wurde als Vorlage
    1271570-8 eingebracht und ist heute 243-FZ. Der Entwurf gehört in den Bestand, weil er zeigt, welche
    Regulierung Russland 2026 erwogen und dann verworfen hat.

    '
  kurzbeschreibung: 'Der Entwurf hätte Russland ein risikobasiertes KI-Regulierungsgesetz europäischen
    Zuschnitts gegeben. Er enthielt die erste Legaldefinition der KI im russischen Recht, staffelte die
    Anforderungen nach dem Grad der Einwirkung auf Leben und Gesellschaft, verpflichtete zur Kennzeichnung
    aller KI-erzeugten audiovisuellen Materialien in menschen- und maschinenlesbarer Form, belegte große
    soziale Netzwerke mit einer Prüf- und Ersatzkennzeichnungspflicht, verlangte den Ausschluss diskriminierender
    Funktionen und die Blockade rechtswidriger Inhaltserzeugung, gab Bürgern ein außergerichtliches Anfechtungsrecht
    gegen KI-gestützte Verwaltungsentscheidungen und einen zivilrechtlichen Schadensersatzanspruch, und
    verteilte die Haftung verschuldensproportional auf Entwickler, Betreiber, Diensteinhaber und Nutzer.
    Er nahm Verteidigung, Staatssicherheit, Katastrophenschutz und Strafverfolgung vom Anwendungsbereich
    aus und sah vor, grenzüberschreitende KI-Technologien beschränken oder verbieten zu können. Geplantes
    Inkrafttreten: 01.09.2027.

    '
