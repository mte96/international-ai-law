  regelungsschwerpunkte:
  - 'Art. 3: Legaldefinition der künstlichen Intelligenz und erstmals der ''großen fundamentalen Modelle''
    (большие фундаментальные модели) — Schwelle 1 Mrd. Parameter'
  - 'Art. 4: Grundsätze — risikoorientierter Ansatz, technologische Unabhängigkeit, Berücksichtigung der
    ''traditionellen russischen geistig-moralischen Werte''. Der Wertebezug ist kein Programmsatz, sondern
    Teil der Statusprüfung für souveräne Modelle.'
  - 'Art. 5: Kompetenzverteilung zwischen Präsident, Regierung, Bundesbehörden, Staatskorporationen und
    Zentralbank. Der Präsident kann Besonderheiten der Anwendung in sensiblen Bereichen selbst bestimmen
    — ohne Gesetzesvorbehalt im engeren Sinne.'
  - 'Art. 6/7: Förderung souveräner und nationaler Modelle; Zugang der Entwickler zu staatlichen Daten
    für Training und Entwicklung, finanzielle Unterstützung, Teilnahme an ethischer Regelsetzung, Möglichkeit
    der Haftpflichtversicherung'
  - 'Art. 8: Pflichten der Entwickler — Sicherheit des Modells, Nutzungsregeln, technische Dokumentation,
    Dokumentation der Grenzen des Modells (ab 01.03.2027)'
  - 'Art. 9 ''Маркировка информационного материала, созданного с применением больших фундаментальных моделей'':
    Kennzeichnung ist ein Recht des Nutzers, keine Pflicht. Plattformen mit über 500.000 Tagesnutzern
    in Russland und nutzergenerierten Inhalten müssen die technische Möglichkeit bereitstellen. Format
    und Platzierung regelt die Vereinbarung zwischen Nutzer und Plattform. Erfasst sind nur Audio- und
    visuelle Materialien, nicht Text.'
  - 'Art. 10 Abs. 1: Anbieter, die Zugang zu großen fundamentalen Modellen gewähren, müssen Nutzer über
    die Rechte an den erzeugten Ergebnissen, die Zugangs- und Nutzungsbedingungen und den Verbleib der
    Daten nach Vertragsende informieren (ab 01.03.2027)'
  - 'Art. 10 Abs. 2: Schrankenregelung für Trainingsdaten. Analyse rechtmäßig erlangter oder öffentlich
    zugänglicher Werke zum Zweck der Entwicklung SOUVERÄNER UND NATIONALER Modelle gilt nicht als Verletzung
    des ausschließlichen Rechts, solange keine technischen Zugangsbeschränkungen überwunden werden. Kein
    Opt-out des Rechteinhabers, keine Vergütungspflicht, keine Transparenzpflicht über die Trainingskorpora.'
  - 'Art. 11: Verantwortlichkeit — Verweisnorm ohne eigene Sanktion'
  - 'Art. 13: gestaffeltes Inkrafttreten'
