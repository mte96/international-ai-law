  bedeutung_eu_anbieter: 'Ein europäischer Anbieter von Gesichtserkennung oder Stimmbiometrie kann in
    Russland faktisch nur Authentifizierungsprodukte anbieten und muss sein System akkreditieren lassen.
    Die Identifizierungsfunktion ist staatsmonopolisiert. Das ist strenger als die KI-VO, die private
