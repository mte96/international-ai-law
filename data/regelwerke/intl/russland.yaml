  originaltitel: Федеральный закон «О внесении изменений в отдельные законодательные акты Российской Федерации
    в части уточнения порядка обработки персональных данных в информационно-телекоммуникационных сетях»
  transliteration: Federal'nyj zakon «O vnesenii izmenenij v otdel'nye zakonodatel'nye akty Rossijskoj
    Federacii v časti utočnenija porjadka obrabotki personal'nych dannych v informacionno-telekommunikacionnych
    setjach»
  fundstelle: Föderationsgesetz vom 21.07.2014 Nr. 242-FZ
  status: anwendbar
  status_detail: 'In Kraft seit 01.09.2015. Fügt Art. 18.1 Abs. 5 in das 152-FZ ein: Erhebung personenbezogener
    Daten russischer Bürger — einschließlich Aufzeichnung, Systematisierung, Speicherung und Aktualisierung
    — hat unter Verwendung von Datenbanken zu erfolgen, die sich auf dem Territorium der Russischen Föderation
    befinden. Durchsetzung über das Register der Verstöße und Zugangssperren durch Roskomnadsor; prominenteste
    Anwendungsfälle waren LinkedIn (2016) und Meta.

    '
  kurzbeschreibung: 'Die technische Voraussetzung des ganzen Souveränitätskonzepts. Ohne 242-FZ wäre die
    Anforderung des 243-FZ, dass souveräne und nationale Modelle in russischen Rechenzentren betrieben
    werden, ein isolierter Programmsatz; mit ihr ist sie die Fortschreibung einer seit elf Jahren durchgesetzten
    Grundregel. Für KI-Training bedeutet die Norm: Der Primärdatenbestand muss in Russland liegen. Ein
    Export russischer Rohdaten zum Training eines europäischen Modells ist nur über den — seit 265-FZ
    genehmigungspflichtigen — Weg des Art. 12 152-FZ möglich.

    '
