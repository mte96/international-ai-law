- id: ru-149-fz
  jurisdiktion: ru
  kurztitel: Informationsgesetz (149-FZ)
  offizieller_titel: Föderationsgesetz über Information, Informationstechnologien und den Schutz von Information
  originaltitel: Федеральный закон «Об информации, информационных технологиях и о защите информации»
  transliteration: Federal'nyj zakon «Ob informacii, informacionnych technologijach i o zaščite informacii»
  fundstelle: Föderationsgesetz vom 27.07.2006 Nr. 149-FZ; geltende Fassung mit Änderungen bis zum Föderationsgesetz
    vom 26.06.2026 Nr. 210-FZ
  status: anwendbar
  status_detail: 'In Kraft seit 08.08.2006, seither vielfach geändert. Das Gesetz enthält keine KI-spezifische
    Norm, ist aber die Trägerschicht des gesamten russischen Plattform- und Sperrrechts: Art. 10.1 zieht
    Dienste mit Kommunikationsfunktion in das Vorratsdatenregime, Art. 10.2-2 begründet seit 2023 Transparenzpflichten
    für Empfehlungstechnologien, Art. 15.3 trägt die außerjustizielle Sperre. Über diese Normen — nicht
    über das KI-Gesetz — wird der Marktzugang ausländischer KI-Dienste in Russland tatsächlich gesteuert.

    '
  kurzbeschreibung: 'Das allgemeine Informationsgesetz Russlands. Für die KI-Regulierung ist es aus drei
    Gründen zentral: Es liefert die Begriffe, auf denen alle späteren Spezialgesetze aufsetzen; es enthält
    mit Art. 10.2-2 die einzige allgemein geltende Transparenzpflicht für algorithmische Systeme im russischen
    Recht; und es stellt mit Art. 15.1 bis 15.9 den Sperrapparat bereit, mit dem ein ausländischer KI-Dienst
    ohne jede Änderung des KI-Rechts unerreichbar gemacht werden kann. Das 90-FZ (souveränes Internet)
    ist eine Novelle dieses Gesetzes und des Kommunikationsgesetzes.

    '
  inkrafttreten:
    datum: 2006-08-09
    verifiziert: true
    quelle: https://www.kontur-extern.ru/info/normativ/document/1/501188-federalnyy-zakon-ot-27-07-2006-n-149-fz
    fundstelle_norm: Статья 19 des 149-FZ (Вступление в силу) — zehn Tage nach der amtlichen Veroeffentlichung;
      Veroeffentlichung 'Российская газета' N 165 vom 29.07.2006 (SZ RF 31.07.2006 N 31 Teil 1 Art. 3448).
      Kontur.Normativ datiert die durch dieses Gesetz bewirkten Aufhebungen und Aenderungen auf '(с 09.08.2006)';
      WIPO Lex nennt als 'Дата вступления в силу' den 09.08.2006
