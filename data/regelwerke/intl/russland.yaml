  offene_punkte:
  - Die Regierungsverordnungen zu Statusfeststellung, Datenzugang und Sektoren mit Pflicht zu inländischen
    Modellen lagen am 03.09.2026 noch nicht vor. Ohne sie ist der operative Gehalt des Gesetzes gering.
  - Wie die 'traditionellen geistig-moralischen Werte' in der Konformitätsfeststellung geprüft werden,
    ist offen. Es gibt keinen Prüfmaßstab, keinen Rechtsbehelf und keine benannte Stelle.
  - 'Das Verhältnis von Art. 10 Abs. 2 zu Art. 1229, 1270, 1274 ZGB RF ist ungeklärt: Ist die Norm eine
    Schranke im Sinne des Teils IV oder eine Sondernorm daneben? Die Gesetzgebungsmaterialien schweigen.'
  - Wolodin hat am 09.07.2026 eine Wiedervorlage zentraler Bestimmungen bis Jahresende 2026 angekündigt.
    Ob das eine Nachschärfung oder eine weitere Entschärfung wird, ist offen.
  - Ob 'Zugang zu staatlichen Daten' auch personenbezogene Daten umfasst, sagt das Gesetz nicht. Der Vorstoß
    der Assoziation für Big Data vom 03.08.2026 (siehe ru-abd-vorstoss-pdn) zeigt, dass die Branche es
    so nicht liest.
