- id: ru-41-fz-antifraud
  jurisdiktion: ru
  kurztitel: Anti-Betrugs-Informationssystem (41-FZ)
  offizieller_titel: Föderationsgesetz über die Schaffung eines staatlichen Informationssystems zur Bekämpfung
    von Rechtsverletzungen, die unter Verwendung von Informations- und Kommunikationstechnologien begangen
    werden, und über Änderungen einzelner Gesetzgebungsakte der Russischen Föderation
  originaltitel: Федеральный закон «О создании государственной информационной системы противодействия
    правонарушениям, совершаемым с использованием информационных и коммуникационных технологий, и о внесении
    изменений в отдельные законодательные акты Российской Федерации»
  transliteration: Federal'nyj zakon «O sozdanii gosudarstvennoj informacionnoj sistemy protivodejstvija
    pravonarušenijam, soveršaemym s ispol'zovaniem informacionnych i kommunikacionnych technologij…»
  fundstelle: Föderationsgesetz vom 01.04.2025 Nr. 41-FZ
  status: anwendbar
  status_detail: 'Gestaffelt seit dem 01.06.2025 in Kraft. Schafft ein staatliches Informationssystem
    gegen Telefon- und Internetbetrug, verpflichtet Banken, Telekommunikationsanbieter und Plattformen
    zum Informationsaustausch und führt Kennzeichnungs- und Warnpflichten bei Anrufen ein. Für KI relevant,
    weil Stimm-Deepfakes das derzeit häufigste Betrugswerkzeug in Russland sind — das Innenministerium
    meldete im Mai 2026 die Nachbildung von Stimmen von Beamten des Ermittlungskomitees und des Innenministeriums.

    '
  kurzbeschreibung: 'Kein KI-Gesetz, aber die derzeit wirksamste Antwort des russischen Rechts auf KI-gestützte
    Kriminalität. Statt den Deepfake zu verbieten, greift das Gesetz am Übertragungsweg an: Anrufe von
    juristischen Personen müssen gekennzeichnet werden, verdächtige Transaktionen werden systemisch abgeglichen,
    Nummern gesperrt. Das ist Infrastrukturregulierung statt Inhaltsregulierung — und entspricht dem Muster,
    das auch das KI-Gesetz prägt.

    '
