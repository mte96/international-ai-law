- id: ru-ukaz-116-kommission
  jurisdiktion: ru
  kurztitel: Präsidialkommission für KI (Erlass 116/2026)
  offizieller_titel: Erlass des Präsidenten der Russischen Föderation 'Über die Kommission beim Präsidenten
    der Russischen Föderation für Fragen der Entwicklung von Technologien der künstlichen Intelligenz'
  originaltitel: Указ Президента Российской Федерации «О Комиссии при Президенте Российской Федерации
    по вопросам развития технологий искусственного интеллекта»
  transliteration: Ukaz Prezidenta Rossijskoj Federacii «O Komissii pri Prezidente Rossijskoj Federacii
    po voprosam razvitija technologij iskusstvennogo intellekta»
  fundstelle: Erlass Nr. 116 vom 26.02.2026
  status: anwendbar
  status_detail: 'In Kraft. Die Kommission tagt mindestens vierteljährlich. Ko-Vorsitz: Vizepremier Dmitrij
    Grigorenko und der stellvertretende Leiter der Präsidialverwaltung Maxim Oreschkin. Mitglieder unter
    anderem: Verteidigungsminister Beloussow, FSB-Direktor Bortnikow, Wirtschaftsminister Reschetnikow,
    der Vorstandsvorsitzende der Sberbank German Gref, der Yandex-Berater Tigran Chudawerdjan, der Moskauer
    Bürgermeister Sobjanin und der Gouverneur des Moskauer Gebiets.

    '
  kurzbeschreibung: 'Institutioneller Schlüssel des russischen Modells. Die Kommission versammelt Sicherheitsapparat,
    Wirtschaftsressorts und die beiden Unternehmen, die den russischen KI-Markt beherrschen, an einem
    Tisch beim Präsidenten. Sie ist kein Aufsichts-, sondern ein Steuerungsgremium: Sie erarbeitet strategische
    Ansätze zu Schaffung, Entwicklung und Einführung von KI-Technologien, soll technologische Führerschaft
    sichern und internationale Zusammenarbeit fördern. Dass Sberbank und Yandex Mitglieder eines Präsidialgremiums
    sind, das über die Regeln entscheidet, denen sie unterliegen, ist der deutlichste Beleg dafür, dass
    Selbstregulierung in Russland kein Ausweichen vor dem Staat ist, sondern eine Form staatlicher Organisation.

    '
