  regelungsschwerpunkte:
  - Hoheitliche Anordnung der Anonymisierung durch Bescheid — kein Widerspruchsrecht des Betroffenen vorgesehen
  - Zentraler staatlicher Datenpool (ЕИП НСУД) als Infrastruktur für KI-Training
  - Vier abschließend zugelassene Anonymisierungsverfahren
  - Geheimhaltungspflicht bezüglich der eingesetzten Anonymisierungsmethodik gegenüber Dritten
  - Sanktion über Art. 13.11 KoAP RF
