- id: ru-1288702-8-deepfake-stgb
  jurisdiktion: ru
  kurztitel: Vorlage 1288702-8 — Deepfake als erschwerender Umstand
  offizieller_titel: Entwurf eines Föderationsgesetzes über Änderungen des Strafgesetzbuchs der Russischen
    Föderation (Verschärfung der strafrechtlichen Verantwortlichkeit für unter Einsatz von Technologien
    begangene Straftaten)
  originaltitel: Проект федерального закона «О внесении изменений в Уголовный кодекс Российской Федерации»
    (об ужесточении уголовной ответственности за преступления, совершённые с использованием технологий)
  transliteration: Prökt federal'nogo zakona «O vnesenii izmenenij v Ugolovnyj kodeks Rossijskoj Federacii»
  fundstelle: Duma-Vorlage
  verfahrensnummer: 1288702-8
  status: verfahren
  status_detail: 'Eingebracht am 12.08.2026. Vorgesehen ist eine Ergänzung des Art. 63 StGB RF (Umstände,
    die die Strafe schärfen) um den Einsatz künstlicher Intelligenz zur Erzeugung gefälschter Video-,
    Audio- und Bildmaterialien sowie zur Schaffung fiktiver Personen. Definiert wird der Deepfake als
    "künstliche oder veränderte Video-, Audio- oder Bildaufzeichnung, die mit neuronalen Netzen oder anderer
    Technologie erstellt wurde" und Aussehen, Stimme oder Handlungen einer Person unzutreffend wiedergibt.
    Erster Verfahrensschritt zum Recherchestand nicht bekannt.

    '
  kurzbeschreibung: 'Dritter Anlauf des russischen Gesetzgebers, Deepfakes strafrechtlich zu erfassen.
    Frühere Vorstöße seit 2024 (Ergänzung der Art. 128.1, 158, 159 StGB um ein Deepfake-Qualifikationsmerkmal)
    sind nicht Gesetz geworden. Der jetzige Ansatz ist technisch schlanker: Er schafft keinen neuen Tatbestand,
    sondern einen allgemeinen Strafschärfungsgrund, der auf jede Straftat durchschlägt. Geltendes Recht
    erfasst Deepfake-Betrug bislang nur über die allgemeinen Tatbestände (Art. 159 StGB — Betrug; Art.
    128.1 — Verleumdung) und über Art. 152.1 ZGB (Bildnisschutz).

    '
  themenachsen:
  - content
  - haftung
  - grundrechte
  regelungsschwerpunkte:
  - Ergänzung des Katalogs des Art. 63 StGB RF statt Schaffung eines Sondertatbestands
  - Erfasst ausdrücklich auch die Schaffung fiktiver Personen, nicht nur die Nachbildung realer
  - Anwendungsbereich damit vom Betrug bis zur Rechtspflegebehinderung
