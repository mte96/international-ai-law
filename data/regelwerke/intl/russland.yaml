- id: ru-152-fz
  jurisdiktion: ru
  kurztitel: Datenschutzgesetz (152-FZ)
  offizieller_titel: Föderationsgesetz über personenbezogene Daten
  originaltitel: Федеральный закон «О персональных данных»
  transliteration: Federal'nyj zakon «O personal'nych dannych»
  fundstelle: Föderationsgesetz vom 27.07.2006 Nr. 152-FZ, geltende Fassung vom 26.07.2026
  status: anwendbar
  status_detail: 'Seit 2006 in Kraft, seither über fünfzigmal geändert. Für KI einschlägig sind vier Änderungsstränge:
    242-FZ (2014, Lokalisierungspflicht), 123-FZ und 233-FZ (2020/2024, Art. 6 und 10 sowie anonymisierte
    Datenbestände), 420-FZ und 421-FZ (2024, Umsatzbußgelder und Strafbarkeit), 265-FZ (2026, Drittlandtransfer).
    Eine eigene Regelung automatisierter Einzelentscheidungen enthält Art. 16 seit 2006 — sie ist der
    russische Vorläufer des Art. 22 DSGVO und in der Praxis ohne nennenswerte Durchsetzung geblieben.

    '
  kurzbeschreibung: 'Allgemeines Datenschutzgesetz. Verarbeitung bedarf grundsätzlich der Einwilligung;
    biometrische Daten nach Art. 11 der schriftlichen Einwilligung — mit weiten Ausnahmen für Strafverfolgung,
    Verteidigung, Sicherheit und die Durchsetzung von Gerichtsentscheidungen. Genau diese Ausnahmen tragen
    die russische Gesichtserkennung. Art. 16 verbietet Entscheidungen allein aufgrund automatisierter
    Verarbeitung, die Rechtsfolgen erzeugen oder anderweitig Rechte berühren, ohne schriftliche Einwilligung,
    und gibt ein Widerspruchs- und Erläuterungsrecht — dogmatisch nahe an Art. 22 DSGVO, praktisch ohne
    erkennbare Rechtsprechung. Aufsichtsbehörde ist Roskomnadsor.

    '
  inkrafttreten:
    datum: 2007-01-26
    verifiziert: true
    quelle: https://www.zakonrf.info/zakon-o-personalnyh-dannyh/25/
    fundstelle_norm: 'Статья 25 часть 1 des 152-FZ: Inkrafttreten ''по истечении ста восьмидесяти дней
      после дня его официального опубликования''. Amtliche Veroeffentlichung ''Российская газета'' N 165
      vom 29.07.2006; SZ RF 31.07.2006 N 31 (Teil 1) Art. 3451. Daraus folgt der 26.01.2007'
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Art. 11: biometrische personenbezogene Daten — schriftliche Einwilligung als Regel, mit Ausnahmen
    für Strafverfolgung, Verteidigung, Sicherheit und Vollstreckung. Trägt die Rechtmäßigkeit der Moskauer
    Gesichtserkennung.'
  - 'Art. 16: Verbot rein automatisierter Entscheidungen ohne schriftliche Einwilligung; Widerspruchs-
    und Erläuterungsrecht. Russischer Vorläufer des Art. 22 DSGVO, ohne praktische Durchsetzung.'
  - 'Art. 18.1 Abs. 5 (eingefügt durch 242-FZ): Lokalisierungspflicht für Datenbanken russischer Bürger'
  - 'Art. 12: grenzüberschreitende Übermittlung, seit 265-FZ verschärft'
  - 'Art. 6 und 10 in der Fassung des 123-FZ und 233-FZ: Sonderregime für anonymisierte Datenbestände'
