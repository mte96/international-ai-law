  regelungsschwerpunkte:
  - 'Risikobasierte Staffelung: Anforderungen nach dem Grad der Einwirkung auf Leben und Gesellschaft;
    strengere Anforderungen im staatlichen Bereich, geringere im kommerziellen'
  - Pflichtkennzeichnung aller KI-erzeugten audiovisuellen Materialien, menschen- UND maschinenlesbar;
    Plattformpflicht zur Verifikation, Eigenkennzeichnung oder Entfernung
  - 'Drei Modellkategorien: souverän, national, vertrauenswürdig (letztere mit FSB-/FSTEK-Prüfung, Voraussetzung
    für kritische Infrastruktur)'
  - Grenzüberschreitende Modelle konnten beschränkt oder verboten werden — hierauf beruhten die Berichte
    über eine drohende Sperre von ChatGPT, Claude und Gemini
  - Entwicklung und Training ausschließlich auf russischem Territorium; internationale Zusammenarbeit
    auf gemeinsame Forschung und Datenaustausch beschränkt
  - 'Speicherpflicht: KI-Dienste mit über 500.000 Tagesnutzern hätten Nutzerdaten drei Jahre in Russland
    vorhalten müssen'
  - 'Bürgerrechte: außergerichtliche Anfechtung KI-gestützter Behördenentscheidungen, zivilrechtlicher
    Ersatzanspruch, vorgerichtliche Streitbeilegung'
  - Verschuldensproportionale Haftungsverteilung über die gesamte Wertschöpfungskette
  - 'Infrastrukturförderung: Langfriststromverträge, Steuervergünstigungen und vereinfachter Netzanschluss
    für benannte Rechenzentren'
