- id: ru-211-fz-epr-novelle
  jurisdiktion: ru
  kurztitel: ЭПР-Novelle 2026 (211-FZ)
  offizieller_titel: Föderationsgesetz über Änderungen des Föderationsgesetzes 'Über experimentelle Rechtsregime
    im Bereich digitaler und technologischer Innovationen in der Russischen Föderation'
  originaltitel: Федеральный закон «О внесении изменений в Федеральный закон «Об экспериментальных правовых
    режимах в сфере цифровых и технологических инноваций в Российской Федерации»
  transliteration: Federal'nyj zakon «O vnesenii izmenenij v Federal'nyj zakon 'Ob ėksperimental'nych
    pravovych režimach v sfere cifrovych i technologičeskich innovacij v Rossijskoj Federacii'»
  fundstelle: Föderationsgesetz vom 26.06.2026 Nr. 211-FZ
  verfahrensnummer: Vorlage 1158700-8
  status: anwendbar
  status_detail: 'Von der Staatsduma am 10.06.2026 angenommen, vom Föderationsrat am 17.06.2026 gebilligt,
    am 26.06.2026 unterzeichnet; in Kraft mit dem Tag der amtlichen Veröffentlichung. Der zentrale Schritt
    ist die Streichung der "Regulierungsbarriere" als Voraussetzung: Ein experimentelles Rechtsregime
    kann seither auch in Bereichen errichtet werden, für die überhaupt keine umfassende Regulierung besteht
    — ausdrücklich genannt: künstliche Intelligenz und industrieller Datenaustausch. Zugleich wurde die
    Höchstlaufzeit von drei auf fünf Jahre verlängert und den Teilnehmern ein Recht zum eigenen Ausstieg
    eingeräumt.

    '
  kurzbeschreibung: 'Technisch kleine, dogmatisch bemerkenswerte Novelle. Sie kehrt die Funktion des Sandkastens
    um: Bislang war er ein Instrument, um bestehendes Recht punktuell auszusetzen; jetzt kann er auch
    dort eingesetzt werden, wo es kein Recht gibt — also als Instrument vorgezogener Regelsetzung durch
    Regierungsverordnung. Für die KI-Regulierung ist das die Ergänzung zum 243-FZ: Was das Rahmengesetz
    offenlässt, kann exekutiv im Sandkasten erprobt und von dort in Verordnungsrecht überführt werden.

    '
