  regelungsschwerpunkte:
  - Streichung des Erfordernisses, dass geltendes Recht die Innovation unmöglich macht oder erheblich
    erschwert — der eigentliche Kern der Novelle
  - Verlängerung der Höchstlaufzeit von drei auf fünf Jahre
  - Selbstständiges Ausstiegsrecht der Teilnehmer
  - Möglichkeit, im Programm Teilnehmerpflichten zu begründen, die im allgemeinen Recht nicht vorgesehen
    sind — Verordnungsrecht ohne Parlament
