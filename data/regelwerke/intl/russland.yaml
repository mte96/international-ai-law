  offene_punkte:
  - 'WIDERSPRUCH: Läuft das Experiment nach dem 01.07.2025 weiter? Der Gesetzestext setzt fünf Jahre;
    die Datenbanken führen das Gesetz als geltend; eine Verlängerungsnovelle war nicht auffindbar. Das
    ist die größte ungeklärte Frage dieses Eintrags.'
