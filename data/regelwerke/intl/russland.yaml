  bedeutung_eu_anbieter: 'Das funktionale Gegenstück zu Art. 57 ff. KI-VO (Reallabore), aber mit umgekehrter
    Logik: Die KI-VO suspendiert im Reallabor keine materiellen Pflichten, sondern begleitet ihre Einhaltung.
    Das russische ЭПР suspendiert geltendes Recht. Für einen europäischen Anbieter ist die Teilnahme praktisch
    verschlossen — Antragsteller müssen russische Rechtsträger sein und die Bewertung erfolgt ministeriell
    und ermessensgeleitet.

    '
  quellenlage: 'Bestandszahlen und Novelleninhalt durch RAPSI belegt. Der Gesetzestext selbst und die
