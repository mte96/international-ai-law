    was_gilt: 'Grundbestimmungen: Regelungsgegenstand, Ziele, Definitionen, Grundsätze, Behördenkompetenzen,
      Förderung, internationale Zusammenarbeit (Art. 1-7, 11-13)'
    verifiziert: true
    quelle: https://ria.ru/20260901/rossija-2114488668.html
  - datum: 2027-03-01
    was_gilt: 'Art. 8-10: Pflichten der Entwickler souveräner/nationaler Modelle (Sicherheit, Nutzungsregeln,
      technische Dokumentation, Grenzen des Modells); Bereitstellung der Kennzeichnungsfunktion durch
      Plattformen ab 500.000 Tagesnutzern; Informationspflicht gegenüber Nutzern über Rechte an KI-Erzeugnissen
      und Nutzungsbedingungen'
    verifiziert: true
    quelle: https://mypl.pro/audit-ii/zakony/243-fz-ii
  - datum: 2032-09-01
    was_gilt: 'Ende der Übergangsfrist: Systeme in staatlich benannten sensiblen Anwendungsbereichen,
      die bislang ausländische Modelle einsetzen, müssen auf souveräne oder nationale Modelle umgestellt
      haben. Bis dahin ist der Weiterbetrieb zulässig, sofern die Datenverarbeitung ausschließlich in
      Russland erfolgt.'
    verifiziert: true
    quelle: https://www.cnews.ru/news/top/2026-06-22_vlasti_skorrektirovali_zakonoproekt
