  originaltitel: Федеральный закон «О внесении изменений в Федеральный закон «О связи» и Федеральный закон
    «Об информации, информационных технологиях и о защите информации»
  transliteration: Federal'nyj zakon «O vnesenii izmenenij v Federal'nyj zakon 'O svjazi' i Federal'nyj
    zakon 'Ob informacii, informacionnych technologijach i o zaščite informacii'»
  fundstelle: Föderationsgesetz vom 01.05.2019 Nr. 90-FZ
  status: anwendbar
  status_detail: 'In Kraft seit 01.11.2019. Verpflichtet Netzbetreiber zum Einbau technischer Mittel zur
    Abwehr von Bedrohungen (ТСПУ) und ermächtigt Roskomnadsor zur zentralisierten Verkehrssteuerung. Zum
    01.03.2026 traten weitere Verschärfungen in Kraft. Das ist die technische Grundlage, über die eine
    Sperre ausländischer KI-Dienste vollzogen würde — sie bedarf keiner Änderung des KI-Rechts.

    '
  kurzbeschreibung: 'Gibt Roskomnadsor die Fähigkeit, den Datenverkehr auf Netzebene zu filtern und einzelne
    Dienste ohne Mitwirkung der Betreiber unerreichbar zu machen. Für die KI-Regulierung ist das der stille
    Hebel: Der Märzentwurf 2026 hätte ein ausdrückliches Verbot grenzüberschreitender KI-Dienste geschaffen;
    dieses wurde gestrichen — die technische und rechtliche Fähigkeit zur Sperre besteht über 90-FZ ohnehin.
    Berichte über eine drohende Unerreichbarkeit von ChatGPT, Claude und Gemini in Russland stützen sich
    der Sache nach auf diesen Mechanismus, nicht auf das KI-Gesetz.

    '
  inkrafttreten:
