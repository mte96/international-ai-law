- id: ru-718834-8-stimme
  jurisdiktion: ru
  kurztitel: Vorlage 718834-8 — Schutz der Stimme (Art. 152.3 ZGB)
  offizieller_titel: Entwurf eines Föderationsgesetzes über Änderungen des Teils 1 des Zivilgesetzbuchs
    der Russischen Föderation (Schutz der Stimme eines Bürgers)
  originaltitel: Проект федерального закона «О внесении изменений в часть первую Гражданского кодекса
    Российской Федерации» (об охране голоса гражданина)
  transliteration: Prökt federal'nogo zakona «O vnesenii izmenenij v čast' pervuju Graždanskogo kodeksa
    Rossijskoj Federacii» (ob ochrane golosa graždanina)
  fundstelle: Duma-Vorlage
  verfahrensnummer: 718834-8
  status: verfahren
  status_detail: 'Eingebracht am 17.09.2024. Der Entwurf will das ZGB um einen Art. 152.3 ergänzen, der
    die Stimme als Objekt persönlicher Immaterialgüterrechte schützt — parallel zum Bildnisschutz des
    Art. 152.1 — und ausdrücklich auch Stimmimitation und Sprachsynthese in Echtzeit erfasst. Veröffentlichung
    und weitere Verwendung der Stimme, einschließlich synthetisch erzeugter Aufnahmen, wären nur mit Einwilligung
    zulässig. Im Oktober 2024 votierte der Rat für Kodifizierung beim Präsidenten negativ; im Januar 2025
    lehnte die Regierung den Entwurf mit der Begründung ab, die Frage sei durch geltendes Recht geregelt.
    Seither liegt die Vorlage ohne erste Lesung. Formal anhängig, praktisch erledigt.

    '
  kurzbeschreibung: 'Reaktion auf den Fall der Synchronsprecherin Aljona Andronowa, deren Stimme über
    Tinkoff VoiceKit für Dritte zugänglich wurde. Der Entwurf schließt die Lücke, die das russische Recht
    bei Stimmklonen lässt: Geschützt sind bislang die Aufnahme (Art. 1315 ZGB, Rechte des ausübenden Künstlers,
    Kompensation 10.000 bis 5.000.000 RUB) und die Stimme als biometrisches Datum (152-FZ, in der Praxis
    5.000 bis 10.000 RUB), nicht aber die synthetische Nachbildung als solche. Der Widerstand der Kodifizierungsexperten
    hat ein dogmatisches und ein politisches Motiv: die Sorge vor einer Aufblähung des Katalogs der immateriellen
    Güter (Art. 150 ZGB) und der Widerstand der Sprachtechnologiebranche.

    '
  themenachsen:
  - grundrechte
  - urheberrecht
  - content
  - datenschutz
  regelungsschwerpunkte:
  - Neuer Art. 152.3 ZGB RF nach dem Vorbild des Bildnisschutzes in Art. 152.1
  - 'Ausdrücklich erfasst: Imitation und Echtzeit-Sprachsynthese, nicht nur die Wiedergabe vorhandener
    Aufnahmen'
  - Einwilligungserfordernis auch für synthetisch erzeugte Stimmaufnahmen
  - Negativvotum des Rates für Kodifizierung (Oktober 2024) und der Regierung (Januar 2025)
