- id: ru-gesichtserkennung-moskau
  jurisdiktion: ru
  subjurisdiktion: ru-msk
  kurztitel: Gesichtserkennung im Moskauer Kamerasystem
  offizieller_titel: Einheitliches Zentrum für Datenspeicherung und -verarbeitung (ЕЦХД) der Stadt Moskau
    mit Gesichtserkennungsmodul; Rechtsgrundlage aus Art. 11 152-FZ, 123-FZ und Regierungsverordnung Nr.
    1641 vom 08.10.2020 (Verkehrssicherheit)
  originaltitel: Единый центр хранения и обработки данных города Москвы (ЕЦХД); система распознавания
    лиц «Сфера»
  transliteration: Edinyj centr chranenija i obrabotki dannych goroda Moskvy (ECChD); sistema raspoznavanija
    lic «Sfera»
  fundstelle: kein eigenes Gesetz — Zusammenspiel aus Art. 11 Abs. 2 152-FZ (Ausnahmen für Strafverfolgung,
    Verteidigung, Sicherheit), 123-FZ und untergesetzlichem Recht der Stadt Moskau
  status: anwendbar
  status_detail: 'Rechtlich der auffälligste Befund dieses Bestands: Das flächendeckendste biometrische
    Überwachungssystem Europas beruht auf keiner eigenen gesetzlichen Grundlage. Die Gerichte tragen es
    über die Ausnahmetatbestände des Art. 11 152-FZ, über Transportsicherheitsvorschriften (Regierungsverordnung
    Nr. 1641 vom 08.10.2020) und über eine Auslegung des Obersten Gerichts, wonach für Maßnahmen zum Schutz
    der Rechtsordnung und der Staatssicherheit keine Einwilligung erforderlich sei. Alle bekannten Klagen
    gegen das System sind gescheitert — zuletzt vor dem Moskauer Stadtgericht im Verfahren 33а-0710/2025
    zu den Kameras in der Metro. Der einzige gegenteilige Spruch stammt vom EGMR (Glukhin, 04.07.2023)
    und wird nicht vollzogen; Russland ist seit dem 16.09.2022 nicht mehr Vertragspartei der EMRK.

    '
  kurzbeschreibung: 'Das Moskauer System verbindet über 200.000 Kameras mit einem zentralen Speicher-
    und Analysezentrum und einem Gesichtserkennungsmodul. Es wird für Strafverfolgung, Ordnungswidrigkeitenfeststellung,
    Fahndung und — dokumentiert im Verfahren Glukhin — für die Identifizierung von Teilnehmern politischer
    Kundgebungen eingesetzt. Rechtsschutz gegen die Erfassung ist praktisch nicht zu erlangen: Klagen
    scheitern an der Beweislast (Popowa 2019/2020), an den Ausnahmetatbeständen des Art. 11 152-FZ und
    am Sicherheitsvorbehalt. Der bekannteste Missbrauchsfall — zwei Moskauer Polizisten verkauften 2020
    Daten aus dem System an eine Privatperson — endete mit Geldstrafen von 10.000 und 20.000 RUB.

    '
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'Art. 11 Abs. 2 152-FZ: Verarbeitung biometrischer Daten ohne Einwilligung, soweit gesetzlich für
    Strafverfolgung, Verteidigung, Sicherheit und Vollstreckung vorgesehen'
  - 'Regierungsverordnung Nr. 1641 vom 08.10.2020: Anforderungen an den Schutz von Verkehrsinfrastruktur,
    tragende Grundlage für die Metro-Kameras'
