- id: ru-gk-teil-4
  jurisdiktion: ru
  kurztitel: Zivilgesetzbuch Teil IV (Immaterialgüterrecht)
  offizieller_titel: Zivilgesetzbuch der Russischen Föderation (Teil vier)
  originaltitel: Гражданский кодекс Российской Федерации (часть четвёртая)
  transliteration: Graždanskij kodeks Rossijskoj Federacii (čast' četvjortaja)
  fundstelle: Föderationsgesetz vom 18.12.2006 Nr. 230-FZ, Abschnitt VII, Art. 1225-1551
  status: anwendbar
  status_detail: 'In Kraft seit 01.01.2008, geltende Fassung mit Änderungen bis 04.01.2026. Enthält keine
    KI-spezifische Norm. Die gesamte russische Rechtsprechung zu KI-Erzeugnissen wird über drei allgemeine
    Vorschriften ausgetragen: Art. 1228 (Urheber ist der Bürger, dessen schöpferische Arbeit das Ergebnis
    hervorgebracht hat), Art. 1257 (Urhebervermutung zugunsten des Benannten) und Art. 1259 (Schutzgegenstand;
    kein Schutz für Ideen und Konzepte). Für Persönlichkeitsrechte gelten Art. 152 (Ehre und Ruf), Art.
    152.1 (Bildnisschutz) und Art. 152.2 (Privatsphäre) aus Teil I. Art. 10 Abs. 2 des 243-FZ schafft
    seit 2026 eine Trainingsschranke außerhalb des Kodex — dogmatisch ein Fremdkörper.

    '
  kurzbeschreibung: 'Der russische Werkbegriff ist personal: Urheber kann nur ein Mensch sein. Die Gerichte
    haben daraus zwei gegenläufige Linien entwickelt. Die eine — Arbitragegerichte, Verfahren um Verletzungsansprüche
    — behandelt die Behauptung, ein Bild sei von einer KI erzeugt, als bloßes Bestreiten, das die Urhebervermutung
    des Art. 1257 nicht erschüttert, und stützt den Schutz auf Metadaten, Projektdateien und Arbeitsverträge.
    Die andere — Bezirksgerichte, Verfahren des behaupteten Urhebers auf Kompensation — verlangt den positiven
    Nachweis eines persönlichen schöpferischen Beitrags und wertet Prompt-Eingaben als rein technische
    Handlung. Die Divergenz ist nicht aufgelöst; der Oberste Gerichtshof bereitet seit Mai 2026 eine Übersicht
    vor.

    '
  inkrafttreten:
    datum: 2008-01-01
    verifiziert: true
    quelle: https://www.kontur-extern.ru/info/normativ/document/1/451296-federalnyy-zakon-ot-18-12-2006-n-231-fz
    fundstelle_norm: 'Статья 1 des Einfuehrungsgesetzes (Foederationsgesetz vom 18.12.2006 N 231-FZ):
      ''Ввести в действие часть четвертую Гражданского кодекса Российской Федерации (далее - часть четвертая
      Кодекса) с 1 января 2008 года.'''
  themenachsen:
  - urheberrecht
  - grundrechte
  - content
  - vertrag
  regelungsschwerpunkte:
  - 'Art. 1228: Urheber ist der Bürger, durch dessen schöpferische Arbeit das Ergebnis geschaffen wurde
    — kein Raum für maschinelle Urheberschaft'
  - 'Art. 1257: Urhebervermutung; in den Arbitragegerichten der entscheidende Hebel zugunsten des Klägers'
  - 'Art. 1259 Abs. 5: kein Schutz für Ideen, Konzepte, Methoden — Grundlage der Presnenski-Entscheidung
    von 2025'
  - 'Art. 1260: Bearbeitungen und Sammelwerke — Grundlage der Deepfake-Entscheidung von 2023'
  - 'Art. 1270: Verwertungsrechte einschließlich Bearbeitung'
  - 'Art. 1315 Abs. 4: Recht des ausübenden Künstlers auf Unversehrtheit der Darbietung — einzige Handhabe
    gegen Stimmsynthese aus eigenen Aufnahmen'
  - 'Art. 152.1 (Teil I): Bildnisschutz — Grundlage für Ansprüche gegen Deepfakes realer Personen'
