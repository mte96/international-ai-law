- id: ru-258-fz-epr
  jurisdiktion: ru
  kurztitel: Sandkastengesetz (258-FZ)
  offizieller_titel: Föderationsgesetz über experimentelle Rechtsregime im Bereich digitaler und technologischer
    Innovationen in der Russischen Föderation
  originaltitel: Федеральный закон «Об экспериментальных правовых режимах в сфере цифровых инноваций в
    Российской Федерации»
  transliteration: Federal'nyj zakon «Ob ėksperimental'nych pravovych režimach v sfere cifrovych innovacij
    v Rossijskoj Federacii»
  fundstelle: Föderationsgesetz vom 31.07.2020 Nr. 258-FZ
  verfahrensnummer: Vorlage 922869-7
  status: anwendbar
  status_detail: 'In Kraft seit 28.01.2021, zuletzt geändert durch 211-FZ vom 26.06.2026. Seit 2021 wurden
    19 experimentelle Rechtsregime (ЭПР) eingerichtet: 11 zu unbemannten Luftfahrtsystemen, 4 zu autonomem
    Landverkehr, 2 zur medizinischen Tätigkeit und 2 zu staatlichen Dienstleistungen. Über 225 Teilnehmer
    — 201 Gesellschaften, 23 Einzelunternehmer, 2 Behörden — und rund 150.000 betroffene Bürger. Ein eigenständiges
    ЭПР allein für künstliche Intelligenz gab es bis zur Novelle 2026 nicht; das war der Anlass der Novelle.

    '
  kurzbeschreibung: 'Rahmengesetz für Regulierungssandkästen. Es erlaubt der Regierung, für einzelne Vorhaben
    durch Verordnung ein Sonderregime zu errichten, in dem benannte Vorschriften des allgemeinen Rechts
    für die Teilnehmer suspendiert oder modifiziert werden. Zuständig für Bewertung und Registerführung
    ist das Ministerium für wirtschaftliche Entwicklung. Teilnehmer trifft eine Versicherungspflicht für
    Schäden aus dem Betrieb. Bis 2026 war Voraussetzung, dass geltendes Recht die Innovation unmöglich
    macht oder erheblich erschwert — was einen KI-Sandkasten ausschloss, solange KI überhaupt nicht reguliert
    war. Genau diese Voraussetzung hat die Novelle 2026 beseitigt.

    '
  inkrafttreten:
    datum: 2021-01-28
    verifiziert: true
    quelle: https://www.consultant.ru/document/cons_doc_LAW_358738/645f22663963429826dc79a35c6014d067325527/
    fundstelle_norm: 'Статья 20 des 258-FZ: ''Настоящий Федеральный закон вступает в силу по истечении
      ста восьмидесяти дней после дня его официального опубликования.'' Amtliche Veroeffentlichung am
      31.07.2020; die 180-Tage-Frist laeuft am 27.01.2021 ab, das Gesetz tritt am 28.01.2021 in Kraft'
  themenachsen:
  - governance
  - marktzugang
  - haftung
  - sektor-medizin
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - Errichtung eines ЭПР durch Regierungsverordnung; Programm bestimmt Teilnehmerkreis, suspendierte Normen
    und Laufzeit
  - Registerführung und Bewertung beim Ministerium für wirtschaftliche Entwicklung
  - Haftpflichtversicherung der Teilnehmer als Kompensation für die Suspendierung des allgemeinen Rechts
  - Laufzeit bis 2026 höchstens drei Jahre, seit 211-FZ höchstens fünf Jahre
