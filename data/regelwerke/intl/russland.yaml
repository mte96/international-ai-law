  bedeutung_eu_anbieter: 'Praktisch die wichtigste Norm dieses Bestands für einen europäischen Verantwortlichen
    mit russischer Tochtergesellschaft: Die Anordnung, Bestandsdaten zu anonymisieren und an eine staatliche
    Plattform zu übermitteln, ist datenschutzrechtlich kein freiwilliger Vorgang und lässt sich gegenüber
    der DSGVO kaum als "rechtliche Verpflichtung" im Sinne des Art. 6 Abs. 1 lit. c rechtfertigen, weil
    Art. 48 DSGVO Drittstaatsanordnungen nur unter Rechtshilfevorbehalt anerkennt. Der Konflikt ist strukturell
    und nicht durch Vertragsgestaltung auflösbar.

