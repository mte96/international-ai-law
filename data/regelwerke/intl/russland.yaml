    правонарушениях» / «О внесении изменений в Уголовный кодекс Российской Федерации и Уголовно-процессуальный
    кодекс Российской Федерации»
  transliteration: Federal'nyj zakon «O vnesenii izmenenij v Kodeks Rossijskoj Federacii ob administrativnych
    pravonarušenijach» / «…v Ugolovnyj kodeks…»
  fundstelle: Föderationsgesetze vom 30.11.2024 Nr. 420-FZ und Nr. 421-FZ
  status: anwendbar
  status_detail: 'In Kraft seit 30.05.2025. 420-FZ verschärft Art. 13.11 KoAP RF und führt Umsatzbußgelder
    für wiederholte Datenlecks ein — bis 3 % des Jahresumsatzes, mindestens 20 Mio. und höchstens 500
    Mio. RUB. 421-FZ fügt den neuen Art. 272.1 in das Strafgesetzbuch ein: rechtswidrige Nutzung, Übermittlung,
    Erhebung und Speicherung personenbezogener Daten, im schwersten Fall mit Freiheitsstrafe bis zehn
    Jahren. Für biometrische Daten gelten gesonderte, höhere Bußgeldrahmen.

    '
  kurzbeschreibung: 'Der eigentliche Sanktionsapparat des russischen Datenrechts. Er steht in keinem inhaltlichen
    Zusammenhang mit dem KI-Gesetz und ist doch dessen wichtigste Flankierung: Weil das 243-FZ selbst
    keine Sanktion kennt, wird KI-Compliance in Russland praktisch als Datenschutz-Compliance ausgetragen.
    Die Höhe der Bußgelder entspricht der Größenordnung der DSGVO, der Strafrahmen des Art. 272.1 StGB
    geht darüber hinaus — eine strafrechtliche Sanktionierung von Datenlecks als solcher kennt das Unionsrecht
    nicht.

    '
