- id: ru-123-fz-moskau
  jurisdiktion: ru
  kurztitel: Moskauer KI-Experiment (123-FZ)
  offizieller_titel: Föderationsgesetz über die Durchführung eines Experiments zur Einführung einer besonderen
    Regulierung zum Zweck der Schaffung der notwendigen Bedingungen für die Entwicklung und Einführung
    von Technologien der künstlichen Intelligenz im Subjekt der Russischen Föderation — der Stadt föderaler
    Bedeutung Moskau, über Besonderheiten der Verarbeitung personenbezogener Daten bei der Bildung regionaler
    Datenbestände und über Änderungen der Artikel 6 und 10 des Föderationsgesetzes 'Über personenbezogene
    Daten'
  originaltitel: Федеральный закон «О проведении эксперимента по установлению специального регулирования
    в целях создания необходимых условий для разработки и внедрения технологий искусственного интеллекта
    в субъекте Российской Федерации — городе федерального значения Москве и внесении изменений в статьи
    6 и 10 Федерального закона «О персональных данных»
  transliteration: Federal'nyj zakon «O provedenii ėksperimenta po ustanovleniju special'nogo regulirovanija
    v celjach sozdanija neobchodimych uslovij dlja razrabotki i vnedrenija technologij iskusstvennogo
    intellekta v sub''ekte Rossijskoj Federacii — gorode federal'nogo značenija Moskve…»
  fundstelle: Föderationsgesetz vom 24.04.2020 Nr. 123-FZ
  subjurisdiktion: ru-msk
  status: anwendbar
  status_detail: 'In Kraft seit 01.07.2020. Das Experiment war auf fünf Jahre angelegt, mithin bis 01.07.2025.
    Eine ausdrückliche Verlängerung ließ sich nicht belegen; das Beratungszentrum CPK42 hält fest, das
    Gesetz sei "formal weiterhin gültig und nicht aufgehoben", Kontur.Normativ weist für die geltende
    Fassung ein Wirkdatum 01.09.2025 aus. Die Novelle 233-FZ vom 08.08.2024 hat die Vorschriften über
    anonymisierte Datenbestände zum 01.01.2025 bzw. 01.09.2025 erweitert, was gegen eine stille Erledigung
    spricht. Der Status ist deshalb als offen zu behandeln.

    '
  kurzbeschreibung: 'Erstes russisches Gesetz mit KI-Bezug überhaupt und bis 2026 die einzige gesetzliche
    Definition der künstlichen Intelligenz im russischen Recht: KI sind technologische Lösungen, die kognitive
    Funktionen des Menschen nachbilden, einschließlich Selbstlernen, und dabei mit menschlicher intellektueller
    Tätigkeit vergleichbare Ergebnisse erzielen. Kern des Gesetzes ist nicht die KI-Regulierung, sondern
    eine datenschutzrechtliche Sonderregelung: Die Moskauer Stadtverwaltung darf aus anonymisierten personenbezogenen
    Daten regionale Datenbestände bilden und diese Behörden sowie zertifizierten russischen Betreibern
    zugänglich machen. Für die Erhebung biometrischer Daten gilt eine Vorankündigungsfrist von 30 Tagen
    mit Widerspruchsmöglichkeit. Die Daten dürfen nicht an Nichtteilnehmer weitergegeben werden und sind
    bei Verlust des Teilnehmerstatus zu vernichten. Ein Koordinierungsrat begleitet das Experiment.

    '
  inkrafttreten:
    datum: 2020-07-01
    verifiziert: true
    quelle: https://www.consultant.ru/document/cons_doc_LAW_351127/
  anwendungsdaten:
  - datum: 2025-07-01
    was_gilt: Ablauf der gesetzlichen Fünfjahresfrist des Experiments — Fortgeltung ungeklärt
    verifiziert: false
    quelle: https://normativ.kontur.ru/document?moduleId=1&documentId=501357
  themenachsen:
  - datenschutz
  - governance
  - grundrechte
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Art. 2: Legaldefinition der künstlichen Intelligenz — bis 2026 die einzige im russischen Recht'
  - 'Art. 3: Ziele — Lebensqualität, Effizienz von Verwaltung und Wirtschaft, und ausdrücklich: Erarbeitung
    einer umfassenden KI-Regulierung auf Grundlage der Ergebnisse'
  - 'Art. 6.1/6.2: Bildung regionaler Datenbestände aus anonymisierten personenbezogenen Daten; Zugang
    für Behörden und zertifizierte russische Betreiber'
  - 'Biometrische Daten: Erhebung mit 30-tägiger Vorankündigung und Widerspruchsmöglichkeit'
  - Weitergabeverbot an Nichtteilnehmer; Vernichtungspflicht bei Verlust des Teilnehmerstatus
  - 'Art. 7: Änderung der Art. 6 und 10 des 152-FZ — der Sandkasten greift unmittelbar in das allgemeine
    Datenschutzrecht durch'
