- id: ru-markierung-abgelehnt-2026
  jurisdiktion: ru
  kurztitel: Abgelehnte Vorlage 'Made by AI' (Juni 2026)
  offizieller_titel: Entwurf eines Föderationsgesetzes über die obligatorische Kennzeichnung von mit künstlicher
    Intelligenz erzeugten Inhalten
  originaltitel: Законопроект об обязательной маркировке контента, созданного с использованием искусственного
    интеллекта
  transliteration: Zakonoprökt ob objazatel'noj markirovke kontenta, sozdannogo s ispol'zovaniem iskusstvennogo
    intellekta
  fundstelle: Duma-Vorlage; Nummer in den erreichbaren Quellen nicht genannt
  verfahrensnummer: nicht ermittelt
  status: gescheitert
  status_detail: 'Am 10.06.2026 im Plenum der Staatsduma abgelehnt. Initiatoren waren die Abgeordneten
    Dmitrij Gussew, Alexej Shurawljow und Michail Deljagin. Vorgesehen war eine Pflicht, alle KI-erzeugten
    Inhalte — Video, Bild und ausdrücklich auch Text — mit dem Label "Сделано ИИ" ("Made by AI") zu versehen,
    mit rechtlichen Folgen bei Verstoß. Gussew stützte sich auf Umfragen, wonach 70 % der Bürger Deepfake-Videos
    nicht von echten unterscheiden könnten. Der Abgeordnete Anton Gorelkin — der einflussreichste Fachpolitiker
    im Informationspolitik-Ausschuss — hielt entgegen, die Norm sei schwer vollziehbar: Es sei ungeklärt,
    wer für die Richtigkeit der Kennzeichnung einstehe und in welcher Produktionsphase sie anzubringen
    sei; administrative Maßnahmen könnten die KI-Entwicklung ohnehin nicht bremsen. Die Ablehnung erklärt
    unmittelbar, warum sechs Wochen später Art. 9 des 243-FZ nur ein Kennzeichnungsrecht und keine Kennzeichnungspflicht
    enthält.

    '
  kurzbeschreibung: 'Gescheiterter Versuch, in Russland eine Kennzeichnungspflicht nach dem Muster des
    chinesischen Kennzeichnungsregimes und des Art. 50 KI-VO einzuführen. Die Ablehnung ist der wichtigste
    einzelne Beleg dafür, dass die Freiwilligkeit des russischen Kennzeichnungsmodells eine bewusste gesetzgeberische
    Entscheidung ist und kein Redaktionsversehen.

    '
  themenachsen:
  - content
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - Kennzeichnungslabel 'Сделано ИИ' für Video, Bild UND Text — weiter als Art. 9 des 243-FZ, der Text
    ausklammert
  - Ablehnungsgrund war nicht der Regelungszweck, sondern die Zurechnungs- und Vollzugsfrage
