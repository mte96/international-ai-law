- id: ru-abd-vorstoss-pdn
  jurisdiktion: ru
  kurztitel: 'Vorstoß der Big-Data-Assoziation: KI-Training ohne Einwilligung'
  offizieller_titel: Vorschlag der Assoziation der Teilnehmer des Marktes für große Daten (Ассоциация
    больших данных) an das Ministerium für digitale Entwicklung zur Änderung des Föderationsgesetzes 'Über
    personenbezogene Daten'
  originaltitel: Предложения Ассоциации больших данных (АБД) по изменению Федерального закона «О персональных
    данных» в части использования персональных данных для разработки искусственного интеллекта
  transliteration: Predloženija Associacii bol'šich dannych (ABD) po izmeneniju Federal'nogo zakona «O
    personal'nych dannych»
  fundstelle: Schreiben der Assoziation an das Ministerium für digitale Entwicklung, 03.08.2026
  status: idee
  status_detail: 'Am 03.08.2026 an das Ministerium für digitale Entwicklung übermittelt. Getragen von
    rund 15 russischen IT- und Finanzunternehmen — Sberbank, Yandex, VK, Avito, Rostelecom, MTS, Beeline,
    HeadHunter, T-Bank (vormals Tinkoff), Gazprombank und weitere. Kein Gesetzentwurf, keine Vorlagennummer;
    die Reaktion des Ministeriums war zum Recherchestand nicht dokumentiert.

    '
  kurzbeschreibung: 'Die Assoziation verlangt, personenbezogene Daten russischer Bürger ohne deren Einwilligung
    für die KI-Entwicklung nutzen zu dürfen, sofern datenschutzfreundliche Technologien (PETs) das Identifizierungsrisiko
    auf null oder unter ein Prozent senken. Vorgeschlagen werden eine Änderung des 152-FZ, die Einführung
    eines staatlich akkreditierten "vertrauenswürdigen Vermittlers" und eine Unterscheidung zwischen entgeltlichen
    und unentgeltlichen Daten. Der Vorstoß ist der Beleg dafür, dass die Trainingsschranke des Art. 10
    Abs. 2 des 243-FZ nach Auffassung der Branche nicht ausreicht — sie erfasst Urheberrechte, nicht personenbezogene
    Daten. Er ist zugleich der wahrscheinlichste nächste Regulierungsschritt.

    '
  themenachsen:
  - datenschutz
  - gpai
  - wettbewerb
  - governance
  regelungsschwerpunkte:
  - Verzicht auf die Einwilligung bei Einsatz von PETs mit Restidentifizierungsrisiko unter einem Prozent
  - Staatlich akkreditierter 'vertrauenswürdiger Vermittler' als Datentreuhänder
  - Unterscheidung entgeltlicher und unentgeltlicher Daten — Ansatz eines Datenmarkts
