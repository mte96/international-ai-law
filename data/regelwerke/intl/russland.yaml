  status: softlaw
  status_detail: 'Bis Juni 2025 über 900 unterzeichnende Organisationen, darunter mehr als 80 ausländische.
    Auf dem Globalen Digitalen Forum am 06.06.2025 traten 33 Organisationen aus 22 Staaten bei — unter
    anderem Bangladesch, Burundi, Ghana, Indien, Indonesien, Irak, Kenia, Kirgisistan, Kuba, Marokko,
    Myanmar, Niger, Nigeria, Portugal, Serbien, Saudi-Arabien, Tansania, Uganda, Philippinen, Äthiopien
    und das Vereinigte Königreich. Generalsekretär des Allianznetzwerks ist Andrej Nesnamow, zugleich
    Geschäftsführer des Zentrums für menschenzentrierte KI der Sberbank.

    '
  kurzbeschreibung: 'Freiwilliger Verhaltenskodex nach dem Muster einer Branchenselbstverpflichtung, getragen
    von der Allianz im Bereich der KI — dem Verband, in dem Sberbank, Yandex, VK, MTS, Gazprom Neft und
    die Russische Direktinvestitionsgesellschaft zusammengeschlossen sind. Grundsätze: menschenzentrierter
    Ansatz, Risikobewusstsein, Verantwortlichkeit, Transparenz, Nichtdiskriminierung, Sicherheit, Datenschutz.
    Eine Kommission zur Umsetzung führt ein Register der Unterzeichner und behandelt Beschwerden. Der
    Kodex war von 2021 bis 2026 der einzige verallgemeinerte Regelbestand für KI in Russland; die Allianz
    hat 2024 ausdrücklich die Position vertreten, ein Ethikkodex sei einem umfassenden Gesetz vorzuziehen.
    Diese Position hat sich im Gesetzgebungsverfahren 2026 weitgehend durchgesetzt.

    '
