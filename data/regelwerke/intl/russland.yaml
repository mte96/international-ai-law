regelwerke:
- id: ru-243-fz-ki
  jurisdiktion: ru
  kurztitel: KI-Gesetz (243-FZ)
  offizieller_titel: Föderationsgesetz über die Unterstützung der Entwicklung von Technologien der künstlichen
    Intelligenz in der Russischen Föderation
  originaltitel: Федеральный закон «О поддержке развития технологий искусственного интеллекта в Российской
    Федерации»
  transliteration: Federal'nyj zakon «O podderžke razvitija technologij iskusstvennogo intellekta v Rossijskoj
    Federacii»
  fundstelle: Föderationsgesetz vom 26.07.2026 Nr. 243-FZ; amtliche Veröffentlichung publication.pravo.gov.ru,
    Registriernummer 0001202607260003
  verfahrensnummer: Duma-Vorlage Nr. 1271570-8
  status: teilanwendbar
  status_detail: 'Seit 01.09.2026 in Kraft. Die Artikel 8 bis 10 — also gerade die Bestimmungen, die tatsächlich
    Pflichten begründen (Pflichten der Entwickler souveräner und nationaler Modelle, Kennzeichnungs- infrastruktur,
    Nutzerinformation über Rechte an Erzeugnissen) — gelten erst ab 01.03.2027. Für Systeme, die bereits
    ausländische Modelle einsetzen, läuft eine Übergangsfrist bis 01.09.2032. Wesentliche Konkretisierungen
    (Verfahren der Statusfeststellung, Sektoren mit Pflicht zu inländischen Modellen, Datenzugang) sind
    in Regierungsverordnungen verlagert, die zum Recherchestand noch nicht vorlagen.

    '
  kurzbeschreibung: 'Erstes russisches Gesetz zur künstlichen Intelligenz, 13 Artikel, Rahmengesetz. Es
    regelt nicht KI insgesamt, sondern "große fundamentale Modelle": Programme mit mindestens einer Milliarde
    Parametern, die auf trainierten Algorithmen beruhen, als Grundlage weiterer Software dienen und für
    eine Vielzahl unterschiedlicher Aufgaben taugen. Kreditscoring, Betrugserkennung, Bilderkennung, Dokumentenklassifikation
    und regelbasierte Chatbots fallen damit heraus. Das Gesetz schafft zwei privilegierte Statuskategorien
    — "souveränes" Modell (durchgängig von russischen Rechtsträgern entwickelt, Verarbeitung in russischen
    Rechenzentren, staatliche Konformitätsfeststellung) und "nationales" Modell (Fremdkomponenten unter
    offener Lizenz zulässig, Steuerung der Kernmerkmale beim russischen Entwickler). An diese Kategorien
    knüpft es Zugang zu staatlichen Daten, Fördermittel, Versicherungsmöglichkeiten und eine Trainingsschranke
    im Urheberrecht. Sanktionen enthält das Gesetz nicht; Verstöße richten sich nach allgemeinem Recht
    (Datenschutz, Verbraucherschutz, Deliktsrecht).

    '
  inkrafttreten:
    datum: 2026-09-01
    verifiziert: true
    quelle: http://publication.pravo.gov.ru/document/0001202607260003
  anwendungsdaten:
