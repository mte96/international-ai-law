  bedeutung_eu_anbieter: 'Die russische Rechtslage ähnelt der deutschen mehr als der amerikanischen: personaler
    Werkbegriff, keine work-made-for-hire- Konstruktion, Schutz nur bei nachweisbarem schöpferischen Beitrag.
    Der Unterschied liegt beim Training — Art. 10 Abs. 2 des 243-FZ kennt kein Opt-out, § 44b Abs. 3 UrhG
    und Art. 4 Abs. 3 DSM-RL schon.

