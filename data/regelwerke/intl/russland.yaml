- id: ru-265-fz-transfer
  jurisdiktion: ru
  kurztitel: Drittlandtransfer-Novelle 2026 (265-FZ)
  offizieller_titel: Föderationsgesetz über Änderungen des Artikels 12 des Föderationsgesetzes 'Über personenbezogene
    Daten' und einzelner Gesetzgebungsakte der Russischen Föderation
  originaltitel: Федеральный закон «О внесении изменений в статью 12 Федерального закона «О персональных
    данных» и отдельные законодательные акты Российской Федерации»
  transliteration: Federal'nyj zakon «O vnesenii izmenenij v stat'ju 12 Federal'nogo zakona 'O personal'nych
    dannych' i otdel'nye zakonodatel'nye akty Rossijskoj Federacii»
  fundstelle: Föderationsgesetz vom 26.07.2026 Nr. 265-FZ
  status: anwendbar
  status_detail: 'Vom Föderationsrat am 17.07.2026 gebilligt, am 26.07.2026 unterzeichnet — am selben
    Tag wie das KI-Gesetz und Teil desselben Pakets von elf Gesetzen. Die Novelle beendet die automatische
    Anerkennung von Staaten als angemessenes Schutzniveau allein aufgrund ihrer Mitgliedschaft in der
    Datenschutzkonvention des Europarats von 1981 (ETS 108). Roskomnadsor muss künftig zusätzlich prüfen,
    ob im Zielstaat tatsächlich Maßnahmen zur Einhaltung der Grundprinzipien, der Vertraulichkeit und
    der Datensicherheit bestehen. Die bisherige Liste umfasst 89 Staaten und kann erheblich schrumpfen.
    Für nicht gelistete Staaten gilt statt der bloßen Anzeige ein Genehmigungsverfahren mit zehntägiger
    Wartefrist.

    '
  kurzbeschreibung: 'Die stillste, aber für europäische Anbieter folgenreichste Änderung des Juli-Pakets
    2026. Sie verwandelt die Angemessenheitsentscheidung von einem formalen in einen politischen Akt und
    macht jede Datenübermittlung aus Russland in die EU von einer Einzelfallbewertung durch Roskomnadsor
    abhängig. In der Sache ist das die Spiegelbildlichkeit zum europäischen Angemessenheitsbeschluss —
    mit dem Unterschied, dass die Bewertung nicht veröffentlicht und nicht justiziabel ist. Sanktionen
    bis 3 Mio. RUB, in Straftatbeständen bis zehn Jahre Freiheitsstrafe.

    '
