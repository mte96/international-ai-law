  offene_punkte:
  - Ob und in welchem Umfang die ЕИП НСУД tatsächlich für das Training der 'souveränen' Modelle geöffnet
    wurde, ist nicht belegt. Art. 6 des 243-FZ verspricht Entwicklern Zugang zu staatlichen Daten, benennt
    die Plattform aber nicht.
  - Ob die vier Verfahren dem Anonymisierungsbegriff des Art. 4 Nr. 1 DSGVO bzw. ErwG 26 standhalten,
    ist offen — 'Einführung von Identifikatoren' und 'Dekomposition' sind der Sache nach Pseudonymisierungstechniken.
