- id: ru-233-fz-anonymisierung
  jurisdiktion: ru
  kurztitel: Anonymisierungsnovelle (233-FZ)
  offizieller_titel: Föderationsgesetz über Änderungen des Föderationsgesetzes 'Über personenbezogene
    Daten' und des Föderationsgesetzes 'Über die Durchführung eines Experiments zur Einführung einer besonderen
    Regulierung … in der Stadt föderaler Bedeutung Moskau'
  originaltitel: Федеральный закон «О внесении изменений в Федеральный закон «О персональных данных» и
    Федеральный закон «О проведении эксперимента по установлению специального регулирования … в городе
    федерального значения Москве»
  transliteration: Federal'nyj zakon «O vnesenii izmenenij v Federal'nyj zakon 'O personal'nych dannych'
    i Federal'nyj zakon 'O provedenii ėksperimenta…'»
  fundstelle: Föderationsgesetz vom 08.08.2024 Nr. 233-FZ; amtliche Veröffentlichung publication.pravo.gov.ru,
    Registriernummer 0001202408080031
  status: anwendbar
  status_detail: 'Gestaffelt in Kraft: Teile zum 01.01.2025, die praktisch wichtigsten Pflichten zum 01.09.2025.
    Seither können das Ministerium für digitale Entwicklung und das Moskauer IT-Departement Datenverantwortliche
    durch Bescheid verpflichten, personenbezogene Daten zu anonymisieren und an die Einheitliche Informationsplattform
    des Nationalen Datenverwaltungssystems (ЕИП НСУД) zu übermitteln. Vier Anonymisierungsverfahren sind
    zugelassen. Verstöße unterfallen Art. 13.11 KoAP.

    '
  kurzbeschreibung: 'Die eigentliche Trainingsdatenpolitik Russlands — sie steht nicht im KI-Gesetz. Das
    Gesetz verwandelt die Anonymisierung von einer Option des Verantwortlichen in eine hoheitlich anordenbare
    Pflicht und schafft mit der ЕИП НСУД einen staatlichen Datenpool, aus dem KI-Entwicklung gespeist
    werden soll. Verantwortliche müssen interne Anonymisierungsrichtlinien erlassen, die Dokumentation
    getrennt von den Ausgangsdaten aufbewahren, ein Verzeichnis der Anonymisierungsvorgänge führen und
    Dritten den Zugang zu Verfahren und Methodik verwehren. Zugelassene Verfahren: Einführung von Identifikatoren,
    Veränderung von Zusammensetzung und Semantik, Dekomposition (Aufteilung in getrennt gespeicherte Teilmengen)
    und Mischen (Permutation von Datensätzen).

    '
  inkrafttreten:
    datum: 2024-08-08
    verifiziert: true
