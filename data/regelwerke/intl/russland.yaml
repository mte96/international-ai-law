    fundstelle_norm: 'Статья 3 часть 1 des 233-FZ: ''Настоящий Федеральный закон вступает в силу со дня
      его официального опубликования, за исключением положений, для которых настоящей статьей установлен
      иной срок вступления их в силу.'' Amtliche Veroeffentlichung publication.pravo.gov.ru am 08.08.2024
      (Reg.-Nr. 0001202408080031). Часть 2 статьи 3: ''Пункты 1 - 3, 5 статьи 1, статья 2 настоящего Федерального
      закона вступают в силу с 1 сентября 2025 года.'''
