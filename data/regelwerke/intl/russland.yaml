- id: ru-strategie-490
  jurisdiktion: ru
  kurztitel: Nationale KI-Strategie bis 2030 (Erlass 490 i.d.F. 124/2024)
  offizieller_titel: Erlass des Präsidenten der Russischen Föderation 'Über die Entwicklung der künstlichen
    Intelligenz in der Russischen Föderation' nebst der 'Nationalen Strategie zur Entwicklung der künstlichen
    Intelligenz für den Zeitraum bis 2030'
  originaltitel: Указ Президента Российской Федерации «О развитии искусственного интеллекта в Российской
    Федерации» (вместе с «Национальной стратегией развития искусственного интеллекта на период до 2030
    года»)
  transliteration: Ukaz Prezidenta Rossijskoj Federacii «O razvitii iskusstvennogo intellekta v Rossijskoj
    Federacii» (vmeste s «Nacional'noj strategiej razvitija iskusstvennogo intellekta na period do 2030
    goda»)
  fundstelle: Erlass Nr. 490 vom 10.10.2019, in der Fassung des Erlasses Nr. 124 vom 15.02.2024
  status: softlaw
  status_detail: 'Gilt fort. Der Erlass Nr. 124 vom 15.02.2024 hat die Strategie grundlegend neu gefasst:
    Der Zeithorizont wurde von 2024/2030 auf 2030 vereinheitlicht, generative KI und große Sprachmodelle
    wurden als eigener Gegenstand aufgenommen, Rechenleistung und Datenverfügbarkeit als kritische Ressourcen
    benannt und die "technologische Souveränität" zum Leitbegriff erhoben. Die Strategie ist der Bezugsrahmen,
    aus dem das 243-FZ seine Kategorien bezieht — der Begriff des souveränen Modells ist dort politisch
    vorgeprägt.

    '
  kurzbeschreibung: 'Kein Gesetz, sondern Präsidialerlass mit Bindungswirkung für die Verwaltung. Die
    Strategie definiert KI, formuliert Grundsätze (Schutz der Menschenrechte, Sicherheit, Transparenz,
    technologische Souveränität, Integrität des Innovationszyklus, vernünftige Sparsamkeit, Unterstützung
    des Wettbewerbs) und benennt Ziele in elf Handlungsfeldern: Grundlagenforschung, Softwareentwicklung,
    Daten- und Hardwareverfügbarkeit, Fachkräfte, Infrastruktur, Entwicklerförderung, Kompetenzen, Einführung
    in Wirtschaftszweigen, vertrauenswürdige KI, Regulierung und Sicherheit, internationale Zusammenarbeit.
    Die Umsetzung erfolgt über den föderalen Projektstrang "Datenwirtschaft" und über den Analytischen
    Zentrum bei der Regierung.

    '
  inkrafttreten:
    datum: 2019-10-10
    verifiziert: true
    quelle: https://www.consultant.ru/document/cons_doc_LAW_335184/
  anwendungsdaten:
