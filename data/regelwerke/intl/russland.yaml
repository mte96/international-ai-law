- id: ru-572-fz-biometrie
  jurisdiktion: ru
  kurztitel: Biometriegesetz (572-FZ)
  offizieller_titel: Föderationsgesetz über die Durchführung der Identifizierung und (oder) Authentifizierung
    natürlicher Personen unter Verwendung biometrischer personenbezogener Daten, über Änderungen einzelner
    Gesetzgebungsakte der Russischen Föderation und über das Außerkrafttreten einzelner Bestimmungen von
    Gesetzgebungsakten der Russischen Föderation
  originaltitel: Федеральный закон «Об осуществлении идентификации и (или) аутентификации физических лиц
    с использованием биометрических персональных данных, о внесении изменений в отдельные законодательные
    акты Российской Федерации и признании утратившими силу отдельных положений законодательных актов Российской
    Федерации»
  transliteration: Federal'nyj zakon «Ob osuščestvlenii identifikacii i (ili) autentifikacii fizičeskich
    lic s ispol'zovaniem biometričeskich personal'nych dannych…»
  fundstelle: Föderationsgesetz vom 29.12.2022 Nr. 572-FZ
  status: anwendbar
  status_detail: 'Gestaffelt seit 01.06.2023 in Kraft. Grundregel: Identifizierung — also die Feststellung,
    WER jemand ist — darf ausschließlich über das staatliche Einheitliche Biometrische System (Единая
    биометрическая система, ЕБС) erfolgen; die Authentifizierung — die Bestätigung einer behaupteten Identität
    — auch über akkreditierte Systeme privater Organisationen. Private biometrische Datenbanken mussten
    an die ЕБС übertragen oder gelöscht werden. Nötigung zur Abgabe von Biometrie ist verboten, ebenso
    die Verweigerung einer Leistung wegen verweigerter Biometrie, soweit nicht ein Bundesgesetz etwas
    anderes bestimmt.

    '
  kurzbeschreibung: 'Zentralisierung der Biometrie im Staat. Das Gesetz verstaatlicht die Identifizierungsfunktion
    und macht die ЕБС zur alleinigen Infrastruktur; private Gesichtserkennung ist damit auf Authentifizierungsszenarien
    beschränkt. Verarbeitung setzt grundsätzlich die schriftliche Einwilligung nach Art. 11 152-FZ voraus.
    Verstöße: 300.000 bis 700.000 RUB für juristische Personen bei Verarbeitung ohne Einwilligung, 15
    bis 20 Mio. RUB bei einem Leck biometrischer Daten. Erfasst ist jeder Einsatz, bei dem Technik Personen
    wiedererkennt — Zutrittskontrolle, Zeiterfassung, Sprachbots, mobile Anwendungen.

    '
  inkrafttreten:
    datum: 2023-06-01
    verifiziert: true
    quelle: https://www.kontur-extern.ru/info/normativ/document/1/494836-federalnyy-zakon-ot-29-12-2022-n-572-fz
    fundstelle_norm: 'Статья 27 des 572-FZ (gestaffeltes Inkrafttreten). Hauptteil am 01.06.2023 — Kontur.Normativ
      weist saemtliche Aenderungen anderer Gesetze durch dieses Gesetz mit ''(с 01.06.2023)'' aus; Пункт
