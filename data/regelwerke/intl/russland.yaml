  originaltitel: Национальные стандарты Российской Федерации в области искусственного интеллекта; Технический
    комитет по стандартизации № 164 «Искусственный интеллект»
  transliteration: Nacional'nye standarty Rossijskoj Federacii v oblasti iskusstvennogo intellekta; Techničeskij
    komitet po standartizacii № 164 «Iskusstvennyj intellekt»
  fundstelle: Erlasse von Rosstandart; Registrierung in der Datenbank rst.gov.ru
  status: softlaw
  status_detail: 'Freiwillig anwendbar, faktisch verbindlich über die öffentliche Auftragsvergabe (44-FZ
    und 223-FZ) und über die Bezugnahme in Gerichtsverfahren. Das TK 164 wurde 2019 auf Grundlage des
    RVK-Zentrums eingerichtet. Ein großer Teil des Bestands sind Übernahmen internationaler ISO/IEC-Normen.
    Fünf zentrale Standards wurden durch Rosstandart-Erlasse vom 28.10.2024 genehmigt und traten am 01.01.2025
    in Kraft.

    '
  kurzbeschreibung: 'Der russische Normungsbestand zu KI ist überwiegend ISO-abgeleitet und damit — bemerkenswerterweise
    — die einzige Ebene des russischen KI-Rechts, die international anschlussfähig geblieben ist. Zentrale
    Normen: GOST R ISO/IEC 42001-2024 (KI-Managementsystem, identische Übernahme von ISO/IEC 42001:2023),
    GOST R 71539-2024 (Lebenszyklen von KI-Systemen, modifizierte Übernahme von ISO/IEC 5338:2023), GOST
    R 71540-2024 (Referenzarchitektur Wissenstechnik, aus ISO/IEC 5392:2024), GOST R 71484.1-2024 und
    71484.3-2024 (Datenqualität, aus ISO/IEC 5259-1 und -3:2024). Hinzu kommen ältere Normen der Reihe
    GOST R 59276-2020 ff. (Vertrauenswürdigkeit), GOST R 59921.x (KI in der Medizin) und GOST R 71476-2024
    (Begriffe). Die Normen konkretisieren, was das 243-FZ als "Sicherheit" und "technische Dokumentation"
    nur benennt.

    '
