    was_gilt: Veröffentlichung als EN 18286:2026.
    verifiziert: true
    quelle: https://www.cencenelec.eu/news-events/news/2026/en-in-the-spotlight/2026-07-30-ai-quality-management/
  themenachsen:
  - governance
  - marktzugang
  bedient_artikel: Art. 17 Abs. 1 KI-VO (Qualitätsmanagementsystem); Anhang ZA erfasst zusätzlich Art.
    11 Abs. 1 Satz 1 (technische Dokumentation)
  bearbeitungsstand: veröffentlicht; ABl.-Zitierung ausstehend
  rechtswirkung: 'Derzeit keine. Erst mit der Zitierung im Amtsblatt entsteht die widerlegliche Vermutung
    nach Art. 40 Abs. 1 KI-VO, dass ein nach dieser Norm betriebenes QMS Art. 17 Abs. 1 KI-VO genügt.
    Bis dahin ist die Anwendung freiwillig und beweisrechtlich lediglich ein Indiz. Wer die Norm heute
    umsetzt, kauft Vorbereitungszeit, keine Rechtssicherheit.

    '
  regelungsschwerpunkte:
  - 'Zehn normative Abschnitte: allgemeine Anforderungen, Dokumentation, Leitungsverantwortung, Planung
    und unterstützende Prozesse, Produktrealisierung, Betrieb und Steuerung, Leistungsbewertung und Verbesserung.'
  - 'Anhang ZA — der rechtlich entscheidende Teil: Zuordnungstabelle Norm/Artikel. Ohne ihn keine Vermutungswirkung.'
  - Deckt die sieben Anforderungsbereiche der Art. 9-15 KI-VO prozessual ab (Risikomanagement, Daten und
    Data Governance, technische Dokumentation, Aufzeichnung, Transparenz, menschliche Aufsicht, Genauigkeit/Robustheit/Cybersicherheit),
    ohne sie inhaltlich zu ersetzen — dafür sind prEN 18228 ff. zuständig.
  - Lieferantensteuerung und Änderungsmanagement sind eigenständige Pflichtelemente — praktisch relevant
    für Anbieter, die Basismodelle Dritter integrieren.
  - Beobachtung nach dem Inverkehrbringen ist Teil des QMS, nicht nachgelagert — das entspricht Art. 72
    KI-VO.
  bedeutung_praxis: 'Für einen Anbieter, der 2027 ein Hochrisikosystem in Verkehr bringen will, ist dies
    die einzige heute vollständig lesbare Beschreibung dessen, was Art. 17 KI-VO verlangt. Wer bereits
    ISO/IEC 42001 betreibt, hat die Governance-Ebene, nicht aber die anbieterbezogenen Regulierungspflichten
    (technische Dokumentation, Beobachtung nach Inverkehrbringen, Lieferantenaufsicht). Die Norm ist kostenpflichtig
    über die nationalen Normungsinstitute (in Deutschland Beuth/DIN) zu beziehen — ein eigenständiges
    praktisches Problem, weil der faktische Prüfmaßstab hinter einer Bezahlschranke liegt.

    '
