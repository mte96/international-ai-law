- id: g7-hiroshima-ki-prozess
  jurisdiktion: g7
  kurztitel: 'G7-Hiroshima-Prozess: Leitprinzipien und Verhaltenskodex'
  offizieller_titel: 'Hiroshima Process International Guiding Principles for Organizations Developing
    Advanced AI Systems und Hiroshima Process International Code of Conduct for Organizations Developing
    Advanced AI Systems, beide vom 30. Oktober 2023

    '
  fundstelle: G7-Erklärung der Staats- und Regierungschefs zum Hiroshima-KI-Prozess vom 30.10.2023
  verfahrensnummer: japanische G7-Präsidentschaft 2023; Fortschreibung unter französischer Präsidentschaft
    2026
  status: softlaw
  status_detail: 'In Kraft als politische Selbstverpflichtung, laufend fortgeschrieben. Die Ministererklärung
    zu Digitales und Technologie vom 29.05.2026 (französische Präsidentschaft, Paris) würdigt den überarbeiteten
    HAIP-Berichtsrahmen als „key multi-stakeholder platform“ und begründet neue Arbeitsstränge: Vergleichbarkeit
    von KI-Risikobewertungsrahmen gemeinsam mit dem Internationalen Netzwerk für fortgeschrittene KI-Messung
    und -Evaluierung und der OECD, eine Vision zu KI-Offenheit, ein Werkzeug zur KI-Reife kleiner und
    mittlerer Unternehmen mit der OECD und gemeinsame Grundsätze zum Schutz Minderjähriger im Netz.

    '
  kurzbeschreibung: 'Die Leitprinzipien richten sich an Staaten und Organisationen, der Verhaltenskodex
    an Organisationen, die die fortgeschrittensten KI-Systeme entwickeln — Basismodelle und generative
    Systeme. Elf Handlungsfelder: Risikoidentifikation und -minderung über den Lebenszyklus; Beobachtung
    nach dem Inverkehrbringen; öffentliche Berichterstattung über Fähigkeiten, Grenzen und geeignete Verwendungsbereiche;
    Informationsaustausch über Sicherheitsrisiken; Governance und Risikomanagement einschließlich Offenlegung;
    Sicherheitsvorkehrungen einschließlich Insider-Bedrohungen; Inhaltsauthentifizierung, wo technisch
    machbar, etwa durch Wasserzeichen; Forschung zu Risikominderung; Ausrichtung auf gesellschaftliche
    Herausforderungen; Mitwirkung an internationalen technischen Normen; Datenqualität und Achtung von
    Datenschutz- und Immaterialgüterrechten.

    '
  inkrafttreten:
    datum: 2023-10-30
    verifiziert: false
    quelle: https://g7.utoronto.ca/summit/2023hiroshima/231030-ai-principles.html
  anwendungsdaten:
  - datum: 2023-10-30
    was_gilt: Veröffentlichung von Leitprinzipien und Verhaltenskodex.
    verifiziert: false
    quelle: https://g7.utoronto.ca/summit/2023hiroshima/231030-ai-principles.html
  - datum: 2025-02-07
    was_gilt: Start des HAIP-Berichtsrahmens bei der OECD (Datum widersprüchlich).
    verifiziert: false
    quelle: https://transparency.oecd.ai/
  - datum: 2026-05-29
    was_gilt: 'Ministererklärung zu Digitales und Technologie unter französischer G7-Präsidentschaft;
      Würdigung des HAIP-Berichtsrahmens 2.0 und neue Arbeitsstränge.

      '
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/g7-digital-and-technology-ministerial-declaration-29-may-2026/g7-digital-and-technology-ministerial-declaration-29-may-2026
  themenachsen:
  - gpai
  - governance
  - content
  - sicherheit-export
  rechtswirkung: 'Politische Absichtserklärung ohne jede Rechtswirkung — weder für die G7-Staaten noch
    für die adressierten Unternehmen. Es gibt keine Beitrittserklärung, keine Prüfung, keine Sanktion.
    Die einzige Verbindung zur Wirklichkeit ist der HAIP-Berichtsrahmen, und der ist freiwillig. Die tatsächliche
    Bedeutung liegt in der Vorlagenfunktion: Der GPAI-Verhaltenskodex der EU und mehrere nationale Selbstverpflichtungen
    übernehmen Struktur und Formulierungen des Kodex — was ihn zum wirkmächtigsten unverbindlichen Text
    der KI-Governance macht.

    '
  regelungsschwerpunkte:
  - Elf Handlungsfelder; Nummer 7 (Inhaltsauthentifizierung, Wasserzeichen) ist der Vorläufer des Art.
    50 Abs. 2 KI-VO, allerdings unter dem Vorbehalt technischer Machbarkeit.
  - Nummer 10 verpflichtet ausdrücklich zur Mitwirkung an internationalen technischen Normen — der Kodex
    verweist damit auf die Normungsebene, die er selbst nicht ersetzen kann.
  - Nummer 11 nennt Datenqualität, Datenschutz und Immaterialgüterrechte in einem Atemzug — die einzige
    Stelle, an der ein G7-Instrument die Trainingsdatenfrage berührt.
  - 'Ministererklärung 29.05.2026: Vergleichbarkeit der Risikobewertungsrahmen mit dem Evaluierungsnetzwerk
    und der OECD; G7 SME AI Readiness Tool; Vision zu KI-Offenheit; gemeinsame Grundsätze zum Schutz Minderjähriger.'
  dokumente:
  - datum: 2023-10-30
    typ: leitlinie
    titel: Hiroshima Process International Guiding Principles for Organizations Developing Advanced AI
      Systems
    url: https://g7.utoronto.ca/summit/2023hiroshima/231030-ai-principles.html
    sprache: en
    urheber: G7
    verifiziert: false
    notiz: 'Volltext der elf Leitprinzipien. Die Formulierung „where technically feasible, such as watermarking“
      in Nummer 7 ist der Punkt, an dem der Kodex hinter Art. 50 KI-VO zurückbleibt.

      '
  - datum: 2023-10-30
    typ: leitlinie
    titel: Hiroshima Process International Code of Conduct for Advanced AI Systems
    url: https://digital-strategy.ec.europa.eu/en/library/hiroshima-process-international-code-conduct-advanced-ai-systems
    sprache: en
    urheber: G7 / Europäische Kommission (Bereitstellung)
    verifiziert: true
    notiz: 'Bezeichnet sich ausdrücklich als „voluntary guidance“ und als „non-exhaustive list of actions“;
