- id: un-res-79-325
  jurisdiktion: un
  kurztitel: Wissenschaftlicher Ausschuss und Globaler Dialog (A/RES/79/325)
  offizieller_titel: 'Resolution A/RES/79/325 der Generalversammlung vom 26. August 2025 — Terms of Reference
    and Modalities for the Establishment and Functioning of the Independent International Scientific Panel
    on Artificial Intelligence and the Global Dialogue on Artificial Intelligence Governance

    '
  fundstelle: A/RES/79/325 vom 26.08.2025 (Verteilung 27.08.2025)
  verfahrensnummer: 79. Tagung der Generalversammlung; ohne Befassung eines Hauptausschusses
  status: anwendbar
  status_detail: 'Umgesetzt. Die Generalversammlung hat am 12.02.2026 die 40 Mitglieder des Unabhängigen
    Internationalen Wissenschaftlichen Ausschusses ernannt (19 Frauen, 21 Männer, alle fünf Regionalgruppen);
    Ko-Vorsitzende sind Yoshua Bengio (Kanada) und Maria Ressa (Philippinen). Der Globale Dialog tagte
    erstmals inhaltlich am 06./07.07.2026 in Genf; die nächste Sitzung ist für den 03./04.05.2027 in New
    York vorgesehen.

    '
  kurzbeschreibung: 'Die institutionelle Antwort der Vereinten Nationen auf die KI-Governance-Lücke. Der
    Wissenschaftliche Ausschuss besteht aus 40 Mitgliedern, die in persönlicher Eigenschaft für drei Jahre
    berufen werden — höchstens zwei Ausgewählte derselben Staatsangehörigkeit oder Zugehörigkeit. Er erstellt
    evidenzbasierte wissenschaftliche Bewertungen und legt jährlich einen politikrelevanten, aber nicht
    präskriptiven Zusammenfassungsbericht vor, ergänzt um thematische Kurzberichte. Der Globale Dialog
    ist eine jährliche, höchstens zweitägige Mehrparteienveranstaltung mit hochrangigem Regierungssegment,
    die zwischen Genf und New York wechselt; die Ko-Vorsitzenden verfassen Zusammenfassungen. Finanzierung
    im Rahmen vorhandener Mittel und über freiwillige Beiträge — der schwächste Punkt der Konstruktion.

    '
  inkrafttreten:
    datum: 2025-08-26
    verifiziert: true
    quelle: https://www.un.org/pga/wp-content/uploads/sites/110/2025/12/A_RES_79_325-EN.pdf
  anwendungsdaten:
  - datum: 2025-08-26
    was_gilt: Annahme der Resolution ohne Abstimmung.
    verifiziert: true
    quelle: https://www.un.org/pga/wp-content/uploads/sites/110/2025/12/A_RES_79_325-EN.pdf
  - datum: 2026-02-12
    was_gilt: 'Ernennung der 40 Mitglieder des Wissenschaftlichen Ausschusses durch die Generalversammlung.

      '
    verifiziert: false
    quelle: https://en.wikipedia.org/wiki/Independent_International_Scientific_Panel_on_AI
  - datum: 2026-07-06
    was_gilt: Erste inhaltliche Sitzung des Globalen Dialogs in Genf (06./07.07.2026).
    verifiziert: true
    quelle: https://www.un.org/global-dialogue-ai-governance/en
  - datum: 2027-05-03
    was_gilt: 'Zweite Sitzung des Globalen Dialogs in New York (03./04.05.2027), zeitgleich mit dem 11.
      Mehrparteienforum für Wissenschaft, Technologie und Innovation.

      '
    verifiziert: true
    quelle: https://www.un.org/global-dialogue-ai-governance/en
  themenachsen:
  - governance
  - grundrechte
  - sicherheit-export
  rechtswirkung: 'Die Resolution selbst ist unverbindlich, aber sie ist mehr als eine Absichtserklärung:
    Sie hat zwei Institutionen tatsächlich errichtet und besetzt. Weder Ausschuss noch Dialog können Regeln
    setzen — der Bericht ist ausdrücklich „policy-relevant but non-prescriptive“. Die Wirkung ist epistemisch:
    Wenn ein UN-Gremium mit 40 benannten Wissenschaftlern feststellt, dass ein Risiko besteht, verschiebt
    sich die Darlegungslast in nationalen Verfahren. Für die Rechtspraxis ist das der Punkt, an dem der
    Bericht relevant wird — als Beleg für Erkennbarkeit und Vorhersehbarkeit im Haftungsrecht.

    '
  regelungsschwerpunkte:
  - 40 Mitglieder in persönlicher Eigenschaft, drei Jahre, höchstens zwei derselben Staatsangehörigkeit
    oder Zugehörigkeit; Auswahl durch offenen kriteriengeleiteten Aufruf des Generalsekretärs, Ernennung
    durch die Generalversammlung.
  - Zwei Ko-Vorsitzende, je einer aus einem entwickelten und einem Entwicklungsland; bis zu drei stellvertretende
    Vorsitzende.
  - Ein jährlicher Bericht plus thematische Kurzberichte; Vorlage bei jeder Sitzung des Globalen Dialogs
    und zweimal jährlich Aktualisierung gegenüber der Generalversammlung.
  - 'Vier thematische Stränge des Dialogs: Chancen und Auswirkungen; Überbrückung der KI-Kluft; sichere
    und vertrauenswürdige Systeme mit interoperablen Ansätzen; Schutz der Menschenrechte durch Transparenz,
    Rechenschaft und menschliche Aufsicht.'
  - Ko-Vorsitzende der zweiten Sitzung führen Konsultationen über vorrangige Felder der internationalen
    KI-Governance — die einzige Stelle, an der die Resolution eine Weiterentwicklung anlegt.
  - 'Abgrenzung zum Internationalen KI-Sicherheitsbericht: Dieser geht auf den Gipfel von Bletchley Park
    zurück, ist nicht UN-gebunden und wird ebenfalls von Bengio geleitet — dieselbe Person, zwei Mandate.'
  dokumente:
