  bearbeitungsstand: vollständig veröffentlicht
  rechtswirkung: 'Keine Vermutungswirkung. Faktisch der Prüfmaßstab, an dem sich Datenqualitätsmanagement
    heute messen lassen muss — auch weil die Reihe in Lieferverträgen über Trainingsdaten zunehmend in
    Bezug genommen wird.

    '
  regelungsschwerpunkte:
