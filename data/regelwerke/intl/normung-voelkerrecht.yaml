- id: iso-pren-18285
  jurisdiktion: iso
  kurztitel: prEN 18285 — Rahmen der Konformitätsbewertung
  offizieller_titel: 'prEN 18285 — Artificial intelligence — Conformity assessment framework

    '
  normnummer: prEN 18285
  fundstelle: CEN/CLC/JTC 21
  verfahrensnummer: CEN/CLC/JTC 21
  status: entwurf
  status_detail: 'Stufe Drafting (Stand Juni 2026), Termin „evolving“. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Bedient Art. 43 und Anhang VII KI-VO — das Verfahren der Konformitätsbewertung, insbesondere
    die Bewertung durch benannte Stellen bei biometrischen Hochrisikosystemen. Die Norm beschreibt, wie
    eine benannte Stelle das Qualitätsmanagementsystem und die technische Dokumentation eines Anbieters
    prüft. Ohne sie fehlt den benannten Stellen ein einheitlicher Prüfmaßstab — was die Vergleichbarkeit
    der Bescheinigungen im Binnenmarkt untergräbt. Vorarbeit: CEN/CLC/TR 18115:2024 zur Konformitätsbewertung.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://kla.digital/blog/jtc-21-standards-tracker
  anwendungsdaten: []
  themenachsen:
  - marktzugang
  - governance
  bedient_artikel: Art. 43 KI-VO und Anhang VII (Konformitätsbewertung auf der Grundlage einer Bewertung
    des Qualitätsmanagementsystems und der technischen Dokumentation)
  bearbeitungsstand: Drafting
  rechtswirkung: 'Keine. Die praktische Folge betrifft nicht in erster Linie die Anbieter, sondern die
    benannten Stellen: Sie werden nach Art. 31 KI-VO benannt und akkreditiert, bevor die Norm existiert,
    an der sie ihre Prüfung ausrichten sollen. Für den Zeitraum bis zur Zitierung ist mit uneinheitlicher
    Prüfpraxis zu rechnen.

    '
  regelungsschwerpunkte:
  - Vorarbeit CEN/CLC/TR 18115:2024 (Technischer Bericht zur KI-Konformitätsbewertung, veröffentlicht
    18.12.2024).
  - Verhältnis zu ISO/IEC 42006:2025 (Anforderungen an Stellen, die KI-Managementsysteme auditieren und
    zertifizieren) — die internationale Norm regelt die Zertifizierung nach ISO/IEC 42001, nicht die Konformitätsbewertung
    nach der KI-VO.
  - Die Akkreditierung benannter Stellen läuft parallel zur Normung; sie stützt sich einstweilen auf die
    allgemeinen Anforderungen des Art. 31 KI-VO und die Akkreditierungsverordnung (EG) Nr. 765/2008.
  dokumente:
