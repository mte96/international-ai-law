- id: iso-iec-5259
  jurisdiktion: iso
  kurztitel: ISO/IEC 5259 (Teile 1-5) — Datenqualität für Analytik und maschinelles Lernen
  offizieller_titel: 'ISO/IEC 5259-1 bis -5 — Artificial intelligence — Data quality for analytics and
    machine learning (ML)

    '
  normnummer: ISO/IEC 5259-1:2024, -2:2024, -3:2024, -4:2024, -5:2025
  fundstelle: ISO/IEC JTC 1/SC 42, Teile 1-4 veröffentlicht 2024, Teil 5 2025
  verfahrensnummer: ISO/IEC JTC 1/SC 42
  status: softlaw
  status_detail: 'Vollständig veröffentlicht: Teil 1 (Überblick, Terminologie, Beispiele), Teil 2 (Datenqualitätsmaße),
    Teil 3 (Anforderungen und Leitlinien für das Datenqualitätsmanagement), Teil 4 (Prozessrahmenwerk)
    2024; Teil 5 (Governance-Rahmenwerk für Datenqualität) 2025. Nicht harmonisiert.

    '
  kurzbeschreibung: 'Die international vollständigste Regelung der Datenqualität für maschinelles Lernen
    und damit die einzige ausgereifte Referenz für Art. 10 KI-VO, solange prEN 18284 im Entwurfsstadium
    steckt. Teil 3 enthält Anforderungen und ist damit auditierbar; die übrigen Teile sind Rahmenwerke
    und Leitlinien. Die Reihe deckt Erhebung, Kennzeichnung, Messung, Verwaltung und Governance von Datensätzen
    ab.

    '
  inkrafttreten:
    datum: 2024-01-01
    verifiziert: false
    quelle: https://www.iso.org/standard/81088.html
  anwendungsdaten:
