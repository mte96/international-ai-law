  kurztitel: prEN 18282 — Cybersicherheit für KI-Systeme
  offizieller_titel: 'prEN 18282 — Artificial intelligence — Cybersecurity specifications for AI systems

    '
  normnummer: prEN 18282
  fundstelle: CEN/CLC/JTC 21
  verfahrensnummer: CEN/CLC/JTC 21, Arbeitsgruppe Cybersicherheit
  status: entwurf
  status_detail: 'Stufe Enquiry (Stand Juni 2026); die öffentliche Konsultation wurde gemeinsam mit prEN
    18228 im Mai 2026 eröffnet. Zielhorizont Q4 2026. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Bedient Art. 15 Abs. 5 KI-VO — die Pflicht, Hochrisikosysteme gegen Versuche zu härten,
    ihr Verhalten durch Ausnutzung von Schwachstellen zu verändern. Erfasst KI-spezifische Angriffsklassen,
    die klassische IT-Sicherheitsnormen nicht kennen: Vergiftung von Trainingsdaten und Modellen, gegnerische
    Beispiele, Modellextraktion, Prompt-Injektion. Schnittstellenrelevant zum Cyber Resilience Act, dessen
    Anforderungen für Produkte mit digitalen Elementen parallel gelten.

    '
