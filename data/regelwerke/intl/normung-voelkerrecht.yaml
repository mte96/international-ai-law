- id: iso-iec-23894
  jurisdiktion: iso
  kurztitel: ISO/IEC 23894:2023 — Leitfaden Risikomanagement
  offizieller_titel: 'ISO/IEC 23894:2023 — Information technology — Artificial intelligence — Guidance
    on risk management

    '
  normnummer: ISO/IEC 23894:2023
  fundstelle: ISO/IEC JTC 1/SC 42, veröffentlicht 06.02.2023, 1. Ausgabe
  verfahrensnummer: ISO/IEC JTC 1/SC 42; als EN ISO/IEC 23894 in Europa übernommen
  status: softlaw
  status_detail: 'Veröffentlicht am 06.02.2023 und als Europäische Norm übernommen — aber nicht harmonisiert
    und nicht im Amtsblatt zitiert. Der europäische Gegenentwurf prEN 18228 befindet sich im Umfrageverfahren.

    '
  kurzbeschreibung: 'Überträgt die generische Risikomanagementmethodik der ISO 31000 auf KI. Beschreibt
    Grundsätze, Rahmenwerk und Prozess des KI-Risikomanagements und enthält in Anhang C eine Aufstellung
    KI-spezifischer Risikoquellen (unter anderem mangelnde Transparenz, Datenqualität, Automatisierungsbias,
    Sicherheit, Komplexität der Lieferkette). Ein Leitfaden, keine Anforderungsnorm — der entscheidende
    Unterschied zu prEN 18228, die Anforderungen formuliert und damit auditierbar ist.

    '
  inkrafttreten:
    datum: 2023-02-06
    verifiziert: true
    quelle: https://www.iso.org/standard/77304.html
  anwendungsdaten:
  - datum: 2023-02-06
    was_gilt: Veröffentlichung.
    verifiziert: true
    quelle: https://www.iso.org/standard/77304.html
  themenachsen:
  - governance
  - haftung
  - marktzugang
  bedient_artikel: 'keinen unmittelbar. Methodisch anschlussfähig an Art. 9 KI-VO; ersetzt prEN 18228
    nicht.

    '
  bearbeitungsstand: veröffentlicht; europäisch übernommen als EN ISO/IEC 23894
  rechtswirkung: 'Keine Vermutungswirkung. Beweisrechtlich relevant als Stand der Technik: Wer ein Risikomanagementsystem
    gänzlich ohne Anlehnung an ISO/IEC 23894 oder ISO 31000 betreibt, wird im Haftungsfall erklären müssen,
    warum.

    '
  regelungsschwerpunkte:
  - 'Anhang C: Katalog KI-spezifischer Risikoquellen — die praktisch nützlichste Passage.'
  - 'Leitfaden gegen Anforderungsnorm: ISO/IEC 23894 sagt „sollte“, prEN 18228 sagt „muss“. Nur Letzteres
    ist auditierbar und vermutungsfähig.'
  dokumente:
