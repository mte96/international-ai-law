- id: iso-nist-rahmenwerke
  jurisdiktion: iso
  kurztitel: NIST-Rahmenwerke als Normungsinstrument
  offizieller_titel: 'NIST AI 100-1 (AI RMF 1.0), NIST AI 600-1 (Generative AI Profile) und SP 800-53
    Control Overlays for Securing AI Systems (COSAiS) — normungsbezogene Einordnung

    '
  fundstelle: National Institute of Standards and Technology, U.S. Department of Commerce
  verfahrensnummer: 'gesetzliche Grundlage: National AI Initiative Act of 2020'
  status: softlaw
  status_detail: 'Ausdrücklich freiwillig und ohne Rechtsgrundlage im Regulierungsrecht. Das AI RMF 1.0
    wird nach dem AI Action Plan vom 23.07.2025 überarbeitet, mit dem Auftrag, Bezüge auf Fehlinformation,
    Diversity/Equity/Inclusion und Klimawandel zu streichen; eine Neufassung lag bei Rechercheschluss
    nicht vor. Die COSAiS-Overlays sind über den Stand eines Diskussionsentwurfs (08.01.2026) nicht hinaus.
    Ausführliche Erfassung der US-Perspektive in 10_us_bund.yaml (us-nist-ai-rmf, us-nist-ai-600-1, us-caisi);
    dieser Eintrag betrifft die Normungsdimension.

    '
  kurzbeschreibung: 'NIST ist keine Normungsorganisation im Sinne der VO (EU) Nr. 1025/2012, sondern eine
    Bundesbehörde, die freiwillige Rahmenwerke veröffentlicht. Das AI RMF 1.0 (26.01.2023) ordnet KI-Risikomanagement
    in vier Funktionen (Govern, Map, Measure, Manage) und sieben Merkmale vertrauenswürdiger KI. Das Generative
    AI Profile (NIST AI 600-1, 26.07.2024) ergänzt es um generative Systeme. Am 07.04.2026 kündigte NIST
    ein Profil für kritische Infrastrukturen an. Seit Juli 2025 läuft das Projekt COSAiS, das Sicherheitsmaßnahmen
    aus SP 800-53 als KI-spezifische Overlays zuschneidet — der erste Anwendungsfall (Nutzung und Feinabstimmung
    prädiktiver KI) liegt seit 08.01.2026 als annotierter Entwurf vor.

    '
  inkrafttreten:
    datum: 2023-01-26
    verifiziert: true
    quelle: https://www.nist.gov/itl/ai-risk-management-framework
  anwendungsdaten:
  - datum: 2024-07-26
    was_gilt: Veröffentlichung des Generative AI Profile (NIST AI 600-1).
    verifiziert: true
    quelle: https://www.nist.gov/itl/ai-risk-management-framework
  - datum: 2025-07-10
    was_gilt: Start des Projekts COSAiS (SP 800-53 Control Overlays for Securing AI Systems).
    verifiziert: true
    quelle: https://csrc.nist.gov/Projects/cosais/faqs
  - datum: 2026-01-08
    was_gilt: 'Annotierter Diskussionsentwurf des ersten COSAiS-Anwendungsfalls („Using and Fine-Tuning
      Predictive AI“); Kommentarfrist bis 13.02.2026.

      '
    verifiziert: true
    quelle: https://csrc.nist.gov/Projects/cosais/faqs
  - datum: 2026-04-07
    was_gilt: Konzeptnotiz für ein AI RMF Profile zu vertrauenswürdiger KI in kritischen Infrastrukturen.
    verifiziert: true
    quelle: https://www.nist.gov/itl/ai-risk-management-framework
  themenachsen:
  - governance
  - sicherheit-export
  - gpai
  bedient_artikel: keinen. Ohne Bezug zu einer Rechtsnorm; Anschluss an die KI-VO nur über private Crosswalks.
  bearbeitungsstand: AI RMF 1.0 in Überarbeitung; COSAiS im Entwurfsstadium
  rechtswirkung: 'Politische Absichtserklärung mit erheblicher faktischer Wirkung, aber ohne jede Bindung.
    Rechtswirkung entsteht nur über Verweisung: Bundesbeschaffung (OMB-Rundschreiben), einzelstaatliche
    Gesetze — der Colorado AI Act nimmt das Rahmenwerk als Safe-Harbor-Maßstab in Bezug — sowie Verträge,
    Versicherungspolicen und Prüfungsstandards. Genau diese Verweisungstechnik macht die angeordnete Überarbeitung
    gefährlich: Ein dynamischer Verweis auf „NIST AI RMF“ ändert seinen Inhalt mit der Neufassung. Vertragliche
    Bezugnahmen sind zu versionieren („AI RMF 1.0, Fassung vom 26.01.2023“).

    '
  regelungsschwerpunkte:
  - Vier Funktionen Govern, Map, Measure, Manage; sieben Merkmale vertrauenswürdiger KI.
  - Profile als Anpassungsmechanismus (Generative AI, kritische Infrastrukturen) — der Grund, warum das
    Rahmenwerk anschlussfähig bleibt, ohne selbst geändert zu werden.
  - COSAiS verbindet erstmals die etablierte Sicherheitsmaßnahmenwelt von SP 800-53 mit KI-spezifischen
    Bedrohungen; funktional das US-Gegenstück zu prEN 18282.
  - 'Verhältnis zu ISO/IEC 42001: Das AI RMF beschreibt Funktionen, ISO/IEC 42001 fordert ein Managementsystem.
    Sie sind komplementär, nicht austauschbar; verbreitete Crosswalks sind privat erstellt und ohne amtliche
    Anerkennung.'
  - CAISI (Center for AI Standards and Innovation, seit Juni 2025 aus dem US AI Safety Institute hervorgegangen)
    ist die Stelle, über die die USA in der internationalen Normung und im Evaluierungsnetzwerk auftreten
    — ohne Anordnungsbefugnis.
