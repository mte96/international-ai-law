- id: iso-ieee-certifaied
  jurisdiktion: iso
  kurztitel: IEEE CertifAIEd — Zertifizierungsprogramm
  offizieller_titel: 'IEEE CertifAIEd — Certification Program for Assessing Ethics of Autonomous Intelligent
    Systems

    '
  fundstelle: IEEE Standards Association, ICAP (Industry Connections Activities Program)
  verfahrensnummer: IEEE SA ICAP
  status: softlaw
  status_detail: 'Aktives privates Zertifizierungsprogramm. 2025/2026 überarbeitet: neu gefasste Berufszertifizierung,
    ein Fachprogramm zur KI-Sicherheit für Kinder und ein Lizenzierungs- und Produktregisterprogramm für
    zugelassene Prüfer. Keine aufsichtsrechtliche Anerkennung in der EU.

    '
  kurzbeschreibung: 'Zertifiziert zwei Gegenstände: Personen (Berufszertifikat für die Anwendung des IEEE-KI-Ethikrahmens)
    und Produkte (Bewertung autonomer intelligenter Systeme durch von der IEEE zugelassene Prüfer). Der
    Bewertungsrahmen beruht auf vier ontologischen Spezifikationen: Transparenz, Rechenschaft, algorithmische
    Verzerrung, Datenschutz. Das Programm wirbt mit Anschlussfähigkeit an die KI-VO, ohne dass eine förmliche
    Anerkennung besteht.

    '
  inkrafttreten:
    datum: 2022-01-01
    verifiziert: false
    quelle: https://standards.ieee.org/products-programs/icap/ieee-certifaied/
  anwendungsdaten: []
  themenachsen:
  - governance
  - grundrechte
  - berufsrecht
  bedient_artikel: keinen. Keine benannte Stelle nach Art. 31 KI-VO; keine Konformitätsbewertung nach
    Art. 43.
  bearbeitungsstand: aktives Programm, 2025/2026 überarbeitet
  rechtswirkung: 'Keine. Eine CertifAIEd-Bescheinigung ist eine private Urkunde ohne aufsichtsrechtliche
    Wirkung. Sie ersetzt weder die Konformitätsbewertung nach Art. 43 KI-VO noch die CE-Kennzeichnung.
    Warnhinweis für die Praxis: Anbieter, die mit „AI-Act-Zertifizierung“ werben, sollten danach gefragt
    werden, welche benannte Stelle nach welchem Verfahren tätig geworden ist — im Zweifel keine.

    '
  regelungsschwerpunkte:
  - 'Vier ontologische Spezifikationen: Transparenz, Rechenschaft, algorithmische Verzerrung, Datenschutz.'
  - 'Zwei Zertifizierungspfade: Personen und Produkte.'
  - 'Verhältnis zu ISO/IEC 42001: CertifAIEd bewertet Systeme, ISO/IEC 42001 zertifiziert Managementsysteme
    — die beiden Bescheinigungen sagen Unterschiedliches aus und sind nicht austauschbar.'
  dokumente:
  - datum: 2026-08-31
    typ: uebersicht
    titel: IEEE SA — IEEE CertifAIEd, The Global Mark of Ethical and Trustworthy AI
    url: https://standards.ieee.org/products-programs/icap/ieee-certifaied/
    sprache: en
    urheber: IEEE Standards Association
    verifiziert: true
    notiz: 'Amtliche Programmseite. Belegt die vier Spezifikationen, beide Zertifizierungspfade und die
      2025/2026 vorgenommenen Programmänderungen. Formuliert lediglich eine „Ausrichtung“ an der KI-VO,
      keine Anerkennung.

      '
  offene_punkte:
  - Zahl der tatsächlich zertifizierten Produkte und zugelassenen Prüfer nicht öffentlich.
  - Startdatum des Programms nicht primärquellenbelegt.
