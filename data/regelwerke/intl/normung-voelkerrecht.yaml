- id: oecd-ki-grundsaetze
  jurisdiktion: oecd
  kurztitel: OECD-Empfehlung zu künstlicher Intelligenz (AI Principles)
  offizieller_titel: 'Recommendation of the Council on Artificial Intelligence (OECD/LEGAL/0449), angenommen
    am 22. Mai 2019, überarbeitet am 3. Mai 2024

    '
  fundstelle: OECD/LEGAL/0449
  verfahrensnummer: OECD-Rat; Committee on Digital Policy (CDEP)
  status: softlaw
  status_detail: 'In Kraft als OECD-Rechtsinstrument der Kategorie „Recommendation“ — politisch bindend,
    rechtlich unverbindlich. Die Überarbeitung vom Mai 2024 passte den Text an generative KI und Basismodelle
    an; 47 Adhärenten, darunter acht Nichtmitglieder (Argentinien, Brasilien, Ägypten, Malta, Peru, Rumänien,
    Singapur, Ukraine) und die Europäische Union.

    '
  kurzbeschreibung: 'Das älteste zwischenstaatliche KI-Instrument und die Referenzgrundlage aller späteren:
    Die KI-VO übernimmt in Art. 3 Nr. 1 die OECD-Definition des KI-Systems in der Fassung von 2023, der
    G7-Verhaltenskodex baut ausdrücklich auf den Grundsätzen auf, die UN-Resolutionen nehmen auf sie Bezug.
    Fünf wertebasierte Grundsätze: integratives Wachstum und Wohlergehen; Menschenrechte und demokratische
    Werte einschließlich Fairness und Privatheit; Transparenz und Erklärbarkeit; Robustheit, Sicherheit
    und Gefahrlosigkeit; Rechenschaft. Fünf Empfehlungen an die Politik: Investitionen in Forschung und
    Entwicklung; ein förderliches Ökosystem; ein interoperables Governance- und Politikumfeld; Aufbau
    menschlicher Fähigkeiten und Vorbereitung des Arbeitsmarktwandels; internationale Zusammenarbeit.

    '
  inkrafttreten:
    datum: 2019-05-22
    verifiziert: true
    quelle: https://oecd.ai/en/ai-principles
  anwendungsdaten:
  - datum: 2019-05-22
    was_gilt: Annahme der Empfehlung durch den OECD-Rat.
    verifiziert: true
    quelle: https://oecd.ai/en/ai-principles
  - datum: 2024-05-03
    was_gilt: 'Überarbeitung der Grundsätze; Anpassung an generative KI und Basismodelle, Ergänzung um
      Informationsintegrität und Umgang mit Fehlinformation.

      '
    verifiziert: true
    quelle: https://www.oecd.org/en/about/news/press-releases/2024/05/oecd-updates-ai-principles-to-stay-abreast-of-rapid-technological-developments.html
  themenachsen:
  - governance
  - grundrechte
  - arbeit
  - wettbewerb
  rechtswirkung: 'Politische Absichtserklärung. OECD-Empfehlungen sind nach Art. 5 lit. b des OECD-Übereinkommens
    nicht rechtsverbindlich; die Adhärenten erklären lediglich ihre Absicht, sie umzusetzen, und berichten
    dem Rat. Die tatsächliche Wirkung liegt woanders: in der Definitionsmacht. Die Definition des KI-Systems,
    die heute in Art. 3 Nr. 1 KI-VO, im koreanischen Rahmengesetz und in mehreren US-Bundesstaatengesetzen
    steht, stammt aus diesem Instrument. Wer den Anwendungsbereich der KI-VO bestimmen will, liest die
    OECD-Erläuterungen mit.

    '
  regelungsschwerpunkte:
  - Definition des KI-Systems (überarbeitet November 2023) — der wirkmächtigste Satz des gesamten transnationalen
    KI-Rechts.
  - Fünf wertebasierte Grundsätze und fünf Politikempfehlungen; die Nummerierung 1.1-1.5 und 2.1-2.5 wird
    von anderen Instrumenten übernommen.
  - Berichtspflicht der Adhärenten an den Rat — der einzige Durchsetzungsmechanismus, und er besteht aus
    Berichten.
  - 47 Adhärenten sind deutlich weniger als die 193 UNESCO-Mitgliedstaaten, aber die Adhärenten decken
    den Großteil der KI-Entwicklung ab.
  dokumente:
  - datum: 2026-08-31
    typ: endfassung
    titel: Recommendation of the Council on Artificial Intelligence (OECD/LEGAL/0449)
    url: https://legalinstruments.oecd.org/en/instruments/oecd-legal-0449
    sprache: en
    urheber: OECD
    verifiziert: false
    notiz: Amtlicher Volltext des Rechtsinstruments. Nur als JavaScript-Gerüst abrufbar; Inhalt über öcd.ai
      belegt.
  - datum: 2026-08-31
    typ: uebersicht
    titel: AI Principles Overview — OECD.AI
    url: https://oecd.ai/en/ai-principles
    sprache: en
    urheber: OECD
    verifiziert: true
    notiz: 'Belegt Instrumentennummer, Annahme 2019, Überarbeitung Mai 2024, 47 Adhärenten und die acht
      Nichtmitglieder sowie den Wortlaut der zehn Grundsätze und Empfehlungen.

      '
