- id: iso-pren-18283
  jurisdiktion: iso
  kurztitel: prEN 18283 — Umgang mit Verzerrungen (Bias)
  offizieller_titel: 'prEN 18283 — Artificial intelligence — Concepts, measures and requirements for managing
    bias in AI systems

    '
  normnummer: prEN 18283
  fundstelle: CEN/CLC/JTC 21
  verfahrensnummer: CEN/CLC/JTC 21
  status: entwurf
  status_detail: 'Früheste Bearbeitungsstufe (Drafting) aller Kernnormen; Verfügbarkeit ausdrücklich erst
    nach Q4 2026. Von der Kommission förmlich angefordert. Der ETUC bringt Beiträge zur Bias-Minderung
    ein. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Bedient Art. 10 Abs. 2 lit. f und g KI-VO — die Pflicht, Datensätze auf mögliche
    Verzerrungen zu untersuchen, die Gesundheit, Sicherheit oder Grundrechte beeinträchtigen oder zu verbotener
    Diskriminierung führen können, und geeignete Gegenmaßnahmen zu treffen. Damit ist dies die Norm, an
    der sich entscheidet, ob die KI-VO ihr grundrechtliches Versprechen technisch einlösen kann. Sie ist
    zugleich die am weitesten zurückliegende.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://kla.digital/blog/jtc-21-standards-tracker
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - governance
  - marktzugang
  - arbeit
  bedient_artikel: Art. 10 Abs. 2 lit. f und g KI-VO (Untersuchung und Minderung von Verzerrungen)
  bearbeitungsstand: Drafting (früheste Stufe)
  rechtswirkung: 'Keine, auf absehbare Zeit auch nicht. Die praktische Folge: Die Diskriminierungsdimension
    der KI-VO wird zuerst durch die Aufsicht und die Gerichte konkretisiert, nicht durch die Normung.
    Für die Verteidigung eines Anbieters heißt das, dass ISO/IEC TR 24027 (Bias in AI systems and AI aided
    decision making) und ISO/IEC TS 12791 (Treatment of unwanted bias in classification and regression
    machine learning tasks) einstweilen die einzigen zitierfähigen Referenzen sind — als Stand der Technik,
    nicht als Vermutungsgrundlage.

    '
  regelungsschwerpunkte:
  - 'Verhältnis zu Art. 10 Abs. 5 KI-VO: Die Verarbeitung besonderer Datenkategorien zur Bias-Erkennung
    ist erlaubt, aber an strenge Bedingungen geknüpft; der Digital Omnibus hat mit dem neuen Art. 4a KI-VO
    die Erlaubnis auf alle KI-Systeme erstreckt.'
  - Bezug zu ISO/IEC TR 24027 und ISO/IEC TS 12791 als vorhandene internationale Vorarbeiten.
  - Beteiligung des ETUC — ein seltener Fall organisierter Arbeitnehmerbeteiligung in der technischen
    Normung.
  dokumente:
