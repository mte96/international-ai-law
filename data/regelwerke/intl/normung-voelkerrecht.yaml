regelwerke:
- id: iso-normungsauftrag-m593-m613
  jurisdiktion: iso
  kurztitel: Normungsauftrag M/593 / M/613 an CEN und CENELEC
  offizieller_titel: 'Durchführungsbeschluss C(2023) 3215 final der Kommission vom 22. Mai 2023 über einen
    Normungsauftrag an das Europäische Komitee für Normung und das Europäische Komitee für elektrotechnische
    Normung zur Unterstützung der Politik der Union für künstliche Intelligenz (M/593), geändert durch
    M/613 und durch C(2025) 3871

    '
  fundstelle: C(2023) 3215 final; Änderung C(2025) 3871
  verfahrensnummer: M/593; Änderungsauftrag M/613
  status: verfahren
  status_detail: 'Der Auftrag läuft. Die ursprüngliche Lieferfrist 30.04.2025 wurde verfehlt; die Kommission
    verlängerte sie durch C(2025) 3871 auf den 31.08.2025 — auch diese Frist verstrich ohne Lieferung.
    CEN und CENELEC arbeiten seit Oktober 2025 unter einem außergewöhnlichen Beschleunigungsregime auf
    den Zielhorizont Q4 2026 hin. Bei Rechercheschluss ist eine von zehn angeforderten Normen veröffentlicht
    und keine im Amtsblatt zitiert.

    '
  kurzbeschreibung: 'Der Normungsauftrag ist das Scharnier zwischen der KI-VO und der technischen Normung.
    Die Kommission fordert darin von CEN und CENELEC Normen in zehn Bereichen an: Risikomanagement, Governance
    und Qualität von Datensätzen, Aufzeichnungspflichten, Transparenz, menschliche Aufsicht, Genauigkeit,
    Robustheit, Cybersicherheit, Qualitätsmanagement und Konformitätsbewertung. Nur Normen, die auf diesen
    Auftrag zurückgehen, von der Kommission bewertet und im Amtsblatt zitiert werden, lösen die Konformitätsvermutung
    nach Art. 40 KI-VO aus. Der Auftrag ist kein Rechtsakt gegenüber Anbietern — er verpflichtet die Normungsorganisationen.
    Für Anbieter entsteht die Wirkung erst über die zitierte Norm.

    '
