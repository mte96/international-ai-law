- id: iso-pren-18284
  jurisdiktion: iso
  kurztitel: prEN 18284 — Qualität und Governance von Datensätzen
  offizieller_titel: 'prEN 18284 — Artificial intelligence — Quality and governance of datasets in AI

    '
  normnummer: prEN 18284
  fundstelle: CEN/CLC/JTC 21
  verfahrensnummer: CEN/CLC/JTC 21
  status: entwurf
  status_detail: 'Stufe Drafting (Stand Juni 2026), Termin „evolving“. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Bedient Art. 10 KI-VO — Daten und Daten-Governance. Legt fest, wie Trainings-, Validierungs-
    und Testdatensätze zu erheben, zu dokumentieren, auf Repräsentativität und Vollständigkeit zu prüfen
    und über den Lebenszyklus zu verwalten sind. Aufbauend auf den internationalen Vorarbeiten der Reihe
    ISO/IEC 5259 und dem Technischen Bericht CEN/CLC/TR 18115 zu Daten-Governance und -qualität. Für Anbieter
    der praktisch aufwendigste Pflichtenkomplex der Verordnung, weil er in die Beschaffung und in die
    Vertragsgestaltung mit Datenlieferanten durchschlägt.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://kla.digital/blog/jtc-21-standards-tracker
  anwendungsdaten: []
  themenachsen:
  - governance
  - marktzugang
  - datenschutz
  - urheberrecht
  bedient_artikel: Art. 10 KI-VO (Daten und Daten-Governance); mittelbar Art. 17 Abs. 1 lit. f
  bearbeitungsstand: Drafting
  rechtswirkung: 'Keine. Bis zur Zitierung ist die Reihe ISO/IEC 5259 (Teile 1-5, 2024/2025) der maßgebliche
    Stand der Technik — ohne Vermutungswirkung, aber mit erheblichem Gewicht in der Vertragsgestaltung
    und in der Auseinandersetzung mit der Marktüberwachung.

    '
  regelungsschwerpunkte:
  - 'Vorarbeiten: CEN/CLC/TR 18115 (Data governance and quality for AI, veröffentlicht 18.12.2024) und
    ISO/IEC 5259 Teile 1-5.'
  - 'Schnittstelle zum Urheberrecht: Art. 10 KI-VO regelt Datenqualität, nicht Rechtmäßigkeit der Datenherkunft
    — diese folgt aus Art. 4 DSM-RL und Art. 53 Abs. 1 lit. c KI-VO.'
  - 'Schnittstelle zur DSGVO: Repräsentativitätsprüfung setzt oft die Verarbeitung besonderer Datenkategorien
    voraus (Art. 10 Abs. 5 KI-VO, neu Art. 4a KI-VO).'
  dokumente:
