- id: oecd-haip-berichtsrahmen
  jurisdiktion: oecd
  kurztitel: HAIP-Berichtsrahmen (Hiroshima AI Process Reporting Framework)
  offizieller_titel: 'Hiroshima Artificial Intelligence Process (HAIP) Reporting Framework — Berichtsrahmen
    zum G7-Verhaltenskodex, betrieben von der OECD

    '
  fundstelle: OECD, transparency.öcd.ai; Fassung 2.0 vom 28.05.2026
  verfahrensnummer: G7-Auftrag; Umsetzung durch die OECD
  status: softlaw
  status_detail: 'Aktiv, aber schwach genutzt. Erste Runde Februar bis April 2025: 19 Organisationen aus
    Japan, den USA, Deutschland, Kanada, Korea, Rumänien und Israel. Fassung 2.0 am 28.05.2026 bei einem
    Tech7-Termin während des G7-Ministertreffens für Digitales und Technologie in Paris vorgestellt; über
    50 Organisationen sagten Berichte zu, darunter Amazon, Google, Microsoft, OpenAI, Mistral AI und Cohere.
    Einreichungen laufend, Stichtag für die nächste Auswertung 01.09.2026.

    '
  kurzbeschreibung: 'Der einzige Mechanismus, mit dem die freiwilligen G7-Verpflichtungen aus dem Verhaltenskodex
    überhaupt überprüfbar werden. Organisationen beantworten einen strukturierten Fragebogen zu Risikoerkennung,
    Risikominderung, Governance, Sicherheitsvorkehrungen, Inhaltsauthentifizierung, Forschung und Datenschutz;
    die Antworten werden auf einer öffentlichen Plattform veröffentlicht. Fassung 2.0 unterscheidet erstmals
    zwischen Modellentwicklern, Anwendungsentwicklern und Betreibern, senkt die Hürde für kleine und mittlere
    Unternehmen und behandelt agentische KI.

    '
  inkrafttreten:
    datum: 2025-02-07
    verifiziert: false
    quelle: https://transparency.oecd.ai/
  anwendungsdaten:
  - datum: 2025-04-30
    was_gilt: 'Ende der ersten Berichtsrunde; 19 Organisationen hatten eingereicht.

      '
    verifiziert: true
    quelle: https://oecd.ai/en/wonk/haip-reporting-insights
  - datum: 2026-05-28
    was_gilt: Vorstellung der Fassung 2.0 beim G7-Ministertreffen in Paris.
    verifiziert: true
    quelle: https://oecd.ai/en/haip-2-launch
  - datum: 2026-09-01
    was_gilt: 'Stichtag für die Aufnahme in die nächste analytische Auswertung; Einreichung ansonsten
      laufend möglich.

      '
    verifiziert: true
    quelle: https://oecd.ai/en/haip-2-launch
  themenachsen:
  - governance
  - gpai
  - content
  - sicherheit-export
  rechtswirkung: 'Politische Absichtserklärung ohne jede Verbindlichkeit — keine Einreichungspflicht,
    keine Prüfung der Angaben, keine Folge bei Falschangaben. Der praktische Wert liegt in der Vergleichbarkeit:
    Weil alle Berichte demselben Raster folgen und öffentlich sind, entstehen erstmals belastbare Aussagen
    darüber, was große Anbieter über ihre eigenen Sicherheitsvorkehrungen behaupten. Für die europäische
    Praxis relevant, weil dieselben Anbieter unter Art. 55 KI-VO und dem GPAI-Verhaltenskodex Vergleichbares
    erklären — und Abweichungen zwischen beiden Erklärungen angreifbar sind.

    '
  regelungsschwerpunkte:
  - 'Erste Runde: 19 Organisationen. Das ist die zentrale Zahl zur „tatsächlichen Nutzung“ — der Rahmen
    war in der ersten Runde faktisch bedeutungslos.'
  - Fassung 2.0 trennt Modellentwickler, Anwendungsentwickler und Betreiber; verlinkt den OECD-Katalog
    der Werkzeuge und Metriken; behandelt agentische KI.
  - Über 50 zugesagte Berichte für die zweite Runde, darunter alle großen US-Anbieter und Mistral AI —
    ein qualitativer Sprung, dessen Einlösung am 01.09.2026 zu prüfen ist.
  - 'Verhältnis zum GPAI-Verhaltenskodex der EU: Beide verlangen Erklärungen zu Risikomanagement und Sicherheit;
    der EU-Kodex ist an Art. 53, 55 KI-VO angebunden und damit sanktionsbewehrt, der HAIP-Rahmen nicht.'
  dokumente:
