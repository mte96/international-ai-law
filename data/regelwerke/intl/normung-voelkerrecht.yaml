    typ: endfassung
    titel: A/RES/79/325 — Terms of Reference and Modalities (Volltext)
    url: https://www.un.org/pga/wp-content/uploads/sites/110/2025/12/A_RES_79_325-EN.pdf
    sprache: en
    urheber: Generalversammlung der Vereinten Nationen
    verifiziert: true
    notiz: 'Primärquelle. Belegt Zusammensetzung, Auswahlverfahren, Mandat, Sitzungsrhythmus, Finanzierung
      und die Formel „policy-relevant but non-prescriptive“.

      '
