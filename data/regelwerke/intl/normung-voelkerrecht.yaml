- id: iso-jtc21-uebernommene-en-iso-iec
  jurisdiktion: iso
  kurztitel: Von JTC 21 übernommene EN ISO/IEC-Normen und Technische Berichte
  offizieller_titel: 'Als Europäische Normen übernommene internationale KI-Normen und eigenständige Technische
    Berichte des CEN-CENELEC JTC 21

    '
  fundstelle: CEN/CLC/JTC 21, Arbeitsprogramm
  verfahrensnummer: CEN/CLC/JTC 21 (gegründet 01.06.2021, über 300 Experten aus mehr als 20 Ländern)
  status: softlaw
  status_detail: 'Teils veröffentlicht, teils in Bearbeitung. Keine dieser Normen ist im Amtsblatt zitiert;
    sie sind auch nicht dafür bestimmt — sie bilden den terminologischen und methodischen Unterbau, auf
    den die harmonisierten Normen aufsetzen. Wer die harmonisierten Normen liest, ohne sie zu kennen,
    versteht die Definitionen nicht.

    '
  kurzbeschreibung: 'JTC 21 entwickelt nicht nur eigene Normen, sondern übernimmt internationale Normen
    als EN ISO/IEC und erstellt Technische Berichte. Veröffentlicht sind unter anderem EN ISO/IEC 22989:2023
    (Begriffe und Konzepte), EN ISO/IEC 23053:2023 (Rahmenwerk für KI-Systeme mit maschinellem Lernen),
    EN ISO/IEC 8183:2023 (Datenlebenszyklus), EN ISO/IEC 25059 (Qualitätsmodell), EN ISO/IEC 23894 (Risikomanagement),
    CEN/CLC/TR 18115:2024 (Konformitätsbewertung bzw. Daten-Governance) und CEN/CLC/TR 18145:2025 (grüne
    und nachhaltige KI). In Bearbeitung sind prEN ISO/IEC 24970 (Protokollierung), prEN ISO/IEC 12792
    (Transparenztaxonomie), prEN ISO/IEC 23282 (Bewertungsverfahren für Sprachverarbeitung), prEN 18281
    (Bewertungsverfahren für Bildverarbeitung) und prEN ISO/IEC 25029 (KI-gestütztes Nudging).

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://jtc21.eu/wp-content/uploads/2025/06/CEN-CENELEC-JTC21-AI-Standards-Complete-Detailed-Overview.pdf
  anwendungsdaten:
  - datum: 2024-12-18
    was_gilt: Veröffentlichung von CEN/CLC/TR 18115:2024.
    verifiziert: true
    quelle: https://jtc21.eu/category/news/
  themenachsen:
  - governance
  - marktzugang
  bedient_artikel: kein einzelner Artikel — terminologischer und methodischer Unterbau des gesamten Programms
  bearbeitungsstand: 'gemischt: veröffentlicht und in Bearbeitung'
  rechtswirkung: 'Keine unmittelbare. Technische Berichte (TR) können nach den CEN-CENELEC-Regeln überhaupt
    nicht harmonisiert werden — sie tragen nie eine Konformitätsvermutung. Die übernommenen EN ISO/IEC-Normen
    sind europäische Normen, aber nicht auf den Normungsauftrag hin entwickelt und daher nicht zitierfähig.
    Ihr Gewicht liegt in der Definitionsmacht: EN ISO/IEC 22989 legt fest, was „KI-System“ im Normungskontext
    heißt — die KI-VO hat davon abweichend in Art. 3 Nr. 1 eine eigene Definition.

    '
  regelungsschwerpunkte:
  - 'Fünf Arbeitsgruppen: Strategischer Beirat (SAG), Operative Aspekte, Technische Aspekte, Grundlagen
    und gesellschaftliche Aspekte, Cybersicherheit für KI-Systeme.'
  - 'Definitionsdivergenz: Art. 3 Nr. 1 KI-VO gegen EN ISO/IEC 22989 — die Verordnung folgt der OECD-Definition
    in der Fassung von 2023, nicht der ISO-Definition.'
  - CEN/CLC/TR 18145:2025 zu grüner und nachhaltiger KI — ohne Anknüpfungspunkt in der KI-VO, aber anschlussfähig
    an die Berichtspflichten der CSRD.
  - 'Doppelnormung: prEN ISO/IEC 24970 (Protokollierung) und prEN 18229-1 (Logging) bearbeiten dieselbe
    Materie.'
  dokumente:
