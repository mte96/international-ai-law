- id: wipo-conversation-ip-frontier-technologies
  jurisdiktion: wipo
  kurztitel: WIPO Conversation on IP and Frontier Technologies
  offizieller_titel: 'The WIPO Conversation on Intellectual Property and Frontier Technologies — offener
    Mehrparteienprozess der Weltorganisation für geistiges Eigentum

    '
  fundstelle: WIPO, Genf; seit September 2019
  verfahrensnummer: WIPO-Sekretariat; kein Normsetzungsverfahren
  status: softlaw
  status_detail: 'Laufend, zwölf Sitzungen bis Rechercheschluss. Die zwölfte Sitzung (28./29.10.2025)
    behandelte geistiges Eigentum und synthetische Medien — KI-erzeugte Bilder, Videos, Audio und Text,
    Deepfakes und die unbefugte Nutzung von Werken und Persönlichkeitsmerkmalen. Insgesamt haben rund
    17.000 Teilnehmende aus 172 Staaten mitgewirkt. Kein Normungs- oder Vertragsverfahren; die WIPO hat
    zu KI bislang keinen Vertragsentwurf vorgelegt.

    '
  kurzbeschreibung: 'Das einzige globale Forum, in dem die immaterialgüterrechtlichen Fragen der KI zwischen
    Staaten, Ämtern, Wissenschaft und Wirtschaft verhandelt werden. Themen der Sitzungen: Grundsatzfragen
    zu KI und geistigem Eigentum (1-3), Daten (4), neue Technologien in der Verwaltung von Schutzrechten
    (5), KI-Erfindungen und die Rolle der Ämter (6), Metaverse (7), generative KI und Schaffen (8), Trainingsdaten
    und Schutzrechte (9-10), Urheberrechtsinfrastruktur für generative KI (11), synthetische Medien (12).
    Ergänzend führt die WIPO ein AI and IP Clearing House, das die einschlägigen staatlichen Instrumente
    sammelt, sowie die Reihe WIPO Technology Trends.

    '
  inkrafttreten:
    datum: 2019-09-27
    verifiziert: false
    quelle: https://www.wipo.int/en/web/frontier-technologies/frontier_conversation
  anwendungsdaten:
  - datum: 2025-10-28
    was_gilt: 'Zwölfte Sitzung: Geistiges Eigentum und synthetische Medien (28./29.10.2025).'
    verifiziert: true
    quelle: https://www.wipo.int/en/web/frontier-technologies/frontier_conversation
  themenachsen:
  - urheberrecht
  - governance
  - content
  rechtswirkung: 'Keine. Ein Gesprächsformat ohne Beschlusskompetenz; die Sitzungen enden mit einer Zusammenfassung
    des Sekretariats, nicht mit einem Beschluss. Für die Erfinderschaftsfrage bedeutet das: Die WIPO hat
    die Divergenz zwischen den Rechtsordnungen dokumentiert (DABUS-Linie — EPA, UK Supreme Court, USPTO,
    australischer Full Court gegen die südafrikanische Erteilung), aber keine Harmonisierung vorbereitet.
    Wer in diesem Feld arbeitet, findet bei der WIPO die Materialsammlung, nicht die Lösung.

    '
  regelungsschwerpunkte:
  - Sitzung 6 (2022) zu KI-Erfindungen mit Faktenblatt zur Praxis der Ämter — die Referenz zur Erfinderschaftsfrage.
  - Sitzungen 9 bis 11 zu Trainingsdaten und Urheberrechtsinfrastruktur — die Materialgrundlage der Debatte
    um Transparenz, Zustimmung und Vergütung, die in der EU über Art. 53 Abs. 1 lit. c und d KI-VO geführt
    wird.
  - 'AI and IP Clearing House: laufend aktualisierte Sammlung staatlicher Instrumente zu KI und geistigem
    Eigentum.'
  - Kein Vertragsentwurf, keine Empfehlung, kein Musterrecht — die WIPO verhält sich in der KI-Frage deutlich
    zurückhaltender als bei früheren Technologiesprüngen.
