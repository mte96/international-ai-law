- id: oecd-ki-observatorium
  jurisdiktion: oecd
  kurztitel: OECD AI Policy Observatory und Klassifizierungsrahmen
  offizieller_titel: 'OECD.AI Policy Observatory nebst OECD Framework for the Classification of AI Systems
    (OECD Digital Economy Papers No. 323, Februar 2022)

    '
  fundstelle: OECD Digital Economy Papers No. 323
  verfahrensnummer: OECD Committee on Digital Policy (CDEP), Netzwerk von Experten (ONE AI)
  status: softlaw
  status_detail: 'Laufend. Das Observatorium führt die Datenbank nationaler KI-Politiken (über 1.000 Initiativen
    aus mehr als 70 Rechtsordnungen), den Katalog der Werkzeuge und Metriken für vertrauenswürdige KI,
    das Verzeichnis der KI-Vorfälle (AIM) und seit 2025 die HAIP-Berichtsplattform. Der Klassifizierungsrahmen
    von 2022 ist unverändert in Kraft.

    '
  kurzbeschreibung: 'Das Observatorium ist keine Rechtsquelle, sondern Infrastruktur — und als solche
    das nützlichste Werkzeug der transnationalen Ebene für die Rechtsvergleichung: Wer wissen will, welche
    Rechtsordnung welches Instrument erlassen hat, findet es hier zuerst. Der Klassifizierungsrahmen ordnet
    KI-Systeme nach fünf Dimensionen: Menschen und Planet; wirtschaftlicher Kontext; Daten und Eingaben;
    KI-Modell; Aufgabe und Ausgabe. Er ist der methodische Vorläufer der Risikoklassifizierung der KI-VO
    und wird von mehreren Aufsichtsbehörden für die Systemkategorisierung herangezogen.

    '
  inkrafttreten:
    datum: 2022-02-22
    verifiziert: false
    quelle: https://www.oecd.org/en/publications/oecd-framework-for-the-classification-of-ai-systems_cb6d9eca-en.html
  anwendungsdaten: []
  themenachsen:
  - governance
  - wettbewerb
  rechtswirkung: 'Keine. Politische und wissenschaftliche Infrastruktur. Mittelbare Bedeutung, weil Aufsichtsbehörden
    und Gerichte auf den Klassifizierungsrahmen zurückgreifen, wenn sie ein System einordnen müssen, und
    weil der Katalog der Werkzeuge und Metriken in der Neufassung des HAIP-Berichtsrahmens verlinkt ist.

    '
  regelungsschwerpunkte:
  - 'Fünf Dimensionen der Klassifizierung: Menschen und Planet, wirtschaftlicher Kontext, Daten und Eingaben,
    KI-Modell, Aufgabe und Ausgabe.'
  - Datenbank nationaler KI-Politiken — die einzige systematische Sammlung dieser Art.
  - AI Incidents Monitor (AIM) — Vorfallsverzeichnis; für die Haftungsforschung eine bislang unterschätzte
    Quelle.
