- id: intl-ki-sicherheitsbericht
  jurisdiktion: intl
  kurztitel: Internationaler KI-Sicherheitsbericht
  offizieller_titel: 'International AI Safety Report — jährlicher Bericht über die Fähigkeiten und Risiken
    universell einsetzbarer künstlicher Intelligenz unter dem Vorsitz von Yoshua Bengio

    '
  fundstelle: internationalaisafetyreport.org; Ausgabe 2026 vom 03.02.2026
  verfahrensnummer: Auftrag des KI-Sicherheitsgipfels von Bletchley Park (November 2023)
  status: softlaw
  status_detail: 'Zweite Vollausgabe am 03.02.2026 veröffentlicht, erstellt von über 100 Sachverständigen
    unter Beteiligung eines Beirats aus mehr als 30 Staaten und internationalen Organisationen, darunter
    EU, OECD und Vereinte Nationen. Ausdrücklich ohne Politikempfehlungen und ohne Bindung der beteiligten
    Regierungen.

    '
  kurzbeschreibung: 'Der Bericht ist der Versuch, für KI zu leisten, was der Weltklimarat für das Klima
    leistet: eine gemeinsame, von Regierungen getragene wissenschaftliche Grundlage. Die Ausgabe 2026
    ordnet die Risiken in drei Gruppen — böswillige Nutzung (Cyberangriffe, biologische Waffen), Fehlfunktionen
    (Zuverlässigkeitsversagen, Kontrollverlust) und systemische Risiken (Arbeitsmarktverwerfungen, Bedrohungen
    der menschlichen Autonomie). Kernbefunde: Die Fähigkeiten wachsen weiter rasch, besonders in Mathematik,
    Programmierung und autonomem Handeln; technische Schutzvorkehrungen haben erhebliche Grenzen, gestaffelte
    Verteidigung wirkt besser; die Verbreitung ist regional stark ungleich — über 50 Prozent in einzelnen
    Staaten, unter 10 Prozent in weiten Teilen Afrikas, Asiens und Lateinamerikas.

    '
  inkrafttreten:
    datum: 2026-02-03
    verifiziert: false
    quelle: https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026
  anwendungsdaten:
  - datum: 2026-02-03
    was_gilt: Veröffentlichung der Ausgabe 2026.
    verifiziert: false
    quelle: https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026
  themenachsen:
  - governance
  - sicherheit-export
  - gpai
  - arbeit
  rechtswirkung: 'Keine. Der Bericht macht ausdrücklich keine Politikempfehlungen und gibt nicht die Auffassung
    der beteiligten Regierungen wieder. Seine juristische Bedeutung ist mittelbar, aber real: Er ist die
    am breitesten getragene Feststellung dessen, was über Fähigkeiten und Risiken bekannt ist, und damit
    die naheliegende Referenz für die Frage, was ein Anbieter zu einem bestimmten Zeitpunkt wissen musste.
    Für Art. 55 KI-VO (systemisches Risiko) und für die Haftung nach der Produkthaftungsrichtlinie ist
    das der Anknüpfungspunkt.

    '
  regelungsschwerpunkte:
  - 'Drei Risikogruppen: böswillige Nutzung, Fehlfunktionen, systemische Risiken.'
  - 'Fortschritte seit der Ausgabe 2025: Goldmedaillenniveau bei Aufgaben der Internationalen Mathematikolympiade;
    KI-Agenten bewältigen zuverlässig Programmieraufgaben von 30 Minuten Dauer (zuvor 10).'
  - Mehrere Entwickler haben Schutzvorkehrungen ergänzt, weil sie nicht ausschließen konnten, dass ihre
    Modelle Laien bei der Entwicklung biologischer Waffen unterstützen — die konkreteste Aussage des Berichts.
  - 'Personelle Überschneidung mit dem UN-Wissenschaftsausschuss: Bengio führt beide Gremien.'
  dokumente:
  - datum: 2026-02-03
    typ: bericht
    titel: International AI Safety Report 2026
    url: https://internationalaisafetyreport.org/publication/international-ai-safety-report-2026
    sprache: en
    urheber: Yoshua Bengio (Vorsitz) und über 100 Sachverständige
    verifiziert: false
    notiz: 'Primärquelle. Belegt Veröffentlichungsdatum, Beteiligung von mehr als 30 Staaten und Organisationen,
      die drei Risikogruppen und die ausdrückliche Unverbindlichkeit.

      '
  - datum: 2026-02-10
    typ: stellungnahme
    titel: International AI Safety Report 2026 Examines AI Capabilities, Risks, and Safeguards
    url: https://www.insideglobaltech.com/2026/02/10/international-ai-safety-report-2026-examines-ai-capabilities-risks-and-safeguards/
    sprache: en
    urheber: Covington & Burling
    verifiziert: false
    notiz: Anwaltliche Auswertung;
  offene_punkte:
  - Verhältnis zum Jahresbericht des UN-Wissenschaftsausschusses — zwei parallele Berichtswerke unter
    demselben Vorsitz.
