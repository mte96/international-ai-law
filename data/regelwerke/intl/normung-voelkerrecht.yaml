  rechtswirkung: 'Politische Absichtserklärung. Resolutionen der Generalversammlung sind nach Art. 10,
    11 UN-Charta Empfehlungen und begründen keine Rechtspflichten. Sie können allenfalls als Beleg für
    eine entstehende Rechtsüberzeugung im Sinne des Völkergewohnheitsrechts herangezogen werden — bei
    zwei Resolutionen im Konsens, die ausschließlich Empfehlungssprache verwenden, ist das fernliegend.

    '
  regelungsschwerpunkte:
  - Konsensannahme ohne Abstimmung bei beiden — bemerkenswert angesichts der geopolitischen Lage, aber
    erkauft durch die Unverbindlichkeit.
  - 'Arbeitsteilung: Sicherheit und Vertrauenswürdigkeit (US-Initiative) gegen Kapazitätsaufbau und Zugang
    (chinesische Initiative).'
  - Keine Institution, kein Berichtsverfahren, kein Zeitplan — der Unterschied zu A/RES/79/325 ist genau
    dieser.
