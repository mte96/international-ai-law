- id: iso-en-18286
  jurisdiktion: iso
  kurztitel: EN 18286:2026 — Qualitätsmanagementsystem
  offizieller_titel: 'EN 18286:2026 — Artificial intelligence — Quality management system for EU AI Act
    regulatory purposes

    '
  normnummer: EN 18286:2026
  fundstelle: CEN-CENELEC, angenommen 12.07.2026, veröffentlicht 31.07.2026
  verfahrensnummer: CEN/CLC/JTC 21, WI 00021002
  status: softlaw
  status_detail: 'Veröffentlicht, aber ohne Rechtswirkung. Erste und bei Rechercheschluss einzige fertiggestellte
    harmonisierte Norm zur KI-VO. Annahme durch CEN-CENELEC am 12.07.2026, Veröffentlichung am 31.07.2026.
    Die Zitierung im Amtsblatt steht aus; bis dahin trägt sie keine Konformitätsvermutung. Umfang 51 Seiten
    (Umfrageentwurf: 58).

    '
  kurzbeschreibung: 'Die Norm legt Anforderungen an ein Qualitätsmanagementsystem für Anbieter von KI-Systemen
    fest und bedient Art. 17 KI-VO. Sie ist sektorunabhängig und lebenszyklusorientiert: Konzeption, Entwicklung,
    Bereitstellung, Überwachung, Außerbetriebnahme. Zehn normative Abschnitte und fünf informative Anhänge
    (A-C, ZA, ZB). Anhang ZA weist die Zuordnung zu Art. 17 Abs. 1 und Art. 11 Abs. 1 Satz 1 KI-VO aus
    — er ist der Grund, warum die Norm nach Zitierung eine Vermutung tragen kann. Ausdrücklich als architektonischer
    Bruch mit ISO 9001 und EN ISO/IEC 42001 angelegt: Sie ist kein Managementsystem für die Organisation,
    sondern ein Regulierungs-QMS für den Anbieter eines Hochrisikosystems.

    '
  inkrafttreten:
    datum: 2026-07-31
    verifiziert: true
