  rechtswirkung: 'Politische Absichtserklärung ohne jede Rechtswirkung. Die Gipfel haben genau zwei dauerhafte
    Institutionen hervorgebracht — den Internationalen KI-Sicherheitsbericht und das Netzwerk der Evaluierungsinstitute.
    Alles Übrige sind Erklärungen. Bemerkenswert ist, was die Zahlen zeigen: In Neu-Delhi billigten 89
    von 118 vertretenen Staaten die Erklärung — das ist keine Einstimmigkeit, und schon in Paris hatten
    die USA und das Vereinigte Königreich nicht unterzeichnet.

    '
  regelungsschwerpunkte:
  - 'Bletchley 2023: Erklärung von 28 Staaten und der EU; Auftrag für den Internationalen KI-Sicherheitsbericht.'
  - 'Seoul 2024: Frontier AI Safety Commitments von 16 Unternehmen; Gründung des Netzwerks der Sicherheitsinstitute.'
  - 'Paris 2025: keine Unterschrift der USA und des Vereinigten Königreichs unter die Abschlusserklärung
    — der Bruch der Reihe.'
  - 'Neu-Delhi 2026: Verbreitungsagenda; rund 250 Mrd. USD Infrastrukturzusagen und 20 Mrd. USD Wagniskapital
    angekündigt; alle Zusagen freiwillig.'
  - Ob die USA und China die New Delhi Declaration gebilligt haben, ist aus den vorliegenden Quellen nicht
    ersichtlich.
