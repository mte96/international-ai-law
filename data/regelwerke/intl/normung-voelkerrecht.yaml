    sprache: en
    urheber: Europarat
    verifiziert: true
    notiz: 'Primärquelle. Art. 30 (Inkrafttreten), Art. 3 (Anwendungsbereich, private Akteure, nationale
      Sicherheit), Art. 22 (weitergehender Schutz), Art. 26 (Aufsichtsmechanismen) wurden im Wortlaut
      geprüft.

      '
