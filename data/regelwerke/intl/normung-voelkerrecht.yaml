    Eintrags. Die amtliche Ratifikationstabelle des Vertragsbüros ist nur mit JavaScript abrufbar.
  - Welche Erklärungen nach Art. 3 Abs. 1 lit. b abgegeben wurden — sie bestimmen die materielle Reichweite
    je Partei und sind nirgends konsolidiert veröffentlicht.
  - Ob die USA nach dem Regierungswechsel die Zeichnung vom 05.09.2024 weiterverfolgen; eine Ratifikation
