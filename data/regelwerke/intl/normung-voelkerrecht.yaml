- id: iso-iec-25059
  jurisdiktion: iso
  kurztitel: ISO/IEC 25059:2023 — Qualitätsmodell für KI-Systeme
  offizieller_titel: 'ISO/IEC 25059:2023 — Software engineering — Systems and software Quality Requirements
    and Evaluation (SQuaRE) — Quality model for AI systems

    '
  normnummer: ISO/IEC 25059:2023
  fundstelle: ISO/IEC JTC 1/SC 42, veröffentlicht Juni 2023, 1. Ausgabe
  verfahrensnummer: ISO/IEC JTC 1/SC 42; als EN ISO/IEC 25059 in Europa übernommen
  status: softlaw
  status_detail: 'Veröffentlicht Juni 2023; im Katalog auf Stufe 90.92 geführt, also zur Überarbeitung
    vorgesehen. Europäisch übernommen, nicht harmonisiert.

    '
  kurzbeschreibung: 'Erweitert das Qualitätsmodell der SQuaRE-Reihe (ISO/IEC 25010) um KI-spezifische
    Merkmale und Teilmerkmale — unter anderem funktionale Anpassungsfähigkeit, Robustheit, Transparenz,
    Interpretierbarkeit, Steuerbarkeit, Ethik-bezogene Merkmale. Damit liefert sie die Vokabeln, in denen
    sich Genauigkeit und Robustheit im Sinne des Art. 15 KI-VO überhaupt formulieren lassen. Ohne ein
    solches Modell bleibt „Genauigkeit“ ein Wort ohne Maß.

    '
  inkrafttreten:
    datum: 2023-06-01
    verifiziert: true
    quelle: https://www.iso.org/standard/80655.html
  anwendungsdaten: []
  themenachsen:
  - governance
  - marktzugang
  - haftung
  bedient_artikel: keinen unmittelbar. Methodische Grundlage für Art. 15 KI-VO (Genauigkeit, Robustheit)
    und für prEN 18229-2.
  bearbeitungsstand: veröffentlicht, zur Überarbeitung vorgesehen (90.92)
  rechtswirkung: 'Keine Vermutungswirkung. Praktisch die maßgebliche Referenz für die Angabe von Genauigkeitsgraden
    nach Art. 15 Abs. 3 KI-VO, solange prEN 18229-2 fehlt.

    '
  regelungsschwerpunkte:
  - Erweiterung von ISO/IEC 25010 um KI-Merkmale; ergänzt durch ISO/IEC TS 25058 (Leitfaden zur Bewertung).
  - Bezug zu ISO/IEC TS 4213 (Bewertung der Klassifikationsleistung maschinellen Lernens) und ISO/IEC
    24029 (Robustheit neuronaler Netze).
