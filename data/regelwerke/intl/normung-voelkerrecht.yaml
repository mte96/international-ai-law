- id: iso-pren-18228
  jurisdiktion: iso
  kurztitel: prEN 18228 — Risikomanagement
  offizieller_titel: prEN 18228 — Artificial intelligence — Risk management
  normnummer: prEN 18228
  fundstelle: CEN/CLC/JTC 21, Entwurf im Umfrageverfahren
  verfahrensnummer: CEN/CLC/JTC 21
  status: entwurf
  status_detail: 'Öffentliche Umfrage (Enquiry) seit Mai 2026, Einreichungsfrist Ende Juli 2026. Nach
    dem Oktober-2025-Beschluss kann bei positivem Umfrageergebnis direkt veröffentlicht werden, ohne gesonderte
    Schlussabstimmung. Zielhorizont für die Verfügbarkeit: Q4 2026. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Die zentrale Norm für Art. 9 KI-VO und damit für jedes Hochrisikosystem. Nach eigener
    Aussage die erste horizontale KI-Risikomanagementnorm weltweit, die aus der Produktsicherheit heraus
    gedacht ist. Drei Gestaltungsentscheidungen prägen sie: Der Risikobegriff folgt der Produktsicherheitskonvention,
    wird aber auf Grundrechte erstreckt; interne Richtlinien zählen ausdrücklich nicht als Risikominderungsmaßnahme,
    sondern nur substanzielle Maßnahmen am System; und Risiko wird nicht durchgängig als quantifizierbar
    vorausgesetzt. Die zweite Entscheidung ist die praktisch schärfste — sie entwertet Compliance-Papier
    als Nachweis.

    '
