  themenachsen:
  - governance
  - marktzugang
  - grundrechte
  - sicherheit-export
  rechtswirkung: 'Der Auftrag selbst bindet nur CEN und CENELEC. Für Anbieter entsteht Rechtswirkung erst
    mittelbar: Eine auf den Auftrag zurückgehende und im Amtsblatt zitierte Norm begründet nach Art. 40
    Abs. 1 KI-VO die widerlegliche Vermutung, dass die davon erfassten Anforderungen erfüllt sind. Ohne
    Zitierung ist die Norm eine private technische Regel ohne jede Vermutungswirkung — und Anbieter tragen
    die volle Darlegungslast für die Einhaltung der Art. 8-15 KI-VO.

    '
  regelungsschwerpunkte:
  - 'Zehn angeforderte Normungsbereiche: Risikomanagement, Datenqualität und -governance, Aufzeichnung,
    Transparenz, menschliche Aufsicht, Genauigkeit, Robustheit, Cybersicherheit, Qualitätsmanagement,
    Konformitätsbewertung.'
  - 'Dreistufiges Nadelöhr des Art. 40 KI-VO: (1) Entwicklung auf Normungsauftrag, (2) Bewertung durch
    die Kommission (HAS-Consultants prüfen auf Übereinstimmung mit dem Auftrag und der Verordnung), (3)
    Zitierung im Amtsblatt. Erst der dritte Schritt löst die Vermutung aus.'
  - 'Art. 41 KI-VO als Notausgang: Die Kommission kann gemeinsame Spezifikationen im Wege eines Durchführungsrechtsakts
    erlassen, wenn die Normung ausbleibt oder unzureichend ist. Von dieser Befugnis wurde bei Rechercheschluss
    kein Gebrauch gemacht — obwohl der Tatbestand seit dem Verstreichen der zweiten Lieferfrist erkennbar
    vorliegt.'
  - 'Der Auftrag verlangt ausdrücklich die Berücksichtigung von Grundrechten — der wunde Punkt: Normungsgremien
    sind für Produktsicherheit gebaut, nicht für Grundrechtsabwägung. Der JRC-Bericht (JRC139430, Oktober
    2024) benennt genau diese Lücke.'
  - 'Warum keine schlichte Übernahme von ISO/IEC-Normen: Die Kommission hat die Übernahme internationaler
    Normen als Erfüllung des Auftrags nicht akzeptiert, weil ISO/IEC-Normen nicht auf die Anforderungen
    der KI-VO zugeschnitten sind. Die europäische Eigenentwicklung (EN 18286, prEN 18228 ff.) ist die
    Folge.'
