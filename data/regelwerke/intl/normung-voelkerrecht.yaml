- id: iso-iec-tr-24028
  jurisdiktion: iso
  kurztitel: ISO/IEC TR 24028:2020 — Vertrauenswürdigkeit (Überblick)
  offizieller_titel: 'ISO/IEC TR 24028:2020 — Information technology — Artificial intelligence — Overview
    of trustworthiness in artificial intelligence

    '
  normnummer: ISO/IEC TR 24028:2020
  fundstelle: ISO/IEC JTC 1/SC 42, veröffentlicht Mai 2020, 1. Ausgabe
  verfahrensnummer: ISO/IEC JTC 1/SC 42
  status: softlaw
  status_detail: 'Technischer Bericht, veröffentlicht Mai 2020, in systematischer Überprüfung, bislang
    nicht überarbeitet. Sechs Jahre alt und damit älter als jedes große Sprachmodell des heutigen Markts
    — als Bestandsaufnahme überholt, als Begriffsquelle weiterhin einschlägig.

    '
  kurzbeschreibung: 'Der begriffliche Ausgangspunkt der gesamten KI-Normung: Der Bericht entfaltet, was
    Vertrauenswürdigkeit bedeutet — Transparenz, Erklärbarkeit, Steuerbarkeit, Verfügbarkeit, Widerstandsfähigkeit,
    Zuverlässigkeit, Genauigkeit, Sicherheit, Datenschutz — und beschreibt technische Schwachstellen und
    Gegenmaßnahmen. Er legt ausdrücklich keine Vertraünswürdigkeitsstufen fest. Genau diese Zurückhaltung
    ist der Grund, warum er als Rechtsgrundlage nichts trägt: Ein Technischer Bericht kann nach den ISO-Regeln
    keine Anforderungen enthalten.

    '
  inkrafttreten:
    datum: 2020-05-01
    verifiziert: true
    quelle: https://www.iso.org/standard/77608.html
  anwendungsdaten: []
  themenachsen:
  - governance
  - grundrechte
  bedient_artikel: keinen. Begriffsquelle für die Trustworthiness-Terminologie der KI-VO-Erwägungsgründe.
  bearbeitungsstand: veröffentlicht (TR), systematische Überprüfung
  rechtswirkung: 'Keine. Technische Berichte sind nach den ISO/IEC-Regeln keine Normen; sie enthalten
    keine Anforderungen, sind nicht zertifizierbar und nicht harmonisierbar. Wer eine „Zertifizierung
    nach ISO 24028“ angeboten bekommt, sollte misstrauisch werden.

    '
  regelungsschwerpunkte:
  - Schließt Vertraünswürdigkeitsstufen ausdrücklich aus dem Anwendungsbereich aus.
  - Begrifflicher Vorlauf zu ISO/IEC 22989 (Konzepte und Terminologie) und zu den Trustworthiness-Erwägungsgründen
    der KI-VO.
  dokumente:
  - datum: 2026-08-31
