- id: iso-iec-42006
  jurisdiktion: iso
  kurztitel: ISO/IEC 42006:2025 — Anforderungen an Zertifizierungsstellen
  offizieller_titel: 'ISO/IEC 42006:2025 — Information technology — Artificial intelligence — Requirements
    for bodies providing audit and certification of artificial intelligence management systems

    '
  normnummer: ISO/IEC 42006:2025
  fundstelle: ISO/IEC JTC 1/SC 42, veröffentlicht 07.07.2025, 1. Ausgabe
  verfahrensnummer: ISO/IEC JTC 1/SC 42
  status: softlaw
  status_detail: 'Veröffentlicht am 07.07.2025. Ergänzt ISO/IEC 17021-1 um KI-spezifische Auditanforderungen.
    Erst mit dieser Norm ist die Akkreditierung von Zertifizierungsstellen für ISO/IEC 42001 auf einheitlicher
    Grundlage möglich; Akkreditierungsstellen wie ANAB stützen ihre Programme darauf.

    '
  kurzbeschreibung: 'Legt fest, welche Anforderungen Stellen erfüllen müssen, die KI-Managementsysteme
    nach ISO/IEC 42001 auditieren und zertifizieren: Kompetenz der Auditoren, Auditzeiten, Umgang mit
    Mehrfachstandorten, Behandlung von KI-spezifischen Prüffeldern wie Ethik, Datenqualität, Risiko und
    Transparenz. Adressaten sind Zertifizierungs- und Akkreditierungsstellen, nicht Anbieter. Die Norm
    entscheidet über den Wert jeder ISO/IEC 42001-Bescheinigung: Ohne akkreditierte Zertifizierung ist
    die Bescheinigung eine Privaturkunde.

    '
  inkrafttreten:
    datum: 2025-07-07
    verifiziert: true
    quelle: https://www.iso.org/standard/42006
  anwendungsdaten:
  - datum: 2025-07-07
    was_gilt: Veröffentlichung; Grundlage der Akkreditierungsprogramme.
    verifiziert: true
    quelle: https://www.iso.org/standard/42006
  themenachsen:
  - governance
  - marktzugang
  - berufsrecht
  bedient_artikel: keinen. Betrifft die private Zertifizierungsinfrastruktur, nicht die Konformitätsbewertung
    nach Art. 43 KI-VO.
  bearbeitungsstand: veröffentlicht
  rechtswirkung: 'Keine gegenüber Anbietern. Mittelbar erheblich: Sie trennt akkreditierte von nicht akkreditierter
    Zertifizierung und ist damit das Instrument, mit dem sich die Belastbarkeit einer vorgelegten Bescheinigung
    prüfen lässt. Für die Vertragsgestaltung heißt das: Nicht „ISO 42001-zertifiziert“ zusichern lassen,
    sondern „zertifiziert durch eine nach ISO/IEC 42006 akkreditierte Stelle, Akkreditierungsstelle benannt".

    '
  regelungsschwerpunkte:
  - Ergänzt ISO/IEC 17021-1 (allgemeine Anforderungen an Managementsystem-Zertifizierer) um KI-spezifische
    Elemente.
  - Kompetenzanforderungen an Auditoren — der praktische Engpass, weil qualifizierte KI-Auditoren knapp
    sind.
  - 'Abgrenzung: regelt nicht die benannten Stellen nach Art. 31 KI-VO. Deren Anforderungen folgen aus
    der Verordnung selbst und aus prEN 18285.'
  dokumente:
