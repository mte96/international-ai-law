- id: un-ga-ki-resolutionen-2024
  jurisdiktion: un
  kurztitel: Resolutionen der UN-Generalversammlung zu KI (2024)
  offizieller_titel: 'A/RES/78/265 „Seizing the opportunities of safe, secure and trustworthy artificial
    intelligence systems for sustainable development“ (21.03.2024) und A/RES/78/311 „Enhancing international
    cooperation on capacity-building of artificial intelligence“ (01.07.2024)

    '
  fundstelle: A/RES/78/265; A/RES/78/311
  verfahrensnummer: 78. Tagung der Generalversammlung
  status: softlaw
  status_detail: 'Beide ohne Abstimmung im Konsens angenommen. A/RES/78/265 ging auf eine Initiative der
    Vereinigten Staaten zurück und wurde von mehr als 120 Staaten mitgetragen; A/RES/78/311 auf eine Initiative
    Chinas. Die beiden Resolutionen markieren die geopolitische Arbeitsteilung: Der Westen setzte das
    Thema Sicherheit und Vertrauenswürdigkeit, China das Thema Kapazitätsaufbau und Zugang des globalen
    Südens.

    '
  kurzbeschreibung: 'Die ersten eigenständigen KI-Resolutionen der Generalversammlung. A/RES/78/265 ruft
    die Mitgliedstaaten auf, sichere und vertrauenswürdige KI-Systeme zu fördern, Menschenrechte über
    den gesamten Lebenszyklus zu achten, Regulierungs- und Governance-Ansätze zu entwickeln und die Kluft
    zwischen entwickelten und Entwicklungsländern zu schließen. A/RES/78/311 verpflichtet auf internationale
    Zusammenarbeit beim Aufbau von KI-Fähigkeiten, Technologietransfer und Finanzierung. Beide sind Absichtserklärungen
    ohne Umsetzungsmechanismus; ihre Bedeutung liegt darin, dass KI-Governance damit auf der Tagesordnung
    der Generalversammlung angekommen ist — die Vorstufe zu A/RES/79/325.

    '
  inkrafttreten:
    datum: 2024-03-21
    verifiziert: true
    quelle: https://digitallibrary.un.org/record/4043244/files/A_RES_78_265-EN.pdf?version=1
  anwendungsdaten:
  - datum: 2024-03-21
