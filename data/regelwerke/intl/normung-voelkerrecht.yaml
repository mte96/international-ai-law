  bearbeitungsstand: Enquiry
  rechtswirkung: 'Derzeit keine. Nach Zitierung Konformitätsvermutung für Art. 15 Abs. 5. Bis dahin bleibt
    für die Praxis der Rückgriff auf ISO/IEC 27001 und die entstehende ISO/IEC 27090 (Schutz vor Angriffen
    auf KI-Systeme) — beide ohne Vermutungswirkung.

    '
  regelungsschwerpunkte:
  - 'KI-spezifische Angriffsklassen: Data Poisoning, Model Poisoning, Adversarial Examples, Modellextraktion,
    Prompt-Injektion.'
  - 'Doppelregulierung mit dem Cyber Resilience Act (VO (EU) 2024/2847): Ein KI-System in einem vernetzten
    Produkt unterliegt beiden Regimen; die Konformitätsbewertung ist zu koordinieren.'
  - Paralleles ISO/IEC-Projekt 27090 (Guidance for addressing security threats to AI systems) in Bearbeitung.
