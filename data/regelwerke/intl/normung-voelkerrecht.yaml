  jurisdiktion: iso
  kurztitel: prEN 18229-2 — Genauigkeit und Robustheit
  offizieller_titel: 'prEN 18229-2 — Artificial intelligence — AI trustworthiness framework — Part 2:
    Accuracy and robustness

    '
  normnummer: prEN 18229-2
  fundstelle: CEN/CLC/JTC 21
  verfahrensnummer: CEN/CLC/JTC 21
  status: entwurf
  status_detail: 'Stufe Drafting (Stand Juni 2026) — frühe Bearbeitungsstufe, Termin ausdrücklich „evolving“.
    Nicht Teil der vier Schlüsselnormen mit Zielhorizont Q4 2026. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Bedient Art. 15 KI-VO, soweit es um Genauigkeit und Robustheit geht. Das ist die
    technisch anspruchsvollste und juristisch heikelste Anforderung der Verordnung: Art. 15 Abs. 3 verlangt
    die Angabe von Genauigkeitsgraden in der Gebrauchsanweisung, ohne zu sagen, wie Genauigkeit zu messen
    ist. Solange die Norm fehlt, ist die Pflicht praktisch unbestimmt. Flankiert wird sie durch aufgabenspezifische
    Bewertungsverfahren (prEN 18281 für Bildverarbeitung, prEN ISO/IEC 23282 für Sprachverarbeitung).

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://kla.digital/blog/jtc-21-standards-tracker
  anwendungsdaten: []
  themenachsen:
  - governance
  - marktzugang
  - haftung
  bedient_artikel: Art. 15 KI-VO (Genauigkeit, Robustheit, Cybersicherheit) — Teilbereich Genauigkeit
    und Robustheit
  bearbeitungsstand: Drafting
  rechtswirkung: 'Keine. Der Rückstand ist praktisch bedeutsam: Art. 15 Abs. 3 KI-VO verlangt die Angabe
    der Genauigkeitsgrade, ohne ein Messverfahren vorzugeben. Ohne Norm kann jeder Anbieter seine eigene
    Metrik wählen — ein Ergebnis, das die Vergleichbarkeit, auf die die Verordnung zielt, gerade verhindert.

    '
  regelungsschwerpunkte:
  - 'Aufgabenspezifische Bewertungsverfahren als Ergänzung: prEN 18281 (Computer Vision), prEN ISO/IEC
    23282 (NLP), ISO/IEC 24029-3 (statistische Robustheit neuronaler Netze).'
  - Die Trennung von Genauigkeit (Teil 2) und Cybersicherheit (prEN 18282) folgt nicht der Systematik
    des Art. 15, der beides zusammenfasst.
