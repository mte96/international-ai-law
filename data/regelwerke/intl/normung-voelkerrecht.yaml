- id: coe-rahmenkonvention-ki-cets-225
  jurisdiktion: coe
  kurztitel: Rahmenkonvention über KI (CETS 225)
  offizieller_titel: 'Rahmenübereinkommen des Europarats über künstliche Intelligenz und Menschenrechte,
    Demokratie und Rechtsstaatlichkeit

    '
  fundstelle: SEV Nr. 225 (CETS No. 225); angenommen 17.05.2024, aufgelegt zur Zeichnung 05.09.2024 in
    Vilnius
  verfahrensnummer: Ausschuss für künstliche Intelligenz (CAI), Textfertigstellung 14.03.2024
  status: verabschiedet
  status_detail: 'Angenommen und gezeichnet, bei Rechercheschluss nach überwiegender Quellenlage noch
    nicht in Kraft. Art. 30 verlangt fünf Ratifikationen, darunter drei Mitgliedstaaten des Europarats.
    Die Europäische Union hat am 15.05.2026 beim 135. Ministerkomitee in Chișinău ratifiziert; nach der
    Berechnung von nicfab.eu wird die Konvention für die Union zum 01.09.2026 wirksam. CAIDP (Stand 02.09.2026)
    und regulations.ai führen sie dagegen weiterhin als „Awaiting Entry“. Die amtliche Ratifikationstabelle
    war nicht abrufbar. Der Widerspruch ist ungeklärt.

    '
  kurzbeschreibung: 'Der erste völkerrechtlich bindende Vertrag über künstliche Intelligenz. Acht Kapitel,
    36 Artikel. Er verpflichtet die Vertragsparteien, Tätigkeiten im Lebenszyklus von KI-Systemen mit
    Menschenrechten, Demokratie und Rechtsstaatlichkeit in Einklang zu bringen: Grundsätze (Menschenwürde,
    Transparenz, Rechenschaft, Gleichheit, Privatheit, Zuverlässigkeit, sichere Innovation), Rechtsbehelfe
    einschließlich des Rechts, KI-gestützte Entscheidungen anzufechten, Risiko- und Folgenabschätzung,
    ein Aufsichtsmechanismus (Art. 26) und ein Folgeverfahren durch die Konferenz der Vertragsparteien.
    Die entscheidende Einschränkung steht in Art. 3: Unmittelbar erfasst sind nur öffentliche Stellen
    und private Akteure, die für sie handeln; wie die Parteien mit dem übrigen privaten Sektor umgehen,
    bestimmen sie durch Erklärung gegenüber dem Generalsekretär selbst. Nationale Sicherheit ist ausgenommen.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://rm.coe.int/1680afae3c
    hinweis: 'Art. 30: erster Tag des Monats nach Ablauf von drei Monaten nach der fünften Zustimmung,
      darunter mindestens drei Mitgliedstaaten des Europarats. Ob diese Schwelle erreicht ist, war in
      dieser Sitzung nicht verifizierbar; Quellen widersprechen sich.

      '
  anwendungsdaten:
  - datum: 2024-05-17
    was_gilt: Annahme des Übereinkommens durch das Ministerkomitee.
    verifiziert: true
    quelle: https://www.coe.int/en/web/artificial-intelligence/the-framework-convention-on-artificial-intelligence
  - datum: 2024-09-05
    was_gilt: Auflegung zur Zeichnung in Vilnius; erste Unterzeichnungen, darunter EU, USA, Vereinigtes
      Königreich.
    verifiziert: true
    quelle: https://www.coe.int/en/web/artificial-intelligence/the-framework-convention-on-artificial-intelligence
  - datum: 2026-03-11
    was_gilt: Zustimmung des Europäischen Parlaments zum Abschluss (Empfehlung A10-0007/2026).
    verifiziert: true
    quelle: https://www.europarl.europa.eu/doceo/document/A-10-2026-0007_EN.html
  - datum: 2026-05-15
    was_gilt: Hinterlegung der Ratifikationsurkunde der Europäischen Union in Chișinău.
    verifiziert: true
    quelle: https://www.coe.int/en/web/artificial-intelligence/-/european-union-ratifies-the-council-of-europe-framework-convention-on-artificial-intelligence
  - datum: 2026-09-01
    was_gilt: 'Nach der Berechnung von nicfab.eu Wirksamwerden für die Union (Art. 30 Abs. 4). Von keiner
      Primärquelle bestätigt.

      '
    verifiziert: false
    quelle: https://www.nicfab.eu/en/posts/cets225-ratifica-ue/
  themenachsen:
  - grundrechte
  - governance
  - sektor-oeffentlich
  - datenschutz
  rechtswirkung: 'Bindendes Völkerrecht — aber nur für die Vertragsparteien, nur im Umfang ihrer Erklärungen
    nach Art. 3 und ohne unmittelbare Wirkung für Einzelne. Kein Individualbeschwerdeverfahren, kein Gerichtshof,
    keine Sanktion. Das Übereinkommen bindet dort tatsächlich, wo ein Staat KI in der Verwaltung, Justiz
    oder Polizei einsetzt: Dort entstehen Pflichten zu Folgenabschätzung, Transparenz und Rechtsbehelf,
    die sich über die EMRK-Rechtsprechung mittelbar justiziabel machen lassen. Folgenlos bleibt es dort,
    wo private Anbieter ohne staatlichen Auftrag handeln — dort verweist die Union schlicht auf die KI-VO
    — und im Bereich der nationalen Sicherheit, den Art. 3 Abs. 2 ausnimmt.

    '
  regelungsschwerpunkte:
  - 'Art. 3 Abs. 1 lit. b: Für den privaten Sektor jenseits staatlichen Handelns entscheiden die Parteien
    selbst über die Art der Umsetzung und teilen sie dem Generalsekretär mit. Die Union hat erklärt, dass
    die Umsetzung für private Akteure ausschließlich über die KI-VO erfolgt — keine zweite Regelungsschicht.'
  - 'Art. 3 Abs. 2: Ausnahme für Tätigkeiten zum Schutz nationaler Sicherheitsinteressen, vorbehaltlich
    der Beachtung des Völkerrechts und demokratischer Institutionen. Der schwerwiegendste Vorbehalt; die
    CETaS-Analyse des Alan Turing Institute hat ihn früh benannt.'
  - 'Art. 22: Günstigkeitsklausel — weitergehender Schutz bleibt möglich. Das ist der Anknüpfungspunkt,
    an dem die KI-VO als Übererfüllung eingeordnet wird.'
  - 'Art. 26: Pflicht zur Einrichtung oder Benennung wirksamer, unabhängiger Aufsichtsmechanismen. In
    der Union werden dafür die Behörden nach Art. 70 KI-VO herangezogen.'
  - Kein Vorbehaltsrecht im klassischen Sinn, aber die Erklärung nach Art. 3 Abs. 1 lit. b wirkt funktional
    wie einer — sie bestimmt die materielle Reichweite.
  - 'Verhältnis zur KI-VO: unterschiedliche Ebenen. Die KI-VO harmonisiert den Binnenmarkt und bindet
    Private unmittelbar; CETS 225 formuliert rechtebasierte Grundsätze, die als Auslegungsmaßstab für
    die Anwendung der KI-VO dienen.'
  dokumente:
  - datum: 2024-09-05
    typ: endfassung
    titel: CETS 225 — Rahmenübereinkommen über künstliche Intelligenz und Menschenrechte, Demokratie und
      Rechtsstaatlichkeit (Vertragstext)
