    titel: 'Twelfth Session of the WIPO Conversation: Intellectual Property and Synthetic Media'
    url: https://www.wipo.int/meetings/en/details.jsp?meeting_id=89408
    sprache: en
    urheber: WIPO
    verifiziert: false
    notiz: Sitzungsseite mit Programm und Unterlagen;
  - datum: 2026-08-31
    typ: uebersicht
    titel: WIPO and Artificial Intelligence — AI and IP Clearing House
    url: https://www.wipo.int/en/web/frontier-technologies/artificial-intelligence/index
    sprache: en
    urheber: WIPO
    verifiziert: true
    notiz: 'Belegt das Clearing House als laufend aktualisierte Sammlung staatlicher Instrumente und die
      Themen der Sitzungen 6 bis 11.

      '
  offene_punkte:
  - Ob 2026 eine dreizehnte Sitzung stattfindet — nicht ermittelbar.
  - Ob die WIPO-Mitgliedstaaten ein Normsetzungsmandat zu KI erteilen; bislang nicht ersichtlich.
