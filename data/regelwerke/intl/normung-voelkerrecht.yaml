- id: iso-iec-42005
  jurisdiktion: iso
  kurztitel: ISO/IEC 42005:2025 — Folgenabschätzung für KI-Systeme
  offizieller_titel: 'ISO/IEC 42005:2025 — Information technology — Artificial intelligence (AI) — AI
    system impact assessment

    '
  normnummer: ISO/IEC 42005:2025
  fundstelle: ISO/IEC JTC 1/SC 42, veröffentlicht 28.05.2025, 1. Ausgabe
  verfahrensnummer: ISO/IEC JTC 1/SC 42
  status: softlaw
  status_detail: 'Veröffentlicht am 28.05.2025. Leitfaden, keine Anforderungsnorm — daher nicht zertifizierbar,
    aber als Umsetzungshilfe zu Anhang A von ISO/IEC 42001 gedacht.

    '
  kurzbeschreibung: 'Gibt Organisationen an die Hand, wie sie die Auswirkungen eines KI-Systems auf Einzelne,
    Gruppen und die Gesellschaft über den Lebenszyklus hinweg ermitteln, bewerten und dokumentieren. Enthält
    Vorgaben zu Zeitpunkt, Umfang, Beteiligten und Dokumentation der Folgenabschätzung. Für europäische
    Anwender die naheliegendste methodische Grundlage der Grundrechte-Folgenabschätzung nach Art. 27 KI-VO
    — mit dem Vorbehalt, dass die ISO-Norm auf Auswirkungen allgemein zielt, Art. 27 dagegen spezifisch
    auf Grundrechte.

    '
  inkrafttreten:
    datum: 2025-05-28
    verifiziert: true
    quelle: https://www.iso.org/standard/42005
  anwendungsdaten:
  - datum: 2025-05-28
    was_gilt: Veröffentlichung.
    verifiziert: true
    quelle: https://www.iso.org/standard/42005
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  bedient_artikel: 'keinen unmittelbar. Methodisch anschlussfähig an Art. 27 KI-VO (Grundrechte-Folgenabschätzung
    durch bestimmte Betreiber) und an Art. 35 DSGVO (Datenschutz-Folgenabschätzung).

    '
  bearbeitungsstand: veröffentlicht
  rechtswirkung: 'Keine. Ein Leitfaden ohne Anforderungen kann auch international nicht zertifiziert werden.
    Praktische Bedeutung als Dokumentationsvorlage: Wer nach Art. 27 KI-VO eine Grundrechte-Folgenabschätzung
    schuldet und sie nach ISO/IEC 42005 strukturiert, kann die Methodenwahl gegenüber der Aufsicht begründen.
    Die inhaltlichen Anforderungen ergeben sich aber aus Art. 27, nicht aus der Norm — und die HUDERIA-Methodik
    des Europarats ist dafür der genauere Zuschnitt.

    '
  regelungsschwerpunkte:
  - Ergänzt ISO/IEC 42001 (Anhang A) und ISO/IEC 23894; die drei Normen bilden zusammen den ISO-Governance-Kern.
  - 'Konkurrenz zu HUDERIA (Europarat, Methodik 26.02.2025, Modell 25.02.2026): Beide beanspruchen dasselbe
    Feld; HUDERIA ist grundrechtsspezifisch, ISO/IEC 42005 organisationsbezogen.'
