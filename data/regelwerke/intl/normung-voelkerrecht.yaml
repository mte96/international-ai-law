  - datum: 2026-09-02
    typ: uebersicht
    titel: International AI Treaty — Signatur- und Ratifikationsstand
    url: https://www.caidp.org/resources/coe-ai-treaty/
    sprache: en
    urheber: Center for AI and Digital Policy
