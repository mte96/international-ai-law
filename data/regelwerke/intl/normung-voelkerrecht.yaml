- id: un-itu-ki-normung
  jurisdiktion: un
  kurztitel: ITU — KI-Normung und AI for Good
  offizieller_titel: 'Internationale Fernmeldeunion (ITU) — Normungssektor ITU-T, Studiengruppen und Fokusgruppen
    zu künstlicher Intelligenz sowie AI for Good Global Summit

    '
  fundstelle: ITU-T Studiengruppen 13, 16, 17; Fokusgruppen; AI for Good
  verfahrensnummer: ITU-T; Sonderorganisation der Vereinten Nationen
  status: softlaw
  status_detail: 'Laufend. Die ITU normt KI dort, wo sie ihre angestammte Kompetenz hat: in Netzen und
    in der Sicherheit. Der AI for Good Global Summit fand 2026 vom 07. bis 10.07.2026 in Genf statt. Die
    ITU betreibt zudem den AI Standards Exchange, eine Datenbank der weltweiten KI-Normen und -Normungsvorhaben.

    '
  kurzbeschreibung: 'Die ITU ist die einzige UN-Sonderorganisation mit Normungskompetenz. Ihre Empfehlungen
    (ITU-T Recommendations) sind technische Normen für Telekommunikation; zu KI zählen unter anderem Y.3172
    (Architekturrahmen für maschinelles Lernen in künftigen Netzen, Juni 2019), Y.3173 (Bewertung von
    Intelligenzgraden, Februar 2020), Y.3174 (Datenhandhabung für maschinelles Lernen, Februar 2020),
    Y.3115 (KI-fähige domänenübergreifende Netze, Februar 2022) und die Reihe X.2200-X.2249 zur Sicherheit
    von KI/ML. Fokusgruppen bearbeiten zeitlich befristete Themen: FG-ML5G (2018-2020), FG-AI4AD zu autonomem
    Fahren (2020-2022), FG-AI4H zu KI in der Gesundheit (mit WHO und WIPO) und seit Juli 2024 FG-AINN
    zu KI-nativen Netzen.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://aiforgood.itu.int/summit26/
  anwendungsdaten:
  - datum: 2026-07-07
    was_gilt: AI for Good Global Summit 2026 in Genf (07.-10.07.2026).
    verifiziert: true
    quelle: https://aiforgood.itu.int/summit26/
  themenachsen:
  - governance
  - sicherheit-export
  - sektor-medizin
  rechtswirkung: 'ITU-T-Empfehlungen sind rechtlich unverbindlich, werden aber in nationalen Telekommunikationsregulierungen
    und in Verträgen zwischen Netzbetreibern regelmäßig in Bezug genommen und dadurch faktisch verbindlich.
    Für das KI-Recht im engeren Sinn ist die ITU nachrangig: Sie normt KI im Netz, nicht KI als Produkt.
    Der AI for Good Summit ist ein Konferenzformat ohne Beschlusskompetenz.

    '
  regelungsschwerpunkte:
  - 'Arbeitsteilung mit ISO/IEC: SC 42 normt KI als Technologie, ITU-T normt KI in Netzen und deren Sicherheit.'
  - FG-AI4H (KI in der Gesundheit, mit WHO) ist die substanziellste Arbeit — sie entwickelt Bewertungsrahmen
    für KI-gestützte Diagnostik und berührt damit die Schnittstelle zur MDR.
