  bedient_artikel: Art. 12 KI-VO (Aufzeichnungspflichten); mittelbar Art. 19 (Aufbewahrung der Protokolle)
  bearbeitungsstand: Enquiry
  rechtswirkung: 'Derzeit keine. Nach Zitierung Konformitätsvermutung für Art. 12 KI-VO. Beweisrechtlich
    wird die Norm auch ohne Zitierung Wirkung entfalten: Sie definiert den Stand der Technik, an dem sich
    die Zumutbarkeit der Protokollierung im Haftungsfall messen lässt.

    '
