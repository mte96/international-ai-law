- id: iso-iec-42001
  jurisdiktion: iso
  kurztitel: ISO/IEC 42001:2023 — KI-Managementsystem
  offizieller_titel: 'ISO/IEC 42001:2023 — Information technology — Artificial intelligence — Management
    system

    '
  normnummer: ISO/IEC 42001:2023
  fundstelle: ISO/IEC JTC 1/SC 42, veröffentlicht 18.12.2023, 1. Ausgabe, 51 Seiten
  verfahrensnummer: ISO/IEC JTC 1/SC 42/WG 1
  status: softlaw
  status_detail: 'Veröffentlicht und weltweit zertifizierbar; Stufe 60.60. Keine Revision im Verfahren,
    systematische Überprüfung läuft. Die weltweit erste Managementsystemnorm für künstliche Intelligenz
    und faktisch der Marktstandard für KI-Governance. Rechtlich in der EU ohne Vermutungswirkung.

    '
  kurzbeschreibung: 'Legt Anforderungen an Aufbau, Umsetzung, Aufrechterhaltung und fortlaufende Verbesserung
    eines KI-Managementsystems (AIMS) fest. Folgt der Harmonisierten Struktur der ISO-Managementsystemnormen
    (Plan-Do-Check-Act) und ist damit für Organisationen anschlussfähig, die bereits ISO/IEC 27001 oder
    ISO 9001 betreiben. Adressiert sind Organisationen jeder Größe, die KI-Systeme bereitstellen oder
    einsetzen. Anhang A enthält 38 Steuerungsziele, Anhang B Umsetzungshinweise, Anhang C eine Aufstellung
    KI-bezogener Organisationsziele und Risikoquellen. Zertifizierung erfolgt durch akkreditierte Stellen
    nach ISO/IEC 42006:2025.

    '
  inkrafttreten:
    datum: 2023-12-18
    verifiziert: true
    quelle: https://www.iso.org/standard/42001
  anwendungsdaten:
  - datum: 2023-12-18
    was_gilt: Veröffentlichung der ersten Ausgabe.
    verifiziert: true
    quelle: https://www.iso.org/standard/42001
  - datum: 2025-07-07
    was_gilt: 'Veröffentlichung von ISO/IEC 42006:2025 — erst damit ist akkreditierte Zertifizierung nach
      einheitlichen Anforderungen möglich.

      '
    verifiziert: true
    quelle: https://www.iso.org/standard/42006
  themenachsen:
  - governance
  - marktzugang
  bedient_artikel: 'keinen unmittelbar. Inhaltlich anschlussfähig an Art. 17 KI-VO (Qualitätsmanagementsystem)
    und Art. 9 (Risikomanagement), ohne die dortigen anbieterbezogenen Regulierungspflichten abzudecken.

    '
  bearbeitungsstand: veröffentlicht (60.60), systematische Überprüfung
  rechtswirkung: 'Keine Konformitätsvermutung nach Art. 40 KI-VO — und zwar nicht aus inhaltlichen, sondern
    aus verfahrensrechtlichen Gründen: Die Norm ist nicht auf Normungsauftrag der Kommission entstanden,
    nicht von einer europäischen Normungsorganisation entwickelt und nicht im Amtsblatt zitiert. Wer nach
    ISO/IEC 42001 zertifiziert ist, hat damit nicht das nach Art. 17 KI-VO erforderliche Qualitätsmanagementsystem.
    Die Zertifizierung kann Einhaltung „Anforderung für Anforderung“ belegen — sie ersetzt die Prüfung
    nicht. Praktisch ist sie gleichwohl wertvoll: als Nachweis organisatorischer Sorgfalt gegenüber Kunden,
    Versicherern und Aufsicht, und in den USA als Anknüpfungspunkt für vertragliche Zusicherungen.

    '
  regelungsschwerpunkte:
  - 38 Steuerungsziele in Anhang A, unter anderem KI-Politik, Rollen und Verantwortlichkeiten, Ressourcen,
    Folgenabschätzung, Datenmanagement, Informationen für Interessenträger, Umgang mit Dritten.
  - 'Der entscheidende Unterschied zu EN 18286: ISO/IEC 42001 ist organisationsbezogen und branchenoffen;
    EN 18286 ist anbieterbezogen und regulatorisch — sie bildet Pflichten der KI-VO ab (technische Dokumentation,
    Beobachtung nach Inverkehrbringen, Lieferantenaufsicht).'
  - Adam Leon Smith beschreibt EN 18286 ausdrücklich als bewussten architektonischen Bruch mit ISO 9001
    und EN ISO/IEC 42001 — die beiden Normen sind nicht ineinander überführbar.
  - Crosswalks zu NIST AI RMF und zur KI-VO sind verbreitet, aber privat erstellt und ohne amtliche Anerkennung.
  bedeutung_praxis: 'Für einen europäischen Anbieter, der in den USA verkauft und in der EU einem Hochrisikoregime
    unterliegt, ist ISO/IEC 42001 die Brückennorm: Sie wird von US-Kunden nachgefragt, ist auditierbar
    und lässt sich auf das NIST AI RMF abbilden. Wer sie betreibt, hat den organisatorischen Unterbau
    für EN 18286 — nicht mehr. Vertragliche Zusicherungen sollten nicht „AI Act compliant“ lauten, sondern
    die Norm und ihre Fassung benennen.

    '
  dokumente:
  - datum: 2026-08-31
    typ: norm
    titel: ISO/IEC 42001:2023 — Katalogeintrag
    url: https://www.iso.org/standard/42001
    sprache: en
    urheber: ISO/IEC
    verifiziert: true
    notiz: 'Amtlicher Katalogeintrag: Veröffentlichung 18.12.2023, Ausgabe 1, 51 Seiten, Stufe 60.60,
      keine Revision im Verfahren.'
  - datum: 2026-08-25
    typ: stellungnahme
    titel: 'ISO/IEC 42001 and the AI Act: why certification is not (yet) a presumption of conformity'
    url: https://lawandtechnology.eu/en/iso-iec-42001-and-the-ai-act-why-certification-is-not-yet-a-presumption-of-conformity/
    sprache: en
    urheber: lawandtechnology.eu
    verifiziert: false
    notiz: 'Die präziseste juristische Auseinandersetzung: Die Vermutung folgt nicht aus der technischen
      Beschaffenheit der Norm, sondern aus einem Verfahren. Kernsatz zur Abgrenzung von EN 18286.

      '
  - datum: 2026-04-28
    typ: stellungnahme
    titel: 'EU AI Act Compliance: prEN 18286 and ISO 42001'
    url: https://labs.cloudsecurityalliance.org/research/csa-research-note-eu-ai-act-pren-18286-iso-42001-20260428-cs/
    sprache: en
    urheber: Cloud Security Alliance
    verifiziert: false
    notiz: Gegenüberstellung beider Normen aus Anbietersicht; nicht vollständig abgerufen.
  offene_punkte:
  - Ob und wann eine Revision oder ein Änderungsblatt kommt; die systematische Überprüfung läuft.
  - Ob die Kommission ISO/IEC 42001 mittelbar über eine Übernahme als EN ISO/IEC in den harmonisierten
    Bestand holt — bisher nicht geschehen.
