- id: un-global-digital-compact
  jurisdiktion: un
  kurztitel: Global Digital Compact
  offizieller_titel: 'Global Digital Compact — Anlage I zum Zukunftspakt (Pact for the Future), angenommen
    am 22. September 2024

    '
  fundstelle: A/RES/79/1, Anlage I
  verfahrensnummer: Zukunftsgipfel der Vereinten Nationen, 22.-23.09.2024; Ko-Moderation Schweden und
    Sambia
  status: softlaw
  status_detail: 'Angenommen als Teil des Zukunftspakts. Der Abschnitt zu künstlicher Intelligenz enthält
    die Verpflichtungen, aus denen die Resolution A/RES/79/325 vom 26.08.2025 den Wissenschaftlichen Ausschuss
    und den Globalen Dialog entwickelt hat. Die Umsetzung liegt beim Büro für digitale und neu entstehende
    Technologien (ODET).

    '
  kurzbeschreibung: 'Der Compact ist der erste umfassende zwischenstaatliche Verpflichtungskatalog zur
    digitalen Governance. Fünf Ziele: Schließen der digitalen Kluft; Ausweitung der Vorteile der digitalen
    Wirtschaft; Förderung eines inklusiven, offenen, sicheren digitalen Raums unter Achtung der Menschenrechte;
    Datengovernance; und — als fünftes — Stärkung der internationalen Governance künstlicher Intelligenz
    zum Nutzen der Menschheit. Der KI-Abschnitt sieht ausdrücklich die Einrichtung eines unabhängigen
    internationalen wissenschaftlichen Gremiums und eines globalen Dialogs über KI-Governance vor, ferner
    einen globalen Fonds für KI-Kapazitätsaufbau.

    '
  inkrafttreten:
    datum: 2024-09-22
    verifiziert: false
    quelle: https://www.un.org/pact-for-the-future/en/annex-i-global-digital-compact
  anwendungsdaten:
  - datum: 2024-09-22
    was_gilt: Annahme des Zukunftspakts einschließlich Anlage I (Global Digital Compact).
    verifiziert: false
    quelle: https://www.un.org/pact-for-the-future/en/annex-i-global-digital-compact
  - datum: 2025-08-26
    was_gilt: 'Umsetzung der KI-Verpflichtungen durch A/RES/79/325 (Wissenschaftlicher Ausschuss und Globaler
      Dialog).

      '
    verifiziert: true
    quelle: https://www.un.org/pga/wp-content/uploads/sites/110/2025/12/A_RES_79_325-EN.pdf
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  rechtswirkung: 'Politische Absichtserklärung. Der Compact ist Teil einer Resolution der Generalversammlung
    und damit rechtlich unverbindlich. Seine tatsächliche Wirkung besteht in genau einem Punkt: Er hat
    die institutionellen Verpflichtungen erzeugt, die ein Jahr später in A/RES/79/325 tatsächlich umgesetzt
    wurden. Das ist mehr, als die meisten UN-Absichtserklärungen erreichen.

    '
  regelungsschwerpunkte:
  - Ziel 5 (KI-Governance) ist die Rechtsgrundlage des Wissenschaftlichen Ausschusses und des Globalen
    Dialogs.
  - Globaler Fonds für KI-Kapazitätsaufbau — bislang ohne belastbare Finanzierungszusagen.
  - Ko-Moderation der KI-Verhandlungen durch Costa Rica und Spanien.
