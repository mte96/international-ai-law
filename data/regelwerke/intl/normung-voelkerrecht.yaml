    urheber: BABL AI
    verifiziert: false
    notiz: 'Belegt neuen Namen, Datum der Bekanntgabe und die zehn Mitglieder. Sekundärquelle; eine amtliche
      Mitteilung des Netzwerks war nicht auffindbar.

      '
