    '
  normnummer: prEN 18229-1
  fundstelle: CEN/CLC/JTC 21
  verfahrensnummer: CEN/CLC/JTC 21
  status: entwurf
  status_detail: 'Stufe Enquiry (Stand Juni 2026), Zielhorizont Q4 2026. Teil 1 der dreiteiligen Reihe
    zum Rahmen der Vertrauenswürdigkeit. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Bedient Art. 12 KI-VO — die Pflicht von Hochrisikosystemen, während des Betriebs
    automatisch Ereignisse aufzuzeichnen. Die Norm legt fest, was aufgezeichnet werden muss, in welcher
    Granularität, wie lange und in welcher Form, damit die Rückverfolgbarkeit über die Lebensdauer gewährleistet
    ist. Praktisch die Grundlage jeder späteren Beweisführung: Ohne normkonforme Protokollierung lässt
    sich weder gegenüber der Marktüberwachung noch im Haftungsprozess rekonstruieren, was das System getan
    hat.

    '
