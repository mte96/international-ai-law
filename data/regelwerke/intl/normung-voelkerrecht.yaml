  - arbeit
  bedient_artikel: Art. 13 KI-VO (Transparenz gegenüber Betreibern), Art. 14 KI-VO (menschliche Aufsicht)
  bearbeitungsstand: Drafting
  rechtswirkung: 'Keine. Praktisch heißt das: Die Pflicht zur menschlichen Aufsicht ist ab dem 02.12.2027
    (Anhang III) anwendbar, ohne dass eine Norm sagt, wann sie erfüllt ist. Betreiber und Anbieter werden
    auf die Kommissionsleitlinien und die Aufsichtspraxis der nationalen Behörden angewiesen sein.

    '
  regelungsschwerpunkte:
  - Art. 14 Abs. 4 lit. b KI-VO (Automatisierungsbias) ist der Punkt, an dem technische Normung an die
    Grenze zur Arbeitsorganisation stößt.
  - Verhältnis zu prEN ISO/IEC 12792 (Transparenztaxonomie) und ISO/IEC 42105 (Human oversight of AI systems,
    im FDIS-Verfahren) ungeklärt — dieselbe Materie wird in zwei Gremien bearbeitet.
