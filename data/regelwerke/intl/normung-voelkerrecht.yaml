    titel: HUDERIA — risk and impact assessment of AI systems
    url: https://www.coe.int/en/web/artificial-intelligence/huderia-risk-and-impact-assessment-of-ai-systems
    sprache: en
    urheber: Europarat
    verifiziert: true
    notiz: 'Amtliche Übersichtsseite. Bestätigt die Annahmedaten und die ausdrückliche Unverbindlichkeit.

      '
  - datum: 2025-01-15
    typ: pressemitteilung
    titel: Council of Europe adopts Turing-developed human rights risk and impact assessment for AI systems
    url: https://www.turing.ac.uk/news/council-europe-adopts-turing-developed-human-rights-risk-and-impact-assessment-ai-systems
    sprache: en
    urheber: The Alan Turing Institute
    verifiziert: false
