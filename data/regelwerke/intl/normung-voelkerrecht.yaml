    typ: norm
    titel: ISO/IEC 42006:2025 — Katalogeintrag
    url: https://www.iso.org/standard/42006
    sprache: en
    urheber: ISO/IEC
    verifiziert: true
    notiz: Amtlicher Katalogeintrag mit Veröffentlichungsdatum 07.07.2025 und Abgrenzung zu ISO/IEC 17021-1.
