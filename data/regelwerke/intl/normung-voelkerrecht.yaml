- id: unesco-ki-ethikempfehlung
  jurisdiktion: unesco
  kurztitel: UNESCO-Empfehlung zur Ethik der künstlichen Intelligenz
  offizieller_titel: 'Recommendation on the Ethics of Artificial Intelligence, angenommen von der Generalkonferenz
    der UNESCO am 23. November 2021

    '
  fundstelle: UNESCO-Generalkonferenz, 41. Tagung, November 2021
  verfahrensnummer: 41 C/Resolution 41
  status: softlaw
  status_detail: 'Von allen 193 Mitgliedstaaten angenommen — das breiteste KI-Instrument der Welt und
    zugleich das unverbindlichste. Umsetzung über die Readiness Assessment Methodology (RAM), die bis
    2026 in mehr als 70 Staaten durchgeführt oder begonnen wurde, veröffentlichte Länderberichte (unter
    anderem Ghana, Ukraine, Kolumbien, Philippinen, Nigeria, Thailand) und das Global AI Ethics and Governance
    Observatory. Alle vier Jahre berichten die Mitgliedstaaten über die Umsetzung.

    '
  kurzbeschreibung: 'Der erste globale Standard zur KI-Ethik. Er formuliert vier Werte (Achtung der Menschenrechte
    und Menschenwürde; Leben in friedlichen, gerechten und vernetzten Gesellschaften; Vielfalt und Inklusivität;
    Gedeihen von Umwelt und Ökosystem) und zehn Grundsätze (Verhältnismäßigkeit und Schadensvermeidung,
    Sicherheit, Privatheit, Multi-Stakeholder-Governance, Verantwortung und Rechenschaft, Transparenz
    und Erklärbarkeit, menschliche Aufsicht, Nachhaltigkeit, Bewusstsein und Bildung, Fairness und Nichtdiskriminierung).
    Elf Politikfelder konkretisieren sie — darunter Datenpolitik, Umwelt, Geschlechtergleichstellung,
    Kultur, Bildung, Gesundheit, Wirtschaft und Arbeit. Die Umsetzungswerkzeuge sind RAM (Reifegradbewertung
    eines Staates) und die Ethical Impact Assessment (EIA) für einzelne Systeme.

    '
  inkrafttreten:
    datum: 2021-11-23
    verifiziert: false
    quelle: https://www.unesco.org/en/artificial-intelligence/recommendation-ethics
  anwendungsdaten:
  - datum: 2021-11-23
    was_gilt: Annahme durch die Generalkonferenz; alle 193 Mitgliedstaaten.
    verifiziert: false
    quelle: https://www.unesco.org/en/artificial-intelligence/recommendation-ethics
  - datum: 2026-08-31
    was_gilt: 'Mehr als 70 Staaten haben die Readiness Assessment Methodology durchgeführt oder begonnen.

      '
    verifiziert: true
    quelle: https://www.unesco.org/ethics-ai/en/ram
  themenachsen:
  - grundrechte
  - governance
  - arbeit
  - sektor-oeffentlich
  rechtswirkung: 'Politische Absichtserklärung. Eine Empfehlung nach Art. IV Abs. 4 der UNESCO-Verfassung
    verpflichtet die Mitgliedstaaten lediglich, sie den zuständigen nationalen Stellen vorzulegen und
    über die Umsetzung zu berichten — sie begründet keine Rechtspflicht. Der Wert liegt in der Reichweite:
    193 Staaten, darunter alle, die weder OECD-Adhärenten noch Europaratsmitglieder sind. Für Rechtsordnungen
    ohne eigenes KI-Recht ist die Empfehlung häufig der einzige Bezugsrahmen; mehrere afrikanische, südamerikanische
    und asiatische Strategien nehmen sie ausdrücklich auf.

    '
  regelungsschwerpunkte:
  - Vier Werte, zehn Grundsätze, elf Politikfelder.
  - RAM als Reifegradbewertung eines Staates — das praktisch wirksamste Element, weil es Regierungen zu
    einer Selbstbestandsaufnahme zwingt.
  - Ethical Impact Assessment (EIA) für Einzelsysteme — konzeptioneller Vorläufer der Grundrechte-Folgenabschätzung
    nach Art. 27 KI-VO und von HUDERIA.
  - Berichtspflicht im Vierjahresrhythmus — die einzige Nachverfolgung.
  - Ausdrückliches Verbot von Sozialkreditsystemen und von Massenüberwachung — inhaltlich schärfer als
    die OECD-Grundsätze und näher an Art. 5 KI-VO als jedes andere globale Instrument.
  dokumente:
  - datum: 2026-08-31
    typ: leitlinie
    titel: Recommendation on the Ethics of Artificial Intelligence — Übersichtsseite
    url: https://www.unesco.org/en/artificial-intelligence/recommendation-ethics
    sprache: en
    urheber: UNESCO
    verifiziert: true
    notiz: 'Amtliche Seite. Bestätigt Annahme November 2021 durch 193 Mitgliedstaaten, elf Politikfelder
      und zehn Grundsätze; schweigt zur Berichtspflicht und zur Rechtsnatur.

      '
  - datum: 2026-08-31
    typ: uebersicht
    titel: AI Readiness Assessment Methodology (RAM)
    url: https://www.unesco.org/ethics-ai/en/ram
    sprache: en
    urheber: UNESCO
    verifiziert: true
    notiz: 'Belegt, dass zum Stand 2026 mehr als 70 Staaten die RAM durchgeführt haben oder durchführen,
      und nennt sechs Länderfallstudien.

      '
  - datum: 2026-08-31
    typ: uebersicht
    titel: Global Forum on the Ethics of AI
    url: https://www.unesco.org/en/forum-ethics-ai
    sprache: en
    urheber: UNESCO
    verifiziert: false
    notiz: Jährliches Forum zur Umsetzung;
  offene_punkte:
  - Ob eine Überarbeitung der Empfehlung angesichts generativer KI ansteht — sie stammt aus der Zeit vor
    ChatGPT.
  - Ergebnisse der Vierjahresberichte der Mitgliedstaaten nicht konsolidiert auffindbar.
