    titel: European standards supporting the AI Act (CEN-CENELEC/ETUC-Newsletter OTS 73)
    url: https://www.cencenelec.eu/news-events/news/2026/newsletter/ots-73-etuc/
    sprache: en
    urheber: CEN-CENELEC
    verifiziert: true
    notiz: 'Bestätigt, dass prEN 18283 von der Kommission förmlich angefordert wurde und dass der ETUC
      Beiträge zur Bias-Minderung eingebracht hat.

      '
  offene_punkte:
  - Kein Termin. Die Norm zur Diskriminierungsvermeidung ist die letzte des Programms — ein politisch
    erklärungsbedürftiger Befund.
