- id: iso-ieee-7000-serie
  jurisdiktion: iso
  kurztitel: IEEE 7000er-Reihe — Ethik in der Systemgestaltung
  offizieller_titel: 'IEEE Standards for Autonomous and Intelligent Systems — Reihe IEEE 7000 ff.

    '
  normnummer: IEEE Std 7000-2021 ff.
  fundstelle: IEEE Standards Association
  verfahrensnummer: IEEE SA, Initiative Autonomous and Intelligent Systems
  status: softlaw
  status_detail: 'Zehn Normen der Reihe sind veröffentlicht, weitere in Bearbeitung. Keine ist in der
    EU harmonisiert; die IEEE ist keine europäische Normungsorganisation. Die Reihe entstand aus der Initiative
    „Ethically Aligned Design“ und ist damit die älteste systematische Normungsanstrengung zur KI-Ethik
    — sieben Jahre vor der KI-VO begonnen.

    '
  kurzbeschreibung: 'Veröffentlicht sind unter anderem IEEE Std 7000-2021 (Modellprozess zur Behandlung
    ethischer Belange bei der Systemgestaltung), 7001-2021 (Transparenz autonomer Systeme), 7002-2022
    (Datenschutzprozess), 7003-2024 (algorithmische Verzerrungen), 7005-2021 (transparente Arbeitgeber-Datenverwaltung),
    7007-2021 (ontologischer Standard für ethisch geleitete Robotik), 7009-2024 (ausfallsichere Gestaltung),
    7010-2020 (Bewertung der Auswirkungen auf das menschliche Wohlergehen), 7012-2025 (maschinenlesbare
    Datenschutzbedingungen) und 7014-2024 (emulierte Empathie). Ergänzend IEEE 2089-2021 (altersgerechte
    digitale Dienste), 2089.1-2024 (Online-Altersverifikation) und der Entwurf IEEE 3119 zur Beschaffung
    von KI- und automatisierten Entscheidungssystemen.

    '
  inkrafttreten:
    datum: 2021-09-15
    verifiziert: false
    quelle: https://standards.ieee.org/initiatives/autonomous-intelligence-systems/standards/
  anwendungsdaten:
  - datum: 2024-01-01
    was_gilt: Veröffentlichung von IEEE Std 7003-2024 (algorithmische Verzerrungen).
    verifiziert: true
    quelle: https://standards.ieee.org/initiatives/autonomous-intelligence-systems/standards/
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  - arbeit
  - vertrag
  bedient_artikel: keinen. Ohne Bezug zur KI-VO; inhaltliche Überschneidungen mit Art. 10, 13, 14 und
    27.
  bearbeitungsstand: teils veröffentlicht, teils in Bearbeitung
  rechtswirkung: 'Keine. Private Normen einer US-Berufsorganisation ohne Anerkennungsakt in der Union.
    Praktische Bedeutung dreifach: als Gestaltungshilfe (7000 ist ein Prozessmodell, kein Prüfmaßstab),
    als Argumentationsgrundlage im Haftungsfall (Stand der Technik) und als Bezugspunkt öffentlicher Beschaffung
    — IEEE 3119 zielt genau darauf.

    '
  regelungsschwerpunkte:
  - IEEE Std 7001-2021 ist der weltweit einzige eigenständige Transparenzstandard für autonome Systeme
    und definiert Transparenzstufen je Adressatengruppe (Nutzer, Aufsicht, Unfalluntersucher, Öffentlichkeit)
    — konzeptionell weiter als Art. 13 KI-VO.
  - IEEE Std 7003-2024 (Bias) ist erschienen, während prEN 18283 noch in der frühesten Bearbeitungsstufe
    steckt.
  - 'IEEE 3119 (Beschaffung) füllt eine Lücke, die die KI-VO offen lässt: Sie regelt Anbieter- und Betreiberpflichten,
    nicht die Vergabe.'
  - 'Widersprüchliche Bestandsangaben: OCEANIS (ethicsstandards.org) führt 7001, 7002 und 7003 als in
    Entwicklung; die IEEE selbst weist sie als veröffentlicht aus. Der IEEE wird gefolgt.'
  dokumente:
  - datum: 2026-08-31
    typ: uebersicht
    titel: IEEE SA — Autonomous and Intelligent Systems (AIS) Standards
    url: https://standards.ieee.org/initiatives/autonomous-intelligence-systems/standards/
    sprache: en
    urheber: IEEE Standards Association
    verifiziert: true
    notiz: 'Amtliche Bestandsliste mit Normnummern und Jahren. Maßgeblich gegenüber der veralteten OCEANIS-Übersicht.

      '
  - datum: 2026-08-31
    typ: uebersicht
    titel: IEEE P7000 Projects — OCEANIS
    url: https://ethicsstandards.org/p7000/
    sprache: en
    urheber: OCEANIS
    verifiziert: false
    notiz: 'Projektübersicht des Normungsobservatoriums; Bearbeitungsstände veraltet, führt bereits veröffentlichte
      Normen als in Entwicklung.

      '
  offene_punkte:
  - Ob IEEE 3119 (Beschaffung) veröffentlicht ist; als Entwurf gefuehrt.
  - Einzelne Veröffentlichungsdaten nicht taggenau verifiziert (nur Jahresangaben).
