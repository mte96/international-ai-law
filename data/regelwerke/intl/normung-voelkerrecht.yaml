  bedient_artikel: Art. 9 KI-VO (Risikomanagementsystem); mittelbar Art. 17 Abs. 1 lit. g
  bearbeitungsstand: Enquiry (Umfrage abgeschlossen, Kommentarauswertung)
  rechtswirkung: 'Derzeit keine — Entwurf. Nach Veröffentlichung und Zitierung im Amtsblatt widerlegliche
    Konformitätsvermutung für Art. 9 KI-VO. Weil Art. 9 die Anker­norm für sämtliche Hochrisikopflichten
    ist, ist diese Norm rechtlich die folgenreichste des gesamten Programms.

    '
  regelungsschwerpunkte:
  - Risikobegriff aus der Produktsicherheit, erweitert auf Grundrechte — der Versuch, die Grundrechtsdimension
    der KI-VO normungsfähig zu machen.
  - Interne Richtlinien und Governance-Dokumente sind keine Risikokontrollen im Sinne der Norm. Nur Maßnahmen,
    die am System ansetzen, zählen.
  - Risiko muss nicht quantifizierbar sein — Abkehr von der Erwartung numerischer Risikomatrizen.
  - 'Verhältnis zu ISO/IEC 23894: Die ISO-Norm ist Leitfaden (guidance), prEN 18228 formuliert Anforderungen
    (requirements). Der Unterschied entscheidet über Auditierbarkeit.'
