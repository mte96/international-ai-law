  offizieller_titel: 'prEN 18229-3 — Artificial intelligence — AI trustworthiness framework — Part 3:
    Transparency and human oversight

    '
  normnummer: prEN 18229-3
  fundstelle: CEN/CLC/JTC 21
  verfahrensnummer: CEN/CLC/JTC 21
  status: entwurf
  status_detail: 'Stufe Drafting (Stand Juni 2026), Termin „evolving“. Keine ABl.-Zitierung.

    '
  kurzbeschreibung: 'Bedient Art. 13 (Transparenz und Bereitstellung von Informationen an Betreiber) und
    Art. 14 KI-VO (menschliche Aufsicht). Juristisch die interessanteste der Reihe, weil Art. 14 eine
    Verhaltensanforderung an Menschen normungsfähig machen soll: Das System muss so gestaltet sein, dass
    eine natürliche Person es wirksam beaufsichtigen kann — einschließlich der Fähigkeit, dem Automatisierungsbias
    zu widerstehen (Art. 14 Abs. 4 lit. b). Eine technische Norm kann das nur mittelbar über Gestaltungsanforderungen
    an die Schnittstelle abbilden.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://kla.digital/blog/jtc-21-standards-tracker
  anwendungsdaten: []
