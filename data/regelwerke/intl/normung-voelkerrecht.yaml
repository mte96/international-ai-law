  jurisdiktion: coe
  kurztitel: HUDERIA — Methodik und Modell
  offizieller_titel: 'Methodik zur Risiko- und Folgenabschätzung von Systemen künstlicher Intelligenz
    aus der Sicht der Menschenrechte, der Demokratie und der Rechtsstaatlichkeit (HUDERIA) nebst HUDERIA-Modell

    '
  fundstelle: Ministerkomitee des Europarats; Methodik angenommen 26.02.2025, Modell angenommen 25.02.2026
  verfahrensnummer: Ausschuss für künstliche Intelligenz (CAI); methodische Entwicklung durch das Alan
    Turing Institute
  status: softlaw
  status_detail: 'Beide Teile angenommen und veröffentlicht. Ausdrücklich als „standalone, non-legally
    binding guidance“ bezeichnet: Die Vertragsparteien von CETS 225 können sie ganz oder teilweise verwenden
    oder anpassen. Damit ist HUDERIA das methodische Begleitwerk der Konvention, nicht ihr Durchführungsrecht.

    '
  kurzbeschreibung: 'Die erste zwischenstaatlich abgestimmte Methodik für die Folgenabschätzung von KI-Systemen
    aus grundrechtlicher Sicht. Vier Bestandteile: kontextbezogene Risikoanalyse (COBRA) mit Risikofaktoren
    nach Anwendungs-, Entwicklungs- und Einsatzkontext und einer Triage zur Priorisierung; ein Verfahren
    zur Einbindung Betroffener (Stakeholder Engagement Process); die eigentliche Risiko- und Folgenabschätzung
    nach Ausmaß, Reichweite, Umkehrbarkeit und Wahrscheinlichkeit; und ein Minderungsplan einschließlich
    Abhilfemechanismen. Ein Abschnitt zur iterativen Überprüfung erstreckt die Methodik auf den gesamten
    Lebenszyklus. Teil II (Modell) enthält die Arbeitsmittel: Listen von Risikofaktoren, Beispielfelder
    möglicher Betroffenheit und eine Zuordnung nach Sektoren.

    '
  inkrafttreten:
    datum: 2025-02-26
    verifiziert: true
    quelle: https://www.coe.int/en/web/artificial-intelligence/huderia-risk-and-impact-assessment-of-ai-systems
  anwendungsdaten:
  - datum: 2025-02-26
    was_gilt: Annahme der HUDERIA-Methodik durch das Ministerkomitee.
    verifiziert: true
    quelle: https://www.coe.int/en/web/artificial-intelligence/huderia-risk-and-impact-assessment-of-ai-systems
  - datum: 2026-02-25
    was_gilt: Annahme des HUDERIA-Modells (Teil II, Arbeitsmittel) durch das Ministerkomitee.
    verifiziert: true
    quelle: https://www.coe.int/en/web/artificial-intelligence/huderia-risk-and-impact-assessment-of-ai-systems
  themenachsen:
  - grundrechte
  - governance
  - sektor-oeffentlich
  rechtswirkung: 'Keine. Ausdrücklich unverbindlich, auch für die Vertragsparteien von CETS 225. Praktische
    Bedeutung dort, wo eine Grundrechte-Folgenabschätzung geschuldet ist, ohne dass das Gesetz eine Methode
    vorgibt: Art. 27 KI-VO verpflichtet bestimmte Betreiber zur Grundrechte-Folgenabschätzung, sagt aber
    nicht, wie sie durchzuführen ist. HUDERIA ist dafür die einzige zwischenstaatlich abgestimmte Methodik
    und deshalb die begründungsstärkste Wahl — stärker als ISO/IEC 42005, weil grundrechtsspezifisch.

    '
  regelungsschwerpunkte:
  - 'COBRA-Triage: Nicht jedes System durchläuft die volle Abschätzung; die Risikoanalyse entscheidet
    über die Prüftiefe. Das ist der Mechanismus, der die Methodik praktikabel macht.'
  - Einbindung Betroffener als eigenständiger Verfahrensschritt — in der KI-VO gibt es dazu keine Entsprechung.
  - Iterative Überprüfung über den Lebenszyklus; kein einmaliger Akt.
  - Entwickelt vom Alan Turing Institute im Auftrag des CAI — der seltene Fall, in dem eine zwischenstaatliche
    Methodik aus der Forschung heraus geschrieben wurde.
  dokumente:
  - datum: 2026-02-25
    typ: leitlinie
    titel: Council of Europe HUDERIA Methodology and Model (angenommene vorläufige Fassung 2026)
    url: https://rm.coe.int/huderia-methodology-and-model-adopted-provisional-version-2026/48802ac001
    sprache: en
    urheber: Ministerkomitee des Europarats
    verifiziert: true
    notiz: 'Primärquelle mit beiden Teilen. Belegt Annahmedaten, die vier Bestandteile, den Abschnitt
      zur iterativen Überprüfung und die COBRA-Ressourcen A, B, C, E und F.

      '
  - datum: 2026-08-31
