- id: intl-netzwerk-ki-evaluierung
  jurisdiktion: intl
  kurztitel: Internationales Netzwerk für fortgeschrittene KI-Messung und -Evaluierung
  offizieller_titel: 'International Network for Advanced AI Measurement, Evaluation and Science — vormals
    International Network of AI Safety Institutes

    '
  fundstelle: gegründet November 2024 in San Francisco; umbenannt Dezember 2025
  verfahrensnummer: Folgeformat des KI-Sicherheitsgipfels von Seoul (Mai 2024)
  status: softlaw
  status_detail: 'Aktiv unter neuem Namen. Am 19.12.2025 wurde die Umbenennung bekanntgegeben — das Wort
    „Sicherheit“ ist aus dem Namen verschwunden, der Schwerpunkt liegt nun auf wissenschaftlicher Messung
    und Evaluierung. Mitglieder: Australien, Kanada, die Europäische Union, Frankreich, Japan, Kenia,
    Südkorea, Singapur, das Vereinigte Königreich und die Vereinigten Staaten.

    '
  kurzbeschreibung: 'Das Netzwerk verbindet die staatlichen Evaluierungsinstitute — in den USA CAISI (vormals
    US AI Safety Institute), im Vereinigten Königreich das AI Security Institute (vormals AI Safety Institute),
    in der EU das KI-Büro. Aufgabe ist die Abstimmung von Bewertungsmethoden für fortgeschrittene KI-Systeme,
    gemeinsame Testläufe und der Austausch von Ergebnissen. Die zweifache Umbenennung — erst das britische,
    dann das US-amerikanische, dann das Netzwerk selbst — ist der sichtbarste Ausdruck der politischen
    Verschiebung von Sicherheit zu Wettbewerbsfähigkeit.

    '
  inkrafttreten:
    datum: 2024-11-20
    verifiziert: false
    quelle: https://babl.ai/international-ai-safety-coalition-renames-itself-to-emphasize-ai-evaluation-science/
  anwendungsdaten:
  - datum: 2025-12-19
    was_gilt: 'Bekanntgabe der Umbenennung in International Network for Advanced AI Measurement, Evaluation
      and Science.

      '
    verifiziert: false
    quelle: https://babl.ai/international-ai-safety-coalition-renames-itself-to-emphasize-ai-evaluation-science/
  themenachsen:
  - governance
  - sicherheit-export
  - gpai
  rechtswirkung: 'Keine. Ein Verwaltungsnetzwerk ohne Rechtsgrundlage, ohne Beschlüsse und ohne Befugnisse
    gegenüber Unternehmen. Mittelbare Bedeutung für die EU: Die Bewertungsmethoden, auf die sich das Netzwerk
    einigt, werden voraussichtlich in die Praxis des KI-Büros bei der Bewertung von GPAI-Modellen mit
    systemischem Risiko nach Art. 55 KI-VO einfließen — ohne dass die Verordnung darauf verweist.

    '
  regelungsschwerpunkte:
  - Zehn Mitglieder; die EU ist über das KI-Büro vertreten.
  - Die G7-Ministererklärung vom 29.05.2026 beauftragt das Netzwerk gemeinsam mit der OECD, die Vergleichbarkeit
    der KI-Risikobewertungsrahmen zu verbessern — das erste konkrete Mandat von außen.
  - 'Der Namenswechsel ist inhaltlich: von der Frage, ob ein System sicher ist, zur Frage, wie man es
    misst.'
  dokumente:
  - datum: 2025-12-19
    typ: pressemitteilung
    titel: International AI Safety Coalition Renames Itself to Emphasize AI Evaluation Science
    url: https://babl.ai/international-ai-safety-coalition-renames-itself-to-emphasize-ai-evaluation-science/
