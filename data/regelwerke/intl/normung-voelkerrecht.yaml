    sprache: en
    urheber: ISO/IEC
    verifiziert: true
    notiz: 'Amtlicher Katalogeintrag: Ausgabe 1, Mai 2020, in systematischer Überprüfung.'
  offene_punkte:
  - Ob eine Überarbeitung kommt — sechs Jahre ohne Revision in einem Feld dieser Dynamik ist bemerkenswert.
  monitoring_quellen:
