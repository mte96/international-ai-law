- id: intl-ki-gipfel
  jurisdiktion: intl
  kurztitel: Die Reihe der KI-Gipfel (Bletchley, Seoul, Paris, Neu-Delhi)
  offizieller_titel: 'AI Safety Summit (Bletchley Park 2023), AI Seoul Summit (2024), AI Action Summit
    (Paris 2025), India AI Impact Summit (Neu-Delhi 2026)

    '
  fundstelle: Gipfelerklärungen; zuletzt New Delhi Declaration vom 21.02.2026
  verfahrensnummer: keine institutionelle Grundlage; wechselnde Gastgeberstaaten
  status: softlaw
  status_detail: 'Der Gipfel von Neu-Delhi tagte vom 16. bis 21.02.2026 mit 118 vertretenen Staaten; 89
    billigten die New Delhi Declaration. Die Verschiebung der Bezeichnungen — von „Safety“ über „Action“
    zu „Impact“ — beschreibt den inhaltlichen Kurswechsel der Reihe präzise: von Risikobegrenzung zu Verbreitung
    und Nutzen.

    '
  kurzbeschreibung: 'Die Gipfelreihe ist das sichtbarste, aber unverbindlichste Format der KI-Governance.
    Bletchley Park (November 2023) brachte die Bletchley-Erklärung von 28 Staaten und der EU und den Auftrag
    für den Internationalen KI-Sicherheitsbericht. Seoul (Mai 2024) brachte die Frontier AI Safety Commitments
    von 16 Unternehmen und die Gründung des Netzwerks der Sicherheitsinstitute. Paris (Februar 2025) endete
    ohne Unterschrift der USA und des Vereinigten Königreichs unter der Abschlusserklärung. Neu-Delhi
    (Februar 2026) setzte auf Verbreitung: eine Charter for the Democratic Diffusion of AI, ein Global
    AI Impact Commons, ein Trusted AI Commons, ein Netzwerk von Institutionen für KI in der Wissenschaft,
    eine Plattform zur sozialen Teilhabe, ein Playbook zur Arbeitskräfteentwicklung und Leitgrundsätze
    zu belastbarer und effizienter KI. Alle Zusagen ausdrücklich freiwillig und nicht bindend.

    '
