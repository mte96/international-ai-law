- id: iso-iec-sc42-arbeitsprogramm
  jurisdiktion: iso
  kurztitel: ISO/IEC JTC 1/SC 42 — laufende Arbeiten
  offizieller_titel: 'ISO/IEC JTC 1/SC 42 Artificial intelligence — Arbeitsprogramm der in Bearbeitung
    befindlichen Normen und Technischen Spezifikationen

    '
  fundstelle: ISO/IEC JTC 1/SC 42, Standardkatalog
  verfahrensnummer: ISO/IEC JTC 1/SC 42 (Sekretariat ANSI)
  status: verfahren
  status_detail: 'Laufend. SC 42 ist das Mutterschiff der internationalen KI-Normung und liefert den Bestand,
    aus dem sich JTC 21 bedient. Bei Rechercheschluss sind unter anderem ISO/IEC FDIS 42105 (menschliche
    Aufsicht), ISO/IEC FDIS 24970 (Protokollierung), ISO/IEC FDIS 24029-3 (statistische Robustheit), ISO/IEC
    DIS 23282 (Bewertungsverfahren Sprachverarbeitung), ISO/IEC DIS 25029 (KI-gestütztes Nudging), ISO/IEC
    CD TS 22440 (funktionale Sicherheit), ISO/IEC DTS 22443 (gesellschaftliche und ethische Belange),
    ISO/IEC TS 42119 (Prüfung und Verifikation), ISO/IEC 42007, ISO/IEC 42102 (Taxonomie von Methoden
    und Fähigkeiten) und ISO/IEC 27090 (Sicherheitsbedrohungen für KI-Systeme) im Verfahren.

    '
  kurzbeschreibung: 'SC 42 gliedert sich in mehrere Arbeitsgruppen (Grundlagen, Big Data, Vertrauenswürdigkeit,
    Anwendungsfälle, Governance, Datenqualität, KI-Systemtechnik). Zum veröffentlichten Bestand gehören
    neben den hier einzeln erfassten Normen unter anderem ISO/IEC 22989:2022 (Konzepte und Terminologie),
    ISO/IEC 23053:2022 (Rahmenwerk für KI-Systeme mit maschinellem Lernen), ISO/IEC 5338:2023 (Lebenszyklusprozesse),
    ISO/IEC 5339:2024 (Leitfaden für KI-Anwendungen), ISO/IEC 8183:2023 (Datenlebenszyklus), ISO/IEC 38507:2022
    (Governance-Implikationen des KI-Einsatzes), ISO/IEC 24029-2:2023 (Robustheit neuronaler Netze) sowie
    mehrere Technische Berichte zu Verzerrungen (TR 24027), Ethik (TR 24368), funktionaler Sicherheit
    (TR 5469) und Anwendungsfällen (TR 24030).

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.iso.org/committee/6794475/x/catalogue/p/1/u/0/w/0/d/0
  anwendungsdaten: []
  themenachsen:
  - governance
  - marktzugang
  - sicherheit-export
  - grundrechte
  bedient_artikel: kein einzelner. Der Bestand ist der Steinbruch, aus dem JTC 21 europäische Normen formt.
  bearbeitungsstand: laufend
  rechtswirkung: 'Keine. Für die europäische Praxis mittelbar erheblich: Jede ISO/IEC-Norm, die als EN
    ISO/IEC übernommen wird, kann Grundlage einer späteren Harmonisierung werden — der Weg über ISO ist
    schneller als die europäische Eigenentwicklung, aber die Kommission hat ihn für die Kernanforderungen
    der KI-VO nicht akzeptiert.

    '
  regelungsschwerpunkte:
  - ISO/IEC 42105 (Human oversight of AI systems, FDIS) ist die international unmittelbarste Entsprechung
    zu Art. 14 KI-VO und weiter als prEN 18229-3.
  - ISO/IEC 27090 (Sicherheitsbedrohungen für KI-Systeme) läuft parallel zu prEN 18282.
  - ISO/IEC TS 22440 (funktionale Sicherheit) ist die Schnittstelle zur Maschinenverordnung und zur Medizinprodukteregulierung.
  - 'Die Doppelbearbeitung derselben Materie in Genf und Brüssel ist das strukturelle Problem: Sie bindet
    dieselben knappen Experten.'
  dokumente:
  - datum: 2026-08-31
    typ: uebersicht
    titel: Standards by ISO/IEC JTC 1/SC 42 — Artificial intelligence
    url: https://www.iso.org/committee/6794475/x/catalogue/p/1/u/0/w/0/d/0
    sprache: en
    urheber: ISO
    verifiziert: true
    notiz: 'Amtlicher Katalog: veröffentlichte Normen und Vorhaben in Bearbeitung mit Verfahrensstufen.
      Die belastbarste Quelle zum Arbeitsprogramm.

      '
  - datum: 2026-08-31
    typ: uebersicht
    titel: 'ISO/IEC AI Standards: Comprehensive Reference'
    url: https://www.aigl.blog/iso-iec-ai-standards-comprehensive-reference/
    sprache: en
    urheber: AI Governance Library
    verifiziert: false
    notiz: 'Thematisch geordnete Landkarte des ISO/IEC-Bestands; nützlich zur Orientierung, ohne Verfahrensstufen.

      '
  offene_punkte:
  - Ob ISO/IEC 42105 als EN übernommen wird und prEN 18229-3 damit entbehrlich macht.
  - Ob die von Cantero Gamito berichtete Aussetzung der Zusammenarbeit zwischen ISO/IEC-Gremien und JTC
    21 nach dem Oktober-2025-Paket tatsächlich stattgefunden hat — von keiner Primärquelle bestätigt.
