    typ: uebersicht
    titel: JTC 21 Standards Tracker — prEN 18284
    url: https://kla.digital/blog/jtc-21-standards-tracker
    sprache: en
    urheber: kla.digital
    verifiziert: false
    notiz: Stufe Drafting, Art. 10, Termin evolving, nicht zitiert.
