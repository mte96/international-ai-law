- id: au-ahpra-ai-2024
  jurisdiktion: au
  kurztitel: Ahpra — KI-Pflichten der Gesundheitsberufe
  offizieller_titel: 'Meeting your professional obligations when using Artificial Intelligence in healthcare

    '
  fundstelle: Australian Health Practitioner Regulation Agency (Ahpra) und National Boards
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 11.10.2024 veröffentlicht. Formal Leitlinie, praktisch maßgeblich: Sie konkretisiert
    die Verhaltenskodizes, deren Verletzung berufsrechtliche Maßnahmen bis zur Streichung nach sich ziehen
    kann.

    '
  kurzbeschreibung: 'Die Leitlinie stellt klar, dass registrierte Gesundheitsberufe für jeden KI-Einsatz
    in ihrer Praxis letztverantwortlich bleiben. Sie müssen menschliche Aufsicht und eigenes Urteil wahren,
    von KI erzeugte Aufzeichnungen vor Verwendung auf Richtigkeit prüfen, Werkzeuge vor dem klinischen
    Einsatz testen, Trainingsdaten, Verzerrungen, Risiken und Grenzen des Systems verstehen, über Datenerhebung,
    -speicherung und -schutz Bescheid wissen, Patienten über den KI-Einsatz informieren und vor der Eingabe
    von Patientendaten eine informierte Einwilligung einholen. Ferner sind TGA-Anforderungen einzuhalten
    und eine angemessene Berufshaftpflichtversicherung vorzuhalten. Die Struktur ist für das Berufsrecht
    anderer Berufe, auch der Anwaltschaft, aufschlussreich.

    '
  inkrafttreten:
    datum: 2024-10-11
    verifiziert: true
    quelle: https://www.minterellison.com/articles/ahpra-introduces-ai-guidelines-for-health-practitioners
  anwendungsdaten:
  - datum: 2024-10-11
    was_gilt: Veröffentlichung der Leitlinie.
    verifiziert: true
    quelle: https://www.minterellison.com/articles/ahpra-introduces-ai-guidelines-for-health-practitioners
  themenachsen:
  - sektor-medizin
  - berufsrecht
  - haftung
  - datenschutz
  regelungsschwerpunkte:
  - Letztverantwortung des Behandlers für jeden KI-Einsatz — unabhängig von Zulassung oder Ruf des Systems.
  - Menschliche Aufsicht und eigenes fachliches Urteil.
  - Prüfung KI-erzeugter Aufzeichnungen auf Richtigkeit vor Verwendung.
  - Kenntnis von Trainingsdaten, Verzerrungen, Risiken und Grenzen.
  - Patienteninformation über KI-Einsatz; informierte Einwilligung vor Eingabe von Patientendaten.
  - Einhaltung der TGA-Anforderungen; angemessene Berufshaftpflichtversicherung.
  - Durchsetzung über die Verhaltenskodizes der National Boards.
