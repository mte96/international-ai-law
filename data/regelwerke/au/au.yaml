  jurisdiktion: au
  kurztitel: APRA CPS 230 und CPS 234
  offizieller_titel: 'Prudential Standard CPS 230 Operational Risk Management; Prudential Standard CPS
    234 Information Security

    '
  fundstelle: APRA Prudential Standards CPS 230, CPS 234. CPS 230 im Schedule der Determination F2026L00475
    (Federal Register of Legislation), in Kraft seit 01.07.2026.
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'VERBINDLICH FÜR BEAUFSICHTIGTE FINANZUNTERNEHMEN. CPS 234 gilt seit 01.07.2019, CPS
    230 seit 01.07.2025. Die Determination F2023L01242, die CPS 230 bis dahin trug, wurde am 01.07.2026
    aufgehoben und durch F2026L00475 (erlassen am 29.04.2026) ersetzt; seither gilt CPS 230 in dieser
    Fassung, mit veränderter Absatzzählung. Beide Standards sind technologieneutral, erfassen KI aber
    über operationelles Risiko, kritische Geschäftsprozesse und Drittparteienrisiko. Am 30.04.2026 richtete
    APRA ein Schreiben zur KI-Governance an beaufsichtigte Institute.

    '
  kurzbeschreibung: 'CPS 230 verpflichtet Banken, Versicherer und Pensionsfonds, das operationelle Risiko
    zu steuern, kritische Geschäftsprozesse zu identifizieren, Toleranzgrenzen festzulegen, Betriebsfähigkeit
    aufrechtzuerhalten und Risiken aus Dienstleistern zu beherrschen. Da KI-Modelle regelmäßig in kritische
    Prozesse eingebunden und über Drittanbieter bezogen werden, erfasst der Standard sie mittelbar, aber
    wirksam. CPS 234 verlangt Informations- sicherheitsfähigkeiten, die dem Bedrohungsniveau angemessen
    sind. Verstöße können aufsichtsrechtliche Maßnahmen bis hin zu Auflagen und Lizenzeingriffen nach
    sich ziehen. Für KI in Finanzunternehmen ist dies faktisch das schärfste geltende Regime.

    '
  inkrafttreten:
    datum: 2025-07-01
    verifiziert: true
    quelle: https://www.apra.gov.au/standards/cps-230
  anwendungsdaten:
