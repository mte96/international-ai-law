- id: au-oaic-ai-guidance-2024
  jurisdiktion: au
  kurztitel: OAIC-Leitlinien zu KI und Datenschutz
  offizieller_titel: 'Guidance on privacy and the use of commercially available AI products; Guidance
    on privacy and developing and training generative AI models

    '
  fundstelle: Office of the Australian Information Commissioner
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Beide Leitlinien am 21.10.2024 veröffentlicht. Die Entwickler- Leitlinie wurde zuletzt
    am 27.11.2024, die Anwender-Leitlinie am 17.01.2025 aktualisiert. Sie sind rechtlich unverbindlich,
    beschreiben aber die Auslegung der APPs durch die Aufsichtsbehörde und sind damit praktisch maßgeblich.

    '
  kurzbeschreibung: 'Die Entwickler-Leitlinie stellt klar, dass öffentliche Zugänglichkeit von Daten deren
    Nutzung nicht legitimiert: Scraping ist eine verdeckte Erhebung und kann gegen das Fairness-Gebot
    des APP 3 verstoßen. Aus dem Ausbleiben eines Widerspruchs darf keine Einwilligung abgeleitet werden.
    Für die Zweitnutzung bereits erhobener Daten zum KI-Training verlangt das OAIC Einwilligung oder den
    Nachweis vernünftiger Erwartung — was "in vielen Fällen schwierig" sei. Die Anwender-Leitlinie behandelt
    Eingaben und Ausgaben kommerzieller KI-Produkte: Erzeugt oder folgert ein System personenbezogene
    Daten, ist das eine Erhebung nach APP 3. Als beste Praxis empfiehlt das OAIC, personenbezogene und
    besonders sensible Daten NICHT in öffentlich verfügbare generative KI-Werkzeuge einzugeben.

    '
  inkrafttreten:
    datum: 2024-10-21
    verifiziert: true
    quelle: https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-developing-and-training-generative-ai-models
  anwendungsdaten:
  - datum: 2024-10-21
    was_gilt: Veröffentlichung beider Leitlinien.
    verifiziert: true
    quelle: https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-developing-and-training-generative-ai-models
  - datum: 2024-11-27
    was_gilt: Letzte Aktualisierung der Entwickler-Leitlinie.
    verifiziert: true
    quelle: https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-developing-and-training-generative-ai-models
  - datum: 2025-01-17
    was_gilt: Letzte Aktualisierung der Anwender-Leitlinie.
    verifiziert: true
    quelle: https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-the-use-of-commercially-available-ai-products
  themenachsen:
  - datenschutz
  - gpai
  - governance
  regelungsschwerpunkte:
  - 'Scraping: ''just because data is publicly available or otherwise accessible does not mean it can
    legally be used'' — verdeckte Erhebung, Fairness-Problem unter APP 3.'
  - Keine konkludente Einwilligung aus fehlendem Widerspruch.
  - 'Zweitnutzung zum Training: Einwilligung oder vernünftige Erwartung erforderlich (APP 6) — Nachweis
    regelmäßig schwierig.'
  - 'Weitere einschlägige Grundsätze: APP 1 (Transparenz), APP 5 (Mitteilung), APP 10 (Richtigkeit).'
  - Im Zweifel sind Daten als personenbezogen zu behandeln.
  - 'Anwenderseite: KI-generierte oder gefolgerte personenbezogene Daten sind eine Erhebung nach APP 3.'
