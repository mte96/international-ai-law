- id: au-standards-for-ai-2026
  jurisdiktion: au
  kurztitel: Australian Standards for AI (angekündigt)
  offizieller_titel: Australian Standards for AI
  fundstelle: Ankündigung des Premierministers vom 15. Juli 2026; noch kein Gesetzestext
  verfahrensnummer: null
  status: idee
  status_detail: 'KEHRTWENDE. Premierminister Albanese kündigte am 15.07.2026 verbindliche, national einheitliche
    "Australian Standards for AI" an — nach der Absage an verbindliche Regeln nur sieben Monate zuvor.
    Gleichzeitig wurde mit sofortiger Wirkung ein Office of AI im Department of the Prime Minister and
    Cabinet eingerichtet. Das National Cabinet sollte die Standards im August 2026 behandeln; Gesetzentwürfe
    werden für Anfang 2027 erwartet. Es existiert heute (27.08.2026) KEIN Gesetzestext und kein Exposure
    Draft.

    Stand 07.09.2026: Das National Cabinet hat am 26.08.2026 — alle neun Regierungen — die Entwicklung
    "consistent mandatory standards for data centre energy, water and land-use" gemeinsam beschlossen
    und Ausbildungs- und Qualifizierungsmaßnahmen zugesagt. Das ist die erste gemeinsame Befassung von
    Bund und Ländern mit dem am 15.07.2026 angekündigten Vorhaben. Wörtlich aus dem Kommuniqué: "The Commonwealth
    intends to legislate the AI standards in early 2027, including conditions associated with delivering
    AI training." Die Bundesregelung soll die Planungs- und Genehmigungsverfahren der Länder "complement,
    not duplicate". Ein Entwurfstext und ein Konsultationspapier liegen weiterhin nicht vor; consult.industry.gov.au
    weist keine laufende Konsultation aus.

    '
  kurzbeschreibung: 'Angekündigt ist ein bundesweit einheitlicher, verbindlicher Standardrahmen mit drei
    Schwerpunkten. Erstens Rechenzentren: Großbetreiber sollen neue Stromversorgung selbst unterlegen
    und die vollen Netzanschlusskosten tragen, den Verbrauch bei Netzengpässen senken, eigene Erzeugung
    aufbauen (Ziel: Netto-Energieerzeuger) und Wassereffizienz sicherstellen; hinzu treten Standortauflagen,
    damit Rechenzentren nicht mit Wohnbau konkurrieren. Zweitens Urheberrecht: Künstler, Autoren, Musiker
    und Journalisten sollen Eigentum und Kontrolle über die Nutzung ihrer Werke behalten; kein Unternehmen
    soll australische Kreativwerke ohne Zustimmung zum KI-Training nutzen dürfen. Drittens Verbrauchersicherheit
    als ressortübergreifender Ansatz. Sanktionen sind noch nicht bekannt.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.pm.gov.au/media/ai-australias-interests
