regelwerke:
- id: au-safe-responsible-ai-2023
  jurisdiktion: au
  kurztitel: Safe and Responsible AI — Discussion Paper und Interim Response
  offizieller_titel: 'Safe and Responsible AI in Australia — Discussion Paper (Juni 2023) und Safe and
    Responsible AI in Australia consultation — Australian Government''s interim response (17. Januar 2024)

    '
  fundstelle: Department of Industry, Science and Resources (DISR)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Historischer Ausgangspunkt, heute überholt. Das Discussion Paper (Juni 2023) und die
    Interim Response (17.01.2024) begründeten den risikobasierten Ansatz und kündigten verbindliche Guardrails
    für Hochrisiko-Anwendungen an. Dieser Pfad wurde am 02.12.2025 mit dem National AI Plan aufgegeben.

    '
  kurzbeschreibung: 'Das Discussion Paper 2023 stellte zur Konsultation, ob Australien KI mit bestehenden
    Gesetzen, mit sektoralen Anpassungen oder mit einem eigenen KI-Gesetz regulieren solle; es gingen
    über 500 Stellungnahmen ein. Die Interim Response vom 17.01.2024 zog daraus den Schluss, dass bestehendes
    Recht Lücken aufweist, kündigte verbindliche Guardrails für "high-risk settings" an, richtete eine
    temporäre AI Expert Group ein und stellte einen freiwilligen Sicherheitsstandard in Aussicht. Sanktionen
    enthielt keines der Dokumente — es handelt sich um Politikpapiere ohne Bindungswirkung.

    '
  inkrafttreten:
    datum: 2024-01-17
    verifiziert: true
    quelle: https://www.industry.gov.au/news/australian-governments-interim-response-safe-and-responsible-ai-consultation
    fundstelle_norm: Kein Rechtsakt. Massgeblich ist die Veroeffentlichung der Interim Response des Department
      of Industry, Science and Resources am 17.01.2024 (das Discussion Paper stammt von Juni 2023)
  anwendungsdaten: []
