- id: au-copyright-act-1968
  jurisdiktion: au
  kurztitel: Copyright Act 1968 — keine TDM-Schranke
  offizieller_titel: Copyright Act 1968 (Cth)
  fundstelle: Copyright Act 1968 (Cth) No. 63, 1968
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'UNVERÄNDERT UND BEWUSST SO BELASSEN. Australien kennt kein Fair-Use-Prinzip, sondern
    nur enumerierte "fair dealing"-Ausnahmen, unter die Text und Data Mining nicht fällt. Am 26.10.2025
    hat Attorney-General Michelle Rowland ausdrücklich entschieden, KEINE TDM-Ausnahme einzuführen — entgegen
    dem Vorschlag der Productivity Commission aus deren Interim Report (August 2025). KI-Training an urheberrechtlich
    geschütztem Material ohne Lizenz ist damit in Australien grundsätzlich rechtswidrig.

    '
  kurzbeschreibung: 'Der Copyright Act schützt Werke ohne Registrierung; Vervielfältigung im Rahmen von
    KI-Training berührt das Vervielfältigungsrecht. Da die "fair dealing"-Ausnahmen abschließend sind
    (Forschung und Studium, Kritik und Besprechung, Berichterstattung, Rechtsberatung, Parodie und Satire)
    und keine davon TDM abdeckt, benötigen KI-Entwickler eine Lizenz. Die Productivity Commission schlug
    im Interim Report 2025 eine TDM-Ausnahme bzw. ein neues fair dealing für TDM vor und löste damit heftigen
    Widerspruch der Kreativwirtschaft aus. Die Regierung folgte dem nicht, sondern verfolgt seit dem 26.10.2025
    eine Lizenzlösung. Rechtsfolgen einer Verletzung sind Unterlassung, Schadensersatz oder Gewinnherausgabe.

    '
  inkrafttreten:
    datum: 1969-05-01
    verifiziert: true
    quelle: https://www.legislation.gov.au/C1968A00063/latest/text
    fundstelle_norm: 'Endnote 3 (Legislation history) der amtlichen Kompilation des Copyright Act 1968:
      "63, 1968 | Assent 27 June 1968 | Commencement 1 May 1969 (see Gazette 1969, p. 2543)".'
  anwendungsdaten:
  - datum: 2025-08-05
    was_gilt: 'Productivity Commission empfiehlt im Interim Report ein fair dealing für Text und Data
      Mining (Monatsangabe).

      '
    verifiziert: false
    quelle: https://www.hsfkramer.com/insights/2025-08/australian-productivity-commission-proposes-text-data-mining-exception-to-copyright-infringement
  - datum: 2025-10-26
    was_gilt: 'Attorney-General Michelle Rowland schließt eine TDM-Ausnahme ausdrücklich aus; stattdessen
      Prüfung von Lizenzmodellen.

      '
    verifiziert: true
    quelle: https://www.dundaslawyers.com.au/federal-gov-rules-out-copyright-text-and-data-mining-exception-for-ai/
  themenachsen:
