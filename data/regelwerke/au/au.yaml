  - 'Discussion Paper Juni 2023: Konsultation über Regulierungsoptionen, über 500 Submissions.'
  - 'Interim Response 17.01.2024: Bekenntnis zu verbindlichen Guardrails für Hochrisiko-KI.'
  - Einsetzung einer temporären AI Expert Group zur Beratung der Regierung.
  - 'Ankündigung eines freiwilligen Sicherheitsstandards (später: VAISS, 05.09.2024).'
  - Kein eigenes KI-Gesetz zugesagt; Präferenz für Anpassung bestehenden Rechts.
