    urheber: MinterEllison
    verifiziert: true
    notiz: 'Beste verfügbare Darstellung der drei CAIRG-Prioritäten und der Lizenzoptionen; nennt ausdrücklich
      keinen Fristablauf.

      '
  offene_punkte:
  - Kein öffentlicher Einreichungsschluss — Beteiligung nur über Interessenbekundung bei CAIRG möglich.
  - Konsultationspapier und Feedback-Zusammenfassung nicht veröffentlicht.
  - Ob die Australian Standards for AI die CAIRG-Ergebnisse vorwegnehmen, ist offen.
