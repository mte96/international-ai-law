- id: au-online-safety-act-2021
  jurisdiktion: au
  kurztitel: Online Safety Act 2021 und eSafety-Industriekodizes
  offizieller_titel: 'Online Safety Act 2021 (Cth); Online Safety Amendment (Social Media Minimum Age)
    Act 2024 (Cth); Age-Restricted Material Codes

    '
  fundstelle: Online Safety Act 2021 (Cth) No. 76, 2021; registrierte Industriekodizes
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'DIE PRAKTISCH SCHÄRFSTE KI-BEZOGENE REGULIERUNG AUSTRALIENS. Die am 09.03.2026 in Kraft
    getretenen Age-Restricted Material Codes erfassen ausdrücklich KI-Chatbots, die explizite oder schädliche
    Inhalte erzeugen können, und verlangen Altersverifikation. Damit gelten für KI-Companion-Chatbots
    verbindliche, durchsetzbare Pflichten — anders als im übrigen KI-Recht des Bundes.

    '
  kurzbeschreibung: 'Der Online Safety Act gibt der eSafety Commissioner Befugnisse zu Entfernungsanordnungen,
    zivilrechtlichen Sanktionen und zur Registrierung verbindlicher Industriekodizes. Die Age-Restricted
    Material Codes verpflichten seit dem 09.03.2026 Anbieter, vor dem Zugang zu Pornografie, schwerer
    Gewaltdarstellung und suizidbezogenem Material das Alter zu prüfen; ein bestimmtes Verfahren schreiben
    die Codes nicht vor und eine Ausweisprüfung verlangen sie ausdrücklich nicht — die Wahl einer angemessenen
    und verhältnismäßigen Methode liegt beim Anbieter. Erfasst sind neben KI-Chatbots auch App-Stores,
    Spieleplattformen und bestimmte Nachrichtendienste. App-Stores müssen Minderjährigen den Bezug nicht
    altersgerechter Anwendungen verwehren; Suchmaschinen müssen explizite Inhalte für nicht angemeldete
    oder als minderjährig erkannte Nutzer unkenntlich machen. Einzelne Anbieter haben Australien statt
    der Umsetzung den Zugang gesperrt.

    '
  inkrafttreten:
    datum: 2022-01-23
    verifiziert: true
    quelle: https://www.legislation.gov.au/C2021A00076/latest/text
