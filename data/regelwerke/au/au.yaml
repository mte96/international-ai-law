- id: au-national-ai-plan-2025
  jurisdiktion: au
  kurztitel: National AI Plan 2025
  offizieller_titel: National Artificial Intelligence Plan
  fundstelle: Australian Government, Department of Industry, Science and Resources
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 02.12.2025 veröffentlicht. Politische Strategie ohne Bindungswirkung. Entscheidend:
    Der Plan gibt die 2024 zugesagten verbindlichen Guardrails ausdrücklich auf und ersetzt sie durch
    ein zweigleisiges Vorgehen — Klärung und Ertüchtigung bestehender, technologieneutraler Gesetze plus
    Leitlinien. Der ursprünglich angekündigte "National AI Capability Plan" ist in diesem Plan aufgegangen;
    ein separates Dokument dieses Namens existiert nicht.

    '
  kurzbeschreibung: 'Der National AI Plan formuliert drei Ziele: Chancen nutzen (Infrastruktur, Investitionen),
    Nutzen verbreiten (Qualifikation, Adoption in KMU und Non-Profits) und Australier schützen (Sicherheit
    und Vertrauen). Er bündelt über 460 Mio. AUD aus bestehenden Programmen, richtet einen CRC AI Accelerator
    ein, verlangt Chief AI Officers im öffentlichen Dienst und schafft das Australian AI Safety Institute.
    Regulatorisch verzichtet er auf KI-spezifische Gesetzgebung; stattdessen sollen Fachregulatoren Lücken
    in ihren Bereichen schließen. Sanktionen enthält der Plan keine — seine Wirkung ist rein programmatisch.

    '
  inkrafttreten:
    datum: 2025-12-02
    verifiziert: true
    quelle: https://membership.acs.org.au/member-insight/2025-12-02-Australia-s-New-National-AI-Plan-Top-9-Highlights.html
  anwendungsdaten:
  - datum: 2025-12-02
    was_gilt: 'Veröffentlichung des Plans; Aufgabe des Guardrails-Ansatzes zugunsten technologieneutraler
      Regulierung.

      '
    verifiziert: true
    quelle: https://piperalderman.com.au/insight/australia-now-has-a-national-ai-plan-now-what/
  themenachsen:
  - governance
  - marktzugang
  - arbeit
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Drei Säulen: Chancen nutzen / Nutzen verbreiten / Australier schützen.'
  - Über 460 Mio. AUD aus bestehenden Programmen für KI-Forschung, Innovation, Qualifikation.
  - Ausdrückliche Absage an ein eigenständiges KI-Gesetz ('regulation by evolution').
  - Einrichtung des Australian AI Safety Institute (rund 29,8-29,9 Mio. AUD über 4 Jahre).
  - Chief AI Officers in Commonwealth-Behörden.
  - Leitlinien zur Kennzeichnung KI-generierter Inhalte angekündigt.
  - 'Kritik: keine messbaren Erfolgsindikatoren, Infrastruktur- und Datenschutzfragen offen.'
