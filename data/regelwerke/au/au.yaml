- id: au-wa-ai-policy-2024
  jurisdiktion: au
  subjurisdiktion: au-wa
  kurztitel: WA Government AI Policy and Assurance Framework
  offizieller_titel: 'Western Australian Government Artificial Intelligence Policy and Artificial Intelligence
    Assurance Framework

    '
  fundstelle: 'Department of the Premier and Cabinet, Office of Digital Government (DGov)

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'VERBINDLICH FÜR WA-REGIERUNGSSTELLEN. Am 05.03.2024 veröffentlicht, zuletzt am 25.08.2026
    aktualisiert (Version 2). Die Benennungsfrist für AI Accountable Officers lief am 19.09.2025 ab.

    '
  kurzbeschreibung: 'Die Policy gilt für Stellen der WA-Landesregierung und erfasst sowohl beschaffte
    als auch selbst entwickelte KI-Systeme. Jede Stelle muss einen AI Accountable Officer auf Führungsebene
    benennen, der den KI-Einsatz beaufsichtigt und die Selbstbewertungen nach dem Assurance Framework
    freigibt. Für jedes System oder Vorhaben, das durch KI oder automatisierte Entscheidungsfindung getrieben
    wird, ist in allen Projektphasen eine Online-Selbstbewertung durchzuführen. Erreicht ein Vorhaben
    ein mittleres oder höheres Restrisiko, wird es aus dem Digital Capability Fund finanziert oder übersteigen
    die Gesamtkosten fünf Millionen AUD, ist es dem AI Advisory Board zur Prüfung vorzulegen. Niedrigrisiko-Vorhaben
    bedürfen keiner weiteren Schritte. Es handelt sich um Verwaltungsvorgaben ohne Außenwirkung.

    '
  inkrafttreten:
    datum: 2024-03-05
    verifiziert: true
