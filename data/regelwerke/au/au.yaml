- id: au-sa-royal-commission-ai-2026
  jurisdiktion: au
  kurztitel: Royal Commission into AI (South Australia)
  offizieller_titel: Royal Commission into Artificial Intelligence (South Australia)
  fundstelle: Government of South Australia, Department of the Premier and Cabinet
  verfahrensnummer: null
  status: verfahren
  status_detail: 'AUSTRALIENWEIT ERSTE ROYAL COMMISSION ZU KI. Am 10.08.2026 vom südaustralischen Premier
    angekündigt. Beginn der Arbeit 01.10.2026, Abschlussbericht bis 01.07.2027. Stand 18.08.2026 waren
    weder die Terms of Reference noch die Commissioners noch Einreichungsfristen veröffentlicht. Aufgenommen
    als nationaler Kontext, obwohl nicht WA.

    Stand 07.09.2026, amtlich (Office for AI South Australia): Der Abschlussbericht ist spätestens am
    01.07.2027 vorzulegen ("Final Report Due: No later than 1 July 2027") — diese Angabe fehlte bisher.
    Untersuchungsgegenstand nach der Mitteilung des Department of the Premier and Cabinet vom 11.08.2026:
    Landes- und Bundespolitik sowie Regulierungsrahmen; Auswirkungen auf Schulen, Hochschulen und berufliche
    Bildung; Folgen für den öffentlichen Dienst, insbesondere das Gesundheitswesen; Arbeitskräfte und
    Qualifikationen; Chancen der KI-Infrastruktur einschließlich Energie- und Wasserfragen. Unverändert
    offen: Terms of Reference ("to be determined"), Commissioners ("a panel of commissioners will be appointed")
    und Einreichungsfristen. Arbeitsbeginn bleibt 01.10.2026.

    '
  kurzbeschreibung: 'Die Royal Commission untersucht wirtschaftliche und gesellschaftliche Chancen und
    Herausforderungen künstlicher Intelligenz für South Australia. Sie will Beweise aus einem breiten
    Querschnitt der Gesellschaft erheben — Wirtschaft, Branchenverbände, Gewerkschaften, Technologieentwickler,
    Wissenschaft, unabhängige Sachverständige und Vertreter der Kreativwirtschaft. Als Royal Commission
    verfügt sie über Zwangsbefugnisse zur Beweiserhebung, erlässt aber kein Recht; ihre Empfehlungen sind
    unverbindlich. Wegen des Vorbilds der Robodebt-Royal-Commission ist mit erheblicher politischer Wirkung
    auch über South Australia hinaus zu rechnen.

    '
