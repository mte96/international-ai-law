- id: au-deepfake-act-2024
  jurisdiktion: au
  kurztitel: Deepfake-Strafrecht (Criminal Code Amendment 2024)
  offizieller_titel: Criminal Code Amendment (Deepfake Sexual Material) Act 2024 (Cth)
  fundstelle: Criminal Code Amendment (Deepfake Sexual Material) Act 2024 (Cth)
  verfahrensnummer: Criminal Code Amendment (Deepfake Sexual Material) Bill 2024
  status: anwendbar
  status_detail: 'IN KRAFT. Im Juni 2024 eingebracht, 2024 verabschiedet. Das Gesetz schafft einen eigenständigen
    Straftatbestand für die Übermittlung sexuell expliziten Materials ohne Einwilligung über Trägerdienste,
    ausdrücklich auch KI-generiertes Material.

    '
  kurzbeschreibung: 'Der Grundtatbestand stellt die Übermittlung sexuell expliziten Materials über einen
    Trägerdienst (carriage service) ohne Einwilligung der dargestellten Person unter Strafe; Höchststrafe
    sechs Jahre Freiheitsstrafe. Erfasst ist Material, das Erwachsene in sexuellen Posen oder Handlungen
    zeigt oder Intimbereiche darstellt — auch wenn es die Person nur SCHEINBAR zeigt, womit Deepfakes
    eindeutig einbezogen sind. Standbilder und Videos sind erfasst, reine Audioinhalte nicht. Zwei Qualifikationen
    greifen, wenn der Täter zuvor drei oder mehr zivilrechtliche Sanktionen nach dem Online Safety Act
    2021 erhalten hat oder wenn er das Material selbst erstellt oder verändert hat. WICHTIGE LÜCKE: Das
    bloße Erstellen oder Verändern nicht einvernehmlicher intimer Darstellungen ist auf Bundesebene für
    sich genommen NICHT strafbar — strafbar ist erst die Übermittlung.

    '
  inkrafttreten:
    datum: 2024-09-03
    verifiziert: true
    quelle: https://www.legislation.gov.au/C2024A00078/asmade/2024-09-02/text/original/epub/OEBPS/document_1/document_1.html
    fundstelle_norm: 's. 2 Criminal Code Amendment (Deepfake Sexual Material) Act 2024 (No. 78, 2024),
      Commencement table: ''The whole of this Act — The day after this Act receives the Royal Assent.''
      Royal Assent am 02.09.2024, mithin Inkrafttreten am 03.09.2024'
  anwendungsdaten:
  - datum: 2024-06-05
    was_gilt: Einbringung des Bill im Parlament (Anfang Juni 2024).
    verifiziert: false
    quelle: https://www.gtlaw.com.au/insights/australian-government-targets-sexually-explicit-deepfakes
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Grundtatbestand: Übermittlung sexuell expliziten Materials ohne Einwilligung über Trägerdienst; bis
    zu sechs Jahre Freiheitsstrafe.'
  - Erfasst auch Material, das die Person nur SCHEINBAR zeigt — damit Deepfakes eindeutig einbezogen.
  - Standbilder und Videos erfasst; reine Audioinhalte NICHT.
  - 'Qualifikation 1: drei oder mehr vorangegangene zivilrechtliche Sanktionen nach dem Online Safety
    Act 2021.'
  - 'Qualifikation 2: der Täter hat das Material selbst erstellt oder verändert.'
  - 'LÜCKE: bloßes Erstellen oder Verändern ohne Übermittlung bundesrechtlich nicht strafbar.'
  - Ergänzend greifen Landesstrafrecht und das zivilrechtliche Bild-Missbrauchs-Regime des Online Safety
    Act.
