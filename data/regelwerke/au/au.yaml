  fundstelle: 'Eingesetzt durch Beschluss (resolution of appointment) beider Häuser des Commonwealth-Parlaments
    am 20. August 2026

    '
  verfahrensnummer: null
  status: verfahren
  status_detail: 'LAUFEND UND FRISTGEBUNDEN. Am 20.08.2026 durch gleichlautenden Beschluss von House of
    Representatives und Senat eingesetzt, auf Initiative der Opposition, von der Regierung mitgetragen.
    Berichtsfrist 30.11.2026 — ein außergewöhnlich kurzes Mandat von gut drei Monaten. Nach Angabe der
    National Association for the Visual Arts schließt die Einreichungsfrist für Submissions am 14.09.2026.

    Stand 07.09.2026 nach dem Wortlaut der Einsetzungsentschließung beider Häuser vom 20.08.2026: Der
    Ausschuss hat seinen Abschlussbericht spätestens am 30.11.2026 vorzulegen ("The committee present
    its final report by no later than 30 November 2026"). Zusammensetzung: zwölf Mitglieder — sechs Abgeordnete
    (drei Regierung, zwei Opposition, eine Person aus den Minderheitsfraktionen oder unabhängig) und sechs
    Senatoren im selben Schlüssel; Vorsitz bei der Regierung, stellvertretender Vorsitz bei der Opposition,
    Stichentscheid des Vorsitzenden. Unterausschüsse ab drei Mitgliedern dürfen öffentliche Anhörungen
    durchführen. Terms of Reference (Kurzfassung der Beschlusspunkte): (a) Chancen für Resilienz, Produktivität,
    Wettbewerbsfähigkeit und Lebensstandard; (b) regionale Verteilung und Sektorvorteile in Landwirtschaft,
    Rohstoffen, Gesundheit, Fertigung und Verteidigung; (c) und (d) Adoptionshemmnisse, besonders für
    KMU; (e) souveräne Fähigkeiten, Halten von Talent und Investitionen; (f) Datensouveränität und domänenspezifische,
    auf australischen Daten trainierte Modelle; (g) Arbeitsmarktfolgen und Eignung des Bildungssystems;
    (h) staatliche Nutzung und Transparenz; (i) Lücken des Regulierungsrahmens; (j) Verhältnis von KI-Training
    zu Immaterialgüter- und Urheberrecht sowie zu australischen Kreativinhalten; (k) Risiken einschließlich
    Betrug, Deepfakes und Kinderschutz; (l) nationale Sicherheit, Cybersicherheit, ausländische Einflussnahme
    und kritische Infrastruktur; (m) Folgen neu entstehender Fähigkeiten für die strategische Resilienz.

    '
  kurzbeschreibung: 'Der Ausschuss untersucht Risiken und Chancen künstlicher Intelligenz mit einem bewusst
    weiten Mandat. Er befasst sich mit dem Beitrag von KI zu Innovation, Produktivität und Lebensstandard,
    mit Adoptionshemmnissen, mit dem Aufbau souveräner KI-Fähigkeit, mit Auswirkungen auf Arbeitsmarkt
    und Qualifikationen sowie — juristisch am wichtigsten — mit der Angemessenheit des geltenden Rechts
    einschließlich Urheber- und Immaterialgüterrecht. Hinzu kommen nationale Sicherheit, Datensouveränität,
    Verbraucherschutz, Deepfakes und Cybersicherheit. Der Ausschuss kann jede von ihm als KI-bezogen angesehene
    Frage aufgreifen. Er erlässt kein Recht; seine Empfehlungen sind unverbindlich, prägen aber absehbar
    die für Anfang 2027 erwartete Gesetzgebung.

    '
