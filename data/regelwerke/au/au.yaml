  status_detail: 'ABGESCHLOSSEN UND WEITGEHEND ZURÜCKGEWIESEN. Der Ausschuss legte am 26.11.2024 seinen
    Abschlussbericht mit 13 Empfehlungen vor; Empfehlung 1 forderte ein umfassendes KI-Gesetz nach EU-Vorbild.
    Die Regierung antwortete erst am 01.04.2026 und lehnte ein eigenständiges KI-Gesetz ausdrücklich ab.

    '
  kurzbeschreibung: 'Der Senatsausschuss untersuchte Chancen und Auswirkungen der KI-Nutzung in Australien
    und empfahl ein umfassendes KI-Gesetz zur Regulierung von Hochrisiko-KI, ausdrücklich nach europäischem
    statt US-amerikanischem sektoralem Vorbild. Als hochriskant sollten unter anderem KI am Arbeitsplatz,
    General-Purpose-KI und automatisierte Entscheidungen mit erheblicher Wirkung gelten. Weiter empfahl
    er Transparenzpflichten und Vergütungsmechanismen für Rechteinhaber sowie Konsultationen zu fairer
    Vergütung von Kreativen. Die Regierungsantwort vom 01.04.2026 wies den Kern zurück: bestehende Rahmen
    (Datenschutz, Verwaltungsrecht, Online Safety, Gesellschaftsrecht, Immaterialgüterrecht, Arbeitsrecht)
    blieben Fundament; stattdessen AISI und sektorale Eingriffe.

    '
