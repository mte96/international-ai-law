- id: au-consumer-safety-priorities-2026
  jurisdiktion: au
  kurztitel: AI Consumer Safety Priorities (Juli 2026)
  offizieller_titel: AI consumer safety priorities — joint ministerial statement
  fundstelle: Gemeinsame Ministererklärung vom 20. Juli 2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 20.07.2026 von mehreren Ressorts gemeinsam veröffentlicht (Attorney-General, Industrie,
    Treasury/Andrew Leigh, Kommunikation, Beschäftigung). Programmatische Festlegung von fünf Regulierungsprioritäten;
    noch keine Gesetzestexte.

    '
  kurzbeschreibung: 'Die Erklärung benennt fünf Prioritäten, mit denen KI-Risiken über bestehendes Recht
    adressiert werden sollen. Erstens eine gesetzlich verankerte digitale Sorgfaltspflicht (digital duty
    of care), die KI-Unternehmen zu Safety-by-Design verpflichtet. Zweitens die Modernisierung des Datenschutzrechts.
    Drittens KI-Sicherheit am Arbeitsplatz (Transparenz und Rechenschaft bei Recruiting, Überwachung,
    Dienstplanung, Leistungsbewertung). Viertens eine Überprüfung des Verbraucherrechts, besonders zu
    Surveillance Pricing und agentischem Handel. Fünftens ein Rahmen für automatisierte Entscheidungen
    in Bundesbehörden. Die Erklärung selbst schafft keine Pflichten und keine Sanktionen.

    '
