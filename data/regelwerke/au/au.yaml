- id: au-tga-ai-devices
  jurisdiktion: au
  kurztitel: TGA — KI als Medizinprodukt
  offizieller_titel: 'Therapeutic Goods Act 1989 (Cth) und Therapeutic Goods (Medical Devices) Regulations
    2002; TGA-Leitlinien zu KI-basierter Medizinproduktesoftware

    '
  fundstelle: Therapeutic Goods Act 1989 (Cth); TGA-Leitlinien Februar 2026
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'GELTENDES RECHT, 2026 KONKRETISIERT. Die TGA hat im Februar 2026 ausführliche Leitlinien
    veröffentlicht, die klarstellen, wann KI-Software als Medizinprodukt reguliert wird. Software as a
    Medical Device (SaMD) gehört zu den zwölf Aufsichtsschwerpunkten der TGA für 2026/27. Ein KI-Review
    wurde durchgeführt und der Ergebnisbericht veröffentlicht.

    '
  kurzbeschreibung: 'KI-Software wird als Medizinprodukt reguliert, wenn sie zur Diagnose, Vorbeugung,
    Überwachung, Vorhersage, Prognose, Behandlung oder Linderung von Krankheiten bestimmt ist. Maßgeblich
    ist der Zweckbestimmung (intended purpose), nicht die Funktionsweise — Marketingmaterial, technische
    Dokumentation und Kennzeichnung können die Zweckbestimmung begründen, sodass Produkte ungewollt in
    die Regulierung geraten können. Erfasst sind maschinelles Lernen, große Sprachmodelle, generative
    KI, Sprachverarbeitung und Bilderkennung. Regulierte Produkte bedürfen der Eintragung im Australian
    Register of Therapeutic Goods; die TGA führt seit 2025 eine Liste KI-gestützter Medizinprodukte. Inverkehrbringen
    ohne Eintragung ist mit empfindlichen Sanktionen bedroht.

    '
  inkrafttreten:
    datum: 1991-02-15
    verifiziert: false
    quelle: https://www.tga.gov.au/
  anwendungsdaten:
  - datum: 2025-01-01
    was_gilt: 'Erste TGA-Liste KI-gestützter Medizinprodukte im ARTG (Jahresangabe).

      '
    verifiziert: false
    quelle: https://www.claytonutz.com/insights/2026/july/healthcare-software-tga-clarifies-when-ai-will-be-regulated-as-a-medical-device
  - datum: 2026-02-01
    was_gilt: 'TGA-Leitlinien zur Regulierung KI-basierter Medizinproduktesoftware veröffentlicht (Monatsangabe).

      '
    verifiziert: true
    quelle: https://www.claytonutz.com/insights/2026/july/healthcare-software-tga-clarifies-when-ai-will-be-regulated-as-a-medical-device
  themenachsen:
  - sektor-medizin
  - marktzugang
  - haftung
  regelungsschwerpunkte:
  - 'Regulierungsauslöser: Zweckbestimmung, nicht Funktionsweise.'
  - 'Zitat: ''diagnosis, prevention, monitoring, prediction, prognosis, treatment or alleviation of disease''.'
  - 'Erfasst: maschinelles Lernen, LLMs, generative KI, Sprachverarbeitung, Bilderkennung.'
  - Risiko der unbeabsichtigten Regulierung durch Marketingaussagen.
  - SaMD unter den zwölf TGA-Aufsichtsschwerpunkten 2026/27.
  - 'Parallel: Australian Commission on Safety and Quality in Health Care entwickelt KI-Sicherheitsleitlinien.'
