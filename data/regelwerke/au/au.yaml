- id: au-privacy-tranche2
  jurisdiktion: au
  kurztitel: Privacy Act Reform — Tranche 2
  offizieller_titel: Second tranche of Privacy Act reforms (angekündigt)
  fundstelle: Attorney-General's Department; noch kein Gesetzentwurf
  verfahrensnummer: null
  status: idee
  status_detail: 'OFFEN UND UNTERMINIERT. Stand August 2026 ist die zweite Tranche eine Regierungszusage
    ohne Gesetzentwurf: kein Bill eingebracht, kein Anwendungsbeginn festgelegt. Der Attorney-General
    erklärte im Juli 2025, ein Entwurf werde für das Kabinett vorbereitet; die Ministererklärung vom 20.07.2026
    führt Datenschutzmodernisierung erneut als Priorität.

    '
  kurzbeschreibung: 'Erwartet werden ein übergreifender "fair and reasonable"-Test für Erhebung, Nutzung
    und Offenlegung personenbezogener Daten, eine Klärung des Begriffs personenbezogener Daten einschließlich
    de-identifizierter und abgeleiteter (inferred) Daten — für KI besonders bedeutsam —, erweiterte Betroffenenrechte
    einschließlich eines möglichen Löschungsanspruchs, verschärfte Einwilligungs- und Transparenzanforderungen
    sowie die mögliche Streichung der Ausnahmen für Kleinunternehmen und Beschäftigtendaten. Die Regierung
    unterstützt die Streichung der Kleinunternehmensausnahme im Grundsatz, ohne Datum. Ein direktes Klagerecht
    (direct right of action) steht ebenfalls im Raum.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://rulesmate.com.au/insights/privacy-act-second-tranche-reforms-2026-outlook
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - '''Fair and reasonable''-Test als übergreifender Maßstab.'
  - Klärung, ob de-identifizierte und abgeleitete Daten personenbezogen sind — KI-Kernfrage.
  - Mögliche Streichung der Ausnahmen für Kleinunternehmen und Beschäftigtendaten.
  - Erweiterte Betroffenenrechte, möglicher Löschungsanspruch.
  - Direktes Klagerecht im Gespräch.
  - 'WARNUNG: kursierende Zeitpläne sind Spekulation, kein geltendes Recht.'
