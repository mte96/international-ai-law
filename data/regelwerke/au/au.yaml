    services, designated internet services), die von Kindern genutzt werden oder sich an Kinder richten,
    mit Ausnahme von Gesundheitsdienstleistern. Er konkretisiert die Australian Privacy Principles für
    Kinder und ist KI-relevant, weil er Profilbildung, algorithmische Empfehlungssysteme und Altersverifikation
    betrifft. Als registrierter APP-Kodex ist er verbindlich; Verstöße werden wie Verstöße gegen die APPs
