  - haftung
  - arbeit
  - sektor-finanz
  regelungsschwerpunkte:
  - Mittelbare Diskriminierung erfasst algorithmische Entscheidungen — ohne KI-spezifische Norm.
  - 'Beweisproblem: Betroffene erfahren regelmäßig nichts vom Algorithmus.'
  - Deshalb ist die Transparenzpflicht APP 1.7 (ab 10.12.2026) mittelbar diskriminierungsrechtlich bedeutsam.
  - AHRC-Leitlinie 01.12.2022 zu KI und Diskriminierung in Versicherungspreisbildung und Risikoprüfung.
  - 'Zitat AHRC: algorithmische Verzerrung kann Diskriminierung wegen Alter, Rasse, Behinderung oder Geschlecht
    bewirken.'
  - 'AHRC-Position: Australien braucht bessere KI-Regulierung — bislang nicht umgesetzt.'
