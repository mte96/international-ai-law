      '
    url: https://consultations.tga.gov.au/tga/clarifying-and-strengthening-the-regulation-of-ai/supporting_documents/tga-report-clarifying-and-strengthening-the-regulation-of-medical-device-software-including-artificial-intelligence-aipdf
    sprache: en
    urheber: Therapeutic Goods Administration (TGA)
    verifiziert: false
    notiz: Ergebnisbericht des KI-Reviews. In dieser Sitzung nicht abgerufen.
  offene_punkte:
  - Taggenaü Datierung der Leitlinien Februar 2026 nicht ermittelt.
  - Geplante Rechtsänderungen aus dem KI-Review und deren Zeitplan offen.
  - 'Inkrafttreten nicht belegbar: legislation.gov.au (Series C2004A03952 — Volltext wird nur per JavaScript
    nachgeladen, Endnote nicht auslesbar), AustLII (s. 2 im Volltext geprueft), tga.gov.au (nennt kein
    Datum), WTO-Legislationsdatenbank (Feld ''First EIF'' leer), Wikipedia (nur Royal Assent 17.01.1990).
    Der Therapeutic Goods Act 1989 ist als Act No. 21 of 1990 ergangen; s. 2 nennt KEIN Datum, sondern
    eine Bedingung: ''This Act commences on the day after the day on which a House of the Parliament approves
    regulations made under this Act in the same form as approved by the other House ...''. Das tatsaechliche
    Inkrafttretensdatum ergibt sich erst aus der parlamentarischen Billigung der Verordnungen und ist
    nur einer Endnote oder dem Gazette zu entnehmen; es liess sich nicht belegen. Der eingetragene 15.02.1991
    ist WEDER Ausfertigung (17.01.1990) NOCH Verkuendung, also kein Vorakt-Datum, und damit plausibel
    — aber unbelegt. Verifiziert bleibt false. Empfehlung: Endnote 3 der aktuellen Kompilation auf legislation.gov.au
    im Browser mit vollstaendig geladener Textansicht pruefen.'
  monitoring_quellen:
