  - 'Priorität 2 — Datenschutzreform: Modernisierung für KI-gestützte Dienste (Attorney-General).'
  - 'Priorität 3 — KI-Sicherheit am Arbeitsplatz: Recruiting, Monitoring, Dienstplanung, Leistungsbewertung;
    AI Workplace and Employment Forum.'
  - 'Priorität 4 — Verbraucherrecht: Review der Australian Consumer Law zu Surveillance Pricing und agentic
    commerce (Assistant Minister Andrew Leigh).'
