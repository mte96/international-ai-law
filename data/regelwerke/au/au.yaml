  - Ob das OAIC bis 10.12.2026 spezifische APP-1.7-Leitlinien veröffentlicht, ist offen.
  - Auslegung von 'substantially facilitated' bislang ungeklärt — Hauptstreitfrage der Praxis.
  - Erste Rechtsprechung zum statutory tort noch nicht ermittelt.
