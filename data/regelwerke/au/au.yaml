    was_gilt: CPS 234 Information Security anwendbar.
    verifiziert: false
    quelle: https://www.apra.gov.au/
  - datum: 2025-07-01
    was_gilt: CPS 230 Operational Risk Management anwendbar.
    verifiziert: true
    quelle: https://www.apra.gov.au/standards/cps-230
  - datum: 2026-04-30
    was_gilt: APRA-Schreiben zur KI-Governance an beaufsichtigte Institute.
