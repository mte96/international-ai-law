  status_detail: 'Im National AI Plan (02.12.2025) angekündigt, Anfang 2026 aufgebaut, seit Juni 2026
    operativ. Kate Conroy wurde im Mai 2026 zur ersten General Managerin ernannt. Das Institut hat KEINE
    Regulierungs- oder Sanktionsbefugnisse; es evaluiert, forscht und berät.

    '
  kurzbeschreibung: 'Das AISI ist mit rund 29,8 bis 29,9 Mio. AUD über vier Jahre ausgestattet und testet
    fortgeschrittene ("frontier") KI-Modelle, zum Teil vor deren Veröffentlichung und in Zusammenarbeit
    mit dem Australian Signals Directorate. Es berät die Regierung zu Regulierungslücken, veröffentlicht
    Forschung und Sicherheitsbenchmarks und ist Teil des International Network of AI Safety Institutes.
    Es erlässt keine verbindlichen Vorgaben und kann keine Sanktionen verhängen — seine Bedeutung liegt
    in der Vorbereitung künftiger Regulierung.

    '
