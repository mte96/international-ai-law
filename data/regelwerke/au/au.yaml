  regelungsschwerpunkte:
  - 'Erklärtes Ziel: ''clear, consistent and mandatory'' — national einheitlich, verbindlich.'
  - 'Rechenzentren: Selbstunterlegung neuer Stromversorgung, volle Anschlusskosten, Lastreduktion bei
    Netzengpässen, Wassereffizienz, Ziel Netto-Energieerzeuger.'
  - 'Standortsteuerung: keine Konkurrenz mit Wohnbauflächen.'
  - 'Urheberrecht: Kontrolle der Kreativen über Nutzung und Preis; kein Training ohne Zustimmung.'
  - Office of AI im PM&C koordiniert Standardentwicklung ressortübergreifend.
  - 'Zitat Albanese: ''This world leading framework is about Australia choosing to shape the future rather
    than letting the future of AI shape us.'''
  - Gesetzgebung angekündigt für Anfang 2027 — kein Datum, kein Entwurf.
