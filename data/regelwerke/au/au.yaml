- id: au-adm-reform-robodebt
  jurisdiktion: au
  kurztitel: Rahmen für automatisierte Entscheidungen der Verwaltung (Robodebt)
  offizieller_titel: 'Use of automated decision-making by government — Umsetzung der Empfehlung 17.1 der
    Royal Commission into the Robodebt Scheme

    '
  fundstelle: Attorney-General's Department; Royal Commission into the Robodebt Scheme (Bericht 07.07.2023)
  verfahrensnummer: null
  status: idee
  status_detail: 'KONSULTIERT, ABER NICHT UMGESETZT. Die Konsultation lief vom 13.11.2024 bis 15.01.2025;
    es gingen über 40 Stellungnahmen und 20 Umfrageantworten von 46 Organisationen ein. Stand August 2026
    ist KEIN Gesetzentwurf eingebracht. Die Ministererklärung vom 20.07.2026 führt den Rahmen als Priorität
    5 erneut auf.

    '
  kurzbeschreibung: 'Die Robodebt-Royal-Commission untersuchte das rechtswidrige automatisierte Einkommensabgleichsverfahren
    der Sozialverwaltung und empfahl in Empfehlung 17.1 einen konsistenten gesetzlichen Rahmen für automatisierte
    Verwaltungsentscheidungen. Erwartet werden eine ausdrückliche gesetzliche Ermächtigung für ADM, Transparenz
    über den Einsatz, Begründbarkeit und wirksamer Rechtsschutz. Robodebt ist der prägende australische
    Referenzfall für die Gefahren automatisierter Entscheidungen und erklärt, warum die Transparenzpflicht
    des Privacy Act 1988 (APP 1.7) politisch durchsetzbar war. Bislang ohne verbindliche Wirkung.

    '
