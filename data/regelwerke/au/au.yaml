  - 'CPS 230: Steuerung operationeller Risiken, kritische Geschäftsprozesse, Toleranzgrenzen, Betriebsfähigkeit.'
  - 'CPS 230: Drittparteienrisiko — erfasst KI-Anbieter und Modell-APIs, soweit das Institut sich für
    einen kritischen Prozess auf sie stützt oder sie es einem wesentlichen operationellen Risiko aussetzen
    (Abs. 48).'
  - 'CPS 234: dem Bedrohungsniveau angemessene Informationssicherheit.'
  - Technologieneutral, aber praktisch das schärfste geltende KI-Regime im Finanzsektor.
