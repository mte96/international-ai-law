- id: au-cairg-2025
  jurisdiktion: au
  kurztitel: CAIRG — Copyright and AI Reference Group
  offizieller_titel: Copyright and Artificial Intelligence Reference Group (CAIRG)
  fundstelle: Attorney-General's Department
  verfahrensnummer: null
  status: verfahren
  status_detail: 'LAUFEND, INTRANSPARENT. Als ständiger Mechanismus 2023 eingerichtet. Nach der Entscheidung
    gegen eine TDM-Ausnahme tagte CAIRG am 27. und 28.10.2025 zu drei Prioritäten. Stand August 2026 ist
    WEDER das Konsultationspapier NOCH eine Zusammenfassung der Rückmeldungen veröffentlicht; ein Einreichungsschluss
    ist nicht bekannt. Eine Umsetzung vor Ende 2026 gilt als unwahrscheinlich.

    '
  kurzbeschreibung: 'CAIRG berät die Regierung zum Verhältnis von Urheberrecht und KI und ist mit Vertretern
    der Technologiebranche, der Kreativwirtschaft, der Verwertungsgesellschaften, der Verwaltung, des
    Bildungswesens, der Medien und der Wissenschaft besetzt. Die drei Prioritäten sind: erstens legale
    Wege zur Nutzung urheberrechtlich geschützten Materials für KI — konkret die Wahl zwischen gesetzlicher
    Lizenz, kollektiver Lizenzierung über Verwertungsgesellschaften und rein freiwilliger Lizenzierung;
    zweitens Rechtssicherheit für KI-generierte Inhalte; drittens ein Small-Claims-Forum für geringwertige
    Urheberrechtsstreitigkeiten. CAIRG erlässt kein Recht.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.minterellison.com/articles/copyright-and-ai-consultation-on-licensing-for-ai-training
  anwendungsdaten:
  - datum: 2025-10-27
    was_gilt: 'CAIRG-Sitzung am 27. und 28.10.2025 zu den drei Prioritäten.

      '
    verifiziert: true
    quelle: https://www.dundaslawyers.com.au/federal-gov-rules-out-copyright-text-and-data-mining-exception-for-ai/
  themenachsen:
  - urheberrecht
  - vertrag
  - content
  - wettbewerb
  regelungsschwerpunkte:
  - 'Priorität 1: Lizenzwege — gesetzliche Lizenz vs. kollektive Lizenzierung vs. freiwillige Lizenzierung.'
  - 'Priorität 2: Rechtssicherheit für KI-generierte Inhalte (Schutzfähigkeit, Zurechnung).'
  - 'Priorität 3: Small-Claims-Forum für geringwertige Urheberrechtsstreitigkeiten.'
  - 'Regierungsabsicht: ''expeditiously'' umsetzen — bislang ohne Ergebnis.'
  - 'Kritik: keine Veröffentlichung des Konsultationspapiers, keine Rückmeldungszusammenfassung, kein
    Zeitplan.'
