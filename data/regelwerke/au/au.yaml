- id: au-privacy-act-1988
  jurisdiktion: au
  kurztitel: Privacy Act 1988 (mit Reform 2024)
  offizieller_titel: 'Privacy Act 1988 (Cth), geändert durch den Privacy and Other Legislation Amendment
    Act 2024 (Cth)

    '
  fundstelle: Privacy Act 1988 (Cth); Privacy and Other Legislation Amendment Act 2024 (Cth) No. 106,
    2024
  verfahrensnummer: Privacy and Other Legislation Amendment Bill 2024
  status: teilanwendbar
  status_detail: 'WICHTIGSTES GELTENDES KI-RELEVANTES BUNDESGESETZ. Die Änderungsnovelle erhielt am 10.12.2024
    die Zustimmung; ihre Teile treten gestaffelt in Kraft. Der deliktische Anspruch wegen schwerwiegender
    Verletzung der Privatsphäre gilt seit 10.06.2025. Die Transparenzpflicht für automatisierte Entscheidungen
    (APP 1.7) gilt ab 10.12.2026 — bis dahin besteht KEINE bundesrechtliche KI-Transparenzpflicht des
    Privatrechts.

    '
  kurzbeschreibung: 'Der Privacy Act bindet APP-Entitäten (Bundesbehörden sowie Unternehmen ab 3 Mio.
    AUD Jahresumsatz und bestimmte kleinere Unternehmen) an die dreizehn Australian Privacy Principles.
    Für KI zentral: Ab 10.12.2026 müssen Datenschutzerklärungen offenlegen, welche Arten personenbezogener
    Daten in automatisierte Entscheidungssysteme einfließen und welche Arten von Entscheidungen entweder
    ausschließlich automatisiert getroffen oder durch Computerprogramme maßgeblich vorbereitet werden
    — sofern die Entscheidung Rechte oder Interessen der Person erheblich berühren kann. Verstöße gegen
    die Datenschutzerklärungspflicht sind über Infringement Notices, Compliance Notices und zivilrechtliche
    Strafen durchsetzbar. Daneben steht seit 10.06.2025 der eigenständige Deliktsanspruch offen, der auch
    Nicht-APP-Entitäten erfasst.

    '
  inkrafttreten:
    datum: 1989-01-01
    verifiziert: true
    quelle: https://www.legislation.gov.au/C2004A03712/latest/text
    fundstelle_norm: 'Sec. 2 Privacy Act 1988: "This Act commences on a day to be fixed by Proclamation."
      Endnote 3 (Legislation history) der amtlichen Kompilation: "Privacy Act 1988 | 119, 1988 | Assent
      14 Dec 1988 | Commencement 1 Jan 1989 (s 2 and gaz 1988, No S399)". Zuvor gespeichert: 21.12.1988
      — das ist der Tag der Proklamation im Gazette, nicht des Inkrafttretens.'
