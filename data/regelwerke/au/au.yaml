  kurztitel: Gerichtliche Regelwerke zu generativer KI in Schriftsätzen
  offizieller_titel: 'Practice Notes, Practice Directions und Guidelines australischer Gerichte und Tribunale
    zur Nutzung generativer künstlicher Intelligenz

    '
  fundstelle: 'Federal Court GPN-AI; FCFCOA PD-AI; NSW Supreme Court Practice Note SC Gen 23; Supreme
    Court of Victoria SC Gen 25; Supreme Court of Queensland PD 5 of 2025; Supreme Court of South Australia
    Guidelines; Supreme Court of WA (nur Konsultation)

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'FLICKENTEPPICH MIT UNTERSCHIEDLICHER VERBINDLICHKEIT. Practice Notes und Practice Directions
    sind für Verfahrensbeteiligte verbindlich und über Kostenentscheidungen und Berufsrecht durchsetzbar,
    auch wenn sie keine Gesetze sind. Der Bund und alle großen Ostküstenstaaten haben Regelungen erlassen.
    WESTERN AUSTRALIA IST DAS SCHLUSSLICHT: Der Supreme Court of WA hat im März 2025 lediglich eine Consultation
    Note veröffentlicht (Einreichungsschluss 31.03.2025); eine erlassene Practice Direction war am 27.08.2026
    nicht auffindbar. Widersprüchliche Quellenlage, siehe meta.quellenkonflikte.

    '
  kurzbeschreibung: 'Die Regelwerke verpflichten Verfahrensbeteiligte, die Grenzen generativer KI zu kennen,
    ihre Nutzung offenzulegen, wo verlangt, und die Richtigkeit jeder Angabe selbst zu verantworten. Der
    Federal Court verlangt in GPN-AI (Chief Justice Mortimer, erlassen 16.04.2026), dass Schriftsätze
    keine erfundenen Fälle, falschen Zitate oder unzutreffenden Rechtsausführungen enthalten und dass
    zitierte Entscheidungen tatsächlich existieren und die behauptete Aussage tragen. Bei eidesstattlichen
    Versicherungen und Sachverständigengutachten gilt Besonderes: Sie müssen das eigene Wissen und die
    eigene Gedankenführung des Zeugen oder Sachverständigen wiedergeben; ein KI-Einsatz zur Zusammenfassung
    oder Analyse zugrunde liegender Informationen ist offenzulegen. Vertrauliche Informationen dürfen
    nicht in gewöhnliche KI-Werkzeuge eingegeben werden. Sanktion sind nachteilige Kostenentscheidungen
    und berufsrechtliche Folgen.

    '
