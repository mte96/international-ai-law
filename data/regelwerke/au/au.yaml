  - content
  regelungsschwerpunkte:
  - 's 18 ACL: irreführendes und täuschendes Verhalten — erfasst ''AI washing''.'
  - Verbrauchergarantien, insbesondere angemessene Sorgfalt und Fachkunde bei KI-gestützten Diensten.
  - Missbräuchliche Vertragsklauseln in KI-Nutzungsbedingungen.
  - 'Angekündigter Review: Surveillance Pricing, agentic commerce.'
  - Durchsetzung durch die ACCC.
