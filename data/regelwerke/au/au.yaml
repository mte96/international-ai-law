  - Age-Restricted Material Codes (ab 09.03.2026) erfassen ausdrücklich KI-Chatbots mit Fähigkeit zu expliziten
    oder schädlichen Inhalten.
  - Kein vorgeschriebenes Verfahren der Altersprüfung; die Codes verlangen ausdrücklich keine Ausweisprüfung,
    die Wahl einer angemessenen und verhältnismäßigen Methode liegt beim Anbieter.
  - 'App-Stores: Verhinderung des Bezugs nicht altersgerechter Anwendungen durch Minderjährige.'
  - 'Suchmaschinen: Unkenntlichmachung expliziter oder gewalthaltiger Inhalte für nicht angemeldete bzw.
    minderjährige Nutzer.'
  - Eigene Kodexinitiative gegen KI-Chatbots, die Suizid befördern oder sexualisierte Gespräche mit Kindern
    führen.
  - Durchsetzung durch die eSafety Commissioner; zivilrechtliche Sanktionen.
  - Social Media Minimum Age (Novelle 2024) mit Verschärfungsvorhaben 2026 (Online Safety Amendment Bill
    2026, r7512).
  - Verhältnis zur geplanten digital duty of care noch ungeklärt.
