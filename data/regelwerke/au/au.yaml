  jurisdiktion: au
  kurztitel: Policy for the responsible use of AI in government (DTA)
  offizieller_titel: Policy for the responsible use of AI in government — Version 2.0
  fundstelle: Digital Transformation Agency (DTA), digital.gov.au
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'VERBINDLICH FÜR COMMONWEALTH-BEHÖRDEN, GESTAFFELT ANWENDBAR. Version 1 galt ab 01.09.2024.
    Version 2.0 trat am 15.12.2025 in Kraft; die erste Pflichtanforderung griff am 15.06.2026, die übrigen
    im Dezember 2026. Am 31.03.2026 startete ein zentrales Register der AI Transparency Statements.

    '
  kurzbeschreibung: 'Die Policy bindet nichtkorporative und korporative Commonwealth-Behörden (Verteidigung
    und Nachrichtendienste ausgenommen). Sie verlangt die Benennung eines verantwortlichen Amtsträgers
    (accountable official, in der Praxis Chief AI Officer), die Veröffentlichung eines AI Transparency
    Statement, interne Register der KI-Anwendungsfälle, Folgenabschätzungen zu Fairness, Sicherheit, Datenschutz,
    Transparenz, Sicherheit und menschzentrierten Werten, klare Genehmigungs- und Aufsichtsprozesse, Schulung
    des Personals in den Australian AI Ethics Principles, Vorfallreaktion und Meldewege sowie strategische
    KI-Planung. Grundlagenschulung ist im gesamten Australian Public Service verpflichtend. Sie ist eine
    Verwaltungsvorschrift, kein Gesetz, und begründet keine subjektiven Rechte Dritter.

    '
