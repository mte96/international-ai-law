- id: au-guardrails-proposals-2024
  jurisdiktion: au
  kurztitel: Proposals Paper — verbindliche Guardrails für Hochrisiko-KI
  offizieller_titel: 'Safe and responsible AI in Australia — Proposals paper for introducing mandatory
    guardrails for AI in high-risk settings

    '
  fundstelle: Department of Industry, Science and Resources (DISR)
  verfahrensnummer: null
  status: gescheitert
  status_detail: 'AUFGEGEBEN. Das Proposals Paper vom 05.09.2024 schlug zehn verbindliche Guardrails und
    drei Umsetzungsoptionen vor (darunter ein eigener Australian AI Act). Es kam weder ein Gesetzentwurf
    noch ein AI Act zustande: Mit dem National AI Plan vom 02.12.2025 hat die Regierung den Ansatz ausdrücklich
    verworfen und durch technologieneutrale Anpassung bestehenden Rechts ersetzt. Die Regierungsantwort
    auf den Senatsausschuss vom 01.04.2026 bestätigte die Absage an ein eigenständiges KI-Gesetz.

    '
  kurzbeschreibung: 'Das Papier definierte Hochrisiko-KI in zwei Kategorien (bekannte Anwendungsrisiken
    für Rechte, Gesundheit, Rechtsstellung sowie breite wirtschaftliche und gesellschaftliche Auswirkungen;
    sowie General-Purpose-KI-Modelle als eigene Kategorie) und schlug zehn verbindliche Guardrails vor,
    die inhaltlich dem VAISS entsprachen, aber statt Stakeholder-Einbindung eine Konformitätsbewertung
    verlangten. Zur Umsetzung standen drei Optionen zur Wahl: eine domänenspezifische Einbettung in Fachgesetze,
    ein Rahmengesetz ("framework approach") oder ein eigenes KI-Gesetz mit neuer Behörde ("whole-of-economy").
    Keine der Optionen wurde umgesetzt.

    '
