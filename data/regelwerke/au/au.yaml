- id: au-vaiss-2024
  jurisdiktion: au
  kurztitel: Voluntary AI Safety Standard (VAISS) — zehn Guardrails
  offizieller_titel: Voluntary AI Safety Standard
  fundstelle: National AI Centre (NAIC), Department of Industry, Science and Resources
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 05.09.2024 veröffentlicht, weiterhin in Kraft als freiwilliger Standard ohne Bindungswirkung.
    Im Dezember 2025 aktualisiert; seit 21.10.2025 durch die "Guidance for AI Adoption" (sechs "essential
    practices") des NAIC ergänzt bzw. praktisch abgelöst.

    '
  kurzbeschreibung: 'Der VAISS richtet sich an alle Organisationen, die KI entwickeln oder einsetzen,
    und formuliert zehn Guardrails von Governance und Risikomanagement über Tests, menschliche Aufsicht
    und Transparenz bis zu Dokumentation und Stakeholder-Einbindung. Guardrails 1 bis 9 sind wortgleich
    mit den 2024 vorgeschlagenen verbindlichen Guardrails; nur Guardrail 10 unterscheidet sich (Stakeholder-
    Einbindung statt Konformitätsbewertung). Der Standard ist ausdrücklich freiwillig, es gibt keine Sanktionen,
    keine Aufsichtsbehörde und keinen Registrierungsmechanismus.

    '
  inkrafttreten:
    datum: 2024-09-05
    verifiziert: true
    quelle: https://safeaiaus.org/safety-standards/voluntary-ai-safety-standard-10-guardrails/
  anwendungsdaten:
  - datum: 2024-09-05
    was_gilt: Veröffentlichung des VAISS mit zehn Guardrails (freiwillig).
    verifiziert: true
    quelle: https://safeaiaus.org/safety-standards/voluntary-ai-safety-standard-10-guardrails/
  - datum: 2025-10-21
    was_gilt: 'NAIC veröffentlicht "Guidance for AI Adoption" (AI6) mit sechs "essential practices"; verdichtet
      und aktualisiert den VAISS.

      '
    verifiziert: true
    quelle: https://safeaiaus.org/safety-standards/voluntary-ai-safety-standard-10-guardrails/
  themenachsen:
  - governance
  - gpai
  - marktzugang
  regelungsschwerpunkte:
  - 'Guardrail 1: Rechenschaftsprozesse, Governance, Compliance-Strategie.'
  - 'Guardrail 2: Risikomanagementprozess zur Identifikation und Minderung von Risiken.'
  - 'Guardrail 3: Schutz der KI-Systeme, Data Governance, Datenqualität und -provenienz.'
  - 'Guardrail 4: Test und Evaluation der Modelle, Monitoring nach dem Einsatz.'
  - 'Guardrail 5: Menschliche Kontrolle und Eingriffsmöglichkeit (meaningful oversight).'
  - 'Guardrail 6: Information der Endnutzer über KI-gestützte Entscheidungen und KI-Inhalte.'
  - 'Guardrail 7: Verfahren, mit denen Betroffene KI-Einsatz oder -Ergebnisse anfechten können.'
  - 'Guardrail 8: Transparente Informationsweitergabe entlang der KI-Lieferkette.'
  - 'Guardrail 9: Aufzeichnungen, die eine Konformitätsbewertung durch Dritte ermöglichen.'
  - 'Guardrail 10: Stakeholder-Einbindung mit Fokus auf Sicherheit, Diversität, Inklusion, Fairness.'
  - 'Wichtig: kein Anhang mit Hochrisiko-Kategorien, keine Sanktion, keine Behörde.'
