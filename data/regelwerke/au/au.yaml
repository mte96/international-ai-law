- id: au-wa-lpb-ai-2024
  jurisdiktion: au
  subjurisdiktion: au-wa
  kurztitel: Legal Practice Board WA — KI in der Rechtsberatung
  offizieller_titel: 'Statement on the use of artificial intelligence in Australian legal practice (gemeinsame
    Erklärung der Anwaltsaufsichten)

    '
  fundstelle: 'Gemeinsame Erklärung der Law Society of New South Wales, des Legal Practice Board of Western
    Australia und des Victorian Legal Services Board and Commissioner vom 6. Dezember 2024

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'UNMITTELBAR BERUFSRECHTLICH RELEVANT FÜR WA. Am 06.12.2024 veröffentlicht. Formal eine
    Erklärung ohne eigene Sanktion, aber sie legt aus, wie die bestehenden Berufspflichten auf KI anzuwenden
    sind — deren Verletzung ist als unsatisfactory professional conduct oder professional misconduct verfolgbar.
    Ein eigener KI-Kodex des Legal Practice Board WA wurde nicht gefunden.

    '
  kurzbeschreibung: 'Die Erklärung stellt fest, dass ethische Standards und Berufspflichten für KI genauso
    gelten wie für jede andere Tätigkeit. Vier Pflichten stehen im Vordergrund: Verschwiegenheit — sensible
    Mandantendaten dürfen nicht in öffentliche KI-Chatbots eingegeben werden, sonst droht der Verlust
    des Berufsgeheimnisschutzes; unabhängiges Urteil — KI-Ausgaben ersetzen nicht die eigene forensische
    Bewertung; Kompetenz und Redlichkeit — wegen Halluzinationen muss jeder Inhalt vor Verwendung persönlich
    geprüft werden; angemessene Kosten — die Abrechnung muss die tatsächlich erbrachte Leistung abbilden
    und darf nicht durch unnötige Prüfschleifen aufgebläht werden. Empfohlen werden risikobasierte Kanzleirichtlinien,
    die Beschränkung auf risikoärmere Tätigkeiten und Transparenz gegenüber Mandanten und Gerichten.

    '
  inkrafttreten:
    datum: 2024-12-06
    verifiziert: true
    quelle: https://www.lpbwa.org.au/ai-guidance-to-safeguard-consumers-of-legal-services
  anwendungsdaten:
