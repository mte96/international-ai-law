- id: au-acl-2010
  jurisdiktion: au
  kurztitel: Australian Consumer Law und KI
  offizieller_titel: 'Australian Consumer Law (Schedule 2 to the Competition and Consumer Act 2010 (Cth))

    '
  fundstelle: Competition and Consumer Act 2010 (Cth), Schedule 2
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'GELTENDES RECHT, REVIEW ANGEKÜNDIGT. Die ACL gilt technologieneutral für KI-gestützte
    Produkte und Dienste. Als Priorität 4 der Ministererklärung vom 20.07.2026 ist eine Überprüfung angekündigt,
    insbesondere zu Surveillance Pricing und agentischem Handel. Ein Gesetzentwurf liegt nicht vor.

    '
  kurzbeschreibung: 'Die ACL verbietet irreführendes und täuschendes Verhalten (s 18), unlautere Geschäftspraktiken
    und missbräuchliche Vertragsklauseln und begründet Verbrauchergarantien für Waren und Dienstleistungen,
    einschließlich der Garantie angemessener Sorgfalt und Fachkunde. Auf KI angewandt heißt das: unzutreffende
    Aussagen über Fähigkeiten eines KI-Produkts ("AI washing"), fehlerhafte KI-Ausgaben in kommerziellen
    Diensten und intransparente algorithmische Preisgestaltung können ACL-Verstöße sein. Durchsetzung
    durch die ACCC mit erheblichen Geldbußen. Die ACL ist damit neben dem Privacy Act das wichtigste allgemeine
    Auffangregime für KI-Schäden im Verhältnis zu Verbrauchern.

    '
  inkrafttreten:
    datum: 2011-01-01
    verifiziert: true
    quelle: https://en.wikipedia.org/wiki/Australian_Consumer_Law
    fundstelle_norm: Australian Consumer Law = Schedule 2 des Competition and Consumer Act 2010 (Cth);
      in Kraft getreten am 01.01.2011 ('The law commenced on 1 January 2011, replacing 20 different consumer
      laws across the Commonwealth and the states and territories'). Der Competition and Consumer Act
      2010 ist die zum selben Termin umbenannte Fassung des Trade Practices Act 1974
  anwendungsdaten:
  - datum: 2026-07-20
    was_gilt: 'Ankündigung eines ACL-Review zu Surveillance Pricing und agentic commerce (Priorität 4).

      '
