    quelle: https://jws.com.au/what-we-think/practical-implications-of-new-transparency-requirements-for-automated-decision-making/
  - datum: 2025-06-10
    was_gilt: 'Statutory tort of serious invasion of privacy (Schedule 2) anwendbar: Klage wegen Eindringens
      in die Abgeschiedenheit oder Missbrauchs personenbezogener Informationen.

      '
    verifiziert: true
    quelle: https://www.oaic.gov.au/privacy/your-privacy-rights/more-privacy-rights/statutory-tort-for-serious-invasions-of-privacy
  - datum: 2026-12-10
    was_gilt: 'TRANSPARENZPFLICHT FÜR AUTOMATISIERTE ENTSCHEIDUNGEN (APP 1.7): Datenschutzerklärungen
      müssen Arten personenbezogener Daten in ADM-Systemen und Arten der betroffenen Entscheidungen offenlegen.

      '
    verifiziert: true
    quelle: https://jws.com.au/what-we-think/practical-implications-of-new-transparency-requirements-for-automated-decision-making/
  themenachsen:
  - datenschutz
  - grundrechte
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'APP 1.7 (ab 10.12.2026): Offenlegungspflicht in der Datenschutzerklärung für automatisierte Entscheidungen.'
  - Erfasst sind sowohl vollautomatisierte als auch 'substantially facilitated' menschliche Entscheidungen.
  - 'Schwelle: Entscheidung kann Rechte oder Interessen der Person erheblich berühren (''significantly
    affect'').'
  - 'WICHTIG: Es ist eine reine TRANSPARENZ-, keine Verbots- oder Erklärungspflicht — kein Recht auf Erläuterung
    im Einzelfall, kein Widerspruchsrecht wie Art. 22 DSGVO.'
  - 24 Monate Übergangsfrist ab Zustimmung (10.12.2024 bis 10.12.2026).
  - 'Statutory tort (seit 10.06.2025): Eindringen in Abgeschiedenheit oder Missbrauch personenbezogener
    Informationen; berechtigte Privatheitserwartung erforderlich; Abwägung mit gegenläufigem öffentlichem
    Interesse.'
  - 'Tort-Verjährung: früheres von einem Jahr ab Kenntnis oder drei Jahren ab Verletzung; Minderjährige
    bis zum 21. Geburtstag.'
  - 'Tort-Ausnahmen: Nachrichtendienste, Strafverfolgung, bestimmte Journalisten.'
  - 'Tort-Rechtsfolgen: Schadensersatz, Unterlassung, Entschuldigung; OAIC hat KEINE Rolle.'
  - Doxxing-Straftatbestand ebenfalls durch die Novelle eingeführt.
