  regelungsschwerpunkte:
  - 'Zitat: ''ethical standards and professional obligations of lawyers ... apply equally to the use of
    AI as to any aspect of a practitioner''s work.'''
  - 'Verschwiegenheit: keine sensiblen Mandantendaten in öffentliche KI-Chatbots — Risiko für das Berufsgeheimnis.'
  - 'Unabhängiges Urteil: KI ersetzt nicht die eigene forensische Bewertung.'
  - 'Kompetenz und Redlichkeit: persönliche Prüfung wegen Halluzinationen zwingend.'
  - 'Angemessene Kosten: keine Aufblähung der Rechnung durch KI-bedingte Prüfschleifen.'
  - 'Empfehlung: risikobasierte Kanzleirichtlinien, Beschränkung auf risikoärmere Tätigkeiten (z. B. E-Mail-Entwürfe
    statt Übersetzung von Rechtsrat).'
  - Transparenz gegenüber Mandanten und Gerichten, soweit erforderlich.
  - 'Zitat VLSB+C: ''it''s their duty to provide accurate legal information, not the duty of the AI program
    they use.'''
