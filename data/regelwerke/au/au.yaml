- id: au-antidiskriminierung-adm
  jurisdiktion: au
  kurztitel: Antidiskriminierungsrecht und automatisierte Entscheidungen
  offizieller_titel: 'Racial Discrimination Act 1975, Sex Discrimination Act 1984, Disability Discrimination
    Act 1992, Age Discrimination Act 2004 (Cth); Arbeiten der Australian Human Rights Commission

    '
  fundstelle: Diverse Bundesgesetze; AHRC-Publikationen
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'GELTENDES RECHT OHNE KI-SPEZIFISCHE ANPASSUNG. Die Antidiskriminierungsgesetze des Bundes
    gelten technologieneutral und erfassen algorithmische Diskriminierung als mittelbare Diskriminierung.
    Eine KI-spezifische Novelle gibt es nicht. Die AHRC fordert seit Jahren bessere KI-Regulierung; ihre
    Vorschläge wurden nicht umgesetzt.

    '
  kurzbeschreibung: 'Diskriminierung wegen Rasse, Geschlecht, Behinderung oder Alter ist verboten; erfasst
    wird auch mittelbare Diskriminierung durch scheinbar neutrale Kriterien, worunter algorithmische Entscheidungen
    fallen. Praktisch ist die Durchsetzung schwierig: Betroffene erfahren regelmäßig nicht, dass und wie
    ein Algorithmus entschieden hat — weshalb die Transparenzpflicht des Privacy Act ab 10.12.2026 mittelbar
    auch dem Diskriminierungsschutz dient. Die AHRC hat unter anderem eine Leitlinie zu KI und Diskriminierung
    in der Versicherungspreisbildung und -risikoprüfung (gemeinsam mit dem Actuaries Institute, 01.12.2022)
    vorgelegt und zu den KI-Untersuchungen des Parlaments Stellung genommen.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://humanrights.gov.au/our-work/technology-and-human-rights
  anwendungsdaten:
  - datum: 2022-12-01
    was_gilt: 'AHRC und Actuaries Institute veröffentlichen die Leitlinie zu KI und Diskriminierung in
      der Versicherung.

      '
    verifiziert: true
    quelle: https://humanrights.gov.au/about/news/media-releases/artificial-intelligence-and-anti-discrimination-major-new-publication
  themenachsen:
