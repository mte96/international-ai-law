  regelungsschwerpunkte:
  - Kein Fair Use, nur enumerierte fair-dealing-Ausnahmen — TDM fällt unter keine.
  - KI-Training an geschütztem Material ohne Lizenz ist grundsätzlich Verletzung.
  - 'Productivity Commission Interim Report (August 2025): Vorschlag eines fair dealing für TDM — NICHT
    umgesetzt.'
  - 'Regierungsentscheidung 26.10.2025: keine TDM-Ausnahme; Fokus auf Lizenzierung.'
  - Gegenposition der Kreativwirtschaft war politisch ausschlaggebend ('creators first').
  - 'Ergänzend Zusage vom 15.07.2026: kein Training an australischen Kreativwerken ohne Zustimmung.'
  - Schutzfähigkeit KI-generierter Erzeugnisse (Erfordernis menschlicher Urheberschaft) ist ungeklärt
    und Gegenstand der CAIRG-Arbeit.
