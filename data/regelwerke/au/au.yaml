- id: au-wa-prisa-2024
  jurisdiktion: au
  subjurisdiktion: au-wa
  kurztitel: PRIS Act — WA-Datenschutzgesetz mit ADM-Grundsatz
  offizieller_titel: Privacy and Responsible Information Sharing Act 2024 (WA)
  fundstelle: Privacy and Responsible Information Sharing Act 2024 (WA)
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'WICHTIGSTES WA-SPEZIFISCHES REGELWERK MIT KI-BEZUG. Der Großteil der materiellen Pflichten
    gilt seit 01.07.2026. Das Notifiable Information Breach Scheme folgt am 01.01.2027. Für den Bearbeiter
    besonders relevant: IPP 10 enthält eine eigenständige Regelung automatisierter Entscheidungen, die
    über das Bundesrecht hinausgeht.

    '
  kurzbeschreibung: 'Das Gesetz führt erstmals ein allgemeines Datenschutzregime für den öffentlichen
    Sektor Westaustraliens ein und bindet Minister, Ressorts, öffentliche Stellen, die WA Police Force,
    Kommunen, Justizkörperschaften, benannte Einrichtungen sowie vertraglich gebundene Dienstleister —
    womit auch private Unternehmen erfasst sein können, die für WA-Behörden tätig werden. Es enthält elf
    Information Privacy Principles mit einem übergreifenden Gebot der Fairness und Angemessenheit. IPP
    10 regelt automatisierte Entscheidungen und verlangt Folgenabschätzungen, Unterrichtung der Betroffenen
    und die Möglichkeit menschlichen Eingreifens bei erheblichen automatisierten Entscheidungen. IPP 11
    schützt de-identifizierte Daten und untersagt Re-Identifizierung. Behörden mussten bis 01.07.2026
    Privacy Officer und Information Sharing Officer benennen, Richtlinien veröffentlichen, PIAs für risikoreiche
    Vorhaben durchführen und ein Breach-Register führen.

    '
  inkrafttreten:
    datum: 2026-07-01
    verifiziert: true
    quelle: https://hwlebsworth.com.au/expris-delivery-timetable-set-for-the-commencement-of-was-new-privacy-laws/
  anwendungsdaten:
  - datum: 2026-07-01
    was_gilt: 'Großteil der materiellen Pflichten anwendbar: elf IPPs einschließlich IPP 10 (automatisierte
      Entscheidungen) und IPP 11 (de-identifizierte Daten); Benennung von Privacy Officer und Information
      Sharing Officer; veröffentlichte Richtlinien; PIAs; Breach-Register.

      '
    verifiziert: true
    quelle: https://hwlebsworth.com.au/expris-delivery-timetable-set-for-the-commencement-of-was-new-privacy-laws/
  - datum: 2027-01-01
    was_gilt: Notifiable Information Breach Scheme anwendbar.
    verifiziert: true
    quelle: https://hwlebsworth.com.au/expris-delivery-timetable-set-for-the-commencement-of-was-new-privacy-laws/
  themenachsen:
  - datenschutz
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'IPP 10 — AUTOMATISIERTE ENTSCHEIDUNGEN: Folgenabschätzung, Unterrichtung der Betroffenen, Möglichkeit
    menschlichen Eingreifens bei erheblichen Entscheidungen.'
  - Damit geht WA über die bloße Transparenzpflicht des Bundes (APP 1.7) hinaus — Quelle spricht von 'unique
    protections around automated decision-making'.
  - 'IPP 11: Schutz de-identifizierter Daten, Verbot der Re-Identifizierung — für KI-Trainingsdaten unmittelbar
    bedeutsam.'
  - Übergreifendes Gebot 'fair and reasonable' für Erhebung, Nutzung und Offenlegung.
  - 'Adressaten: IPP Entities einschließlich Kommunen, Polizei und vertraglich gebundener Dienstleister.'
  - 'Zweite Säule: Information Sharing Scheme für verantwortlichen Datenaustausch zwischen WA-Behörden.'
  - 'Pflichten seit 01.07.2026: Privacy Officer, Information Sharing Officer, veröffentlichte Richtlinien,
    PIAs, Breach-Register.'
