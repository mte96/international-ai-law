  verfahrensnummer: null
  status: softlaw
  status_detail: 'Im Oktober 2024 veröffentlicht. Der Bericht selbst ist unverbindlich, konkretisiert
    aber Erwartungen an die gesetzlichen Pflichten von Inhabern einer Australian Financial Services Licence.
    ASIC hat 2026 zum "Year of Accountability" erklärt.

    '
  kurzbeschreibung: 'REP 798 untersuchte die KI-Governance von Finanzdienstleistern und stellte eine Lücke
    zwischen KI-Einsatz und Governance fest: Der Einsatz wachse schneller als die Steuerung. ASIC leitet
    daraus Erwartungen aus den bestehenden Lizenzpflichten ab, insbesondere der Pflicht, Finanzdienstleistungen
    effizient, redlich und fair zu erbringen. Der Bericht schafft kein neues Recht; Verstöße werden über
    die allgemeinen Lizenz- und Verhaltenspflichten sanktioniert.

    '
  inkrafttreten:
