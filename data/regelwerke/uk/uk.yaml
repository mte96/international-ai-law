- id: uk-osa-2023
  jurisdiktion: uk
  kurztitel: Online Safety Act 2023
  offizieller_titel: Online Safety Act 2023
  fundstelle: 2023 c. 50
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'Royal Assent 26.10.2023; gestaffelte Inkraftsetzung durch Ofcom-Codes seit März 2025
    (illegale Inhalte) und Juli 2025 (Kinderschutz, Altersverifikation). Ofcom hat mit offenem Brief vom
    08.11.2024 klargestellt, dass generative KI und Chatbots erfasst sind. Der Crime and Policing Act
    2026 hat den Anwendungsbereich am 29.04.2026 um eine Verordnungsermächtigung für bislang unregulierte
    KI-Chatbots erweitert.

    '
  kurzbeschreibung: 'Der OSA ist das britische Regime mit der größten praktischen Durchgriffswirkung auf
    KI-Anwendungen. Er verpflichtet Nutzer-zu-Nutzer-Dienste und Suchdienste zu Risikobewertungen für
    illegale Inhalte und für Kinder, zu verhältnismäßigen Schutzmaßnahmen, zu Melde- und Abhilfeverfahren
    und zu Altersverifikation bei pornografischen Inhalten. Ofcom hat festgestellt, dass KI-generierte
    Inhalte genauso behandelt werden wie von Menschen erstellte, dass Plattformen mit nutzergeteilten
    Chatbot-Ausgaben, Dienste zum Erstellen und Teilen eigener Chatbots sowie generative Suchwerkzeuge
    in den Anwendungsbereich fallen und dass eine bloße Kennzeichnung als KI-generiert nicht entlastet.
    Bußgelder nach Schedule 13 Ziff. 4 Abs. 1 bis 18 Mio. GBP oder 10 % des qualifizierten weltweiten
    Umsatzes, je nachdem, welcher Betrag höher ist.

    '
  inkrafttreten:
    datum: 2023-10-26
    verifiziert: true
    quelle: https://www.legislation.gov.uk/ukpga/2023/50/section/240
    fundstelle_norm: 'Sec. 240(4) Online Safety Act 2023: die dort aufgezaehlten Vorschriften (u.a. Parts
      1 und 2, Part 3 Kap. 1, Schedules 4-7, 11) treten "on the day on which this Act is passed" in Kraft;
      Royal Assent laut Kopfzeile "2023 CHAPTER 50 ... [26th October 2023]". Uebrige Vorschriften nach
      sec. 240(1) durch Regulations, einzelne nach zwei Monaten.'
  anwendungsdaten:
  - datum: 2024-11-08
    was_gilt: 'Ofcom stellt im offenen Brief klar, wie der OSA auf generative KI und Chatbots anzuwenden
      ist.

      '
    verifiziert: true
    quelle: https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/open-letter-to-uk-online-service-providers-regarding-generative-ai-and-chatbots
  - datum: 2025-03-17
    was_gilt: 'Frist für Risikobewertungen zu illegalen Inhalten; danach Wirksamkeit der Pflichten zu
      illegalen Inhalten.

      '
    verifiziert: false
    quelle: https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/open-letter-to-uk-online-service-providers-regarding-generative-ai-and-chatbots
  - datum: 2026-04-29
    was_gilt: 'Crime and Policing Act 2026 ändert s. 216 OSA: Verordnungsbefugnis des Technologieministers,
      "illegal AI-generated content" und "AI services" (einschließlich eigenständiger KI-Chatbots) den
      OSA-Pflichten zu unterwerfen; außerdem 48-Stunden-Löschpflicht für intime Bilder.

      '
    verifiziert: true
    quelle: https://www.osborneclarke.com/insights/regulatory-outlook-may-2026-digital-regulation
  themenachsen:
  - content
  - grundrechte
  - sektor-oeffentlich
  - haftung
  regelungsschwerpunkte:
  - 'Ofcom, offener Brief vom 08.11.2024: ''any AI-generated text, audio, images or videos that are shared
    by users on a user-to-user service is user-generated content''. Damit ist der OSA — nicht ein KI-Gesetz
    — die britische Antwort auf synthetische Inhalte.'
  - 'Erfasst sind: Plattformen mit Chatbot-Funktion und Teilen der Ausgaben; Dienste, auf denen Nutzer
    eigene Chatbots erstellen und in eine Bibliothek einstellen; generative Suchdienste, die live Ergebnisse
    aus dem Netz liefern; Dienste, die pornografische Inhalte erzeugen können (dann Altersverifikationspflicht).'
  - 'Regelungslücke bis 2026: Ein eigenständiger 1:1-Chatbot ohne Teilen-Funktion war nicht erfasst. Diese
    Lücke schließt der Crime and Policing Act 2026 — allerdings nur durch eine ERMÄCHTIGUNG, nicht durch
    unmittelbare Pflichten; die Verordnung muss noch erlassen werden.'
  - 'Altersverifikation: Seit Juli 2025 gelten ''highly effective age assurance''-Pflichten. Sie gelten
    auch für KI-Dienste, die pornografische Inhalte generieren können.'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Der OSA setzt beim Verbreiten an, die KI-VO beim Erzeugen. Art.
    50 Abs. 2 KI-VO verpflichtet den ANBIETER des generativen Systems zur maschinenlesbaren Markierung;
    der OSA verpflichtet den PLATTFORMBETREIBER zur Risikominderung. Ein UK-Anbieter eines Bildgenerators
    ohne eigene Plattform trifft nach OSA keine Kennzeichnungspflicht.'
  - 'RECHTSPRECHUNGSHINWEIS: Bislang keine höchstrichterliche UK-Entscheidung zur Anwendung des OSA auf
    generative KI; Ofcom führt seit 2026 Untersuchungen gegen KI-Plattformen.'
