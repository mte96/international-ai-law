  regelungsschwerpunkte:
  - 'Der Plan enthält keine einzige regulatorische Pflicht. Sein regulatorischer Gehalt besteht ausschließlich
    aus Abbau: Sandboxes, Growth Duty, Regulatory Innovation Office.'
  - 'KI-Assurance als Marktlösung: Der AI Assurance Innovation Fund (11 Mio. GBP) fördert einen privaten
    Prüf- und Zertifizierungsmarkt anstelle gesetzlicher Konformitätsbewertung. Das ist die bewusste britische
    Alternative zu Art. 43 KI-VO und zum System notifizierter Stellen.'
  - 'Planungs-KI-Werkzeuge: regionale Erprobung ab Mai 2026, landesweite Einführung 2027 — staatlicher
    KI-Einsatz ohne die gescheiterte gesetzliche Folgenabschätzungspflicht (vgl. uk-public-authority-adm-bill).'
  - Die Commons Library merkt an, dass die für 2025 zugesagte öffentliche Konsultation zur KI-Regulierung
    'um mindestens ein Jahr' verschoben und bis Juni 2026 nicht eröffnet wurde.
