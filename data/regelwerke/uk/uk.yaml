- id: uk-regulating-for-growth-bill
  jurisdiktion: uk
  kurztitel: Regulating for Growth Bill
  offizieller_titel: Regulating for Growth Bill (angekündigt in der Königsrede 2026)
  fundstelle: The King's Speech 2026, background briefing notes, S. zum Vorhaben Nr. 7
  verfahrensnummer: null
  status: idee
  status_detail: 'Am 13.05.2026 in der Königsrede angekündigt, aber am 27.08.2026 noch NICHT in das Parlament
    eingebracht; es existiert kein Gesetzestext. Eine Suche in bills.parliament.uk lieferte keinen Treffer.
    Der Regierungsvortrag lautet, die Einbringung erfolge "over the coming months". Dies ist das einzige
    KI-relevante Gesetzesvorhaben der Regierung — und es ist ein Deregulierungsinstrument.

    '
  kurzbeschreibung: 'Das Vorhaben soll erstens sektorübergreifende Sandbox-Befugnisse schaffen ("cross-cutting
    AI sandboxes, enabling responsible testing and adoption of AI-enabled products and services across
    multiple sectors where existing regulatory frameworks currently slow innovation"), zweitens die "Growth
    Duty" der Regulierer verschärfen und drittens Ministern erlauben, den Regulierern förmliche "strategic
    steers" zu erteilen sowie deren Leistung gegen die Growth Duty zu berichten. Kernstück ist die Befugnis,
    geltendes Recht für zeitlich befristete Erprobungen zu modifizieren oder auszusetzen und erfolgreiche
    Erprobungen per Rechtsverordnung dauerhaft zu machen. Als "rote Linien" nennt das Hintergrundpapier
    Verbraucher-, Beschäftigten- und Grundrechtsschutz. Es enthält keine einzige neue KI-Pflicht.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://commonslibrary.parliament.uk/research-briefings/cbp-10893/
  anwendungsdaten:
  - datum: 2026-05-13
    was_gilt: 'Ankündigung in der Königsrede zur zweiten Session des 2024er Parlaments; Veröffentlichung
      der Hintergrundpapiere.

      '
    verifiziert: true
    quelle: https://assets.publishing.service.gov.uk/media/6a046665c0cc74b4523e4d3b/The_King_s_Speech_2026_-_background_briefing_notes.pdf
  themenachsen:
  - governance
  - marktzugang
  - wettbewerb
  - sektor-medizin
  regelungsschwerpunkte:
  - 'Sandbox-Befugnis mit Modifikations- und Suspendierungswirkung: qualitativ etwas anderes als Art.
    57-58 KI-VO, die Reallabore ausdrücklich innerhalb des geltenden Rechts anordnen. Hier soll geltendes
    Recht selbst disponibel werden.'
  - 'Verstetigungsmechanismus: erfolgreiche Erprobungen sollen per Sekundärrecht dauerhaft werden — Verlagerung
    materieller Regulierungsentscheidungen aus dem Parlament in die Exekutive. Lord Holmes hat genau dies
    als ''executive power grab'' kritisiert.'
  - 'Verschärfte Growth Duty und ministerielle ''strategic steers'': Die Regulierer (genannt u. a. Natural
    England, Health and Safety Executive) sollen Wachstum stärker gewichten. Das ist die institutionelle
    Gegenbewegung zum Prinzipienrahmen von 2023 — nicht mehr ''Regulierer wenden KI-Prinzipien an'', sondern
    ''Regulierer werden auf Wachstum verpflichtet''.'
  - 'Begründungsbeispiel des Hintergrundpapiers ist medizinisch: Bildgebungsnachfrage +7 % p.a. bei nur
    +3,9 % Radiologie-Personal; KI übertreffe bei bestimmten Vorhersageaufgaben 78-90 % der Radiologen.'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Während die KI-VO ab 02.12.2027 (Anhang III) Hochrisikopflichten
    begründet, will das UK im selben Zeitraum Befugnisse schaffen, bestehende Pflichten für KI-Erprobungen
    auszusetzen.'
