- id: uk-public-authority-adm-bill
  jurisdiktion: uk
  kurztitel: Bill zu algorithmischen Entscheidungen der Verwaltung (Lord Clement-Jones)
  offizieller_titel: 'Public Authority Algorithmic and Automated Decision-Making Systems Bill [HL]

    '
  fundstelle: HL Bill 27 of 2024-25; Bill-ID 3760
  verfahrensnummer: bills.parliament.uk/bills/3760
  status: gescheitert
  status_detail: 'Private Member''s Bill von Lord Clement-Jones (LibDem), eingebracht am 09.09.2024, 2.
    Lesung 13.12.2024. Der Entwurf hat als einziger KI-Entwurf das Oberhaus vollständig durchlaufen und
    erreichte am 05.05.2026 die 1st reading im Unterhaus — eine Woche vor dem Sessionsende. Damit verfallen.
    Bills-API am 27.08.2026: currentStage "1st reading" (Commons), sessionId 39, isAct false.

    '
  kurzbeschreibung: 'Der Entwurf hätte für Behörden verbindliche Pflichten beim Einsatz algorithmischer
    und automatisierter Entscheidungssysteme geschaffen: verpflichtende Folgenabschätzung vor dem Einsatz,
    Transparenzstandards und Veröffentlichung in einem Register sowie Rechenschaftsmechanismen. Er ist
    das britische Funktionsäquivalent zu Art. 27 KI-VO (Grundrechtsfolgenabschätzung öffentlicher Stellen)
    und zur verpflichtenden Registrierung nach Art. 49 Abs. 3 KI-VO. Sein Scheitern bedeutet, dass für
    den staatlichen KI-Einsatz im UK weiterhin nur der freiwillige Algorithmic Transparency Recording
    Standard (ATRS) gilt, ergänzt durch die allgemeinen Vorgaben des Datenschutzrechts, des Equality Act
    2010 und des Verwaltungsrechts.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://bills-api.parliament.uk/api/v1/Bills/3760
