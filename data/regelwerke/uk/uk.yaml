  kurztitel: Sektorale Regulierer und DRCF
  offizieller_titel: 'KI-Leitlinien und Aufsichtspraxis von ICO, CMA, FCA, Ofcom und weiteren Regulierern;
    Digital Regulation Cooperation Forum (DRCF)

    '
  fundstelle: null
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Der eigentliche Vollzug der britischen KI-Politik. Kein Regulierer hat KI-spezifische
    gesetzliche Befugnisse; alle wenden ihre vorhandenen Regime auf KI an. Koordiniert wird über das DRCF
    (CMA, FCA, ICO, Ofcom) sowie über die Berichtspflichten aus dem Ministerbrief vom 28.01.2026 an 19
    Regulierer. Ein Koordinierungsrahmen namens "AIRIA" ließ sich nicht verifizieren und existiert nach
    dieser Recherche nicht.

    '
  kurzbeschreibung: 'Die ICO führt seit 2025 eine KI- und Biometrie-Strategie, prüft Gesichtserkennung
    bei der Polizei, bereitet Leitlinien zu automatisierten Entscheidungen und Profiling vor (Konsultation
    31.03.-29.05.2026) und soll auf gesetzlicher Grundlage eine Verhaltensregel zu KI und automatisierten
    Entscheidungen erlassen, sobald die entsprechende Rechtsverordnung ergangen ist. Die FCA betreibt
    das AI Lab mit "AI Live Testing" und dem "Supercharged Sandbox"; Bank of England, FCA und HM Treasury
    haben im Mai 2026 eine gemeinsame Erklärung zu Frontier-KI-Cyberrisiken abgegeben, ohne neue Pflichten
    zu schaffen. Die CMA prüft Basismodelle seit 2023 unter Wettbewerbsgesichtspunkten. Ofcom vollzieht
    den Online Safety Act auch gegenüber generativer KI. Das DRCF hat 2025/26 einen Thematic Innovation
    Hub mit Schwerpunkt agentische KI gestartet und im März 2026 das Foresight-Papier "The Future of Agentic
    AI" veröffentlicht.

    '
