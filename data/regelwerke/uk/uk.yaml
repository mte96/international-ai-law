    was_gilt: 'Fortschrittsbericht "One Year On": 38 von 50 Maßnahmen erledigt; AISI mit 240 Mio. GBP
      und über 30 getesteten Frontier-Modellen; AI Growth Lab als Call for Evidence gestartet.

      '
    verifiziert: true
