  - sektor-medizin
  - marktzugang
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'PCCP (predetermined change control plans): Die zentrale regulatorische Frage lernender Systeme —
    wie darf sich ein zugelassenes Modell nach der Zulassung ändern, ohne neu bewertet zu werden. Die
    KI-VO regelt dies in Art. 43 Abs. 4 durch vorab festgelegte Änderungen; die MHRA erarbeitet dazu erst
    Leitlinien.'
  - 'Zweckbestimmung und Softwarequalifikation: Empfehlung, die Leitlinien um KI-spezifische Erwägungen
    zu ergänzen.'
  - 'Leistungsbewertung KI-gestützter In-vitro-Diagnostika: eigene Bewertungsleitlinie empfohlen.'
  - 'Ökosystem-Governance: Empfehlung, über das einzelne Produkt hinaus den Einsatzkontext (NHS-Beschaffung,
    klinische Einbettung) zu regulieren — inhaltlich nahe an Art. 26 KI-VO (Betreiberpflichten), im UK
    bisher ohne Rechtsgrundlage.'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Ein KI-Medizinprodukt der Klasse IIa unterliegt in der EU ab 02.08.2028
    kumulativ dem MDR und dem Hochrisikoregime nach Anhang I KI-VO. Im UK gilt allein das Medizinprodukterecht
    — ohne Grundrechtsfolgenabschätzung, ohne KI-spezifische Protokollierungs- und Transparenzpflichten,
    ohne Registrierung in einer KI-Datenbank.'
