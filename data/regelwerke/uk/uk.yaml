- id: uk-duaa-2025
  jurisdiktion: uk
  kurztitel: Data (Use and Access) Act 2025 (DUAA)
  offizieller_titel: Data (Use and Access) Act 2025
  fundstelle: 2025 c. 18
  verfahrensnummer: Data (Use and Access) Bill [HL], Session 2024-26
  status: teilanwendbar
  status_detail: 'Royal Assent am 19.06.2025. Die datenschutzrechtlichen Kernvorschriften einschließlich
    s. 80 (automatisierte Entscheidungen) und Schedule 6 sind seit dem 05.02.2026 in Kraft (SI 2026/82,
    Commencement No. 6). Weitere Teile folgen gestaffelt (Beschwerdeverfahren 19.06.2026, Information
    Commission zu späterem Zeitpunkt). Die für KI wichtigste Sekundärgesetzgebung — die Verordnung, die
    die ICO zur Erstellung einer Verhaltensregel zu KI und automatisierten Entscheidungen verpflichtet
    — ist noch in Vorbereitung.

    '
  kurzbeschreibung: 'Der DUAA ist das materiell wichtigste britische Gesetz mit KI-Bezug. Er ersetzt den
    strengen Art. 22 UK GDPR durch die neuen Art. 22A-22D und stellt damit für automatisierte Entscheidungen
    vom Verbot mit Erlaubnisvorbehalt auf ein Erlaubnismodell mit Schutzmaßnahmen um. Daneben führt er
    "recognised legitimate interests" (Schedule 4) ein, lockert die Zweckbindung für Forschungszwecke,
    ändert das Cookie-Regime und erweitert die Durchsetzungsbefugnisse der Aufsichtsbehörde. In Part 7
    (ss. 135-137) verpflichtet er die Regierung, über die Nutzung urheberrechtlich geschützter Werke bei
    der KI-Entwicklung zu berichten — das Ergebnis des Gesetzgebungskonflikts um Transparenzpflichten.
    Außerdem schafft er (s. 138) den Straftatbestand der Herstellung eines vorgeblichen intimen Bildes
    ohne Einwilligung; er ist seit dem 06.02.2026 in Kraft und erfasst Deepfakes.

    '
  inkrafttreten:
    datum: 2025-06-19
    verifiziert: true
    quelle: https://www.legislation.gov.uk/ukpga/2025/18/introduction
  anwendungsdaten:
  - datum: 2026-02-05
    was_gilt: 'Kern der Datenschutzreform in Kraft (SI 2026/82): s. 67 (Forschungs- und Statistikzwecke),
      s. 70 (Rechtmäßigkeit), s. 80 mit den neuen Art. 22A-22D UK GDPR (automatisierte Entscheidungen),
      s. 85 (internationale Übermittlungen), s. 86 (Schutzmaßnahmen Forschung), s. 112 (Cookies), s. 115
      (erweiterte ICO-Durchsetzung), Schedule 4 (recognised legitimate interests), Schedule 6 (Folgeänderungen
      ADM).

      '
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/2026/82/regulation/2/made
  - datum: 2026-02-06
    was_gilt: 'Straftatbestand der Herstellung bzw. Veranlassung der Herstellung eines nicht einvernehmlichen
      vorgeblichen intimen Bildes (Deepfake) wirksam; verlängerte Verfolgungsfristen.

      '
    verifiziert: false
    quelle: https://www.lewissilkin.com/insights/2026/02/23/online-safety-reforms-to-be-fast-tracked-amid-rising-ai-risks-102mk2r
  - datum: 2026-06-19
    was_gilt: Neues Beschwerdeverfahren gegenüber Verantwortlichen.
    verifiziert: false
    quelle: https://www.womblebonddickinson.com/uk/insights/articles-and-briefings/duaa-commencement-no-6-regulations-are-now-force-what-organisations
  themenachsen:
  - datenschutz
  - governance
  - grundrechte
  - urheberrecht
  - arbeit
  regelungsschwerpunkte:
  - 's. 80 DUAA / Art. 22A UK GDPR: ''significant decision'' = Entscheidung mit rechtlicher oder ähnlich
    erheblicher Wirkung. ''based solely on automated processing'' liegt vor, wenn ''there is no meaningful
    human involvement in the taking of the decision''; dabei ist zu berücksichtigen, in welchem Ausmaß
    die Entscheidung durch Profiling zustande kommt. Diese Legaldefinition der ''meaningful human involvement''
    ist neu und verschiebt die Beweisführung.'
  - 'Art. 22B UK GDPR: Das Verbot bleibt nur, wenn besondere Kategorien personenbezogener Daten verarbeitet
    werden. Dann ist eine vollautomatisierte erhebliche Entscheidung nur bei ausdrücklicher Einwilligung
    oder bei Vertragserfüllung/gesetzlicher Verpflichtung in Verbindung mit Art. 9 Abs. 2 lit. g zulässig.
    Außerdem unzulässig, wenn die zugrunde liegende Verarbeitung auf Art. 6 Abs. 1 lit. ea (recognised
    legitimate interests) gestützt wird.'
  - 'Art. 22C UK GDPR — die vier Schutzmaßnahmen: Information über die Entscheidung, Möglichkeit zur Stellungnahme,
    menschliches Eingreifen, Anfechtbarkeit. Für alle anderen Fälle ersetzt dieses Bündel das frühere
    Verbot.'
  - 'Art. 22D UK GDPR: Verordnungsermächtigung des Secretary of State zur Konkretisierung von ''meaningful
    human involvement'' und ''similarly significant effect'' sowie zur Anordnung zusätzlicher Schutzmaßnahmen.
    Das ist der Hebel, über den KI-Regulierung im UK ohne KI-Gesetz erfolgen kann.'
  - 'ss. 135-137 (Part 7, ''Copyright works and artificial intelligence systems''): s. 135 Wirtschaftsfolgenabschätzung,
    s. 136 Bericht über die Nutzung urheberrechtlich geschützter Werke bei der KI-Entwicklung, s. 137
    Zwischenbericht. Diese Berichtspflichten sind der Kompromiss, mit dem der monatelange Ping-Pong-Konflikt
    zwischen Lords und Commons um eine Transparenzpflicht für KI-Entwickler beendet wurde (vgl. uk-copyright-ai-prozess).'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Ein Beschäftigten-Scoring, das in der EU nach Anhang III Nr. 4
    KI-VO ab 02.12.2027 hochrisikopflichtig wäre UND nach Art. 22 DSGVO grundsätzlich verboten ist, ist
    im UK zulässig, sofern die vier Schutzmaßnahmen des Art. 22C UK GDPR eingehalten werden und keine
    besonderen Datenkategorien verarbeitet werden. Das ist die praktisch folgenreichste Divergenz.'
