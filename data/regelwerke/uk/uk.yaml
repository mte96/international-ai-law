- id: uk-crime-policing-act-2026
  jurisdiktion: uk
  kurztitel: Crime and Policing Act 2026
  offizieller_titel: Crime and Policing Act 2026
  fundstelle: 2026 c. 20
  verfahrensnummer: Crime and Policing Bill, Bill-ID 3938, Session 2024-26
  status: verabschiedet
  status_detail: 'Royal Assent am 29.04.2026. Die KI-bezogenen Vorschriften treten gestaffelt durch Commencement
    Orders in Kraft; ein Inkrafttretensdatum für die Chatbot-Ermächtigung war am 27.08.2026 nicht feststellbar.
    Die Chapter-Nummer 2026 c. 20 stammt aus Wikipedia und ließ sich wegen einer robots.txt-Sperre nicht
    unmittelbar auf legislation.gov.uk verifizieren.

    '
  kurzbeschreibung: 'Das Gesetz ist — neben dem DUAA — der konkreteste britische KI-Rechtsakt und zeigt
    exemplarisch die britische Methode: KI wird nicht als Technologie reguliert, sondern über Straftatbestände
    und Verordnungsermächtigungen an einzelnen Schadensbildern. Es verbietet KI-Modelle, die auf die Erzeugung
    von Darstellungen sexuellen Kindesmissbrauchs optimiert sind, kriminalisiert das Herstellen, Anpassen,
    Liefern und Anbieten von Werkzeugen zur Erzeugung vorgeblicher intimer Bilder ("Nudification-Tools"),
    erweitert die Straftatbestände zu nicht einvernehmlichen intimen Bildern einschließlich KI-generierter
    Deepfakes und ermächtigt den Technologieminister, bislang unregulierte KI-Chatbots per Verordnung
    den Pflichten des Online Safety Act 2023 zu unterwerfen. Zugleich führt es eine 48-Stunden-Löschpflicht
    für intime Bilder und eine persönliche Verantwortlichkeit leitender Personen bei Nichtbefolgung von
    Ofcom-Anordnungen ein.

    '
  inkrafttreten:
    datum: 2026-04-29
    verifiziert: true
    quelle: https://en.wikipedia.org/wiki/Crime_and_Policing_Act_2026
  anwendungsdaten:
  - datum: 2026-04-29
    was_gilt: Royal Assent; einzelne Vorschriften treten erst durch Commencement Orders in Kraft.
    verifiziert: true
    quelle: https://www.osborneclarke.com/insights/regulatory-outlook-may-2026-digital-regulation
  themenachsen:
  - content
  - grundrechte
  - haftung
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Maßnahme 49 des Regierungs-Factsheets: ''Introducing a power for the Technology Secretary to make
    regulations to bring unregulated AI chatbots into scope of the Online Safety Act 2023'' — Änderung
    von s. 216 OSA. Erfasst ''illegal AI-generated content'' und ''AI services'', definiert als Internetdienst,
    der KI-generierte Inhalte erzeugen kann.'
  - 'Maßnahme 20: Verbot von KI-Modellen, die auf die Erzeugung von CSAM optimiert sind, sowie Ausweitung
    des Tatbestands der ''pädophile manuals''. Dies ist weltweit einer der wenigen Fälle, in denen ein
    MODELL als solches verboten wird — funktional vergleichbar mit Art. 5 KI-VO, aber strafrechtlich statt
    marktaufsichtsrechtlich konstruiert.'
  - 'Maßnahme 31: Kriminalisierung von Nudification-Tools — Herstellen, Anpassen, Liefern, Anbieten. Erfasst
    die Werkzeugebene, nicht nur die Erzeugnisebene.'
  - 'Maßnahmen 28-34: nicht einvernehmliche intime Bilder einschließlich KI-generierter Deepfakes als
    priority offences im Sinne des OSA; 48-Stunden-Löschpflicht; strafrechtliche Verantwortlichkeit leitender
    Personen bei Nichtbefolgung von Ofcom-Löschanordnungen.'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Die KI-VO adressiert KI-generierte nicht einvernehmliche intime
    Darstellungen erst mit den ab 02.12.2026 geltenden neuen Verbotstatbeständen des Art. 5 (Digital-Omnibus-Fassung)
    und sanktioniert verwaltungsrechtlich. Das UK sanktioniert früher, strafrechtlich und gegen natürliche
    Personen — dafür ohne jede Pflicht zu Risikomanagement oder Vorab-Bewertung.'
