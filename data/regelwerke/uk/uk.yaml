- id: uk-ai-regulation-bill-holmes
  jurisdiktion: uk
  kurztitel: AI (Regulation) Bill (Lord Holmes)
  offizieller_titel: 'Artificial Intelligence (Regulation) Bill [HL] — A bill to make provision for the
    regulation of artificial intelligence; and for connected purposes

    '
  fundstelle: HL Bill (Session 2024-26); Bill-ID 3942
  verfahrensnummer: 'bills.parliament.uk/bills/3942 (Vorgänger: Session 2023-24, Bill-ID 3519)'
  status: gescheitert
  status_detail: 'Private Member''s Bill von Lord Holmes of Richmond (Cons.). Am 04.03.2025 zum zweiten
    Mal eingebracht (1st reading), danach nie zur 2nd reading aufgerufen. Mit dem Ende der Session 2024-26
    vor der Königsrede am 13.05.2026 verfallen. Bills-API am 27.08.2026: currentStage "1st reading", sessionId
    39, isAct false, keine Wiedereinbringung in der Session 2026-27. Der Vorgängerentwurf (2. Lesung 22./23.03.2024)
    war bereits mit der Parlamentsauflösung 2024 verfallen.

    '
  kurzbeschreibung: 'Der Entwurf ist das einzige ausformulierte britische Modell eines horizontalen KI-Gesetzes.
    Er hätte eine "AI Authority" als Qürschnittsstelle geschaffen, die die Kompetenz der bestehenden Regulierer
    bewertet und Lücken identifiziert (Klausel 1), die fünf Weißbuch-Prinzipien gesetzlich verankert (Klausel
    2), Reallabore vorgeschrieben (Klausel 3), für Unternehmen einen "AI responsible officer" verpflichtend
    gemacht (Klausel 4) und — urheberrechtlich zentral — eine Kennzeichnungspflicht für KI-Erzeugnisse
    sowie eine Berichtspflicht über die Nutzung fremden geistigen Eigentums und fremder Daten im Training
    eingeführt (Klausel 5). Sanktionen wären per Rechtsverordnung zu schaffen gewesen (Klausel 8). Der
    Entwurf hat nie Regierungsunterstützung gefunden und ist zweimal gescheitert; er bleibt der Referenzpunkt
    der Debatte.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://bills-api.parliament.uk/api/v1/Bills/3942
  anwendungsdaten: []
  themenachsen:
  - governance
  - marktzugang
  - urheberrecht
  - grundrechte
  regelungsschwerpunkte:
  - 'Klausel 1: AI Authority — keine Vollzugs-, sondern eine Kohärenzbehörde. Sie hätte Regulierer bewertet,
    nicht Unternehmen beaufsichtigt. Bewusst schwächer als das EU-KI-Büro.'
  - 'Klausel 4: ''AI responsible officer'' als benannte Person in jedem Unternehmen, das KI entwickelt
    oder einsetzt — funktional dem Datenschutzbeauftragten nachgebildet, ohne Entsprechung in der KI-VO.'
  - 'Klausel 5: Kennzeichnung von KI-Erzeugnissen plus Offenlegung genutzter Drittdaten und Drittrechte
    im Training. Dies ist der Punkt, an dem der Entwurf am weitesten über das geltende UK-Recht hinausgeht
    und Art. 50 sowie Art. 53 Abs. 1 lit. c/d KI-VO nahekommt.'
  - 'Klausel 7: weite KI-Definition über Wahrnehmung, automatisierte Verarbeitung mit Annäherung an kognitive
    Fähigkeiten und Empfehlungen/Vorhersagen/Entscheidungen.'
  - 'Politischer Befund: Dass ein Private Member''s Bill zweimal ohne 2. Lesung verfällt, während die
    Regierung ein eigenes Gesetz ablehnt, ist die präziseste Beschreibung des britischen Status quo.'
