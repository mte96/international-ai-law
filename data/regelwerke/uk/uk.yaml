- id: uk-ai-growth-lab
  jurisdiktion: uk
  kurztitel: AI Growth Lab (Reallabor)
  offizieller_titel: 'AI Growth Lab — Call for Evidence (Okt. 2025); Advisory AI Growth Lab: legal services
    (Aug. 2026)

    '
  fundstelle: null
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Zweistufig. Stufe 1 ist bereits operativ, aber rein beratend: das "Advisory AI Growth
    Lab" für Rechtsdienstleistungen, Bewerbung ab 06.08.2026. Es erklärt lediglich, wie geltendes Recht
    auf KI-Werkzeuge anzuwenden ist, und erteilt keine Ausnahmen. Stufe 2 — die Befugnis, geltendes Recht
    zeitlich befristet zu modifizieren oder auszusetzen — setzt die noch nicht eingebrachte Regulating
    for Growth Bill voraus.

    '
  kurzbeschreibung: 'Das AI Growth Lab ist das operative Herzstück der britischen KI-Politik anstelle
    eines KI-Gesetzes. Der Call for Evidence vom 21.10.2025 (Schlusstermin 07.01.2026) fragte nach einem
    "pioneering cross-economy sandbox" mit befristeten Ausnahmen für qualifizierte Unternehmen und Produkte,
    der Möglichkeit, Vorschriften per Sekundärrecht zeitweise zu ändern oder auszusetzen, "roten Linien"
    für Verbraucherrechte, Sicherheit, Grundrechte und Beschäftigtenschutz sowie einem Mechanismus zur
    dauerhaften Übernahme erfolgreicher Erprobungen. Eine Regierungsantwort lag am 27.08.2026 nicht vor.
    Parallel startete ein rein beratendes Lab für Rechtsdienstleistungen, betreut von SRA, Legal Services
    Board und Council for Licensed Conveyancers.

    '
  inkrafttreten:
    datum: 2025-10-21
    verifiziert: true
    quelle: https://www.gov.uk/government/calls-for-evidence/ai-growth-lab/ai-growth-lab
  anwendungsdaten:
  - datum: 2026-01-07
    was_gilt: Ende der Frist des Call for Evidence (23:59 Uhr).
    verifiziert: true
    quelle: https://www.gov.uk/government/calls-for-evidence/ai-growth-lab/ai-growth-lab
  - datum: 2026-08-06
    was_gilt: 'Eröffnung der Bewerbung für das beratende AI Growth Lab Rechtsdienstleistungen; Bewerbungsschluss
      27.09.2026.

      '
    verifiziert: false
    quelle: https://www.gov.uk/government/publications/advisory-ai-growth-lab-legal-services
  themenachsen:
  - governance
  - berufsrecht
  - marktzugang
  - sektor-medizin
  regelungsschwerpunkte:
  - 'Entscheidende Unterscheidung: Das laufende Lab ist BERATEND (''explain how existing rules apply to
    AI tools rather than to write new ones''). Die eigentliche Sandbox-Befugnis mit Suspendierungswirkung
    existiert noch nicht.'
  - 'Rote Linien: Verbraucherrechte, Sicherheit, Grundrechte, Beschäftigtenschutz sollen nicht modifizierbar
    sein. Ohne Gesetzestext ist offen, wie diese Grenzen justiziabel werden.'
  - 'Verstetigungsmechanismus per Sekundärrecht: der eigentliche verfassungsrechtliche Streitpunkt (Lord
    Holmes: ''executive power grab'').'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Art. 57 ff. KI-VO verpflichten Mitgliedstaaten zu Reallaboren,
    die Anbieter bei der Erfüllung — nicht bei der Umgehung — der Pflichten unterstützen; Art. 60 erlaubt
    Tests unter Realbedingungen mit strengen Voraussetzungen und Einwilligung. Das UK-Modell zielt in
    die Gegenrichtung.'
