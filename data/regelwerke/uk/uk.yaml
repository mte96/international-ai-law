- id: uk-dpa-2018
  jurisdiktion: uk
  kurztitel: Data Protection Act 2018
  offizieller_titel: Data Protection Act 2018
  fundstelle: 2018 c. 12
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, laufend geändert, zuletzt umfangreich durch den Data (Use and Access)
    Act 2025 (2025 c. 18). Das Gesetz ergänzt die UK GDPR und regelt allein die Bereiche, die außerhalb
    ihres Anwendungsbereichs liegen — Strafverfolgung (Part 3) und Nachrichtendienste (Part 4). Für KI
    in der Verwaltung und bei der Polizei ist dies die maßgebliche Rechtsgrundlage, nicht die UK GDPR.

    '
  kurzbeschreibung: 'Der DPA 2018 enthält die nationalen Ausfüllungen der UK GDPR (Part 2 mit den Ausnahmen
    der Schedules 2 bis 4), das eigenständige Regime für die Verarbeitung zu Strafverfolgungszwecken (Part
    3, Umsetzung der Richtlinie (EU) 2016/680), das Regime für die Nachrichtendienste (Part 4), die Rechtsstellung
    und Befugnisse der Aufsichtsbehörde (Part 5) und die Durchsetzung (Part 6) mit Bußgeldern bis 17,5
    Mio. GBP oder 4 % des weltweiten Jahresumsatzes (s. 157). Für automatisierte Entscheidungen enthält
    er eigene Vorschriften: ss. 49 und 50 für die Strafverfolgung — eine ausschließlich automatisierte
    Entscheidung mit nachteiliger Rechtswirkung ist nur zulässig, wenn ein Gesetz sie erlaubt, und die
    betroffene Person ist zu unterrichten und kann binnen eines Monats eine Überprüfung verlangen — sowie
    ss. 96 und 97 für die Nachrichtendienste.

    '
  inkrafttreten:
    datum: 2018-05-25
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/2018/625/regulation/2/made
    fundstelle_norm: Sec. 212(1) Data Protection Act 2018 i.V.m. Reg. 2 der Data Protection Act 2018 (Commencement
      No. 1 and Transitional and Saving Provisions) Regulations 2018, SI 2018/625 ("Provisions coming
      into force on 25th May 2018"); Royal Assent am 23.05.2018, einzelne Vorschriften bereits nach sec.
      212(2) in Kraft.
  anwendungsdaten:
  - datum: 2026-02-05
    was_gilt: Folgeänderungen der DUAA-Reform zu automatisierten Entscheidungen (Schedule 6 DUAA) wirksam.
    verifiziert: false
    quelle: https://www.legislation.gov.uk/uksi/2026/82/regulation/2/made
  themenachsen:
  - datenschutz
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'ss. 49, 50: Das Strafverfolgungsregime enthält den strengeren Maßstab — Gesetzesvorbehalt für vollautomatisierte
    belastende Entscheidungen, Unterrichtungspflicht und Überprüfungsrecht binnen eines Monats. Für polizeiliche
    Gesichtserkennung und Risikobewertung ist das die einschlägige Norm, nicht Art. 22 UK GDPR.'
  - 'Part 4 (ss. 96, 97): Für die Nachrichtendienste gilt ein noch weiter abgeschwächtes Regime; die Aufsicht
    ist eingeschränkt.'
  - 's. 157: Bußgeldrahmen 17,5 Mio. GBP oder 4 % Weltjahresumsatz. Es gibt keinen KI-spezifischen Bußgeldtatbestand
    — jede britische KI-Sanktion läuft über diese Norm.'
  - 'Schedules 2-4: die nationalen Ausnahmen, darunter die für Einwanderungszwecke, die 2021 im Verfahren
    Open Rights Group gerichtlich beanstandet und nachgebessert wurde. Für KI-gestützte Verwaltungsverfahren
    ist die Reichweite dieser Ausnahmen entscheidend, weil sie Auskunfts- und Informationsrechte suspendieren.'
  - Der DPA 2018 ist das Gesetz, auf das sich die britische Rechtsprechung zu Bridges (Gesichtserkennung)
    und zur Visa-Streaming-Software stützt — dort in Verbindung mit der Equality Act-Pflicht des s. 149.
  dokumente:
  - datum: 2018-05-23
    typ: konsolidiert
    titel: Data Protection Act 2018 (2018 c. 12) — konsolidierte Fassung
    url: https://www.legislation.gov.uk/ukpga/2018/12/contents
    sprache: en
    urheber: The National Archives
    verifiziert: true
    notiz: Amtliche Fassung mit Änderungsnachweisen; Struktur der Parts und die Vorschriften zu automatisierten
      Entscheidungen (ss. 14, 49, 50, 96, 97) bestätigt. Ob s. 14 durch die DUAA aufgehoben oder neu gefasst
      wurde, ergab sich aus der abgerufenen Seite nicht eindeutig.
  bedeutung_eu_anbieter: 'Für Anbieter, die britische Behörden oder Polizeikräfte beliefern, ist Part
    3 der maßgebliche Prüfmaßstab — und er ist strenger als das, was für die Privatwirtschaft gilt. Wer
    ein System für Risikobewertung oder biometrische Identifizierung anbietet, muss die Frage beantworten,
    welches Gesetz die vollautomatisierte Entscheidung erlaubt; ohne diese Grundlage bleibt nur die Entscheidungsunterstützung
    mit belegbarer menschlicher Beteiligung.

    '
  offene_punkte:
  - Genauer Stand des s. 14 nach der DUAA-Reform.
  - Ob die Einwanderungsausnahme in Schedule 2 erneut angegriffen wird.
