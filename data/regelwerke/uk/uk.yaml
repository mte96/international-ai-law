- id: uk-mhra-ki-medizinprodukte
  jurisdiktion: uk
  kurztitel: MHRA — KI als Medizinprodukt, AI Airlock, Nationale Kommission
  offizieller_titel: 'AI Airlock — the regulatory sandbox for AI as a Medical Device (AIaMD); National
    Commission into the Regulation of AI in Healthcare

    '
  fundstelle: null
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Der einzige britische Sektor mit einem echten Ex-ante-Regime für KI (UKCA-Konformitätsbewertung
    nach dem Medizinprodukterecht) und zugleich der Sektor mit dem konkretesten Reformprozess. AI Airlock
    Phase 2 lief von April 2025 bis Mai 2026 mit sieben Innovatoren; Phase 3 ist mit 3,6 Mio. GBP über
    drei Jahre bis 2029 finanziert und wird derzeit ausgestaltet. Die am 26.09.2025 eingesetzte Nationale
    Kommission soll 2026 einen neuen Regulierungsrahmen für KI im Gesundheitswesen vorlegen.

    '
  kurzbeschreibung: 'KI als Medizinprodukt unterliegt im UK bereits heute einer Vorabbewertung durch UK
    Approved Bodies — funktional dem Hochrisikoregime der KI-VO vergleichbar, aber über das Medizinprodukterecht,
    nicht über KI-Recht. Der AI Airlock ist das Reallabor, in dem MHRA, Approved Bodies, NHS und weitere
    Regulierer an realen Produkten klären, welche Regeln fehlen. Die Ergebnisse aus Phase 2 (klinische
    Dokumentation und Zusammenfassung, Krebsdiagnostik, Erkennung seltener Augenerkrankungen, Adipositastherapie)
    haben zu Empfehlungen für Leitlinien zu "predetermined change control plans" (PCCP), zur Qualifikation
    von Software und Zweckbestimmung sowie zur Leistungsbewertung KI-gestützter In-vitro-Diagnostika geführt.
    Die Nationale Kommission unter Prof. Alastair Denniston (stellvertretend Prof. Henrietta Hughes, Patient
    Safety Commissioner) soll daraus einen Regulierungsrahmen entwickeln und Zwischenleitlinien für dringende
    Unsicherheiten herausgeben.

    '
