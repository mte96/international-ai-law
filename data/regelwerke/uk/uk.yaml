  - Die Verordnung, die eigenständige KI-Chatbots tatsächlich unter den OSA stellt, ist noch nicht erlassen.
    Bis dahin bleibt die Lücke bestehen.
  - Inkrafttretensdatum des OSA (26.10.2023) und die Frist 17.03.2025 nicht durch Primärquellenabruf verifiziert.
  - Ofcoms gesetzlicher Bericht zu kinderschädlichen Inhalten ist Berichten zufolge zum 26.10.2026 fällig
    — nicht primärquellenverifiziert.
