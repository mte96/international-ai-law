- id: uk-copyright-ai-prozess
  jurisdiktion: uk
  kurztitel: Copyright and AI — Konsultation, DUAA-Berichte, Folgeprozess
  offizieller_titel: 'Copyright and Artificial Intelligence (Konsultation Dez. 2024 – Feb. 2025); Report
    on Copyright and Artificial Intelligence und Copyright and Artificial Intelligence: Impact Assessment
    (CP2602959) nach ss. 135, 136 Data (Use and Access) Act 2025

    '
  fundstelle: CP2602959; Bericht ISBN 978-1-5286-6308-3, Folgenabschätzung ISBN 978-1-5286-6317-5
  verfahrensnummer: Written Ministerial Statement HCWS1416 (18.03.2026)
  status: softlaw
  status_detail: 'Abgeschlossener Berichtsprozess ohne Gesetzgebungsergebnis. Die Regierung hat ihren
    ursprünglich bevorzugten Weg (Option 3: breite TDM-Schranke mit Rechtevorbehalt/Opt-out) am 18.03.2026
    aufgegeben und keinen neuen bevorzugten Weg benannt. Angekündigt sind lediglich weitere Evidenzsammlung,
    freiwillige Best-Practice-Arbeit und zwei Folgeprozesse: eine Konsultation zu "digital replicas" (Sommer
    2026) und ein Zwischenbericht der Taskforce zur Kennzeichnung KI-generierter Inhalte (Herbst 2026).

    '
  kurzbeschreibung: 'Die Konsultation lief vom 17.12.2024 bis 25.02.2025 und erhielt gut 11.500 Antworten,
    die von einer 80-köpfigen Taskforce ohne KI-Einsatz ausgewertet wurden. Sie schlug vier Optionen vor,
    von denen die Regierung Option 3 bevorzugte: eine breite TDM-Schranke für jeden Zweck, soweit Rechteinhaber
    sich die Rechte nicht vorbehalten. Während der Beratung des Data (Use and Access) Bill entbrannte
    ein monatelanger Konflikt zwischen Lords und Commons um von Baroness Kidron eingebrachte Transparenzpflichten
    für KI-Entwickler. Der Kompromiss bestand darin, statt materieller Pflichten Berichtspflichten zu
    schaffen (ss. 135-137 DUAA). Der Zwischenbericht nach s. 137 erschien am 15.12.2025, der Bericht nach
    s. 136 nebst Wirtschaftsfolgenabschätzung nach s. 135 am 18.03.2026. Ergebnis: kein Opt-out, keine
    Transparenzpflicht, kein Eingriff in den Lizenzmarkt, keine Reform vor gesicherter Erkenntnis.

    '
  inkrafttreten:
    datum: 2024-12-17
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/copyright-and-artificial-intelligence-progress-report/copyright-and-artificial-intelligence-statement-of-progress-under-section-137-data-use-and-access-act
  anwendungsdaten:
  - datum: 2025-02-25
    was_gilt: Ende der Konsultationsfrist; gut 11.500 Antworten.
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/copyright-and-artificial-intelligence-progress-report/copyright-and-artificial-intelligence-statement-of-progress-under-section-137-data-use-and-access-act
  - datum: 2025-12-15
    was_gilt: 'Statement of Progress nach s. 137 DUAA veröffentlicht; vier Experten-Arbeitsgruppen (Kontrolle/technische
      Standards, Transparenz, Lizenzierung, breitere Unterstützung der Kreativwirtschaft) mit über 50
      Mitgliedern eingesetzt.

      '
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/copyright-and-artificial-intelligence-progress-report/copyright-and-artificial-intelligence-statement-of-progress-under-section-137-data-use-and-access-act
  - datum: 2026-03-18
    was_gilt: 'Bericht nach s. 136 und Wirtschaftsfolgenabschätzung nach s. 135 veröffentlicht (CP2602959),
      zugleich Written Ministerial Statement HCWS1416 von Liz Kendall. Option 3 aufgegeben, kein neuer
      bevorzugter Weg, keine Gesetzgebung.

      '
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/report-and-impact-assessment-on-copyright-and-artificial-intelligence
  themenachsen:
  - urheberrecht
  - gpai
  - content
  - wettbewerb
  regelungsschwerpunkte:
  - 'TDM/Opt-out: ''Wir verfolgen Option 3 nicht als bevorzugten Weg weiter.'' Die Regierung will stattdessen
    ''further evidence on how copyright laws are impacting the development and deployment of AI across
    the economy'' sammeln. Konsequenz: s. 29A CDPA bleibt unverändert, kommerzielles Training bleibt lizenzpflichtig
    — und faktisch unkontrolliert, solange das Training im Ausland stattfindet (vgl. Getty v Stability).'
  - 'Transparenz: Die Regierung bekennt sich zum Ziel, will aber nur ''work with industry and experts
    to develop best practice on input transparency'' und internationale Entwicklungen, insbesondere die
    EU-Regeln, beobachten, bevor sie eine britische Gesetzgebung erwägt. Baroness Lloyd am 16.07.2026:
    Die Vorschläge hätten ''did not command the support of the creative industry or the technology industry''.'
  - 'Lizenzmarkt: kein Eingriff. ''Monitor the market as it develops and will keep market-led approaches
    to licensing under review.'' Kein Zwangslizenz- oder Vergütungsmodell.'
  - 'Digitale Ebenbilder/Persönlichkeitsrecht: Die Regierung erkennt Schutzbedarf an, entscheidet aber
    nicht; sie will ''a range of options'' prüfen, einschließlich eines neuen ''digital replica or personality
    right''. Konsultation für Sommer 2026 zugesagt — am 27.08.2026 nicht auffindbar und damit überfällig.'
  - 'Computergenerierte Werke: Vorschlag, den Schutz für rein ohne menschliche Beteiligung erzeugte Werke
    abzuschaffen (s. 9 Abs. 3 CDPA), menschlich unterstützte Erzeugnisse aber geschützt zu lassen.'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Art. 53 Abs. 1 lit. c KI-VO verpflichtet GPAI-Anbieter zu einer
    Urheberrechts-Policy einschließlich der Beachtung von Rechtevorbehalten nach Art. 4 Abs. 3 DSM-RL,
    lit. d zu einer öffentlichen, hinreichend detaillierten Zusammenfassung der Trainingsinhalte nach
    dem Muster des KI-Büros. Das UK hat exakt diese beiden Pflichten geprüft und ausdrücklich NICHT eingeführt.
    Ein GPAI-Anbieter, der nur den britischen Markt bedient, unterliegt keiner Trainingsdaten-Offenlegung.'
