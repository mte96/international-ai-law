  - datenschutz
  regelungsschwerpunkte:
  - Pflicht zur Folgenabschätzung vor dem Einsatz — im UK-Recht ohne Vorbild außerhalb der DSFA nach Art.
    35 UK GDPR.
  - 'Transparenz- und Registerpflicht: hätte den freiwilligen ATRS in eine gesetzliche Pflicht überführt.'
  - 'Bedeutung des Scheiterns: Der britische Staat setzt KI in Sozialleistungs-, Migrations- und Steuerverwaltung
    ein, ohne dass eine spezifische gesetzliche Ex-ante-Prüfpflicht besteht. Die ICO adressiert dies seit
    2026 aufsichtlich statt gesetzlich (vgl. uk-sektorregulierer-ki).'
