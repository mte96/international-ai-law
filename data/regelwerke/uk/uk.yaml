- id: uk-gdpr
  jurisdiktion: uk
  kurztitel: UK GDPR
  offizieller_titel: 'Regulation (EU) 2016/679 in ihrer für das Vereinigte Königreich beibehaltenen und
    angepassten Fassung (assimiliertes Recht), zuletzt geändert durch den Data (Use and Access) Act 2025

    '
  fundstelle: Assimiliertes Recht; Anpassungen durch die Data Protection, Privacy and Electronic Communications
    (Amendments etc.) (EU Exit) Regulations 2019 (SI 2019/419)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, seit dem 05.02.2026 in der Fassung des Data (Use and Access) Act 2025.
    Die Europäische Kommission hat die Angemessenheitsbeschlüsse am 19.12.2025 erneuert; sie laufen am
    27.12.2031 aus und werden spätestens nach vier Jahren überprüft.

    '
  kurzbeschreibung: 'Die UK GDPR ist der materielle Datenschutzkern des britischen Rechts und zugleich
    das einzige horizontal wirkende Regime, das KI-Systeme unabhängig vom Sektor erfasst — soweit personenbezogene
    Daten verarbeitet werden. Nach der DUAA-Reform gilt für automatisierte Entscheidungen nicht mehr Art.
    22 in der europäischen Fassung, sondern die neuen Art. 22A bis 22D: Ein Verbot besteht nur noch, wenn
    besondere Kategorien personenbezogener Daten verarbeitet werden; in allen übrigen Fällen genügt das
    Bündel der vier Schutzmaßnahmen des Art. 22C (Information, Stellungnahme, menschliches Eingreifen,
    Anfechtbarkeit). Art. 22A definiert erstmals gesetzlich, wann eine Entscheidung "ausschließlich" automatisiert
    ergeht, nämlich wenn keine "meaningful human involvement" vorliegt. Art. 22D ermächtigt den Secretary
    of State, diese Begriffe und zusätzliche Schutzmaßnahmen durch Verordnung zu bestimmen — der Hebel,
    über den KI-Regulierung im Vereinigten Königreich ohne KI-Gesetz erfolgen kann.

    '
  inkrafttreten:
    datum: 2020-12-31
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/2020/1586/regulation/1/made
    fundstelle_norm: Die UK GDPR entstand mit dem IP completion day (31.12.2020, 23:00 Uhr GMT; sec. 39(1)
      European Union (Withdrawal Agreement) Act 2020). Reg. 1(2) SI 2019/419 ("they come into force on
      exit day", ersetzt durch IP completion day) und Reg. 1(2) SI 2020/1586 ("they come into force immediately
      before IP completion day"). Zuvor gespeichertes Datum 01.01.2021 war die verbreitete Verkuerzung,
      nicht der Norminhalt.
  anwendungsdaten:
  - datum: 2026-02-05
    was_gilt: Art. 22A-22D anstelle des bisherigen Art. 22; Schedule 4 DUAA (recognised legitimate interests)
      wirksam.
    verifiziert: false
    quelle: https://www.legislation.gov.uk/uksi/2026/82/regulation/2/made
  - datum: 2025-12-19
    was_gilt: 'Erneuerung der Angemessenheitsbeschlüsse durch die Europäische Kommission — je einer nach
      Art. 45 DSGVO und Art. 36 der Richtlinie (EU) 2016/680 —, gültig bis 27.12.2031, nach Stellungnahme
      des EDSA vom 16.10.2025 und einer Zwischenverlängerung im Juni 2025.

      '
    verifiziert: true
    quelle: https://eucrim.eu/news/commission-renewed-adequacy-decisions-for-data-transfers-to-the-uk/
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - arbeit
  - gpai
  regelungsschwerpunkte:
  - 'Die Angemessenheit ist die praktisch wichtigste Nachricht für europäische Anbieter: Datenübermittlungen
    ins Vereinigte Königreich brauchen bis Ende 2031 keine zusätzlichen Garantien. Die Kommission überwacht
    laufend; weitere Sekundärgesetzgebung nach dem DUAA kann das ändern.'
  - 'Art. 22A: ''no meaningful human involvement'' als gesetzliches Merkmal. Die Beweisführung verschiebt
    sich damit von der Frage, ob überhaupt ein Mensch beteiligt war, zur Qualität der Beteiligung.'
  - 'Art. 22B: Verbot nur noch bei besonderen Kategorien personenbezogener Daten; zusätzlich unzulässig,
    wenn die Verarbeitung auf die neuen ''recognised legitimate interests'' gestützt wird.'
  - 'Art. 22D: Verordnungsermächtigung zur Konkretisierung. Wer die britische KI-Regulierung beobachten
    will, beobachtet diese Verordnungen — nicht Gesetzentwürfe.'
  - 'Trainingsdaten: Art. 6 Abs. 1 lit. f (legitimate interests) bleibt die einzige praktikable Grundlage
    für das Scraping personenbezogener Daten. Die ''recognised legitimate interests'' des DUAA erfassen
    KI-Training gerade NICHT.'
  - 'Anwendungsgrenze: Ein KI-System ohne Personenbezug unterliegt im Vereinigten Königreich keiner horizontalen
    Regulierung. In der EU wäre es gleichwohl KI-VO-pflichtig, wenn es unter Anhang I oder III fällt.'
  dokumente:
  - datum: 2025-12-19
    typ: uebersicht
    titel: Commission Renewed Adequacy Decisions for Data Transfers to the UK
    url: https://eucrim.eu/news/commission-renewed-adequacy-decisions-for-data-transfers-to-the-uk/
    sprache: en
    urheber: eucrim — The European Criminal Law Associations' Forum
    verifiziert: true
    notiz: Quelle für Datum, Laufzeit bis 27.12.2031, Rechtsgrundlagen und EDSA-Stellungnahme.
  - datum: 2016-04-27
    typ: konsolidiert
    titel: Regulation (EU) 2016/679 (assimiliertes Recht des Vereinigten Königreichs)
    url: https://www.legislation.gov.uk/eur/2016/679/contents
    sprache: en
    urheber: The National Archives
    verifiziert: false
    notiz: Amtliche britische Fassung mit den Anpassungen des EU-Austritts.
  bedeutung_eu_anbieter: 'Zwei Konsequenzen. Erstens: Übermittlungen ins Vereinigte Königreich bleiben
    bis Ende 2031 privilegiert — die Angemessenheitserneuerung vom Dezember 2025 hat die DUAA-Unsicherheit
    beendet. Zweitens: Für automatisierte Entscheidungen gilt im Vereinigten Königreich ein niedrigeres
    Schutzniveau als in der EU. Wer ein Beschäftigten- oder Kundenscoring betreibt, kann es in London
    zulässig gestalten, wo es in Frankfurt an Art. 22 DSGVO scheitert — und muss das in einer konzernweiten
    Systemarchitektur bewusst trennen.

    '
  offene_punkte:
  - Endfassung der ICO-Leitlinie zu automatisierten Entscheidungen (Konsultation 31.03.-29.05.2026).
  - Ob Verordnungen nach Art. 22D erlassen werden und ob sie die Angemessenheit berühren.
