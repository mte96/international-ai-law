- id: uk-av-act-2024
  jurisdiktion: uk
  kurztitel: Automated Vehicles Act 2024
  offizieller_titel: Automated Vehicles Act 2024
  fundstelle: 2024 c. 10
  verfahrensnummer: Automated Vehicles Bill [HL], Bill-ID 3506
  status: verabschiedet
  status_detail: 'Royal Assent am 20.05.2024, aber bis zum 10.09.2026 nicht operativ: Die Vorschriften
    des Ersten Teils sind nach s. 99 Abs. 1 nicht in Kraft gesetzt; in Kraft ist bislang nur s. 78 für
    bestimmte Zwecke (01.01.2026, S.I. 2025/1339). Das Zulassungsregime steht darüber hinaus und fällt
    mit der Statement of Safety Principles und weiteren Rechtsverordnungen. Die Konsultation zur Statement
    of Safety Principles wurde erst am 17.06.2026 eröffnet und lief bis zum 09.09.2026. Die einschlägige
    UNECE-Regelung für automatisierte Fahrsysteme wird für Anfang 2027 erwartet.

    '
  kurzbeschreibung: 'Der AV Act ist das einzige britische Gesetz, das für eine KI-getriebene Technologie
    ein vollständiges Marktzugangsregime schafft — und damit strukturell dem AI Act ähnelt. Er sieht den
    "self-driving test" vor, ein Zulassungsverfahren (Authorisation) durch den Secretary of State, die
    Figur des "authorised self-driving entity" (ASDE) mit fortlaufender Verantwortung, das "no-user-in-charge
    operator"-Regime und eine Freistellung des "user-in-charge" von Straftaten, die aus der Art und Weise
    des Fahrens folgen. Für automatisierte Personenbeförderung sieht er ein eigenes Genehmigungsschema
    vor. Die Statement of Safety Principles legt fest, woran die Sicherheit gemessen wird; der aktuelle
    Entwurf enthält zehn Grundsätze. Die Vorschriften des Ersten Teils sind zum 10.09.2026 sämtlich nicht
    in Kraft (s. 99 Abs. 1); in Kraft gesetzt ist bislang nur s. 78 für bestimmte Zwecke (01.01.2026,
    S.I. 2025/1339).

    '
  inkrafttreten:
    datum: 2024-05-20
    verifiziert: true
    quelle: https://bills.parliament.uk/bills/3506
  anwendungsdaten:
  - datum: 2026-06-17
    was_gilt: 'Konsultation zur Statement of Safety Principles eröffnet (zehn vorgeschlagene Sicherheitsgrundsätze).

      '
    verifiziert: true
    quelle: https://www.gov.uk/government/consultations/automated-vehicles-statement-of-safety-principles/automated-vehicles-statement-of-safety-principles-consultation
  themenachsen:
  - marktzugang
  - haftung
  - sicherheit-export
  - governance
  regelungsschwerpunkte:
  - 'Statement of Safety Principles nach dem AV Act: doppelte Funktion — Maßstab für die Zulassungsentscheidung
    des Secretary of State (''travel safely and autonomously'') und Maßstab der jährlichen Bewertung der
    Flottenleistung.'
  - 'Verantwortungsverteilung: Solange die zugelassene Funktion aktiviert ist, ist der Nutzer kein Fahrer
    und nach s. 47 von Straftaten freigestellt, die aus der Art und Weise des Fahrens folgen; s. 47 weist
    die Verantwortung aber niemandem zu — die fortlaufende Einstandspflicht der ASDE folgt aus den Zulassungsanforderungen
    nach s. 6. Dies ist das britische Gegenstück zu Art. 26 KI-VO (Betreiberpflichten), aber deutlich
    weiter: Es geht um strafrechtliche Zurechnung, nicht nur um Sorgfaltspflichten. Zum 10.09.2026 ist
    keine dieser Vorschriften in Kraft.'
  - 'Strukturelle Ähnlichkeit zum AI Act: Zulassung vor Inverkehrbringen, benannte verantwortliche Stelle,
    laufende Überwachung, Meldepflichten. Der AV Act zeigt, dass das UK ein Ex-ante-Regime durchaus baut
    — nur eben sektoral und nicht technologiehorizontal.'
  - 'Praktische Bremse: Ohne Commencement Order nach s. 99 Abs. 1, ohne Safety Principles und ohne die
    UNECE-ADS-Regelung (erwartet Anfang 2027) kann keine Zulassung erteilt werden. Das Gesetz hat seit
    über zwei Jahren Royal Assent, ist im Ersten Teil aber nicht in Kraft und hat keinen Anwendungsfall.'
