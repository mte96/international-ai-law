  regelungsschwerpunkte:
  - 'ICO: Strategie KI und Biometrie; Auditberichte zur polizeilichen Gesichtserkennung (South Wales und
    Gwent August 2025, Essex und Leicestershire März 2026, West Yorkshire laufend, Greater Manchester
    ab April 2026). Bericht und Empfehlungen zu automatisierten Entscheidungen im Bewerbungsverfahren
    angekündigt. Forschung zu agentischer KI (Januar 2026).'
  - 'ICO-Verhaltensregel zu KI und automatisierten Entscheidungen: im DUAA-Verfahren zugesagt; die verpflichtende
    Rechtsverordnung ist in Vorbereitung, ein Termin steht nicht fest. Sie wäre das erste KI-spezifische,
    gesetzlich verankerte Regelwerk im UK.'
  - 'FCA: AI Lab, AI Live Testing (zweite Kohorte ab Januar 2026, acht Firmen), Supercharged Sandbox.
    Kein KI-Regelwerk — die FCA betont ausdrücklich, dass die bestehenden Grundsätze (Consumer Duty, SM&CR,
    operationale Resilienz) genügen.'
  - 'Bank of England / FCA / HM Treasury, gemeinsame Erklärung Mai 2026 zu Frontier-KI und Cyberrisiko:
    Verwaltungsratsverantwortung, Schwachstellenmanagement, Drittparteirisiko, KI-gestützte Verteidigung
    — ausdrücklich OHNE neue regulatorische Pflichten.'
  - 'DRCF: CMA, FCA, ICO, Ofcom. Der AI and Digital Hub lief als einjähriger Pilot bis April 2025 (30
    Anträge, 9 vollständige regulierungsübergreifende Antworten, 8 anonymisierte Fallstudien) und wurde
    in den Thematic Innovation Hub überführt; erster Schwerpunkt agentische KI. Zweites Responsible AI
    Forum am 10.03.2026 mit über 200 Teilnehmern.'
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Die KI-VO ordnet Marktüberwachungsbehörden mit Befugnissen nach
    Art. 74 ff. zu, einschließlich Rückruf, Marktrücknahme und Zugang zu Trainingsdaten und Quellcode
    (Art. 74 Abs. 12/13). Kein britischer Regulierer hat gegenüber KI-Systemen als solchen eine vergleichbare
    Befugnis; jeder kann nur innerhalb seines eigenen Regimes handeln.'
