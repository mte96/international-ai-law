- id: uk-aisi
  jurisdiktion: uk
  kurztitel: AI Security Institute (AISI)
  offizieller_titel: 'AI Security Institute (bis 14.02.2025: AI Safety Institute) — Direktorat der zuständigen
    Fachverwaltung

    '
  fundstelle: null
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Nicht-statutarische Einrichtung ohne eigene Rechtspersönlichkeit und ohne Hoheitsbefugnisse;
    organisatorisch ein Direktorat des früheren DSIT, seit Juli 2026 im Ressort des KI-Ministers (DBIST).
    Die Labour-Regierung hatte eine gesetzliche Verankerung und die Überführung freiwilliger Zusagen der
    Entwickler in bindende Verpflichtungen versprochen; beides ist bis zum 27.08.2026 nicht geschehen.
    Finanzierung: 240 Mio. GBP aus dem Spending Review 2025.

    '
  kurzbeschreibung: 'Das AISI ist die zentrale britische KI-Institution und zugleich der Beleg für die
    Grenzen des britischen Ansatzes. Es beschäftigt über 100 technische Mitarbeiter, hat nach eigenen
    Angaben mehr als 30 Frontier-Modelle getestet und forscht zu Cyberfähigkeiten, Überzeugungswirkung,
    biologischen und chemischen Risiken sowie kriminellem Missbrauch. Es hat jedoch keinerlei Befugnis,
    Zugang zu Modellen zu verlangen, Prüfungen anzuordnen, Ergebnisse zu veröffentlichen oder Maßnahmen
    durchzusetzen — der Zugang beruht ausschließlich auf freiwilligen Vereinbarungen mit den Entwicklern.
    Am 14.02.2025 wurde es von "Safety" in "Security" umbenannt und auf schwere Sicherheitsrisiken fokussiert;
    ausdrücklich ausgenommen sind seither Verzerrung (bias) und Meinungsfreiheit.

    '
