- id: uk-ai-opportunities-action-plan
  jurisdiktion: uk
  kurztitel: AI Opportunities Action Plan
  offizieller_titel: 'AI Opportunities Action Plan (Januar 2025) nebst Regierungsantwort und Fortschrittsbericht
    "AI Opportunities Action Plan: One Year On"

    '
  fundstelle: null
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Umsetzungsstrategie ohne Rechtswirkung, am 13.01.2025 vorgelegt (50 Empfehlungen, von
    der Regierung angenommen). Fortschrittsbericht vom 29.01.2026: 38 von 50 Maßnahmen erledigt. Der Plan
    ist die politische Klammer, unter der Regulierung im UK ausdrücklich als Wachstumshemmnis behandelt
    wird.

    '
  kurzbeschreibung: 'Der Plan verfolgt drei Stränge: Infrastruktur (Rechenkapazität, AI Growth Zones,
    National Data Library), Verbreitung in Verwaltung und Wirtschaft sowie souveräne KI-Fähigkeit. Konkrete
    Ergebnisse bis Januar 2026: fünf AI Growth Zones (Culham, Blyth/North Tyneside, Nord- und Südwales,
    Lanarkshire) mit 28,2 Mrd. GBP privater Investition, Isambard-AI-Supercomputer in Bristol, über eine
    Million kostenlose KI-Weiterbildungsplätze auf dem Weg zu zehn Millionen bis 2030, KI-gestützte Auswertung
    von 2,4 Mio. Röntgenaufnahmen jährlich im NHS, Health Data Research Service (600 Mio. GBP mit Wellcome).
    Regulatorisch relevant sind vor allem das AI Growth Lab, der AI Assurance Innovation Fund (11 Mio.
    GBP, erste Antragsrunde Frühjahr 2026) und die Sovereign AI Unit (500 Mio. GBP, nächste Phase April
    2026).

    '
