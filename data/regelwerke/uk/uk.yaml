regelwerke:
- id: uk-ai-white-paper-2023
  jurisdiktion: uk
  kurztitel: KI-Weißbuch 2023 / Fünf-Prinzipien-Rahmen
  offizieller_titel: 'A pro-innovation approach to AI regulation (Command Paper CP 815) nebst Regierungsantwort
    "A pro-innovation approach to AI regulation: government response"

    '
  fundstelle: CP 815 (Weißbuch); Regierungsantwort ISBN 978-1-5286-4565-2
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Weiterhin der maßgebliche, aber rein nicht-bindende Ordnungsrahmen. Die Labour-Regierung
    hat ihn nie förmlich aufgehoben und auch nie durch ein Gesetz ersetzt; sie hat ihn 2025/26 vielmehr
    bekräftigt ("regulation at the point of use") und um Berichtspflichten der Regulierer ergänzt.

    '
  kurzbeschreibung: 'Das Weißbuch vom 29.03.2023 lehnt ein horizontales KI-Gesetz und eine eigene KI-Behörde
    ausdrücklich ab. Stattdessen legt es fünf sektorübergreifende Prinzipien fest — Sicherheit/Robustheit,
    Transparenz und Erklärbarkeit, Fairness, Rechenschaft und Governance sowie Anfechtbarkeit und Rechtsbehelf
    — die die bestehenden Sektorregulierer in ihren jeweiligen Zuständigkeiten auf nicht-statutarischer
    Grundlage anwenden sollen. Es gibt keine Adressatenpflichten und keine Sanktion; verbindlich wird
    ein Prinzip nur, soweit es sich in einem bestehenden Regime (Datenschutz, Wettbewerb, Produktsicherheit,
    Online Safety) wiederfindet. Die Konsultation lief vom 29.03.2023 bis 21.06.2023; die Regierungsantwort
    vom 06.02.2024 hielt am Ansatz fest und stellte eine spätere gesetzliche Verankerung ("targeted binding
    requirements" für die leistungsfähigsten Modelle) lediglich in Aussicht.

    '
  inkrafttreten:
    datum: 2023-03-29
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/ai-regulation-a-pro-innovation-approach
  anwendungsdaten:
  - datum: 2024-02-06
    was_gilt: 'Regierungsantwort veröffentlicht; Beibehaltung des nicht-statutarischen Ansatzes, keine
      KI-Behörde.

      '
    verifiziert: true
    quelle: https://www.gov.uk/government/consultations/ai-regulation-a-pro-innovation-approach-policy-proposals
  - datum: 2024-04-30
    was_gilt: 'Stichtag, bis zu dem 13 angeschriebene Regulierer (FCA, Bank of England, ICO, Ofcom, MHRA,
      ONR, HSE, Ofsted, Ofqual, Legal Services Board, Ofgem, CMA, EHRC) ihren strategischen KI-Ansatz
      veröffentlichen sollten.

      '
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/request-for-regulators-to-publish-an-update-on-their-strategic-approach-to-ai-secretary-of-state-letters
  - datum: 2026-01-28
    was_gilt: 'Gemeinsamer Brief von Liz Kendall (DSIT) und Peter Kyle (DBT) an 19 Regulierer: Pflicht
      zur Veröffentlichung eines Plans, wie sie sichere KI-Innovation unterstützen, und zur jährlichen
      Fortschrittsberichterstattung.

      '
    verifiziert: true
    quelle: https://www.gov.uk/government/publications/how-will-regulators-enable-safe-ai-powered-innovation-joint-letter-from-dsit-secretary-of-state-and-dbt-secretary-of-state
  themenachsen:
  - governance
  - marktzugang
  - grundrechte
  regelungsschwerpunkte:
  - 'Fünf Prinzipien: safety/security/robustness; appropriate transparency and explainability; fairness;
    accountability and governance; contestability and redress. Keine gesetzliche Verankerung, kein Adressat,
    keine Sanktion.'
  - Bewusster Verzicht auf eine zentrale KI-Behörde und auf eine gesetzliche Definition von KI; das Weißbuch
    beschreibt KI funktional über 'adaptivity' und 'autonomy'.
  - 'Zentraler Konstruktionsfehler aus Sicht der Kritiker: der Rahmen erfasst nur, wofür bereits ein Regulierer
    zuständig ist. Anwendungen ohne sektoralen Regulierer (etwa allgemeine Beschäftigtenauswahl außerhalb
    des Datenschutzes, private Nutzung von Basismodellen) fallen durch. Lord Holmes am 04.06.2026: ''accountability
    deficits''.'
  - 'Die Labour-Regierung hat den Ansatz materiell übernommen: Baroness Lloyd of Effra am 04.06.2026 in
    den Lords: ''AI is a general-purpose technology with a wide range of applications, which is why the
    Government believe that most AI systems should be regulated at the point of use.'''
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Der Fünf-Prinzipien-Rahmen erzeugt keine einzige durchsetzbare
    Pflicht. Wo die KI-VO Anbieter- und Betreiberpflichten (Art. 16, 26), Risikomanagement (Art. 9), Daten-Governance
    (Art. 10), technische Dokumentation (Art. 11), Protokollierung (Art. 12) und menschliche Aufsicht
    (Art. 14) statuiert, verweist das UK auf die Auslegung durch je zuständige Regulierer im Rahmen ihrer
    vorhandenen Befugnisse.'
