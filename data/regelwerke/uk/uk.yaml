  offene_punkte:
  - Die Verordnung nach Art. 22D UK GDPR (Konkretisierung 'meaningful human involvement') ist nicht erlassen;
    damit bleibt der Kernbegriff der britischen ADM-Regelung unbestimmt.
  - Die im Gesetzgebungsverfahren zugesagte Sekundärgesetzgebung, die die ICO zur Erstellung einer statutarischen
    Verhaltensregel zu KI und automatisierten Entscheidungen verpflichtet, war am 27.08.2026 noch in Vorbereitung.
  - Genaues Erlassdatum von SI 2026/82 nicht verifiziert; Inkrafttretensdatum 05.02.2026 dagegen aus dem
    SI-Text belegt.
  - Ob das EU-Angemessenheitsbeschluss-Regime die Art.-22A-22D-Reform trägt, ist offen; die Kommission
    hatte die UK-Angemessenheit zuletzt verlängert.
