  regelungsschwerpunkte:
  - 'Rechtsstellung: Direktorat einer Fachverwaltung, keine Behörde. Keine Auskunftsverlangen, keine Betretungsrechte,
    keine Anordnungen, keine Sanktionen. Lord Taylor of Warwick am 16.07.2026: das AISI ''does not have
    powers to compel companies''.'
  - 'Zugangsmodell: freiwillige Pre-Deployment-Testvereinbarungen mit Frontier-Entwicklern. Verweigert
    ein Entwickler den Zugang, gibt es kein Rechtsmittel.'
  - 'Mandatsverengung 2025: Peter Kyle ausdrücklich, das Institut ''will not focus on bias or freedom
    of speech, but on advancing our understanding of the most serious risks posed by the technology''.
    Damit wandert Diskriminierungsschutz vollständig zu ICO und EHRC.'
  - Vorschlag im Lords-Debattenverlauf (Lord Tarassenko, 04.06.2026), das AISI auf eine gesetzliche Grundlage
    zu stellen — von der Regierung nicht aufgegriffen.
  - 'MATERIELLE ABGRENZUNG ZUM AI ACT: Das EU-KI-Büro hat nach Art. 88-94 KI-VO Auskunfts-, Bewertungs-
    und Massnahmenbefugnisse gegenüber GPAI-Anbietern samt Bußgeldern nach Art. 101. Das AISI hat davon
    nichts. Es ist eine Forschungseinrichtung, keine Aufsicht.'
