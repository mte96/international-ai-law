- id: uk-cdpa-1988
  jurisdiktion: uk
  kurztitel: CDPA 1988 — Urheberrecht und TDM
  offizieller_titel: Copyright, Designs and Patents Act 1988
  fundstelle: 1988 c. 48
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Unverändert. Trotz Konsultation, Regierungsbericht und parlamentarischem Konflikt ist
    das britische Urheberrecht im Hinblick auf KI-Training am 27.08.2026 nicht geändert worden. Die Regierung
    hat am 18.03.2026 ausdrücklich erklärt, sie habe keinen bevorzugten Weg mehr und werde nicht reformieren,
    bevor sie sicher sei.

    '
  kurzbeschreibung: 'Der CDPA enthält in s. 29A eine TDM-Schranke, die ausschließlich Vervielfältigungen
    zum Zweck der Text- und Datenanalyse für NICHT-KOMMERZIELLE Forschung erlaubt und die rechtmäßigen
    Zugang voraussetzt. Kommerzielles KI-Training ist damit im UK grundsätzlich lizenzpflichtig — enger
    als Art. 4 DSM-Richtlinie. Zugleich enthält s. 9 Abs. 3 CDPA die weltweit ungewöhnliche Regelung für
    "computer-generated works" ohne menschlichen Urheber mit 50 Jahren Schutzdauer; die Regierung schlägt
    vor, sie zu streichen. Ein Reformversuch von 2022 (breite kommerzielle TDM-Schranke) wurde zurückgezogen;
    der Vorschlag von 2024 (breite Schranke mit Rechtevorbehalt) wurde 2026 aufgegeben.

    '
  inkrafttreten:
    datum: 1989-08-01
    verifiziert: true
    quelle: https://www.legislation.gov.uk/uksi/1989/816/made
    fundstelle_norm: Art. 2 der Copyright, Designs and Patents Act 1988 (Commencement No. 1) Order 1989,
      SI 1989/816, erlassen auf Grundlage von sec. 305(3) CDPA 1988 (Teile I bis VII treten am 1. August
      1989 in Kraft).
  anwendungsdaten:
  - datum: 2014-06-01
    was_gilt: s. 29A CDPA (TDM-Schranke für nicht-kommerzielle Forschung) wirksam.
    verifiziert: false
    quelle: https://www.legislation.gov.uk/ukpga/1988/48/section/29A
  themenachsen:
  - urheberrecht
  - gpai
  - vertrag
  regelungsschwerpunkte:
  - 's. 29A CDPA: TDM nur für ''non-commercial research'' und nur bei rechtmäßigem Zugang; vertragliche
    Abbedingung ist unwirksam. Für kommerzielles Training des Basismodells gibt es KEINE Schranke — das
    ist der zentrale Unterschied zur EU, wo Art. 4 DSM-RL kommerzielles TDM mit Opt-out-Vorbehalt erlaubt.'
  - 's. 9 Abs. 3 CDPA: Urheber eines computergenerierten Werkes ohne menschlichen Urheber ist, wer die
    für die Schöpfung notwendigen Vorkehrungen trifft; 50 Jahre Schutz (s. 12 Abs. 7). Der Bericht vom
    18.03.2026 schlägt die Abschaffung für rein KI-erzeugte Werke vor und will den Schutz auf menschlich
    unterstützte Erzeugnisse begrenzen.'
  - 'RECHTSPRECHUNGSHINWEIS — Getty Images (US) Inc & Ors v Stability AI Ltd [2025] EWHC 2863 (Ch), High
    Court (Ch), Mrs Justice Joanna Smith, Urteil vom 04.11.2025, Aktenzeichen IL-2023-000007: Getty gab
    die Ansprüche wegen unmittelbarer Urheberrechtsverletzung im Verlauf des Verfahrens (Juni 2025) auf,
    weil sich nicht nachweisen ließ, dass Vervielfältigungshandlungen im Vereinigten Königreich stattfanden
    — das Training erfolgte auf Rechnern außerhalb des UK. Der Anspruch wegen mittelbarer Verletzung nach
    ss. 22/23 CDPA scheiterte: Das Gericht hielt zwar fest, dass ein ''article'' im Sinne der Vorschrift
    auch eine unkörperliche elektronische Kopie sein kann, entschied aber, dass die Modellgewichte von
    Stable Diffusion selbst keine ''infringing copy'' sind, weil das Modell die Trainingswerke nicht speichert.
    Getty obsiegte lediglich in einem eng begrenzten Umfang wegen Markenverletzung (Getty-Wasserzeichen
    in Ausgaben). BEDEUTUNG: Solange ein Modell keine Werkkopien enthält, greift das UK-Urheberrecht den
    Modellimport nicht — die Auslandsverlagerung des Trainings entzieht das Vorhaben faktisch der britischen
    Jurisdiktion. Genau dies ist das Argument der Kreativwirtschaft für eine gesetzliche Transparenzpflicht.'
  - 'RECHTSPRECHUNGSHINWEIS — Getty Images (US) Inc & Ors v Stability AI Ltd (Re Form of Order) [2025]
    EWHC 3343 (Ch): Im Dezember 2025 erteilte Mrs Justice Smith Getty die Zulassung der Berufung zur mittelbaren
    Verletzung, weil es sich um eine reine Rechtsfrage der Gesetzesauslegung handele, ''on which the minds
    of reasonable lawyers may differ'' — nämlich ob eine ''infringing copy'' die Werke tatsächlich enthalten
    muss. Stability AIs Antrag auf Zulassung der Berufung gegen die Markenfeststellung wurde abgelehnt.
    Ein Termin des Court of Appeal war am 27.08.2026 nicht bekannt.'
  - 'RECHTSPRECHUNGSHINWEIS — Thaler v Comptroller-General of Patents, Designs and Trade Marks [2023]
    UKSC 49, Urteil vom 20.12.2023: Der Supreme Court entschied einstimmig, dass ein KI-System (DABUS)
    nach dem Patents Act 1977 nicht als Erfinder benannt werden kann; s. 13 Abs. 2 lit. a verlangt in
    jedem Fall die Benennung einer Person, und Dr. Thaler konnte kein Recht auf Erteilung aus dem Eigentum
    an der Maschine ableiten. BEDEUTUNG: Britisches Immaterialgüterrecht knüpft Schutzrechtsinhaberschaft
    an natürliche Personen. Zusammen mit dem Vorschlag, s. 9 Abs. 3 CDPA zu streichen, ergibt sich eine
    konsistente Linie: rein maschinelle Erzeugnisse sind schutzlos.'
