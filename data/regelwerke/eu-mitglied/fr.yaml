- id: fr-berufsrecht-cnb
  jurisdiktion: fr
  kurztitel: Berufsrecht der Anwaltschaft und KI (CNB)
  offizieller_titel: Arbeiten des Conseil national des barreaux (CNB) zur künstlichen Intelligenz im Anwaltsberuf
  fundstelle: null
  verfahrensnummer: null
  status: softlaw
  status_detail: 'NICHT VERIFIZIERT. Der Eintrag ist bewusst als Lücke ausgewiesen. Der Conseil national
    des barreaux ist die Berufsvertretung der französischen Anwaltschaft mit Normsetzungsbefugnis (règlement
    intérieur national, RIN). Ob und in welcher Form er zu künstlicher Intelligenz Regeln, Resolutionen
    oder Leitfäden erlassen hat, konnte nicht festgestellt werden: cnb.avocats.fr ist über den Abrufkanal
    nicht erreichbar (robots.txt-Fehler) und das Suchkontingent war erschöpft.

    '
  kurzbeschreibung: 'Platzhalter für das anwaltliche Berufsrecht. Rechtlich relevant sind in Frankreich
    vor allem drei Fragen: die Vereinbarkeit von KI-Werkzeugen mit dem Berufsgeheimnis (secret professionnel,
    Art. 66-5 der loi n° 71-1130), die Verantwortlichkeit für KI-erzeugte Schriftsätze und das Verhältnis
    zum Verbot der Richterprofilierung nach Art. 33 der loi n° 2019-222, das juristische Analysewerkzeuge
    unmittelbar betrifft.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
  anwendungsdaten: []
  themenachsen:
  - berufsrecht
  - haftung
  - datenschutz
  regelungsschwerpunkte:
  - 'Berufsgeheimnis: der Einsatz cloudbasierter KI-Werkzeuge berührt Art. 66-5 der loi n° 71-1130 (secret
    professionnel) und die Vertraulichkeit der Korrespondenz; die praktische Konsequenz ist eine Beschränkung
    auf Werkzeuge mit gesicherter Datenhaltung.'
  - 'Verhältnis zum Verbot der Richterprofilierung (Art. 33 loi 2019-222): anwaltliche Nutzung von Rechtsprechungsanalysen
    ist zulässig, die richterbezogene Auswertung nicht.'
  - Die KI-Verordnung stuft KI-Systeme, die Justizbehörden bei der Rechtsfindung unterstützen, nach Anhang
    III Nr. 8 als hochriskant ein; anwaltliche Werkzeuge fallen grundsätzlich nicht darunter, weil sie
    keine Justizbehörde unterstützen.
  dokumente: []
  sekundaerquelle_url: []
  offene_punkte:
  - VOLLSTÄNDIG UNVERIFIZIERT. Es konnte keine einzige amtliche Quelle des CNB geöffnet werden. Vor Verwendung
    des Eintrags ist eigenständig zu prüfen, ob der CNB Beschlüsse, eine Charta oder einen Leitfaden zu
    KI erlassen hat und ob das règlement intérieur national geändert wurde.
  - 'Ebenfalls zu prüfen: Arbeiten des Conseil d''État und des Ministère de la justice zur KI in der Justiz,
    Stellungnahmen der Cour de cassation, und ob es berufsrechtliche Entscheidungen zu KI-erzeugten Schriftsätzen
    gibt.'
  monitoring_quellen:
