  offizieller_titel: Décret n° 2023-939 du 11 octobre 2023 relatif aux modalités de pilotage et d'évaluation
    de l'expérimentation de traitements algorithmiques d'images légalement collectées au moyen de systèmes
    de vidéoprotection et de caméras installées sur des aéronefs
  fundstelle: JORF n°0238 du 13 octobre 2023, texte n° 9 (JORFTEXT000048197679)
  verfahrensnummer: Décret n° 2023-939
  status: anwendbar
  status_detail: 'In Kraft. Das Dekret regelt Zusammensetzung und Arbeitsweise des comité d''évaluation,
    das den gesetzlich vorgeschriebenen Evaluierungsbericht erstellt. Der Bericht wurde im Januar 2025
    vorgelegt. Der Senat hat empfohlen, das Komitee gesetzlich statt nur durch Dekret abzusichern; ob
    die LOI n° 2026-798 dem gefolgt ist, konnte nicht verifiziert werden.

    '
  kurzbeschreibung: 'Verfahrensdekret zur Begleitung der VSA-Experimentierung. Es errichtet ein pluridisziplinär
    besetztes Evaluierungskomitee aus unabhängigen Sachverständigen, Parlamentariern und Vertretern der
    einsetzenden Dienste, legt dessen Arbeitsweise fest und bestimmt, wie die Nutzung dokumentiert und
    ausgewertet wird. Das Komitee ist das institutionelle Scharnier zwischen Erprobung und gesetzgeberischer
    Entscheidung über eine Verstetigung.

    '
