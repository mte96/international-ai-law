    datum: 2026-08-20
    verifiziert: true
    quelle: https://www.legifrance.gouv.fr/eli/loi/2026/8/18/2026-798/jo/texte
    fundstelle_norm: 'LOI n° 2026-798 du 18 août 2026 (RIPOST), veröffentlicht im JORF n°0192 vom 19.08.2026,
      Texte n°5. Der Gesetzestext enthält keine Inkrafttretensbestimmung ("entre(nt) en vigueur" kommt
      im gesamten Text nicht vor); es gilt Art. 1 Abs. 1 Code civil (Tag nach der Veröffentlichung). Zuvor
      gespeichert: 19.08.2026 — Tag der Veröffentlichung.'
  anwendungsdaten:
  - datum: 2026-08-14
    was_gilt: 'Entscheidung des Conseil constitutionnel n° 2026-915 DC: teilweise Verfassungswidrigkeit;
      die VSA-Bestimmungen bleiben unangetastet.'
    verifiziert: true
    quelle: https://www.conseil-constitutionnel.fr/decision/2026/2026915DC.htm
  - datum: 2026-08-19
    was_gilt: Verkündung im JORF; die VSA-Experimentierung ist damit wieder in Kraft, in erweiterter Fassung.
    verifiziert: true
    quelle: https://www.senat.fr/dossier-legislatif/pjl25-472.html
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'Verlängerung: die Experimentierung des Art. 10 loi 2023-380 läuft bis zum 31. DEZEMBER 2030. Der
    Regierungsänderungsantrag n° 907 (eingereicht 02.07.2026, angenommen 10.07.2026) hat das Datum gegenüber
    der Beratungsfassung (2027) auf 2030 verschoben.'
  - 'Ausweitung der Orte: (a) Veranstaltungen, die wegen ihrer Besucherzahl oder ihrer Umstände besonders
    gefährdet sind — ausdrücklich einschließlich politischer Veranstaltungen; (b) Gebäude und öffentliche
    Orte, die dauerhaft oder wegen außergewöhnlicher Umstände gefährdet sind, bezeichnet durch Ministerialerlass;
    (c) deren Umfeld; (d) öffentliche Verkehrsmittel.'
  - 'Neue Staffelung der Genehmigungsdauern: ein Monat (verlängerbar) für Veranstaltungen; für dauerhaft
    gefährdete Orte die Laufzeit der zugrunde liegenden vidéoprotection-Genehmigung; drei Monate (verlängerbar)
    bei außergewöhnlichen Umständen. Das ist der eigentliche Systemwechsel: die Bindung an ein einzelnes
    Ereignis wird gelockert und durch eine ortsbezogene Dauergenehmigung ersetzt.'
  - 'Neu: VSA im privaten Einzelhandel (Art. 19 bis der Beratungsfassung, Amendement n° 844 Paul Midy
    u. a., angenommen am 10.07.2026). Versuchsweise bis zum 31.12.2027 in besonders diebstahlgefährdeten
    Geschäften, Supermärkten und Einkaufszentren; ausschließlicher Zweck ist die Diebstahlprävention durch
    Echtzeiterkennung vorbestimmter Ereignisse. Garantien: kein System biometrischer Identifizierung,
    keine Verarbeitung biometrischer Daten, keine Gesichtserkennung; ständige menschliche Aufsicht; keine
    automatisierte Einzelentscheidung; Genehmigung durch die CNIL und Konformitätsnachweis; Pflicht zur
    vorherigen Information der Öffentlichkeit.'
  - 'Systematische Bedeutung des Handelsflächen-Experiments: es verschiebt das französische Modell von
    einer rein hoheitlichen Erlaubnis auf private Verantwortliche und ersetzt die präfektorale durch eine
    datenschutzbehördliche Genehmigung. Damit entsteht neben dem sicherheitsrechtlichen ein zweiter, datenschutzrechtlich
    administrierter Erlaubnispfad.'
  - 'Keine Gesichtserkennung: das Verbot der biometrischen Identifizierung ist in beiden Regimen ausdrücklich
    beibehalten. Die im politischen Raum diskutierte Öffnung zur reconnaissance faciale hat NICHT stattgefunden.'
  - 'Verfassungsgerichtliche Behandlung: der Conseil constitutionnel hat die VSA-Bestimmungen nicht materiell
    geprüft. Sie erscheinen in der Entscheidung 2026-915 DC nur mittelbar — in Rn. 189 und 192, wo der
    Conseil den Art. 19 des ursprünglichen Entwurfs („qui modifiait le régime de la vidéosurveillance
    algorithmique“) als Anknüpfungspunkt heranzieht, um andere Bestimmungen gegen den Vorwurf des cavalier
    législatif zu verteidigen. Die Antragsteller haben die VSA-Artikel nicht angegriffen.'
  - 'Zensiert wurden: Abs. I des Art. 1 (administrative Schließung, Rn. 18), der zweite Unterabsatz des
    3° des Abs. III des Art. 1 (Pauschalgeldstrafe, Rn. 55), das 1° des Abs. I des Art. 7 (Fahrdelikt,
    Rn. 102), das 13° des Abs. I des Art. 7 (Fahrzeugvernichtung, Rn. 136) und Abs. II des Art. 14 (Delikte
    bei möblierten Touristenunterkünften, Rn. 181). Vorbehalte betreffen Art. L. 211-7-1 code de la sécurité
    intérieure (Rn. 69), Art. 38 der loi du 5 mars 2007 (Rn. 175) und Art. L. 332-16-1 A code du sport
    (Rn. 162).'
