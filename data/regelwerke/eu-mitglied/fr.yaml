- id: fr-lil-art-47
  jurisdiktion: fr
  kurztitel: Art. 47 loi Informatique et Libertés — algorithmische Verwaltungsentscheidungen
  offizieller_titel: Article 47 de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers
    et aux libertés (décision administrative individuelle prise sur le fondement d'un traitement algorithmique)
  fundstelle: Loi n° 78-17 du 6 janvier 1978, art. 47 (Fassung nach der loi n° 2018-493 du 20 juin 2018
    und der ordonnance n° 2018-1125 du 12 décembre 2018)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Art. 47 setzt Art. 22 DSGVO um und lässt für die Verwaltung eine Ausnahme
    vom Verbot der ausschließlich automatisierten Einzelentscheidung zu — unter Bedingungen, die der Conseil
    constitutionnel in der Entscheidung n° 2018-765 DC vom 12.06.2018 präzisiert und teilweise verschärft
    hat. Die Rechtsprechung zu Parcoursup (Conseil constitutionnel n° 2020-834 QPC; Conseil d''État n°
    427916) bildet die praktische Anwendungslinie.

    '
  kurzbeschreibung: 'Frankreich hat mit Art. 47 loi 78-17 eine Regelung, die es in dieser Form in kaum
    einem anderen Mitgliedstaat gibt: die Verwaltung darf Einzelentscheidungen allein auf ein algorithmisches
    Verfahren stützen, wenn drei Bedingungen erfüllt sind — die Entscheidung nennt ausdrücklich, dass
    ein Algorithmus verwendet wurde, gegen sie steht ein Verwaltungsrechtsbehelf offen, und der Verantwortliche
    muss die Verarbeitung so beherrschen, dass er sie dem Betroffenen im Einzelnen und in verständlicher
    Form erklären kann. Sensible Daten (Art. 9 DSGVO) sind ausgeschlossen. Der Conseil constitutionnel
    hat daraus ein Verbot selbstlernender Systeme in diesem Bereich abgeleitet.

    '
  inkrafttreten:
    datum: 2019-06-01
    verifiziert: true
    quelle: https://www.legifrance.gouv.fr/eli/ordonnance/2018/12/12/2018-1125/jo/texte
    fundstelle_norm: 'Art. 29 der Ordonnance n° 2018-1125 du 12 décembre 2018 (JORF n°0288 vom 13.12.2018):
      "Les dispositions de la présente ordonnance entrent en vigueur en même temps que le décret modifiant
      le décret n° 2005-1309 ..., et au plus tard le 1er juin 2019." Erst diese Ordonnance hat die loi
      Informatique et Libertés neu nummeriert; die Vorschrift trägt seit dem 01.06.2019 die Nummer 47.
      Zuvor gespeichert: 21.06.2018 (Tag der Veröffentlichung der loi n° 2018-493, die die Vorgängerfassung
      als Art. 10 LIL geändert hatte).'
  anwendungsdaten:
  - datum: 2018-06-12
    was_gilt: 'Conseil constitutionnel n° 2018-765 DC: Konformität unter Auslegungsvorbehalten; Verbot
      selbstlernender Algorithmen als alleinige Entscheidungsgrundlage.'
    verifiziert: true
    quelle: https://www.conseil-constitutionnel.fr/decision/2018/2018765DC.htm
  - datum: 2020-04-03
    was_gilt: 'Conseil constitutionnel n° 2020-834 QPC: Transparenzpflicht der Hochschulen nach Abschluss
      des Verfahrens (réserve d''interprétation, Rn. 17).'
    verifiziert: true
    quelle: https://www.conseil-constitutionnel.fr/decision/2020/2020834QPC.htm
  themenachsen:
