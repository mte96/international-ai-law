- id: fr-sante-l4001-3
  jurisdiktion: fr
  kurztitel: Art. L. 4001-3 CSP — KI-gestützte Medizinprodukte
  offizieller_titel: Article L. 4001-3 du code de la santé publique (recours à un dispositif médical comportant
    un traitement de données algorithmique dont l'apprentissage a été réalisé à partir de données massives)
  fundstelle: Code de la santé publique, art. L. 4001-3; eingefügt durch die loi n° 2021-1017 du 2 août
    2021 relative à la bioéthique
  verfahrensnummer: Loi n° 2021-1017 du 2 août 2021, art. 17
  status: anwendbar
  status_detail: 'Geltendes Recht, aber NICHT am amtlichen Text verifizierbar. Die Vorschrift ist die
    einzige allgemeine Norm des französischen Gesundheitsrechts, die den Einsatz lernender Systeme in
    der Versorgung adressiert. Die Zuständigkeit für die Marktüberwachung von KI-Medizinprodukten nach
    der KI-Verordnung ist in Frankreich umstritten: der Benennungsplan von DGE und DGCCRF weist Anhang-I-Systeme
    den produktrechtlich zuständigen Behörden zu, also für Medizinprodukte der ANSM; die CNIL ist zugleich
    für biometrische und beschäftigungsbezogene Anwendungen zuständig.

    '
  kurzbeschreibung: 'Die Norm verlangt, dass der Patient über den Einsatz eines Medizinprodukts mit algorithmischer
    Datenverarbeitung, dessen Training auf Massendaten beruht, informiert wird, dass die Angehörigen der
    Gesundheitsberufe Zugang zu den Ergebnisdaten und zu den Angaben zur Funktionsweise erhalten und dass
    die Rückverfolgbarkeit der Handlungen sichergestellt ist. Sie ist Ausdruck des französischen „garantie
    humaine“-Konzepts: die ärztliche Entscheidungshoheit bleibt unberührt, das System ist Hilfsmittel.

    '
  inkrafttreten:
    datum: 2021-08-04
    verifiziert: true
    quelle: https://www.legifrance.gouv.fr/eli/loi/2021/8/2/2021-1017/jo/texte
    fundstelle_norm: Art. 17 der LOI n° 2021-1017 du 2 août 2021 relative à la bioéthique fügt Art. L.
      4001-3 CSP ein. Veröffentlichung im JORF n°0178 vom 03.08.2021, Texte n°1; für Art. 17 ist keine
      abweichende Inkrafttretensbestimmung vorgesehen, daher Art. 1 Abs. 1 Code civil (Tag nach der Veröffentlichung).
  anwendungsdaten: []
  themenachsen:
  - sektor-medizin
  - grundrechte
  - haftung
  - datenschutz
  regelungsschwerpunkte:
  - Informationspflicht gegenüber dem Patienten über den Einsatz eines lernenden Medizinprodukts.
  - Zugang der Gesundheitsberufe zu den Ergebnisdaten und zu Angaben über die Funktionsweise des Systems
    („garantie humaine“).
  - Rückverfolgbarkeit der auf das System gestützten Handlungen und der daraus resultierenden Daten.
  - 'Verhältnis zur KI-Verordnung: KI-Medizinprodukte sind über Anhang I KI-VO in Verbindung mit der Medizinprodukteverordnung
    (EU) 2017/745 hochriskant. Art. L. 4001-3 CSP ergänzt die unionsrechtlichen Pflichten um eine nationale
    Informations- und Nachvollziehbarkeitspflicht im Behandlungsverhältnis; die Norm richtet sich an die
    Anwender, nicht an die Hersteller.'
  - 'Zuständigkeitskonflikt: welche Behörde die Marktüberwachung für KI-Medizinprodukte ausübt (ANSM als
    Produktbehörde oder die CNIL für datenschutzsensible Anwendungen), ist im französischen Benennungsplan
    nicht eindeutig geklärt.'
