- id: fr-loi-2019-222-art-33
  jurisdiktion: fr
  kurztitel: Art. 33 loi 2019-222 — Verbot der Analyse richterlicher Entscheidungen zur Profilbildung
  offizieller_titel: Article 33 de la loi n° 2019-222 du 23 mars 2019 de programmation 2018-2022 et de
    réforme pour la justice (open data des décisions de justice; interdiction de la réutilisation des
    données d'identité des magistrats et des greffiers)
  fundstelle: LOI n° 2019-222 du 23 mars 2019, art. 33; Décision n° 2019-778 DC du 21 mars 2019
  verfahrensnummer: Projet de loi de programmation 2018-2022 et de réforme pour la justice; saisine n°
    2019-778 DC
  status: anwendbar
  status_detail: 'Geltendes Recht und ein europäischer Sonderfall. Art. 33 regelt die Veröffentlichung
    der Gerichtsentscheidungen als open data und verbietet zugleich, die Identitätsdaten von Richtern
    und Geschäftsstellenbeamten mit dem Ziel oder der Wirkung wiederzuverwenden, ihre beruflichen Praktiken
    zu bewerten, zu analysieren, zu vergleichen oder vorherzusagen. Der Conseil constitutionnel hat das
    Verbot am 21.03.2019 gebilligt (Rn. 93-95); zensiert wurde eine andere Bestimmung des Artikels (Rn.
    106-108).

    '
  kurzbeschreibung: 'Frankreich hat als bislang einziger Staat Europas die Richterprofilierung durch Rechtsprechungsanalyse
    strafbewehrt untersagt. Adressat ist, wer die veröffentlichten Gerichtsentscheidungen weiterverwendet
    — also gerade die Anbieter von legal analytics und juristischen KI-Systemen. Verboten ist die Wiederverwendung
    der Identitätsdaten von Magistraten und Greffiers, wenn sie darauf zielt oder dazu führt, deren Berufspraxis
    zu bewerten, zu analysieren, zu vergleichen oder vorherzusagen. Der Conseil constitutionnel begründet
    das mit der Gefahr von Druck auf die Justiz und von Strategien der Gerichtswahl. Die Norm ist der
    Grund, warum in Frankreich „jurimetrie“ nur ohne Richterbezug betrieben werden darf.

    '
