- id: fr-decret-2023-828
  jurisdiktion: fr
  kurztitel: Décret VSA — acht detektierbare Ereignisse und technische Anforderungen
  offizieller_titel: Décret n° 2023-828 du 28 août 2023 relatif aux modalités de mise en œuvre des traitements
    algorithmiques sur les images collectées au moyen de systèmes de vidéoprotection et de caméras installées
    sur des aéronefs, pris en application de l'article 10 de la loi n° 2023-380 du 19 mai 2023 relative
    aux jeux Olympiques et Paralympiques de 2024 et portant diverses autres dispositions
  fundstelle: JORF n°0200 du 30 août 2023, texte n° 9 (JORFTEXT000048007135); 16 Artikel
  verfahrensnummer: 'Décret n° 2023-828; Avis der CNIL: Délibération n° 2023-068 du 15 juin 2023'
  status: anwendbar
  status_detail: 'In Kraft. Das Dekret ist die eigentliche Konkretisierung des Erlaubnisregimes: es benennt
    abschließend die acht Ereignisse, stellt Anforderungen an Entwurf, Trainingsdaten, Protokollierung
    und menschliche Aufsicht und regelt die Betroffenenrechte. Ob es an die durch die LOI n° 2026-798
    erweiterte Fassung des Art. 10 angepasst wird, ist bis zum Rechercheschluss offen.

    '
  kurzbeschreibung: 'Das Dekret setzt Art. 10 der loi 2023-380 um. Art. 1 legt den ausschließlichen Zweck
    fest: Erkennung vorbestimmter Ereignisse in Echtzeit, die Risiken terroristischer Handlungen oder
    schwerer Gefahren für die Sicherheit von Personen anzeigen oder offenlegen. Art. 3 zählt die acht
    detektierbaren Ereignisse abschließend auf. Weitere Artikel regeln Anforderungen an Entwurf und Trainingsdaten,
    die automatische Protokollierung, die dauerhafte menschliche Aufsicht sowie die Information der betroffenen
    Personen und ihre Rechte. Art. 10 macht deutlich, wie eng der Betroffenenschutz ausfällt: Auskunft,
    Berichtigung und Einschränkung nach Art. 15, 16 und 18 DSGVO bleiben, das WIDERSPRUCHSRECHT nach Art.
    21 DSGVO ist dagegen auf der Grundlage von Art. 23 DSGVO ausgeschlossen.

    '
