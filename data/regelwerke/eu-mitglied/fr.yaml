  - datum: 2026-01-30
    typ: endfassung
    titel: Conseil d'État, 10e et 9e chambres réunies, 30 janvier 2026, n° 506370, Commune de Nice c/
      CNIL (ECLI:FR:CECHR:2026:506370.20260130)
    url: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2026-01-30/506370
    sprache: fr
    urheber: Conseil d'État
    verifiziert: true
    notiz: 'Der juristisch wichtigste Gegenbeweis: Art. L. 251-2 code de la sécurité intérieure erlaubt
      zwar die Videoüberwachung des öffentlichen Raums, „ne saurait être interprété comme autorisant la
      mise en œuvre de traitements algorithmiques“; eine andere Rechtsgrundlage gibt es nicht. Die Klage
      der Stadt Nizza gegen die ablehnende Haltung der CNIL zum Algorithmus „Zone d''intrusion entrées
      des écoles“ wird abgewiesen. Ohne Art. 10 loi 2023-380 ist VSA in Frankreich also schlicht verboten.'
  offene_punkte:
  - Der Wortlaut des Art. 10 in seiner heute geltenden Fassung konnte nicht im amtlichen Volltext geöffnet
    werden (Légifrance-Sperre). Die Angaben zu Absatzgliederung, Genehmigungsdauer und Nutzerkreis stammen
    aus dem Evaluierungsbericht, dem Senatsbericht und der Entscheidung 2023-850 DC.
  - Die JORF-Fundstelle (JO n° 116 vom 20.05.2023) ist über die amtliche Liste der 2023 verkündeten Gesetze
    des Senats bestätigt. Die Textkennung JORFTEXT000047561974 ist dagegen NICHT verifiziert; sie stammt
    aus dem Auftrag.
  - Das angegebene Datum ist das der Verkündung. Ob Art. 10 abweichende Inkrafttretensregeln hatte, ist
    nicht geprüft; praktisch anwendbar wurde er erst mit dem Décret n° 2023-828 am 29.08.2023.
  - Ob und wann nach dem 19.08.2026 die ersten neuen präfektoralen Genehmigungen ergangen sind, ist offen.
    Für die erweiterten Anwendungsorte fehlt noch der Ministerialerlass (arrêté), der sie bezeichnet.
  - Ob das Durchführungsdekret 2023-828 an die erweiterte Fassung angepasst wird (neue Ereignisliste?
    Einbeziehung der Verkaufsflächen?), ist offen.
