  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Ausnahme vom Verbot der automatisierten Einzelentscheidung für Verwaltungsakte, gebunden an drei
    kumulative Bedingungen: ausdrückliche Nennung des algorithmischen Fundaments in der Entscheidung,
    Eröffnung eines Verwaltungsrechtsbehelfs, Beherrschbarkeit und Erklärbarkeit der Verarbeitung.'
  - 'Auslegungsvorbehalt des Conseil constitutionnel (n° 2018-765 DC, Rn. 71): der Verantwortliche muss
    „la maîtrise du traitement algorithmique et de ses évolutions“ sicherstellen, um ihn „en détail et
    sous une forme intelligible“ erklären zu können. Daraus folgt: Algorithmen, die ihre eigenen Regeln
    ohne Kontrolle und Validierung des Verantwortlichen ändern können, dürfen NICHT alleinige Grundlage
    einer Verwaltungsentscheidung sein.'
  - 'Juristische Tragweite: das ist ein verfassungsrechtliches Verbot selbstlernender Systeme im Verwaltungsverfahren
    — mehrere Jahre vor der KI-Verordnung und schärfer als deren Art. 14 (menschliche Aufsicht), weil
    es an der Erklärbarkeit und nicht an der Aufsicht ansetzt.'
  - 'Weitere Garantien (Rn. 70): keine ausschließlich automatisierte Entscheidung auf der Grundlage sensibler
    Daten; im Rechtsbehelfsverfahren darf sich die Behörde nicht allein auf den Algorithmus stützen.'
  - 'Parcoursup als Anwendungsfall: Conseil constitutionnel n° 2020-834 QPC vom 03.04.2020 zum letzten
    Absatz des Art. L. 612-3 I code de l''éducation — konform unter dem Vorbehalt (Rn. 17), dass die Hochschulen
    nach Abschluss des Zulassungsverfahrens die Kriterien veröffentlichen, nach denen die Bewerbungen
    geprüft wurden, unter Angabe des Einsatzes von Algorithmen.'
  - 'Conseil d''État, 12.06.2019, n° 427916, Université des Antilles c/ UNEF: die bildungsrechtliche Sonderregel
    verdrängt die allgemeine Transparenzpflicht; ein Anspruch Dritter auf Offenlegung der „algorithmes
    locaux“ und des Quellcodes besteht nicht, der Zugang ist auf die Bewerber beschränkt. Die Entscheidung
    ist der Grund dafür, dass der Conseil constitutionnel 2020 nachsteuern musste.'
  - 'Spannungsverhältnis: Frankreich hat damit zwei gegenläufige Linien — eine strenge Erklärbarkeitsanforderung
    an die Verwaltung (2018) und eine enge Auslegung des Zugangsrechts Dritter zu den Algorithmen (2019),
    abgemildert durch eine nachträgliche Veröffentlichungspflicht (2020).'
