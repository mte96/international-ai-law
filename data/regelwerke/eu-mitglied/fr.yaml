  regelungsschwerpunkte:
  - 'Neuer Art. L. 331-4-1 CPI: „Sauf preuve contraire, […] l''œuvre ou l''objet protégé […] est présumé
    avoir été utilisé par le fournisseur du modèle ou du système d''intelligence artificielle, dès lors
    qu''un indice“ die Nutzung wahrscheinlich macht.'
  - 'Indizien nach der Ausschussbegründung: Erzeugung von Inhalten in der Manier eines bestimmten Urhebers,
    Regurgitation von Werkauszügen, technische Sachverständigenfeststellungen.'
  - 'Wirkung: eine „présomption simple ou réfragable“ — der Anbieter kann sie widerlegen, muss dazu aber
    offenlegen, womit er trainiert hat. Die Norm wirkt damit mittelbar als Transparenzhebel, ohne eine
    Transparenzpflicht zu statuieren.'
  - 'Verfassungsrechtliche Absicherung: der Senat hat den Conseil d''État um eine Stellungnahme ersucht
    (Ergebnis am 23.03.2026 mitgeteilt); erst danach hat der Ausschuss den Text einstimmig angenommen.
    Das ist der seltene Fall einer parlamentarischen Initiative mit vorheriger Prüfung durch den Conseil
    d''État nach Art. 39 Abs. 5 der Verfassung.'
  - 'Verhältnis zum Unionsrecht: die Vermutung greift nicht in die TDM-Schranke ein, sondern in das Beweisrecht.
    Ob das mit dem unionsrechtlichen Grundsatz der Verhältnismäßigkeit und mit Art. 53 KI-VO vereinbar
    ist, ist die zentrale Streitfrage.'
  - 'Kammerübergreifende Einstimmigkeit: sowohl der Senatsausschuss als auch der Ausschuss der Assemblée
    haben den Text einstimmig bzw. unverändert angenommen — ein für dieses Parlament ungewöhnlicher Befund
    und ein Indiz dafür, dass die Initiative Gesetz werden könnte.'
