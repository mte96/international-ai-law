- id: fr-loi-2024-449
  jurisdiktion: fr
  kurztitel: Loi SREN — Deepfake-Strafrecht und Regulierung des digitalen Raums
  offizieller_titel: LOI n° 2024-449 du 21 mai 2024 visant à sécuriser et à réguler l'espace numérique
  fundstelle: JORF n° 0119 du 22 mai 2024 (JORFTEXT000049563368)
  verfahrensnummer: Projet de loi SREN; Décision n° 2024-866 DC du 17 mai 2024
  status: anwendbar
  status_detail: 'In Kraft. Das Gesetz ist Frankreichs Anpassungs- und Ergänzungsgesetz zum digitalen
    Binnenmarktrecht (DSA, DMA, Data Governance Act) und enthält zugleich die beiden einzigen genuin KI-bezogenen
    Straftatbestände des französischen Rechts: die Ergänzung des Art. 226-8 code pénal um algorithmisch
    erzeugte Inhalte und den neuen Art. 226-8-1 code pénal für sexuelle Deepfakes. Der Conseil constitutionnel
    hat die Deepfake-Artikel nicht geprüft — sie waren nicht angegriffen.

    '
  kurzbeschreibung: 'Die Deepfake-Vorschriften folgen einer zweistufigen Logik. Erste Stufe (Art. 226-8
    c.p.): wer einen algorithmisch erzeugten visuellen oder akustischen Inhalt, der das Bild oder die
    Stimme einer Person wiedergibt, ohne deren Einwilligung öffentlich zugänglich macht, macht sich strafbar,
    WENN nicht offensichtlich ist oder ausdrücklich angegeben wird, dass der Inhalt algorithmisch erzeugt
    wurde. Der Straftatbestand knüpft also an die fehlende KENNZEICHNUNG an, nicht an die Erzeugung. Zweite
    Stufe (Art. 226-8-1 c.p.): bei Inhalten sexuellen Charakters entfällt die Kennzeichnungslogik vollständig
    — hier ist bereits die Verbreitung ohne Einwilligung strafbar, auch wenn offen erklärt wird, dass
    es sich um eine KI-Erzeugung handelt. In beiden Fällen erhöht sich der Strafrahmen, wenn die Tat über
    einen Online-Kommunikationsdienst begangen wird. Adressat ist, wer verbreitet; Anbieter von KI-Systemen
    werden nicht erfasst.

    '
  inkrafttreten:
    datum: 2024-05-23
    verifiziert: true
    quelle: https://www.legifrance.gouv.fr/eli/loi/2024/5/21/2024-449/jo/texte
    fundstelle_norm: 'LOI n° 2024-449 du 21 mai 2024 (SREN), veröffentlicht im JORF n°0117 vom 22.05.2024,
      Texte n°2. Das Gesetz enthält keine allgemeine Inkrafttretensbestimmung; es gilt Art. 1 Abs. 1 Code
      civil (Tag nach der Veröffentlichung). Zuvor gespeichert: 22.05.2024 — das ist der Tag der Veröffentlichung,
      nicht des Inkrafttretens.'
  anwendungsdaten:
  - datum: 2024-05-17
    was_gilt: 'Décision n° 2024-866 DC: Teilzensuren (Art. 10, 11, 18, 19, 58); die Deepfake-Vorschriften
      bleiben unberührt.'
    verifiziert: true
    quelle: https://www.conseil-constitutionnel.fr/decision/2024/2024866DC.htm
  - datum: 2024-05-22
    was_gilt: Inkrafttreten; die neuen Straftatbestände gelten ab Verkündung.
    verifiziert: false
    quelle: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000049563368
  themenachsen:
  - content
  - haftung
  - grundrechte
  - datenschutz
  - marktzugang
  regelungsschwerpunkte:
  - 'Art. 226-8 code pénal (ergänzt): Erweiterung des klassischen „montage“-Tatbestands auf „un contenu
    visuel ou sonore généré par un traitement algorithmique et représentant l''image ou les paroles d''une
    personne“. Strafbar ist die Verbreitung ohne Einwilligung, sofern die algorithmische Erzeugung nicht
    offensichtlich ist oder nicht ausdrücklich angegeben wird. Grundstrafrahmen ein Jahr Freiheitsstrafe
    und 15.000 Euro Geldstrafe; bei Begehung über einen Online-Kommunikationsdienst zwei Jahre und 45.000
    Euro.'
  - 'Art. 226-8-1 code pénal (neu): sexuelle Deepfakes. Strafbar ist bereits die Verbreitung eines „contenu
    à caractère sexuel généré par un traitement algorithmique“ ohne Einwilligung — die Kennzeichnung entlastet
    NICHT. Strafrahmen zwei Jahre und 60.000 Euro, bei Begehung über einen Online-Kommunikationsdienst
    drei Jahre und 75.000 Euro.'
  - 'Dogmatische Pointe: Frankreich löst das Deepfake-Problem nicht über ein KI-Regulierungsgesetz, sondern
    über das Persönlichkeitsschutzstrafrecht des Kapitels „atteintes à la vie privée“. Schutzgut ist das
    Recht am eigenen Bild und an der eigenen Stimme, nicht die Integrität des Informationsraums. Deshalb
    gibt es keinen Anbieterbezug und keine Plattformpflicht in diesen Normen.'
  - 'Verhältnis zu Art. 50 KI-VO: die französische Kennzeichnungslogik des Art. 226-8 c.p. ist strafrechtlich,
    adressiert den Verbreiter und schützt individuelle Rechtsgüter; die Transparenzpflicht des Art. 50
    KI-VO ist aufsichtsrechtlich, adressiert Anbieter und Betreiber und schützt die Allgemeinheit. Die
    Normen laufen nebeneinander; ein Vorrang ist nicht geregelt.'
  - 'Art. 6 SREN: Bericht der Regierung binnen sechs Monaten über eine Ausweitung der Befugnisse des OCLCTIC
    (Löschungsanordnungen) auf Inhalte, die unmenschliche oder erniedrigende Behandlungen, Vergewaltigung
    und Inzest darstellen — flankierender Rechtsrahmen für die Bekämpfung synthetischer Missbrauchsinhalte.'
  - 'Art. 31 SREN: Schutz strategischer und sensibler Daten beim Einsatz privater Cloud-Dienste durch
    die staatliche Verwaltung. Erfasst werden Daten, die dem Geheimschutz unterliegen oder wesentliche
    Staatsfunktionen betreffen (Sicherheit, öffentliche Ordnung, Gesundheit); der Dienst muss vor dem
    Zugriff drittstaatlicher Behörden schützen. Für KI-Beschaffungen der Verwaltung ist das die praktisch
    wichtigste Souveränitätsnorm des Gesetzes; ein Dekret sollte binnen sechs Monaten die Modalitäten
    und befristete Ausnahmen (höchstens 18 Monate) regeln.'
  - 'Weitere KI-relevante Teile: Altersverifikation für pornografische Dienste (Art. 1 und 2, vom Conseil
    constitutionnel gebilligt) — praktisch nur mit algorithmischer Altersschätzung umsetzbar; Art. 42
    mit einem Auslegungsvorbehalt gegen Gesichtserkennung; Strafverschärfung bei Online-Sextortion (Art.
    17).'
  - 'Zensiert: Art. 10 und 11 (digitale Identität), Art. 18 (Mediationsexperiment), Art. 19 (délit d''outrage
    en ligne, Art. 222-33-1-2 c.p. — Verstoß gegen die Meinungsfreiheit), Art. 58 (Statistikgeheimnis).
    Art. 19 ist für das KI-Recht mittelbar relevant, weil damit der Versuch scheiterte, Online-Äußerungsdelikte
    neu zu fassen.'
