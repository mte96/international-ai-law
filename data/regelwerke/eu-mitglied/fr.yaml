- id: fr-strategie-nationale-ia
  jurisdiktion: fr
  kurztitel: Stratégie nationale pour l'IA und Rapport der Commission de l'IA
  offizieller_titel: 'Stratégie nationale pour l''intelligence artificielle (France 2030) und Rapport
    de la Commission de l''intelligence artificielle « IA : notre ambition pour la France » (mars 2024)'
  fundstelle: economie.gouv.fr, Seite zur stratégie nationale pour l'intelligence artificielle, Stand
    07.02.2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Politische Strategie ohne Bindungswirkung, aber prägend für die französische Haltung
    in der europäischen Rechtsetzung: Frankreich versteht KI-Politik primär als Industrie- und Souveränitätspolitik
    und hat deshalb bewusst auf ein nationales KI-Horizontalgesetz verzichtet. Der Bericht der Commission
    de l''intelligence artificielle vom März 2024 mit 25 Empfehlungen konnte nicht an einer amtlichen
    Quelle verifiziert werden.

    '
  kurzbeschreibung: 'Die nationale KI-Strategie läuft in drei Phasen: 2018-2022 mit rund 1,5 Milliarden
    Euro Schwerpunkt Forschung; 2022-2025 Schwerpunkt Verbreitung in der Wirtschaft mit den drei Achsen
    Ausbildung, Forschung und Förderung des KI-Angebots (560 Millionen Euro für Forschung und Ausbildung);
    ab Februar 2025 eine dritte Phase mit vier Prioritäten: Recheninfrastruktur, Talente, Beschleunigung
    der Nutzung und vertrauenswürdige KI. Insgesamt sind rund 2,5 Milliarden Euro aus dem Plan France
    2030 vorgesehen. Die Steuerung liegt beim SGPI; nationaler KI-Koordinator ist Guillaume Avrin; seit
    September 2023 besteht ein Ausschuss zur generativen KI.

