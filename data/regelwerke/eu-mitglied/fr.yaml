- id: fr-ppl-verzelen-vsa
  jurisdiktion: fr
  kurztitel: PPL Verzelen — Verallgemeinerung der vidéoprotection algorithmique
  offizieller_titel: Proposition de loi visant à généraliser la vidéoprotection algorithmique
  fundstelle: Sénat, texte n° 609 (2025-2026), déposé le 12 mai 2026
  verfahrensnummer: PPL n° 609 (2025-2026); dossier législatif ppl25-609
  status: verfahren
  status_detail: 'Am 12.05.2026 von Pierre-Jean Verzelen und zwölf weiteren Senatoren eingereicht. Das
    Dossier weist bis zum letzten Stand (18.06.2026) nur die Einreichung und die Zuleitung zur ersten
    Lesung aus; eine Ausschussberatung, ein Bericht oder eine Abstimmung sind nicht verzeichnet. Der Vorstoß
    ist durch die LOI n° 2026-798 vom 18.08.2026 politisch überholt, aber nicht erledigt: er zielt auf
    die dauerhafte Verankerung, die das RIPOST-Gesetz gerade NICHT vorgenommen hat.

    '
  kurzbeschreibung: 'Einartikelgesetz, das die algorithmische Videoüberwachung aus dem Experimentierstadium
    herausholen und dauerhaft im code de la sécurité intérieure verankern soll. Vorgesehen ist ein neuer
    Art. L. 251-1-1 CSI, der den Einsatz von KI-Systemen zur Echtzeiterkennung vorbestimmter Ereignisse
    auf den ohnehin erhobenen Bildern der vidéoprotection erlaubt, die Ausgestaltung einem Dekret überlässt,
    die CNIL einbindet und die Anwendung vor Ort an eine präfektorale Entscheidung knüpft. Der Text hält
    ausdrücklich am Biometrieverbot fest.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.senat.fr/dossier-legislatif/ppl25-609.html
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Neuer Art. L. 251-1-1 code de la sécurité intérieure: dauerhafte Rechtsgrundlage statt befristeter
    Experimentierung. Damit würde die Konstruktion des Art. 10 loi 2023-380 (Sonderregime auf Zeit) in
    das allgemeine Sicherheitsrecht überführt.'
  - 'Abs. III des vorgeschlagenen Art. L. 251-1-1: „n''utilisent aucun système d''identification biométrique,
    ne traitent aucune donnée biométrique et ne mettent en œuvre aucune technique de reconnaissance faciale“
    — das Biometrieverbot wird also auch für den Dauerzustand beibehalten.'
  - 'Regelungstechnik: Rahmennorm mit Verweisung auf ein Regierungsdekret; Kontrolle durch die CNIL; Einzelanwendung
    durch den Präfekten. Der Gesetzgeber gäbe damit erheblich mehr Ausgestaltungsspielraum an die Exekutive
    ab, als Art. 10 loi 2023-380 es tut.'
  - 'Politische Funktion: der Text ist der senatorische Gegenentwurf zur Verlängerungslogik. Der Bericht
    n° 374 der commission des lois hatte im Februar 2025 ausdrücklich empfohlen, VOR jeder Verstetigung
    zu verlängern; die PPL Verzelen will die Verstetigung sofort.'
