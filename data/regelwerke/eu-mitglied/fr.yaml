regelwerke:
- id: fr-loi-2023-380
  jurisdiktion: fr
  kurztitel: Art. 10 loi JO 2024 — Experiment der algorithmischen Videoüberwachung (VSA)
  offizieller_titel: LOI n° 2023-380 du 19 mai 2023 relative aux jeux Olympiques et Paralympiques de 2024
    et portant diverses autres dispositions, article 10
  fundstelle: JORF n° 0116 du 20 mai 2023, texte n° 4 (JORFTEXT000047561974)
  verfahrensnummer: Projet de loi n° 220 (Sénat, 2022-2023); T.A. n° 106 (Assemblée nationale, 12.04.2023);
    saisine n° 2023-850 DC
  status: anwendbar
  status_detail: 'In Kraft und anwendbar, aber in stark veränderter Gestalt. Die ursprüngliche Befristung
    (31.03.2025) ist abgelaufen; zwischen dem 01.04.2025 und dem 19.08.2026 bestand keine Rechtsgrundlage
    für neue Genehmigungen, weil der Conseil constitutionnel die erste Verlängerung am 24.04.2025 als
    cavalier législatif zensiert hatte (Décision n° 2025-878 DC). Art. 19 der LOI n° 2026-798 du 18 août
    2026 („RIPOST“) hat das Experiment reaktiviert, bis zum 31.12.2030 verlängert und den Anwendungsbereich
    erweitert.

    '
  kurzbeschreibung: 'Art. 10 erlaubt versuchsweise, die von Videoüberwachungsanlagen und von Drohnen rechtmäßig
    erhobenen Bilder durch algorithmische Verfahren in Echtzeit auszuwerten, um „événements prédéterminés“
    zu erkennen, die auf Terrorismus oder auf schwere Gefahren für die Sicherheit von Personen hindeuten.
    Adressaten sind die nationale Polizei und Gendarmerie, die Militärpolizei, die Feuerwehr- und Rettungsdienste,
    die städtischen Polizeien sowie die Verkehrsunternehmen (SNCF, RATP) und ihre Sicherheitsdienste.
    Die Verarbeitung ist nur nach Einzelgenehmigung des Präfekten zulässig, darf ausschließlich Hinweise
    („signalements“) erzeugen und keine Entscheidung selbst treffen; biometrische Identifizierung, Gesichtserkennung
    und der Abgleich mit anderen Dateien sind ausdrücklich untersagt. Eine eigene Sanktion enthält Art.
    10 nicht; Verstöße unterliegen dem allgemeinen Datenschutzstrafrecht (Art. 226-16 ff. code pénal)
    und den Befugnissen der CNIL.

    '
  inkrafttreten:
    datum: 2023-05-20
    verifiziert: true
    quelle: https://www.senat.fr/dossiers-legislatifs/lois-promulguees-2023.html
  anwendungsdaten:
  - datum: 2023-08-29
    was_gilt: 'Inkrafttreten des Décret n° 2023-828: erst ab jetzt sind Genehmigungen praktisch möglich,
      weil die acht detektierbaren Ereignisse und die technischen Anforderungen feststehen.'
    verifiziert: true
    quelle: https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000048007147
  - datum: 2025-03-31
    was_gilt: Ablauf der ursprünglichen Befristung der Experimentierung.
    verifiziert: true
    quelle: https://www.vie-publique.fr/files/rapport/pdf/297322.pdf
  - datum: 2026-08-19
    was_gilt: Verlängerung bis 31.12.2030 und Ausweitung des Anwendungsbereichs durch die LOI n° 2026-798
      (RIPOST).
    verifiziert: true
    quelle: https://www.assemblee-nationale.fr/dyn/17/amendements/2984/AN/907
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'Systemstellung: Art. 10 ist eine POSITIVE ERLAUBNISNORM, keine Aufsichtsnorm. Er schafft die Rechtsgrundlage,
    ohne die die algorithmische Auswertung von Bildern des öffentlichen Raums nach französischem Recht
    unzulässig wäre — das hat der Conseil d''État am 30.01.2026 (n° 506370, Ville de Nice) ausdrücklich
    bestätigt. Damit ist das französische Modell die Gegenfigur zu Art. 5 KI-VO: nicht Verbot mit Ausnahmen,
    sondern Verbot durch Schweigen des Gesetzes mit einer befristeten, eng umgrenzten Erlaubnis.'
  - 'Zweckbindung (Abs. I): nur Prävention terroristischer Handlungen und schwerer Gefahren für die Sicherheit
    von Personen. Ereignisbezogen, nicht personenbezogen.'
  - 'Genehmigungsvorbehalt: Genehmigung durch den Präfekten (in Paris: préfet de police) durch begründeten,
    veröffentlichten arrêté; Geltungsdauer höchstens ein Monat, verlängerbar bei Fortbestehen der Voraussetzungen.'
  - 'Réserve d''interprétation des Conseil constitutionnel (Décision n° 2023-850 DC, Rn. 39): die Genehmigung
    MUSS unverzüglich beendet werden, sobald ihre Voraussetzungen entfallen; ein bloßes Ermessen zur Aussetzung
    genügt nicht.'
  - 'Absolutes Biometrieverbot: kein System biometrischer Identifizierung, keine Verarbeitung biometrischer
    Daten, keine Gesichtserkennung, kein Abgleich mit anderen Verarbeitungen oder Dateien. Dieses Verbot
    ist der Grund, warum das Regime nicht unter das Verbot des Art. 5 Abs. 1 lit. h KI-VO (biometrische
    Fernidentifizierung in Echtzeit) fällt.'
  - 'Verbot der automatisierten Einzelentscheidung: die Verarbeitung darf keine eigenständige Entscheidung
    und keine Zwangsmaßnahme auslösen; sie erzeugt nur „signalements“, über die ein Mensch befindet.'
  - 'Menschliche Aufsicht: ständige Überwachung durch eigens ermächtigte, geschulte und namentlich benannte
    Bedienstete; die Beschäftigten der Verkehrsunternehmen dürfen nur unter Aufsicht handeln.'
  - 'Transparenz: Information der Öffentlichkeit über den Einsatz, außer wenn dies dem Zweck zuwiderliefe;
    die Genehmigungen des Präfekten sind zu veröffentlichen. Der Evaluierungsbericht rügt, dass die Veröffentlichung
    teils verspätet erfolgte.'
  - 'Rolle der CNIL: Anhörung vor Erlass des Durchführungsdekrets (Délibération n° 2023-068 vom 15.06.2023);
    Datenschutz-Folgenabschätzung (AIPD) für jede Verarbeitung; Kontrollbefugnis. Die CNIL hat neun Kontrollen
    durchgeführt — sechs während, drei nach den Spielen — und dabei die Einhaltung der gesetzlichen Anwendungsfälle
    geprüft.'
  - 'Evaluierung: gesetzlich vorgeschriebenes, pluridisziplinär besetztes comité d''évaluation (Zusammensetzung
    und Arbeitsweise geregelt im Décret n° 2023-939 vom 11.10.2023); Bericht im Januar 2025 vorgelegt.'
  - 'Ergebnis der Evaluierung: sehr uneinheitliche Erkennungsleistung — brauchbar bei Eindringen in Sperrzonen,
    Bewegung entgegen der Fahrtrichtung und Personendichte; unsicher bei Menschenansammlungen, verlassenen
    Gegenständen und Waffen; sehr unbefriedigend bei Brandausbruch und Person am Boden. Operativer Nutzen
    während der Spiele „sehr begrenzt“, weil ohnehin sehr viele Kräfte vor Ort waren.'
  - 'Anbieter: Wintics (Los Île-de-France und Verkehrsbetriebe), Videtics (Cannes, begrenzt), Chapsvision
    (nicht praktisch eingesetzt) — der Markt ist also faktisch von einem einzigen Anbieter geprägt.'
