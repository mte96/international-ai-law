  regelungsschwerpunkte:
  - 'Verbotstatbestand: Wiederverwendung der Identitätsdaten von Magistraten und Greffiers mit dem Ziel
    oder der Wirkung, ihre beruflichen Praktiken zu bewerten, zu analysieren, zu vergleichen oder vorherzusagen
    („évaluation, analyse, comparaison ou prédiction de leurs pratiques professionnelles“).'
  - 'Verfassungsgerichtliche Begründung (Rn. 93-95): Zweck ist die Verhinderung der Profilbildung von
    Justizangehörigen durch Datenauswertung, die Druck erzeugen oder Strategien der Gerichtswahl begünstigen
    könnte. Kein Verstoß gegen den Gleichheitssatz und gegen das Recht auf ein faires Verfahren.'
  - 'Teilzensur (Rn. 106-108): das 2° des Abs. V (Beschränkung der Ausfertigung auf den Tenor bei nichtöffentlicher
    Verhandlung) ist verfassungswidrig, weil zu pauschal und ohne Verhältnismäßigkeitsprüfung im Einzelfall.'
  - 'Rechtsvergleichende Bedeutung: die Norm ist die schärfste Beschränkung juristischer Datenanalyse
    in Europa und steht in unmittelbarem Spannungsverhältnis zu Anhang III Nr. 8 KI-VO, der KI-Systeme
    in der Rechtspflege als hochriskant einstuft, sie aber nicht verbietet. Frankreich verbietet also
    einen Anwendungsfall, den die KI-VO nur reguliert.'
  - 'Praktische Folge: französische legal-tech-Angebote arbeiten mit anonymisierten Spruchkörpern; Auswertungen
    nach einzelnen Richtern sind unzulässig, auch wenn die Entscheidungen öffentlich zugänglich sind.'
