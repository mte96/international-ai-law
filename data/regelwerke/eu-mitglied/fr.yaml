  offene_punkte:
  - 'Die eigenen Veröffentlichungen der ACPR zu künstlicher Intelligenz (Diskussionspapiere, Aufsichtserwartungen,
    Berichte des Pôle Fintech-Innovation) konnten NICHT ermittelt werden: acpr.banque-france.fr antwortet
