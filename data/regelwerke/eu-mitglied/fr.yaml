- id: fr-finanzaufsicht-ia
  jurisdiktion: fr
  kurztitel: ACPR und AMF — KI in der Finanzaufsicht
  offizieller_titel: 'Autorité de contrôle prudentiel et de résolution (ACPR) und Autorité des marchés
    financiers (AMF): Zuständigkeit und Arbeiten zur künstlichen Intelligenz'
  fundstelle: Benennungsplan DGE/DGCCRF vom 9. September 2025 (ACPR für Bonitäts- und Versicherungsbewertungen
    nach Anhang III KI-VO)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Die ACPR ist im französischen Benennungsplan als Marktüberwachungsbehörde für die Hochrisikoanwendungen
    des Finanzsektors vorgesehen (Kreditwürdigkeitsprüfung natürlicher Personen und Risikobewertung/Preisbildung
    in der Lebens- und Krankenversicherung, Anhang III Nr. 5 lit. b und c KI-VO). Eigene französische
    Rechtsnormen zu KI im Finanzsektor gibt es nicht; die Aufsicht arbeitet mit Diskussionspapieren und
    Aufsichtserwartungen. Die AMF wird im Benennungsplan NICHT genannt — das ist ein bemerkenswerter Befund,
    weil damit der Wertpapier- und Vermögensverwaltungsbereich aufsichtsrechtlich nicht ausdrücklich zugewiesen
    ist.

    '
  kurzbeschreibung: 'Frankreich verzichtet auf eine eigene KI-Regulierung des Finanzsektors und stützt
    sich auf die bestehende Aufsichtsarchitektur. Die ACPR (dem Banque de France angegliedert) übernimmt
    die KI-VO-Marktüberwachung für die im Anhang III genannten Finanzanwendungen; die allgemeinen aufsichtsrechtlichen
    Anforderungen an Governance, Auslagerung und Modellrisiko gelten unverändert. Sanktionen ergeben sich
    aus dem code monétaire et financier, nicht aus KI-spezifischem Recht.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.entreprises.gouv.fr/priorites-et-actions/transition-numerique/soutenir-le-developpement-de-lia-au-service-de-0
  anwendungsdaten: []
  themenachsen:
  - sektor-finanz
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - ACPR als vorgesehene Marktüberwachungsbehörde für KI-Systeme in der Bonitäts- und Versicherungsrisikobewertung
    (Anhang III KI-VO).
  - AMF im Benennungsplan nicht genannt; für algorithmischen Handel und Anlageberatung durch KI-Systeme
    fehlt damit eine ausdrückliche Zuweisung.
  - Keine eigenständige nationale KI-Norm im Finanzsektor; maßgeblich bleiben die allgemeinen aufsichtsrechtlichen
    Anforderungen und die unmittelbar geltende KI-Verordnung.
  - 'Gleiche Schwäche wie im Gesamtsystem: solange die Benennung nicht durch Gesetz erfolgt (Art. 24 DDADUE),
    hat die ACPR für die KI-Verordnung keine ausdrückliche Ermächtigungsgrundlage.'
  dokumente:
