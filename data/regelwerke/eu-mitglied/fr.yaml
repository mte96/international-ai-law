    url: https://www.conseil-constitutionnel.fr/decision/2023/2023850DC.htm
    sprache: fr
    urheber: Conseil constitutionnel
    verifiziert: true
    notiz: Die verfassungsrechtliche Legitimation des VSA-Regimes. Art. 10 ist konform unter dem Vorbehalt
      der Rn. 39 (unverzügliche Beendigung der Genehmigung bei Wegfall der Voraussetzungen). Der Conseil
      stützt sich tragend darauf, dass keine Gesichtserkennung und keine biometrische Identifizierung
      stattfindet, dass die Verarbeitung nur meldet und nicht entscheidet und dass die Genehmigung befristet
      und begründet ist. Zensiert wurde nur Art. 7 (Datenaustausch Dopingbekämpfung), aus Verfahrensgründen.
  - datum: 2025-01-14
    typ: bericht
    titel: Expérimentation de traitements algorithmiques d'images légalement collectées au moyen de systèmes
      de vidéoprotection — Rapport du comité d'évaluation
    url: https://www.vie-publique.fr/files/rapport/pdf/297322.pdf
    sprache: fr
    urheber: Comité d'évaluation (eingesetzt nach Décret n° 2023-939)
    verifiziert: true
    notiz: 'Der gesetzlich vorgeschriebene Evaluierungsbericht. Kernaussage: das Dispositiv verletzt „weder
      in seiner Konzeption noch in seiner Umsetzung die öffentlichen Freiheiten“, der operative Nutzen
      war aber begrenzt und die Erkennungsleistung je nach Anwendungsfall sehr unterschiedlich. Der Bericht
      ist die Tatsachengrundlage der gesamten Verlängerungsdebatte.'
  - datum: 2025-02-19
    typ: ausschussbericht
    titel: 'Vidéoprotection algorithmique, sécurité privée : après les JOP, jouons les prolongations —
      Rapport d''information n° 374 (2024-2025)'
    url: https://www.senat.fr/rap/r24-374/r24-374-syn.pdf
    sprache: fr
    urheber: Sénat, commission des lois; Françoise Dumont et Marie-Pierre de La Gontrie, rapporteures
    verifiziert: true
    notiz: 'Der Senatsbericht, der die Verlängerung politisch vorbereitet hat. Proposition n° 1: verlängern
      statt verstetigen. Er schlägt zugleich die später umgesetzte Ausweitung vor (Einsatz auch ohne Großveranstaltung
      an sicherheitskritischen Orten, Erweiterung des Nutzerkreises, mehr Autonomie bei Technologiewahl)
      und verlangt, das Evaluierungskomitee gesetzlich abzusichern. Unverrückbar bleiben nach dem Bericht
      das Biometrieverbot, der Vorrang des Menschen und die Kontrolle durch die CNIL.'
