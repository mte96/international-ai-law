- id: fr-vsa-prolongation-2025
  jurisdiktion: fr
  kurztitel: Gescheiterte VSA-Verlängerung im Transportsicherheitsgesetz 2025
  offizieller_titel: Article 15 de la loi relative au renforcement de la sûreté dans les transports (LOI
    n° 2025-379 du 28 avril 2025), censuré par la décision n° 2025-878 DC du 24 avril 2025
  fundstelle: LOI n° 2025-379 du 28 avril 2025, JORF n° 0101 du 29 avril 2025; Décision n° 2025-878 DC
    du 24 avril 2025
  verfahrensnummer: Proposition de loi relative au renforcement de la sûreté dans les transports; saisine
    n° 2025-878 DC
  status: gescheitert
  status_detail: 'Der Artikel ist nie in Kraft getreten. Der Conseil constitutionnel hat ihn am 24.04.2025
    von Amts wegen als cavalier législatif nach Art. 45 Abs. 1 der Verfassung zensiert (Rn. 137 f.): die
    Verlängerung der VSA-Experimentierung habe „ni lien, même indirect“ mit dem eingebrachten Text zur
    Sicherheit im Verkehr. Der Eintrag gehört in die Datenbank, weil er erklärt, warum es zwischen dem
    01.04.2025 und dem 19.08.2026 keine Rechtsgrundlage für neue VSA-Genehmigungen gab und warum die Regierung
    den zweiten Anlauf über einen eigenen Regierungsentwurf (RIPOST) genommen hat.

    '
  kurzbeschreibung: 'Art. 15 des Transportsicherheitsgesetzes sollte Art. 10 der loi 2023-380 ändern und
    die Experimentierung bis zum 1. März 2027 verlängern. Der Conseil constitutionnel hat die Bestimmung
    nicht materiell geprüft, sondern allein wegen des fehlenden Zusammenhangs mit dem ursprünglichen Text
    gestrichen. Die Zensur ist rein verfahrensrechtlich: sie sagt nichts darüber, ob eine Verlängerung
    materiell verfassungsgemäß gewesen wäre. Genau deshalb konnte die Regierung 2026 dasselbe Ziel — sogar
    mit weiterem Anwendungsbereich und längerer Frist — in einem eigenen Regierungsentwurf erneut verfolgen
    und durchsetzen.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.conseil-constitutionnel.fr/decision/2025/2025878DC.htm
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'Inhalt der zensierten Norm: Verlängerung der Experimentierung des Art. 10 loi 2023-380 bis zum 1.
    März 2027.'
  - 'Zensurgrund: Art. 45 Abs. 1 der Verfassung — jeder Änderungsantrag muss einen zumindest mittelbaren
    Zusammenhang mit dem eingebrachten Text aufweisen. Der Conseil stellt in Rn. 137 f. fest, dass dieser
    Zusammenhang fehlt („ne présentent pas de lien, même indirect“).'
  - 'Verfahrensrechtliche, nicht materielle Zensur: der Conseil äußert sich NICHT zur Vereinbarkeit einer
    Verlängerung mit dem Recht auf Achtung des Privatlebens. Das ist der Grund, warum die Zensur die Politik
    nicht gebremst, sondern nur den Gesetzgebungsweg verändert hat.'
  - 'Rechtsfolge in der Zwischenzeit: mit Ablauf des 31.03.2025 endete die Experimentierung; neue präfektorale
    Genehmigungen waren bis zum Inkrafttreten der LOI n° 2026-798 nicht möglich. Die Entscheidung des
    Conseil d''État vom 30.01.2026 (n° 506370) bestätigt für diesen Zeitraum, dass es keine alternative
    Rechtsgrundlage gab.'
