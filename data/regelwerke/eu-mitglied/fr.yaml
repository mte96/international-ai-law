  offene_punkte:
  - Art. 2 und die Art. 4 bis 9 sowie 11 bis 15 des Dekrets sind im Wortlaut nicht gesichert; die JORFARTI-Kennungen
    dieser Artikel konnten nicht ermittelt werden (Websuche erschöpft, Probeabrufe mit HTTP 403 beantwortet).
  - Die Délibération n° 2023-068 der CNIL ist nicht im Volltext ausgewertet.
  - Ob das Dekret nach der Ausweitung des Art. 10 durch die LOI n° 2026-798 geändert wird, ist offen.
    Ein neues Dekret müsste insbesondere klären, ob die acht Ereignisse auch an den neu einbezogenen Orten
    gelten.
