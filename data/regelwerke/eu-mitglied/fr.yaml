- id: fr-designation-autorites-ia
  jurisdiktion: fr
  kurztitel: Projet de désignation der KI-VO-Behörden (DGE/DGCCRF)
  offizieller_titel: Projet de désignation des autorités nationales compétentes pour la mise en œuvre
    du règlement (UE) 2024/1689 (règlement sur l'intelligence artificielle)
  fundstelle: Veröffentlichung von DGE und DGCCRF vom 9. September 2025 (kein Rechtsakt, kein JORF)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Verwaltungspapier ohne Normqualität. DGE und DGCCRF haben am 09.09.2025 den Plan veröffentlicht,
    wie Frankreich die nach der KI-Verordnung erforderlichen Behörden benennen will. Die verbindliche
    Benennung soll erst durch Gesetz erfolgen (Art. 24 des DDADUE-Entwurfs), das bis zum Rechercheschluss
    nicht verabschiedet ist. Frankreich hat die Frist des Art. 70 Abs. 2 KI-VO (2. August 2025) damit
    verfehlt; ob und wann die Notifikation an die Kommission erfolgt ist, konnte nicht festgestellt werden.

    '
  kurzbeschreibung: 'Frankreich wählt bewusst eine dezentrale Governance: keine neue KI-Behörde, sondern
    Zuweisung an die bestehenden Sektoraufsichten nach ihrer jeweiligen Sachkompetenz, mit der DGCCRF
    als koordinierender Stelle und als „point de contact unique“ nach Art. 70 Abs. 2 KI-VO. Fachliche
    Unterstützung leisten PEReN und ANSSI. Das ist das genaue Gegenmodell zur spanischen AESIA und unterscheidet
    sich auch vom italienischen Zwei-Behörden-Modell (AgID/ACN).

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.entreprises.gouv.fr/priorites-et-actions/transition-numerique/soutenir-le-developpement-de-lia-au-service-de-0
  anwendungsdaten:
  - datum: 2025-09-09
    was_gilt: Veröffentlichung des Benennungsplans durch DGE und DGCCRF.
    verifiziert: true
    quelle: https://www.economie.gouv.fr/dgccrf/actualites-dgccrf/ia-la-dgccrf-coordonnera-laction-des-autorites-de-surveillance-en-france
  themenachsen:
  - governance
  - marktzugang
  - sektor-finanz
  - sektor-oeffentlich
  - datenschutz
  regelungsschwerpunkte:
  - 'Grundentscheidung: dezentrale Organisation „fondée sur des autorités déjà existantes“. Keine neue
    Agentur, keine Bündelung.'
  - 'DGCCRF: koordinierende Stelle und point de contact unique; vertritt Frankreich in den europäischen
    Marktüberwachungsgremien. Kontakt: reglement-ia@dgccrf.finances.gouv.fr; für die DGE reglement-ia.dge@finances.gouv.fr.'
  - 'Verbotene Praktiken (Art. 5 KI-VO): subliminale/manipulative Techniken und Ausnutzung von Verletzlichkeit
    → DGCCRF und Arcom; Social Scoring → CNIL und DGCCRF; Vorhersage von Straftaten, ungezieltes Scraping
    von Gesichtsbildern, Emotionserkennung am Arbeitsplatz und in Bildungseinrichtungen, biometrische
    Kategorisierung und biometrische Fernidentifizierung zu Strafverfolgungszwecken → CNIL.'
  - 'Hochrisiko nach Anhang III: CNIL für Biometrie, Beschäftigung, Migration/Grenzkontrolle, demokratische
    Prozesse (mit Arcom), Justizverwaltung (mit Conseil d''État, Cour de cassation und Cour des comptes)
    sowie Bildung und Berufsbildung (mit DGCCRF); ACPR für Bonitäts- und Versicherungsbewertungen; die
    hauts fonctionnaires de défense et de sécurité für kritische Infrastrukturen.'
  - 'Hochrisiko nach Anhang I: die jeweils produktrechtlich zuständigen Behörden (Maschinen, Spielzeug,
    Medizinprodukte usw.). Die notifizierenden Behörden sind hier die Behörden des jeweiligen Produktrechts.'
  - 'Transparenzpflichten (Art. 50 KI-VO): direkte Interaktion mit Menschen und synthetische Inhalte/Deepfakes
    → DGCCRF und Arcom; Emotionserkennung → CNIL; Texte zu Fragen von öffentlichem Interesse → Arcom.'
  - 'Technische Unterstützung: PEReN (Pôle d''expertise de la régulation numérique) und ANSSI.'
  - 'Institutionelle Pointe: die CNIL wird faktisch zur wichtigsten KI-Aufsicht Frankreichs, ohne dies
    förmlich zu sein. Für die grundrechtssensiblen Hochrisikofelder verlangt Art. 74 Abs. 8 KI-VO ohnehin
    eine Behörde mit Unabhängigkeit — die CNIL erfüllt das, die DGCCRF als Verwaltungsdirektion des Wirtschaftsministeriums
    nicht.'
  - 'Offene Flanke: solange die Benennung nicht in einem Rechtsakt steht, fehlt den benannten Stellen
    die Ermächtigungsgrundlage für Marktüberwachungsbefugnisse und Sanktionen nach Art. 99 KI-VO. Der
    Plan ist ein Ankündigungsdokument, keine Kompetenznorm.'
