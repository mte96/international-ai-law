  offene_punkte:
  - SANKTIONSENTSCHEIDUNGEN DER CNIL MIT KI-BEZUG KONNTEN NICHT ERMITTELT WERDEN. Die Seite cnil.fr/fr/deliberations
    antwortet mit HTTP 403, das Suchkontingent war erschöpft. Ob die formation restreinte 2025 oder 2026
