- id: fr-cpi-tdm
  jurisdiktion: fr
  kurztitel: Art. L. 122-5-3 CPI — Text- und Data-Mining-Schranke
  offizieller_titel: Article L. 122-5-3 du code de la propriété intellectuelle (fouille de textes et de
    données), issu de l'ordonnance n° 2021-1518 du 24 novembre 2021 transposant la directive (UE) 2019/790
  fundstelle: Code de la propriété intellectuelle, art. L. 122-5-3; Umsetzung des Art. 4 der Richtlinie
    (EU) 2019/790
  verfahrensnummer: Ordonnance n° 2021-1518 du 24 novembre 2021
  status: anwendbar
  status_detail: 'Geltendes Recht und derzeit die einzige urheberrechtliche Rechtsgrundlage, auf die sich
    KI-Anbieter in Frankreich für das Training mit geschützten Werken berufen. Die Vorschrift setzt Art.
    4 der DSM-Richtlinie um: allgemeine TDM-Schranke mit Vorbehalt eines maschinenlesbaren Nutzungsvorbehalts
    (opt-out). Das französische Parlament arbeitet an einer Korrektur der Beweislast, nicht an einer Änderung
    der Schranke selbst.

    '
  kurzbeschreibung: 'Die Schranke erlaubt Vervielfältigung und Extraktion geschützter Inhalte zum Zweck
    der Text- und Datenanalyse, sofern der Rechtsinhaber die Nutzung nicht ausdrücklich und in geeigneter
    Weise vorbehalten hat — bei online zugänglichen Inhalten insbesondere durch maschinenlesbare Verfahren.
    Adressiert sind alle, die Inhalte automatisiert auswerten, also auch Anbieter generativer Modelle.
    Sanktionen enthält die Norm nicht; sie wirkt als Einwendung gegen den urheberrechtlichen Unterlassungs-
    und Schadensersatzanspruch. Der Kulturausschuss des Senats hält den opt-out-Mechanismus mangels Transparenz
    für praktisch wirkungslos („L''opt-out n''est […] pas toujours respecté par les fournisseurs d''IA");
    die Assemblée nationale nennt ihn im Ausschussbericht einen „doux rêve“.

    '
  inkrafttreten:
    datum: 2021-11-26
    verifiziert: true
    quelle: https://www.legifrance.gouv.fr/eli/ordonnance/2021/11/24/2021-1518/jo/texte
    fundstelle_norm: Ordonnance n° 2021-1518 du 24 novembre 2021, veröffentlicht im JORF n°0274 vom 25.11.2021,
      Texte n°15. Die Ordonnance enthält keine eigene Inkrafttretensbestimmung; es gilt Art. 1 Abs. 1
      Code civil (Inkrafttreten am Tag nach der Veröffentlichung).
  anwendungsdaten: []
  themenachsen:
  - urheberrecht
  - gpai
  - content
  regelungsschwerpunkte:
  - 'Umsetzung des Art. 4 der Richtlinie (EU) 2019/790: allgemeine TDM-Schranke für alle Nutzer, nicht
    nur für Forschungseinrichtungen (diese sind über Art. 3 der Richtlinie und Art. L. 122-5-3 I CPI privilegiert
    und können sich nicht durch opt-out ausschließen lassen).'
  - 'Opt-out-Bedingung im Wortlaut der Richtlinie, den der AN-Bericht zitiert: „à condition que l''utilisation
    des œuvres et autres objets protégés visés audit paragraphe n''ait pas été expressément réservée par
    leurs titulaires de droits de manière appropriée, notamment par des procédés lisibles par machine
    pour les contenus mis à la disposition du public en ligne“.'
  - 'Strukturproblem: Ohne Transparenz über die Trainingsdaten kann der Rechtsinhaber weder feststellen,
    ob sein Werk genutzt wurde, noch ob sein Vorbehalt beachtet wurde. Art. 53 Abs. 1 lit. c und d KI-VO
    (Urheberrechtspolitik und hinreichend detaillierte Zusammenfassung der Trainingsdaten) soll das lösen;
    der Senat hält das für unzureichend.'
  - 'Französische Reaktion: nicht Abschaffung der Schranke, sondern Umkehr der Beweislast durch eine widerlegliche
    Nutzungsvermutung (siehe fr-ppl-presomption-ia).'
