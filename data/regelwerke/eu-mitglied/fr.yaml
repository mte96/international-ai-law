- id: fr-ddadue-2026
  jurisdiktion: fr
  kurztitel: 'DDADUE 2026 — Art. 24: gesetzliche Grundlage der KI-VO-Aufsicht'
  offizieller_titel: Projet de loi portant diverses dispositions d'adaptation au droit de l'Union européenne
    en matière économique, financière, environnementale, énergétique, d'information, de transport, de
    santé, d'agriculture et de pêche
  fundstelle: Sénat, texte n° 118 (2025-2026), déposé le 10 novembre 2025; Assemblée nationale, texte
    n° 2518 (20 février 2026)
  verfahrensnummer: PJL n° 118 (Sénat) / n° 2518 (AN, 17e législature); dossier AN DLR5L17N53140; procédure
    accélérée engagée le 10.11.2025
  status: verfahren
  status_detail: 'Vom Senat am 18.02.2026 in erster Lesung angenommen (Text n° 63) und am 20.02.2026 an
    die Assemblée nationale übermittelt. Dort liegt der Text seither in fünf Ausschüssen (federführend
    commission des affaires économiques, mitberatend Rechts-, Nachhaltigkeits-, Finanz- und Kulturausschuss),
    ohne dass ein Ausschussbericht oder eine Plenarberatung verzeichnet wäre. Der Stand ist seit über
    sechs Monaten unverändert. Solange dieses Gesetz nicht verkündet ist, fehlt Frankreich die gesetzliche
    Grundlage für die Benennung der Marktüberwachungsbehörden nach der KI-Verordnung.

    '
  kurzbeschreibung: 'Sammelgesetz zur Anpassung an das Unionsrecht mit rund siebzig Artikeln. Für das
    KI-Recht sind zwei Bestimmungen einschlägig: Art. 24 unterstellt KI-Systeme den Vorgaben der Verordnung
    (EU) 2024/1689 und soll die Zuständigkeitsverteilung zwischen Arcom, CNIL, DGE und DGCCRF regeln;
    ein Regierungsänderungsantrag sollte die „répartition des compétences“ im Verfahren präzisieren. Art.
    63 erweitert die Kontrollbefugnisse der Arbeitsaufsicht auf Verstöße gegen die Maschinen- und die
    KI-Verordnung und sieht Sanktionen bis 50.000 Euro vor.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.senat.fr/dossier-legislatif/pjl25-118.html
  anwendungsdaten:
  - datum: 2026-02-18
    was_gilt: Annahme in erster Lesung durch den Senat (Text n° 63).
    verifiziert: true
    quelle: https://www.senat.fr/dossier-legislatif/pjl25-118.html
  - datum: 2026-02-20
    was_gilt: Übermittlung an die Assemblée nationale (Text n° 2518); seither keine weitere Etappe.
    verifiziert: true
    quelle: https://www.assemblee-nationale.fr/dyn/17/dossiers/DLR5L17N53140
  themenachsen:
  - governance
  - marktzugang
  - arbeit
  - sektor-finanz
  regelungsschwerpunkte:
  - 'Art. 24: Unterstellung der KI-Systeme unter die Verordnung (EU) 2024/1689 und Zuweisung der Aufsicht.
    Genannte Behörden: Arcom, CNIL, DGE, DGCCRF. Die genaue Kompetenzverteilung sollte durch Regierungsänderungsantrag
    im Verfahren präzisiert werden.'
  - 'Art. 63: Erweiterung der Ermittlungsbefugnisse im Arbeitsschutz auf „manquements aux règlements européens
    sur les machines et sur l''intelligence artificielle“, mit Geldbußen bis 50.000 Euro. Das ist die
    bislang einzige konkrete nationale Sanktionsnorm zur KI-Verordnung in einem französischen Gesetzestext.'
  - 'Verfahrensrechtliche Pointe: die beschleunigte Verfahrensart (procédure accélérée) wurde am 10.11.2025
    ausgelöst, hat aber nichts beschleunigt — der Text ruht seit Februar 2026 in der Assemblée nationale.
    Der Grund dürfte in der Mehrheitslage liegen, nicht in der Sache.'
  - 'Folge: Frankreich ist beim Anwendungsbeginn der Hochrisikovorschriften ohne benannte, mit Befugnissen
    ausgestattete Marktüberwachungsbehörden. Die Sanktionsvorschriften des Art. 99 KI-VO verlangen von
    den Mitgliedstaaten eigene Regeln; Frankreich hat sie nicht.'
