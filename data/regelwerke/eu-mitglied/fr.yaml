  anwendungsdaten:
  - datum: 2023-08-29
    was_gilt: Ab Verkündung sind präfektorale Genehmigungen nach Art. 10 loi 2023-380 praktisch möglich.
    verifiziert: true
    quelle: https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000048007147
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Art. 1: Zweckfestlegung — „détecter en temps réel des événements prédéterminés susceptibles de présenter
    ou de révéler les risques“ (Terrorismus, schwere Gefahren für die Sicherheit von Personen). Kein anderer
    Zweck ist zulässig.'
  - 'Art. 3: abschließende Liste der acht Ereignisse — (1) présence d''objets abandonnés; (2) présence
    ou utilisation d''armes; (3) Nichtbeachtung der vorgeschriebenen Bewegungsrichtung durch Personen
    oder Fahrzeuge; (4) franchissement ou présence d''une personne ou d''un véhicule dans une zone interdite
    ou sensible; (5) présence d''une personne au sol à la suite d''une chute; (6) mouvement de foule;
    (7) densité trop importante de personnes; (8) départs de feux.'
  - 'Juristische Pointe der Liste: sie ist ereignisbezogen und nicht personenbezogen formuliert. Genau
    darin liegt der Unterschied zur biometrischen Identifizierung — der Algorithmus erkennt Situationen,
    nicht Personen. Diese Konstruktion trägt die Vereinbarkeit mit Art. 5 Abs. 1 lit. h KI-VO.'
  - 'Anforderungen an die Entwicklung: die Trainingsdaten müssen „pertinents, adéquats et représentatifs“
    sein; verlangt werden Maßnahmen gegen Verzerrungen und eine dokumentierte Konzeption.'
  - 'Protokollierung: automatische Aufzeichnung der Nutzung (Zugriffe, Meldungen), damit die CNIL nachprüfen
    kann, ob nur die gesetzlichen Anwendungsfälle bedient wurden.'
  - Dauerhafte menschliche Aufsicht durch eigens benannte und geschulte Bedienstete; die Meldung des Systems
    ersetzt keine Entscheidung.
  - 'Art. 10: Betroffenenrechte — Information nach Kapitel III Abschnitt 2 DSGVO; Auskunft (Art. 15),
    Berichtigung (Art. 16) und Einschränkung (Art. 18) gegenüber dem Verantwortlichen; das Widerspruchsrecht
    (Art. 21 DSGVO) ist unter Berufung auf Art. 23 DSGVO ausgeschlossen. Das ist der schärfste Grundrechtseingriff
    des Dekrets.'
  - 'Art. 16: Schlussbestimmungen (Inkrafttreten, Vollzug).'
