- id: fr-arbeit-cse
  jurisdiktion: fr
  kurztitel: Arbeitsrecht — Unterrichtung des CSE und Aufsicht über KI am Arbeitsplatz
  offizieller_titel: Information et consultation du comité social et économique sur l'introduction de
    nouvelles technologies (code du travail) et extension des pouvoirs de l'inspection du travail au règlement
    (UE) 2024/1689
  fundstelle: Code du travail, art. L. 2312-8 (attributions du CSE); Art. 63 du projet de loi DDADUE 2026
  verfahrensnummer: PJL n° 118 (Sénat) / n° 2518 (AN), art. 63
  status: teilanwendbar
  status_detail: 'Zweigeteilt. Die arbeitsverfassungsrechtliche Seite ist geltendes Recht: der comité
    social et économique ist über die Einführung neuer Technologien und über jede wichtige Änderung der
    Arbeitsorganisation zu unterrichten und anzuhören; das erfasst die Einführung von KI-Systemen. Die
    aufsichtsrechtliche Seite ist noch Entwurf: Art. 63 des DDADUE-Gesetzentwurfs soll die Arbeitsaufsicht
    ermächtigen, Verstöße gegen die Maschinen- und die KI-Verordnung zu ermitteln und mit Geldbußen bis
    50.000 Euro zu ahnden. Der Entwurf ruht seit Februar 2026 in der Assemblée nationale.

    '
  kurzbeschreibung: 'Frankreich hat kein KI-spezifisches Arbeitsrecht. Der Schutz läuft über drei bestehende
    Schichten: die Unterrichtungs- und Anhörungsrechte des CSE bei Einführung neuer Technologien, das
    Verbot der Emotionserkennung am Arbeitsplatz nach Art. 5 KI-VO (Aufsicht: CNIL) und die Einstufung
    beschäftigungsbezogener Systeme als hochriskant nach Anhang III KI-VO (Aufsicht ebenfalls CNIL). Hinzu
    treten die allgemeinen datenschutzrechtlichen Anforderungen und die angekündigten sektoralen CNIL-Empfehlungen
    zur Arbeitswelt.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
  anwendungsdaten:
  - datum: 2026-02-18
    was_gilt: Der Senat nimmt Art. 63 DDADUE an (Ermittlungsbefugnisse der Arbeitsaufsicht zu Maschinen-
      und KI-Verordnung, Geldbußen bis 50.000 Euro).
    verifiziert: true
    quelle: https://www.senat.fr/lessentiel/pjl25-118.pdf
  themenachsen:
  - arbeit
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Art. L. 2312-8 code du travail: Unterrichtung und Anhörung des CSE bei Einführung neuer Technologien
    und bei jeder wichtigen Änderung von Gesundheit, Sicherheit oder Arbeitsbedingungen. Die Einführung
    eines KI-Systems, das die Arbeitsorganisation ändert, löst diese Pflicht aus.'
  - 'Art. 63 DDADUE (Entwurf): Ausweitung der Ermittlungsbefugnisse der Arbeitsaufsicht auf „manquements
    aux règlements européens sur les machines et sur l''intelligence artificielle“; Geldbußen bis 50.000
    Euro. Bislang die einzige konkret bezifferte nationale Sanktionsnorm zur KI-Verordnung in einem französischen
    Gesetzestext.'
  - 'CNIL als Aufsicht: nach dem Benennungsplan zuständig für das Verbot der Emotionserkennung am Arbeitsplatz
    (Art. 5 KI-VO) und für beschäftigungsbezogene Hochrisikosysteme (Anhang III Nr. 4).'
  - 'Angekündigt: sektorale CNIL-Empfehlungen zur KI in der Arbeitswelt (Ankündigung vom 22.07.2025);
    bis zum Rechercheschluss nicht nachgewiesen.'
  dokumente:
  - datum: 2026-02-18
    typ: uebersicht
    titel: 'L''essentiel — Ddadue 2026 (Art. 63: Arbeitsaufsicht, Maschinen- und KI-Verordnung)'
    url: https://www.senat.fr/lessentiel/pjl25-118.pdf
    sprache: fr
    urheber: Sénat
    verifiziert: true
    notiz: Selbst geöffnet. Einzige verifizierte Quelle dieses Eintrags.
  - datum: null
    typ: endfassung
    titel: Article L. 2312-8 du code du travail
    url: null
    sprache: fr
    urheber: République française
    verifiziert: false
    notiz: KEIN amtlicher Volltext abrufbar (Légifrance-Sperre, LEGIARTI-Kennung nicht ermittelbar). `url`
      bleibt leer; der Wortlaut ist nicht geprüft.
  offene_punkte:
  - Der Wortlaut des Art. L. 2312-8 code du travail und die genaue Reichweite der Anhörungspflicht bei
    KI-Einführung sind nicht verifiziert.
  - Ob es französische Rechtsprechung zur Anhörungspflicht des CSE speziell bei KI-Systemen gibt, ist
    nicht ermittelt.
  - Ob die angekündigten sektoralen CNIL-Empfehlungen zur Arbeitswelt erschienen sind, ist offen.
  - Ob es Tarifverträge oder Branchenvereinbarungen zu KI gibt (etwa im Rahmen des ANI zur Digitalisierung),
    ist nicht geprüft.
