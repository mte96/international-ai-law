- id: fr-cnil-recommandations-ia
  jurisdiktion: fr
  kurztitel: CNIL — Empfehlungen zur Entwicklung von KI-Systemen (DSGVO)
  offizieller_titel: Recommandations de la CNIL sur le développement des systèmes d'intelligence artificielle
    (fiches pratiques IA)
  fundstelle: cnil.fr, fiches pratiques IA; erste Veröffentlichung 2024, Finalisierung 22. Juli 2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Fortlaufend erweiterte Empfehlungssammlung ohne Bindungswirkung. Die CNIL hat die Empfehlungen
    in mehreren Wellen nach öffentlicher Konsultation verabschiedet: erste Merkblätter 2024, Empfehlungen
    zu Information der Betroffenen und Ausübung der Betroffenenrechte am 07.02.2025, Empfehlungen zum
    berechtigten Interesse einschließlich Web-Scraping, Finalisierung dreier weiterer Merkblätter am 22.07.2025
    (DSGVO-Anwendbarkeit auf Modelle, Annotation, Sicherheit der Entwicklung). Angekündigt sind sektorale
    Empfehlungen (Bildung, Gesundheit, Arbeitswelt) und Arbeiten zur Verantwortungsverteilung in der KI-Wertschöpfungskette.
    Im August 2026 hat die CNIL zusätzlich ein Werkzeug zur Rückverfolgbarkeit quelloffener Modelle aktualisiert
    und gemeinsam mit dem Conseil de l''IA et du Numérique zu agentischer KI publiziert.

    '
  kurzbeschreibung: 'Die CNIL ist faktisch Frankreichs KI-Regulierer, obwohl sie es formal nicht ist.
    Ihre Empfehlungen führen durch elf Schritte der Entwicklungsphase — Zweckbestimmung, Rollenverteilung
    (Verantwortlicher/Auftragsverarbeiter), Rechtsgrundlage, Zulässigkeit der Weiterverwendung, Datenminimierung,
    Speicherdauer, Information der Betroffenen, Ermöglichung der Betroffenenrechte, Sicherheit, rechtliche
    Einordnung des Modells selbst und Annotation — ergänzt um einen Schwerpunkt zur Datenschutz-Folgenabschätzung.
    Die praktisch wichtigste Aussage: das berechtigte Interesse (Art. 6 Abs. 1 lit. f DSGVO) kann Rechtsgrundlage
    für die Entwicklung von KI-Systemen sein, auch bei Web-Scraping, wenn bestimmte Garantien eingehalten
    werden. Adressaten sind Anbieter und Entwickler; Sanktionen ergeben sich nicht aus den Empfehlungen,
    sondern aus der DSGVO.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.cnil.fr/fr/developpement-des-systemes-dia-les-recommandations-de-la-cnil-pour-respecter-le-rgpd
  anwendungsdaten:
  - datum: 2025-02-07
    was_gilt: Endgültige Empfehlungen zur Information der betroffenen Personen und zur Ausübung der Betroffenenrechte
      nach öffentlicher Konsultation.
    verifiziert: true
    quelle: https://www.cnil.fr/fr/ia-et-rgpd-la-cnil-publie-ses-nouvelles-recommandations-pour-accompagner-une-innovation-responsable
  - datum: 2025-07-22
    was_gilt: 'Finalisierung dreier weiterer Merkblätter: Anwendbarkeit der DSGVO auf KI-Modelle, Annotation
      der Trainingsdaten, Sicherheit der Entwicklung.'
    verifiziert: true
    quelle: https://www.cnil.fr/fr/ia-finalisation-recommandations-developpement-des-systemes-ia
  themenachsen:
  - datenschutz
  - gpai
  - governance
  - urheberrecht
  regelungsschwerpunkte:
  - 'Berechtigtes Interesse als Rechtsgrundlage: „L''intérêt légitime est une base légale possible pour
    le développement des systèmes d''IA“ — mit Garantien: Ausschluss bestimmter Datenkategorien schon
    bei der Erhebung, gesteigerte Transparenz, freiwillige Widerspruchsmöglichkeit (Opt-out), Beschränkung
    auf pseudonymisierte oder anonymisierte Daten.'
  - 'Web-Scraping (fiche 8 bis „focus moissonnage“): die CNIL erklärt das Abgreifen öffentlich zugänglicher
    Daten nicht pauschal für unzulässig, sondern stellt Kriterien auf. Das ist der französische Gegenpol
    zur restriktiveren Linie mancher anderer Aufsichtsbehörden.'
  - 'Fiche 13 „Analyser le statut d''un modèle d''IA“: Frage, ob ein trainiertes Modell selbst personenbezogene
    Daten enthält. Die CNIL schlägt technische Lösungen wie robuste Filter auf Systemebene vor. Das ist
    die dogmatisch heikelste Position — sie entscheidet darüber, ob Betroffenenrechte am Modell selbst
    geltend gemacht werden können.'
  - 'Betroffenenrechte: „Lorsque des données personnelles servent à l''entraînement d''un modèle d''IA
    […] les personnes concernées doivent être informées.“ Auskunft, Berichtigung, Widerspruch und Löschung
    sind zu ermöglichen; die CNIL akzeptiert Erleichterungen, wo die Ausübung technisch unmöglich oder
    unverhältnismäßig aufwendig wäre.'
  - 'PANAME: Projekt zur Entwicklung technischer Werkzeuge, mit denen geprüft werden kann, ob ein Modell
    personenbezogene Daten memorisiert hat.'
  - 'Rechtsnatur: die Empfehlungen sind nicht verbindlich; sie binden aber die CNIL selbst faktisch bei
    der Ausübung ihrer Aufsichts- und Sanktionsbefugnisse und sind damit für die Praxis maßgeblich.'
  - 'Institutionelle Doppelrolle: die CNIL ist zugleich Datenschutzaufsicht nach der DSGVO und — nach
    dem Benennungsplan von DGE und DGCCRF — künftige Marktüberwachungsbehörde für die grundrechtssensiblen
    Hochrisikofelder und für mehrere verbotene Praktiken der KI-Verordnung.'
