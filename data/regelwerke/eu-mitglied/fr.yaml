  kurztitel: PPL Darcos — Nutzungsvermutung zulasten der KI-Anbieter
  offizieller_titel: Proposition de loi relative à l'instauration d'une présomption d'exploitation des
    contenus culturels par les fournisseurs d'intelligence artificielle
  fundstelle: Sénat, texte n° 220 (2025-2026) du 12 décembre 2025; texte adopté n° 85 du 8 avril 2026;
    Assemblée nationale, texte n° 2864
  verfahrensnummer: PPL n° 220 (Sénat) / n° 2864 (AN, 17e législature); dossier AN DLR5L17N53359
  status: verfahren
  status_detail: 'Am 12.12.2025 von Laure Darcos und weiteren Senatoren eingebracht. Der Conseil d''État
    hat auf Ersuchen des Senatspräsidenten am 23.03.2026 verfassungsrechtliche Bedenken ausgeräumt; der
    Kulturausschuss hat den Text einstimmig angenommen (Bericht n° 496 vom 01.04.2026, Berichterstatterin
    Laure Darcos), das Plenum des Senats am 08.04.2026 (Text n° 85). Übermittlung an die Assemblée nationale
    am 09.04.2026; der Kulturausschuss der Assemblée hat den Text am 02.06.2026 ohne Änderungen angenommen
    (Bericht n° 2864, Berichterstatter Emmanuel Maurel), sechzehn Änderungsanträge lagen vor. Die Plenarberatung
    der Assemblée steht bis zum Rechercheschluss aus.

    '
  kurzbeschreibung: 'Einartikelgesetz mit erheblicher Sprengkraft: ein neuer Art. L. 331-4-1 CPI stellt
    eine widerlegliche Vermutung auf, dass ein geschütztes Werk von einem Anbieter eines KI-Modells oder
    -Systems genutzt wurde, sobald Indizien diese Nutzung wahrscheinlich machen — genannt werden die Erzeugung
    von Inhalten „à la manière de“ einem Urheber, die Wiedergabe von Auszügen (Regurgitation) und technische
    Gutachten. Die Beweislast kehrt sich um: nicht der Urheber muss die Nutzung nachweisen, sondern der
    Anbieter das Gegenteil. Ergänzt wird eine Anpassung des Art. L. 811-1-1 CPI (Anwendungsbereich in
    den Überseegebieten).

    '
