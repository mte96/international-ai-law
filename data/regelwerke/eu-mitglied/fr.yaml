- id: fr-loi-2026-798
  jurisdiktion: fr
  kurztitel: Loi RIPOST — VSA bis 2030, Ausweitung, Handelsflächen-Experiment
  offizieller_titel: LOI n° 2026-798 du 18 août 2026 visant à offrir des réponses immédiates aux phénomènes
    troublant l'ordre public, la sécurité et la tranquillité de nos concitoyens
  fundstelle: JORF n° 0192 du 19 août 2026 (JORFTEXT000054707332)
  verfahrensnummer: Projet de loi n° 472 (Sénat, 2025-2026) / n° 2850 (Assemblée nationale, 17e législature);
    T.A. Sénat n° 164, T.A. AN n° 340 (21.07.2026); dossier AN DLR5L17N53980; NOR INTD2604047L
  status: anwendbar
  status_detail: 'Verkündet und in Kraft. Der Weg: Ministerrat und Einreichung im Senat am 25.03.2026,
    Ausschussbericht n° 601 am 06.05.2026, Annahme im Senat am 26.05.2026, Übermittlung an die Assemblée
    nationale am 28.05.2026, Ausschussbericht n° 2984 am 24.06.2026, Annahme in erster Lesung am 15.07.2026
    (T.A. n° 331), Einigung der paritätischen Kommission am 17.07.2026, endgültige Annahme in beiden Kammern
    am 21.07.2026, Anrufung des Conseil constitutionnel durch zwei Gruppen von jeweils mehr als sechzig
    Abgeordneten am 24.07.2026, Entscheidung n° 2026-915 DC vom 14.08.2026 (teilweise konform), Verkündung
    am 18.08.2026.

    '
  kurzbeschreibung: 'Ein umfangreiches Sicherheitsgesetz („RIPOST“) mit einem für das KI-Recht zentralen
    Teil: Art. 19 des Entwurfs verlängert die VSA-Experimentierung bis zum 31. Dezember 2030 und weitet
    ihren Anwendungsbereich erheblich aus — von Sport-, Kultur- und Freizeitveranstaltungen auf politische
    Veranstaltungen sowie auf öffentliche Gebäude und Orte, die dauerhaft oder aufgrund außergewöhnlicher
    Umstände einem Risiko ausgesetzt sind und durch Ministerialerlass bezeichnet werden, ferner auf deren
    Umfeld und die öffentlichen Verkehrsmittel. Zugleich staffelt das Gesetz die Genehmigungsdauern neu.
    Ein weiterer, im Plenum der Assemblée nationale eingefügter Artikel (Art. 19 bis der Beratungsfassung)
    schafft erstmals eine VSA-Erprobung im PRIVATEN Einzelhandel bis zum 31. Dezember 2027 — mit CNIL-Genehmigung
    statt präfektoraler Genehmigung. Zweckbindung, Biometrieverbot, Verbot der automatisierten Einzelentscheidung
    und menschliche Aufsicht bleiben unverändert.

    '
