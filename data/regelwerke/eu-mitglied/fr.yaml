  themenachsen:
  - governance
  - grundrechte
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Errichtung und Zusammensetzung des comité d''évaluation: unabhängige Sachverständige, Parlamentarier,
    Vertreter der einsetzenden Dienste.'
  - 'Auftrag: Bewertung der technischen Leistungsfähigkeit, des operativen Nutzens und der Auswirkungen
    auf die öffentlichen Freiheiten.'
  - Das Komitee ist keine Aufsichtsbehörde; die Kontrolle bleibt bei der CNIL. Es ist ein Evaluierungs-,
    kein Kontrollgremium — der Senatsbericht hält das für eine Schwachstelle und verlangt eine gesetzliche
    Verankerung.
  - Der Bericht des Komitees ist der Anknüpfungspunkt für die politische Entscheidung über Verlängerung
    oder Verstetigung; Art. 10 loi 2023-380 verlangt ihn vor Ablauf der Experimentierung.
