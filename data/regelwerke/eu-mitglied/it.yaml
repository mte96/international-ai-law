- id: it-bankitalia-comunicazione-ia-2026
  jurisdiktion: it
  kurztitel: Banca d'Italia — Comunicazione zu digitaler operativer Resilienz und fortgeschrittenen KI-Modellen
  offizieller_titel: Comunicazione al mercato in materia di resilienza operativa digitale e modelli avanzati
    di Intelligenza Artificiale
  fundstelle: Banca d'Italia, Comunicazione vom 17 luglio 2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 17.07.2026 veroeffentlicht. Aufsichtsrechtliche Mitteilung (comunicazione al mercato)
    ohne formelle Verordnungsqualitaet, aber mit konkreter Handlungserwartung und einer harten Frist:
    die beaufsichtigten Institute muessen dem Verwaltungsorgan bis zum 31.12.2026 einen Bericht mit Massnahmenplan
    vorlegen und diesen der Aufsicht uebermitteln.

    '
  kurzbeschreibung: 'Die Banca d''Italia adressiert die von ihr unmittelbar beaufsichtigten Intermediaere
    — Banken, Zahlungs- und E-Geld-Institute, Wertpapierfirmen, Anbieter von Kryptowerte-Dienstleistungen,
    Verwalter alternativer Fonds und weitere Finanzintermediaere — und verlangt Massnahmen zur Staerkung
    der digitalen und Cybersicherheits-Resilienz angesichts fortgeschrittener KI-Systeme, die Schwachstellen
    selbstaendig auffinden und ausnutzen koennen. Sie benennt sechs Handlungsfelder: Governance (Ueberpruefung
    des Risikorahmens, Sicherheitsmassnahmen, Lieferantensteuerung), IT-Hygiene (mehrschichtiges Sicherheitsmodell,
    Netzsegmentierung), Ressourcenverwaltung (Inventare kritischer Systeme, Ablösung veralteter Infrastruktur),
    Schwachstellenmanagement, Ueberwachung und Abwehr (auch mit KI-Werkzeugen) sowie Resilienz- und Szenariotests.
    Die Mitteilung ergaenzt DORA (Verordnung (EU) 2022/2554) und flankiert die Rolle der Banca d''Italia
    als Marktueberwachungsbehoerde nach Art. 20 Abs. 2 Legge 132/2025.

    '
  inkrafttreten:
    datum: 2026-07-17
    verifiziert: true
    quelle: https://www.bancaditalia.it/compiti/vigilanza/avvisi-pub/2026.07.17-comunicazione/index.html
