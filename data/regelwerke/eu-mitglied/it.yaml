- id: it-ac-1940-ia-commercio-elettronico
  jurisdiktion: it
  kurztitel: A.C. 1940 — KI im elektronischen Handel (Gesetzesvorschlag)
  offizieller_titel: Disposizioni concernenti l'impiego di sistemi di intelligenza artificiale nel settore
    del commercio elettronico nonche delega al Governo in materia di disciplina delle funzioni di vigilanza
  fundstelle: Camera dei deputati, proposta di legge A.C. 1940, XIX legislatura
  verfahrensnummer: A.C. 1940 (eingebracht 02.07.2024, Zuweisung an die X. Kommission am 07.08.2024)
  status: verfahren
  status_detail: 'Am 02.07.2024 eingebracht, am 07.08.2024 der X. Kommission (Attivita produttive, commercio
    e turismo) zugewiesen; das Lesedossier der Kammerdienste datiert vom 04.11.2024. Seither liessen sich
    keine weiteren Verfahrensschritte feststellen — das Vorhaben ruht faktisch, seit die Legge 132/2025
    den Regelungsstoff weitgehend besetzt hat. Nicht Gesetz geworden.

    '
  kurzbeschreibung: 'Parlamentarische Initiative mit acht Artikeln zum KI-Einsatz im elektronischen Handel.
    Kernstueck ist eine Transparenzpflicht: Anbieter sollen ''informazioni complete, chiare, accessibili
    e comprensibili'' ueber die Funktionsweise der eingesetzten Algorithmen veroeffentlichen. Hinzu kommen
    die Verpflichtung auf die Datenschutz-Grundverordnung, eine Verordnungsermaechtigung zur Ausgestaltung
    der Aufsichtsfunktionen mit Zuweisung an die Agenzia per la cybersicurezza nazionale und die Agenzia
    per l''Italia digitale, ein Foerderfonds von zehn Millionen Euro fuer kleine und mittlere Unternehmen
    sowie digitale Qualifizierungsprogramme. Bemerkenswert ist, dass die spaeter in Art. 20 Legge 132/2025
    gewaehlte Doppelstruktur ACN/AgID hier bereits vorgezeichnet ist.

    '
