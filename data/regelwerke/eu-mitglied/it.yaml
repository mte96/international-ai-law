  regelungsschwerpunkte:
  - 'Aufbau: Capo I Principi e finalita (Art. 1-6), Capo II Disposizioni di settore (Art. 7-18), Capo
    III Strategia nazionale, autorita nazionali e azioni di promozione (Art. 19-24), Capo IV Disposizioni
    a tutela degli utenti e in materia di diritto d''autore (Art. 25), Capo V Disposizioni penali (Art.
    26), Capo VI Disposizioni finanziarie e finali (Art. 27-28). 28 Artikel.'
  - 'Art. 1: Zweck und Anwendungsbereich — foerdert einen ''utilizzo corretto, trasparente e responsabile,
    in una dimensione antropocentrica'' der KI und die Aufsicht ueber wirtschaftliche, soziale und grundrechtliche
    Risiken; ausdrueckliche Konformitaet mit der Verordnung (EU) 2024/1689.'
  - 'Art. 2: Definitionen — Verweis auf die KI-VO fuer ''sistema di intelligenza artificiale'' und ''modelli'';
    eigenstaendige weite Datendefinition (''qualsiasi rappresentazione digitale di atti, fatti o informazioni'',
    einschliesslich Ton- und audiovisueller Aufzeichnungen).'
  - 'Art. 3: Allgemeine Grundsaetze — Abs. 1 bindet Forschung, Erprobung, Entwicklung, Einfuehrung und
    Nutzung an Verfassungsgrundrechte, Unionsrecht und die Grundsaetze Transparenz, Verhaeltnismaessigkeit,
    Sicherheit, Datenschutz, Vertraulichkeit, Genauigkeit, Nichtdiskriminierung, Geschlechtergleichheit
    und Nachhaltigkeit; Abs. 3 verlangt ''la sorveglianza e l''intervento umano'' sowie Erkennbarkeit,
    Transparenz und Erklaerbarkeit; Abs. 4 schuetzt demokratisches und institutionelles Leben; Abs. 5
    stellt klar, dass keine ueber die KI-VO hinausgehenden Pflichten begruendet werden; Abs. 6 Cybersicherheit
    ueber den gesamten Lebenszyklus; Abs. 7 Barrierefreiheit.'
  - 'Art. 4 Abs. 1: KI in der Information darf ''la liberta e il pluralismo dei mezzi di comunicazione''
    nicht beeintraechtigen — eine medienrechtliche Schranke mit Verfassungsbezug.'
  - 'Art. 4 Abs. 4 (MINDERJAEHRIGE): ''L''accesso alle tecnologie di intelligenza artificiale da parte
    dei minori di anni quattordici nonche il conseguente trattamento dei dati personali richiedono il
    consenso di chi esercita la responsabilita genitoriale, nel rispetto di quanto previsto dal regolamento
    (UE) 2016/679.'' Damit wird die italienische Altersgrenze des Art. 2-quinquies Codice privacy (14
    Jahre) vom Datenschutz auf den blossen ZUGANG zur Technologie ausgedehnt — eine Zugangsschranke, keine
    reine Datenschutzregel. Zwischen 14 und 18 Jahren genuegt die Einwilligung des Minderjaehrigen selbst,
    wenn die Information klar und verstaendlich ist.'
  - 'Art. 5: Wirtschaftliche Entwicklung — technologische Souveraenitaet, Zugang zu qualifizierten Daten,
    Foerderung der Datenlokalisierung auf nationalen Servern mit hohen Sicherheitsstandards. Die im Senatsentwurf
    noch strikte Serverstandort-Pflicht wurde in der Camera abgeschwaecht.'
  - 'Art. 6: Bereichsausnahme — Taetigkeiten fuer nationale Sicherheit (legge 124/2007), Cybersicherheit,
    Verteidigung und Kriminalpraevention sind ''escluse dall''ambito applicativo della presente legge''.
    Eine der weitreichendsten Regelungen des Gesetzes: sie nimmt genau die grundrechtssensibelsten Anwendungsfelder
    aus dem nationalen Regime heraus (die KI-VO gilt insoweit unberuehrt weiter, Art. 2 Abs. 3 KI-VO).'
  - 'Art. 7: KI im Gesundheitswesen — Beitrag zu Praevention, Diagnose und Therapie; Diskriminierungsverbot
    beim Leistungszugang; Informationsrecht der Patientinnen und Patienten ueber den KI-Einsatz; die Entscheidungshoheit
    bleibt bei der Aerztin/dem Arzt; Zuverlaessigkeit, regelmaessige Ueberpruefung und Aktualisierung
    der Systeme.'
  - 'Art. 8: Forschung und wissenschaftliche Erprobung im Gesundheitsbereich — die Verarbeitung durch
    oeffentliche und private Non-Profit-Einrichtungen sowie IRCCS wird zum ''rilevante interesse pubblico''
    erklaert; Sekundaernutzung anonymisierter Daten ohne erneute Einwilligung; AGENAS kann nach Anhoerung
    des Garante Leitlinien zu Anonymisierung und synthetischen Daten erlassen; Mitteilung an den Garante
    30 Tage vor Verarbeitungsbeginn.'
  - 'Art. 9: Ermaechtigung des Gesundheitsministers, binnen 120 Tagen (Frist: 07.02.2026) ein Dekret zur
    vereinfachten Verarbeitung personenbezogener — auch besonderer — Daten fuer KI-gestuetzte Forschung
    zu erlassen.'
  - 'Art. 10: Elektronische Gesundheitsakte, Ueberwachungssysteme und digitale Gesundheitsverwaltung —
    AGENAS wird zur ''Agenzia nazionale per la sanita digitale'' aufgewertet und betreibt eine nationale
    KI-Plattform mit unverbindlichen Unterstuetzungsdiensten fuer Fachpersonal und Patienten.'
  - 'Art. 11 (ARBEIT): Abs. 2 verweist fuer die Informationspflicht ausdruecklich auf ''l''articolo 1-bis
    del decreto legislativo 26 maggio 1997, n. 152'' — also auf die durch das decreto trasparenza (d.lgs.
    104/2022) eingefuegte und durch DL 48/2023 / Legge 85/2023 geaenderte Vorschrift. Das Gesetz schafft
    im Arbeitsrecht KEINE neue Informationspflicht, sondern kanalisiert den KI-Einsatz in das bestehende
    Regime. Abs. 1: Einsatz zur Verbesserung der Arbeitsbedingungen und zum Schutz der psychophysischen
    Integritaet; Abs. 3: Diskriminierungsverbot nach Geschlecht, Alter, ethnischer Herkunft, Religion,
    sexueller Orientierung und politischer Ueberzeugung.'
  - 'Art. 12: Osservatorio sull''adozione di sistemi di intelligenza artificiale nel mondo del lavoro
    beim Arbeitsministerium; Zusammensetzung durch Dekret binnen 90 Tagen (Frist 08.01.2026); Mitglieder
    ohne Verguetung; keine zusaetzlichen Haushaltsmittel.'
  - 'Art. 13 (FREIE BERUFE): Abs. 1 — ''L''utilizzo di sistemi di intelligenza artificiale nelle professioni
    intellettuali e finalizzato al solo esercizio delle attivita strumentali e di supporto all''attivita
    professionale e con prevalenza del lavoro intellettuale oggetto della prestazione d''opera.'' Abs.
    2 — zur Sicherung des Vertrauensverhaeltnisses sind die Informationen ueber die eingesetzten KI-Systeme
    dem Mandanten ''con linguaggio chiaro, semplice ed esaustivo'' mitzuteilen. Rechtsfolge ist nicht
    ausdruecklich geregelt: einschlaegig sind das jeweilige Standesrecht (Disziplinarverfahren) und Art.
    2229 ff. c.c. (Werkvertragsrecht der freien Berufe).'
  - 'Art. 14 (VERWALTUNG): Einsatz zur Effizienzsteigerung und Verfahrensverkuerzung ''assicurando agli
    interessati la conoscibilita del suo funzionamento e la tracciabilita del suo utilizzo''; der Einsatz
    bleibt instrumentell und unterstuetzend, ''l''autonomia e il potere decisionale della persona'' bleibt
    unberuehrt, die handelnde Person bleibt allein verantwortlich fuer den Verwaltungsakt; technische,
    organisatorische und Fortbildungsmassnahmen; Haushaltsneutralitaet.'
  - 'Art. 15 (JUSTIZ): Abs. 1 — ''Nei casi di impiego dei sistemi di intelligenza artificiale nell''attivita
    giudiziaria e sempre riservata al magistrato ogni decisione sull''interpretazione e sull''applicazione
    della legge.'' Abs. 2 — das Justizministerium regelt den KI-Einsatz fuer Organisation, Vereinfachung
    der Gerichtsarbeit und Verwaltungstaetigkeiten. Abs. 3 — Erprobungen in den ordentlichen Gerichten
    beduerfen der Genehmigung des Justizministeriums nach Anhoerung der Behoerden des Art. 20. Abs. 4
    — Fortbildung von Richterschaft und Verwaltungspersonal.'
  - 'Art. 16: Delega al Governo in materia di dati, algoritmi e metodi matematici per l''addestramento
    — binnen zwoelf Monaten (Frist 10.10.2026) eine ''disciplina organica'' zum Rechtsregime der Trainingsdaten,
    mit Schutz- und Sanktionsinstrumenten und Zuweisung der Streitigkeiten an die sezioni specializzate
    in materia di impresa. Diese Delega ist bislang NICHT ausgeuebt.'
  - 'Art. 17: Aenderung des Art. 9 Abs. 2 c.p.c. — Klagen, die ''il funzionamento di un sistema di intelligenza
    artificiale'' zum Gegenstand haben, fallen in die ausschliessliche Zustaendigkeit des Tribunale (und
    damit nicht in die des giudice di pace).'
  - 'Art. 18: Einfuegung von Art. 7 Abs. 1 lit. m-quater in das DL 82/2021 — die ACN foerdert und entwickelt
    Initiativen, auch ueber Kooperationsvereinbarungen mit Privaten, ''volta a valorizzare l''intelligenza
    artificiale come risorsa per il rafforzamento della cybersicurezza nazionale''.'
  - 'Art. 19: Nationale KI-Strategie, erarbeitet von der zustaendigen Stelle der Praesidentschaft des
    Ministerrats, alle zwei Jahre vom Comitato interministeriale per la transizione digitale genehmigt;
    Comitato di coordinamento unter Vorsitz des Ministerpraesidenten.'
  - 'Art. 20 (BEHOERDENARCHITEKTUR): AgID ist zustaendig fuer Innovationsfoerderung und Entwicklung sowie
    fuer Notifizierung, Bewertung und Akkreditierung — sie ist die ''autorita di notifica'' im Sinne der
    KI-VO. Die ACN ist Marktueberwachungsbehoerde (''autorita di vigilanza del mercato'') mit Inspektions-
    und Sanktionsbefugnissen. Unberuehrt bleiben die marktaufsichtsrechtlichen Rollen von Banca d''Italia,
    CONSOB und IVASS (''Ferma restando l''attribuzione alla Banca d''Italia, alla CONSOB e all''IVASS
    del ruolo di autorita di vigilanza del mercato''). Koordinierungsausschuss bei der Praesidentschaft
    des Ministerrats mit den Direktoren beider Agenturen. Befugnisse des Garante per la protezione dei
    dati personali und der AGCOM bleiben vollstaendig erhalten.'
  - 'Art. 21: Erprobung von KI in den konsularischen Diensten des Aussenministeriums; 300.000 Euro jaehrlich
    fuer 2025 und 2026 — die einzige Vorschrift, die von der Haushaltsneutralitaetsklausel des Art. 27
    ausgenommen ist.'
  - 'Art. 22: Foerderung von Schuelerinnen und Schuelern mit hohem kognitiven Potenzial in der KI-Forschung;
    Zugaenglichkeit von KI im Sport, besonders zur Inklusion von Menschen mit Behinderung.'
  - 'Art. 23: Investitionen bis zu einem Gesamtbetrag von einer Milliarde Euro in Form von equity und
    quasi equity ueber Venture-Capital-Fonds von CDP Venture Capital SGR in KI, Cybersicherheit und Quantenrechnen;
    Ziel sind innovative KMU und nationale Technologie-Champions.'
  - 'Art. 24 (DELEGHE): Abs. 1 — Anpassung des nationalen Rechts an die Verordnung (EU) 2024/1689 binnen
    zwoelf Monaten (Frist 10.10.2026) nach dem Verfahren des Art. 31 legge 234/2012, nach Stellungnahmen
    der zustaendigen Parlamentsausschuesse, der Conferenza unificata und des Garante. Abs. 2 — Leitgrundsaetze:
    Uebertragung der Aufsichts-, Inspektions- und Sanktionsbefugnisse auf die Behoerden des Art. 20, Anpassung
    des geltenden Rechts, Sekundaerrecht der benannten Behoerden, Verwaltungssanktionen, Wege der KI-Alphabetisierung
    und -Fortbildung, Berufsfortbildung, Staerkung der MINT-Kompetenzen in den Lehrplaenen, eine eigene
    Regelung des KI-Einsatzes in der Polizeiarbeit (lit. h), Hochschul-, AFAM- und ITS-Ausbildung, Aufwertung
    der Hochschulforschung und des Technologietransfers, Marktueberwachungsbefugnisse und Anpassung des
    Sanktionsrahmens. Abs. 3 — zweite, eigenstaendige Delega binnen zwoelf Monaten fuer die ''realizzazione
    e impiego illeciti'' von KI-Systemen. Abs. 4 — Verfahren: 60 Tage fuer die parlamentarischen Stellungnahmen;
    laeuft diese Frist in den letzten 30 Tagen der Delegationsfrist oder danach ab, verlaengert sich die
    Delega um 60 Tage. Abs. 5 — Leitgrundsaetze der zweiten Delega: Instrumente gegen die Verbreitung
    rechtswidrig erzeugter Inhalte, eigenstaendige Straftatbestaende, Kriterien straf- und verwaltungsrechtlicher
    Verantwortlichkeit, Schutz des Geschaedigten im Zivilhaftungsrecht, Regelung des KI-Einsatzes in den
    Ermittlungen und Koordinierungsaenderungen. Abs. 6 — Haushaltsneutralitaet.'
  - 'Art. 25 (URHEBERRECHT): lit. a) aendert Art. 1 legge 633/1941 — nach ''opere dell''ingegno'' wird
    ''umano'' eingefuegt und nach ''forma di espressione'' angefuegt: ''anche laddove create con l''ausilio
    di strumenti di intelligenza artificiale, purche costituenti risultato del lavoro intellettuale dell''autore''.
    Damit ist das Erfordernis menschlicher Schoepfung erstmals im italienischen Gesetzestext ausdruecklich
    verankert. lit. b) fuegt Art. 70-septies ein: ''Fermo restando quanto previsto dalla Convenzione di
    Berna [...], le riproduzioni e le estrazioni da opere o da altri materiali contenuti in rete o in
    banche di dati a cui si ha legittimamente accesso, ai fini dell''estrazione di testo e di dati attraverso
    modelli e sistemi di intelligenza artificiale, anche generativa, sono consentite in conformita alle
    disposizioni di cui agli articoli 70-ter e 70-quater.'' Das ist eine Klarstellung, keine neue Schranke:
    die TDM-Ausnahmen der DSM-Richtlinie werden ausdruecklich auf generative Modelle erstreckt, samt Opt-out-Vorbehalt
    des Art. 70-quater.'
  - 'Art. 26 (STRAFRECHT): lit. a) neuer Erschwerungsgrund Art. 61 Nr. 11-decies c.p.; lit. b) Aenderung
    Art. 294 c.p. (Wahltaeuschung); lit. c) neuer Art. 612-quater c.p.; ferner Art. 171 lit. a-ter legge
    633/1941, Art. 2637 c.c. und Art. 185 d.lgs. 58/1998 (TUF). Systematische Entscheidung: kein KI-Sonderstrafrecht,
    sondern ein Erschwerungsgrund plus ein einziger neuer Tatbestand plus punktuelle Qualifikationen in
    schon bestehenden Delikten.'
  - 'Art. 26 — Art. 612-quater c.p. im Wortlaut: ''Illecita diffusione di contenuti generati o alterati
    con sistemi di intelligenza artificiale. — Chiunque cagiona un danno ingiusto ad una persona, cedendo,
    pubblicando o altrimenti diffondendo, senza il suo consenso, immagini, video o voci falsificati o
    alterati mediante l''impiego di sistemi di intelligenza artificiale e idonei a indurre in inganno
    sulla loro genuinita, e punito con la reclusione da uno a cinque anni. Il delitto e punibile a querela
    della persona offesa. Si procede tuttavia d''ufficio se il fatto e connesso con altro delitto per
    il quale si deve procedere d''ufficio ovvero se e commesso nei confronti di persona incapace, per
    eta o per infermita, o di una pubblica autorita a causa delle funzioni esercitate.'' Stellung im Titel
    XII, Delitti contro la persona, Sezione III (delitti contro la liberta morale) — unmittelbar nach
    dem Revenge-Porn-Tatbestand Art. 612-ter c.p.'
  - 'Art. 26 — Art. 61 Nr. 11-decies c.p. im Wortlaut: ''l''avere commesso il fatto mediante l''impiego
    di sistemi di intelligenza artificiale, quando gli stessi, per la loro natura o per le modalita di
    utilizzo, abbiano costituito mezzo insidioso, ovvero quando il loro impiego abbia comunque ostacolato
    la pubblica o la privata difesa, ovvero aggravato le conseguenze del reato.'' Allgemeiner (nicht:
    besonderer) Erschwerungsgrund, damit auf JEDE vorsaetzliche Straftat anwendbar; Strafschaerfung bis
    zu einem Drittel nach Art. 64 c.p.'
  - 'Art. 26 — Art. 294 c.p. (Attentati contro i diritti politici del cittadino): ''La pena e della reclusione
    da due a sei anni se l''inganno e posto in essere mediante l''impiego di sistemi di intelligenza artificiale.''
    Der Grundtatbestand sieht ein bis fuenf Jahre vor; die KI-Variante hebt Mindest- und Hoechstmass an
    — Wahlmanipulation durch Deepfakes.'
  - 'Art. 26 — Art. 2637 c.c. (Aggiotaggio): ''La pena e della reclusione da due a sette anni se il fatto
    e commesso mediante l''impiego di sistemi di intelligenza artificiale.'''
  - 'Art. 26 — Art. 185 d.lgs. 58/1998 (Manipolazione del mercato): ''La pena e della reclusione da due
    a sette anni e della multa da euro venticinquemila a euro sei milioni se il fatto e commesso mediante
    l''impiego di sistemi di intelligenza artificiale.'''
  - 'Art. 26 — Art. 171 legge 633/1941 neue lit. a-ter): strafbar ist, wer ''riproduce o estrae testo
    o dati da opere o altri materiali disponibili in rete o in banche di dati in violazione degli articoli
    70-ter e 70-quater, anche attraverso sistemi di intelligenza artificiale''. Damit wird die Verletzung
    des TDM-Opt-out KRIMINALISIERT (Art. 171 Abs. 1: Geldstrafe von 51 bis 2.065 Euro) — europaweit bislang
    ohne Parallele.'
  - 'Art. 27: Haushaltsneutralitaetsklausel — mit Ausnahme des Art. 21 duerfen aus der Durchfuehrung keine
    neuen oder hoeheren Lasten fuer die oeffentliche Hand entstehen.'
  - 'Art. 28: Schlussbestimmungen — Neufassung des Art. 7 Abs. 1 lit. z) DL 82/2021 (die ACN darf Kooperationsvereinbarungen
    mit Privaten und oeffentlich-private Partnerschaften schliessen und mit Genehmigung des Ministerpraesidenten
    Konsortien, Stiftungen oder Gesellschaften mit italienischen oder EU-Partnern beitreten) sowie Aenderungen
    der legge 90/2024 (Cybersicherheit). Keine eigene Inkrafttretensregelung — es gilt die Regelfrist
    von fuenfzehn Tagen.'
