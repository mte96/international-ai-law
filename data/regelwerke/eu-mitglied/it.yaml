- id: it-ag-418-dlgs-polizia-responsabilita
  jurisdiktion: it
  kurztitel: Durchfuehrungsdekret I — KI in der Polizeiarbeit, Straf- und Zivilhaftung
  offizieller_titel: Schema di decreto legislativo recante adeguamento della normativa nazionale alle
    disposizioni del regolamento (UE) 2024/1689 del Parlamento europeo e del Consiglio, del 13 giugno
    2024, che stabilisce regole armonizzate sull'intelligenza artificiale, in materia di utilizzo dei
    sistemi di intelligenza artificiale per l'attivita di polizia e di responsabilita penale e civile
  fundstelle: 'Noch keine Gazzetta-Ufficiale-Fundstelle. Parlamentarische Fundstelle: Atto del Governo
    n. 418, XIX legislatura'
  verfahrensnummer: A.G. 418 (Camera und Senato); Consiglio dei Ministri n. 177 vom 10.06.2026 (esame
    preliminare), Consiglio dei Ministri vom 04.08.2026 (esame definitivo)
  status: verabschiedet
  status_detail: 'Am 10.06.2026 vom Ministerrat vorlaeufig, am 04.08.2026 endgueltig beschlossen. Eine
    Veroeffentlichung in der Gazzetta Ufficiale war am 04.09.2026 nicht nachweisbar; das Dekret ist damit
    beschlossen, aber nicht in Kraft. Die zugrunde liegende Delega (Art. 24 Abs. 2 lit. h, Abs. 3-5 Legge
    132/2025) laeuft am 10.10.2026 ab.

    '
  kurzbeschreibung: 'Erstes von zwei Dekreten zur Ausfuellung der deleghe des Art. 24 Legge 132/2025.
    Es besteht aus 22 Artikeln in zwei Titeln. Titel I (elf Artikel) regelt den KI-Einsatz in der Polizeiarbeit:
    allgemeine Bestimmungen und Definitionen, Entwicklung, Erprobung und Schulung, Verarbeitung biometrischer
    Daten, biometrische Fernidentifizierung in Echtzeit (Art. 8) und nachtraegliche Gesichtserkennung
    (Art. 10). Titel II (elf Artikel) enthaelt das Straf- und Zivilhaftungsrecht: einen neuen Art. 437-bis
    c.p. (unterlassene Sicherheitsmassnahmen bei KI-Systemen und rechtswidrige Systemveraenderung, ein
    bis fuenf Jahre bei konkreter Gefahr fuer Leben und koerperliche Unversehrtheit, zwei bis acht Jahre
    bei Gefahr fuer die oeffentliche oder staatliche Sicherheit, zwei bis sechs bzw. drei bis zehn Jahre
    bei rechtswidriger Systemveraenderung, Strafmilderung um ein Drittel bis ein Sechstel bei grober Fahrlaessigkeit),
    einen neuen Art. 359-ter c.p.p. zur biometrischen Echtzeit-Fernidentifizierung im Ermittlungsverfahren
    unter Richtervorbehalt, die Erweiterung der Verbandsverantwortlichkeit (Art. 25-vicies d.lgs. 231/2001)
    um die KI-Straftatbestaende sowie zivilrechtliche Beweiserleichterungen: Offenlegungsanspruch (Art.
    17), Kausalitaetsvermutung bei Verletzung von KI-VO-Pflichten (Art. 18) und Direktanspruch gegen den
    Haftpflichtversicherer (Art. 20).

    '
