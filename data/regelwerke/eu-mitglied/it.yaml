  - Anlass ist ausdruecklich die Faehigkeit fortgeschrittener KI-Modelle, Schwachstellen selbstaendig
    zu identifizieren und auszunutzen — offensive KI als Aufsichtsthema.
  - Harte Frist 31.12.2026 fuer Bericht und Massnahmenplan an das Verwaltungsorgan und die Aufsicht.
  - 'Institutioneller Hintergrund: Art. 20 Abs. 2 Legge 132/2025 belaesst Banca d''Italia, CONSOB und
    IVASS die Rolle der Marktueberwachungsbehoerde fuer ihren Sektor.'
