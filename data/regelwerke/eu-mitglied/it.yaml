- id: it-consob-suptech-ia
  jurisdiktion: it
  kurztitel: CONSOB — KI in der Finanzmarktaufsicht (Quaderni FinTech)
  offizieller_titel: CONSOB, Quaderni FinTech n. 15 — Riflessioni in tema di intelligenza artificiale
    e attivita di vigilanza; Quaderni FinTech n. 19 — Sperimentazione dell'IA nell'azione di vigilanza
  fundstelle: Commissione Nazionale per le Societa e la Borsa, Quaderni FinTech n. 15 (agosto 2025) und
    n. 19
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Die Quaderni FinTech sind Forschungsarbeiten der CONSOB, keine Aufsichtsakte; sie binden
    weder Marktteilnehmer noch die Behoerde. Erfasst werden sie hier, weil die CONSOB nach Art. 20 Abs.
    2 Legge 132/2025 Marktueberwachungsbehoerde fuer ihren Sektor ist und weil Art. 26 Legge 132/2025
    mit der Qualifikation des Art. 185 TUF unmittelbar in ihren Zustaendigkeitsbereich eingreift. Ein
    eigenstaendiger Aufsichtsakt der CONSOB zur KI (etwa ein richiamo di attenzione) war am 04.09.2026
    nicht nachweisbar.

    '
  kurzbeschreibung: 'Die CONSOB naehert sich der KI bislang forschend, nicht regulierend. Quaderno FinTech
    n. 15 vom August 2025 verbindet eine normative Analyse mit internationalen SupTech-Erfahrungen und
    empirischen Befunden zur datengestuetzten Aufsicht; Quaderno n. 19 behandelt die Erprobung von KI
    in der Aufsichtstaetigkeit selbst. Rechtlich relevant ist die CONSOB im italienischen KI-Recht an
    drei Stellen: als Marktueberwachungsbehoerde nach Art. 20 Abs. 2 Legge 132/2025 fuer den ihr unterstellten
    Sektor, als Verfolgungsbehoerde fuer die verwaltungsrechtliche Marktmanipulation nach Art. 187-ter
    TUF und als Anzeigenerstatterin fuer die durch Art. 26 Legge 132/2025 qualifizierte Straftat des Art.
    185 TUF (Freiheitsstrafe von zwei bis sieben Jahren und Geldstrafe von 25.000 bis sechs Millionen
    Euro bei Begehung mittels KI-Systemen).

    '
  inkrafttreten:
    datum: 2025-08-06
    verifiziert: true
    quelle: https://www.consob.it/web/area-pubblica/ft15
  anwendungsdaten:
  - datum: 2025-08-06
    was_gilt: Veroeffentlichung des Quaderno FinTech n. 15 mit begleitender Pressemitteilung.
    verifiziert: true
    quelle: https://www.consob.it/web/area-pubblica/ft15
  themenachsen:
  - sektor-finanz
  - governance
  regelungsschwerpunkte:
  - 'Quaderno FinTech n. 15 (August 2025): normative Analyse, internationale SupTech-Erfahrungen, empirische
    Befunde zur datengestuetzten Aufsicht. Autorinnen P. Deriu und S. Racioppi.'
  - 'Quaderno FinTech n. 19: Erprobung von KI in der Aufsichtstaetigkeit.'
  - Keine Bindungswirkung — Forschungsreihe, kein Aufsichtsakt.
  - 'Institutionelle Rolle: Marktueberwachungsbehoerde nach Art. 20 Abs. 2 Legge 132/2025 fuer den Finanzsektor.'
  - 'Materielle Beruehrung: Art. 26 Legge 132/2025 fuegt Art. 185 d.lgs. 58/1998 (TUF) eine KI-Qualifikation
    an — zwei bis sieben Jahre Freiheitsstrafe und Geldstrafe von 25.000 bis 6.000.000 Euro.'
  dokumente:
  - datum: 2025-08-06
    typ: bericht
    titel: Quaderno FinTech n. 15 — Riflessioni in tema di intelligenza artificiale e attivita di vigilanza
    url: https://www.consob.it/web/area-pubblica/ft15
    sprache: it
    urheber: CONSOB
    verifiziert: true
    abruf: ok
    notiz: Amtliche Publikationsseite mit Titel, Datum, Autorinnen und Volltext-Link. Ausdruecklich eine
      Studie, kein Aufsichtsakt.
  - datum: 2025-08-06
    typ: pressemitteilung
    titel: Comunicato stampa del 6 agosto 2025 — Intelligenza artificiale e vigilanza sui mercati finanziari
    url: https://www.consob.it/documents/d/asset-library-1912910/cs_20250806-2
    sprache: it
    urheber: CONSOB
    verifiziert: true
    abruf: ok
    notiz: 'Amtliche Pressemitteilung zum Quaderno n. 15. Position der CONSOB: KI-Systeme sollen als ''digitale
      Assistenten'' wirken, die abschliessende Bewertung bleibt beim Menschen; verlangt werden vollstaendige
      Nachvollziehbarkeit und Erklaerbarkeit der Entscheidungsprozesse. Autorinnen Paola Deriu und Stefania
      Racioppi.

      '
  - datum: 2026-07-01
    typ: bericht
    titel: Quaderni FinTech n. 19 — Sperimentazione dell'IA nell'azione di contrasto della CONSOB agli
      abusivismi finanziari
    url: https://www.consob.it/documents/d/area-pubblica/fintech19
    sprache: it
    urheber: CONSOB; M. Trerotola, A. Boghi, P. Deriu, G. Frega
    verifiziert: true
    abruf: ok
    notiz: 'Amtlicher Volltext, Juli 2026. Beschreibt einen CONSOB-eigenen Softwareprototyp, der mit LLM
      und NLP Anlegerbeschwerden auswertet und verdaechtige Websites auf unerlaubte Finanzdienstleistungen
      untersucht; behandelt hybride Verfahren, deren Grenzen, den Rechtsrahmen und die Sicherung menschlicher
      Aufsicht. Damit setzt die CONSOB KI selbst als Aufsichtswerkzeug ein — ein Anwendungsfall des Art.
      14 Legge 132/2025 in einer unabhaengigen Behoerde.

      '
  offene_punkte:
  - Ein eigenstaendiger Aufsichtsakt der CONSOB zur KI (richiamo di attenzione, Comunicazione) ist nicht
    nachweisbar; im Vergleich zur Banca d'Italia (Comunicazione vom 17.07.2026) besteht eine Regelungsluecke.
  - Genaues Erscheinungsdatum des Quaderno n. 19 nicht verifiziert.
