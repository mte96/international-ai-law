- id: it-strategia-nazionale-ia
  jurisdiktion: it
  kurztitel: Strategia Italiana per l'Intelligenza Artificiale 2024-2026
  offizieller_titel: Strategia Italiana per l'Intelligenza Artificiale 2024-2026
  fundstelle: Dipartimento per la trasformazione digitale, Presidenza del Consiglio dei Ministri, veroeffentlicht
    22.07.2024; seit Art. 19 Legge 132/2025 gesetzlich verankert
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Am 22.07.2024 veroeffentlicht, erarbeitet von einer 14-koepfigen Expertengruppe unter
    Leitung von Gianluigi Greco. Seit Art. 19 Legge 132/2025 hat die Strategie eine gesetzliche Grundlage:
    sie wird von der zustaendigen Stelle der Praesidentschaft des Ministerrats erarbeitet und alle zwei
    Jahre vom Comitato interministeriale per la transizione digitale genehmigt. Eine Fortschreibung ueber
    2026 hinaus war am 04.09.2026 nicht nachweisbar.

    '
  kurzbeschreibung: 'Politisches Strategiedokument ohne Bindungswirkung, das die italienische KI-Politik
    in vier Handlungsfeldern buendelt: Forschung, oeffentliche Verwaltung, Unternehmen und Bildung. Es
    enthaelt ein Ueberwachungssystem und eine regulatorische Analyse. Mit Art. 19 Legge 132/2025 ist die
    Strategie institutionalisiert worden: sie wird zweijaehrlich fortgeschrieben und vom Comitato interministeriale
    per la transizione digitale beschlossen; flankierend richtet Art. 19 ein Comitato di coordinamento
    unter Vorsitz des Ministerpraesidenten ein, das die Taetigkeit oeffentlicher und privater Akteure
    im Innovationsbereich koordiniert.

    '
  inkrafttreten:
    datum: 2024-07-22
    verifiziert: true
    quelle: https://innovazione.gov.it/notizie/articoli/strategia-italiana-per-l-intelligenza-artificiale-2024-2026/
  anwendungsdaten:
  - datum: 2024-07-22
    was_gilt: Veroeffentlichung des vollstaendigen Strategiedokuments.
    verifiziert: true
    quelle: https://innovazione.gov.it/notizie/articoli/strategia-italiana-per-l-intelligenza-artificiale-2024-2026/
  - datum: 2025-10-10
    was_gilt: 'Art. 19 Legge 132/2025 tritt in Kraft: die Strategie erhaelt eine gesetzliche Grundlage
      und einen zweijaehrigen Fortschreibungsrhythmus mit Beschlussfassung durch das Comitato interministeriale
      per la transizione digitale.

      '
    verifiziert: true
    quelle: https://www.gazzettaufficiale.it/eli/gu/2025/09/25/223/sg/pdf
  themenachsen:
  - governance
  - sektor-oeffentlich
  - wettbewerb
  regelungsschwerpunkte:
  - 'Vier Handlungsfelder: Ricerca, Pubblica Amministrazione, Imprese, Formazione.'
  - Enthaelt ein Monitoringsystem und eine Analyse des Regulierungsrahmens.
  - Keine Bindungswirkung; Bedeutung als Bezugspunkt fuer Foerderentscheidungen und als Grundlage des
    Art. 19 Legge 132/2025.
  - Art. 19 Legge 132/2025 verankert den zweijaehrigen Zyklus und das Comitato di coordinamento unter
    Vorsitz des Ministerpraesidenten.
  dokumente:
