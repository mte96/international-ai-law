- id: it-osservatorio-ia-lavoro
  jurisdiktion: it
  kurztitel: Osservatorio IA nel mondo del lavoro (DM 173/2025)
  offizieller_titel: Decreto del Ministro del Lavoro e delle Politiche Sociali 15 dicembre 2025, n. 173
    — Istituzione dell'Osservatorio sull'adozione di sistemi di intelligenza artificiale nel mondo del
    lavoro
  fundstelle: m_lps.28.DECRETO MINISTRO.R.0000173 del 15.12.2025; keine Gazzetta-Ufficiale-Veroeffentlichung
    (Ministerialdekret nicht normativer Art)
  verfahrensnummer: DM 173/2025
  status: anwendbar
  status_detail: 'Am 15.12.2025 von Ministerin Marina Calderone unterzeichnet und damit innerhalb der
    Neunzig-Tage-Frist des Art. 12 Abs. 2 Legge 132/2025 (Ablauf 08.01.2026) erlassen. Operativer Start
    Anfang 2026. Der Osservatorio wird nach eigener Darstellung des Ministeriums derzeit reorganisiert.

    '
  kurzbeschreibung: 'Errichtungsdekret des Beobachtungsgremiums nach Art. 12 Legge 132/2025 beim Arbeitsministerium.
    Aufgaben sind die Entwicklung einer nationalen Strategie zur KI in der Arbeitswelt, die Beobachtung
    der Auswirkungen auf Arbeitsmarkt, Beschaeftigung, Produktivitaet, Arbeitsbedingungen und Kompetenzbedarf,
    die Bestimmung besonders betroffener Sektoren und Berufe, die Foerderung einer ethisch und sozial
    nachhaltigen KI-Integration, die Unterstuetzung bei der Umschulung gefaehrdeter Beschaeftigter und
    die laufende Aktualisierung nationaler Leitlinien. Struktur: Vorsitz der Arbeitsministerin, Lenkungsausschuss,
    vier technisch-wissenschaftliche Fachkomitees, eine Ethikkommission (Vorsitz Paolo Benanti) und ein
    Konsultationsgremium der Sozialpartner. Die Mitglieder erhalten keine Verguetung; die Arbeit erfolgt
    mit vorhandenen Mitteln.

    '
  inkrafttreten:
    datum: 2025-12-15
    verifiziert: true
    quelle: https://www.lavoro.gov.it/documenti-e-norme/dm-173-del-15122025
  anwendungsdaten:
  - datum: 2025-12-15
    was_gilt: Unterzeichnung des Errichtungsdekrets; Erfuellung der Frist des Art. 12 Abs. 2 Legge 132/2025.
    verifiziert: true
    quelle: https://www.lavoro.gov.it/stampa-e-media/comunicati/pagine/nasce-losservatorio-sullia-nel-mondo-del-lavoro
  themenachsen:
  - arbeit
  - governance
  regelungsschwerpunkte:
  - 'Rechtsgrundlage: Art. 12 Abs. 2 Legge 132/2025 (Dekret binnen 90 Tagen).'
  - 'Gremienstruktur: Vorsitz der Ministerin, comitato di indirizzo, vier comitati tecnico-scientifici,
    commissione etica (Vorsitz Paolo Benanti), consulta delle parti sociali.'
  - Keine Verguetung der Mitglieder, keine zusaetzlichen Haushaltsmittel (Art. 12 Abs. 3 Legge 132/2025).
  - 'Kein Regelungs-, sondern Beobachtungs- und Strategiegremium: keine Aufsichts- oder Sanktionsbefugnisse.'
