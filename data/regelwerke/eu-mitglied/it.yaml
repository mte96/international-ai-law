      2021 ab.
  offene_punkte:
  - Eine Fortschreibung fuer den Zyklus ab 2026 nach Art. 19 Legge 132/2025 ist nicht nachweisbar; der
    zweijaehrige Rhythmus laeuft ab Inkrafttreten (10.10.2025).
