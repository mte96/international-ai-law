  offizieller_titel: Linee guida per l'adozione dell'Intelligenza Artificiale nella Pubblica Amministrazione
  fundstelle: Determinazione AgID n. 17 del 17 febbraio 2025 (Einleitung des Konsultations- und Informationsverfahrens);
    Entwurfsfassung 1.0 vom 14.02.2025
  verfahrensnummer: Determinazione n. 17/2025
  status: entwurf
  status_detail: 'Am 17.02.2025 mit Determinazione n. 17 in die oeffentliche Konsultation gegeben, Frist
    20.03.2025. Eine endgueltige Verabschiedung der Leitlinien war am 04.09.2026 nicht nachweisbar; die
    zugaengliche Fassung traegt weiterhin den Titel ''Bozza di linee guida''. Damit ist die zentrale verwaltungsrechtliche
    Konkretisierung des Art. 14 Legge 132/2025 seit ueber achtzehn Monaten in der Schwebe.

    '
  kurzbeschreibung: 'Leitlinien der AgID fuer die Einfuehrung von KI-Systemen in den oeffentlichen Verwaltungen
    nach Art. 2 Abs. 2 des Codice dell''amministrazione digitale. Sie beschreiben KI-Lebenszyklusmodelle,
    die Risikoeinstufung nach der KI-Verordnung, einen Implementierungsrahmen aus Strategie-, Governance-
    und Ueberwachungsphasen sowie Anforderungen an Datenschutz, Cybersicherheit, Datenverwaltung, Kompetenzaufbau
    und Transparenz. Das Dokument unterscheidet sprachlich zwischen verpflichtenden Vorgaben (''MUSS'')
    und Empfehlungen (''SOLLTE''); es ist als Verwaltungsleitlinie nach Art. 71 CAD konzipiert, entfaltet
    aber ohne Verabschiedung keine Bindungswirkung. Erarbeitet wurde es in einem Koordinierungskreis unter
    Beteiligung von AgID, ACN, ANAC und weiteren Stellen.

    '
