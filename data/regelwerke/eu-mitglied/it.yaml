- id: it-mim-dm-166-2025-ia-scuola
  jurisdiktion: it
  kurztitel: DM 166/2025 — Leitlinien fuer die Einfuehrung von KI in Schulen
  offizieller_titel: Decreto ministeriale n. 166 del 9 agosto 2025 — Linee guida per l'introduzione dell'Intelligenza
    Artificiale nelle Istituzioni scolastiche (allegato)
  fundstelle: Ministero dell'Istruzione e del Merito, d.m. n. 166 del 9 agosto 2025; keine Gazzetta-Ufficiale-Veroeffentlichung
  verfahrensnummer: DM 166/2025
  status: anwendbar
  status_detail: 'Am 09.08.2025 erlassen, also zwei Monate vor Inkrafttreten der Legge 132/2025. Als Ministerialdekret
    mit Anlage bindet es die staatlichen Schulen. Das Durchfuehrungsdekret AG 421 ergaenzt den Bildungsbereich
    um KI-Alphabetisierung und Lehrerfortbildung (nach Ministeriumsangaben 100 Mio. Euro).

    '
  kurzbeschreibung: 'Erstes verbindliches Regelwerk fuer den KI-Einsatz an italienischen Schulen. Die
    Leitlinien ruhen auf vier Saeulen: allgemeine Bezugsgrundsaetze, ethische, technische und normative
    Anforderungen, operative Einfuehrungsmodalitaeten sowie Kommunikation und Governance. Zentrale Vorgaben
    sind die menschliche Aufsicht (''sorveglianza umana'') ueber jeden KI-Einsatz, die Vermeidung von
    Diskriminierung und algorithmischem Bias sowie die Konformitaet mit der KI-Verordnung. Praktisch beruehrt
    das Dekret unmittelbar die Altersschwelle des Art. 4 Abs. 4 Legge 132/2025: fuer Schuelerinnen und
    Schueler unter vierzehn Jahren bedarf der Zugang zu KI-Technologien der Einwilligung der Sorgeberechtigten.

    '
  inkrafttreten:
    datum: 2025-08-09
    verifiziert: false
    quelle: https://www.mim.gov.it/documents/20182/0/MIM_Linee+guida+IA+nella+Scuola_09_08_2025-signed.pdf
    fundstelle_norm: Decreto ministeriale n. 166 del 9 agosto 2025 des Ministero dell'Istruzione e del
      Merito. Das Dekret ist nicht in der Gazzetta Ufficiale veröffentlicht; eine eigene Inkrafttretensvorschrift
      ist nicht nachgewiesen. Eingetragen ist das Datum des Dekrets selbst.
  anwendungsdaten:
  - datum: 2025-08-09
    was_gilt: Erlass des DM 166/2025 mit den Linee guida als Anlage.
    verifiziert: false
    quelle: https://www.mim.gov.it/-/pubblicate-le-linee-guida-per-l-introduzione-dell-intelligenza-artificiale-nelle-istituzioni-scolastiche-allegato-al-dm-n-166-del-09-08-2025
  - datum: 2025-10-10
    was_gilt: 'Inkrafttreten des Art. 4 Abs. 4 Legge 132/2025: der Zugang von Kindern unter vierzehn Jahren
      zu KI-Technologien setzt die Einwilligung der Sorgeberechtigten voraus — unmittelbar relevant fuer
      den Schuleinsatz.

      '
    verifiziert: true
    quelle: https://www.gazzettaufficiale.it/eli/gu/2025/09/25/223/sg/pdf
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - 'Vier Saeulen: allgemeine Bezugsgrundsaetze; ethische, technische und normative Anforderungen; operative
    Einfuehrungsmodalitaeten; Kommunikation und Governance.'
  - Menschliche Aufsicht ueber jeden KI-Einsatz im Unterricht.
  - Vermeidung von Diskriminierung und algorithmischem Bias.
  - Ausrichtung an der Verordnung (EU) 2024/1689, insbesondere an der Einstufung von KI in der allgemeinen
    und beruflichen Bildung als Hochrisiko (Anhang III Nr. 3 KI-VO).
  - 'Schnittstelle zu Art. 4 Abs. 4 Legge 132/2025: Einwilligungserfordernis der Sorgeberechtigten fuer
    unter 14-Jaehrige.'
  - Der zweite Regelungsblock des Durchfuehrungsdekrets AG 421 (Alphabetisierung nach Art. 4 KI-VO, MINT-Kompetenzen,
    Lehrerfortbildung mit nach Ministeriumsangaben 100 Mio. Euro) baut hierauf auf.
