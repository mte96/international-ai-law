  regelungsschwerpunkte:
  - 'Art. 5 DL 82/2021: Errichtung der ACN als Behoerde unter der Aufsicht des Ministerpraesidenten und
    der Autorita delegata.'
  - 'Art. 7 Abs. 1 lit. m-quater (eingefuegt durch Art. 18 Legge 132/2025): KI als Ressource fuer die
    nationale Cybersicherheit; ausdrueckliche Ermaechtigung zu Kooperationsvereinbarungen mit Privaten.'
  - 'Art. 7 Abs. 1 lit. z) (neu gefasst durch Art. 28 Abs. 1 Legge 132/2025): Kooperationsvereinbarungen,
    oeffentlich-private Partnerschaften und Beteiligung an Konsortien, Stiftungen und Gesellschaften mit
    italienischen oder EU-Partnern, letzteres mit Genehmigung des Ministerpraesidenten.'
  - 'Die ACN vereinigt damit drei Rollen: Cybersicherheitsbehoerde, KI-Marktueberwachungsbehoerde und
    Foerdereinrichtung mit Beteiligungsbefugnis an privaten Rechtstraegern — eine im europaeischen Vergleich
    ungewoehnliche Buendelung.'
  - Art. 6 Abs. 1 Legge 132/2025 nimmt zugleich die Cybersicherheits- und Sicherheitstaetigkeiten vom
    Anwendungsbereich des KI-Gesetzes aus; die ACN ueberwacht also einen Bereich, in dem sie selbst nicht
    dem nationalen KI-Gesetz unterliegt.
