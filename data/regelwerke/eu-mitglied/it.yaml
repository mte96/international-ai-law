- id: it-ag-421-dlgs-autorita-formazione
  jurisdiktion: it
  kurztitel: Durchfuehrungsdekret II — Befugnisse der nationalen Behoerden, KI in der Bildung
  offizieller_titel: Schema di decreto legislativo recante adeguamento della normativa nazionale alle
    disposizioni del regolamento (UE) 2024/1689 del Parlamento europeo e del Consiglio, del 13 giugno
    2024, che stabilisce regole armonizzate sull'intelligenza artificiale, in materia di poteri delle
    Autorita nazionali e di utilizzo dell'intelligenza artificiale nella formazione
  fundstelle: 'Noch keine Gazzetta-Ufficiale-Fundstelle. Parlamentarische Fundstelle: Atto del Governo
    n. 421, XIX legislatura'
  verfahrensnummer: A.G. 421 (Camera und Senato); Consiglio dei Ministri n. 177 vom 10.06.2026 (esame
    preliminare), Consiglio dei Ministri vom 04.08.2026 (esame definitivo)
  status: verabschiedet
  status_detail: 'Am 10.06.2026 vorlaeufig, am 04.08.2026 endgueltig vom Ministerrat beschlossen. Keine
    Gazzetta-Ufficiale-Veroeffentlichung bis 04.09.2026 nachweisbar. Rechtsgrundlage ist Art. 24 Abs.
    1 und 2 Legge 132/2025; die Delega laeuft am 10.10.2026 ab.

    '
  kurzbeschreibung: 'Zweites Durchfuehrungsdekret. Es fuellt die Behoerdenarchitektur des Art. 20 Legge
    132/2025 mit Befugnissen aus: AgID als notifizierende Behoerde mit Bewertungs- und Akkreditierungsfunktionen,
    ACN als Marktueberwachungsbehoerde mit Inspektions- und Sanktionsbefugnissen, Regelung der nationalen
    Reallabore (sandbox), Fortbestand der Zustaendigkeiten von Banca d''Italia, CONSOB und IVASS fuer
    den Finanzsektor und des Garante fuer den Datenschutz. Der Garante soll zusaetzlich Aufsichtsbehoerde
    fuer Hochrisiko-KI in Strafverfolgung, Grenzverwaltung, Justiz und demokratischen Prozessen werden
    (Art. 74 Abs. 8 KI-VO). Zweiter Regelungsblock ist die Aus- und Fortbildung: KI-Alphabetisierung nach
    Art. 4 KI-VO, Berufsfortbildung, MINT-Kompetenzen in den Lehrplaenen, Hochschul-, AFAM- und ITS-Ausbildung;
    nach Angaben des Bildungsministeriums sind 100 Mio. Euro fuer die Lehrerfortbildung vorgesehen.

    '
