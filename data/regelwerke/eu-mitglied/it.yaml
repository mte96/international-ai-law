  regelungsschwerpunkte:
  - 'Rechtsgrundlage: Art. 24 Abs. 2 lit. h) (KI in der Polizeiarbeit), Abs. 3, 4 und 5 (rechtswidrige
    Herstellung und Nutzung von KI-Systemen, Straf- und Zivilrecht) Legge 132/2025.'
  - 'Titel I, Art. 8: biometrische Fernidentifizierung in Echtzeit — nationale Ausfuellung der Ausnahmen
    des Art. 5 Abs. 1 lit. h) KI-VO.'
  - 'Titel I, Art. 10: nachtraegliche Gesichtserkennung (post-remote biometric identification) — Art.
    26 Abs. 10 KI-VO.'
  - 'Titel II: neuer Art. 437-bis c.p. ''Omessa adozione di misure di sicurezza nei sistemi di intelligenza
    artificiale e alterazione illecita dei sistemi'' — Gefaehrdungsdelikt im Titel VI c.p. (Delitti contro
    l''incolumita pubblica), systematisch neben Art. 437 c.p. (Unterlassung von Unfallverhuetungsmassnahmen).'
  - 'Titel II: neuer Art. 359-ter c.p.p. — biometrische Echtzeit-Fernidentifizierung im Ermittlungsverfahren
    mit richterlicher Genehmigung.'
  - 'Titel II: Erweiterung des Katalogs der Verbandsstraftaten um KI-Delikte (Art. 25-vicies d.lgs. 231/2001),
    einschliesslich Art. 612-quater c.p.'
  - 'Titel II, Art. 17-20: zivilrechtliches Beweisregime — Offenlegung von Beweismitteln, Kausalitaetsvermutung
    bei Verstoss gegen KI-VO-Pflichten, Direktanspruch gegen den Versicherer. Das ist eine nationale Vorwegnahme
    wesentlicher Gedanken der zurueckgezogenen EU-KI-Haftungsrichtlinie.'
