    verifiziert: true
    abruf: ok
    notiz: 'Amtlicher Expertenbericht. Behandelt in Kap. 6 (Giuseppe Cassano) ausdruecklich Art. 25 Legge
      132/2025 und die Frage, wann mit KI-Werkzeugen geschaffene Werke als Ergebnis der intellektuellen
      Arbeit des Urhebers geschuetzt bleiben; ferner das Training auf geschuetzten Datensaetzen, algorithmische
      Verstaerkung als Pluralismusrisiko und die Luecke der EU-Regeln zu politischer Werbung. Empfehlungen
      gegliedert nach ex ante, in itinere, ex post.

      '
