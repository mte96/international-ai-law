- id: it-dlgs-104-2022-trasparenza
  jurisdiktion: it
  kurztitel: Decreto trasparenza — Art. 1-bis d.lgs. 152/1997 (algorithmisches Management)
  offizieller_titel: Decreto legislativo 27 giugno 2022, n. 104 — Attuazione della direttiva (UE) 2019/1152
    del Parlamento europeo e del Consiglio del 20 giugno 2019, relativa a condizioni di lavoro trasparenti
    e prevedibili nell'Unione europea
  fundstelle: Gazzetta Ufficiale Serie Generale n. 176 del 29 luglio 2022 (codice redazionale 22G00113);
    Aenderung durch Art. 26 DL 4 maggio 2023, n. 48, umgewandelt mit Aenderungen durch Legge 3 luglio
    2023, n. 85
  verfahrensnummer: d.lgs. 104/2022; DL 48/2023 conv. L. 85/2023
  status: anwendbar
  status_detail: 'In Kraft seit 13.08.2022. Art. 4 d.lgs. 104/2022 hat Art. 1-bis in das d.lgs. 26 maggio
    1997, n. 152 eingefuegt. Das DL 48/2023 (''decreto lavoro''), umgewandelt durch Legge 85/2023, hat
    den Anwendungsbereich auf ''sistemi decisionali o di monitoraggio INTEGRALMENTE automatizzati'' verengt
    und die Vorschrift damit erheblich entschaerft. Art. 11 Abs. 2 Legge 132/2025 verweist fuer den KI-Einsatz
    im Arbeitsverhaeltnis ausdruecklich auf diese Norm.

    '
  kurzbeschreibung: 'Die zentrale italienische Vorschrift zum algorithmischen Management. Art. 1-bis d.lgs.
    152/1997 verpflichtet Arbeitgeber und Auftraggeber, Beschaeftigte ueber den Einsatz automatisierter
    Entscheidungs- oder Ueberwachungssysteme zu informieren, die Einstellung, Aufgabenzuweisung, Beendigung
    oder Leistungsbewertung beeinflussen. Zu informieren ist vor Arbeitsaufnahme ueber die betroffenen
    Aspekte des Arbeitsverhaeltnisses, Zwecke und Ziele des Systems, seine Logik und Funktionsweise, die
    verwendeten Datenkategorien und Parameter, Kontroll-, Korrektur- und Qualitaetssicherungsmassnahmen
    sowie ueber Genauigkeit, Robustheit, Cybersicherheit und potenziell diskriminierende Metriken. Beschaeftigte
    haben einen Zugangsanspruch, den der Arbeitgeber binnen dreissig Tagen schriftlich zu erfuellen hat;
    Aenderungen sind mindestens vierundzwanzig Stunden vorher schriftlich mitzuteilen. Die Informationen
    sind zusaetzlich den Gewerkschaften und der Arbeitsbehoerde in strukturiertem Format zu uebermitteln.
    Sanktion: Verwaltungsgeldbusse von 100 bis 750 Euro je Monat und betroffenem Beschaeftigten (Art.
    19 Abs. 2 d.lgs. 276/2003 in der geaenderten Fassung).

    '
  inkrafttreten:
    datum: 2022-08-13
    verifiziert: true
    quelle: https://www.gazzettaufficiale.it/eli/id/2022/07/29/22G00113/sg
  anwendungsdaten:
  - datum: 2022-08-13
    was_gilt: Inkrafttreten des d.lgs. 104/2022 einschliesslich des neuen Art. 1-bis d.lgs. 152/1997.
    verifiziert: true
    quelle: https://www.gazzettaufficiale.it/eli/id/2022/07/29/22G00113/sg
  - datum: 2023-07-05
    was_gilt: 'Inkrafttreten des Umwandlungsgesetzes Legge 85/2023: Der Anwendungsbereich des Art. 1-bis
      wird auf VOLLSTAENDIG automatisierte Systeme beschraenkt; Systeme mit menschlicher Zwischenentscheidung
      fallen heraus.

      '
    verifiziert: false
    quelle: https://www.gazzettaufficiale.it/eli/gu/2023/07/03/153/sg/pdf
  - datum: 2025-10-10
    was_gilt: 'Art. 11 Abs. 2 Legge 132/2025 macht Art. 1-bis d.lgs. 152/1997 zur massgeblichen Informationsnorm
      auch fuer KI-Systeme im Arbeitsverhaeltnis.

      '
    verifiziert: true
    quelle: https://www.gazzettaufficiale.it/eli/gu/2025/09/25/223/sg/pdf
  themenachsen:
  - arbeit
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Art. 4 d.lgs. 104/2022 fuegt Art. 1-bis in das d.lgs. 152/1997 ein: ''Ulteriori obblighi informativi
    nel caso di utilizzo di sistemi decisionali o di monitoraggio automatizzati''.'
  - 'Abs. 1: Adressat ist der Arbeitgeber oder oeffentliche/private Auftraggeber; erfasst sind Systeme
    mit Auswirkungen auf Einstellung, Aufgabenzuweisung, Beendigung und Leistungsbewertung.'
  - 'Abs. 2: Katalog der vor Arbeitsaufnahme zu erteilenden Informationen — betroffene Aspekte, Zwecke
    und Ziele, Logik und Funktionsweise, Datenkategorien und Parameter, Kontroll- und Korrekturmassnahmen
    und Verantwortlicher fuer die Qualitaetssicherung, Genauigkeit, Robustheit, Cybersicherheit und diskriminierungsrelevante
    Metriken.'
  - 'Abs. 3: Zugangsanspruch der Beschaeftigten; schriftliche Antwort binnen dreissig Tagen.'
  - 'Abs. 5: Aenderungsmitteilung mindestens vierundzwanzig Stunden im Voraus.'
  - 'Abs. 6: Uebermittlung an Gewerkschaften und Arbeitsbehoerde in strukturiertem, maschinenlesbarem
    Format.'
  - 'Sanktion ueber Art. 19 Abs. 2 d.lgs. 276/2003: 100 bis 750 Euro monatlich fuer Verstoesse gegen die
    Abs. 2, 3 und 5.'
  - 'Die Verengung durch DL 48/2023 / Legge 85/2023 auf ''integralmente automatizzati'' ist der zentrale
    Streitpunkt: Systeme mit human-in-the-loop — also gerade der praktische Regelfall KI-gestuetzter Personalentscheidungen
    — fallen nach herrschender Lesart aus dem Anwendungsbereich heraus.'
