  offene_punkte:
  - Ist das Dekret nach Art. 9 Abs. 1 (Gesundheitsdaten, Frist 07.02.2026) ergangen? Kein amtlicher Beleg
    auffindbar — moeglicherweise ueberfaellig.
  - Die Delega des Art. 16 (Daten, Algorithmen, mathematische Methoden fuer das Training) ist bislang
    nicht ausgeuebt; sie laeuft am 10.10.2026 ab. Sie waere die einzige nationale Regelung zum Rechtsregime
    der Trainingsdaten und beruehrt unmittelbar die urheberrechtliche Debatte um Art. 70-septies.
  - 'Verhaeltnis von Art. 6 (Bereichsausnahme fuer Sicherheit, Verteidigung, Kriminalpraevention) zur
    Delega des Art. 24 Abs. 2 lit. h) (Regelung des KI-Einsatzes in der Polizeiarbeit): das Gesetz nimmt
    die Polizeiarbeit aus dem eigenen Anwendungsbereich heraus und ermaechtigt zugleich zu ihrer Regelung.
    Ob AG 418 diese Spannung aufloest, ist offen.'
  - Art. 3 Abs. 5 stellt klar, dass keine ueber die KI-VO hinausgehenden Pflichten begruendet werden —
    dennoch enthaelt das Gesetz mit Art. 4 Abs. 4 (Zugangsschranke fuer unter 14-Jaehrige), Art. 13 (freie
    Berufe) und Art. 171 lit. a-ter l. 633/1941 (Kriminalisierung der TDM-Opt-out-Verletzung) Regelungen
    ohne Entsprechung in der KI-VO. Das Verhaeltnis zum Harmonisierungsanspruch der Verordnung ist ungeklaert
    und ein Kandidat fuer ein Vertragsverletzungsverfahren.
  - Art. 612-quater c.p. verlangt einen 'danno ingiusto' als Taterfolg. Ob damit ein Erfolgsdelikt oder
    ein Delikt mit blossem objektivem Bedingungsmerkmal gemeint ist, wird in der Literatur unterschiedlich
    beurteilt; die Antragserfordernis (querela) begrenzt die Verfolgung zusaetzlich.
  - Die Behoerdenarchitektur des Art. 20 ist doppelspurig (AgID/ACN) und ueberlagert sich mit Garante,
    AGCOM, Banca d'Italia, CONSOB und IVASS. Ein Koordinierungsmechanismus ist nur rudimentaer geregelt
    (Comitato bei der Praesidentschaft des Ministerrats).
  - Italien hat die unionsrechtliche Frist des Art. 70 Abs. 2 KI-VO zur Behoerdenbenennung (02.08.2025)
    verfehlt; Art. 20 gilt erst ab 10.10.2025.
