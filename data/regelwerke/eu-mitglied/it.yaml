  regelungsschwerpunkte:
  - 'Vier Arbeitsfelder: Urheberrechtsschutz bei KI-Nutzung mit Transparenz- und Verguetungsgrundsaetzen;
    Opt-out-Mechanismen nach der DSM-Richtlinie; Mechanismen der Nachrichtenauswahl und Medienpluralismus;
    Desinformationspraevention.'
  - 'Teilnehmer: Anbieter sozialer Netzwerke und Suchmaschinen, Presseverleger, Branchenverbaende; Google,
    FIEG und FISC haben Teilnahme erklaert.'
  - Berichtspflicht an den Consiglio der AGCOM mindestens halbjaehrlich.
  - 'Rechtsgrundlagen: DSA (EU) 2022/2065, DSM-Richtlinie (EU) 2019/790, KI-VO (EU) 2024/1689, EMFA (EU)
    2024/1083.'
  - 'Praktische Bedeutung: die AGCOM bearbeitet damit die Schnittstelle, die Art. 25 Legge 132/2025 (Verweis
    auf Art. 70-ter/70-quater l. 633/1941) normativ offen laesst — naemlich wie das TDM-Opt-out gegenueber
    generativen Modellen praktisch ausgeuebt und durchgesetzt wird.'
