- id: it-garante-decalogo-ia-sanita
  jurisdiktion: it
  kurztitel: Garante-Decalogo zur KI im nationalen Gesundheitsdienst
  offizieller_titel: Decalogo per la realizzazione di servizi sanitari nazionali attraverso sistemi di
    Intelligenza Artificiale
  fundstelle: Garante per la protezione dei dati personali, doc. web n. 9938038, veroeffentlicht am 10
    ottobre 2023
  verfahrensnummer: doc. web 9938038
  status: softlaw
  status_detail: 'Am 10.10.2023 veroeffentlicht, zwei Jahre vor der Legge 132/2025. Der Decalogo ist kein
    Bescheid, sondern eine Orientierungshilfe des Garante; er bleibt neben Art. 7 bis 10 Legge 132/2025
    der praktisch massgebliche Datenschutzmassstab fuer KI im Gesundheitswesen und wird durch Art. 8 Legge
    132/2025 (Leitlinien der AGENAS nach Anhoerung des Garante) ergaenzt, nicht ersetzt.

    '
  kurzbeschreibung: 'Zehn-Punkte-Katalog des italienischen Datenschutzbeauftragten zur datenschutzkonformen
    Gestaltung KI-gestuetzter Dienste im nationalen Gesundheitsdienst. Der Decalogo behandelt insbesondere
    die Rechtsgrundlage der Verarbeitung, die Rollenverteilung zwischen Verantwortlichem und Auftragsverarbeiter,
    die Datenschutz-Folgenabschaetzung, Transparenz und Information der Betroffenen, Genauigkeit und Aktualitaet
    der Daten, Nichtdiskriminierung, menschliche Aufsicht ueber automatisierte Entscheidungen sowie Datensicherheit.
    Er ist der wichtigste Vorlaeufer der spaeteren gesetzlichen Regelung und wird in der italienischen
    Praxis als Pruefraster fuer Art. 22 DSGVO und Art. 14 KI-VO im Gesundheitsbereich verwendet.

    '
  inkrafttreten:
    datum: 2023-10-10
    verifiziert: true
    quelle: https://www.garanteprivacy.it/web/guest/home/docweb/-/docweb-display/docweb/9938038
  anwendungsdaten:
  - datum: 2023-10-10
    was_gilt: Veroeffentlichung des Decalogo; zeitgleiche Ankuendigung im Newsletter des Garante.
    verifiziert: true
    quelle: https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/9937730
  themenachsen:
  - sektor-medizin
  - datenschutz
  - grundrechte
  regelungsschwerpunkte:
  - Rechtsgrundlage der Verarbeitung besonderer Kategorien von Gesundheitsdaten und Erforderlichkeit einer
    gesetzlichen Grundlage fuer nationale KI-Gesundheitsdienste.
  - Rollen und Verantwortlichkeiten (Verantwortlicher, Auftragsverarbeiter) bei zentral betriebenen KI-Plattformen.
  - Verpflichtende Datenschutz-Folgenabschaetzung.
  - Transparenz, Information und Verstaendlichkeit gegenueber den Betroffenen.
  - Datenqualitaet, Genauigkeit, Nichtdiskriminierung, Vermeidung von Bias.
  - Menschliche Aufsicht ueber automatisierte Entscheidungen (Art. 22 DSGVO).
  - 'Bezug zur spaeteren Regelung: Art. 7 Abs. 3 Legge 132/2025 (Informationsrecht der Patienten) und
    Art. 8 Legge 132/2025 (AGENAS-Leitlinien zu Anonymisierung und synthetischen Daten nach Anhoerung
    des Garante) bauen erkennbar darauf auf.'
