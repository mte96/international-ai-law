    typ: bericht
    titel: 'Intelligenza Artificiale — II PARTE: Rapporto del Comitato di esperti sull''Intelligenza Artificiale,
      2026'
    url: https://www.agcom.it/sites/default/files/media/allegato/2026/II%20parte%20-%20Report_IA.pdf
    sprache: it
    urheber: Comitato di esperti sull'Intelligenza Artificiale, eingesetzt von der Autorita per le garanzie
