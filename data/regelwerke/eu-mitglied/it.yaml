  - datum: 2025-10-10
    was_gilt: 'Art. 18 und Art. 28 Legge 132/2025 treten in Kraft: neuer KI-Auftrag der ACN (Art. 7 Abs.
      1 lit. m-quater) und erweiterte Kooperationsbefugnisse (lit. z). Zugleich wird die ACN nach Art.
      20 Abs. 2 Legge 132/2025 nationale Marktueberwachungs- behoerde fuer KI.

      '
