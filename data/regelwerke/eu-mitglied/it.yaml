- id: it-csm-raccomandazioni-ia
  jurisdiktion: it
  kurztitel: CSM-Empfehlungen zum KI-Einsatz in der Justiz
  offizieller_titel: Consiglio Superiore della Magistratura — Raccomandazioni sull'uso dell'intelligenza
    artificiale negli uffici giudiziari (delibera plenaria 8 ottobre 2025; aggiornamento 22 luglio 2026)
  fundstelle: Delibere del Plenum del CSM vom 08.10.2025 und vom 22.07.2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Das Plenum des CSM hat am 08.10.2025 — zwei Tage vor Inkrafttreten der Legge 132/2025
    — Empfehlungen zum KI-Einsatz in den Gerichtsbehoerden beschlossen und diese am 22.07.2026 erweitert
    und praezisiert. Es handelt sich um Selbstverwaltungsakte des Richterrats ohne Rechtsnormqualitaet;
    disziplinarrechtlich sind sie gleichwohl als Massstab richterlichen Verhaltens erheblich.

    '
  kurzbeschreibung: 'Zentrale Vorgabe ist, dass KI den Richter unterstuetzt und nicht ersetzt: Entscheidungen
    ueber Rechtsauslegung, Tatsachenwuerdigung und Anordnungen bleiben ausschliesslich dem Magistrat vorbehalten
    — die berufsrechtliche Parallele zu Art. 15 Abs. 1 Legge 132/2025. Zulaessig sind nach der Fassung
    von 2025 Dokumentenrecherche, Zusammenfassungen, Arbeitsorganisation, standardisierte Entwuerfe in
    einfachen Faellen, Datenkontrollen und Terminverwaltung; nur vom Justizministerium autorisierte Systeme
    innerhalb der Justizdomaene duerfen genutzt werden, mit Datennachverfolgbarkeit und menschlicher Kontrolle.
    Die Aktualisierung vom 22.07.2026 erlaubt zusaetzlich die Analyse und den Vergleich von Prozessakten,
    aber ausschliesslich innerhalb des institutionellen Tenants des Justizministeriums, und nennt fuenf
    weitere zulaessige Taetigkeiten: Klassifizierung von Akten, strukturierte Analyse der Parteivortraege,
    Zusammenfassung von Dokumenten, Vergleich der Positionen zur Bestimmung von thema decidendum und thema
    probandum sowie unterstuetztes Ausfuellen standardisierter Formulare. Die Anonymisierung wird von
    einer absoluten Anforderung zur empfohlenen guten Praxis herabgestuft.

    '
  inkrafttreten:
    datum: 2025-10-08
    verifiziert: false
    quelle: https://www.csm.it/portale/web/csm-internet/w/raccomandazioni-intelligenza-artificiale
    fundstelle_norm: Delibera des Plenums des Consiglio Superiore della Magistratura vom 08.10.2025, erweitert
      durch Delibera vom 22.07.2026. Selbstverwaltungsakt ohne Inkrafttretensvorschrift; eingetragen ist
      das Datum der Beschlussfassung.
  anwendungsdaten:
  - datum: 2025-10-08
    was_gilt: Beschluss der urspruenglichen Raccomandazioni durch das Plenum des CSM.
    verifiziert: false
    quelle: https://www.csm.it/portale/web/csm-internet/w/raccomandazioni-intelligenza-artificiale
  - datum: 2026-07-22
    was_gilt: 'Aktualisierung durch das Plenum: Analyse und Vergleich von Prozessakten im institutionellen
      Tenant zulaessig; fuenf weitere erlaubte Taetigkeiten; Anonymisierung nur noch als buona pratica.

      '
    verifiziert: false
    quelle: https://www.csm.it/portale/web/csm-internet/intelligenza-artificiale
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Leitprinzip: KI unterstuetzt, ersetzt aber nicht — Entscheidungen ueber Auslegung, Tatsachenwuerdigung
    und Anordnungen bleiben dem Magistrat vorbehalten (Parallele zu Art. 15 Abs. 1 Legge 132/2025).'
  - Nur vom Justizministerium autorisierte Systeme innerhalb der Justizdomaene; Datensouveraenitaet, Minimierung
    sensibler Daten, menschliche Aufsicht, regelmaessige Audits.
  - 'Fassung 2025 — zulaessig: Dokumentenrecherche, Zusammenfassungen, Arbeitsorganisation, standardisierte
    Entwuerfe in einfachen Faellen, Datenkontrollen, Terminverwaltung.'
  - 'Fassung 2026 — zusaetzlich zulaessig: Analyse und Vergleich von Prozessakten (nur im institutionellen
    Tenant des Ministeriums), Klassifizierung von Akten, strukturierte Analyse der Parteipositionen, Dokumentzusammenfassungen,
    Vergleich zur Bestimmung von thema decidendum und thema probandum, unterstuetztes Ausfuellen standardisierter
    Formulare.'
  - Fassung 2026 — Herabstufung der Anonymisierung von einer Pflicht zur empfohlenen guten Praxis; das
    ist die datenschutzrechtlich bemerkenswerteste Aenderung.
  - Das CSM hatte bereits zum Gesetzentwurf A.S. 1146/24 eine Stellungnahme abgegeben.
