  regelungsschwerpunkte:
  - 'Rechtsgrundlage: Art. 24 Abs. 1 und 2 Legge 132/2025 (Anpassung an die KI-VO).'
  - Ausgestaltung der Aufsichts-, Inspektions- und Sanktionsbefugnisse von ACN und AgID einschliesslich
    Sekundaerrechtsetzung.
  - Nationale Reallabore (sandbox) nach Art. 57 ff. KI-VO; der Garante fordert in seiner Stellungnahme
    eine unmittelbare Beteiligung.
  - Benennung des Garante als Marktueberwachungsbehoerde fuer Hochrisiko-KI in Strafverfolgung, Grenzverwaltung,
    Justiz und demokratischen Prozessen (Anhang III Nr. 6-8 KI-VO in Verbindung mit Art. 74 Abs. 8 KI-VO).
  - Verwaltungssanktionen; der Garante verlangt einen ausdruecklichen Verweis auf Art. 166 Codice privacy
    fuer das Sanktionsverfahren sowie eine klare Regelung der Verwendung der Bussgeldeinnahmen.
  - Klarstellung der Verantwortlichkeit nach Art. 31 Abs. 9 KI-VO (Konformitaetsbewertungsstellen).
  - 'Art. 11 des Entwurfs: Erweiterung der Kompetenzen des Garante auf Leitlinien und Empfehlungen im
    KI-Bereich.'
  - 'Art. 26 des Entwurfs: Beteiligung des Garante bei Projekten mit Verarbeitung personenbezogener Daten.'
  - 'Art. 40 des Entwurfs: der Garante regt an, die Regelung auf bewertende Entscheidungen mit erheblichen
    Auswirkungen auf das Arbeitsverhaeltnis zu erstrecken — ein arbeitsrechtlicher Anknuepfungspunkt neben
    Art. 1-bis d.lgs. 152/1997.'
  - 'Bildungsteil: KI-Alphabetisierung (Art. 4 KI-VO), MINT-Kompetenzen, Hochschul- und AFAM-Ausbildung,
    Berufsfortbildung; nach Angaben des MIM 100 Mio. Euro fuer die Lehrerfortbildung.'
