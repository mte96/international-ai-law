- id: it-cnf-guida-ia-generativa
  jurisdiktion: it
  kurztitel: CNF/CCBE-Leitfaden zum Einsatz generativer KI durch Anwaeltinnen und Anwaelte
  offizieller_titel: Guida del CCBE sull'uso dell'intelligenza artificiale generativa da parte degli avvocati
    (italienische Fassung, herausgegeben vom Consiglio Nazionale Forense)
  fundstelle: CCBE, 2. Oktober 2025; italienische Uebersetzung des Bruesseler Buero des Consiglio Nazionale
    Forense, veroeffentlicht auf consiglionazionaleforense.it
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Der Leitfaden des Council of Bars and Law Societies of Europe vom 02.10.2025 ist vom
    CNF in italienischer Uebersetzung veroeffentlicht worden. Er hat keine Bindungswirkung, konkretisiert
    aber die Berufspflichten, an denen sich die Disziplinarorgane orientieren, und ist die einzige auf
    CNF-Ebene verfuegbare Handreichung zu generativer KI. Ein eigenstaendiger, vom CNF selbst gesetzter
    Verhaltenskodex zur KI war am 04.09.2026 nicht nachweisbar.

    '
  kurzbeschreibung: 'Der Leitfaden beschreibt Chancen und Risiken generativer KI in der Anwaltspraxis
    und leitet aus den anwaltlichen Kernpflichten konkrete Anforderungen ab: Verschwiegenheit (keine Eingabe
    mandatsbezogener Daten in GenAI-Oberflaechen ohne gesicherte Auftragsverarbeitung), Fachkompetenz
    (fortlaufende Fortbildung, Verifikation jedes Outputs vor Verwendung, Kenntnis der Grenzen des Systems),
    Unabhaengigkeit (Minimierung von Verzerrungs- und Beeinflussungsrisiken), Transparenz (Information
    des Mandanten ueber den GenAI-Einsatz in seiner Sache) und Vermeidung von Interessenkonflikten bei
    mandatsuebergreifender Nutzung. Als Hauptrisiken benennt er Halluzinationen, Datenschutz, fehlende
    Nachvollziehbarkeit (''Black Box''), Bias, Immaterialgueterrechtsprobleme und Betrug. Die Transparenzanforderung
    deckt sich inhaltlich mit Art. 13 Abs. 2 Legge 132/2025, der die Information des Mandanten gesetzlich
    vorschreibt.

    '
  inkrafttreten:
    datum: 2025-10-02
    verifiziert: false
    quelle: https://www.consiglionazionaleforense.it/documents/20182/3593400/Guida+del+CCBE+sull%E2%80%99uso+dell%E2%80%99intelligenza+artificiale+generativa+da+parte+degli+avvocati.pdf/0fdee427-fb50-7e41-fbd6-5bae7acec75c?t=1763380452292
  anwendungsdaten:
  - datum: 2025-10-02
    was_gilt: Verabschiedung des Leitfadens durch den CCBE.
    verifiziert: false
    quelle: https://www.consiglionazionaleforense.it/documents/20182/3593400/Guida+del+CCBE+sull%E2%80%99uso+dell%E2%80%99intelligenza+artificiale+generativa+da+parte+degli+avvocati.pdf/0fdee427-fb50-7e41-fbd6-5bae7acec75c?t=1763380452292
  themenachsen:
  - berufsrecht
  - datenschutz
  - haftung
  - vertrag
  regelungsschwerpunkte:
  - 'Verschwiegenheit: keine Eingabe sensibler Mandantendaten in GenAI-Oberflaechen; Absicherung ueber
    Auftragsverarbeitungsvertraege.'
  - 'Fachkompetenz: ''Gli avvocati devono mantenere le proprie competenze professionali attraverso la
    formazione continua''; Verifikationspflicht vor Verwendung jedes Outputs.'
  - 'Unabhaengigkeit: Minimierung von Bias und algorithmischer Beeinflussung.'
  - Transparenz gegenueber dem Mandanten beim GenAI-Einsatz — deckungsgleich mit der gesetzlichen Pflicht
    des Art. 13 Abs. 2 Legge 132/2025.
  - Interessenkonflikte bei mandatsuebergreifender Nutzung desselben Systems.
  - 'Risikokatalog: Halluzinationen, Datenschutz, Black Box, Bias, IP, Betrug.'
  - 'Rechtsnatur: unverbindliche Handreichung; die italienische Fassung ist eine ''traduzione non ufficiale''
    des CNF-Bueros in Bruessel.'
  dokumente:
  - datum: 2025-10-02
    typ: leitlinie
    titel: Guida del CCBE sull'uso dell'intelligenza artificiale generativa da parte degli avvocati
    url: https://www.consiglionazionaleforense.it/documents/20182/3593400/Guida+del+CCBE+sull%E2%80%99uso+dell%E2%80%99intelligenza+artificiale+generativa+da+parte+degli+avvocati.pdf/0fdee427-fb50-7e41-fbd6-5bae7acec75c?t=1763380452292
    sprache: it
    urheber: CCBE; italienische Uebersetzung durch das Bruesseler Buero des Consiglio Nazionale Forense
    verifiziert: false
    abruf: ok
    notiz: Volltext-PDF auf der amtlichen CNF-Domain. Belegt Datum (02.10.2025), Urheberschaft und alle
      Kernpflichten.
  offene_punkte:
  - Ein eigenstaendiger CNF-Kodex oder eine CNF-Auslegung des Art. 13 Legge 132/2025 fuer die Anwaltschaft
    war nicht auffindbar; einzelne Ordini (Rom, Torre Annunziata) haben eigene Vademecum erlassen, die
    hier nicht erfasst sind.
  - Die Rechtsfolge eines Verstosses gegen Art. 13 Abs. 2 Legge 132/2025 (Informationspflicht) ist gesetzlich
    nicht bestimmt; in Betracht kommen Disziplinarrecht und Honorarminderung nach Art. 2229 ff. c.c.
