- id: it-agcom-delibera-127-26-cons
  jurisdiktion: it
  kurztitel: AGCOM-Delibera 127/26/CONS — Tavolo tecnico KI, Pluralismus und Urheberrecht
  offizieller_titel: Delibera n. 127/26/CONS — Istituzione di un tavolo tecnico per la garanzia del pluralismo
    e la tutela del diritto d'autore sulle piattaforme digitali che utilizzano sistemi di intelligenza
    artificiale
  fundstelle: Autorita per le garanzie nelle comunicazioni, delibera n. 127/26/CONS del 27 maggio 2026
  verfahrensnummer: 127/26/CONS
  status: softlaw
  status_detail: 'Am 27.05.2026 beschlossen. Die Delibera errichtet ein staendiges technisches Gremium;
    sie begruendet keine unmittelbaren Pflichten der Plattformen, sondern organisiert einen Dialog. Google,
    FIEG und FISC haben ihre Teilnahme bereits erklaert. Der Rat der AGCOM wird mindestens halbjaehrlich
    unterrichtet.

    '
  kurzbeschreibung: 'Die AGCOM richtet ein staendiges technisches Gremium ein, an dem Plattformen mit
    sozialen Netzwerken und Suchmaschinen, Presseverleger und Branchenverbaende teilnehmen. Arbeitsschwerpunkte
    sind vier Felder: der Schutz des Urheberrechts bei der KI-gestuetzten Nutzung von Inhalten einschliesslich
    Transparenz- und Verguetungsgrundsaetzen, Opt-out-Mechanismen nach der Urheberrechtsrichtlinie (EU)
    2019/790, Mechanismen der Nachrichtenauswahl zur Sicherung des Medienpluralismus sowie die Verhinderung
    von Desinformation beim KI-Einsatz. Als Rechtsgrundlagen nennt die Delibera das nationale Recht sowie
    die Verordnungen (EU) 2022/2065 (DSA), (EU) 2024/1689 (KI-VO) und (EU) 2024/1083 (EMFA) und die Richtlinie
    (EU) 2019/790. Damit ist die AGCOM der einzige italienische Regulierer, der die urheberrechtliche
    Opt-out-Frage — die Legge 132/2025 in Art. 25 ausdruecklich offen laesst — institutionell bearbeitet.

    '
  inkrafttreten:
    datum: 2026-05-27
    verifiziert: true
    quelle: https://www.agcom.it/sites/default/files/provvedimenti/delibera/2026/Delibera_127_26_CONS.pdf
