- id: it-dl-82-2021-acn
  jurisdiktion: it
  kurztitel: DL 82/2021 — Errichtung der ACN, KI-Auftrag (Art. 7 Abs. 1 lit. m-quater)
  offizieller_titel: Decreto-legge 14 giugno 2021, n. 82 — Disposizioni urgenti in materia di cybersicurezza,
    definizione dell'architettura nazionale di cybersicurezza e istituzione dell'Agenzia per la cybersicurezza
    nazionale
  fundstelle: Gazzetta Ufficiale Serie Generale n. 140 del 14 giugno 2021 (codice redazionale 21G00098);
    umgewandelt mit Aenderungen durch Legge 4 agosto 2021, n. 109
  verfahrensnummer: DL 82/2021, conv. L. 109/2021; geaendert durch Art. 18 und Art. 28 Legge 132/2025
  status: anwendbar
  status_detail: 'In Kraft seit 15.06.2021. Rechtsgrundlage der ACN, die durch Art. 20 Legge 132/2025
    zur nationalen Marktueberwachungsbehoerde fuer KI bestimmt wurde. Art. 18 Legge 132/2025 hat den Aufgabenkatalog
    um lit. m-quater (KI als Ressource der Cybersicherheit) erweitert, Art. 28 Legge 132/2025 hat lit.
    z) neu gefasst.

    '
  kurzbeschreibung: 'Das Dekret schafft die nationale Cybersicherheitsarchitektur und die Agenzia per
    la cybersicurezza nazionale (ACN). Fuer das KI-Recht ist es aus zwei Gruenden zentral: Erstens ist
    die ACN nach Art. 20 Abs. 2 Legge 132/2025 die ''autorita di vigilanza del mercato'' im Sinne der
    KI-Verordnung, also die Behoerde mit Inspektions- und Sanktionsbefugnissen. Zweitens hat Art. 18 Legge
    132/2025 den Aufgabenkatalog des Art. 7 Abs. 1 um lit. m-quater ergaenzt: die ACN ''promuove e sviluppa
    ogni iniziativa, anche attraverso la conclusione di accordi di collaborazione con i privati, volta
    a valorizzare l''intelligenza artificiale come risorsa per il rafforzamento della cybersicurezza nazionale''.
    Art. 28 Legge 132/2025 erweitert zusaetzlich die Kooperationsbefugnisse der ACN (lit. z): Vereinbarungen
    mit Privaten, oeffentlich-private Partnerschaften und — mit Genehmigung des Ministerpraesidenten —
    die Beteiligung an Konsortien, Stiftungen und Gesellschaften mit italienischen oder EU-Partnern.

    '
