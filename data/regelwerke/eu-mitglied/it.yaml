# Gepflegte Datenbasis.
regelwerke:
- id: it-legge-132-2025
  jurisdiktion: it
  kurztitel: Legge 132/2025 — italienisches KI-Gesetz
  offizieller_titel: Legge 23 settembre 2025, n. 132 — Disposizioni e deleghe al Governo in materia di
    intelligenza artificiale
  fundstelle: Gazzetta Ufficiale della Repubblica Italiana, Serie Generale n. 223 del 25 settembre 2025;
    codice redazionale 25G00143
  verfahrensnummer: A.S. 1146 (19ª legislatura) — A.C. 2316 — A.S. 1146-B; Schlussabstimmung Senat 17.09.2025
  status: anwendbar
  status_detail: 'In Kraft seit 10.10.2025 (fuenfzehnter Tag nach Verkuendung, Art. 73 Abs. 3 Cost.).
    Materiell voll anwendbar; die beiden Verordnungsermaechtigungen (Art. 16 und Art. 24) laufen bis 10.10.2026
    und sind erst teilweise ausgeuebt. Erstes eigenstaendiges nationales KI-Gesetz eines EU-Mitgliedstaats.

    '
  kurzbeschreibung: 'Das Gesetz legt ueber die unmittelbar geltende KI-Verordnung (EU) 2024/1689 ein eigenes
    materielles Stockwerk: Grundsaetze (anthropozentrischer Ansatz, menschliche Aufsicht, Nichtdiskriminierung),
    sektorale Vorgaben fuer Gesundheitswesen, Forschung, Arbeitsverhaeltnis, freie Berufe, oeffentliche
    Verwaltung, Justiz und Cybersicherheit, eine Behoerdenarchitektur (AgID als notifizierende Stelle,
    ACN als Marktueberwachungsbehoerde, Fortbestand der Zustaendigkeiten von Garante privacy, Banca d''Italia,
    CONSOB, IVASS und AGCOM), ein Einwilligungserfordernis der Sorgeberechtigten fuer den Zugang von Kindern
    unter vierzehn Jahren zu KI-Technologien, urheberrechtliche Klarstellungen (Schutz nur fuer menschliche
    Schoepfungen; TDM-Erlaubnis im Rahmen der Art. 70-ter/70-quater l. 633/1941) sowie ein Strafrechtspaket.
    Sanktionen: neuer Straftatbestand Art. 612-quater c.p. (Freiheitsstrafe ein bis fuenf Jahre), allgemeiner
    KI-Erschwerungsgrund Art. 61 Nr. 11-decies c.p., Strafschaerfungen bei Wahltaeuschung (Art. 294 c.p.:
    zwei bis sechs Jahre), Marktmanipulation (Art. 2637 c.c. und Art. 185 TUF: zwei bis sieben Jahre,
    Geldstrafe bis sechs Millionen Euro) und ein neuer urheberstrafrechtlicher Tatbestand (Art. 171 lit.
    a-ter l. 633/1941). Dazu ein Investitionsrahmen von bis zu einer Milliarde Euro (Art. 23) und zwei
    Verordnungsermaechtigungen.

    '
