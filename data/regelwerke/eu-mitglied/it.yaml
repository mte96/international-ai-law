  - datum: 2026-09-02
    typ: bericht
    titel: 'Intelligenza artificiale: in arrivo nuovi reati e nuove responsabilita per gli enti'
    url: null
    sekundaerquelle_url: https://www.giurisprudenzapenale.com/2026/09/02/intelligenza-artificiale-in-arrivo-nuovi-reati-e-nuove-responsabilita-per-gli-enti/
    sprache: it
    urheber: Giurisprudenza Penale
    verifiziert: false
    abruf: ok
    notiz: 'Stichtagsbeleg: Am 02.09.2026 waren die neuen Straftatbestaende ausdruecklich noch ''in arrivo''.
      Der Beitrag nennt den endgueltigen Beschluss des Ministerrats vom 04.08.2026, aber keine Veroeffentlichung
      in der Gazzetta Ufficiale. Er beschreibt Art. 437-bis c.p., Art. 612-quater c.p. und den neuen Art.
      25-vicies d.lgs. 231/2001 (Verbandsverantwortlichkeit).

      '
  offene_punkte:
  - Veroeffentlichung in der Gazzetta Ufficiale und damit Nummer, Datum und Inkrafttreten des Dekrets
    sind am 04.09.2026 offen.
  - Die Delega laeuft am 10.10.2026 ab. Massgeblich ist nach italienischer Staatspraxis die Emanation
    durch den Staatspraesidenten, nicht die Veroeffentlichung; ob diese rechtzeitig erfolgt, ist zu beobachten.
  - 'Ob die 60-Tage-Verlaengerungsklausel des Art. 24 Abs. 4 greift, ist zu pruefen: die parlamentarische
    Frist lief am 25.08.2026 ab, also mehr als 30 Tage vor dem 10.10.2026 — nach dem Wortlaut also KEINE
    Verlaengerung.'
  - Der endgueltige Text ist nicht oeffentlich; ob und wie die Stellungnahmen von Garante und Kommissionen
    eingearbeitet wurden, laesst sich nicht pruefen.
  - 'Kein Inkrafttretensdatum einzutragen: Das decreto legislativo ist am 04.08.2026 endgültig vom Ministerrat
    beschlossen, aber bis zum 05.09.2026 nicht in der Gazzetta Ufficiale veröffentlicht. Ein italienisches
    decreto legislativo tritt erst nach Veröffentlichung in der GU in Kraft (regelmäßig am 15. Tag danach,
    sofern es nichts anderes bestimmt). Status "verabschiedet" ist damit zutreffend. Zu beobachten: GU-Veröffentlichung.'
