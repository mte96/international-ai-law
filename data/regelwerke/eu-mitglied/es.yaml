    nicht feststellbar; ein Ponencia-Bericht liegt nicht vor.
  - Ob die politische Blockade (Mehrheitsfrage bei einem organischen Gesetz) noch überwunden wird, ist
    offen; das Dringlichkeitsverfahren hat den Stillstand nicht verhindert.
  - Die Nummerierung des neuen Straftatbestands (Art. 173 bis CP) kann sich im weiteren Verfahren ändern.
