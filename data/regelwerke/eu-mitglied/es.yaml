- id: es-estrategia-ia-sns
  jurisdiktion: es
  kurztitel: Estrategia de IA para el Sistema Nacional de Salud (eIASNS)
  offizieller_titel: Estrategia de Inteligencia Artificial para el Sistema Nacional de Salud
  fundstelle: Vom Pleno des Consejo Interterritorial del Sistema Nacional de Salud am 12.11.2025 gebilligt.
    Keine BOE-Veröffentlichung.
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Nicht bindend. Vom Consejo Interterritorial del SNS — dem Gremium von Zentralstaat und
    Autonomen Gemeinschaften — am 12.11.2025 angenommen. Sie ist der sektorale Governance-Rahmen für KI
    im spanischen Gesundheitswesen und schließt die Lücke, die dadurch entsteht, dass der Estatuto der
    AESIA die Zuständigkeit für Arzneimittel und Medizinprodukte ausdrücklich ausnimmt (Art. 4 Abs. 1
    RD 729/2023).

    '
  kurzbeschreibung: 'Sektorstrategie für den Einsatz künstlicher Intelligenz im Nationalen Gesundheitssystem
    mit fünf Zielen: eine gemeinsame Sicht auf die Rolle der KI im SNS, einheitliche Verfahren für Identifikation,
    Klassifikation und Bewertung von KI-Lösungen, eigene Strukturen und Rollen für das KI-Management auf
    autonomer und staatlicher Ebene, spezialisierte Aus- und Fortbildung sowie die koordinierte Umsetzung
    besonders relevanter Anwendungsfälle. Handlungsfelder sind bildgestützte Diagnostik, virtuelle Assistenten,
    Spracherkennung, Krankenhausverwaltung, personalisierte Medizin und robotergestützte Chirurgie. Adressat
    sind die Gesundheitsverwaltungen von Zentralstaat und Autonomen Gemeinschaften; Sanktionen gibt es
    nicht.

    '
  inkrafttreten:
    datum: 2025-11-12
    verifiziert: true
    quelle: https://www.sanidad.gob.es/en/gabinete/notasPrensa.do?id=6788
  anwendungsdaten:
  - datum: 2025-11-12
    was_gilt: Annahme durch das Pleno des Consejo Interterritorial del Sistema Nacional de Salud.
    verifiziert: true
    quelle: https://www.sanidad.gob.es/en/gabinete/notasPrensa.do?id=6788
  themenachsen:
  - sektor-medizin
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Fünf Ziele: gemeinsame Sicht auf die Rolle der KI im SNS; einheitliche Verfahren zur Identifikation,
    Klassifikation und Bewertung von KI-Lösungen; eigene Strukturen und Rollen für das KI-Management auf
    autonomer und staatlicher Ebene; spezialisierte Fortbildung; koordinierte Umsetzung hochrelevanter
    Anwendungsfälle.'
  - 'Handlungsfelder: bildgestützte Diagnostik, virtuelle Assistenten, Spracherkennung, Krankenhausverwaltung,
    personalisierte Medizin, robotergestützte Chirurgie.'
  - 'Kompetenzrechtlicher Hintergrund: das Gesundheitswesen ist in Spanien auf die Autonomen Gemeinschaften
    übertragen. Der Consejo Interterritorial ist das einzige Koordinierungsgremium — eine bindende staatliche
    KI-Regelung für Krankenhäuser gibt es nicht.'
  - 'Schnittstelle zur KI-VO: KI-gestützte Medizinprodukte unterfallen als Sicherheitsbauteile Art. 6
    Abs. 1 KI-VO in Verbindung mit den Verordnungen (EU) 2017/745 und 2017/746; Marktüberwachungsbehörde
    ist insoweit die AEMPS, nicht die AESIA. Der Proyecto de Ley Orgánica führt die AEMPS nach den ausgewerteten
    Zusammenfassungen NICHT unter den acht benannten Marktüberwachungsbehörden — eine mögliche Zuständigkeitslücke.'
