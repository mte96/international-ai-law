  kurztitel: Real Decreto-ley 9/2021 (Vorläufer der Ley Rider)
  offizieller_titel: Real Decreto-ley 9/2021, de 11 de mayo, por el que se modifica el texto refundido
    de la Ley del Estatuto de los Trabajadores, aprobado por el Real Decreto Legislativo 2/2015, de 23
    de octubre, para garantizar los derechos laborales de las personas dedicadas al reparto en el ámbito
    de plataformas digitales
  fundstelle: BOE núm. 113, de 12 de mayo de 2021 (BOE-A-2021-7840)
  verfahrensnummer: Real Decreto-ley 9/2021; konvalidiert durch den Congreso und als proyecto de ley weiterbehandelt
    (Art. 86 Abs. 3 CE)
  status: aufgehoben
  status_detail: 'Durch die Ley 12/2021 abgelöst; die Gesetzesfassung übernahm den Wortlaut beider Vorschriften
    unverändert. Der Rechtsakt bleibt erheblich, weil er den materiellen Anwendungsbeginn bestimmt: die
    dreimonatige vacatio legis der disposición final segunda ließ das algorithmische Auskunftsrecht und
    die Beschäftigungsvermutung bereits am 12.08.2021 wirksam werden, sechseinhalb Wochen vor Inkrafttreten
    der Ley 12/2021.

    '
  kurzbeschreibung: 'Dringlichkeitsverordnung mit Gesetzeskraft, die den Estatuto de los Trabajadores
    um Art. 64 Abs. 4 lit. d) (algorithmisches Auskunftsrecht der Arbeitnehmervertretung) und die disposición
    adicional vigesimotercera (Beschäftigungsvermutung für Plattformzusteller) ergänzt hat. Der Wortlaut
    ist mit dem der späteren Ley 12/2021 identisch. Erlassgrund war die Umsetzung des Dreiparteienabkommens
    vom 10.03.2021 und der Rechtsprechung des Tribunal Supremo (STS 805/2020). Eigene Sanktionen enthält
    der Rechtsakt nicht.

    '
