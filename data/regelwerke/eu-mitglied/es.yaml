  regelungsschwerpunkte:
  - 'Art. 1: Rechtsnatur — entidad de derecho público con personalidad jurídica propia, patrimonio propio
    y autonomía de gestión; Anbindung an das Digitalisierungsministerium über die Secretaría de Estado
    de Digitalización e Inteligencia Artificial.'
  - 'Art. 2: Sitz A Coruña. Die Standortentscheidung erging 2022 im Wege eines Wettbewerbs zwischen spanischen
    Städten und ist als Dezentralisierungsmaßnahme angelegt.'
  - 'Art. 4 Abs. 1: negative Kompetenzabgrenzung. Die AESIA ist NICHT zuständig für Arzneimittel und Medizinprodukte
    (Gesundheitsministerium und AEMPS) und nicht für arbeitsrechtliche Fragen (Arbeitsministerium und
    Inspección de Trabajo y Seguridad Social).'
  - 'Art. 5: Ermächtigung zum Abschluss von convenios mit anderen öffentlichen und privaten, inländischen
    und ausländischen Stellen sowie internationalen Organisationen. AEPD, CNMC, Banco de España und CNMV
    werden dort NICHT namentlich genannt; die sektoralen Zuständigkeiten dieser Behörden bleiben unberührt.'
  - 'Art. 6: allgemeine Verwaltungsbefugnisse mit Ausnahme der Enteignungsbefugnis (potestad expropiatoria).'
  - 'Art. 10 Abs. 1: Aufgabenkatalog — lit. a) Förderung von Reallaboren, lit. b) energieeffiziente und
    nachhaltige KI, lit. c) Geschlechterperspektive und Vermeidung diskriminierender Verzerrungen, lit.
    d) freiwilliger Zertifizierungsrahmen für verantwortungsvolle KI, lit. e) Beobachtung gesellschaftlicher
    Auswirkungen, lit. g) Wissensaufbau, Schulung, Sensibilisierung, lit. k) Überwachung und gegebenenfalls
    Sanktion ''de acuerdo con lo estipulado en la normativa europea''.'
  - 'Art. 11-27: Organisationsverfassung — Presidencia (Art. 12-14, wahrgenommen vom Staatssekretär bzw.
    der Staatssekretärin für Digitalisierung und KI), Consejo Rector (Art. 15-18, mit vier Vertretern
    des Digitalisierungsressorts sowie Vertretern des Finanz- und des Industrieressorts und einer KI-Fachperson),
    Comisión de Control (Art. 20-22), Dirección (Art. 23-24), Subdirección General de Informes e Infraestructuras
    de Prueba (Art. 25), Subdirección General de Certificación y Coordinación (Art. 26), Secretaría General
    (Art. 27).'
  - 'Institutionelle Pointe: die Präsidentschaft liegt bei der politischen Leitung des Fachressorts. Für
    eine Behörde, die nach Art. 70 Abs. 1 UAbs. 2 KI-VO ''objektiv und unparteiisch'' handeln und für
    grundrechtssensible Hochrisikofelder nach Art. 74 Abs. 8 KI-VO unabhängig sein muss, ist das eine
    offene Flanke — der Proyecto de Ley Orgánica löst sie über die Zuweisung von Justiz und Biometrie
    an CGPJ und AEPD.'
  - 'Verhältnis zur AEPD: kein Über-/Unterordnungsverhältnis. Die AEPD bleibt als unabhängige Datenschutzaufsicht
    nach Art. 51 DSGVO und LO 3/2018 zuständig; nach Art. 74 Abs. 8 KI-VO ist sie zugleich naheliegende
    Marktüberwachungsbehörde für biometrische Hochrisikosysteme. Der Proyecto de Ley Orgánica weist ihr
    genau diese Felder plus Migration, Asyl und Grenzkontrolle zu.'
  - 'Verhältnis zur CNMC: die CNMC ist als Wettbewerbs- und Regulierungsbehörde sowie als Koordinator
    für den Digital Services Act zuständig und wird im Estatuto nicht erwähnt. Im Proyecto de Ley Orgánica
    erscheint sie nach den ausgewerteten Zusammenfassungen NICHT unter den acht Marktüberwachungsbehörden
    — die Zuständigkeit für Plattformen und Medien läuft über den DSA-Koordinator, nicht über die KI-VO.'
