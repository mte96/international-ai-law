    datum: 2026-03-20
    verifiziert: false
    quelle: https://www.abogacia.es/wp-content/uploads/2026/04/CIRCULAR-INTERPRETATIVA-DEL-CODIGO-DEONTOLOGICO-3-2026.pdf
  anwendungsdaten:
