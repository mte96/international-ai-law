- id: es-ley-12-2021
  jurisdiktion: es
  kurztitel: Ley 12/2021 („Ley Rider“)
  offizieller_titel: Ley 12/2021, de 28 de septiembre, por la que se modifica el texto refundido de la
    Ley del Estatuto de los Trabajadores, aprobado por el Real Decreto Legislativo 2/2015, de 23 de octubre,
    para garantizar los derechos laborales de las personas dedicadas al reparto en el ámbito de plataformas
    digitales
  fundstelle: BOE núm. 233, de 29 de septiembre de 2021, págs. 119341-119344 (BOE-A-2021-15767)
  verfahrensnummer: Ley 12/2021; hervorgegangen aus dem Real Decreto-ley 9/2021, de 11 de mayo (BOE-A-2021-7840),
    das nach Art. 86 Abs. 3 CE als proyecto de ley weiterbehandelt wurde
  status: anwendbar
  status_detail: 'In Kraft seit dem 30.09.2021. Materiell galten die beiden eingefügten Vorschriften bereits
    seit dem 12.08.2021 über das Real Decreto-ley 9/2021 (dreimonatige vacatio legis). Beide Vorschriften
    sind ungeändert Bestandteil des konsolidierten Estatuto de los Trabajadores. Art. 64.4.d) ET ist das
    erste algorithmenbezogene Auskunftsrecht der Arbeitnehmervertretung in Europa und Vorbild für Art.
    9 der EU-Plattformarbeitsrichtlinie (EU) 2024/2831.

    '
  kurzbeschreibung: 'Das Gesetz ändert den Estatuto de los Trabajadores an zwei Stellen. Erstens erhält
    der Betriebsrat (comité de empresa) mit dem neuen Art. 64 Abs. 4 lit. d) ET ein Recht darauf, über
    die Parameter, Regeln und Anweisungen unterrichtet zu werden, auf denen Algorithmen oder KI-Systeme
    beruhen, die Entscheidungen mit Auswirkungen auf Arbeitsbedingungen, Zugang zur Beschäftigung und
    Erhalt des Arbeitsplatzes beeinflussen, einschließlich der Profilbildung. Zweitens begründet die neue
    disposición adicional vigesimotercera ET eine widerlegliche Beschäftigungsvermutung für Personen,
    die entgeltlich Waren ausliefern, wenn der Auftraggeber die Arbeitgeberbefugnisse unmittelbar, mittelbar
    oder implizit durch algorithmische Steuerung des Dienstes oder der Arbeitsbedingungen über eine digitale
    Plattform ausübt. Das Auskunftsrecht ist nicht auf Plattformen beschränkt, sondern gilt für alle Unternehmen
    mit Arbeitnehmervertretung. Sanktioniert wird der Verstoß nicht durch ein eigenes Bußgeld, sondern
    über das allgemeine Arbeitsordnungswidrigkeitenrecht (LISOS) und — wie die Rechtsprechung 2025 entschieden
    hat — über den Schutz der Koalitionsfreiheit nach Art. 28 der Verfassung mit Schadensersatzfolge.

    '
  inkrafttreten:
    datum: 2021-09-30
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2021-15767
  anwendungsdaten:
  - datum: 2021-08-12
    was_gilt: Materielles Wirksamwerden beider Vorschriften über das Real Decreto-ley 9/2021 (drei Monate
      nach Verkündung am 12.05.2021).
    verifiziert: true
    quelle: https://www.boe.es/eli/es/rdl/2021/05/11/9
  - datum: 2021-09-30
    was_gilt: Inkrafttreten der Ley 12/2021 (Tag nach der Verkündung); Ablösung des Real Decreto-ley 9/2021.
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2021-15767
  themenachsen:
  - arbeit
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'NORMTEXT Art. 64 Abs. 4 lit. d) ET, amtlicher Wortlaut: „Ser informado por la empresa de los parámetros,
    reglas e instrucciones en los que se basan los algoritmos o sistemas de inteligencia artificial que
    afectan a la toma de decisiones que pueden incidir en las condiciones de trabajo, el acceso y mantenimiento
    del empleo, incluida la elaboración de perfiles.“'
  - 'Systematische Einordnung: Art. 64 Abs. 4 ET zählt die Unterrichtungsrechte auf, die der Betriebsrat
    mindestens einmal jährlich ausüben kann. lit. d) steht damit im Regime der derechos de información
    y consulta, nicht im Zustimmungs- oder Mitbestimmungsregime — es besteht kein Vetorecht und kein Verhandlungsanspruch.'
  - 'Reichweite: erfasst sind Algorithmen UND KI-Systeme; Auslöser ist die Beeinflussung von Entscheidungen
    über Arbeitsbedingungen, Zugang zur Beschäftigung und Erhalt des Arbeitsplatzes; die Profilbildung
    ist ausdrücklich einbezogen. Kein Plattformbezug — die Vorschrift gilt branchenübergreifend.'
  - Gegenstand der Auskunft sind „parámetros, reglas e instrucciones“, nicht der Quellcode. Der Gesetzgeber
    verlangt die Entscheidungslogik, nicht die technische Implementierung — eine Parallele zu Art. 15
    Abs. 1 lit. h) DSGVO („lógica aplicada“) und zu Art. 22 Abs. 3 KI-VO.
  - 'NORMTEXT disposición adicional vigesimotercera ET, amtlicher Wortlaut: „Por aplicación de lo establecido
    en el artículo 8.1, se presume incluida en el ámbito de esta ley la actividad de las personas que
    presten servicios retribuidos consistentes en el reparto o distribución de cualquier producto de consumo
    o mercancía, por parte de empleadoras que ejercen las facultades empresariales de organización, dirección
    y control de forma directa, indirecta o implícita, mediante la gestión algorítmica del servicio o
    de las condiciones de trabajo, a través de una plataforma digital. Esta presunción no afecta a lo
    previsto en el artículo 1.3 de la presente norma.“'
  - 'Dogmatische Pointe der Vermutung: die algorithmische Steuerung (gestión algorítmica) wird selbst
    zum Indiz der Weisungsgebundenheit erhoben. Die Vermutung ist widerleglich und knüpft an Art. 8 Abs.
    1 ET (allgemeine Arbeitsverhältnisvermutung) an; Art. 1 Abs. 3 ET (ausgenommene Tätigkeiten) bleibt
    unberührt.'
  - 'Entstehungsgeschichte: Umsetzung des Dreiparteienabkommens vom 10.03.2021 zwischen Regierung, Gewerkschaften
    (CCOO, UGT) und Arbeitgeberverbänden (CEOE, CEPYME) sowie Kodifikation der Rechtsprechung des Tribunal
    Supremo, Sala de lo Social, im Pleno-Urteil 805/2020 vom 25.09.2020 (Glovo).'
  - 'RECHTSPRECHUNG zu Art. 64.4.d) ET: Audiencia Nacional, Sala de lo Social, Sentencia 101/2025 vom
    04.07.2025, Verfahren 182/2025 (CGT gegen Foundever Spain S.A.). Erste veröffentlichte Entscheidung
    zum algorithmischen Auskunftsrecht. Die Weigerung, Auskunft über die Algorithmen zur Schicht- und
    Pausenvergabe zu erteilen, verletzt nicht nur Art. 64.4.d) ET, sondern die Koalitionsfreiheit nach
    Art. 28 der Verfassung in Verbindung mit Art. 10 Abs. 3 Nr. 1 LOLS; verurteilt wurde zu 6.250 Euro
    Schadensersatz. Der Verstoß wird damit aus dem Ordnungswidrigkeitenrecht in das Grundrechtsverfahren
    (tutela de derechos fundamentales) gehoben — mit umgekehrter Beweislast und Schadensersatzfolge.'
  - 'RECHTSPRECHUNG zur disposición adicional vigesimotercera: Juzgado Central de lo Contencioso-administrativo
    núm. 10, Sentencia 90/2024 vom 26.07.2024 (procedimiento ordinario 34/2023, ECLI ES:AN:2024:4355)
    gab Glovo Recht und hob die Nachforderungs- und Sanktionsbescheide der Sozialversicherung auf — die
    Vermutung sei durch den Nachweis tatsächlicher Selbständigkeit widerlegt. Die Audiencia Nacional (Sala
    de lo Contencioso-administrativo) hat diese Entscheidung mit Urteil vom 16.07.2025 aufgehoben und
    die Arbeitnehmereigenschaft bestätigt. Damit besteht ein Nebeneinander von sozialgerichtlicher (laboralidad
    seit 2020) und verwaltungsgerichtlicher Linie.'
  - 'Verhältnis zur EU: Art. 64.4.d) ET ist Vorlage für Art. 9 der Richtlinie (EU) 2024/2831 über die
    Verbesserung der Arbeitsbedingungen in der Plattformarbeit (Unterrichtung über automatisierte Überwachungs-
    und Entscheidungssysteme); die spanische Regelung geht weiter, weil sie nicht auf Plattformarbeit
    beschränkt ist.'
