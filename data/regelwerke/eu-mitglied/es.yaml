- id: es-cgpj-instruccion-2-2026
  jurisdiktion: es
  kurztitel: CGPJ Instrucción 2/2026 — KI in der Rechtsprechungstätigkeit
  offizieller_titel: Acuerdo de 28 de enero de 2026, del Pleno del Consejo General del Poder Judicial,
    por el que se aprueba la Instrucción 2/2026, sobre la utilización de sistemas de inteligencia artificial
    en el ejercicio de la actividad jurisdiccional
  fundstelle: BOE núm. 26, de 30 de enero de 2026 (BOE-A-2026-2205)
  verfahrensnummer: Instrucción 2/2026 del Pleno del Consejo General del Poder Judicial
  status: anwendbar
  status_detail: 'In Kraft seit der Veröffentlichung am 30.01.2026. Bindend für die Richterschaft im Rahmen
    der Aufsichtsbefugnisse des CGPJ, aber ohne Bußgeldregime; Verstöße werden über das richterliche Disziplinarrecht
    und die Verantwortung für den eigenen Spruch aufgefangen. Die Instrucción ist die erste ausdrückliche
    Regelung des KI-Einsatzes durch die Judikative in Spanien und trifft die Unterscheidung, die der Proyecto
    de Ley Orgánica institutionell nachvollzieht, indem er dem CGPJ die Marktüberwachung für KI in der
    Justiz zuweist.

    '
  kurzbeschreibung: 'Verwaltungsvorschrift des spanischen Richterrats über den Einsatz von KI-Systemen
    einschließlich generativer Werkzeuge in der Rechtsprechungstätigkeit. Sie gilt für alle KI-Systeme,
    die Richter bei ihrer Tätigkeit nutzen (Ordinal 2). Leitprinzipien sind wirksame menschliche Kontrolle,
    Nichtersetzbarkeit des Richters, volle Verantwortung des Spruchkörpers, richterliche Unabhängigkeit,
    Grundrechtsschutz, Datenschutz, Vermeidung algorithmischer Verzerrungen und Verhältnismäßigkeit des
    Einsatzes (Ordinal 4). Zulässig sind Recherche und Auffinden juristischer Information, Dokumentenanalyse,
    interne Arbeitsentwürfe und Verwaltungsaufgaben, jeweils nur als Hilfsmittel (Ordinal 6). Untersagt
    sind automatisierte Entscheidungsfindung, die Ersetzung der Urteilsfindung, die unkritische Übernahme
    KI-erzeugter Inhalte und die unzulässige Verarbeitung besonders geschützter Daten (Ordinal 8). Der
    Richter muss jeden KI-gestützten Entwurf vollständig persönlich prüfen und kritisch validieren (Ordinal
    7); dem CGPJ obliegen Qualitätskontrolle und Audit der bereitgestellten Systeme (Ordinal 12).

    '
  inkrafttreten:
    datum: 2026-01-30
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-2205
  anwendungsdaten:
  - datum: 2026-01-28
    was_gilt: Beschluss des Pleno des CGPJ.
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-2205
  - datum: 2026-01-30
    was_gilt: Veröffentlichung im BOE und Inkrafttreten.
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-2205
  themenachsen:
  - berufsrecht
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Ordinal 2 Anwendungsbereich: alle KI-Systeme, die Richterinnen und Richter in der Rechtsprechungstätigkeit
    einsetzen, ausdrücklich einschließlich generativer Werkzeuge — auch solche, die nicht vom CGPJ bereitgestellt
    werden.'
  - 'Ordinal 4 Grundsätze: wirksame menschliche Kontrolle, Nichtersetzung des Richters, volle Verantwortung
    des Spruchkörpers, richterliche Unabhängigkeit, Achtung der Grundrechte, Datenschutz, Vermeidung algorithmischer
    Verzerrungen, Verhältnismäßigkeit.'
  - 'Ordinal 6 zulässige Nutzungen: „búsqueda y localización de información jurídica“, Dokumentenanalyse,
    interne Arbeitsentwürfe, Verwaltungsaufgaben — sämtlich nur als Unterstützungswerkzeug.'
  - 'Ordinal 7 Pflicht des Richters: vollständige persönliche Durchsicht und kritische Validierung jedes
    KI-gestützten Entwurfs vor Verwendung.'
  - 'Ordinal 8 Verbote: automatisierte Entscheidungsfindung, Ersetzung der Urteilsfindung, unkritische
    Übernahme KI-erzeugter Inhalte, unzulässige Verarbeitung besonders geschützter Daten.'
  - 'Ordinal 12 Zuständigkeiten des CGPJ: Qualitätskontrolle und Audit sämtlicher bereitgestellter Systeme.'
  - 'Verhältnis zur KI-VO: Anhang III Nr. 8 lit. a) KI-VO stuft KI-Systeme, die Justizbehörden bei der
    Rechtsfindung unterstützen, als Hochrisikosysteme ein. Die Instrucción setzt die Anforderungen der
    Art. 14 (menschliche Aufsicht) und Art. 26 (Betreiberpflichten) KI-VO für die Judikative vorab um,
    ohne sich ausdrücklich darauf zu stützen.'
  - 'Institutionelle Pointe: Spanien löst das Problem der Unabhängigkeit der Marktüberwachung im Justizbereich
    (Art. 74 Abs. 8 KI-VO) dadurch, dass der Richterrat sich selbst beaufsichtigt — der Proyecto de Ley
    Orgánica weist dem CGPJ die Marktüberwachung für KI in der Justizverwaltung förmlich zu.'
