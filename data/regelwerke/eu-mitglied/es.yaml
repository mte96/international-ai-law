- id: es-lo-menores-digitales
  jurisdiktion: es
  kurztitel: Ley Orgánica Minderjährigenschutz in digitalen Umgebungen (Proyecto) — Deepfake-Straftatbestand
  offizieller_titel: Proyecto de Ley Orgánica para la protección de las personas menores de edad en los
    entornos digitales
  fundstelle: Boletín Oficial de las Cortes Generales, Congreso de los Diputados, XV Legislatura, Serie
    A (Proyectos de Ley), núm. 52-1, de 11 de abril de 2025
  verfahrensnummer: 121/000052 (Congreso de los Diputados, XV Legislatura)
  status: verfahren
  status_detail: 'NICHT im BOE verkündet und nicht verabschiedet. Der in der Auftragsbeschreibung genannte
    10.09.2025 ist nicht das Datum einer Verabschiedung, sondern der Ablehnung der enmienda a la totalidad
    de devolución des Grupo Parlamentario VOX durch das Plenum — also der Freigabe zur Ausschussberatung.
    Verfahrensgang: Veröffentlichung des Entwurfs am 11.04.2025 (BOCG-A-52-1), Beschluss über das Dringlichkeitsverfahren
    nach Art. 93 Abs. 2 der Geschäftsordnung am 09.05.2025 (52-2), Rückgabeantrag von VOX am 24.06.2025
    (52-3), Ablehnung im Plenum am 10.09.2025, Änderungsanträge zum Text am 12.12.2025 in der Comisión
    de Justicia (52-4). Seither ist kein weiteres BOCG-Teildokument erschienen (52-5, 52-6 und 52-8 antworten
    mit HTTP 404): kein Ponencia-Bericht, kein Ausschussdictamen, keine Schlussabstimmung, keine Senatsbefassung.
    Das Vorhaben ruht seit rund neun Monaten — trotz Dringlichkeitsverfahren.

    '
  kurzbeschreibung: 'Querschnittsgesetz zum Schutz Minderjähriger in digitalen Umgebungen mit einem Vorspann-Titel
    und fünf Titeln (Art. 1-15) sowie umfangreichen disposiciones finales, die den Código Penal und mehrere
    Fachgesetze ändern. Für das KI-Recht zentral ist die disposición final tercera: sie führt mit einem
    neuen Art. 173 bis Código Penal einen eigenständigen Straftatbestand für sexuelle Deepfakes (ultrafalsificaciones,
    ultrasuplantaciones) ein, erweitert Art. 186 CP (Verbreitung pornografischen Materials an Minderjährige),
    verschärft die Art. 181 bis 189 CP bei technischer Identitätsverschleierung und schafft mit Änderungen
    der Art. 33, 39, 40, 45, 48, 56, 70, 83 und 96 Abs. 3 CP eine digitale Kontaktsperre — ein Verbot
    des Zugangs zu sozialen Netzwerken und virtuellen Räumen als Straf- und Maßregelfolge. Daneben wird
    das Einwilligungsalter für die Datenverarbeitung in der LO 3/2018 von 14 auf 16 Jahre angehoben.

    '
