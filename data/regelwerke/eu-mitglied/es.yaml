  - datum: 2026-04-10
    was_gilt: Öffentliche Bekanntgabe durch die Abogacía Española.
    verifiziert: false
    quelle: https://www.abogacia.es/actualidad/noticias/la-abogacia-espanola-advierte-de-los-riesgos-de-usar-la-ia-generativa-en-textos-profesionales/
  themenachsen:
  - berufsrecht
  - haftung
  - content
  regelungsschwerpunkte:
  - 'Ausgelegte Vorschriften des Código Deontológico de la Abogacía Española: Art. 4 Abs. 1 (diligencia,
    confianza e integridad), Art. 10 Abs. 2 lit. e (relaciones con los tribunales), Art. 12 Buchst. A
    Nr. 8 (defensa diligente), Art. 21 Abs. 2 (uso responsable de la tecnología).'
  - 'Prüfungspflicht: KI-erzeugte Texte sind vollständig und kritisch zu lesen; Aussagen dürfen nicht
    als zutreffend übernommen werden, nur weil sie plausibel wirken. Verifikation gegen externe, verlässliche
    Rechtsquellen ist zwingend.'
  - 'Verantwortung für Halluzinationen: der unterzeichnende Anwalt haftet vollständig für den Inhalt;
    ein KI-Fehler ist keine Entschuldigung, sondern der Beleg der Aufsichtspflichtverletzung.'
  - 'Vollendungszeitpunkt: der berufsrechtliche Verstoß ist mit der Einreichung des Schriftsatzes in der
    Absicht, Rechtswirkungen auszulösen, „konsumiert“. Rechtzeitige Korrektur vor Einreichung verhindert
    ihn — eine tätige-Reue-Konstruktion im Berufsrecht.'
  - 'Disziplinarfolgen: schwerer Verstoß nach Art. 125 lit. u) des Estatuto General de la Abogacía Española;
    besonders gravierende Fälle können Art. 124 lit. g) EGAE (sehr schwerer Verstoß) erfüllen.'
  - 'Nicht Gegenstand dieser Circular sind Berufsgeheimnis und Datenschutz beim Einsatz generativer KI;
    hierfür ist eine gesonderte Circular vorgesehen. Achtung: mehrere Fachbeiträge behandeln die Circular
    3/2026 fälschlich als Datenschutz- und Verschwiegenheitsregelung.'
  - 'Rechtsvergleichender Kontext: Spanien regelt damit als eines der ersten europäischen Länder die anwaltliche
    Verantwortung für KI-Halluzinationen berufsrechtlich, nachdem Gerichte in mehreren Jurisdiktionen
    Sanktionen wegen erfundener Fundstellen verhängt hatten.'
