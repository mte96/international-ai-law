- id: es-cgae-circular-3-2026
  jurisdiktion: es
  kurztitel: CGAE Circular 3/2026 — generative KI in Anwaltsschriftsätzen
  offizieller_titel: Circular Interpretativa del Código Deontológico de la Abogacía Española número 3/2026,
    sobre la elaboración, firma y presentación de escritos generados con asistencia de inteligencia artificial
    generativa
  fundstelle: Circular Interpretativa 3/2026 del Pleno del Consejo General de la Abogacía Española
  verfahrensnummer: Circular Interpretativa 3/2026
  status: softlaw
  status_detail: 'Vom Pleno des Consejo General de la Abogacía Española am 20.03.2026 beschlossen und
    am 10.04.2026 bekanntgegeben. Formal eine Auslegung des Código Deontológico, nicht selbst Satzungsrecht
    — die Bindungswirkung ergibt sich mittelbar über die ausgelegten Vorschriften und deren Disziplinartatbestände
    im Estatuto General de la Abogacía Española. WIDERSPRÜCHLICHE DATIERUNG: das Dokument selbst trägt
    den 20.03.2026, mehrere Fachbeiträge zitieren sie als „Circular 3/2026 de 10 de abril“ (Datum der
    Veröffentlichung).

    '
  kurzbeschreibung: 'Berufsrechtliche Auslegungsrichtlinie zum Einsatz generativer KI bei der Erstellung,
    Unterzeichnung und Einreichung anwaltlicher Schriftsätze. Ausgelegt werden Art. 4 Abs. 1 (Sorgfalt,
    Vertrauen und Integrität), Art. 10 Abs. 2 lit. e (Verhältnis zu den Gerichten), Art. 12 Buchst. A
    Nr. 8 (eifrige und gewissenhafte Verteidigung) und Art. 21 Abs. 2 (verantwortungsvoller Technikeinsatz)
    des Código Deontológico. Kernaussage: der unterzeichnende Anwalt trägt die Verantwortung für den Inhalt
    vollständig; KI-Fehler entschuldigen nicht, sondern belegen die Verletzung der Aufsichtspflicht. Der
    Verstoß ist mit der Einreichung des Schriftsatzes vollendet; rechtzeitige Korrektur vor Einreichung
    schließt ihn aus. Schwere Fälle erfüllen Art. 125 lit. u) EGAE (schwerer Verstoß), besonders gravierende
    Art. 124 lit. g) EGAE (sehr schwerer Verstoß).

    '
