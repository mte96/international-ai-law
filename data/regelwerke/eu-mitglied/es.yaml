- id: es-rd-817-2023
  jurisdiktion: es
  kurztitel: Real Decreto 817/2023 — KI-Reallabor (sandbox)
  offizieller_titel: Real Decreto 817/2023, de 8 de noviembre, que establece un entorno controlado de
    pruebas para el ensayo del cumplimiento de la propuesta de Reglamento del Parlamento Europeo y del
    Consejo por el que se establecen normas armonizadas en materia de inteligencia artificial
  fundstelle: BOE núm. 268, de 9 de noviembre de 2023 (BOE-A-2023-22767)
  verfahrensnummer: Real Decreto 817/2023
  status: anwendbar
  status_detail: 'In Kraft seit dem 10.11.2023. Weltweit das erste Reallabor, das ausdrücklich für die
    Erprobung der Anforderungen der damals noch nicht verabschiedeten KI-Verordnung geschaffen wurde.
    Die disposición final segunda befristet die Geltung auf höchstens 36 Monate oder bis zur Anwendbarkeit
    der KI-Verordnung in Spanien — die 36 Monate laufen am 09.11.2026 ab. Ob und wie das Reallabor danach
    fortgeführt wird, soll Art. 11 des Proyecto de Ley Orgánica regeln, der die AESIA zur Einrichtung
    eines Reallabors verpflichtet.

    '
  kurzbeschreibung: 'Verordnung über ein staatliches Reallabor, in dem Anbieter und Betreiber die Anforderungen
    des künftigen europäischen KI-Rechts unter Aufsicht erproben. Teilnehmen können private Einrichtungen,
    öffentliche Verwaltungen und Einrichtungen des öffentlichen Sektors mit Sitz oder fester Niederlassung
    in Spanien. Erfasst sind Hochrisikosysteme, Systeme mit allgemeinem Verwendungszweck und Basismodelle.
    Die Auswahl erfolgt über öffentliche Aufrufe; Auswahlkriterien sind unter anderem Innovationsgrad,
    soziale Wirkung, Transparenz, Übereinstimmung mit der Carta de Derechos Digitales und Diversität der
    beteiligten Unternehmen (Art. 8). Ergebnis sind technische Leitfäden und Praxisempfehlungen. Es gibt
    kein Bußgeldregime; die Teilnahme ist freiwillig, Sanktion ist der Ausschluss.

    '
  inkrafttreten:
    datum: 2023-11-10
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2023-22767
  anwendungsdaten:
  - datum: 2023-11-10
    was_gilt: Einrichtung des entorno controlado de pruebas; Zuständigkeit der Secretaría de Estado de
      Digitalización e Inteligencia Artificial.
    verifiziert: true
    quelle: https://www.boe.es/eli/es/rd/2023/11/08/817
  - datum: 2026-11-10
    was_gilt: Ende der Höchstgeltungsdauer von 36 Monaten ab Inkrafttreten nach der disposición final
      segunda, sofern die Verordnung nicht vorher wegen Anwendbarkeit der KI-VO in Spanien außer Kraft
      tritt.
    verifiziert: true
    quelle: https://www.boe.es/eli/es/rd/2023/11/08/817
  themenachsen:
  - governance
  - marktzugang
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Zweck: Erprobung der Anforderungen des Verordnungsvorschlags KOM(2021) 206 vor dessen Verabschiedung
    — der Rechtsakt nimmt ausdrücklich auf einen noch nicht geltenden Rechtsakt Bezug, was rechtstechnisch
    ungewöhnlich ist und den Charakter als Experimentierrecht unterstreicht.'
  - 'Teilnahmeberechtigt: private Einrichtungen, öffentliche Verwaltungen und Einrichtungen des öffentlichen
    Sektors mit Sitz oder Betriebsstätte in Spanien.'
  - 'Erfasste Systeme: Hochrisikosysteme, Systeme mit allgemeinem Verwendungszweck (propósito general)
    und Basismodelle (modelos fundacionales).'
  - 'Art. 8: Auswahlkriterien der öffentlichen Aufrufe — Innovation, soziale Wirkung, Transparenz, Übereinstimmung
    mit der Carta de Derechos Digitales, Diversität der Teilnehmer.'
  - 'Art. 11: Pflichten der Teilnehmer — Risikomanagementsystem, technische Dokumentation, Ermöglichung
    menschlicher Aufsicht, Genauigkeit, Robustheit und Sicherheit. Das nimmt Art. 9 bis 15 KI-VO vorweg.'
  - 'Ergebnis: technische Leitfäden (guías técnicas) und Empfehlungen guter Praxis, die dem europäischen
    Normungsprozess zuarbeiten sollen.'
  - 'Disposición final segunda, amtlicher Wortlaut: „Este real decreto tendrá una vigencia de máximo treinta
    y seis meses desde su entrada en vigor o, en su caso, hasta que sea aplicable en el Reino de España
    el Reglamento del Parlamento Europeo y del Consejo por el que se establecen normas armonizadas en
    materia de inteligencia artificial.“ Automatischer Verfall (sunset clause) — in der spanischen Verordnungspraxis
    selten. Die 36 Monate laufen ab Inkrafttreten (10.11.2023), also bis zum 10.11.2026.'
