  offene_punkte:
  - Eine förmliche Benennung der AESIA als Marktüberwachungsbehörde nach Art. 70 KI-VO ist nicht auffindbar
    — weder als Real Decreto, Orden ministerial noch als Resolución. Sie ist im Proyecto de Ley Orgánica
