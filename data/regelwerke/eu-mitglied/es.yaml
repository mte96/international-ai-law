  jurisdiktion: es
  kurztitel: Real Decreto 729/2023 — Estatuto der AESIA
  offizieller_titel: Real Decreto 729/2023, de 22 de agosto, por el que se aprueba el Estatuto de la Agencia
    Española de Supervisión de Inteligencia Artificial
  fundstelle: BOE núm. 210, de 2 de septiembre de 2023, págs. 122289-122316 (BOE-A-2023-18911)
  verfahrensnummer: 'Real Decreto 729/2023; Rechtsgrundlage: disposición adicional nonagésima de la Ley
    22/2021 de Presupuestos Generales del Estado para 2022'
  status: anwendbar
  status_detail: 'In Kraft seit dem 03.09.2023 (Tag nach der Verkündung, disposición final tercera). Die
    AESIA war damit über elf Monate vor Inkrafttreten der KI-Verordnung die erste eigenständige nationale
    KI-Aufsichtsbehörde eines EU-Mitgliedstaats. ACHTUNG: Der Estatuto ist NICHT die Benennung als Marktüberwachungsbehörde
    nach Art. 70 KI-VO. Eine solche förmliche Benennung ist bis zum Rechercheschluss nicht ergangen; sie
    soll erst durch Art. 5 und 6 des Proyecto de Ley Orgánica (es-lo-gobernanza-ia) erfolgen. Spanien
    hat die Benennungsfrist des Art. 70 Abs. 2 KI-VO (02.08.2025) damit verfehlt.

    '
  kurzbeschreibung: 'Errichtungsstatut der Agencia Española de Supervisión de Inteligencia Artificial.
    Die AESIA ist eine entidad de derecho público mit eigener Rechtspersönlichkeit, eigenem Vermögen und
    Verwaltungsautonomie, zugeordnet dem für Digitalisierung zuständigen Ministerium über die Secretaría
    de Estado de Digitalización e Inteligencia Artificial (Art. 1). Sitz ist A Coruña, Gebäude "La Terraza"
    (Art. 2). Ihre Aufgaben sind zum Zeitpunkt des Erlasses überwiegend fördernd und koordinierend — Reallabore,
    Zertifizierungsrahmen, Aufklärung, Bias-Vermeidung —, mit einer Öffnungsklausel für Aufsicht und Sanktion
    nach Maßgabe des europäischen Rechts (Art. 10 Abs. 1 lit. k). Eigene Bußgeldbefugnisse begründet der
    Estatuto nicht.

    '
