- id: es-ley-15-2022
  jurisdiktion: es
  kurztitel: Ley 15/2022 — Gleichbehandlungsgesetz, Art. 23 (Algorithmen)
  offizieller_titel: Ley 15/2022, de 12 de julio, integral para la igualdad de trato y la no discriminación
  fundstelle: BOE núm. 167, de 13 de julio de 2022 (BOE-A-2022-11589)
  verfahrensnummer: Ley 15/2022
  status: anwendbar
  status_detail: 'In Kraft seit dem 14.07.2022. Art. 23 ist die erste positive KI-Regelung des spanischen
    Rechts überhaupt — sie ist knapp zwei Jahre älter als die KI-Verordnung. Der Tribunal Supremo hat
    sie in der BOSCO-Entscheidung vom 11.09.2025 als Auslegungsmaßstab für den Zugang zum Quellcode verwaltungsbehördlicher
    Entscheidungssysteme herangezogen.

    '
  kurzbeschreibung: 'Horizontales Antidiskriminierungsgesetz. Für das KI-Recht ist Art. 23 einschlägig:
    er verpflichtet die öffentlichen Verwaltungen, Mechanismen zu fördern, damit die in ihren Entscheidungsprozessen
    eingesetzten Algorithmen Kriterien der Bias-Minimierung, der Transparenz und der Rechenschaftspflicht
    berücksichtigen, bezieht dabei Entwurf und Trainingsdaten ein und verlangt die Auseinandersetzung
    mit möglichen diskriminierenden Wirkungen; dafür sollen Folgenabschätzungen zur Ermittlung diskriminierender
    Verzerrungen durchgeführt werden. Ergänzend fordert Art. 23 Abs. 2 Vorrang für Transparenz und Interpretierbarkeit,
    Art. 23 Abs. 3 die Förderung ethischer, vertrauenswürdiger und grundrechtskonformer KI bei Verwaltungen
    und Unternehmen und Art. 23 Abs. 4 ein Gütesiegel für Algorithmen. Die Norm ist final formuliert („favorecerán“,
    „promoverán“) und begründet keinen unmittelbaren Individualanspruch; das Gesetz enthält allerdings
    in Título IV (Art. 46-52) ein eigenes Sanktionsregime für Diskriminierungsverstöße.

    '
  inkrafttreten:
    datum: 2022-07-14
    verifiziert: true
    quelle: https://www.boe.es/buscar/act.php?id=BOE-A-2022-11589
  anwendungsdaten:
  - datum: 2022-07-14
    was_gilt: Geltung von Art. 23 (Inteligencia artificial y mecanismos de toma de decisión automatizados).
    verifiziert: true
    quelle: https://www.boe.es/buscar/act.php?id=BOE-A-2022-11589
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - 'NORMTEXT Art. 23 Abs. 1, amtlicher Wortlaut: „En el marco de la Estrategia Nacional de Inteligencia
    Artificial, de la Carta de Derechos Digitales y de las iniciativas europeas en torno a la Inteligencia
    Artificial, las administraciones públicas favorecerán la puesta en marcha de mecanismos para que los
    algoritmos involucrados en la toma de decisiones que se utilicen en las administraciones públicas
    tengan en cuenta criterios de minimización de sesgos, transparencia y rendición de cuentas, siempre
    que sea factible técnicamente. En estos mecanismos se incluirán su diseño y datos de entrenamiento,
    y abordarán su potencial impacto discriminatorio. Para lograr este fin, se promoverá la realización
    de evaluaciones de impacto que determinen el posible sesgo discriminatorio.“'
  - 'NORMTEXT Art. 23 Abs. 2: „Las administraciones públicas, en el marco de sus competencias en el ámbito
    de los algoritmos involucrados en procesos de toma de decisiones, priorizarán la transparencia en
    el diseño y la implementación y la capacidad de interpretación de las decisiones adoptadas por los
    mismos.“'
  - 'NORMTEXT Art. 23 Abs. 3: „Las administraciones públicas y las empresas promoverán el uso de una Inteligencia
    Artificial ética, confiable y respetuosa con los derechos fundamentales, siguiendo especialmente las
    recomendaciones de la Unión Europea en este sentido.“'
  - 'NORMTEXT Art. 23 Abs. 4: „Se promoverá un sello de calidad de los algoritmos.“'
  - 'Rechtsnatur: Programmsatz mit Bindungswirkung für die Verwaltung. Der Vorbehalt „siempre que sea
    factible técnicamente“ in Abs. 1 schwächt die Verpflichtung erheblich und war Gegenstand der Kritik
    in der Literatur.'
  - 'Wirkung über den Wortlaut hinaus: der Tribunal Supremo hat Art. 23 Abs. 2 in der BOSCO-Entscheidung
    (STS 1119/2025) als Argument dafür herangezogen, dass Transparenz und Interpretierbarkeit algorithmischer
    Verwaltungsentscheidungen ein normativ verankertes Ziel sind — die Programmnorm wird damit auslegungsleitend
    für das Transparenzgesetz.'
  - 'Verhältnis zur KI-VO: Art. 23 überschneidet sich sachlich mit Art. 10 KI-VO (Daten-Governance, Bias)
    und Art. 27 KI-VO (Grundrechte-Folgenabschätzung für öffentliche Stellen), ist aber weiter, weil er
    nicht auf Hochrisikosysteme beschränkt ist, und schwächer, weil er nicht durchsetzbar ist.'
  - Título IV (Art. 46-52) enthält ein Sanktionsregime für Diskriminierungsverstöße; ein spezifischer
    Bußgeldtatbestand für Verstöße gegen Art. 23 ist darin nicht ausgewiesen.
