  regelungsschwerpunkte:
  - 'Aufbau: Capítulo I Disposiciones generales (Art. 1-3), Capítulo II Gobernanza y supervisión del mercado
    (Art. 4-10), Capítulo III Espacios controlados de pruebas para la IA (Art. 11), Capítulo IV Buen uso
    de la IA en el sector público estatal (Art. 12), Capítulo V Régimen sancionador (ab Art. 13). Insgesamt
    41 Artikel.'
  - Art. 1 Objeto, Art. 2 Definiciones, Art. 3 Ámbito de aplicación.
  - 'Art. 4 Autoridad notificante: die Dirección General de Inteligencia Artificial der Secretaría de
    Estado de Digitalización e Inteligencia Artificial, nicht die AESIA. Damit sind notifizierende Stelle
    und Marktüberwachung institutionell getrennt (Art. 28 KI-VO).'
  - 'Art. 5 Autoridades de vigilancia del mercado: dezentrales Modell mit acht staatlichen Behörden. AESIA
    ist Auffangzuständigkeit und zuständig für verbotene Praktiken, Biometrie außerhalb Migration und
    Justiz, kritische Infrastrukturen, Bildung, Beschäftigung, wesentliche Dienste, Transparenzpflichten
    und demokratische Prozesse. AEPD: verbotene Praktiken mit Datenschutzbezug, Biometrie außerhalb der
    Justiz, Migration, Asyl und Grenzkontrolle. CGPJ: KI in der Justizverwaltung und Biometrie im Justizkontext.
    Banco de España: Bonitäts- und Solvenzbewertung bei beaufsichtigten Kreditinstituten. CNMV: Bonitäts-
    und Solvenzbewertung bei beaufsichtigten Wertpapierdienstleistern. Dirección General de Seguros y
    Fondos de Pensiones: Risikobewertung und Preisbildung in der Lebens- und Krankenversicherung.'
  - 'Art. 6 Punto de contacto único (Art. 70 Abs. 2 KI-VO): AESIA.'
  - Art. 7 Actuaciones de las autoridades de vigilancia de mercado; Art. 8 Coordinación (Koordinierungspflicht
    zwischen den acht Behörden); Art. 9 Reclamaciones ante una autoridad de vigilancia del mercado (Beschwerderecht
    nach Art. 85 KI-VO); Art. 10 Protección del informante (Whistleblowing, Art. 87 KI-VO).
  - 'Art. 11 Gobernanza de los espacios controlados de pruebas: die AESIA MUSS ein Reallabor einrichten
    (Pflicht nach Art. 57 Abs. 1 KI-VO); die übrigen zuständigen Behörden KÖNNEN in ihrem Zuständigkeitsbereich
    weitere einrichten.'
  - 'Art. 12 Actuaciones para el buen uso de la IA en el sector público estatal: (a) Pflicht zu aktueller,
    einschlägiger Information über den Einsatz von KI-Systemen, (b) verpflichtendes Inventar/Register
    der in Verwaltungsverfahren eingesetzten KI-Systeme, (c) Benennung eines ''delegado de inteligencia
    artificial'' je Einrichtung zur Koordination von Rechtsanwendung und gutem Technikgebrauch, (d) Schulungspflichten.
    Das geht über die KI-VO hinaus: Art. 49 Abs. 3 KI-VO kennt nur die Registrierung von Hochrisikosystemen,
    das Inventar erfasst sämtliche KI-Systeme.'
  - 'Capítulo V Régimen sancionador (Art. 13 ff., Wortlaut nicht lesbar): dreistufige Ordnung muy graves
    / graves / leves. Verjährung ein Jahr (leves), drei Jahre (graves), fünf Jahre (muy graves). Zusätzlich
    multas coercitivas (Zwangsgelder) und Nebenfolgen — Nutzungsverbot und Abschaltung (desconexión) von
    Systemen; Kriterien der Bußgeldbemessung; Verfahren nach Ley 39/2015; Veröffentlichung von Sanktionen
    koordiniert über die AESIA.'
  - 'Bußgeldstaffel nach dem anteproyecto (Art. 13 Abs. 1 des anteproyecto, im proyecto der Höhe nach
    unverändert): (a) sehr schwere Verstöße durch verbotene Praktiken 7.500.001 bis 35.000.000 Euro oder,
    bei Gesellschaften und Konzernen, 2 % bis 7 % des weltweiten Jahresumsatzes; (b) sonstige sehr schwere
    Verstöße (Hochrisiko) 7.500.001 bis 15.000.000 Euro oder 2 % bis 3 %; (c) schwere Verstöße 500.001
    bis 7.500.000 Euro oder 1 % bis 2 %; (d) leichte Verstöße 6.000 bis 500.000 Euro oder 0,5 % bis 1
    %. Bei KMU gilt jeweils der niedrigere von Betrag und Prozentsatz — das ist die Umkehrung von Art.
    99 Abs. 6 KI-VO, der für KMU ebenfalls den niedrigeren Wert vorsieht, hier also gleichlaufend.'
  - 'WIDERSPRUCH IN DEN QUELLEN zur Kategorie ''graves'': die Zusammenfassung von finreg360 zum proyecto
    nennt 7,5 Mio. Euro oder 1 % als Obergrenze, der anteproyecto-Volltext 7.500.000 Euro oder 1 % bis
    2 %. Nicht aufgelöst, weil Kapitel V des proyecto nicht im Wortlaut zugänglich war.'
  - 'Tatbestände sehr schwerer Verstöße (anteproyecto Art. 14): Inverkehrbringen oder Inbetriebnahme verbotener
    Systeme nach Art. 5 Abs. 1 lit. a) bis g) KI-VO; Einsatz biometrischer Echtzeit-Fernidentifizierung
    ohne zulässigen Zweck oder ohne vorherige Genehmigung; Nichtmeldung schwerwiegender Vorfälle an die
    Marktüberwachungsbehörde; Nichtbefolgung angeordneter Abhilfemaßnahmen; Wiederholung eines schweren
    Verstoßes binnen zwei Jahren.'
  - 'Tatbestände schwerer Verstöße (anteproyecto Art. 15-21), gestaffelt nach Akteursrolle: für alle Akteure
    Widerstand oder Behinderung von Inspektionen, Missachtung vorläufiger Maßnahmen, Nichtvorlage angeforderter
    Informationen (Art. 15); für Anbieter Verletzung von Dokumentations- und Registrierungspflichten,
    unterlassene Information über die Interaktion mit einem KI-System und Verletzung der Hochrisikoanforderungen
    (Art. 16); für Bevollmächtigte fehlende Registrierung in der nationalen Datenbank (Art. 17); für Einführer
    fehlende Konformitätsprüfung und fehlende Kontaktangaben (Art. 18); für Händler fehlende Prüfung der
    Kennzeichnung und unsachgemäße Lagerung (Art. 19); für Betreiber unterlassene Information über Emotionserkennungssysteme,
    Verletzung technischer Aufsichtsmaßnahmen und der Beobachtung nach Inverkehrbringen (Art. 20); für
    notifizierte Stellen Interessenkonflikte, fehlende Unabhängigkeit und Verletzung der Vertraulichkeit
    (Art. 21).'
  - 'Tatbestände leichter Verstöße (anteproyecto Art. 22-26): unvollständige, unrichtige oder irreführende
    Auskunft (Art. 22); fehlende Handelsangaben auf der Verpackung, Nichtbehebung formaler Mängel, fehlende
    CE-Kennzeichnung (Art. 23); Aufbewahrungspflichtverletzung durch Einführer (Art. 24); fehlende Registrierung
    durch öffentliche Stellen als Betreiber (Art. 25); organisatorische Mängel und unzureichendes Personal
    notifizierter Stellen (Art. 26).'
  - 'KENNZEICHNUNG KI-ERZEUGTER INHALTE: der anteproyecto verankert sie zweifach. Art. 16 Abs. 1 lit.
    c) verpflichtet den Anbieter, die Ausgaben von Systemen, die synthetische Audio-, Bild-, Video- oder
    Textinhalte erzeugen, so zu kennzeichnen, dass ihre künstliche Natur erkennbar ist (''marcar los resultados
    de salida de tal modo que pueda detectarse su naturaleza artificial''). Art. 20 Abs. 1 lit. b) verpflichtet
    den Betreiber, die künstliche Natur der Ausgaben offenzulegen (''hacer pública la naturaleza artificial
    de los resultados de salida'') bei Systemen, die Bilder oder Audio-/Videomaterial erzeugen oder manipulieren,
    das eine ultrasuplantación (Deepfake) darstellt, oder Text zu Angelegenheiten von öffentlichem Interesse.'
  - 'Juristischer Kernpunkt: die Verletzung der Kennzeichnungspflicht ist ein SCHWERER Verstoß (Anbieter-
    bzw. Betreiberpflicht), die bloß fehlerhafte oder unvollständige Kennzeichnung ein LEICHTER. Das nationale
    Gesetz füllt damit Art. 50 KI-VO aus, für den die KI-VO selbst in Art. 99 Abs. 4 lit. g) nur die Obergrenze
    setzt und die Sanktionsfestlegung den Mitgliedstaaten überlässt.'
  - 'Disposiciones finales: DF 1ª ändert die Ley General Tributaria (automatisierte Systeme und KI in
    der Betrugsbekämpfung); DF 2ª ändert das Sozialversicherungsrecht (Zusammenarbeit der Verwaltungsträger);
    DF 3ª fügt der Wahlgesetzgebung (LOREG) eine Bestimmung hinzu, mit der die AESIA den Schutz demokratischer
    Prozesse überwacht; DF 4ª Kompetenztitel; DF 5ª Bestimmung der Vorschriften mit Rang eines organischen
    Gesetzes; DF 6ª Verordnungsermächtigung; DF 7ª Errichtung einer nationalen Datenbank für KI-Systeme
    in kritischen Infrastrukturen; DF 8ª Inkrafttreten.'
  - 'Verfassungsrechtliche Streitfrage: die Literatur kritisiert, dass ein nationales Gesetz eine unmittelbar
    geltende Verordnung materiell nachzeichnet (Wiederholungsverbot, EuGH-Rechtsprechung zu Art. 288 AEUV).
    Der spanische Gesetzgeber begründet den Ley-Orgánica-Rang mit den Grundrechtsbezügen (Biometrie, Justiz,
    Wahlrecht).'
