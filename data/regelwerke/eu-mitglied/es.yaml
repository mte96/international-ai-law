- id: es-estrategia-ia-2024
  jurisdiktion: es
  kurztitel: Estrategia de Inteligencia Artificial 2024
  offizieller_titel: Estrategia de Inteligencia Artificial 2024
  fundstelle: Vom Ministerrat am 14.05.2024 gebilligt; herausgegeben vom Ministerio para la Transformación
    Digital y de la Función Pública. Keine BOE-Veröffentlichung.
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Nicht bindend. Nachfolgerin der Estrategia Nacional de Inteligencia Artificial (ENIA)
    von 2020. Umfang 67 Seiten. Sie ist der haushalts- und förderpolitische Rahmen, in dem die AESIA arbeitet,
    und wird von Art. 23 Abs. 1 Ley 15/2022 („En el marco de la Estrategia Nacional de Inteligencia Artificial…“)
    als Bezugsdokument in Bezug genommen.

    '
  kurzbeschreibung: 'Regierungsstrategie mit drei Achsen: Stärkung der Schlüsselhebel für die KI-Entwicklung,
    Förderung der KI-Anwendung in öffentlichem und privatem Sektor sowie transparente, verantwortungsvolle
    und humanistische KI. Sie bündelt acht Maßnahmenbereiche (palancas) — Supercomputing, Datenräume und
    Speicher, spanische und kospanischsprachige Sprachmodelle (Projekt ALIA), Talentförderung, KI im öffentlichen
    Sektor, KI in KMU, Cybersicherheit sowie die Aufgaben der AESIA. Volumen rund 600 Mio. Euro für Talent
    und Infrastruktur, zusätzlich rund 300 Mio. Euro EFRE-Mittel. Die KI-Verordnung wird ausdrücklich
    als Orientierungsrahmen benannt, die AESIA als tragender Anker für Modellvalidierung und Transparenz.

    '
  inkrafttreten:
    datum: 2024-05-14
    verifiziert: false
    quelle: https://www.lamoncloa.gob.es/consejodeministros/resumenes/Documents/2024/140524-Estrategia%20de%20Inteligencia%20Artificial%202024-completa.pdf
    fundstelle_norm: Billigung durch den Consejo de Ministros; kein Rechtsakt, keine Inkrafttretensvorschrift,
      keine BOE-Veröffentlichung. Das Datum 14.05.2024 folgt aus der Ablage des amtlichen Dokuments unter
      der Ministerratssitzung vom 14.05.2024 ("140524").
  anwendungsdaten:
  - datum: 2024-05-14
    was_gilt: Billigung durch den Ministerrat.
    verifiziert: false
    quelle: https://www.lamoncloa.gob.es/consejodeministros/resumenes/Documents/2024/140524-Estrategia%20de%20Inteligencia%20Artificial%202024-completa.pdf
  themenachsen:
  - governance
  - marktzugang
  - gpai
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Eje 1: Stärkung der Schlüsselhebel (acht palancas) — Supercomputing, Datenspeicherung und Datenräume,
    Sprachmodelle (ALIA), Talent, KI im öffentlichen Sektor, KI in KMU, Cybersicherheit, Funktionen der
    AESIA.'
  - 'Eje 2: Förderung der KI-Anwendung im öffentlichen und privaten Sektor.'
  - 'Eje 3: transparente, verantwortungsvolle und humanistische KI — hier ist die AESIA als „ancla fundamental“
    für Modellvalidierung und ethische Entwicklung verankert.'
  - 'Mittelvolumen: rund 600 Mio. Euro für Talent- und Infrastrukturprojekte, dazu rund 300 Mio. Euro
    aus dem EFRE.'
  - ALIA ist das öffentliche spanischsprachige Sprachmodellprojekt; es ist der Hebel, mit dem Spanien
    Souveränität bei Basismodellen anstrebt — regulatorisch relevant, weil ein staatlicher Anbieter zugleich
    Adressat der GPAI-Pflichten der Art. 51 ff. KI-VO wäre.
  - Der Text nennt die KI-Verordnung ausdrücklich als Orientierungsrahmen — die Strategie ist damit älter
    als das nationale Durchführungsgesetz und überbrückt die Regelungslücke politisch.
