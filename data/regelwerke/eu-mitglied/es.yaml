    quelle: https://www.aepd.es/prensa-y-comunicacion/notas-de-prensa/aepd-publica-guia-requisitos-auditorias-tratamiento-ia
  - datum: 2026-02-18
    was_gilt: Veröffentlichung der Orientierungen zu agentischer KI (V1.2, Februar 2026).
    verifiziert: true
    quelle: https://www.aepd.es/prensa-y-comunicacion/notas-de-prensa/la-agencia-publica-unas-orientaciones-sobre-inteligencia
  themenachsen:
  - datenschutz
  - governance
  - grundrechte
  - gpai
  regelungsschwerpunkte:
  - 'Orientaciones sobre Inteligencia Artificial agéntica (V1.2, Februar 2026, 76 Seiten). Gliederung:
    I. Introducción, II. Agentes de IA, III. Agentes de IA en los tratamientos, IV. Vulnerabilidades y
    tratamientos de datos personales, V. Aspectos de cumplimiento de la normativa de protección de datos,
    VI. Amenazas, VII. Medidas, VIII. Reflexiones finales, IX. Referencias.'
  - 'Kernthese der Agenten-Leitlinie: Systeme, die nicht nur antworten, sondern autonom handeln („capaz
    no solo de responder a preguntas, sino de interactuar de forma autónoma“), werfen eigenständige Datenschutzfragen
    auf — Zweckbindung, Verantwortlichkeitszuordnung, Kontrolle über Weiterverarbeitung. Die AEPD empfiehlt
    zugleich, agentische KI proaktiv für besseren Datenschutz durch Technikgestaltung zu nutzen.'
  - 'Requisitos para auditorías de tratamientos de datos personales que incluyan Inteligencia Artificial
    (Januar 2021): objektive Kriterien für die Prüfung KI-gestützter Verarbeitungen aus Datenschutzsicht;
    Adressaten sind Verantwortliche, Entwickler und Datenschutzbeauftragte.'
  - 'Guía de adecuación al RGPD de tratamientos que incorporan Inteligencia Artificial: Umsetzung der
    Datenschutzgrundsätze bei KI-gestützten Verarbeitungen, Audit als Bewertungsinstrument.'
  - 'Política general para el uso de IA generativa en la AEPD: nach Angaben der Behörde die erste interne
    KI-Nutzungsrichtlinie einer öffentlichen Stelle in Spanien — praktisch der Prototyp dessen, was Art.
    12 des Proyecto de Ley Orgánica für den gesamten staatlichen Sektor verlangt.'
  - 'Schnittstelle zur KI-VO: die AEPD ist nach Art. 74 Abs. 8 KI-VO die naheliegende Marktüberwachungsbehörde
    für biometrische Hochrisikosysteme; der Proyecto de Ley Orgánica weist ihr diese Rolle zu. Ihre Leitlinien
    nehmen die Auslegung von Art. 5 und Anhang III KI-VO teilweise vorweg.'
