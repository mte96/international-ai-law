- id: es-rd-415-2026
  jurisdiktion: es
  kurztitel: Real Decreto 415/2026 — Bewertung von Gesundheitstechnologien
  offizieller_titel: Real Decreto 415/2026, de 27 de mayo, por el que se regula la evaluación de tecnologías
    sanitarias
  fundstelle: BOE núm. 131, de 29 de mayo de 2026 (BOE-A-2026-11587)
  verfahrensnummer: Real Decreto 415/2026
  status: anwendbar
  status_detail: 'Im BOE vom 29.05.2026 verkündet. Der KI-Bezug ist schmal, aber rechtlich konkret: Art.
    6 Abs. 3 macht den Einsatz von KI, maschinellem Lernen oder gleichwertigen Algorithmen zu einem Priorisierungskriterium
    für die Bewertung von Gesundheits- technologien, die keine Arzneimittel sind. Eine eigene Bewertungsmethodik
    für KI-Systeme enthält der Rechtsakt nicht.

    '
  kurzbeschreibung: 'Verordnung über die Bewertung von Gesundheitstechnologien im Nationalen Gesundheitssystem
    — Arzneimittel, Medizinprodukte, diagnostische Verfahren, digitale Therapien und klinische Prozeduren.
    Für das KI-Recht einschlägig ist die Aufnahme KI-gestützter Informationssysteme in den Katalog der
    Priorisierungskriterien: „la incorporación de sistemas de información que utilicen inteligencia artificial,
    tecnologías de aprendizaje automático o algún algoritmo equivalente“ (Art. 6 Abs. 3). Damit rückt
    der KI-Einsatz eine Technologie in der Bewertungsreihenfolge nach vorn. Sanktionen enthält der Rechtsakt
    nicht.

    '
  inkrafttreten:
    datum: 2026-06-18
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-11587
    fundstelle_norm: 'Disposición final cuarta des Real Decreto 415/2026, de 27 de mayo: "Este real decreto
      entrará en vigor a los veinte días de su publicación en el «Boletín Oficial del Estado»." Veröffentlichung
      im BOE núm. 131 vom 29.05.2026 — daher Inkrafttreten am 18.06.2026. Zuvor war kein Datum eingetragen,
      obwohl der Status "anwendbar" lautete.'
  anwendungsdaten:
  - datum: 2026-05-29
    was_gilt: Verkündung im BOE núm. 131.
    verifiziert: true
    quelle: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-11587
  themenachsen:
  - sektor-medizin
  - marktzugang
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Art. 6 Abs. 3: die Einbindung von Informationssystemen, die künstliche Intelligenz, maschinelles
    Lernen oder einen gleichwertigen Algorithmus nutzen, ist eines der Kriterien für die Priorisierung
    der Bewertung von Nicht-Arzneimittel-Technologien.'
  - 'Regelungstechnisch bemerkenswert: der KI-Einsatz wird nicht als Risiko, sondern als Anlass beschleunigter
    Bewertung behandelt — eine andere Logik als die risikobasierte Systematik der KI-VO.'
  - 'Erfasste Technologien: Arzneimittel, Medizinprodukte, diagnostische Verfahren, digitale Therapien
    (terapias digitales) und klinische Prozeduren.'
  - Keine eigene Methodik für die Bewertung lernender Systeme; insbesondere fehlt eine Regelung zum Umgang
    mit Modellaktualisierungen nach der Bewertung.
  dokumente:
  - datum: 2026-05-29
    typ: endfassung
    titel: Real Decreto 415/2026, de 27 de mayo, por el que se regula la evaluación de tecnologías sanitarias
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-11587
    sprache: es
    urheber: Ministerio de Sanidad / Boletín Oficial del Estado
    verifiziert: true
    notiz: Geöffnet; Art. 6 Abs. 3 im Wortlaut abgeglichen.
  - datum: 2026-05-29
    typ: endfassung
    titel: Real Decreto 415/2026 — ELI-Adresse
    url: https://www.boe.es/eli/es/rd/2026/05/27/415
    sprache: es
    urheber: Agencia Estatal Boletín Oficial del Estado
    verifiziert: false
    notiz: ELI-Adresse;
  offene_punkte:
  - Das Datum des Inkrafttretens war im abgerufenen Text nicht erkennbar.
  - Ob KI-gestützte Technologien über Art. 6 Abs. 3 hinaus einer besonderen Bewertungsmethodik unterliegen
    sollen, ist offen.
