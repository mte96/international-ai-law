  - sektor-oeffentlich
  regelungsschwerpunkte:
  - Acord GOV/262/2025 vom 11.11.2025 billigt die Estratègia Catalunya IA 2030 und ersetzt damit den bisherigen
    Plan estratègic Catalonia.AI.
  - 'Nachgelagert: Instrumente der Generalitat zum verantwortungsvollen KI-Einsatz in der öffentlichen
    Verwaltung (Mai 2026), veröffentlicht über web.gencat.cat.'
  - 'Kompetenzrechtlich: Autonome Gemeinschaften können KI in ihrer eigenen Verwaltung regeln und Förderpolitik
