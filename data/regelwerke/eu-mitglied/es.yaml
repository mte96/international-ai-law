- id: es-lo-gobernanza-ia
  jurisdiktion: es
  kurztitel: Ley Orgánica IA (Proyecto) — buen uso y gobernanza de la IA
  offizieller_titel: Proyecto de Ley Orgánica para el buen uso y la gobernanza de la inteligencia artificial
  fundstelle: Boletín Oficial de las Cortes Generales, Congreso de los Diputados, XV Legislatura, Serie
    A (Proyectos de Ley), núm. 97-1, de 12 de junio de 2026
  verfahrensnummer: 121/000096 (Congreso de los Diputados, XV Legislatura)
  status: verfahren
  status_detail: 'Nicht verabschiedet. Vom Ministerrat am 26.05.2026 beschlossen, dem Congreso am 28.05.2026
    zugeleitet, von der Mesa am 08.06.2026 qualifiziert und am 12.06.2026 im BOCG Serie A núm. 97-1 veröffentlicht.
    Zuständig ist die Comisión de Economía, Comercio y Transformación Digital; die Frist für Änderungsanträge
    lief am 30.06.2026 ab. Bis zum Rechercheschluss ist kein weiteres BOCG-Teildokument erschienen (97-2
    und 97-3 antworten mit HTTP 404), also weder ein Änderungsantragsband noch ein Ponencia-Bericht, ein
    Ausschussdictamen oder ein an den Senado übermittelter Text. Es gibt folglich auch keine BOE-Fundstelle
    und keine ELI-Adresse.

    '
  kurzbeschreibung: 'Nationales Durchführungsgesetz zur KI-Verordnung (EU) 2024/1689 mit 41 Artikeln in
    fünf Kapiteln. Es benennt die Dirección General de Inteligencia Artificial als notifizierende Behörde
    und acht staatliche Marktüberwachungsbehörden, macht die AESIA zur zentralen Anlaufstelle, regelt
    die Governance der Reallabore, verpflichtet den staatlichen öffentlichen Sektor zu einem Inventar
    der eingesetzten KI-Systeme und zur Benennung eines "delegado de inteligencia artificial" und schafft
    ein eigenständiges nationales Sanktionsregime. Adressaten sind Anbieter, Betreiber, Einführer, Händler,
    Bevollmächtigte und notifizierte Stellen sowie die staatliche Verwaltung. Die Geldbußen reichen bis
    35 Mio. Euro bzw. 7 % des weltweiten Jahresumsatzes; Bagatellverstöße beginnen bei 6.000 Euro (anteproyecto)
    bzw. werden bis 500.000 Euro bzw. 0,5 % geahndet.

    '
