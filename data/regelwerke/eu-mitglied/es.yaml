      im BOE núm. 236 vom 02.10.2015.'
  anwendungsdaten:
  - datum: 2016-10-02
    was_gilt: Geltung von Art. 41 (actuación administrativa automatizada).
    verifiziert: false
    quelle: https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566
  - datum: 2025-09-11
    was_gilt: Tribunal Supremo erkennt den Anspruch auf Zugang zum Quellcode einer automatisierten Verwaltungsanwendung
      an (BOSCO).
    verifiziert: true
    quelle: https://www.boe.es/biblioteca_juridica/anuarios_derecho/articulo.php?id=ANU-L-2025-00000003101
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Art. 41 Ley 40/2015: Legaldefinition der actuación administrativa automatizada — jeder vollständig
    über elektronische Mittel vorgenommene Akt einer öffentlichen Verwaltung im Rahmen eines Verwaltungsverfahrens
    ohne unmittelbare Mitwirkung eines öffentlich Bediensteten. Abs. 2 verlangt die vorherige Festlegung
    und Bekanntgabe des für Spezifikationen, Programmierung, Wartung, Überwachung und Qualitätskontrolle
    zuständigen Organs sowie des für Rechtsbehelfe verantwortlichen Organs. ACHTUNG: Der Wortlaut konnte
    nicht abgerufen werden (die konsolidierte BOE-Fassung bricht beim Abruf in Art. 18 ab); die Wiedergabe
    ist inhaltlich, nicht wörtlich.'
  - 'Art. 157 Abs. 2 Ley 40/2015: Pflicht der Verwaltungen, ihre Anwendungen anderen Verwaltungen zur
    Weiterverwendung bereitzustellen. Der Tribunal Supremo nutzt diese Norm als Beleg dafür, dass der
    Quellcode ein vorhandenes, dokumentiertes und übertragbares Verwaltungsdokument ist und damit dem
    Informationszugang unterfällt.'
  - 'LEITENTSCHEIDUNG BOSCO: Tribunal Supremo, Sala de lo Contencioso-Administrativo, Sección Tercera,
    Sentencia 1119/2025 vom 11.09.2025, recurso de casación 7878/2024, ECLI ES:TS:2025:3826, Berichterstatter
    Juan Pedro Quintana Carretero. Klägerin: Fundación Ciudadana Civio. Beklagte: Ministerium für den
    ökologischen Wandel. Gegenstand: Zugang zum Programmcode der Anwendung BOSCO, die über die Berechtigung
    zum bono social eléctrico (Sozialtarif Strom) entscheidet.'
  - 'Tragende Erwägungen der BOSCO-Entscheidung: Der Zugang zum Quellcode digitaler Systeme, die automatisierte
    Verwaltungsentscheidungen treffen, ist Teil des Rechts auf Informationszugang. Urheberrechtliche Einwände
    können die Transparenzpflicht nicht ausschalten, soweit es um die Entscheidungslogik geht, die über
    Rechte der Bürger befindet; der Einwand der öffentlichen Sicherheit greift nicht pauschal. Herangezogene
    Normen: Ley 19/2013 de transparencia (Art. 14-16), Ley 40/2015 (Art. 157 Abs. 2), Ley 15/2022 (Art.
    23 Abs. 2), DSGVO (Art. 13 Abs. 2 lit. f, Art. 14 Abs. 2 lit. g, Art. 15 Abs. 1 lit. h) und die Interoperabilitätsverordnung
    (EU) 2024/903 (Art. 5).'
  - 'Bedeutung: erste höchstrichterliche Anerkennung eines Quellcode-Zugangsanspruchs in der EU. Die Entscheidung
    wirkt unmittelbar auf das Inventar der KI-Systeme, das Art. 12 des Proyecto de Ley Orgánica für die
    staatliche Verwaltung vorschreibt — die Registrierungspflicht bekommt durch BOSCO ein durchsetzbares
    Gegenstück.'
  - 'Grenzen: BOSCO ist eine regelbasierte Anwendung, kein lernendes System. Ob der Anspruch auf Modellgewichte
    und Trainingsdaten eines maschinell lernenden Systems durchschlägt, ist nicht entschieden.'
