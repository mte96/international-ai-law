  offene_punkte:
  - Artikelnummern und Wortlaut des Capítulo V (Régimen sancionador) der Fassung vom 12.06.2026 sind nicht
    verifiziert; die Angaben stammen aus dem anteproyecto von 2025 und aus Kanzleianalysen.
  - 'Ob die Frist für Änderungsanträge über den 30.06.2026 hinaus verlängert wurde, ist nicht feststellbar:
    eine Fristverlängerung würde im BOCG Serie A als Teildokument 97-2 erscheinen, das nicht existiert.'
  - Ob das Vorhaben die für ein organisches Gesetz nötige absolute Mehrheit findet, ist offen; dieselbe
    Mehrheitsfrage hat das Minderjährigenschutzgesetz seit Dezember 2025 blockiert.
  - Das Verhältnis der nationalen Bußgeldtatbestände zu den unmittelbar geltenden Bußgeldrahmen des Art.
    99 KI-VO ist im Entwurf nicht ausdrücklich geregelt (Doppelsanktionierungsrisiko).
  - Der Anwendungsbeginn (disposición final octava) ist nicht verifiziert; finreg360 gibt 'am Tag nach
    der Verkündung' an.
