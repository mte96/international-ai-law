- id: es-ley-40-2015-automatizada
  jurisdiktion: es
  kurztitel: Ley 40/2015 — automatisierte Verwaltungshandlung und Quellcodetransparenz (BOSCO)
  offizieller_titel: Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público
  fundstelle: BOE núm. 236, de 2 de octubre de 2015 (BOE-A-2015-10566)
  verfahrensnummer: Ley 40/2015
  status: anwendbar
  status_detail: 'In Kraft seit dem 02.10.2016. Art. 41 (actuación administrativa automatizada) ist die
    allgemeine Rechtsgrundlage für vollständig automatisierte Verwaltungsentscheidungen in Spanien und
    damit die Norm, an der sich der Einsatz von KI in Verwaltungsverfahren misst. Durch das Urteil des
    Tribunal Supremo vom 11.09.2025 (Fall BOSCO) ist sie zusammen mit Art. 157 Abs. 2 desselben Gesetzes
    und dem Transparenzgesetz Ley 19/2013 zur Grundlage eines Anspruchs auf Zugang zum Quellcode verwaltungsbehördlicher
    Entscheidungsanwendungen geworden.

    '
  kurzbeschreibung: 'Allgemeines Verwaltungsorganisationsgesetz. Art. 41 definiert die automatisierte
    Verwaltungshandlung als jeden vollständig elektronisch und ohne unmittelbare Mitwirkung eines Bediensteten
    vorgenommenen Akt im Rahmen eines Verwaltungsverfahrens und verlangt, dass die Behörde vorab festlegt
    und bekanntgibt, welches Organ für die Festlegung von Spezifikationen, Programmierung, Wartung, Überwachung
    und Qualitätskontrolle zuständig ist und welches Organ für Rechtsbehelfe verantwortlich zeichnet.
    Art. 157 Abs. 2 verpflichtet die Verwaltungen, ihre Anwendungen zur Weiterverwendung durch andere
    Verwaltungen bereitzustellen — die Norm, aus der der Tribunal Supremo die Existenz eines dokumentierten,
    herausgabefähigen Quellcodes ableitet. Sanktionen enthält das Gesetz nicht; die Durchsetzung erfolgt
    über das Transparenz- und Verwaltungsprozessrecht.

    '
  inkrafttreten:
    datum: 2016-10-02
    verifiziert: true
    quelle: https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566
    fundstelle_norm: 'Disposición final decimoctava der Ley 40/2015 (Inkrafttreten ein Jahr nach der Veröffentlichung);
