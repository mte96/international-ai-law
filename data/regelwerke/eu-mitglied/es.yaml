- id: es-dl-2-2023-extremadura
  jurisdiktion: es
  subjurisdiktion: es-ex
  kurztitel: Decreto-ley 2/2023 Extremadura — KI-Förderung und KI in der Verwaltung
  offizieller_titel: Decreto-ley 2/2023, de 8 de marzo, de medidas urgentes de impulso a la inteligencia
    artificial en Extremadura
  fundstelle: DOE núm. 48, de 10 de marzo de 2023; nachrichtlich BOE núm. 84, de 8 de abril de 2023, págs.
    51175-51185 (BOE-A-2023-8795)
  verfahrensnummer: Decreto-ley 2/2023 (Junta de Extremadura); Konvalidierung durch Resolución vom 23.03.2023
  status: anwendbar
  status_detail: 'In Kraft seit dem 11.03.2023. Erster eigenständiger KI-Rechtsakt einer spanischen Autonomen
    Gemeinschaft — mehr als fünf Monate vor dem Estatuto der AESIA und über ein Jahr vor der KI-Verordnung.
    Vom Parlament am 23.03.2023 konvalidiert; eine Umwandlung in ein förmliches Gesetz ist nicht dokumentiert.

    '
  kurzbeschreibung: 'Dringlichkeitsverordnung mit Gesetzeskraft der Junta de Extremadura. Sie verpflichtet
    die autonome Verwaltung, KI-Systeme einzusetzen, die die Effizienz öffentlicher Dienste verbessern,
    den Beschäftigten zugutekommen und algorithmische Transparenz in der Entscheidungsfindung sichern;
    sie fordert ethische, vertrauenswürdige und grundrechtskonforme KI nach europäischen Maßstäben mit
    Qualitätsanspruch und Minimierung diskriminierender Verzerrungen. Instrumente sind digitale Alphabetisierung,
    öffentlich-private Zusammenarbeit, ein Reallabor beim Rechenzentrum COMPUTAEX und die Einstufung unternehmerischer
    KI-Investitionen als Vorhaben von autonomem Interesse. Eine Zusatzbestimmung gab der Regionalregierung
    neun Monate Zeit für eine Estrategia Extremeña de Inteligencia Artificial. Sanktionen enthält der
    Rechtsakt nicht.

    '
  inkrafttreten:
    datum: 2023-03-11
    verifiziert: true
    quelle: https://www.boe.es/buscar/doc.php?id=BOE-A-2023-8795
  anwendungsdaten:
  - datum: 2023-03-11
    was_gilt: Inkrafttreten (Tag nach Veröffentlichung im DOE).
    verifiziert: true
    quelle: https://www.boe.es/buscar/doc.php?id=BOE-A-2023-8795
  - datum: 2023-03-23
    was_gilt: Konvalidierung durch die Asamblea de Extremadura.
    verifiziert: true
    quelle: https://www.boe.es/buscar/doc.php?id=BOE-A-2023-8795
  themenachsen:
  - sektor-oeffentlich
  - governance
  - marktzugang
  - grundrechte
  regelungsschwerpunkte:
  - 'Capítulo I (Art. 1-4): Gegenstand, Anwendungsbereich, Begriffsbestimmungen, Grundsätze — ethische,
    vertrauenswürdige und grundrechtskonforme KI nach europäischen Standards, Qualität und Minimierung
    diskriminierender Verzerrungen.'
  - 'Capítulo II (Art. 5-7): Aus- und Fortbildung, öffentlich-private Zusammenarbeit, entornos controlados
    de pruebas beim Rechenzentrum COMPUTAEX. Das regionale Reallabor entstand acht Monate vor dem staatlichen
    Reallabor des RD 817/2023.'
  - 'Capítulo III (Art. 8-9): Einstufung von KI-Investitionsvorhaben als von allgemeinem und vorrangigem
    autonomem Interesse — Beschleunigung von Genehmigungsverfahren als Standortinstrument.'
  - 'Capítulo IV (Art. 10-12): Einsatz von KI in der Verwaltung, Ziele und Verfahrensgarantien einschließlich
    algorithmischer Transparenz.'
  - 'Disposición adicional: Auftrag zur Ausarbeitung einer Estrategia Extremeña de Inteligencia Artificial
    binnen neun Monaten.'
  - 'Kompetenzrechtlich bemerkenswert: eine Autonome Gemeinschaft regelt KI vor dem Zentralstaat. Der
    Proyecto de Ley Orgánica beschränkt sich auf den „sector público estatal“ (Art. 12) und lässt den
    autonomen Verwaltungen damit Raum — die Marktüberwachung nach der KI-VO bleibt aber staatlich.'
  dokumente:
  - datum: 2023-04-08
    typ: endfassung
    titel: Decreto-ley 2/2023, de 8 de marzo, de medidas urgentes de impulso a la inteligencia artificial
      en Extremadura (BOE-Wiedergabe)
    url: https://www.boe.es/buscar/doc.php?id=BOE-A-2023-8795
    sprache: es
    urheber: Junta de Extremadura / Boletín Oficial del Estado
    verifiziert: true
    notiz: Geöffnet; Struktur, Fundstellen in DOE und BOE, Inkrafttreten und Konvalidierung abgeglichen.
      Der BOE gibt autonomes Recht nachrichtlich wieder; amtlich ist das DOE.
  offene_punkte:
  - Die DOE-Adresse des Originaltextes wurde nicht abgerufen (doe.juntaex.es).
  - Ob die Estrategia Extremeña de Inteligencia Artificial tatsächlich erlassen wurde, ist nicht belegt.
