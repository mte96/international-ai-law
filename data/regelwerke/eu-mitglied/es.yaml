  regelungsschwerpunkte:
  - 'Aufbau: Título Preliminar Disposiciones generales (Art. 1-3), Título I Protección de consumidores
    y usuarios (Art. 4-5), Título II Medidas educativas (Art. 6-7), Título III Protección de víctimas
    de violencia de género y sexual (Art. 8-9), Título IV Medidas sanitarias (Art. 10-11), Título V Medidas
    en el sector público (Art. 12-15), dazu disposiciones finales.'
  - 'DISPOSICIÓN FINAL TERCERA — Änderung des Código Penal. Kernstück ist der neue Art. 173 bis CP: strafbar
    macht sich, wer ohne Einwilligung Bild- oder Stimmaufnahmen einer Person verbreitet, ausstellt oder
    überlässt, die mittels automatisierter Systeme erzeugt, verändert oder nachgebildet wurden, so dass
    sie echt erscheinen, und dabei Situationen sexuellen Inhalts simulieren. Entwurfsformulierung: „difundan,
    exhiban o cedan su imagen corporal o audio de voz generada, modificada o recreada mediante sistemas
    automatizados… de modo que parezca real, simulando situaciones de contenido sexual.“'
  - 'Systematische Verortung: Art. 173 bis CP steht im Titel über Straftaten gegen die moralische Unversehrtheit
    (integridad moral), nicht bei den Sexualstraftaten und nicht bei den Delikten gegen die Privatsphäre
    (Art. 197 CP). Das ist eine bewusste Entscheidung: geschütztes Rechtsgut ist die Würde und moralische
    Integrität, nicht die sexuelle Selbstbestimmung — der Deepfake bildet ja keinen realen Vorgang ab.
    Die Tathandlung ist die VERBREITUNG, nicht die Herstellung.'
  - 'Änderung des Art. 186 CP: Ausweitung des Verbreitungstatbestands pornografischen Materials an Minderjährige;
    die bisherige Beschränkung auf „medios directos“ entfällt, damit ungezielte Massenverbreitung erfasst
    wird.'
  - 'Verschärfung der Art. 181 bis 189 CP: qualifizierender Umstand, wenn der Täter bei Sexualstraftaten
    gegen Minderjährige Technik zur Verschleierung der Identität einsetzt — das erfasst KI-gestützte Identitätsfälschung
    im Grooming.'
  - 'Digitale Kontaktsperre („alejamiento digital“): Änderung der Art. 33, 39, 40, 45, 48, 56, 70 und
    96 Abs. 3 CP sowie Art. 83 CP, um das Verbot des Zugangs zu sozialen Netzwerken und virtuellen Räumen
    als Nebenstrafe, Maßregel und Bewährungsauflage zu verankern. Das ist rechtsvergleichend bemerkenswert:
    eine räumlich gedachte Schutzanordnung wird auf digitale Räume übertragen.'
  - 'Änderung der LO 3/2018 (LOPDGDD): Anhebung des Einwilligungsalters für die Verarbeitung personenbezogener
    Daten von 14 auf 16 Jahre — Ausübung der Öffnungsklausel des Art. 8 Abs. 1 DSGVO in die restriktive
    Richtung.'
  - 'Weitere Änderungen: Ley 13/2022 General de Comunicación Audiovisual (Altersverifikation, Kindersicherungen),
    Ley 34/2002 LSSI (erweiterte Befugnisse zur Unterbrechung von Diensten zum Schutz Minderjähriger),
    Prozessgesetze (Zuständigkeit für die richterliche Anordnung von Maßnahmen gegen Inhalte).'
  - 'Politischer Zusammenhang: Spanien betreibt parallel auf EU-Ebene die Aufnahme sexueller Deepfakes
    in den Verbotskatalog des Art. 5 KI-VO. Der nationale Straftatbestand ist die Absicherung für den
    Fall, dass dieser Weg scheitert.'
