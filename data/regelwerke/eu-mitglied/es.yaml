- id: es-catalunya-ia-2030
  jurisdiktion: es
  subjurisdiktion: es-ct
  kurztitel: Estratègia Catalunya IA 2030
  offizieller_titel: Acord GOV/262/2025, d'11 de novembre, pel qual s'aprova l'Estratègia Catalunya IA
    2030
  fundstelle: Acord GOV/262/2025, de 11 de noviembre, del Govern de la Generalitat de Catalunya; veröffentlicht
    im Diari Oficial de la Generalitat de Catalunya (DOGC-Nummer nicht ermittelt)
  verfahrensnummer: Acord GOV/262/2025
  status: softlaw
  status_detail: 'Regierungsbeschluss der Generalitat de Catalunya vom 11.11.2025 zur Billigung der katalanischen
    KI-Strategie bis 2030. Nachfolgerin des Plans Catalonia.AI. Nicht bindend; sie ist ein Förder- und
    Governance-Rahmen, kein Regelungsakt mit Pflichten für Private. ACHTUNG: Katalonien hat KEIN eigenes
    KI-Gesetz — die vielfach behauptete katalanische KI-Regulierung besteht aus Strategie- und Verwaltungsinstrumenten.

    '
  kurzbeschreibung: 'Regionalstrategie für künstliche Intelligenz mit Zielhorizont 2030, vom Regierungsrat
    der Generalitat am 11.11.2025 gebilligt. Sie bündelt Forschungs-, Infrastruktur-, Kompetenz- und Verwaltungsmaßnahmen
    und knüpft an den früheren Plan Catalonia.AI an. Ergänzend hat die Generalitat im Mai 2026 Instrumente
    zum verantwortungsvollen KI-Einsatz in der öffentlichen Verwaltung veröffentlicht. Adressat sind die
    katalanische Verwaltung, Forschungseinrichtungen und Unternehmen; Sanktionen gibt es nicht.

    '
