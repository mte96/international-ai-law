- id: es-carta-derechos-digitales
  jurisdiktion: es
  kurztitel: Carta de Derechos Digitales (2021)
  offizieller_titel: Carta de Derechos Digitales
  fundstelle: Vom Ministerrat zur Kenntnis genommen und am 14.07.2021 vorgestellt; herausgegeben von der
    Secretaría de Estado de Digitalización e Inteligencia Artificial. Keine BOE-Veröffentlichung.
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Nicht bindend. Die Charta ist ausdrücklich als „hoja de ruta para la acción de los poderes
    públicos“ konzipiert — ein Orientierungsrahmen ohne Rechtsanspruch, nicht im BOE verkündet und ohne
    Gesetzesrang. Ihre Rechtswirkung ist mittelbar: Art. 23 Abs. 1 Ley 15/2022 und Art. 8 Real Decreto
    817/2023 verweisen ausdrücklich auf sie, so dass sie als Auslegungs- und Auswahlmaßstab in geltendes
    Recht hineinwirkt.

    '
  kurzbeschreibung: 'Erklärung digitaler Rechte in sechs Blöcken — Freiheitsrechte, Gleichheitsrechte,
    Partizipationsrechte, Rechte im Arbeits- und Unternehmensumfeld, digitale Rechte in besonderen Umgebungen
    sowie Garantien und Wirksamkeit. Für das KI-Recht einschlägig sind Abschnitt XXV („Derechos ante la
    inteligencia artificial“) und Abschnitt XIX („Derechos en el ámbito laboral“). Adressat sind die öffentlichen
    Gewalten; Sanktionen gibt es nicht.

    '
  inkrafttreten:
    datum: 2021-07-14
    verifiziert: true
    quelle: https://www.lamoncloa.gob.es/presidente/actividades/Documents/2021/140721-Carta_Derechos_Digitales_RedEs.pdf
  anwendungsdaten:
  - datum: 2021-07-14
    was_gilt: Vorstellung der Carta de Derechos Digitales durch die Regierung.
    verifiziert: true
    quelle: https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/asuntos-economicos/Paginas/2021/140721-carta-derechos.aspx
  themenachsen:
  - grundrechte
  - arbeit
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Abschnitt XXV „Derechos ante la inteligencia artificial“, Nr. 1: KI muss einen auf die Person und
    ihre unveräußerliche Würde ausgerichteten Ansatz („un enfoque centrado en la persona y su inalienable
    dignidad“) gewährleisten und dem Gemeinwohl dienen.'
  - 'Abschnitt XXV Nr. 2: über den gesamten Entwicklungszyklus sind Diskriminierungsschutz sowie „transparencia,
    auditabilidad, explicabilidad, trazabilidad, supervisión humana y gobernanza“ sowie Zugänglichkeit
    und Zuverlässigkeit zu gewährleisten. Dieser Katalog nimmt die Anforderungen der Art. 9 bis 15 KI-VO
    drei Jahre vorweg.'
  - 'Abschnitt XXV Nr. 3: Recht auf menschliche Aufsicht und Anfechtbarkeit automatisierter Entscheidungen.'
  - 'Abschnitt XIX „Derechos en el ámbito laboral“, Nr. 2 lit. d: Schutz vor dem Einsatz von Datenanalyseverfahren
    und künstlicher Intelligenz durch den Arbeitgeber; Nr. 6: Datenschutz-Folgenabschätzung für Algorithmen
    einschließlich ethischer Perspektive und Diskriminierungsvermeidung. Das ist die konzeptionelle Klammer
    zu Art. 64.4.d) ET.'
  - 'Rechtstechnisch bemerkenswert: eine unverbindliche Erklärung wird über Verweisungen in Ley 15/2022
    und RD 817/2023 zum Tatbestandsmerkmal geltenden Rechts.'
