  offizieller_titel: Leitlinienwerk der Agencia Española de Protección de Datos zu künstlicher Intelligenz
    (u.a. „Inteligencia Artificial Agéntica desde la perspectiva de protección de datos“, V1.2, Februar
    2026; „Requisitos para auditorías de tratamientos de datos personales que incluyan Inteligencia Artificial“,
    2021; „Guía de adecuación al RGPD de tratamientos que incorporan Inteligencia Artificial“)
  fundstelle: Veröffentlichungen der Agencia Española de Protección de Datos (aepd.es)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Laufend fortgeschriebenes Leitlinienwerk ohne Bindungswirkung, das aber die Aufsichtspraxis
    der AEPD abbildet und im Streitfall als Auslegungsmaßstab herangezogen wird. Die AEPD ist zugleich
    die Behörde, der der Proyecto de Ley Orgánica die Marktüberwachung für biometrische Systeme, Migration,
    Asyl und Grenzkontrolle zuweisen will; ihre Leitlinien sind damit ein Vorgriff auf diese Zuständigkeit.
    Der jüngste Baustein sind die Orientierungen zu agentischer KI vom 18.02.2026 (76 Seiten, Version
    1.2).

    '
  kurzbeschreibung: 'Die spanische Datenschutzaufsicht hat als eine der ersten Behörden in Europa systematische
    Leitlinien zum Verhältnis von KI und Datenschutz veröffentlicht. Das Werk umfasst Anforderungen an
    Audits von KI-gestützten Verarbeitungen (2021), einen Leitfaden zur DSGVO-Anpassung von Produkten
    und Diensten mit KI, ein Dekalog mit Empfehlungen für Nutzer von KI-Werkzeugen, eine interne Richtlinie
    der Behörde zum eigenen Einsatz generativer KI (nach Angaben der AEPD die erste ihrer Art im öffentlichen
    Sektor) sowie die Orientierungen zu agentischer KI. Adressaten sind Verantwortliche, Auftragsverarbeiter,
    Entwickler und Datenschutzbeauftragte. Sanktionen ergeben sich nicht aus den Leitlinien, sondern aus
    Art. 83 DSGVO und der LO 3/2018.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.aepd.es/guias/orientaciones-ia-agentica.pdf
  anwendungsdaten:
