  verfahrensnummer: null
  status: softlaw
  status_detail: 'Geltende gemeinsame Strategie von Staat, Kommunen (KL) und Regionen für 2026 bis 2029.
    Datum der Beschlussfassung auf der amtlichen Seite nicht ausgewiesen.

    '
  kurzbeschreibung: 'Nachfolgestrategie für die gemeinsame Digitalisierung von Staat, Kommunen und Regionen.
    Sie stellt zusammenhängende digitale Lösungen entlang der Lebenssituationen der Bürger in den Mittelpunkt
    und verpflichtet auf den verantwortungsvollen Einsatz neuer Technologien einschließlich künstlicher
    Intelligenz — Formulierung: neue Technologie wie künstliche Intelligenz „på en ansvarlig måde“ einzusetzen
    und Lösungen zu unterstützen, die den Einzelnen helfen und zugleich Zeit für die Kernaufgaben freisetzen.
    Rechtsverbindliche Vorgaben enthält sie nicht.

    '
