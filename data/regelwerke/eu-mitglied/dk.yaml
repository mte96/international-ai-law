- id: dk-lov-674-2025-su-ki
  jurisdiktion: dk
  kurztitel: KI in der Sachbearbeitung des SU-Behindertenzuschlags (Lov nr. 674/2025)
  offizieller_titel: Lov om ændring af SU-loven (Minimumskrav til dokumentation m.v. ved ansøgning om
    SU-handicaptillæg, anvendelse af kunstig intelligens til understøttelse af sagsbehandling m.v.)
  fundstelle: LOV nr 674 af 17/06/2025, Lovtidende A
  verfahrensnummer: L 152, Folketingssamling 2024-25 (periodeid 163), Sag-ID 101043
  status: anwendbar
  status_detail: 'In Kraft seit dem 01.07.2025. Angenommen mit 109 Ja-Stimmen, 0 Nein, 0 Enthaltungen.
    Ressort: Forsknings-, Uddannelses- og Digitaliseringsministeriet. Es ist die erste dänische Gesetzesermächtigung,
    die den Einsatz künstlicher Intelligenz in der behördlichen Sachbearbeitung ausdrücklich zum Gegenstand
    hat.

    '
  kurzbeschreibung: 'Änderung des dänischen Ausbildungsförderungsgesetzes auf Empfehlung einer Taskforce
    zur Verwaltung des SU-Behindertenzuschlags. Der Minister erhält die Ermächtigung, Regeln über Dokumentationsanforderungen,
    über die Zurückweisung unvollständiger Anträge und über den Leistungsbeginn zu erlassen — und, das
    ist das KI-Recht daran, „regler om anvendelse af kunstig intelligens eller lignende digitale løsninger
    i sagsbehandlingen m.v.". Die Regelungstechnik ist damit die bereichsspezifische Verordnungsermächtigung,
    nicht eine allgemeine verwaltungsverfahrensrechtliche Norm. Erwartetes Ziel ist die Verkürzung der
    Bearbeitungszeit.

    '
