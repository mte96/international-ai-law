- id: dk-ekspertgruppe-ophavsret-ki
  jurisdiktion: dk
  kurztitel: Bericht der Expertengruppe für Urheberrecht und künstliche Intelligenz
  offizieller_titel: Ekspertgruppe for ophavsret og kunstig intelligens — rapport med 10 anbefalinger
  fundstelle: Kulturministeriet, September 2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Abgeschlossen. Die im Juni 2024 vom Kulturministerium eingesetzte Gruppe hat im September
    2025 ihren Bericht mit zehn Empfehlungen vorgelegt; die Ministeriumsseite ist zuletzt am 03.02.2026
    aktualisiert worden. Der Bericht liegt in dänischer und englischer Fassung vor.

    '
  kurzbeschreibung: 'Elfköpfige Sachverständigengruppe unter Leitung der Rechtsanwältin Gitte Løvgren
    Larsen (SIRIUS Advokater) mit Rechteinhaber- und Wirtschaftsverbänden sowie technischen und juristischen
    Sachverständigen. Empfehlung Nr. 5 — „Beskyttelse mod digitale efterligninger af personers personlige
    kendetegn" — ist die unmittelbare doktrinäre Vorlage für die §§ 65 a und 73 a ophavsretsloven: Es
    sollten „ophavsretlige regler“ eingeführt werden, die vor digitalen Nachbildungen von Stimme, Aussehen
    und anderen persönlichen Merkmalen schützen. Die Gruppe wählt also schon vor der politischen Vereinbarung
    vom 26.06.2025 das Urheberrecht als Regelungsstandort. Die übrigen Empfehlungen betreffen Trainingsdatentransparenz,
    den TDM-Vorbehalt, kollektive Lizenzierung, ein Schiedsverfahren, technische Uploadfilter, bedingte
    öffentliche Strafverfolgung und die Klarstellung, dass das Anbieten von KI-Systemen eine öffentliche
    Zugänglichmachung darstellt.

    '
  inkrafttreten:
    datum: 2025-09-01
    verifiziert: false
    quelle: https://kum.dk/kulturomraader/ophavsret/ekspertgruppe-for-ophavsret-og-kunstig-intelligens
    notiz: Monatsangabe (September 2025) aus dem Bericht; ein Tagesdatum ist nicht ausgewiesen.
  themenachsen:
  - urheberrecht
  - gpai
  - content
  - governance
  regelungsschwerpunkte:
  - 'Empfehlung 1: „Effektiv transparens i træningsdata“ — wirksame Transparenz der Trainingsdaten.'
  - 'Empfehlung 2: „Effektive forbeholdsmuligheder eller nye regler for tekst- og datamining" — die Gruppe
    verlangt deutliche Verbesserungen der Vorbehaltsmöglichkeiten und will das Unionsrecht letztlich so
    ändern, dass die rechtmäßige Nutzung von Werken für Text- und Data-Mining ausdrückliche Einwilligung
    voraussetzt. Das ist die Umkehrung des Opt-out-Modells des Art. 4 DSM-RL.

    '
  - 'Empfehlung 3: „Forbedring af rammevilkår for kollektiv licensering“.'
  - 'Empfehlung 4: „Forsøgsordning om obligatorisk voldgift til løsning af rettighedskonflikter“ — Versuchsregelung
    obligatorischer Schiedsgerichtsbarkeit.'
  - 'Empfehlung 5: „Beskyttelse mod digitale efterligninger af personers personlige kendetegn" — die Wurzel
    der §§ 65 a und 73 a: „der indføres ophavsretlige regler, som beskytter imod digitale efterligninger
    af personers stemme, udseende og andre personlige kendetegn".

    '
  - 'Empfehlung 6: „Krav om tekniske foranstaltninger til hindring af ulovlig upload“.'
  - 'Empfehlung 7: „Betinget offentlig påtale i sager om ophavsret og kunstig intelligens“ — bedingte
    öffentliche Strafverfolgung.'
  - 'Empfehlung 8: Untersuchung von Maßnahmen zur Stärkung menschengeschaffener Inhalte.'
  - 'Empfehlung 9: Beratungs- und Aufklärungsmaßnahmen.'
  - 'Empfehlung 10: „Præcisering i ophavsretslovgivningen af, at udbud af kunstig intelligenssystemer
    udgør tilgængeliggørelse for almenheden" — das Anbieten eines KI-Systems soll gesetzlich als öffentliche
    Zugänglichmachung gelten. Das wäre der dogmatisch weitreichendste Schritt: Er verlagert die Verwertungshandlung
    vom Output auf das Modell selbst.

    '
