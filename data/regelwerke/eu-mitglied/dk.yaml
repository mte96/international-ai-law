  verfahrensnummer: null
  status: softlaw
  status_detail: 'Geltende Strategie ohne Bindungswirkung, getragen von der Regierung und sämtlichen Parteien
    des Folketing. Umfasst 29 Initiativen mit 740 Mio. DKK. Zwei Initiativen betreffen ausdrücklich künstliche
    Intelligenz: eine strategische KI-Anstrengung und die regulatorische Sandkasse für KI-Entwicklung.

    '
  kurzbeschreibung: 'Die dänische Digitalisierungsstrategie ist der politische Rahmen, aus dem die regulatorische
    Sandkasse hervorgegangen ist. Dänemark hat — anders als Spanien, Frankreich oder Italien — KEINE eigenständige
    nationale KI-Strategie mit Rechtsetzungsagenda verabschiedet; KI ist ein Kapitel der Digitalisierungspolitik.
    Die frühere „Nationale strategi for kunstig intelligens“ von 2019 ist auf den amtlichen Strategieseiten
    von Digitaliseringsstyrelsen nicht mehr geführt.

    '
  inkrafttreten:
    datum: 2024-02-01
    verifiziert: false
