- id: dk-databeskyttelsesloven
  jurisdiktion: dk
  kurztitel: Databeskyttelsesloven (Lov nr. 502/2018)
  offizieller_titel: Lov om supplerende bestemmelser til forordningen om beskyttelse af fysiske personer
    i forbindelse med behandling af personoplysninger og om fri udveksling af sådanne oplysninger (databeskyttelsesloven)
  fundstelle: LOV nr 502 af 23/05/2018, Lovtidende A
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, Ressort Justitsministeriet. Grundlage der Zuständigkeit des Datatilsynet,
    das zugleich Marktüberwachungsbehörde nach der KI-VO ist und gemeinsam mit Digitaliseringsstyrelsen
    die regulatorische Sandkasse betreibt.

    '
  kurzbeschreibung: 'Das dänische DSGVO-Durchführungsgesetz. Für das KI-Recht ist es aus drei Gründen
    einschlägig: Es begründet die Aufsicht des Datatilsynet, es ist der Prüfmaßstab für die Trainingsdatenverarbeitung
    und für algorithmische Entscheidungsunterstützung in der Verwaltung, und es ist der Grund, warum Justitia
    und Video Games Europe dem Deepfake-Entwurf Doppelregulierung vorwerfen: Das einwilligungsbasierte
    Regime des § 73 a ophavsretsloven verdrängt die Interessenabwägung des Art. 6 Abs. 1 lit. f DSGVO
    für denselben Sachverhalt.

    '
  inkrafttreten:
    datum: 2018-05-25
    verifiziert: true
    quelle: https://www.retsinformation.dk/eli/lta/2018/502
    fundstelle_norm: '§ 46 Stk. 1 Databeskyttelsesloven (Lov nr. 502 af 23/05/2018): "Loven træder i kraft
      den 25. maj 2018." Stk. 2 hebt zugleich das Lov nr. 429 af 31. maj 2000 auf.'
