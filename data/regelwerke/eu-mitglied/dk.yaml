  regelungsschwerpunkte:
  - 'Aufhebung des geltenden Rechts: „Med lovforslaget foreslås den eksisterende lov om supplerende bestemmelser
    til forordningen om kunstig intelligens ophævet." Der Entwurf war also kein Änderungs-, sondern ein
    Ablösungsgesetz.

    '
  - 'Befugniskatalog für die Marktüberwachungsbehörden: Zugang zu Auskünften, Durchführung von Kontrolluntersuchungen
    und Veröffentlichung ausgewählter Entscheidungen.

    '
  - 'Erstmalige Bußgeldbewehrung von Verstößen gegen die KI-VO und gegen das nationale Gesetz. Der Strafrahmen
    und das Verfahren (Verwaltungs- oder Strafverfahren, administrative bødeforelæg) sind aus dem Resümee
    nicht ersichtlich; der Gesetzestext war nicht abrufbar (ft.dk gesperrt).

    '
  - 'Zeitliche Brisanz: Die Einbringung am 18.02.2026 lag knapp sechs Monate vor dem Anwendungsbeginn
    der Transparenzvorschriften des Art. 50 KI-VO am 02.08.2026. Durch den Verfall trifft dieser Stichtag
    Dänemark ohne Befugnis- und Sanktionsregime; für die Hochrisikopflichten nach Anhang III bleibt bis
    zum 02.12.2027 Zeit.

    '
