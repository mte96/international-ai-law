- id: dk-lov-467-2025
  jurisdiktion: dk
  kurztitel: Dänisches KI-VO-Durchführungsgesetz (Lov nr. 467/2025)
  offizieller_titel: Lov om supplerende bestemmelser til forordningen om kunstig intelligens
  fundstelle: LOV nr 467 af 14/05/2025, Lovtidende A
  verfahrensnummer: L 154, Folketingssamling 2024-25 (periodeid 163), Sag-ID 101039
  status: anwendbar
  status_detail: 'In Kraft und geltendes Recht. Ausgefertigt am 14.05.2025 (nicht, wie vielfach zitiert,
    am 01.05.2025), nachdem der Folketing das Gesetz am 08.05.2025 in 3. Behandlung einstimmig angenommen
    hatte (109 Ja, 0 Nein, 0 Enthaltungen). Ressort ist das Forsknings-, Uddannelses- og Digitaliseringsministeriet.
    Das Gesetz sollte durch das Lovforslag L 111 (2025-26) aufgehoben und ersetzt werden; weil L 111 mit
    Ablauf der Samling verfallen ist, bleibt Lov nr. 467/2025 in Kraft — als Behördenbenennung ohne Befugnis-
    und Sanktionsteil.

    '
  kurzbeschreibung: 'Reines Durchführungsgesetz zur KI-VO (EU) 2024/1689 ohne materielle KI-Regelung.
    Es benennt die nationalen Behörden für die Aufsicht über die unmittelbar geltende Verordnung: Digitaliseringsstyrelsen
    als notifizierende und national koordinierende Marktüberwachungsbehörde, daneben das Datatilsynet
    und die Domstolsstyrelsen für ihre jeweiligen Bereiche. Die Umsetzung ist stufenweise angelegt und
    folgt den Anwendungsstufen der Verordnung; der Aufsichtsteil für die Hochrisikobereiche war auf den
    August 2025 ausgerichtet. Ein eigener Befugniskatalog (Auskunftsverlangen, Kontrolluntersuchungen,
    Veröffentlichung von Entscheidungen) und ein Bußgeldtatbestand fehlen — beides sollte erst das Nachfolgegesetz
    bringen.

    '
