- id: dk-berufsrecht-ki
  jurisdiktion: dk
  kurztitel: 'Advokatsamfundet und Domstolsstyrelsen: kein KI-Berufsrecht'
  offizieller_titel: Advokatsamfundets og domstolenes regulering af kunstig intelligens
  fundstelle: Advokatsamfundet, Nachrichten und Advokaten 2/2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'NEGATIVBEFUND, belegt am 04.09.2026: Das Advokatsamfund führt keine berufsrechtliche
    Leitlinie zum KI-Einsatz durch Anwälte — weder eine Ergänzung der Advokatetiske Regler noch eine Vejledning.
    KI erscheint dort in zwei Zusammenhängen: als verwaltungsinternes Werkzeug (seit dem 03.09.2026 müssen
    Anwälte und Anwaltsassistenten ihre Pflichtfortbildung über eine neue KI-Lösung melden) und als Berichtsthema
    (Advokaten 2/2026, „AI og rettigheder", Porträt der Rechtsanwältin Maria Fredenslund von der Rettighedsalliancen
    zu Verfahren gegen Technologiekonzerne wegen urheberrechtswidrigen KI-Trainings). Zur Domstolsstyrelsen
    war kein Material zugänglich; domstol.dk beantwortet jeden Abruf mit HTTP 403.

    '
  kurzbeschreibung: 'Dänemark hat — anders als etwa England und Wales oder mehrere US-Bundesgerichte —
    keine berufs- oder verfahrensrechtlichen Regeln zum KI-Einsatz in der Rechtsberatung und in der Justiz.
    Bemerkenswert ist die Asymmetrie: Die Domstolsstyrelsen ist nach Lov nr. 467/2025 Marktüberwachungsbehörde
    für Hochrisiko-KI in der Rechtspflege, veröffentlicht aber selbst keine Regeln über den KI-Einsatz
    durch die Gerichte.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.advokatsamfundet.dk/
    notiz: Kein Rechtsakt; reiner Befund über den Stand des Berufsrechts.
