  - datum: 2025-11-14
    typ: stellungnahme
    titel: MSG 2025/3235 — Request for supplementary information (Kommission an Dänemark)
    url: https://technical-regulation-information-system.ec.europa.eu/en/notification/27420/message/113779/EN
    sprache: en
    urheber: Europäische Kommission
    verifiziert: true
    notiz: 'Vierzehn Fragen — das juristisch dichteste Dokument des Vorgangs. Die Kommission fragt u.a.,
      warum § 73 a jeden EWR-Angehörigen ohne Rücksicht auf eine schöpferische Leistung schützt, obwohl
      das der Belohnungslogik des Urheberrechts widerspricht; welche „ungeschriebenen persönlichkeitsrechtlichen
      Grundsätze" gemeint sind; wie sich § 65 a zu den RL 2006/115/EG und 2001/29/EG verhält; ob gewöhnliche
      digitale Werkzeuge wie Photoshop, After Effects oder Digitalfotografie erfasst sind; und wie sich
      der Verbotsansatz zur Deepfake-Definition und zur Kennzeichnungspflicht des Art. 50 KI-VO verhält
      — insbesondere ob gekennzeichnete KI-Inhalte aus § 73 a herausfallen. Antwortfrist 28.11.2025.

      '
  - datum: 2025-11-28
    typ: stellungnahme
    titel: MSG 2025/3402 — Answer by Member State (Dänemark an die Kommission)
    url: https://technical-regulation-information-system.ec.europa.eu/en/notification/27420/message/113947/EN
    sprache: en
    urheber: Kongeriget Danmark / Kulturministeriet
    verifiziert: true
    notiz: 'Die dogmatische Selbstauskunft der dänischen Regierung. Bestätigt: der Persönlichkeitsschutz
      gehört normalerweise nicht in die ophavsretslov; die Wahl fiel nach langer Abwägung auf den bekannten
      Regelungsrahmen; der Gesetzestitel wird zu „lov om ophavsret m.v.“; die richterrechtlichen Persönlichkeitsrechtsgrundsätze
      bleiben als Rechtsquelle neben dem Gesetz bestehen; der Ansatz ist technologieneutral, das eingesetzte
      elektronische Werkzeug also unerheblich; erfasst sind nur Nachbildungen, die eine Verwechslungsgefahr
      mit der Wirklichkeit begründen können; die Deepfake-Definition der KI-VO habe „vergleichbare Elemente",
      reiche aber weiter, weil sie auch Orte und Sachen erfasse; Art. 9 DSA werde nicht in Anspruch genommen.

      '
  - datum: 2026-01-27
    typ: stellungnahme
    titel: Stakeholder contribution — Video Games Europe
    url: https://technical-regulation-information-system.ec.europa.eu/en/notification/27420/stakeholder-contribution/file/5961
    sprache: en
    urheber: Video Games Europe
    verifiziert: true
    notiz: 'Binnenmarktkritik der Spieleindustrie: Bruch des Herkunftslandprinzips durch extraterritoriale
      Wirkung; „realistisch“ und „Verwechslungsgefahr“ seien hochgradig subjektiv und kontextabhängig;
      unklar, ob Motion-Capture- Synthese und Stimmmodulation erfasst sind; Widerspruch zum Kennzeichnungsansatz
      des Art. 50 KI-VO statt Verbot; Umgehung der Interessenabwägung der DSGVO durch ein reines Einwilligungsregime;
      Gefahr des Overblocking durch Plattformen, die nuancierte Abwägungen nicht leisten können; Doppel-
      und Kumulativschutz neben Urheber-, Leistungsschutz-, Bildnis- und Vertragsrecht.

      '
  - datum: 2026-02-03
    typ: stellungnahme
    titel: Stakeholder contribution — Justitia (Danmarks uafhængige juridiske tænketank), Nina Palesa
      Bonde
    url: https://technical-regulation-information-system.ec.europa.eu/en/notification/27420/stakeholder-contribution/file/5984
    sprache: da
    urheber: Justitia
    verifiziert: true
    notiz: 'Die grundrechtliche Gegenposition, eingereicht am letzten Tag der Stillhaltefrist. Kernforderung:
      „deepfakes ikke reguleres som foreslået". Drei Rügen: (1) Die Ausnahme von der Satireausnahme gefährde
      politische Parodie, weil satirische Inhalte mit fehlerhaften Angaben als „misinformation“ verboten
      werden könnten; (2) „misinformation“ sei im dänischen Recht undefiniert und weit über den von der
      Ytringsfrihedskommissionen empfohlenen Begriff der qualifizierten Desinformation hinaus gefasst,
      weil weder Täuschungsvorsatz noch gesellschaftlicher Schaden verlangt werde; (3) die Regelung sei
      unverhältnismäßig, weil straffelovens § 264 e Abs. 1 Nr. 2 (Identitätsmissbrauch), § 267 (Ehrverletzung)
      und das Datenschutzrecht die schädlichen Fälle bereits erfassten; sie schütze vor allem Mächtige
      und erzeuge einen chilling effect.

      '
