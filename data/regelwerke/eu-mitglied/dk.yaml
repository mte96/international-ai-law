- id: dk-b90-ki-tilsyn-gescheitert
  jurisdiktion: dk
  kurztitel: Gescheiterter Antrag auf eine unabhängige KI-Aufsicht beim Datatilsynet (B 90/2024)
  offizieller_titel: Forslag til folketingsbeslutning om oprettelse af et uafhængigt tilsyn med kunstig
    intelligens under Datatilsynet
  fundstelle: Kein Rechtsakt — in 2. Behandlung abgelehnt
  verfahrensnummer: B 90, Folketingssamling 2023-24 (periodeid 160), Sag-ID 96905
  status: gescheitert
  status_detail: 'Status 16 („2. beh./Forkastet“), letzte Aktualisierung 21.05.2025. Der Antrag wollte
    die KI-Aufsicht bei der unabhängigen Datenschutzbehörde bündeln. Er wurde abgelehnt; stattdessen hat
    Dänemark mit Lov nr. 467/2025 die koordinierende Rolle der Digitaliseringsstyrelsen zugewiesen, also
    einer Behörde des Ressorts, das zugleich die staatliche Digitalisierung vorantreibt. Der Antrag erklärt
    damit, warum das dänische Aufsichtsmodell so aussieht, wie es aussieht.

    '
  kurzbeschreibung: 'Beschlussersuchen an die Regierung, eine unabhängige Aufsicht über künstliche Intelligenz
    beim Datatilsynet einzurichten. Die Ablehnung ist die institutionelle Weichenstellung des dänischen
    KI-Rechts: Aufsicht als Verwaltungsaufgabe der Digitalisierungsbehörde statt als unabhängige Kontrolle.
    Die Kritik daran — Unabhängigkeitsdefizit, Interessenkonflikt zwischen Förderung und Aufsicht — ist
    damit im Verfahren dokumentiert und nicht erst nachträglich erhoben worden.

    '
