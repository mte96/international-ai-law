- id: dk-straffeloven-identitetsmisbrug
  jurisdiktion: dk
  kurztitel: Straffeloven § 264 e — Identitätsmissbrauch (Lov nr. 292/2022)
  offizieller_titel: Lov om ændring af straffeloven (Kriminalisering af identitetsmisbrug)
  fundstelle: LOV nr 292 af 08/03/2022, Lovtidende A
  verfahrensnummer: L 103, Folketingssamling 2021-22 (periodeid 155), Sag-ID 90699
  status: anwendbar
  status_detail: 'Geltendes Recht, Ressort Justitsministeriet. Angenommen mit 100 Ja- gegen 2 Nein-Stimmen
    (dagegen: Liberal Alliance). Die Vorschrift ist der von Justitia zitierte Anknüpfungspunkt für die
    strafrechtliche Erfassung von Deepfakes ohne Rückgriff auf das Urheberrecht: „straffelovens § 264
    e, stk. 1, nr. 2“.

    '
  kurzbeschreibung: 'Der dänische Gesetzgeber hat den Identitätsmissbrauch 2022 als eigenständigen Straftatbestand
    in die straffelov eingefügt. Strafbar ist, wer Angaben über eine andere Person — darunter Personennummer,
    Name und Bilder — dazu verwendet, sich in unlauterer Weise als diese Person auszugeben. Justitia stützt
    darauf die Argumentation, dass die Weitergabe KI-erzeugten Materials, in dem das Aussehen einer Person
    manipuliert wird, bereits strafbar sein kann und ein zusätzliches urheberrechtliches Verbot deshalb
    unverhältnismäßig ist. Neben § 264 e steht § 267 straffeloven (Ehrverletzung), der nach Justitias
    Darstellung die rufschädigenden Fälle abdeckt und dabei die Abwägung mit Art. 10 EMRK erlaubt.

    '
  inkrafttreten:
    datum: 2022-04-01
    verifiziert: true
    quelle: https://www.retsinformation.dk/eli/lta/2022/292
    fundstelle_norm: '§ 2 Lov nr. 292 af 08/03/2022: "Loven træder i kraft den 1. april 2022." Der 08.03.2022
      ist das Datum der Ausfertigung ("Givet på Amalienborg, den 8. marts 2022"), nicht des Inkrafttretens.
      Zuvor gespeichert: 08.03.2022.'
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Tatbestand nach dem amtlichen Resümee: „at anvende oplysninger, herunder cpr.nr., navn og billeder,
    til på utilbørlig vis at udgive sig for at være en anden person".

    '
  - 'Die Vorschrift ist technologieneutral und deckt damit synthetische Medien ab, ohne sie zu nennen
    — der Gegenentwurf zum urheberrechtlichen Weg.

    '
  - 'Justitia zitiert speziell § 264 e Abs. 1 Nr. 2 als die Variante, die die Weitergabe von Material
    erfasst, in dem Angaben über eine andere Person verwendet werden.

    '
  - 'Flankierend § 267 straffeloven (Ehrverletzung), von Justitia zweimal als bereits ausreichender Schutz
    gegen rufschädigende Deepfakes angeführt.

    '
