  regelungsschwerpunkte:
  - '§ 65 a Abs. 1 (Leistungsschutz): „Virkelighedsnære digitalt genererede efterligninger af en udøvende
    kunstners fremførelse eller artists kunstneriske præstation må ikke tilgængeliggøres for almenheden
    uden den udøvende kunstners eller artists samtykke." — Verboten ist die Zugänglichmachung, nicht die
    Herstellung; erfasst sind neben der „fremførelse“ (Darbietung des ausübenden Künstlers im Sinne des
    § 65) ausdrücklich auch die „kunstneriske præstation“ des Artisten, also Leistungen ohne Werkbezug
    (Zirkus, Varieté, Sport-nahe Darbietung).

    '
  - '§ 65 a Abs. 2: Schutzdauer bis zum Ablauf von 50 Jahren nach dem Todesjahr des ausübenden Künstlers
    oder Artisten („indtil 50 år er forløbet efter den udøvende kunstner eller artists dødsår"). Das ist
    eine post-mortem-Frist, nicht die übliche 50-Jahres-Frist ab Darbietung des § 65 Abs. 2 — der Anknüpfungspunkt
    ist die Person, nicht die Leistung.

    '
  - '§ 65 a Abs. 3 verweist auf einen langen Katalog entsprechend anwendbarer Vorschriften der ophavsretslov
    (u.a. § 2 Abs. 3 und 4, §§ 3, 11, 13, 13 a, 16 a, 16 c bis 16 f, 17 bis 17 b, § 17 c Abs. 2 bis 4,
    §§ 17 d bis 17 e, § 18 Abs. 1 und 2, § 19 Abs. 1 und 2, §§ 21 bis 23, 24 b, 25, 25 a, 27, 28, 30 a,
    33 bis 35, § 47 Abs. 1 und 2, §§ 49, 50 bis 57, 58 a, 61, 62). Damit werden Schranken, Verwertungsgesellschaftsrecht
    und Vertragsrecht des Urheberrechts auf das neue Recht übergestülpt — die technische Kernentscheidung
    des Entwurfs.

    '
  - '§ 73 a Abs. 1 (allgemeiner Persönlichkeitsschutz): „Virkelighedsnære digitalt genererede efterligninger
    af en fysisk persons personlige, fysiske kendetegn må ikke tilgængeliggøres for almenheden uden den
    efterlignede persons samtykke." — Berechtigt ist JEDE natürliche Person, ohne Rücksicht auf Prominenz,
    kommerziellen Wert oder eine eigene schöpferische Leistung. Das ist der Bruch mit der Belohnungslogik
    des Urheberrechts, den die Kommission ausdrücklich hinterfragt hat.

    '
  - '§ 73 a Abs. 2 (Satireausnahme mit Rückausnahme): „Stk. 1 omfatter ikke efterligninger, der hovedsagelig
    er udtryk for karikatur, satire, parodi, pastiche, magtkritik, samfundskritik o.l., medmindre efterligningen
    udgør misinformation, som konkret kan medføre alvorlig fare for andres rettigheder eller væsentlige
    interesser." — Die Ausnahme reicht deutlich weiter als die Parodieschranke des Art. 5 Abs. 3 lit.
    k InfoSoc-RL (Machtkritik, Gesellschaftskritik, „o.l.“ = und dergleichen). Die Rückausnahme für „misinformation“
    ist der juristisch umstrittenste Satz des Entwurfs: ein unbestimmter, im dänischen Recht nicht definierter
    Begriff entscheidet über die Reichweite der Meinungsfreiheit.

    '
  - '§ 73 a Abs. 3: Schutzdauer 50 Jahre nach dem Todesjahr der nachgebildeten Person. Ein postmortales
    Persönlichkeitsrecht mit urheberrechtlicher Frist — dogmatisch ein Novum, weil das dänische ungeschriebene
    Persönlichkeitsrecht keine feste postmortale Frist kennt.

    '
  - '§ 73 a Abs. 4: Zugänglichmachung ohne Einwilligung bleibt nach § 23 Abs. 2 und § 25 ophavsretsloven
    zulässig — das sind die Schranken für die Wiedergabe von Kunstwerken in Tagesereignisberichterstattung
    und für die Berichterstattung über Tagesereignisse in Ton und Bild. Damit ist die Presseausnahme über
    urheberrechtliche Schranken konstruiert, nicht über eine eigene Abwägungsklausel.

    '
  - 'KEINE STRAFDROHUNG. Die politische Vereinbarung vom 26.06.2025 legt ausdrücklich fest, dass Verstöße
    weder mit Geldstrafe noch mit Freiheitsstrafe belegt werden; es bleibt bei zivilrechtlicher Entschädigung
    („godtgørelse“) nach allgemeinem dänischem Recht. Das unterscheidet den dänischen Weg scharf vom spanischen,
    französischen und deutschen Deepfake-Strafrecht.

    '
  - 'PLATTFORMEN. Der Entwurf schafft keine eigene Löschpflicht, sondern setzt auf die Melde- und Abhilfemechanik
    der DSA. Die dänische Antwort an die Kommission vom 28.11.2025 stellt ausdrücklich klar, dass die
    vorgeschlagene Änderung des § 84 ophavsretsloven den Gerichten eine Entfernungsgrundlage geben soll
    und gerade KEINE Anordnungen im Sinne des Art. 9 DSA vorsieht.

    '
  - 'RECHTSFOLGEN. Beim Leistungsschutz des § 65 a gelten die Rechtsbehelfe der verwandten Schutzrechte
    einschließlich angemessener Vergütung und Schadensersatz (§ 83 ophavsretsloven). Beim Persönlichkeitsschutz
    des § 73 a soll das Gericht nach dem geänderten § 84 anordnen können, dass die Nachbildung vom Markt
    genommen, endgültig entfernt, vernichtet oder an den Verletzten herausgegeben wird.

    '
  - 'TERRITORIALITÄT UND BINNENMARKT. Der Schutz gilt nach der politischen Vereinbarung nur in Dänemark,
    erfasst aber Nachbildungen ALLER natürlichen Personen einschließlich Ausländern. Video Games Europe
    rügt darin einen Bruch des Herkunftslandprinzips: ein anderswo rechtmäßig entwickeltes Spiel könne
    in Dänemark sanktioniert werden, was Entwickler zwinge, entweder unionsweit den strengsten nationalen
    Maßstab einzuhalten oder dänische Nutzer per Geoblocking auszusperren.

    '
  - 'SELBSTVERSTÄNDNIS DES MINISTERIUMS. In der Antwort an die Kommission räumt das Kulturministerium
    ein, der Schutz persönlicher Merkmale falle „normalerweise nicht in den Anwendungsbereich der ophavsretslov";
    die Wahl sei nach langer Abwägung gefallen, weil ein bereits bekannter Regelungsrahmen mit eingeführten
    Begriffen die Rechtsanwendung erleichtere. Der Gesetzestitel sollte deshalb in „lov om ophavsret m.v."
    geändert werden. Die ungeschriebenen persönlichkeitsrechtlichen Grundsätze — nach dänischer Darstellung
    seit 1965 richterrechtlich entwickelt für die kommerzielle Nutzung fremder Bildnisse und für die Veröffentlichung
    privater Aufnahmen — sollen daneben als Rechtsquelle bestehen bleiben und die Gesetzesregelung ergänzen,
    wo ein Fall aus ihrem Anwendungsbereich fällt.

    '
