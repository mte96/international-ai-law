- id: dk-platformdirektiv-2024-2831
  jurisdiktion: dk
  kurztitel: Umsetzung der Plattformarbeitsrichtlinie (EU) 2024/2831 — nicht begonnen
  offizieller_titel: Gennemførelse af Europa-Parlamentets og Rådets direktiv (EU) 2024/2831 om forbedring
    af arbejdsvilkårene for platformsarbejde
  fundstelle: Kein dänischer Rechtsakt
  verfahrensnummer: null
  status: idee
  status_detail: 'Stand 04.09.2026: kein Umsetzungsentwurf auffindbar. In der Sag-Datenbank des Folketing
    gibt es zu „platformsarbejde“ nur den EU-Vorgang KOM (2021) 0762 und ein 2024 gescheitertes Beschlussersuchen
    (B 60, Samling 2023-24, Status 16 „2. beh./Forkastet"), mit dem Dänemark auf eine starke EU-Vermutungsregel
    hinwirken sollte. Ein nationales Umsetzungsgesetz ist weder eingebracht noch angekündigt. Die Umsetzungsfrist
    des Art. 29 der Richtlinie läuft am 02.12.2026 ab.

    '
  kurzbeschreibung: 'Die Plattformarbeitsrichtlinie enthält in ihrem Kapitel III die bislang dichteste
    unionsrechtliche Regelung des algorithmischen Managements: Transparenz über automatisierte Überwachungs-
    und Entscheidungssysteme, Verbot bestimmter Datenverarbeitungen, menschliche Aufsicht und Überprüfung
    wichtiger Entscheidungen, Unterrichtung der Arbeitnehmervertreter. Für Dänemark ist das besonders
    heikel, weil die dänische Arbeitsmarktordnung traditionell tarifvertraglich und nicht gesetzlich reguliert;
    das Land hat sich in der Verhandlung gegen eine gesetzliche Vermutungsregel gestellt. Ohne Umsetzung
    fehlt in Dänemark bis heute jede besondere Vorschrift über algorithmisches Management.

    '
