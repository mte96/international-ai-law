- id: dk-ophavsret-digitale-efterligninger
  jurisdiktion: dk
  kurztitel: Dänischer Deepfake-Schutz im Urheberrechtsgesetz (§§ 65 a und 73 a ophavsretsloven)
  offizieller_titel: Forslag til lov om ændring af lov om ophavsret (Indførelse af en præstationsbeskyttelse
    og beskyttelse mod digitalt genererede efterligninger mv.)
  fundstelle: 'Kein Lovtidende-Nachweis — nicht verabschiedet. Entwurfsfundstellen: Kulturministeriet
    j.nr. 213983; Høringssag HOR 70269; TRIS-Notifizierung 2025/0654/DK'
  verfahrensnummer: Høringssag HOR 70269 (hoeringsportalen.dk); TRIS 2025/0654/DK; KEINE L-Nummer — im
    Folketing nie eingebracht
  status: entwurf
  status_detail: 'Stand 04.09.2026: nicht verabschiedet, nicht in Kraft, nicht eingebracht. Der Verfahrensgang
    ist nach der TRIS-Notifizierung abgebrochen. Belegt sind: politische Grundsatzvereinbarung 26.06.2025;
    Anhörung 07.07. bis 21.08.2025; Notifizierung an die Kommission am 31.10.2025 unter 2025/0654/DK;
    Ablauf der Stillhaltefrist am 03.02.2026 OHNE Verlängerung. Ab dem 04.02.2026 war Dänemark unionsrechtlich
    frei, das Gesetz zu erlassen — es ist gleichwohl nie in den Folketing gelangt. Die Samling 2025-26
    (1. samling) endete am 24.03.2026; in der seit dem 24.03.2026 laufenden 2. samling sind bis zum 04.09.2026
    die Lovforslag L 1 bis L 26 eingebracht, kein urheberrechtliches darunter. Das im notifizierten Entwurf
    vorgesehene Inkrafttreten zum 01.07.2026 ist folgenlos verstrichen.

    '
  kurzbeschreibung: 'Der Entwurf fügt der ophavsretslov zwei Vorschriften an, die kein Urheberrecht sind:
    § 65 a schützt ausübende Künstler und Artisten vor der öffentlichen Zugänglichmachung wirklichkeitsnaher
    digital erzeugter Nachbildungen ihrer Darbietung, § 73 a jede natürliche Person vor der öffentlichen
    Zugänglichmachung wirklichkeitsnaher digital erzeugter Nachbildungen ihrer persönlichen körperlichen
    Merkmale. Beide Rechte sind einwilligungsabhängig und laufen bis zum Ablauf von 50 Jahren nach dem
    Todesjahr des Betroffenen. § 73 a Abs. 2 nimmt Karikatur, Satire, Parodie, Pastiche, Macht- und Gesellschaftskritik
    aus, nimmt diese Ausnahme aber zurück, soweit die Nachbildung Desinformation darstellt, die konkret
    eine ernsthafte Gefahr für Rechte oder wesentliche Interessen anderer begründen kann. Eine Strafdrohung
    enthält der Entwurf nicht; durchgesetzt wird zivilrechtlich (Vergütung und Schadensersatz beim Leistungsschutz,
    gerichtliche Rückruf-, Entfernungs-, Vernichtungs- und Herausgabeanordnungen beim Persönlichkeitsschutz)
    sowie über die Melde- und Entfernungsmechanik der DSA.

    '
