- id: dk-finanstilsynet-ki
  jurisdiktion: dk
  kurztitel: Finanstilsynet und künstliche Intelligenz — keine eigene Regulierung
  offizieller_titel: Finanstilsynets behandling af kunstig intelligens (risikobillede)
  fundstelle: Finanstilsynet, Risikobillede 1. halvår 2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'NEGATIVBEFUND, belegt am 04.09.2026: Die dänische Finanzaufsicht führt keine eigene
    KI-Leitlinie, keine KI-Vejledning und keine KI-Themenseite. Künstliche Intelligenz erscheint ausschließlich
    als Risikofaktor im halbjährlichen Risikobild, dort neben Cyberrisiken: „Cyberrisici og den hastige
    udvikling indenfor kunstig intelligens kræver også virksomheders og myndighedernes opmærksomhed."

    '
  kurzbeschreibung: 'Dänemark hat den Finanzsektor bislang nicht mit sektorspezifischem KI-Recht überzogen.
    Finanstilsynet arbeitet mit dem allgemeinen Aufsichtsinstrumentarium, mit DORA und mit der Risikobeobachtung.
    Eine Benennung als sektorale Marktüberwachungsbehörde nach Art. 74 Abs. 6 KI-VO — die für Kreditwürdigkeitsprüfung
    und Risikobewertung in der Lebens- und Krankenversicherung (Anhang III Nr. 5 lit. b und c KI-VO) naheliegt
    — ist in Lov nr. 467/2025 nach der amtlichen Darstellung nicht erfolgt; benannt sind Digitaliseringsstyrelsen,
    Datatilsynet und Domstolsstyrelsen.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.finanstilsynet.dk/
    notiz: Kein Rechtsakt; reiner Befund über den Stand der Aufsichtspraxis.
  themenachsen:
