  regelungsschwerpunkte:
  - Erweiterte Unterrichtungspflichten des Arbeitgebers über die Bedingungen des Arbeitsverhältnisses;
    Umsetzung der RL (EU) 2019/1152.
  - KEINE ausdrückliche Regelung zu automatisierten Überwachungs-, Bewertungs- oder Entscheidungssystemen.
  - Kein dänisches Gegenstück zu einer algorithmischen Transparenzpflicht im Arbeitsverhältnis.
