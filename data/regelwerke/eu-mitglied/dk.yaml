- id: dk-medieansvar-aftale-2025
  jurisdiktion: dk
  kurztitel: Vereinbarung zur Modernisierung des Medienverantwortungssystems (09.12.2025)
  offizieller_titel: Aftale om opdatering af medieansvarssystemet i en digital medievirkelighed
  fundstelle: Kulturministeriet, politische Vereinbarung vom 09.12.2025 nebst Anhang
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Politische Vereinbarung zwischen der Regierung (S, V, M), SF und Enhedslisten. Die Parteien
    verpflichten sich, die erforderliche Gesetzgebung zu unterstützen. Ein Lovforslag zur medieansvarslov
    ist bis zum 04.09.2026 nicht eingebracht. Mittel: 9,3 Mio. DKK für 2026, danach 18,7 Mio. DKK jährlich.

    '
  kurzbeschreibung: 'Reform des dänischen Medienverantwortungssystems für die digitale Medienwirklichkeit.
    Fünf Stränge: ein unabhängiger Medienombudsmann für nachrichtenähnliche Inhalte alternativer Medienakteure
    mit Untersuchungs- und Sanktionsbefugnis; einheitliche Regulierung aller unter demselben Titel erscheinenden
    Ausgaben eines Mediums; vereinfachte Löschungsansprüche der Bürger gegen veröffentlichte Inhalte;
    ein erleichtertes Verfahren in weniger schweren Ehrverletzungssachen; und höhere Strafen für ehrverletzende
    Äußerungen, die über alternative Medienplattformen verbreitet werden. BEMERKENSWERTER NEGATIVBEFUND:
    Der Vereinbarungstext erwähnt künstliche Intelligenz, Deepfakes und synthetische Medien mit keinem
    Wort — obwohl er ein halbes Jahr nach der Deepfake-Vereinbarung desselben Ministeriums geschlossen
    wurde und obwohl Löschungsansprüche und Ehrschutz genau die Materie berühren, die der § 73 a ophavsretsloven
    regeln sollte. Die beiden Reformstränge laufen unverbunden nebeneinander.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://kum.dk/fileadmin/_kum/1_Nyheder_og_presse/2025/Aftaletekst___appendiks_02.pdf
    notiz: Politische Vereinbarung ohne Rechtsnormqualität; ein Umsetzungsgesetz existiert nicht.
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - Unabhängiger Medienombudsmann mit Untersuchungs- und Sanktionsbefugnis für alternative Medienakteure.
  - Einheitliche Medienregulierung über alle Ausgaben eines Titels hinweg.
  - Vereinfachter Löschungsanspruch gegen veröffentlichte Inhalte.
  - Erleichtertes Verfahren und höhere Strafen bei Ehrverletzung über alternative Plattformen.
  - Kein Bezug zu KI, Deepfakes oder synthetischen Medien.
