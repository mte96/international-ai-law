- id: dk-ki-sandkasse
  jurisdiktion: dk
  kurztitel: Dänische regulatorische Sandkasse für KI
  offizieller_titel: Regulatorisk sandkasse for kunstig intelligens (Datatilsynet og Digitaliseringsstyrelsen)
  fundstelle: Datatilsynet, Regler og vejledning — Kunstig intelligens — Regulatorisk sandkasse
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Laufendes Verwaltungsangebot ohne gesetzliche Grundlage. Betrieben gemeinsam von Datatilsynet
    und Digitaliseringsstyrelsen. Zwei Abschlussberichte abgeschlossener Durchläufe sind veröffentlicht
    (Børns Vilkår und BrainCapture ApS). Der Start der Sandkasse ist auf der amtlichen Seite nicht datiert;
    Bewerbungsfristen sind nicht ausgewiesen.

    '
  kurzbeschreibung: 'Kostenfreie Begleitung von KI-Projekten durch die Datenschutzaufsicht und die Digitalisierungsbehörde:
    Beratung zur DSGVO und zur Risikoklassifizierung nach der KI-VO, mit dem Ziel, Projektverzögerungen
    zu vermeiden. Die Sandkasse geht auf die dänische Digitalisierungsstrategie 2024-2027 zurück, in der
    sie als eine von zwei ausdrücklich KI-bezogenen Initiativen angelegt ist. Juristisch interessant ist,
    was ihr fehlt: eine Rechtsgrundlage. Art. 57 Abs. 1 KI-VO verlangt, dass bis zum 02.08.2027 mindestens
    ein KI-Reallabor auf nationaler Ebene eingerichtet und einsatzbereit ist; die dänische Sandkasse arbeitet
    bislang als bloßes Beratungsangebot, und der Gesetzentwurf, der ihr eine Grundlage hätte geben können
    (L 111), ist verfallen.

    '
