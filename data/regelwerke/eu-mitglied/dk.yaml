  - 'KI-Initiative 1: strategische KI-Anstrengung (strategisk indsats for kunstig intelligens); dazu Aktstykke
    95 (2024-25) zur Mittelauszahlung.'
  - 'KI-Initiative 2: regulatorische Sandkasse für die KI-Entwicklung — die Grundlage des Angebots von
    Datatilsynet und Digitaliseringsstyrelsen.'
  - Keine eigenständige nationale KI-Strategie; KI ist Teil der Digitalisierungsstrategie.
