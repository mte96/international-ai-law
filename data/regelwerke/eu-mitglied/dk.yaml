- id: dk-sektor-sundhed-digital
  jurisdiktion: dk
  kurztitel: Lov om Digital Sundhed Danmark (Lov nr. 1758/2025)
  offizieller_titel: Lov om Digital Sundhed Danmark
  fundstelle: LOV nr 1758 af 29/12/2025, Lovtidende A
  verfahrensnummer: L 43, Folketingssamling 2025-26 (1. samling, periodeid 165), Sag-ID 103124
  status: anwendbar
  status_detail: 'Ausgefertigt am 29.12.2025, Ressort Indenrigs- og Sundhedsministeriet. Angenommen mit
    96 Ja-, 5 Nein-Stimmen (Enhedslisten) und 1 Enthaltung (Borgernes Parti). Es ist eines der wenigen
    Vorhaben der 1. samling 2025-26, das vor dem Ende der Samling abgeschlossen wurde.

    '
  kurzbeschreibung: 'Errichtet Digital Sundhed Danmark als selbstständige Einrichtung in gemeinsamer Trägerschaft
    von Staat, Regionen und Kommunen. Sie bündelt die bisher verteilten Aufgaben rund um gemeinsame digitale
    Gesundheitslösungen, Gesundheitsdatenregister, Cybersicherheit und Infrastruktur. Daneben entsteht
    ein unabhängiges Nationales Zentrum für Gesundheitsinnovation, das die Entwicklung und Verbreitung
    innovativer Lösungen im Gesundheitswesen koordinieren soll. Das Gesetz regelt KI nicht ausdrücklich,
    schafft aber die Daten- und Institutionenordnung, innerhalb derer klinische KI in Dänemark betrieben
    werden wird — und damit den nationalen Rahmen, auf den Anhang I und Anhang III Nr. 5 lit. a KI-VO
    sowie die MDR treffen.

    '
  inkrafttreten:
    datum: 2026-01-01
    verifiziert: true
    quelle: https://www.retsinformation.dk/eli/lta/2025/1758
    fundstelle_norm: '§ 36 Lov om Digital Sundhed Danmark (Lov nr. 1758 af 29/12/2025), Kapitel 14 Ikrafttrædelsesbestemmelse:
      "Loven træder i kraft den 1. januar 2026." Der 29.12.2025 ist das Datum der Ausfertigung, nicht
      des Inkrafttretens. Zuvor gespeichert: 29.12.2025.'
  themenachsen:
  - sektor-medizin
  - sektor-oeffentlich
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - Digital Sundhed Danmark als selbstständige Einrichtung von Staat, Regionen und Kommunen.
  - Bündelung von gemeinsamen digitalen Gesundheitslösungen, Gesundheitsdatenregistern, Cybersicherheit
    und Infrastruktur.
  - Unabhängiges Nationales Zentrum für Gesundheitsinnovation.
  - Keine ausdrückliche KI-Regelung; die Relevanz ist institutionell und datenbezogen.
