  status: softlaw
  status_detail: 'Fortlaufend gepflegte Verwaltungsleitlinien ohne Bindungswirkung. Die Sammlung umfasst
    eine Handreichung für Behörden vor dem KI-Einsatz, eine Kartierung des KI-Einsatzes im öffentlichen
    Sektor, eine Excel-Vorlage für die Folgenabschätzung bei KI (aus einer Mitteilung vom Mai 2024) und
    eine Podcast-Folge zu Kindern, Jugendlichen und KI. Die Publikationsdaten sind auf den Seiten nicht
    durchgängig ausgewiesen.

    '
  kurzbeschreibung: 'Das Datatilsynet ist die dänische Datenschutzaufsicht und zugleich eine der drei
    Marktüberwachungsbehörden nach der KI-VO. Seine KI-Materialien sind praxisorientierte Vorabprüfungen:
    Sie führen Behörden durch die Fragen, die vor einem KI-Projekt zu klären sind, liefern eine Vorlage
    für die Folgenabschätzung und ordnen die Risikoklassifizierung der KI-VO neben die DSGVO ein. Eine
    eigenständige KI-Vejledning mit normativem Anspruch — vergleichbar der französischen CNIL — existiert
    nicht.

    '
