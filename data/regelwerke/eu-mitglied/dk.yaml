  offene_punkte:
  - Warum ist der Entwurf nicht eingebracht worden? Die Anhörungsauswertung (høringsnotat) ist bis heute
    unveröffentlicht, weil ihre Veröffentlichung an die Einbringung geknüpft war. Ohne sie lässt sich
    nicht belegen, ob inhaltliche Kritik, die Kommissionsbemerkungen vom 03.02.2026 oder allein der Ablauf
    der Samling den Ausschlag gegeben haben.
  - Inhalt der Kommissionsbemerkungen MSG 2026/0352 vom 03.02.2026 — Datei nicht maschinenlesbar.
  - Ob die politische Vereinbarung vom 26.06.2025 die Neuwahl politisch überdauert hat. Sechs der acht
    Unterzeichnerparteien sind nicht Regierungsparteien; die Regierung heißt jetzt Firkløverregeringen.
    Ein neuer Anlauf müsste die Vereinbarung nicht neu verhandeln, wohl aber neu terminieren.
  - Ob die Notifizierung 2025/0654/DK bei einer späteren Wiedereinbringung verbraucht ist. Änderungen
    am notifizierten Text lösen nach Art. 5 Abs. 1 UAbs. 3 RL (EU) 2015/1535 eine erneute Notifizierungspflicht
    aus.
  - 'Verhältnis zu Art. 50 KI-VO ab dem 02.08.2026: Die Kommission hat ausdrücklich gefragt, ob ordnungsgemäß
    gekennzeichnete KI-Inhalte aus § 73 a herausfallen sollen. Die dänische Antwort lässt das offen.'
  - Wortlaut des geänderten § 84 ophavsretsloven (Entfernungs- und Vernichtungsanordnungen) — im notifizierten
    Text nicht eingesehen.
  - 'Datum entfernt (05.09.2026): Der Entwurf ist nicht verabschiedet und nicht eingebracht; das zuvor
    eingetragene Inkrafttreten 01.07.2026 war das im Entwurf vorgesehene Wunschdatum, kein geltendes Recht.
