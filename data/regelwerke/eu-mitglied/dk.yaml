  - urheberrecht
  regelungsschwerpunkte:
  - Keine berufsrechtliche KI-Leitlinie des Advokatsamfundet (Stand 04.09.2026).
  - 'KI als internes Verwaltungswerkzeug: Pflichtfortbildungsmeldung über ein neues KI-System, Hinweis
    vom 03.09.2026.'
  - Rettighedsalliancen führt Verfahren gegen Technologiekonzerne wegen urheberrechtswidrigen KI-Trainings
    — die praktische Front des dänischen KI-Urheberrechts.
  - Domstolsstyrelsen ist Marktüberwachungsbehörde nach der KI-VO, veröffentlicht aber keine eigenen Regeln
    für den gerichtlichen KI-Einsatz.
