    dass der KI-Einsatz in einem grundrechtssensiblen Verwaltungsbereich in Dänemark politisch verlangt
    und nicht nur befürchtet wird; und er belegt zusammen mit L 111 die Reichweite des Verfallsereignisses
    vom 24.03.2026.

    '
