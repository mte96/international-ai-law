- id: dk-ai-lov-l111-bortfaldet
  jurisdiktion: dk
  kurztitel: AI-loven — verfallener Entwurf des vollständigen KI-VO-Durchführungsgesetzes (L 111/2026)
  offizieller_titel: Forslag til lov om supplerende bestemmelser til forordningen om kunstig intelligens.
    (AI-loven).
  fundstelle: Kein Lovtidende-Nachweis — bortfaldet. Sag-ID 104646
  verfahrensnummer: L 111, Folketingssamling 2025-26 (1. samling, periodeid 165)
  status: gescheitert
  status_detail: 'Am 18.02.2026 von der geschäftsführenden Ministerin für Digitalisierung (Christina Egelund,
    fg.) eingebracht, am 17.03.2026 in 1. Behandlung, danach mit Ablauf der Samling am 24.03.2026 VERFALLEN
    (Status 13 „Bortfaldet“, letzte Aktualisierung 25.03.2026). Eine Wiedereinbringung ist in der laufenden
    2. samling bis zum 04.09.2026 nicht erfolgt; die eingebrachten Lovforslag reichen von L 1 bis L 26
    und enthalten keinen KI-Entwurf.

    '
  kurzbeschreibung: 'Der Entwurf sollte Lov nr. 467/2025 aufheben und durch ein vollständiges Aufsichtsgesetz
    ersetzen. Er richtete sich ausweislich des amtlichen Resümees primär an die künftigen Marktüberwachungsbehörden
    und stattete sie mit den erforderlichen Befugnissen aus: Auskunftsverlangen, Kontrolluntersuchungen
    („kontrolundersøgelser“) und die Befugnis, ausgewählte Entscheidungen zu veröffentlichen. Erstmals
    sah er außerdem vor, Verstöße gegen die KI-VO und gegen das Gesetz selbst mit Geldbuße („bøde“) zu
    ahnden. Mit seinem Verfall bleibt Dänemark beim Behördenbenennungsgesetz von 2025 stehen — ohne Ermittlungsbefugnisse
    und ohne Sanktionen.

    '
