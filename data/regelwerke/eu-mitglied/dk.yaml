  - governance
  regelungsschwerpunkte:
  - Keine eigenständige KI-Leitlinie oder Themenseite der dänischen Finanzaufsicht (Stand 04.09.2026).
  - KI wird als Risikofaktor im Risikobillede 1. Halbjahr 2026 neben Cyberrisiken behandelt.
  - Keine Benennung von Finanstilsynet als sektorale Marktüberwachungsbehörde nach Art. 74 Abs. 6 KI-VO
    ersichtlich.
