- id: dk-forvaltningsloven-automatisierung
  jurisdiktion: dk
  kurztitel: Forvaltningsloven und die automatisierte Verwaltungsentscheidung
  offizieller_titel: Bekendtgørelse af forvaltningsloven (Forvaltningsloven)
  fundstelle: LBK nr 433 af 22/04/2014, Lovtidende A
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Identität der konsolidierten Fassung über die Meta-Daten der ELI-Adresse
    verifiziert (LBK nr 433 af 22/04/2014, Justitsministeriet). NICHT VERIFIZIERT werden konnte, ob und
    in welcher Fassung die vielzitierte Sonderregel über Entscheidungen, die ausschließlich auf automatischer
    Datenverarbeitung beruhen (in der Literatur als § 32 a forvaltningsloven geführt), im geltenden Text
    steht — der Paragrafenwortlaut ist über den Abrufkanal nicht zugänglich (retsinformation.dk liefert
    nur eine JavaScript-Anwendung aus, ft.dk ist gesperrt, die Myndighedsguiden des Ombudsmanns führt
    kein Thema dazu).

    '
  kurzbeschreibung: 'Das dänische Verwaltungsverfahrensrecht kennt keine allgemeine, positiv formulierte
    Erlaubnis- oder Verbotsnorm für algorithmische Entscheidungen. Die Steuerung erfolgt über drei getrennte
    Schichten: die allgemeinen Verfahrensgarantien der forvaltningslov (Begründung, Parteianhörung, Akteneinsicht),
    das Datenschutzrecht mit Art. 22 DSGVO und der databeskyttelseslov, und bereichsspezifische Einzelermächtigungen
    in den Fachgesetzen — der bislang klarste Fall ist die KI-Ermächtigung der SU-loven (Lov nr. 674/2025).
    Ein Vorstoß, eine unabhängige KI-Aufsicht beim Datatilsynet zu schaffen, ist 2024 im Folketing gescheitert.

    '
  inkrafttreten:
    datum: 2014-04-22
    verifiziert: true
    quelle: https://www.retsinformation.dk/eli/lta/2014/433
    notiz: Datum der konsolidierten Bekanntmachung, nicht des ursprünglichen Gesetzes von 1985.
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - 'Kein Gesetzesvorbehalt für Verwaltungs-KI nach griechischem Vorbild (Άρθρο 4 ν. 4961/2022) und keine
    algorithmische Folgenabschätzung. Dänemark steuert über Fachgesetze und Datenschutzrecht.

    '
  - 'Die in der Literatur unter § 32 a forvaltningsloven geführte Regel betrifft nach verbreiteter Darstellung
    die Befugnis des Ressortministers, für ausschließlich automatisch getroffene Entscheidungen Erleichterungen
    bei der Begründungspflicht vorzusehen. Der Wortlaut konnte NICHT verifiziert werden; die Angabe steht
    deshalb unter Vorbehalt.

    '
  - 'Das Datenschutzrecht ergänzt die forvaltningslov über LOV nr 502 af 23/05/2018 (databeskyttelsesloven)
    und Art. 22 DSGVO.

    '
