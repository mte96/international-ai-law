  - grundrechte
  regelungsschwerpunkte:
  - 'Bereichsspezifische Ermächtigung statt Querschnittsnorm: „regler om anvendelse af kunstig intelligens
    eller lignende digitale løsninger i sagsbehandlingen m.v." Der Gesetzgeber hat den KI-Einsatz nicht
    im Verwaltungsverfahrensrecht, sondern im Fachgesetz verankert — dieselbe Technik, die Dänemark auch
    beim Persönlichkeitsschutz wählt: bekanntes Gesetz statt neues Regime.

    '
  - 'Die Ermächtigung ist als „Unterstützung“ der Sachbearbeitung formuliert („til understøttelse af sagsbehandling“),
    nicht als Erlaubnis vollautomatisierter Entscheidung. Die Abgrenzung zu Art. 22 DSGVO ergibt sich
    damit aus der Reichweite der künftigen bekendtgørelse, nicht aus dem Gesetz.

    '
  - 'Flankierend regelt dasselbe Gesetz Mindestanforderungen an die Dokumentation und die Zurückweisung
    bei fehlender Dokumentation — also gerade die Standardisierung, die maschinelle Prüfung erst ermöglicht.

    '
