  kurztitel: Ansættelsesbevisloven (Lov nr. 501/2023)
  offizieller_titel: Lov om ansættelsesbeviser og visse arbejdsvilkår
  fundstelle: LOV nr 501 af 16/05/2023, Lovtidende A
  verfahrensnummer: L 84, Folketingssamling 2022-23 (2. samling, periodeid 158), Sag-ID 94820
  status: anwendbar
  status_detail: 'In Kraft seit dem 01.07.2023. Ressort: Beskæftigelses- og Ligestillingsministeriet.
    Umsetzung der Richtlinie (EU) 2019/1152 über transparente und vorhersehbare Arbeitsbedingungen.

    '
  kurzbeschreibung: 'Erweitert die Pflicht des Arbeitgebers, über die Bedingungen des Arbeitsverhältnisses
    zu unterrichten. Für das KI-Recht ist das Gesetz der einzige geltende dänische Anknüpfungspunkt für
    algorithmisches Management — und ein schwacher: Es verpflichtet zur Unterrichtung über Arbeitsbedingungen,
    nennt aber weder automatisierte Überwachungs- oder Entscheidungssysteme noch Algorithmen. Eine dänische
    Entsprechung zum griechischen Άρθρο 9 ν. 4961/2022 (Unterrichtung von Beschäftigten vor dem ersten
    Einsatz eines sie betreffenden KI-Systems) oder zum spanischen Art. 64.4 d Estatuto de los Trabajadores
    existiert nicht. Algorithmisches Management wird in Dänemark bislang über das kollektive Arbeitsrecht
    (Tarifverträge, Vertrauensleute) und über das Datenschutzrecht gesteuert, nicht über eine besondere
    gesetzliche Vorschrift.

    '
  inkrafttreten:
    datum: 2023-07-01
    verifiziert: true
    quelle: https://oda.ft.dk/api/Sag?$filter=substringof('ans%C3%A6ttelsesbeviser',titel)
