    quelle: https://www.retsinformation.dk/eli/lta/2025/467
  themenachsen:
  - marktzugang
  - governance
  - sektor-oeffentlich
  - datenschutz
  regelungsschwerpunkte:
  - 'ZUSTÄNDIGKEITSVERTEILUNG (drei Behörden, so das amtliche Gesetzesresümee des Folketing): Digitaliseringsstyrelsen
    ist national koordinierende Marktüberwachungsbehörde und notifizierende Behörde nach Art. 28 KI-VO;
    das Datatilsynet und die Domstolsstyrelsen sind daneben Marktüberwachungsbehörden für ihre Bereiche.
    Das entspricht der sektoralen Aufsichtsarchitektur, die Digitaliseringsstyrelsen selbst beschreibt
    („AI-forordningen lægger op til et sektoropdelt tilsyn"). Die PARAGRAFENWEISE Zuordnung war nicht
    lesbar — siehe technischer Vermerk Nr. 2.

    '
  - 'Die Domstolsstyrelsen als Marktüberwachungsbehörde ist die Konsequenz aus Anhang III Nr. 8 KI-VO
    (Rechtspflege und demokratische Prozesse): Dänemark hat die Aufsicht über Hochrisiko-KI in der Justiz
    nicht einer Regierungsbehörde, sondern der Gerichtsverwaltung zugewiesen — eine bewusste Gewaltenteilungsentscheidung.

    '
  - 'Das Datatilsynet ist zugleich die Behörde nach Art. 77 KI-VO für grundrechtsschützende Stellen und
    betreibt gemeinsam mit Digitaliseringsstyrelsen die regulatorische Sandkasse.

    '
  - 'BUSSGELDREGELUNG: Lov nr. 467/2025 enthält nach der amtlichen Beschreibung des Nachfolgeentwurfs
    KEINEN Sanktionsteil. Das Resümee zu L 111 formuliert ausdrücklich, erst jener Entwurf „fastsætter
    hertil mulighed for at sanktionere overtrædelser af forordningen om kunstig intelligens og dette lovforslag
    med bøde". Dänemark hat damit — anders als der Auftragstext annimmt — bis heute kein nationales Bußgeldregime
    zur KI-VO. Die Frist des Art. 99 Abs. 1 KI-VO zur Mitteilung der Sanktionsvorschriften (02.08.2025)
    ist verfehlt.

    '
  - 'BEKENDTGØRELSER: Auf den amtlichen Aufsichtsseiten von Digitaliseringsstyrelsen (digst.dk/tilsyn/ai-forordningen)
    ist keine Durchführungsverordnung zu Lov nr. 467/2025 genannt. Veröffentlicht sind stattdessen untergesetzliche
    Orientierungshilfen: eine FAQ zur KI-VO, eine Handreichung zu den verbotenen Praktiken des Art. 5
    (20.10.2025) und ein Werkzeug zur Risikoklassifizierung. Eine erschöpfende Suche nach bekendtgørelser
    war ohne Volltextsuche in retsinformation.dk nicht möglich.

    '
  - 'FLANKIERUNG DURCH EINE FØLGEGRUPPE: Digitaliseringsstyrelsen betreibt seit dem 17.09.2024 eine „Følgegruppe
    for implementering af AI-forordningen" mit rund 40 Mitgliedern (Dansk Erhverv, Dansk Industri, IT-Branchen,
    SMV Danmark, Erhvervsstyrelsen, Styrelsen for It og Læring, Kommunen und Regionen, Fagbevægelsens
    Hovedorganisation, Akademikerne, Forbrugerrådet Tænk, Institut for Menneskerettigheder, Hochschulen
    und Normungsgremien). Sitzungen belegt am 17.09.2024, 09.01.2025, 12.05.2025 und 06.11.2025.

    '
