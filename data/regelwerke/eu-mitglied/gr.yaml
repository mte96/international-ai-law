- id: gr-ypdik-epitropi-tn
  jurisdiktion: gr
  kurztitel: Διαρκής Επιστημονική Επιτροπή für KI beim Justizministerium
  offizieller_titel: Διαρκής Επιστημονική Επιτροπή του Υπουργείου Δικαιοσύνης για την Τεχνητή Νοημοσύνη
  fundstelle: Errichtet durch Ministerialentscheidungen; auf der Ministeriumsseite nur über die ΑΔΑ-Kennungen
    6ΣΡΦΩ-198, ΩΧΓ2Ω-ΨΔΗ und ΨΡΥΕΩ-09Ν nachgewiesen
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Bestehendes Beratungsgremium ohne Regelungsbefugnis. Die Ministeriumsseite dokumentiert
    Sitzungen vom 10.06.2021, 04.03.2024, 28.05.2024 und 19.02.2026. Förmliche Berichte oder Leitlinien
    für den Einsatz von KI in der Justiz sind dort nicht veröffentlicht. Griechenland hat damit — anders
    als Italien mit den Empfehlungen des CSM — bislang kein veröffentlichtes Regelwerk zum Einsatz von
    KI durch Gerichte.

    '
  kurzbeschreibung: 'Ständige wissenschaftliche Kommission des Justizministeriums, die die Auswirkungen
    der Einführung künstlicher Intelligenz auf das Justizsystem prüft und dem Minister Vorschläge zur
    Modernisierung des Rechtsrahmens sowie zum Schutz der Rechte der Verfahrensbeteiligten unterbreitet.
    Ihre dokumentierten Arbeitsschwerpunkte sind die Anonymisierung gerichtlicher Entscheidungen, Sprachverarbeitung
    und die Erfahrungen der französischen Justiz mit Automatisierung. Für die Praxis bedeutet ihr Bestehen:
    Der Einsatz von KI in der griechischen Justiz wird vorbereitet, ist aber nicht normiert.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://ministryofjustice.gr/?page_id=7483
  anwendungsdaten:
