    auf vier Säulen stellt: Innovation und Unternehmertum, Bildung und Forschung, Regulierung und Governance
    sowie KI-Einsatz im Staat. Für die Rechtsdokumentation ist er wichtig, weil er die Brücke zwischen
    dem 2022 verabschiedeten materiellen Gesetz und dem 2026 verabschiedeten Durchführungsgesetz bildet:
    Er formuliert keinen Vorschlag, ν. 4961/2022 fortzuschreiben, sondern richtet die Politik auf die
    KI-VO und auf Infrastrukturaufbau aus.

