    verifiziert: false
    abruf: ok
    notiz: Einzige erreichbare Quelle, die das Inkrafttreten des KI-Kapitels zum 01.01.2023 ausdrücklich
      benennt, und die bestätigt, dass für Άρθρο 10 kein Sanktionstatbestand existiert. Private Quelle,
      deshalb nur als Sekundärquelle geführt.
  offene_punkte:
  - Der Wortlaut des Άρθρο 116 (Έναρξη ισχύος) ist am amtlichen ΦΕΚ nicht verifiziert; das Datum 01.01.2023
    stützt sich auf eine Sekundärquelle.
  - Ob die nach Άρθρο 10 Abs. 4 vorgesehene gemeinsame Ministerialentscheidung zum Inhalt der Datenethik-Leitlinie
    je ergangen ist, ließ sich nicht feststellen. Wenn nicht, war die Pflicht während ihrer gesamten Geltungsdauer
    inhaltlich unbestimmt und zugleich sanktionslos.
  - Ob die Συντονιστική Επιτροπή (Άρθρο 11) und die Επιτροπή Εποπτείας (Άρθρο 13) je konstituiert wurden,
    ist nicht belegt.
  - Ob es zu Άρθρο 9 je ein Sanktionsverfahren der Arbeitsaufsicht gab, ist nicht ermittelbar.
  - 'Έναρξη ισχύος nicht gelesen: Die ΦΕΚ-PDF ist über die verfügbaren Werkzeuge nur bis etwa zur Mitte
    auslesbar (WebFetch schneidet ab, api.et.gr sperrt Skriptzugriff, direkter Download ist durch die
    Egress-Policy blockiert). Verifiziert ist damit nur die amtliche Verkündung (ΦΕΚ-Nummer und -Datum
    aus dem Kopf des Gesetzblatts). Nächster Schritt: Schlussartikel "Έναρξη ισχύος" im ΦΕΚ-PDF prüfen,
    weil griechische Gesetze davon abweichen können — ν. 4961/2022 tat es.'
