  status_detail: 'In Kraft. Άρθρο 20 ν. 5321/2026 ändert das Κεφάλαιο Γ΄ des Μέρος Ι des Anhangs (Produktsicherheit
    und Konformität) und nimmt die Verordnung (EU) 2024/1689 dort auf. Damit fallen Meldungen über KI-VO-Verstöße
    seit dem 20.07.2026 in den sachlichen Anwendungsbereich des griechischen Hinweisgeberschutzes. Die
    ΦΕΚ-Angabe zu ν. 4990/2022 stammt aus dem zitierten Änderungstext und ist nicht am Ursprungsgesetz
    verifiziert.

    '
  kurzbeschreibung: 'Umsetzungsgesetz zur Whistleblower-Richtlinie. Sein Anhang zählt die Unionsrechtsakte
    auf, deren Verletzung eine geschützte Meldung auslöst. Durch die Erweiterung um die KI-VO stehen Beschäftigte,
    Auftragnehmer und Dritte, die Verstöße gegen KI-Pflichten melden, unter demselben Repressalienschutz
    wie Hinweisgeber im Produktsicherheitsrecht. Das ist die griechische Umsetzung des Art. 87 KI-VO und
    wirkt praktisch als Ergänzung des Beschwerdesystems nach Άρθρο 7 ν. 5321/2026.

    '
  inkrafttreten:
    datum: 2022-11-11
    verifiziert: false
    quelle: https://api.et.gr/apiLAW/1/2022/4990/pdf
    fundstelle_norm: Amtliche Verkündung im ΦΕΚ Α΄ 210 vom 11.11.2022 — Kopf des Gesetzblatts am 05.09.2026
      bei et.gr gelesen und bestätigt. Der Schlussartikel Άρθρο 44 "Έναρξη ισχύος" war im maschinell abrufbaren
      Teil der PDF nicht einsehbar; das eingetragene Datum entspricht dem Verkündungstag.
  anwendungsdaten:
  - datum: 2026-07-20
    was_gilt: Verstöße gegen die Verordnung (EU) 2024/1689 werden in den Anhang aufgenommen; KI-Hinweisgeber
      sind geschützt.
    verifiziert: false
    quelle: https://archive.opengov.gr/digitalandbrief/?p=3977
  themenachsen:
  - governance
  - arbeit
  - grundrechte
  regelungsschwerpunkte:
  - 'Άρθρο 20 ν. 5321/2026: «Στο Κεφάλαιο Γ΄ του Μέρους Ι του Παραρτήματος του ν. 4990/2022 (Α΄ 210),
    περί ασφάλειας προϊόντων και συμμόρφωσης επέρχονται οι ακόλουθες τροποποιήσεις …» — Einfügung eines
    Verweises auf die KI-VO.'
  - 'Systematische Einordnung: Griechenland behandelt die KI-VO als Produktsicherheitsrecht, nicht als
    eigenständige Kategorie. Das entspricht der Binnenmarktgrundlage der Verordnung, steht aber in Spannung
    zur Wahl der Datenschutzbehörde als Marktüberwachungsbehörde, die die Ανάλυση Συνεπειών Ρύθμισης grundrechtlich
    begründet.'
  - 'Praktische Folge: Wer einen Verstoß gegen Art. 5 oder Art. 50 KI-VO meldet, kann sich sowohl auf
    den Hinweisgeberschutz als auch auf das Beschwerderecht des Art. 85 KI-VO stützen.'
