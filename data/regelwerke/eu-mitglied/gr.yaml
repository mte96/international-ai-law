- id: gr-n-5263-2025
  jurisdiktion: gr
  kurztitel: Ν. 5263/2025 — ΦΑΡΟΣ AI Factory
  offizieller_titel: Νόμος 5263/2025 «Ίδρυση Ελληνικού Εργοστασίου Τεχνητής Νοημοσύνης»
  fundstelle: ΦΕΚ Α΄ 238 vom 19.12.2025
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. Άρθρο 3 errichtet die Aktiengesellschaft «Ελληνικό Εργοστάσιο Τεχνητής Νοημοσύνης
    Ανώνυμη Εταιρεία» mit dem Handelsnamen «ΦΑΡΟΣ AI FACTORY». Ν. 5321/2026 verweist in Άρθρο 12 Abs.
    4 lit. a ausdrücklich auf diese Vorschrift und macht die Gesellschaft zur möglichen Kooperationspartnerin
    des Reallabors.

    '
  kurzbeschreibung: 'Errichtungsgesetz der griechischen KI-Fabrik im Sinne der EuroHPC-Initiative. Die
    Gesellschaft soll «ο εθνικός και περιφερειακός επιταχυντής Τεχνητής Νοημοσύνης» sein und über eine
    einheitliche Infrastruktur Zugang zu spezialisierter Rechenleistung, Daten und Modellen eröffnen.
    Das Gesetz enthält kein materielles KI-Aufsichtsrecht, ist für die Rechtsanwendung aber deshalb relevant,
    weil es die institutionelle Gegenseite des Reallabors schafft: dieselbe juristische Person, die Rechenleistung
    bereitstellt, kann Teilnehmer des aufsichtsrechtlichen Reallabors begleiten. Der zweite Teil des Gesetzes
    betrifft die Aufsicht über die Η.Δ.Υ.Κ.Α. und hat mit KI nichts zu tun.

    '
