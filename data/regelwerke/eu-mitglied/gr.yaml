  kurztitel: Εθνική Στρατηγική για την Τεχνητή Νοημοσύνη (2025)
  offizieller_titel: Εθνική Στρατηγική για την Τεχνητή Νοημοσύνη
  fundstelle: Beschluss des Υπουργικό Συμβούλιο vom 30.06.2025; kein ΦΕΚ nachweisbar
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Vom Ministerrat am 30.06.2025 gebilligt und in derselben Sitzung von der Umbenennung
    des Ministeriums in «Υπουργείο Ψηφιακής Διακυβέρνησης και Τεχνητής Νοημοσύνης» sowie von der Errichtung
    der Ειδική Γραμματεία Τεχνητής Νοημοσύνης και Διακυβέρνησης Δεδομένων begleitet. Ein veröffentlichter
    Volltext der Strategie war am 04.09.2026 weder auf mindigital.gr noch auf ai.gov.gr noch auf digitalstrategy.gov.gr
    auffindbar; die dortige Projektseite zur KI-Strategie ist auf dem Stand vom 01.12.2023 stehengeblieben.
    Rechtlich verankert wird die Strategie erst nachträglich durch Άρθρο 22 ν. 5321/2026, der dem Παρατηρητήριο
    die Beobachtung ihrer Umsetzung aufgibt.

    '
  kurzbeschreibung: 'Regierungsstrategie ohne Bindungswirkung. Sie ist der Nachfolger der von 2020 stammenden
    «Εθνική στρατηγική για την ανάπτυξη της τεχνητής νοημοσύνης» und setzt die Vorschläge des Blueprint
    von 2024 um. Ihr rechtlicher Ertrag liegt weniger im Text als in den drei gleichzeitigen Organisationsentscheidungen:
    Umbenennung des Ressorts, Errichtung einer Ειδική Γραμματεία für KI und Datenverwaltung und Aufsatz
    der Infrastrukturvorhaben ΔΑΙΔΑΛΟΣ und ΦΑΡΟΣ. Genau diese Ειδική Γραμματεία führt heute das Register
    des Άρθρο 21 und das Observatorium des Άρθρο 22 ν. 5321/2026.

    '
