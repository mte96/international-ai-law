      mit Nummer und ΦΕΚ noch Mitgliederliste sind dort ausgewiesen; die drei ΑΔΑ-Kennungen sind der einzige
      Rechtsaktnachweis.
  offene_punkte:
  - Nummer, Datum und ΦΕΚ der Errichtungsentscheidungen sind nicht ermittelt; nur ΑΔΑ-Kennungen (Διαύγεια)
    liegen vor. Ein Abruf über diaugeia.gov.gr wurde nicht durchgeführt.
  - Die Zusammensetzung der Kommission ist nicht veröffentlicht.
  - Kein Regelwerk zum Einsatz generativer KI durch Richter oder Staatsanwälte auffindbar.
  - 'Berufsrecht der Anwaltschaft: Weder die Ολομέλεια των Προέδρων των Δικηγορικών Συλλόγων Ελλάδος noch
    der Δικηγορικός Σύλλογος Αθηνών haben nach den durchgeführten Recherchen eigene KI-Regeln oder Leitlinien
    erlassen; der DSA verweist auf CCBE-Material. Der Κώδικας Δικηγόρων (ν. 4194/2013) enthält keine KI-spezifische
    Vorschrift. Dieser Befund ist ein Negativbefund und nicht abschließend gesichert.'
  monitoring_quellen:
