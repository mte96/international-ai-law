    verifiziert: true
    quelle: https://api.et.gr/apiLAW/1/2022/4996/pdf
  themenachsen:
  - urheberrecht
  - gpai
  regelungsschwerpunkte:
  - 'Άρθρο 8 ν. 4996/2022 fügt Άρθρο 21Α ν. 2121/1993 ein: «Ορισμοί της εξόρυξης κειμένων και δεδομένων,
    του ερευνητικού οργανισμού και του ιδρύματος πολιτιστικής κληρονομιάς – Εξαίρεση της αναπαραγωγής
    έργων …».'
  - 'Άρθρο 9 ν. 4996/2022 fügt Άρθρο 21Β ν. 2121/1993 ein: «Εξαίρεση της εξόρυξης κειμένων και δεδομένων
    από την αναπαραγωγή και εξαγωγή νομίμως προσβάσιμων έργων …».'
  - Die Schranken sind im Wortlaut nicht geprüft; ihr Zuschnitt entspricht der Systematik der Art. 3 und
    4 DSM-Richtlinie mit der für den Modellbau entscheidenden Opt-out-Möglichkeit des Rechteinhabers.
