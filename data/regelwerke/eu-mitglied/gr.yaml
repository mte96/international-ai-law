  regelungsschwerpunkte:
  - Verfassung, Unabhängigkeit und Befugnisse der Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα — die
    Behörde, die seit 2026 auch KI-Marktüberwachung ist. Die Ανάλυση Συνεπειών Ρύθμισης zum ν. 5321/2026
    stützt die Behördenwahl gerade auf diese verfassungsrechtliche Unabhängigkeit.
  - 'Άρθρο 27: Verarbeitung von Beschäftigtendaten. Nach der Aufhebung des Άρθρο 9 ν. 4961/2022 ist dies
    neben Art. 22 DSGVO die verbleibende nationale Norm gegen undurchsichtiges algorithmisches Personalmanagement.'
  - Umsetzung der Richtlinie (EU) 2016/680 für Polizei und Justiz — Bezugsrahmen für biometrische Fernidentifizierung
    und für die Ausnahmen des Άρθρο 4 ν. 4961/2022 zugunsten von Verteidigung, Bürgerschutz und Nachrichtendienst.
