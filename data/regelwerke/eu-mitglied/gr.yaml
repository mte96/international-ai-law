    titel: Γνώμη της Ο.Κ.Ε. επί του σχεδίου νόμου του Υπουργείου Ψηφιακής Διακυβέρνησης
    url: https://www.hellenicparliament.gr/UserFiles/c8827c35-4399-4fbb-8ea6-aebdc768f4f7/13353098.pdf
    sprache: el
    urheber: Οικονομική και Κοινωνική Επιτροπή (Ο.Κ.Ε.)
    verifiziert: true
    abruf: ok
    notiz: Die schärfste amtliche Kritik am Gesetz. Rügt, dass die sektoralen Marktüberwachungsbehörden
      nur abstrakt über Anhang I Abschnitt A KI-VO bezeichnet und weder namentlich noch über die einschlägigen
      griechischen Umsetzungsgesetze benannt werden; dass Arbeitsaufsicht, Τράπεζα της Ελλάδος, Cybersicherheitsbehörde
      und Wettbewerbsbehörde auf bloße Anzeigen an die ΑΠΔΠΧ verwiesen werden; dass für sektorübergreifende
      Verstöße keine Vorrangregel besteht; dass die Bußgeldbefugnis der einzelnen Stellen nicht hinreichend
      gesetzlich zugewiesen ist und Entscheidungen deshalb gerichtlich angreifbar sein dürften; und dass
      die Aufhebung des ΚΕΦΑΛΑΙΟ Β΄ ν. 4961/2022 ein «Regelungsvakuum» für den Einsatz von KI in der öffentlichen
      Verwaltung hinterlässt. Das Datum ist nur mit Monatsgenauigkeit belegt.
