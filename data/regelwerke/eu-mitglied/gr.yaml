- id: gr-eeb-gnomi-scholeia
  jurisdiktion: gr
  kurztitel: Γνώμη der Bioethik-Kommission zu KI in der Schule
  offizieller_titel: Γνώμη για τις εφαρμογές Τεχνητής Νοημοσύνης στο ελληνικό σχολείο
  fundstelle: Γνώμη der Εθνική Επιτροπή Βιοηθικής & Τεχνοηθικής, März 2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Beratende Stellungnahme ohne Rechtsverbindlichkeit. Griechenland hat — anders als Italien
    mit den Linee guida des Bildungsministeriums — kein verbindliches Regelwerk zum KI-Einsatz an Schulen.
    Das Datum ist nur monatsgenau belegt.

    '
  kurzbeschreibung: 'Stellungnahme zur Nutzung künstlicher Intelligenz in der griechischen Schule. Kernaussagen:
    Der pädagogische Bedarf hat Vorrang vor der Technik; KI darf die Beziehung zwischen Lehrenden und
    Lernenden ergänzen, nicht ersetzen; neben Bildung in KI ist Bildung über KI erforderlich; Bildungsungleichheit
    ist durch gezielte Maßnahmen zu verhindern; Verhaltensmanipulation, soziale Bewertung und Überwachungssysteme
    sind zu untersagen; vor breitem Einsatz sind Pilotprogramme mit interdisziplinärer Begleitforschung
    durchzuführen; Technoethik gehört in die Lehrerausbildung.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://bioethics.gr/api/files/download/2412/
  anwendungsdaten:
  - datum: 2025-03-01
    was_gilt: Verabschiedung der Stellungnahme (nur monatsgenau belegt).
    verifiziert: false
    quelle: https://bioethics.gr/api/files/download/2412/
  themenachsen:
  - grundrechte
  - content
  regelungsschwerpunkte:
  - Vorrang des pädagogischen Bedarfs vor der Technologie; KI als Ergänzung, nicht als Ersatz der Lehrer-Schüler-Beziehung.
  - Ausdrückliches Verbot von Verhaltensmanipulation, sozialer Bewertung und Überwachungssystemen im schulischen
    Kontext — inhaltlich eine Anwendung des Art. 5 KI-VO auf die Schule.
  - Pilotierung mit interdisziplinärer Begleitforschung vor breitem Einsatz; Technoethik in der Lehrerausbildung.
  dokumente:
  - datum: 2025-03-01
    typ: stellungnahme
