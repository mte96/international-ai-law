- id: gr-eeb-gnomi-ygeia
  jurisdiktion: gr
  kurztitel: Γνώμη der Bioethik-Kommission zu KI im Gesundheitswesen
  offizieller_titel: 'Γνώμη: Για τις Εφαρμογές Τεχνητής Νοημοσύνης στην Υγεία στην Ελλάδα'
  fundstelle: Γνώμη der Εθνική Επιτροπή Βιοηθικής & Τεχνοηθικής vom 21.12.2023
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Beratende Stellungnahme ohne Rechtsverbindlichkeit. Sie ist am Rechercheschluss das
    einzige auffindbare griechische Dokument mit sektorspezifischen Anforderungen an KI im Gesundheitswesen.
    Ein Gegenstück zu den Άρθρα 7 bis 10 der italienischen Legge 132/2025 gibt es im griechischen Recht
    nicht: Weder ν. 4961/2022 noch ν. 5321/2026 enthalten Gesundheitsvorschriften.

    '
  kurzbeschreibung: 'Stellungnahme der nationalen Bioethik- und Technoethik-Kommission. Sie fordert einen
    Governance-Rahmen für Entwicklung und Einsatz von KI im Gesundheitswesen auf der Grundlage von Autonomie,
    Fürsorgeprinzip, Sicherheit und Gerechtigkeit, die Modernisierung des Rechtsrahmens im Gleichklang
    mit der KI-VO, die Erarbeitung von Ethikkodizes und Folgenabschätzungen durch die einsetzenden Organisationen,
    den Abbau digitaler Ungleichheit, die Fortbildung des Gesundheitspersonals, die Verbesserung der Interoperabilität
    von Gesundheitsdaten sowie den erleichterten Zugang der Forschung zu Gesundheitsdatenbanken.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://bioethics.gr/api/files/download/2339/OPINION%20AI%20IN%20HEALTH%20GR.pdf
  anwendungsdaten:
  - datum: 2023-12-21
    was_gilt: Verabschiedung der Stellungnahme.
    verifiziert: true
    quelle: https://bioethics.gr/api/files/download/2339/OPINION%20AI%20IN%20HEALTH%20GR.pdf
  themenachsen:
  - sektor-medizin
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - Forderung nach einem eigenen Governance-Rahmen für KI im Gesundheitswesen mit den Prinzipien Autonomie,
    Fürsorge, Sicherheit und Gerechtigkeit.
  - Ethikkodizes und Folgenabschätzungen durch die einsetzenden Gesundheitsorganisationen — ein Vorschlag,
    der in der Sache dem 2026 aufgehobenen Άρθρο 10 ν. 4961/2022 entspricht, ohne dessen Verbindlichkeit.
  - Zugang der Forschung zu Gesundheitsdatenbanken und Interoperabilität — Berührungspunkt mit dem europäischen
    Gesundheitsdatenraum.
  - 'Keine Umsetzung in Recht: Der Gesetzgeber hat den Vorschlag weder 2022 noch 2026 aufgegriffen.'
  dokumente:
  - datum: 2023-12-21
    typ: stellungnahme
    titel: 'Γνώμη: Για τις Εφαρμογές Τεχνητής Νοημοσύνης στην Υγεία στην Ελλάδα — Volltext-PDF'
    url: https://bioethics.gr/api/files/download/2339/OPINION%20AI%20IN%20HEALTH%20GR.pdf
    sprache: el
    urheber: Εθνική Επιτροπή Βιοηθικής & Τεχνοηθικής
    verifiziert: true
    abruf: ok
    notiz: Amtlicher Volltext der Kommission; Titel, Datum und Empfehlungen sind belegt.
  offene_punkte:
  - Sektorales Aufsichtsrecht für Medizin-KI (Ε.Ο.Φ. als Marktüberwachungsbehörde für Medizinprodukte
    nach Anhang I KI-VO) ist im ν. 5321/2026 nicht namentlich zugewiesen; die Ο.Κ.Ε. hat genau das gerügt.
  - Rechtsakte des Gesundheitsministeriums oder der Ε.Ο.Π.Υ.Υ. zu KI wurden nicht ermittelt.
