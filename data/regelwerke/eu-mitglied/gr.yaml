- id: gr-apdpx-praxeis-tn
  jurisdiktion: gr
  kurztitel: Praxis der ΑΠΔΠΧ zur künstlichen Intelligenz
  offizieller_titel: Πράξεις της Αρχής Προστασίας Δεδομένων Προσωπικού Χαρακτήρα με αντικείμενο συστήματα
    τεχνητής νοημοσύνης (Γνωμοδοτήσεις 8/2026 και 9/2026)
  fundstelle: Γνωμοδότηση 8/2026 vom 24.06.2026; Γνωμοδότηση 9/2026 vom 07.07.2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Keine Rechtsnormen, sondern Akte der Behörde, die seit dem 20.07.2026 zugleich KI-Marktüberwachungsbehörde
    ist. Sie sind das beste Material dafür, wie die griechische Aufsicht die Schnittstelle von DSGVO und
    KI-VO versteht, und sie liegen zeitlich unmittelbar vor dem Rollenwechsel.

    '
  kurzbeschreibung: 'Zwei Gutachten aus dem Sommer 2026. Γνωμοδότηση 8/2026 betrifft ein KI-System der
    Εθνική Αρχή Διαφάνειας, das eingehende Beschwerden kategorisiert, bewertet und für die Prüfung priorisiert.
    Die Behörde verlangt eine ausdrückliche Regelung, dass jeder Vorschlag des Systems von der zuständigen
    Prüfstelle gebilligt werden muss, stützt die Verarbeitung auf Art. 6 Abs. 1 lit. c DSGVO und fordert
    substanzielle und verständliche Information der Betroffenen über Kriterien und Logik des Systems.
    Γνωμοδότηση 9/2026 betrifft den Entwurf des Durchführungsgesetzes und warnt vor Aufgabenübertragung
    ohne Ressourcen. Hinzu tritt die ältere Praxis zu Gesichtserkennung, die hier nur als offener Punkt
    geführt wird.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.dpa.gr/el/enimerwtiko/prakseisArxis
  anwendungsdaten:
  - datum: 2026-06-24
    was_gilt: Γνωμοδότηση 8/2026 zum KI-gestützten Prüfsystem der Εθνική Αρχή Διαφάνειας.
    verifiziert: true
    quelle: https://www.dpa.gr/el/enimerwtiko/prakseisArxis/gnomodotisi-epi-shedioy-diataxis-me-titlo-ypostirixi-toy-elegktikoy-ergoy
  - datum: 2026-07-07
    was_gilt: Γνωμοδότηση 9/2026 zum Entwurf des KI-VO-Durchführungsgesetzes.
    verifiziert: true
    quelle: https://www.dpa.gr/el/enimerwtiko/prakseisArxis/gnomodotisi-gia-shn-metra-efarmogis-toy-kanonismoy-ee-20241689-toy
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'Γνωμοδότηση 8/2026: Verlangt eine ausdrückliche gesetzliche Anordnung, dass «κάθε πρόταση ή σύσταση»
    des KI-Systems von der zuständigen Prüfstelle gebilligt werden muss — bedeutsame menschliche Zwischenschaltung
    als Bedingung, nicht als Empfehlung.'
  - 'Γνωμοδότηση 8/2026: Rechtsgrundlage ist Art. 6 Abs. 1 lit. c DSGVO, weil das System nur bestehende
    Aufgaben der Εθνική Αρχή Διαφάνειας unterstützt und keinen neuen Verarbeitungszweck einführt. Bemerkenswert:
    Die Behörde erkennt gleichwohl einen erheblichen Einfluss auf Prüfung und Priorisierung von Beschwerden
    und knüpft daran verschärfte Verfahrensgarantien.'
  - 'Γνωμοδότηση 8/2026: Transparenzanforderung — Betroffene müssen «substanzielle und verständliche Information
    über die verwendeten Kriterien und die Logik des Systems» erhalten. Das ist inhaltlich die Fortschreibung
    des aufgehobenen Άρθρο 6 ν. 4961/2022 mit datenschutzrechtlichen Mitteln.'
  - 'Γνωμοδότηση 9/2026: Warnung, die Übertragung neuer Aufgaben auf eine bestehende unabhängige Behörde
    könne deren Funktionsfähigkeit beeinträchtigen, wenn Personal-, Finanz- und Sachmittel fehlen; Forderung
    nach Ausnahmen von Einstellungsbeschränkungen und nach besonderen Lohnanreizen wie bei anderen Marktregulierern.'
  - 'Beide Gutachten zusammen zeigen die griechische Grundentscheidung: Die KI-Aufsicht wird nicht als
    Produktsicherheits-, sondern als Grundrechtsaufsicht organisiert.'
  dokumente:
