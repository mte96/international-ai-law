    veröffentlicht am 25.11.2024. Er ist die inhaltliche Grundlage der später beschlossenen nationalen
    KI-Strategie und benennt die Vorhaben, die 2025 und 2026 in Rechtsform gegossen wurden (KI-Fabrik
    ΦΑΡΟΣ, Ειδική Γραμματεία, mAigov).

    '
