  offene_punkte:
  - Der Wortlaut der Άρθρα 22 bis 26 und 58 ist am amtlichen ΦΕΚ nicht verifiziert. Άρθρο 26 und die Übergangsfrist
    31.10.2026 stützen sich auf den amtlichen Konsultationsentwurf (dort Άρθρα 25 und 24) plus zwei unabhängige
    Sekundärquellen.
  - 'Die Strafdrohung des Άρθρο 23 (Entfernen der Deepfake-Kennzeichnung) ist inhaltlich unbekannt: weder
    Straftatbestandsfassung noch Strafrahmen noch Antragserfordernis ließen sich am Normtext feststellen.
    Das ist die größte offene Lücke dieser Datei.'
  - Ob Griechenland die Benennung der Kommission nach Art. 70 Abs. 2 KI-VO förmlich gemeldet hat und wann,
    konnte nicht festgestellt werden — die Kommissionsseite ist durch robots.txt gesperrt.
  - Die sektoralen Marktüberwachungsbehörden des Άρθρο 3 Abs. 2 sind im Gesetz nicht namentlich benannt.
    Welche griechische Stelle für welches Anhang-I-Produkt zuständig ist, bleibt Auslegungsfrage — die
    Ο.Κ.Ε. hat genau das gerügt.
  - Ob die Rechtsakte nach Άρθρο 24 (Muster, Beschwerdeverfahren, Kooperationsrahmen, Vergleichsverfahren)
    inzwischen erlassen sind, ist nicht belegt; das Gesetz setzt dafür keine Frist.
  - Ob das Reallabor nach Άρθρο 12 zum unionsrechtlichen Stichtag 02.08.2027 betriebsbereit ist, ist offen;
    ein Teilnahmeaufruf der ΕΕΤΤ war nicht auffindbar.
  - Ob das Μητρώο des Άρθρο 21 technisch existiert und ob die Ειδική Γραμματεία es betreibt, ist nicht
    belegt; auf ai.gov.gr war es am 04.09.2026 nicht sichtbar.
  - 'Έναρξη ισχύος nicht gelesen: Die ΦΕΚ-PDF ist über die verfügbaren Werkzeuge nur bis etwa zur Mitte
    auslesbar (WebFetch schneidet ab, api.et.gr sperrt Skriptzugriff, direkter Download ist durch die
    Egress-Policy blockiert). Verifiziert ist damit nur die amtliche Verkündung (ΦΕΚ-Nummer und -Datum
    aus dem Kopf des Gesetzblatts). Nächster Schritt: Schlussartikel "Έναρξη ισχύος" im ΦΕΚ-PDF prüfen,
    weil griechische Gesetze davon abweichen können — ν. 4961/2022 tat es.'
