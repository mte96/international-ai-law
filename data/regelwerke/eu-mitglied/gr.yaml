- id: gr-n-4961-2022-meros-b
  jurisdiktion: gr
  kurztitel: Ν. 4961/2022 ΜΕΡΟΣ Β΄ — IoT, Drohnen, Blockchain, Smart Contracts, 3D-Druck
  offizieller_titel: Νόμος 4961/2022, ΜΕΡΟΣ Β΄ «Αξιοποίηση προηγμένων τεχνολογιών» (Άρθρα 28-57)
  fundstelle: ΦΕΚ Α΄ 146 vom 27.07.2022
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Unberührt von der Aufhebung des KI-Kapitels. ΜΕΡΟΣ Β΄ gilt fort. Eine spätere Änderung
    des ν. 4961/2022 durch Άρθρο 27 ν. 5256/2025 betrifft Άρθρο 84 (PRS/GOVSATCOM) und damit einen ganz
    anderen Gesetzesteil; das KI-Kapitel und ΜΕΡΟΣ Β΄ waren davon nicht betroffen.

    '
  kurzbeschreibung: 'Zweiter Hauptteil desselben Gesetzes und der eigentliche Grund dafür, dass Griechenland
    2022 als Vorreiter galt. Er regelt in einem Zug die Cybersicherheit von Geräten des Internets der
    Dinge, den Einsatz unbemannter Luftfahrzeuge im Postdienst, Anwendungen der Distributed-Ledger-Technologie
    einschließlich intelligenter Verträge sowie den 3D-Druck. Adressaten sind je nach Kapitel Hersteller
    und Betreiber von IoT-Geräten, Postdiensteanbieter, Anbieter von DLT-Diensten und Betreiber von 3D-Druckern.
    Das Kapitel Ε΄ ist der für die KI-Praxis wichtigste Teil, weil es die zivilrechtliche Behandlung intelligenter
    Verträge betrifft.

    '
