  regelungsschwerpunkte:
  - 'ΚΕΦΑΛΑΙΟ Γ΄ (Άρθρα 32-42): Anwendungen der Technologie des Internets der Dinge; Άρθρο 32 verlangt
    Cybersicherheitsmaßnahmen für IoT-Geräte.'
  - 'ΚΕΦΑΛΑΙΟ Δ΄ (Άρθρα 43-46): Einsatz unbemannter Luftfahrzeugsysteme, insbesondere im Postdienst.'
  - 'ΚΕΦΑΛΑΙΟ Ε΄ (Άρθρα 47-52): Anwendungen der Technologie des verteilten Kontenbuchs (κατανεμημένο καθολικό
    / DLT) einschließlich intelligenter Verträge (έξυπνες συμβάσεις).'
  - 'ΚΕΦΑΛΑΙΟ ΣΤ΄ (Άρθρα 53-57): Regelungen zum Verfahren des dreidimensionalen Drucks.'
  - 'Der Zuschnitt ist bemerkenswert: Ein einziges Gesetz behandelt KI, IoT, Drohnen, Blockchain und 3D-Druck
    als «αναδυόμενες τεχνολογίες». Diese Bündelung erklärt, warum die KI-Vorschriften technikneutral und
    knapp gefasst waren — und warum sie sich später ohne Bruch aus dem Gesetz herauslösen ließen.'
