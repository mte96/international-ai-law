- id: gr-ai-vertrauensrahmen-oeff
  jurisdiktion: gr
  kurztitel: Verwaltungspraxis der Ειδική Γραμματεία (Leitfäden, Normen, Foren)
  offizieller_titel: Πρωτοβουλίες της Ειδικής Γραμματείας Τεχνητής Νοημοσύνης και Διακυβέρνησης Δεδομένων
    για την αξιόπιστη τεχνητή νοημοσύνη στον δημόσιο τομέα
  fundstelle: Veröffentlichungen auf ai.gov.gr, Stand 04.09.2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Kein Rechtsakt, sondern die laufende Verwaltungspraxis derjenigen Stelle, die nach Άρθρα
    21 und 22 ν. 5321/2026 das KI-Register und das Observatorium führt. Nach der Aufhebung des ΚΕΦΑΛΑΙΟ
    Β΄ ν. 4961/2022 ist dies neben dem Register die einzige Ebene, auf der Anforderungen an Verwaltungs-KI
    formuliert werden — und sie ist unverbindlich.

    '
  kurzbeschreibung: 'Sammeleintrag für die publizierten Aktivitäten der Ειδική Γραμματεία Τεχνητής Νοημοσύνης
    και Διακυβέρνησης Δεδομένων. Am Rechercheschluss sichtbar: ein Hinweis auf die europäische Norm EN
    18286:2026 zur Umsetzung der KI-VO, Online-Seminare zu KI-Anwendungen in der Justiz, das dritte Konsultationsforum
    zu vertrauenswürdiger KI im öffentlichen Sektor, ein Leitfaden zur Datenverwaltung für Business-Intelligence-Systeme
    der Verwaltung sowie ein allgemeinverständlicher Leitfaden «Τεχνητή Νοημοσύνη για όλους». Adressat
    ist die Verwaltung; Sanktionen gibt es nicht.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://ai.gov.gr/
  anwendungsdaten:
  - datum: 2026-07-29
    was_gilt: Veröffentlichung eines Leitfadens zur Datenverwaltung für Business-Intelligence-Systeme
      der öffentlichen Verwaltung.
    verifiziert: true
    quelle: https://ai.gov.gr/
  - datum: 2026-08-06
    was_gilt: Drittes Konsultationsforum zu vertrauenswürdiger KI im öffentlichen Sektor.
    verifiziert: true
    quelle: https://ai.gov.gr/
  - datum: 2026-09-02
    was_gilt: Hinweis auf die europäische Norm EN 18286:2026 zur Umsetzung der KI-VO und Online-Seminare
      zu KI in der Justiz.
    verifiziert: true
    quelle: https://ai.gov.gr/
  themenachsen:
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - EN 18286:2026 als harmonisierte bzw. europäische Norm zur KI-VO-Umsetzung wird von der Ειδική Γραμματεία
    aktiv verbreitet — der Übergang von nationaler Regelsetzung zu europäischer Normung ist damit auch
    praktisch vollzogen.
  - Leitfaden «Τεχνητή Νοημοσύνη για όλους» (Mai 2026), erarbeitet mit dem Εθνικό Συμβούλιο Έρευνας, Τεχνολογίας
    και Καινοτομίας.
  - Konsultationsforen zu vertrauenswürdiger KI im öffentlichen Sektor als Ersatz für die aufgehobene
    Gremienarchitektur der Άρθρα 11 bis 13 ν. 4961/2022.
