- id: gr-n-5321-2026
  jurisdiktion: gr
  kurztitel: Ν. 5321/2026 — griechisches KI-VO-Durchführungsgesetz
  offizieller_titel: Νόμος 5321/2026 «Μέτρα εφαρμογής του Κανονισμού (ΕΕ) 2024/1689 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 13ης Ιουνίου 2024 (Κανονισμός για την τεχνητή νοημοσύνη) – Τροποποίηση του
    ν. 4961/2022 (Α΄ 146) και άλλες διατάξεις»
  fundstelle: ΦΕΚ Α΄ 114 vom 20.07.2026
  verfahrensnummer: Σχέδιο νόμου des Υπουργείο Ψηφιακής Διακυβέρνησης και Τεχνητής Νοημοσύνης; Parlamentsakte
    GUID c8827c35-4399-4fbb-8ea6-aebdc768f4f7
  status: anwendbar
  status_detail: 'Verkündet und in Kraft. Verfahrensgang: öffentliche elektronische Konsultation auf opengov.gr
    vom 21.06.2026, 23:10 Uhr bis 06.07.2026, 09:00 Uhr; Bericht des Γενικό Λογιστήριο του Κράτους vom
    06.07.2026 (Nr. 97/5/2026); Gutachten der ΑΠΔΠΧ Nr. 9/2026 vom 07.07.2026; Stellungnahme der Οικονομική
    και Κοινωνική Επιτροπή (Juli 2026); Annahme im Plenum am 16.07.2026; Verkündung im ΦΕΚ Α΄ 114 am 20.07.2026.
    Das Gesetz hat 58 Artikel in drei Teilen; KI-Recht ist ausschließlich das ΜΕΡΟΣ Α΄ (Άρθρα 1-26).

    '
  kurzbeschreibung: 'Nationales Durchführungsgesetz zur KI-Verordnung (EU) 2024/1689. Es macht die Datenschutzbehörde
    Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα zur zentralen Marktüberwachungsbehörde für verbotene
    Praktiken (Art. 5 KI-VO), für Hochrisikosysteme nach Anhang III und für die Transparenzpflichten des
    Art. 50 KI-VO und zugleich zur einzigen Anlaufstelle nach Art. 70 Abs. 2 KI-VO; die Εθνική Επιτροπή
    Τηλεπικοινωνιών και Ταχυδρομείων wird notifizierende Behörde, beherbergt ein Κέντρο συντονισμού και
    τεχνογνωσίας und betreibt gemeinsam mit der Datenschutzbehörde das Reallabor. Adressaten sind Anbieter,
    Betreiber und notifizierte Stellen sowie der gesamte öffentliche Sektor. Geldbußen richten sich nach
    Art. 99 KI-VO (bis 35 Mio. Euro bzw. 7 % des weltweiten Jahresumsatzes), flankiert von Zwangsgeldern
    bis 2 % des durchschnittlichen weltweiten Tagesumsatzes des Vorjahres; sie können auch gegen öffentliche
    Stellen verhängt werden. Zugleich hebt Άρθρο 26 das gesamte materielle KI-Kapitel des ν. 4961/2022
    auf.

    '
