    titel: L 4961/2022 — The Greek legal framework on emerging technologies (EY Tax Alert)
    url: null
    sekundaerquelle_url: https://www.ey.com/el_gr/technical/tax/tax-alerts/l-4961-2022-the-greek-legal-framework-on-emerging-technologies
    sprache: el
