regelwerke:
- id: gr-n-4961-2022
  jurisdiktion: gr
  kurztitel: Ν. 4961/2022 — KI-Kapitel (aufgehoben)
  offizieller_titel: Νόμος 4961/2022 «Αναδυόμενες τεχνολογίες πληροφορικής και επικοινωνιών, ενίσχυση
    της ψηφιακής διακυβέρνησης και άλλες διατάξεις», ΜΕΡΟΣ Α΄ ΚΕΦΑΛΑΙΟ Β΄ «Ρυθμίσεις για την ανάπτυξη
    της τεχνητής νοημοσύνης» (Άρθρα 3-14)
  fundstelle: ΦΕΚ Α΄ 146 vom 27.07.2022
  verfahrensnummer: null
  status: aufgehoben
  status_detail: 'Das KI-Kapitel ist seit dem 20.07.2026 aufgehoben. Άρθρο 26 ν. 5321/2026 bestimmt die
    Aufhebung des gesamten Κεφάλαιο Β΄ des Μέρος Α΄, also der Άρθρα 3 bis 14. Der übrige Gesetzestext
    (insbesondere ΜΕΡΟΣ Β΄ zu IoT, Drohnen, Blockchain, Smart Contracts und 3D-Druck sowie die Digitalisierungsvorschriften
    der ΜΕΡΗ Γ΄-Ζ΄) gilt fort und ist unter gr-n-4961-2022-meros-b erfasst. Für die Zeit vom 01.01.2023
    bis zum 19.07.2026 war dieses Kapitel geltendes materielles KI-Recht und ging in mehreren Punkten
    über die KI-VO hinaus.

    '
  kurzbeschreibung: 'Erstes materielles KI-Gesetz eines EU-Mitgliedstaats, verkündet gut zwei Jahre vor
    der KI-VO. Es band den Einsatz von KI durch öffentliche Stellen an eine ausdrückliche gesetzliche
    Grundlage, verlangte vor Inbetriebnahme eine algorithmische Folgenabschätzung neben der DSGVO-Datenschutz-Folgenabschätzung,
    verpflichtete zu öffentlicher Offenlegung der Systemparameter und zur Führung eines Registers und
    zwang Auftragnehmer über das Vergaberecht zur Herausgabe der Systemlogik. Im Privatsektor musste der
    Arbeitgeber Beschäftigte und Bewerber vor dem ersten Einsatz eines KI-Systems über die Entscheidungsparameter
    unterrichten; mittlere und große Unternehmen mussten ein KI-Register und eine Datenethik-Leitlinie
    führen. Sanktioniert war allein die Unterrichtungspflicht, und zwar über die Verwaltungs- und Strafsanktionen
    der Άρθρα 24 und 28 ν. 3996/2011 durch die Arbeitsaufsicht.

    '
  inkrafttreten:
    datum: 2023-01-01
    verifiziert: false
    quelle: https://api.et.gr/apiLAW/1/2022/4961/pdf
    fundstelle_norm: Amtliche Verkündung im ΦΕΚ Α΄ 146 vom 27.07.2022 (Kopf des Gesetzblatts bestätigt).
      Das KI-Kapitel (ΚΕΦΑΛΑΙΟ Β΄ des ΜΕΡΟΣ Α΄, Άρθρα 3-14) trat abweichend vom Verkündungstag erst am
      01.01.2023 in Kraft; der zugrunde liegende Schlussartikel war im abrufbaren Teil der PDF nicht lesbar.
      Aufgehoben durch Άρθρο 26 ("Καταργούμενες διατάξεις Μέρους Α΄") ν. 5321/2026, ΦΕΚ Α΄ 114 vom 20.07.2026
      — die Existenz dieses Artikels ist im Inhaltsverzeichnis des ΦΕΚ bestätigt.
  anwendungsdaten:
  - datum: 2022-07-27
    was_gilt: Verkündung des Gesetzes im ΦΕΚ Α΄ 146; die übrigen Teile treten in Kraft, das KI-Kapitel
      noch nicht.
    verifiziert: true
    quelle: https://api.et.gr/apiLAW/1/2022/4961/pdf
  - datum: 2023-01-01
    was_gilt: 'Inkrafttreten des ΚΕΦΑΛΑΙΟ Β΄ (Άρθρα 3-14): Pflichten der öffentlichen Stellen und der
      Privatwirtschaft werden wirksam.'
    verifiziert: false
    quelle: https://api.et.gr/apiLAW/1/2022/4961/pdf
  - datum: 2026-07-20
    was_gilt: Aufhebung des gesamten ΚΕΦΑΛΑΙΟ Β΄ durch Άρθρο 26 ν. 5321/2026.
    verifiziert: true
    quelle: https://api.et.gr/apiLAW/1/2026/5321/pdf
  themenachsen:
  - sektor-oeffentlich
  - arbeit
  - grundrechte
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - 'Άρθρο 4 Abs. 1: Öffentliche Stellen im Sinne des Άρθρο 14 Abs. 1 lit. a ν. 4270/2014 durften KI zur
    Entscheidungsfindung oder -unterstützung nur einsetzen, «μόνον εφόσον η χρήση αυτή προβλέπεται ρητά
    σε ειδική διάταξη νόμου που περιλαμβάνει κατάλληλες εγγυήσεις» — ein einfachgesetzlicher Gesetzesvorbehalt
    für Verwaltungs-KI, den die KI-VO nicht kennt.'
  - 'Άρθρο 4: Bereichsausnahme für Verteidigungsministerium, Bürgerschutzministerium, Nachrichtendienst
    Ε.Υ.Π. und deren nachgeordnete Stellen.'
  - 'Άρθρο 5: Algorithmische Folgenabschätzung vor Inbetriebnahme, ausdrücklich neben und nicht anstelle
    der Datenschutz-Folgenabschätzung des Art. 35 DSGVO; sie musste den erwarteten Nutzen den Risiken
    gegenüberstellen «ιδίως για φυλετικές, εθνοτικές, κοινωνικές ή ηλικιακές ομάδες».'
  - 'Άρθρο 6: Öffentliche Bekanntgabe von Betriebsbeginn, Betriebsparametern, Fähigkeiten, technischen
    Merkmalen und Entscheidungskategorien; individuelles Recht der betroffenen Person auf Kenntnis der
    Entscheidungsparameter in verständlicher und barrierefreier Form. Beschwerdestelle war die Εθνική
    Αρχή Διαφάνειας (Ε.Α.Δ.).'
  - 'Άρθρο 7: Vergaberechtlicher Hebel — die Ausschreibung musste den Auftragnehmer verpflichten, Informationen
    herauszugeben und auf Ansprüche zu verzichten, die das Informationsrecht gefährden könnten; das System
    war so zu liefern, dass die Behörde seine Funktionsweise studieren, es verbessern und die Verbesserungen
    veröffentlichen kann.'
  - 'Άρθρο 8: Registerpflicht jeder öffentlichen Stelle mit jährlicher Aktualisierung zum 1. März und
    anlassbezogener Aktualisierung bei neuen Systemen; Vorlage an die Ε.Α.Δ. auf Anforderung.'
  - 'Άρθρο 9: Unterrichtungspflicht des privaten Arbeitgebers vor der ersten Nutzung eines KI-Systems,
    das Entscheidungen über Beschäftigte oder Bewerber beeinflusst — mindestens über die Entscheidungsparameter;
    ausdrücklich auch für Plattformbeschäftigte mit Werk- oder Dienstvertrag. Sanktion: Άρθρα 24 und 28
    ν. 3996/2011, zuständig die Arbeitsaufsicht (im Text noch Σ.ΕΠ.Ε.).'
  - 'Άρθρο 10: KI-Register und Datenethik-Leitlinie für mittlere und große Einheiten im Sinne des Άρθρο
    2 Abs. 5 und 6 ν. 4308/2014, bei Profilbildung von Verbrauchern und bei der Bewertung von Beschäftigten
    oder Vertragspartnern; Aktiengesellschaften mussten die Leitlinie in die Erklärung zur Unternehmensführung
    nach Άρθρο 152 ν. 4548/2018 aufnehmen. OHNE eigenen Sanktionstatbestand.'
  - 'Άρθρα 11-13: Συντονιστική Επιτροπή für KI, deren Zuständigkeiten und die Επιτροπή Εποπτείας der nationalen
    KI-Strategie — eine dreistufige Gremienarchitektur, die durch das Κέντρο συντονισμού και τεχνογνωσίας
    des Άρθρο 6 ν. 5321/2026 ersetzt wurde.'
  - 'Άρθρο 14: Παρατηρητήριο Τεχνητής Νοημοσύνης — Vorläufer des heutigen Observatoriums nach Άρθρο 22
    ν. 5321/2026.'
