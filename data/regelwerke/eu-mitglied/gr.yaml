  kurztitel: Ν. 4996/2022 — DSM-Umsetzung, TDM-Schranken 21Α/21Β
  offizieller_titel: Νόμος 4996/2022 «Καθορισμός κανόνων σχετικά με την άσκηση των δικαιωμάτων πνευματικής
    ιδιοκτησίας …» (Ενσωμάτωση της Οδηγίας (ΕΕ) 2019/790)
  fundstelle: ΦΕΚ Α΄ 218 vom 24.11.2022
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. ΜΕΡΟΣ Β΄ (Άρθρα 6-30) setzt die Richtlinie (EU) 2019/790 um. Άρθρο 8 fügt
    Άρθρο 21Α, Άρθρο 9 fügt Άρθρο 21Β in das Urheberrechtsgesetz ν. 2121/1993 ein. Diese beiden Vorschriften
    sind die griechische Rechtsgrundlage für Text- und Data-Mining und damit für das Training generativer
    Modelle mit geschützten Werken.

    '
  kurzbeschreibung: 'Griechische Umsetzung der DSM-Richtlinie. Für das KI-Recht zählt vor allem die Einfügung
    der beiden TDM-Schranken in das Urheberrechtsgesetz: Άρθρο 21Α ν. 2121/1993 enthält die Begriffsbestimmungen
    des Text- und Data-Mining, der Forschungsorganisation und der Einrichtung des Kulturerbes sowie die
    Schranke zugunsten der Wissenschaft; Άρθρο 21Β ν. 2121/1993 enthält die allgemeine TDM-Schranke für
    rechtmäßig zugängliche Werke mit dem Rechtsvorbehalt des Art. 4 Abs. 3 DSM-Richtlinie. Über Art. 53
    Abs. 1 lit. c KI-VO wirkt dieser Vorbehalt auf die Pflichten der Anbieter von Universalmodellen durch.

    '
  inkrafttreten:
    datum: 2022-11-24
    verifiziert: false
    quelle: https://api.et.gr/apiLAW/1/2022/4996/pdf
    fundstelle_norm: Amtliche Verkündung im ΦΕΚ Α΄ 218 vom 24.11.2022 — Kopf des Gesetzblatts am 05.09.2026
      bei et.gr gelesen und bestätigt. Der Schlussartikel Άρθρο 56 "Έναρξη ισχύος" war im maschinell abrufbaren
      Teil der PDF nicht einsehbar; das eingetragene Datum entspricht dem Verkündungstag.
  anwendungsdaten:
