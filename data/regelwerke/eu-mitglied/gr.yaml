  jurisdiktion: gr
  kurztitel: Ν. 4624/2019 — DSGVO-Durchführung
  offizieller_titel: Νόμος 4624/2019 «Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα, μέτρα εφαρμογής
    του Κανονισμού (ΕΕ) 2016/679 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου της 27ης Απριλίου 2016
    για την προστασία των φυσικών προσώπων έναντι της επεξεργασίας δεδομένων προσωπικού χαρακτήρα και
    ενσωμάτωση στην εθνική νομοθεσία της Οδηγίας (ΕΕ) 2016/680»
  fundstelle: ΦΕΚ Α΄ 137 vom 29.08.2019
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. Für das KI-Recht doppelt bedeutsam: Das Gesetz ist die Rechtsgrundlage und
    das Statut derjenigen Behörde, die seit dem 20.07.2026 zugleich Marktüberwachungsbehörde für die KI-VO
    ist, und es enthält das nationale Beschäftigtendatenschutzrecht (Άρθρο 27), das nach dem Wegfall des
    Άρθρο 9 ν. 4961/2022 die verbleibende nationale Schranke für algorithmisches Personalmanagement bildet.

    '
  kurzbeschreibung: 'Griechisches DSGVO-Durchführungsgesetz und zugleich Umsetzung der Richtlinie (EU)
    2016/680 für den Bereich Justiz und Inneres. Es regelt Zusammensetzung, Unabhängigkeit, Befugnisse
    und Verfahren der Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα, enthält Öffnungsklauseln unter anderem
    für die Verarbeitung besonderer Datenkategorien und für den Beschäftigungskontext und bewehrt Verstöße
    verwaltungs- und strafrechtlich. Άρθρο 3 ν. 4961/2022 verwies für das KI-Kapitel ausdrücklich auf
    die DSGVO und dieses Gesetz; Άρθρο 9 ν. 5321/2026 regelt heute die Zusammenarbeit der Behörde in ihren
    beiden Rollen.

    '
  inkrafttreten:
    datum: 2019-08-29
    verifiziert: false
    quelle: https://api.et.gr/apiLAW/1/2019/4624/pdf
    fundstelle_norm: Amtliche Verkündung im ΦΕΚ Α΄ 137 vom 29.08.2019 — Kopf des Gesetzblatts am 05.09.2026
      bei et.gr gelesen und bestätigt. Der Schlussartikel (Schlussartikel) "Έναρξη ισχύος" war im maschinell
      abrufbaren Teil der PDF nicht einsehbar; das eingetragene Datum entspricht dem Verkündungstag.
  anwendungsdaten:
  - datum: 2019-08-29
    was_gilt: Verkündung im ΦΕΚ Α΄ 137.
    verifiziert: true
    quelle: https://api.et.gr/apiLAW/1/2019/4624/pdf
  - datum: 2026-07-20
    was_gilt: Die nach diesem Gesetz verfasste Behörde wird durch Άρθρα 3 und 4 ν. 5321/2026 zusätzlich
      Marktüberwachungsbehörde und einzige Anlaufstelle nach der KI-VO.
