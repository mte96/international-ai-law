  regelungsschwerpunkte:
  - Umbenennung des Ressorts in «Υπουργείο Ψηφιακής Διακυβέρνησης και Τεχνητής Νοημοσύνης» — die Ministeriumsseite
    führt diesen Namen heute.
  - Errichtung der Ειδική Γραμματεία Τεχνητής Νοημοσύνης και Διακυβέρνησης Δεδομένων als Kompetenzzentrum
    nach dem Vorbild von gov.gr; sie unterstützt zugleich das KI-Gremium beim Ministerpräsidenten.
  - Infrastrukturvorhaben ΔΑΙΔΑΛΟΣ (Supercomputer) und ΦΑΡΟΣ (AI Factory).
  - Anders als in Italien (Art. 19 Legge 132/2025) gibt es keine gesetzliche Pflicht zur Fortschreibung
    der Strategie in festen Zeitabständen; die Beobachtung ihrer Umsetzung ist erst durch Άρθρο 22 ν.
    5321/2026 verrechtlicht.
