  - datum: 2026-08-18
    was_gilt: Die ΑΠΔΠΧ macht ihre neue Rolle öffentlich bekannt und beschreibt ihre fünf Funktionen unter
      dem Gesetz.
    verifiziert: true
    quelle: https://www.dpa.gr/el/enimerwtiko/deltia/i-arhi-prostasias-dedomenon-analambanei-kombiko-rolo-stin-efarmogi-toy
  themenachsen:
  - marktzugang
  - governance
  - grundrechte
  - sektor-oeffentlich
  - content
  - datenschutz
  regelungsschwerpunkte:
  - 'Άρθρο 3 Abs. 1: «Η Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (εφεξής: Α.Π.Δ.Π.Χ.) ορίζεται ως
    αρμόδια αρχή εποπτείας της αγοράς» — für verbotene Praktiken nach Art. 5 KI-VO, für Anhang-III-Hochrisikosysteme
    und für die Transparenzpflichten des Art. 50 KI-VO. Griechenland wählt damit die Grundrechtsbehörde
    und nicht, wie Spanien mit der AESIA oder Italien mit ACN/AgID, eine Digital- oder Sicherheitsagentur.'
  - 'Άρθρο 3 Abs. 2: Sektorale Marktüberwachung durch die Behörden, die nach dem Harmonisierungsrecht
    des Anhangs I Abschnitt A KI-VO für das jeweilige Produkt zuständig sind — ohne dass diese Behörden
    im Gesetz namentlich benannt werden. Genau das rügt die Ο.Κ.Ε. als gefährliche Unbestimmtheit.'
  - 'Άρθρο 4: «Η Α.Π.Δ.Π.Χ. ορίζεται ως το ενιαίο σημείο επαφής, σύμφωνα με την παρ. 2 του άρθρου 70»
    KI-VO.'
  - 'Άρθρο 5: «Η Εθνική Επιτροπή Τηλεπικοινωνιών και Ταχυδρομείων (εφεξής: Ε.Ε.Τ.Τ.) ορίζεται ως κοινοποιούσα
    αρχή» nach Art. 28 KI-VO. Aufsichts- und Notifizierungsschiene sind damit institutionell getrennt.'
  - 'Άρθρο 6: «Στην Ε.Ε.Τ.Τ. συστήνεται Κέντρο συντονισμού και τεχνογνωσίας για την ΤΝ» — Unterstützung
    der Datenschutz- und Marktüberwachungsbehörden, Schulung, Kodizes, Reallabor- und KMU-Begleitung.
    Personal wird nicht fest eingestellt, sondern über Sachverständigenverträge nach ν. 4412/2016 beschafft;
    Verschwiegenheit nach Art. 78 KI-VO.'
  - 'Άρθρο 7: Einheitliches System zur Einreichung von Beschwerden nach Art. 85 KI-VO, geführt von der
    ΑΠΔΠΧ.'
  - 'Άρθρα 8 und 9: Zusammenarbeit der Marktüberwachungsbehörden untereinander und der ΑΠΔΠΧ mit anderen
    Behörden.'
  - 'Άρθρα 10 und 11: Verfahren zur Bewertung, ob bestehende notifizierte Stellen die Voraussetzungen
    des Art. 31 KI-VO erfüllen, und Bestimmung einer notifizierten Stelle für bestimmte Hochrisikosysteme.'
  - 'Άρθρο 12: «Στην Ε.Ε.Τ.Τ. συστήνεται ρυθμιστικό δοκιμαστήριο ΤΝ» nach Art. 57 und 58 KI-VO; ΕΕΤΤ und
    ΑΠΔΠΧ sind gemeinsam zuständig. Die ΕΕΤΤ schreibt Teilnahmeaufrufe mit Frist, Bewertungskriterien,
    Höchstzahl der Teilnehmer und Teilnahmegebühren aus. Kooperationspartner sind ausdrücklich die «ΦΑΡΟΣ
    AI FACTORY» nach Άρθρο 3 ν. 5263/2025 und die Europäischen Digital Innovation Hubs.'
  - 'Άρθρο 13: Tests von Hochrisikosystemen unter Realbedingungen außerhalb des Reallabors (Art. 60 KI-VO).'
  - 'Άρθρο 16: Verwaltungssanktionen. Abgestufte Maßnahmen von der Verwarnung über Anordnungen bis zu
    Geldbußen nach Art. 99 KI-VO; Zwangsgelder bis 2 % des durchschnittlichen weltweiten Tagesumsatzes
    des Vorjahres. Ausdrücklich auch gegen Stellen des öffentlichen Sektors im Sinne des ν. 4270/2014.
    Kriterium ist unter anderem, ob der Anbieter ausreichende Maßnahmen zur KI-Kompetenz nach Art. 4 KI-VO
    getroffen hat; vorherige Anhörung und besonders begründete Entscheidung sind vorgeschrieben.'
  - 'Άρθρο 16 Abs. 4 in Verbindung mit Άρθρο 24 Abs. 5: Vergleichs- bzw. Anerkenntnisverfahren für Betreiber,
    die den Verstoß einräumen — Ausgestaltung durch Rechtsakt der ΑΠΔΠΧ.'
  - 'Άρθρο 17: Veröffentlichung der Sanktionen. Άρθρο 18: Erstattung der Aufsichtskosten durch den Verpflichteten.
    Άρθρο 19: Recht auf gerichtlichen Rechtsschutz.'
  - 'Άρθρο 20: Verstöße gegen die KI-VO werden in Κεφάλαιο Γ΄ des Μέρος Ι des Anhangs zu ν. 4990/2022
    (Hinweisgeberschutz, Richtlinie (EU) 2019/1937) aufgenommen — KI-Compliance-Verstöße genießen damit
    denselben Repressalienschutz wie Produktsicherheitsverstöße.'
  - 'Άρθρο 21: Einheitliches Μητρώο συστημάτων Τεχνητής Νοημοσύνης für öffentliche Stellen, geführt von
    der Ειδική Γραμματεία Τεχνητής Νοημοσύνης και Διακυβέρνησης Δεδομένων. Anmeldung vor Inbetriebnahme
    mit mindestens elf Angaben, darunter Zweck und öffentliches Interesse, Datenkategorien, technische
    Parameter einschließlich Angaben zu Universalmodellen, Entscheidungsarten, Risiken gerade für schutzbedürftige
    Gruppen, Risikoeinstufung nach der KI-VO, Grundrechte-Folgenabschätzung und Datenschutz-Folgenabschätzung.'
  - 'Άρθρο 22: Παρατηρητήριο ΤΝ beim Ministerium, angesiedelt bei der Ειδική Γραμματεία; Aufgaben sind
    Beobachtung der Umsetzung der nationalen KI-Strategie, Unterstützung der Beteiligten, Prioritätensetzung
    und Berichte, die auf der Website der Ειδική Γραμματεία zu veröffentlichen sind.'
  - 'Άρθρο 23: «Απαγόρευση αφαίρεσης των σημάνσεων διαφάνειας του άρθρου 50 του Κανονισμού 2024/1689 για
    περιεχόμενο βαθυπαραποίησης (deepfakes)» — im Konsultationsentwurf noch nicht enthalten, erst im parlamentarischen
    Verfahren eingefügt. Nach übereinstimmenden Berichten strafrechtlich bewehrt; die Strafdrohung ist
    am amtlichen Text nicht verifiziert.'
  - 'Άρθρο 25 Abs. 1: Der Personalbedarf der ΑΠΔΠΧ aus den neuen Aufgaben wird in den ersten zwei Jahren
    nach Άρθρο 31 ν. 4873/2021 (Mobilität in neu errichtete Dienste) gedeckt.'
  - 'Άρθρο 25 Abs. 2: Öffentliche Stellen, die bereits vor Inkrafttreten KI-Systeme einsetzen, müssen
    «αμελλητί και πάντως όχι πέραν της 31ης.10.2026» eine Registrierungserklärung im Register des Άρθρο
    21 abgeben.'
  - 'Άρθρο 26: «Από την έναρξη ισχύος του παρόντος νόμου καταργείται το Κεφάλαιο Β΄ του Μέρους Α΄ του
    ν. 4961/2022 (Α΄ 146).» — die vollständige Aufhebung der Άρθρα 3-14, einschließlich der privatwirtschaftlichen
    Pflichten.'
