    url: https://bioethics.gr/api/files/download/2412/
    sprache: el
    urheber: Εθνική Επιτροπή Βιοηθικής & Τεχνοηθικής
    verifiziert: true
    abruf: ok
    notiz: Amtlicher Volltext der Kommission; Titel und Empfehlungen sind belegt, das Datum nur monatsgenau.
  offene_punkte:
  - Ein Rechtsakt oder eine Leitlinie des Bildungsministeriums zu KI an Schulen wurde nicht ermittelt.
