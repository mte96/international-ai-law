  regelungsschwerpunkte:
  - 'Auftrag: Prüfung der Auswirkungen der KI-Einführung auf das Justizsystem und Vorschläge an den Justizminister
    zur Anpassung des Rechtsrahmens sowie zum Schutz der Rechte der Beteiligten.'
  - 'Arbeitsschwerpunkte laut Ministeriumsseite: Anonymisierung gerichtlicher Entscheidungen, Verarbeitung
    natürlicher Sprache, französische Erfahrungen mit Justizautomatisierung.'
  - Kein veröffentlichtes Regelwerk. Der Einsatz von KI durch griechische Gerichte unterliegt damit allein
    der KI-VO, dem Datenschutzrecht und — bis zum 19.07.2026 — dem Άρθρο 4 ν. 4961/2022 mit seinem Gesetzesvorbehalt
    für staatliche KI-Entscheidungen. Nach dessen Aufhebung entfällt auch diese Schranke.
