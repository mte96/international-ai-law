  offene_punkte:
  - Kein einziger harmonisierter Standard ist bisher im ABl. zitiert — Konformitätsvermutung (Art. 40)
    faktisch noch nicht verfügbar.
  - Leitlinien zur Hochrisiko-Einstufung (Art. 6 Abs. 5) liegen nur als Entwurf vor; Endfassung ausstehend.
  - Endfassung der Leitlinien zu schwerwiegenden Vorfällen (Art. 73) ausstehend.
  - 'Nur ein Teil der Mitgliedstaaten hat die zuständigen Behörden vollständig benannt (Stand 06/2026:
    9 vollständig, 12 teilweise, 6 offen).'
  - Ein förmliches ABl.-Corrigendum zur KI-VO ist nicht belegt (s. o.).
  - Verhältnis KI-VO / MDR-IVDR bleibt bis zum Erlass von Durchführungsrechtsakten nach VO 2026/1744 unklar.
  monitoring_quellen:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX%3A02024R1689-20260727
  - https://ai-act-service-desk.ec.europa.eu/en/ai-act/timeline/timeline-implementation-eu-ai-act
  - https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
  - https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2021/0106(COD)
  - https://artificialintelligenceact.substack.com/feed (EU AI Act Newsletter, RSS)
  regelungsschwerpunkte:
  - 'Risikobasierter Ansatz: verbotene Praktiken / Hochrisiko / Transparenz / minimales Risiko'
  - Produktsicherheitsrechtliche Architektur (New Legislative Framework, CE, notifizierte Stellen)
  - GPAI-Modelle und systemisches Risiko (Kapitel V)
  - Grundrechte-Folgenabschätzung (Art. 27) für bestimmte Deployer
  - 'Governance: KI-Büro, KI-Board, wissenschaftliches Gremium, Beratungsforum'
  - Sanktionen bis 35 Mio. EUR / 7 % weltweiter Jahresumsatz (Art. 99)
  - Schnittstelle zur DSGVO (Art. 10 Abs. 5, Art. 26 Abs. 9, Art. 27)
  - Normung und Konformitätsvermutung (Art. 40/41)
  status_detail: In Kraft; gestaffelt anwendbar; geändert durch VO (EU) 2026/1744
