regelwerke:
- id: ki-vo-2024-1689
  kurztitel: KI-VO / AI Act
  offizieller_titel: 'Verordnung (EU) 2024/1689 des Europäischen Parlaments und des Rates vom 13. Juni
    2024 zur Festlegung harmonisierter Vorschriften für künstliche Intelligenz und zur Änderung der Verordnungen
    (EG) Nr. 300/2008, (EU) Nr. 167/2013, (EU) Nr. 168/2013, (EU) 2018/858, (EU) 2018/1139 und (EU) 2019/2144
    sowie der Richtlinien 2014/90/EU, (EU) 2016/797 und (EU) 2020/1828 (Verordnung über künstliche Intelligenz)

    '
  fundstelle: ABl. L, 2024/1689, 12.7.2024
  celex: 32024R1689
  eli: http://data.europa.eu/eli/reg/2024/1689/oj
  verfahrensnummer: 2021/0106(COD)
  status: teilanwendbar
  inkrafttreten:
    datum: 2024-08-01
    verifiziert: true
    quelle: https://ai-act-service-desk.ec.europa.eu/en/ai-act/timeline/timeline-implementation-eu-ai-act
  anwendungsdaten:
  - datum: 2024-08-01
    was_gilt: Inkrafttreten (Art. 113 KI-VO).
    verifiziert: false
  - datum: 2025-02-02
    was_gilt: 'Kapitel I (Allgemeine Bestimmungen, Begriffsbestimmungen Art. 3, KI-Kompetenz Art. 4) und
      Kapitel II (verbotene Praktiken Art. 5).

      '
    verifiziert: false
  - datum: 2025-08-02
    was_gilt: 'Kapitel III Abschnitt 4 (notifizierende Behörden/notifizierte Stellen), Kapitel V (GPAI-Modelle),
      Kapitel VII (Governance: KI-Büro, KI-Board, wissenschaftliches Gremium, Beratungsforum), Art. 78
      (Vertraulichkeit), Kapitel XII (Sanktionen) mit Ausnahme von Art. 101 (Geldbußen für GPAI-Anbieter).
      Mitgliedstaaten: Benennung der zuständigen nationalen Behörden und Mitteilung der Sanktionsvorschriften.

      '
    verifiziert: false
  - datum: 2026-08-02
    was_gilt: 'Allgemeiner Anwendungsbeginn der übrigen Verordnung (Art. 113 Abs. 1), insbesondere Transparenzpflichten
      Art. 50, Kapitel VI (Innovationsförderung), Kapitel IX (Marktüberwachung/Beobachtung nach Inverkehrbringen,
      Meldung schwerwiegender Vorfälle Art. 73 - soweit anwendbar), Durchsetzung auf nationaler und EU-Ebene,
      Art. 101 (Geldbußen GPAI). NICHT MEHR: Hochrisiko-Pflichten (verschoben, s. u.).

      '
    verifiziert: false
  - datum: 2026-12-02
    was_gilt: 'Neue Verbotstatbestände Art. 5 Abs. 1 lit. ba) und bb) (KI-generierte nicht-einvernehmliche
      intime Darstellungen / NCII und Darstellungen sexuellen Kindesmissbrauchs / CSAM) — eingefügt durch
      VO (EU) 2026/1744. Zugleich Ende der Übergangsfrist des Art. 50 Abs. 2 (maschinenlesbare Kennzeichnung
      synthetischer Inhalte) für KI-Systeme, die vor dem 02.08.2026 in Verkehr gebracht wurden (Gnadenfrist
      von 6 auf 3 Monate verkürzt).

      '
    verifiziert: false
  - datum: 2027-08-02
    was_gilt: '(a) GPAI-Modelle, die vor dem 02.08.2025 in Verkehr gebracht wurden, müssen Kapitel V erfüllen
      (Art. 111 Abs. 3); (b) Mitgliedstaaten müssen mindestens ein KI-Reallabor in Betrieb haben (durch
      Omnibus von 02.08.2026 verschoben); (c) Frist der Kommission für Leitlinien zur Einstufung als Hochrisiko
      (Art. 6 Abs. 5) sowie Leitlinien zu Art. 8 Abs. 2, Art. 9 Abs. 10, Art. 17 Abs. 3.

      '
    verifiziert: false
  - datum: 2027-12-02
    was_gilt: 'Kapitel III Abschnitte 1-3 (Anforderungen an Hochrisiko-KI und Pflichten der Akteure) für
      Hochrisiko-KI nach ANHANG III (Biometrie, kritische Infrastruktur, Bildung, Beschäftigung, wesentliche
      Dienste, Strafverfolgung, Migration/Asyl/Grenzkontrolle, Justiz/Demokratie). VERSCHOBEN von ursprünglich
      02.08.2026.

      '
    verifiziert: false
  - datum: 2028-08-02
    was_gilt: 'Kapitel III Abschnitte 1-3 für Hochrisiko-KI als Sicherheits- bauteil von Produkten nach
      ANHANG I (Unionsharmonisierungs- rechtsvorschriften). VERSCHOBEN von ursprünglich 02.08.2027. Zugleich
      Frist der Kommission für den delegierten Rechtsakt zur Integration der Hochrisiko-Anforderungen
      in die Maschinen-VO (EU) 2023/1230.

      '
    verifiziert: false
  - datum: 2030-08-02
    was_gilt: 'Übergangsfrist Art. 111 Abs. 2 für Hochrisiko-KI-Systeme, die von Behörden vor Anwendungsbeginn
      eingesetzt wurden (Altsysteme).

      '
    verifiziert: false
    hinweis: Genaues Datum/Verschiebung durch Omnibus nicht abschließend geprüft.
