  regelungsschwerpunkte:
  - 'Fristverschiebung Hochrisiko: Anhang III 02.12.2027, Anhang I 02.08.2028'
  - 'Neue Verbote: KI-generierte NCII und CSAM (Art. 5 Abs. 1 lit. ba, bb)'
  - 'Art. 6: Präzisierung ''Sicherheitsbauteil''; Systeme allein zur Nutzerunterstützung, Leistungsoptimierung,
    Effizienz, Automatisierung oder Bequemlichkeit sind nicht automatisch Hochrisiko'
  - 'Art. 4 KI-Kompetenz abgeschwächt: von ''sicherstellen'' zu ''Maßnahmen zur Förderung ergreifen'''
  - 'Neuer Art. 4a: Verarbeitung besonderer Kategorien personenbezogener Daten zur Bias-Erkennung für
    ALLE KI-Systeme/-Modelle unter dem Maßstab der ''unbedingten Erforderlichkeit'''
  - 'Art. 75 neu gefasst: ausschließliche Zuständigkeit des KI-Büro für GPAI-basierte Systeme desselben
    Unternehmens; KI-Büro als Marktüberwachungsbehörde für VLOP/VLOSE nach DSA'
  - 'Neue Art. 75a-75d: Untersuchungsbefugnisse (Inspektionen, Versiegelung, Zwangsgelder bis 5 % des
    Tagesumsatzes)'
  - Registrierungspflicht in der EU-Datenbank auch bei behaupteter Ausnahme von der Hochrisiko-Einstufung
    (Art. 6 Abs. 3) wieder eingeführt
  - Erleichterungen für KMU und 'small mid-caps' (< 750 Beschäftigte, Umsatz <= 150 Mio. EUR)
  - 'Sektorale Kohärenz: Mechanismus zur Auflösung von Überschneidungen (Medizinprodukte, Maschinen)'
  - Maschinen-VO 2023/1230 von Anhang I Abschnitt A nach Abschnitt B verschoben
