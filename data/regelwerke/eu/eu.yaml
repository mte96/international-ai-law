  status_detail: 'LAUFEND — ''Awaiting committee decision''. Kein Trilog-Ergebnis, keine allgemeine Ausrichtung
    des Rates (Stand 27.08.2026).

    Stand 07.09.2026 nach dem Legislative Observatory: Verfahren weiterhin "Awaiting committee decision".
    Gemeinsam federführend ITRE und LIBE (Verfahren mit gemeinsamen Ausschusssitzungen), mitberatend IMCO
    und JURI. Berichterstatter Aura Salla (EVP, ITRE) und Marina Kaljurand (S&D, LIBE), beide benannt
    am 25.02.2026; Stellungnahmeberichterstatter Alex Agius Saliba (S&D, IMCO, 02.03.2026) und Brando
    Benifei (S&D, JURI, 24.02.2026). Ausschussüberweisung im Plenum angekündigt am 19.01.2026, Entwurf
    eines Berichts am 22.06.2026 eingereicht, Änderungsanträge im Ausschuss am 27.07.2026 eingebracht.
    Kein angenommener Ausschussbericht (kein A10-Dokument), keine Ausschussabstimmung, keine Plenarabstimmung,
    keine allgemeine Ausrichtung des Rates, kein Trilog, keine vorläufige Einigung. Auf Ratsseite sind
    über data.consilium.europa.eu nur Arbeitsdokumente zur Interinstitutionellen Akte 2025/0360 (COD)
    auf Arbeitsgruppenebene nachweisbar (WK 250/2026 vom 09.01.2026 bis WK 7876/2026 vom 04.06.2026).

    '
