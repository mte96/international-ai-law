  offene_punkte:
  - 'Der Sanktionsrahmen des Entwurfs ist aus dem Zweiten Kommissionsbericht nicht abschließend zu entnehmen;
    der Bericht nennt keine Bußgeldhöhen. Zu prüfen am Text des Oficio N° 20.843.

    '
  - 'Ob der Senat den Entwurf vor dem Ende der Legislaturperiode abschließt, ist offen. Der Entwurf liegt
    seit dem 14.10.2025 ohne Kommissionsbericht im Senat; die Urgencia „Simple“ vom 01.09.2026 setzt eine
    Frist von 30 Tagen, ist aber in Chile wiederholt verlängerbar und in der Praxis wenig verbindlich.

    '
  - 'Verhältnis zur Ley N° 21.719: Der Entwurf überträgt die Aufsicht der Datenschutzbehörde, die selbst
    erst am 01.12.2026 zu arbeiten beginnt. Ob die APDP die KI-Aufsicht personell und fachlich übernehmen
    kann, ist im Verfahren umstritten.

    '
