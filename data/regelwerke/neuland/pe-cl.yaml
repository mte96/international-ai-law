  kurztitel: Chilenische Cybersicherheitsbehörde (Agencia Nacional de Ciberseguridad)
  offizieller_titel: 'Agencia Nacional de Ciberseguridad (ANCI), errichtet durch Ley N° 21.663

    '
  fundstelle: Ley N° 21.663 (Diario Oficial Nr. 43.820 vom 08.04.2024), LeyChile idNorma 1202434.
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Errichtet und tätig. Nach ihrer eigenen Darstellung hat die Ley N° 21.663 die institutionelle
    Ordnung, die Grundsätze und die Normen der Cybersicherheit für die Staatsverwaltung zu bestimmen,
    Mindestanforderungen an die Vorfallbewältigung festzulegen und Pflichten für staatliche Stellen und
    private Betreiber kritischer Informationsinfrastruktur zu begründen.

    '
  kurzbeschreibung: 'Die ANCI ist derzeit die einzige chilenische Behörde mit technischer Aufsichtskompetenz
    über informationstechnische Systeme. Für KI ist sie mittelbar zuständig, soweit KI-Systeme essenzielle
    Dienste tragen; im KI-Gesetzentwurf ist sie dagegen nicht als KI-Aufsicht vorgesehen. Damit entsteht
    in Chile eine Doppelstruktur: technische Aufsicht bei der ANCI, KI- und Datenschutzaufsicht bei der
    APDP.

    '
  inkrafttreten:
    datum: 2024-04-08
    verifiziert: true
    quelle: https://anci.gob.cl/normativa/ley-marco-ciberseguridad/
