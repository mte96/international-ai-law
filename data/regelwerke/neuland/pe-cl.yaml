    verifiziert: true
    notiz: 'Amtlicher Volltext. Enthält das Dekret, das vollständige Reglamento mit sechs Titeln und 36
      Artikeln und die sechs Disposiciones Complementarias Finales.

      '
  offene_punkte:
  - 'Das genaue Datum des Inkrafttretens (90 días hábiles) ist berechnet, nicht amtlich belegt. Peru zählt
    die días hábiles ohne Samstage, Sonntage und die im Decreto Legislativo N.º 713 bzw. durch Sondergesetz
    bestimmten Feiertage; für 2025 kamen zusätzliche nichtarbeitsfreie Tage des öffentlichen Sektors hinzu,
    die die Zählung verschieben können. Zu verifizieren an einer amtlichen Verlautbarung der SGTD.

    '
  - 'Ob die nach der Zweiten Disposición Complementaria Final binnen 180 Werktagen zu erlassenden Ethik-Leitlinien
    der SGTD ergangen sind und ob die Estrategia Nacional de Inteligencia Artificial (ENIA) sowie die
    Estrategia Nacional de Gobierno de Datos (ENGD) binnen eines Jahres gebilligt wurden, konnte nicht
    geprüft werden — die Seiten der SGTD liegen auf www.gob.pe und waren nicht abrufbar.

    '
  - 'Das Reglamento enthält Verbote und Hochrisikokategorien, aber keine Sanktion. Ob eine Verordnung
    ohne gesetzliche Sanktionsermächtigung Verbote dieser Reichweite tragen kann, ist die zentrale offene
    Rechtsfrage des peruanischen KI-Rechts; die Ley N.º 31814 enthält keine entsprechende Ermächtigung.

    '
