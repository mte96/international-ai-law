  offizieller_titel: 'Decreto Legislativo N.º 1412, Ley de Gobierno Digital (Gesetzesdekret Nr. 1412,
    Gesetz über die digitale Regierung)

    '
  fundstelle: 'Decreto Legislativo N.º 1412. In den Considerandos des Decreto Supremo N.º 115-2025-PCM
    ausdrücklich als „Decreto Legislativo N° 1412 (Ley de Gobierno Digital)" zitiert.

    '
  verfahrensnummer: Decreto Legislativo N.º 1412
  status: anwendbar
  status_detail: 'Grundlage der digitalen Verwaltung Perus und die Norm, aus der die Zuständigkeit der
    Secretaría de Gobierno y Transformación Digital (SGTD) der Präsidialverwaltung folgt. Das KI-Reglamento
    stützt seine Governance-Architektur (Titel II, Art. 8-12) auf diese Norm.

    '
  kurzbeschreibung: 'Das Gesetzesdekret errichtet das Sistema Nacional de Transformación Digital, bestimmt
    die SGTD zur federführenden Stelle und regelt digitale Identität, digitale Dienste, Interoperabilität
    und digitale Sicherheit der Verwaltung. Für KI ist es die organisationsrechtliche Grundlage: Ohne
    das Gobierno-Digital-Recht gäbe es in Peru keine Behörde, der das KI-Reglamento die Aufsicht übertragen
    könnte.

    '
