- id: pe-ntp-normen
  jurisdiktion: pe
  kurztitel: Verbindliche technische Normen des peruanischen KI-Rechts (NTP-ISO/IEC)
  offizieller_titel: 'NTP-ISO/IEC 42001:2025 (Managementsystem für künstliche Intelligenz), NTP-ISO/IEC
    27002:2022 (Informationssicherheitsmaßnahmen), NTP-ISO 31000 (Risikomanagement) und ISO/IEC 23053:2022
    (Rahmenwerk für Systeme des maschinellen Lernens), in Bezug genommen durch das Reglamento der Ley
    N.º 31814

    '
  fundstelle: 'Art. 28, Art. 33 und Sexta Disposición Complementaria Final des durch Decreto Supremo N.º
    115-2025-PCM gebilligten Reglamento (Diario Oficial El Peruano vom 09.09.2025).

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Die peruanischen technischen Normen werden durch das KI-Reglamento rechtsverbindlich:
    Art. 28 verpflichtet öffentliche Stellen, ihre institutionelle KI-Richtlinie auf Grundlage der NTP-ISO/IEC
    42001:2025 zu erlassen; die Sechste Disposición Complementaria Final macht die jeweils geltenden NTP-ISO/IEC
    27002 und NTP-ISO 31000 für öffentliche Stellen zwingend; Art. 33 nennt für den Privatsektor NTP-ISO/IEC
    27002:2022, NTP-ISO/IEC 42001:2025 und ISO/IEC 23053:2022.

    '
  kurzbeschreibung: 'Peru verlagert die materielle Regelungsdichte des KI-Rechts in die technische Normung.
    Das ist der wichtigste strukturelle Unterschied zum chilenischen Entwurf, der die Anforderungen im
    Gesetz selbst formuliert. Praktisch bedeutet es: Wer in Peru wissen will, was eine öffentliche Stelle
    beim KI-Einsatz schuldet, muss die NTP-ISO/IEC 42001:2025 lesen, die kostenpflichtig bei INACAL zu
    beziehen ist — ein Zugangsproblem, das die Durchsetzbarkeit betrifft.

    '
  inkrafttreten:
    datum: 2026-01-20
    verifiziert: false
    quelle: https://busquedas.elperuano.pe/dispositivo/NL/2436426-1
  themenachsen:
  - governance
  - sektor-oeffentlich
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Art. 28 Reglamento: NTP-ISO/IEC 42001:2025 als Grundlage der institutionellen KI-Richtlinie öffentlicher
    Stellen.'
  - 'Art. 33 Reglamento: NTP-ISO/IEC 27002:2022, NTP-ISO/IEC 42001:2025 und ISO/IEC 23053:2022 für den
    Privatsektor.'
  - 'Sexta Disposición Complementaria Final: NTP-ISO/IEC 27002 und NTP-ISO 31000 in der jeweils geltenden
    Fassung zwingend für öffentliche Stellen — ein dynamischer Verweis.'
  dokumente:
  - datum: 2025-09-09
    typ: norm
    titel: Reglamento der Ley N.º 31814, Art. 28, Art. 33 und Sexta Disposición Complementaria Final (Normverweise)
    url: https://busquedas.elperuano.pe/dispositivo/NL/2436426-1
    sprache: es
    urheber: Presidencia del Consejo de Ministros / Diario Oficial El Peruano
    verifiziert: true
    notiz: Amtlicher Beleg für die Verbindlichkeit der technischen Normen.
  offene_punkte:
  - 'Die Normtexte selbst (NTP-ISO/IEC 42001:2025 usw.) sind nicht frei zugänglich; sie werden von INACAL
    vertrieben. Ein amtlicher Nachweis der Existenz und des Ausgabejahres der NTP-ISO/IEC 42001:2025 konnte
    nicht geführt werden — die Zitierung im Reglamento ist der einzige Beleg.

    '
  monitoring_quellen:
  - https://busquedas.elperuano.pe/dispositivo/NL/2436426-1
