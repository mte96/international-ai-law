  regelungsschwerpunkte:
  - 'Art. 8° bis (neue Fassung der Ley N° 19.628): „El titular de datos tiene derecho a oponerse y a no
    ser objeto de decisiones basadas en el tratamiento automatizado de sus datos personales, incluida
    la elaboración de perfiles, que produzca efectos jurídicos en él o le afecte significativamente."
    Ausnahmen bei Vertragserfüllung, ausdrücklicher Einwilligung und gesetzlicher Verpflichtung; in diesen
    Fällen muss der Verantwortliche „el derecho a obtener una explicación, a la intervención humana, a
    expresar su punto de vista y a solicitar la revisión de la decisión" sichern. Das ist die zentrale
    KI-Vorschrift des chilenischen Rechts ab dem 01.12.2026.

    '
  - 'Título I (Art. 4°–11°): Betroffenenrechte — Auskunft, Berichtigung, Löschung, Widerspruch, Datenübertragbarkeit,
    Sperrung.'
  - 'Art. 16 bis: Gesundheitsdaten und biologisches Profil; Art. 16 ter: biometrische Daten; Art. 16 quater:
    Kinder und Jugendliche; Art. 16 quinquies: historische, statistische und wissenschaftliche Zwecke;
    Art. 16 sexies: Geolokalisierungsdaten.'
  - 'Título III (Art. 17°–19°): Daten über finanzielle und wirtschaftliche Verpflichtungen — das chilenische
    DICOM-Recht, das in der Praxis die meisten Scoring-Fälle trägt.'
  - 'Título IV (Art. 20°–22°): Verarbeitung durch Organe der Staatsverwaltung.'
  - 'Registro Nacional de Sanciones y Cumplimiento: öffentliches Register der verhängten Sanktionen (Art.
    39 der neuen Fassung).'
  - 'Artículo sexto transitorio: Verwarnung statt Geldbuße gegenüber Kleinunternehmen in den ersten zwölf
    Monaten.'
  - 'Artículo tercero transitorio: Das Servicio de Registro Civil e Identificación hat das nach dem geltenden
    Art. 22 Ley 19.628 geführte Register der Datenbanken binnen 60 Tagen vor Inkrafttreten zu löschen.'
  dokumente:
  - datum: 2024-12-13
