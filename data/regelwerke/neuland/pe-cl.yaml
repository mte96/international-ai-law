- id: cl-apdp
  jurisdiktion: cl
  kurztitel: Chilenische Datenschutzbehörde (Agencia de Protección de Datos Personales)
  offizieller_titel: 'Agencia de Protección de Datos Personales (Behörde für den Schutz personenbezogener
    Daten), errichtet durch Ley N° 21.719

    '
  fundstelle: Ley N° 21.719 (Diario Oficial vom 13.12.2024), LeyChile idNorma 1209272.
  verfahrensnummer: null
  status: verabschiedet
  status_detail: 'Die Behörde ist gesetzlich errichtet, nimmt ihre Tätigkeit aber erst mit dem Inkrafttreten
    der Ley N° 21.719 am 01.12.2026 auf. Nach dem Artículo cuarto transitorio waren die ersten Direktoren
    des Consejo Directivo sechs Monate vor dem Inkrafttreten — also bis zum 01.06.2026 — zu bestellen;
    die Amtszeiten sind auf zwei, vier und sechs Jahre gestaffelt, die Bestellung bedarf der Zustimmung
    des Senats. Der chilenische KI-Gesetzentwurf (Boletín 15869-19/16821-19) weist derselben Behörde die
    KI-Aufsicht zu.

    '
  kurzbeschreibung: 'Die APDP ist die erste unabhängige Datenschutzbehörde Chiles. Sie erhält Untersuchungs-,
    Anordnungs- und Bußgeldbefugnisse und führt das Registro Nacional de Sanciones y Cumplimiento. Für
    die KI-Regulierung ist sie doppelt wichtig: Sie vollzieht ab dem 01.12.2026 den Art. 8° bis über automatisierte
    Einzelentscheidungen, und sie soll nach dem Gesetzentwurf zugleich die KI-Aufsicht übernehmen. Ob
    eine erst aufzubauende Behörde beides leisten kann, ist im Verfahren umstritten.

    '
  inkrafttreten:
    datum: 2026-12-01
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
