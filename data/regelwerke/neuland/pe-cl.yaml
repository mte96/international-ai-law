  - datum: 2026-12-01
    was_gilt: 'Die durch Ley N° 21.719 beschlossene Neufassung tritt an die Stelle des heutigen Textes;
      die Ley N° 19.628 bleibt als Gesetzeskörper bestehen, wird aber materiell vollständig ausgetauscht.

      '
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
  themenachsen:
