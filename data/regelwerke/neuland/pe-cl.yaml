  offene_punkte:
  - 'Die „Circular de IA“ für den öffentlichen Dienst ist auf der amtlichen Seite genannt, aber nicht
    verlinkt. Ihre Fundstelle, ihr Datum und ihr Urheber (Wissenschaftsministerium oder MINSEGPRES) sind
    zu klären. Sie wäre das einzige verbindlichere KI-Instrument, das in Chile heute schon gilt.

    '
