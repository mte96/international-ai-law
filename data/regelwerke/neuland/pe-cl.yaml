- id: cl-ley-20393
  jurisdiktion: cl
  kurztitel: Strafrechtliche Verantwortlichkeit juristischer Personen (Ley N° 20.393)
  offizieller_titel: 'Ley N° 20.393, Establece la responsabilidad penal de las personas jurídicas en los
    delitos que indica (Gesetz Nr. 20.393 über die strafrechtliche Verantwortlichkeit juristischer Personen
    bei den genannten Straftaten)

    '
  fundstelle: 'Diario Oficial vom 02.12.2009. LeyChile idNorma 1008668; konsolidierte Fassung mit Versionsdatum
    17.08.2023 — dem Tag, an dem die Ley N° 21.595 über Wirtschaftsstraftaten den Katalog der Anknüpfungstaten
    grundlegend erweitert hat.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft, seit 2023 in erheblich erweiterter Fassung. Für KI ist das Gesetz die Norm,
    über die Unternehmen für Taten haften, die mit oder durch KI-Systeme begangen werden — namentlich
    für die Computerstraftaten der Ley N° 21.459 (Computerbetrug, Datenfälschung), soweit sie im Anknüpfungskatalog
    stehen. Es begründet zugleich die Pflicht, ein Präventionsmodell zu unterhalten; bei KI-gestützten
    Prozessen wird daraus faktisch eine Compliance-Pflicht für algorithmische Systeme.

    '
  kurzbeschreibung: 'Die Ley N° 20.393 macht juristische Personen für bestimmte Straftaten ihrer Leitungspersonen
    und Beschäftigten strafrechtlich verantwortlich und knüpft die Entlastung an ein wirksames Präventionsmodell.
    Nach der Erweiterung durch die Ley N° 21.595 (Wirtschaftsstraftaten, wirksam seit 2023/2024) ist der
    Anknüpfungskatalog stark ausgeweitet. Das ist der chilenische Weg, algorithmische Fehlsteuerung in
    Unternehmen zu sanktionieren, solange es kein KI-Gesetz gibt.

    '
  inkrafttreten:
    datum: 2009-12-02
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1008668
  anwendungsdaten:
