  offene_punkte:
  - 'Das Versionsdatum der konsolidierten Fassung ist der 05.02.2026. Welche Norm die Ley N° 21.719 zwischen
    ihrer Veröffentlichung und diesem Datum geändert hat, konnte nicht geklärt werden. Das ist der erste
    Punkt, den der nächste Bearbeiter anfassen sollte, weil eine Änderung kurz vor dem Inkrafttreten auch
    die Fristen berühren kann.

    '
  - 'Ob die nach dem Artículo segundo transitorio bis zum 13.06.2025 zu erlassenden Reglamentos tatsächlich
    ergangen sind, konnte nicht verifiziert werden.

    '
  - 'Der Auftrag nennt „Inkrafttreten Dezember 2026“. Der Normwortlaut ergibt den 01.12.2026 (erster Tag
    des vierundzwanzigsten Monats nach der Publikation), nicht den 13.12.2026.

    '
