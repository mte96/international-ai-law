- id: cl-ley-17336
  jurisdiktion: cl
  kurztitel: Chilenisches Urheberrechtsgesetz (Ley N° 17.336)
  offizieller_titel: 'Ley N° 17.336, Propiedad intelectual (Gesetz Nr. 17.336 über geistiges Eigentum)

    '
  fundstelle: 'Diario Oficial vom 02.10.1970; promulgiert am 28.08.1970; Ministerio de Educación Pública.
    LeyChile idNorma 28933.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes chilenisches Urheberrecht. Es enthält KEINE Vorschrift zu computergenerierten
    Werken und KEINE Text- und Data-Mining-Ausnahme. Computerprogramme sind nach Art. 3 Nr. 16 geschützt;
    Art. 8 weist die Rechte an Computerprogrammen, die Beschäftigte in Ausübung ihrer Tätigkeit schaffen,
    den natürlichen oder juristischen Personen zu, für die sie tätig sind. Für KI-Training gibt es damit
    weder eine ausdrückliche Erlaubnis noch ein ausdrückliches Verbot.

    '
  kurzbeschreibung: 'Das Gesetz schützt die Rechte, die Urheber allein durch die Schöpfung des Werkes
    erwerben (Art. 1), zählt in Art. 3 die geschützten Werkarten auf (Nr. 16: programas computacionales)
    und regelt in Art. 8 die Urheberschaftsvermutung mit der besonderen Zuweisung für Computerprogramme.
    Die Schrankenregelungen stehen in den Art. 71 A ff., die durch die Ley N° 20.435 von 2010 eingefügt
    wurden; eine Schranke für Text- und Data-Mining ist darunter nicht. Für Chile bedeutet das: Das Training
    generativer Modelle an geschützten Werken ist weder erlaubt noch ausdrücklich untersagt, und die Frage
    der Urheberschaft an KI-Ausgaben ist gesetzlich nicht geregelt.

    '
  inkrafttreten:
    datum: 1970-10-02
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=28933
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - 'Art. 1: Schutz kraft Schöpfung, ohne Registrierungserfordernis.'
  - 'Art. 3 Nr. 16: Computerprogramme als geschützte Werkart.'
  - 'Art. 8: Urheberschaftsvermutung; Sonderregel für Computerprogramme, die Beschäftigte in Ausübung
    ihrer Tätigkeit schaffen.'
  - 'Art. 71 A ff. (eingefügt durch Ley N° 20.435 von 2010): Schrankenkatalog. Keine Text- und Data-Mining-Schranke.'
  - Keine Vorschrift zu computergenerierten oder KI-erzeugten Werken.
