  offizieller_titel: 'Decreto Legislativo N.º 822, Ley sobre el Derecho de Autor (Gesetzesdekret Nr. 822,
    Gesetz über das Urheberrecht)

    '
  fundstelle: Decreto Legislativo N.º 822. Vollzug durch INDECOPI.
  verfahrensnummer: Decreto Legislativo N.º 822
  status: anwendbar
  status_detail: 'Geltendes peruanisches Urheberrecht. Es ist die Norm, an der sich die urheberrechtliche
    Seite des KI-Trainings und der KI-Ausgaben in Peru entscheidet. Das KI-Reglamento nimmt darauf mittelbar
    Bezug: Nach Art. 34 des Reglamento eskaliert die SGTD Verstöße, die geistiges Eigentum oder den Datenschutz
    berühren, an die zuständigen Stellen — für das geistige Eigentum ist das INDECOPI. Der Grundsatz des
    Schutzes der Urheberschaft steht zudem unter den Leitprinzipien des Art. 7 des Reglamento.

    '
  kurzbeschreibung: 'Das Gesetzesdekret regelt Urheberrecht und verwandte Schutzrechte in Peru und wird
    von INDECOPI vollzogen. Eine ausdrückliche Schranke für Text- und Data-Mining ist in Peru nicht bekannt;
    eine Regelung zu computergenerierten Werken ebenfalls nicht. Beides konnte nicht am Normtext geprüft
    werden.

    '
