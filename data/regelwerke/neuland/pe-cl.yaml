- id: pe-anpdp
  jurisdiktion: pe
  kurztitel: Peruanische Datenschutzbehörde (Autoridad Nacional de Protección de Datos Personales)
  offizieller_titel: 'Autoridad Nacional de Protección de Datos Personales (ANPDP) beim Ministerio de
    Justicia y Derechos Humanos, Rechtsgrundlage Ley N.º 29733

    '
  fundstelle: 'Ley N.º 29733 nebst Reglamento Decreto Supremo N.º 016-2024-JUS; im Reglamento der Ley
    N.º 31814 (Art. 36) ausdrücklich als Anlaufstelle für Betroffene genannt.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Bestehende Behörde mit Untersuchungs- und Sanktionsbefugnis im Datenschutzrecht. Nach
    Art. 36 des KI-Reglamento können sich Betroffene an sie wenden; nach Art. 34 eskaliert die SGTD Verstöße
    mit Datenschutzbezug an sie. Sie ist damit die einzige peruanische Stelle, die einen KI-Sachverhalt
    mit einer Sanktion beenden kann — allerdings nur über die datenschutzrechtliche Brücke.

    '
  kurzbeschreibung: 'Die ANPDP ist Teil des Justizministeriums und nicht unabhängig. Ihre Zuständigkeit
    für KI ist nicht eigenständig geregelt, sondern folgt aus dem Verweis des Art. 26 des KI-Reglamento
    auf die Ley N.º 29733 und aus der Anlaufstellenregelung des Art. 36. Der Auftrag dieser Recherche
    nennt „Richtlinien der ANPDP zu automatisierten Entscheidungen“; solche Richtlinien konnten nicht
    belegt werden.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
