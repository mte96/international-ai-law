  kurztitel: Peruanisches Verwaltungsverfahrensgesetz (Ley N.º 27444, TUO DS N.º 004-2019-JUS)
  offizieller_titel: 'Texto Único Ordenado de la Ley N.º 27444, Ley del Procedimiento Administrativo General,
    aprobado por Decreto Supremo N.º 004-2019-JUS (Einheitlicher Text des Gesetzes Nr. 27444 über das
    allgemeine Verwaltungsverfahren)

    '
  fundstelle: 'In den Considerandos des Decreto Supremo N.º 115-2025-PCM über den Verweis auf das Decreto
    Supremo N.º 004-2019-JUS zitiert.

    '
  verfahrensnummer: 'Ley N.º 27444; TUO: Decreto Supremo N.º 004-2019-JUS'
  status: anwendbar
  status_detail: 'Allgemeines Verwaltungsverfahrensrecht Perus. Es ist die Norm, an der automatisierte
    Verwaltungsentscheidungen in Peru zu messen sind: Begründungspflicht, Anspruch auf rechtliches Gehör
    und Rechtsbehelfe gelten unabhängig davon, ob ein Algorithmus die Entscheidung vorbereitet. Das KI-Reglamento
    verlangt in Art. 28 für hochriskante Anwendungen öffentlicher Stellen ausdrücklich menschliche Aufsicht
    und die Fähigkeit des Personals, das System anzuhalten — das ist die verwaltungsrechtliche Absicherung
    dieser Grundsätze.

    '
  kurzbeschreibung: 'Das Gesetz regelt Verfahrensgrundsätze, Verwaltungsakt, Begründung, Rechtsbehelfe
    und Verwaltungssanktionen. Für KI ist es doppelt einschlägig: als Maßstab für algorithmisch vorbereitete
    Entscheidungen und als Rahmen für jedes Sanktionsverfahren, das eine peruanische Behörde wegen eines
    KI-Verstoßes führen wollte — wobei das KI-Recht selbst keine Sanktion vorsieht.

    '
