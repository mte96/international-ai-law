  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  - arbeit
  - content
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Art. 23 (Verbotene Nutzungen): manipulative oder täuschende Beeinflussung von Entscheidungen; autonome
    tödliche Wirkung ohne menschliche Aufsicht; Massenüberwachung ohne Rechtsgrundlage; Diskriminierung
    anhand sensibler Merkmale (Rasse, Religion, Sexualität); Gesichtserkennung in Echtzeit im öffentlichen
    Raum, mit Ausnahmen für Authentifizierung und für die Ermittlung schwerer Straftaten. Leitsatz: Systeme
    mit irreversiblen, erheblichen und negativen Auswirkungen auf Grundrechte sind verboten.

    '
  - 'Art. 24 (Hochrisikonutzungen): kritische nationale Infrastruktur; Bewertung von Schülerinnen und
    Schülern ohne menschliche Validierung; Personalauswahl und Kündigungen; Sozialleistungsprogramme;
    Kreditvergabe (außer Betrugserkennung); Gesundheitsentscheidungen; Emotionserkennung am Arbeitsplatz.

    '
  - 'Art. 25 (Transparenz und Kennzeichnung): vorherige Information über Zweck, Funktionen und Entscheidungsarten;
    bei Grundrechtsbetroffenheit eine Erklärungspflicht; sichtbare Kennzeichnung, dass ein Produkt oder
    ein Dienst KI-gestützt ist, mit Ausnahmen für interne Verwaltungsprozesse.

    '
  - 'Art. 26: Verweis auf die Ley N.º 29733 (Datenschutz). Art. 27: Ethik, diverse Entwicklungsteams,
    Bias-Vermeidung, Umweltauswirkungen.'
  - 'Art. 28-30 (öffentliche Stellen): institutionelle KI-Richtlinie auf Grundlage der NTP-ISO/IEC 42001:2025;
    multidisziplinäre Teams; Veröffentlichung des Quellcodes auf der Plataforma Nacional de Software Público
    (PNSSP) unter transparenter Lizenz; Schulung des Personals mit der Fähigkeit, ein System anzuhalten;
    menschliche Aufsicht bei Hochrisikoentscheidungen; Risikomanagement, Privacy by Design, Sicherheitsaudits
    vor und während des Betriebs, Vorfallmanagement; Folgenabschätzung vor Einführung eines Hochrisikosystems.

    '
  - 'Art. 31-33 (Privatsektor): Register über Funktionsweise, Datenquellen und Algorithmuslogik; klare
    Richtlinien zu Sicherheit, Transparenz und Verantwortung; Schulung; menschliche Aufsicht bei Hochrisikosystemen;
    freiwillige Folgenabschätzung mit Dokumentation und mindestens dreijähriger Aufbewahrung; Bezugnahme
    auf NTP-ISO/IEC 27002:2022, NTP-ISO/IEC 42001:2025 und ISO/IEC 23053:2022.

    '
  - 'Art. 34-36 (Aufsicht): Die SGTD überwacht Umsetzung, Entwicklung und Einsatz verbotener und hochriskanter
    Systeme, fordert Auskünfte an, arbeitet mit CSIRT-Teams zusammen und meldet Verstöße der Contraloría
    General de la República; Bürgerinnen und Bürger können sich über www.gob.pe/iaperu beschweren und
    werden an INDECOPI, die Cybercrime-Abteilung und die ANPDP verwiesen.

    '
  - 'Sechste Disposición Complementaria Final: Für öffentliche Stellen sind die jeweils geltenden NTP-ISO/IEC
    27002 und NTP-ISO 31000 verbindlich.

    '
  - 'Zweite Disposición Complementaria Final: Die SGTD erlässt Durchführungsnormen durch Resolución Secretarial;
    Ethik-Leitlinien binnen 180 Werktagen.

    '
  - 'Derogatoria: Aufhebung der Resolución Ministerial N.º 246-2007-PCM.'
