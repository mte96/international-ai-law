- id: cl-ley-21663
  jurisdiktion: cl
  kurztitel: Chilenisches Cybersicherheitsrahmengesetz (Ley N° 21.663)
  offizieller_titel: 'Ley N° 21.663, Ley Marco de Ciberseguridad e Infraestructura Crítica de la Información
    (Rahmengesetz Nr. 21.663 über Cybersicherheit und kritische Informationsinfrastruktur)

    '
  fundstelle: 'Diario Oficial de la República de Chile Nr. 43.820 vom 08.04.2024, Abschnitt 01, CVE 2475674.
    LeyChile idNorma 1202434.

    '
  verfahrensnummer: Boletín N° 14847-06 (Mensaje, Senado, eingebracht 15.03.2022)
  status: anwendbar
  status_detail: 'Verkündet und im Diario Oficial vom 08.04.2024 veröffentlicht. Nach der Selbstdarstellung
    der durch das Gesetz errichteten Agencia Nacional de Ciberseguridad (ANCI) verfolgt es drei Ziele:
    die institutionelle Ordnung, die Grundsätze und die Normen der Cybersicherheit für die Staatsverwaltung
    zu bestimmen, Mindestanforderungen an die Bewältigung von Sicherheitsvorfällen festzulegen und Pflichten
    für staatliche Stellen und private Betreiber kritischer Infrastruktur zu begründen.

    '
  kurzbeschreibung: 'Das Gesetz errichtet die Agencia Nacional de Ciberseguridad als Aufsichtsbehörde,
    definiert „servicios esenciales“ und „operadores de importancia vital" und verpflichtet diese zu Risikomanagement,
    Sicherheitsmaßnahmen und zur Meldung erheblicher Sicherheitsvorfälle. Für KI ist es aus zwei Gründen
    einschlägig: Erstens fallen KI-gestützte Systeme, die essenzielle Dienste tragen, unter die Pflichtenordnung;
    zweitens ist die ANCI neben der künftigen Datenschutzbehörde die einzige chilenische Behörde mit technischer
    Aufsichtskompetenz über algorithmische Systeme — sie ist im KI-Gesetzentwurf aber gerade NICHT als
    KI-Aufsicht vorgesehen.

    '
  inkrafttreten:
    datum: 2024-04-08
    verifiziert: true
