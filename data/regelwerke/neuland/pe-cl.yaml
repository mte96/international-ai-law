  jurisdiktion: cl
  kurztitel: Digitale Transformation des Staates (Ley N° 21.180)
  offizieller_titel: 'Ley N° 21.180, Transformación digital del Estado (Gesetz Nr. 21.180 über die digitale
    Transformation des Staates)

    '
  fundstelle: 'Diario Oficial de la República de Chile Nr. 42.499 vom 11.11.2019; promulgiert am 25.10.2019;
    Ministerio Secretaría General de la Presidencia. LeyChile idNorma 1138479.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. Das Gesetz ändert die Ley N° 19.880 und stellt das Verwaltungsverfahren auf
    elektronische Dokumente, elektronische Akten und elektronische Signatur um. Es sieht ein gestaffeltes
    Inkrafttreten nach Behördengruppen vor, das mehrfach verlängert wurde; die genauen Stufen konnten
    nicht ausgelesen werden.

    '
  kurzbeschreibung: 'Die Ley N° 21.180 ist die Grundlage der digitalen Verwaltung in Chile. Sie macht
    das elektronische Verfahren zum Regelfall, führt die elektronische Akte ein und verpflichtet die Behörden
    zu Interoperabilität. Für KI ist sie der Rahmen, in dem Verwaltungsalgorithmen überhaupt eingesetzt
    werden: Wo das Verfahren elektronisch geführt wird, entsteht die Datengrundlage für automatisierte
    Vorentscheidungen; die materiellen Grenzen (Begründung, Transparenz, Rechtsbehelf) bleiben die der
    Ley N° 19.880.

    '
  inkrafttreten:
    datum: 2019-11-11
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1138479
