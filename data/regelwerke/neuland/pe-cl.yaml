  kurztitel: Peruanisches Datenschutzgesetz (Ley N.º 29733)
  offizieller_titel: 'Ley N.º 29733, Ley de Protección de Datos Personales (Gesetz Nr. 29733 über den
    Schutz personenbezogener Daten)

    '
  fundstelle: 'Ley N.º 29733. Im Decreto Supremo N.º 115-2025-PCM als „Ley N° 29733, Protección de Datos
    Personales" zitiert.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes peruanisches Datenschutzrecht. Art. 26 des Reglamento zur Ley N.º 31814 verweist
    für die Verarbeitung personenbezogener Daten durch KI-Systeme ausdrücklich auf dieses Gesetz; die
    Autoridad Nacional de Protección de Datos Personales ist nach Art. 36 des Reglamento eine der Stellen,
    an die sich Betroffene wenden können. Damit ist die Ley N.º 29733 — nicht das KI-Gesetz — die Norm,
    an der KI-Sachverhalte in Peru tatsächlich durchgesetzt werden, weil nur sie ein Sanktionsregime kennt.

    '
  kurzbeschreibung: 'Das Gesetz regelt die Verarbeitung personenbezogener Daten durch private und öffentliche
    Stellen in Peru, richtet die Autoridad Nacional de Protección de Datos Personales beim Justizministerium
    ein und stattet sie mit Untersuchungs- und Bußgeldbefugnissen aus. Die Durchführungsverordnung wurde
    2024 durch das Decreto Supremo N.º 016-2024-JUS neu gefasst. Für KI ist das Gesetz aus drei Gründen
    die Kernnorm: Es ist die einzige peruanische Norm mit Sanktionen im Datenbereich, seine Behörde ist
    die einzige mit einschlägiger Aufsichtserfahrung, und das KI-Reglamento verweist selbst auf sie.

    '
