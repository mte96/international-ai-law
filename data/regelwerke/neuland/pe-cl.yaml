- id: cl-ley-21459
  jurisdiktion: cl
  kurztitel: Chilenisches Computerstrafrecht (Ley N° 21.459)
  offizieller_titel: 'Ley N° 21.459, Establece normas sobre delitos informáticos, deroga la ley N° 19.223
    y modifica otros cuerpos legales con el objeto de adecuarlos al Convenio de Budapest (Gesetz Nr. 21.459
    über Computerstraftaten, Aufhebung des Gesetzes Nr. 19.223 und Anpassung weiterer Gesetze an das Budapester
    Übereinkommen)

    '
  fundstelle: 'Diario Oficial de la República de Chile Nr. 43.283 vom 20.06.2022; promulgiert am 09.06.2022;
    Ministerio de Justicia y Derechos Humanos. LeyChile idNorma 1177743.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 2022. Das Gesetz ist die strafrechtliche Auffangebene für KI-Sachverhalte
    in Chile: Es erfasst den durch Datenmanipulation begangenen Betrug (Art. 7 fraude informático), die
    Datenfälschung (Art. 5 falsificación informática) und den Missbrauch von Werkzeugen (Art. 8), enthält
    aber KEINEN eigenen Deepfake- oder Identitätsmissbrauchstatbestand.

    '
  kurzbeschreibung: 'Das Gesetz setzt das Budapester Übereinkommen um und schafft acht Straftatbestände.
    Für KI sind vor allem drei bedeutsam: Art. 5 (falsificación informática — Einführen oder Verändern
    von Daten mit der Absicht, dass sie als echt genommen werden; qualifiziert bei Amtsträgern), Art.
    7 (fraude informático — Manipulation eines informatischen Systems zur Erlangung eines Vermögensvorteils
    unter Schädigung eines anderen, mit vier nach der Schadenshöhe gestaffelten Strafrahmen) und Art.
    8 (Abgabe, Beschaffung, Einfuhr oder Verbreitung von Vorrichtungen, Programmen, Passwörtern oder Codes,
    die vorwiegend zur Begehung der Taten geschaffen wurden). Art. 2 enthält eine Verantwortungsausnahme
    für registrierte Cybersicherheitsfachleute unter sieben Bedingungen. Art. 12 erlaubt verdeckte Online-Ermittlungen
    unter Richtervorbehalt, Art. 14 regelt die Sicherung elektronischer Beweismittel nach Weisung des
    Fiscal Nacional.

    '
  inkrafttreten:
    datum: 2022-06-20
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1177743
  themenachsen:
  - content
  - sicherheit-export
  - haftung
  regelungsschwerpunkte:
  - 'Art. 1: Angriff auf die Systemintegrität (presidio menor en sus grados medio a máximo).'
  - 'Art. 2: Unbefugter Zugang; Verantwortungsausnahme für registrierte Cybersicherheitsfachleute unter
    sieben Bedingungen.'
  - 'Art. 3: Unbefugtes Abfangen, auch durch Erfassung elektromagnetischer Abstrahlung.'
  - 'Art. 4: Angriff auf die Datenintegrität, wenn ein schwerer Schaden entsteht.'
  - 'Art. 5: Datenfälschung — Einführen oder Verändern von Daten mit der Absicht, dass sie als echt genommen
    werden. Das ist die Norm, unter der manipulierte KI-Ausgaben in Chile strafrechtlich erfasst werden
    können, solange kein eigener Deepfake-Tatbestand besteht.

    '
  - 'Art. 6: Hehlerei an rechtswidrig erlangten Daten; Strafe des Grunddelikts, um einen Grad gemildert.'
  - 'Art. 7: Computerbetrug mit vier nach dem Schaden gestaffelten Strafrahmen (bis 4 UTM; 4 bis 40 UTM;
    über 40 UTM; über 400 UTM).

    '
  - 'Art. 8: Missbrauch von Vorrichtungen und Programmen.'
  - 'Art. 12: verdeckte Online-Ermittlungen unter Richtervorbehalt mit Strafausschluss für notwendige
    Begleittaten. Art. 14: Sicherung elektronischer Beweismittel.'
  dokumente:
  - datum: 2022-06-20
    typ: konsolidiert
    titel: Ley N° 21.459 — konsolidierte Fassung in LeyChile
    url: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1177743
    sprache: es
    urheber: Biblioteca del Congreso Nacional de Chile
