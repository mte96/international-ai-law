- id: cl-ley-19628
  jurisdiktion: cl
  kurztitel: Altes chilenisches Datenschutzgesetz (Ley N° 19.628)
  offizieller_titel: 'Ley N° 19.628, Sobre protección de la vida privada (Gesetz Nr. 19.628 über den Schutz
    des Privatlebens)

    '
  fundstelle: 'Diario Oficial vom 28.08.1999; promulgiert am 18.08.1999; Ministerio Secretaría General
    de la Presidencia. LeyChile idNorma 141599. Im Sprachgebrauch „Ley DICOM“.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Bis zum 30.11.2026 das geltende chilenische Datenschutzrecht. Es kennt keine Aufsichtsbehörde,
    keine Bußgelder und keine Vorschrift zu automatisierten Entscheidungen; durchgesetzt wird es über
    den Zivilrechtsweg (Art. 23: Schadensersatz) und über den Verfassungsbeschwerdeweg (recurso de protección,
    Art. 20 der Verfassung, in Verbindung mit Art. 19 Nr. 4 in der Fassung der Ley N° 21.096). Ab dem
    01.12.2026 wird es durch die Neufassung nach Ley N° 21.719 ersetzt.

    '
  kurzbeschreibung: 'Das Gesetz regelt die Verarbeitung personenbezogener Daten durch private und öffentliche
    Stellen. Es folgt einem Einwilligungsmodell (Art. 4), gibt den Betroffenen Auskunfts-, Berichtigungs-,
    Lösch- und Sperrrechte (Art. 12–16), enthält ein eigenes Regime für Wirtschafts-, Finanz- und Handelsdaten
    (Art. 17–19) und regelt die Verarbeitung durch Behörden (Art. 20–22). Für KI-Sachverhalte ist es die
    heute maßgebliche Norm — mit der Besonderheit, dass es weder eine Rechtsgrundlage für algorithmische
    Transparenz noch eine Behörde kennt, die sie durchsetzen könnte. Deshalb werden algorithmische Streitfälle
    in Chile bislang über den recurso de protección und über das Verbraucherrecht geführt.

    '
  inkrafttreten:
    datum: 1999-08-28
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=141599
