  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Art. 1–3: Grundsätze der Verarbeitung.'
  - 'Art. 4–11: Zulässigkeit der Verarbeitung; Einwilligungsmodell.'
  - 'Art. 12–16: Rechte der Betroffenen (Auskunft, Berichtigung, Löschung, Sperrung).'
  - 'Art. 17–19: Wirtschafts-, Finanz- und Handelsdaten (DICOM-Regime) — praktisch der wichtigste Anwendungsbereich,
    weil hier Scoring stattfindet.'
  - 'Art. 20–22: Verarbeitung durch Organe der Staatsverwaltung; Art. 22 verpflichtet zur Führung eines
    Registers der Datenbanken beim Registro Civil.'
  - 'Art. 23: Haftung auf Schadensersatz einschließlich immateriellen Schadens — die einzige Sanktion
    des geltenden Rechts.'
