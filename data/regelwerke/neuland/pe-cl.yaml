  jurisdiktion: pe
  kurztitel: INDECOPI als KI-Beschwerdestelle (Verbraucherschutz und geistiges Eigentum)
  offizieller_titel: 'Instituto Nacional de Defensa de la Competencia y de la Protección de la Propiedad
    Intelectual (INDECOPI)

    '
  fundstelle: 'Im Reglamento der Ley N.º 31814 (Art. 34 und 36) ausdrücklich als Eskalations- und Anlaufstelle
    genannt.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Bestehende Behörde. Nach Art. 36 des KI-Reglamento können sich Betroffene bei INDECOPI
    beschweren; nach Art. 34 eskaliert die SGTD Verstöße mit Bezug zum geistigen Eigentum dorthin. INDECOPI
    vollzieht zugleich das Urheberrecht (Decreto Legislativo N.º 822) und das Verbraucherschutzrecht und
    ist damit für KI in Peru doppelt zuständig: für Trainingsdaten- und Ausgabenstreitigkeiten und für
    algorithmische Praktiken gegenüber Verbrauchern.

    '
  kurzbeschreibung: 'INDECOPI ist die peruanische Parallele zum chilenischen SERNAC, verbunden mit einer
    Urheberrechtsbehörde. Weil das peruanische KI-Recht keine eigenen Sanktionen kennt, ist INDECOPI neben
    der ANPDP die Stelle, bei der KI-Sachverhalte tatsächlich durchgesetzt werden.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://busquedas.elperuano.pe/dispositivo/NL/2436426-1
