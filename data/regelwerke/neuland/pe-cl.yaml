- id: pe-ley-31814
  jurisdiktion: pe
  kurztitel: Peruanisches KI-Gesetz (Ley N.º 31814)
  offizieller_titel: 'Ley N.º 31814, Ley que promueve el uso de la inteligencia artificial en favor del
    desarrollo económico y social del país (Gesetz Nr. 31814 zur Förderung der Nutzung künstlicher Intelligenz
    zugunsten der wirtschaftlichen und sozialen Entwicklung des Landes)

    '
  fundstelle: 'Ley N.º 31814, Congreso de la República del Perú; veröffentlicht im Diario Oficial El Peruano.
    Der amtliche Titel ist im Titel des Decreto Supremo N.º 115-2025-PCM wörtlich wiedergegeben und dort
    verifiziert.

    '
  verfahrensnummer: Ley N.º 31814
  status: anwendbar
  status_detail: 'Erstes KI-Gesetz Lateinamerikas. In Kraft; seit dem Erlass der Durchführungsverordnung
    Decreto Supremo N.º 115-2025-PCM (veröffentlicht am 09.09.2025) auch untergesetzlich ausgeformt. Das
    Gesetz selbst ist ein Förder- und Organisationsgesetz: Es erklärt die Förderung der Nutzung von KI
    zum nationalen Interesse, benennt Leitprinzipien und weist der Präsidialverwaltung (PCM) über die
    Secretaría de Gobierno y Transformación Digital die Zuständigkeit zu. Es enthält KEINEN Verbotskatalog,
    KEINE Risikoklassifizierung und KEINEN Bußgeldrahmen — diese Elemente hat erst das Reglamento von
    2025 nachgeliefert, ohne dass ihm eine eigene Sanktionsermächtigung zur Seite stünde.

    '
  kurzbeschreibung: 'Das Gesetz erklärt die Förderung der Nutzung künstlicher Intelligenz zur Stärkung
    der wirtschaftlichen und sozialen Entwicklung Perus zum nationalen Interesse. Es adressiert öffentliche
    Stellen, Privatwirtschaft, Hochschulen und Zivilgesellschaft, benennt Grundsätze (unter anderem Nichtdiskriminierung,
    Datenschutz, Schutz der Grundrechte, Sicherheit, Transparenz, menschliche Aufsicht, Nachhaltigkeit)
    und macht die Presidencia del Consejo de Ministros über die Secretaría de Gobierno y Transformación
    Digital zur nationalen Behörde. Sanktionen sieht das Gesetz nicht vor; wer gegen die Vorgaben verstößt,
    wird nach dem Reglamento an die allgemeinen Behörden verwiesen — an INDECOPI (Verbraucherschutz und
    geistiges Eigentum), an die Autoridad Nacional de Protección de Datos Personales, an die Contraloría
    General de la República und an die Polizei (Delitos informáticos).

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://busquedas.elperuano.pe/dispositivo/NL/2436426-1
  themenachsen:
  - governance
  - grundrechte
  - sektor-oeffentlich
  - datenschutz
  - marktzugang
  regelungsschwerpunkte:
  - 'Förderrechtlicher, nicht risikobasierter Ansatz: Zweck ist die Förderung der KI-Nutzung, nicht deren
    Beschränkung.'
  - 'Zuständige Behörde: Presidencia del Consejo de Ministros (PCM) über die Secretaría de Gobierno y
    Transformación Digital (SGTD) — im Reglamento, Art. 8, bestätigt und ausgestaltet.'
  - Keine eigene Sanktionsnorm. Die Durchsetzung des Reglamento läuft über Anzeigen an INDECOPI, die ANPDP,
    die Contraloría und die Polizei (Reglamento, Art. 34 und 36).
  - Das Gesetz ist der Anknüpfungspunkt für die Estrategia Nacional de Inteligencia Artificial (ENIA)
    bis 2030, die nach der Cuarta Disposición Complementaria Final des Reglamento von der SGTD auszuarbeiten
    und von der PCM zu billigen ist.
  dokumente:
  - datum: 2025-09-09
    typ: konsolidiert
    titel: 'Decreto Supremo N.º 115-2025-PCM (enthält im Titel und in den Considerandos die amtliche Bezeichnung
      der Ley N.º 31814)

      '
    url: https://busquedas.elperuano.pe/dispositivo/NL/2436426-1
    sprache: es
    urheber: Diario Oficial El Peruano / Presidencia del Consejo de Ministros
    verifiziert: true
    notiz: 'Ersatzbeleg. Der amtliche Titel und der Regelungsgegenstand der Ley N.º 31814 sind hier verifiziert;
      der Volltext des Gesetzes selbst konnte in dieser Sitzung nicht abgerufen werden (siehe offene_punkte).

      '
  offene_punkte:
  - 'NICHT VERIFIZIERT: der Volltext und das genaue Veröffentlichungsdatum der Ley N.º 31814. Gesucht
    wurde (a) über busquedas.elperuano.pe/dispositivo/NL/<id>-1 mit rund dreißig sondierten Publikations-IDs
    im Bereich 2189000-2200000 (die El-Peruano-IDs sind dort nicht dicht belegt; Treffer gab es nur für
    2195300 = 13.07.2023, 2196000 = 14.07.2023, 2230511 = 01.11.2023), (b) über die Slug-Route /normaslegales/<slug>/
    (404), (c) über die Suchpfade /search, /buscar, /buscador, /api/search (alle 404), (d) über das Archivo
    Digital de la Legislación del Perú (www.leyes.congreso.gob.pe; die Startseiten sind abrufbar, die
    Formularsuche ist ASP.NET-postbackgebunden, die PDF-Pfade /Documentos/2021_2026/ADLP/Normas_Legales/31814-LEY.pdf,
    /31814.pdf und /LEY-31814.pdf antworten mit 404 bzw. Zeitüberschreitung), (e) über spij.minjus.gob.pe
    (robots.txt nicht erreichbar) und (f) über www.gob.pe (HTTP 418). Als Quelle genannt wird als Datum
    den 05.07.2023; dieses Datum ist hier NICHT nachgeprüft.

    '
  - 'Zu prüfen ist, ob das Gesetz seit 2023 geändert wurde (in Peru häufig durch „Ley que modifica la
    Ley N.º 31814“).

    '
