- id: pe-ds-115-2025-pcm
  jurisdiktion: pe
  kurztitel: Reglamento des peruanischen KI-Gesetzes (DS N.º 115-2025-PCM)
  offizieller_titel: 'Decreto Supremo N.º 115-2025-PCM, Decreto Supremo que aprueba el Reglamento de la
    Ley N.º 31814, Ley que promueve el uso de la inteligencia artificial en favor del desarrollo económico
    y social del país (Oberstes Dekret Nr. 115-2025-PCM zur Billigung der Durchführungsverordnung zum
    Gesetz Nr. 31814)

    '
  fundstelle: 'Diario Oficial El Peruano vom 09.09.2025 (Publikations-ID 2436426-1); in Lima ausgefertigt
    am 08.09.2025, unterzeichnet von der Präsidentin der Republik Dina Ercilia Boluarte Zegarra.

    '
  verfahrensnummer: Decreto Supremo N.º 115-2025-PCM
  status: teilanwendbar
  status_detail: 'Das Dekret hat vier Artikel, eine Disposición Complementaria Final und eine Disposición
    Complementaria Derogatoria; das gebilligte Reglamento umfasst sechs Titel, 36 Artikel und sechs Schlussbestimmungen.
    Die Vigencia-Regel lautet wörtlich: „El presente Decreto Supremo entra en vigencia a partir de los
    noventa (90) días hábiles siguientes de su publicación en el diario oficial El Peruano, con excepción
    de la Primera, Segunda, Cuarta y Quinta Disposiciones Complementarias Finales del Reglamento aprobado
    mediante el artículo 1, las cuales entran en vigencia al día siguiente de la publicación." Die vier
    ausgenommenen Schlussbestimmungen (Umsetzungsfahrplan, Ergänzungsnormen, ENIA, ENGD) galten also bereits
    ab dem 10.09.2025; der Hauptteil erst nach Ablauf von 90 Werktagen. Zugleich hebt das Dekret die Resolución
    Ministerial N.º 246-2007-PCM auf.

    '
  kurzbeschreibung: 'Das Reglamento ist der eigentliche materielle KI-Rechtsakt Perus. Es definiert künstliche
    Intelligenz als „maschinengestütztes System, das aus erhaltenen Eingaben Vorhersagen, Inhalte oder
    Empfehlungen ableitet, um physische oder digitale Umgebungen zu beeinflussen", legt zehn Leitprinzipien
    fest und errichtet eine Governance-Struktur mit der SGTD/PCM als nationaler Behörde und einem Centro
    Nacional de Innovación en Inteligencia Artificial. Kern ist Titel V: Art. 23 verbietet bestimmte Nutzungen,
    Art. 24 benennt Hochrisikonutzungen, Art. 25 verlangt Transparenz und eine sichtbare Kennzeichnung
    KI-gestützter Produkte und Dienste, Art. 26 verweist auf die Ley N.º 29733. Titel VI unterscheidet
    Pflichten des öffentlichen Sektors (Art. 28-30, unter anderem eine institutionelle KI-Richtlinie nach
    NTP-ISO/IEC 42001:2025, Veröffentlichung des Quellcodes auf der PNSSP, menschliche Aufsicht bei Hochrisikoentscheidungen
    und eine Folgenabschätzung vor der Inbetriebnahme) von denen des Privatsektors (Art. 31-33, unter
    anderem ein Register über Funktionsweise, Datenquellen und Algorithmuslogik und eine freiwillige Folgenabschätzung
    mit dreijähriger Aufbewahrungspflicht). Sanktionen enthält das Reglamento nicht; Art. 34 bis 36 regeln
    stattdessen Monitoring durch die SGTD, Anzeige an die Contraloría General de la República und einen
    Bürgerbeschwerdekanal unter www.gob.pe/iaperu mit Verweisung an INDECOPI, die Cybercrime-Abteilung
    und die Autoridad Nacional de Protección de Datos Personales.

    '
