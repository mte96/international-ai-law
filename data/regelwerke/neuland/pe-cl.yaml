- id: pe-ds-016-2024-jus
  jurisdiktion: pe
  kurztitel: Neues Reglamento zum peruanischen Datenschutzgesetz (DS N.º 016-2024-JUS)
  offizieller_titel: 'Decreto Supremo N.º 016-2024-JUS, Reglamento de la Ley N.º 29733, Ley de Protección
    de Datos Personales (Oberstes Dekret Nr. 016-2024-JUS, Durchführungsverordnung zum Datenschutzgesetz)

    '
  fundstelle: Decreto Supremo N.º 016-2024-JUS, Ministerio de Justicia y Derechos Humanos.
  verfahrensnummer: Decreto Supremo N.º 016-2024-JUS
  status: anwendbar
  status_detail: 'Neufassung der Durchführungsverordnung zum peruanischen Datenschutzgesetz; sie ersetzt
    das Reglamento von 2013 (Decreto Supremo N.º 003-2013-JUS). Der Auftrag dieser Recherche nennt sie
    als die praktisch maßgebliche Ebene des peruanischen Datenschutzrechts. Konnte weder das Publikationsdatum
    noch der Inhalt an einer amtlichen Quelle verifiziert werden.

    '
  kurzbeschreibung: 'Die Verordnung konkretisiert die Ley N.º 29733 und ist damit die Norm, an der Profiling,
    Scoring und automatisierte Datenverarbeitung in Peru zu messen sind. Ihr Verhältnis zum KI-Reglamento
    DS N.º 115-2025-PCM ist ungeklärt: Beide beanspruchen Geltung für Datenverarbeitung durch KI-Systeme,
    beide werden von verschiedenen Behörden vollzogen (ANPDP beim Justizministerium, SGTD bei der Präsidialverwaltung),
    und nur die datenschutzrechtliche Ebene kennt Sanktionen.

    '
