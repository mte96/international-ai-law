    11.07.2025.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. Das Gesetz begründet den Transparenzgrundsatz der chilenischen Verwaltung
    und errichtet den Consejo para la Transparencia als unabhängiges Kontrollorgan. Die Ley N° 21.719
    ändert es mit Wirkung zum 01.12.2026 (Artículo segundo permanente, Inkrafttreten nach dem Artículo
    primero transitorio).

    '
  kurzbeschreibung: 'Für KI ist das Gesetz der Hebel, mit dem in Chile Auskunft über Verwaltungsalgorithmen
    erzwungen werden kann: Wer wissen will, welches System eine Behörde einsetzt, nach welchen Kriterien
    es arbeitet und welche Daten es verwendet, stellt einen Antrag nach der Ley N° 20.285 und kann eine
    Ablehnung mit dem amparo vor dem Consejo para la Transparencia angreifen. Der Consejo bleibt nach
    dem KI-Gesetzentwurf ausdrücklich für den Informationszugang zuständig.

    '
  inkrafttreten:
    datum: 2008-08-20
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=276363
