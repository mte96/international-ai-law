  fundstelle: 'Resolución Ministerial N.º 246-2007-PCM, Presidencia del Consejo de Ministros; Aufhebung
    in der Disposición Complementaria Derogatoria des Decreto Supremo N.º 115-2025-PCM (Diario Oficial
