- id: cl-ki-gesetz-entwurf
  jurisdiktion: cl
  kurztitel: Chilenischer KI-Gesetzentwurf (Boletín 15869-19 / 16821-19)
  offizieller_titel: 'Proyecto de ley que regula los sistemas de inteligencia artificial, la robótica
    y las tecnologías conexas, en sus distintos ámbitos de aplicación (Gesetzentwurf zur Regelung von
    Systemen künstlicher Intelligenz, der Robotik und verwandter Technologien in ihren verschiedenen Anwendungsbereichen)
    — refundido mit dem Mensaje „Regula los sistemas de inteligencia artificial" (Regelt die Systeme künstlicher
    Intelligenz)

    '
  fundstelle: 'Boletín N° 15869-19 (matriz, Moción, Cámara de Diputados, 24.04.2023) und Boletín N° 16821-19
    (Mensaje del Presidente de la República, Cámara de Diputados, 07.05.2024); am 29.05.2024 in der Cámara
    de Diputados zur gemeinsamen Behandlung zusammengeführt (refundidos).

    '
  verfahrensnummer: Boletín 15869-19 / 16821-19 (refundidos)
  status: verfahren
  status_detail: 'Am 06.09.2026 im zweiten konstitutionellen Verfahrensgang (segundo trámite constitucional)
    im Senat, Unterstufe „Primer informe de comisión de Desafíos del Futuro, Ciencia, Tecnología e Innovación".
    Die Cámara de Diputados hat den Entwurf am 04.08.2025 in der Generaldebatte und am 13.10.2025 in der
    Einzelberatung angenommen und ihn am 14.10.2025 mit Oficio N° 20.843 an den Senat übermittelt. Seither
    liegt er in der Zukunftskommission des Senats. Die Regierung hat den Entwurf mit wechselnden Dringlichkeiten
    belegt; die zuletzt registrierte Urgencia ist eine „Simple“ vom 01.09.2026. Ein Gesetz ist daraus
    bis zum 06.09.2026 NICHT geworden.

    '
  kurzbeschreibung: 'Der Entwurf ist der erste ausformulierte, risikobasierte KI-Rechtsakt Chiles und
    folgt der Systematik der EU-KI-Verordnung, weicht aber in der Aufsichtsarchitektur und in der Durchsetzung
    deutlich ab. Er teilt KI-Systeme in vier Kategorien ein: inakzeptables Risiko (verboten, weil mit
    der Gewährleistung der Grundrechte unvereinbar), hohes Risiko (Systeme mit erheblichem Gefährdungspotenzial
    für Grundrechte, insbesondere bei Fehlfunktion), begrenztes Risiko (Manipulations- oder Fehlerrisiken
    ohne erhebliches Gewicht) und offenkundig risikofreie Systeme. Die Aufsicht wird nicht einer neuen
    KI-Behörde, sondern der durch Ley N° 21.719 geschaffenen Agencia de Protección de Datos Personales
    übertragen; daneben tritt ein Consejo Asesor Técnico de Inteligencia Artificial mit höchstens zehn
    Mitgliedern und ohne Kontrollbefugnisse. Die Durchsetzung ist ausdrücklich als Ex-post-Aufsicht konzipiert:
    nach dem Kommissionsbericht greift die Kontrolle erst, wenn empirische Anhaltspunkte für einen eingetretenen
    Schaden vorliegen.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://tramitacion.senado.cl/wspublico/tramitacion.php?boletin=15869
  themenachsen:
  - marktzugang
  - gpai
  - grundrechte
  - datenschutz
  - governance
  - haftung
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Vier Risikostufen statt der drei bzw. vier der EU-KI-VO: riesgo inaceptable, riesgo alto, riesgo
    limitado, sin riesgo evidente.'
  - 'Aufsicht bei der Agencia de Protección de Datos Personales (APDP) — also bei der Datenschutzbehörde,
    die selbst erst mit dem Inkrafttreten der Ley N° 21.719 am 01.12.2026 arbeitsfähig wird. Der KI-Entwurf
    ist damit institutionell an das Datenschutzrecht gekoppelt.

    '
  - 'Consejo Asesor Técnico de Inteligencia Artificial: höchstens zehn Mitglieder, beratend, ohne Aufsichts-
    oder Sanktionsbefugnis.'
  - Der Consejo para la Transparencia bleibt für den Informationszugang zuständig; das Wissenschaftsministerium
    für die politische Koordination.
  - 'Ex-post-Durchsetzung: „la fiscalización solo procederá cuando haya evidencia empírica de un daño"
    (Zweiter Bericht der Comisión de Futuro, Ciencias, Tecnología, Conocimiento e Innovación). Das ist
    der zentrale Unterschied zur EU-KI-VO, die eine Ex-ante-Konformitätsbewertung verlangt.

    '
  - 'Zwei Ursprünge: eine parlamentarische Moción von acht Abgeordneten (Aedo Jeldres, Lagomarsino Guzmán,
    Medina Vásquez, Mellado Pino, Olivera De La Fuente, Oyarzo Figueroa, Santibáñez Novoa, Venegas Salazar)
    vom 24.04.2023 und ein Mensaje der Regierung vom 07.05.2024. Die Moción ist die matriz; der Regierungsentwurf
    wurde ihr zugeschlagen.

    '
  - 'Die Corte Suprema hat am 01.07.2024 von Amts wegen zum Entwurf Stellung genommen (Oficio N° 199-2024)
    — in Chile der übliche Weg, auf dem die Justiz zu Gesetzentwürfen gehört wird, die ihre Zuständigkeiten
    berühren.

    '
