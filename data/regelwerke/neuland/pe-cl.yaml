  - sektor-oeffentlich
  regelungsschwerpunkte:
  - Errichtung der Agencia Nacional de Ciberseguridad (ANCI) als Aufsichts- und Koordinierungsbehörde.
  - Kategorie der „operadores de importancia vital“ mit erhöhten Pflichten; Kategorie der „servicios esenciales“.
  - Meldepflicht bei erheblichen Sicherheitsvorfällen; Mindestanforderungen an die Vorfallbewältigung.
  - Anwendbar auf Organe der Staatsverwaltung und auf private Betreiber kritischer Informationsinfrastruktur.
