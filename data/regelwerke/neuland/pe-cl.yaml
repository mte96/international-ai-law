    notiz: 'Der XML-Abruf lieferte den Text bis Art. 69; der Abschnitt mit den Schranken (Art. 71 A ff.)
      war in der Ausgabe des Abrufwerkzeugs abgeschnitten. Das Versionsdatum wurde als 03.11.2017 wiedergegeben
