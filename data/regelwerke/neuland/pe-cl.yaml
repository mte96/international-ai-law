  kurztitel: Verfassungsänderung Datenschutz (Ley N° 21.096)
  offizieller_titel: 'Ley N° 21.096, Consagra el derecho a protección de los datos personales (Gesetz
    Nr. 21.096, Verankerung des Rechts auf Schutz personenbezogener Daten)

    '
  fundstelle: 'Diario Oficial vom 16.06.2018; Ministerio Secretaría General de la Presidencia. LeyChile
    idNorma 1119730.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. Die Änderung ergänzt Art. 19 Nr. 4 der Verfassung um den Halbsatz, dass jeder
    Person „la protección de sus datos personales“ zusteht und deren Verarbeitung in der durch Gesetz
    bestimmten Form und unter den durch Gesetz bestimmten Bedingungen zu erfolgen hat.

    '
  kurzbeschreibung: 'Die Norm ist kurz, aber für KI-Verfahren in Chile zentral: Sie hebt den Datenschutz
    auf Verfassungsrang und eröffnet damit den recurso de protección nach Art. 20 der Verfassung. Weil
    die Ley N° 19.628 keine Behörde und keine Bußgelder kennt, ist der recurso de protección heute der
    praktisch wichtigste Rechtsbehelf gegen algorithmische Datenverarbeitung, biometrische Erfassung und
    Gesichtserkennung in Chile.

    '
  inkrafttreten:
    datum: 2018-06-16
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1119730
  themenachsen:
  - datenschutz
  - grundrechte
  regelungsschwerpunkte:
  - 'Ergänzung von Art. 19 Nr. 4 der Constitución Política: Recht auf Schutz der personenbezogenen Daten
    mit Gesetzesvorbehalt.'
  - Öffnet den recurso de protección (Art. 20 CPR) für Datenschutzverletzungen — der Weg, über den chilenische
    Gerichte bislang KI- und Biometriefälle entscheiden.
