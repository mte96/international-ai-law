  offizieller_titel: 'Decreto de Urgencia N.º 006-2020, que crea el Sistema Nacional de Transformación
    Digital (Dringlichkeitsdekret Nr. 006-2020 zur Schaffung des Nationalen Systems der digitalen Transformation),
    nebst Decreto Supremo N.º 157-2021-PCM (Reglamento)

    '
  fundstelle: 'Beide Normen sind in den Considerandos des Decreto Supremo N.º 115-2025-PCM ausdrücklich
    zitiert.

    '
  verfahrensnummer: Decreto de Urgencia N.º 006-2020; Decreto Supremo N.º 157-2021-PCM
  status: anwendbar
  status_detail: 'Das Dringlichkeitsdekret schafft das Sistema Nacional de Transformación Digital; das
    Decreto Supremo N.º 157-2021-PCM ist seine Durchführungsverordnung. Beide bilden zusammen mit dem
    Decreto Legislativo N.º 1412 die Rechtsgrundlage, auf die sich das KI-Reglamento in seinen Considerandos
    stützt.

    '
  kurzbeschreibung: 'Die beiden Normen ordnen die digitale Transformation Perus als funktionales System
    der Staatsverwaltung und weisen der Präsidialverwaltung die Führung zu. Sie sind der Grund, warum
    das peruanische KI-Recht bei der PCM und nicht bei einem Fachministerium oder einer unabhängigen Behörde
    liegt — mit der Folge, dass die KI-Aufsicht in Peru Teil der Regierungsorganisation ist und keine
    unabhängige Stellung hat.

    '
