- id: cl-politica-ia
  jurisdiktion: cl
  kurztitel: Política Nacional de Inteligencia Artificial (Chile)
  offizieller_titel: 'Política Nacional de Inteligencia Artificial (Nationale Politik für künstliche Intelligenz),
    nebst Plan de Acción

    '
  fundstelle: 'Ministerio de Ciencia, Tecnología, Conocimiento e Innovación. Erste Fassung 2021; aktualisierte
    Fassung am 02.05.2024 im Patio de Las Camelias des Palacio de La Moneda von Ministerin Aisén Etcheverry
    vorgestellt.

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Kein Rechtsakt, sondern eine Regierungspolitik ohne Bindungswirkung. Die Fassung von
    2021 beruhte auf einem partizipativen Prozess 2019/2020 und gliederte sich in drei Achsen (Factores
    Habilitantes; Desarrollo y Adopción; Gobernanza y Ética). 2023 wurde wegen der Entwicklung generativer
    Systeme die dritte Achse (Gobernanza y Ética) überarbeitet; 2024 erschien ein Ergebnisbericht. Die
    am 02.05.2024 vorgestellte aktualisierte Politik umfasst 177 Maßnahmen, von denen 100 bis 2026 umgesetzt
    werden sollen, und wird von 14 Ministerien getragen. Fünf neue Themen kamen hinzu: internationale
    Zusammenarbeit, Klimaschutz, Inklusion, Kinder und Jugendliche, Kultur.

    '
  kurzbeschreibung: 'Die Politik ist der politische Rahmen, in dem der chilenische KI-Gesetzentwurf steht.
    Sie ordnet die KI-Politik heute fünf Achsen zu: Regulierung und Governance (dort steht das Gesetzgebungsvorhaben),
    Infrastruktur (Supercomputing und Rechenzentren), internationale Zusammenarbeit (OECD, Vereinte Nationen,
    regionale Zusammenarbeit), Ausbildung und Fähigkeiten sowie Anwendung und Entwicklung im Staat (Gesundheit,
    Verkehr, Landwirtschaft). Ergänzend nennt das Wissenschaftsministerium eine „Circular de IA“ für den
    verantwortlichen Einsatz künstlicher Intelligenz in den öffentlichen Diensten.

    '
  inkrafttreten:
    datum: 2021-10-01
    verifiziert: false
    quelle: https://www.minciencia.gob.cl/areas/inteligencia-artificial/politica-nacional-de-inteligencia-artificial/
