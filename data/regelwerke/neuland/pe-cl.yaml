    was_gilt: Frist für die erstmalige Bestellung der Direktoren des Consejo Directivo (Artículo cuarto
      transitorio Ley N° 21.719).
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
  themenachsen:
  - datenschutz
  - governance
  - grundrechte
