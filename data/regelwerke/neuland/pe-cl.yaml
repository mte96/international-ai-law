  kurztitel: Zweckbindungsgrundsatz bei Wirtschaftsdaten (Ley N° 20.575)
  offizieller_titel: 'Ley N° 20.575, Establece el principio de finalidad en el tratamiento de datos personales
    (Gesetz Nr. 20.575 zur Einführung des Zweckbindungsgrundsatzes bei der Verarbeitung personenbezogener
    Daten)

    '
  fundstelle: 'Diario Oficial Nr. 40.190 vom 17.02.2012; promulgiert am 14.02.2012. LeyChile idNorma 1037366.
    Umgangssprachlich „Ley DICOM“.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. Das Gesetz beschränkt die Verwendung wirtschaftlicher, finanzieller, bankmäßiger
    und kommerzieller Personendaten auf die Bewertung von Kreditrisiken und den Kreditvergabeprozess.

    '
  kurzbeschreibung: 'Die Norm ist die chilenische Scoring-Vorschrift und damit die praktisch wichtigste
    Grenze für algorithmische Bonitätsbewertung. Sie verbietet die Zweckentfremdung von Wirtschaftsdaten
    — etwa für Personalauswahl, Vermietung oder Versicherungstarife — und trifft damit genau jene Sekundärnutzung,
    die Modelle des maschinellen Lernens attraktiv finden. Sie ergänzt Título III der Ley N° 19.628 und
    bleibt neben der Neufassung durch die Ley N° 21.719 zu beachten.

    '
  inkrafttreten:
    datum: 2012-02-17
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1037366
  themenachsen:
  - datenschutz
  - sektor-finanz
  - grundrechte
  - arbeit
  regelungsschwerpunkte:
  - 'Zweckbindung: Wirtschafts-, Finanz-, Bank- und Handelsdaten nur zur Kreditrisikobewertung und für
    den Kreditvergabeprozess.'
  - Verbot der Zweckentfremdung — die schärfste chilenische Schranke gegen algorithmisches Cross-Domain-Scoring.
