      '
  offene_punkte:
  - 'Sanktionsrahmen, Meldefristen und die Durchführungsverordnungen (Reglamentos) der Ley N° 21.663 konnten
    nicht verifiziert werden: Die ANCI-Seite nennt sie nicht, der LeyChile-Dienst war am Ende der Sitzung
    durch HTTP 429 gesperrt und das Diario Oficial sperrt das Abrufwerkzeug.

    '
  - 'Zu klären ist das Verhältnis zwischen ANCI und der im KI-Gesetzentwurf vorgesehenen Aufsicht durch
    die Agencia de Protección de Datos Personales. Bei KI-Systemen in kritischer Infrastruktur überschneiden
    sich beide Zuständigkeiten.

