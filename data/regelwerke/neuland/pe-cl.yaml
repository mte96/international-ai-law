    Es ersetzt eine achtzehn Jahre alte Informationssicherheitsnorm durch einen dynamischen Verweis auf
    jeweils geltende technische Normen und macht damit die Normung (NTP-ISO/IEC) zur eigentlichen Regelungsebene.

    '
