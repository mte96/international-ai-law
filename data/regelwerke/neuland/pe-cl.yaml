      '
  - datum: 2026-09-06
    typ: uebersicht
    titel: Themenseite Inteligencia Artificial des Wissenschaftsministeriums (fünf Achsen, Circular de
      IA)
    url: https://www.minciencia.gob.cl/areas/inteligencia-artificial/Inteligencia-Artificial/
