- id: pe-ley-29158
  jurisdiktion: pe
  kurztitel: Peruanisches Exekutivorganisationsgesetz (Ley N.º 29158)
  offizieller_titel: 'Ley N.º 29158, Ley Orgánica del Poder Ejecutivo (Organgesetz Nr. 29158 über die
    Exekutive)

    '
  fundstelle: 'In den Considerandos des Decreto Supremo N.º 115-2025-PCM ausdrücklich als „Ley N° 29158,
    Ley Orgánica del Poder Ejecutivo" zitiert.

    '
  verfahrensnummer: Ley N.º 29158
  status: anwendbar
  status_detail: 'Das Organgesetz ist die Ermächtigungsgrundlage, auf die sich der peruanische Verordnungsgeber
    beim Erlass des KI-Reglamento stützt. Es bestimmt, welche Regelungen die Exekutive durch Decreto Supremo
    treffen darf. Für die Frage, ob das KI-Reglamento seine Verbote (Art. 23) und Hochrisikokategorien
    (Art. 24) ohne gesetzliche Sanktionsermächtigung tragen kann, ist es die maßgebliche Norm.

    '
  kurzbeschreibung: 'Die Ley N.º 29158 ordnet die Zuständigkeiten der peruanischen Exekutive und die Rechtsformen
    ihres Handelns. Sie ist deshalb hier verzeichnet, weil an ihr die kompetenzrechtliche Kernfrage des
    peruanischen KI-Rechts hängt: Ein Reglamento darf nur ausführen, was das Gesetz vorgibt — die Ley
    N.º 31814 sieht aber weder Verbote noch Risikoklassen vor.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
