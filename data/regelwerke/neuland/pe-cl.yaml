- id: cl-ley-21719
  jurisdiktion: cl
  kurztitel: Neues chilenisches Datenschutzgesetz (Ley N° 21.719)
  offizieller_titel: 'Ley N° 21.719, Regula la protección y el tratamiento de los datos personales y crea
    la Agencia de Protección de Datos Personales (Gesetz Nr. 21.719, Regelung des Schutzes und der Verarbeitung
    personenbezogener Daten und Errichtung der Datenschutzbehörde)

    '
  fundstelle: 'Diario Oficial de la República de Chile Nr. 44.023 vom 13.12.2024; promulgiert am 25.11.2024;
    Ministerio Secretaría General de la Presidencia. LeyChile idNorma 1209272.

    '
  verfahrensnummer: Boletines 11144-07 y 11092-07 (refundidos)
  status: verabschiedet
  status_detail: 'Verkündet und im Diario Oficial veröffentlicht, aber noch nicht anwendbar. Nach dem
    Artículo primero transitorio treten die Änderungen an der Ley N° 19.628, der Ley N° 20.285 und der
    Ley N° 19.496 „el día primero del mes vigésimo cuarto posterior a la publicación de esta ley en el
    Diario Oficial" in Kraft — das ist der 01.12.2026, also in weniger als drei Monaten. Die konsolidierte
    Fassung in LeyChile trägt das Versionsdatum 05.02.2026; das Gesetz ist also nach seiner Verkündung
    noch geändert worden.

    '
  kurzbeschreibung: 'Das Gesetz ersetzt den materiellen Teil der Ley N° 19.628 von 1999 vollständig und
    bringt Chile auf ein DSGVO-nahes Schutzniveau. Es schafft mit der Agencia de Protección de Datos Personales
    erstmals eine eigenständige Datenschutzbehörde mit Untersuchungs-, Anordnungs- und Bußgeldbefugnis
    und einem öffentlichen Registro Nacional de Sanciones y Cumplimiento. Für KI ist vor allem Art. 8°
    bis der neuen Fassung der Ley N° 19.628 einschlägig: ein Recht, sich automatisierten Einzelentscheidungen
    einschließlich Profiling zu widersetzen, flankiert von einem Recht auf Erklärung, auf menschliche
    Intervention, auf Darlegung des eigenen Standpunkts und auf Überprüfung der Entscheidung. Daneben
    stehen ausdrückliche Sonderregeln für biometrische Daten (Art. 16 ter), Gesundheits- und Genomdaten
    (Art. 16 bis), Geolokalisierungsdaten (Art. 16 sexies) und Daten von Kindern und Jugendlichen (Art.
    16 quater). Für Kleinstunternehmen sieht der Artículo sexto transitorio in den ersten zwölf Monaten
    nach Inkrafttreten die Möglichkeit vor, statt einer Geldbuße eine schriftliche Verwarnung auszusprechen.

    '
  inkrafttreten:
    datum: 2026-12-01
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
  anwendungsdaten:
  - datum: 2025-06-13
    was_gilt: 'Frist des Artículo segundo transitorio: Die im Gesetz vorgesehenen Reglamentos waren binnen
      sechs Monaten nach der Veröffentlichung zu erlassen (Veröffentlichung 13.12.2024).

      '
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
  - datum: 2026-06-01
    was_gilt: 'Artículo cuarto transitorio: Die erstmalige Bestellung der Direktoren des Consejo Directivo
      der Agencia de Protección de Datos Personales hat sechs Monate vor dem Inkrafttreten zu erfolgen;
      die Amtszeiten sind gestaffelt (zwei, vier und sechs Jahre), die Bestellung bedarf der Zustimmung
      des Senats.

      '
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
  - datum: 2026-12-01
    was_gilt: 'Die Neufassung der Ley N° 19.628 sowie die Änderungen der Ley N° 20.285 (Informationszugang)
      und der Ley N° 19.496 (Verbraucherschutz) werden anwendbar; die Agencia de Protección de Datos Personales
      nimmt ihre Aufsichts- und Sanktionsbefugnisse auf.

      '
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
  - datum: 2027-12-01
    was_gilt: 'Ende der zwölfmonatigen Milderungsphase des Artículo sexto transitorio, in der die Agencia
      gegenüber „empresas calificadas como de menor tamaño" statt einer Sanktion eine schriftliche Verwarnung
      aussprechen kann.

      '
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=1209272
