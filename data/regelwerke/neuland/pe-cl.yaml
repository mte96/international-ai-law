  - Umstellung der Ley N° 19.880 auf elektronische Dokumente, elektronische Akte und elektronische Signatur.
  - Gestaffeltes Inkrafttreten nach Behördengruppen ( nicht im Einzelnen verifiziert).
  - Interoperabilitätspflichten zwischen den Organen der Staatsverwaltung.
