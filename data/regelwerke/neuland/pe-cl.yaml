  verfahrensnummer: Resolución Ministerial N.º 246-2007-PCM
  status: aufgehoben
  status_detail: 'Mit dem Inkrafttreten des KI-Reglamento aufgehoben. Die Norm regelte die für die peruanische
    Staatsverwaltung verbindlichen technischen Sicherheitsnormen; an ihre Stelle treten nach der Sechsten
    Disposición Complementaria Final des Reglamento die jeweils geltenden Fassungen der NTP-ISO/IEC 27002
    und der NTP-ISO 31000.

    '
