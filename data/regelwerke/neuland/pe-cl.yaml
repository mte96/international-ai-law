  - Nach dem KI-Gesetzentwurf zugleich Aufsichtsbehörde für KI-Systeme.
  - 'Milderungsphase für Kleinunternehmen: bis 30.11.2027 schriftliche Verwarnung statt Sanktion möglich
    (Artículo sexto transitorio).'
