- id: cl-strafrecht-ki-entwurf
  jurisdiktion: cl
  kurztitel: Chilenischer Entwurf zum Missbrauch von KI im Strafrecht (Boletín 15935-07)
  offizieller_titel: 'Proyecto de ley que modifica el Código Penal para sancionar el mal uso de la inteligencia
    artificial (Gesetzentwurf zur Änderung des Strafgesetzbuchs, um den Missbrauch künstlicher Intelligenz
    unter Strafe zu stellen)

    '
  fundstelle: 'Boletín N° 15935-07, Moción, Cámara de Diputados, eingebracht am 15.05.2023.

    '
  verfahrensnummer: Boletín N° 15935-07
  status: verfahren
  status_detail: 'Am 06.09.2026 im ersten konstitutionellen Verfahrensgang in der Cámara de Diputados,
    Unterstufe „Primer informe de comisión de Constitución, Legislación, Justicia y Reglamento". Seit
    dem 05.06.2023 ist kein Verfahrensschritt mehr verzeichnet: Der Entwurf wurde am 05.06.2023 zur Kenntnis
    genommen, zunächst der Zukunftskommission zugewiesen und dann in die Verfassungskommission verlegt.
    Es gibt keinen Ausschussbericht und KEINE Urgencia. Der Entwurf ruht — er ist der praktische Beleg
    dafür, dass Chile den strafrechtlichen Teil des KI-Rechts (Deepfakes, Identitätsmissbrauch) bislang
    nicht angefasst hat, während der verwaltungsrechtliche Teil (Boletín 15869-19/16821-19) weit gediehen
    ist.

    '
  kurzbeschreibung: 'Die Moción von neun Abgeordneten will das chilenische Strafgesetzbuch um Tatbestände
    für den Missbrauch künstlicher Intelligenz ergänzen. Sie stammt weitgehend von denselben Abgeordneten,
    die auch die Moción zum KI-Rahmengesetz eingebracht haben (Aedo Jeldres, Lagomarsino Guzmán, Medina
    Vásquez, Olivera De La Fuente, Oyarzo Figueroa und weitere). Weil kein Bericht vorliegt, ist der Inhalt
    des Entwurfs aus den Verfahrensdaten allein nicht zu rekonstruieren.

    '
