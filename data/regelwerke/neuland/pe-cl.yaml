  kurztitel: Chilenisches Verbraucherschutzgesetz (Ley N° 19.496)
  offizieller_titel: 'Ley N° 19.496, Establece normas sobre protección de los derechos de los consumidores
    (Gesetz Nr. 19.496 über den Schutz der Verbraucherrechte)

    '
  fundstelle: 'Diario Oficial vom 07.03.1997. LeyChile idNorma 61438; konsolidierte Fassung mit Versionsdatum
    20.04.2021.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft. Wird durch den Artículo tercero permanente der Ley N° 21.719 mit Wirkung zum
    01.12.2026 geändert. Vollzogen wird es vom Servicio Nacional del Consumidor (SERNAC).

    '
  kurzbeschreibung: 'Das Verbraucherschutzgesetz ist in Chile — wie in ganz Lateinamerika — der praktisch
    wichtigste Hebel gegen algorithmische Benachteiligung im Massengeschäft: dynamische Preisbildung,
    automatisierte Kreditablehnung, Empfehlungssysteme, Chatbots im Kundenkontakt. Weil das geltende Datenschutzrecht
    keine Behörde kennt, ist SERNAC bis zum 01.12.2026 die einzige chilenische Behörde, die algorithmische
    Praktiken gegenüber Verbrauchern überhaupt verfolgen kann.

    '
  inkrafttreten:
