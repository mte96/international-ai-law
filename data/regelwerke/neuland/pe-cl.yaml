  jurisdiktion: cl
  kurztitel: Chilenisches Verwaltungsverfahrensgesetz (Ley N° 19.880)
  offizieller_titel: 'Ley N° 19.880, Establece bases de los procedimientos administrativos que rigen los
    actos de los órganos de la Administración del Estado (Gesetz Nr. 19.880 über die Grundlagen der Verwaltungsverfahren,
    die für die Akte der Organe der Staatsverwaltung gelten)

    '
  fundstelle: 'Diario Oficial vom 29.05.2003; promulgiert am 22.05.2003; Ministerio Secretaría General
    de la Presidencia. LeyChile idNorma 210676. Konsolidierte Fassung mit Versionsdatum 05.02.2026.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft, seit der Ley N° 21.180 in weiten Teilen auf elektronische Verfahren umgestellt.
    Art. 5 lautet in der geltenden Fassung, das Verfahren werde „por escrito a través de medios electrónicos“
    geführt, soweit das Gesetz nichts anderes bestimmt; Art. 18 macht die elektronische Akte zur Regel,
    Art. 19 unterwirft die elektronischen Plattformen Standards für Sicherheit, Interoperabilität, Verbindung
    und Cybersicherheit. Eine ausdrückliche Vorschrift über automatisierte Entscheidungen enthält das
    Gesetz NICHT.

    '
  kurzbeschreibung: 'Das Gesetz ist die zentrale Norm, an der in Chile automatisierte Verwaltungsentscheidungen
    zu messen sind — nicht weil es sie regelt, sondern weil es sie an die allgemeinen Anforderungen bindet:
    Art. 11 verlangt, dass die Gründe „siempre“ in jenen Akten auszudrücken sind, die Rechte Privater
    berühren; Art. 16 verpflichtet auf Transparenz, „de manera que permita y promueva el conocimiento,
    contenidos y fundamentos de las decisiones"; Art. 41 verlangt, dass die Endentscheidung begründet
    ist und die statthaften Rechtsbehelfe nennt. Wer eine Verwaltungsentscheidung algorithmisch vorbereitet,
    muss sie danach so begründen können, dass die Gründe nachvollziehbar sind. Das ist in Chile die praktisch
    wichtigste Rechtsgrundlage gegen intransparente Verwaltungsalgorithmen.

    '
  inkrafttreten:
    datum: 2003-05-29
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=210676
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Art. 5: Schriftlichkeit über elektronische Mittel als Regelform des Verfahrens.'
  - 'Art. 11: Unparteilichkeit und Begründungspflicht — „los fundamentos deberán siempre expresarse en
    aquellos actos que afectaren los derechos de los particulares“.'
  - 'Art. 16: Transparenzgrundsatz mit dem Gebot, Kenntnis von Inhalt UND Gründen der Entscheidungen zu
    ermöglichen und zu fördern.'
  - 'Art. 18: elektronische Akte als Regel. Art. 19: Standards für Sicherheit, Interoperabilität, Verbindung
    und Cybersicherheit der Plattformen.'
  - 'Art. 41: Inhalt der Endentscheidung — „contendrán la decisión, que será fundada“ und Nennung der
    Rechtsbehelfe.'
  - KEINE ausdrückliche Vorschrift über automatisierte Einzelentscheidungen. Die Lücke schließt ab dem
    01.12.2026 Art. 8° bis der Ley N° 19.628 in der Fassung der Ley N° 21.719.
  dokumente:
  - datum: 2003-05-29
    typ: konsolidiert
    titel: Ley N° 19.880 — konsolidierte Fassung in LeyChile (Versionsdatum 05.02.2026)
    url: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=210676
    sprache: es
    urheber: Biblioteca del Congreso Nacional de Chile
    verifiziert: true
    notiz: Fassung mit den durch Ley N° 21.180 eingefügten elektronischen Verfahrensvorschriften.
  offene_punkte:
  - 'Sowohl die Ley N° 19.880 als auch die Ley N° 21.719 tragen in LeyChile dasselbe Versionsdatum 05.02.2026.
    Welche Norm am 05.02.2026 in Kraft trat und beide Gesetze änderte, ist offen und zuerst zu klären.

    '
