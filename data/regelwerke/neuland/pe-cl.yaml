  jurisdiktion: pe
  kurztitel: Reglamento zum Gobierno-Digital-Recht (DS N.º 029-2021-PCM)
  offizieller_titel: 'Decreto Supremo N.º 029-2021-PCM, que aprueba el Reglamento del Decreto Legislativo
    N.º 1412, Decreto Legislativo que aprueba la Ley de Gobierno Digital, y establece disposiciones sobre
    las condiciones, requisitos y uso de las tecnologías y medios electrónicos en el procedimiento administrativo
    (Oberstes Dekret Nr. 029-2021-PCM zur Billigung der Durchführungsverordnung zum Gesetz über die digitale
    Regierung und mit Bestimmungen über Bedingungen, Anforderungen und Nutzung von Technologien und elektronischen
    Mitteln im Verwaltungsverfahren)

    '
  fundstelle: Decreto Supremo N.º 029-2021-PCM, Presidencia del Consejo de Ministros.
  verfahrensnummer: Decreto Supremo N.º 029-2021-PCM
  status: anwendbar
  status_detail: 'Vom Auftrag als eine der Gobierno-Digital-Normen benannt. WIDERSPRUCH: In den Considerandos
    des KI-Reglamento DS N.º 115-2025-PCM wird diese Norm NICHT zitiert; dort stehen stattdessen das Decreto
    de Urgencia N.º 006-2020 und das Decreto Supremo N.º 157-2021-PCM. Ob das DS N.º 029-2021-PCM in Kraft,
    geändert oder ersetzt ist, konnte nicht geprüft werden.

    '
  kurzbeschreibung: 'Die Verordnung führt das Decreto Legislativo N.º 1412 aus und regelt die Bedingungen
    für den Einsatz elektronischer Mittel im Verwaltungsverfahren. Sie ist damit — neben der Ley N.º 27444
    — die Norm, an der die verfahrensrechtliche Zulässigkeit algorithmisch gestützter Verwaltungsentscheidungen
    in Peru hängt.

    '
