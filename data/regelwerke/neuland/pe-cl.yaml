- id: pe-sgtd
  jurisdiktion: pe
  kurztitel: Peruanische KI-Aufsicht (SGTD der Präsidialverwaltung)
  offizieller_titel: 'Secretaría de Gobierno y Transformación Digital de la Presidencia del Consejo de
    Ministros (Sekretariat für digitale Regierung und Transformation der Präsidialverwaltung) als Autoridad
    Nacional nach Art. 8 des Reglamento der Ley N.º 31814

    '
  fundstelle: 'Art. 8 des durch Decreto Supremo N.º 115-2025-PCM gebilligten Reglamento; organisationsrechtliche
    Grundlage im Decreto Legislativo N.º 1412 und im Decreto de Urgencia N.º 006-2020.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Die PCM ist über die SGTD die Behörde für die technische Normsetzung und trägt die Verantwortung
    für Leitung, Bewertung und Überwachung der KI-Nutzung. Die Befugnisse sind in Art. 34 bis 36 des Reglamento
    ausgestaltet: Überwachung der Umsetzung, Auskunftsverlangen, Zusammenarbeit mit den CSIRT-Teams, Meldung
    von Verstößen an die Contraloría General de la República, Eskalation bei Verstößen mit Bezug zu geistigem
    Eigentum oder Datenschutz, Betrieb eines Bürgerbeschwerdekanals unter www.gob.pe/iaperu. Eine eigene
    Sanktionsbefugnis hat die SGTD NICHT.

    '
  kurzbeschreibung: 'Die peruanische KI-Aufsicht ist keine unabhängige Behörde, sondern eine Abteilung
    der Präsidialverwaltung. Sie normiert technisch (Zweite Disposición Complementaria Final: Durchführungsnormen
    durch Resolución Secretarial, Ethik-Leitlinien binnen 180 Werktagen), überwacht und meldet weiter,
    kann aber nicht sanktionieren. Die Sanktionsbefugnis liegt bei anderen Stellen: bei der Contraloría
    (öffentliche Bedienstete), bei INDECOPI (Verbraucherschutz, geistiges Eigentum), bei der ANPDP (Datenschutz)
    und bei der Polizei (Delitos informáticos). Das ist der zentrale Konstruktionsunterschied zum chilenischen
    Entwurf, der die Aufsicht der Datenschutzbehörde mit Bußgeldbefugnis zuweist.

    '
  inkrafttreten:
    datum: 2026-01-20
    verifiziert: false
    quelle: https://busquedas.elperuano.pe/dispositivo/NL/2436426-1
  themenachsen:
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Art. 8 Reglamento: PCM über SGTD als Autoridad Nacional für technische Normsetzung, Leitung, Bewertung
    und Überwachung.'
  - 'Art. 12 Reglamento: Centro Nacional de Innovación en Inteligencia Artificial — stellt Behörden Dienste
    für den sicheren Entwurf KI-gestützter Systeme bereit.'
  - 'Art. 34-36 Reglamento: Überwachung, Auskunftsverlangen, CSIRT-Zusammenarbeit, Meldung an die Contraloría,
    Bürgerbeschwerdekanal www.gob.pe/iaperu, Verweisung an INDECOPI, Cybercrime-Abteilung und ANPDP.'
  - KEINE eigene Sanktionsbefugnis.
