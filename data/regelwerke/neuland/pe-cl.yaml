- id: cl-ley-19223
  jurisdiktion: cl
  kurztitel: Altes chilenisches Computerstrafrecht (Ley N° 19.223, aufgehoben)
  offizieller_titel: 'Ley N° 19.223, Tipifica figuras penales relativas a la informática (Gesetz Nr. 19.223
    über Straftatbestände im Bereich der Informatik)

    '
  fundstelle: Diario Oficial vom 07.06.1993. LeyChile idNorma 30590.
  verfahrensnummer: null
  status: aufgehoben
  status_detail: 'Am 20.06.2022 durch die Ley N° 21.459 aufgehoben. Das Gesetz kannte vier Tatbestände:
    Zerstörung oder Blockade von Informationssystemen, unbefugter Zugriff auf Daten, Beschädigung von
    Datensätzen und unbefugte Offenlegung von Informationen. Es erklärt, warum das chilenische Computerstrafrecht
    bis 2022 keinen Computerbetrug und keine Datenfälschung kannte — und damit, warum KI-gestützte Täuschung
    in Chile erst seit 2022 überhaupt einen passenden Tatbestand hat.

    '
  kurzbeschreibung: 'Die aufgehobene Norm gehört in die Datenbasis, weil sie den Zustand beschreibt, den
    die Ley N° 21.459 beendet hat: Bis 2022 gab es in Chile weder fraude informático noch falsificación
    informática. Sachverhalte, die heute unter Art. 5 und Art. 7 der Ley N° 21.459 fallen, mussten zuvor
    über den allgemeinen Betrug oder gar nicht erfasst werden.

    '
  inkrafttreten:
    datum: 1993-06-07
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=30590
  anwendungsdaten:
  - datum: 2022-06-20
    was_gilt: Aufhebung durch die Ley N° 21.459.
    verifiziert: true
    quelle: https://www.bcn.cl/leychile/consulta/obtxml?opt=7&idNorma=30590
  themenachsen:
  - content
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Vier Tatbestände: Systemzerstörung/-blockade, unbefugter Datenzugriff, Datenbeschädigung, unbefugte
    Offenlegung.'
  - Kein Computerbetrug, keine Datenfälschung — die Lücke, die erst die Ley N° 21.459 geschlossen hat.
