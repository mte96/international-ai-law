- id: id-perpres-ki-geplant
  jurisdiktion: id
  kurztitel: Geplante KI-Präsidialverordnungen Indonesien (Perpres KA)
  offizieller_titel: 'Rancangan Peraturan Presiden tentang Peta Jalan Kecerdasan Artifisial Nasional und
    Rancangan Peraturan Presiden tentang Keamanan dan Etika Kecerdasan Artifisial (Entwurf einer Präsidialverordnung
    über die nationale KI-Roadmap und Entwurf einer Präsidialverordnung über Sicherheit und Ethik künstlicher
    Intelligenz)

    '
  fundstelle: 'Ankündigung des Kementerian Komunikasi dan Digital (Komdigi); Entwürfe 2025 erstellt, Unterzeichnung
    durch den Präsidenten für 2026 angekündigt

    '
  verfahrensnummer: null
  status: entwurf
  status_detail: 'NICHT ERLASSEN. Beide Präsidialverordnungen wurden nach Angaben der damaligen Kommunikationsministerin
    Meutya V. Hafid im Jahr 2025 entworfen und sollten 2026 vom Präsidenten unterzeichnet werden. Eine
    Suche in der Rechtsdatenbank des Rechnungshofs (peraturan.bpk.go.id) nach „kecerdasan artifisial"
    und „kecerdasan buatan" am 06.09.2026 hat KEINE Präsidialverordnung zu künstlicher Intelligenz aus
    2025 oder 2026 ergeben; auch die UNESCO und die OECD verzeichnen keine. Der Befund ist also: angekündigt,
    entworfen, bis zum Stichtag nicht in Kraft.

    '
  kurzbeschreibung: 'Vorgesehen sind zwei Präsidialverordnungen: eine über die nationale KI-Roadmap (Überführung
    der Stranas KA in eine Rechtsform) und eine über Sicherheit und Ethik künstlicher Intelligenz. Nach
    Darstellung des Ministeriums soll jedes Ressort anschließend eigene abgeleitete Vorschriften erlassen;
    die erste Ministerialverordnung soll digitale Plattformen zur Kennzeichnung oder Wasserzeichnung KI-erzeugter
    Inhalte verpflichten. Damit wäre die Kennzeichnungspflicht in Indonesien — anders als in Vietnam —
    auf Verordnungsebene und nicht im Gesetz verankert.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://indonesiabusinesspost.com/5992/cyber-and-espionage/indonesia-prioritizes-ai-regulation-in-2026-says-communications-minister
  themenachsen:
  - governance
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Zwei Perpres: nationale KI-Roadmap und KI-Sicherheit/-Ethik.'
  - Abgeleitete Ressortverordnungen als zweite Ebene.
  - 'Erste geplante Ministerialverordnung: Pflicht digitaler Plattformen zur Kennzeichnung oder Wasserzeichnung
    KI-erzeugter Inhalte.'
  - 'NEGATIVBEFUND 06.09.2026: keine KI-Perpres in peraturan.bpk.go.id auffindbar; UNESCO und OECD verzeichnen
    ebenfalls keine.'
  dokumente:
  - datum: 2026
    typ: bericht
    titel: Indonesia prioritizes AI regulation in 2026, says communications minister
    url: https://indonesiabusinesspost.com/5992/cyber-and-espionage/indonesia-prioritizes-ai-regulation-in-2026-says-communications-minister
    sprache: en
    urheber: Indonesia Business Post (Presse)
    verifiziert: true
    notiz: 'Einzige greifbare Quelle für Inhalt und Zeitplan. Zitiert die Ministerin: die Entwürfe seien
      2025 erstellt worden und sollten 2026 vom Präsidenten unterzeichnet werden; die erste Ministerialverordnung
      solle die Kennzeichnung KI-erzeugter Inhalte vorschreiben. Presse, keine amtliche Quelle.

      '
  - datum: 2026-09-06
    typ: bericht
    titel: Suchergebnis 'kecerdasan artifisial' in der Rechtsdatenbank des BPK
    url: https://peraturan.bpk.go.id/Search?keywords=kecerdasan+artifisial
    sprache: id
    urheber: Badan Pemeriksa Keuangan (BPK), Database Peraturan
    verifiziert: true
    notiz: 'AMTLICHE Rechtsdatenbank. Die Suche ergab am 06.09.2026 nur drei Treffer ohne KI-Bezug im
      Regelungsgegenstand (Permenkes 62/2015, Perda DIY 3/2022, Peraturan BRIN 10/2022 — letztere nennt
      lediglich ein ''Pusat Riset Kecerdasan Artifisial dan Keamanan Siber''). Beleg des Negativbefunds.

      '
  offene_punkte:
  - Ob die Entwürfe öffentlich konsultiert wurden und ob Entwurfstexte vorliegen, war nicht feststellbar.
  - peraturan.go.id und jdih.setneg.go.id waren nicht durchsuchbar (robots.txt-Timeout bzw. HTTP 404);
    der Negativbefund stützt sich allein auf peraturan.bpk.go.id.
  - Die genauen indonesischen Titel der beiden Entwürfe sind nicht belegt; die hier angegebenen sind aus
    der englischen Berichterstattung rückübersetzt und deshalb als Arbeitsbezeichnung zu behandeln.
  - Ob nach dem Ministerwechsel (Komdigi) das Vorhaben fortgeführt wird, ist offen.
  monitoring_quellen:
  - https://peraturan.bpk.go.id/
  - https://jdih.setneg.go.id/
  - https://www.komdigi.go.id/berita/siaran-pers
