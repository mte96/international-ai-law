  jurisdiktion: th
  kurztitel: KI-Verordnungsentwurf Thailand 2022 (ONDE)
  offizieller_titel: '(ร่าง) พระราชกฤษฎีกาการประกอบธุรกิจซึ่งให้บริการเกี่ยวกับระบบปัญญาประดิษฐ์ พ.ศ.
    .... ((Entwurf) Königliche Verordnung über den Betrieb von Unternehmen, die Dienste im Zusammenhang
    mit KI-Systemen erbringen)

    '
  fundstelle: สำนักงานคณะกรรมการดิจิทัลเพื่อเศรษฐกิจและสังคมแห่งชาติ (ONDE), Entwurf Oktober 2565 (2022)
  verfahrensnummer: null
  status: gescheitert
  status_detail: 'Nicht weiterverfolgt. Der Entwurf von 2022 sollte KI-Dienste als anzeige- und aufsichtspflichtiges
    Geschäft nach dem Muster der Königlichen Verordnung über digitale Plattformdienste regeln. Er wurde
    2025 in das Grundsatzpapier für ein KI-Gesetz überführt und damit aufgegeben. Er ist gleichwohl wichtig:
    Er zeigt, dass Thailand zunächst den Weg über eine Königliche Verordnung (untergesetzlich, schnell
    erlassbar) und nicht über ein Parlamentsgesetz gehen wollte.

    '
  kurzbeschreibung: 'Der Entwurf sah vor, den Betrieb von KI-Diensten als eigenes, anzeigepflichtiges
    Geschäft zu erfassen und der Aufsicht der ONDE bzw. ETDA zu unterstellen. Er wählte damit die Rechtsform
    der พระราชกฤษฎีกา (Königliche Verordnung) auf Grundlage des Gesetzes über elektronische Transaktionen
    — dieselbe Konstruktion wie bei der Plattformregulierung von 2022. Zusammen mit dem konkurrierenden
    ETDA-Gesetzentwurf von 2023 bildete er den Ausgangspunkt der Vereinheitlichung von 2025.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://bact.cc/2022/thailand-ai-regulations/
