  status: teilanwendbar
  status_detail: 'In Kraft seit dem 01.01.2026, für Điều 11, 28 und 29 bereits seit dem 01.07.2025 (Điều
    50). Das ursprünglich hier verortete KI-Recht ist NICHT MEHR IN KRAFT: Điều 33 des KI-Gesetzes 134/2025/QH15
    hat mit Wirkung vom 01.03.2026 das gesamte Chương IV (Điều 41-45) sowie khoản 9 Điều 3, khoản 7 Điều
    4, khoản 6 Điều 12 und điểm đ khoản 2 Điều 34 aufgehoben. Das Gesetz bleibt im Übrigen anwendbar (Digitaltechnikindustrie,
    Halbleiter, digitale Vermögenswerte).

    '
  kurzbeschreibung: 'Das Gesetz ordnet die vietnamesische Digitaltechnikindustrie: Förderung, digitale
    Vermögenswerte, Halbleiter, digitale Infrastruktur und Arbeitskräfte. Es enthielt in Chương IV („TRÍ
    TUỆ NHÂN TẠO") die erste gesetzliche KI-Regelung Vietnams — Grundsätze der KI-Entwicklung (Điều 41),
    nationale KI-Strategie (Điều 42), Verwaltung von KI-Systemen mit einer Kategorie der Hochrisiko- und
    der „wirkungsstarken" Systeme (Điều 43), Kennzeichnungspflicht für KI-Systeme und KI-erzeugte digitale
    Produkte (Điều 44) und die Verantwortlichkeiten von Entwicklern, Anbietern und Betreibern (Điều 45).
    Diese Vorschriften galten nur vom 01.01.2026 bis zum 28.02.2026 und wurden dann durch das KI-Gesetz
    ersetzt. Das ist rechtshistorisch bedeutsam: Vietnam hat sein KI-Recht binnen zweier Monate aus dem
    Industriegesetz herausgelöst und verselbständigt.

    '
