- id: id-stranas-ka
  jurisdiktion: id
  kurztitel: Nationale KI-Strategie Indonesien (Stranas KA)
  offizieller_titel: 'Strategi Nasional Kecerdasan Artifisial Indonesia 2020–2045 (Nationale Strategie
    für künstliche Intelligenz Indonesiens 2020–2045)

    '
  fundstelle: 'Vorgestellt am 10.08.2020 zum Hari Kebangkitan Teknologi Nasional (Nationaler Tag des technologischen
    Erwachens); getragen von BPPT/BRIN und dem Kommunikationsministerium

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Strategiepapier ohne Rechtsform. Es war von Anfang an vorgesehen, die Strategie in eine
    Peraturan Presiden (Präsidialverordnung) zu überführen; das ist bis zum Stichtag dieser Recherche
    (06.09.2026) NICHT geschehen. Die Strategie ist damit seit sechs Jahren das politische Leitdokument
    ohne normative Verankerung — der Kern des indonesischen Befunds.

    '
  kurzbeschreibung: 'Die Strategie legt einen 25-Jahres-Horizont bis 2045 (dem hundertsten Jahrestag der
    Unabhängigkeit) fest. Sie benennt Handlungsfelder für Ethik und Politik, Talententwicklung, Infrastruktur
    und Daten sowie Forschung und Industrie und definiert prioritäre Anwendungsbereiche. Sie ist Grundlage
    der angekündigten Präsidialverordnungen und des Rundschreibens 9/2023. Weil sie keine Rechtsform hat,
    begründet sie keine Pflichten.

    '
  inkrafttreten:
    datum: 2020-08-10
    verifiziert: true
    quelle: https://ai-innovation.id/strategi
  themenachsen:
  - governance
  - arbeit
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - Zeithorizont 2020–2045; vorgestellt am 10.08.2020 zum Nationalen Tag des technologischen Erwachens.
  - 'Vier Handlungsfelder: Ethik und Politik, Talent, Infrastruktur und Daten, Forschung und Industrie.'
  - Ausdrücklich als Vorstufe einer Peraturan Presiden konzipiert ('input from stakeholders is needed'
    zur Vorbereitung der förmlichen Verordnung) — die bis heute nicht ergangen ist.
  - Keine Rechtsform, keine Pflichten, keine Sanktionen.
  dokumente:
  - datum: 2020-08-10
    typ: leitlinie
    titel: Strategi Nasional Kecerdasan Artifisial — Portal des Indonesia AI Innovation Center
    url: https://ai-innovation.id/strategi
    sprache: id
    urheber: Indonesia Center for Artificial Intelligence Innovation (KORIKA / BPPT-BRIN-Umfeld)
    verifiziert: true
    notiz: 'Trägerportal der Strategie; belegt Vorstellungsdatum, Zeithorizont und die Absicht, sie in
      eine Perpres zu überführen. Kein Amtsblatt.

      '
  - datum: 2020
    typ: uebersicht
    titel: Indonesia — National AI Strategy (Stranas KA) im OECD.AI-Länderdashboard
    url: https://oecd.ai/en/dashboards/countries/Indonesia
    sprache: en
    urheber: OECD.AI Policy Observatory
    verifiziert: true
    notiz: 'Belegt, dass die Strategie die EINZIGE von der OECD erfasste indonesische KI-Politikinitiative
      ist — kein Präsidialdekret, keine Verordnung.

      '
  offene_punkte:
  - Der Volltext der Strategie wurde nicht beschafft; die vier Handlungsfelder sind aus der Trägerdarstellung
    und der OECD-Erfassung rekonstruiert und nicht am Dokument geprüft.
  - Die prioritären Anwendungsbereiche (in der Literatur werden Gesundheit, Verwaltungsreform, Bildung,
    Ernährungssicherheit und Mobilität genannt) sind nicht belegt.
