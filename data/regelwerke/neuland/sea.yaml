regelwerke:
- id: vn-ki-gesetz-134-2025
  jurisdiktion: vn
  kurztitel: KI-Gesetz Vietnam (Luật Trí tuệ nhân tạo)
  offizieller_titel: 'Luật Trí tuệ nhân tạo (Gesetz über künstliche Intelligenz), Luật số 134/2025/QH15

    '
  fundstelle: 'Quốc hội khóa XV, kỳ họp thứ 10; ausgefertigt am 10.12.2025, unterzeichnet vom Vorsitzenden
    der Nationalversammlung Trần Thanh Mẫn. Verkündet im Công báo (Amtsblatt) Nr. 40 vom 22.01.2026.

    '
  verfahrensnummer: Luật số 134/2025/QH15
  status: anwendbar
  status_detail: 'In Kraft seit dem 01.03.2026 (Điều 34). Erstes umfassendes KI-Gesetz Südostasiens und
    eines der weltweit ersten außerhalb der EU, das ein risikobasiertes Modell mit Verbotskatalog, Konformitätsbewertung
    und Kennzeichnungspflicht verbindet. Die Durchführungsverordnung Nghị định 142/2026/NĐ-CP ist ergangen;
    der Umsetzungsplan der Regierung steht in Quyết định 367/QĐ-TTg vom 03.03.2026. Für Systeme, die vor
    dem 01.03.2026 in Betrieb waren, gelten nach Điều 35 Übergangsfristen.

    '
  kurzbeschreibung: 'Das Gesetz regelt Forschung, Entwicklung, Bereitstellung, Einsatz und Nutzung von
    KI-Systemen in Vietnam. Es ordnet KI-Systeme in drei Risikostufen (hoch, mittel, gering) ein und knüpft
    daran abgestufte Pflichten: Hochrisikosysteme unterliegen einer Konformitätsbewertung vor Inbetriebnahme,
    einer Dokumentations- und Aufsichtspflicht sowie der Eintragung in eine nationale Datenbank. Anbieter
    müssen offenlegen, dass ein Nutzer mit einem KI-System interagiert; KI-erzeugte Audio-, Bild- und
    Videoinhalte, die über echte Personen täuschen können, sind maschinenlesbar zu kennzeichnen. Điều
    7 enthält einen Katalog verbotener Praktiken (systematische Täuschung und Manipulation der menschlichen
    Wahrnehmung, Ausnutzung schutzbedürftiger Gruppen, Desinformation zulasten der nationalen Sicherheit).
    Verstöße ziehen nach Điều 29 verwaltungs-, zivil- und strafrechtliche Folgen nach sich; der Betreiber
    haftet für Schäden aus dem Betrieb von Hochrisikosystemen, mit Entlastung bei Nutzerverschulden und
    höherer Gewalt. Zuständig ist das Bộ Khoa học và Công nghệ (Ministerium für Wissenschaft und Technologie).

    '
