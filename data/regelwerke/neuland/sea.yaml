  kurztitel: Nationaler KI-Aktionsplan Thailand 2022–2027
  offizieller_titel: 'แผนปฏิบัติการด้านปัญญาประดิษฐ์แห่งชาติเพื่อการพัฒนาประเทศไทย (พ.ศ. 2565 – 2570)
    (Nationaler Aktionsplan für künstliche Intelligenz zur Entwicklung Thailands, B.E. 2565–2570 / 2022–2027)

    '
  fundstelle: Kabinettsbeschluss (มติคณะรัฐมนตรี), 2564/2565; getragen von MHESI, MDES, NECTEC/NSTDA
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Vom Kabinett beschlossener Aktionsplan ohne Bindungswirkung gegenüber Privaten. Er ist
    der politische Rahmen, in dem die Gesetzgebungsarbeit steht, und begründet den คณะกรรมการเฉพาะด้านการขับเคลื่อนแผนด้านปัญญาประดิษฐ์แห่งชาติ
    (nationaler KI-Ausschuss), dem der Gesetzentwurf von 2026 die Gesamtpolitik zuweist.

    '
  kurzbeschreibung: 'Der Plan hat fünf Handlungsstränge: ethische und rechtliche Grundlagen, Infrastruktur,
    Kompetenzentwicklung, KI-Innovation in Wirtschaft und Verwaltung sowie Förderung des KI-Ökosystems.
    Der erste Strang ist der Ursprung sowohl der ETDA-Leitlinien zu generativer KI als auch der Gesetzgebungsvorhaben.
    Träger sind das Ministerium für Hochschulwesen, Wissenschaft, Forschung und Innovation und das Ministerium
    für digitale Wirtschaft und Gesellschaft, operativ NECTEC und NSTDA.

    '
