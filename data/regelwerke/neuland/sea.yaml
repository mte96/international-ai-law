  kurztitel: Internet- und Online-Inhalte-Verordnung Vietnam (Nghị định 147/2024)
  offizieller_titel: 'Nghị định số 147/2024/NĐ-CP về quản lý, cung cấp, sử dụng dịch vụ internet và thông
    tin trên mạng (Verordnung über Verwaltung, Bereitstellung und Nutzung von Internetdiensten und Informationen
    im Netz)

    '
  fundstelle: Chính phủ, Nghị định số 147/2024/NĐ-CP vom 09.11.2024
  verfahrensnummer: 147/2024/NĐ-CP
  status: anwendbar
  status_detail: 'In Kraft seit dem 25.12.2024. NEGATIVBEFUND: Die Verordnung enthält entgegen der Erwartung
    KEINE KI-spezifische Vorschrift — weder zur Kennzeichnung KI-erzeugter Inhalte noch zu Empfehlungssystemen
    noch zu Deepfakes. Sie ist gleichwohl der prozedurale Rahmen, in dem KI-erzeugte rechtswidrige Inhalte
    in Vietnam behandelt werden: Kontoverifizierung, Melde- und Löschungspflichten, Verantwortlichkeit
    grenzüberschreitender Diensteanbieter.

    '
  kurzbeschreibung: 'Die Verordnung regelt Internetdienste, Domainverwaltung (.vn), Internetzugangspunkte,
    Informationssicherheit im Netz, Online-Spiele und Domainstreitigkeiten. Sie verpflichtet Plattformen
    zur Verifizierung von Nutzerkonten (Telefonnummer oder Personalausweis) und zur Entfernung rechtswidriger
    Inhalte binnen kurzer Fristen nach Aufforderung. KI-erzeugte Inhalte werden nicht gesondert erfasst;
    sie unterliegen denselben Melde- und Löschungspflichten wie andere Inhalte. Für die Praxis heißt das:
    Die Kennzeichnungspflicht für KI-Inhalte ergibt sich in Vietnam allein aus Điều 11 des KI-Gesetzes,
    ihre Durchsetzung gegenüber Plattformen aber aus dieser Verordnung.

    '
