- id: id-uu-ite-1-2024
  jurisdiktion: id
  kurztitel: ITE-Gesetz Indonesien in der Fassung 2024 (UU ITE)
  offizieller_titel: 'Undang-Undang Nomor 1 Tahun 2024 tentang Perubahan Kedua atas Undang-Undang Nomor
    11 Tahun 2008 tentang Informasi dan Transaksi Elektronik (Gesetz Nr. 1 von 2024 über die zweite Änderung
    des Gesetzes Nr. 11 von 2008 über elektronische Information und elektronische Transaktionen)

    '
  fundstelle: Lembaran Negara RI Tahun 2024 Nomor 1, Tambahan Lembaran Negara Nomor 6905
  verfahrensnummer: UU No. 1 Tahun 2024
  status: anwendbar
  status_detail: 'Ausgefertigt und verkündet am 02.01.2024, in Kraft mit dem Tag der Verkündung. Zweite
    Novelle des ITE-Stammgesetzes von 2008 nach der ersten Novelle durch UU 19/2016. Das ITE-Gesetz ist
    Indonesiens zentrales Inhaltsstrafgesetz für den digitalen Raum und damit die Norm, an der Deepfakes
    und KI-erzeugte Falschinformationen heute entschieden werden — es nennt künstliche Intelligenz allerdings
    nicht.

    '
  kurzbeschreibung: 'Das Gesetz regelt elektronische Informationen, elektronische Dokumente und elektronische
    Transaktionen sowie verbotene Handlungen im Netz. Die Novelle 2024 hat die Straftatbestände neu geordnet:
    Pasal 27A mit Pasal 45 Abs. 4 erfasst ehrverletzende Inhalte gegen einzelne Personen, Pasal 28 Abs.
    2 mit Pasal 45A Abs. 2 die Verbreitung von Inhalten, die Hass oder Feindschaft gegen Gruppen schüren,
    und Pasal 28 Abs. 3 mit Pasal 45A Abs. 3 Aufwiegelungstatbestände. Diese Vorschriften sind die Auffangnormen
    für KI-erzeugte Bild-, Ton- und Videomanipulationen; eine ausdrückliche Deepfake- oder KI-Norm enthält
    das Gesetz nicht. Zusammen mit dem Datenschutzgesetz bildet es den geltenden Rahmen, in dem KI-Sachverhalte
    in Indonesien zu lösen sind, solange die Präsidialverordnungen ausstehen.

    '
  inkrafttreten:
    datum: 2024-01-02
    verifiziert: true
    quelle: https://peraturan.bpk.go.id/Details/274494/uu-no-1-tahun-2024
  themenachsen:
  - content
  - grundrechte
  - haftung
  - vertrag
  regelungsschwerpunkte:
  - 'Pasal 27A i.V.m. Pasal 45 Abs. 4: ehrverletzende Inhalte gegen einzelne Personen.'
  - 'Pasal 28 Abs. 2 i.V.m. Pasal 45A Abs. 2: Verbreitung von Inhalten, die Hass oder Feindschaft gegen
    Gruppen schüren.'
  - 'Pasal 28 Abs. 3 i.V.m. Pasal 45A Abs. 3: Aufwiegelung.'
  - KEINE ausdrückliche KI-, Deepfake- oder Kennzeichnungsvorschrift — die geplante Kennzeichnungspflicht
    soll erst über eine Ministerialverordnung nach den Präsidialverordnungen kommen.
  - Ändert UU 11/2008 (Stammgesetz) und UU 19/2016 (erste Novelle).
  dokumente:
  - datum: 2024-01-02
    typ: endfassung
    titel: Undang-undang (UU) Nomor 1 Tahun 2024 tentang Perubahan Kedua atas UU Nomor 11 Tahun 2008
    url: https://peraturan.bpk.go.id/Details/274494/uu-no-1-tahun-2024
    sprache: id
    urheber: Badan Pemeriksa Keuangan (BPK), Database Peraturan
    verifiziert: true
    notiz: 'AMTLICHE Rechtsdatenbank. Hier abgerufen; belegt Titel, Daten (02.01.2024), Fundstelle LN
      2024/1, TLN 6905, die geänderten Gesetze und die genannten Straftatbestände.

      '
  - datum: 2024-01-02
    typ: endfassung
    titel: UU Nomor 1 Tahun 2024 — amtliche Volltext-PDF
    url: https://peraturan.bpk.go.id/Download/332870/UU%20Nomor%201%20Tahun%202024.pdf
    sprache: id
    urheber: Badan Pemeriksa Keuangan (BPK)
    verifiziert: false
    notiz: Amtliche Volltext-PDF; in dieser Sitzung nicht ausgewertet.
  offene_punkte:
  - Der Wortlaut von Pasal 27A, 28 Abs. 2 und 3 sowie der Strafrahmen wurde nicht am Text geprüft.
  - Die konsolidierte Fassung des ITE-Gesetzes (UU 11/2008 i.d.F. 19/2016 und 1/2024) wurde nicht beschafft.
  - Die Durchführungsverordnung PP 71/2019 über die Durchführung elektronischer Systeme und Transaktionen
    (Penyelenggaraan Sistem dan Transaksi Elektronik) ist NICHT erfasst — sie regelt die Pflichten der
    Betreiber elektronischer Systeme und ist für KI-Dienste vermutlich einschlägig. Nachzuholen.
  - Ob nach der Novelle 2024 Gerichtsentscheidungen zu KI-erzeugten Inhalten ergangen sind, war nicht
    feststellbar.
