  status: anwendbar
  status_detail: 'Durchführungsverordnung zum Datenschutzgesetz 91/2025/QH15, ergangen am 31.12.2025,
    einen Tag vor dessen Inkrafttreten. Sie tritt an die Stelle des Nghị định 13/2023/NĐ-CP.

    '
  kurzbeschreibung: 'Die Verordnung konkretisiert die Pflichten des Datenschutzgesetzes: Einwilligung,
    Datenschutz-Folgenabschätzung (hồ sơ đánh giá tác động xử lý dữ liệu cá nhân), Anzeige grenzüberschreitender
    Übermittlungen und Verfahren gegenüber dem Ministerium für öffentliche Sicherheit. Für KI-Sachverhalte
    ist sie die Ebene, auf der sich entscheidet, ob eine KI-gestützte Verarbeitung eine Folgenabschätzung
    auslöst und wie deren Unterlagen auszusehen haben.

    '
