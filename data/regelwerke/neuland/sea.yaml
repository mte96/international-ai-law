- id: my-cma-1998
  jurisdiktion: my
  kurztitel: Kommunikations- und Multimediagesetz Malaysia (CMA 1998, Act 588)
  offizieller_titel: 'Communications and Multimedia Act 1998 [Act 588] — Akta Komunikasi dan Multimedia
    1998, geändert durch den Communications and Multimedia (Amendment) Act 2025

    '
  fundstelle: Laws of Malaysia, Act 588; Änderungsgesetz 2025
  verfahrensnummer: Act 588
  status: anwendbar
  status_detail: 'Geltendes Recht. Für KI-erzeugte Inhalte ist Section 233(1)(a) die praktisch am häufigsten
    angewandte Norm: Sie stellt die Übermittlung von Mitteilungen unter Strafe, die obszön, unanständig,
    falsch, bedrohlich oder beleidigend („offensive") sind und mit der Absicht übermittelt werden, eine
    andere Person zu belästigen, zu missbrauchen, zu bedrohen oder zu belästigen. Die Vorschrift ist verfassungsrechtlich
    umstritten: Das Court of Appeal hat 2025 über die Verfassungsmäßigkeit der Merkmale „offensive" und
    „with intention to annoy" entschieden, die Regierung hat Rechtsmittel eingelegt. Der Communications
    and Multimedia (Amendment) Act 2025 hat das Gesetz geändert.

    '
  kurzbeschreibung: 'Das CMA ist das Rahmengesetz für Telekommunikation, Rundfunk und Onlinedienste in
    Malaysia und begründet die Suruhanjaya Komunikasi dan Multimedia Malaysia (MCMC) als Aufsichtsbehörde.
    Section 233 ist die zentrale Inhaltsstrafnorm; sie wird auf Deepfakes, KI-erzeugte Falschinformationen
    und manipulierte Bilder angewandt, ohne diese ausdrücklich zu nennen. Die Novelle 2025 erweiterte
    unter anderem die Durchsetzungsbefugnisse. Das Zusammenspiel von Section 233 CMA, Online Safety Act
    2025 und dem geplanten AI Governance Bill ist die zentrale Strukturfrage des malaysischen KI-Inhaltsrechts:
    Die Regierung will KI-Ausgaben ausdrücklich NICHT im KI-Gesetz, sondern hier regeln.

    '
  inkrafttreten:
    datum: 1999-04-01
    verifiziert: false
    quelle: https://www.lhlow.com.my/the-cost-of-a-comment-when-online-speech-becomes-a-crime/
  themenachsen:
  - content
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Section 233(1)(a): Übermittlung obszöner, unanständiger, falscher, bedrohlicher oder beleidigender
    Mitteilungen mit Belästigungsabsicht. Die Auffangnorm für KI-erzeugte rechtswidrige Inhalte.'
  - 'VERFASSUNGSSTREIT: Das Court of Appeal hat 2025 über die Verfassungsmäßigkeit der Merkmale ''offensive''
    und ''with intention to annoy'' entschieden; die Regierung hat im Oktober 2025 Rechtsmittel eingelegt.
    Verfahren offen.'
  - 'Communications and Multimedia (Amendment) Act 2025: Änderung des Gesetzes, u.a. Erweiterung der Durchsetzungsbefugnisse.'
  - Begründet die MCMC als Aufsichtsbehörde — dieselbe Behörde, die den Online Safety Act durchsetzt.
  - KEINE ausdrückliche KI- oder Deepfake-Vorschrift.
  dokumente:
  - datum: 2025
    typ: uebersicht
    titel: Court of Appeal Delivers Landmark Ruling on the Constitutionality of Section 233(1)(a) CMA
      1998
    url: https://www.lexology.com/library/detail.aspx?g=6132aec7-5341-4a0d-a6bc-8fb79aac3328
    sprache: en
    urheber: Lexology (Kanzleimonitor)
    verifiziert: false
    notiz: 'Bericht über die Entscheidung des Court of Appeal. Das Aktenzeichen und der Volltext wurden
      in dieser Sitzung nicht ermittelt; siehe offene_punkte.

      '
