- id: vn-pdpl-91-2025
  jurisdiktion: vn
  kurztitel: Datenschutzgesetz Vietnam (Luật Bảo vệ dữ liệu cá nhân)
  offizieller_titel: 'Luật Bảo vệ dữ liệu cá nhân (Gesetz über den Schutz personenbezogener Daten), Luật
    số 91/2025/QH15

    '
  fundstelle: 'Quốc hội khóa XV, ausgefertigt 26.06.2025, unterzeichnet Trần Thanh Mẫn; Công báo Nr. 971+972
    vom 24.07.2025

    '
  verfahrensnummer: Luật số 91/2025/QH15
  status: anwendbar
  status_detail: 'In Kraft seit dem 01.01.2026. Es ersetzt das bisherige Verordnungsregime des Nghị định
    13/2023/NĐ-CP, das mit demselben Tag außer Kraft trat. Durchführungsverordnung ist Nghị định 356/2025/NĐ-CP
    vom 31.12.2025. Für KI ist das Gesetz die praktisch wichtigste Norm: Điều 30 regelt die Verarbeitung
    personenbezogener Daten in Big-Data-, KI-, Blockchain-, Metaverse- und Cloud-Umgebungen ausdrücklich
    und verlangt für KI-gestützte Verarbeitung eine risikobasierte Klassifizierung.

    '
  kurzbeschreibung: 'Das Gesetz gliedert sich in 5 Kapitel mit 39 Artikeln. Es begründet Betroffenenrechte,
    Pflichten von Verantwortlichen und Auftragsverarbeitern, Vorgaben für grenzüberschreitende Übermittlung
    und eine Folgenabschätzungspflicht. Für KI einschlägig ist vor allem Điều 30 („Bảo vệ dữ liệu cá nhân
    trong hoạt động dữ liệu lớn, trí tuệ nhân tạo, chuỗi khối, vũ trụ ảo, điện toán đám mây"), der die
    Zweckbindung auch in KI-Umgebungen festschreibt, technische Sicherungsmaßnahmen verlangt und ausdrücklich
    anordnet, dass die Verarbeitung personenbezogener Daten mittels künstlicher Intelligenz eine risikostufenbasierte
    Einordnung anwenden muss. Điều 31 regelt Standort- und biometrische Daten mit physischen Sicherungs-,
    Zugriffsbeschränkungs- und Überwachungspflichten — die Grundlage für Gesichtserkennungsfälle. Der
    Bußgeldrahmen des Điều 8 ist scharf: Kauf und Verkauf personenbezogener Daten das Zehnfache des erlangten
    Vorteils, Verstöße gegen die Regeln zur grenzüberschreitenden Übermittlung bis 5 % des Vorjahresumsatzes,
    sonstige Verstöße bis 3 Mrd. VND, für natürliche Personen die Hälfte.

    '
  inkrafttreten:
    datum: 2026-01-01
    verifiziert: true
    quelle: https://congbao.chinhphu.vn/van-ban/luat-so-91-2025-qh15-45578.htm
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - gpai
  regelungsschwerpunkte:
  - 'Điều 8: Sanktionen — 10-facher Vorteil bei Datenhandel, 5 % Vorjahresumsatz bei rechtswidriger Auslandsübermittlung,
    bis 3 Mrd. VND sonst, 50 % für natürliche Personen.'
  - 'Điều 30: KI, Big Data, Blockchain, Metaverse, Cloud. Zweckbindung; eingebaute Datensicherheitsmaßnahmen;
    ausdrückliche Pflicht zur risikostufenbasierten Klassifizierung bei KI-gestützter Verarbeitung personenbezogener
    Daten — die inhaltliche Brücke zum KI-Gesetz.'
  - 'Điều 31: Standortdaten und biometrische Daten; Legaldefinition biometrischer Daten; physische Sicherung
    von Speicher- und Übertragungsgeräten; Zugriffsbeschränkung; Überwachungssystem zur Erkennung von
    Verletzungen.'
  - 5 Kapitel, 39 Artikel; Ablösung des Nghị định 13/2023/NĐ-CP zum 01.01.2026.
