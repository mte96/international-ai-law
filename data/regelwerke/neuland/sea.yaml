    war nicht textlesbar, hukumonline lieferte HTTP 404. Diese Nummer (vermutlich im Bereich Pasal 8 bis
    15) ist der erste Punkt, den der nächste Bearbeiter beschaffen muss — ohne sie lässt sich die Norm
    nicht zitieren.
