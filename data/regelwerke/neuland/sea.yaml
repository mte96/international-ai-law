  kurztitel: Notdekret Technologiekriminalität Thailand (พ.ร.ก.อาชญากรรมทางเทคโนโลยี ฉบับที่ 2)
  offizieller_titel: 'พระราชกำหนดมาตรการป้องกันและปราบปรามอาชญากรรมทางเทคโนโลยี (ฉบับที่ ๒) พ.ศ. ๒๕๖๘
    (Notverordnung über Maßnahmen zur Verhütung und Bekämpfung von Technologiekriminalität (Nr. 2), B.E.
    2568 / 2025)

    '
  fundstelle: ราชกิจจานุเบกษา, verkündet 12.04.2568 (2025); in Kraft ab 13.04.2568 (2025)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit dem 13.04.2025. Die Notverordnung ändert das Notdekret von B.E. 2566 (2023)
    und macht Finanzinstitute, Telekommunikations- anbieter und Betreiber sozialer Netzwerke für Schäden
    aus Technologiekriminalität mitverantwortlich, sofern sie nicht nachweisen, dass sie die vorgeschriebenen
    Maßnahmen eingehalten haben. Für die KI-Praxis ist das die wirtschaftlich schärfste thailändische
    Norm: KI-gestützte Betrugsmaschen (Stimmklone, Deepfake-Videoanrufe, Call-Center-Betrug) lösen eine
    Einstandspflicht der Intermediäre aus.

    '
  kurzbeschreibung: 'Die Notverordnung reagiert auf die Welle technologiegestützter Betrugsdelikte. Sie
    verpflichtet Banken, Mobilfunkanbieter und Anbieter sozialer Netzwerke zu Präventions- und Sperrmaßnahmen
    und kehrt die Beweislast um: Wer die vorgeschriebenen Maßnahmen nicht nachweisen kann, haftet für
    den Schaden des Geschädigten mit. Die Bank of Thailand hat eigene Bekanntmachungen zur Konkretisierung
    der Pflichten der Finanzinstitute erlassen. Eine ausdrückliche Nennung von KI oder Deepfakes enthält
    die Verordnung nach den ausgewerteten Quellen nicht; sie wirkt aber unmittelbar auf KI-gestützte Betrugsformen,
    weil sie an das Ergebnis und nicht an die Technik anknüpft.

    '
  inkrafttreten:
    datum: 2025-04-13
    verifiziert: false
    quelle: https://www.bot.or.th/th/news-and-media/news/news-20250413.html
  themenachsen:
  - haftung
  - sektor-finanz
  - content
  - governance
  regelungsschwerpunkte:
  - Mitverantwortung von Finanzinstituten, Telekommunikationsanbietern und Betreibern sozialer Netzwerke
    für Schäden aus Technologiekriminalität.
  - 'Beweislastumkehr: Entlastung nur bei Nachweis der Einhaltung der vorgeschriebenen Maßnahmen.'
  - Konkretisierung durch Bekanntmachungen der ธนาคารแห่งประเทศไทย (Bank of Thailand).
  - KEINE ausdrückliche KI- oder Deepfake-Vorschrift, aber unmittelbare Wirkung auf KI-gestützten Betrug
    (Stimmklone, Deepfake-Videoanrufe).
