  - wettbewerb
  regelungsschwerpunkte:
  - 'Werkbegriff und Urheberschaft: nur natürliche Personen; Grundlage des Ausschlusses vollständig maschinell
    erzeugter Werke.'
  - Abschließender Schrankenkatalog — dogmatische Grundfrage, ob Điều 37a der Verordnung 17/2023 (i.d.F.
    134/2026) davon gedeckt ist.
  - Technische Schutzmaßnahmen und Rechteverwaltungsinformationen (Novelle 2022) als Träger des maschinenlesbaren
    Opt-out.
