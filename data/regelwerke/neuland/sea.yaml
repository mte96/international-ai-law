  - datum: 2025-03-20
    typ: konsultation
    titel: 'Public Consultation Paper No. 2/2025: Data Protection By Design Guideline'
    url: https://www.pdp.gov.my/ppdpv1/en/akta/public-consultation-paper-no-2-2025-data-protection-by-design-guideline/
    sprache: en
