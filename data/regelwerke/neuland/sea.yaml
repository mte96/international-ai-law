- id: my-pdpa-2010
  jurisdiktion: my
  kurztitel: Datenschutzgesetz Malaysia (PDPA 2010, Act 709)
  offizieller_titel: 'Personal Data Protection Act 2010 [Act 709] — Akta Perlindungan Data Peribadi 2010,
    in der Fassung des Personal Data Protection (Amendment) Act 2024 [Act A1727]

    '
  fundstelle: Laws of Malaysia, Act 709; Änderungsgesetz Act A1727 (2024)
  verfahrensnummer: Act 709 / Act A1727
  status: anwendbar
  status_detail: 'Das Stammgesetz gilt seit 2013. Die Novelle Act A1727 erhielt am 09.10.2024 die königliche
    Zustimmung, wurde am 17.10.2024 im Gazette verkündet und tritt nach Section 1(2) gestaffelt an vom
    Minister bekanntzumachenden Tagen in Kraft; die erste Stufe lief zum 01.01.2025 an. Aufsicht ist das
    Jabatan Perlindungan Data Peribadi (JPDP / Personal Data Protection Department) unter dem Kementerian
    Digital. Das Gesetz kennt bisher KEINE ausdrückliche Vorschrift zu automatisierten Einzelentscheidungen;
    die Behörde hat dazu 2025 ein Konsultationspapier vorgelegt (siehe my-pdp-admp-leitlinie).

    '
  kurzbeschreibung: 'Die PDPA folgt einem Sieben-Grundsätze-Modell (General, Notice and Choice, Disclosure,
    Security, Retention, Data Integrity, Access). Die Novelle 2024 ersetzt durchgehend den Begriff „data
    user" durch „data controller", führt eine Meldepflicht für Datenschutzverletzungen und die Pflicht
    zur Bestellung eines Datenschutzbeauftragten ein, liberalisiert die grenzüberschreitende Übermittlung,
    erstreckt Pflichten auf Auftragsverarbeiter und ergänzt ein Recht auf Datenübertragbarkeit. Für KI
    ist das Gesetz doppelt einschlägig: als Rechtsgrundlage für die Verarbeitung von Trainingsdaten und
    als Schranke für biometrische Systeme. Die Behörde hat 2025 drei Leitlinien-Konsultationen durchgeführt
    — Datenschutz-Folgenabschätzung, Data Protection by Design und automatisierte Entscheidungsfindung
    und Profiling — und damit die Lücke zu schließen begonnen, die das Gesetz gegenüber der DSGVO lässt.

    '
  inkrafttreten:
    datum: 2013-11-15
    verifiziert: false
    quelle: https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-amendment-act-2024/
  anwendungsdaten:
  - datum: 2025-01-01
    was_gilt: Erste Stufe des Inkrafttretens des Personal Data Protection (Amendment) Act 2024 [Act A1727].
    verifiziert: false
    quelle: https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-amendment-act-2024/
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - Sieben Datenschutzgrundsätze; Section 5 PDPA ist die Grundnorm, enthält aber KEINE Regelung automatisierter
    Entscheidungen.
  - 'Act A1727: königliche Zustimmung am 09.10.2024, Verkündung im Gazette am 17.10.2024. Section 1(2):
    Inkrafttreten an einem vom Minister durch Bekanntmachung im Gazette zu bestimmenden Tag, mit der Möglichkeit
    unterschiedlicher Daten für einzelne Vorschriften.'
  - 'Neue Section 12A: Pflicht von Verantwortlichen und Auftragsverarbeitern, einen oder mehrere Datenschutzbeauftragte
    zu bestellen.'
  - 'Neue Section 12B: Meldung von Datenschutzverletzungen an den Commissioner ''as soon as practicable''
    und an die Betroffenen ohne unnötige Verzögerung, wenn erheblicher Schaden droht.'
  - 'Neue Section 43A: Recht auf Datenübertragbarkeit — Übermittlung an einen anderen Verantwortlichen,
    soweit technisch machbar.'
  - 'Geänderte Section 129: Auslandsübermittlung nicht mehr durch Ministerliste, sondern nach Einschätzung
    des Verantwortlichen, ob die Zielrechtsordnung gleichwertigen Schutz bietet.'
  - Begriffswechsel 'data user' zu 'data controller' durchgehend.
  - 'NEGATIVBEFUND: Das Änderungsgesetz enthält KEINE Vorschrift zu automatisierter Entscheidungsfindung
    oder Profilbildung — die Lücke, die die ADMP-Leitlinie schließen soll, bleibt auf Gesetzesebene bestehen.'
  - 'Leitlinien-Programm der Behörde 2025: DPIA, Data Protection by Design, Automated Decision Making
    and Profiling, Cross-Border Transfer, DPO.'
  dokumente:
  - datum: 2024-11
    typ: endfassung
    titel: Personal Data Protection (Amendment) Act 2024 [Act A1727] — amtliche PDF
    url: https://www.pdp.gov.my/ppdpv1/wp-content/uploads/2024/11/Act-A1727.pdf
    sprache: en
    urheber: Jabatan Perlindungan Data Peribadi (JPDP) / Attorney General's Chambers
    verifiziert: true
    notiz: 'AMTLICHE Volltext-PDF des Änderungsgesetzes auf dem Server der Datenschutzbehörde. Hier abgerufen;
      königliche Zustimmung 09.10.2024, Verkündung 17.10.2024, Section 1(2) Inkrafttretensvorbehalt, neue
      Sections 12A, 12B, 43A und Änderung der Section 129 sind dem Text entnommen. Der Negativbefund zu
      automatisierter Entscheidungsfindung ebenfalls.

      '
  - datum: 2024
    typ: uebersicht
    titel: Personal Data Protection (Amendment) Act 2024 — Seite der Datenschutzbehörde
    url: https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-amendment-act-2024/
    sprache: en
    urheber: Jabatan Perlindungan Data Peribadi (JPDP)
    verifiziert: true
    notiz: Amtliche Behördenseite; belegt die Aktennummer A1727 und den Begriffswechsel.
  offene_punkte:
  - Das genaue Datum des Inkrafttretens des Stammgesetzes (15.11.2013) ist nicht am amtlichen Text geprüft.
  - Die gestaffelten Inkrafttretensdaten der Novelle sind nicht vollständig ermittelt; die maßgeblichen
    Ministerbekanntmachungen im Gazette wurden nicht beschafft, lom.agc.gov.my war nicht abrufbar (robots.txt-Fehler
    HTTP 500).
  - Bußgeldrahmen nach der Novelle nicht erfasst.
  - Konsolidierte Fassung des Act 709 in der Fassung des Act A1727 nicht beschafft; die Angaben zum Stammgesetz
    beruhen auf dem Änderungsgesetz und auf Sekundärquellen.
  - Ob die Datenschutzbehörde Entscheidungen zu KI-Sachverhalten veröffentlicht hat, war nicht feststellbar.
