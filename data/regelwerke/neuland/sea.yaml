  offene_punkte:
  - Der genaue Wortlaut von Điều 37a und 37b ist nur über eine nichtamtliche Volltextfassung belegt; die
    amtliche PDF war über den gesperrten CDN nicht erreichbar.
  - Ob 'không có mục đích thương mại' (ohne kommerziellen Zweck) das Training kommerzieller Modelle vollständig
    ausschließt oder nur die Verwertung des Ergebnisses, ist eine Auslegungsfrage von erheblicher Tragweite
    und in den ausgewerteten Quellen nicht behandelt.
  - Verhältnis der Aufbewahrungspflicht des Điều 37a zur Transparenzpflicht des Điều 11 KI-Gesetz ungeklärt.
  - Ob die Verwertungsgesellschaften bereits ein Vorbehaltsregister nach Điều 37b eingerichtet haben,
    war nicht feststellbar.
