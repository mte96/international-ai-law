- id: vn-nd-142-2026
  jurisdiktion: vn
  kurztitel: KI-Durchführungsverordnung Vietnam (Nghị định 142/2026)
  offizieller_titel: 'Nghị định số 142/2026/NĐ-CP quy định chi tiết một số điều và biện pháp thi hành
    Luật Trí tuệ nhân tạo (Verordnung zur näheren Regelung einzelner Vorschriften und zu Durchführungsmaßnahmen
    des KI-Gesetzes)

    '
  fundstelle: 'Chính phủ (Regierung), Nghị định số 142/2026/NĐ-CP vom 30.04.2026; amtliche PDF: datafiles.chinhphu.vn/cpp/files/vbpq/2026/4/142-2026-ndcp.signed.pdf

    '
  verfahrensnummer: 142/2026/NĐ-CP
  status: anwendbar
  status_detail: 'Ergangen am 30.04.2026 auf Grundlage des Luật Trí tuệ nhân tạo. Das Wirksamkeitsdatum
    ist widersprüchlich belegt: vanban.chinhphu.vn nennt den 01.05.2026, die staatliche Nachrichtenagentur
    VietnamPlus den 09.05.2026. Die Verordnung konkretisiert die Risikoeinstufung, das einheitliche KI-Portal
    und die nationale KI-Datenbank.

    '
  kurzbeschreibung: 'Die Verordnung führt das dreistufige Risikomodell des KI-Gesetzes aus. Hochrisikosysteme
    sind diejenigen, die in einer vom Ministerpräsidenten zu erlassenden „Danh mục hệ thống trí tuệ nhân
    tạo có rủi ro cao" (Liste der Hochrisiko-KI-Systeme) nach Điều 13 Abs. 4 des KI-Gesetzes aufgeführt
    sind. Systeme mittleren Risikos bestimmen sich nach den Kriterien des Điều 9 der Verordnung, alle
    übrigen gelten als geringes Risiko. Anbieter müssen die Einstufung vor Inbetriebnahme selbst vornehmen
    („thực hiện phân loại hệ thống trí tuệ nhân tạo trước khi đưa hệ thống vào sử dụng") und haften rechtlich
    für ihre Richtigkeit und Wahrhaftigkeit. Wer ein System ändert oder seinen Verwendungszweck so verschiebt,
    dass höhere Risiken entstehen, muss mit dem Anbieter eine Neueinstufung abstimmen. Das Ministerium
    für Wissenschaft und Technologie stellt ein elektronisches Bewertungswerkzeug bereit, dessen Nutzung
    ausdrücklich freiwillig ist („không bắt buộc") und kein zusätzliches Verwaltungsverfahren begründet.
    Das Ministerium betreibt zudem das einheitliche KI-Portal und die nationale KI-Systemdatenbank.

    '
  inkrafttreten:
    datum: 2026-05-01
    verifiziert: false
    quelle: https://vanban.chinhphu.vn/?pageid=27160&docid=218029
  themenachsen:
  - marktzugang
  - governance
  - content
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - Einstufungspflicht des Anbieters vor Inbetriebnahme, mit gesetzlicher Verantwortlichkeit für die Richtigkeit
    der Einstufung.
  - Hochrisiko = Aufnahme in die vom Ministerpräsidenten zu erlassende 'Danh mục hệ thống trí tuệ nhân
    tạo có rủi ro cao' (Điều 13 Abs. 4 KI-Gesetz).
  - 'Điều 9 der Verordnung: Kriterien für die mittlere Risikostufe.'
  - Pflicht zur Neueinstufung bei Änderung des Systems oder des Verwendungszwecks, in Abstimmung mit dem
    Anbieter.
  - Freiwilliges elektronisches Selbstbewertungswerkzeug des Bộ Khoa học và Công nghệ; ausdrücklich kein
    neues Verwaltungsverfahren.
  - Betrieb des 'Cổng thông tin điện tử một cửa về trí tuệ nhân tạo' (einheitliches elektronisches KI-Portal)
    und der nationalen KI-Systemdatenbank durch das Ministerium; Ausnahmen für vertrauliche und rein interne
    Systeme.
