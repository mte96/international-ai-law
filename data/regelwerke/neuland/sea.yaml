    amtliche PDF unter g7.cdnchinhphu.vn war gesperrt.
  - Ob das Gesetz ein Recht auf Nichtunterwerfung unter ausschließlich automatisierte Entscheidungen (Art.
    22 DSGVO) kennt, konnte nicht geklärt werden — in den ausgewerteten Darstellungen taucht keine entsprechende
    Vorschrift auf. Das wäre der erste Punkt für den nächsten Bearbeiter.
  - 'Verhältnis der Risikoklassifizierung nach Điều 30 PDPL zur Risikoklassifizierung nach Điều 9 KI-Gesetz:
    zwei getrennte Systeme oder eines? Ungeklärt.'
