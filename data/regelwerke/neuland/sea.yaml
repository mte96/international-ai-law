  offene_punkte:
  - Amtlicher Text (lom.agc.gov.my, Act 588) NICHT abgerufen — robots.txt-Fehler.
  - Aktenzeichen, Datum und Volltext der Court-of-Appeal-Entscheidung zu Section 233(1)(a) nicht ermittelt;
    ejudgment.kehakiman.gov.my wurde nicht abgefragt (Suchbudget erschöpft). Das ist die wichtigste offene
    Recherche für Malaysia.
  - Nummer und Inkrafttreten des Communications and Multimedia (Amendment) Act 2025 nicht ermittelt.
