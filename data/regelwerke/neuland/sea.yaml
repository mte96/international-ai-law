- id: th-computer-crime-act
  jurisdiktion: th
  kurztitel: Computerstrafgesetz Thailand (พ.ร.บ.คอมพิวเตอร์)
  offizieller_titel: 'พระราชบัญญัติว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ พ.ศ. ๒๕๕๐ แก้ไขเพิ่มเติมโดยพระราชบัญญัติ
    (ฉบับที่ ๒) พ.ศ. ๒๕๖๐ (Gesetz über Computerstraftaten B.E. 2550 / 2007, geändert durch das Gesetz
    Nr. 2 B.E. 2560 / 2017)

    '
  fundstelle: ราชกิจจานุเบกษา, Stammgesetz 2550 (2007), Novelle 2560 (2017)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Für die KI-Praxis ist มาตรา 16 die zentrale Norm: Sie stellt es unter
    Strafe, ein Bild einer anderen Person, das durch Erzeugung, Montage, Hinzufügung oder Veränderung
    entstanden ist, in ein öffentlich zugängliches Computersystem einzustellen, wenn dadurch die abgebildete
    Person in ihrem Ruf verletzt, herabgewürdigt, gehasst oder beschämt wird. Weil der Tatbestand die
    Erzeugungsweise offenlässt („ด้วยวิธีการใด" — auf welche Weise auch immer), erfasst er nach Auffassung
    des thailändischen Anti-Fake-News-Zentrums auch KI-erzeugte Deepfakes. Das ist Thailands geltende
    Deepfake-Strafnorm — und der Grund, warum das Fehlen eines KI-Gesetzes praktisch weniger wiegt, als
    es scheint.

    '
  kurzbeschreibung: 'Das Gesetz stellt unbefugten Zugang, Abfangen, Beeinträchtigung und Verfälschung
    von Computerdaten unter Strafe. มาตรา 14 erfasst die Eingabe verfälschter, gefälschter oder falscher
    Daten in ein Computersystem, wenn dadurch ein Schaden für die Öffentlichkeit entstehen kann, sowie
    die Weiterverbreitung in Kenntnis der Unrichtigkeit (มาตรา 14(5)); Strafrahmen bis zu fünf Jahren
    Freiheitsstrafe und bis zu 100.000 Baht Geldstrafe. มาตรา 16 erfasst manipulierte Personenbilder —
    Strafrahmen bis zu drei Jahren Freiheitsstrafe oder bis zu 200.000 Baht Geldstrafe. Flankierend greift
    die Beleidigung nach dem Strafgesetzbuch (bis zu zwei Jahre und bis zu 200.000 Baht).

    '
  inkrafttreten:
    datum: 2007-07-18
    verifiziert: false
    quelle: https://techno.coj.go.th/th/content/page/index/id/15429
  anwendungsdaten:
  - datum: 2017-05-24
    was_gilt: Inkrafttreten der Novelle B.E. 2560, die u.a. มาตรา 14 neu fasste.
    verifiziert: false
    quelle: https://www.it.chula.ac.th/เปรียบเทียบพ-ร-บ-คอมฯ-พ-ศ-๒/
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'มาตรา 16: ''นำเข้าสู่ระบบคอมพิวเตอร์ที่ประชาชนทั่วไปอาจเข้าถึงได้ ซึ่งข้อมูลคอมพิวเตอร์ที่ปรากฏเป็นภาพของผู้อื่น
    และภาพนั้นเกิดจากการสร้างขึ้น ตัดต่อ เติม หรือดัดแปลง'' — Einstellen erzeugter, montierter, ergänzter
    oder veränderter Personenbilder in ein öffentlich zugängliches Computersystem. Strafrahmen: bis 3
    Jahre Freiheitsstrafe ODER bis 200.000 Baht. THAILANDS DEEPFAKE-STRAFNORM.'
  - มาตรา 16 ist technologieoffen formuliert ('ด้วยวิธีการใด') und erfasst deshalb KI-erzeugte Bilder
    — so ausdrücklich das ศูนย์ต่อต้านข่าวปลอม (Anti-Fake-News-Zentrum) im Juni 2026.
  - 'มาตรา 14: Eingabe verfälschter oder falscher Daten mit Schadenseignung für die Öffentlichkeit; มาตรา
    14(5) Weiterverbreitung in Kenntnis der Unrichtigkeit. Strafrahmen bis 5 Jahre und bis 100.000 Baht.'
  - 'Flankierend: Beleidigung nach dem Strafgesetzbuch, bis 2 Jahre und bis 200.000 Baht.'
