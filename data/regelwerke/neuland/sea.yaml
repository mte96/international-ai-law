  kurztitel: Plattformverordnung Thailand (พระราชกฤษฎีกาแพลตฟอร์มดิจิทัล)
  offizieller_titel: 'พระราชกฤษฎีกาการประกอบธุรกิจบริการแพลตฟอร์มดิจิทัลที่ต้องแจ้งให้ทราบ พ.ศ. 2565 (Königliche
    Verordnung über anzeigepflichtige digitale Plattformdienstleistungsgeschäfte, B.E. 2565 / 2022)

    '
  fundstelle: ราชกิจจานุเบกษา (Königliches Amtsblatt), verkündet 2565 (2022); in Kraft ab 21.08.2566 (2023)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit dem 21.08.2023, Anmeldefrist für Plattformen bis zum 18.11.2566 (2023).
    WICHTIG FÜR DIE IM AUFTRAG GENANNTE WIDERSPRUCHSKLÄRUNG: Diese Verordnung ist NICHT am 01.03.2026
    in Kraft getreten und enthält keine KI-spezifische Vorschrift. Sie wird fortlaufend durch ETDA-Bekanntmachungen
    (ประกาศ) nach มาตรา 18(2) ergänzt; für 2026 sind das Zusatzpflichten für Online-Marktplätze (seit
    31.12.2025, 21 benannte Plattformen) und eine Frist für Ride-Sharing-Plattformen zum 31.03.2026.

    '
  kurzbeschreibung: 'Die Verordnung ergeht auf Grundlage des Gesetzes über elektronische Transaktionen
    und verpflichtet Betreiber digitaler Plattformdienste, ihre Tätigkeit der ETDA anzuzeigen und laufend
    Informationen zu übermitteln. Größere Plattformen unterliegen gestuften Zusatzpflichten (Transparenz
    der Geschäftsbedingungen, Beschwerdemanagement, Identifizierung von Händlern). Sie ist damit der thailändische
    Gegenpart zum europäischen Digital Services Act — und der prozedurale Rahmen, in dem KI-erzeugte Inhalte
    und algorithmische Systeme heute in Thailand behandelt werden, solange es kein KI-Gesetz gibt. Eine
    ausdrückliche Regelung von Empfehlungssystemen oder der Kennzeichnung KI-erzeugter Inhalte enthält
    sie nach den ausgewerteten Quellen nicht.

    '
