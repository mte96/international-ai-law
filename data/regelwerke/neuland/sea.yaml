- id: th-ai-act-entwurf
  jurisdiktion: th
  kurztitel: KI-Gesetzentwurf Thailand (ร่างพระราชบัญญัติว่าด้วยปัญญาประดิษฐ์)
  offizieller_titel: '(ร่าง) พระราชบัญญัติว่าด้วยปัญญาประดิษฐ์ พ.ศ. .... ((Entwurf) Gesetz über künstliche
    Intelligenz, B.E. ....)

    '
  fundstelle: 'Konsultationsfassung der สำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์ (ETDA) unter dem กระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม
    (Ministerium für digitale Wirtschaft und Gesellschaft), veröffentlicht am 09.07.2026; Konsultation
    über das ระบบกลางทางกฎหมาย (zentrales Rechtsportal) law.go.th

    '
  verfahrensnummer: law.go.th survey_id=NzU4MERHQV9MQVdfRlJPTlRFTkQ=
  status: entwurf
  status_detail: 'KEIN GELTENDES RECHT. Die Konsultationsfassung wurde am 09.07.2026 veröffentlicht, die
    Kommentierungsfrist lief bis zum 14.08.2026. Danach geht der Entwurf an das สำนักงานคณะกรรมการกฤษฎีกา
    (Staatsrat) und das Kabinett; die Regierung strebte nach Darstellung von Thai PBS Policy Watch an,
    ihn im September 2569 (2026) ins Parlament einzubringen. Der Entwurf führt zwei ältere Vorhaben zusammen:
    den Entwurf einer Königlichen Verordnung der ONDE von 2022 und den Entwurf eines KI-Förderungsgesetzes
    der ETDA von 2023.

    '
  kurzbeschreibung: 'Der Entwurf folgt dem risikobasierten Modell der EU-KI-Verordnung. Er unterscheidet
    verbotene KI, Hochrisiko-KI, erlaubnispflichtige KI und KI mit bloßen Transparenzpflichten (Deepfakes,
    Chatbots, generative Systeme). Verboten werden sollen unter anderem unfaire Diskriminierung durch
    massenhafte Datenverarbeitung und „เทคนิคสื่อสารแบบแฝง" (verdeckte Kommunikationstechniken) zur Manipulation
    von Entscheidungen; weitere Verbotstatbestände sollen durch Königliche Verordnungen nachgeschoben
    werden. Betreiber von Systemen mittleren Risikos müssen angemessene Vorsorgemaßnahmen treffen und
    KI-erzeugte Inhalte maschinenlesbar kennzeichnen. Für Entscheidungen mit KI-Beteiligung sind Hinweis-,
    Begründungs- und Widerspruchsrechte vorgesehen. Der Entwurf enthält eine urheberrechtliche Text- und
    Data-Mining-Ausnahme sowie ein Reallabor (Regulatory Sandbox). Bemerkenswert ist die Aufsichtsstruktur:
    Es gibt bewusst KEINE zentrale KI-Behörde, sondern eine dezentrale Aufsicht durch die jeweiligen Fachaufsichten
    (Wertpapieraufsicht, Zentralbank, Versicherungsaufsicht), flankiert vom ศูนย์ธรรมาภิบาลปัญญาประดิษฐ์
    (AI Governance Center) bei der ETDA und einem nationalen KI-Ausschuss für die Gesamtpolitik. Der Entwurf
    gilt extraterritorial für Entwickler, Anbieter, Betreiber und Plattformbetreiber einschließlich ausländischer
    Akteure und sieht strenge und gesamtschuldnerische Haftung sowie Befugnisse zur Untersagung, zum Rückruf
    und zur Sperrung von KI-Systemen in Thailand vor.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://law.go.th/listeningDetail?survey_id=NzU4MERHQV9MQVdfRlJPTlRFTkQ=
  anwendungsdaten:
  - datum: 2026-08-14
    was_gilt: Ende der öffentlichen Konsultation zum Entwurf.
    verifiziert: false
    quelle: https://www.bakermckenzie.com/en/insight/publications/2026/07/thailand-draft-ai-act--seven-key-implications
  themenachsen:
  - marktzugang
  - governance
  - content
  - haftung
