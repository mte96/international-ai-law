    typ: uebersicht
    titel: 'Malaysia: The Online Safety Act 2025'
    url: https://www.roedl.com/en/insights/malaysia-online-safety-act-2025/
    sprache: en
    urheber: Rödl & Partner (Kanzleimonitor)
    verifiziert: true
    notiz: 'Sekundärquelle; hier abgerufen. Belegt Inkrafttreten 01.01.2026, den Anwendungsbereich (lizenzpflichtige
      Plattformen über 8 Mio. Nutzer in Malaysia), die neun Kategorien schädlicher Inhalte und die Einstufung
      von Kindesmissbrauchsdarstellungen und Finanzbetrug als ''priority harmful content''. Der Beitrag
      nennt WEDER eine KI- noch eine Deepfake-Vorschrift — konsistent damit, dass Act 866 synthetische
      Inhalte nicht gesondert erfasst, aber kein Beweis dafür.

      '
  offene_punkte:
  - Der Gesetzestext wurde NICHT gelesen — lom.agc.gov.my war wegen eines robots.txt-Fehlers (HTTP 500)
    nicht abrufbar. Ob und wo das Gesetz synthetische oder KI-erzeugte Inhalte erfasst, ist deshalb offen.
    Zwei ausgewertete Sekundärdarstellungen (Rödl & Partner, Rahmat Lim) nennen keine solche Vorschrift;
    das ist ein Indiz, kein Beweis. Das ist der erste Punkt, den der nächste Bearbeiter prüfen sollte.
  - Datum der königlichen Zustimmung und der Verkündung im Gazette nicht ermittelt.
  - Der Wortlaut der neun Kategorien 'harmful content' ist nicht am Gesetzestext geprüft; die Aufzählung
    stammt aus der Darstellung von Rödl & Partner.
  - Die Nutzerschwelle von 8 Millionen ist nicht am amtlichen Text geprüft; sie folgt vermutlich aus der
    Lizenzierungsregelung nach dem Communications and Multimedia Act, nicht aus Act 866 selbst.
  - Die nachgelagerten Rechtsakte der MCMC sind nicht erfasst.
  - Das Verhältnis zur Section 233 Communications and Multimedia Act 1998 ist ungeklärt.
