- id: vn-cybersecurity-24-2018
  jurisdiktion: vn
  kurztitel: Cybersicherheitsgesetz Vietnam 2018 (Luật An ninh mạng 2018)
  offizieller_titel: Luật An ninh mạng (Cybersicherheitsgesetz), Luật số 24/2018/QH14
  fundstelle: Quốc hội khóa XIV, Luật số 24/2018/QH14 vom 12.06.2018
  verfahrensnummer: Luật số 24/2018/QH14
  status: aufgehoben
  status_detail: 'In Kraft seit dem 01.01.2019, abgelöst durch das Luật An ninh mạng 116/2025/QH15 zum
    01.07.2026. Es enthielt keine KI-spezifische Vorschrift; Deepfake-Sachverhalte waren über die allgemeinen
    Verbote falscher Information und der Verletzung der Ehre zu lösen. Es begründete die Datenlokalisierungspflicht
    und die Zuständigkeit des Ministeriums für öffentliche Sicherheit, die bis heute die Aufsichtsstruktur
    prägt.

    '
  kurzbeschreibung: 'Das Gesetz von 2018 war Vietnams erstes Cybersicherheitsgesetz. Es verpflichtete
    inländische und ausländische Diensteanbieter zur Datenspeicherung in Vietnam und zur Einrichtung einer
    Niederlassung, verbot bestimmte Inhalte (Propaganda gegen den Staat, Falschinformation, Ehrverletzung)
    und begründete Löschungs- und Auskunftspflichten gegenüber dem Ministerium für öffentliche Sicherheit.
    Ohne KI-spezifische Norm war es bis 2026 die Auffangnorm für Deepfake-Sachverhalte.

    '
