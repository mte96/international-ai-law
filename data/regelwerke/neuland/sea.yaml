- id: id-se-9-2023
  jurisdiktion: id
  kurztitel: KI-Ethik-Rundschreiben Indonesien (Surat Edaran 9/2023)
  offizieller_titel: 'Surat Edaran Menteri Komunikasi dan Informatika Nomor 9 Tahun 2023 tentang Etika
    Kecerdasan Artifisial (Rundschreiben des Ministers für Kommunikation und Informatik Nr. 9 von 2023
    über die Ethik künstlicher Intelligenz)

    '
  fundstelle: 'Kementerian Komunikasi dan Informatika (heute Kementerian Komunikasi dan Digital, Komdigi),
    Surat Edaran Nr. 9 Tahun 2023

    '
  verfahrensnummer: SE Menkominfo No. 9 Tahun 2023
  status: softlaw
  status_detail: 'Ein Rundschreiben (Surat Edaran) ist im indonesischen Rechtsquellensystem KEIN Rechtsakt
    mit Außenwirkung, sondern eine Verwaltungsmitteilung ohne Bindungswirkung gegenüber Privaten. Es ist
    gleichwohl bis heute Indonesiens einziges eigenständiges KI-Instrument. Die UNESCO empfiehlt in ihrem
    Länderprofil ausdrücklich, das Rundschreiben an internationale Maßstäbe (Verhältnismäßigkeit, menschliche
    Aufsicht, Rechenschaft) anzupassen — ein Hinweis darauf, dass es hinter dem gegenwärtigen Standard
    zurückbleibt.

    '
  kurzbeschreibung: 'Das Rundschreiben gibt Behörden und Anbietern elektronischer Systeme Orientierung
    für den ethischen Einsatz künstlicher Intelligenz. Es benennt Wertmaßstäbe für Entwicklung und Nutzung
    und stellt klar, dass KI die bestehenden Pflichten aus dem Datenschutz- und dem Informations- und
    Transaktionsrecht nicht verdrängt. Weil es keine Rechtsverordnung ist, begründet es weder Pflichten
    noch Sanktionen; es wirkt allein über die Verwaltungspraxis und als Auslegungshilfe. Der Inhalt konnte
    NICHT am amtlichen Text geprüft werden (siehe offene_punkte).

    '
  inkrafttreten:
    datum: 2023-12-19
    verifiziert: false
    quelle: https://www.unesco.org/ethics-ai/en/indonesia
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Rechtsform Surat Edaran: Verwaltungsmitteilung ohne Außenwirkung, keine Pflichten, keine Sanktionen.'
  - 'Adressaten: Behörden und Anbieter elektronischer Systeme (penyelenggara sistem elektronik).'
  - Ethische Wertmaßstäbe für Entwicklung und Nutzung von KI.
  - Klarstellung, dass Datenschutz- und ITE-Recht unberührt bleiben.
  - 'UNESCO-Empfehlung 2025/2026: Anpassung an Verhältnismäßigkeit, menschliche Aufsicht und Rechenschaftspflicht.'
  dokumente:
  - datum: 2023
    typ: leitlinie
    titel: Indonesien — Länderprofil im Global AI Ethics and Governance Observatory
    url: https://www.unesco.org/ethics-ai/en/indonesia
    sprache: en
    urheber: UNESCO
    verifiziert: true
    notiz: 'Belegt Existenz, Nummer, Gegenstand und Urheber des Rundschreibens sowie die Empfehlung zur
      Überarbeitung. Internationale Organisation, keine indonesische amtliche Quelle.

      '
  - datum: 2023
    typ: leitlinie
    titel: Surat Edaran Menteri Kominfo Nomor 9 Tahun 2023 — Rechtsdokumentationsportal des Ministeriums
    url: https://jdih.komdigi.go.id/
    sprache: id
    urheber: Kementerian Komunikasi dan Digital (Komdigi), JDIH
    verifiziert: false
    notiz: 'AMTLICHES Rechtsdokumentationsportal des zuständigen Ministeriums. Alle Abrufversuche in dieser
      Sitzung endeten mit HTTP 403; der Volltext des Rundschreibens wurde NICHT gelesen.

      '
  offene_punkte:
  - DER VOLLTEXT WURDE NICHT GELESEN. jdih.komdigi.go.id antwortete durchgehend mit HTTP 403. Die Aufzählung
    der ethischen Wertmaßstäbe fehlt deshalb; sie ist zuerst nachzuholen.
  - 'Das Ausstellungsdatum (19.12.2023 nach verbreiteter Sekundärangabe) ist nicht belegt und deshalb
    als verifiziert: false geführt.'
  - Ob das Rundschreiben nach der Umbenennung des Ministeriums in Komdigi fortgilt oder ersetzt wurde,
    ist ungeklärt.
  - Das Rundschreiben taucht in der BPK-Rechtsdatenbank (peraturan.bpk.go.id) NICHT auf — konsistent damit,
    dass Surat Edaran dort nicht geführt werden.
