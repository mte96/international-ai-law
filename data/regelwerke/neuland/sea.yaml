  regelungsschwerpunkte:
  - Recht, gegen eine ausschließlich auf automatisierter Verarbeitung einschließlich Profilbildung beruhende
    Entscheidung Einwände zu erheben — die indonesische Art.-22-DSGVO-Entsprechung und der Anknüpfungspunkt
    für KI-Entscheidungen.
  - 'Weitere Betroffenenrechte: Information, Berichtigung, Auskunft, Löschung, Widerruf der Einwilligung,
    Einschränkung der Verarbeitung, Datenübertragbarkeit.'
  - Verwaltungssanktionen bis 2 % des Jahresumsatzes bzw. -einkommens des Verantwortlichen.
  - 'Strafvorschriften: 4 bis 6 Jahre Freiheitsstrafe und bis 500 Mio. IDR für natürliche Personen; für
    juristische Personen das Zehnfache.'
  - 'AUFSICHTSLÜCKE: Die Lembaga PDP ist nicht errichtet; Komdigi handelt übergangsweise. Das ist die
    zentrale Schwäche des indonesischen Datenschutzrechts und damit auch der KI-Aufsicht.'
