- id: id-uu-pdp-27-2022
  jurisdiktion: id
  kurztitel: Datenschutzgesetz Indonesien (UU PDP 27/2022)
  offizieller_titel: 'Undang-Undang Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi (Gesetz Nr. 27
    von 2022 über den Schutz personenbezogener Daten)

    '
  fundstelle: Lembaran Negara RI Tahun 2022 Nomor 196, Tambahan Lembaran Negara Nomor 6820
  verfahrensnummer: UU No. 27 Tahun 2022
  status: anwendbar
  status_detail: 'Ausgefertigt und verkündet am 17.10.2022, in Kraft mit dem Tag der Verkündung. Die zweijährige
    Übergangsfrist endete am 17.10.2024; seither gilt das Gesetz uneingeschränkt. Die vorgesehene eigenständige
    Datenschutzbehörde (Lembaga PDP) ist bis heute NICHT errichtet; die Aufgaben nimmt übergangsweise
    das Kementerian Komunikasi dan Digital (Komdigi) wahr. Die Errichtung war für 2026 angekündigt. Für
    KI ist das Gesetz die zentrale Norm: Es gewährt ein Recht, gegen ausschließlich automatisierte Entscheidungen
    Einwände zu erheben.

    '
  kurzbeschreibung: 'Das Gesetz folgt dem DSGVO-Muster: Rechtsgrundlagen der Verarbeitung, besondere Kategorien
    personenbezogener Daten, Betroffenenrechte, Pflichten von Verantwortlichen und Auftragsverarbeitern,
    Meldepflicht bei Verletzungen, Regeln zur Auslandsübermittlung und ein zweispuriges Sanktionssystem.
    Zu den Betroffenenrechten zählt nach übereinstimmender Darstellung ein Recht, gegen eine ausschließlich
    auf automatisierter Verarbeitung einschließlich Profilbildung beruhende Entscheidung Einwände zu erheben
    — die indonesische Entsprechung zu Art. 22 DSGVO und die Norm, an der KI-Entscheidungen in Indonesien
    heute zu messen sind. Verwaltungssanktionen reichen bis zu 2 % des Jahresumsatzes bzw. -einkommens;
    die Strafvorschriften sehen für natürliche Personen vier bis sechs Jahre Freiheitsstrafe und Geldstrafe
    bis 500 Mio. IDR vor, für juristische Personen das Zehnfache.

    '
  inkrafttreten:
    datum: 2022-10-17
    verifiziert: true
    quelle: https://peraturan.bpk.go.id/Details/229798/uu-no-27-tahun-2022
  anwendungsdaten:
  - datum: 2024-10-17
