  offizieller_titel: 'Luật Sở hữu trí tuệ số 50/2005/QH11, geändert durch Luật số 36/2009/QH12, Luật số
    42/2019/QH14 und Luật số 07/2022/QH15

    '
  fundstelle: Quốc hội, Luật số 50/2005/QH11 vom 29.11.2005 in der Fassung von 2022
  verfahrensnummer: 50/2005/QH11 i.d.F. 07/2022/QH15
  status: anwendbar
  status_detail: 'Das Stammgesetz des vietnamesischen Rechts des geistigen Eigentums. Es enthält selbst
    keine KI-Vorschrift; die KI-bezogenen Regeln zu Urheberschaft und Training stehen erst in der Durchführungsverordnung
    17/2023/NĐ-CP in der Fassung des Nghị định 134/2026/NĐ-CP. Das ist dogmatisch heikel: Der Ausschluss
    vollständig maschinell erzeugter Werke vom Schutz und die Trainingsschranke werden auf Verordnungsebene
    geregelt, obwohl das Gesetz den Werkbegriff und die Schranken selbst normiert.

    '
  kurzbeschreibung: 'Das Gesetz regelt Urheberrecht und verwandte Schutzrechte, gewerbliche Schutzrechte
    und Sortenschutz. Der Werkbegriff knüpft an eine persönliche geistige Schöpfung an; Urheber kann nur
    eine natürliche Person sein. Die Schranken des Urheberrechts sind abschließend geregelt. Die 2022
    eingefügten Vorschriften zu technischen Schutzmaßnahmen und zur Verantwortlichkeit von Vermittlern
    sind die Anknüpfungspunkte, an denen der Rechtsvorbehalt des neuen Điều 37b der Durchführungsverordnung
    hängt.

    '
  inkrafttreten:
    datum: 2006-07-01
    verifiziert: false
