- id: id-uu-hak-cipta-28-2014
  jurisdiktion: id
  kurztitel: Urheberrechtsgesetz Indonesien (UU Hak Cipta 28/2014)
  offizieller_titel: 'Undang-Undang Nomor 28 Tahun 2014 tentang Hak Cipta (Gesetz Nr. 28 von 2014 über
    das Urheberrecht)

    '
  fundstelle: Lembaran Negara RI Tahun 2014 Nomor 266, Tambahan Lembaran Negara Nomor 5599
  verfahrensnummer: UU No. 28 Tahun 2014
  status: anwendbar
  status_detail: 'Ausgefertigt und verkündet am 16.10.2014, in Kraft mit dem Tag der Verkündung; ersetzt
    UU 19/2002. Es enthält keine Vorschrift zu KI-erzeugten Werken und keine Text- und Data-Mining-Schranke.
    Damit steht Indonesien im Gegensatz zu Vietnam, das beides 2026 auf Verordnungsebene geregelt hat.

    '
  kurzbeschreibung: 'Das Gesetz regelt Urheberrecht und verwandte Schutzrechte. Der Werkbegriff knüpft
    an eine persönliche Schöpfung an; Urheber (Pencipta) ist die natürliche Person, die das Werk geschaffen
    hat. KI-erzeugte Erzeugnisse sind damit nach allgemeiner Auffassung nicht schutzfähig, ohne dass das
    Gesetz das ausspricht. Eine Schranke für Text- und Data-Mining zu Trainingszwecken fehlt; das Training
    an geschützten Werken ist deshalb nach den allgemeinen Regeln zu beurteilen.

    '
  inkrafttreten:
    datum: 2014-10-16
    verifiziert: true
    quelle: https://peraturan.bpk.go.id/Details/38690/uu-no-28-tahun-2014
  themenachsen:
  - urheberrecht
  regelungsschwerpunkte:
  - Urheber (Pencipta) ist die natürliche Person, die das Werk geschaffen hat — Grundlage der herrschenden
    Auffassung, dass KI-Erzeugnisse nicht schutzfähig sind.
  - KEINE Vorschrift zu KI-erzeugten Werken.
  - KEINE Text- und Data-Mining-Schranke — Gegensatz zu Vietnams Điều 37a/37b.
  - Ersetzt UU 19/2002.
  dokumente:
  - datum: 2014-10-16
    typ: endfassung
    titel: Undang-undang (UU) Nomor 28 Tahun 2014 tentang Hak Cipta
    url: https://peraturan.bpk.go.id/Details/38690/uu-no-28-tahun-2014
    sprache: id
    urheber: Badan Pemeriksa Keuangan (BPK), Database Peraturan
    verifiziert: true
    notiz: 'AMTLICHE Rechtsdatenbank. Hier abgerufen; belegt Titel, Daten (16.10.2014), Fundstelle LN.2014/No.
      266, TLN No. 5599 und die Aufhebung von UU 19/2002.

      '
  - datum: 2014-10-16
    typ: endfassung
    titel: UU Nomor 28 Tahun 2014 — amtliche Volltext-PDF
    url: https://peraturan.bpk.go.id/Download/28018/UU%20Nomor%2028%20Tahun%202014.pdf
    sprache: id
    urheber: Badan Pemeriksa Keuangan (BPK)
    verifiziert: false
    notiz: Amtliche Volltext-PDF; in dieser Sitzung nicht ausgewertet.
  offene_punkte:
  - Der Wortlaut der Legaldefinitionen in Pasal 1 (Pencipta, Ciptaan) wurde NICHT gelesen; die Aussage
    zum Erfordernis eines menschlichen Urhebers ist deshalb nicht am Text belegt.
  - Ob in Indonesien ein Reformvorhaben zum Urheberrecht an KI-Erzeugnissen läuft, war nicht feststellbar.
  - Der Schrankenkatalog (Pasal 43 ff.) ist nicht ausgewertet — ob eine der bestehenden Schranken auf
    Trainingszwecke passt, ist offen.
