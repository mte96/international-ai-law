  offene_punkte:
  - OB DIE ENDFASSUNG ERGANGEN IST, IST UNGEKLÄRT — das ist der wichtigste malaysische Punkt für den nächsten
    Bearbeiter. Die Konsultation endete am 19.05.2025.
  - Die Rechtsnatur der Leitlinie (bindend oder auslegend) ist ungeklärt; die PDPA kennt Commissioner's
    Guidelines mit unklarer Bindungswirkung.
  - 'Verhältnis zum geplanten AI Governance Bill: Das Bill soll KI-Ausgaben nicht regeln, die ADMP-Leitlinie
    greift dagegen auf KI-Entscheidungen durch. Mögliche Doppelregelung, im Konsultationspapier nicht
    behandelt.'
