- id: my-pdp-admp-leitlinie
  jurisdiktion: my
  kurztitel: Leitlinie automatisierte Entscheidungen Malaysia (ADMP Guideline)
  offizieller_titel: 'Public Consultation Paper No. 3/2025: Automated Decision Making and Profiling Guideline

    '
  fundstelle: 'Jabatan Perlindungan Data Peribadi (JPDP), Konsultationspapier Nr. 3/2025, Konsultation
    vom 20.03.2025 bis 19.05.2025

    '
  verfahrensnummer: Public Consultation Paper No. 3/2025
  status: entwurf
  status_detail: 'Konsultationsfassung. Für die KI-Praxis ist das das wichtigste malaysische Dokument
    überhaupt, weil es KI und generative KI AUSDRÜCKLICH als „automated decision making"-Werkzeug einordnen
    und damit unter die Betroffenenrechte des Datenschutzrechts stellen will. Ob die Leitlinie inzwischen
    in Endfassung ergangen ist, war nicht feststellbar.

    '
  kurzbeschreibung: 'Das Konsultationspapier stellt fest, dass Section 5 PDPA 2010 die Datenschutzgrundsätze
    regelt, automatisierte Entscheidungsfindung und Profiling aber nicht ausdrücklich erfasst. Es definiert
    automatisierte Entscheidungsfindung als Entscheidungsfindung durch automatisierte Mittel ohne jede
    menschliche Beteiligung und Profiling als jede Form automatisierter Verarbeitung personenbezogener
    Daten zur Bewertung bestimmter persönlicher Aspekte. Es schlägt drei Betroffenenrechte vor: ein Recht
    auf Information mit aussagekräftigen Angaben zur involvierten Logik und zu den Auswirkungen; ein Recht,
    eine ausschließlich auf automatisierter Entscheidungsfindung beruhende Entscheidung mit rechtlicher
    oder erheblicher Wirkung abzulehnen; und ein Recht auf menschliche Überprüfung durch eine Person mit
    Befugnis zur Änderung der Entscheidung, mit einer Antwortfrist von 21 Tagen, verlängerbar um 14 Tage
    bei Komplexität. Als Schutzmaßnahmen nennt es ausdrückliche Einwilligung, Folgenabschätzung vor dem
    Einsatz, tatsächliche (nicht nur formale) menschliche Beteiligung, Beschränkungen für biometrische
    Daten sowie Transparenz und Zugangskontrolle bei Videoüberwachung. Entscheidend: Das Papier verlangt,
    KI und generative KI ausdrücklich als Instrument automatisierter Entscheidungsfindung zu benennen
    und Beschränkungen zu unterwerfen, wenn sie Betroffene erheblich berühren.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.pdp.gov.my/ppdpv1/wp-content/uploads/2025/08/JPDP-FSB-200325-ADMP-PCP-ENG-TC.pdf
  anwendungsdaten:
  - datum: 2025-05-19
    was_gilt: Ende der öffentlichen Konsultation über die ADMP-Leitlinie.
    verifiziert: true
    quelle: https://www.pdp.gov.my/ppdpv1/wp-content/uploads/2025/08/JPDP-FSB-200325-ADMP-PCP-ENG-TC.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - arbeit
  regelungsschwerpunkte:
  - 'Ausgangsbefund: Section 5 PDPA 2010 erfasst automatisierte Entscheidungsfindung und Profiling NICHT
    ausdrücklich.'
  - 'Definition automatisierte Entscheidungsfindung: ''process of making decisions by automated means
    without any human involvement''.'
  - 'Definition Profiling: ''any form of automated processing of personal data consisting of the use of
    personal data to evaluate certain personal aspects''.'
  - 'Recht auf Information: ''meaningful information about the logic'' und Erläuterung der Auswirkungen.'
  - Recht auf Ablehnung einer ausschließlich automatisierten Entscheidung mit rechtlicher oder erheblicher
    Wirkung.
  - Recht auf menschliche Überprüfung durch eine änderungsbefugte Person; Antwortfrist 21 Tage, verlängerbar
    um 14 Tage.
  - 'KERNPUNKT: KI und generative KI sollen AUSDRÜCKLICH als ''automated decision making''-Werkzeug benannt
    und Beschränkungen unterworfen werden, wenn sie Betroffene erheblich berühren.'
  - 'Schutzmaßnahmen: ausdrückliche Einwilligung, Folgenabschätzung vor dem Einsatz, tatsächliche statt
    perfunktorischer menschlicher Beteiligung, Beschränkungen für biometrische Daten, Transparenz und
    Zugangskontrolle bei Videoüberwachung.'
  dokumente:
  - datum: 2025-03-20
    typ: konsultation
