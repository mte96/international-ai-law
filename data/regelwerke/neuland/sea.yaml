- id: my-online-safety-act
  jurisdiktion: my
  kurztitel: Online Safety Act Malaysia 2025 (Act 866)
  offizieller_titel: Online Safety Act 2025 [Act 866] — Akta Keselamatan Dalam Talian 2025
  fundstelle: Laws of Malaysia, Act 866
  verfahrensnummer: Act 866
  status: anwendbar
  status_detail: 'In Kraft seit dem 01.01.2026; die Durchsetzung durch die Suruhanjaya Komunikasi dan
    Multimedia Malaysia (MCMC) begann im Januar 2026. Das Gesetz verpflichtet lizenzierte Anbieter von
    Anwendungsdiensten und Inhaltsanwendungsdiensten zu Maßnahmen gegen schädliche Inhalte. Es ist der
    praktische Rahmen, in dem in Malaysia KI-erzeugte rechtswidrige Inhalte behandelt werden — der Digitalminister
    hat bei Vorstellung des AI Governance Bill ausdrücklich darauf verwiesen, dass die KI-AUSGABEN von
    diesem Gesetz und nicht vom künftigen KI-Gesetz erfasst werden.

    '
  kurzbeschreibung: 'Das Gesetz verpflichtet Betreiber von Plattformdiensten mit erheblicher Nutzerzahl
    in Malaysia zu Vorkehrungen gegen „harmful content" — dazu zählen unter anderem Inhalte über sexuellen
    Missbrauch von Kindern, Finanzbetrug, Aufforderung zu Selbstverletzung und Inhalte, die zu Gewalt
    aufstacheln. Vorgesehen sind Melde- und Entfernungsmechanismen, Nutzersicherheitspläne, Berichtspflichten
    gegenüber der MCMC und Sanktionen. Die MCMC hat 2025 nachgelagerte Rechtsakte (subsidiary legislation)
    erlassen, unter anderem zur Altersgrenze für soziale Medien. Ob das Gesetz KI-erzeugte oder synthetische
    Inhalte ausdrücklich erfasst, konnte nicht am Gesetzestext geprüft werden.

    '
  inkrafttreten:
    datum: 2026-01-01
    verifiziert: true
    quelle: https://www.roedl.com/en/insights/malaysia-online-safety-act-2025/
  themenachsen:
  - content
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Anwendungsbereich: Applications Service Providers, Content Applications Service Providers, Network
    Service Providers sowie lizenzpflichtige soziale Netzwerke und Nachrichtendienste mit mehr als 8 Millionen
    Nutzern in Malaysia.'
  - Neun Kategorien 'harmful content'; als 'priority harmful content' gelten Darstellungen sexuellen Kindesmissbrauchs
    und Finanzbetrug — sie sind 'with utmost urgency' zu entfernen oder zu sperren.
  - 'Weitere Kategorien: obszöne und unanständige Inhalte, Inhalte, die Gewalt, Terrorismus oder Drogenkonsum
    fördern, Inhalte, die ein Kind zur Selbstschädigung verleiten können, sowie Inhalte, die den öffentlichen
    Frieden bedrohen oder Feindseligkeit schüren.'
  - 'Pflichten lizenzierter Anbieter: proaktive Schutzmaßnahmen, Gemeinschaftsstandards, Schutzwerkzeuge,
    Melde- und Entfernungsmechanismen, Nutzersicherheitspläne, Berichtspflichten gegenüber der MCMC.'
  - Nachgelagerte Rechtsakte der MCMC, u.a. Altersgrenze für soziale Medien (Dezember 2025).
  - 'ABGRENZUNG: Nach der Aussage des Digitalministers vom 10.07.2026 sollen KI-Ausgaben von diesem Gesetz
    und nicht vom künftigen AI Governance Bill erfasst werden.'
  - 'UNGEPRÜFT: ob das Gesetz KI-erzeugte oder synthetische Inhalte ausdrücklich erfasst.'
