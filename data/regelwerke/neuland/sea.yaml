- id: vn-cybersecurity-116-2025
  jurisdiktion: vn
  kurztitel: Cybersicherheitsgesetz Vietnam 2025 (Luật An ninh mạng)
  offizieller_titel: Luật An ninh mạng (Cybersicherheitsgesetz), Luật số 116/2025/QH15
  fundstelle: 'Quốc hội khóa XV, ausgefertigt 10.12.2025, unterzeichnet Trần Thanh Mẫn; Công báo Nr. 35
    vom 21.01.2026

    '
  verfahrensnummer: Luật số 116/2025/QH15
  status: anwendbar
  status_detail: 'In Kraft seit dem 01.07.2026. Am selben Tag wie das KI-Gesetz ausgefertigt (10.12.2025).
    Es tritt an die Stelle des Luật An ninh mạng 24/2018/QH14; die Amtsblattseite selbst weist allerdings
    null ersetzte Dokumente aus, sodass das Verhältnis zum Gesetz von 2018 am amtlichen Text noch zu prüfen
    ist. Für KI entscheidend: Điều 7 khoản 2 điểm g verbietet ausdrücklich, künstliche Intelligenz oder
    neue Technologien zur Fälschung von Videos, Bildern oder Stimmen zu verwenden — Vietnams zentrale
    Deepfake-Strafnorm im Gesetzesrang.

    '
  kurzbeschreibung: 'Das Gesetz regelt die Sicherheit im Cyberraum, Pflichten von Diensteanbietern, Datenlokalisierung,
    kritische Informationsinfrastruktur und verbotene Handlungen im Netz. Für die KI-Praxis ist der Verbotskatalog
    des Điều 7 maßgeblich. Điều 7 khoản 2 điểm g untersagt „Sử dụng trí tuệ nhân tạo hoặc công nghệ mới
    để giả mạo video, hình ảnh, giọng nói" — die Verwendung künstlicher Intelligenz oder neuer Technologien,
    um Videos, Bilder oder Stimmen anderer rechtswidrig zu fälschen. Điều 13 khoản 3 điểm h flankiert
    das mit dem Verbot der Identitätsanmaßung und der Fälschung von Informationen, Bildern und Stimmen
    einer Person. Damit hat Vietnam die Deepfake-Verbotsnorm nicht im KI-Gesetz, sondern im Cybersicherheitsrecht
    verortet — dort, wo das Ministerium für öffentliche Sicherheit zuständig ist.

    '
  inkrafttreten:
    datum: 2026-07-01
    verifiziert: true
    quelle: https://congbao.chinhphu.vn/van-ban/luat-so-116-2025-qh15-468678.htm
  themenachsen:
  - content
  - sicherheit-export
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Điều 7 khoản 2 điểm g: ''Sử dụng trí tuệ nhân tạo hoặc công nghệ mới để giả mạo video, hình ảnh,
    giọng nói'' — Verbot des Einsatzes von KI oder neuer Technologien zur rechtswidrigen Fälschung von
    Videos, Bildern und Stimmen. Vietnams Deepfake-Verbot im Gesetzesrang.'
  - 'Điều 13 khoản 3 điểm h: ''Mạo danh, giả mạo thông tin, hình ảnh, giọng nói của cá nhân'' — Identitätsanmaßung
    und Fälschung von Informationen, Bild und Stimme einer Person.'
  - 'Zuständigkeit: Bộ Công an (Ministerium für öffentliche Sicherheit) — anders als beim KI-Gesetz (Bộ
    Khoa học và Công nghệ). Die Doppelzuständigkeit ist die zentrale Strukturfrage des vietnamesischen
    KI-Rechts.'
