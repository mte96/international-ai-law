- id: vn-qd-367-2026
  jurisdiktion: vn
  kurztitel: Umsetzungsplan KI-Gesetz Vietnam (Quyết định 367/QĐ-TTg)
  offizieller_titel: 'Quyết định số 367/QĐ-TTg ban hành Kế hoạch triển khai thi hành Luật Trí tuệ nhân
    tạo (Entscheidung über den Plan zur Durchführung des KI-Gesetzes)

    '
  fundstelle: Thủ tướng Chính phủ, Quyết định số 367/QĐ-TTg vom 03.03.2026, gezeichnet Phó Thủ tướng Nguyễn
    Chí Dũng
  verfahrensnummer: 367/QĐ-TTg
  status: anwendbar
  status_detail: 'Regierungsinterner Umsetzungsplan, erlassen zwei Tage nach Inkrafttreten des KI-Gesetzes.
    Er verteilt die Durchführungsaufgaben auf die Ressorts und setzt Termine für die Rechtsetzungsarbeiten.

    '
  kurzbeschreibung: 'Der Plan weist dem Ministerium für Wissenschaft und Technologie den Aufbau des einheitlichen
    KI-Portals, der nationalen KI-Systemdatenbank, der KI-Infrastruktur als öffentliche Leistung, des
    nationalen KI-Entwicklungsfonds und eines Netzes von KI-Clustern zu. Das Bildungsministerium hat 2026
    das nationale KI-Fachkräfteprogramm vorzulegen, das Justizministerium wirkt an den Rechtsetzungsdokumenten
    und an der Rechtsverbreitung mit, das Ministerium für öffentliche Sicherheit verantwortet nationale
    Rechenzentren und deren Sicherheit. Alle Ressorts und Provinzen müssen ihr bestehendes Recht auf Vereinbarkeit
    mit dem KI-Gesetz prüfen, Durchführungsvorschriften anpassen und die KI-Strategie in ihre Fachplanungen
    aufnehmen. Als Termine nennt der Plan die Fertigstellung des nationalen KI-Ethikrahmens und der Hochrisikoliste
    sowie den Aufbau des KI-Entwicklungsfonds in den Jahren 2026 und 2027.

    '
