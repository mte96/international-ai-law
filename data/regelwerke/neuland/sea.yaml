  jurisdiktion: th
  kurztitel: Datenschutzgesetz Thailand (PDPA, พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล)
  offizieller_titel: 'พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. ๒๕๖๒ (Gesetz über den Schutz personenbezogener
    Daten, B.E. 2562 / 2019)

    '
  fundstelle: ราชกิจจานุเบกษา เล่ม ๑๓๖ ตอนที่ ๖๙ ก หน้า ๕๒, 27.05.2562 (2019)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Verkündet am 27.05.2019, nach mehrfacher Verschiebung vollständig in Kraft seit dem
    01.06.2022. Aufsicht ist die สำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล (PDPC, Office of the Personal
    Data Protection Commission) unter dem Ministerium für digitale Wirtschaft und Gesellschaft. Das PDPA
    ist bis zum Inkrafttreten eines KI-Gesetzes die zentrale Norm, an der KI-Fälle in Thailand entschieden
    werden: Trainingsdaten, Gesichtserkennung, Profiling.

    '
  kurzbeschreibung: 'Das Gesetz ist eng an die DSGVO angelehnt: Rechtsgrundlagen der Verarbeitung, besondere
    Kategorien personenbezogener Daten (einschließlich biometrischer Daten), Betroffenenrechte, Datenschutzbeauftragte,
    Meldung von Verletzungen, Regeln für die Übermittlung ins Ausland und ein dreispuriges Sanktionssystem
    aus Verwaltungsbußgeld, zivilrechtlichem Strafschadensersatz und Strafvorschriften. Für KI ist entscheidend,
    dass biometrische Daten zu den besonderen Kategorien zählen und ihre Verarbeitung grundsätzlich ausdrückliche
    Einwilligung verlangt — die praktische Schranke für Gesichtserkennung. Ob das Gesetz ein eigenständiges
    Recht auf Nichtunterwerfung unter automatisierte Einzelentscheidungen nach dem Vorbild des Art. 22
    DSGVO kennt, ließ sich nicht am amtlichen Text prüfen.

    '
  inkrafttreten:
