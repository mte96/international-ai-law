  regelungsschwerpunkte:
  - 'AUFGEHOBEN zum 01.03.2026 — Điều 41 ''Nguyên tắc phát triển, cung cấp, triển khai sử dụng trí tuệ
    nhân tạo'': Grundsätze menschenzentrierter, transparenter, sicherer KI im Einklang mit Datenschutz-
    und Verbraucherschutzrecht.'
  - 'AUFGEHOBEN — Điều 42 ''Chiến lược nghiên cứu, phát triển và ứng dụng trí tuệ nhân tạo'': nationale
    KI-Strategie.'
  - 'AUFGEHOBEN — Điều 43 ''Quản lý hệ thống trí tuệ nhân tạo'': Hochrisikosysteme (schwere Schäden für
    Gesundheit, Menschenrechte, öffentliche Ordnung) und ''wirkungsstarke'' Systeme (tác động lớn); Anforderungen
    an technische Spezifikationen, Transparenz, Data Governance, Cybersicherheit.'
  - 'AUFGEHOBEN — Điều 44 ''Quy định dấu hiệu nhận dạng đối với hệ thống trí tuệ nhân tạo'': Offenlegungspflicht
    bei direkter Nutzerinteraktion und Kennzeichnungspflicht für KI-erzeugte digitale Produkte.'
  - 'AUFGEHOBEN — Điều 45: Verantwortlichkeiten von Entwicklern, Anbietern, Betreibern.'
  - 'AUFGEHOBEN — khoản 9 Điều 3: Legaldefinition ''Hệ thống trí tuệ nhân tạo là hệ thống dựa trên máy
    móc được thiết kế để hoạt động với các mức độ tự chủ khác nhau...'' (maschinengestütztes System mit
    unterschiedlichen Autonomiegraden, das Vorhersagen oder Entscheidungen mit Wirkung auf physische oder
    digitale Umgebungen erzeugt) — wörtlich an die OECD-Definition angelehnt.'
  - 'AUFGEHOBEN — khoản 6 Điều 12: Verbot, KI-Systeme zur Verletzung nationaler, Sicherheits- oder öffentlicher
    Interessen oder zur Schädigung kultureller Traditionen einzusetzen.'
  - 'AUFGEHOBEN — điểm đ khoản 2 Điều 34: Aufnahme von Hochrisiko- und wirkungsstarken KI-Systemen in
    die nationale Datenbank.'
  - 'IN KRAFT geblieben: Digitaltechnikindustrie, digitale Vermögenswerte (tài sản số), Halbleiter, Steuervergünstigungen
    für hochqualifizierte Digitalfachkräfte (Điều 49).'
