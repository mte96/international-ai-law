  regelungsschwerpunkte:
  - 'Aufbau: 8 Kapitel (Chương I-VIII), 35 Artikel (Điều 1-35).'
  - 'Điều 1: Regelungsgegenstand — nghiên cứu, phát triển, cung cấp, triển khai và sử dụng hệ thống trí
    tuệ nhân tạo (Forschung, Entwicklung, Bereitstellung, Einsatz und Nutzung von KI-Systemen).'
  - 'Điều 3: Begriffsbestimmungen — KI, KI-System, Entwickler, Anbieter (nhà cung cấp), Betreiber (bên
    triển khai), Nutzer, betroffene Person, schwerer Vorfall.'
  - 'Điều 7 ''Các hành vi bị nghiêm cấm'': Verbotskatalog mit sechs Gruppen; erfasst u.a. Deepfakes zur
    systematischen Täuschung, Ausnutzung schutzbedürftiger Gruppen, rechtswidrige Datenverarbeitung und
    Desinformation zulasten der nationalen Sicherheit.'
  - 'Điều 8: Einheitliches KI-Portal (cổng thông tin điện tử một cửa) und nationale KI-Datenbank.'
  - 'Điều 9 ''Phân loại mức độ rủi ro'': drei Risikostufen. Hochrisiko = erhebliche Schäden an Leben,
    Gesundheit, legitimen Rechten; mittleres Risiko = Verwechslungsgefahr über die Interaktion mit KI;
    geringes Risiko = Auffangkategorie. Kriterien sind Sektorsensibilität und Nutzerkreis.'
  - 'Điều 11 ''Trách nhiệm minh bạch'': Anbieter müssen interaktive KI als solche offenlegen; Betreiber
    müssen KI-erzeugte Inhalte kennzeichnen, wenn Verwechslungsgefahr über die Echtheit besteht; Audio
    und Video, die reale Personen nachbilden, brauchen leicht erkennbare Kennzeichen und maschinenlesbare
    Formate.'
  - 'Điều 13/14: Konformitätsbewertung (đánh giá sự phù hợp) vor Inbetriebnahme von Hochrisikosystemen;
    technische Dokumentation; Sicherstellung menschlicher Aufsicht; Erläuterungspflicht auf beschreibender
    Ebene ohne Offenlegung von Algorithmen oder Geschäftsgeheimnissen.'
  - 'Điều 29 ''Xử lý vi phạm'': verwaltungs- und strafrechtliche Verantwortlichkeit; Betreiberhaftung
    für Schäden aus dem Betrieb von Hochrisikosystemen mit Entlastung bei Nutzerverschulden und höherer
    Gewalt; bei Angriffen Dritter haftet der Angreifer.'
  - 'Điều 30: Bộ Khoa học và Công nghệ (Ministerium für Wissenschaft und Technologie) als federführende
    Behörde gegenüber der Regierung.'
  - 'Điều 33: hebt khoản 9 Điều 3, khoản 7 Điều 4, khoản 6 Điều 12, điểm đ khoản 2 Điều 34 und das gesamte
    CHƯƠNG IV des Luật Công nghiệp công nghệ số auf — damit wird das KI-Recht aus dem Digitaltechnikindustriegesetz
    in das KI-Gesetz überführt.'
  - 'Điều 35: Übergangsvorschrift für vor Inkrafttreten in Betrieb genommene Systeme (18 Monate Gesundheit/Bildung/Finanzen,
    sonst 12 Monate).'
