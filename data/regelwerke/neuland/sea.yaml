  regelungsschwerpunkte:
  - Biometrische Daten als besondere Kategorie — praktische Schranke für Gesichtserkennung und biometrische
    KI.
  - Einwilligungserfordernis, Zweckbindung, Betroffenenrechte nach DSGVO-Muster.
  - 'Dreispuriges Sanktionssystem: Verwaltungsbußgeld, Strafschadensersatz, Strafvorschriften.'
  - 'Aufsicht: PDPC (สำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคล).'
  - 'UNGEPRÜFT: ob eine Vorschrift zu automatisierten Einzelentscheidungen (Art. 22 DSGVO) existiert.'
