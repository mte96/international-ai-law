  - urheberrecht
  - gpai
  regelungsschwerpunkte:
  - 'Vier Kategorien: verbotene KI (ห้าม), Hochrisiko-KI (ความเสี่ยงสูง), erlaubnispflichtige KI, KI mit
    Transparenzpflicht (Deepfakes, Chatbots, generative KI).'
  - 'Verbotstatbestände: unfaire Diskriminierung durch massenhafte Datenverarbeitung; ''เทคนิคสื่อสารแบบแฝง''
    (verdeckte Kommunikationstechniken) zur Manipulation der Entscheidungsfindung; weitere Tatbestände
    durch Königliche Verordnung.'
  - 'Kennzeichnungspflicht: maschinenlesbare Kennzeichnung KI-erzeugter Inhalte bereits ab mittlerem Risiko.'
  - 'Betroffenenrechte bei KI-gestützten Entscheidungen: Hinweis, Begründung, Anfechtung.'
  - 'Urheberrecht: ausdrückliche Ausnahme für Text- und Data-Mining.'
  - Reallabor (Regulatory Sandbox).
  - DEZENTRALE AUFSICHT — bewusst keine zentrale KI-Behörde. Sektorale Regulierer (ก.ล.ต. Wertpapieraufsicht,
    ธปท. Bank of Thailand, คปภ. Versicherungsaufsicht) entwickeln ihre eigenen KI-Anforderungen; das AI
    Governance Center bei der ETDA koordiniert; ein nationaler KI-Ausschuss setzt die Politik.
  - 'Extraterritorialität: erfasst auch ausländische Entwickler, Anbieter, Betreiber und Plattformbetreiber.'
  - 'Durchsetzung: strenge und gesamtschuldnerische Haftung; Untersagung, Rückruf, Sperrung von KI-Systemen
    in Thailand.'
