  kurztitel: Datenschutzverordnung Vietnam 2023 (Nghị định 13/2023) — aufgehoben
  offizieller_titel: 'Nghị định số 13/2023/NĐ-CP về bảo vệ dữ liệu cá nhân (Verordnung über den Schutz
    personenbezogener Daten)

    '
  fundstelle: Chính phủ, Nghị định số 13/2023/NĐ-CP vom 17.04.2023
  verfahrensnummer: 13/2023/NĐ-CP
  status: aufgehoben
  status_detail: 'Vietnams erstes umfassendes Datenschutzinstrument, in Kraft vom 01.07.2023 bis zum 31.12.2025.
    Außer Kraft getreten mit dem Inkrafttreten des Datenschutzgesetzes 91/2025/QH15 am 01.01.2026. Bleibt
    für Altfälle und für das Verständnis der vietnamesischen Datenschutzdogmatik (Einwilligungszentrierung,
    Anzeigepflichten, Zuständigkeit des Ministeriums für öffentliche Sicherheit) maßgeblich.

    '
  kurzbeschreibung: 'Die Verordnung führte erstmals ein vollständiges Datenschutzregime ein: Legaldefinitionen
    sensibler Daten, Einwilligungserfordernis, Betroffenenrechte, Pflicht zur Datenschutz-Folgenabschätzung
    und Anzeige grenzüberschreitender Übermittlungen an das Ministerium für öffentliche Sicherheit. Sie
    enthielt keine KI-spezifische Norm; KI-Fälle waren nach ihr über die allgemeinen Regeln zu Einwilligung
    und Zweckbindung zu lösen. Sie ist damit der Kontrast, an dem sich Điều 30 des Nachfolgegesetzes messen
    lässt.

    '
