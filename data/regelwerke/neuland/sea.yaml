- id: vn-nd-134-2026-urheberrecht
  jurisdiktion: vn
  kurztitel: KI-Urheberrechtsverordnung Vietnam (Nghị định 134/2026)
  offizieller_titel: 'Nghị định số 134/2026/NĐ-CP sửa đổi, bổ sung một số điều của Nghị định số 17/2023/NĐ-CP
    ngày 26 tháng 4 năm 2023 của Chính phủ quy định chi tiết một số điều và biện pháp thi hành Luật Sở
    hữu trí tuệ về quyền tác giả, quyền liên quan (Verordnung zur Änderung und Ergänzung der Verordnung
    17/2023/NĐ-CP über Urheberrecht und verwandte Schutzrechte)

    '
  fundstelle: 'Chính phủ, Nghị định số 134/2026/NĐ-CP vom 06.04.2026, unterzeichnet Mai Văn Chính; Công
    báo Nr. 256 vom 29.04.2026

    '
  verfahrensnummer: 134/2026/NĐ-CP
  status: anwendbar
  status_detail: 'In Kraft seit dem 09.04.2026. Eine der weltweit ersten ausdrücklichen Kodifikationen
    des Urheberrechts an KI-erzeugten Werken UND einer Text- und Data-Mining-Schranke mit Opt-out. Sie
    fügt in die Urheberrechtsverordnung 17/2023/NĐ-CP die neuen Điều 5a (Schutz KI-gestützt geschaffener
    Werke), Điều 37a (Bedingungen der Nutzung geschützter Werke zum KI-Training) und Điều 37b (Rechtsvorbehalt
    / Opt-out) ein.

    '
  kurzbeschreibung: 'Điều 5a bestimmt, dass ein mit Hilfe von KI geschaffenes Werk nur dann urheberrechtlich
    geschützt ist, wenn der Mensch „đóng góp đáng kể và mang tính quyết định" (einen erheblichen und entscheidenden
    Beitrag) zur Schöpfung geleistet hat. Als solche Beiträge nennt die Vorschrift das Einbringen von
    Eingabedaten, technischen Parametern oder Entwurfsmaterial, das Setzen von Steuerbefehlen („thiết
    lập các câu lệnh để điều khiển hệ thống trí tuệ nhân tạo"), das Bewerten, Auswählen, Bearbeiten, Eingreifen
    oder Auslegen der Ergebnisse sowie Entscheidungen, die künstlerische Absicht, ästhetisches Urteil
    oder fachliches Können ausdrücken; das Ergebnis muss die Vorstellung des Menschen und nicht algorithmische
    Zufälligkeit widerspiegeln. Der Mensch ist Urheber und trägt die Verantwortung für Inhalt und Rechtmäßigkeit.
    Werke, die „hoàn toàn do hệ thống trí tuệ nhân tạo tạo ra" (vollständig von einem KI-System geschaffen)
    sind, genießen keinen Schutz. Điều 37a erlaubt die Nutzung geschützter Werke zum KI-Training unter
    drei Bedingungen: rechtmäßige Veröffentlichung und rechtmäßiger Zugang ohne Umgehung technischer Schutzmaßnahmen;
    Zweck der wissenschaftlichen Forschung, des Versuchs oder des Trainings ohne kommerziellen Zweck,
    wobei das Ergebnis die normale Verwertung nicht ersetzen und keinen unlauteren Wettbewerb begründen
    darf; sowie eine Aufbewahrungspflicht für technische Aufzeichnungen, Trainings- und Nutzungsdaten
    mit Auskunftspflicht gegenüber staatlichen Stellen. Điều 37b gibt Urhebern, ausübenden Künstlern und
    Rechtsinhabern ein Vorbehaltsrecht („quyền bảo lưu"): Sie können die Nutzung zum KI-Training ausschließen,
    indem sie einen maschinenlesbaren Vorbehalt in Metadaten, technischen Schutzmaßnahmen oder Rechteverwaltungsinformationen
    setzen und veröffentlichen oder den Vorbehalt auf der Website einer zugelassenen Verwertungsgesellschaft
    öffentlich erklären.

    '
  inkrafttreten:
    datum: 2026-04-09
    verifiziert: true
    quelle: https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-134-2026-nd-cp-469388.htm
  themenachsen:
  - urheberrecht
  - gpai
  - content
  - vertrag
  regelungsschwerpunkte:
  - 'Điều 5a (neu): Schutz KI-gestützt geschaffener Werke nur bei erheblichem und entscheidendem menschlichem
    Beitrag; Aufzählung der anerkannten Beitragsformen (Eingabedaten, Parameter, Entwurfsmaterial, Steuerbefehle/Prompts,
    Bewertung, Auswahl, Bearbeitung, Auslegung); Mensch ist Urheber und haftet für Inhalt und Rechtmäßigkeit.'
  - 'Điều 5a: Ausschluss vollständig maschinell erzeugter Werke vom Schutz (''hoàn toàn do hệ thống trí
    tuệ nhân tạo tạo ra'').'
  - 'Điều 5a: Die Nutzung darf bestehende Urheberrechte an den Eingabedaten nicht verletzen — Verknüpfung
    von Schutzfähigkeit und Rechtmäßigkeit der Trainingsdaten.'
  - 'Điều 37a (neu): TDM-/Trainingsschranke. Voraussetzungen — (1) rechtmäßig veröffentlichtes Werk, rechtmäßiger
    Zugang, keine Umgehung technischer Schutzmaßnahmen; (2) Zweck Forschung, Versuch oder KI-Training
    ohne kommerziellen Zweck, kein Ersatz der normalen Verwertung, kein unlauterer Wettbewerb; (3) Aufbewahrung
    technischer Aufzeichnungen, Trainings- und Nutzungsdaten sowie Auskunft an staatliche Stellen zur
    Prüfung und Streitbeilegung.'
  - 'Điều 37b (neu): Vorbehaltsrecht (quyền bảo lưu) für Urheber, ausübende Künstler und Rechtsinhaber;
    Ausübung durch maschinenlesbaren Vorbehalt in Metadaten, technischen Schutzmaßnahmen oder Rechteverwaltungsinformationen
    mit Veröffentlichung, oder durch öffentliche Erklärung auf der Website einer zugelassenen Verwertungsgesellschaft.'
  - 'Systematisch bemerkenswert: Vietnam kombiniert eine enge, nichtkommerzielle Trainingsschranke MIT
    einem Opt-out — anders als Art. 4 DSM-RL, wo die kommerzielle TDM-Schranke das Opt-out trägt.'
