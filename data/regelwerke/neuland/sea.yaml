  jurisdiktion: th
  kurztitel: KI-Gesetzesgrundsätze Thailand 2025 ((ร่าง) หลักการของกฎหมาย AI)
  offizieller_titel: '(ร่าง) หลักการของกฎหมายว่าด้วยปัญญาประดิษฐ์ ((Entwurf) Grundsätze des Gesetzes über
    künstliche Intelligenz)

    '
  fundstelle: ETDA / กระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม, Konsultation 11.06.2568 bis 24.06.2568 (2025)
  verfahrensnummer: Konsultation über law.go.th, Juni 2568
  status: entwurf
  status_detail: 'Vorstufe des KI-Gesetzentwurfs von 2026. Am 11.06.2025 als Grundsatzpapier veröffentlicht,
    Konsultation bis zum 24.06.2025. Es führte erstmals zwei getrennte Regelungsansätze zusammen und legte
    die Struktur fest, die der Entwurf von 2026 übernimmt: Fokus auf Hochrisiko-KI, mehrstufige Governance
    von weichen Leitlinien bis zu verbindlichem Recht, Genehmigungsverfahren für Text- und Data-Mining
    sowie ein Reallabor.

    '
  kurzbeschreibung: 'Das Grundsatzpapier beschreibt die Leitentscheidungen für ein thailändisches KI-Gesetz:
    risikoproportionale Aufsicht mit Schwerpunkt auf „ความเสี่ยงสูง" (hohes Risiko), Transparenz des KI-Betriebs,
    Verantwortlichkeit für KI-verursachte Schäden, verantwortungsvolle Nutzung über alle Sektoren, Mechanismen
    für Text- und Data-Mining und ein Regulierungs-Reallabor. Es wählt ausdrücklich einen abgestuften
    Ansatz von Soft Law zu Hard Law statt einheitlicher Vorgaben. Es enthält zwei Risikostufen — verbotene
    Risiken, bei denen der Schaden nicht gemindert werden kann und deren Einsatz kriminalisiert werden
    soll, und Hochrisiko-Systeme, die Grundrechte oder öffentliche Sicherheit berühren und nur unter strengen
    Pflichten zulässig sind.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.etda.or.th/th/pr-news/law_ai.aspx
  anwendungsdaten:
  - datum: 2025-06-24
    was_gilt: Ende der Konsultation über das Grundsatzpapier.
    verifiziert: true
    quelle: https://www.etda.or.th/th/pr-news/law_ai.aspx
  themenachsen:
  - governance
  - marktzugang
  - urheberrecht
  - grundrechte
  regelungsschwerpunkte:
  - 'Zwei Risikostufen: verbotene Risiken (nicht minderbarer Schaden, Kriminalisierung) und Hochrisiko-KI
    (Grundrechte, öffentliche Sicherheit) unter strengen Pflichten.'
  - Abgestufte Governance von Soft Law zu Hard Law statt einheitlicher Vorgaben.
  - Genehmigungsmechanismen für Text- und Data-Mining.
  - Regulierungs-Reallabor (Regulatory Sandbox).
  - Zusammenführung des ONDE-Verordnungsentwurfs (2022) und des ETDA-Gesetzentwurfs (2023).
