- id: th-etda-genai-leitlinie
  jurisdiktion: th
  kurztitel: ETDA-Leitlinie generative KI (แนวทางประยุกต์ใช้ Generative AI)
  offizieller_titel: 'แนวทางประยุกต์ใช้ Generative AI อย่างมีธรรมาภิบาลสำหรับองค์กร (Leitlinie für die
    Anwendung generativer KI in Organisationen nach den Grundsätzen guter Regierungsführung)

    '
  fundstelle: กระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม / ETDA, AI Governance Center (AIGC)
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Unverbindliche Leitlinie der ETDA. Sie ist derzeit das einzige veröffentlichte thailändische
    KI-Governance-Instrument mit Adressatenbezug zu Unternehmen. Getragen wird sie vom AI Governance Clinic
    by ETDA (AIGC), das die ETDA gemeinsam mit NECTEC, dem Department of Medical Services und dem Department
    of Health Service Support eingerichtet hat — mit einem Schwerpunkt auf KI im Gesundheitswesen.

    '
  kurzbeschreibung: 'Die Leitlinie beschreibt, wie Organisationen generative KI verantwortungsvoll einsetzen:
    Governance-Strukturen, Risikobewertung, Datenschutz, Umgang mit Halluzinationen und Urheberrechtsfragen,
    Schulung. Sie ist rechtlich unverbindlich, wird aber im Gesetzentwurf von 2026 als Baustein des abgestuften
    Ansatzes von Soft Law zu Hard Law vorausgesetzt. Das AIGC betreibt daneben ein Schulungsprogramm für
    die öffentliche Verwaltung (AI Governance for Government Program).

    '
