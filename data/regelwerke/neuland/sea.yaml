- id: my-aige-leitlinien
  jurisdiktion: my
  kurztitel: Nationale KI-Governance-Leitlinien Malaysia (AIGE)
  offizieller_titel: 'The National Guidelines on AI Governance & Ethics (AIGE) — Garis Panduan Kebangsaan
    mengenai Tadbir Urus dan Etika Kecerdasan Buatan

    '
  fundstelle: 'Kementerian Sains, Teknologi dan Inovasi (MOSTI, Ministry of Science, Technology and Innovation),
    veröffentlicht September 2024

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Freiwillige, nicht rechtsverbindliche Leitlinien. Sie sind seit September 2024 das einzige
    veröffentlichte nationale KI-Governance-Instrument Malaysias und bilden die Grundlage, auf der der
    AI Governance Bill aufsetzt. Sie gehen auf die im August 2022 veröffentlichte nationale KI-Roadmap
    zurück.

    '
  kurzbeschreibung: 'Die Leitlinien formulieren sieben KI-Grundsätze und richten sich in drei getrennten
    Teilen an drei Adressatengruppen: Endnutzer (Teil A), politische Entscheidungsträger und Regulierungsbehörden
    (Teil B) sowie Entwickler und Gestalter (Teil C). Die sieben Grundsätze sind: Fairness (Vermeidung
    von Verzerrung und Diskriminierung), Zuverlässigkeit, Sicherheit und Kontrolle, Privatheit und Datensicherheit
    (Einwilligung vor der Nutzung personenbezogener Daten, Schutz über den gesamten Lebenszyklus), Inklusivität
    (kein ungleicher Zugang), Transparenz (Erklärbarkeit der Algorithmen), Rechenschaftspflicht (Entwickler
    und Eigentümer verantworten Erfolg und Misserfolg) sowie das Streben nach menschlichem Nutzen und
    Wohlergehen. Das Dokument bezeichnet sich ausdrücklich als freiwillig zu übernehmen und als Unterstützung
    von Selbstregulierungsmechanismen.

    '
  inkrafttreten:
    datum: 2024-09-20
    verifiziert: false
    quelle: https://mastic.mosti.gov.my/storage/2024/09/THE-NATIONAL-GUIDELINES-ON-AI-GOVERNANCE-ETHICS.pdf
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Sieben Grundsätze: Fairness; Reliability, Safety and Control; Privacy and Security; Inclusiveness;
    Transparency; Accountability; Pursuit of Human Benefit and Happiness.'
  - 'Dreiteiliger Aufbau nach Adressaten: Teil A Endnutzer, Teil B politische Entscheidungsträger und
    Regulierer, Teil C Entwickler und Gestalter.'
  - Ausdrücklich freiwillig ('intended to be voluntarily adopted'), Unterstützung von Selbstregulierung.
  - Grundsatz Privacy and Security verlangt Einwilligung vor der Nutzung personenbezogener Daten — Anknüpfung
    an die PDPA.
