- id: my-ai-governance-bill
  jurisdiktion: my
  kurztitel: KI-Governance-Gesetzentwurf Malaysia (AI Governance Bill)
  offizieller_titel: 'Rang Undang-Undang Tadbir Urus Kecerdasan Buatan (AI) — Artificial Intelligence
    (AI) Governance Bill

    '
  fundstelle: 'Konsultationspapier des National AI Office (NAIO) unter dem Kementerian Digital (Ministry
    of Digital), veröffentlicht am 10.07.2026; Konsultation über das Unified Public Consultation Portal
    upc.mpc.gov.my

    '
  verfahrensnummer: Public Consultation Paper des NAIO, 10.07.2026
  status: entwurf
  status_detail: 'KEIN GELTENDES RECHT. Konsultationspapier vom 10.07.2026, Stellungnahmefrist bis zum
    31.07.2026. Die Einbringung ins Parlament war für das Jahr 2026 angekündigt; ob sie bis zum Stichtag
    dieser Recherche (06.09.2026) erfolgt ist, war nicht feststellbar. Es wäre Malaysias erster horizontaler
    KI-Rechtsrahmen.

    '
  kurzbeschreibung: 'Der Entwurf verfolgt einen risikobasierten Ansatz über den gesamten Lebenszyklus
    eines KI-Systems. Er erfasst KI-Systeme, die in Malaysia in Verkehr gebracht oder in Betrieb genommen
    werden oder dort entwickelt wurden, unabhängig vom Ort des Hostings — also extraterritorial. KI wird
    definiert als funktionale Fähigkeit, die einem System erlaubt, Funktionen zu erfüllen, die menschlichen
    kognitiven Funktionen ähneln; unterschieden werden „developer" (wer Fähigkeiten, Funktion oder Leistung
    des Systems prägt) und „deployer" (wer das System unter realen Bedingungen betreibt). Es gibt drei
    Risikostufen, bemessen nach Eintrittswahrscheinlichkeit, Schwere bzw. Ausmaß und Dauer bzw. Umkehrbarkeit
    des Schadens: Stufe 1 (unacceptable — Absicht, Schaden zuzufügen), Stufe 2 (high risk — Möglichkeit
    unbeabsichtigten Schadens), Stufe 3 (low risk — kein absehbarer wesentlicher Schaden). Entwickler
    und Betreiber müssen fünf Governance-Grundsätze beachten: Schutz der Menschenwürde, Transparenz und
    Erklärbarkeit, klare Verantwortlichkeit, Sicherheit sowie verantwortungsvolle Data Governance. Vorgesehen
    sind eine zentrale KI-Behörde (Central AI Authority) mit Sicherheits-, Ermittlungs-, Durchsetzungs-
    und Förderfunktionen, die Befugnisse an sektorale Aufsichten delegieren kann, eine Meldepflicht für
    Vorfälle (jedes Versagen, jede Schwäche, jeder Missbrauch, jede unerwartete Wirkung und jedes Beinahe-Ereignis)
    und ein KI-Reallabor. Der Digitalminister Gobind Singh Deo hat ausdrücklich klargestellt, dass das
    Gesetz die AUSGABEN von KI nicht unmittelbar regeln soll — dafür bleiben die bestehenden Gesetze zuständig.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.digital.gov.my/en-GB/siaran/Kementerian-Digital-Mulakan-Libat-Urus-Cadangan-Rang-Undang-Undang-Tadbir-Urus-Kecerdasan-Buatan-(AI)
  anwendungsdaten:
  - datum: 2026-07-31
    was_gilt: Ende der öffentlichen Konsultation über das NAIO-Konsultationspapier.
    verifiziert: false
    quelle: https://www.rahmatlim.com/perspectives/articles/33264/mykh-national-ai-office-issues-public-consultation-paper-on-proposed-artificial-intelligence-ai-governance-bill
  themenachsen:
  - marktzugang
  - governance
  - haftung
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Anwendungsbereich extraterritorial: KI-Systeme, die in Malaysia in Verkehr gebracht, in Betrieb genommen
    oder dort entwickelt wurden, unabhängig vom Hosting-Ort.'
  - 'KI-Definition: ''a functional capability ... that enables a system to perform functions that resemble
    human cognitive functions'' — funktional, nicht technikbezogen.'
  - 'Rollen: developer (prägt Fähigkeiten, Funktion, Leistung) und deployer (betreibt unter realen Bedingungen).'
  - 'Drei Risikostufen nach Eintrittswahrscheinlichkeit, Schwere/Ausmaß und Dauer/Umkehrbarkeit: Tier
    1 unacceptable (Schädigungsabsicht), Tier 2 high risk (unbeabsichtigter Schaden möglich), Tier 3 low
    risk.'
  - 'Fünf Governance-Grundsätze, die mit ''due regard'' zu beachten sind: Menschenwürde, Transparenz/Erklärbarkeit,
    klare Verantwortlichkeit, Sicherheit, verantwortungsvolle Data Governance.'
  - Central AI Authority mit Sicherheits-, Ermittlungs-, Durchsetzungs- und Förderfunktion; Delegation
    an sektorale Aufsichten.
  - 'Meldepflicht für Vorfälle: ''any failure, weakness, misuse, unexpected effect, or near-miss event''
    samt Angaben zu Schaden, Eindämmung und Abhilfe.'
  - KI-Reallabor, zentral oder dezentral.
  - 'AUSDRÜCKLICHE ABGRENZUNG: Das Gesetz soll die Ausgaben von KI nicht unmittelbar regeln; rechtswidrige
    Inhalte bleiben Sache des Online Safety Act und des Communications and Multimedia Act.'
  - Das Konsultationspapier enthält keine Bußgeldvorschriften.
