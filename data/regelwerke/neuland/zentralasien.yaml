- id: uz-up189
  jurisdiktion: uz
  kurztitel: KI-Zusatzmaßnahmenerlass (УП-189)
  offizieller_titel: 'Ўзбекистон Республикаси Президентининг Фармони „Сунъий интеллект технологияларини
    янада ривожлантиришга оид қўшимча чора-тадбирлар тўғрисида" / Указ Президента Республики Узбекистан
    „О дополнительных мерах по дальнейшему развитию технологий искусственного интеллекта"

    '
  fundstelle: 'Указ Президента Республики Узбекистан от 22 октября 2025 года № УП-189; Национальная база
    данных законодательства, 27.10.2025, № 06/25/189/0978

    '
  verfahrensnummer: УП-189
  status: softlaw
  status_detail: 'In Kraft. Der operativ dichteste KI-Rechtsakt Usbekistans: fünf Abschnitte mit Zielen,
    institutionellen Maßnahmen, Rahmenbedingungen, Fachkräfteausbildung und Vollzugskontrolle. Er enthält
    die einzige usbekische Rechtsgrundlage für KI-SICHERHEITS- UND ETHIKNORMEN (Ziff. 17 Buchst. g).

    '
  kurzbeschreibung: 'Der Erlass setzt vier Ziele: bis Ende 2026 mindestens 100 Projekte zur breiten KI-Einführung
    in Verwaltung, Sozialbereich und Wirtschaft; bis Ende 2030 über 1 Mrd. USD Auslandsinvestitionen in
    KI-Infrastruktur; ab dem Schuljahr 2026/2027 KI-Themen in den Lehrplänen und Lehrbüchern der allgemeinen
    Mittel- und der Hochschulbildung; bis Ende 2026 fünfzehn KI-Labore an Hochschulen. Institutionell
    schafft er einen Beirat beim Ministerium für digitale Technologien, das Nationale Portal ai.gov.uz,
    die nichtstaatliche „Альянс искусственного интеллекта" und eine Beraterstelle für digitale Technologien
    und KI in jeder Region und jedem Bezirk. Rechtlich bedeutsam sind vor allem drei Vorgaben: die Pflichtabstimmung
    aller KI-bezogenen Rechtsetzungsentwürfe mit der Nationalen Agentur für Perspektivprojekte ab 01.01.2026,
    die Zuständigkeit derselben Agentur für KI in Kryptoassets, E-Commerce, Versicherung, Wertpapieren
    und Blockchain, und der Auftrag, binnen dreier Monate Grundsätze für Schaffung, Einführung und Anwendung
    KI-gestützter Lösungen sowie SICHERHEITS- UND ETHIKNORMEN zu billigen.

    '
  inkrafttreten:
    datum: 2025-10-27
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7790236
  anwendungsdaten:
  - datum: 2025-12-31
    was_gilt: 'Ziff. 2 Buchst. b: Start des Nationalen Portals „ai.gov.uz" mit Angaben zu Projekten, Programmen,
      Start-ups und kostenlosen Onlinekursen; Betrieb und Informationssicherheit beim Zentrum für KI-Entwicklung.
      Ziff. 17 Buchst. c: Vorlage methodischer Empfehlungen für den wirksamen und SICHEREN Einsatz von
      KI-Technologien in staatlichen Organen und Wirtschaftsgesellschaften beim Ministerkabinett.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7790236
  - datum: 2026-01-22
    was_gilt: 'Ziff. 17 Buchst. g: Dreimonatsfrist für das Ministerium für digitale Technologien, „принципы
      создания, внедрения и применения решений, основанных на искусственном интеллекте в Республике Узбекистан,
      а также НОРМЫ БЕЗОПАСНОСТИ И ЭТИКИ" zu billigen. Das wäre der erste usbekische KI-Ethikkodex.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7790236
  - datum: 2026-01-01
    was_gilt: 'Ziff. 3 Buchst. a: Entwürfe normativer Rechtsakte UND technischer Aufgabenstellungen, die
      die Einführung von KI-Technologien vorsehen, werden ZWINGEND mit der Nationalen Agentur für Perspektivprojekte
      abgestimmt. Ziff. 3 Buchst. b: Dieselbe Agentur bestimmt die Verfahren für den KI-Einsatz im Kryptoasset-Umlauf,
      im E-Commerce, in Versicherung und Wertpapieren sowie in blockchainbasierten Informationssystemen.
      Ziff. 8 Buchst. b: Staatliche Organe und Wirtschaftsgesellschaften dürfen Grafikprozessoren direkt
      bei offiziellen Distributoren beschaffen.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7790236
  - datum: 2026-03-01
    was_gilt: 'Ziff. 10 Buchst. a: Einführung eines KI-gestützten Systems zur Wetterfrühwarnung. Ziff.
      13: Bildung eines KI-Clusters an der Universität „Neues Usbekistan". Ziff. 4 Buchst. b: Beginn des
      halbjährlichen Wettbewerbs „Bestes KI-Projekt" zwischen den Ministerien.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7790236
  - datum: 2026-06-01
    was_gilt: 'Ziff. 8 Buchst. c: Öffentliche Beschaffung KI-gestützter Informationssysteme nur noch bei
      Unternehmen aus einem eigens geführten Register — oder, bei Verträgen bis zum 2 500-fachen der Basisrechengröße,
      im Direktvertrag. Das ist eine faktische MARKTZUGANGSREGEL für KI-Anbieter im öffentlichen Sektor.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7790236
  - datum: 2026-12-31
    was_gilt: 'Ziff. 10 Buchst. b: Schaffung eines „Korpus der usbekischen Sprache" mit mindestens 15
      Milliarden Parametern und dessen Einführung in mindestens fünf OFFENEN großen Sprachmodellen. Ziff.
      1 Buchst. a: mindestens 100 KI-Einführungsprojekte. Ziff. 1 Buchst. g: 15 KI-Labore an Hochschulen.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7790236
  themenachsen:
  - governance
  - marktzugang
  - sektor-oeffentlich
  - sektor-finanz
  - arbeit
  regelungsschwerpunkte:
  - 'Ziff. 3 Buchst. a: Pflichtabstimmung KI-bezogener Rechtsetzungsentwürfe und technischer Aufgabenstellungen
    mit der Национальное агентство перспективных проектов (Nationale Agentur für Perspektivprojekte, NAPP)
    ab dem 01.01.2026. Damit hat Usbekistan eine zweite KI-Behörde neben dem Ministerium für digitale
    Technologien — mit einem Vetorecht im Rechtsetzungsverfahren.

    '
  - 'Ziff. 17 Buchst. g: Auftrag zur Billigung von Grundsätzen für Schaffung, Einführung und Anwendung
    KI-gestützter Lösungen sowie von Sicherheits- und Ethiknormen binnen dreier Monate. Ob dieses Dokument
    ergangen ist, war am 06.09.2026 nicht feststellbar — es wäre das eigentliche usbekische KI-Regelwerk.

    '
  - 'Ziff. 17 Buchst. a: Vorschlag zum Beitritt zum Programm der internationalen Zusammenarbeit der OECD
    im Bereich der künstlichen Intelligenz binnen zweier Monate.

    '
  - 'Ziff. 9: Gesamtnationaler KI-Hackathon in den Bereichen Gesundheit, Bildung, JUSTIZSYSTEM, Wasserwirtschaft
    und Unternehmensentwicklung — die ausdrückliche Nennung des Justizsystems verzahnt den Erlass mit
    der Justizstrategie УП-160.

    '
  - 'Ziff. 11 Buchst. b: Die Projektliste wird „исходя из СТЕПЕНИ РИСКА в сферах" gebildet — nach dem
    Risikograd in den Bereichen. Das ist die einzige Stelle im usbekischen Recht, an der ein Risikoansatz
    auftaucht; er dient allerdings der Projektpriorisierung, nicht der Regulierung.

    '
  - 'Ziff. 16: In jeder Region und jedem Bezirk wird eine Stelle des „советник, ответственный за развитие
    цифровых технологий и технологий искусственного интеллекта" eingerichtet, besetzt auf Empfehlung des
    Ministeriums für digitale Technologien aus dem Kreis ausländischer Fachleute und Landsleute im Ausland,
    mit marktgerechter Vergütung.

    '
  dokumente:
  - datum: 2025-10-22
    typ: leitlinie
    titel: 'УП-189-сон 22.10.2025 „О дополнительных мерах по дальнейшему развитию технологий искусственного
      интеллекта"

      '
    url: https://lex.uz/ru/docs/7790236
    sprache: ru
    urheber: Präsident der Republik Usbekistan (Sh. Mirziyoyev)
    verifiziert: true
    notiz: 'Die russische Fassung ist auf lex.uz durchgängig als unamtliche Übersetzung gekennzeichnet.
      Anlagen 1 bis 4 liegen nur auf Usbekisch vor (ausdrücklicher Hinweis im Text: „Приложения №№ 1 —
      4 приводятся на узбекском языке").

      '
  offene_punkte:
  - 'DER WICHTIGSTE OFFENE PUNKT DIESER DATEI FÜR USBEKISTAN: Ob die nach Ziff. 17 Buchst. g bis etwa
    22.01.2026 zu billigenden „Grundsätze der Schaffung, Einführung und Anwendung KI-gestützter Lösungen
    sowie Sicherheits- und Ethiknormen" ergangen sind. Eine Suche auf lex.uz nach diesem Dokument blieb
    erfolglos; das Ministerium für digitale Technologien veröffentlicht seine Erlasse nicht vollständig
    auf lex.uz. Zu prüfen wären ai.gov.uz und digital.uz.

    '
  - 'Anlagen 1 bis 4 (Vergünstigungspaket für Karakalpakstan- Investoren, Maßnahmenplan Fachkräfte, Liste
    der Sprachkorpus-Zulieferer, Liste der Hochschullabore) liegen nur auf Usbekisch vor und wurden nicht
    ausgewertet.

    '
  - 'Ob das Register der für die KI-Beschaffung zugelassenen Unternehmen (Ziff. 8 Buchst. c) errichtet
    wurde und nach welchen Kriterien die Aufnahme erfolgt, ist offen. Das ist die einzige marktzugangsrelevante
    Vorschrift des usbekischen KI-Rechts.

    '
