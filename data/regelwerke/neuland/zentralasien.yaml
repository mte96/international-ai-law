- id: kz-vertrauenswuerdige-listen
  jurisdiktion: kz
  kurztitel: Regeln über Listen vertrauenswürdiger Hochrisiko-KI (Erlass 196/НҚ)
  offizieller_titel: 'Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового
    развития Республики Казахстан „Об утверждении Правил формирования отраслевыми государственными органами
    перечней доверенных систем искусственного интеллекта высокой степени риска и их публикации на интернет-ресурсах
    государственных органов"

    '
  fundstelle: 'Приказ от 10 апреля 2026 года № 196/НҚ; adilet-Kennung V2600038422

    '
  verfahrensnummer: 196/НҚ
  status: anwendbar
  status_detail: 'In Kraft; zehn Kalendertage nach Erstveröffentlichung. Grundlage: Art. 19 Abs. 1 KI-Gesetz.
    Frist nach Anordnung Nr. 2-р war Januar 2026, ergangen am 10.04.2026.

    '
  kurzbeschreibung: 'Regelt das Verfahren, in dem die Ressortbehörden die Listen vertrauenswürdiger Hochrisiko-KI-Systeme
    bilden und im Internet veröffentlichen. Die Aufnahme setzt nach Art. 19 Abs. 2 KI-Gesetz ein Audit
    des Systems voraus. Das Modell ist eine freiwillige staatliche Vertrauensliste, kein Zulassungsverfahren:
    Der Betrieb eines Hochrisiko-Systems ist auch ohne Listeneintrag zulässig.

    '
  inkrafttreten:
    datum: 2026-04-10
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/V2600038422
  themenachsen:
  - marktzugang
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Die Listenführung liegt bei den FACHRESSORTS (отраслевые государственные органы), nicht bei der KI-Behörde.
    Damit entsteht eine sektorale Aufsichtsstruktur neben der horizontalen Zuständigkeit des МИИЦР.

    '
  - 'Auf der Rechtsfolgenseite ist die Liste ein Reputations- und Beschaffungsinstrument, keine Marktzugangsvoraussetzung.
    Das unterscheidet das Modell grundlegend von der Konformitätsbewertung nach Art. 43 KI-VO.

    '
  dokumente:
  - datum: 2026-04-10
    typ: norm
    titel: Приказ № 196/НҚ от 10 апреля 2026 года mit Anlage
    url: https://adilet.zan.kz/rus/docs/V2600038422
    sprache: ru
    urheber: МИИЦР (Ж. Мадиев)
    verifiziert: true
    notiz: Wurde nur der verfügende Teil des Erlasses gelesen, nicht die Anlage mit dem Verfahren.
  offene_punkte:
  - 'Die Anlage (das eigentliche Verfahren: Antrag, Auditnachweis, Aufnahme, Streichung, Rechtsschutz)
    wurde nicht ausgewertet. Ebenso wenig ist geklärt, ob bereits Listen veröffentlicht wurden.

    '
