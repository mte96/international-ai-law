  regelungsschwerpunkte:
  - 'Ziff. 3: Prioritäre Einführungsbereiche — Bank- und Finanzwesen (Betrugsprävention, Bonitätsbewertung,
    Marktprognose), Steuer- und Zollwesen (Schattenwirtschaft, Erkennung verdächtiger Zollvorgänge, Risikomanagement),
    Gesundheit (Diagnostik, Behandlungswahl, Bildanalyse, Patientendatenverwaltung), Landwirtschaft, Energie.
    Diese Liste ist die usbekische Entsprechung zum Hochrisiko-Anhang der KI-VO — allerdings als FÖRDERLISTE,
    nicht als Risikoliste.

    '
  - 'Ziff. 4: Zinsloser Kredit des Fonds für Rekonstruktion und Entwicklung an das Ministerium für digitale
    Technologien in Höhe von 50 Mio. USD über fünf Jahre (zwei Jahre tilgungsfrei) ab dem 01.01.2025 zur
    KI-Entwicklung.

    '
  - 'Ziff. 7: Errichtung des staatlichen Учреждения „Центр развития искусственного интеллекта и цифровой
    экономики" (Zentrum für die Entwicklung der künstlichen Intelligenz und der digitalen Wirtschaft)
    auf Basis des „Центр исследований цифровой экономики" in der Struktur des Ministeriums für digitale
    Technologien. Staatliche Stellen und Unternehmen mit staatlicher Beteiligung müssen dem Zentrum auf
    Anfrage ungehinderten Zugang zu ihren Informationssystemen und Datenbanken einräumen (mit Ausnahme
    gesetzlich geschützter Daten); das Zentrum führt die Prüfung (экспертиза) von Informationssystemen
    und Software daraufhin durch, ob sie auf KI-Technologien beruhen.

    '
  - 'Ziff. 7-1 (eingefügt durch УП-189): Aufgaben des Zentrums, darunter erstens die „формирование нормативно-правовой
    базы, необходимой для развития технологий искусственного интеллекта, внедрение международных стандартов"
    — das Zentrum ist damit der faktische Normvorbereiter des usbekischen KI-Rechts.

    '
