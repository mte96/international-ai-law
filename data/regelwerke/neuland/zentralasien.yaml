- id: kz-cybersicherheitsgesetz
  jurisdiktion: kz
  kurztitel: Cybersicherheitsgesetz (ehem. Informatisierungsgesetz, Nr. 418-V)
  offizieller_titel: 'Закон Республики Казахстан „О кибербезопасности" (bis Juli 2026: „Об информатизации")
    — Gesetz der Republik Kasachstan „Über die Cybersicherheit" (vormals „Über die Informatisierung")

    '
  fundstelle: 'Закон Республики Казахстан от 24 ноября 2015 года № 418-V ЗРК; „Казахстанская правда" vom
    26.11.2015 № 227 (28103); „Егемен Қазақстан" vom 26.11.2015 № 227 (28705); Ведомости Парламента РК
    2015 г., № 22-V, ст. 155. Registriernummer im Staatsregister: 95699.

    '
  verfahrensnummer: 418-V
  status: anwendbar
  status_detail: 'In Kraft, aber grundlegend umgebaut. Der TITEL des Gesetzes wurde durch Gesetz Nr. 256-VIII
    vom 09.01.2026 von „Об информатизации" in „О кибербезопасности" geändert, die Präambel gestrichen
    und die Abschnittsüberschrift des Abschnitts 1 aufgehoben — jeweils mit Wirkung sechs Monate nach
    Erstveröffentlichung, also ab Juli 2026. adilet führt als letztes Änderungsdatum den 25.08.2026.

    '
  kurzbeschreibung: 'Das Gesetz war bis 2026 das kasachische Grundgesetz der Informatisierung; mit dem
    Digitalkodex ist sein Informatisierungsteil weggefallen und der Rest zum Cybersicherheitsgesetz geworden.
    Für das KI-Recht bleiben drei durch das KI-Begleitgesetz Nr. 231-VIII eingefügte Vorschriften bedeutsam:
    Art. 35 Abs. 2-2 (anonymisierter Zugang des KI-Plattformbetreibers zu vertraulichen Ressourcen), Art.
    36 Abs. 6 (Verweisung der automatisierten Verarbeitung ins Datenschutzrecht) und Art. 39 Abs. 7 (staatliche
    KI-Systeme unterliegen zusätzlich dem KI-Recht). Der Begriff „критически важные цифровые объекты"
    (kritisch wichtige digitale Objekte) des Art. 1 ist die Anknüpfung, über die Hochrisiko-KI nach Art.
    17 Abs. 1 KI-Gesetz den staatlichen Cybersicherheitsanforderungen unterworfen wird.

    '
  inkrafttreten:
    datum: 2016-01-01
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/Z1500000418
  anwendungsdaten:
  - datum: 2026-07-10
    was_gilt: 'Neuer Titel „О кибербезопасности", Streichung der Präambel und der Abschnittsüberschrift
      — angeordnet durch Gesetz Nr. 256-VIII vom 09.01.2026 mit einer Frist von sechs Monaten nach Erstveröffentlichung.

      '
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/Z1500000418
  themenachsen:
  - sicherheit-export
  - governance
  - sektor-oeffentlich
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 1 Ziff. 3: „критически важные цифровые объекты" — digitale Objekte, deren Störung oder Ausfall
    zur rechtswidrigen Erhebung und Verarbeitung zugangsbeschränkter personenbezogener Daten, zu Notlagen
    sozialen oder technogenen Charakters oder zu erheblichen negativen Folgen für Verteidigung, Sicherheit,
    internationale Beziehungen, Wirtschaft, einzelne Wirtschaftsbereiche oder die Lebenstätigkeit der
    Bevölkerung führt; einschließlich der Infrastrukturen Wärme-, Strom-, Gas- und Wasserversorgung, Industrie,
    Gesundheit, Telekommunikation, Bankwesen, Verkehr, Wasserbau, Strafverfolgung und „digitale Regierung".

    '
  - 'Art. 35 Abs. 2-2 (eingefügt durch Nr. 231-VIII): Zugang des Betreibers der nationalen KI-Plattform
    zu VERTRAULICHEN elektronischen Informationsressourcen nur unter Sicherstellung der Anonymisierung;
    die Daten werden nach den Datenverwaltungsanforderungen bereitgestellt.

    '
  - 'Art. 39 Abs. 7 (eingefügt durch Nr. 231-VIII): Erstellung und Entwicklung von KI-Systemen, die zu
    den Informatisierungsobjekten des „elektronischen Regierens" gehören, erfolgen unter Beachtung der
    Besonderheiten des KI-Rechts.

    '
  - 'Art. 9-1 (eingefügt durch Nr. 231-VIII): Lizenzpflicht für Tätigkeiten im Bereich der Informationssicherheit.
    Zusammen mit der Änderung des Art. 1 Ziff. 30-6 und 30-7 (Betreiber müssen Residenten Kasachstans
    OHNE ausländische Beteiligung sein) ergibt sich eine Lokalisierungsanforderung für Informationssicherheits-Dienstleister,
    die auch KI-Auditoren trifft.

    '
  dokumente:
  - datum: 2015-11-24
    typ: konsolidiert
    titel: 'Закон Республики Казахстан от 24 ноября 2015 года № 418-V ЗРК „О кибербезопасности" (konsolidierte
      Fassung; bis Juli 2026 „Об информатизации")

      '
    url: https://adilet.zan.kz/rus/docs/Z1500000418
    sprache: ru
    urheber: ИПС „Әділет"
    verifiziert: true
    notiz: 'Die Titelfußnote („Сноска. Заголовок Закона - в редакции Закона РК от 09.01.2026 № 256-VIII")
      belegt die Umbenennung. Wer nach dem kasachischen Informatisierungsgesetz sucht, muss diese Fundstelle
      kennen.

      '
  offene_punkte:
  - 'Welche Vorschriften des alten Informatisierungsgesetzes in den Digitalkodex übergegangen und welche
    ersatzlos entfallen sind, wurde nicht systematisch abgeglichen. Das ist für die Verdrahtung der Verweisungen
    im KI-Gesetz (Art. 17 Abs. 4 verweist auf „законодательство об информатизации") erheblich: Das KI-Gesetz
    verweist auf ein Gesetz, das es unter diesem Namen seit Juli 2026 nicht mehr gibt.

    '
