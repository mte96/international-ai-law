- id: kz-plattformregeln
  jurisdiktion: kz
  kurztitel: Regeln zur nationalen KI-Plattform (Erlass 482/НҚ)
  offizieller_titel: 'Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового
    развития Республики Казахстан „Об утверждении правил взаимодействия оператора национальной платформы
    искусственного интеллекта с физическими и юридическими лицами в рамках оказания услуг на национальной
    платформе искусственного интеллекта для разработки, размещения платформенных программных продуктов,
    моделей искусственного интеллекта на национальной платформе искусственного интеллекта"

    '
  fundstelle: 'Приказ от 13 августа 2026 года № 482/НҚ; im Justizministerium registriert am 14.08.2026
    unter Nr. 39591

    '
  verfahrensnummer: 482/НҚ; Justizregistrierung Nr. 39591
  status: anwendbar
  status_detail: 'Neu (Stand 06.09.2026). Grundlage: Art. 25 Abs. 2 KI-Gesetz. Die Anordnung Nr. 2-р hatte
    den Erlass für Januar 2026 vorgesehen; tatsächlich ergangen im August 2026 — sieben Monate Verzug.

    '
  kurzbeschreibung: 'Regelt, unter welchen Bedingungen Private die staatliche KI-Plattform nutzen, dort
    Modelle und Plattformsoftware entwickeln und hosten dürfen. Betreiber der Plattform ist nach dem Regierungsbeschluss
    Nr. 25 vom 23.01.2024 die АО „Национальные информационные технологии" (NIT). Die Plattform ist nach
    Art. 25 Abs. 1 KI-Gesetz ausdrücklich als „kontrollierte Umgebung" für Entwicklung, Training und Probebetrieb
    während eines begrenzten Zeitraums ausgestaltet — funktional ein staatlich betriebenes Reallabor,
    aber ohne die Aufsichtserleichterungen, die Art. 57 ff. KI-VO für Reallabore vorsehen.

    '
  inkrafttreten:
    datum: 2026-08-14
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/V2600039591
  themenachsen:
  - marktzugang
  - governance
  - sektor-oeffentlich
  - datenschutz
  regelungsschwerpunkte:
  - 'Zusammenspiel mit Art. 17 Abs. 3 Datenschutzgesetz: Für die nationale KI-Plattform nimmt der Plattformbetreiber
    die Anonymisierung personenbezogener Daten selbst vor, soweit der Verantwortliche sie nicht bereits
    vorgenommen hat.

    '
  - 'Zusammenspiel mit Art. 35 Abs. 2-2 Informatisierungs-/ Cybersicherheitsgesetz: Der Zugang des Plattformbetreibers
    zu VERTRAULICHEN elektronischen Informationsressourcen ist nur unter Sicherstellung der Anonymisierung
    zulässig.

    '
  dokumente:
  - datum: 2026-08-13
    typ: norm
    titel: Приказ № 482/НҚ от 13 августа 2026 года
    url: https://adilet.zan.kz/rus/search/docs?fulltext=%D0%B2%D0%B7%D0%B0%D0%B8%D0%BC%D0%BE%D0%B4%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D0%B8%D1%8F%20%D0%BE%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D0%BE%D1%80%D0%B0%20%D0%BD%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D0%B9%20%D0%BF%D0%BB%D0%B0%D1%82%D1%84%D0%BE%D1%80%D0%BC%D1%8B
    sprache: ru
    urheber: МИИЦР
    verifiziert: false
    notiz: 'Der Erlass wurde nur über die adilet-Volltextsuche nachgewiesen (Titel, Datum, Justizregistrierungsnummer
      39591 vom 14.08.2026); die Dokument-URL selbst wurde nicht aufgerufen. Deshalb `verifiziert: false`
      und Suchtreffer statt Direktlink.'
  - datum: 2024-01-23
    typ: delegiert
    titel: 'Постановление Правительства Республики Казахстан от 23 января 2024 года № 25 „Об определении
      оператора национальной платформы искусственного интеллекта"

      '
    url: https://adilet.zan.kz/rus/docs/P2400000025
    sprache: ru
    urheber: Regierung der Republik Kasachstan (A. Smailow)
    verifiziert: true
    notiz: 'Bestimmt die АО „Национальные информационные технологии" zum Betreiber der nationalen KI-Plattform.
      Erlassen bereits 22 Monate VOR dem KI-Gesetz, auf Grundlage von Art. 1 Ziff. 55 des damaligen Informatisierungsgesetzes
      — die Plattform ist also älter als ihr gesetzlicher Rahmen.

      '
  offene_punkte:
  - 'Die adilet-Kennung des Erlasses Nr. 482/НҚ ist nicht gesichert (vermutet: V2600039591). Der Direktlink
    ist nachzutragen.

    '
  - 'Der Regierungsbeschluss Nr. 25 verweist auf Art. 1 Ziff. 55 Informatisierungsgesetz; genau diese
    Ziffer wurde durch das KI-Begleitgesetz Nr. 231-VIII GESTRICHEN. Die Rechtsgrundlage des Betreiberbeschlusses
    ist damit entfallen, ohne dass der Beschluss aufgehoben oder auf Art. 12 Ziff. 2 KI-Gesetz umgestellt
    worden wäre. Nach der Anordnung Nr. 2-р (Ziff. 2 des Anhangs) war eine Änderung des Beschlusses Nr.
    25 für Januar 2026 vorgesehen; ob sie ergangen ist, war nicht feststellbar.

    '
