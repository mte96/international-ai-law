    urheber: Regierung der Republik Kasachstan
    verifiziert: true
    notiz: 'Der Regierungsbeschluss, der die Umbildung des МЦРИАП in das МИИЦР vollzieht. Der Präsidialerlass
      Nr. 997 selbst war unter keiner der geprüften adilet-Kennungen abrufbar (siehe offene_punkte).

      '
  - datum: 2025-11-04
    typ: norm
    titel: 'Приказ и.о. Министра искусственного интеллекта и цифрового развития РК от 4 ноября 2025 года
      № 555/НҚ „Об утверждении Положения о РГУ «Комитет искусственного интеллекта и управления данными»"
      (aufgehoben)

      '
