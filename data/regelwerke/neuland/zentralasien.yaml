  jurisdiktion: kz
  kurztitel: KI-Gesetz Kasachstan (Nr. 230-VIII)
  offizieller_titel: 'Қазақстан Республикасының Заңы „Жасанды интеллект туралы" / Закон Республики Казахстан
    „Об искусственном интеллекте" — Gesetz der Republik Kasachstan „Über künstliche Intelligenz"

    '
  fundstelle: 'Закон Республики Казахстан от 17 ноября 2025 года № 230-VIII ЗРК. Erstveröffentlichung:
    газета „Егемен Қазақстан" № 222 (31202) vom 18.11.2025; газета „Казахстанская правда" № 222 (30600)
    vom 18.11.2025; Эталонный контрольный банк НПА РК в электронном виде (Referenzkontrollbank der NPA
    in elektronischer Form) vom 20.11.2025. Registriernummer im Staatsregister der normativen Rechtsakte:
    217048. Erlassort: Astana.

    '
  verfahrensnummer: 'Gesetzentwurf im Mazhilis eingebracht September 2025 (Dossier bei online.zakon.kz
    doc_id=34868071); Registriernummer des Normgebers: 230-VIII

    '
  status: anwendbar
  status_detail: 'In Kraft. Art. 31: „Настоящий Закон вводится в действие по истечении шестидесяти календарных
    дней после дня его первого официального опубликования" — das Gesetz tritt nach Ablauf von sechzig
    Kalendertagen nach dem Tag der Erstveröffentlichung in Kraft. Erstveröffentlichung 18.11.2025, damit
    Inkrafttreten Mitte Januar 2026. Bereits geändert durch Gesetz Nr. 326-VIII vom 24.06.2026 (Art. 1,
    13, 17, 20, 28); die Änderungen sind nach Angabe von adilet.zan.kz seit dem 25.08.2026 im Text.

    '
  kurzbeschreibung: 'Sechs Kapitel, 31 Artikel. Adressaten sind Eigentümer (собственник), Besitzer/Betreiber
    (владелец) und Nutzer (пользователь) von KI-Systemen; eine Anbieter-/Betreiber-Dichotomie nach dem
    Muster der KI-VO kennt das Gesetz nicht. Art. 17 teilt KI-Systeme in drei Risikostufen (minimal, mittel,
    hoch), zusätzlich in drei Autonomiestufen (niedrig, mittel, hoch) und in drei Nutzungsregime (offen,
    geschlossen, lokal) ein; die Einstufung nimmt der Eigentümer oder Besitzer SELBST vor. Art. 17 Abs.
    3 verbietet sieben Funktionalitäten (Manipulation, Ausnutzung von Verwundbarkeit, Social Scoring,
    rechtswidrige Datenverarbeitung, biometrische Kategorisierung zu Diskriminierungszwecken, Emotionserkennung
    ohne Einwilligung, Erzeugung verbotener Inhalte). Art. 21 verlangt Kennzeichnung synthetischer Ergebnisse
    in maschinenlesbarer Form plus visuelle Warnung. Art. 23 regelt das Urheberrecht an KI-Ergebnissen
    und am Training. Sanktion: kein eigener Bußgeldrahmen im Gesetz (Art. 30 verweist auf die Gesetze),
    sondern Art. 641-1 КоАП (15 bis 200 МРП, im Wiederholungsfall bis 200 МРП und Aussetzung oder Verbot
    des Betriebs des KI-Systems).

    '
  inkrafttreten:
    datum: 2026-01-17
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/Z2500000230
  anwendungsdaten:
  - datum: 2026-01-17
    was_gilt: 'Gesamtes Gesetz. Berechnet aus Art. 31 (60 Kalendertage nach Erstveröffentlichung) und
      der Erstveröffentlichung vom 18.11.2025. Die kasachische Zählpraxis (Beginn am Tag nach der Veröffentlichung,
      Wirksamkeit „по истечении" = mit Ablauf) führt je nach Lesart auf den 17. oder 18.01.2026; adilet.zan.kz
      nennt kein Kalenderdatum, sondern gibt nur die Formel wieder.

      '
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/Z2500000230
  - datum: 2026-08-25
    was_gilt: 'Fassung nach dem Änderungsgesetz Nr. 326-VIII vom 24.06.2026 (Art. 1, 13, 17, 20, 28).
      Das Änderungsgesetz tritt seinerseits 60 Kalendertage nach seiner Erstveröffentlichung in Kraft;
      adilet.zan.kz führt als „Дата изменения акта" den 25.08.2026.

      '
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/Z2500000230/info
  themenachsen:
