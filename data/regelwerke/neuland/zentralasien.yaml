- id: uz-pp358
  jurisdiktion: uz
  kurztitel: KI-Strategie bis 2030 (ПҚ-358 / ПП-358)
  offizieller_titel: 'Ўзбекистон Республикаси Президентининг Қарори „Сунъий интеллект технологияларини
    2030 йилга қадар ривожлантириш стратегиясини тасдиқлаш тўғрисида" / Постановление Президента Республики
    Узбекистан „Об утверждении Стратегии развития технологий искусственного интеллекта до 2030 года"

    '
  fundstelle: 'Ўзбекистон Республикаси Президентининг 2024 йил 14 октябрдаги ПҚ-358-сон Қарори / Постановление
    Президента Республики Узбекистан от 14 октября 2024 года № ПП-358. Inkrafttreten 17.10.2024.

    '
  verfahrensnummer: ПҚ-358 / ПП-358
  status: softlaw
  status_detail: 'In Kraft seit dem 17.10.2024. Mehrfach geändert: durch Указ Президента № УП-189 vom
    22.10.2025 (veröffentlicht 27.10.2025, Nr. 06/25/189/0978) und durch Указ Президента № УП-141 vom
    24.07.2026. Bis zum Erlass von ЎРҚ-1115 im Januar 2026 war dieser Präsidialbeschluss der GESAMTE KI-Regelungsbestand
    Usbekistans.

    '
  kurzbeschreibung: 'Die usbekische KI-Strategie bis 2030 mit drei Anlagen: der Strategie selbst, einem
    Maßnahmenplan 2024–2026 und einer Liste der in Wirtschaft und Sozialbereich zu bildenden „Big Data".
    Zielgrößen bis 2030: 1,5 Mrd. USD Umsatz mit KI-gestützten Produkten und Dienstleistungen; 10 % der
    Leistungen des Einheitlichen Portals interaktiver staatlicher Dienste auf KI-Basis; 20 KI-Forschungslabore
    samt Hochleistungsrechnern; Aufnahme in die Top 50 des Government AI Readiness Index. Rechtlich wichtig
    ist Ziff. 1 Buchst. b erster Spiegelstrich: „формирование нормативно-правовой базы, направленной на
    развитие технологий искусственного интеллекта" — die Bildung des Rechtsrahmens ist als vorrangige
    Aufgabe formuliert; ЎРҚ-1115 ist deren Erfüllung.

    '
  inkrafttreten:
    datum: 2024-10-17
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7158606
  anwendungsdaten:
  - datum: 2025-05-01
    was_gilt: 'Ziff. 5: Ministerien und Behörden mussten dem Ministerium für digitale Technologien die
      Angaben nach Anlage Nr. 3 unter Beachtung des Datenschutzrechts (auch anonymisiert) zur Bildung
      der Big-Data-Basis übermitteln.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7158606
  - datum: 2025-09-01
    was_gilt: 'Ziff. 5: Das Ministerium für digitale Technologien musste die Big-Data-Basis unter Einhaltung
      aller Informationssicherheitsmaßnahmen errichten.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/7158606
  - datum: 2026-05-01
    was_gilt: 'Ziff. 5: Das Ministerium für digitale Technologien musste die für KI-Projekte bestimmten
      Rechenkapazitäten in Betrieb nehmen.

      '
