- id: kz-verfassung-2026
  jurisdiktion: kz
  kurztitel: Verfassung Kasachstans 2026 (Art. 21)
  offizieller_titel: 'Қазақстан Республикасының Конституциясы / Конституция Республики Казахстан — Verfassung
    der Republik Kasachstan, angenommen im republikanischen Referendum vom 15. März 2026

    '
  fundstelle: 'Конституция принята на республиканском референдуме 15 марта 2026 года. Sie hat die Verfassung
    vom 30.08.1995 mit Wirkung vom 01.07.2026 abgelöst (adilet.zan.kz führt die Verfassung von 1995 als
    „Утративший силу — Прекратила действие с 01.07.2026").

    '
  status: anwendbar
  status_detail: 'Geltendes Verfassungsrecht seit dem 01.07.2026. Für das KI-Recht ist Art. 21 Abs. 1
    einschlägig, der den Schutz personenbezogener Daten AUSDRÜCKLICH und AUSDRÜCKLICH AUCH GEGEN DEN EINSATZ
    DIGITALER TECHNOLOGIEN in Verfassungsrang hebt.

    '
  kurzbeschreibung: 'Die neue kasachische Verfassung enthält in Art. 21 Abs. 1 ein ausdrückliches Grundrecht
    auf Schutz personenbezogener Daten vor rechtswidriger Erhebung, Verarbeitung, Speicherung und Nutzung,
    „einschließlich unter Anwendung digitaler Technologien". Art. 21 Abs. 2 erstreckt denselben Zusatz
    auf das Bank-, Post- und Fernmeldegeheimnis. Damit hat Kasachstan die datenschutzrechtliche Grundlage
    des KI-Rechts auf Verfassungsebene verankert — anders als die Verfassung von 1995, die in Art. 18
    nur allgemein die Unantastbarkeit des Privatlebens schützte. Für die Auslegung des Verbotskatalogs
    des Art. 17 Abs. 3 KI-Gesetz und des Art. 19-1 Datenschutzgesetz ist das die maßgebliche Auslegungsleitlinie.

    '
  inkrafttreten:
    datum: 2026-07-01
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/K2600000000
  themenachsen:
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 21 Abs. 1: „Право на неприкосновенность частной жизни, личную и семейную тайну, ЗАЩИТУ ПЕРСОНАЛЬНЫХ
    ДАННЫХ от их незаконного сбора, обработки, хранения и использования, В ТОМ ЧИСЛЕ С ПРИМЕНЕНИЕМ ЦИФРОВЫХ
    ТЕХНОЛОГИЙ, гарантируется законом."

    '
  - 'Art. 21 Abs. 2: Das Geheimnis von Bankgeschäften, Einlagen, Korrespondenz, Telefongesprächen sowie
    Post- und sonstigen über Kommunikationsmittel übertragenen Mitteilungen, „einschließlich unter Anwendung
    digitaler Technologien", ist gesetzlich geschützt; Einschränkungen nur in den gesetzlich bestimmten
    Fällen und Verfahren.

    '
  - 'Art. 21 Abs. 3: Staatliche Organe, gesellschaftliche Vereinigungen, Amtsträger und Massenmedien müssen
    jedem die Möglichkeit geben, die ihn in seinen Rechten und Interessen berührenden Dokumente und Entscheidungen
    einzusehen. Das ist die verfassungsrechtliche Wurzel des Auskunftsanspruchs, auf dem Art. 43 Abs.
    4 Ziff. 2 Digitalkodex und Art. 16 Abs. 1 Ziff. 4 und 5 KI-Gesetz aufbauen.

    '
  dokumente:
  - datum: 2026-03-15
    typ: endfassung
    titel: Конституция Республики Казахстан (Referendum vom 15.03.2026)
    url: https://adilet.zan.kz/rus/docs/K2600000000
    sprache: ru
    urheber: Republikanisches Referendum / ИПС „Әділет"
    verifiziert: true
    notiz: 'Amtlicher Text der geltenden Verfassung. Wichtig für die Verdrahtung: Alle kasachischen KI-Regelwerke
      dieser Datei sind VOR dem 01.07.2026 erlassen worden und stehen damit unter einer Verfassung, die
      es bei ihrem Erlass noch nicht gab.

      '
  offene_punkte:
  - 'Ob und wie sich der Verfassungswechsel auf die Auslegung des KI-Gesetzes auswirkt, ist noch nicht
    Gegenstand veröffentlichter Rechtsprechung. Zu beobachten ist insbesondere, ob das Verfassungsgericht
    Art. 21 Abs. 1 als Prüfungsmaßstab für biometrische Systeme heranzieht (vgl. Art. 7 Abs. 12 Datenschutzgesetz).

    '
  - 'Der Verfassungstext wurde nur nach den Stichworten „цифров", „персональн" und „искусственн" durchsucht;
    eine vollständige Auswertung auf KI-relevante Gewährleistungen steht aus.

    '
