    до 2029 года" — Erlass des Präsidenten über die Billigung der gesamtnationalen Strategie der umfassenden
    Digitalisierung und der totalen Einführung von KI-Technologien „Digital Qazaqstan" bis 2029

    '
  fundstelle: Указ Президента Республики Казахстан от 9 июня 2026 года № 1311
