- id: kz-digitalkodex
  jurisdiktion: kz
  kurztitel: Digitalkodex Kasachstan (Nr. 255-VIII)
  offizieller_titel: 'Қазақстан Республикасының Цифрлық кодексі / ЦИФРОВОЙ КОДЕКС РЕСПУБЛИКИ КАЗАХСТАН
    — Digitalkodex der Republik Kasachstan

    '
  fundstelle: 'Кодекс Республики Казахстан от 9 января 2026 года № 255-VIII. Erstveröffentlichung: газета
    „Егемен Қазақстан" № 5-6 (31237) vom 10.01.2026; газета „Казахстанская правда" № 5-6 (30634-30635)
    vom 10.01.2026; Эталонный контрольный банк НПА РК в электронном виде vom 12.01.2026. Registriernummer
    im Staatsregister: 221101.

    '
  verfahrensnummer: 255-VIII
  status: anwendbar
  status_detail: 'In Kraft. Art. 106 Abs. 1: Der Kodex tritt nach Ablauf von SECHS MONATEN nach dem Tag
    der Erstveröffentlichung in Kraft; aus der Veröffentlichung vom 10.01.2026 folgt Mitte Juli 2026.
    Bereits geändert durch Gesetz Nr. 352-VIII vom 23.07.2026 (adilet.zan.kz führt als „Дата изменения
    акта" den 23.07.2026). Damit hat Kasachstan das gesamte Digitalrecht binnen 14 Monaten dreimal neu
    geordnet: KI-Gesetz November 2025, Digitalkodex Januar 2026, erste Kodexnovelle Juli 2026.

    '
  kurzbeschreibung: 'Sechs Abschnitte, 19 Kapitel, 106 Artikel. Der Kodex ist der Rahmen, in den das KI-Gesetz
    eingebettet ist: Er definiert das „digitale Objekt", die „digitalen Daten", die Subjekte der digitalen
    Umgebung und deren Grundrechte. Für das KI-Recht sind drei Vorschriften entscheidend: Art. 43 (Rechte
    gegenüber algorithmischen Systemen und vollautomatisierten Entscheidungen), Art. 41 (Recht auf Löschung,
    Anonymisierung und Verarbeitungsbeschränkung) und Art. 100 (Qualitätsaudit von KI-Systemen). Er hat
    zugleich das Informatisierungsgesetz weitgehend entkernt; dessen Rest wurde zum Cybersicherheitsgesetz
    umbenannt.

    '
  inkrafttreten:
    datum: 2026-07-10
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/K2600000255
  anwendungsdaten:
  - datum: 2026-07-10
    was_gilt: 'Gesamter Kodex nach Art. 106 Abs. 1 (sechs Monate nach der Erstveröffentlichung vom 10.01.2026).
      Der amtliche Text nennt wie beim KI-Gesetz nur die Formel, kein Kalenderdatum; je nach Zählweise
      10. oder 11.07.2026.

      '
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/K2600000255
  - datum: 2026-07-23
