- id: kz-appk
  jurisdiktion: kz
  kurztitel: Verwaltungsverfahrenskodex (АППК, Nr. 350-VI)
  offizieller_titel: 'Қазақстан Республикасының Әкімшілік рәсімдік-процестік кодексі / АДМИНИСТРАТИВНЫЙ
    ПРОЦЕДУРНО-ПРОЦЕССУАЛЬНЫЙ КОДЕКС РЕСПУБЛИКИ КАЗАХСТАН — Verwaltungsverfahrens- und Verwaltungsprozesskodex
    der Republik Kasachstan

    '
  fundstelle: Кодекс Республики Казахстан от 29 июня 2020 года № 350-VI
  verfahrensnummer: 350-VI
  status: anwendbar
  status_detail: 'In Kraft. Für das KI-Recht einschlägig sind zwei Vorschriften: Art. 73 Abs. 2 Ziff.
    7 (Entfallen der Anhörung bei automatisiertem Verfahren ohne Ermessen) und Art. 24 Abs. 7 (automatisierte
    Spruchkörperbildung).

    '
  kurzbeschreibung: 'Der АППК regelt das kasachische Verwaltungsverfahren und den Verwaltungsprozess.
    Er enthält die einzige positivrechtliche Regelung des vollautomatisierten Verwaltungsakts in Kasachstan:
    Nach Art. 73 Abs. 2 Ziff. 7 entfällt die sonst zwingende Anhörung des Verfahrensbeteiligten, WENN
    die Entscheidung im Rahmen eines automatisierten Prozesses ergeht UND die Behörde oder der Amtsträger
    kein Verwaltungsermessen hat. Das entspricht in der Konstruktion § 24 Abs. 1 Satz 3 VwVfG und § 28
    Abs. 2 Nr. 4 VwVfG, verzichtet aber auf jede Beschränkung auf gebundene Entscheidungen im Massenverfahren.

    '
  inkrafttreten:
    datum: 2021-07-01
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/K2000000350
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Art. 73 Abs. 2 Ziff. 7: Die Pflicht, dem Beteiligten spätestens drei Arbeitstage vor Erlass des Verwaltungsakts
    Gelegenheit zur Stellungnahme zur vorläufigen Entscheidung zu geben (Abs. 1), entfällt, wenn „решение
    по административному делу принимается при осуществлении автоматизированного процесса, при этом административный
    орган, должностное лицо не наделены административным усмотрением". Die Vorschrift knüpft an das FEHLENDE
    ERMESSEN an, nicht an die Belastungswirkung — anders als Art. 19-1 Abs. 1 Datenschutzgesetz, das jede
    rechtsgestaltende automatisierte Verarbeitung verbietet. Beide Normen sind nebeneinander anwendbar
    und laufen inhaltlich auseinander.

    '
  - 'Art. 73 Abs. 1 Ziff. 2: Die Anhörung selbst darf „durch Nutzung digitaler Systeme" (использование
    цифровых систем) durchgeführt werden — die Digitalisierung des Anhörungsverfahrens ist damit ausdrücklich
    zugelassen.

    '
  - 'Art. 24 Abs. 7: Der Spruchkörper für eine Verwaltungssache wird unter Berücksichtigung von Belastung
    und Spezialisierung der Richter in einem Verfahren gebildet, das die Einflussnahme interessierter
    Personen ausschließt, „в том числе с использованием автоматизированной цифровой системы" — auch unter
    Einsatz eines automatisierten digitalen Systems. Das ist die gesetzliche Grundlage der algorithmischen
    Geschäftsverteilung an kasachischen Verwaltungsgerichten.

    '
  dokumente:
  - datum: 2020-06-29
    typ: konsolidiert
    titel: 'Административный процедурно-процессуальный кодекс Республики Казахстан от 29 июня 2020 года
      № 350-VI (konsolidierte Fassung)

      '
    url: https://adilet.zan.kz/rus/docs/K2000000350
    sprache: ru
    urheber: ИПС „Әділет"
    verifiziert: true
    notiz: 'Enthält Art. 73 Abs. 2 Ziff. 7 und Art. 24 Abs. 7 im geltenden Wortlaut.

      '
  offene_punkte:
  - 'Der АППК ist nicht an das KI-Gesetz oder den Digitalkodex angepasst worden. Insbesondere fehlt eine
    Verzahnung des Art. 73 Abs. 2 Ziff. 7 mit dem Anspruch auf Überprüfung durch einen Menschen nach Art.
    43 Abs. 4 Ziff. 3 Digitalkodex. Nach dem Wortlaut kann ein automatisierter Verwaltungsakt ohne Anhörung
    ergehen, gegen den anschließend ein Überprüfungsanspruch nach dem Digitalkodex besteht — das Verhältnis
    der beiden Verfahren ist offen.

    '
  - 'Das Datum des Inkrafttretens (üblicherweise 01.07.2021) wurde nicht am Kodextext verifiziert.

    '
