    verifiziert: true
    notiz: 'Belegt Erstveröffentlichung (18.11.2025 in beiden Amtsblättern), Registriernummer 217048 und
      das Datum der letzten Änderung (25.08.2026). Ohne diese Karte lässt sich das Inkrafttreten nicht
      berechnen, weil das Gesetz selbst nur die 60-Tage-Formel enthält.

      '
  offene_punkte:
  - 'Der exakte Kalendertag des Inkrafttretens ist am amtlichen Text NICHT belegbar: Art. 31 nennt nur
    die Formel („60 Kalendertage nach dem Tag der Erstveröffentlichung"), adilet.zan.kz rechnet sie nicht
    aus. Aus der Erstveröffentlichung vom 18.11.2025 folgt der 17. oder 18.01.2026, je nachdem, ob man
    den Ablauf des 60. Tages oder den Folgetag nimmt. Deshalb `verifiziert: false`. Zu prüfen wäre eine
    Verlautbarung des Justizministeriums oder des Ministeriums für künstliche Intelligenz und digitale
    Entwicklung.

    '
  - 'Welche Behörde konkret „уполномоченный орган в сфере искусственного интеллекта" ist, sagt das Gesetz
    nicht (Art. 1 Ziff. 10 definiert nur abstrakt „zentrales Vollzugsorgan"). Aus der Anordnung des Premierministers
    Nr. 2-р vom 14.01.2026 ergibt sich zwingend das Министерство искусственного интеллекта и цифрового
    развития (Ministerium für künstliche Intelligenz und digitale Entwicklung), das dort für 22 von 23
    Rechtsakten zuständig ist. Ein Rechtsakt, der die Behörde ausdrücklich benennt, war nicht auffindbar.

    '
  - 'Ob die 23 untergesetzlichen Rechtsakte nach der Anordnung Nr. 2-р tatsächlich im Januar 2026 ergangen
    sind, konnte nicht geprüft werden — die Anordnung verlangt eine monatliche Veröffentlichung des Umsetzungsstands,
    die aber auf einem „общедоступный государственный объект информатизации" (egov.kz) liegt, das nicht
    erreichbar war.

    '
  - 'Der Inhalt der Änderungen durch Gesetz Nr. 326-VIII vom 24.06.2026 an Art. 1, 13, 17, 20 und 28 des
    KI-Gesetzes ist in dieser Datei nur als Existenz vermerkt, nicht im Einzelnen ausgewertet.

    '
