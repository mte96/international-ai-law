- id: kz-datenschutzgesetz
  jurisdiktion: kz
  kurztitel: Datenschutzgesetz Kasachstan (Nr. 94-V)
  offizieller_titel: 'Қазақстан Республикасының Заңы „Дербес деректер және оларды қорғау туралы" / Закон
    Республики Казахстан „О персональных данных и их защите" — Gesetz der Republik Kasachstan „Über personenbezogene
    Daten und deren Schutz"

    '
  fundstelle: Закон Республики Казахстан от 21 мая 2013 года № 94-V
  verfahrensnummer: 94-V
  status: anwendbar
  status_detail: 'In Kraft, mehrfach geändert. Für das KI-Recht maßgeblich sind die Änderungen durch das
    KI-Begleitgesetz Nr. 231-VIII vom 17.11.2025 (Art. 1 Ziff. 2-3, Art. 7 Abs. 11 und 12, Art. 8 Abs.
    5-7, Art. 17 Abs. 3, Art. 19-1) sowie die für 2026 vorgesehenen Änderungen durch Gesetz Nr. 256-VIII
    vom 09.01.2026 und Gesetz Nr. 326-VIII vom 24.06.2026 (letzteres ändert Art. 7 Abs. 11 — das Scraping-Verbot
    — erneut).

    '
  kurzbeschreibung: 'Das Gesetz, an dem die meisten kasachischen KI-Fälle tatsächlich entschieden werden.
    Es kennt seit November 2025 einen eigenen Abschnitt über automatisierte Verarbeitung (Art. 19-1),
    ein Verbot der zweckwidrigen Datenextraktion aus öffentlich zugänglichen Quellen zum Aufbau von Datenbanken
    (Art. 7 Abs. 11), eine Beschränkung biometrischer Erfassung im öffentlichen Raum (Art. 7 Abs. 12)
    und einen Anonymisierungsauftrag zugunsten der nationalen KI-Plattform (Art. 17 Abs. 3). Sanktioniert
    wird über Art. 79 КоАП mit Bußgeldern bis 2 000 МРП — dem ZEHNFACHEN des KI-Bußgeldrahmens des Art.
    641-1 КоАП. Wer in Kasachstan gegen KI-Recht verstößt, wird deshalb regelmäßig über das Datenschutzrecht
    schärfer belangt als über das KI-Recht.

    '
  inkrafttreten:
    datum: 2013-05-21
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/Z1300000094
  anwendungsdaten:
  - datum: 2026-01-17
    was_gilt: 'Art. 19-1 (Anforderungen an automatisierte Verarbeitung), Art. 7 Abs. 11 und 12, Art. 8
      Abs. 5-7, Art. 17 Abs. 3 — eingefügt durch Gesetz Nr. 231-VIII, in Kraft 60 Kalendertage nach der
      Erstveröffentlichung vom 18.11.2025.

      '
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/Z1300000094
  themenachsen:
  - datenschutz
  - grundrechte
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'Art. 1 Ziff. 2-3: „автоматизированная обработка персональных данных" — Verarbeitung durch ein Informatisierungsobjekt
    UNTER AUSSCHLUSS der Beteiligung des Eigentümers, Betreibers oder Dritten am Verarbeitungsvorgang.
    Der kasachische Begriff stellt auf die Abwesenheit menschlicher Beteiligung AM VORGANG ab, nicht wie
    Art. 22 DSGVO auf die Ausschließlichkeit der Entscheidungsgrundlage.

    '
  - 'Art. 7 Abs. 11: Verbot der Erhebung und Verarbeitung personenbezogener Daten zum Aufbau oder zur
    Erweiterung von Datenbanken mittels zweckwidriger Extraktion aus öffentlich zugänglichen Quellen.
    Die praktisch bedeutsamste Vorschrift für das Training von Modellen mit Webdaten.

    '
  - 'Art. 7 Abs. 12: Einsatz technischer Mittel zur biometrischen Erfassung und Identifizierung AN ÖFFENTLICHEN
    ORTEN nur zum Schutz der Verfassungsordnung, der öffentlichen Ordnung, der Rechte und Freiheiten,
    der Gesundheit und Sittlichkeit — oder mit Einwilligung.

    '
  - 'Art. 8 Abs. 5 bis 7: Höchstdauer der Einwilligung, Auslegung bei fehlender Fristangabe, WIDERRUFSRECHT
    mit Fünfzehn-Arbeitstage- Frist zur Einstellung der Verarbeitung oder begründeten Ablehnung.

    '
  - 'Art. 19-1 Abs. 1: Verbot der automatisierten Verarbeitung, in deren Ergebnis Rechte oder berechtigte
    Interessen entstehen, sich ändern oder erlöschen — außer bei Einwilligung oder gesetzlicher Erlaubnis.
    Abs. 2: Aufklärungs- und Widerspruchsrecht. Abs. 3: Bescheidung binnen DREI ARBEITSTAGEN, Rechtsbehelf.

    '
  - 'Art. 17 Abs. 3: Anonymisierung für die nationale KI-Plattform durch den Plattformbetreiber nach den
    Datenverwaltungs- anforderungen der Regierung (ПП РК № 925 vom 07.11.2024).

    '
  - 'Sanktion: Art. 79 КоАП. Abs. 1 rechtswidrige Erhebung und Verarbeitung: 30/60/100/200 МРП. Abs. 2
    unter Ausnutzung der Dienststellung: 100/200/300/600 МРП. Abs. 3 Nichtbeachtung der Schutzmaßnahmen:
    150/300/450/600 МРП. Abs. 4 daraus folgender Verlust oder rechtswidrige Verarbeitung: 200/750/1000/2000
    МРП.

    '
  dokumente:
  - datum: 2013-05-21
    typ: konsolidiert
    titel: 'Закон Республики Казахстан от 21 мая 2013 года № 94-V „О персональных данных и их защите"
      (konsolidierte Fassung)

      '
    url: https://adilet.zan.kz/rus/docs/Z1300000094
    sprache: ru
    urheber: ИПС „Әділет"
    verifiziert: true
    notiz: 'Enthält Art. 19-1 und Art. 7 Abs. 11 und 12 im geltenden Wortlaut mit Änderungsfußnoten.

      '
  - datum: 2024-11-07
    typ: delegiert
    titel: 'Постановление Правительства Республики Казахстан от 7 ноября 2024 года № 925 „Об утверждении
      требований по управлению данными"

      '
    url: https://adilet.zan.kz/rus/docs/P2400000925
    sprache: ru
    urheber: Regierung der Republik Kasachstan
    verifiziert: true
    notiz: 'Die „Anforderungen an die Datenverwaltung", auf die das KI-Gesetz (Art. 13 Abs. 2, Art. 14
      Ziff. 4, Art. 27 Abs. 4) und das Datenschutzgesetz (Art. 17 Abs. 3) durchgehend verweisen. Nach
      der Anordnung Nr. 2-р (Ziff. 3) war eine KI-Anpassung dieser Anforderungen für Januar 2026 vorgesehen.

      '
  offene_punkte:
  - 'Der Inhalt der Änderung des Art. 7 Abs. 11 durch Gesetz Nr. 326-VIII vom 24.06.2026 wurde nicht ausgewertet;
    adilet vermerkt sie nur als Ankündigung („предусматривается изменение").

    '
  - 'Ob die Datenverwaltungsanforderungen (ПП № 925) tatsächlich um KI-Vorgaben ergänzt wurden, ist nicht
    geprüft.

    '
