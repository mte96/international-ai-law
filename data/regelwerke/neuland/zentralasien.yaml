- id: uz-ki-omnibus-1115
  jurisdiktion: uz
  kurztitel: KI-Omnibusnovelle Usbekistan (ЎРҚ-1115)
  offizieller_titel: 'Ўзбекистон Республикасининг Қонуни „Сунъий интеллектни қўллаш орқали юзага келадиган
    муносабатлар тартибга солиниши муносабати билан Ўзбекистон Республикасининг айрим қонун ҳужжатларига
    қўшимча ва ўзгартиришлар киритиш тўғрисида" — Gesetz der Republik Usbekistan „Über die Einführung
    von Ergänzungen und Änderungen in einzelne Gesetzgebungsakte der Republik Usbekistan im Zusammenhang
    mit der Regelung der durch die Anwendung künstlicher Intelligenz entstehenden Verhältnisse"

    '
  fundstelle: 'Ўзбекистон Республикасининг 2026 йил 21 январдаги ЎРҚ-1115-сон Қонуни / Закон Республики
    Узбекистан от 21 января 2026 года № ЗРУ-1115. Amtliche Veröffentlichung: Қонунчилик маълумотлари миллий
    базаси (Nationale Gesetzgebungsdatenbank), 21.01.2026, Nr. 03/26/1115/0063. Angenommen von der Gesetzgebungskammer
    am 12.08.2025, gebilligt vom Senat am 01.11.2025, unterzeichnet von Präsident Sh. Mirziyoyev in Taschkent
    am 21.01.2026.

    '
  verfahrensnummer: ЎРҚ-1115 / ЗРУ-1115
  status: anwendbar
  status_detail: 'In Kraft seit dem 21.01.2026. Art. 4: „Ушбу Қонун расмий эълон қилинган кундан эътиборан
    кучга киради" — das Gesetz tritt mit dem Tag der amtlichen Veröffentlichung in Kraft; Veröffentlichung
    und Inkrafttreten fallen also auf denselben Tag. Zwischen der Annahme durch die Gesetzgebungskammer
    (12.08.2025) und der Unterzeichnung (21.01.2026) liegen mehr als fünf Monate.

    '
  kurzbeschreibung: 'Usbekistan hat KEIN eigenständiges KI-Gesetz. Diese Novelle ist der gesamte gesetzesrangige
    KI-Regelungsbestand des Landes. Sie ändert genau ZWEI Rechtsakte: das Informatisierungsgesetz Nr.
    560-II von 2003 (Legaldefinition der KI, staatspolitische Zielbestimmung, Behördenzuständigkeiten,
    ein neuer Art. 7-1 über den KI-Einsatz bei Informationsressourcen und Informationssystemen, eine Ergänzung
    des Verbotskatalogs für Webseitenbetreiber in Art. 12-1) und den Ordnungswidrigkeitenkodex (neuer
    Abs. 2 des Art. 46-2 mit einem Bußgeldtatbestand für die rechtswidrige KI-gestützte Verarbeitung personenbezogener
    Daten). Die Präambel benennt die drei Regelungszwecke ausdrücklich: eine Legaldefinition der KI auf
    Gesetzesebene, allgemeine Regeln für den KI-Einsatz, und Verwaltungssanktionen für rechtswidrige KI-gestützte
    Datenverarbeitung.

    '
  inkrafttreten:
    datum: 2026-01-21
    verifiziert: true
    quelle: https://lex.uz/ru/docs/8008401
  themenachsen:
  - governance
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  - content
  regelungsschwerpunkte:
  - 'Art. 1 Ziff. 1 — Informatisierungsgesetz Art. 3, neuer neunter Absatz, Legaldefinition: „сунъий интеллект
    — инсоннинг билим ва кўникмаларига тақлид қилиш, шу жумладан мустақил равишда ўрганиш ва ечимларни
    излаш ҳамда аниқ вазифаларни бажаришда инсон ақлий фаолияти натижалари билан таққосланадиган натижаларни
    олиш имконини берадиган технологик ечимлар мажмуи" — künstliche Intelligenz ist eine Gesamtheit technologischer
    Lösungen, die es erlaubt, Wissen und Fertigkeiten des Menschen nachzuahmen, einschließlich selbständigen
    Lernens und der Suche nach Lösungen, und bei der Erfüllung konkreter Aufgaben Ergebnisse zu erzielen,
    die mit den Ergebnissen menschlicher geistiger Tätigkeit vergleichbar sind. Die Definition ist erkennbar
    an der russischen Legaldefinition (Ukas Nr. 490/2019) orientiert, nicht an der OECD- oder KI-VO-Definition,
    und verzichtet auf jedes Autonomie- oder Risikomerkmal.

    '
  - 'Art. 1 Ziff. 4 — NEUER ART. 7-1 Informatisierungsgesetz („Ахборот ресурсларини яратишда хамда ахборот
    тизимлари ишида сунъий интеллектдан фойдаланиш" — Nutzung künstlicher Intelligenz bei der Schaffung
    von Informationsressourcen und im Betrieb von Informationssystemen). Abs. 1: Mit KI geschaffene Informationsressourcen
    und auf KI-Technologien beruhende Informationssysteme DÜRFEN dem Menschen, seinem Leben, seiner Gesundheit,
    Freiheit, Ehre und Würde KEINEN SCHADEN ZUFÜGEN und seine sonstigen unveräußerlichen Rechte nicht
    verletzen. Abs. 2: „Инсоннинг ҳуқуқи ва эркинлигига алоқадор бўлган юридик аҳамиятга эга қарорларни
    қабул қилиш чоғида фақат сунъий интеллектдан фойдаланган ҳолда яратилган ахборот ресурслари ва сунъий
    интеллект технологиялари асосида ишлайдиган ахборот тизимларининг хулосаларига таяниш мумкин эмас"
    — bei der Fassung RECHTLICH BEDEUTSAMER ENTSCHEIDUNGEN, die die Rechte und Freiheiten des Menschen
    berühren, darf man sich NICHT AUSSCHLIESSLICH auf die Schlussfolgerungen KI-gestützter Informationsressourcen
    und -systeme stützen. Das ist die usbekische Kernvorschrift zum vollautomatisierten Entscheiden. Sie
    gilt allgemein, nicht nur für Behörden, und knüpft — anders als Art. 22 DSGVO — nicht an personenbezogene
    Daten an, sondern an die Rechtserheblichkeit der Entscheidung.

    '
  - 'Art. 1 Ziff. 5 — Informatisierungsgesetz Art. 12-1 Abs. 1, neuer achter Absatz: Webseitenbetreiber
    und BLOGGER dürfen ihre Ressourcen nicht zur „незаконная обработка персональных данных с использованием
    технологий искусственного интеллекта, их распространение в средствах массовой информации, сетях телекоммуникаций
    или всемирной информационной сети Интернет" nutzen — rechtswidrige KI-gestützte Verarbeitung personenbezogener
    Daten und deren Verbreitung. Damit steht das Verbot in demselben Katalog wie Aufrufe zum Umsturz,
    Extremismuspropaganda und Falschnachrichtenverbreitung; es unterliegt derselben Sperrsystematik.

    '
  - 'Art. 1 Ziff. 2 und 3 — Informatisierungsgesetz Art. 4 Abs. 2 (staatspolitische Zielbestimmung: Schaffung
    der notwendigen Bedingungen für Einführung und Entwicklung der KI sowie Bestimmung der rechtlichen,
    technologischen und wirtschaftlichen Grundlagen) und Art. 6 (drei neue Zuständigkeiten der Fachbehörde:
    Bedingungen für Investitionen in die KI-Richtung schaffen; technische Infrastruktur für die KI-gestützte
    Verarbeitung der Daten staatlicher Organe bilden; aus-, Fort- und Weiterbildung von KI-Fachkräften
    organisieren).

    '
  - 'Art. 2 — Ordnungswidrigkeitenkodex Art. 46-2 („Verstoß gegen das Recht über personenbezogene Daten"),
    NEUER ABS. 2: rechtswidrige Verarbeitung personenbezogener Daten unter Nutzung von KI-Technologien
    sowie deren Verbreitung in Massenmedien, Telekommunikationsnetzen oder im Internet — Geldbuße von
    50 bis 100 БРВ (базавий ҳисоблаш миқдори / Basisrechengröße) MIT EINZIEHUNG der Tatwerkzeuge. Zum
    Vergleich: Abs. 1 (allgemeine rechtswidrige Datenverarbeitung) sieht nur 7 БРВ für Bürger und 50 БРВ
    für Amtsträger vor. Der KI-Zuschlag ist damit ein Vielfaches des Grundtatbestands — Usbekistan behandelt
    den KI-Einsatz als qualifizierenden Umstand.

    '
  - 'Art. 3: Das Ministerkabinett hat die Regierungsbeschlüsse an das Gesetz anzupassen, die republikanischen
    Vollzugsorgane müssen ihre entgegenstehenden Rechtsakte überprüfen und aufheben, und die Bedeutung
    des Gesetzes ist der Bevölkerung zu erläutern. Eine Frist nennt das Gesetz NICHT.

    '
  dokumente:
  - datum: 2026-01-21
    typ: endfassung
    titel: 'ЎРҚ-1115-сон 21.01.2026 — usbekische Fassung (kyrillisch), amtlicher Text

      '
    url: https://lex.uz/ru/docs/8008401
    sprache: uz
    urheber: 'Oliy Majlis der Republik Usbekistan / Национальная база данных законодательства (lex.uz)

      '
    verifiziert: true
    notiz: 'DIE MASSGEBLICHE FASSUNG. lex.uz weist bei allen durch dieses Gesetz eingefügten Vorschriften
      ausdrücklich darauf hin, dass die russische Fassung ein „Неофициальный перевод" (unamtliche Übersetzung)
      ist und der amtliche Text auf Usbekisch maßgeblich ist. Das ist ein Unterschied zu Kasachstan, wo
      die russische Fassung gleichermaßen amtlich ist.

      '
  - datum: 2026-01-21
    typ: uebersicht
    titel: 'LRU-1115 — englische Arbeitsübersetzung auf lex.uz (nur Metadaten, kein Volltext)

      '
    url: https://lex.uz/en/docs/8011930
    sprache: en
    urheber: lex.uz
    verifiziert: true
    notiz: 'Die englische Seite enthält KEINEN Artikeltext, sondern nur Titel, Nummer, Datum und den Hinweis
      „The text of the act is given in uzbek and russian". Wer nur diese Seite kennt, kennt den Regelungsinhalt
      nicht — das erklärt, warum das Breitenscreening den Inhalt des Gesetzes nur pauschal beschreiben
      konnte.

      '
  offene_punkte:
  - 'Das Gesetz enthält KEINE Kennzeichnungspflicht für synthetische Inhalte, KEINEN Verbotskatalog, KEINE
    Risikoklassifizierung, KEINE urheberrechtliche Regelung und KEINE Aufsichtsbefugnis. Ob Usbekistan
    ein eigenständiges KI-Gesetz vorbereitet, war nicht feststellbar; regulation.gov.uz (Konsultationsportal)
    ließ sich nicht gezielt durchsuchen.

    '
  - 'Art. 7-1 Abs. 2 Informatisierungsgesetz verbietet, sich AUSSCHLIESSLICH auf KI-Schlussfolgerungen
    zu stützen, sagt aber nicht, welches Maß menschlicher Beteiligung genügt, und knüpft keine Rechtsfolge
    an einen Verstoß. Ein Bußgeldtatbestand besteht nur für die datenschutzrechtliche Variante (Art. 46-2
    Abs. 2 КоАО). Die Vorschrift ist damit weitgehend sanktionslos.

    '
  - 'Die Behörde („ваколатли давлат органи") ist im Informatisierungsgesetz nicht namentlich genannt;
    aus PP-358 und УП-189 ergibt sich das Министерство цифровых технологий (Ministerium für digitale Technologien)
    mit dem ihm unterstehenden Центр развития искусственного интеллекта и цифровой экономики.

    '
