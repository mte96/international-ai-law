- id: uz-justiz-2030
  jurisdiktion: uz
  kurztitel: Justizstrategie „Правосудие-2030" (УП-160)
  offizieller_titel: 'Указ Президента Республики Узбекистан „О Стратегии «Правосудие-2030»: построение
    в Новом Узбекистане народной и справедливой судебной системы, надежно защищающей права человека" —
    Erlass des Präsidenten über die Strategie „Justiz-2030"

    '
  fundstelle: 'Указ Президента Республики Узбекистан от 14 августа 2026 года № УП-160

    '
  verfahrensnummer: УП-160
  status: softlaw
  status_detail: 'In Kraft (August 2026). Enthält die bislang einzige ausdrückliche Regelung des KI-Einsatzes
    in der usbekischen Justiz.

    '
  kurzbeschreibung: 'Sechs Prioritäten für die Justizreform bis 2030. Für das KI-Recht ist Priorität V
    („Внедрение современных технологий") einschlägig: Ziff. 5.1 Abkehr von der Papierform im Gerichtsverfahren
    („Цифровой суд"), Ziff. 5.2 Ausbau des Zugangs zum Recht durch Digitalisierung, und Ziff. 5.3 die
    Kernvorschrift: „Обеспечение безопасного, ответственного и целевого использования технологий искусственного
    интеллекта С СОХРАНЕНИЕМ ИСКЛЮЧИТЕЛЬНЫХ ПОЛНОМОЧИЙ СУДЬИ ПО ОСУЩЕСТВЛЕНИЮ ПРАВОСУДИЯ" — sichere, verantwortliche
    und zweckgebundene KI-Nutzung UNTER WAHRUNG DER AUSSCHLIESSLICHEN BEFUGNIS DES RICHTERS ZUR RECHTSPRECHUNG.
    Die Strategie richtet beim Obersten Gericht zugleich ein „Департамент цифровых технологий и искусственного
    интеллекта" mit 27 Stellen ein.

    '
  inkrafttreten:
    datum: 2026-08-14
    verifiziert: false
    quelle: https://lex.uz/ru/docs/8407362
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  - berufsrecht
  regelungsschwerpunkte:
  - 'Ziff. 5.3: Richtervorbehalt für die Rechtsprechung bei gleichzeitiger Zulassung von KI-Werkzeugen.
    Die Formel („сохранение исключительных полномочий судьи") ist die usbekische Entsprechung zu den Justiz-KI-Leitlinien
    anderer Rechtsordnungen, steht hier aber in einem Präsidialerlass, nicht in einer Selbstregulierung
    der Judikative.

    '
  - 'Zielbild 2030: Die Justiz soll „функционирующей на основе современных цифровых технологий и искусственного
    интеллекта" sein — KI ist als Strukturmerkmal des Zielzustands formuliert, nicht als Risiko.

    '
  - 'Organisation: Beim Obersten Gericht wird ein Departement für digitale Technologien und künstliche
    Intelligenz mit 27 Stellen eingerichtet — eine der größten KI-Organisationseinheiten einer obersten
    Gerichtsbarkeit weltweit.

    '
