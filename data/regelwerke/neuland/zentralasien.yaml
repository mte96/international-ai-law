  regelungsschwerpunkte:
  - 'Art. 1: Begriffsbestimmungen. Bemerkenswert der eigenständige Begriff „синтетические результаты деятельности
    систем искусственного интеллекта" (synthetische Ergebnisse der Tätigkeit von KI-Systemen) — Bild,
    Video, Audio, Texte oder Kombinationen, die von einem KI-System erzeugt oder verändert wurden und
    das Aussehen, die Stimme, das Verhalten einer natürlichen Person oder tatsächlich nicht eingetretene
    Ereignisse imitieren. Das ist eine Deepfake-Legaldefinition im Gesetzesrang. Ferner „библиотека данных"
    (Datenbibliothek) und „изготовитель библиотеки данных" (Hersteller der Datenbibliothek) als eigene
    Rechtsfiguren.

    '
  - 'Art. 7 Abs. 2: Wer von einer mit KI getroffenen Entscheidung betroffen ist, hat das Recht, über das
    Verfahren der automatisierten Verarbeitung und deren Folgen informiert zu werden, Widerspruch gegen
    die automatisierte Verarbeitung einzulegen und über den Rechtsschutzweg unterrichtet zu werden.

    '
  - 'Art. 17 Abs. 1: Dreistufige Risikoklassifikation (minimal, mittel, hoch). Die Zuordnung nimmt der
    Eigentümer und/oder Besitzer selbst vor, nach den „Regeln der Klassifizierung digitaler Objekte".
    Hochrisiko-KI, die zugleich als kritisch wichtiges digitales Objekt eingestuft ist oder staatliche
    digitale Ressourcen bilden soll, wird für die Cybersicherheitsanforderungen staatlichen Systemen gleichgestellt.

    '
  - 'Art. 17 Abs. 2: Zusätzliche Klassifikation nach Autonomiegrad. Hochautonome Systeme sind solche,
    bei denen eine Korrektur oder Aufhebung der Entscheidung durch den Menschen vollständig ausgeschlossen
    oder technisch unmöglich ist; ihre Erstellung und ihr Betrieb sind Sondergesetzen vorbehalten. Diese
    Achse (Autonomie neben Risiko) hat kein Vorbild in der KI-VO.

    '
  - 'Art. 17 Abs. 3: Verbotskatalog mit sieben Ziffern — (1) unterschwellige oder manipulative Techniken;
    (2) Ausnutzung moralischer oder körperlicher Verwundbarkeit wegen Alters, Behinderung, sozialer Stellung;
    (3) Bewertung und Klassifikation von Personen nach Sozialverhalten oder vermuteten/prognostizierten
    persönlichen Eigenschaften (Social Scoring), soweit nicht gesetzlich erlaubt; (4) Erhebung und Verarbeitung
    personenbezogener Daten unter Verstoß gegen das Datenschutzrecht; (5) biometrische Kategorisierung
    zur Ableitung von Rasse, politischer Anschauung, Religionszugehörigkeit u.a. zu Diskriminierungszwecken;
    (6) Emotionserkennung ohne Einwilligung der betroffenen Person, soweit nicht gesetzlich erlaubt; (7)
    Erzeugung und Verbreitung gesetzlich verbotener KI-Ergebnisse. Anders als Art. 5 KI-VO gilt der Katalog
    OHNE Ausnahmen für Strafverfolgung und ohne die dortigen Verfahrensgarantien; die Öffnungsklauseln
    stehen in Ziff. 3 und 6 („за исключением случаев, предусмотренных законами").

    '
  - 'Art. 17 Abs. 4: Offene, geschlossene und lokale KI-Systeme. Offene Systeme dürfen zur Verarbeitung
    gesetzlich zugangsbeschränkter Daten nur unter Beachtung des Informatisierungsrechts eingesetzt werden;
    lokale Systeme (ohne Anbindung an öffentliche Telekommunikationsnetze) sind für zugangsbeschränkte
    Daten vorgesehen. Eine solche ausdrückliche Regelung offener Modelle findet sich in kaum einer anderen
    Rechtsordnung.

    '
  - 'Art. 18: Risikomanagement als kontinuierlicher Prozess über den gesamten Lebenszyklus, mit Pflicht
    zur Aktualisierung MINDESTENS EINMAL JÄHRLICH (Abs. 1 Ziff. 4). Bei Anzeichen für das Vorliegen eines
    Verbotstatbestands nach Art. 17 Abs. 3 unverzügliche Maßnahmen bis zur Aussetzung oder vollständigen
    Einstellung des Betriebs (Abs. 2).

    '
  - 'Art. 19: Ressortbehörden führen „Listen vertrauenswürdiger KI-Systeme hoher Risikostufe" (перечни
    доверенных систем искусственного интеллекта высокой степени риска) und veröffentlichen sie fortlaufend
    im Internet. Wer aufgenommen werden will, muss ein Audit durchführen lassen (Abs. 2). Das ist ein
    Positivlisten-Modell: nicht Verbot mit Erlaubnisvorbehalt, sondern staatlich kuratierte Vertrauensliste.

    '
  - 'Art. 20: Audit nach den Regeln über das Audit digitaler Systeme; zusätzlich zu bewerten sind (1)
    Qualität und Rechtmäßigkeit der Nutzung der Trainings-Datenbibliotheken und (2) das Vorliegen verbotener
    Funktionalitäten.

    '
  - 'Art. 21 Abs. 1: Nutzer müssen darüber informiert werden, dass Waren, Arbeiten und Dienstleistungen
    unter Einsatz von KI-Systemen hergestellt oder erbracht werden. Abs. 2: Verbreitung synthetischer
    Ergebnisse nur bei Kennzeichnung in MASCHINENLESBARER FORM und mit visueller oder anderer Warnung,
    die ohne Erschwernisse wahrnehmbar ist. Abs. 3: Verantwortlich sind die Eigentümer oder Besitzer der
    Systeme — nicht die verbreitende Plattform und nicht der Nutzer.

    '
  - 'Art. 22: Maschinenlesbare Formen als eigenes Rechtsinstitut; Verfahren zu Entwicklung, Anwendung
    und Verbreitung bestimmt die zuständige Behörde. Diese Vorschrift trägt sowohl die Kennzeichnungspflicht
    (Art. 21) als auch den urheberrechtlichen Vorbehalt (Art. 23 Abs. 5) und die Herstellerangabe bei
    Datenbibliotheken (Art. 27 Abs. 5).

    '
  - 'Art. 23 — die international bemerkenswerteste Vorschrift des Gesetzes. Abs. 1: Werke, die unter Einsatz
    von KI-Systemen geschaffen wurden, sind urheberrechtlich nur geschützt, wenn ein schöpferischer Beitrag
    eines Menschen vorliegt. Abs. 2: Textprompts an KI-Systeme sind, soweit sie Ergebnis schöpferischer
    geistiger Tätigkeit eines Menschen sind, urheberrechtliche Schutzgegenstände — eine positivrechtliche
    Anerkennung des Prompts als Werk. Abs. 3: Die Nutzung von Werken zum Training von KI-Modellen gehört
    NICHT zu den Fällen der freien Nutzung zu Bildungs- oder Wissenschaftszwecken. Abs. 4: Trainingsnutzung
    gilt nicht als Nutzung in den Formen der Urheberpersönlichkeits- und Verwertungsrechte (Vervielfältigung,
    Verbreitung, Bearbeitung, öffentliche Wiedergabe usw.). Abs. 5: Trainingsnutzung ist nur zulässig,
    solange kein in MASCHINENLESBARER FORM erklärter Vorbehalt des Urhebers oder Rechteinhabers vorliegt.
    Abs. 3 bis 5 zusammengelesen ergeben ein Regime, das im Ausgangspunkt weiter ist als Art. 4 DSM-RL
    (die Trainingsnutzung ist schon begrifflich keine verwertungsrechtliche Nutzung), zugleich aber den
    maschinenlesbaren Opt-out zur ausdrücklichen Zulässigkeitsvoraussetzung macht.

    '
  - 'Art. 24: Ersatz des durch KI-Systeme verursachten Schadens nach dem Zivilgesetzbuch; Haftpflichtversicherung
    nach den Gesetzen. Keine eigene Gefährdungshaftung, keine Beweislastumkehr.

    '
  - 'Art. 25 bis 27: Nationale KI-Plattform als staatlich betriebene kontrollierte Umgebung für Entwicklung,
    Training und Probebetrieb; Zugang zu Rechenressourcen nach Regeln der zuständigen Behörde und nach
    Prioritätssektoren; Datenbibliotheken mit Rechten und Pflichten ihrer Eigentümer, darunter die Pflicht,
    die Angaben zum Hersteller der Datenbibliothek in maschinenlesbarer Form anzugeben und bei jeder Weitergabe
    mitzuführen (Art. 27 Abs. 5) — eine Datenprovenienz-Pflicht.

    '
  - 'Art. 30: „Verstöße gegen das KI-Recht ziehen die durch die Gesetze der Republik Kasachstan bestimmte
    Verantwortlichkeit nach sich." Der Bußgeldtatbestand steht in Art. 641-1 КоАП.

    '
