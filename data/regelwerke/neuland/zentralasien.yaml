  status: softlaw
  status_detail: 'In Kraft seit dem Tag der Unterzeichnung (Ziff. 5). Ergangen auf Grundlage von Ziff.
    3 des Gesamtnationalen Maßnahmenplans zur Umsetzung der Präsidentenbotschaft vom 08.09.2025 („Kasachstan
    im Zeitalter der künstlichen Intelligenz"), gebilligt durch Präsidialerlass Nr. 1042 vom 13.10.2025.
