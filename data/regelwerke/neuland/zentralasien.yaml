- id: uz-informatisierungsgesetz
  jurisdiktion: uz
  kurztitel: Informatisierungsgesetz Usbekistan (Nr. 560-II)
  offizieller_titel: 'Ўзбекистон Республикасининг „Ахборотлаштириш тўғрисида"ги Қонуни / Закон Республики
    Узбекистан „Об информатизации" — Gesetz der Republik Usbekistan „Über die Informatisierung"

    '
  fundstelle: 'Ўзбекистон Республикасининг 2003 йил 11 декабрда қабул қилинган 560-II-сонли Қонуни; Ўзбекистон
    Республикаси Олий Мажлисининг Ахборотномаси, 2004 йил, № 1-2, 10-модда. In Kraft seit 11.02.2004.

    '
  verfahrensnummer: 560-II
  status: anwendbar
  status_detail: 'In Kraft. Seit dem 21.01.2026 (ЎРҚ-1115) enthält es die KI-Legaldefinition und den neuen
    Art. 7-1. Es ist damit — mangels eigenständigem KI-Gesetz — das KI-Grundgesetz Usbekistans.

    '
  kurzbeschreibung: 'Rahmengesetz über Informationsressourcen, Informationssysteme und ihre Rechtsstellung.
    Für das KI-Recht tragen es vier Stellen: Art. 3 (Legaldefinition der KI), Art. 4 Abs. 2 (Staatspolitik),
    Art. 6 (Behördenzuständigkeiten für KI), Art. 7-1 (Schadensverbot und Verbot der ausschließlichen
    Stützung auf KI bei rechtlich bedeutsamen Entscheidungen) und Art. 12-1 (Verbotskatalog für Webseitenbetreiber
    und Blogger, ergänzt um die rechtswidrige KI-gestützte Datenverarbeitung).

    '
  inkrafttreten:
    datum: 2004-02-11
    verifiziert: true
    quelle: https://lex.uz/ru/docs/82956
  anwendungsdaten:
  - datum: 2026-01-21
    was_gilt: 'Art. 3 (KI-Definition), Art. 4 Abs. 2, Art. 6, Art. 7-1 und Art. 12-1 Abs. 1 achter Absatz
      — eingefügt durch ЎРҚ-1115, in Kraft mit dem Tag der Veröffentlichung.

      '
    verifiziert: true
    quelle: https://lex.uz/ru/docs/83472
  themenachsen:
  - governance
  - grundrechte
  - content
  - sektor-oeffentlich
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 7-1 Abs. 1: Verbot der Schädigung des Menschen, seines Lebens, seiner Gesundheit, Freiheit,
    Ehre und Würde durch KI-gestützte Informationsressourcen und -systeme sowie der Verletzung seiner
    sonstigen unveräußerlichen Rechte. Ein Generalklausel-Verbot ohne Konkretisierung — funktional ein
    Ersatz für den Verbotskatalog, den Kasachstan in Art. 17 Abs. 3 seines KI-Gesetzes ausformuliert hat.

    '
  - 'Art. 7-1 Abs. 2: Verbot, sich bei rechtlich bedeutsamen Entscheidungen, die Rechte und Freiheiten
    des Menschen berühren, AUSSCHLIESSLICH auf KI-Schlussfolgerungen zu stützen. Anders als Art. 24 Datenschutzgesetz
    (LRU-547), der eine Einwilligungs- und Vertragsausnahme kennt, ist dieses Verbot AUSNAHMSLOS formuliert.
    Beide Normen stehen unabgestimmt nebeneinander.

    '
  - 'Art. 12-1 Abs. 1 achter Absatz: rechtswidrige KI-gestützte Verarbeitung personenbezogener Daten und
    deren Verbreitung als verbotener Inhalt für Webseitenbetreiber und Blogger. Der Katalog ist die Anknüpfung
    für Sperrverfügungen der Aufsichtsbehörde.

    '
  - 'Art. 6: Die Fachbehörde schafft Bedingungen für die Anziehung von Investitionen in die KI-Richtung,
    bildet die technische Infrastruktur für die KI-gestützte Verarbeitung der Daten staatlicher Organe
    und organisiert die Aus- und Weiterbildung. Es sind Förder-, keine Aufsichtsbefugnisse: Das Gesetz
    weist der Behörde für KI KEINE Kontroll- oder Sanktionskompetenz zu.

    '
