      gefasst, Abs. 3 gestrichen); diese Änderungen treten ihrerseits 60 Kalendertage nach ihrer Erstveröffentlichung
      in Kraft.

      '
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/K2600000255
  themenachsen:
  - governance
  - sektor-oeffentlich
  - grundrechte
  - datenschutz
  - haftung
  regelungsschwerpunkte:
  - 'Art. 43 — „Права субъектов цифровой среды при использовании алгоритмических систем и полностью автоматизированных
    решений" (Rechte der Subjekte der digitalen Umgebung beim Einsatz algorithmischer Systeme und vollautomatisierter
    Entscheidungen). Abs. 1 definiert die „алгоритмическая система" als digitales System, das auf Grundlage
    automatisierter Datenverarbeitung Entscheidungen trifft oder beeinflusst, EINSCHLIESSLICH KI-Systemen.
    Damit ist der Oberbegriff weiter als „KI-System" und erfasst auch regelbasierte Verfahren.

    '
  - 'Art. 43 Abs. 2: Entscheidungen mit algorithmischen Systemen dürfen nicht zu Diskriminierung führen,
    einschließlich Diskriminierung nach den gesetzlich bestimmten Merkmalen.

    '
  - 'Art. 43 Abs. 3: „Vollautomatisierte Entscheidung" ist eine Entscheidung, die ohne Beteiligung eines
    Menschen an der Bewertung der Umstände oder an der Bestätigung des Ergebnisses getroffen wird, in
    den durch Gesetz oder VEREINBARUNG vorgesehenen Fällen. Bemerkenswert: Auch eine vertragliche Vereinbarung
    kann eine vollautomatisierte Entscheidung legitimieren.

    '
  - 'Art. 43 Abs. 4 — die Kernvorschrift. Wer einer vollautomatisierten algorithmischen Entscheidung unterworfen
    ist, hat drei Rechte: (1) Information über die Tatsache des Einsatzes einer algorithmischen Systems;
    (2) ERKLÄRUNG der Schlüsselfaktoren und Kriterien, die die Entscheidung beeinflusst haben, OHNE Offenlegung
    von Algorithmen, Quellcode oder gesetzlich geschützten Geheimnissen; (3) Anspruch auf ÜBERPRÜFUNG
    DER ENTSCHEIDUNG UNTER BETEILIGUNG EINES BEFUGTEN FACHKUNDIGEN, wenn die Entscheidung Rechtsfolgen
    hat oder Rechte und berechtigte Interessen beeinflussen kann. Ziffer 2 ist eine ausdrückliche positivrechtliche
    Antwort auf den Streit um den Umfang der Erklärungspflicht: Kasachstan schließt die Offenlegung des
    Algorithmus ausdrücklich aus und begrenzt den Anspruch auf die „Schlüsselfaktoren und Kriterien".

    '
  - 'Art. 41: Recht auf Löschung, Anonymisierung oder Beschränkung der Verarbeitung personenbezogener
    Daten in der digitalen Umgebung, UNABHÄNGIG VON DER GRUNDLAGE IHRER ERLANGUNG. Bei gesetzlichen Aufbewahrungsfristen
    ist statt der Löschung der Zugang zu beschränken und die Verarbeitung auszusetzen. Ausnahmekatalog
    in Abs. 4 (Lebens- und Gesundheitsschutz, Ordnungswidrigkeits- und Strafverfahren, Justiz, gesetzlich
    bestimmtes öffentliches Interesse, Statistik und Forschung bei Anonymisierung, staatliche Aufgaben
    und Dienstleistungen).

    '
  - 'Art. 100 Abs. 4: Beim Qualitätsaudit von KI-Systemen sind zu bewerten die Qualität und Rechtmäßigkeit
    der für das Training verwendeten Datenbibliotheken und das Vorliegen verbotener Funktionalitäten nach
    dem KI-Gesetz. Damit wird das Auditregime des Art. 20 KI-Gesetz im Kodex gespiegelt.

    '
  - 'Art. 42: Digitale Barrierefreiheit; staatliche Stellen müssen digitale Systeme und Dienste für alle
    Nutzergruppen einschließlich Menschen mit Behinderungen zugänglich machen, nach einheitlichen Anforderungen,
    die unter Berücksichtigung internationaler Ansätze fortgeschrieben werden.

    '
  - 'Art. 93: Legaldefinition der „цифровая трансформация" — sie stützt sich ausdrücklich auf Datenanalytik
    UND künstliche Intelligenz. Art. 14 Ziff. 14: Die Digitalisierungsbehörde wirkt an der Erarbeitung
    von Normungsdokumenten im Bereich der künstlichen Intelligenz mit — die Anknüpfung an die technische
    Normung.

    '
  - 'Art. 40: Recht auf digitale Identität als persönliches Nichtvermögensgut; NIEMAND darf zur digitalen
    Identifizierung gezwungen werden, soweit das Gesetz die Pflicht nicht ausdrücklich vorsieht. Praktisch
    relevant für biometrische Zugangssysteme.

    '
