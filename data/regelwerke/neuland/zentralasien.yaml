  offene_punkte:
  - 'Das Verhältnis zwischen Art. 19-1 Abs. 1 Datenschutzgesetz (Verbot automatisierter Verarbeitung mit
    Rechtsfolgen ohne Einwilligung) und Art. 43 Digitalkodex (Recht auf Überprüfung durch einen Menschen
    bei vollautomatisierten Entscheidungen) ist ungeklärt. Die beiden Normen stammen aus zwei Gesetzgebungsvorgängen
    (17.11.2025 und 09.01.2026) und verwenden unterschiedliche Begriffe („автоматизированная обработка"
    vs. „полностью автоматизированное решение").

    '
  - 'Ob Art. 7 Abs. 11 Datenschutzgesetz (Scraping-Verbot) auf das Training von KI-Modellen mit öffentlich
    zugänglichen Daten anwendbar ist, wenn dabei keine Datenbank im Rechtssinne entsteht, ist am Wortlaut
    nicht zu entscheiden. Die für 2026 vorgesehene Änderung durch Gesetz Nr. 326-VIII deutet auf Nachbesserungsbedarf.

    '
