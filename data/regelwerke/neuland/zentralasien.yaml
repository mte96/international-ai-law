      13.01.2026 — also genau in der Woche, in der das KI-Gesetz in Kraft trat.

      '
  offene_punkte:
  - 'Der Präsidialerlass Nr. 997 vom 18.09.2025 war unter keiner der versuchten adilet-Kennungen (U2500000997,
    U250000997, U2500997, U25000997) abrufbar; belegt ist er nur mittelbar über die Titelzitate in ПП
    № 846 und ПП № 263. Der nächste Bearbeiter sollte ihn über die adilet-Volltextsuche nachtragen.

    '
  - 'Es gibt kein veröffentlichtes „Положение" (Statut) des Ministeriums selbst in dieser Datei; nur die
    Statuten dreier Komitees.

    '
