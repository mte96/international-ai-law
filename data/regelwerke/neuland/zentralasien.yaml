- id: kz-ki-behoerde
  jurisdiktion: kz
  kurztitel: Ministerium für KI und digitale Entwicklung (МИИЦР)
  offizieller_titel: 'Қазақстан Республикасының Жасанды интеллект және цифрлық даму министрлігі / Министерство
    искусственного интеллекта и цифрового развития Республики Казахстан — Ministerium für künstliche Intelligenz
    und digitale Entwicklung der Republik Kasachstan

    '
  fundstelle: 'Errichtet durch Umbildung des Ministeriums für digitale Entwicklung, Innovationen und Luft-
    und Raumfahrtindustrie (МЦРИАП) auf Grundlage des Указ Президента РК от 18 сентября 2025 года № 997
    „О мерах по дальнейшему совершенствованию системы государственного управления"; Durchführung: Постановление
    Правительства РК от 9 октября 2025 года № 846 (geändert durch ПП РК № 263 von 2026). Der Minister
    ist zugleich stellvertretender Premierminister (Ж. Мадиев / Zhaslan Madiyev).

    '
  verfahrensnummer: Указ № 997 (18.09.2025); ПП № 846 (09.10.2025)
  status: anwendbar
  status_detail: 'Bestehend. Aus den Ministerialerlassen ergibt sich die Binnenstruktur: Комитет искусственного
    интеллекта и управления данными (Komitee für künstliche Intelligenz und Datenverwaltung, Erlass Nr.
    555/НҚ vom 04.11.2025, aufgehoben durch Erlass Nr. 13/НҚ vom 13.01.2026), Комитет цифровых активов
    и прорывных технологий (Komitee für digitale Vermögenswerte und Durchbruchstechnologien — es zeichnet
    für die KI-Durchführungserlasse verantwortlich) und Комитет по информационной безопасности (Erlass
    Nr. 527/НҚ vom 21.10.2025). Die Zuständigkeit für KI wurde also binnen zweier Monate von einem Komitee
    auf ein anderes verschoben.

    '
  kurzbeschreibung: 'Der „уполномоченный орган в сфере искусственного интеллекта" des KI-Gesetzes. Er
    vereinigt vier Funktionen, die in der EU auf mehrere Stellen verteilt sind: Normsetzung (Art. 13 Abs.
    1 Ziff. 3, 5, 6 KI-Gesetz), Aufsicht (Art. 13 Abs. 1 Ziff. 1 — „контрольно-надзорные функции"), Sanktionierung
    (Art. 692-3 КоАП) und Förderung (Art. 28 KI-Gesetz). Er ist zugleich Datenschutzaufsicht, weil die
    datenschutzrechtlichen Regeln nach dem Datenschutzgesetz Nr. 94-V von demselben Ministerium erlassen
    werden. Eine unabhängige KI- oder Datenschutzaufsicht im europäischen Sinn existiert nicht.

    '
  themenachsen:
  - governance
  - sektor-oeffentlich
  - datenschutz
  regelungsschwerpunkte:
  - 'Der KI-Minister ist zugleich stellvertretender Premierminister. Sämtliche KI-Durchführungserlasse
    dieser Datei sind mit „Заместитель Премьер-Министра – Министр искусственного интеллекта и цифрового
    развития Республики Казахстан Ж. Мадиев" gezeichnet. Die Regulierungsbehörde sitzt damit im Kabinett
    — das Gegenteil der institutionellen Unabhängigkeit, die Art. 70 KI-VO für die nationalen Behörden
    verlangt.

    '
  - 'Das KI-Gesetz benennt die Behörde nicht ausdrücklich. Die Zuordnung ergibt sich erst aus der Anordnung
    Nr. 2-р vom 14.01.2026 (22 von 23 Rechtsakten beim МИИЦР) und aus der Zeichnung der Durchführungserlasse.

    '
  - 'Aufsichtsinstrumente: Art. 13 Abs. 1 Ziff. 1 KI-Gesetz nennt pauschal „контрольно-надзорные функции",
    ohne Befugnisnormen. Konkrete Eingriffsbefugnisse ergeben sich nur mittelbar aus Art. 641-1 und 692-3
    КоАП (Bußgeld, Aussetzung oder Verbot des Systembetriebs im Wiederholungsfall) und aus dem allgemeinen
    Kontrollrecht des Unternehmerkodex.

    '
