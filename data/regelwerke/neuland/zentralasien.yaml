  regelungsschwerpunkte:
  - 'Art. 1 Ziff. 5 — Verbraucherschutzgesetz vom 04.05.2010, Art. 27 neuer Abs. 6: Der Verkäufer (Hersteller,
    Erbringer) ist VERPFLICHTET, den Verbraucher über mögliche Risiken und die Bedingungen der sicheren
    Verwendung einer Ware (Arbeit, Dienstleistung) zu informieren, die KI-Komponenten enthält oder von
    einem KI-System hergestellt oder erbracht wird; die Information muss in der Begleitdokumentation,
    auf der Verbraucherverpackung, auf Etiketten oder in sonst branchenüblicher Weise stehen. Damit steht
    die KI-Aufklärungspflicht im Verbraucherrecht, nicht nur im KI-Gesetz — und wird über die Verbraucherschutzaufsicht
    durchsetzbar.

    '
  - 'Art. 1 Ziff. 6 — Datenschutzgesetz Nr. 94-V. Neu: Legaldefinition der „automatisierten Verarbeitung
    personenbezogener Daten" (Art. 1 Ziff. 2-3): Verarbeitung durch ein Informatisierungsobjekt unter
    Ausschluss der Beteiligung des Eigentümers, Betreibers oder Dritten am Verarbeitungsvorgang. Der Begriff
    „сведения" (Angaben) wird in der Definition personenbezogener Daten durch „данные, в том числе биометрические"
    (Daten, einschließlich biometrischer) ersetzt.

    '
  - 'Art. 1 Ziff. 6 — Datenschutzgesetz Art. 7 neuer Abs. 11: VERBOT der Erhebung und Verarbeitung personenbezogener
    Daten zur Schaffung oder Erweiterung von Datenbanken durch zweckwidrige Extraktion personenbezogener
    Daten aus öffentlich zugänglichen Quellen („нецелевое извлечение из общедоступных источников"). Das
    ist eine ausdrückliche gesetzliche Antwort auf Web-Scraping zum KI-Training — soweit ersichtlich eine
    der wenigen positivrechtlichen Scraping-Verbotsnormen weltweit. Zu Abs. 11 ist bereits eine Änderung
    durch Gesetz Nr. 326-VIII vom 24.06.2026 vorgesehen.

    '
  - 'Art. 1 Ziff. 6 — Datenschutzgesetz Art. 7 neuer Abs. 12: Der Einsatz technologischer Mittel zur Erhebung
    biometrischer Daten und zur Identifizierung von Personen AN ÖFFENTLICHEN ORTEN sowie die Nutzung der
    so erhobenen Daten ist ausschließlich zum Schutz der Verfassungsordnung, der öffentlichen Ordnung,
    der Rechte und Freiheiten des Menschen, der Gesundheit und Sittlichkeit der Bevölkerung zulässig —
    außer bei Einwilligung der betroffenen Person. Funktional ist das die kasachische Entsprechung zum
    Regime der biometrischen Fernidentifizierung nach Art. 5 Abs. 1 lit. h KI-VO, aber ohne Richtervorbehalt
    und ohne Katalog von Anlasstaten.

    '
  - 'Art. 1 Ziff. 6 — Datenschutzgesetz Art. 8 neue Abs. 5 bis 7: Die Einwilligung darf nicht länger gelten
    als für die Zweckerreichung erforderlich; ohne Fristangabe gilt sie bis zur Zweckerreichung; die betroffene
    Person kann die Einwilligung WIDERRUFEN, und der Verantwortliche muss binnen fünfzehn Arbeitstagen
    die Verarbeitung einstellen oder eine begründete Ablehnung vorlegen.

    '
  - 'Art. 1 Ziff. 6 — Datenschutzgesetz Art. 17 neuer Abs. 3: Bei Erhebung und Verarbeitung personenbezogener
    Daten FÜR DIE NATIONALE KI-PLATTFORM nimmt der Plattformbetreiber die Anonymisierung nach den von
    der Regierung gebilligten Datenverwaltungsanforderungen vor, soweit der Verantwortliche sie nicht
    selbst vorgenommen hat.

    '
  - 'Art. 1 Ziff. 6 — Datenschutzgesetz NEUER ART. 19-1 („Anforderungen an die automatisierte Verarbeitung
    personenbezogener Daten"). Abs. 1: VERBOT der automatisierten Verarbeitung, in deren Ergebnis Rechte
    oder berechtigte Interessen der betroffenen Person entstehen, sich ändern oder erlöschen — es sei
    denn, es liegt eine Einwilligung vor oder ein Gesetz lässt es zu. Abs. 2: Aufklärungspflicht über
    Verfahren und mögliche Folgen, Recht auf Widerspruch, Aufklärung über den Rechtsschutz. Abs. 3: Der
    Widerspruch ist BINNEN DREI ARBEITSTAGEN zu bescheiden; Rechtsbehelf gegen Handeln und Unterlassen.
    Die Vorschrift ist deutlich strenger als Art. 22 DSGVO: Sie kennt keine Ausnahme für die Vertragserfüllung
    und verlangt für den Regelfall Einwilligung oder gesetzliche Grundlage.

    '
  - 'Art. 1 Ziff. 8 — Informatisierungsgesetz Nr. 418-V. Art. 35 neuer Abs. 2-2: Der Zugang des Betreibers
    der nationalen KI-Plattform zu VERTRAULICHEN elektronischen Informationsressourcen erfolgt nur unter
    Sicherstellung der Anonymisierung. Art. 36 Abs. 6: Die automatisierte Verarbeitung personenbezogener
    Daten richtet sich nach dem Datenschutzrecht (die bisherige eigenständige Regelung im Informatisierungsgesetz
    entfällt). Art. 39 neuer Abs. 7: Erstellung und Entwicklung von KI-Systemen, die zu den Informatisierungsobjekten
    des „elektronischen Regierens" gehören, erfolgen unter Beachtung der Besonderheiten des KI-Rechts.

    '
  - 'Art. 1 Ziff. 11 — Massenmediengesetz vom 19.06.2024, Art. 14 neuer Abs. 7: Die Verbreitung von MASSENMEDIENPRODUKTEN,
    die unter Einsatz eines KI-Systems geschaffen wurden, ist nur zulässig, wenn darüber nach dem KI-Gesetz
    informiert wird. Damit gilt die Kennzeichnungspflicht für redaktionelle Inhalte unabhängig davon,
    ob es sich um synthetische Ergebnisse im Sinne des Art. 1 Ziff. 4 KI-Gesetz handelt.

    '
