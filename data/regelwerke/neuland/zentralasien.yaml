      '
  offene_punkte:
  - 'Ob die 23 Rechtsakte fristgerecht ergangen sind, ist offen. Die Anordnung verlangt monatliche Veröffentlichung
    auf einem „общедоступный государственный объект информатизации"; dieses Portal (egov.kz / gov.kz)
    war nicht erreichbar. Das ist der erste Punkt, den der nächste Bearbeiter anfassen sollte: ohne die
    Regeln zu Klassifizierung, Dokumentation und maschinenlesbaren Formen ist das KI-Gesetz nicht vollziehbar.

    '
