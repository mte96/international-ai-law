- id: kz-urhg
  jurisdiktion: kz
  kurztitel: Urheberrechtsgesetz Kasachstan (Nr. 6-I)
  offizieller_titel: 'Қазақстан Республикасының Заңы „Авторлық құқық және сабақтас құқықтар туралы" /
    Закон Республики Казахстан „ОБ АВТОРСКОМ ПРАВЕ И СМЕЖНЫХ ПРАВАХ" — Gesetz der Republik Kasachstan
    „Über das Urheberrecht und die verwandten Schutzrechte"

    '
  fundstelle: 'Закон Республики Казахстан от 10 июня 1996 года № 6-I; Ведомости Парламента РК 1996 г.,
    № 8-9, ст. 237. Letzte Textänderung nach adilet: 20.08.2026.

    '
  verfahrensnummer: 6-I
  status: anwendbar
  status_detail: 'In Kraft. Das Gesetz enthält KEINE eigene KI-Vorschrift. Die urheberrechtlichen KI-Regeln
    Kasachstans stehen ausschließlich in Art. 23 des KI-Gesetzes und in den Regeln über maschinenlesbare
    Formen (Erlass Nr. 202/НҚ). Das ist ein bewusster regelungssystematischer Bruch: Kasachstan hat die
    Zuordnung KI-erzeugter Ergebnisse und den Trainingsvorbehalt NICHT ins Urheberrechtsgesetz eingestellt,
    sondern ins KI-Gesetz.

    '
  kurzbeschreibung: 'Klassisches Urheberrechtsgesetz kontinentaleuropäischer Prägung. Autor ist nach Art.
    2 die natürliche Person, durch deren schöpferische Arbeit das Werk geschaffen wurde. Werke sind nach
    Art. 6 schutzfähig, wenn sie Ergebnis schöpferischer Tätigkeit sind und in objektiver Form vorliegen.
    Datenbanken sind als Sammelwerke geschützt, soweit Auswahl oder Anordnung schöpferisch sind. Die Schranken
    (freie Nutzung) stehen in den Art. 18 ff.; Art. 23 Abs. 3 KI-Gesetz stellt ausdrücklich klar, dass
    das Training von KI-Modellen NICHT unter die Bildungs- und Wissenschaftsschranke fällt.

    '
  inkrafttreten:
    datum: 1996-06-10
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/Z960000006_
  themenachsen:
  - urheberrecht
  regelungsschwerpunkte:
  - 'Art. 2: Legaldefinitionen. Datenbank ist eine nach Auswahl oder Anordnung schöpferische Zusammenstellung
    von Daten, systematisiert zur Auffindung und Verarbeitung mittels Rechenanlage. Computerprogramm ist
    ein Befehlssatz, dessen Aufzeichnung auf einem maschinenlesbaren Träger die Ausführung einer bestimmten
    Aufgabe durch die Rechenanlage bewirkt.

    '
  - 'Das Gesetz kennt keinen Werkbegriff, der maschinelle Erzeugung erfasst, und keine dem Art. 23 KI-Gesetz
    entsprechende Zuordnungsregel. Die materielle Antwort auf die Schutzfähigkeit KI-erzeugter Ergebnisse
    steht in Art. 23 Abs. 1 KI-Gesetz („nur bei schöpferischem Beitrag eines Menschen").

    '
  - 'Die Anerkennung des PROMPTS als eigenständiger urheberrechtlicher Schutzgegenstand (Art. 23 Abs.
    2 KI-Gesetz) hat im Urheberrechtsgesetz keine Entsprechung; sie ist über die Verweisung „в соответствии
    с законодательством Республики Казахстан об авторском праве и смежных правах" an dessen Werkbegriff
    angebunden.

    '
  dokumente:
  - datum: 1996-06-10
    typ: konsolidiert
    titel: 'Закон Республики Казахстан от 10 июня 1996 года № 6-I „Об авторском праве и смежных правах"
      (konsolidierte Fassung)

      '
    url: https://adilet.zan.kz/rus/docs/Z960000006_
    sprache: ru
    urheber: ИПС „Әділет"
    verifiziert: true
    notiz: 'Volltextprüfung ergab: keine Fundstelle für „искусственный интеллект", „обучение модели" oder
      „машиночитаемая форма". Das belegt, dass die KI-Regelung Kasachstans außerhalb des Urheberrechtsgesetzes
      steht.

      '
  - datum: 2015-11-24
    typ: uebersicht
    titel: 'WIPO Lex: Закон Республики Казахстан № 6-I от 10.06.1996 г. „Об авторском праве и смежных
      правах" (Fassung 2015)

      '
    url: https://www.wipo.int/wipolex/ru/legislation/details/16010
    sprache: ru
    urheber: WIPO
    verifiziert: false
    notiz: 'Nur als Zusatznachweis; die maßgebliche konsolidierte Fassung steht auf adilet.zan.kz. Die
      WIPO-Fassung ist auf dem Stand 2015 und damit veraltet.

      '
  offene_punkte:
  - 'Die Schrankenbestimmungen (Art. 18 ff.) wurden nicht im Einzelnen ausgewertet. Für die Frage, welche
    Schranke Art. 23 Abs. 3 KI-Gesetz ausschließt („freie Nutzung zu Bildungs- oder Wissenschaftszwecken"),
    ist der genaue Wortlaut der einschlägigen Schranke nachzutragen.

    '
  - 'Ungeklärt ist, wie sich Art. 23 Abs. 4 KI-Gesetz (Training ist keine Nutzung in den Formen der Verwertungsrechte)
    zu Art. 16 Urheberrechtsgesetz (Katalog der Verwertungsrechte) verhält: Nach dem Wortlaut nimmt das
    KI-Gesetz das Training aus dem Verwertungsrechtskatalog heraus, macht es aber zugleich vom Fehlen
    eines Vorbehalts abhängig — eine Konstruktion ohne Vorbild.

    '
