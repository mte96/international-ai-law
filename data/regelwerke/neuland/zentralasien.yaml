- id: kz-kriterien-ki-systeme
  jurisdiktion: kz
  kurztitel: Kriterien für die Einordnung als KI-System (Erlass 171/НҚ)
  offizieller_titel: 'Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового
    развития Республики Казахстан „Об утверждении критериев отнесения объектов информатизации к системам
    искусственного интеллекта" — Erlass über die Kriterien für die Einordnung von Informatisierungsobjekten
    als KI-Systeme

    '
  fundstelle: 'Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития
    РК от 1 апреля 2026 года № 171/НҚ; staatlich registriert im Justizministerium (adilet-Kennung V2600038288)

    '
  verfahrensnummer: 171/НҚ
  status: anwendbar
  status_detail: 'In Kraft. Ziff. 4 des Erlasses: Inkrafttreten nach Ablauf von zehn Kalendertagen nach
    der Erstveröffentlichung. Der Erlass beruht auf Art. 13 Abs. 1 Ziff. 6 KI-Gesetz und war nach der
    Anordnung Nr. 2-р bis JANUAR 2026 zu erlassen; er ist am 01.04.2026 ergangen — rund zweieinhalb Monate
    zu spät.

    '
  kurzbeschreibung: 'Bestimmt den sachlichen Anwendungsbereich des KI-Gesetzes. Ohne diesen Erlass wäre
    der Begriff „система искусственного интеллекта" des Art. 1 Ziff. 5 KI-Gesetz nicht handhabbar. Der
    Erlass wählt einen FUNKTIONSKATALOG statt einer technischen Definition: Ein Informatisierungsobjekt
    ist ein KI-System, wenn es eine der aufgezählten Fähigkeiten aufweist (Computer Vision, Verarbeitung
    natürlicher Sprache, Spracherkennung und -synthese und weitere). Das ist methodisch das Gegenteil
    des Anhangs I der KI-VO in ihrer ursprünglichen Fassung, der Techniken auflistete.

    '
  inkrafttreten:
    datum: 2026-04-01
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/V2600038288
  themenachsen:
  - marktzugang
  - governance
  regelungsschwerpunkte:
  - 'Ziff. 2 Ziff. 1: Computer Vision — Erkennung, Identifikation und Analyse von Objekten, Ereignissen
    oder Merkmalen; Bildung digitaler Modelle der Umgebung einschließlich 3D-Rekonstruktion und räumlicher
    Navigation; autonome semantische Segmentierung, Klassifikation und Identifikation, auch in Echtzeit;
    Diagnose, Kontrolle, Anomalie- und Risikoerkennung.

    '
  - 'Ziff. 2 Ziff. 2: Verarbeitung natürlicher Sprache — Analyse und Interpretation von Text und gesprochener
    Sprache, Semantik und Syntax, Spracherkennung, ERKENNUNG VON ABSICHTEN UND EMOTIONALER FÄRBUNG von
    Sprache oder Text, maschinelle Übersetzung, Synthese eigenständiger Texte, halbautomatische Inhaltserzeugung,
    Untertitelung, Gebärdensprachübersetzung. Der Verweis auf Emotionserkennung verzahnt den Katalog mit
    dem Verbot des Art. 17 Abs. 3 Ziff. 6 KI-Gesetz.

    '
  - 'Ziff. 2 Ziff. 3: Spracherkennung und -synthese — mehraufgabenfähige Sprachassistenten, AUTHENTIFIZIERUNG
    VON PERSONEN ANHAND VON STIMMMERKMALEN, Erkennung in schwierigen Umgebungen, Steuerung von Emotion
    und Intonation in synthetischer Sprache, mehrsprachige Sprachsynthese, ERKENNUNG ANTHROPOLOGISCHER
    MERKMALE ANHAND DER STIMME, Erkennung emotionaler Nuancen.

    '
  dokumente:
