- id: uz-urhg
  jurisdiktion: uz
  kurztitel: Urheberrechtsgesetz Usbekistan (ЗРУ-42)
  offizieller_titel: 'Ўзбекистон Республикасининг „Муаллифлик ҳуқуқи ва турдош ҳуқуқлар тўғрисида"ги Қонуни
    / Закон Республики Узбекистан „Об авторском праве и смежных правах"

    '
  fundstelle: 'Закон Республики Узбекистан от 20 июля 2006 года № ЗРУ-42; angenommen von der Gesetzgebungskammer
    am 23.03.2006, gebilligt vom Senat am 09.06.2006

    '
  verfahrensnummer: ЗРУ-42
  status: anwendbar
  status_detail: 'In Kraft. Enthält KEINE KI-Vorschrift. Anders als Kasachstan hat Usbekistan weder im
    Urheberrechtsgesetz noch anderswo eine Regel über die Schutzfähigkeit KI-erzeugter Ergebnisse oder
    über das Training von Modellen erlassen.

    '
  kurzbeschreibung: 'Klassisches Urheberrechtsgesetz. Art. 4: Autor ist „физическое лицо, творческим трудом
    которого создано произведение" — die natürliche Person, durch deren schöpferische Arbeit das Werk
    geschaffen wurde. Datenbanken sind als Sammelwerke geschützt, soweit Auswahl oder Anordnung Ergebnis
    schöpferischer Arbeit sind (Art. 4, Art. 7). Die urheberrechtliche Behandlung KI-erzeugter Ergebnisse
    folgt in Usbekistan deshalb allein aus dem allgemeinen Werk- und Autorenbegriff, ergänzt durch die
    Auslegungsvorgaben des Plenums des Obersten Gerichts.

    '
  inkrafttreten:
    datum: 2006-07-20
    verifiziert: false
    quelle: https://lex.uz/ru/docs/1023494
  themenachsen:
  - urheberrecht
  regelungsschwerpunkte:
  - 'Art. 4: Autor ist die natürliche Person, durch deren schöpferische Arbeit das Werk geschaffen wurde.
    Es gibt keine Fiktion, keine Zuordnung an den Veranlasser und keine dem britischen s. 9(3) CDPA vergleichbare
    Regel für computergenerierte Werke.

    '
  - 'Art. 8: Nicht urheberrechtsfähig sind amtliche Dokumente, Symbole und Zeichen, Volksschöpfungen sowie
    Tatsachenmitteilungen. Ein Ausschluss maschinell erzeugter Ergebnisse fehlt.

    '
  - 'Auslegungshilfe: Постановление Пленума Верховного суда № 19 vom 23.06.2023 „О некоторых вопросах
    рассмотрения дел, связанных с интеллектуальной собственностью", Ziff. 26: Autor ist die natürliche
    Person, die das Werk durch ihre schöpferische Arbeit geschaffen hat; Personen, die ihr TECHNISCHE
    UNTERSTÜTZUNG geleistet haben (Texterfassung, Korrektur usw.), werden NICHT als Miturheber anerkannt.
    Diese Abgrenzung zwischen schöpferischer und technischer Leistung ist der dogmatische Ansatzpunkt,
    an dem usbekische Gerichte KI-erzeugte Ergebnisse einordnen werden.

    '
  dokumente:
  - datum: 2006-07-20
    typ: konsolidiert
    titel: 'ЗРУ-42-сон 20.07.2006 „Об авторском праве и смежных правах" (konsolidierte Fassung)

      '
    url: https://lex.uz/ru/docs/1023494
    sprache: ru
    urheber: lex.uz
    verifiziert: true
    notiz: 'VOLLTEXTPRÜFUNG: keine Fundstelle für „искусственный интеллект". Belegt die Regelungslücke.

      '
  - datum: 2023-06-23
    typ: leitlinie
    titel: 'Постановление Пленума Верховного суда Республики Узбекистан № 19 от 23 июня 2023 года „О некоторых
      вопросах рассмотрения дел, связанных с интеллектуальной собственностью"

      '
    url: https://lex.uz/ru/docs/6522625
    sprache: ru
    urheber: Plenum des Obersten Gerichts der Republik Usbekistan
    verifiziert: true
    notiz: 'In Usbekistan sind Plenumsbeschlüsse für die Gerichte verbindliche Auslegungsakte. Ziff. 26
      (schöpferische versus technische Leistung) und Ziff. 36 (Sammelwerke) sind die Vorschriften, an
      denen sich die Behandlung KI-erzeugter Ergebnisse entscheiden wird. Der Beschluss selbst erwähnt
      künstliche Intelligenz NICHT.

      '
  offene_punkte:
  - 'Es fehlt jede Regelung zum Text- und Data-Mining. Ob die Vervielfältigung urheberrechtlich geschützter
    Werke zum Modelltraining in Usbekistan zulässig ist, ist ungeklärt; die Schrankenbestimmungen wurden
    nicht ausgewertet.

    '
  - 'Die usbekische Fassung des Gesetzes wurde nicht abgerufen; die hier verlinkte Fassung (doc 1023494)
    ist die russische.

    '
