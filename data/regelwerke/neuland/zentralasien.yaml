  jurisdiktion: kz
  kurztitel: KI-Begleitgesetz Kasachstan (Nr. 231-VIII)
  offizieller_titel: 'Закон Республики Казахстан „О внесении изменений и дополнений в некоторые законодательные
    акты Республики Казахстан по вопросам искусственного интеллекта и цифровизации" — Gesetz der Republik
    Kasachstan „Über Änderungen und Ergänzungen einiger Gesetzgebungsakte der Republik Kasachstan in Fragen
    der künstlichen Intelligenz und der Digitalisierung"

    '
  fundstelle: Закон Республики Казахстан от 17 ноября 2025 года № 231-VIII ЗРК
  verfahrensnummer: 231-VIII
  status: anwendbar
  status_detail: 'In Kraft. Art. 2: Inkrafttreten 60 Kalendertage nach Erstveröffentlichung, mit Ausnahme
    von Art. 1 Ziff. 9 (Postgesetz), der rückwirkend zum 01.01.2025 in Kraft gesetzt wird. Zusammen mit
    dem KI-Gesetz Nr. 230-VIII und dem Ordnungswidrigkeitengesetz Nr. 232-VIII am 17.11.2025 unterzeichnet
    und am 18.11.2025 veröffentlicht.

    '
  kurzbeschreibung: 'Das materiell wichtigste Stück des kasachischen KI-Pakets. Es ändert elf Gesetze.
    Für das KI-Recht entscheidend sind vier davon: das Datenschutzgesetz (neuer Art. 19-1 über automatisierte
    Verarbeitung, Verbot der zweckwidrigen Datenextraktion aus öffentlich zugänglichen Quellen, Einschränkung
    biometrischer Erfassung im öffentlichen Raum), das Verbraucherschutzgesetz (Informationspflicht über
    KI-Komponenten in Waren und Dienstleistungen), das Massenmediengesetz (Kennzeichnungspflicht für mit
    KI erzeugte Medienprodukte) und das Informatisierungsgesetz (Zugang des Plattformbetreibers zu vertraulichen
    Ressourcen nur anonymisiert; staatliche KI-Systeme unterliegen zusätzlich dem KI-Recht). Daneben ein
    umfangreicher, KI-fremder Teil zu Lizenzierung im Bereich Informationssicherheit, digitalen Vermögenswerten
    und Postdienstleistungen.

    '
