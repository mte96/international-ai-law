  kurztitel: Strategie „Цифровой Узбекистан-2030" (УП-6079)
  offizieller_titel: 'Указ Президента Республики Узбекистан „Об утверждении Стратегии «Цифровой Узбекистан-2030»
    и мерах по ее эффективной реализации"

    '
  fundstelle: 'Указ Президента Республики Узбекистан от 5 октября 2020 года № УП-6079

    '
  verfahrensnummer: УП-6079
  status: softlaw
  status_detail: 'In Kraft. Die Dachstrategie, in deren Rahmen die KI-Strategie ПП-358 ausdrücklich ergangen
    ist („обеспечения исполнения целей и задач, определенных в Стратегии «Цифровой Узбекистан — 2030»").
    Ihre Koordinationskommission unter Leitung des Premierministers A. Aripow ist zugleich das Steuerungsgremium
    der KI-Politik: Sie billigt die Liste der prioritären KI-Projekte und verteilt die Mittel nach УП-189
    Ziff. 7.

    '
  kurzbeschreibung: 'Rahmenstrategie der usbekischen Digitalpolitik. Für das KI-Recht ist sie institutionell
    erheblich: Die „Координационная комиссия по реализации Стратегии «Цифровой Узбекистан — 2030»" ist
    nach ПП-358 Ziff. 5 und 6 und nach УП-189 Ziff. 7 und 11 das Gremium, das über die KI-Projektliste,
    die Mittelverteilung und die Wirksamkeitsbewertung entscheidet — ohne dass es dafür eine gesetzliche
    Grundlage gäbe.

    '
  inkrafttreten:
    datum: 2020-10-05
    verifiziert: false
    quelle: https://lex.uz/ru/docs/5031048
  themenachsen:
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Die Koordinationskommission ist das faktische KI-Steuerungsorgan Usbekistans. Ihre Zusammensetzung,
    ihr Verfahren und die Rechtsnatur ihrer Beschlüsse ergeben sich nicht aus einem Gesetz, sondern aus
    Präsidialerlassen — ein struktureller Unterschied zur kasachischen Lösung, die die Zuständigkeiten
    in Art. 12 und 13 des KI-Gesetzes normiert.

    '
