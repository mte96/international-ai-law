      '
  offene_punkte:
  - 'Verhältnis von Art. 43 Abs. 4 Ziff. 3 Digitalkodex (Überprüfung durch einen „уполномоченный специалист")
    zu Art. 19-1 Abs. 3 Datenschutzgesetz (Bescheidung des Widerspruchs binnen drei Arbeitstagen): Der
    Kodex verweist für Fristen auf „das Recht", nennt aber keine eigene. Ob die Drei-Tage-Frist auch für
    die Überprüfung nach dem Kodex gilt, ist offen.

    '
  - 'Der genaue Kalendertag des Inkrafttretens ist wie beim KI-Gesetz nicht amtlich ausgerechnet; deshalb
    `verifiziert: false`.

    '
  - 'Der Inhalt der Kodexnovelle Nr. 352-VIII vom 23.07.2026 wurde nicht ausgewertet.

    '
