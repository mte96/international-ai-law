  fundstelle: Указ Президента Республики Узбекистан от 6 июля 2026 года № УП-123
  verfahrensnummer: УП-123
  status: softlaw
  status_detail: 'In Kraft (Juli 2026). Sektorbezogener KI-Erlass für die staatliche Finanzkontrolle und
    die Rechnungskammer.

    '
  kurzbeschreibung: 'Setzt Ziele der digitalen Transformation des Staatsaudits für 2026–2030: Wirksamkeit
    der Risikofrüherkennung in den Haushalten auf 50 %, Steigerung der Aufdeckung von Haushaltsdisziplinverstößen
    um das 1,4-fache DURCH KI-EINSATZ, Aufbau von 30 KI-gestützten Risikoanalyse-Mechanismen und 50 Diensten
    und Modulen durch Integration der Informationssysteme staatlicher Organe, sowie Fortbildung der Prüfer.
    Der Erlass ist das deutlichste Beispiel für den usbekischen Ansatz, KI sektorweise per Präsidialerlass
    einzuführen statt horizontal zu regulieren — und er wirft die Frage auf, wie sich KI-gestützte Risikoscoring-Systeme
    in der Finanzkontrolle zu Art. 7-1 Abs. 2 Informatisierungsgesetz (Verbot der ausschließlichen Stützung
    auf KI bei rechtlich bedeutsamen Entscheidungen) verhalten.

    '
