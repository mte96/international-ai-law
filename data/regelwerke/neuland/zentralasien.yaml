    verifiziert: true
    notiz: 'Das Änderungsgesetz selbst. Es ist ganz überwiegend KI-fremd (Bauträgerrecht, Tabak- und Energydrinkwerbung,
      Lizenzrecht); die KI-Vorschriften sind zwei Ziffern in einem langen Katalog. Das ist für die Einordnung
