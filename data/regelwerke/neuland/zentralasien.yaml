- id: kz-koap-641-1
  jurisdiktion: kz
  kurztitel: KI-Bußgeldtatbestand im КоАП (Art. 641-1)
  offizieller_titel: 'Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексі / Кодекс Республики
    Казахстан об административных правонарушениях, Статья 641-1 „Нарушение законодательства Республики
    Казахстан в сфере искусственного интеллекта" — Ordnungswidrigkeitenkodex der Republik Kasachstan,
    Art. 641-1 „Verstoß gegen das Recht der Republik Kasachstan im Bereich der künstlichen Intelligenz"

    '
  fundstelle: 'Кодекс Республики Казахстан от 5 июля 2014 года № 235-V; Art. 641-1 und Art. 692-3 eingefügt
    durch Закон РК от 17.11.2025 № 232-VIII („О внесении изменений и дополнений в Кодекс Республики Казахстан
    об административных правонарушениях")

    '
  verfahrensnummer: 235-V (Kodex); 232-VIII (Änderungsgesetz)
  status: anwendbar
  status_detail: 'In Kraft. Das Änderungsgesetz Nr. 232-VIII tritt nach seiner Fußnote 60 Kalendertage
    nach Erstveröffentlichung in Kraft, also zeitgleich mit dem KI-Gesetz Mitte Januar 2026. Ohne Art.
    641-1 wäre das KI-Gesetz sanktionslos: Art. 30 KI-Gesetz verweist nur pauschal auf „die Gesetze".

    '
  kurzbeschreibung: 'Einziger Bußgeldtatbestand des kasachischen KI-Rechts. Erfasst sind NUR ZWEI Pflichtverletzungen:
    die Nichtinformation der Nutzer über irreführungsgeeignete synthetische Ergebnisse und die unterlassene
    Risikosteuerung bei Hochrisiko-KI, sofern daraus ein Schaden entstanden ist. Alle übrigen Pflichten
    des KI-Gesetzes (Dokumentation, Audit, Nutzervereinbarung, Verbotskatalog des Art. 17 Abs. 3) sind
    ordnungswidrigkeitenrechtlich NICHT bewehrt. Zuständig ist nach Art. 692-3 КоАП die KI-Behörde selbst,
    entschieden wird durch deren Leiter oder dessen Stellvertreter.

    '
  inkrafttreten:
    datum: 2026-01-17
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/K1400000235
  themenachsen:
  - content
  - haftung
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - 'Art. 641-1 Abs. 1 Ziff. 1: Unterlassene Information der Nutzer durch Eigentümer oder Besitzer von
    KI-Systemen über synthetische Ergebnisse, „die sie in die Irre führen können". Tatbestandlich erfasst
    ist also nur die irreführungsgeeignete Synthetik, nicht jede Kennzeichnungslücke nach Art. 21 Abs.
    2 KI-Gesetz.

    '
  - 'Art. 641-1 Abs. 1 Ziff. 2: Unterlassene Risikosteuerung bei KI-Systemen HOHER Risikostufe, die zu
    negativen Auswirkungen auf Gesundheit oder Wohlergehen von Menschen, zur Erzeugung oder Verbreitung
    verbotener oder falscher Informationen, zu Diskriminierung, zur Verletzung von Menschenrechten oder
    zu sonstigem Schaden geführt hat, sofern keine Straftat vorliegt. Erfolgsdelikt: ohne eingetretene
    Folge kein Bußgeld.

    '
  - 'Bußgeldrahmen Abs. 1: 15 МРП (natürliche Personen), 20 МРП (Kleinunternehmen und Nichtkommerzielle
    Organisationen), 30 МРП (mittlere Unternehmen), 100 МРП (Großunternehmen). Bei 1 МРП = 4 325 KZT (2026)
    entspricht die Höchstsumme rund 432 500 KZT, also etwa 700 bis 800 Euro. Der Rahmen ist damit um Größenordnungen
    niedriger als der der KI-VO.

    '
  - 'Bußgeldrahmen Abs. 2 (Wiederholung binnen eines Jahres): 30 / 50 / 70 / 200 МРП, ZUSÄTZLICH mit „приостановление
    или запрещение деятельности системы искусственного интеллекта" — Aussetzung oder Verbot des Betriebs
    des KI-Systems. Diese Nebenfolge ist die eigentlich scharfe Sanktion; sie entspricht funktional der
    Marktrücknahme, wird aber vom Ordnungswidrigkeitenrichter bzw. der Behörde verhängt.

    '
  - 'Art. 692-3 КоАП: Die KI-Behörde („уполномоченный орган в сфере искусственного интеллекта") verhandelt
    die Sachen nach Art. 641-1 selbst; entscheidungsbefugt sind der Behördenleiter und seine Stellvertreter.
    Damit liegen Regelsetzung (Art. 13 KI-Gesetz), Aufsicht und Sanktionierung in einer Hand.

    '
