  offizieller_titel: 'Ўзбекистон Республикаси Президентининг Фармони „Давлат аудити фаолиятида сунъий
    интеллект ва рақамлаштиришни янада ривожлантиришга оид чора-тадбирлар тўғрисида" / Указ Президента
