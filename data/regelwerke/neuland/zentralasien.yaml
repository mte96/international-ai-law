- id: uz-koao-462
  jurisdiktion: uz
  kurztitel: KI-Bußgeldtatbestand im КоАО (Art. 46-2 Abs. 2)
  offizieller_titel: 'Ўзбекистон Республикасининг Маъмурий жавобгарлик тўғрисидаги кодекси, 46-2-модда
    / Кодекс Республики Узбекистан об административной ответственности, статья 46-2 — Kodex der Republik
    Usbekistan über die Verwaltungsverantwortlichkeit, Art. 46-2

    '
  fundstelle: 'Кодекс, утвержденный Законом Республики Узбекистан от 22 сентября 1994 года № 2015-XII;
    Art. 46-2 Abs. 2 eingefügt durch Gesetz ЎРҚ-1115 vom 21.01.2026 (Қонунчилик маълумотлари миллий базаси,
    21.01.2026, Nr. 03/26/1115/0063)

    '
  verfahrensnummer: 2015-XII (Kodex); ЎРҚ-1115 (Novelle)
  status: anwendbar
  status_detail: 'In Kraft seit dem 21.01.2026. Der einzige KI-spezifische Sanktionstatbestand der usbekischen
    Rechtsordnung.

    '
  kurzbeschreibung: 'Art. 46-2 Abs. 2 КоАО ahndet die rechtswidrige Verarbeitung personenbezogener Daten
    UNTER NUTZUNG VON KI-TECHNOLOGIEN sowie deren Verbreitung in Massenmedien, Telekommunikationsnetzen
    oder im Internet mit einer Geldbuße von 50 bis 100 БРВ und der EINZIEHUNG DER TATWERKZEUGE. Der Grundtatbestand
    des Abs. 1 (rechtswidrige Erhebung, Systematisierung, Speicherung, Änderung, Ergänzung, Nutzung, Übermittlung,
    Verbreitung, Anonymisierung und Vernichtung personenbezogener Daten sowie Verstöße gegen die Datenlokalisierungspflicht)
    sieht dagegen nur 7 БРВ für Bürger und 50 БРВ für Amtsträger vor.

    '
  inkrafttreten:
    datum: 2026-01-21
    verifiziert: true
    quelle: https://lex.uz/ru/docs/97664
  themenachsen:
  - datenschutz
  - content
  - haftung
  regelungsschwerpunkte:
  - 'Tatbestand: „Сунъий интеллект технологияларидан фойдаланган ҳолда шахсга доир маълумотларга қонунга
    хилоф равишда ишлов бериш, уларни оммавий ахборот воситаларида, телекоммуникация тармоқларида ёки
    Интернет жаҳон ахборот тармоғида тарқатиш". Erfasst sind zwei Varianten: die KI-gestützte rechtswidrige
    Verarbeitung ALS SOLCHE und die Verbreitung. Ob die Verbreitung ein eigener Tatbestand oder ein Erfolgsmerkmal
    ist, lässt der Wortlaut offen.

    '
  - 'Rechtsfolge: „маъмурий ҳуқуқбузарликни содир этиш қуролларини мусодара қилиб, базавий ҳисоблаш миқдорининг
    эллик бараваридан юз бараваригача миқдорда жарима" — Geldbuße von 50 bis 100 БРВ mit Einziehung der
    Tatwerkzeuge. Die Einziehung („мусодара") kann bei KI-Anwendungen die Hardware oder Datenträger erfassen;
    eine Beschränkung auf das Werkzeug im engeren Sinn enthält der Wortlaut nicht.

    '
  - 'Der Tatbestand unterscheidet NICHT nach Täterqualität (Bürger, Amtsträger, juristische Person) —
    anders als Abs. 1. Das ist gesetzestechnisch auffällig und wirft die Frage auf, ob juristische Personen
    überhaupt erfasst sind.

    '
  - 'Flankierend: Strafgesetzbuch Art. 141-1 (Verletzung der Unantastbarkeit des Privatlebens: rechtswidrige
    Sammlung oder Verbreitung von Angaben über das Privatleben nach vorheriger Verwaltungsahndung, 50
    bis 100 БРВ Geldstrafe, gemeinnützige Arbeit bis 300 Stunden oder Besserungsarbeit bis zwei Jahre;
    bei schweren Folgen oder Gewinnsucht bis drei Jahre Freiheitsstrafe) und Art. 141-2 (Verstoß gegen
    das Datenschutzrecht). Beide enthalten KEINE KI-Bezugnahme.

    '
