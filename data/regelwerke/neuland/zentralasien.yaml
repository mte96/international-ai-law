- id: kz-ki-konzeption-2024
  jurisdiktion: kz
  kurztitel: KI-Konzeption 2024–2029 (ПП № 592)
  offizieller_titel: 'Постановление Правительства Республики Казахстан „Об утверждении Концепции развития
    искусственного интеллекта на 2024 – 2029 годы" — Regierungsbeschluss über die Billigung der Konzeption
    zur Entwicklung der künstlichen Intelligenz für 2024–2029

    '
  fundstelle: 'Постановление Правительства Республики Казахстан от 24 июля 2024 года № 592

    '
  verfahrensnummer: '592'
  status: softlaw
  status_detail: 'In Kraft seit dem Tag der Unterzeichnung (Ziff. 4). Sie ist das Programmdokument, aus
    dem das KI-Gesetz von 2025 hervorgegangen ist: Richtung 5 der Konzeption („Regulierung der Rechtsverhältnisse
    im Bereich der künstlichen Intelligenz") beschreibt die Bausteine, die das Gesetz Nr. 230-VIII später
    tatsächlich enthält. Berichtspflicht des Ministeriums jährlich bis zum 1. Februar.

    '
  kurzbeschreibung: 'Fünf Richtungen: Daten, Infrastruktur, Humankapital, Forschung, Regulierung. Für
    das Rechtsverständnis wichtig ist, dass die Konzeption die Regulierungsziele bereits 2024 ausformuliert
    hat: Begriffsapparat, ethische Grundsätze, staatliche Regulierung, Verantwortlichkeit, Sicherheitsnormen,
    Übereinstimmung von KI-Produkten mit dem Recht des geistigen Eigentums, vereinfachte Einführungsmechanismen,
    Verhinderung krimineller Nutzung und KENNZEICHNUNG von mit KI erzeugten Ergebnissen und Produkten.
    Alle diese Punkte sind im Gesetz von 2025 wiederzufinden. Angekündigt, aber im Gesetz NICHT umgesetzt
    sind: eigene Ethiknormen, ein nationales Normungs- und Konformitätsbewertungssystem für KI-Produkte
    und ein Branchenrat für KI-Entwicklung.

    '
  inkrafttreten:
    datum: 2024-07-24
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/P2400000592
  themenachsen:
  - governance
  - urheberrecht
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Richtung 5 Ziff. 1: Katalog der zu regelnden Aspekte, darunter ausdrücklich „маркировка результатов
    и продуктов, полученных с применением или созданных с помощью искусственного интеллекта" — die Kennzeichnungspflicht,
    die Art. 21 KI-Gesetz später positiviert hat.

    '
  - 'Richtung 5 Ziff. 2: Ethiknormen zur Verhinderung jeder Art von Diskriminierung durch mangelhafte
    KI-Entscheidungen und zur Vereinbarkeit mit sittlichen, geistigen und kulturellen Werten. Ein solches
    Ethikdokument war bis 06.09.2026 nicht auffindbar.

    '
  - 'Richtung 5 Ziff. 3: Nationales Normungssystem und Konformitätsbewertung mit einem Mindestbestand
    technischer Anforderungen an KI-Produkte. Umgesetzt ist davon nur die Anbindung an die Normung über
    Art. 14 Ziff. 14 Digitalkodex.

    '
  - 'Richtung 5 Ziff. 4: Branchenrat für KI-Entwicklung als beratendes Gremium, unter anderem zur Bestimmung
    der prioritären Branchen. Das Gesetz hat diese Aufgabe statt dessen der Regierung (Art. 12 Ziff. 3)
    und dem Ministerium (Art. 13 Abs. 1 Ziff. 7) zugewiesen.

    '
  dokumente:
  - datum: 2024-07-24
    typ: leitlinie
    titel: 'Постановление Правительства РК от 24 июля 2024 года № 592 mit Anlage „Концепция развития искусственного
      интеллекта на 2024 – 2029 годы"

      '
