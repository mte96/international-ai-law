      '
  offene_punkte:
  - 'Die Verjährungsvorschrift des Art. 62 Abs. 2 КоАП nimmt juristische Personen bei Verstößen gegen
    das Datenschutzrecht und (nach dem Wortlaut) das Digitalrecht von der Verjährungsprivilegierung aus.
    Ob Art. 641-1 davon erfasst ist, war am Text nicht abschließend zu klären.

    '
  - 'Ob und wie oft Art. 641-1 seit Januar 2026 angewandt wurde, ist offen — die Sanktionsstatistik des
    Komitees für Rechtsstatistik der Generalstaatsanwaltschaft (qamqor.gov.kz / pravstat.gov.kz) war nicht
    erreichbar.

    '
