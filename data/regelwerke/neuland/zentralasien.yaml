- id: kz-maschinenlesbare-formen
  jurisdiktion: kz
  kurztitel: Regeln über maschinenlesbare Formen (Erlass 202/НҚ)
  offizieller_titel: 'Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового
    развития Республики Казахстан „Об утверждении Правил разработки, применения и распространения машиночитаемых
    форм" — Erlass über die Regeln für Entwicklung, Anwendung und Verbreitung maschinenlesbarer Formen

    '
  fundstelle: 'Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития
    РК от 15 апреля 2026 года № 202/НҚ; adilet-Kennung V2600038444

    '
  verfahrensnummer: 202/НҚ
  status: anwendbar
  status_detail: 'In Kraft; Ziff. 4: zehn Kalendertage nach Erstveröffentlichung. Ergangen auf Grundlage
    von Art. 22 Abs. 3 KI-Gesetz; Frist nach Anordnung Nr. 2-р war Januar 2026.

    '
  kurzbeschreibung: 'Der technisch wichtigste Durchführungsakt des kasachischen KI-Rechts. Er bestimmt,
    in welcher Gestalt der urheberrechtliche Trainingsvorbehalt nach Art. 23 Abs. 5 KI-Gesetz, die Deepfake-Kennzeichnung
    nach Art. 21 Abs. 2 und die Herstellerangabe bei Datenbibliotheken nach Art. 27 Abs. 5 zu erklären
    sind. Ziff. 5 nennt sechs zulässige Datenformate, verlangt eine gebilligte Datenschema-Definition,
    UTF-8 und maschinell prüfbare Pflichtfelder. Ziff. 9 wiederholt den Trainingsvorbehalt wörtlich.

    '
  inkrafttreten:
    datum: 2026-04-15
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/V2600038444
  themenachsen:
  - urheberrecht
  - content
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 'Ziff. 5: Zulässige Strukturierungsformate sind XML, JSON, RDF, CSV, YAML und JSON-LD; verlangt sind
    ferner eine gebilligte Datenschemadefinition, einheitliche Kodierung (UTF-8), maschinelle Prüfbarkeit
    der Pflicht- und Zusatzfelder und maschinenlesbare Metadaten, deren Zusammensetzung sich nach dem
    Zweck der Form, der Art der verarbeiteten Daten und den nationalen oder internationalen Normen richtet.
    Damit ist die kasachische Rechtsordnung eine der wenigen, die den Rechteinhaber-Vorbehalt FORMATSCHARF
    regelt — vergleichbare Konkretisierungen zu Art. 4 Abs. 3 DSM-RL fehlen in der EU.

    '
  - 'Ziff. 9: „Die Nutzung von Werken für das Training von KI-Modellen ist nur zulässig, wenn kein in
    maschinenlesbarer Form erklärter Vorbehalt des Urhebers oder Rechteinhabers vorliegt." Wortgleiche
    Wiederholung des Art. 23 Abs. 5 KI-Gesetz auf Verordnungsebene — der Vorbehalt gilt damit auch für
    die Anwendung der Regeln selbst und nicht nur für den Gesetzesvollzug.

    '
  - 'Ziff. 6 und 7: Änderungen an maschinenlesbaren Formen erfolgen durch Aktualisierung unter Wahrung
    der Abwärtskompatibilität; bei wesentlichen Strukturänderungen ist der Parallelbetrieb mehrerer Versionen
    zulässig; die Aktualisierungsfristen ergeben sich aus den Metadaten der Form selbst.

    '
  - 'Ziff. 10 und 11: Die Anwendung muss Korrektheit der automatisierten Verarbeitung, Reproduzierbarkeit
    der Ergebnisse, nachträgliche Kontroll- und Auditierbarkeit sowie Schutz vor unbefugter Datenänderung
    gewährleisten; das Anwendungsverfahren umfasst Identifikation und Authentifizierung der Datenquelle,
    Integritäts- und Echtheitsprüfung, Parsing und Schemaprüfung. Das ist faktisch eine Provenienz- und
    Integritätskette für Trainingsdaten.

    '
  - 'Ziff. 12: Über die Anwendung konkreter Typen maschinenlesbarer Formen entscheidet der Eigentümer
    und/oder Besitzer des KI-Systems. Die Regeln schreiben also keinen einheitlichen Standard vor, sondern
    einen Formatkorridor.

    '
  dokumente:
  - datum: 2026-04-15
    typ: norm
    titel: 'Приказ № 202/НҚ от 15 апреля 2026 года mit Anlage „Правила разработки, применения и распространения
      машиночитаемых форм"

      '
    url: https://adilet.zan.kz/rus/docs/V2600038444
    sprache: ru
    urheber: МИИЦР (Ж. Мадиев)
    verifiziert: true
    notiz: 'Die Vorschrift, an der die praktische Wirksamkeit des kasachischen TDM-Opt-out hängt.

      '
  offene_punkte:
  - 'Die Regeln sagen nicht, WO der Vorbehalt zu hinterlegen ist (Datei am Werk, robots.txt-artige Ressource,
    zentrales Register). Ziff. 12 überlässt die Wahl des Formats dem Systembetreiber, was die Frage aufwirft,
    wie ein Rechteinhaber einen Vorbehalt so erklärt, dass er von allen Trainingsbetreibern gelesen werden
    MUSS. Das ist der zentrale offene Punkt des kasachischen Urheberrechtsmodells.

    '
  - 'Die Regeln wurden bis Ziff. 12 gelesen; ein möglicher vierter Abschnitt über die Verbreitung maschinenlesbarer
    Formen ist nachzutragen.

    '
  monitoring_quellen:
  - https://adilet.zan.kz/rus/docs/V2600038444
  bezug_regelwerke:
