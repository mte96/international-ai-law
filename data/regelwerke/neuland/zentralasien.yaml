- id: uz-datenschutzgesetz
  jurisdiktion: uz
  kurztitel: Datenschutzgesetz Usbekistan (ЗРУ-547)
  offizieller_titel: 'Ўзбекистон Республикасининг „Шахсга доир маълумотлар тўғрисида"ги Қонуни / Закон
    Республики Узбекистан „О персональных данных" — Gesetz der Republik Usbekistan „Über personenbezogene
    Daten"

    '
  fundstelle: Закон Республики Узбекистан от 2 июля 2019 года № ЗРУ-547
  verfahrensnummer: ЗРУ-547 / ЎРҚ-547
  status: anwendbar
  status_detail: 'In Kraft. Nicht durch ЎРҚ-1115 geändert — die KI-Novelle hat das Datenschutzgesetz bewusst
    UNBERÜHRT gelassen und statt dessen im Informatisierungsgesetz und im Ordnungswidrigkeitenkodex angesetzt.
    Art. 24 (automatisierte Verarbeitung) stammt bereits aus der Fassung von 2019.

    '
  kurzbeschreibung: 'Das usbekische Datenschutzgesetz folgt eng dem Muster der DSGVO. Art. 24 enthält
    den Anspruch, keiner ausschließlich auf automatisierter Verarbeitung beruhenden Entscheidung unterworfen
    zu werden, die Rechte und berechtigte Interessen berührt und Rechtsfolgen erzeugt — mit drei Ausnahmen
    (schriftliche Einwilligung einschließlich elektronischer Form, Erfüllung eines Vertrags mit dem Verantwortlichen,
    gesetzliche Erlaubnis) und einem Widerspruchsrecht, das binnen ZEHN TAGEN schriftlich zu bescheiden
    ist. Bekannt ist Usbekistan ferner für seine Datenlokalisierungspflicht (Verarbeitung usbekischer
    Bürgerdaten auf im Inland befindlichen technischen Mitteln und in registrierten Datenbanken), die
    über Art. 46-2 Abs. 1 КоАО bußgeldbewehrt ist.

    '
  inkrafttreten:
    datum: 2019-10-01
    verifiziert: false
    quelle: https://lex.uz/ru/docs/4396428
  themenachsen:
  - datenschutz
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Art. 24 Abs. 1: „Субъект имеет право не подвергаться принятию решения на основании исключительно
    автоматизированной обработки его персональных данных, затрагивающей его права и законные интересы,
    порождающей юридические последствия" — mit Ausnahmen in Abs. 2. Praktisch wortgleich mit Art. 22 Abs.
    1 und 2 DSGVO.

    '
  - 'Art. 24 Abs. 3: Aufklärungspflicht über das Verfahren der ausschließlich automatisierten Entscheidung
    und deren mögliche Rechtsfolgen, Ermöglichung des Widerspruchs, Aufklärung über den Rechtsschutz.
    Abs. 4: Bescheidung des Widerspruchs und SCHRIFTLICHE Mitteilung des Ergebnisses BINNEN ZEHN TAGEN
    (Kasachstan: drei Arbeitstage nach Art. 19-1 Abs. 3 Datenschutzgesetz).

    '
  - 'Art. 21: Einwilligung in beliebiger Form, die den Erhalt belegbar macht; für BESONDERE Kategorien
    personenbezogener Daten Schriftform. Für eine ausschließlich automatisierte Entscheidung verlangt
    Art. 24 Abs. 2 ebenfalls Schriftform.

    '
  - 'Art. 23: Bei Weitergabe an Dritte Mitteilung an die betroffene Person binnen drei Tagen; entfällt
    unter anderem bei Erhebung aus ÖFFENTLICH ZUGÄNGLICHEN QUELLEN. Anders als Kasachstan (Art. 7 Abs.
    11 Datenschutzgesetz) kennt Usbekistan KEIN Verbot des zweckwidrigen Scrapings öffentlich zugänglicher
    Daten — für das Training von Modellen mit Webdaten ist das der wichtigste Unterschied zwischen den
    beiden Rechtsordnungen.

    '
  dokumente:
  - datum: 2019-07-02
    typ: konsolidiert
    titel: 'ЗРУ-547-сон 02.07.2019 „О персональных данных" (konsolidierte Fassung)

      '
    url: https://lex.uz/ru/docs/4396428
    sprache: ru
    urheber: lex.uz
    verifiziert: true
    notiz: 'Enthält Art. 24 im Wortlaut. Die Ausnahme für die Erhebung aus öffentlich zugänglichen Quellen
      (Art. 23) ist der Ansatzpunkt für die Frage nach der Zulässigkeit von Trainingsdatenerhebung.

      '
  offene_punkte:
  - 'Das Datum des Inkrafttretens (üblicherweise 01.10.2019) wurde nicht am Gesetzestext verifiziert.

    '
  - 'Ob das Datenschutzgesetz nach ЎРҚ-1115 angepasst werden soll (Art. 3 der Novelle verpflichtet nur
    das Ministerkabinett zur Anpassung von Regierungsbeschlüssen), war nicht feststellbar.

    '
