    и цифровизации»" — Anordnung des Premierministers über Maßnahmen zur Umsetzung der Gesetze vom 17.11.2025

    '
  fundstelle: 'Распоряжение Премьер-Министра Республики Казахстан от 14 января 2026 года № 2-р

    '
  verfahrensnummer: 2-р
  status: anwendbar
  status_detail: 'In Kraft. Unterzeichnet von Premierminister O. Bektenow. Sie verpflichtet die staatlichen
    Organe, die 23 aufgeführten Rechtsakte zu entwerfen bzw. zu erlassen, und schreibt eine monatliche
    Berichtspflicht vor. Der Umsetzungsstand konnte nicht geprüft werden.

    '
  kurzbeschreibung: 'Die Anordnung ist der Fahrplan der kasachischen KI-Durchführung. Sie listet 23 untergesetzliche
    Rechtsakte mit Frist „Januar 2026", davon 22 in der Verantwortung des Ministeriums für künstliche
    Intelligenz und digitale Entwicklung. Sie ist zugleich der einzige gefundene amtliche Beleg dafür,
    WELCHE Behörde der „уполномоченный орган в сфере искусственного интеллекта" des KI-Gesetzes ist. Die
    staatlichen Organe müssen monatlich bis zum 30. über den Stand berichten, das Justizministerium bis
    zum 5. des Folgemonats eine Gesamtübersicht veröffentlichen.

    '
  inkrafttreten:
    datum: 2026-01-14
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/R2600000002
  anwendungsdaten:
  - datum: 2026-01-31
    was_gilt: 'Frist „Januar 2026" für sämtliche 23 Rechtsakte des Anhangs. Die Anordnung nennt nur den
      Monat, keinen Tag.

      '
    verifiziert: true
    quelle: https://adilet.zan.kz/rus/docs/R2600000002
  themenachsen:
  - governance
  - sektor-oeffentlich
  - marktzugang
  - datenschutz
  regelungsschwerpunkte:
  - 'Ziff. 5 des Anhangs: Regierungsbeschluss über die Liste der PRIORITÄREN WIRTSCHAFTSSEKTOREN für die
    KI-Einführung (Art. 12 Ziff. 3 KI-Gesetz). Diese Liste steuert nach Art. 26 Abs. 3 KI-Gesetz zugleich
    den Zugang zu den staatlichen Rechenressourcen.

    '
  - 'Ziff. 6 des Anhangs: Ministerialerlass zur Änderung der „Regeln der Klassifizierung von Informatisierungsobjekten"
    — das ist die Rechtsgrundlage, nach der die Betreiber ihre KI-Systeme nach Art. 17 Abs. 1 KI-Gesetz
    selbst in die drei Risikostufen einordnen.

    '
  - 'Ziff. 8 des Anhangs: Liste der DOKUMENTATION für KI-Systeme (Art. 13 Abs. 1 Ziff. 5 und Art. 15 Abs.
    2 Ziff. 3 KI-Gesetz). Ziff. 9: Kriterien für die Einordnung von Informatisierungsobjekten ALS KI-Systeme
    (Art. 13 Abs. 1 Ziff. 6 KI-Gesetz) — ohne diese Kriterien ist der sachliche Anwendungsbereich des
    Gesetzes offen.

    '
  - 'Ziff. 11 des Anhangs: Regeln über Entwicklung, Anwendung und Verbreitung MASCHINENLESBARER FORMEN
    (Art. 22 Abs. 3 KI-Gesetz). Diese Regeln tragen sowohl die Kennzeichnungspflicht (Art. 21 Abs. 2)
    als auch den urheberrechtlichen Trainingsvorbehalt (Art. 23 Abs. 5). Solange sie fehlen, ist unklar,
    wie ein Rechteinhaber den Vorbehalt wirksam erklärt.

    '
  - 'Ziff. 12 des Anhangs: Regeln, nach denen die Ressortbehörden die Listen vertrauenswürdiger Hochrisiko-KI
    bilden und veröffentlichen (Art. 19 Abs. 1 KI-Gesetz).

    '
  - 'Ziff. 7 des Anhangs: Änderung der Regeln über das Audit von Informationssystemen (Anknüpfung für
    Art. 20 KI-Gesetz). Ziff. 10 und 13: Regeln über den Zugang zu Rechenressourcen und über die Zusammenarbeit
    des Plattformbetreibers mit Privaten (Art. 25 Abs. 2, Art. 26 Abs. 1 KI-Gesetz).

    '
  - 'Ziff. 16 bis 20 des Anhangs: fünf datenschutzrechtliche Ministerialerlasse (Schutzmaßnahmen, Erhebungs-
    und Verarbeitungsregeln, staatlicher Zugriffskontrolldienst, Datenminimierungsliste, Meldung von Datenschutzverletzungen)
    — sie zeigen, dass die kasachische KI-Regulierung praktisch als Datenschutzregulierung vollzogen wird.

    '
  dokumente:
  - datum: 2026-01-14
    typ: delegiert
    titel: 'Распоряжение Премьер-Министра Республики Казахстан от 14 января 2026 года № 2-р mit Anhang
      (Liste von 23 Rechtsakten)

      '
