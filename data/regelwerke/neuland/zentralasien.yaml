- id: kz-zugang-information
  jurisdiktion: kz
  kurztitel: Gesetz über den Zugang zu Informationen (Nr. 401-V)
  offizieller_titel: 'Закон Республики Казахстан „О доступе к информации" — Gesetz der Republik Kasachstan
    „Über den Zugang zu Informationen"

    '
  fundstelle: Закон Республики Казахстан от 16 ноября 2015 года № 401-V ЗРК
  verfahrensnummer: 401-V
  status: anwendbar
  status_detail: 'In Kraft. Es enthält keine KI-spezifische Vorschrift. Seine Bedeutung für das KI-Recht
    liegt in der Verzahnung mit Art. 21 Abs. 3 der Verfassung 2026 und mit den Auskunftsansprüchen des
    Art. 16 KI-Gesetz und des Art. 43 Digitalkodex: Der Anspruch auf Erklärung einer algorithmischen Entscheidung
    gegenüber einer Behörde läuft über dieses Gesetz.

    '
  kurzbeschreibung: 'Regelt den Zugang zu Informationen bei staatlichen Stellen, Quasistaats- und marktbeherrschenden
    Unternehmen. Für den KI-Einsatz in der Verwaltung ist es die Anspruchsgrundlage, über die Betroffene
    Informationen über eingesetzte Systeme, Kriterien und Datengrundlagen erlangen können — soweit nicht
    die Ausnahme des Art. 43 Abs. 4 Ziff. 2 Digitalkodex (keine Offenlegung von Algorithmen, Quellcode
    und geschützten Geheimnissen) entgegensteht.

    '
  inkrafttreten:
    datum: 2016-01-01
    verifiziert: false
    quelle: https://adilet.zan.kz/rus/docs/Z1500000401
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Das Gesetz kennt keine Kategorie „algorithmische Entscheidung". Der Auskunftsanspruch ist auf „Informationen"
    gerichtet; ob Modellparameter, Trainingsdatenbeschreibungen oder Risikoeinstufungen darunterfallen,
    ist ungeklärt.

    '
  - 'Kollisionsnorm: Art. 43 Abs. 4 Ziff. 2 Digitalkodex schließt die Offenlegung von Algorithmen und
    Quellcode ausdrücklich aus. Diese spätere und speziellere Vorschrift begrenzt den Informationszugangsanspruch
    für den KI-Bereich.

    '
  dokumente:
  - datum: 2015-11-16
    typ: konsolidiert
    titel: 'Закон Республики Казахстан от 16 ноября 2015 года № 401-V ЗРК „О доступе к информации"

      '
    url: https://adilet.zan.kz/rus/docs/Z1500000401
    sprache: ru
    urheber: ИПС „Әділет"
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung. Wurde nur der Kopf des Dokuments geprüft, nicht der Volltext auf
      KI-Bezugspunkte durchsucht.
  offene_punkte:
  - 'Volltextauswertung steht aus. Zu prüfen wäre insbesondere, ob die Liste der zwingend zu veröffentlichenden
    Informationen (offene Daten) durch den Digitalkodex um Angaben zu eingesetzten algorithmischen Systemen
    erweitert wurde.

    '
