- id: tr-6563
  jurisdiktion: tr
  kurztitel: Türkisches E-Commerce-Gesetz (Nr. 6563)
  offizieller_titel: 'Elektronik Ticaretin Düzenlenmesi Hakkında Kanun, Kanun No. 6563 — Gesetz über die
    Regelung des elektronischen Handels Nr. 6563

    '
  fundstelle: 'Kanun No. 6563; konsolidierte Fassung auf mevzuat.gov.tr (Dokumentkennung 1.5.6563). Vollzug
    durch das Handelsministerium.

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT. Nach der Novelle von 2022 enthält das Gesetz Vorgaben für Vermittlungsdienstleister
    und Marktplätze, unter anderem zur Transparenz von Rangfolgekriterien und zur Nutzung von Daten aus
    dem Marktplatzbetrieb — die praktisch nächstliegende türkische Norm für algorithmische Empfehlungs-
    und Ranking-Systeme.

    '
  kurzbeschreibung: 'Regelt Informationspflichten, kommerzielle Kommunikation, Verantwortlichkeit von
    Vermittlungsdienstleistern und — seit 2022 — besondere Pflichten für elektronische Marktplätze (Rangfolgetransparenz,
    Datennutzungsverbote, Werbe- und Rabattgrenzen, Lizenzpflicht ab Umsatzschwellen).

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.6563.pdf
  themenachsen:
  - vertrag
  - wettbewerb
  - content
  regelungsschwerpunkte:
  - 'Rangfolgetransparenz für Marktplätze — funktional das türkische Gegenstück zu Art. 27 DSA und Art.
    5 P2B-VO und damit die einzige geltende türkische Norm, die algorithmische Ordnung ausdrücklich erfasst.

    '
