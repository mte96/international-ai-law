regelwerke:
- id: ae-ki-strategie-2031
  jurisdiktion: ae
  kurztitel: Nationale KI-Strategie 2031
  offizieller_titel: 'UAE National Strategy for Artificial Intelligence 2031 / الاستراتيجية الوطنية للذكاء
    الاصطناعي 2031 — Nationale Strategie der Vereinigten Arabischen Emirate für künstliche Intelligenz
    2031

    '
  fundstelle: 'Herausgegeben vom Office of the Minister of State for Artificial Intelligence; angekündigt
    auf dem World Government Summit im Februar 2018, Strategiedokument in der heute veröffentlichten Fassung
    auf dem amtlichen Regierungsportal u.ae und auf ai.gov.ae. Keine Veröffentlichung im Amtsblatt, kein
    Rechtsakt.

    '
  status: softlaw
  status_detail: 'Regierungsstrategie ohne Rechtssatzform. Sie ist der politische Rahmen, auf den sich
    sämtliche späteren KI-Dokumente der VAE berufen, begründet aber selbst keine Pflichten Privater. Das
    Strategiedokument nennt als achtes Ziel ausdrücklich „strong governance and effective regulation"
    und schlägt einen zwischenstaatlichen KI-Sachverständigenrat nach dem Vorbild des IPCC vor — die VAE
    haben also von Anfang an internationale statt nationaler Regulierung angestrebt.

    '
  kurzbeschreibung: 'Acht Ziele: KI-Standortmarke („UAE AI Seal"), KI in Schwerpunktsektoren (Ressourcen,
    Logistik, Tourismus, Gesundheit, Cybersicherheit), Ökosystem, KI in Verwaltungs- dienstleistungen,
    Talentgewinnung, Forschung, Daten- und Infrastrukturbereitstellung („testbed nation") sowie Governance
    und Regulierung. Adressat ist die Bundesverwaltung; Sanktionen sieht das Dokument nicht vor. Wirtschaftliches
    Zielvolumen: bis zu 335 Mrd. AED zusätzliche Wertschöpfung.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://ai.gov.ae/strategy/
  themenachsen:
  - governance
  - sektor-oeffentlich
  - marktzugang
  regelungsschwerpunkte:
  - 'Ziel 4: Einsatz von KI in sämtlichen Verwaltungsdienstleistungen.'
  - 'Ziel 8: „Ensure governance and effective regulation" — vorgesehen sind eine nationale Governance-Überprüfung
    durch den KI- und Blockchain-Rat sowie ein „Intergovernmental Panel on Artificial Intelligence" nach
    IPCC-Vorbild mit durchsetzbaren internationalen Standards. Die VAE begründen damit ausdrücklich, warum
    sie kein eigenes horizontales KI-Gesetz erlassen.

    '
  - 'Ziel 1: „UAE AI Seal" als staatliches Gütezeichen für ethisch und qualitativ geprüfte KI-Unternehmen
    — ein Zertifizierungs- und kein Verbotsansatz.

    '
  dokumente:
  - datum: null
    typ: bericht
    titel: UAE National Strategy for Artificial Intelligence 2031 (Strategiedokument)
    url: https://assets.u.ae/api/public/content/deed2bf9d68244ab8119c27f2c52813f?v=87559d49
    sprache: en
    urheber: Office of the Minister of State for Artificial Intelligence, VAE
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen und gelesen. Amtliche Dateiablage des Regierungsportals u.ae. Das
      Dokument selbst trägt kein Datum auf dem Titelblatt; die Jahresangabe 2018 ergibt sich aus dem Text
      (World Government Summit Februar 2018).

      '
  - datum: null
    typ: uebersicht
    titel: UAE National Strategy for AI 2031 — Übersichtsseite des National Program for AI
    url: https://ai.gov.ae/strategy/
    sprache: en
    urheber: National Program for Artificial Intelligence (ai.gov.ae)
    verifiziert: true
    notiz: Am 06.09.2026 abgerufen; nennt die acht Ziele und das Volumen von 335 Mrd. AED.
  offene_punkte:
  - 'Das exakte Beschlussdatum und die Beschlussform (Kabinettsbeschluss? bloße Ankündigung des Premierministers?)
    sind aus den amtlichen Seiten nicht ersichtlich. Weder u.ae noch ai.gov.ae nennen eine Kabinettsentschließungsnummer.
    Deshalb `inkrafttreten.datum: null`.

    '
  - 'Ob die Strategie 2023/2024 fortgeschrieben wurde (es kursieren Verweise auf eine „AI Strategy 2031
    refresh"), ließ sich nicht belegen.

    '
