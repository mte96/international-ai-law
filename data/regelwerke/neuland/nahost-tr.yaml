  kurztitel: Türkisches Internetgesetz (Nr. 5651)
  offizieller_titel: 'İnternet Ortamında Yapılan Yayınların Düzenlenmesi ve Bu Yayınlar Yoluyla İşlenen
    Suçlarla Mücadele Edilmesi Hakkında Kanun, Kanun No. 5651 — Gesetz über die Regelung von Veröffentlichungen
    im Internet und die Bekämpfung der dadurch begangenen Straftaten

    '
  fundstelle: 'Kanun No. 5651; konsolidierte Fassung auf mevzuat.gov.tr (Dokumentkennung 1.5.5651). Vollzug
    durch die Bilgi Teknolojileri ve İletişim Kurumu (BTK) und die Erişim Sağlayıcıları Birliği.

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT. Es ist der zentrale Durchsetzungsmechanismus gegen KI-erzeugte Inhalte
    in der Türkei: Sperr- und Löschanordnungen ergehen binnen Stunden, seit 2020 auch gegen ausländische
    Plattformen mit Vertretungspflicht, Bandbreitendrosselung und Bußgeldern. Wer in der Türkei gegen
    einen Deepfake vorgeht, geht praktisch über dieses Gesetz und nicht über das Strafrecht.

    '
  kurzbeschreibung: 'Regelt Verantwortlichkeit von Zugangs-, Hosting- und Inhalteanbietern, Sperr- und
    Löschverfahren (Art. 8, 8/A, 9, 9/A), Vertretungspflicht ausländischer sozialer Netzwerke, Datenlokalisierung
    für Nutzerdaten sowie Bußgelder und Bandbreitendrosselung. Art. 9 ermöglicht die Löschung persönlichkeitsrechtsverletzender
    Inhalte binnen 24 Stunden, Art. 9/A die Sperrung bei Verletzung des Privatlebens binnen vier Stunden.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.5651.pdf
  themenachsen:
  - content
  - grundrechte
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'Art. 9 und 9/A sind die schnellsten Rechtsbehelfe gegen Deepfakes im türkischen Recht — schneller
    als jedes zivilrechtliche Eilverfahren.

    '
  - 'Die 2020 eingeführte Vertretungspflicht macht die Anordnungen gegenüber ausländischen Plattformen
    faktisch durchsetzbar.

    '
  dokumente:
