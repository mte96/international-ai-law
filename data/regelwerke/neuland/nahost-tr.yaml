    Regulation — Bundesdekretgesetz über die Regelung der Medien

    '
  fundstelle: 'NUMMER UND JAHR NICHT BELEGT. Das Gesetz wird auf der Startseite des amtlichen Rechtsportals
    uaelegislation.gov.ae unter „Latest legislation" an erster Stelle geführt (Abruf 06.09.2026); eine
    Nummer nennt die Startseite nicht, und die Portalsuche antwortet auf jede Anfrage mit Query-String
    mit HTTP 403.

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT bis auf die Existenz. Das Mediengesetz und die Rechtsakte des Media Regulatory
    Office sind für KI-erzeugte Medieninhalte in den VAE die vorrangige verwaltungsrechtliche Ebene: Medieninhalte
    unterliegen einer Zulassungs- und Inhaltskontrolle, die neben das Cyberstrafrecht tritt. Der Text
    wurde nicht gelesen.

    '
  kurzbeschreibung: 'Regelt die Medientätigkeit in den VAE — Zulassung von Medienunternehmen und -tätigkeiten,
    Inhaltsstandards, Werbung und Sanktionen. Ob es Kennzeichnungspflichten für KI-erzeugte Inhalte enthält,
    ist ungeprüft.

    '
