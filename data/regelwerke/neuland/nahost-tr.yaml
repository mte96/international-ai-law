  kurztitel: ADGM-Leitlinien für Finanzinstitute zu neuen Technologien (2021)
  offizieller_titel: 'Guidelines for Financial Institutions adopting Enabling Technologies — Leitlinien
    für Finanzinstitute, die Ermöglichungstechnologien einsetzen

    '
  fundstelle: 'Financial Services Regulatory Authority (FSRA) des ADGM, veröffentlicht am 14.11.2021;
    geführt im amtlichen Verzeichnis adgm.com/legal-framework/guidance-and-policy-statements.

    '
  status: softlaw
  status_detail: 'Aufsichtsleitlinie der FSRA. Sie ist die einzige KI-nahe Aufsichtsäußerung des ADGM:
    Sie behandelt den Einsatz von KI und maschinellem Lernen, APIs, Cloud und verteilten Registern durch
    beaufsichtigte Finanzinstitute und formuliert Erwartungen an Governance, Modellrisiko, Erklärbarkeit,
    Datenqualität und Auslagerung. Leitlinien der FSRA sind formal unverbindlich, werden aber in Aufsichtsverfahren
    als Maßstab herangezogen.

    '
  kurzbeschreibung: 'Erwartungen der Aufsicht an Finanzinstitute, die KI, maschinelles Lernen, Cloud-Dienste,
    APIs und Distributed-Ledger-Technologie einsetzen: Verantwortung der Geschäftsleitung, Risikobewertung
    vor Einführung, Modellvalidierung, Nachvollziehbarkeit von Entscheidungen, Umgang mit Verzerrungen
    und Auslagerungs- anforderungen.

    '
