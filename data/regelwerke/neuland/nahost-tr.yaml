      '
  offene_punkte:
  - 'Ob die Durchführungsverordnung zwischen Mai 2026 und dem 06.09.2026 erlassen wurde, konnte NICHT
    geprüft werden: uaelegislation.gov.ae beantwortet jede Suchanfrage mit Query-String mit HTTP 403,
