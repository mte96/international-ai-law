- id: tr-kvkk-yz-tavsiyeler
  jurisdiktion: tr
  kurztitel: KVKK-Empfehlungen zum Datenschutz im KI-Bereich
  offizieller_titel: 'Yapay Zekâ Alanında Kişisel Verilerin Korunmasına Dair Tavsiyeler — Empfehlungen
    zum Schutz personenbezogener Daten im Bereich der künstlichen Intelligenz

    '
  fundstelle: 'Kişisel Verileri Koruma Kurumu (KVKK); kvkk.gov.tr/Icerik/7048/Yapay-Zeka-Alaninda-Kisisel-Verilerin-Korunmasina-Dair-Tavsiyeler

    '
  status: softlaw
  status_detail: 'VERIFIZIERT (Text am 06.09.2026 abgerufen und gelesen; das Veröffentlichungsdatum steht
    nicht auf der Seite). Dies ist das EINZIGE KI-spezifische Dokument einer türkischen Aufsichtsbehörde,
    das im Volltext belegt werden konnte, und zugleich das materiell dichteste türkische KI-Dokument überhaupt.
    Es ist unverbindlich, wird aber von der KVKK in Verfahren als Auslegungsmaßstab herangezogen. Es stützt
    sich ausdrücklich auf die Leitlinien des Europarats zu KI und Datenschutz, die OECD-Empfehlung, die
    Ethik-Leitlinien der EU-Expertengruppe, das KI-Weißbuch der Europäischen Kommission und die Stellungnahme
    4/2020 des EDSB — der türkische Text ist damit vollständig europäisch abgeleitet.

    '
  kurzbeschreibung: 'Drei Adressatenkreise: allgemeine Empfehlungen, Empfehlungen für Entwickler, Hersteller
    und Diensteanbieter sowie Empfehlungen für Entscheidungsträger. Inhaltlich: Achtung der Grund- und
    Menschenrechte, Rechtmäßigkeit, Redlichkeit, Verhältnismäßigkeit, Rechenschaft und Transparenz, Fokus
    auf Risikoprävention, Datenschutz-Folgenabschätzung („mahremiyet etki değerlendirmesi"), Datenschutz
    durch Technikgestaltung, verschärfte Maßnahmen bei besonderen Datenkategorien, Vorrang der Anonymisierung,
    frühzeitige Bestimmung der Rollen von Verantwortlichem und Auftragsverarbeiter.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.kvkk.gov.tr/Icerik/7048/Yapay-Zeka-Alaninda-Kisisel-Verilerin-Korunmasina-Dair-Tavsiyeler
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Für Entwickler: „Münhasıran otomatik işlemeye dayalı kararlardan korunma sağlanmalıdır" — Schutz
    vor ausschließlich auf automatisierter Verarbeitung beruhenden Entscheidungen; „Bireylere itiraz hakkı
    tanınmalıdır" — den Betroffenen ist ein Einspruchsrecht einzuräumen; „Veri işleme faaliyetini durdurabilme
    hakkı tanınmalıdır" — ein Recht, die Verarbeitung anzuhalten.

    '
  - 'Für Entwickler: Vermeidung von Diskriminierungsrisiken und Verzerrungen; Datenminimierung; fortlaufende
    Überwachung der Modellgenauigkeit; sorgfältige Bewertung aus ihrem Kontext gelöster Algorithmen; Einbindung
    akademischer Einrichtungen und unabhängiger Sachverständiger; aktive Beteiligung der betroffenen Personen
    und Gruppen an der Risikobewertung.

    '
  - 'Für Entscheidungsträger: Rechenschaft auf allen Stufen, Risikobewertungsverfahren, Verhaltensregeln
    und Zertifizierungsmechanismen, Festlegung der Rolle menschlichen Eingreifens, Schutz der Freiheit
    des Einzelnen, den Empfehlungen der KI NICHT zu vertrauen („Bireylerin yapay zekâ önerilerine güvenmeme
    özgürlüğü korunmalıdır") — eine bemerkenswerte, in europäischen Texten so nicht formulierte Ausprägung
    des Automatisierungsverzerrungsproblems.

    '
  - 'Für Entscheidungsträger: Anrufung der Aufsichtsbehörden bei erheblicher Beeinträchtigung von Grundrechten
    und Förderung der Zusammenarbeit zwischen Aufsichtsbehörden.

    '
  - 'Allgemein: Vorrang der Anonymisierung, wenn dasselbe Ergebnis ohne Verarbeitung personenbezogener
    Daten erreichbar ist.

    '
