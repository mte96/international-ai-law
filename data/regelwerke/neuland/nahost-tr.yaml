  kurztitel: Türkisches Urheberrechtsgesetz (Nr. 5846)
  offizieller_titel: 'Fikir ve Sanat Eserleri Kanunu, Kanun No. 5846 — Gesetz über Werke der Wissenschaft
    und Kunst Nr. 5846

    '
  fundstelle: 'Kanun No. 5846; konsolidierte Fassung auf mevzuat.gov.tr (Dokumentkennung 1.3.5846). Zuständig
    ist die Generaldirektion für Urheberrecht des Kultur- und Tourismusministeriums (telifhaklari.gov.tr).

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT. Geltendes Urheberrecht der Türkei von 1951, seither vielfach geändert.
    Es enthält KEINE Text- und Data-Mining-Schranke und keine Regelung über KI-Erzeugnisse. Nach Art.
    1/B Buchst. a setzt der Werkbegriff die „Eigenart des Urhebers" („sahibinin hususiyetini taşıyan")
    voraus — das wird einhellig als Erfordernis einer menschlichen Schöpfung gelesen, sodass KI-Erzeugnisse
    ohne menschlichen Gestaltungsbeitrag schutzlos sind.

    '
  kurzbeschreibung: 'Regelt Werkarten (Wissenschaft und Literatur einschließlich Computerprogrammen, Musik,
    bildende Kunst, Filmwerke), Urheberpersönlichkeits- und Verwertungsrechte, Schranken, Dauer (Leben
    plus 70 Jahre), verwandte Schutzrechte, Verwertungs- gesellschaften sowie zivil- und strafrechtliche
    Sanktionen (Art. 71 ff.).

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.mevzuat.gov.tr/MevzuatMetin/1.3.5846.pdf
  themenachsen:
  - urheberrecht
  - content
  - haftung
  regelungsschwerpunkte:
  - 'Werkbegriff mit Eigenartserfordernis („sahibinin hususiyetini taşıyan") — die Norm, an der die Schutzfähigkeit
    von KI-Erzeugnissen in der Türkei scheitert.

    '
  - 'Keine TDM-Schranke: Trainingsnutzungen sind am Vervielfältigungsrecht (Art. 22) und an der engen
    Schranke für den persönlichen Gebrauch (Art. 38) zu messen; Art. 38 schließt eine gewerbliche Nutzung
    ausdrücklich aus.

    '
