- id: tr-tck-5237
  jurisdiktion: tr
  kurztitel: Türkisches Strafgesetzbuch (Nr. 5237)
  offizieller_titel: 'Türk Ceza Kanunu, Kanun No. 5237 — Türkisches Strafgesetzbuch Nr. 5237

    '
  fundstelle: 'Kanun No. 5237; konsolidierte Fassung auf mevzuat.gov.tr (Dokumentkennung 1.5.5237).

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT. Es ist die Norm, an der Deepfakes in der Türkei strafrechtlich gemessen
    werden. Ein eigener Deepfake-Tatbestand besteht nach dem Kenntnisstand bis Mai 2026 NICHT; erfasst
    wird über die Tatbestände der Verletzung der Privatsphäre, der unbefugten Aufzeichnung und Weitergabe
    personenbezogener Daten, der Beleidigung, der Obszönität und der öffentlichen Verbreitung irreführender
    Informationen.

    '
  kurzbeschreibung: 'Für KI einschlägig sind namentlich Art. 134 (Verletzung der Privatsphäre, mit Qualifikation
    bei Bild- und Tonaufzeichnung), Art. 135 (unbefugtes Aufzeichnen personenbezogener Daten), Art. 136
    (unbefugte Weitergabe oder Erlangung personenbezogener Daten), Art. 138 (Nichtlöschung von Daten),
    Art. 125 (Beleidigung), Art. 226 (Obszönität, mit besonderem Kinderschutztatbestand) und Art. 217/A
    (öffentliche Verbreitung irreführender Informationen, eingefügt 2022).

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.5237.pdf
  themenachsen:
  - content
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 226 (müstehcenlik) erfasst nach seinem Wortlaut auch Darstellungen, die keine reale Person abbilden
    — damit ist er der Anknüpfungspunkt für synthetische Missbrauchsdarstellungen.

    '
  - 'Art. 136 ist die in der türkischen Praxis am häufigsten angewandte Datenschutzstrafnorm und der Kanal,
    über den Trainingsdatenbeschaffung strafrechtlich relevant werden kann.

    '
  - 'Art. 217/A wurde durch das Gesetz Nr. 7418 (2022) eingefügt und ist der türkische Desinformationstatbestand;
    er wird in der Praxis auch auf KI-erzeugte Falschinformationen angewandt.

    '
  dokumente:
  - datum: null
    typ: konsolidiert
    titel: 5237 sayılı Türk Ceza Kanunu
    url: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.5237.pdf
    sprache: tr
    urheber: Mevzuat Bilgi Sistemi
    verifiziert: false
    notiz: Nicht abrufbar (siehe Kopfkommentar).
  offene_punkte:
  - 'Artikelnummern und -wortlaute sind unbelegt; insbesondere ist zu prüfen, ob seit 2024/2025 ein ausdrücklicher
    Deepfake-Tatbestand eingefügt wurde. Der Auftragstext nennt eine „Novelle zum Deepfake-Straftatbestand,
    falls erlassen" — das konnte weder bestätigt noch ausgeschlossen werden.

    '
