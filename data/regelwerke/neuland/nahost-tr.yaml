- id: sa-sdaia
  jurisdiktion: sa
  kurztitel: SDAIA — Saudische Daten- und KI-Behörde
  offizieller_titel: 'الهيئة السعودية للبيانات والذكاء الاصطناعي — al-Hayʾa al-Suʿūdiyya lil-bayānāt wa-l-dhakāʾ
    al-iṣṭināʿī — Saudi Data and Artificial Intelligence Authority (SDAIA)

    '
  fundstelle: 'Errichtet durch Königliche Anordnung (أمر ملكي). Behördenseite: sdaia.gov.sa. Unter dem
    Dach der SDAIA stehen das National Data Management Office (NDMO), das National Center for AI (NCAI)
    und das National Information Center (NIC).

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT im Detail. Die SDAIA ist die zentrale Stelle des saudischen KI- und Datenrechts:
    sie ist zugleich Datenschutz- aufsicht (PDPL), Normgeber der Datengovernance und Urheber sämtlicher
    KI-Leitlinien. Diese Ämterhäufung ist der Grund, warum saudisches KI-Soft-Law faktisch bindend wirkt:
    Wer die KI-Leitlinien der SDAIA missachtet, riskiert die datenschutzrechtliche Aufsicht derselben
    Behörde.

    '
  kurzbeschreibung: 'Zuständig für die nationale Datenstrategie, die KI-Strategie, die Datengovernance
    des öffentlichen Sektors, die Aufsicht über das Datenschutzgesetz und die Herausgabe der KI-Ethikgrundsätze
    und KI-Leitlinien. Sie betreibt zugleich staatliche KI-Vorhaben (u.a. das arabische Sprachmodell ALLaM),
    ist also Aufsicht und Entwickler in einer Hand.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
