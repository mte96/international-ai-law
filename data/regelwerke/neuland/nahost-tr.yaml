  offizieller_titel: 'Data Protection Regulations 2021 (Abu Dhabi Global Market) — Datenschutzverordnung
    2021 des Abu Dhabi Global Market

    '
  fundstelle: 'Verordnung des ADGM Board of Directors; sie ersetzt die Data Protection Regulations 2015.
    Vorbereitet durch das Konsultations- papier Nr. 6 von 2020 („New Data Protection Regulatory Framework",
    Konsultation geschlossen am 19.12.2020), geändert nach dem Konsultationspapier Nr. 6 von 2025 („Substantial
    Public Interest Rules", geschlossen am 02.07.2025).

    '
  status: anwendbar
  status_detail: 'FREIZONENRECHT. Zweites, vom DIFC unabhängiges DSGVO-Äquivalent in den VAE, mit eigener
    Aufsicht (ADGM Office of Data Protection). Anders als das DIFC hat das ADGM KEINE KI-spezifische Norm
    in sein Datenschutzrecht aufgenommen; das ist der wesentliche Unterschied zwischen beiden Freizonen
    und ein Argument gegen die Annahme, die Freizonen zögen einheitlich nach.

    '
  kurzbeschreibung: 'Vollständiges Datenschutzregime für das ADGM: Rechtmäßigkeit, besondere Datenkategorien,
    Betroffenenrechte, Datenschutz- beauftragter, Meldepflichten, Drittlandtransfer, Sanktionen. Die Änderung
    von 2025 fügt weitere Tatbestände des „substantial public interest" als Rechtsgrundlage für die Verarbeitung
    besonderer Datenkategorien ein.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.adgm.com/legal-framework/public-consultations
