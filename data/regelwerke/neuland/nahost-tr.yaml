      '
  offene_punkte:
  - 'WICHTIGSTER OFFENER PUNKT DIESER DATEI FÜR DIE VAE: Der Wortlaut von Regulation 10, sein Erlassdatum,
    sein Inkrafttreten und die Änderungsverordnung von 2023 sind NICHT belegt. Ohne diesen Text lässt
