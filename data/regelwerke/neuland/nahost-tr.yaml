    '
  fundstelle: 'NICHT BELEGT. Das Breitenscreening (96_weltscreening.yaml) stützt sich allein auf den Global
    Legal Monitor der Library of Congress vom 25.03.2026; diese Seite antwortete am 06.09.2026 mit HTTP
    403. Eine Beschlussnummer ist dort nach dem Screening nicht genannt.

    '
  verfahrensnummer: null
  status: verabschiedet
  status_detail: 'UNVERIFIZIERT. Die Existenz dieses Beschlusses ließ sich an keiner amtlichen Quelle
    nachweisen: uaelegislation.gov.ae beantwortet jede Suchanfrage mit Query-String mit HTTP 403, u.ae
    führt keine Wahlrechtsseite zu KI, wam.ae liefert seine Artikel nur clientseitig und ist deshalb nicht
    lesbar, loc.gov antwortet 403. Der Eintrag ist als HINWEIS für den nächsten Bearbeiter aufgenommen,
    nicht als belegter Befund.

    '
  kurzbeschreibung: 'Nach dem (ungeprüften) Screeningbefund soll der Ministerrat im März 2026 verbindliche
