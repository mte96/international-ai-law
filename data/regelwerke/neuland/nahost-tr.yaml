  offizieller_titel: 'Ulusal Yapay Zekâ Stratejisi 2021–2025 — Nationale Strategie für künstliche Intelligenz
    2021–2025

    '
  fundstelle: 'Herausgegeben vom Digitalisierungsamt des Präsidialamts (Cumhurbaşkanlığı Dijital Dönüşüm
    Ofisi, CBDDO) gemeinsam mit dem Ministerium für Industrie und Technologie; nach dem Kenntnisstand
    durch ein Präsidialrundschreiben (Cumhurbaşkanlığı Genelgesi) im Resmî Gazete bekanntgemacht. Portal:
    cbddo.gov.tr.

    '
  status: softlaw
  status_detail: 'UNVERIFIZIERT. Strategie ohne Rechtssatzform mit sechs strategischen Prioritäten und
    Maßnahmenpaketen bis 2025; als Ziel unter anderem ein Anteil der KI-Wertschöpfung von 5 % am BIP und
    50 000 Beschäftigte im KI-Bereich. Ob eine Fortschreibung (2026 ff.) beschlossen wurde, war nicht
    feststellbar; cbddo.gov.tr war aus dieser Umgebung nicht erreichbar.

    '
  kurzbeschreibung: 'Sechs Prioritäten: Ausbildung von KI-Fachkräften und Beschäftigung, Förderung von
    Forschung und Innovation, Zugang zu hochwertigen Daten und technischer Infrastruktur, Regulierung
    zur Beschleunigung sozioökonomischer Anpassung, internationale Zusammenarbeit, Beschleunigung struktureller
    und arbeitsmarktbezogener Umgestaltung. Rechtsfolgen entstehen nicht.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://cbddo.gov.tr/
