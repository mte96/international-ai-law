- id: ae-strafgesetz-31-2021
  jurisdiktion: ae
  kurztitel: Strafgesetzbuch der VAE (Nr. 31/2021)
  offizieller_titel: 'مرسوم بقانون اتحادي بإصدار قانون الجرائم والعقوبات — Federal Decree-Law Promulgating
    the Crimes and Penalties Law — Bundesdekretgesetz zum Erlass des Gesetzes über Straftaten und Strafen
    (Nr. 31 von 2021)

    '
  fundstelle: 'Erlassen am 20.09.2021; Amtsblatt Nr. 712 (ملحق) vom 26.09.2021; in Kraft seit 02.01.2022;
    letzte Aktualisierung der Portalfassung 01.10.2025. Portalseite: uaelegislation.gov.ae/en/legislations/1529.

    '
  status: anwendbar
  status_detail: 'Allgemeines Strafgesetzbuch. Es enthält keine KI-spezifische Norm, liefert aber die
    Auffangtatbestände für KI-gestützte Täuschung (Betrug, Urkundenfälschung, Beleidigung, Verleumdung),
    auf die zurückgegriffen wird, soweit das Cyberkriminalitätsgesetz nicht greift.

    '
  kurzbeschreibung: 'Kodifiziert das materielle Strafrecht der VAE. Für KI einschlägig sind die Tatbestände
    über Betrug und Vermögensschädigung durch Täuschung, über Fälschung von Urkunden und Aufzeichnungen
    sowie über Ehrverletzungsdelikte. Das Portal weist ausdrücklich darauf hin, dass im Auslegungsfall
    der arabische Text maßgeblich ist.

    '
  inkrafttreten:
    datum: 2022-01-02
    verifiziert: true
    quelle: https://uaelegislation.gov.ae/en/legislations/1529
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Auffangfunktion gegenüber dem Cyberkriminalitätsgesetz: Wo eine KI-gestützte Täuschung nicht über
    ein Informationsnetz begangen wird, greift das allgemeine Betrugs- und Fälschungsstrafrecht.

    '
  dokumente:
  - datum: 2021-09-20
    typ: endfassung
    titel: Federal Decree-Law Promulgating the Crimes and Penalties Law
    url: https://uaelegislation.gov.ae/en/legislations/1529
    sprache: en
    urheber: uaelegislation.gov.ae
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen; Datum, Inkrafttreten und Amtsblatt- angabe gelesen. Der Artikeltext
      wurde nicht im Einzelnen ausgewertet.

      '
  offene_punkte:
  - 'Welche konkreten Artikel bei KI-gestützter Täuschung angewandt werden, ist nicht am Text geprüft.
    Der nächste Bearbeiter sollte die Betrugs- und Fälschungsartikel identifizieren und als eigene `normen`-Einträge
    aufnehmen.

    '
