  status: anwendbar
  status_detail: 'Sektorales Gesundheitsdatenrecht. Es ist für KI im Gesundheitswesen die vorrangige Norm:
    Gesundheitsdaten sind aus dem Anwendungsbereich des allgemeinen Datenschutzgesetzes Nr. 45/2021 ausgenommen
    und unterliegen diesem Gesetz. Es enthält ein grundsätzliches Verbot der Speicherung und Verarbeitung
    von VAE-Gesundheitsdaten im Ausland (Datenlokalisierung), von dem die Gesundheitsbehörde Ausnahmen
