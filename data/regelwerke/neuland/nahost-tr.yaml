- id: ae-pdpl-45-2021
  jurisdiktion: ae
  kurztitel: Datenschutzgesetz der VAE (Nr. 45/2021)
  offizieller_titel: 'مرسوم بقانون اتحادي رقم (45) لسنة 2021 في شأن حماية البيانات الشخصية — Marsūm bi-qānūn
    ittiḥādī raqm (45) li-sanat 2021 fī shaʾn ḥimāyat al-bayānāt al-shakhṣiyya — Bundesdekretgesetz Nr.
    45 von 2021 über den Schutz personenbezogener Daten

    '
  fundstelle: 'Erlassen am 20.09.2021, veröffentlicht im Amtsblatt (الجريدة الرسمية) Nr. 712 (Beilage/ملحق)
    vom 26.09.2021; in Kraft seit 02.01.2022.

    '
  status: anwendbar
  status_detail: 'Das Gesetz gilt seit dem 02.01.2022. Seine Durchführungsverordnung (اللائحة التنفيذية
    / Executive Regulations), die Art. 51 des Gesetzes binnen sechs Monaten vorsah, war am 06.09.2026
    nach Kenntnisstand dieser Recherche NICHT erlassen. Damit ruht der Sanktionsapparat: Die Bußgeldtatbestände
    sollen erst mit der Durchführungsverordnung wirksam werden, und die im Gesetz vorgesehenen Übergangsfristen
    laufen erst ab deren Veröffentlichung. Das ist der zentrale Befund zum VAE-Datenschutz- recht und
    der Grund, warum das DIFC- und ADGM-Recht in der Praxis wichtiger ist als das Bundesrecht.

    '
  kurzbeschreibung: 'Horizontal geltendes Datenschutzgesetz nach europäischem Vorbild mit Rechtmäßigkeitsgrundsatz,
    Einwilligung, Betroffenenrechten (Auskunft, Berichtigung, Löschung, Übertragbarkeit, Widerspruch),
    Datenschutzbeauftragtem, Meldepflicht bei Verletzungen und Regeln zum Drittlandtransfer. Für KI zentral
    ist Art. 18: Recht, gegen Entscheidungen aus automatisierter Verarbeitung mit rechtlicher Wirkung
    oder erheblicher Beeinträchtigung Widerspruch einzulegen, und Pflicht des Verantwortlichen, auf Verlangen
    ein menschliches Element in die Überprüfung einzuführen. Ausgenommen sind u.a. Regierungsdaten, Gesundheits-
    und Bankdaten, die eigenen Regimen unterliegen, sowie die Finanzfreizonen.

    '
  inkrafttreten:
    datum: 2022-01-02
    verifiziert: true
    quelle: https://assets.u.ae/api/public/content/954629a06cc64fd887771ce3273d6154?v=21d88839
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Art. 18 Abs. 1: „يحق لصاحب البيانات الاعتراض على القرارات التي تصدر عن المعالجة المؤتمتة وتكون لها
    تبعات قانونية أو تؤثر بشكل جسيم عليه" — der Betroffene kann Entscheidungen aus automatisierter Verarbeitung
    widersprechen, die rechtliche Folgen haben oder ihn erheblich beeinträchtigen. Das ist die VAE-Entsprechung
    zu Art. 22 DSGVO, aber als Widerspruchsrecht und nicht als grundsätzliches Verbot konstruiert.

    '
  - 'Art. 18 Abs. 5: „يتعين على المتحكم إدخال العنصر البشري في مراجعة قرارات المعالجة المؤتمتة بناء على
    طلب صاحب البيانات" — der Verantwortliche MUSS auf Verlangen des Betroffenen ein menschliches Element
    in die Überprüfung der automatisierten Entscheidung einführen. Der Anspruch entsteht also erst auf
    Antrag, anders als bei Art. 22 Abs. 3 DSGVO.

    '
  - 'Bereichsausnahmen: Das Gesetz gilt nicht in DIFC und ADGM und nicht für Regierungsbehörden, die eigene
    Datenbestände führen — dadurch entsteht die für die VAE typische Aufspaltung des Datenschutzrechts
    in mindestens drei Regime.

    '
  dokumente:
  - datum: 2021-09-20
    typ: endfassung
    titel: 'مرسوم بقانون اتحادي رقم (45) لسنة 2021 في شأن حماية البيانات الشخصية (arabischer Volltext)

      '
    url: https://assets.u.ae/api/public/content/954629a06cc64fd887771ce3273d6154?v=21d88839
    sprache: ar
    urheber: Präsident der VAE / Regierungsportal u.ae
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen; Art. 18 Abs. 1 und Abs. 5 im arabischen Wortlaut gelesen. Auf u.ae
      unter „Data protection laws" verlinkt; das Portal weist ausdrücklich darauf hin, dass nur die arabische
      Fassung vorliegt.

      '
