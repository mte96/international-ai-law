- id: ae-ki-einfuehrungsrichtlinie
  jurisdiktion: ae
  kurztitel: KI-Einführungsrichtlinie für Regierungsdienste
  offizieller_titel: 'AI Adoption Guideline in Government Services — Richtlinie zur Einführung künstlicher
    Intelligenz in Regierungsdienstleistungen

    '
  fundstelle: 'Ministry of Cabinet Affairs / Prime Minister''s Office, VAE. Veröffentlicht auf dem amtlichen
    Regierungsportal u.ae (assets.u.ae). Ohne Nummer, ohne Datumsangabe im Dokument.

    '
  status: softlaw
  status_detail: 'Verwaltungsinterne Handreichung des Kabinettsministeriums an Bundesbehörden. Kein Rechtsakt,
    aber der Maßstab, an dem KI-Vorhaben von Bundesbehörden intern gemessen werden. Weil das Kabinettsministerium
    zugleich die Leistungsbewertung der Bundesbehörden steuert, hat die Richtlinie faktische Steuerungs-
    kraft, die einer Verwaltungsvorschrift nahekommt.

    '
  kurzbeschreibung: 'Verlangt von Bundesbehörden die Ausrichtung von KI-Vorhaben an der nationalen KI-Vision
    2031, Leitungsverantwortung mit eigenem Budget und Governance-Struktur, eine systematische Priorisierung
    von Anwendungsfällen nach Machbarkeit und Wertbeitrag, ein Datenmanagement-Regime, den Aufbau interdisziplinärer
    Teams sowie die Übernahme ethischer Grundsätze (Fairness, Transparenz, Verantwortlichkeit) und eines
    Risikomanagements für Privatheit, Verzerrung und Erklärbarkeit. Umsetzung in vier Stufen (discovery,
    initiation, execution, operations); Reifegradmodell mit sechs Dimensionen und fünf Stufen (Explorer
    bis Transformer).

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://assets.u.ae/api/public/content/efd38f961c104415a22db5e177a73e02?v=57989b9e
  themenachsen:
  - sektor-oeffentlich
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - 'Reifegradmodell über sechs Dimensionen: Vision, Anwendungsfälle, Daten, Infrastruktur, Personal,
    Governance. Das ist der einzige amtliche VAE-Text, der KI-Governance operationalisierbar macht.

    '
  - 'Risikomanagement ist ausdrücklich auf Privatheit, Verzerrung (bias) und Erklärbarkeit bezogen — dieselbe
    Trias wie in der Ethik-Leitlinie, hier aber prozessual eingebettet.

    '
  dokumente:
  - datum: null
    typ: leitlinie
    titel: AI Adoption Guideline in Government Services
    url: https://assets.u.ae/api/public/content/efd38f961c104415a22db5e177a73e02?v=57989b9e
    sprache: en
    urheber: Ministry of Cabinet Affairs / Prime Minister's Office, VAE
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen und gelesen. Das Dokument nennt weder Version noch Datum; deshalb
      kein `inkrafttreten`.

      '
  offene_punkte:
  - Datum und Fassung des Dokuments sind unbekannt; das Dokument selbst datiert nicht.
  - 'Ob die Richtlinie durch den Agentic-AI-Rahmen von 2026 abgelöst oder ergänzt wird, ist offen.

    '
