- id: ae-urheberrecht-38-2021
  jurisdiktion: ae
  kurztitel: Urheberrechtsgesetz der VAE (Nr. 38/2021)
  offizieller_titel: 'مرسوم بقانون اتحادي في شأن حقوق المؤلف والحقوق المجاورة — Federal Decree-Law on
    Copyright and Neighbouring Rights — Bundesdekretgesetz über das Urheberrecht und die verwandten Schutzrechte
    (Nr. 38 von 2021)

    '
  fundstelle: 'In Kraft seit 02.01.2022; ersetzt das Bundesgesetz Nr. 7 von 2002. Portalseite: uaelegislation.gov.ae/en/legislations/1534.

    '
  status: anwendbar
  status_detail: 'Geltendes Urheberrecht. Es enthält KEINE Text- und Data-Mining- Schranke und keine Regelung
    zu KI-erzeugten Werken. Der Schutz setzt nach der Systematik des Gesetzes einen menschlichen Urheber
    voraus; eine ausdrückliche Aussage dazu enthält der Text nicht. Damit ist die urheberrechtliche Behandlung
    von Trainingsdaten und KI-Erzeugnissen in den VAE ungeregelt.

    '
  kurzbeschreibung: 'Schutzgegenstände sind u.a. Bücher, Broschüren, Aufsätze, Musikwerke, audiovisuelle
    Werke, Werke der Baukunst und Computerprogramme; geschützt sind daneben ausübende Künstler, Tonträgerhersteller
    und Sendeunternehmen. Urheberpersönlichkeits- rechte sind unübertragbar. Schutzdauer: Urheber Leben
    plus 50 Jahre; ausübende Künstler 50 Jahre ab der Darbietung; Tonträgerhersteller 50 Jahre; Sendeunternehmen
    20 Jahre. Schranken für privaten Gebrauch, Unterricht, Bibliotheksarchivierung und Kritik bei Quellenangabe,
    mit Einschränkungen für Software, bildende Kunst und Baukunst. Sanktionen: 10 000 bis 1 000 000 AED,
    in schweren Fällen Freiheitsstrafe; zivilrechtlich Einstellung der Verwertung, Beschlagnahme und Erlösabschöpfung.

    '
  inkrafttreten:
    datum: 2022-01-02
    verifiziert: true
    quelle: https://uaelegislation.gov.ae/en/legislations/1534
  themenachsen:
  - urheberrecht
  - content
  - haftung
  regelungsschwerpunkte:
  - 'KEINE TDM-Schranke: Anders als Art. 4 DSM-RL, Art. 30-4 des japanischen Urheberrechtsgesetzes oder
    Art. 23 des kasachischen KI-Gesetzes kennt das VAE-Recht keine Regelung des Text- und Data-Mining.
    Trainingsnutzungen sind daher am allgemeinen Vervielfältigungsrecht und an den engen Schranken zu
    messen.

    '
  - 'Die Schranke für privaten Gebrauch ist für Software, bildende Kunst und Baukunst ausdrücklich eingeschränkt
    — was eine Analogie zugunsten des Trainings zusätzlich erschwert.

    '
  - 'Verwertungsgesellschaften: Rechteinhaber können ihre Rechte Berufsverbänden zur Wahrnehmung übertragen;
    diese unterliegen der Aufsicht des Wirtschaftsministeriums und einem Diskriminierungsverbot.

    '
  dokumente:
  - datum: null
    typ: endfassung
    titel: Federal Decree-Law on Copyright and Neighbouring Rights (Portalfassung)
    url: https://uaelegislation.gov.ae/en/legislations/1534
    sprache: en
    urheber: uaelegislation.gov.ae
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen und inhaltlich ausgewertet (Schutzgegenstände, Schutzfristen, Schranken,
      Sanktionen). Das Erlassdatum wird auf der Portalseite nicht angezeigt, nur das Inkrafttreten (02.01.2022)
      und die Ersetzung des Gesetzes Nr. 7/2002.

      '
  offene_punkte:
