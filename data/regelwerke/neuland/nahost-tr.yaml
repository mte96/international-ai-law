- id: ae-deepfake-leitfaden
  jurisdiktion: ae
  kurztitel: Deepfake-Leitfaden der VAE (2021)
  offizieller_titel: 'AI Guide: Deepfakes — KI-Leitfaden: Deepfakes

    '
  fundstelle: 'National Program for Artificial Intelligence, Juli 2021. Veröffentlicht auf dem amtlichen
    Regierungsportal u.ae (assets.u.ae), dort unter „AI resources" als „DeepFake Guide".

    '
  status: softlaw
  status_detail: 'Aufklärungs- und Orientierungsdokument ohne Rechtssatzform. Es ist die einzige KI-spezifische
    amtliche Äußerung der VAE zu Deepfakes; die rechtliche Sanktion läuft dagegen über Art. 44 des Cyberkriminalitätsgesetzes
    Nr. 34/2021 und die Vorschriften über Beleidigung und Verleumdung.

    '
  kurzbeschreibung: 'Definiert Deepfakes als „manipulated visual and/or audio content based on Artificial
    Intelligence and advanced software technology to misrepresent individuals, objects, environments,
    and events". Unterscheidet positive Anwendungen (Medizin: synthetische Stimme für Kehlkopfpatienten,
    MRT-Bilderzeugung für Trainingszwecke; Unterhaltung: Spezialeffekte, virtuelle Nachrichtensprecher;
    Kundendienst) von missbräuchlichen (Rufschädigung, Manipulation der öffentlichen Meinung, fabrizierte
    Beweismittel, Cybermobbing). Verweist auf bestehende nationale Verbote von Cybermobbing, Identitätsanmaßung
    und Falschnachrichten.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://assets.u.ae/api/public/content/38a05cb9c7bb491b8411092b9426fef1?v=4e2a2c8a
  themenachsen:
  - content
  - grundrechte
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Rechtsvergleichender Anker: Der Leitfaden zitiert als einzige ausländische Norm ausdrücklich den
    Deepfake-Tatbestand des US-Bundesstaats Illinois (10 ILCS 5/29-21) mit dessen Täuschungsabsichtsmerkmal
    — bemerkenswert, weil damit ein US-bundesstaatlicher Wahlrechtstatbestand zum Referenzmodell einer
    Golfstaaten-Verwaltungsleitlinie wird.

    '
  - 'Der Leitfaden nennt die einschlägigen VAE-Gesetze NICHT mit Nummer, sondern nur pauschal („existing
    UAE national laws"). Die Verknüpfung mit Art. 44 Bundesdekretgesetz Nr. 34/2021 muss der Rechtsanwender
    selbst herstellen.

    '
  dokumente:
  - datum: 2021-07-01
    typ: leitlinie
    titel: 'AI Guide: Deepfakes (Juli 2021)'
    url: https://assets.u.ae/api/public/content/38a05cb9c7bb491b8411092b9426fef1?v=4e2a2c8a
    sprache: en
    urheber: National Program for Artificial Intelligence, VAE
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen und gelesen. Monat und Jahr stehen im Dokument, der Tag nicht; deshalb
      auf den Monatsersten normiert und `inkrafttreten` nicht gesetzt.

      '
  offene_punkte:
  - 'Eine arabische Fassung war unter den auf u.ae verlinkten Dateien nicht auffindbar. Ob es eine gibt,
    ist offen.

    '
