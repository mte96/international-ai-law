  kurztitel: Türkisches Desinformationsgesetz (Nr. 7418)
  offizieller_titel: 'Basın Kanunu ile Bazı Kanunlarda Değişiklik Yapılmasına Dair Kanun, Kanun No. 7418
    — Gesetz zur Änderung des Pressegesetzes und einiger anderer Gesetze

    '
  fundstelle: Kanun No. 7418; Resmî Gazete, Oktober 2022.
  status: anwendbar
  status_detail: 'UNVERIFIZIERT. Artikelgesetz, das unter anderem den Tatbestand der öffentlichen Verbreitung
    irreführender Informationen (Art. 217/A TCK) eingeführt und das Internetgesetz Nr. 5651 verschärft
    hat. Es ist die Norm, unter der KI-erzeugte Falschinformationen in der Türkei strafrechtlich verfolgt
    werden können.

    '
  kurzbeschreibung: 'Führt Art. 217/A TCK ein (Freiheitsstrafe von einem bis drei Jahren für die öffentliche
    Verbreitung unwahrer Informationen über die innere und äußere Sicherheit, die öffentliche Ordnung
    oder die allgemeine Gesundheit in einer Weise, die geeignet ist, die öffentliche Ruhe zu stören; Strafschärfung
    bei Verschleierung der Identität oder Handeln im Rahmen einer Organisation) und ändert das Internet-
    und das Pressegesetz.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
  themenachsen:
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Art. 217/A TCK ist die einzige türkische Strafnorm, die inhaltlich auf Desinformation zielt und deshalb
    auf Deepfake-Kampagnen unmittelbar anwendbar ist.

    '
  dokumente: []
  offene_punkte:
  - 'Gesetzesnummer, Kabul Tarihi, Resmî-Gazete-Fundstelle und der Wortlaut des Art. 217/A sind unbelegt.

    '
  - 'Die Verfassungsmäßigkeit des Art. 217/A war Gegenstand eines Normenkontrollverfahrens vor dem Anayasa
    Mahkemesi; der Ausgang konnte nicht geprüft werden, weil anayasa.gov.tr aus dieser Umgebung nicht
    erreichbar war.

    '
