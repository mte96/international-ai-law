  kurztitel: Global-AI-Hub-Gesetzgebung (2025/2026)
  offizieller_titel: 'Nicht belegt. Nach dem Auftragstext eine „Global AI Hub"-Gesetzgebung der Jahre
    2025/2026.

    '
  fundstelle: NICHT BELEGT.
  status: entwurf
  status_detail: 'UNVERIFIZIERT UND MÖGLICHERWEISE NICHT EXISTENT. Saudi-Arabien hat 2025 das Vorhaben
    eines „Global AI Hub" angekündigt, bei dem ausländische Staaten und Unternehmen Rechenzentren unter
    einem besonderen, vom saudischen Recht teilweise abweichenden Rechtsregime („data embassies") betreiben
    können sollen. Ob dazu ein Gesetz, ein Entwurf oder nur eine Ankündigung vorliegt, war NICHT feststellbar.
    Der Eintrag ist als Rechercheauftrag und nicht als Befund aufgenommen.

    '
  kurzbeschreibung: 'Angekündigt ist ein Rahmen mit mehreren Betreibermodellen (eigenständige, erweiterte
    und virtuelle Rechenzentren ausländischer Träger) und einem besonderen Datenzugriffsregime. Ein Gesetzestext
    liegt dieser Recherche nicht vor.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
