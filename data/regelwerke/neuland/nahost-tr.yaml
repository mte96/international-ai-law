  regelungsschwerpunkte:
  - 'Art. 10 der DIFC Data Protection Regulations („Processing of Personal Data through Autonomous and
    Semi-Autonomous Systems") ist die international meistzitierte KI-Norm der VAE — siehe das eigene Regelwerk
    difc-dp-regulations.

    '
  - 'Art. 26: Angemessenheitsliste des Commissioner (List of Adequate Data Protection Regimes) — ein eigener,
    vom EU-Angemessenheits- beschluss unabhängiger Mechanismus.

    '
  - 'Art. 28: Government Data Sharing — eine ausdrückliche Vorschrift über die Weitergabe personenbezogener
    Daten an Behörden mit Prüfpflicht des Verantwortlichen. Das ist in dieser Schärfe im europäischen
    Recht ohne Entsprechung und wird für KI-gestützte Sicherheitsanalysen praktisch.

    '
  - 'Fotografien und biometrische Daten sind ausdrücklich als personenbezogene Daten benannt — Grundlage
    für die Beurteilung von Gesichtserkennung im DIFC.

    '
