- id: ae-etrust-46-2021
  jurisdiktion: ae
  kurztitel: Gesetz über elektronische Transaktionen und Vertrauensdienste (Nr. 46/2021)
  offizieller_titel: 'مرسوم بقانون اتحادي رقم (46) لسنة 2021 في شأن المعاملات الإلكترونية وخدمات الثقة
    — Federal Decree by Law No. 46 of 2021 on Electronic Transactions and Trust Services — Bundesdekretgesetz
    Nr. 46 von 2021 über elektronische Transaktionen und Vertrauensdienste

    '
  fundstelle: 'Erlassen am 20.09.2021; Amtsblatt Nr. 712 (ملحق 1); in Kraft seit 02.01.2022; Portalfassung
    zuletzt aktualisiert am 30.12.2024. Portalseite: uaelegislation.gov.ae/en/legislations/1539.

    '
  status: anwendbar
  status_detail: 'Geltendes Recht. Es ist die zentrale vertragsrechtliche Norm für automatisierte Willenserklärungen:
    Die VAE haben — anders als die meisten Rechtsordnungen — die Wirksamkeit von Verträgen, die durch
    „automated electronic agents" geschlossen werden, ausdrücklich normiert. Damit ist die vertragsrechtliche
    Behandlung KI-gestützter Agenten in den VAE ausdrücklich geregelt und nicht nur Auslegungsfrage.

    '
  kurzbeschreibung: 'Regelt Wirksamkeit und Beweiswert elektronischer Dokumente und Signaturen, führt
    Vertrauensdienste ein und unterstellt deren Anbieter der Zulassung durch die Telecommunications and
    Digital Government Regulatory Authority (TDRA); für den Regierungssektor ist die Federal Authority
    for Identity, Citizenship, Customs and Port Security (ICP) zuständig. Zugelassene Anbieter erhalten
    ein Vertrauenszeichen („trust mark"). Ziel ist die Stärkung des Rechtsvertrauens im elektronischen
    Geschäftsverkehr.

    '
  inkrafttreten:
    datum: 2022-01-02
    verifiziert: true
    quelle: https://uaelegislation.gov.ae/en/legislations/1539
  themenachsen:
  - vertrag
  - marktzugang
  - governance
  regelungsschwerpunkte:
  - 'Aufsicht: TDRA für den Privatsektor, ICP für den Regierungssektor — eine geteilte Zuständigkeit,
    die bei KI-Agenten in Verwaltungsverfahren praktisch bedeutsam wird.

    '
  - 'Vertrauenszeichen als marktordnendes Instrument statt Verbot.

    '
