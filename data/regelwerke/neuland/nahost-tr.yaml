- id: difc-dp-regulations
  jurisdiktion: ae
  subjurisdiktion: ae-difc
  kurztitel: DIFC-Datenschutzverordnung, insbesondere Regulation 10
  offizieller_titel: 'DIFC Data Protection Regulations (2020), einschließlich Regulation 10 — Processing
    of Personal Data through Autonomous and Semi-Autonomous Systems — Verarbeitung personenbezogener Daten
    durch autonome und teilautonome Systeme

    '
  fundstelle: 'Verordnung des DIFC Board of Directors zum DIFC Law No. 5 of 2020; Rubrik „DIFC Regulations"
    der amtlichen Rechtsdatenbank difc.ae/business/laws-and-regulations/legal-database. Regulation 10
    wurde durch eine Änderung von 2023 eingefügt.

    '
  status: anwendbar
  status_detail: 'FREIZONENRECHT und international die meistzitierte KI-Regelung der VAE. Regulation 10
    verpflichtet Verantwortliche und Auftragsverarbeiter, die personenbezogene Daten durch autonome oder
    teilautonome Systeme verarbeiten, zu Transparenz, Rechenschaft und Risikobewertung; sie ist damit
    eine der weltweit ersten KI-spezifischen Normen innerhalb eines Datenschutzgesetzes. Der Text konnte
    NICHT abgerufen werden (difc.ae antwortet auf Einzeldokumente mit HTTP 403); der Eintrag beruht auf
    der amtlichen Rubrikstruktur und ist im Übrigen unverifiziert.

    '
  kurzbeschreibung: 'Die Regulations konkretisieren Verfahren und Pflichten des DP Law 2020 (Meldungen
    an den Commissioner, Bußgelder und Sanktionen, internationale Datentransfers). Regulation 10 ergänzt
    dies um ein eigenes Regime für autonome und teilautonome Systeme: Offenlegung des Einsatzes, Angabe
    von Zweck und Logik, Bewertung der Auswirkungen auf Betroffene sowie besondere Anforderungen, wenn
    das System Entscheidungen mit erheblicher Wirkung trifft.

    '
  inkrafttreten:
    datum: null
