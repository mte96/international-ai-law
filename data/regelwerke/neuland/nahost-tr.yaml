    verifiziert: false
    quelle: null
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Der Rahmen ordnet KI-Anwendungen nach Risikograden ein — insofern strukturell der KI-VO ähnlich,
    aber ohne Rechtsfolgen.

    '
