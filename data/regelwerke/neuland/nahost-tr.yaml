- id: difc-dp-law-5-2020
  jurisdiktion: ae
  subjurisdiktion: ae-difc
  kurztitel: DIFC-Datenschutzgesetz (DIFC Law No. 5 of 2020)
  offizieller_titel: 'Data Protection Law, DIFC Law No. 5 of 2020 — Datenschutzgesetz, DIFC-Gesetz Nr.
    5 von 2020

    '
  fundstelle: 'Gesetz des Herrschers von Dubai für das DIFC; amtliche Rechtsdatenbank difc.ae/business/laws-and-regulations/legal-database
    (Rubrik „DIFC Laws"). Es ersetzt das DIFC-Datenschutzgesetz Nr. 1 von 2007.

    '
  status: anwendbar
  status_detail: 'FREIZONENRECHT. Es gilt ausschließlich im DIFC und verdrängt dort das Bundesdatenschutzgesetz
    Nr. 45/2021, das die Finanzfreizonen ausdrücklich ausnimmt. Nach der amtlichen Darstellung des DIFC
    verkörpert es „international best practice and is consistent with EU and UK data protection regulations"
    — es ist also bewusst als DSGVO-Äquivalent gebaut, mit eigener Aufsicht (Commissioner of Data Protection)
    und eigenem Gerichtszug (DIFC Courts).

    '
  kurzbeschreibung: 'Vollständiges Datenschutzgesetz mit Rechtmäßigkeitsgrundsätzen, Betroffenenrechten,
    Datenschutzbeauftragtem, Meldepflichten, Drittlandtransfer über Angemessenheitsliste (Art. 26) und
    Standardvertragsklauseln (Art. 27 Abs. 2 Buchst. c) sowie einer besonderen Vorschrift über die Weitergabe
    an staatliche Stellen (Art. 28 Government Data Sharing). Definiert personenbezogene Daten als „any
    information relating to a living individual, that specifically identifies him or her" und erfasst
    ausdrücklich biometrische Daten, Fotografien und IP-Adressen. Besondere Kategorien: u.a. ethnische
    Herkunft, Religion, politische oder weltanschauliche Überzeugungen. Sanktionen setzt der Commissioner
    fest; die Regulations bestimmen Bußgeldrahmen.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
