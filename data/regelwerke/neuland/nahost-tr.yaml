  status: anwendbar
  status_detail: 'Allgemeines Markenrecht. Für KI relevant als Anspruchsgrundlage gegen die Nutzung fremder
    Marken in KI-Erzeugnissen und in Trainingsdaten sowie als Grundlage der Stimm- und Bildrechte prominenter
