- id: ae-datenamt-44-2021
  jurisdiktion: ae
  kurztitel: Errichtungsgesetz UAE Data Office (Nr. 44/2021)
  offizieller_titel: 'مرسوم بقانون اتحادي رقم (44) لسنة 2021 بشأن إنشاء مكتب الإمارات للبيانات — Bundesdekretgesetz
    Nr. 44 von 2021 über die Errichtung des Datenamts der VAE

    '
  fundstelle: 'Erlassen im September 2021, veröffentlicht im Amtsblatt Nr. 712 (Beilage) vom 26.09.2021;
    ergangen zusammen mit dem Datenschutzgesetz Nr. 45/2021.

    '
  status: anwendbar
  status_detail: 'Errichtet das UAE Data Office als Bundesbehörde und Aufsichtsstelle für das Datenschutzgesetz
    Nr. 45/2021. Das Amt ist zugleich für die Vorbereitung der Durchführungsverordnung zuständig, die
    bis heute aussteht — die Aufsichtsstruktur besteht also, entfaltet aber wenig Wirkung.

    '
  kurzbeschreibung: 'Aufgaben des Datenamts: Entwurf von Politiken und Rechtsakten zum Datenschutz, Ausarbeitung
    und Genehmigung von Standardklauseln und Verhaltensregeln, Führung eines Beschwerdeverfahrens, Aufsicht
    über Verantwortliche und Auftragsverarbeiter, Zusammenarbeit mit ausländischen Aufsichtsbehörden.
    Eigene Bußgeldbefugnisse ergeben sich erst aus der ausstehenden Durchführungsverordnung.

    '
  inkrafttreten:
