  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Personalunion von Datenschutzaufsicht, KI-Normgeber und KI-Entwickler — institutionell das Gegenteil
    der in Art. 70 KI-VO geforderten Unabhängigkeit der Marktüberwachungsbehörde.

    '
