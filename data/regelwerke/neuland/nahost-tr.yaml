  fundstelle: 'Königliches Dekret Nr. م/41 (M/41) nebst Durchführungsverordnung. Zuständig ist heute die
    Saudi Authority for Intellectual Property (SAIP); Sammelausgabe der Immaterialgüterrechtsvorschriften
    auf saip.gov.sa.

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT im Detail. Das Gesetz ist die Grundlage für die urheberrechtliche Beurteilung
    von Trainingsdaten und KI-Erzeugnissen in Saudi-Arabien. Eine Text- und Data-Mining-Schranke ist nach
    dem Kenntnisstand bis Mai 2026 nicht vorhanden; ebenso wenig eine Regelung über die Urheberschaft
    an KI-Erzeugnissen.

    '
  kurzbeschreibung: 'Schützt Werke der Literatur, Kunst und Wissenschaft einschließlich Computerprogrammen;
    regelt Urheberpersönlichkeits- und Verwertungsrechte, Schutzdauer, Schranken sowie Sanktionen. Vollzug
