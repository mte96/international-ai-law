- id: difc-pgn-2-2023
  jurisdiktion: ae
  subjurisdiktion: ae-difc
  kurztitel: DIFC-Courts-Leitlinie zu LLM und generativer KI (PGN 2/2023)
  offizieller_titel: 'Practical Guidance Note No. 2 of 2023: Guidelines on the use of large language models
    and generative AI in proceedings before the DIFC Courts — Praxisleitlinie Nr. 2 von 2023: Leitlinien
    für die Verwendung großer Sprachmodelle und generativer KI in Verfahren vor den DIFC-Gerichten

    '
  fundstelle: 'DIFC Courts, Practice Directions; difccourts.ae/rules-decisions/practice-directions. Erlassen
    und in Kraft am 21.12.2023. Zitierweise nach dem Text selbst: „PGN 2/2023".

    '
  status: anwendbar
  status_detail: 'Geltende Verfahrensleitlinie der DIFC-Gerichte. Sie ist die ausführlichste berufs- und
    verfahrensrechtliche KI-Regelung des arabischen Raums und einer der frühesten Gerichtserlasse dieser
    Art weltweit (drei Wochen nach den englischen „AI Guidance for Judicial Office Holders" vom Dezember
    2023). Sie richtet sich an die Parteien, nicht an die Richter.

    '
  kurzbeschreibung: 'Regelt die Verwendung großer Sprachmodelle (LLM) und generativer Inhaltserzeuger
    („Generative Content Generators", GCG) durch Verfahrensbeteiligte. Vier Grundsätze — Transparenz,
    Richtigkeit und Verlässlichkeit, berufsrechtliche und gesetzliche Pflichten, Vermeidung übermäßigen
    Vertrauens — und fünf Best Practices: Überprüfung an unabhängigen Quellen, frühzeitige Offenlegung
    der KI-Nutzung, Auswahl geeigneter Systeme, Aufklärung und Einwilligung des Mandanten sowie Wahrung
    der Vertraulichkeit. Sanktionsanker: Rule 29.10 (Zurückweisung KI-erzeugter Inhalte) und Rule 29.137
    (Ungehorsamsverfahren wegen falscher Wahrheitsversicherung).

    '
  inkrafttreten:
    datum: 2023-12-21
    verifiziert: true
    quelle: https://www.difccourts.ae/rules-decisions/practice-directions/practical-guidance-note-no-2-2023-guidelines-use-large-language-models-and-generative-ai-proceedings-difc-courts
  themenachsen:
  - berufsrecht
  - haftung
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Ziff. 2 (Citation): „This Practical Guidance Note will come into effect from 21 December 2023. It
    may be cited as Practical Guidance Note No. 2 of 2023 Guidelines on the use of AI in Court proceedings
    and may be abbreviated as PGN 2/2023."

    '
  - 'Grundsatz 2 (Accuracy and Reliability): „The Courts have the power to reject any content generated
    through AI-systems under Rule 29.10." — eine ausdrückliche Zurückweisungsbefugnis, die in den meisten
    Gerichtsleitlinien anderer Rechtsordnungen fehlt. WICHTIG: Rule 29.10 der Rules of the DIFC Courts
    lautet nach dem am 06.09.2026 gelesenen Wortlaut lediglich „The Court may use its power under Rule
    29.9 to exclude evidence that would otherwise be admissible." Die KI-bezogene Zurückweisungsbefugnis
    ist also nicht normiert, sondern von den DIFC Courts aus der allgemeinen Beweisausschlussbefugnis
    abgeleitet worden. Das ist für die Streitstände zur Halluzination und zum Umgang der Gerichte mit
    KI-Erzeugnissen der eigentlich interessante Punkt.

    '
  - 'Zeugenaussagen: Rule 29.24 verlangt, dass eine Zeugenaussage „must, if practicable, be in the intended
    witness''s own words". Eine von einem Generator erzeugte Zeugenaussage MUSS vor der Wahrheitsversicherung
    so geändert werden, dass sie die Stimme des Zeugen wiedergibt. Das ist die schärfste Aussage einer
    Gerichtsleitlinie zur KI-gestützten Zeugenaussage, die in dieser Datenbasis erfasst ist.

    '
  - 'Rule 29.137: Wegen einer ohne ehrliche Überzeugung abgegebenen Wahrheitsversicherung kann ein Ungehorsamsverfahren
    („contempt of court") eingeleitet werden — die Sanktionsbrücke zwischen Halluzination und Prozessrecht.

    '
  - 'Offenlegungszeitpunkt: Die KI-Nutzung ist „at the earliest opportunity" anzuzeigen, spätestens bis
    zur Case Management Conference; „Parties should not wait until shortly before trial or the trial itself
    to declare that they intend to use AI-generated content."

    '
  - 'Systemauswahl: Es sollen spezialisierte juristische Generatoren und nicht frei zugängliche Konversationswerkzeuge
    verwendet werden; die Partei muss Grenzen, Trainingsdaten, Algorithmen und mögliche Verzerrungen kennen.

    '
  - 'Mandantenaufklärung und Einwilligung vor dem Einsatz; Wahrung der Vertraulichkeit und Prüfung der
    Vereinbarkeit mit dem Datenschutzgesetz 2020 und dem DIFC-Immaterialgüterrechtsgesetz von 2019.

    '
