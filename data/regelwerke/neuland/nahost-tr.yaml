  offizieller_titel: 'Radyo ve Televizyonların Kuruluş ve Yayın Hizmetleri Hakkında Kanun, Kanun No. 6112
    — Gesetz über die Errichtung von Radio- und Fernsehanstalten und über Rundfunkdienste Nr. 6112

    '
  fundstelle: 'Kanun No. 6112; konsolidierte Fassung auf mevzuat.gov.tr (Dokumentkennung 1.5.6112). Vollzug
    durch den Radyo ve Televizyon Üst Kurulu (RTÜK).

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT. Seit der Novelle von 2018 und der zugehörigen Verordnung erfasst das
    Gesetz auch Rundfunkdienste im Internet (einschließlich Abrufdiensten). Damit ist RTÜK die Behörde,
    die über KI-erzeugte oder KI-moderierte audiovisuelle Inhalte in der Türkei entscheidet — etwa über
    synthetische Nachrichtensprecher und manipulierte Beiträge.

    '
  kurzbeschreibung: 'Regelt Zulassung, Programmgrundsätze, Werbung, Jugendschutz und Sanktionen für Rundfunkdienste;
    seit 2018 auch für Internet- Rundfunk. Sanktionen: Verwarnung, Bußgeld, Programmaussetzung, Lizenzentzug,
    Sperrung.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.6112.pdf
  themenachsen:
  - content
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Programmgrundsätze mit Wahrheits- und Sorgfaltsgebot sind der Ansatzpunkt gegen synthetische Bewegtbildinhalte
    im lizenzierten Rundfunk und in Abrufdiensten.

    '
