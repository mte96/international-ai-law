  status_detail: 'UNVERIFIZIERT. Das Gesetz ist ein Artikelgesetz („torba kanun"); seine datenschutzrechtlich
    einschlägigen Artikel ändern das Gesetz Nr. 6698 in den Vorschriften über besondere Datenkategorien
    (Art. 6), über die Übermittlung ins Ausland (Art. 9) und fügen eine Übergangsvorschrift ein. Es ist
    die bislang einzige größere Angleichung des türkischen Datenschutzrechts an die DSGVO.

    '
  kurzbeschreibung: 'Neufassung der Rechtsgrundlagen für die Verarbeitung besonderer Datenkategorien (Abkehr
    vom bisherigen Einwilligungsmonopol), Einführung von Standardvertragsklauseln, verbindlichen Unternehmensregeln
    und Angemessenheitsbeschlüssen für den Drittlandtransfer sowie Übergangsregelungen. Für KI bedeutsam,
    weil biometrische und genetische Daten als besondere Kategorien erfasst sind und Trainingsdatensätze
    regelmäßig solche Daten enthalten.

    '
