    '
  fundstelle: 'Türkiye Büyük Millet Meclisi (TBMM), 28. Wahlperiode, Esas-Nr. 2/2234. Amtliche Vorgangsdatenbank:
    tbmm.gov.tr/yasama/kanun-teklifleri (Suchformular; die Suche ist ohne Query-String nicht bedienbar).

    '
  verfahrensnummer: TBMM Esas No. 2/2234 (28. Dönem)
  status: verfahren
  status_detail: 'UNVERIFIZIERT. Nach dem Kenntnisstand bis Mai 2026 ein Gesetzesvorschlag von Abgeordneten
    (kein Regierungsentwurf; die türkische Verfassung kennt seit 2018 nur noch den Abgeordneten- vorschlag
    als Gesetzesinitiative), eingebracht im Jahr 2024, ausschussüberwiesen und bis heute nicht verabschiedet.
    Er ist an der KI-VO orientiert: Risikoklassen, Transparenzpflichten, Aufsichtsbehörde. Weder Einbringungsdatum
    noch Ausschuss noch Textfassung konnten belegt werden.

    '
  kurzbeschreibung: 'Kurzer Rahmenentwurf (nach dem Kenntnisstand rund ein Dutzend Artikel) mit Begriffsbestimmungen,
    allgemeinen Grundsätzen (Sicherheit, Transparenz, Fairness, Rechenschaft, Datenschutz), einer risikobasierten
    Einstufung nach dem Vorbild der KI-VO, Pflichten der Anbieter, einer Aufsichts- und Zertifizierungsstelle
    sowie Bußgeldvorschriften. Der Entwurf ist erkennbar eine gekürzte Übernahme der KI-VO-Systematik
    und nicht deren vollständige Umsetzung.

    '
