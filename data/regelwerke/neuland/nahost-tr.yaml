- id: sa-pdpl
  jurisdiktion: sa
  kurztitel: Saudisches Datenschutzgesetz (PDPL)
  offizieller_titel: 'نظام حماية البيانات الشخصية — Niẓām ḥimāyat al-bayānāt al-shakhṣiyya — Gesetz über
    den Schutz personenbezogener Daten

    '
  fundstelle: 'Königliches Dekret Nr. م/19 (M/19); geändert durch Königliches Dekret Nr. م/148 (M/148).
    Veröffentlicht im Amtsblatt „أم القرى" (Umm al-Qurā). Amtliche Textausgabe: laws.boe.gov.sa (Expertenkommission
    beim Ministerrat) und sdaia.gov.sa.

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT. Nach dem Kenntnisstand bis Mai 2026 gilt das Gesetz seit dem 14.09.2023,
    nachdem eine Übergangsfrist zunächst bis 14.09.2024 lief. Zuständige Aufsichtsbehörde ist die Saudi
    Data and AI Authority (SDAIA); der Übergang der Zuständigkeit auf die National Data Management Office
    bzw. eine eigene Datenschutzbehörde war vorgesehen. Weder das Erlassdatum noch das Inkrafttreten konnten
    an einer amtlichen Quelle geprüft werden.

    '
  kurzbeschreibung: 'Horizontales Datenschutzgesetz mit Einwilligungserfordernis, Zweckbindung, Betroffenenrechten
    (Auskunft, Berichtigung, Löschung, Datenübertragbarkeit), Meldepflicht bei Datenschutzverletzungen,
    Registrierungspflicht für Verantwortliche und Beschränkungen des Datentransfers ins Ausland. Sanktionen
    reichen nach dem Gesetz bis zu Freiheitsstrafe (bei der Offenlegung sensibler Daten in Schädigungsabsicht)
    und Geldbußen bis 5 Mio. SAR, im Wiederholungsfall verdoppelt. Für KI ist das Gesetz die einzige verbindliche
    Rechtsgrundlage, an der Trainings- und Anwendungsdatenverarbeitung gemessen wird.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Der Auftragstext dieser Recherche nennt „Art. 20 der Durchführungsverordnung" als die Norm über automatisierte
    Entscheidungen. Diese Zuordnung konnte NICHT geprüft werden und ist ausdrücklich als ungesicherte
    Angabe gekennzeichnet.

    '
  - 'Das PDPL kennt — anders als Art. 22 DSGVO und Art. 18 des VAE-Datenschutzgesetzes — im Gesetzestext
    selbst kein eigenständiges Recht gegen automatisierte Einzelentscheidungen; die Regelung soll auf
    Verordnungsebene stehen. Auch diese Aussage ist zu prüfen.

    '
  - 'Datenlokalisierung: Die Übermittlung ins Ausland ist nur unter engen Voraussetzungen und nach gesonderter
    Verordnung zulässig; das ist für cloudbasierte KI-Dienste die praktisch schärfste Schranke des saudischen
    Rechts.

    '
  dokumente:
  - datum: null
    typ: endfassung
    titel: نظام حماية البيانات الشخصية (amtliche Textausgabe)
    url: https://laws.boe.gov.sa/BoeLaws/Laws/
    sprache: ar
    urheber: هيئة الخبراء بمجلس الوزراء — Expertenkommission beim Ministerrat
    verifiziert: false
    notiz: 'Der Host laws.boe.gov.sa war am 06.09.2026 nicht erreichbar (Verbindungsabbruch bei jedem
      Abruf, sowohl über HTTP-Client als auch über WebFetch). Die URL zeigt auf das Verzeichnis, nicht
      auf das Einzeldokument, weil die Dokumentkennung nicht ermittelt werden konnte.

      '
  - datum: null
    typ: uebersicht
    titel: SDAIA — Regulations and Policies (Verzeichnis)
    url: https://sdaia.gov.sa/en/SDAIA/about/Pages/RegulationsAndPolicies.aspx
    sprache: en
    urheber: Saudi Data and Artificial Intelligence Authority
    verifiziert: false
    notiz: 'Am 06.09.2026 dreimal abgerufen (englisch und arabisch); jedes Mal antwortete eine Web Application
      Firewall mit „The requested URL was rejected."

      '
  offene_punkte:
  - 'Königliche Dekretnummern (M/19, M/148), Hidschri- und Gregorianische Daten, Inkrafttreten und Übergangsfristen
    sind NICHT belegt.

    '
  - 'Ob die Zuständigkeit inzwischen von der SDAIA auf eine eigenständige Datenschutzbehörde übergegangen
    ist, ist offen.

    '
  - 'ZUERST ANFASSEN: laws.boe.gov.sa aus einer Umgebung mit Zugang abrufen und die Dokumentkennung des
    Gesetzes sowie der Durchführungsverordnung notieren.

    '
  monitoring_quellen:
