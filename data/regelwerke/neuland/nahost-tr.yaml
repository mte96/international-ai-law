  regelungsschwerpunkte:
  - 'Regulation 10 ist der Anknüpfungspunkt, an dem das DIFC KI reguliert, ohne ein KI-Gesetz zu erlassen:
    Der Hebel ist das Datenschutzrecht, nicht das Produktsicherheitsrecht. Das ist der methodische Gegenentwurf
    zur KI-VO.

    '
  - 'Die Norm erfasst „autonomous and semi-autonomous systems" und nicht „KI" — eine Begriffswahl, die
    technologieneutral bleibt und die Definitionsprobleme des Art. 3 Nr. 1 KI-VO vermeidet.

    '
