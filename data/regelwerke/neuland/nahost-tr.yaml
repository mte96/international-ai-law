  - governance
  - arbeit
  - marktzugang
  regelungsschwerpunkte:
  - 'Die Strategie kündigt Regulierung ausdrücklich als eigenes Handlungsfeld an; der Gesetzentwurf 2/2234
    ist deren bislang einziger sichtbarer Niederschlag.

    '
