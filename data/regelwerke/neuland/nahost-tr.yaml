- id: tr-kvkk-6698
  jurisdiktion: tr
  kurztitel: Türkisches Datenschutzgesetz (Nr. 6698)
  offizieller_titel: 'Kişisel Verilerin Korunması Kanunu, Kanun No. 6698 — Gesetz über den Schutz personenbezogener
    Daten Nr. 6698

    '
  fundstelle: 'Kanun No. 6698; veröffentlicht im Resmî Gazete. Konsolidierte Fassung: mevzuat.gov.tr,
    Dokumentkennung 1.5.6698 (https://www.mevzuat.gov.tr/MevzuatMetin/1.5.6698.pdf); Behördenfassung:
    kvkk.gov.tr.

    '
  status: anwendbar
  status_detail: 'UNVERIFIZIERT im Detail. Geltendes Datenschutzrecht der Türkei, an der Datenschutzrichtlinie
    95/46/EG und nicht an der DSGVO orientiert; durch das Änderungsgesetz Nr. 7499 (2024) teilweise an
    die DSGVO angeglichen. Es ist die Norm, an der KI-Fälle in der Türkei tatsächlich entschieden werden
    — die Bußgeldpraxis der KVKK ist der einzige nennenswerte Vollzugskanal.

    '
  kurzbeschreibung: 'Regelt Grundsätze der Verarbeitung, Rechtsgrundlagen, besondere Datenkategorien,
    Übermittlung ins Ausland, Informations- und Auskunftsrechte, das Register der Verantwortlichen (VERBİS),
    die Kişisel Verileri Koruma Kurumu (KVKK) als Aufsichtsbehörde und deren Bußgeldbefugnisse. Für KI
    zentral ist Art. 11 Buchst. g: das Recht, gegen ein Ergebnis Einspruch zu erheben, das gegen den Betroffenen
    ausschließlich durch automatisierte Systeme analysiert wurde („münhasıran otomatik sistemler vasıtasıyla
    analiz edilmesi suretiyle kişinin kendisi aleyhine bir sonucun ortaya çıkmasına itiraz etme").

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.mevzuat.gov.tr/MevzuatMetin/1.5.6698.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Art. 11 Buchst. g gewährt dem Betroffenen ein Einspruchsrecht gegen nachteilige Ergebnisse ausschließlich
    automatisierter Analyse. Das ist die türkische Parallelnorm zu Art. 22 DSGVO, aber deutlich schwächer:
    Sie kennt weder ein Verbot noch einen Anspruch auf menschliches Eingreifen; sie gibt nur ein Widerspruchsrecht.

    '
  - 'Der Text spricht von „münhasıran otomatik sistemler" — der Ausschließlichkeitsvorbehalt eröffnet
    dieselbe Umgehungsfrage wie Art. 22 DSGVO.

    '
  - 'Auslandsübermittlung: bis 2024 nur mit ausdrücklicher Einwilligung oder Verpflichtungserklärung mit
    Genehmigung der Behörde; das Gesetz Nr. 7499 hat Standardvertragsklauseln und verbindliche Unternehmensregeln
    eingeführt.

    '
