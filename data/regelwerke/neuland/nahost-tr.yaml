- id: ae-ki-rat
  jurisdiktion: ae
  kurztitel: KI- und Blockchain-Rat der VAE
  offizieller_titel: 'UAE Council for Artificial Intelligence and Blockchain / مجلس الإمارات للذكاء الاصطناعي
    والمعاملات الرقمية — Rat der VAE für künstliche Intelligenz und Blockchain

    '
  fundstelle: 'Kabinettsbeschluss von 2018, 2021 mit neuer Besetzung erneuert. Die Beschlussnummer ist
    auf der amtlichen Seite nicht angegeben.

    '
  status: softlaw
  status_detail: 'Beratungs- und Koordinierungsgremium der Bundesregierung, kein Aufsichts- oder Normsetzungsorgan
    mit Eingriffsbefugnissen. 19 Mitglieder aus Bundesministerien und Emiratsbehörden. Der Rat ist Urheber
    der KI-Ethik-Leitlinien von Dezember 2022.

    '
  kurzbeschreibung: 'Der Rat schlägt der Regierung Politiken für ein „KI-freundliches Ökosystem" vor,
    fördert Forschung und koordiniert die Zusammenarbeit von öffentlichem und privatem Sektor. Er hat
    keine Bußgeld-, Untersagungs- oder Registrierungsbefugnis; er ist damit das genaue Gegenstück zu einer
    Marktüberwachungsbehörde nach Art. 70 KI-VO. Adressat seiner Empfehlungen ist die Regierung, nicht
    der Markt.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://ai.gov.ae/ai_council/
  themenachsen:
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Drei Phasen des Mandats: Grundlagenphase (Infrastruktur, Talente, Forschung, Daten, Governance),
    Aktivitätsphase (Einsatz in Schwerpunktsektoren), Führungsphase (globale Führungsrolle).

    '
  - 'Keine Rechtsgrundlage in einem Gesetz: Die amtliche Seite nennt ausdrücklich keine gesetzliche Errichtungsnorm.
    Der Rat existiert auf Kabinettsbeschluss.

    '
  dokumente:
  - datum: null
    typ: uebersicht
    titel: UAE Council for Artificial Intelligence and Blockchain
    url: https://ai.gov.ae/ai_council/
    sprache: en
    urheber: National Program for Artificial Intelligence
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen. Nennt Gründung 2018, Erneuerung 2021, 19 Mitglieder, Mandat und Phasenmodell;
      nennt KEINE Rechtsgrundlage.

      '
  offene_punkte:
  - 'Die Nummer und das Datum des Kabinettsbeschlusses, mit dem der Rat errichtet wurde, konnten nicht
    ermittelt werden. Auf uaelegislation.gov.ae war er nicht auffindbar, weil das Portal jede Suche mit
    Query-String mit HTTP 403 beantwortet.

    '
  - 'Verhältnis zu dem im Breitenscreening behaupteten „Federal Authority for Artificial Intelligence
    and Data" (angeblich Juni 2026) ist ungeklärt — siehe ae-bundesbehoerde-ki-daten.

    '
  monitoring_quellen:
  - https://ai.gov.ae/ai_council/
