      türkischen Text ausdrücklich als Grundlage angeführt; die Links stehen im Quellenverzeichnis der
      KVKK-Seite und wurden von dort übernommen.

      '
  offene_punkte:
  - 'Das Veröffentlichungsdatum ist auf der amtlichen Seite nicht angegeben und deshalb offen.

    '
  - 'Ob die KVKK nach 2021 weitere KI-Dokumente veröffentlicht hat (etwa zu generativer KI), konnte nicht
    geprüft werden: die Übersichtsseiten der Behörde waren nicht erreichbar.

    '
