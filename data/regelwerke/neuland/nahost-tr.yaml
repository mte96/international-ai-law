    Ethics Principles

    '
  fundstelle: Herausgegeben von der SDAIA; veröffentlicht auf sdaia.gov.sa.
  status: softlaw
  status_detail: 'UNVERIFIZIERT. Freiwilliger Ethikrahmen der SDAIA; nach dem Kenntnisstand bis Mai 2026
    in der Fassung 1.0 aus dem Jahr 2023. Er ist bislang das zentrale KI-spezifische Dokument Saudi-Arabiens.
    Bindungswirkung entfaltet er nicht unmittelbar, wohl aber über die Vergabe und über die Doppelrolle
    der SDAIA als Datenschutzaufsicht.

    '
  kurzbeschreibung: 'Grundsätze für die Entwicklung und den Einsatz von KI (u.a. Fairness und Diskriminierungsfreiheit,
    Privatheit und Sicherheit, Menschenzentrierung, Verlässlichkeit und Sicherheit, Transparenz und Erklärbarkeit,
    Rechenschaft und Verantwortung, gesellschaftlicher und ökologischer Nutzen) nebst einem risikobasierten
    Bewertungs- ansatz für KI-Anwendungen.

    '
