- id: ae-ki-ethik-leitlinien
  jurisdiktion: ae
  kurztitel: KI-Ethik-Leitlinien der VAE (2022)
  offizieller_titel: 'AI Ethics: Principles and Guidelines — Grundsätze und Leitlinien zur KI-Ethik

    '
  fundstelle: 'Herausgegeben vom UAE AI and Blockchain Council beim Ministry of State for Artificial Intelligence,
    Digital Economy and Remote Work Applications; Ausgabe Dezember 2022. Veröffentlicht auf dem amtlichen
    Regierungsportal u.ae (assets.u.ae).

    '
  status: softlaw
  status_detail: 'Ausdrücklich unverbindlicher Rahmen („non-binding framework"). Er richtet sich an Organisationen,
    die KI-Systeme entwickeln oder einsetzen, die „significant decisions" treffen — also Entscheidungen
    mit Auswirkung auf Einzelne oder die Gesellschaft. Das ist der materiell wichtigste KI-Text des VAE-Bundes,
    weil er den Prüfungsmaßstab liefert, an dem die Verwaltung KI-Vorhaben misst.

    '
  kurzbeschreibung: 'Acht Grundsätze — Fairness, Verantwortlichkeit, Transparenz, Erklärbarkeit, Robustheit
    und Sicherheit, menschenzentrierte Gestaltung, Nachhaltigkeit, Privatheit. Zu jedem Grundsatz formuliert
    das Dokument Umsetzungsempfehlungen (u.a. Rückverfolgbarkeitsdokumentation, Offenlegung von Datenquellen
    und Algorithmen, Beschwerdemechanismen, Folgenabschätzung über den Lebenszyklus). Sanktionen sind
    nicht vorgesehen; die Einhaltung ist freiwillig.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://assets.u.ae/api/public/content/893c940c21c4403ea8df7faad66a889e?v=b2f9c1a1
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  - haftung
  regelungsschwerpunkte:
  - 'Fairness: gleicher Zugang, Diskriminierungsvermeidung, repräsentative Daten.'
  - 'Verantwortlichkeit: benannte Verantwortliche, Risikominderung und ein Beschwerde-/Rechtsbehelfsmechanismus
    („appeals mechanisms") — funktional das, was Art. 86 KI-VO als Recht auf Erläuterung regelt, hier
    aber ohne Anspruchsqualität.

    '
  - 'Erklärbarkeit „as technically possible" gegenüber den Betroffenen: der Vorbehalt des technisch Möglichen
    ist ausdrücklich in den Grundsatz hineingeschrieben.

    '
  - Nachhaltigkeit als eigenständiger Grundsatz mit Lebenszyklus-Folgenabschätzung.
  dokumente:
  - datum: 2022-12-01
    typ: leitlinie
    titel: 'AI Ethics: Principles and Guidelines (Ausgabe Dezember 2022)'
    url: https://assets.u.ae/api/public/content/893c940c21c4403ea8df7faad66a889e?v=b2f9c1a1
    sprache: en
    urheber: UAE AI and Blockchain Council / Ministry of State for AI
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen und im Volltext gelesen. Auf u.ae unter „AI resources" als „AI Ethics
      Guide" geführt. Der Tag im Monat Dezember 2022 ist im Dokument nicht angegeben; hier auf den Monatsersten
      normiert und deshalb `inkrafttreten` nicht gesetzt.

      '
  offene_punkte:
  - 'Es gibt daneben eine ältere Fassung („AI Ethics Principles and Guidelines", Smart Dubai 2019) auf
    Emiratsebene; das Verhältnis der beiden Texte ist ungeklärt (siehe dubai-ki-ethik).

    '
  - 'Ob die Leitlinien 2024 durch die „UAE Charter for the Development and Use of AI" ersetzt oder ergänzt
    worden sind, konnte nicht geklärt werden — die Charta war auf ai.gov.ae und u.ae nicht auffindbar.

    '
