- id: ae-agentic-ai-rahmen
  jurisdiktion: ae
  kurztitel: Agentic-AI-Rahmen der VAE (2026)
  offizieller_titel: 'UAE Government Agentic AI Framework — Rahmenwerk der VAE-Regierung für agentische
    KI

    '
  fundstelle: 'Rahmenwerk der Bundesregierung auf Weisung des Präsidenten der VAE; begleitet von einem
    einheitlichen Gestaltungsleitfaden des National Committee for Agentic AI. Amtlich dargestellt auf
    dem Regierungsportal u.ae. Eine Kabinettsbeschlussnummer ist dort nicht angegeben.

    '
  status: softlaw
  status_detail: 'Regierungsrahmen mit einer harten Zielquote, aber ohne erkennbare Rechtssatzform: Bis
    2028 sollen 50 % der Sektoren, Dienstleistungen und Abläufe der Bundesverwaltung agentische KI einsetzen.
    Das ist weltweit eine der wenigen staatlichen Vorgaben, die nicht den Einsatz von KI begrenzt, sondern
    ihn quotenmäßig VORSCHREIBT — der regulatorische Gegenpol zur KI-VO.

    '
  kurzbeschreibung: 'Agentische KI soll Verwaltungsleistungen neu gestalten: Das System versteht das Anliegen
    in natürlicher Sprache, ermittelt die erforderlichen Schritte, greift auf die ihm freigegebenen Informationen
    zu, holt bei Bedarf die Zustimmung des Bürgers ein, führt die zugelassenen Handlungen aus und verfolgt
    den Vorgang bis zum Ergebnis. Das National Committee for Agentic AI hat dazu einen einheitlichen Gestaltungsleitfaden
    herausgegeben. Governance- Vorgaben: verantwortliche, sichere und wirksame Umsetzung sowie Qualifizierung
    der Beschäftigten. Sanktionen sind nicht ersichtlich.

    '
  inkrafttreten:
