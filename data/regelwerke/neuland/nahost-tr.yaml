- id: ae-cybercrime-34-2021
  jurisdiktion: ae
  kurztitel: Cyberkriminalitätsgesetz der VAE (Nr. 34/2021)
  offizieller_titel: 'مرسوم بقانون اتحادي في شأن مكافحة الشائعات والجرائم الإلكترونية — Federal Decree-Law
    on Countering Rumours and Cybercrimes — Bundesdekretgesetz über die Bekämpfung von Gerüchten und Cyberkriminalität
    (Nr. 34 von 2021)

    '
  fundstelle: 'Erlassen am 20.09.2021; Amtsblatt Nr. 712 (ملحق / Beilage) vom 26.09.2021; in Kraft seit
    02.01.2022. Portalseite: uaelegislation.gov.ae/en/legislations/1526.

    '
  status: anwendbar
  status_detail: 'Geltendes Strafrecht. Dies ist die Norm, an der Deepfake-Fälle in den VAE tatsächlich
    entschieden werden — nicht ein KI-Gesetz. Das Gesetz kennt den Begriff „Deepfake" nicht, erfasst ihn
    aber über Art. 44, der die Bearbeitung von Aufnahmen mit informations- technischen Mitteln zum Zweck
    der Verunglimpfung unter Strafe stellt.

    '
  kurzbeschreibung: 'Umfassendes Cyberstrafrecht: unbefugter Zugang, Datenmanipulation, Verbreitung von
    Gerüchten und Falschnachrichten, Verletzung der Privatsphäre, obszöne Inhalte, Betrug mit informationstechnischen
    Mitteln. Für KI relevant sind Art. 44 (Bearbeitung von Aufnahmen zur Verunglimpfung: Freiheitsstrafe
    nicht unter einem Jahr und/oder Geldstrafe nicht unter 250 000 AED), Art. 34 (Herstellung, Vorbereitung,
    Gestaltung, Übermittlung oder Speicherung obszönen Materials über Informationsnetze, Strafschärfung
    bei Kindern) sowie die Tatbestände über Falschnachrichten.

    '
  inkrafttreten:
    datum: 2022-01-02
    verifiziert: true
    quelle: https://uaelegislation.gov.ae/en/legislations/1526
  themenachsen:
  - content
  - grundrechte
  - sicherheit-export
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 44 (Preisgabe von Geheimnissen und Verletzung der Privatsphäre): „whoever uses an IS or ITE
    to modify or process any record, photo or scene with the intention of defaming or insulting another
    person shall be punished with imprisonment for at least one year and/or a fine of not less than (AED
    250,000)". Tatbestands- merkmal ist die Verunglimpfungsabsicht; die technische Herkunft der Bearbeitung
    (KI oder Bildbearbeitung) ist gleichgültig.

    '
  - 'Art. 34: Herstellung, Vorbereitung, Gestaltung, Übermittlung oder Speicherung obszönen Materials
    über Informationsnetze; Freiheitsstrafe und/oder Geldstrafe ab 250 000 AED, erhöht bei Kindesbezug.
    Erfasst damit auch synthetisch erzeugte Darstellungen.

    '
  - 'Keine Kennzeichnungspflicht für synthetische Inhalte: Das Gesetz knüpft ausschließlich an die Absicht
    des Täters an, nicht an die fehlende Kenntlichmachung. Darin unterscheidet es sich von Art. 50 KI-VO
    und von den chinesischen Kennzeichnungsregeln.

    '
  dokumente:
  - datum: 2021-09-20
    typ: endfassung
    titel: Federal Decree-Law on Countering Rumours and Cybercrimes (Portalfassung)
    url: https://uaelegislation.gov.ae/en/legislations/1526
    sprache: en
    urheber: Generalsekretariat des VAE-Kabinetts (uaelegislation.gov.ae)
    verifiziert: true
    notiz: 'Am 06.09.2026 abgerufen; Art. 44 und Art. 34 im Wortlaut gelesen. Das Portal weist darauf
      hin, dass im Auslegungsfall der arabische Originaltext maßgeblich ist.

      '
  offene_punkte:
  - 'Ob das Gesetz seit 2024/2025 durch ein Änderungsdekretgesetz um einen ausdrücklichen Deepfake- oder
    Kennzeichnungstatbestand ergänzt wurde, konnte nicht geprüft werden (Portalsuche 403).

    '
  - 'Der arabische Wortlaut des Art. 44 wurde nicht gelesen; die Zitate stammen aus der amtlichen englischen
    Portalfassung.

    '
