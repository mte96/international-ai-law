- id: ch-finma-am-08-2024
  jurisdiktion: ch
  kurztitel: FINMA-Aufsichtsmitteilung 08/2024 zu KI
  offizieller_titel: 'FINMA-Aufsichtsmitteilung 08/2024: Governance und Risikomanagement beim Einsatz
    von künstlicher Intelligenz

    '
  fundstelle: FINMA-Aufsichtsmitteilung 08/2024 vom 18. Dezember 2024.
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Veröffentlicht am 18.12.2024, gilt fort. Aufsichtsmitteilungen sind keine Rechtsnormen;
    sie legen dar, wie die FINMA das geltende Aufsichtsrecht auslegt und was sie in der laufenden Aufsicht
    beobachtet. Aufsichtsrechtlich sind sie gleichwohl massgeblich, weil die FINMA daran ihre Prüfungen
    ausrichtet.

    '
  kurzbeschreibung: 'Die erste förmliche Äusserung der schweizerischen Finanzmarktaufsicht zu KI. Adressiert
    sind die Beaufsichtigten (Banken, Versicherungen, Vermögensverwalter, Fondsleitungen). Die FINMA verlangt,
    dass die mit KI verbundenen spezifischen Risiken identifiziert, begrenzt und überwacht werden, und
    benennt dafür vier Risikofelder: operationelle Risiken einschliesslich Modellrisiko, mangelnder Robustheit
    und Bias; datenbezogene Risiken (Sicherheit, Qualität, Verfügbarkeit); IT- und Cyberrisiken sowie
    Abhängigkeiten von Drittanbietern; sowie Rechts- und Reputationsrisiken. Kernaussage für die Praxis:
    die Verantwortung für KI-gestützte Entscheidungen bleibt beim beaufsichtigten Institut und lässt sich
    nicht auf einen Anbieter auslagern.

    '
  inkrafttreten:
    datum: 2024-12-18
    verifiziert: true
    quelle: https://www.finma.ch/de/news/2024/12/20241218-mm-finma-am-08-24/
  anwendungsdaten: []
  themenachsen:
  - sektor-finanz
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Governance: klare Zuständigkeiten und Verantwortlichkeiten für KI-Einsatz auf Leitungsebene.'
  - Inventar der eingesetzten KI-Anwendungen und Klassifizierung nach Kritikalität.
  - 'Modellrisikomanagement: Tests, Validierung, laufende Überwachung, Erklärbarkeit.'
  - 'Auslagerung: die Verantwortung bleibt beim Institut; Drittanbieterrisiken sind zu steuern.'
  dokumente:
  - datum: 2024-12-18
    typ: leitlinie
    titel: FINMA-Aufsichtsmitteilung 08/2024 (PDF)
    url: https://www.finma.ch/de/~/media/finma/dokumente/dokumentencenter/myfinma/4dokumentation/finma-aufsichtsmitteilungen/20241218-finma-aufsichtsmitteilung-08-2024.pdf
    sprache: de
    urheber: Eidgenössische Finanzmarktaufsicht FINMA
    verifiziert: false
    notiz: 'PDF-Adresse aus der Medienmitteilung der FINMA übernommen; das PDF selbst ist in dieser Sitzung
      nicht geöffnet worden.

      '
  - datum: 2024-12-18
    typ: pressemitteilung
    titel: FINMA-Aufsichtsmitteilung zu Governance und Risikomanagement beim Einsatz von KI
    url: https://www.finma.ch/de/news/2024/12/20241218-mm-finma-am-08-24/
    sprache: de
    urheber: Eidgenössische Finanzmarktaufsicht FINMA
    verifiziert: true
    notiz: Amtliche Medienmitteilung mit Zusammenfassung der vier Risikofelder.
  offene_punkte:
  - 'Ob die FINMA seit Dezember 2024 eine weitere KI-Äusserung veröffentlicht hat (Rundschreiben, Aufsichtsmitteilung,
    Risikomonitor), ist nicht abschliessend geprüft. Der FINMA-Risikomonitor erscheint jährlich im November
    und ist der wahrscheinlichste Fundort.

    '
  monitoring_quellen:
