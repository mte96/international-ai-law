- id: ch-stgb-cybermobbing
  jurisdiktion: ch
  kurztitel: Neuer Straftatbestand Cybermobbing (StGB-Änderung, in Vernehmlassung)
  offizieller_titel: 'Neuer Straftatbestand Cybermobbing — Änderung des Schweizerischen Strafgesetzbuches.
    Vorentwurf und erläuternder Bericht der Kommission für Rechtsfragen des Nationalrates

    '
  fundstelle: Vernehmlassungsvorlage, fedlex-Projektnummer 2026/52 (ELI dl/proj/2026/52/cons_1).
  verfahrensnummer: Kommission für Rechtsfragen des Nationalrates (RK-N)
  status: entwurf
  status_detail: 'Vernehmlassung am 27.05.2026 eröffnet, Frist 17.09.2026 — am 07.09.2026 also LAUFEND
    und in zehn Tagen ablaufend. Kommissionsvorlage, keine Bundesratsvorlage.

    '
  kurzbeschreibung: 'Die Rechtskommission des Nationalrates will das strafrechtliche Instrumentarium gegen
    Mobbing und Cybermobbing verstärken und den Schutz betroffener Personen verbessern. Die Vorlage betrifft
    Deepfakes nicht ausdrücklich, ist aber die einzige am Stichtag laufende strafrechtliche Vernehmlassung
    im Umfeld digitaler Persönlichkeitsverletzungen und deshalb der wahrscheinlichste Anknüpfungspunkt,
    an dem ein Deepfake-Tatbestand im parlamentarischen Verfahren angehängt werden könnte.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
