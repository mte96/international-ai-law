  offene_punkte:
  - 'ZENTRALE LÜCKE DIESER DATEI FÜR ÖSTERREICH: Gibt es ein österreichisches KI-Marktüberwachungs- bzw.
    Durchführungsgesetz zur KI-VO, und wenn ja, unter welcher BGBl-Nummer? Der Auftragstext nimmt es an;
    belegen liess es sich nicht. Der nächste Bearbeiter sollte in ris.bka.gv.at (Bundesgesetzblätter 2025
    und 2026, Suchwort "Künstliche Intelligenz") und in parlament.gv.at (Regierungsvorlagen XXVIII. GP)
    gezielt suchen.

    '
  - 'Der Inhalt und die genaue Rechtsnatur des "Omnibus VII (KI)" sind hier nur nach der Angabe der amtlichen
    österreichischen Seite wiedergegeben; der EU-Rechtsakt selbst ist nicht geprüft worden. Die dort genannten
    neuen Fristen sind bei no-ki-loven mit den vom norwegischen Ministerium genannten Daten (02.12.2027
    und 02.08.2028) zu vergleichen.

    '
