- id: at-ki-servicestelle-kog-tkg
  jurisdiktion: at
  kurztitel: KI-Servicestelle bei der RTR (§ 20c KOG, § 194a TKG 2021)
  offizieller_titel: 'Bundesgesetz, mit dem das KommAustria-Gesetz und das Telekommunikationsgesetz 2021
    geändert werden (Einrichtung einer Servicestelle für Künstliche Intelligenz und eines Beirats für
    Künstliche Intelligenz bei der Rundfunk und Telekom Regulierungs-GmbH)

    '
  fundstelle: BGBl. I Nr. 6/2024, ausgegeben am 26. Februar 2024.
  verfahrensnummer: BGBl. I Nr. 6/2024
  status: anwendbar
  status_detail: 'In Kraft seit 01.01.2024 (rückwirkende Inkraftsetzung; Kundmachung 26.02.2024). Die
    KI-Servicestelle hat ihren Betrieb am 01.02.2024 aufgenommen. Damit hatte Österreich eine KI-Anlaufstelle,
    BEVOR die KI-Verordnung in Kraft trat.

    '
  kurzbeschreibung: 'Österreich hat die institutionelle Vorbereitung auf die KI-Verordnung über eine Novelle
    zweier Regulierungsgesetze geregelt. § 20c KOG beauftragt die RTR-GmbH mit dem Betrieb einer "Servicestelle
    für Künstliche Intelligenz": Information, Web-Leitfäden und Best Practices für den Medienbereich,
    Beratung öffentlicher und privater Rechtsträger, Studien und Analysen, Publikationen, Fachveranstaltungen
    und ein Informationsportal für KI-Projekte. Daneben wird ein elfköpfiger "Beirat für Künstliche Intelligenz"
    eingerichtet, dessen Mitglieder vom Bundeskanzler und vom Finanzminister bestellt werden. Finanziert
    wird die Servicestelle mit jährlich 700 000 Euro aus dem Bundeshaushalt (Auszahlung per 31. Jänner),
    ab 2026 inflationsangepasst. § 194a TKG 2021 ergänzt das um Beratungsleistungen zu regulatorischen
    Rahmenbedingungen, technischer Dokumentation von KI-Systemen, Cybersicherheitsauswirkungen und KI
    in Hochrisikobereichen. Eigene Sanktionsbefugnisse hat die Servicestelle NICHT — sie ist Service-
    und Informationsstelle, keine Marktüberwachungsbehörde.

    '
  inkrafttreten:
    datum: 2024-01-01
    verifiziert: true
    quelle: https://www.ris.bka.gv.at/Dokumente/BgblAuth/BGBLA_2024_I_6/BGBLA_2024_I_6.html
  anwendungsdaten:
  - datum: 2024-02-01
    was_gilt: Betriebsaufnahme der KI-Servicestelle bei der RTR-GmbH.
    verifiziert: true
