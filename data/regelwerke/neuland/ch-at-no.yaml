- id: ch-embag
  jurisdiktion: ch
  kurztitel: EMBAG — elektronische Mittel zur Erfüllung von Behördenaufgaben
  offizieller_titel: 'Bundesgesetz vom 17. März 2023 über den Einsatz elektronischer Mittel zur Erfüllung
    von Behördenaufgaben (EMBAG)

    '
  fundstelle: 'SR 172.019. Fassung: Stand am 1. Mai 2025.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.01.2024. Fassung am 07.09.2026 "Stand am 1. Mai 2025".

    '
  kurzbeschreibung: 'Das EMBAG ist die Rechtsgrundlage für den digitalen Verwaltungsvollzug des Bundes
    und damit der Rahmen, in dem KI in der Bundesverwaltung eingesetzt wird. Es regelt die elektronische
    Aufgabenerfüllung, die Zusammenarbeit von Bund und Kantonen bei digitalen Verwaltungs- leistungen,
    den Betrieb gemeinsamer Infrastrukturen sowie — als international beachtete Besonderheit — den GRUNDSATZ
    "Open Source by default" für Software, die der Bund entwickeln oder entwickeln lassen darf, und die
    Pflicht zur Bereitstellung von Behördendaten als Open Government Data. Für KI ist das doppelt relevant:
    als Ermächtigungsgrundlage für den Einsatz automatisierter Systeme und als Quelle offener Trainingsdaten.

    '
  inkrafttreten:
    datum: 2024-01-01
    verifiziert: false
    quelle: https://www.fedlex.admin.ch/eli/cc/2023/682/de
  anwendungsdaten: []
  themenachsen:
  - sektor-oeffentlich
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - 'Offenlegung des Quellcodes von Bundessoftware ("Open Source by default") — eine im internationalen
    Vergleich seltene gesetzliche Pflicht, die auch für KI-Komponenten des Bundes gilt, soweit keine Ausnahme
    greift.

    '
  - 'Open Government Data: Behördendaten sind grundsätzlich maschinen- lesbar und kostenlos zur Verfügung
    zu stellen. Das ist die Rechtsgrundlage, auf der Trainingsdaten aus der Bundesverwaltung zugänglich
    sind.

    '
  - 'Rechtsgrundlage für Pilotversuche mit neuen Technologien in der Bundesverwaltung — der Weg, auf dem
    KI-Anwendungen vor einer dauerhaften gesetzlichen Regelung erprobt werden.

    '
  dokumente:
  - datum: 2025-05-01
    typ: konsolidiert
    titel: SR 172.019 — EMBAG, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/2023/682/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: Stand am 1. Mai 2025.
  offene_punkte:
  - 'Die genauen Artikelnummern für Open Source, OGD und Pilotversuche sind nicht einzeln am Text abgeglichen
    worden; Titel, SR-Nummer und Fassungsdatum sind verifiziert, die inhaltliche Zuordnung beruht auf
    der Gesetzessystematik und ist am Volltext nachzuprüfen.

    '
  monitoring_quellen:
  - https://www.fedlex.admin.ch/eli/cc/2023/682/de
  - https://www.bk.admin.ch/
