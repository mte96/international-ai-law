- id: at-stgb-120a
  jurisdiktion: at
  kurztitel: StGB § 120a — Unbefugte Bildaufnahmen (die Deepfake-Lücke)
  offizieller_titel: Bundesgesetz über die mit gerichtlicher Strafe bedrohten Handlungen (Strafgesetzbuch
    — StGB)
  fundstelle: 'RIS Gesetzesnummer 10002296. § 120a in Geltung seit 01.01.2021, zuletzt geändert durch
    BGBl. I Nr. 148/2020.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Ein eigener Deepfake-Straftatbestand besteht am 07.09.2026 nicht; im
    Nationalrat liegt dazu ein Entschliessungsantrag (820/A(E) XXVIII. GP).

    '
  kurzbeschreibung: '§ 120a StGB stellt die unbefugte Herstellung von Bildaufnahmen der Genitalien, des
    Intimbereichs, des Gesässes, der weiblichen Brust oder der diese Bereiche bedeckenden Unterwäsche
    unter Strafe, wenn die Person diese Bereiche vor Blicken geschützt hat oder sich in einer Wohnstätte
    oder einem besonders geschützten Raum befindet (Freiheitsstrafe bis sechs Monate oder Geldstrafe bis
    360 Tagessätze), und das Zugänglichmachen oder Veröffentlichen solcher Aufnahmen (bis zwölf Monate
    oder 720 Tagessätze). Verfolgung nur auf Verlangen der verletzten Person. Der Tatbestand setzt eine
    AUFNAHME einer real existierenden Person in einer realen Situation voraus und erfasst synthetisch
    erzeugte Bilder deshalb nicht — das ist die österreichische Deepfake-Lücke, die strukturell derjenigen
    des schweizerischen Art. 179quater StGB entspricht.

    '
  inkrafttreten:
    datum: 2021-01-01
    verifiziert: true
    quelle: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10002296&Paragraf=120a
  anwendungsdaten: []
  themenachsen:
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Zwei Tatbestände: Herstellung (Abs. 1) und Verbreitung (Abs. 2), mit unterschiedlichem Strafrahmen.'
  - Antragsdelikt — Verfolgung nur auf Verlangen der verletzten Person.
  - 'Systematische Lücke: Erfasst werden Aufnahmen, nicht Erzeugnisse. Bei missbräuchlichen Deepfakes
    greift in der Praxis § 107c StGB (Cybermobbing), der aber nach dem Entschliessungsantrag 820/A(E)
    voraussetzt, dass die Handlung "für eine größere Zahl von Menschen wahrnehmbar" ist "und das für eine
    längere Zeit" — die blosse Erstellung bleibt straflos.

    '
