- id: at-dsg
  jurisdiktion: at
  kurztitel: Datenschutzgesetz (DSG) — § 41 automatisierte Entscheidungsfindung
  offizieller_titel: 'Bundesgesetz zum Schutz natürlicher Personen bei der Verarbeitung personenbezogener
    Daten (Datenschutzgesetz — DSG)

    '
  fundstelle: RIS Gesetzesnummer 10001597. Konsolidierte Fassung vom 07.09.2026.
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, konsolidierte Fassung vom 07.09.2026 am Text geprüft. WICHTIGE KORREKTUR:
    Das österreichische DSG enthält KEINEN § 22a. Die Vorschrift über automatisierte Entscheidungen ist
    § 41 DSG.

    '
  kurzbeschreibung: 'Das DSG ergänzt die unmittelbar geltende DSGVO. Für KI relevant sind drei Ebenen:
    das Grundrecht auf Datenschutz in § 1 DSG (eine Verfassungsbestimmung mit Drittwirkung, die es so
    in Deutschland nicht gibt), die unmittelbar anwendbare DSGVO einschliesslich Art. 22, und § 41 DSG
    für den Bereich der Strafverfolgung und Strafvollstreckung (3. Hauptstück, Umsetzung der Richtlinie
    (EU) 2016/680). § 41 Abs. 1 stellt ein grundsätzliches VERBOT auf: Ausschliesslich auf automatischer
    Verarbeitung beruhende Entscheidungen einschliesslich Profiling, die für die betroffene Person nachteilige
    Rechtsfolgen haben oder sie erheblich beeinträchtigen können, sind nur zulässig, soweit sie gesetzlich
    oder in unmittelbar anwendbaren Rechtsvorschriften mit Gesetzesrang ausdrücklich vorgesehen sind.
    Abs. 2 verschärft für besondere Kategorien personenbezogener Daten.

    '
  inkrafttreten:
    datum: 2018-05-25
    verifiziert: false
    quelle: https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10001597
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - '§ 1 DSG: Grundrecht auf Datenschutz im Verfassungsrang, mit Anspruch auch gegenüber Privaten. Das
    ist der Hebel, über den in Österreich Verfassungsargumente in KI-Datenschutzfälle hineinkommen.

    '
  - '§ 41 DSG (Automatisierte Entscheidungsfindung im Einzelfall, im 3. Hauptstück): Verbot mit Gesetzesvorbehalt
    für nachteilige vollautomatisierte Entscheidungen einschliesslich Profiling im Bereich Strafverfolgung/Strafvollzug.

    '
  - 'Ausserhalb dieses Bereichs gilt Art. 22 DSGVO unmittelbar; ein eigenständiges österreichisches Pendant
    gibt es NICHT. Wer nach einer Norm sucht, die für die allgemeine Wirtschaft gilt, findet sie im DSG
    nicht.

    '
  dokumente:
  - datum: 2026-09-07
    typ: konsolidiert
    titel: Datenschutzgesetz — Gesamte Rechtsvorschrift, Fassung vom 07.09.2026
    url: https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10001597
    sprache: de
    urheber: Bundeskanzleramt, Rechtsinformationssystem des Bundes
    verifiziert: true
    notiz: 'Konsolidierte Fassung; Paragrafenverzeichnis und § 41 im Volltext gelesen. Ein § 22a existiert
      nicht.

      '
  offene_punkte:
  - 'Inkrafttretensdatum des DSG in der aktuellen Fassung (25.05.2018) nicht am Text belegt.

    '
  - 'Entscheidungen der Datenschutzbehörde (DSB) zu KI sind nicht recherchiert worden — siehe Bericht.

    '
