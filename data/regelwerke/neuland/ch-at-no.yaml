  regelungsschwerpunkte:
  - '§ 20c KOG: Aufgabenkatalog der KI-Servicestelle. Kein Vollzugsauftrag, kein Bescheidrecht — bewusst
    als Service- und Informationsstelle konstruiert, damit sie vor Geltung der KI-VO arbeiten konnte.

    '
  - '§ 20c KOG: Beirat für Künstliche Intelligenz, 11 Mitglieder, Bestellung durch Bundeskanzler und Finanzminister,
    angesiedelt bei der RTR. Vertreten sind Universitäten, Industrie und Zivilgesellschaft.

    '
  - 'Finanzierung 700 000 Euro jährlich aus dem Bundeshaushalt, ab 2026 valorisiert. Das ist eine im europäischen
    Vergleich ungewöhnlich transparente Budgetregelung für eine KI-Stelle.

    '
  - '§ 194a TKG 2021: Beratung zu technischer Dokumentation von KI-Systemen und zu KI in Hochrisikobereichen
    — die inhaltliche Brücke zur KI-Verordnung.

    '
