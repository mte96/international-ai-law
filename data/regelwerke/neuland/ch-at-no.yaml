      dass kein Geltungsbeginn festgesetzt ist.

      '
  offene_punkte:
  - 'Der Beschluss des Gemeinsamen EWR-Ausschusses über die Übernahme der KI-Verordnung in Anhang II des
    EWR-Abkommens konnte NICHT belegt werden. Nummer und Datum fehlen. Der nächste Bearbeiter sollte efta.int
    (EEA Joint Committee Decisions) und die EWR-Notifikationsdatenbank prüfen. Solange dieser Beschluss
    fehlt, ist unklar, ob Norwegen überhaupt schon völkerrechtlich gebunden ist.

    '
  - 'Der Text des Anhörungsentwurfs vom Herbst 2025 ist nicht gelesen worden; Titel und Datum der Anhörung
    (høringsnotat) fehlen.

    '
  - 'Die vom DFD genannten verschobenen Fristen (02.12.2027, 02.08.2028) beziehen sich auf das EU-Recht;
    ob und wann sie für Norwegen gelten, hängt vom EWR-Übernahmebeschluss ab und ist offen.

    '
