- id: no-likestillingsloven
  jurisdiktion: 'no'
  kurztitel: likestillings- og diskrimineringsloven — Gleichstellung und Diskriminierungsverbot
  offizieller_titel: 'Lov om likestilling og forbud mot diskriminering (likestillings- og diskrimineringsloven)
    — Gesetz über Gleichstellung und das Verbot der Diskriminierung

    '
  fundstelle: 'LOV-2017-06-16-51, kundgemacht 16.06.2017, in Kraft seit 01.01.2018; zuletzt geändert durch
    LOV-2024-06-14-33 mit Wirkung vom 01.07.2024.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht.
  kurzbeschreibung: 'Das norwegische Antidiskriminierungsgesetz, das vier frühere Gesetze von 2013 zusammenführt.
    Für KI ist es die Norm, an der algorithmische Benachteiligung gemessen wird — bei automatisierter
    Bewerberauswahl, Kreditscoring, Versicherungstarifierung und behördlicher Risikobewertung. Es kennt
    sowohl unmittelbare als auch mittelbare Diskriminierung; gerade die mittelbare Diskriminierung durch
    scheinbar neutrale algorithmische Kriterien ist der praktisch relevante Anknüpfungspunkt. Durchgesetzt
    wird es über Diskrimineringsnemnda (Diskriminierungsausschuss) und Likestillings- og diskrimineringsombudet.
    Die Verbindung zu KI ist ausdrücklich auch in § 12 Abs. 1 Buchst. b der neuen forvaltningslov angelegt,
    der bei automatisierten Verwaltungsentscheidungen Massnahmen gegen "usaklig forskjellsbehandling"
    verlangt.

    '
  inkrafttreten:
    datum: 2018-01-01
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2017-06-16-51
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - arbeit
  - haftung
  regelungsschwerpunkte:
  - Unmittelbare und mittelbare Diskriminierung — letztere ist der Ansatzpunkt gegen algorithmischen Bias.
  - Durchsetzung über Diskrimineringsnemnda und das Likestillings- og diskrimineringsombud, nicht nur
    über Gerichte.
  - Aktivitäts- und Berichtspflichten für Arbeitgeber, die auf KI-gestützte Personalprozesse durchschlagen.
  dokumente:
  - datum: 2024-07-01
    typ: konsolidiert
    titel: LOV-2017-06-16-51 — likestillings- og diskrimineringsloven, amtlicher Text
    url: https://lovdata.no/dokument/NL/lov/2017-06-16-51
