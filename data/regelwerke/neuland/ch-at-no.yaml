  regelungsschwerpunkte:
  - 'Nkom (Nasjonal kommunikasjonsmyndighet) ist als nationale Koordinierungsbehörde für die KI-Verordnung
    in Norwegen benannt — eine andere Wahl als in den meisten EU-Staaten, wo Datenschutz- oder Produktsicherheitsbehörden
    die Rolle übernehmen.

    '
  - 'Der KI-Sandkasten nach norwegischem Recht soll erst nach Inkrafttreten der KI-loven verfügbar sein;
    bis dahin besteht nur die datenschutzrechtliche Sandkasse von Datatilsynet.

    '
  - 'Zweistufiges Anhörungsverfahren: Der erste Entwurf (Herbst 2025) erhielt rund 150 Stellungnahmen;
    wegen der EU-Änderungen wird das Verfahren wiederholt. Das ist ein selten deutliches Beispiel dafür,
    wie die EWR-Konstruktion nationale Gesetzgebung an den EU-Rechtsetzungsrhythmus koppelt.

    '
