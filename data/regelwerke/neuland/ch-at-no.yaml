  kurztitel: Entschliessungsantrag "Missbrauchs-Deepfakes bekämpfen" (820/A(E) XXVIII. GP)
  offizieller_titel: 'Entschliessungsantrag der Abgeordneten Meri Disoski, Süleyman Zorba und weiterer
    Abgeordneter betreffend Missbrauchs-Deepfakes bekämpfen — Gesetzeslücken schliessen

    '
  fundstelle: 820/A(E) XXVIII. GP, eingebracht am 23.04.2026.
  verfahrensnummer: 820/A(E) XXVIII. GP
  status: verfahren
  status_detail: 'Eingebracht am 23.04.2026 von Abgeordneten der Grünen. Ein Entschliessungsantrag ist
    kein Gesetzentwurf, sondern eine Aufforderung an die Bundesregierung; er entfaltet keine unmittelbare
    Rechtswirkung. Stand der Ausschussberatung am 07.09.2026 nicht ermittelt.

    '
  kurzbeschreibung: 'Der Antrag benennt die Strafbarkeitslücke bei missbräuchlichen Deepfakes: Der Cybermobbing-Tatbestand
    des § 107c StGB verlangt, dass die Handlung für eine grössere Zahl von Menschen und für längere Zeit
    wahrnehmbar ist; die blosse ERSTELLUNG missbräuchlicher Deepfakes bleibt damit straflos. Der Antrag
    fordert, die Strafbarkeit "nicht erst ab Zeitpunkt der Veröffentlichung, sondern auch bei Erstellung
    derartiger Inhalte" eintreten zu lassen, und verweist als Vorbild auf § 207a StGB (bildliches Kindesmissbrauchsmaterial),
    wo bereits die Herstellung strafbar ist.

    '
