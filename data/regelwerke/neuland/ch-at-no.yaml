- id: no-medieansvarsloven
  jurisdiktion: 'no'
  kurztitel: medieansvarsloven — redaktionelle Verantwortlichkeit
  offizieller_titel: 'Lov om redaksjonell uavhengighet og ansvar i redaktørstyrte journalistiske medier
    (medieansvarsloven) — Gesetz über redaktionelle Unabhängigkeit und Verantwortung in redaktionell geleiteten
    journalistischen Medien

    '
  fundstelle: LOV-2020-05-29-59, kundgemacht 29.05.2020, in Kraft seit 01.07.2020.
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht.
  kurzbeschreibung: 'Regelt die redaktionelle Unabhängigkeit und die Verantwortlichkeitsverteilung in
    redaktionell geleiteten journalistischen Medien: Pflichten bei der Veröffentlichung (Kapitel 2, §§
    4–6), redaktionelle Unabhängigkeit (Kapitel 3, § 7) und die Haftung des Redakteurs. Für KI ist das
    Gesetz der Rahmen, in dem sich die Verantwortung für KI-generierte oder KI-gestützte redaktionelle
    Inhalte bestimmt: Wer redaktionell verantwortlich ist, bleibt es auch für maschinell erzeugte Beiträge.

    '
  inkrafttreten:
    datum: 2020-07-01
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2020-05-29-59
  anwendungsdaten: []
  themenachsen:
  - content
  - haftung
  - grundrechte
  regelungsschwerpunkte:
  - 'Kapitel 2 (§§ 4–6): Pflichten bei der Veröffentlichung.'
  - 'Kapitel 3 (§ 7): redaktionelle Unabhängigkeit.'
  - 'Anknüpfungspunkt für die Frage, wer für KI-erzeugte redaktionelle Inhalte haftet — das Gesetz kennt
    keine KI-spezifische Ausnahme.

    '
