- id: no-aandsverkloven
  jurisdiktion: 'no'
  kurztitel: åndsverkloven — Urheberrecht ohne TDM-Schranke
  offizieller_titel: 'Lov om opphavsrett til åndsverk mv. (åndsverkloven) — Gesetz über das Urheberrecht
    an Werken

    '
  fundstelle: 'LOV-2018-06-15-40, in Kraft seit 01.07.2018; zuletzt geändert durch LOV-2024-12-13-76 mit
    Wirkung vom 01.01.2025. Berichtigt am 28.11.2025 (Aktualisierung der EWR-Fussnoten).

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. WICHTIGER BEFUND: Kapitel 3 (Avgrensning av opphavsretten) wurde am
    07.09.2026 auf die Begriffe "tekst- og datautvinning" und "datautvinning" geprüft — OHNE TREFFER.
    Norwegen hatte zu diesem Zeitpunkt KEINE TDM-Schranke; sie ist erst mit Prop. 41 LS (2025–2026) im
    Gesetzgebungsverfahren.

    '
  kurzbeschreibung: 'Das norwegische Urheberrechtsgesetz. Für KI ist der auffälligste Befund eine Abwesenheit:
    Anders als Österreich (§ 42h UrhG) und Deutschland (§§ 44b, 60d UrhG) hat Norwegen die TDM-Schranken
    der Art. 3 und 4 der Richtlinie (EU) 2019/790 noch nicht umgesetzt. Für das Training von KI-Modellen
    auf urheberrechtlich geschützten Werken besteht in Norwegen damit — wie in der Schweiz — keine gesetzliche
    Erlaubnis. Die Umsetzung ist mit Prop. 41 LS (2025–2026) beim Storting anhängig; dort sollen die TDM-Regeln
    nach Angaben aus dem Verfahren in §§ 50 d und 50 e åndsverkloven eingefügt werden.

    '
  inkrafttreten:
    datum: 2018-07-01
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2018-06-15-40
  anwendungsdaten: []
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - 'Keine TDM-Schranke im geltenden Recht (Prüfung von Kapitel 3 am 07.09.2026 ohne Treffer). Wer in
    Norwegen zu kommerziellen Zwecken trainiert, braucht Lizenzen.

    '
  - 'Norwegen arbeitet stark mit der AVTALELISENS (erweiterte kollektive Lizenz), die im Gesetzestitel
    ausdrücklich genannt ist ("forvaltning av rettigheter ved avtalelisens mv."). Das ist der nordische
    Sonderweg und der wahrscheinlichste Mechanismus, über den KI-Training in Norwegen lizenziert wird
    — ein für den Rechtsvergleich sehr lohnender Punkt.

    '
  dokumente:
  - datum: 2025-01-01
    typ: konsolidiert
    titel: LOV-2018-06-15-40 — åndsverkloven, amtlicher Text
    url: https://lovdata.no/dokument/NL/lov/2018-06-15-40
    sprache: 'no'
    urheber: Lovdata / Kultur- og likestillingsdepartementet
    verifiziert: true
    notiz: 'Metadaten und Kapitel 3 (Abgrenzung des Urheberrechts) gelesen; Prüfung auf TDM-Begriffe ohne
      Treffer.

      '
  offene_punkte:
  - 'Die Prüfung auf eine TDM-Schranke beschränkte sich auf Kapitel 3. Sollte eine solche Vorschrift an
    anderer Stelle stehen, wäre der Befund zu korrigieren; die Existenz von Prop. 41 LS spricht aber klar
    dafür, dass sie fehlt.

    '
  monitoring_quellen:
  - https://lovdata.no/dokument/NL/lov/2018-06-15-40
