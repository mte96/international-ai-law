- id: ch-dsv
  jurisdiktion: ch
  kurztitel: Datenschutzverordnung (DSV)
  offizieller_titel: Verordnung vom 31. August 2022 über den Datenschutz (Datenschutzverordnung, DSV)
  fundstelle: 'SR 235.11. Fassung: Stand am 1. Dezember 2025.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.09.2023 zusammen mit dem DSG; seither geändert, Fassung am 07.09.2026
    "Stand am 1. Dezember 2025".

    '
  kurzbeschreibung: 'Ausführungsrecht zum DSG. Konkretisiert die Mindestanforderungen an die Datensicherheit,
    die Modalitäten des Auskunftsrechts, die Führung des Verzeichnisses der Bearbeitungstätigkeiten, die
    Bekanntgabe ins Ausland und die Aufgaben des EDÖB. Für KI-Anwendungen relevant vor allem über die
    Datensicherheitsanforderungen und die Protokollierungs- pflichten, die bei automatisierten Bearbeitungen
    greifen.

    '
  inkrafttreten:
    datum: 2023-09-01
    verifiziert: false
    quelle: https://www.fedlex.admin.ch/eli/cc/2022/568/de
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Protokollierungspflicht: Bei automatisierter Bearbeitung besonders schützenswerter Personendaten
    in grossem Umfang bzw. bei Profiling mit hohem Risiko ist zu protokollieren; das ist die Norm, über
    die sich die Nachvollziehbarkeit einer KI-gestützten Bearbeitung im Streitfall belegen lässt.

    '
  - 'Konkretisierung der Datensicherheit (Vertraulichkeit, Verfügbarkeit, Integrität, Nachvollziehbarkeit)
    — Prüfmassstab auch für KI-Systeme.

    '
  dokumente:
  - datum: 2025-12-01
    typ: konsolidiert
    titel: SR 235.11 — Datenschutzverordnung, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/2022/568/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: Stand am 1. Dezember 2025.
  offene_punkte:
  - 'Die genauen Artikelnummern der Protokollierungs- und Datensicherheitsvorschriften sind nicht einzeln
    am Text abgeglichen worden; nur Titel, SR-Nummer und Fassungsdatum sind verifiziert.

    '
