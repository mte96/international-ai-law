- id: ch-dsg
  jurisdiktion: ch
  kurztitel: Datenschutzgesetz (DSG), revidierte Fassung
  offizieller_titel: Bundesgesetz vom 25. September 2020 über den Datenschutz (Datenschutzgesetz, DSG)
  fundstelle: 'SR 235.1; AS 2022 491. Fassung: Stand am 1. September 2023.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.09.2023 (Totalrevision; ersetzt das DSG von 1992). Fassung am 07.09.2026
    unverändert "Stand am 1. September 2023".

    '
  kurzbeschreibung: 'Das zentrale Gesetz, an dem KI-Fälle in der Schweiz tatsächlich entschieden werden.
    Es regelt die Bearbeitung von Personendaten durch private Personen und Bundesorgane, kennt Grundsätze
    (Art. 6), Informationspflichten (Art. 19 ff.), Auskunftsrecht (Art. 25), Datenschutz-Folgenabschätzung
    (Art. 22) und — für KI entscheidend — Art. 21 zur automatisierten Einzelentscheidung. Sanktioniert
    wird nicht durch Verwaltungsbussen wie in der DSGVO, sondern über Art. 60 ff. strafrechtlich: Busse
    bis 250 000 Franken gegen die VERANTWORTLICHE NATÜRLICHE PERSON, auf Antrag. Das ist der praktisch
    wichtigste Unterschied zur DSGVO und macht das Schweizer Datenschutzrecht für Unternehmen weniger,
    für Einzelpersonen deutlich riskanter.

    '
  inkrafttreten:
    datum: 2023-09-01
    verifiziert: true
    quelle: https://www.fedlex.admin.ch/eli/cc/2022/491/de
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - grundrechte
  - haftung
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Art. 21: Informationspflicht bei einer automatisierten Einzelentscheidung. Die Schweiz hat sich damit
    ausdrücklich GEGEN das Modell des Art. 22 DSGVO entschieden: Es gibt KEIN grundsätzliches Verbot automatisierter
    Einzelentscheidungen mit Erlaubnisvorbehalt, sondern eine Informations- und eine Überprüfungspflicht.
    Die betroffene Person kann verlangen, dass die Entscheidung "von einer natürlichen Person überprüft
    wird" (Abs. 2). Ausnahmen in Abs. 3 für Vertragsabwicklung mit Stattgabe des Begehrens und für ausdrückliche
    Einwilligung.

    '
  - 'Art. 21 Abs. 4: Bundesorgane müssen die automatisierte Einzelentscheidung KENNZEICHNEN. Das Recht
    auf menschliche Überprüfung entfällt, soweit nach Art. 30 Abs. 2 VwVG oder einem anderen Bundesgesetz
    keine vorgängige Anhörung nötig ist. Das ist die schweizerische Nahtstelle zwischen Datenschutz- und
    Verwaltungsverfahrensrecht.

    '
  - 'Art. 22: Datenschutz-Folgenabschätzung bei hohem Risiko, namentlich bei Einsatz neuer Technologien;
    Art. 23: Konsultation des EDÖB, wenn das Restrisiko hoch bleibt. Das ist der Hebel, über den der EDÖB
    KI-Vorhaben vorab zu sehen bekommt.

    '
  - 'Art. 60 ff.: Strafbestimmungen. Vorsätzliche Verletzung von Informations-, Auskunfts- und Sorgfaltspflichten,
    Busse bis 250 000 Franken, Antragsdelikt, gerichtet gegen die verantwortliche natürliche Person (Art.
    64 regelt die Zurechnung im Unternehmen).

    '
  dokumente:
  - datum: 2023-09-01
    typ: konsolidiert
    titel: SR 235.1 — Datenschutzgesetz, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/2022/491/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: Amtlicher konsolidierter Text, Stand am 1. September 2023.
  offene_punkte:
  - 'Ob die KI-Umsetzungsvorlage Art. 21 DSG ändert (z.B. Ausweitung auf teilautomatisierte Entscheidungen
    oder Begründungspflicht), ist offen und einer der wichtigsten Beobachtungspunkte.

    '
