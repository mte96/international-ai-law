- id: no-forvaltningsloven-2025
  jurisdiktion: 'no'
  kurztitel: Neue forvaltningslov (2025) — §§ 11, 12 automatisierte Verwaltungsentscheidungen
  offizieller_titel: 'Lov 20. juni 2025 nr. 81 om saksbehandlingen i offentlig forvaltning (forvaltningsloven)
    — Gesetz über das Verfahren in der öffentlichen Verwaltung

    '
  fundstelle: 'LOV-2025-06-20-81, kundgemacht am 20.06.2025 um 12.45 Uhr. Prop. 79 L (2024–2025), Innst.
    478 L (2024–2025), Lovvedtak 119 (2024–2025); erste und zweite Lesung im Storting am 11. bzw. 16.06.2025.
    Vorgelegt vom Justis- og beredskapsdepartementet. Beruht auf der Ausarbeitung des Forvaltningslovutvalget
    in NOU 2019:5 "Ny forvaltningslov".

    '
  verfahrensnummer: Prop. 79 L (2024–2025) / Lovvedtak 119 (2024–2025)
  status: verabschiedet
  status_detail: 'Beschlossen und kundgemacht, aber am 07.09.2026 NOCH NICHT IN KRAFT: Lovdata weist als
    Ikrafttredelse "Kongen bestemmer" aus, ein Inkrafttretensbeschluss ist dort nicht vermerkt. Das Gesetz
    ersetzt die forvaltningslov von 1967, ändert daneben LOV-1999-01-29-6 und LOV-2018-06-22-83.

    '
  kurzbeschreibung: 'Das für KI wichtigste norwegische Gesetzgebungswerk. Die neue forvaltningslov regelt
    in §§ 11 und 12 erstmals ausdrücklich die automatisierte Sachbearbeitung in der Verwaltung. § 11 erlaubt
    Verwaltungsorganen grundsätzlich, die Sachbearbeitung zu automatisieren und Entscheidungen automatisiert
    zu treffen, sofern die übrigen Verfahrensanforderungen erfüllt bleiben; sie ist unzulässig, wenn die
    materielle Rechtsgrundlage entgegensteht, und für Entscheidungen im Anwendungsbereich des Art. 22
    DSGVO bedarf es einer besonderen gesetzlichen Ermächtigung. § 12 gibt der betroffenen Person bei solchen
    Entscheidungen ein RECHT AUF ERKLÄRUNG UND AUF MANUELLE KONTROLLE und verpflichtet die Behörde zu
    technisch-organisatorischen Massnahmen gegen Datenfehler, gegen sachlich nicht gerechtfertigte Ungleichbehandlung
    und zum Einsatz geeigneter mathematischer und statistischer Verfahren, besonders beim Profiling.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2025-06-20-81
  anwendungsdaten:
  - datum: 2025-06-20
    was_gilt: Sanktionierung im Staatsrat und Kundmachung; Inkrafttreten bleibt königlichem Beschluss
      vorbehalten.
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2025-06-20-81
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - '§ 11 Abs. 1: "Et forvaltningsorgan kan automatisere saksbehandlingen, herunder treffe avgjørelser
    automatisert, såfremt kravene som ellers stilles til saksbehandlingen, oppfylles." Grundsatzerlaubnis
    mit Vorbehalt der übrigen Verfahrensanforderungen.

    '
  - '§ 11 Abs. 2: Automatisierung ist unzulässig, wenn die Rechtsgrundlage der Entscheidung ihr entgegensteht
    — die Norm, über die Ermessens- und Beurteilungsspielräume gegen Vollautomatisierung geschützt werden.

    '
  - '§ 11 Abs. 3: Ohne besondere gesetzliche Ermächtigung ("uten særlig hjemmel") dürfen keine automatisierten
    Entscheidungen getroffen werden, die unter Art. 22 DSGVO fallen. Damit übernimmt Norwegen das Verbot-mit-Erlaubnisvorbehalt-Modell
    für den Verwaltungsbereich.

    '
  - '§ 11 Abs. 4: Verordnungsermächtigung für den König über Entwicklung und Einsatz von Systemen zur
    automatisierten Sachbearbeitung UND ÜBER DEREN INHALT — eine bemerkenswert weit gefasste Grundlage
    für künftiges technisches Regulierungsrecht.

    '
  - '§ 12 Abs. 1: Pflicht zu Massnahmen, die (a) sichere Verarbeitung und Fehlervermeidung/-korrektur,
    (b) das Unterbleiben sachlich nicht gerechtfertigter Ungleichbehandlung ("usaklig forskjellsbehandling")
    und (c) geeignete mathematische und statistische Verfahren, besonders bei Profiling, gewährleisten.
    Das ist eine Antidiskriminierungspflicht mit technischem Inhalt.

    '
  - '§ 12 Abs. 2: "Den registrerte har rett til en forklaring og en manuell kontroll av avgjørelsen som
    er truffet." Die Behörde hat die Erklärung und die Belehrung über das Recht auf manuelle Kontrolle
    so bald wie möglich nach der Entscheidung zu geben, bei Einzelentscheidungen spätestens in der Mitteilung
    über die Entscheidung (§ 59 Abs. 3 Buchst. b). Vom Akteneinsichtsrecht nach § 50 ausgenommene Angaben
    dürfen aus der Erklärung weggelassen werden.

    '
