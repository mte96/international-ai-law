  - grundrechte
  regelungsschwerpunkte:
  - 'Offene Zuständigkeitsfrage: Die KI-Servicestelle bei der RTR ist nach ihrer Rechtsgrundlage (§ 20c
    KOG) Service- und Informationsstelle ohne Vollzugsbefugnis. Wer in Österreich Marktüberwachungsbehörde
    nach Art. 70 KI-VO ist und wer die Bussen nach Art. 99 KI-VO verhängt, liess sich am Stichtag nicht
    amtlich belegen.

    '
  - 'Grundrechtsschutzbehörden nach Art. 77 KI-VO: Der Bund führt dafür eine eigene Übersichtsseite (digitalaustria.gv.at/.../behoerden-art77-ai-act.html);
    deren Inhalt ist nicht ausgelesen worden.

    '
