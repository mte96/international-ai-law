  regelungsschwerpunkte:
  - 'Vollständig automatisierte Erledigungen: Durchbrechung des Genehmigungserfordernisses des § 18 Abs.
    3 AVG.

    '
  - 'WEGFALL des im Ministerialentwurf noch vorgesehenen Widerspruchsrechts gegen automatisierte Bescheide
    — der zentrale Streitpunkt. Damit fehlt der österreichischen Lösung genau das Element, das die norwegische
    (§ 12 Abs. 2 forvaltningsloven 2025: Recht auf Erklärung und manuelle Kontrolle) und die schweizerische
    (Art. 21 Abs. 2 DSG: Recht auf Überprüfung durch eine natürliche Person) enthalten.

    '
