- id: at-egovg
  jurisdiktion: at
  kurztitel: E-Government-Gesetz (E-GovG)
  offizieller_titel: 'Bundesgesetz über Regelungen zur Erleichterung des elektronischen Verkehrs mit öffentlichen
    Stellen (E-Government-Gesetz — E-GovG)

    '
  fundstelle: 'BGBl. I Nr. 10/2004, zuletzt geändert durch BGBl. I Nr. 104/2018; RIS Gesetzesnummer 20003230.
    § 1 in der Fassung in Kraft seit 23.09.2020.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht.
  kurzbeschreibung: 'Rahmen für die elektronische Kommunikation mit österreichischen Behörden. § 1 nennt
    zwei Ziele: die Förderung rechtlich relevanter elektronischer Kommunikation und die Vereinfachung
    des elektronischen Verkehrs mit Behörden sowie — für KI der interessantere Teil — die Schaffung besonderer
    technischer Schutzmechanismen gegen Gefahren, die durch VERSTÄRKTE AUTOMATISIERTE DATENVERARBEITUNG
    entstehen. Das Gesetz regelt insbesondere die bereichsspezifischen Personenkennzeichen, die Identifizierung
    und Authentifizierung (Bürgerkarte/ID Austria) und den elektronischen Datenverkehr zwischen Behörden.
    Für automatisierte Verwaltungsentscheidungen ist es die technische Ergänzung zum AVG (siehe at-avg-novelle-2026).

    '
  inkrafttreten:
    datum: 2004-03-01
    verifiziert: false
    quelle: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20003230&Paragraf=1
  anwendungsdaten: []
  themenachsen:
  - sektor-oeffentlich
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - '§ 1: Ausdrücklicher Auftrag, technische Schutzmechanismen gegen die Gefahren verstärkter automatisierter
    Datenverarbeitung zu schaffen — ein bemerkenswert früher gesetzlicher Anknüpfungspunkt (2004) für
    das, was heute KI-Governance heisst.

    '
  - 'Bereichsspezifische Personenkennzeichen als Instrument der Zweckbindung — sie begrenzen die Verkettbarkeit
    von Datenbeständen und damit die Trainingsgrundlage behördlicher KI.

    '
  dokumente:
  - datum: 2020-09-23
    typ: konsolidiert
    titel: § 1 E-GovG — konsolidierte Fassung im RIS
    url: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20003230&Paragraf=1
    sprache: de
    urheber: Bundeskanzleramt, Rechtsinformationssystem des Bundes
    verifiziert: true
    notiz: Amtlicher konsolidierter Text des § 1, gelesen.
  offene_punkte:
  - Nur § 1 gelesen; die übrigen Vorschriften sind nicht geprüft.
  - Inkrafttretensdatum des Stammgesetzes nicht am Text belegt.
