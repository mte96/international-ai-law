- id: ch-uwg
  jurisdiktion: ch
  kurztitel: Bundesgesetz gegen den unlauteren Wettbewerb (UWG)
  offizieller_titel: Bundesgesetz vom 19. Dezember 1986 gegen den unlauteren Wettbewerb (UWG)
  fundstelle: 'SR 241. Fassung: Stand am 1. Januar 2025.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Der Gesetzestext enthält am 07.09.2026 KEINE Erwähnung von künstlicher
    Intelligenz (Volltextprüfung am konsolidierten Text durchgeführt).

    '
  kurzbeschreibung: 'Das UWG ist in der Schweiz der Hebel gegen irreführende KI-Werbung, gegen unlautere
    Chatbots und gegen die Verwendung synthetischer Inhalte im geschäftlichen Verkehr. Zentral ist die
    Generalklausel des Art. 2 (unlauter ist jedes täuschende oder gegen Treu und Glauben verstossende
    Verhalten, das das Verhältnis zwischen Mitbewerbern oder zwischen Anbietern und Abnehmern beeinflusst)
    und der Katalog des Art. 3 Abs. 1, insbesondere die Irreführungstatbestände. Verstösse sind nach Art.
    23 auf Antrag strafbar (Freiheitsstrafe bis zu drei Jahren oder Geldstrafe); daneben stehen die zivilrechtlichen
    Ansprüche nach Art. 9 ff.

    '
  inkrafttreten:
    datum: 1988-03-01
    verifiziert: false
    quelle: https://www.fedlex.admin.ch/eli/cc/1988/223_223_223/de
  anwendungsdaten: []
  themenachsen:
  - wettbewerb
  - content
  - vertrag
  regelungsschwerpunkte:
  - 'Art. 2 Generalklausel — auffangfähig für KI-Sachverhalte, für die es keinen speziellen Tatbestand
    gibt (z.B. nicht offengelegter Einsatz eines Chatbots als vermeintlicher Mensch).

    '
  - 'Art. 3 Abs. 1 lit. b: unrichtige oder irreführende Angaben über sich, seine Waren oder Leistungen
    — der Tatbestand für "KI-gewaschene" Produktversprechen (AI-Washing).

    '
  - 'KEINE Kennzeichnungspflicht für KI-erzeugte Inhalte im schweizerischen Lauterkeitsrecht. Die Transparenzpflicht
    des Art. 50 KI-VO hat in der Schweiz kein Gegenstück; ob eine solche Pflicht über die Umsetzung der
    Europaratskonvention eingeführt wird, ist der zu beobachtende Punkt.

    '
  dokumente:
  - datum: 2025-01-01
    typ: konsolidiert
    titel: SR 241 — UWG, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/1988/223_223_223/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: 'Stand am 1. Januar 2025. Volltext auf den Begriff "künstliche Intelligenz" geprüft — kommt
      nicht vor.

      '
  offene_punkte:
  - 'Inkrafttretensdatum 01.03.1988 nicht am Text belegt; deshalb verifiziert: false.

    '
  - 'Ob das SECO (zuständig für die Lauterkeitsaufsicht nach Art. 10 Abs. 3 UWG) zu KI-Werbung Praxis
    gebildet hat, ist nicht geprüft.

    '
  monitoring_quellen:
  - https://www.fedlex.admin.ch/eli/cc/1988/223_223_223/de
  - https://www.seco.admin.ch/
  bezug_regelwerke:
  - ch-ki-regulierung-grundsatzentscheid
