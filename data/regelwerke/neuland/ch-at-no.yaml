- id: ch-stgb
  jurisdiktion: ch
  kurztitel: Schweizerisches Strafgesetzbuch (StGB) — Bild- und Persönlichkeitsschutz
  offizieller_titel: Schweizerisches Strafgesetzbuch vom 21. Dezember 1937
  fundstelle: 'SR 311.0. Fassung: Stand am 12. Juni 2026.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, Fassung Stand am 12.06.2026. Ein eigener Deepfake-Straftatbestand ist
    am 07.09.2026 NICHT in Kraft; die einschlägigen Sachverhalte werden über die Tatbestände des Schutzes
    des Geheim- und Privatbereichs (Art. 179 ff.), der Ehrverletzung (Art. 173 ff.), der Pornografie (Art.
    197) und des Betrugs (Art. 146) erfasst.

    '
  kurzbeschreibung: 'Für KI-Sachverhalte sind vier Normengruppen einschlägig: Art. 179 ff. (Verletzung
    des Geheim- oder Privatbereichs, insbesondere Art. 179quater für Bildaufnahmen), Art. 173 ff. (Ehrverletzung,
    für rufschädigende Deepfakes), Art. 197 (Pornografie, für sexualisierte Deepfakes, mit besonderer
    Schärfe bei Darstellungen mit Minderjährigen) und Art. 146 (Betrug, für Stimmklon- und Identitätsbetrug).
    Die Schwäche des geltenden Rechts liegt darin, dass Art. 179quater eine AUFNAHME einer tatsächlichen
    Begebenheit voraussetzt — ein synthetisch erzeugtes Bild ist keine Aufnahme einer Tatsache aus dem
    Privatbereich. Genau an dieser Lücke setzt die politische Debatte an.

    '
  inkrafttreten:
    datum: 1942-01-01
    verifiziert: false
    quelle: https://www.fedlex.admin.ch/eli/cc/54/757_781_799/de
  anwendungsdaten: []
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Art. 179quater: Strafbar ist, wer eine Tatsache aus dem Geheimbereich oder eine nicht ohne weiteres
    zugängliche Tatsache aus dem Privatbereich eines anderen ohne dessen Einwilligung "mit einem Aufnahmegerät
    beobachtet oder auf einen Bildträger aufnimmt"; ebenso das Auswerten, Bekanntgeben, Aufbewahren und
    Zugänglichmachen solcher Aufnahmen. Freiheitsstrafe bis zu drei Jahren oder Geldstrafe, ANTRAGSDELIKT.
    Der Wortlaut setzt eine reale Aufnahme voraus und erfasst rein synthetische Bilder nicht.

    '
  - 'Zivilrechtlich tritt Art. 28 ZGB (Schutz der Persönlichkeit, Recht am eigenen Bild) daneben; er ist
    in der Schweiz der praktisch wichtigere Hebel gegen Deepfakes, weil er keine reale Aufnahme voraussetzt.

    '
  dokumente:
  - datum: 2026-06-12
    typ: konsolidiert
    titel: SR 311.0 — Schweizerisches Strafgesetzbuch, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/54/757_781_799/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: Stand am 12. Juni 2026. Art. 179quater im Volltext gelesen.
  offene_punkte:
  - 'Ob und in welcher Form ein Deepfake-Straftatbestand kommt, war am 07.09.2026 offen. Sekundärquellen
    (Medienberichterstattung vom 28.08.2026) berichten, der Bundesrat prüfe eine Gesetzesänderung zu sexualisierten
    Deepfakes und das Parlament diskutiere einen neuen Straftatbestand. Ein amtlicher Beleg (Geschäftsnummer,
    Botschaft, Vernehmlassungsvorlage) konnte NICHT gefunden werden. Das ist der erste Punkt, den der
    nächste Bearbeiter in Curia Vista (parlament.ch) verifizieren sollte.

    '
  - 'Das Inkrafttretensdatum des StGB (1942) ist nicht am Text belegt, sondern allgemein bekannt; deshalb
    verifiziert: false.

    '
  monitoring_quellen:
  - https://www.fedlex.admin.ch/eli/cc/54/757_781_799/de
  - https://www.parlament.ch/de/ratsbetrieb/suche-curia-vista
