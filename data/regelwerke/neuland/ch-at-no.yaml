- id: no-ki-loven
  jurisdiktion: 'no'
  kurztitel: KI-loven — norwegisches Gesetz zur Durchführung der KI-Verordnung
  offizieller_titel: 'Lov om kunstig intelligens (KI-loven) — geplantes Gesetz zur Durchführung der Verordnung
    (EU) 2024/1689 im norwegischen Recht nach Übernahme in das EWR-Abkommen

    '
  fundstelle: 'Am 07.09.2026 kein Gesetz, keine LOV-Nummer. Erste Anhörung (høring) im Herbst 2025 mit
    rund 150 Stellungnahmen; zweite Anhörung für Herbst 2026 angekündigt; Proposition an das Storting
    für das Frühjahr 2027 angekündigt.

    '
  verfahrensnummer: null
  status: entwurf
  status_detail: 'Zuständig ist das Digitaliserings- og forvaltningsdepartementet (DFD) unter Ministerin
    Karianne Tung. Der ursprüngliche Entwurf war im Herbst 2025 in der Anhörung; nachdem die EU im Juli
    2026 Änderungen der KI-Verordnung beschlossen hat (Kommissionsvorschlag vom 19.11.2025), hat das Ministerium
    am 04.08.2026 angekündigt, den überarbeiteten Entwurf im Herbst 2026 ERNEUT in die Anhörung zu geben
    und die Proposition erst im Frühjahr 2027 vorzulegen. Die amtliche Informationsseite des Bundes (ki.norge.no)
    sagt mit Stand Juni 2026 ausdrücklich: "Det er ikke fastsatt når KI-loven skal gjelde i Norge".

    '
  kurzbeschreibung: 'Norwegen wendet die KI-Verordnung NICHT unmittelbar an. Sie ist EWR-relevant und
    muss zunächst durch Beschluss des Gemeinsamen EWR-Ausschusses in das EWR-Abkommen übernommen und danach
    durch norwegisches Gesetz umgesetzt werden. Daraus folgt ein erheblicher zeitlicher Nachlauf gegenüber
    der EU: Während in Österreich die Transparenzpflichten seit 02.08.2026 gelten, gilt in Norwegen am
    07.09.2026 noch keine einzige Vorschrift der KI-Verordnung. Für die Praxis bedeutet das, dass norwegische
    KI-Sachverhalte bis auf weiteres ausschliesslich nach allgemeinem Recht zu beurteilen sind — personopplysningsloven/DSGVO,
    åndsverkloven, forvaltningsloven, markedsføringsloven, straffeloven.

    '
