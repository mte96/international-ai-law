    verifiziert: true
    notiz: 'Regierungsvorlage mit den Erläuterungen zu den einzelnen Vorschriften, einschliesslich der
      Regeln über automatisierte Sachbearbeitung.

      '
  offene_punkte:
  - 'Datum des Inkrafttretens ist offen ("Kongen bestemmer"); ob zwischenzeitlich ein königlicher Beschluss
    ergangen ist, sollte vor jeder Verwendung geprüft werden. Bis dahin gilt die forvaltningslov von 1967
    fort.

    '
  - 'Der Wortlaut des § 12 Abs. 3 (Verordnungsermächtigung) ist nur angeschnitten gelesen worden.

    '
