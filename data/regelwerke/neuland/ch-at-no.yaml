- id: ch-swissmedic-ki
  jurisdiktion: ch
  kurztitel: Swissmedic — Rahmenbedingungen für KI in Arzneimittelentwicklung und -zulassung
  offizieller_titel: 'Swissmedic: Rahmenbedingungen für den Einsatz künstlicher Intelligenz in der Arzneimittelentwicklung
    und im Zulassungsverfahren

    '
  fundstelle: 'Keine Rechtsnorm. Verwaltungsinformation des Schweizerischen Heilmittelinstituts; zuletzt
    aktualisiert unter Verweis auf internationale Dokumente bis Mai 2025.

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Laufende Verwaltungspraxis, keine Verordnung und kein Rundschreiben mit Aussenwirkung.
    Swissmedic stützt sich ausdrücklich auf internationale Leitlinien (EMA, FDA, WHO, IMDRF) und nicht
    auf eine eigene schweizerische KI-Rechtsgrundlage.

    '
  kurzbeschreibung: 'Swissmedic beschreibt, welche Anforderungen es an den Einsatz von KI und maschinellem
    Lernen im Lebenszyklus von Arzneimitteln und Medizinprodukten stellt: Identifizierung neuer therapeutischer
    Moleküle, Design klinischer Studien, freigaberelevante Analytik von Fertigarzneimitteln. Verlangt
    werden vollständige Dokumentation nach dem aktuellen Stand von Wissenschaft und Technik, Beurteilung
    der Datenqualität, Nachvollziehbarkeit der Modelle, Qualitätskontrolle und Bias-Management sowie enge
    Begleitung über den gesamten Produktlebenszyklus. Sanktionen ergeben sich nicht aus diesem Dokument,
    sondern aus dem Heilmittelgesetz und der Medizinprodukteverordnung.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.swissmedic.ch/swissmedic/de/home/humanarzneimittel/authorisations/artificiel-intelligence.html
  anwendungsdaten: []
  themenachsen:
  - sektor-medizin
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - Dokumentationspflicht nach aktuellem Stand von Wissenschaft und Technik.
  - Beurteilung der Datenqualität und Bias-Management.
  - Nachvollziehbarkeit der Modelle über den gesamten Lebenszyklus.
  - 'Ausdrückliche Anlehnung an internationale Referenzen (EMA Reflection Paper, FDA-Guidance, WHO, IMDRF)
    statt an eigenes schweizerisches KI-Recht — typisch für die schweizerische Regulierungstechnik im
    Heilmittelbereich, die dem EU-Recht autonom nachvollzieht.

    '
  dokumente:
  - datum: 2025-05-01
    typ: leitlinie
    titel: Rahmenbedingungen für KI in Arzneimittelentwicklung und Zulassung
    url: https://www.swissmedic.ch/swissmedic/de/home/humanarzneimittel/authorisations/artificiel-intelligence.html
    sprache: de
    urheber: Swissmedic — Schweizerisches Heilmittelinstitut
    verifiziert: true
    notiz: 'Amtliche Informationsseite. Das genaue Veröffentlichungs- bzw. Aktualisierungsdatum ist auf
      der Seite nicht ausgewiesen; das hier eingetragene Datum leitet sich aus dem jüngsten dort verlinkten
      internationalen Dokument (Mai 2025) ab und ist deshalb NICHT als amtliches Datum zu verstehen.

      '
  offene_punkte:
  - 'Die schweizerische Medizinprodukteverordnung (MepV, SR 812.213) und die Verordnung über klinische
    Versuche mit Medizinprodukten sind NICHT geprüft worden. Ob und wie darin KI-gestützte Medizinprodukte
    erfasst sind (Stichwort: autonom nachvollzogene MDR-Anforderungen), ist offen.

    '
  - 'Rolle des BAG bei KI im Gesundheitswesen nicht recherchiert.

    '
