- id: no-datatilsynet-sandkasse
  jurisdiktion: 'no'
  kurztitel: Regulatorische Sandkasse für KI bei Datatilsynet
  offizieller_titel: Datatilsynets regulatoriske sandkasse for kunstig intelligens
  fundstelle: 'Keine eigene gesetzliche Grundlage; von Datatilsynet auf Grundlage seiner Aufgaben nach
    personopplysningsloven und DSGVO eingerichtet und aus dem Staatshaushalt finanziert.

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Bestehend und laufend. Erste Runde mit Informationsveranstaltung und Eröffnungsveranstaltung;
    seither mehrere Projektrunden mit veröffentlichten Abschlussberichten.

    '
  kurzbeschreibung: 'Die international meistzitierte norwegische KI-Institution. Datatilsynet stellt ausgewählten
    Unternehmen unterschiedlicher Grösse und Branchen KOSTENLOSE Beratung zur Verfügung, um KI-Systeme
    mit Personendaten datenschutzkonform zu entwickeln, und veröffentlicht anschliessend Abschlussberichte,
    die als Leitlinien wirken. Ziel ist es, "Innovation ethischer und verantwortungsvoller künstlicher
    Intelligenz aus der Datenschutzperspektive zu stimulieren". Die Sandkasse ist KEINE Regulierungssandbox
    im Sinne des Art. 57 KI-VO — jene soll in Norwegen erst nach Inkrafttreten der KI-loven entstehen.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.datatilsynet.no/regelverk-og-verktoy/sandkasse-for-kunstig-intelligens/
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - Kostenlose Beratung ausgewählter Projekte durch die Aufsichtsbehörde.
  - 'Veröffentlichte Abschlussberichte je Projekt; sie sind die eigentliche Ausbeute und werden international
    als Auslegungshilfe zu Art. 22 DSGVO und zur Datenschutz-Folgenabschätzung bei KI herangezogen.

    '
  - 'Abzugrenzen von der KI-Sandkasse nach Art. 57 KI-VO, die nach Angaben von KI Norge erst mit der KI-loven
    kommt.

    '
