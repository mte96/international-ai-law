- id: ch-zgb
  jurisdiktion: ch
  kurztitel: ZGB Art. 28 f. — Persönlichkeitsschutz (der Schweizer Deepfake-Rechtsbehelf)
  offizieller_titel: Schweizerisches Zivilgesetzbuch vom 10. Dezember 1907 (ZGB)
  fundstelle: 'SR 210. Fassung: Stand am 1. Januar 2026.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht, Fassung Stand am 01.01.2026.
  kurzbeschreibung: 'Solange die Schweiz keinen Deepfake-Straftatbestand hat und Art. 179quater StGB an
    das Erfordernis einer echten Aufnahme gebunden ist, ist der zivilrechtliche Persönlichkeitsschutz
    der praktisch wichtigste Rechtsbehelf gegen KI-erzeugte Bilder, Stimmen und Texte. Art. 28 Abs. 1
    gibt jedem, der in seiner Persönlichkeit widerrechtlich verletzt wird, einen Anspruch "gegen jeden,
    der an der Verletzung mitwirkt" — diese Formulierung erfasst neben dem Ersteller auch Plattformen
    und Verbreiter. Art. 28 Abs. 2 nennt die Rechtfertigungsgründe (Einwilligung, überwiegendes privates
    oder öffentliches Interesse, Gesetz). Art. 28a gibt die Klagerechte: Verbot einer drohenden Verletzung,
    Beseitigung einer bestehenden, Feststellung der Widerrechtlichkeit, dazu Berichtigung und Urteilsveröffentlichung;
    Ansprüche auf Schadenersatz, Genugtuung und Gewinnherausgabe bleiben vorbehalten.

    '
  inkrafttreten:
    datum: 1912-01-01
    verifiziert: false
    quelle: https://www.fedlex.admin.ch/eli/cc/24/233_245_233/de
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - content
  - haftung
  regelungsschwerpunkte:
  - 'Art. 28 Abs. 1: Anspruch "gegen jeden, der an der Verletzung mitwirkt" — die Passivlegitimation ist
    damit weit; sie erfasst auch denjenigen, der ein KI-erzeugtes Bild verbreitet, ohne es erstellt zu
    haben.

    '
  - 'Art. 28 Abs. 2: Widerrechtlichkeit entfällt bei Einwilligung, überwiegendem privatem oder öffentlichem
    Interesse oder gesetzlicher Rechtfertigung. Hier liegt der Streitpunkt bei Satire, Kunst und Berichterstattung
    mit synthetischen Bildern.

    '
  - 'Art. 28a: Unterlassung, Beseitigung, Feststellung, Berichtigung, Urteilsveröffentlichung; daneben
    Schadenersatz, Genugtuung und GEWINNHERAUSGABE. Die Gewinnherausgabe ist gegenüber kommerziellen Deepfake-Anbietern
    der wirksamste Hebel.

    '
  - 'Kein Erfordernis einer echten Aufnahme — anders als bei Art. 179quater StGB. Deshalb greift der zivilrechtliche
    Schutz gerade dort, wo das Strafrecht versagt.

    '
  dokumente:
  - datum: 2026-01-01
    typ: konsolidiert
    titel: SR 210 — Schweizerisches Zivilgesetzbuch, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/24/233_245_233/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: 'Stabile ELI-Adresse. Der Volltext von Art. 28 und Art. 28a ist über den Dateispeicher der
      Fassung vom 01.01.2026 gelesen worden (siehe folgendes Dokument).

      '
  - datum: 2026-01-01
    typ: konsolidiert
    titel: SR 210 — Fassung vom 01.01.2026 (Dateispeicher, HTML)
    url: https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/24/233_245_233/20260101/de/html/fedlex-data-admin-ch-eli-cc-24-233_245_233-20260101-de-html-4.html
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: Direkt abrufbarer Volltext; Art. 28 und Art. 28a gelesen.
  offene_punkte:
  - 'Inkrafttreten des ZGB (01.01.1912) nicht am Text belegt.

    '
  - 'Schweizer Rechtsprechung zu Art. 28 ZGB bei KI-erzeugten Inhalten ist nicht gefunden worden.

    '
