- id: at-urhg
  jurisdiktion: at
  kurztitel: Urheberrechtsgesetz — § 42h (Text- und Data-Mining)
  offizieller_titel: 'Bundesgesetz über das Urheberrecht an Werken der Literatur und der Kunst und über
    verwandte Schutzrechte (Urheberrechtsgesetz — UrhG)

    '
  fundstelle: 'RIS Gesetzesnummer 10001848 (Bundesrecht konsolidiert). § 42h eingefügt durch die Urheberrechts-Novelle
    2021 (Umsetzung der Richtlinie (EU) 2019/790), in Geltung seit 01.01.2022.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht; § 42h in Geltung seit 01.01.2022.
  kurzbeschreibung: 'Österreich hat die zweistufige TDM-Schranke der DSM-Richtlinie vollständig umgesetzt
    und steht damit im Gegensatz sowohl zur Schweiz (nur enge Forschungsschranke) als auch zu Norwegen
    (Umsetzung erst im Gesetzgebungsverfahren). § 42h Abs. 1 bis 5 regelt das wissenschaftliche TDM (Art.
    3 DSM-RL) — vertraglich NICHT abdingbar; § 42h Abs. 6 regelt das allgemeine TDM (Art. 4 DSM-RL) mit
    Opt-out-Vorbehalt. Für das Training kommerzieller KI-Modelle ist Abs. 6 die einschlägige Norm: zulässig,
    "außer bei ausdrücklichem, erkennbarem Verbot" des Rechteinhabers.

    '
  inkrafttreten:
    datum: 2022-01-01
    verifiziert: true
    quelle: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10001848&Paragraf=42h
  anwendungsdaten:
  - datum: 2022-01-01
    was_gilt: § 42h UrhG (Text- und Data-Mining) in Geltung.
    verifiziert: true
    quelle: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10001848&Paragraf=42h
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - '§ 42h Abs. 1: Vervielfältigung für eine Forschungseinrichtung oder eine Einrichtung des Kulturerbes
    zur automatisierten Auswertung von Texten und Daten für die wissenschaftliche oder künstlerische Forschung,
    bei rechtmäßigem Zugang. Einzelne Forschende bei gemeinnützigen Vorhaben ebenso.

    '
  - '§ 42h Abs. 3: Legaldefinition der Forschungseinrichtung — nicht gewinnorientiert, Gewinne werden
    reinvestiert, kein bestimmender Unternehmenseinfluss auf die Forschungsergebnisse. Damit fallen unternehmensnahe
    KI-Labore in der Regel heraus.

    '
  - '§ 42h Abs. 4: Gilt auch bei öffentlich-privaten Partnerschaften mit gewinnorientierten Akteuren —
    die praktisch wichtigste Öffnung.

    '
  - '§ 42h Abs. 5: Die freie Werknutzung nach Abs. 1 bis 4 kann VERTRAGLICH NICHT ABBEDUNGEN werden.

    '
  - '§ 42h Abs. 6: Allgemeines TDM auch für Private und kommerzielle Zwecke zulässig, "außer bei ausdrücklichem,
    erkennbarem Verbot" — das österreichische Opt-out. Der Streit, ob eine robots.txt-Anweisung oder eine
    Klausel in den Nutzungsbedingungen "ausdrücklich und erkennbar" ist, ist auch in Österreich offen.

    '
  dokumente:
  - datum: 2022-01-01
    typ: konsolidiert
    titel: § 42h UrhG — konsolidierte Fassung im RIS
    url: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10001848&Paragraf=42h
    sprache: de
    urheber: Bundeskanzleramt, Rechtsinformationssystem des Bundes
    verifiziert: true
    notiz: Amtlicher konsolidierter Text der Einzelvorschrift, im Volltext gelesen.
  offene_punkte:
  - 'Ob es in Österreich Rechtsprechung zu § 42h Abs. 6 (Opt-out) gibt, ist nicht geprüft; die RIS-Judikaturdatenbank
    wäre der Ort.

    '
