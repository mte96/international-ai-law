  regelungsschwerpunkte:
  - 'Kapitel 9: Kontrollmassnahmen gegenüber Arbeitnehmern — sachlicher Grund und Verhältnismässigkeit,
    Erörterungspflicht.'
  - Zusammenspiel mit der personopplysningsloven bei der Verarbeitung von Beschäftigtendaten.
