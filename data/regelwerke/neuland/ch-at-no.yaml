    notiz: Metadaten verifiziert; Einzelvorschriften nicht gelesen.
  offene_punkte:
  - 'Was die Änderung mit Wirkung vom 01.07.2026 (LOV-2026-05-07-17) geändert hat, ist nicht geprüft —
    angesichts des Datums ein naheliegender Kandidat für digitale bzw. KI-bezogene Neuerungen.

    '
  - Praxis von Forbrukertilsynet zu KI nicht recherchiert.
