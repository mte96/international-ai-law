- id: no-forvaltningsloven-1967
  jurisdiktion: 'no'
  kurztitel: forvaltningsloven 1967 — § 25 Begründungspflicht (noch geltendes Recht)
  offizieller_titel: 'Lov om behandlingsmåten i forvaltningssaker (forvaltningsloven) — Gesetz über das
    Verfahren in Verwaltungssachen

    '
  fundstelle: 'LOV-1967-02-10, in Kraft seit 01.01.1970; zuletzt geändert durch LOV-2025-04-25-12 mit
    Wirkung vom 01.01.2026.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Bis zum Inkrafttreten der neuen forvaltningslov (LOV-2025-06-20-81) weiterhin geltendes
    Recht. Enthält KEINE ausdrückliche Vorschrift über automatisierte Entscheidungen — Kapitel V (Om vedtaket,
    §§ 23 ff.) wurde auf den Begriff "automatis*" geprüft, ohne Treffer.

    '
  kurzbeschreibung: 'Das geltende norwegische Verwaltungsverfahrensgesetz. Für KI-gestützte Verwaltungsentscheidungen
    ist § 25 die tragende Norm: Die Begründung muss die angewandten Rechtsvorschriften nennen (soweit
    die Partei sie nicht kennt), bei Bedarf deren Inhalt oder die zugrunde liegende Problemstellung wiedergeben,
    die tatsächlichen Umstände nennen, auf denen die Entscheidung beruht, und SOLL die für die Ermessensausübung
    massgeblichen Hauptgesichtspunkte nennen. Weil eine ausdrückliche Regelung automatisierter Entscheidungen
    fehlt, wird § 25 in Norwegen zur Norm, an der die Erklärbarkeit algorithmischer Verwaltungs- entscheidungen
    gemessen wird — bis §§ 11 f. der neuen forvaltningslov in Kraft treten.

    '
  inkrafttreten:
    datum: 1970-01-01
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/1967-02-10
  anwendungsdaten: []
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - '§ 25 Abs. 1: Verweis auf die Rechtsgrundlage, bei Bedarf Wiedergabe ihres Inhalts, "i den utstrekning
    det er nødvendig for å sette parten i stand til å forstå vedtaket" — Verständlichkeitsmassstab.

    '
  - '§ 25 Abs. 2: Nennung der tatsächlichen Verhältnisse, auf denen die Entscheidung beruht.

    '
  - '§ 25 Abs. 3: Die für die Ermessensausübung massgeblichen Hauptgesichtspunkte SOLLEN genannt werden
    ("bør nevnes") — eine Soll-, keine Mussvorschrift. Bei Vorliegen von Richtlinien genügt in der Regel
    ein Verweis. Genau diese Abschwächung ist der Punkt, an dem die Begründung einer algorithmischen Entscheidung
    dünn werden kann.

    '
  dokumente:
  - datum: 2026-01-01
    typ: konsolidiert
    titel: LOV-1967-02-10 — forvaltningsloven, amtlicher konsolidierter Text
    url: https://lovdata.no/dokument/NL/lov/1967-02-10
    sprache: 'no'
    urheber: Lovdata / Justis- og beredskapsdepartementet
    verifiziert: true
    notiz: Kapitel V (§§ 23–27) im Volltext gelesen; § 25 vollständig erfasst.
  offene_punkte:
  - 'Ob in anderen Kapiteln der forvaltningslov 1967 eine Vorschrift über automatisierte Sachbearbeitung
    steht, ist nicht vollständig geprüft; geprüft wurde Kapitel V.

    '
