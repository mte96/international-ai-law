- id: no-prop-41-ls
  jurisdiktion: 'no'
  kurztitel: Prop. 41 LS (2025–2026) — Umsetzung der DSM-Richtlinie, TDM in §§ 50 d/50 e
  offizieller_titel: 'Prop. 41 LS (2025–2026) Endringer i åndsverkloven mv. (gjennomføring av nett- og
    videresendingsdirektivet og digitalmarkedsdirektivet) og samtykke til godkjenning av EØS-komiteens
    beslutninger nr. 332/2023 og 333/2023

    '
  fundstelle: Prop. 41 LS (2025–2026), vorgelegt am 27.03.2026 vom Kultur- og likestillingsdepartementet.
  verfahrensnummer: Prop. 41 LS (2025–2026)
  status: verfahren
  status_detail: 'Beim Storting anhängig. Sie enthält zugleich die Zustimmung zur Genehmigung der Beschlüsse
    des Gemeinsamen EWR-Ausschusses Nr. 332/2023 und 333/2023 — das ist die EWR-rechtliche Grundlage,
    ohne die die Richtlinien in Norwegen nicht gelten.

    '
  kurzbeschreibung: 'Setzt die Richtlinien (EU) 2019/789 (Online-Übertragungen und Weiterverbreitung)
    und (EU) 2019/790 (Urheberrecht im digitalen Binnenmarkt) in norwegisches Recht um. Für KI zentral
    sind die Bestimmungen über Text- und Data-Mining, die nach den Angaben aus dem Verfahren in §§ 50
    d und 50 e åndsverkloven eingefügt werden sollen; im Anhörungsentwurf war vorgesehen, die Legaldefinition
    des Text- und Data-Mining aus Art. 2 Nr. 2 der Richtlinie in einer eigenen Bestimmung (§ 50 d) umzusetzen.
    Daneben Regelungen für Einrichtungen des Kulturerbes und für den Unterricht.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.regjeringen.no/no/dokumenter/prop.-41-ls-20252026/id3154279/
  anwendungsdaten: []
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - Umsetzung der TDM-Schranken der Art. 3 und 4 der Richtlinie (EU) 2019/790.
  - 'Legaldefinition des Text- und Data-Mining (Art. 2 Nr. 2 DSM-RL) in einer eigenen Bestimmung — nach
    dem Anhörungsentwurf § 50 d.

    '
  - 'Zugleich Zustimmung zu den EWR-Ausschussbeschlüssen Nr. 332/2023 und 333/2023. Das zeigt exemplarisch
    den zweistufigen Weg, den auch die KI-Verordnung in Norwegen nehmen muss.

    '
  dokumente:
  - datum: 2026-03-27
    typ: entwurf
    titel: Prop. 41 LS (2025–2026)
    url: https://www.regjeringen.no/no/dokumenter/prop.-41-ls-20252026/id3154279/
    sprache: 'no'
    urheber: Kultur- og likestillingsdepartementet
    verifiziert: true
    notiz: 'Amtliche Regierungsvorlage mit den Erwägungen zu Text- und Data-Mining und den Stellungnahmen
      der Verwertungsgesellschaften.

      '
  offene_punkte:
  - 'Der genaue Wortlaut der vorgeschlagenen §§ 50 d und 50 e — vor allem die Ausgestaltung des Opt-out
    nach Art. 4 Abs. 3 DSM-RL — ist NICHT gelesen worden. Das ist der wichtigste urheberrechtliche Nachtrag
    für Norwegen.

    '
  - Stand der Ausschussberatung im Storting nicht ermittelt.
  monitoring_quellen:
  - https://www.regjeringen.no/no/dokumenter/prop.-41-ls-20252026/id3154279/
  - https://www.stortinget.no/
