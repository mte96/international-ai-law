  jurisdiktion: 'no'
  kurztitel: straffeloven — norwegisches Strafgesetzbuch
  offizieller_titel: Lov om straff (straffeloven) — Gesetz über die Strafe
  fundstelle: 'LOV-2005-05-20-28, kundgemacht 20.05.2005, in Kraft seit 01.10.2015 (teilweise seit 07.03.2008);
    zuletzt geändert durch LOV-2026-06-23-71 mit Wirkung vom 01.07.2026.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht in einer sehr aktuellen Fassung (Änderung mit Wirkung vom 01.07.2026).
    Ob darin ein Deepfake-Tatbestand enthalten ist, wurde NICHT geprüft.

    '
  kurzbeschreibung: 'Das norwegische Strafgesetzbuch von 2005, das die straffelov von 1902 abgelöst hat.
    Für KI-Sachverhalte einschlägig sind die Tatbestände zum Schutz des Privatlebens und der Ehre, zur
    Verbreitung sexualisierter Darstellungen, zum Betrug und zur Identitätsverletzung. Es ist die Auffangebene
    für Deepfakes, Stimmklon-Betrug und KI-gestützte Belästigung, solange die KI-Verordnung in Norwegen
    nicht gilt.

    '
  inkrafttreten:
    datum: 2015-10-01
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2005-05-20-28
  anwendungsdaten: []
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Auffangfunktion mangels KI-spezifischen Strafrechts. Die konkreten Paragrafen sind nicht gelesen
    worden.

    '
