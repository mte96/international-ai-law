  - content
  - vertrag
  regelungsschwerpunkte:
  - Verbot irreführender und aggressiver Geschäftspraktiken — Auffangnorm für KI-Werbung.
  - Behördliche Durchsetzung durch Forbrukertilsynet mit Verfügungs- und Zwangsgeldbefugnis.
  - Einbindung in die EU-Durchsetzungszusammenarbeit nach Verordnung (EU) 2017/2394.
  dokumente:
  - datum: 2026-07-01
    typ: konsolidiert
    titel: LOV-2009-01-09-2 — markedsføringsloven, amtlicher Text
