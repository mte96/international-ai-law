  jurisdiktion: ch
  kurztitel: Informationssicherheitsgesetz (ISG)
  offizieller_titel: 'Bundesgesetz vom 18. Dezember 2020 über die Informationssicherheit beim Bund (Informationssicherheitsgesetz,
    ISG)

    '
  fundstelle: 'SR 128. Fassung: Stand am 1. Oktober 2025.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.01.2024; die Meldepflicht für Cyberangriffe auf kritische Infrastrukturen
    ist später in Kraft gesetzt worden. Fassung am 07.09.2026 "Stand am 1. Oktober 2025".

    '
  kurzbeschreibung: 'Einheitliche Rechtsgrundlage für die Informationssicherheit beim Bund: Risikomanagement,
    Klassifizierung von Informationen, Sicherheit beim Einsatz von Informatikmitteln, Personensicherheitsprüfungen,
    Betriebssicherheitsverfahren, und die Meldepflicht für Cyberangriffe auf kritische Infrastrukturen
    gegenüber dem Bundesamt für Cybersicherheit (BACS). Für KI ist das ISG der Rahmen, in dem Sicherheitsanforderungen
    an KI-Systeme des Bundes und an ihre Zulieferer verankert sind.

    '
  inkrafttreten:
    datum: 2024-01-01
    verifiziert: false
    quelle: https://www.fedlex.admin.ch/eli/cc/2022/232/de
  anwendungsdaten: []
  themenachsen:
  - sicherheit-export
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'Meldepflicht für Cyberangriffe auf kritische Infrastrukturen an das BACS — der schweizerische Gegenpart
    zur NIS-2-Meldepflicht, ohne deren Aufsichts- und Sanktionsdichte.

    '
  - 'Sicherheitsanforderungen an Informatikmittel des Bundes; über die Beschaffung wirken sie auf Anbieter
    von KI-Systemen durch.

    '
