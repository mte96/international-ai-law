    urheber: Lovdata / Kultur- og likestillingsdepartementet
    verifiziert: true
    notiz: Metadaten verifiziert; Einzelvorschriften nicht gelesen.
  offene_punkte:
  - Entscheidungen von Diskrimineringsnemnda zu algorithmischer Benachteiligung nicht recherchiert.
  monitoring_quellen:
  - https://lovdata.no/dokument/NL/lov/2017-06-16-51
