- id: ch-europarat-ki-konvention
  jurisdiktion: ch
  kurztitel: Europarats-Rahmenübereinkommen über KI (SEV Nr. 225)
  offizieller_titel: 'Rahmenübereinkommen des Europarats über künstliche Intelligenz und Menschenrechte,
    Demokratie und Rechtsstaatlichkeit / Council of Europe Framework Convention on Artificial Intelligence
    and Human Rights, Democracy and the Rule of Law

    '
  fundstelle: 'Council of Europe Treaty Series No. 225 (SEV/CETS 225). Zur Unterzeichnung aufgelegt am
    05.09.2024 in Vilnius. Für die Schweiz noch keine SR-Nummer, da noch nicht ratifiziert.

    '
  verfahrensnummer: null
  status: verfahren
  status_detail: 'Die Schweiz hat das Übereinkommen am 27.03.2025 UNTERZEICHNET; eine Ratifikationsurkunde
    ist im Vertragsbüro des Europarats am 07.09.2026 nicht verzeichnet. Die Ratifikation setzt die Genehmigung
    durch die Bundesversammlung und zuvor die Vernehmlassung über die Umsetzungsgesetzgebung voraus (siehe
    ch-ki-regulierung-grundsatzentscheid). Norwegen hat am 05.09.2024, dem Tag der Auflegung, unterzeichnet
    und dabei eine Erklärung abgegeben; auch dort keine Ratifikation verzeichnet. Österreich ist als EU-Mitgliedstaat
    im Zeichnungsverzeichnis NICHT eigenständig eingetragen — für die Bereiche der Unionszuständigkeit
    hat die Europäische Union unterzeichnet.

    '
  kurzbeschreibung: 'Erster völkerrechtlich verbindlicher Vertrag über künstliche Intelligenz. Er verpflichtet
    die Vertragsparteien, den gesamten Lebenszyklus von KI-Systemen mit Menschenrechten, Demokratie und
    Rechtsstaatlichkeit in Einklang zu bringen, und verlangt namentlich Transparenz und Nachvollziehbarkeit,
    Rechenschaftspflicht, Gleichheit und Nichtdiskriminierung, Schutz der Privatsphäre, Verlässlichkeit
    sowie wirksame Rechtsbehelfe und Verfahrensgarantien für Betroffene. Er schreibt keine Regelungstechnik
    vor: die Parteien sind frei, ob sie ein Querschnittsgesetz erlassen oder das bestehende Recht anpassen
    — das ist die Öffnung, auf die sich der schweizerische Grundsatzentscheid stützt. Eigene Sanktionen
    enthält das Übereinkommen nicht; es verlangt von den Parteien wirksame Abhilfemassnahmen und Aufsicht.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.coe.int/en/web/conventions/full-list?module=signatures-by-treaty&treatynum=225
  anwendungsdaten:
  - datum: 2025-03-27
    was_gilt: 'Unterzeichnung durch die Schweiz. Damit ist die Schweiz nach Art. 18 WVK zur Unterlassung
      vertragswidriger Handlungen verpflichtet, aber noch nicht an die materiellen Pflichten gebunden.

      '
    verifiziert: true
    quelle: https://www.coe.int/en/web/conventions/full-list?module=signatures-by-treaty&treatynum=225
  - datum: 2024-09-05
    was_gilt: Unterzeichnung durch Norwegen, mit Erklärung (D.).
    verifiziert: true
    quelle: https://www.coe.int/en/web/conventions/full-list?module=signatures-by-treaty&treatynum=225
  themenachsen:
  - grundrechte
  - governance
  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Anwendungsbereich erfasst KI-Systeme im öffentlichen Sektor zwingend; für den privaten Sektor lässt
    Art. 3 den Parteien ein Wahlrecht zwischen unmittelbarer Anwendung und anderen geeigneten Massnahmen.
    An dieser Stelle entscheidet sich, wie weit die schweizerische Umsetzung reichen wird; der Bundesrat
    hat sich in der Stellungnahme zu 26.3414 für Transparenzpflichten AUCH im privaten Sektor ausgesprochen.

    '
  - 'Art. 22 (Nichtberührungsklausel) und die Ausnahmen für nationale Sicherheit, Verteidigung und Forschung
    und Entwicklung begrenzen den Vertrag erheblich — das ist der wesentliche Unterschied zur EU-KI-Verordnung,
    die im Anwendungsbereich enger definiert, in der Regelungsdichte aber weit schärfer ist.

    '
  dokumente:
  - datum: 2024-09-05
    typ: endfassung
    titel: Council of Europe Treaty Series No. 225 — Zeichnungs- und Ratifikationsstand
    url: https://www.coe.int/en/web/conventions/full-list?module=signatures-by-treaty&treatynum=225
    sprache: en
    urheber: Europarat, Vertragsbüro
    verifiziert: true
    notiz: 'Amtliches Zeichnungsverzeichnis. Einzige Quelle, aus der sich Unterzeichnung und Ratifikation
      je Staat belegen lassen.

      '
  offene_punkte:
  - 'Datum des Inkrafttretens des Übereinkommens insgesamt konnte aus dem Zeichnungsverzeichnis nicht
    sicher ausgelesen werden (die Zeile "Entry into force" war im gerenderten Text nicht erfasst). Nachzutragen
    aus dem Vertragsbüro des Europarats.

    '
  - 'Inhalt der norwegischen Erklärung ("D.") zum Zeitpunkt der Unterzeichnung nicht ausgelesen; im Vertragsbüro
    unter "Declarations" nachzutragen.

    '
  monitoring_quellen:
  - https://www.coe.int/en/web/conventions/full-list?module=signatures-by-treaty&treatynum=225
