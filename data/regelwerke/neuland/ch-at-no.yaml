- id: at-ki-durchfuehrung
  jurisdiktion: at
  kurztitel: Österreichische Durchführung der KI-VO (Marktüberwachung, Sanktionen)
  offizieller_titel: 'Nationale Durchführungsvorschriften zur Verordnung (EU) 2024/1689 (KI-Verordnung)
    — Benennung der Marktüberwachungsbehörden, der notifizierenden Behörde und der Sanktionsregelung

    '
  fundstelle: 'Am 07.09.2026 KEINE österreichische Fundstelle belegbar. Weder auf digitalaustria.gv.at
    noch über die geprüften amtlichen Portale liess sich ein Bundesgesetz zur Durchführung der KI-Verordnung
    (Marktüberwachung, Sanktionen) nachweisen.

    '
  verfahrensnummer: null
  status: entwurf
  status_detail: 'UNGEKLÄRT. Die amtliche Seite des Bundes (digitalaustria.gv.at) sagt lediglich, Österreich
    habe "bereits mit der Umsetzung der KI-Verordnung begonnen", benennt aber weder ein Durchführungsgesetz
    noch die Marktüberwachungsbehörde. Das ist bemerkenswert, weil die Frist des Art. 70 Abs. 2 KI-VO
    zur Benennung der zuständigen Behörden am 02.08.2025 abgelaufen ist. Die Grundrechtsschutzbehörden
    nach Art. 77 KI-VO waren bis 02.11.2024 zu benennen; dafür führt der Bund eine eigene Seite. Status
    hier als `entwurf` geführt, weil ein Rechtsetzungsvorhaben besteht, seine Fundstelle aber nicht belegt
    ist.

    '
  kurzbeschreibung: 'Als EU-Mitgliedstaat wendet Österreich die KI-Verordnung unmittelbar an; nationales
    Recht ist nur für die Benennung der Behörden, die Ausgestaltung der Marktüberwachung, die Sanktionsbemessung
    und die Verfahrensordnung nötig. Genau dieser Teil war am Stichtag nicht belegbar. Faktisch besteht
    die österreichische KI-Governance aus vier nicht-hoheitlichen Gremien (AI Policy Forum, KI-Beirat,
    AI Stakeholder Forum, KI-Servicestelle) plus den sektoralen Marktüberwachungsbehörden des Produktsicherheitsrechts.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.digitalaustria.gv.at/themen/kuenstliche-intelligenz/ai-act.html
  anwendungsdaten:
  - datum: 2026-07-24
    was_gilt: 'Inkrafttreten des "Omnibus VII (KI)" auf EU-Ebene; nach Angabe des Bundes wurden dadurch
      mehrere Neuerungen zur KI-Verordnung eingeführt und die Fristen für die Pflichten bei Hochrisiko-KI-Systemen
      VERSCHOBEN.

      '
    verifiziert: true
    quelle: https://www.digitalaustria.gv.at/themen/kuenstliche-intelligenz/ai-act.html
  themenachsen:
