  offizieller_titel: 'Lov om kontroll med markedsføring og avtalevilkår mv. (markedsføringsloven) — Gesetz
    über die Kontrolle von Marketing und Vertragsbedingungen

    '
  fundstelle: 'LOV-2009-01-09-2, kundgemacht 09.01.2009, in Kraft seit 01.06.2009; zuletzt geändert durch
    LOV-2026-05-07-17 mit Wirkung vom 01.07.2026. Berichtigt 25.10.2023 (Anhang zur Verordnung (EU) 2017/2394).

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht; sehr aktuelle Änderung mit Wirkung vom 01.07.2026.
  kurzbeschreibung: 'Das norwegische Lauterkeits- und Verbraucherschutzrecht. Es ist der Hebel gegen irreführende
    KI-Werbung, gegen manipulative Personalisierung ("dark patterns") und gegen nicht offengelegte KI-Kommunikation
    im Geschäftsverkehr. Zuständig für den Vollzug ist Forbrukertilsynet (Verbraucherbehörde), das Verfügungen
    und Zwangsgelder erlassen kann — anders als in der Schweiz, wo das UWG weitgehend auf Zivilklage und
    Antragsstrafverfahren angewiesen ist. Die Anknüpfung an die Verordnung (EU) 2017/2394 zeigt, dass
    Norwegen auch im Verbraucherschutz in die europäische Durchsetzungszusammenarbeit eingebunden ist.

    '
  inkrafttreten:
    datum: 2009-06-01
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2009-01-09-2
  anwendungsdaten: []
  themenachsen:
