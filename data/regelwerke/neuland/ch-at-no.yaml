- id: ch-urg
  jurisdiktion: ch
  kurztitel: Urheberrechtsgesetz (URG) — Art. 24d als Schweizer TDM-Schranke
  offizieller_titel: 'Bundesgesetz vom 9. Oktober 1992 über das Urheberrecht und verwandte Schutzrechte
    (Urheberrechtsgesetz, URG)

    '
  fundstelle: 'SR 231.1. Fassung: Stand am 1. Juli 2025.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Die für KI entscheidende Vorschrift, Art. 24d, ist durch die URG-Revision
    vom 27.09.2019 eingefügt worden und seit 01.04.2020 in Kraft (AS 2020 1003; BBl 2018 591).

    '
  kurzbeschreibung: 'Das schweizerische Urheberrecht kennt KEINE der EU-DSM-Richtlinie entsprechende zweistufige
    TDM-Schranke. Art. 24d erlaubt die Vervielfältigung eines Werks NUR "zum Zweck der wissenschaftlichen
    Forschung", und nur wenn die Vervielfältigung technisch bedingt ist und rechtmässiger Zugang besteht.
    Es gibt weder eine allgemeine TDM-Schranke für kommerzielle Zwecke noch einen maschinenlesbaren Nutzungsvorbehalt
    (Opt-out) wie in Art. 4 DSM-RL. Für das Training kommerzieller KI-Modelle auf urheberrechtlich geschützten
    Werken besteht in der Schweiz damit KEINE gesetzliche Erlaubnis — das ist der praktisch wichtigste
    Unterschied zum EU-Recht und der Punkt, an dem Schweizer Sachverhalte anders zu beurteilen sind als
    deutsche (§ 44b UrhG) oder österreichische (§ 42h UrhG).

    '
  inkrafttreten:
    datum: 2020-04-01
    verifiziert: true
    quelle: https://www.fedlex.admin.ch/eli/cc/1993/1798_1798_1798/de
  anwendungsdaten:
  - datum: 2020-04-01
    was_gilt: Art. 24d URG (Verwendung von Werken zum Zweck der wissenschaftlichen Forschung) tritt in
      Kraft.
    verifiziert: true
    quelle: https://www.fedlex.admin.ch/eli/cc/1993/1798_1798_1798/de
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - 'Art. 24d Abs. 1: Zulässig ist die Vervielfältigung "zum Zweck der wissenschaftlichen Forschung",
    wenn sie "durch die Anwendung eines technischen Verfahrens bedingt ist" und "zu den zu vervielfältigenden
    Werken ein rechtmässiger Zugang besteht". Zwei kumulative Voraussetzungen, beide eng.

    '
  - 'Art. 24d Abs. 2: Die Vervielfältigungen dürfen nach Abschluss der Forschung zu Archivierungs- und
    Sicherungszwecken aufbewahrt werden. Damit ist die Frage der Weiterverwendung eines einmal erstellten
    Trainingskorpus jedenfalls nicht abschliessend gelöst.

    '
  - 'Art. 24d Abs. 3: Gilt NICHT für die Vervielfältigung von Computerprogrammen. Für das Training auf
    Quellcode besteht also auch die wissenschaftliche Schranke nicht.

    '
  - 'Kein Opt-out-Mechanismus und keine Vergütungspflicht: Die Schweiz hat die Konstruktion der DSM-Richtlinie
    bewusst nicht übernommen. Wer ausserhalb der Forschung trainiert, braucht eine Lizenz.

    '
  dokumente:
  - datum: 2025-07-01
    typ: konsolidiert
    titel: SR 231.1 — Urheberrechtsgesetz, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/1993/1798_1798_1798/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: Stand am 1. Juli 2025. Art. 24d im Volltext gelesen.
  offene_punkte:
  - 'Ob im Rahmen der KI-Vorlage eine Erweiterung der TDM-Schranke geplant ist, liess sich am 07.09.2026
    nicht belegen. Die Auslegeordnung des BAKOM behandelt das Urheberrecht; ob daraus ein Änderungsvorschlag
    folgt, ist offen.

    '
  - 'Ob Art. 24d auf das Training generativer Modelle überhaupt passt (Vervielfältigung "durch die Anwendung
    eines technischen Verfahrens bedingt"), ist in der Schweiz noch nicht gerichtlich geklärt.

    '
