- id: at-arbvg-96
  jurisdiktion: at
  kurztitel: ArbVG § 96 — Zustimmungspflicht des Betriebsrats bei Kontrollsystemen
  offizieller_titel: Bundesgesetz vom 14. Dezember 1973 betreffend die Arbeitsverfassung (Arbeitsverfassungsgesetz
    — ArbVG)
  fundstelle: 'RIS Gesetzesnummer 10008329. § 96 in Geltung seit 01.01.2011, zuletzt geändert durch BGBl.
    I Nr. 101/2010.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht.
  kurzbeschreibung: 'Die für den Einsatz von KI am Arbeitsplatz zentrale österreichische Norm und zugleich
    das schärfste Mitbestimmungsrecht des deutschsprachigen Raums. § 96 Abs. 1 macht bestimmte Massnahmen
    von der ZUSTIMMUNG des Betriebsrats abhängig — nicht bloss von einer Verhandlung. Erfasst sind unter
    anderem die Einführung von Personalfragebögen, die über allgemeine Angaben und fachliche Qualifikationen
    hinausgehen, und "die Einführung von Kontrollmaßnahmen und technischen Systemen zur Kontrolle der
    Arbeitnehmer, sofern diese Maßnahmen (Systeme) die Menschenwürde berühren". KI-gestützte Leistungs-
    und Verhaltensüberwachung, automatisierte Bewerberauswahl und algorithmisches Scoring von Beschäftigten
    fallen typischerweise darunter. Ohne Zustimmung ist die Massnahme unzulässig; eine Ersetzung der Zustimmung
    durch die Schlichtungsstelle ist bei § 96 nicht vorgesehen. Betriebs- vereinbarungen hierüber können
    von jeder Seite jederzeit schriftlich und fristlos gekündigt werden.

    '
  inkrafttreten:
    datum: 2011-01-01
    verifiziert: true
    quelle: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10008329&Paragraf=96
  anwendungsdaten: []
  themenachsen:
  - arbeit
  - datenschutz
  - grundrechte
  regelungsschwerpunkte:
  - 'Zustimmung, nicht Anhörung: Ohne Zustimmung des Betriebsrats darf das Kontrollsystem nicht eingeführt
    werden. Das unterscheidet Österreich von § 87 Abs. 1 Nr. 6 BetrVG, wo die Einigungsstelle die Zustimmung
    ersetzen kann.

    '
  - 'Tatbestandsmerkmal "die Menschenwürde berühren" — nicht "verletzen". Die Schwelle liegt bewusst niedrig;
    nach herrschender Auffassung genügt die Eignung zur umfassenden Kontrolle.

    '
  - 'Jederzeitige fristlose Kündbarkeit der Betriebsvereinbarung durch jede Partei. Für Arbeitgeber, die
    ein KI-System auf eine Betriebsvereinbarung stützen, ist das ein erhebliches Bestandsrisiko.

    '
  dokumente:
  - datum: 2011-01-01
    typ: konsolidiert
    titel: § 96 ArbVG — konsolidierte Fassung im RIS
    url: https://www.ris.bka.gv.at/NormDokument.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10008329&Paragraf=96
    sprache: de
    urheber: Bundeskanzleramt, Rechtsinformationssystem des Bundes
    verifiziert: true
    notiz: Amtlicher konsolidierter Text der Einzelvorschrift, gelesen.
  offene_punkte:
  - '§ 96a ArbVG (zustimmungs- bzw. ersetzbare Massnahmen, u.a. Systeme zur automationsunterstützten Ermittlung
    und Verarbeitung von Arbeitnehmerdaten und Beurteilungssysteme) ist NICHT gelesen worden, obwohl er
    für KI-Beurteilungssysteme mindestens ebenso einschlägig ist. Vorrangig nachzutragen.

    '
  - Rechtsprechung des OGH zu § 96 bei KI-Systemen nicht recherchiert.
  monitoring_quellen:
  - https://www.ris.bka.gv.at/Bundesrecht/
  bezug_regelwerke:
  - at-dsg
