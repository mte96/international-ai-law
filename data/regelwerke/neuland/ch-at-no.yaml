- id: no-personopplysningsloven
  jurisdiktion: 'no'
  kurztitel: personopplysningsloven — DSGVO als norwegisches Recht
  offizieller_titel: 'Lov om behandling av personopplysninger (personopplysningsloven) — Gesetz über die
    Verarbeitung personenbezogener Daten

    '
  fundstelle: 'LOV-2018-06-15-38, kundgemacht 15.06.2018, in Kraft seit 20.07.2018; zuletzt geändert durch
    LOV-2021-06-18-124 mit Wirkung vom 01.01.2022. EWR-Bezug: EØS-avtalen vedlegg XI nr. 5e (Verordnung
    (EU) 2016/679).

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Berichtigung vom 09.01.2025 (Entfernung fachlicher Fussnoten). Die
    DSGVO ist über § 1 Bestandteil des Gesetzes und gilt als norwegisches Recht.

    '
  kurzbeschreibung: 'Solange die KI-Verordnung in Norwegen nicht gilt, ist dies das zentrale Gesetz für
    KI-Sachverhalte. Es setzt die DSGVO um, indem es sie in § 1 zum Bestandteil norwegischen Rechts erklärt
    — Art. 22 DSGVO (automatisierte Entscheidungen einschliesslich Profiling) gilt damit unmittelbar.
    Das Gesetz ergänzt sie um nationale Regeln (Kapitel 3: ergänzende Bearbeitungsregeln; Kapitel 4: Ausnahmen
    von Betroffenenrechten; Kapitel 5: Datenschutzbeauftragte; Kapitel 6: Aufsicht und Beschwerde; Kapitel
    7: Sanktionen und Zwangsgeld; Kapitel 8: unechte Kameraüberwachungsausrüstung). Aufsichtsbehörde ist
    Datatilsynet, Beschwerdeinstanz die Personvernnemnda.

    '
  inkrafttreten:
    datum: 2018-07-20
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2018-06-15-38
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - '§ 1: Die Datenschutz-Grundverordnung gilt als norwegisches Recht. Alle KI-Datenschutzfragen laufen
    deshalb über die DSGVO-Dogmatik, nicht über eigenes norwegisches Recht.

    '
  - 'Kapitel 8 (§ 31, uekte kameraovervåkingsutstyr): Regelung für Attrappen von Kameraüberwachungsanlagen
    — im Vergleich interessant, weil sie zeigt, dass der norwegische Gesetzgeber auch den blossen ANSCHEIN
    einer Überwachung regelt.

    '
  - 'Kapitel 7: Sanktionen und Zwangsgeld (tvangsmulkt) — Norwegen kennt neben der Geldbusse das laufende
    Zwangsgeld als Durchsetzungsmittel von Datatilsynet.

    '
  dokumente:
  - datum: 2025-01-09
    typ: konsolidiert
    titel: LOV-2018-06-15-38 — personopplysningsloven, amtlicher Text
    url: https://lovdata.no/dokument/NL/lov/2018-06-15-38
