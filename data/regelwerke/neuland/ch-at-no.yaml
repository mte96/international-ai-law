  jurisdiktion: at
  kurztitel: AVG-Novelle 2026 — vollständig automatisierte Erledigungen
  offizieller_titel: 'Regierungsvorlage: Bundesgesetz, mit dem das Allgemeine Verwaltungsverfahrensgesetz
    1991 und weitere Gesetze geändert werden

    '
  fundstelle: 539 der Beilagen XXVIII. GP, veröffentlicht am 19.06.2026.
  verfahrensnummer: 539 d.B. XXVIII. GP (zuvor Ministerialentwurf 89/ME XXVIII. GP)
  status: verfahren
  status_detail: 'Ministerialentwurf 89/ME mit Begutachtungsfrist bis 24.04.2026; Regierungsvorlage am
    17.06.2026 eingebracht und am 19.06.2026 veröffentlicht. Parlamentarische Behandlung am 07.09.2026
    laufend. Inkrafttreten soll am Tag nach der Kundmachung erfolgen.

    '
  kurzbeschreibung: 'Die für KI wichtigste österreichische Gesetzgebungsvorlage des Jahres 2026: Sie ermöglicht
    Behörden erstmals allgemein "vollständig automatisierte Erledigungen" im Verwaltungsverfahren. Nach
    geltendem § 18 Abs. 3 AVG bedürfen Erledigungen einer Genehmigung durch ein Organwalter; die Novelle
    durchbricht das. Bemerkenswert und politisch umstritten: Gegenüber dem Ministerialentwurf ENTFÄLLT
    in der Regierungsvorlage das WIDERSPRUCHSRECHT der Empfänger gegen vollautomatisierte Bescheide. Daneben
    werden neue Einbringungsarten zugelassen (unter anderem Anbringen über Chatbots, allerdings ohne Regelung
    ihrer Gleichstellung mit schriftlichen Einbringungen), und Rechtsbelehrungen sollen künftig in "möglichst
    einfacher Sprache" abgefasst werden.

    '
