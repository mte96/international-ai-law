  offene_punkte:
  - 'Ob die norwegische straffelov einen Deepfake- oder Bildmanipulationstatbestand enthält (und ob die
    Änderung mit Wirkung vom 01.07.2026 einen solchen eingeführt hat), ist NICHT geprüft. Das ist der
    wichtigste strafrechtliche Nachtrag für Norwegen.

    '
