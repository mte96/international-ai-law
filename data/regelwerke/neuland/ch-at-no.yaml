- id: ch-or
  jurisdiktion: ch
  kurztitel: Obligationenrecht (OR) — Vertrags- und Deliktshaftung für KI-Schäden
  offizieller_titel: 'Bundesgesetz vom 30. März 1911 betreffend die Ergänzung des Schweizerischen Zivilgesetzbuches
    (Fünfter Teil: Obligationenrecht)

    '
  fundstelle: 'SR 220. Fassung: Stand am 1. Januar 2026.'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht, Fassung Stand am 01.01.2026. Es gibt in der Schweiz KEINE KI-spezifische
    Haftungsnorm; die Schweiz hat auch kein Gegenstück zur EU-Richtlinie über die Haftung für fehlerhafte
    Produkte in ihrer neuen, KI-erfassenden Fassung übernommen.

    '
  kurzbeschreibung: 'Wer in der Schweiz Schäden aus KI-Systemen geltend macht, tut das über das allgemeine
    Obligationenrecht. Drei Wege stehen offen: die Vertragshaftung nach Art. 97 ff. OR mit ihrer für den
    Geschädigten günstigen Beweislastumkehr beim Verschulden, die Deliktshaftung nach Art. 41 ff. OR mit
    Widerrechtlichkeit und Verschulden als Voraussetzungen, und die Geschäftsherrenhaftung nach Art. 55
    OR. Die praktische Schwierigkeit liegt überall gleich: Ein KI-System ist kein Hilfsperson im Sinne
    des Art. 101 OR und keine Person im Sinne des Art. 55 OR, so dass die Zurechnung autonomen Systemverhaltens
    dogmatisch ungeklärt ist. Für den deutschen Juristen ist das der interessanteste Vergleichspunkt:
    Die Schweiz hat die Debatte um eine KI-Haftungsnorm nicht geführt, weil sie die EU-Produkthaftungs-
    und KI-Haftungsvorhaben nicht nachvollzogen hat.

    '
  inkrafttreten:
    datum: 1912-01-01
    verifiziert: false
    quelle: https://www.fedlex.admin.ch/eli/cc/27/317_321_377/de
  anwendungsdaten: []
  themenachsen:
  - haftung
  - vertrag
  regelungsschwerpunkte:
  - 'Art. 97 Abs. 1 OR (im Volltext gelesen): "Kann die Erfüllung der Verbindlichkeit überhaupt nicht
    oder nicht gehörig bewirkt werden, so hat der Schuldner für den daraus entstehenden Schaden Ersatz
    zu leisten, sofern er nicht beweist, dass ihm keinerlei Verschulden zur Last falle." Die Exkulpationslast
    liegt beim Schuldner — für Geschädigte einer fehlerhaften KI-Leistung der günstigste Weg, sofern ein
    Vertrag besteht.

    '
  - 'Art. 41 ff. OR: Deliktshaftung mit Widerrechtlichkeit und Verschulden; die Beweislast liegt hier
    beim Geschädigten.

    '
  - 'Art. 55 OR (Geschäftsherrenhaftung) und Art. 101 OR (Haftung für Hilfspersonen) knüpfen beide an
    PERSONEN an. Ob und wie ein autonom agierendes KI-System darunter fällt, ist in der Schweiz nicht
    gesetzlich geklärt.

    '
  dokumente:
  - datum: 2026-01-01
    typ: konsolidiert
    titel: SR 220 — Obligationenrecht, konsolidierte Fassung
    url: https://www.fedlex.admin.ch/eli/cc/27/317_321_377/de
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: Stabile ELI-Adresse des Erlasses.
  - datum: 2026-01-01
    typ: konsolidiert
    titel: SR 220 — Fassung vom 01.01.2026 (Dateispeicher, HTML-Teil 4)
    url: https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/27/317_321_377/20260101/de/html/fedlex-data-admin-ch-eli-cc-27-317_321_377-20260101-de-html-4.html
    sprache: de
    urheber: Schweizerische Bundeskanzlei, Fedlex
    verifiziert: true
    notiz: 'Direkt abrufbarer Volltext-Teil; Art. 97 daraus wörtlich entnommen. ACHTUNG: Der Dateispeicher
      zerlegt grosse Erlasse in mehrere HTML-Teile; die Teilnummer im Dateinamen ist zu beachten.

      '
  offene_punkte:
  - 'WIDERSPRUCH, NICHT GEGLÄTTET: Beim Abruf des Dateispeicher-Teils wurde unter der Bezeichnung "Art.
    41" ein Text über den Antrag unter Anwesenden ausgegeben, nicht die erwartete Schadenersatzpflicht
    aus unerlaubter Handlung. Ob das an der Zerlegung des Erlasses in Teildokumente oder an einem Lesefehler
    liegt, ist ungeklärt. Art. 41 OR ist deshalb hier NICHT als verifiziert zu behandeln; nur Art. 97
    ist wörtlich belegt.

    '
  - 'Das Produktehaftpflichtgesetz (PrHG, SR 221.112.944) konnte nicht abgerufen werden (der vermutete
    ELI cc/1993/3122_3122_3122 lieferte über den Dateispeicher keinen Text). Es fehlt in dieser Datei
    und ist nachzutragen — für KI-Produkte ist es die naheliegende Anspruchsgrundlage.

    '
  - Inkrafttreten des OR (01.01.1912) nicht am Text belegt.
  monitoring_quellen:
  - https://www.fedlex.admin.ch/eli/cc/27/317_321_377/de
