  jurisdiktion: 'no'
  kurztitel: arbeidsmiljøloven — Arbeitsumfeldgesetz
  offizieller_titel: 'Lov om arbeidsmiljø, arbeidstid og stillingsvern mv. (arbeidsmiljøloven) — Gesetz
    über Arbeitsumfeld, Arbeitszeit und Kündigungsschutz

    '
  fundstelle: 'LOV-2005-06-17-62, kundgemacht 17.06.2005, in Kraft seit 01.01.2006; zuletzt geändert durch
    LOV-2026-06-19-33 mit Wirkung vom 01.07.2026.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht; sehr aktuelle Änderung mit Wirkung vom 01.07.2026.
  kurzbeschreibung: 'Das norwegische Arbeitsschutz- und Arbeitsvertragsrecht. Für KI am Arbeitsplatz relevant
    sind die Vorschriften über Kontrollmassnahmen gegenüber Arbeitnehmern (Kapitel 9), die Beteiligungsrechte
    und die Anforderungen an ein vollständig verantwortbares Arbeitsumfeld. Anders als § 96 ArbVG in Österreich
    kennt Norwegen kein Zustimmungserfordernis eines Betriebsrats, sondern eine Pflicht zur Erörterung
    mit den gewählten Vertretern, verbunden mit einer Verhältnismässigkeitsprüfung und den datenschutzrechtlichen
    Anforderungen der personopplysningsloven. Das ist beim Vergleich der drei Rechtsordnungen der Punkt,
    an dem Österreich am schärfsten und Norwegen am flexibelsten reguliert.

    '
  inkrafttreten:
    datum: 2006-01-01
    verifiziert: true
    quelle: https://lovdata.no/dokument/NL/lov/2005-06-17-62
  anwendungsdaten: []
