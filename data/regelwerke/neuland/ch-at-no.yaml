      die Verschiebung der Fristen für Hochrisiko-KI-Systeme, benennt aber KEINE Marktüberwachungsbehörde.

      '
  - datum: null
    typ: uebersicht
    titel: Behörden nach Art. 77 AI Act
    url: https://www.digitalaustria.gv.at/themen/kuenstliche-intelligenz/behoerden-art77-ai-act.html
    sprache: de
