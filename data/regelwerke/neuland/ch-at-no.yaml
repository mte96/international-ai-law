regelwerke:
- id: ch-ki-regulierung-grundsatzentscheid
  jurisdiktion: ch
  kurztitel: Grundsatzentscheid des Bundesrates zur KI-Regulierung
  offizieller_titel: 'Bundesratsbeschluss vom 12. Februar 2025 über die Ausrichtung der KI-Regulierung
    in der Schweiz und über die Ratifikation des Rahmenübereinkommens des Europarats über künstliche Intelligenz
    und Menschenrechte, Demokratie und Rechtsstaatlichkeit

    '
  fundstelle: 'Kein Erlass im Sinne der Systematischen Rechtssammlung. Beschluss des Bundesrates vom 12.02.2025,
    gestützt auf die "Auslegeordnung zu möglichen Regulierungsansätzen für künstliche Intelligenz" des
    BAKOM vom 11.02.2025 und auf die "Rechtliche Basisanalyse" vom 31.08.2024.

    '
  verfahrensnummer: null
  status: verfahren
  status_detail: 'Der Beschluss ist gefasst und der Auftrag erteilt; die Vernehmlassungsvorlage ist am
    07.09.2026 noch nicht eröffnet. Der Bundesrat hat in der Stellungnahme zur Anfrage 26.3414 (Stand
    21.05.2026) bestätigt, dass die Vorlage bis Ende 2026 folgt.

    '
  kurzbeschreibung: 'Der Bundesrat entschied am 12.02.2025 gegen ein KI-Querschnittsgesetz nach dem Muster
    der EU-KI-Verordnung und für einen dreigliedrigen Ansatz: (1) Ratifikation der Rahmenkonvention des
    Europarats über KI, (2) sektorielle Anpassung des geltenden Rechts nur dort, wo die Konvention es
    zwingend verlangt, mit Schwerpunkt auf Transparenz, Datenschutz, Nichtdiskriminierung und Aufsicht,
    und (3) rechtlich unverbindliche Massnahmen (Selbstverpflichtungen, Branchenlösungen, Ethikkodizes)
    im Übrigen. Federführung für die Gesetzgebungsvorlage liegt beim EJPD (Bundesamt für Justiz), für
    die nichtlegislativen Massnahmen beim UVEK; das EDA wirkt bei der völkerrechtlichen Seite mit. Sanktionen
    enthält der Beschluss selbst nicht — er ist ein Planungsakt der Exekutive.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.bj.admin.ch/de/kuenstliche-intelligenz
  anwendungsdaten:
  - datum: 2026-12-31
    was_gilt: 'Frist des Bundesrates an das EJPD, die Vernehmlassungsvorlage zur Umsetzung der KI-Konvention
      zu erarbeiten; parallel Frist an das UVEK für den Plan der nichtlegislativen Massnahmen.

      '
    verifiziert: true
    quelle: https://www.bj.admin.ch/de/kuenstliche-intelligenz
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  - marktzugang
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Bewusste Absage an das EU-Modell: keine horizontale Risikoklassen- systematik, keine allgemeine Konformitätsbewertung,
    kein KI-Marktüberwachungsregime. Statt dessen Anpassung des Sektorrechts.

    '
  - 'Der Bundesrat nennt als Regelungsbereiche ausdrücklich Transparenz, Datenschutz, Nichtdiskriminierung
    und Aufsicht — das ist der Mindestbestand, den die Konvention des Europarats verlangt.

    '
  - 'In der Stellungnahme zur Anfrage 26.3414 hält der Bundesrat fest, dass bestimmte Vorschriften, insbesondere
    zur Transparenz, SOWOHL IM ÖFFENTLICHEN ALS AUCH IM PRIVATEN SEKTOR gelten sollen, und dass ein "mit
    der EU gleichwertiges Schutzniveau" angestrebt wird. Das ist der Punkt, an dem die schweizerische
    Lösung sich der KI-VO wieder annähert, obwohl sie deren Technik nicht übernimmt.

    '
  - 'Begleitgruppe aus internen und externen Fachleuten beim BJ; am 27.10.2025 partizipative Arbeitstagung
    mit rund 60 Vertreterinnen und Vertretern von Interessengruppen.

    '
  dokumente:
  - datum: 2024-08-31
    typ: bericht
    titel: Rechtliche Basisanalyse zur Regulierung von künstlicher Intelligenz
    url: https://www.bj.admin.ch/dam/de/sd-web/nXpT9p07Cpv8/rechtliche-analyse-ki.pdf
    sprache: de
    urheber: Bundesamt für Justiz (BJ)
    verifiziert: true
    notiz: 'Die juristische Vorarbeit: prüft, welche Bestimmungen des geltenden schweizerischen Rechts
      KI bereits erfassen und wo Lücken bestehen. Ausgangspunkt für die Frage, was überhaupt geändert
      werden muss.

      '
  - datum: 2025-02-11
    typ: bericht
    titel: 'Auslegeordnung zu möglichen Regulierungsansätzen für künstliche Intelligenz

      '
    url: https://www.bj.admin.ch/dam/de/sd-web/Bu0WALkfbp1B/ber-bakom-ki.pdf
    sprache: de
    urheber: Bundesamt für Kommunikation (BAKOM)
    verifiziert: true
    notiz: 'Das Dokument, auf dem der Grundsatzentscheid vom 12.02.2025 beruht. Vergleicht KI-VO, Europaratskonvention
      und sektorielle Ansätze und empfiehlt den schliesslich gewählten Weg.

      '
  - datum: 2025-10-27
    typ: bericht
    titel: 'Bericht über die partizipative Arbeitstagung zur Umsetzung der KI-Konvention

      '
    url: https://www.bj.admin.ch/dam/de/sd-web/tzVa46EVntgV/ber-partizipative-arbeitstagung-ki-konvention.pdf
    sprache: de
    urheber: Bundesamt für Justiz (BJ)
    verifiziert: true
    notiz: 'Dokumentiert die Positionen der rund 60 beteiligten Interessen- gruppen. Wer wissen will,
      welche Streitpunkte die Vernehmlassungsvorlage prägen werden, findet sie hier.

      '
  - datum: 2025-12-17
    typ: bericht
    titel: Begleitgruppe Regulierung künstlicher Intelligenz
    url: https://www.bj.admin.ch/dam/de/sd-web/gmg1MfFiw-ab/begleitgruppe-regulierung-kuenstlicher-intelligenz.pdf
    sprache: de
    urheber: Bundesamt für Justiz (BJ)
    verifiziert: true
    notiz: Zusammensetzung und Auftrag der Begleitgruppe.
  offene_punkte:
  - 'Der genaue Wortlaut des Bundesratsbeschlusses vom 12.02.2025 (nicht nur die Medienmitteilung) war
    über die amtlichen Portale nicht auffindbar; Bundesratsbeschlüsse dieser Art werden regelmässig nicht
    im Volltext publiziert. Nachzutragen, sobald die Botschaft vorliegt.

    '
  - 'Ob die Vernehmlassungsvorlage ein einziges Mantelgesetz oder mehrere Einzelrevisionen enthalten wird,
    ist am 07.09.2026 offen.

    '
  - 'Datum der Ratifikationsurkunde und des Inkrafttretens der Europaratskonvention für die Schweiz noch
    nicht belegt — die Unterzeichnung ist belegt (27.03.2025), die Ratifikation setzt die Genehmigung
    durch die Bundesversammlung voraus.

    '
