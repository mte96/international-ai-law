regelwerke:
- id: au-continental-ai-strategy-2024
  jurisdiktion: africa
  kurztitel: Continental AI Strategy der Afrikanischen Union
  offizieller_titel: 'Continental Artificial Intelligence Strategy — Harnessing AI for Africa''s Development
    and Prosperity

    '
  fundstelle: 'Angenommen vom Exekutivrat der Afrikanischen Union (Executive Council) auf seiner 45. ordentlichen
    Sitzung, 18./19.07.2024, Accra, Ghana. Erarbeitet von der AU-Kommission (Department of Infrastructure
    and Energy) gemeinsam mit dem African Union Development Agency (AUDA-NEPAD) und der AU High-Level
    Panel on Emerging Technologies (APET).

    '
  verfahrensnummer: Executive Council, 45th Ordinary Session (Accra, 18.-19.07.2024)
  status: softlaw
  status_detail: 'Politische Strategie, kein Rechtsakt. Sie bindet die Mitgliedstaaten nicht und schafft
    keine unmittelbaren Rechte oder Pflichten. Ihre Wirkung entfaltet sie über die nationale Umsetzung:
    nahezu alle afrikanischen KI-Strategien der Jahre 2024 bis 2026 — darunter die kenianische — nehmen
    ausdrücklich auf sie Bezug. Der in der Strategie angekündigte Fünfjahres-Umsetzungsplan der AU-Kommission
    konnte nicht als eigenständig veröffentlichtes Dokument belegt werden (siehe offene_punkte).

    '
  kurzbeschreibung: 'Die Strategie formuliert einen afrikanisch zentrierten, entwicklungsorientierten
    Zugang zu KI und ordnet ihn der Agenda 2063 und den Nachhaltigkeitszielen zu. Sie gliedert sich in
    fünf Schwerpunktfelder — Nutzung der Chancen, Beherrschung der Risiken, Aufbau von Fähigkeiten (Infrastruktur,
    Fachkräfte, Datenbestände, Innovation, Forschung), regionale und internationale Zusammenarbeit sowie
    Mobilisierung öffentlicher und privater Investitionen — und unterlegt sie mit fünfzehn strategischen
    Zielen mit dem Zielhorizont 2030. Sanktionen sieht sie nicht vor; sie ruft die Mitgliedstaaten auf,
    nationale KI-Strategien und Governance-Mechanismen zu entwickeln, ohne dafür eine verbindliche Frist
    zu setzen. Adressaten sind die AU-Kommission, die Regionalen Wirtschaftsgemeinschaften (RECs) und
    die Mitgliedstaaten.

    '
  inkrafttreten:
    datum: 2024-07-19
    verifiziert: true
    quelle: https://au.int/en/documents/20240809/continental-artificial-intelligence-strategy
  themenachsen:
  - governance
  - grundrechte
  - marktzugang
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Fünf Schwerpunktfelder (Focus Areas): (1) Nutzen der KI für Menschen, Institutionen, Privatwirtschaft
    und Staaten; (2) Bewältigung der mit zunehmender KI-Nutzung verbundenen Risiken; (3) Beschleunigung
    der Fähigkeiten der Mitgliedstaaten bei Infrastruktur, Talent, Datenbeständen, Innovation und Forschung;
    (4) Förderung regionaler und internationaler Zusammenarbeit; (5) Anregung öffentlicher und privater
    Investitionen.'
  - Fünfzehn strategische Ziele mit Zielhorizont 2030 — u.a. Umsetzung von Governance-Strukturen, KI-Einsatz
    im öffentlichen Sektor, Integration in Landwirtschaft, Bildung, Gesundheit und Klimaschutz, Verfügbarkeit
    von Datenbeständen, Informationsintegrität, Qualifizierung, Forschung, Übernahme ethischer Grundsätze
    und Sicherheitsstandards, Beteiligung an der globalen KI-Governance.
  - 'Call for Action: Die AU-Kommission wird beauftragt, einen Fünfjahres-Umsetzungsplan zu erarbeiten,
    ''that considers the variations and disparities between AU Member States''. Damit ist die Ungleichzeitigkeit
    zwischen den Mitgliedstaaten ausdrücklich anerkannt, nicht eingeebnet.'
  - 'KEINE verbindliche Frist für die Mitgliedstaaten: Die Strategie ruft dazu auf, nationale KI-Strategien
    zu entwickeln, nennt aber kein Jahr, bis zu dem das geschehen müsste. Anderslautende Sekundärdarstellungen
    (auch der in 206_suedafrika.yaml vermerkte Zeitplan 2025/26) finden im Text der Strategie selbst keine
    Grundlage.'
  - 'Kein Rechtsetzungsauftrag: Die Strategie schlägt kein kontinentales KI-Gesetz und keine Konvention
    vor. Sie setzt auf nationale Strategien plus Koordinierung — das Gegenmodell zum EU-Ansatz eines unmittelbar
    geltenden Rechtsakts.'
