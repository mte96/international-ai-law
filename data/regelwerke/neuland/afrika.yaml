- id: ke-verfassung-art-31
  jurisdiktion: ke
  kurztitel: Verfassung Kenias 2010, Art. 31 (Privatsphäre)
  offizieller_titel: The Constitution of Kenya, 2010
  fundstelle: Verfassung der Republik Kenia, verkündet am 27.08.2010
  status: anwendbar
  status_detail: 'In Kraft. Art. 31 lit. c und d ist die Norm, auf der das gesamte kenianische Datenschutz-
    und damit KI-Recht ruht: Der Data Protection Act 2019 trägt im Langtitel ausdrücklich den Zweck, "to
    give effect to Article 31(c) and (d) of the Constitution". Sämtliche Leitlinien der Datenschutzaufsicht
    nennen Art. 31 als Rechtsgrundlage. Der Wortlaut des Artikels konnte NICHT am amtlichen Verfassungstext
    verifiziert werden (new.kenyalaw.org antwortete auf alle Abrufe der Verfassung mit HTTP 403).

    '
  kurzbeschreibung: 'Art. 31 der kenianischen Verfassung von 2010 gewährleistet das Recht auf Privatsphäre.
    Die Buchstaben c und d — auf die der Data Protection Act 2019 ausdrücklich Bezug nimmt — betreffen
    nach der Systematik des Artikels den Schutz von Informationen über die Familie oder Privatangelegenheiten
    und den Schutz der Vertraulichkeit der Kommunikation. Über diese Norm sind biometrische Großsysteme,
    Gesichtserkennung und algorithmische Profilbildung in Kenia grundrechtlich angreifbar; sie ist der
    verfassungsrechtliche Maßstab jeder Verhältnismäßigkeitsprüfung (Art. 24 der Verfassung regelt die
    Schrankenbestimmung).

    '
  inkrafttreten:
    datum: 2010-08-27
    verifiziert: false
    quelle: https://www.odpc.go.ke/wp-content/uploads/2024/02/TheDataProtectionAct__No24of2019.pdf
  themenachsen:
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'MITTELBAR VERIFIZIERT: Der Langtitel des Data Protection Act, No. 24 of 2019 lautet ''AN ACT of Parliament
    to give effect to Article 31(c) and (d) of the Constitution...''. Damit ist die verfassungsrechtliche
    Anknüpfung des kenianischen Datenschutzrechts an Art. 31 lit. c und d amtlich belegt, auch wenn der
    Verfassungswortlaut hier nicht abgerufen werden konnte.'
  - 'MITTELBAR VERIFIZIERT: Die ODPC-Leitlinien zu biometrischen Daten (11/2025), zum öffentlichen Sektor
    (11/2025) und zu Gesundheitsdaten (12/2023) nennen jeweils die Constitution of Kenya 2010, Article
    31, als Rechtsgrundlage.'
  - Art. 24 der Verfassung enthält die allgemeine Schrankenregelung für Grundrechte (limitation of rights)
    und ist der Prüfungsmaßstab, an dem staatliche biometrische Systeme in Kenia gemessen werden.
  dokumente:
  - datum: 2019-11-08
    typ: konsolidiert
    titel: Data Protection Act No. 24 of 2019 — Langtitel mit Bezug auf Art. 31(c) und (d) der Verfassung
    url: https://www.odpc.go.ke/wp-content/uploads/2024/02/TheDataProtectionAct__No24of2019.pdf
    sprache: en
    urheber: Republic of Kenya
    verifiziert: true
    notiz: Mittelbarer, aber amtlicher Beleg des verfassungsrechtlichen Bezugs. Der Verfassungstext selbst
      konnte nicht abgerufen werden.
  offene_punkte:
  - DER WORTLAUT DES ART. 31 FEHLT. Fünf Abrufversuche des Verfassungstextes auf new.kenyalaw.org (verschiedene
    Datumsvarianten des Akoma-Ntoso-Pfades) endeten sämtlich mit HTTP 403. Der Wortlaut ist nachzuholen.
  - Die Rechtsprechung des High Court zum biometrischen Melderegister NIIMS/Huduma Namba, die Art. 31
    ausgelegt hat, konnte nicht erschlossen werden (Rechtsprechungsportal gesperrt). Sie ist der wichtigste
    fehlende Baustein — siehe bericht.
  monitoring_quellen:
  - https://new.kenyalaw.org/legislation/
  bezug_regelwerke:
  - ke-data-protection-act-2019
  - ke-odpc-guidance-biometrie
