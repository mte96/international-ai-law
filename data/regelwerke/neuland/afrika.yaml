- id: ecowas-supplementary-act-datenschutz-2010
  jurisdiktion: africa
  kurztitel: ECOWAS-Zusatzrechtsakt zum Datenschutz
  offizieller_titel: 'ECOWAS Supplementary Act A/SA.1/01/10 on Personal Data Protection within ECOWAS

    '
  fundstelle: Zusatzrechtsakt A/SA.1/01/10 der Wirtschaftsgemeinschaft westafrikanischer Staaten (ECOWAS),
    2010
  status: anwendbar
  status_detail: 'Von der Nigeria Data Protection Commission auf ihrer amtlichen Seite als für Nigeria
    maßgebliches Instrument des Datenschutzrahmens genannt. FÜR NIGERIA PRAKTISCH BEDEUTSAMER ALS DIE
    MALABO-KONVENTION: Nigeria hat Malabo nur unterzeichnet (23.01.2024) und nicht ratifiziert, ist aber
    ECOWAS-Mitglied. ECOWAS-Zusatzrechtsakte sind für die Mitgliedstaaten nach dem ECOWAS-Vertragsrecht
    verbindlich und bedürfen keiner gesonderten Ratifikation. Der Volltext war nicht abrufbar.

    '
  kurzbeschreibung: 'Regionaler Datenschutzrechtsakt der ECOWAS von 2010, der die Mitgliedstaaten zur
    Einrichtung nationaler Datenschutzbehörden und zur Gewährleistung von Verarbeitungsgrundsätzen und
    Betroffenenrechten verpflichtet. Er ist zeitlich vor der Malabo-Konvention (2014) ergangen und in
    Westafrika deren praktisch wirksamer Vorläufer. Für KI-Sachverhalte ist maßgeblich, ob er ein Recht
    gegen ausschließlich automatisierte Entscheidungen enthält — das konnte nicht geprüft werden.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://ndpc.gov.ng/Home/About
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - Von der nigerianischen Datenschutzaufsicht selbst als Teil des für Nigeria maßgeblichen Rahmens benannt
    — neben der Verfassung (s. 37), der AEMR (Art. 12), dem IPbpR (Art. 17) und dem Child Rights Act (s.
    8).
  - 'OFFEN: Ob der Zusatzrechtsakt eine Vorschrift zu ausschließlich automatisierten Entscheidungen enthält.
    Die Malabo-Konvention hat sie nachweislich NICHT; der ECOWAS-Rechtsakt ist an das französische und
    das damalige EU-Recht angelehnt, das eine solche Vorschrift kannte (Art. 15 RL 95/46/EG) — ein Vorhandensein
    ist daher plausibel, aber unbelegt.'
  dokumente:
  - datum: 2010-02-16
    typ: uebersicht
    titel: Nennung des ECOWAS-Zusatzrechtsakts durch die Nigeria Data Protection Commission
    url: https://ndpc.gov.ng/Home/About
    sprache: en
    urheber: Nigeria Data Protection Commission
    verifiziert: true
    notiz: Der Beleg besteht in der amtlichen Nennung durch die nigerianische Aufsichtsbehörde. Das Datum
      16.02.2010 ist die geläufige Angabe zum Rechtsakt und wurde NICHT verifiziert.
  offene_punkte:
  - Volltext nicht gefunden. Weder africanlii.org (die REC-Sammlung dort führt EAC- und SADC-Instrumente,
    aber im abgerufenen Auszug keine ECOWAS-Instrumente) noch ecowas.int wurden erfolgreich ausgewertet.
    VIERTE AUFGABE FÜR DEN NÄCHSTEN BEARBEITER.
  - Datum, Fundstelle und Bindungswirkung sind unverifiziert.
