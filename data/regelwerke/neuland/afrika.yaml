- id: ng-copyright-act-2022
  jurisdiktion: ng
  kurztitel: Copyright Act 2022 (Nigeria)
  offizieller_titel: Copyright Act, 2022
  fundstelle: 'Bundesgesetz. Nach amtlicher Angabe der Nigerian Copyright Commission "came into effect
    on 17th March 2023".

    '
  status: anwendbar
  status_detail: 'In Kraft seit dem 17.03.2023 (amtliche Angabe der Nigerian Copyright Commission). Das
    Gesetz ersetzt den Copyright Act von 1988/2004 und gilt als eines der modernsten Urheberrechtsgesetze
    Afrikas, insbesondere wegen seiner Vorschriften gegen digitale Piraterie. ZUR TRAININGSFRAGE IST NICHTS
    BELEGT: Der Volltext war an keiner amtlichen Quelle abrufbar.

    '
  kurzbeschreibung: 'Neues nigerianisches Urheberrechtsgesetz, in Kraft seit dem 17.03.2023. Nach Darstellung
    der Nigerian Copyright Commission stärkt es die Rechte der Kreativen und sieht strengere Strafen für
    strafbare Rechtsverletzungen vor, insbesondere im audiovisuellen Bereich und bei Online-Filmpiraterie.
    s. 54 wird von der Kommission als stakeholderrelevante Vorschrift hervorgehoben. Der Auftrag geht
    davon aus, dass das Gesetz eine eigene Schrankenregelung enthält und dass zu prüfen sei, ob sie Text
    and Data Mining erfasst — diese Prüfung konnte mangels Zugangs zum Volltext NICHT durchgeführt werden.

    '
  inkrafttreten:
    datum: 2023-03-17
    verifiziert: true
    quelle: https://copyright.gov.ng/librarians-acclaim-the-2023-copyright-act-as-an-international-model/
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - 'In Kraft seit dem 17.03.2023; amtliche Formulierung der Nigerian Copyright Commission: ''The Nigerian
    Copyright Act, 2022 which came into effect on 17th March 2023, has been appraised as one of the best
    in the world''.'
  - 'Nach amtlicher Darstellung: verschärfte Vorschriften gegen digitale Piraterie, insbesondere bei audiovisuellen
    Werken und Online-Filmen; gestärkte Rechte der Kreativen; strengere Strafen für strafbare Rechtsverletzungen.'
  - s. 54 wird von der Kommission als Vorschrift genannt, von der Beteiligte Gebrauch machen sollen ('Take
    advantage of section 54') — Inhalt nicht ermittelt.
  - 'OFFENE KERNFRAGE (Auftrag): Ob die Schrankenregelung des Gesetzes Text and Data Mining oder computergestützte
    Analyse erfasst und ob computererzeugte Werke geregelt sind, konnte NICHT geprüft werden. Zum Vergleich:
    Kenia regelt die Urheberschaft an computererzeugten Werken ausdrücklich in s. 2 Cap. 130, hat aber
    keine TDM-Schranke.'
  dokumente:
  - datum: 2024-07-22
    typ: pressemitteilung
    titel: Librarians Acclaim the 2023 Copyright Act as an International Model
    url: https://copyright.gov.ng/librarians-acclaim-the-2023-copyright-act-as-an-international-model/
    sprache: en
    urheber: Nigerian Copyright Commission
    verifiziert: true
    notiz: AMTLICHE QUELLE für das Datum des Inkrafttretens (17.03.2023). Die Kommission bezeichnet das
      Gesetz dort selbst als 'Nigerian Copyright Act, 2022'.
  - datum: 2024-07-20
    typ: pressemitteilung
    titel: 'Copyright Act: Robust Provisions Embedded to Tackle Digital Piracy'
    url: https://copyright.gov.ng/copyright-act-robust-provisions-embedded-to-tackle-digital-piracy/
    sprache: en
    urheber: Nigerian Copyright Commission
    verifiziert: true
    notiz: Amtliche Darstellung der Digitalvorschriften des Gesetzes.
  - datum: 2024-07-20
    typ: pressemitteilung
    titel: Take Advantage of Section 54 of the Copyright Act, NCC Urges Stakeholders
    url: https://copyright.gov.ng/take-advantage-of-section-54-of-the-copyright-act-ncc-urges-stakeholders/
    sprache: en
    urheber: Nigerian Copyright Commission
    verifiziert: true
    notiz: Verweis der Behörde auf s. 54; Inhalt der Vorschrift nicht ermittelt.
  offene_punkte:
  - 'DER GESETZESTEXT FEHLT. copyright.gov.ng gibt keine Dokumentenliste und kein Gesetzes-PDF aus (versuchte
    Pfade: /downloads/, /copyright-act/, /wp-content/uploads/2023/03/Copyright-Act-2022.pdf — alle 404).
    Die Schranken-/TDM-Frage bleibt damit unbeantwortet. DRITTE AUFGABE FÜR DEN NÄCHSTEN BEARBEITER.'
  - 'VERIFIZIERTER NEGATIVBEFUND: Die Volltextsuche auf copyright.gov.ng nach ''artificial intelligence''
    liefert bis Februar 2026 KEINEN Treffer zu KI, KI-erzeugten Werken, Text and Data Mining oder Urheberrecht
    und KI. Die nigerianische Urheberrechtsbehörde hat sich zur KI-Frage öffentlich nicht geäußert.'
  - 'Widersprüchliche Bezeichnung, nicht geglättet: Die Kommission spricht in ein und demselben Beitrag
    vom ''2023 Copyright Act'' (Überschrift) und vom ''Nigerian Copyright Act, 2022'' (Text). Maßgeblich
    ist die Kurzbezeichnung ''Copyright Act 2022'' bei Inkrafttreten am 17.03.2023.'
  monitoring_quellen:
  - https://copyright.gov.ng/
  bezug_regelwerke:
