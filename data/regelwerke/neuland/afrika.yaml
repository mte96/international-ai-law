- id: ke-digital-health-act-2023
  jurisdiktion: ke
  kurztitel: Digital Health Act 2023 (Kenia)
  offizieller_titel: The Digital Health Act, 2023 (Bezeichnung und Aktennummer NICHT verifiziert)
  fundstelle: Act of Parliament 2023 — Fundstelle nicht verifiziert
  status: anwendbar
  status_detail: 'NICHT VERIFIZIERT. Acht Abrufversuche des mutmaßlichen Akoma-Ntoso-Pfades (new.kenyalaw.org/akn/ke/act/2023/15/eng
    mit acht verschiedenen Datumsvarianten) endeten sämtlich mit HTTP 403. Ob die Aktennummer 15 zutrifft,
    ist damit ebenfalls unbestätigt. BEMERKENSWERTER NEBENBEFUND: Die ODPC-Leitlinie zur Verarbeitung
    von Gesundheitsdaten (Dezember 2023) nennt als Rechtsgrundlagen den Data Protection Act 2019, die
    Verfassung, den Health Act 2017 und mehrere Politikdokumente — aber NICHT den Digital Health Act 2023.
    Das kann daran liegen, dass die Leitlinie zeitgleich mit dem Gesetz entstand; es kann aber auch ein
    Hinweis darauf sein, dass die Aufsicht das Gesetz nicht als datenschutzrechtliche Grundlage behandelt.

    '
  kurzbeschreibung: 'Nach der Ausgangsangabe des Auftrags ein kenianisches Gesetz von 2023 über digitale
    Gesundheit. Es wäre die sektorale Norm, an der KI-Diagnostik, Telemedizin und Gesundheitsdatennutzung
    in Kenia zu messen wären. Inhalt, Aktennummer, Ausfertigungs- und Inkrafttretensdatum konnten nicht
    belegt werden; es werden keine Angaben behauptet. Die praktisch anwendbare Norm für Gesundheits-KI
    ist nach dem Befund dieser Sitzung ohnehin der Data Protection Act 2019 in der Auslegung der ODPC-Leitlinie
    zu Gesundheitsdaten.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: null
  themenachsen:
  - sektor-medizin
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - UNVERIFIZIERT. Keine Inhaltsangaben zum Gesetz, weil kein amtlicher Text erreicht wurde.
  - 'ERSATZWEISE VERIFIZIERT — die tatsächlich geltende Norm für Gesundheits-KI: Die ODPC Guidance Note
    on the Processing of Health Data (Dezember 2023) bestimmt in Abschnitt 6.5 im Wortlaut: ''A data subject
    has the right to demand human intervention, rather than having important decisions made solely by
    algorithm automatically''. Das ist die einzige belegte kenianische Norm, die den Begriff ''algorithm''
    verwendet, und sie richtet sich unmittelbar an Krankenhäuser, Labore, Krankenversicherer und Gesundheitsforschungseinrichtungen.'
  - 'ERSATZWEISE VERIFIZIERT: Die Leitlinie erlaubt in Abschnitt 5.7 die Verarbeitung zu ''historical,
    statistical, journalistic, literature and art or scientific research'' als Rechtsgrundlage, mit wirksamer
    Einwilligung und angemessenen Schutzmaßnahmen — die Norm, über die sekundäre Nutzung von Gesundheitsdaten
    für Modellentwicklung in Kenia laufen müsste.'
  - 'ERSATZWEISE VERIFIZIERT: Pflicht zur Datenschutz-Folgenabschätzung bei Hochrisikoverarbeitung, Meldung
    von Verletzungen binnen 72 Stunden, schriftliche Auftragsverarbeitungsvereinbarungen, Registrierungspflicht
    beim ODPC — für alle Gesundheitseinrichtungen in Kenia.'
  dokumente:
  - datum: 2023-12-01
    typ: leitlinie
    titel: ODPC Guidance Note on the Processing of Health Data
    url: https://www.odpc.go.ke/wp-content/uploads/2024/02/ODPC-Guidance-Note-on-Processing-of-Health-Data.pdf
    sprache: en
    urheber: Office of the Data Protection Commissioner (Kenia)
    verifiziert: true
    notiz: Amtlicher Volltext, maschinenlesbar, Dezember 2023. Ersatzquelle für den nicht erreichbaren
      Digital Health Act. Nennt als Rechtsgrundlagen den Data Protection Act 2019, die Verfassung 2010,
      den Health Act 2017, die eHealth Policy 2016-2030, die mHealth Standards 2017 und die Health Information
      Policy 2014-2030 — NICHT den Digital Health Act 2023.
  offene_punkte:
  - Existenz, Aktennummer und Text des Digital Health Act 2023 sind unbelegt. SECHSTE AUFGABE FÜR DEN
    NÄCHSTEN BEARBEITER.
  - Zu klären ist der auffällige Befund, dass die Datenschutzaufsicht in ihrer Gesundheitsleitlinie den
    Digital Health Act nicht anführt.
  monitoring_quellen:
  - https://new.kenyalaw.org/legislation/
  - https://www.odpc.go.ke/guidelines-2/
  bezug_regelwerke:
  - ke-data-protection-act-2019
  - ke-odpc-guidance-biometrie
