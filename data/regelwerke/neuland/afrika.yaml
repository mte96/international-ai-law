  kurztitel: Kenianischer KI-Gesetzentwurf 2026
  offizieller_titel: The Artificial Intelligence Bill, 2026
  fundstelle: 'Senate Bills No. 4 of 2026. Veröffentlicht (published) am 19.02.2026 im Kenya Gazette Supplement
    (Bills). Erste Lesung im Senat am 02.04.2026.

    '
  verfahrensnummer: Senate Bills No. 4 of 2026
  status: verfahren
  status_detail: 'Von Senatorin Karen Nyamu eingebrachter Gesetzentwurf einer einzelnen Abgeordneten (ordinary
    bill), veröffentlicht am 19.02.2026, erste Lesung im Senat am 02.04.2026. Ein weiteres Verfahrensstadium
    (zweite Lesung, Ausschussbericht, Beschluss) konnte NICHT belegt werden; das amtliche Bill-Tracking
    des Parlaments war nicht erreichbar. Der Entwurf ist damit weiterhin im Verfahren, aber ohne nachweisbaren
    Fortschritt seit April 2026. Kenia hat kein geltendes KI-Gesetz.

    '
  kurzbeschreibung: 'Der Entwurf will KI in Kenia umfassend regeln und dazu ein Office of the Artificial
    Intelligence Commissioner als eigenständiges Staatsamt (state office) mit Rechtspersönlichkeit einrichten.
    Er ordnet KI-Systeme in vier Risikoklassen — unacceptable, high, limited, minimal risk —, wobei die
    Einordnung dem Commissioner obliegt. Für Hochrisikosysteme verlangt er eine Risiko- UND Menschenrechtsfolgenabschätzung
    vor dem Einsatz, Transparenz und Erklärbarkeit, Dokumentation, Einhaltung des Data Protection Act
    und Robustheit sowie die Einwilligung für die Nutzung von Abbild und Stimme. Er sieht Regulierungs-Sandkästen,
    verbindliche Ethikleitlinien, eine Pflicht zu Belegschaftsfolgenabschätzungen samt Umschulungsprogrammen
    und eine dreijährliche Gesetzesüberprüfung vor. Verstöße sind mit Geldstrafe bis 5 Mio. KES oder Freiheitsstrafe
    bis zu zwei Jahren bedroht, geringere Verstöße mit bis zu 1 Mio. KES oder sechs Monaten; Direktoren
    haften persönlich bei Kenntnis und unterlassener Sorgfalt.

    '
