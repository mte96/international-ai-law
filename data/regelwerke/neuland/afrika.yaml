  offene_punkte:
  - Der in der Strategie angekündigte Fünfjahres-Umsetzungsplan (5 Year Implementation Plan) der AU-Kommission
    konnte nicht als eigenständiges Dokument auf au.int nachgewiesen werden. Ob er ergangen ist, ist offen
    — er wäre das Dokument, an dem sich messen ließe, was aus der Strategie geworden ist.
  - Das AU-Dokumentensymbol (Ex.CL/Dec. bzw. Ex.CL/... (XLV)) der Annahmeentscheidung des Exekutivrats
    konnte nicht ermittelt werden; die Dokumentenseite nennt es nicht. Für die Zitierfähigkeit wäre es
    zu ergänzen.
  - Ob die Versammlung der Staats- und Regierungschefs (Assembly) die Strategie zusätzlich gebilligt hat
    oder ob es bei der Annahme durch den Exekutivrat geblieben ist, ist nicht geklärt.
