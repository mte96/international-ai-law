  offene_punkte:
  - Die vom Protokoll vorgesehenen Anhänge — Emerging and Advanced Technologies (Art. 34), Cross-Border
    Data Transfers (Art. 20), Digital Identities (Art. 14), Source Code (Art. 24), Rules of Origin (Art.
    5) — konnten nicht nachgewiesen werden. Sie sind der eigentliche Regelungsgehalt; ohne sie ist das
    Protokoll ein Rahmen ohne Inhalt. ERSTE AUFGABE FÜR DEN NÄCHSTEN BEARBEITER.
  - Zahl der Unterzeichnungen und Ratifikationen sowie ein Inkrafttretensdatum ließen sich der Vertragsseite
    nicht entnehmen; sie vermerkt nur 'Not yet entered into force'. Ein Ratifikationsstandsbericht wie
    bei der Malabo-Konvention wurde nicht gefunden.
  - Verhältnis zwischen Art. 24 (Quellcodeschutz) und künftigen nationalen KI-Aufsichtsbefugnissen ist
    ungeklärt und potentiell konfliktträchtig — Kenias KI-Gesetzentwurf sieht Prüfbefugnisse des Commissioners
    vor.
