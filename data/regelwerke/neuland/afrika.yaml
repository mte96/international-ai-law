    Verfassung — Verträge gelten in Nigeria erst nach Umsetzung durch Bundesgesetz), konnte nicht geklärt
    werden.
  - Das Verhältnis der Konvention zum AfCFTA-Digitalhandelsprotokoll (Art. 21 dort verlangt ebenfalls
    nationale Datenschutzrahmen) ist ungeklärt; beide Instrumente laufen nebeneinander.
