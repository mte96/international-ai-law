- id: ng-ndpa-2023
  jurisdiktion: ng
  kurztitel: Nigeria Data Protection Act 2023
  offizieller_titel: Nigeria Data Protection Act, 2023
  fundstelle: 'Bundesgesetz, vom Präsidenten am 12.06.2023 unterzeichnet ("signed into law on June 12,
    2023" — Angabe der Nigeria Data Protection Commission auf ihrer amtlichen Seite). Verfassungsrechtliche
    Grundlage nach Darstellung der Kommission: s. 37 der Verfassung der Bundesrepublik Nigeria 1999 (Schutz
    der Privatsphäre).

    '
  status: anwendbar
  status_detail: 'In Kraft. Das Gesetz errichtet die Nigeria Data Protection Commission (NDPC) als Datenschutzaufsicht
    und löst die Nigeria Data Protection Regulation 2019 (NDPR) der NITDA als maßgeblichen Rahmen ab;
    die NDPR wirkt daneben fort, soweit sie nicht verdrängt ist. ZUR KONKRETISIERUNG hat die NDPC 2025
    die General Application and Implementation Directive (GAID) erlassen — sie ist im amtlichen NAIS-Zwischenbericht
    des NCAIR vom 29.04.2026 als geltendes Instrument genannt, ihr Volltext war nicht zugänglich.

    '
  kurzbeschreibung: 'Das nigerianische Datenschutzgesetz regelt die Verarbeitung personenbezogener Daten
    durch Verantwortliche (data controllers) und Auftragsverarbeiter (data processors) und errichtet die
    NDPC mit Aufsichts-, Untersuchungs- und Sanktionsbefugnissen. Es ist die Norm, an der KI-Anwendungen
    in Nigeria heute gemessen werden: Die Nationale KI-Strategie bindet in Abschnitt 1.1.3.5 die KI-Grundsätze
    ausdrücklich an das Gesetz — Datenminimierung, Zweckbindung, Rechte auf Berichtigung und Löschung,
    Transparenzanforderungen. ACHTUNG: Der Volltext des Gesetzes konnte an KEINER amtlichen Quelle abgerufen
    werden; Angaben zu einzelnen Paragraphen, zu einem Recht gegen automatisierte Entscheidungen und zu
    Sanktionshöhen fehlen deshalb bewusst und dürfen nicht ergänzt werden, ohne am Text geprüft zu werden.

    '
  inkrafttreten:
    datum: 2023-06-12
    verifiziert: true
    quelle: https://ndpc.gov.ng/Home/About
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - sektor-finanz
  regelungsschwerpunkte:
  - Errichtung der Nigeria Data Protection Commission (NDPC) als eigenständige Datenschutzaufsicht des
    Bundes — bis 2023 lag die Aufsicht bei der NITDA bzw. der aus ihr hervorgegangenen NDPB.
  - 'Verfassungsrechtliche Verankerung: Die NDPC leitet den Schutz aus s. 37 der Verfassung von 1999 ab
    und stellt ihn ausdrücklich neben Art. 12 der Allgemeinen Erklärung der Menschenrechte und Art. 17
    des Internationalen Pakts über bürgerliche und politische Rechte sowie s. 8 des Child Rights Act.'
  - 'Die NDPC verweist auf ein regionales Instrument, das für Nigeria neben dem Bundesrecht steht: den
    ECOWAS Supplementary Act A/SA.1/01/10 on Personal Data Protection. Dieser bindet Nigeria als ECOWAS-Mitglied
    — anders als die Malabo-Konvention, die Nigeria nur unterzeichnet hat.'
  - 'Sektorale Flankierung, von der NDPC selbst genannt: die Consumer Code of Practice Regulations der
    Nigerian Communications Commission und die Consumer Protection Regulation der Central Bank of Nigeria.'
  - 'Anbindung der KI-Strategie: Abschnitt 1.1.3.5 NAIS verlangt für KI-Systeme die Einhaltung der Datenminimierung
    und Zweckbindung, die Wahrung der Betroffenenrechte auf Berichtigung und Löschung und die Erfüllung
    der Transparenzanforderungen des Gesetzes; Abschnitt 1.4.1.1 fordert ''holistic data governance standards
    that adhere to the tenets of the NDPA''.'
  dokumente:
  - datum: 2023-06-12
    typ: uebersicht
    titel: Nigeria Data Protection Commission — Who We Are (amtliche Selbstdarstellung mit Rechtsgrundlage)
    url: https://ndpc.gov.ng/Home/About
    sprache: en
    urheber: Nigeria Data Protection Commission
    verifiziert: true
    notiz: AMTLICHE QUELLE für das Unterzeichnungsdatum (12.06.2023), die Errichtung der NDPC und den
      verfassungsrechtlichen sowie völkerrechtlichen Bezugsrahmen. Enthält KEINE Verlinkung des Gesetzestextes.
  offene_punkte:
  - DER GESETZESTEXT FEHLT. Abrufversuche über ndpc.gov.ng (mehrere Pfade unter /Files/ — durchgehend
    HTTP 403), nitda.gov.ng, fmcide.gov.ng (Suche nach 'data protection' ohne Treffer), placng.org/lawsofnigeria
    (nur Stand 2004) und nigerialii.org (Legislativdatenbank gibt keine Dokumente aus) blieben erfolglos.
    ERSTE AUFGABE FÜR DEN NÄCHSTEN BEARBEITER.
  - 'Ob der NDPA 2023 ein Recht gegen ausschließlich automatisierte Entscheidungen enthält — die für KI
    entscheidende Frage —, ist damit UNGEKLÄRT. Zur Erinnerung: Die NDPR 2019 (Vorgängerregelung der NITDA)
    kannte ein solches Recht nicht ausdrücklich. Kenia hat es mit s. 35 seines Gesetzes; ob Nigeria nachgezogen
    hat, ist zu prüfen.'
  - Die General Application and Implementation Directive (GAID) 2025 der NDPC ist durch den amtlichen
    NCAIR-Zwischenbericht als bestehend belegt, ihr Volltext, ihr Erlassdatum, ihre Übergangs- und Compliance-Fristen
    und ihre Sanktionsregelungen jedoch nicht. Alle Abrufversuche auf ndpc.gov.ng scheiterten mit HTTP
    403. ZWEITE AUFGABE FÜR DEN NÄCHSTEN BEARBEITER.
  - Es konnte keine veröffentlichte Sanktionsentscheidung der NDPC gefunden werden; die Kommission gibt
    auf ihrer Seite keine Entscheidungssammlung aus.
