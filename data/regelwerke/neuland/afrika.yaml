- id: ng-nais-2025
  jurisdiktion: ng
  kurztitel: Nationale KI-Strategie Nigerias (NAIS)
  offizieller_titel: National Artificial Intelligence Strategy
  fundstelle: 'Herausgegeben vom Federal Ministry of Communications, Innovation and Digital Economy (FMCIDE).
    Veröffentlichte Endfassung: September 2025 (Dateistand 19.09.2025). Grundlage war ein Erarbeitungsworkshop
    vom 15. bis 18.04.2024 mit rund 120 nigerianischen Sachverständigen aus dem Inland und der Diaspora.

    '
  status: softlaw
  status_detail: 'Politische Strategie ohne Bindungswirkung; das Dokument bezeichnet sich selbst als "living
    document". WIDERSPRUCH ZUM AUFTRAG, ausdrücklich vermerkt: Der Auftrag datiert die NAIS auf 2024.
    Die auf dem amtlichen Portal des National Centre for Artificial Intelligence and Robotics (NCAIR,
    einer Stelle der NITDA) hinterlegte Fassung trägt das Datum 19.09.2025. Das Jahr 2024 bezeichnet die
    Erarbeitung (April 2024), nicht die Veröffentlichung. Der Umsetzungszeitraum ist mit fünf Jahren (2025-2029)
    angegeben. Ein Zwischenbericht vom April 2026 ("Two Years of Nigeria''s National AI Strategy") ist
    veröffentlicht.

    '
  kurzbeschreibung: 'Die Strategie formuliert das Ziel, Nigeria zu einer weltweit führenden KI-Nation
    zu machen, und stützt sich auf fünf Säulen: (1) Aufbau einer KI-Grundinfrastruktur einschließlich
    Hochleistungsrechnen, (2) Aufbau und Erhalt eines KI-Ökosystems von Weltrang, (3) Beschleunigung der
    KI-Einführung und sektoralen Transformation, (4) Gewährleistung verantwortlicher und ethischer KI-Entwicklung
    und -Anwendung, (5) Entwicklung eines belastbaren KI-Governance-Rahmens. Sie schlägt die Einrichtung
    einer AI Ethics Expert Group (AIEEG) und eines "AI Governance Regulatory Body" vor, ohne dafür einen
    Gesetzentwurf vorzulegen. Adressaten sind Ministerien, Behörden und die Privatwirtschaft; Sanktionen
    sieht sie nicht vor.

    '
  inkrafttreten:
    datum: 2025-09-19
    verifiziert: true
    quelle: https://ncair.nitda.gov.ng/wp-content/uploads/2025/09/National-Artificial-Intelligence-Strategy-19092025.pdf
  anwendungsdaten:
  - datum: 2029-12-31
    was_gilt: Ende des in der Strategie genannten Umsetzungszeitraums von fünf Jahren (2025-2029)
    verifiziert: true
    quelle: https://ncair.nitda.gov.ng/wp-content/uploads/2025/09/National-Artificial-Intelligence-Strategy-19092025.pdf
  themenachsen:
  - governance
  - grundrechte
  - datenschutz
  - arbeit
  - marktzugang
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Fünf Säulen: Grundinfrastruktur (HPC, Rechenkapazität); Ökosystem; Einführung und sektorale Transformation;
    verantwortliche und ethische Entwicklung; Governance-Rahmen. Dazu drei übergreifende Ziele: Wirtschaftswachstum
    und Wettbewerbsfähigkeit, soziale Entwicklung und Teilhabe, technologischer Fortschritt und Führungsrolle.'
  - 'INSTITUTIONELLES: Vorgeschlagen werden eine AI Ethics Expert Group (AIEEG) mit unabhängiger Beratungsfunktion
    und ein ''AI Governance Regulatory Body'', das ''clear guidance'' gibt, ethische Standards durchsetzt
    und verantwortliche KI-Entwicklung fördert. Die Strategie enthält KEINEN Gesetzentwurf und keine Rechtsgrundlage
    für diese Stelle — das ist die Lücke, die der Senate Bill 731 schließen sollte.'
  - 'Bestehende Stellen: National Centre for Artificial Intelligence and Robotics (NCAIR) innerhalb der
    NITDA; NITDA führt die Initiative ''3 Million Technical Talent'' und verwaltet das Nigeria Artificial
    Intelligence Research Scheme (NAIRS).'
  - Abschnitt 1.4.1.1 (Ergebnisse unter Säule 4) fordert einen 'Legal framework that promotes responsible
    AI development and protects human rights and privacy'. Das ist die einzige Aussage zur Gesetzgebung
    — ein Ziel, kein Vorschlag.
  - 'REGULIERUNGSANSATZ: Die Strategie setzt auf ''Comprehensive National AI Principles that are publicly
    available, transparent'' STATT auf präskriptive Regulierung und benennt in Abschnitt 1.1.5.1 ausdrücklich
    drei Zielkonflikte: Innovation gegen Regulierung, Individuum gegen Staat (Datenschutz gegen staatlichen
    Zugriff zum Gemeinwohl), Transparenz gegen Systemverwundbarkeit. Diese offene Benennung des Konflikts
    ''Individuum gegen Staat'' ist bemerkenswert deutlich.'
  - 'Abschnitt 1.1.5.2 nennt vier Risikodimensionen: Genauigkeit (Fehler mit schädigenden Folgen, Zielkonflikt
    zwischen Verzerrung und Genauigkeit), Verzerrung (nicht repräsentative Systeme, gesellschaftliche
    Verzerrungen in Trainingsdaten), Transparenz (fehlende Erklärbarkeit, Zurechnungsprobleme), Governance
    (Datenverwaltung als kritische Kontrolle).'
  - 'Abschnitt 1.1.3.5 bindet die Strategie an den Nigeria Data Protection Act 2023: Datenminimierung,
    Zweckbindung, Rechte auf Berichtigung und Löschung, Transparenzanforderungen. Genannt werden ferner
    der Cybercrimes (Prohibition and Prevention) Act 2015 in der Fassung der Novelle 2024 und die nigerianischen
    Immaterialgüterrechte.'
  - 'URHEBERRECHT UND TRAININGSDATEN: Abschnitt 1.1.3.5 spricht nur allgemein davon, nigerianisches Immaterialgüterrecht
    auf ''inventions and creative works like algorithms and AI models'' anzuwenden. VERIFIZIERTER NEGATIVBEFUND:
    Die Strategie enthält KEINE Aussage zur Beschaffung, Lizenzierung oder urheberrechtlichen Zulässigkeit
    von Trainingsdaten. Die Trainingsfrage ist in Nigeria strategisch unbeantwortet.'
  - 'Zehn Leitprinzipien (Abschnitt 1.2.2): verantwortliches und ethisches Handeln, Teilhabe und geteilter
    Wohlstand, Innovation und Anpassung, Nachhaltigkeit, Zusammenarbeit, globale Führungsrolle, Transparenz
    und Rechenschaft, menschzentrierte Gestaltung, Risikomanagement und Resilienz, Datenschutz.'
  - 'Zielmarken: innerhalb von drei Jahren erhöhte private Investitionen in KI-Infrastruktur (1.4.2.1);
    innerhalb von fünf Jahren 70 % der jungen Erwerbsbevölkerung (16-35 Jahre) mit KI-Kompetenzen.'
