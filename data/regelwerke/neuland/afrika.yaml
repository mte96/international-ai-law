  regelungsschwerpunkte:
  - 'Office of the Artificial Intelligence Commissioner: Staatsamt (state office) mit Rechtsnachfolge
    (perpetual succession), klage- und verklagbar. Amtszeit fünf Jahre, einmal verlängerbar. Qualifikationsanforderung:
    Masterabschluss in einem einschlägigen Fach UND zehn Jahre Erfahrung in KI-Governance, Datenschutz
    oder Regulierungsaufsicht.'
  - 'Abberufungsgründe des Commissioners abschließend geregelt: Tod, Rücktritt, Freiheitsstrafe über sechs
    Monate, Verfassungsverstoß, grobes Fehlverhalten (gross misconduct), Amtsunfähigkeit, Inkompetenz,
    Insolvenz.'
  - 'Advisory Committee unter Vorsitz des Commissioners: Vertreter des ICT-Ministeriums, des Office of
    the Data Protection Commissioner, der NACOSTI (National Commission for Science, Technology and Innovation),
    zwei Sachverständige für Ethik und Menschenrechte, zwei geschlechterparitätisch benannte Vertreter
    des Council of Governors und ein Vertreter der Zivilgesellschaft. Vierteljährliche Sitzungen.'
  - 'VIER Risikoklassen — unacceptable risk (schwere Bedrohungen), high risk (kritische Sektoren wie Gesundheit
    und Finanzen), limited risk, minimal risk. ABWEICHUNG VON DER EU-KI-VO: Die Einstufung nimmt nicht
    das Gesetz in Anhängen vor, sondern der Commissioner. Das verlagert die eigentliche Regelungsentscheidung
    auf die Behörde und ist der wesentliche Strukturunterschied zum europäischen Modell.'
  - 'Pflichten bei Hochrisikosystemen: Risiko- UND Menschenrechtsfolgenabschätzung (''risk and human rights
    impact assessments before deployment''), Transparenz und Erklärbarkeit, Dokumentation, Einhaltung
    des Data Protection Act, Robustheit, sowie Einwilligung für die Nutzung von Abbild (likeness) und
    Stimme. Die ausdrückliche Menschenrechtsfolgenabschätzung geht über die EU-KI-VO hinaus, die sie nur
    für bestimmte öffentliche Stellen kennt (Art. 27 KI-VO).'
  - 'Transparenzpflichten: Offenlegung der Systemnatur, des Automatisierungsgrades und der Maßnahmen zur
    Minderung von Verzerrungen (bias mitigation). Recht der Betroffenen auf menschliches Eingreifen bei
    Entscheidungen, die sie betreffen.'
  - 'Regulierungs-Sandkästen: ''controlled environments created by the Artificial Intelligence Commissioner
    for testing Artificial Intelligence systems under regulatory supervision''.'
  - Ethikleitlinien des Commissioners zu Verzerrung, Diskriminierung, Privatsphäre, menschlicher Aufsicht,
    ökologischer Nachhaltigkeit, gleichem Zugang und der Verhinderung des Missbrauchs schädlicher synthetischer
    Medien.
  - 'ARBEITSRECHTLICHE VORSCHRIFT, in vergleichender Hinsicht ungewöhnlich: Anbieter müssen Belegschaftsfolgenabschätzungen
    (workforce impact assessments) durchführen und Umschulungsprogramme auflegen, wo KI Beschäftigung
    berührt; der Commissioner entwickelt mit den zuständigen Stellen Übergangsleitlinien. Kaum eine andere
    Rechtsordnung verknüpft KI-Marktzugang mit einer Umschulungspflicht des Anbieters.'
  - 'Straftatbestände und Sanktionen: bis 5 Mio. KES Geldstrafe oder bis zwei Jahre Freiheitsstrafe oder
    beides für (a) Einsatz von Systemen mit unannehmbarem oder hohem Risiko ohne die vorgeschriebenen
    Folgenabschätzungen, (b) Behinderung des Commissioners, (c) Verbreitung nicht einvernehmlicher synthetischer
    Medien (non-consensual synthetic media). Geringere Verstöße: bis 1 Mio. KES oder sechs Monate. Direktoren
    haften persönlich, wenn sie vom Verstoß wussten und die gebotene Sorgfalt unterließen.'
  - 'Verordnungsermächtigung des Cabinet Secretary: Kriterien der Risikoeinstufung, Verfahren der Folgenabschätzung,
    Bedingungen der Sandkästen, Ethikleitlinien, Datenverwaltung, Durchsetzung, Rechtsbehelfe, Gebühren
    und Verfahren der Einwilligung bei synthetischen Medien.'
  - 'Überprüfungsklausel: Alle drei Jahre überprüft der Cabinet Secretary das Gesetz, konsultiert die
    Beteiligten, bewertet neue Risiken und berichtet dem Parlament binnen sechs Monaten mit Änderungsvorschlägen.'
