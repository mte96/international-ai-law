- id: achpr-resolution-473
  jurisdiktion: africa
  kurztitel: ACHPR-Resolution 473 zu KI
  offizieller_titel: 'Resolution on the need to undertake a Study on human and peoples'' rights and artificial
    intelligence, robotics and other new and emerging technologies — ACHPR/Res.473 (Bezeichnung NICHT
    verifiziert)

    '
  fundstelle: Afrikanische Kommission für Menschenrechte und Rechte der Völker (ACHPR) — Fundstelle nicht
    verifiziert
