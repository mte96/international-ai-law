- id: ng-online-harm-protection-bill
  jurisdiktion: ng
  kurztitel: Online Harm Protection Bill (Nigeria)
  offizieller_titel: Online Harm Protection (OHP) Bill
  fundstelle: 'Vorbereitet von der National Information Technology Development Agency (NITDA) gemeinsam
    mit Advocacy for Policy and Innovation (API). Weißbuch Dezember 2024; Beratungsworkshop über den Entwurf
    Juli 2025.

    '
  status: entwurf
  status_detail: 'Entwurfsstadium mit laufender Beteiligung mehrerer Interessengruppen. Der ICT-Ausschuss
    des Repräsentantenhauses hat zugesagt, die erste Lesung zu beschleunigen; ein Lesungstermin ist nicht
    belegt.

    '
  kurzbeschreibung: 'Der Entwurf zielt auf digitale Schäden, die das geltende nigerianische Recht nicht
    erfasst: "online harms, misinformation, surveillance capitalism, and algorithmic bias". Er soll vier
    Einrichtungen schaffen — ein Online Harm Protection Center, einen Multi-Stakeholder Council, ein Redress
    Panel für Nutzerbeschwerden und ein Independent Oversight Forum. Für KI ist er wegen der ausdrücklichen
    Nennung algorithmischer Verzerrung (algorithmic bias) als Regelungsgegenstand einschlägig.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://nitda.gov.ng/nigeria-advances-citizen-led-digital-governance-with-online-harm-protection-bill/9037/
  themenachsen:
  - content
  - grundrechte
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - 'Regelungsgegenstände ausdrücklich: Online-Schäden, Desinformation, Überwachungskapitalismus (surveillance
    capitalism) und ALGORITHMISCHE VERZERRUNG. Die Benennung des Überwachungskapitalismus als Regelungsgegenstand
    in einem Gesetzentwurf ist rechtsvergleichend ungewöhnlich.'
  - 'Vier vorgeschlagene Einrichtungen: Online Harm Protection Center, Multi-Stakeholder Council, Redress
    Panel (Nutzerbeschwerden), Independent Oversight Forum.'
  - 'Verfahrensgeschichte: Weißbuch Dezember 2024; Workshop über den Entwurf Juli 2025; Zusage des House
    Committee on ICT, die erste Lesung zu beschleunigen.'
  dokumente:
