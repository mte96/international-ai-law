- id: ke-copyright-act-cap130
  jurisdiktion: ke
  kurztitel: Copyright Act (Kenia, Cap. 130)
  offizieller_titel: The Copyright Act, Cap. 130 (Act No. 12 of 2001, in der Fassung u.a. der Copyright
    (Amendment) Act 2022)
  fundstelle: 'Cap. 130 der Laws of Kenya. Ausgefertigt am 31.12.2001, in Kraft am 01.02.2003.

    '
  verfahrensnummer: Act No. 12 of 2001 (Cap. 130)
  status: anwendbar
  status_detail: 'In Kraft seit dem 01.02.2003, mehrfach geändert (u.a. 2019 und 2022). ZENTRALER BEFUND
    FÜR DIE TRAININGSFRAGE: Das kenianische Urheberrecht enthält KEINE Schranke für Text and Data Mining,
    computergestützte Analyse oder KI-Training. Wer in Kenia urheberrechtlich geschützte Werke zu Trainingszwecken
    vervielfältigt, kann sich auf keine ausdrückliche Ausnahme berufen.

    '
  kurzbeschreibung: 'Das kenianische Urheberrechtsgesetz schützt nach s. 22 Abs. 1 literarische, musikalische,
    künstlerische und dramatische Werke, audiovisuelle Werke, Tonaufnahmen und Sendungen. Es enthält —
    anders als das nigerianische und die meisten kontinentaleuropäischen Gesetze — eine ausdrückliche
    Regelung der Urheberschaft an computererzeugten Werken: Urheber ist nach s. 2 ''the person by whom
    the arrangements necessary for the creation of the work were undertaken''. Damit folgt Kenia dem britischen
    Modell (s. 9(3) CDPA 1988) und weist die Urheberschaft demjenigen zu, der die für die Werkschöpfung
    erforderlichen Vorkehrungen getroffen hat — nicht dem System.

    '
  inkrafttreten:
    datum: 2003-02-01
    verifiziert: true
    quelle: https://new.kenyalaw.org/akn/ke/act/2001/12/eng@2022-12-31
  themenachsen:
  - urheberrecht
  - content
  - vertrag
  regelungsschwerpunkte:
  - 's. 2 (Definition ''author''): Für ein literarisches, dramatisches, musikalisches oder künstlerisches
    Werk oder ein Computerprogramm, das COMPUTERERZEUGT ist (computer generated), ist Urheber ''the person
    by whom the arrangements necessary for the creation of the work were undertaken''. DAS IST DIE FÜR
    KI-ERZEUGNISSE EINSCHLÄGIGE NORM: Kenia hat — anders als die meisten Rechtsordnungen — die Urheberschaft
    an computererzeugten Werken ausdrücklich kodifiziert, und zwar nach britischem Vorbild. Sie weist
    das Recht dem Veranlasser zu, nicht dem System und nicht dem Nutzer als solchem.'
  - 's. 22 Abs. 1: schutzfähige Werkarten — literarische, musikalische, künstlerische, dramatische Werke,
    audiovisuelle Werke, Tonaufnahmen, Sendungen.'
  - 's. 23 Abs. 2: Schutzdauer. Eine gesonderte, verkürzte Schutzfrist für computererzeugte Werke (wie
    sie das Vereinigte Königreich mit 50 Jahren ab Herstellung kennt) sieht das kenianische Gesetz NICHT
    vor; computererzeugte Werke fallen unter die allgemeinen Fristen.'
  - 's. 26A: Sondervorschrift für Computerprogramme — zulässig sind Vervielfältigungen zur Fehlerkorrektur,
    Sicherungskopien, Eignungsprüfung und lizenzvertraglich gestattete Nutzungen. Diese Vorschrift betrifft
    Software, NICHT das Training von Modellen an fremden Werken.'
  - 'VERIFIZIERTER NEGATIVBEFUND: Das Gesetz enthält keine Vorschrift, die Text and Data Mining, computergestützte
    Analyse oder KI-Training erlaubt. Die Ausnahmen stehen im Second Schedule und in s. 26; eine TDM-Schranke
    ist dort nicht enthalten. Kenia unterscheidet sich damit von Singapur, Japan und dem Vereinigten Königreich
    (Forschungs-TDM) und steht näher an den Rechtsordnungen, die die Frage den Gerichten überlassen.'
  dokumente:
  - datum: 2001-12-31
    typ: konsolidiert
    titel: The Copyright Act, Cap. 130 (konsolidierte Fassung, Stand 31.12.2022)
    url: https://new.kenyalaw.org/akn/ke/act/2001/12/eng@2022-12-31
    sprache: en
    urheber: National Council for Law Reporting (Kenya Law)
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung. Grundlage der Aussagen zu s. 2 (computer generated works) und
      zum Fehlen einer TDM-Schranke.
  offene_punkte:
  - Der Second Schedule (Ausnahmen und Beschränkungen) wurde nicht Nummer für Nummer ausgewertet; der
    abgerufene Text war an dieser Stelle abgeschnitten. Die Aussage 'keine TDM-Schranke' beruht auf der
    ausdrücklichen Feststellung im abgerufenen Volltext, sollte aber am vollständigen Second Schedule
    nachgeprüft werden.
  - Das Kenya Copyright Board (KECOBO) hat nach dem Erreichbaren keine Stellungnahme oder Studie zu KI
    und Urheberrecht veröffentlicht; die Behördenseite copyright.go.ke gab keine Dokumentenliste aus.
  - Ob die Copyright (Amendment) Acts 2019 und 2022 an den hier einschlägigen Vorschriften etwas geändert
    haben, wurde nicht gesondert geprüft.
