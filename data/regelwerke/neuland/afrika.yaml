- id: ng-it-clearance-2026
  jurisdiktion: ng
  kurztitel: IT-Projektfreigabe für Bundesbehörden 2026
  offizieller_titel: 'Guidelines for Clearance of Information Technology Projects by Federal Public Institutions
    in Nigeria, 2026

    '
  fundstelle: 'Erlassen von der NITDA gemeinsam mit dem Bureau for Public Procurement und dem Office of
    the Auditor-General of the Federation am 10.04.2026. Rechtsgrundlagen: s. 6 NITDA Act 2007, s. 6 Bureau
    of Public Procurement Act 2007, s. 85 der Verfassung von 1999 (i.d.F. der Änderungen).

    '
  status: anwendbar
  status_detail: 'Vom 10.04.2026. Der praktische Durchsetzungshebel für alle übrigen NITDA-Leitlinien
    im öffentlichen Sektor: Ohne Freigabe kein IT-Projekt einer Bundesbehörde — und damit auch kein KI-Projekt.

    '
  kurzbeschreibung: 'Die Leitlinie unterwirft alle IT-Projekte von Bundesbehörden (Entwicklung, Einführung,
    Erweiterung oder Außerbetriebnahme von Systemen, Anwendungen, Infrastruktur und Diensten) einer Freigabepflicht
    mit drei Schwellen: Tier 1 ab 100 Mio. NGN mit Qualitätssicherung durch eine von NITDA lizenzierte
    Compliance Assurance Firm; Tier 2 von 10 Mio. bis 99.999.999 NGN mit Qualitätssicherung durch NITDA
    selbst; Tier 3 unter 9.999.999 NGN freigabefrei. NITDA entscheidet binnen zehn Arbeitstagen.

    '
  inkrafttreten:
    datum: 2026-04-10
    verifiziert: true
    quelle: https://nitda.gov.ng/wp-content/uploads/2026/05/Guidelines_for_Clearance_of_Information_Technology_Projects_by_FPIs_2026_signed.pdf
  themenachsen:
  - sektor-oeffentlich
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 'Drei Schwellen: Tier 1 ab 100.000.000 NGN (Qualitätssicherung durch lizenzierte Compliance Assurance
    Firm); Tier 2 von 10.000.000 bis 99.999.999 NGN (Qualitätssicherung durch NITDA); Tier 3 unter 9.999.999
    NGN (freigabefrei).'
  - 'Verfahren: Einschaltung einer NITDA-lizenzierten Compliance Assurance Firm; Einreichung über das
    IT Project Clearance Portal; Entscheidung der NITDA binnen zehn Arbeitstagen; Rückfragen mit drei
    bis fünf Tagen Antwortfrist; bei Tier 1 Abschlussbericht der Prüffirma binnen sieben Tagen.'
  - 'VERIFIZIERTER NEGATIVBEFUND: Die Leitlinie erwähnt künstliche Intelligenz, maschinelles Lernen, Algorithmen,
    aufkommende Technologien und automatisierte Systeme mit KEINEM Wort. Sie erfasst KI-Projekte des Bundes
    also nur mittelbar als IT-Projekte — eine KI-spezifische Prüfung des Staates an seinen eigenen Systemen
    findet in Nigeria nicht statt.'
  dokumente:
  - datum: 2026-04-10
    typ: norm
    titel: Guidelines for Clearance of Information Technology Projects by Federal Public Institutions
      in Nigeria 2026
    url: https://nitda.gov.ng/wp-content/uploads/2026/05/Guidelines_for_Clearance_of_Information_Technology_Projects_by_FPIs_2026_signed.pdf
    sprache: en
    urheber: NITDA, Bureau for Public Procurement, Office of the Auditor-General of the Federation
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext. Grundlage der Schwellenwerte, des Verfahrens und des
      Negativbefunds zur KI.
  - datum: 2026-05-01
    typ: norm
    titel: Guideline for Licensing IT Projects Clearance Compliance Assurance Firms
    url: https://nitda.gov.ng/wp-content/uploads/2026/05/Guideline-for-Licensing-IT-Projects-Clearance-Compliance-Assurance-Firms_Signed.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Lizenzierung der Prüffirmen, die die Qualitätssicherung für Tier-1-Projekte übernehmen; Link
      geprüft, Inhalt nicht ausgewertet.
  offene_punkte:
  - Ob NITDA für KI-Projekte gesonderte Prüfkriterien anwendet, ist der Leitlinie nicht zu entnehmen und
    wäre bei der Behörde zu erfragen.
