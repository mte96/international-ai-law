- id: ng-cloud-guideline-2026
  jurisdiktion: ng
  kurztitel: National Guideline for Cloud Computing 2026
  offizieller_titel: National Guideline for Cloud Computing in Nigeria, 2026
  fundstelle: 'Erlassen von der NITDA auf Grundlage von s. 6 des NITDA Act 2007 (ausgeübt nach s. 32).
    Genehmigt am 04.08.2026, wirksam ab dem 01.01.2027.

    '
  status: verabschiedet
  status_detail: 'Erlassen, anwendbar ab dem 01.01.2027. Regelt die Datenhaltung für KI-Arbeitslasten
    mittelbar über eine vierstufige Datenklassifikation mit Lokalisierungspflichten.

    '
  kurzbeschreibung: 'Die Leitlinie verpflichtet Bundesbehörden, Cloud-Diensteanbieter und Systemintegratoren;
    Bundesstaaten und Kommunen sind zur Übernahme aufgerufen. Sie gilt ferner für regulierte Sektoren
    und für Stellen, die national bedeutsame Daten verarbeiten, sowie für Auftragnehmer und Partner von
    Bundesbehörden. Sie ordnet ein "Cloud First"-Prinzip für Bundesbehörden mit dokumentierten Ausnahmen
    an, kanalisiert die Beschaffung ausschließlich über NITDAs Digital Regulatory Platform und schreibt
    Dienstgütevereinbarungen mit Verfügbarkeits-, Notfallwiederherstellungs- und Ausstiegsregelungen vor
    (höchstens 90 Tage für die Datenrückführung). Einheimische Anbieter genießen Vorrang; ausländische
    Anbieter brauchen eine schriftliche Feststellung der NITDA, dass keine lokale Kapazität besteht, oder
    den Status eines strategischen Investors.

    '
  inkrafttreten:
    datum: 2027-01-01
    verifiziert: true
    quelle: https://nitda.gov.ng/wp-content/uploads/2026/08/NATIONAL-GUIDELINE-FOR-CLOUD-COMPUTING-IN-NIGERIA-2026_Final.pdf
  anwendungsdaten:
  - datum: 2027-01-01
    was_gilt: Cloud-First-Pflicht, Beschaffung über die Digital Regulatory Platform und die Datenlokalisierungsstufen
      werden wirksam
    verifiziert: true
    quelle: https://nitda.gov.ng/wp-content/uploads/2026/08/NATIONAL-GUIDELINE-FOR-CLOUD-COMPUTING-IN-NIGERIA-2026_Final.pdf
  themenachsen:
  - marktzugang
  - datenschutz
  - sicherheit-export
  - sektor-oeffentlich
  - wettbewerb
  regelungsschwerpunkte:
  - 'Vierstufige Datenklassifikation mit Lokalisierungsfolgen: Stufe 4 (Classified) nur On-Premises in
    Nigeria; Stufe 3 (Highly Sensitive) private/hybride Cloud in Nigeria, grenzüberschreitende Übermittlung
    nur bei NDPA-Konformität; Stufe 2 (Sensitive) vorrangig in Nigeria, grenzüberschreitend nur mit NITDA-Genehmigung
    und angemessenem Schutz; Stufe 1 (Open) öffentliche Cloud nach nationalen/internationalen Standards.
    Finanzdaten sind ''primarily hosted, processed and stored within the territorial boundaries of the
    Federal Republic of Nigeria''.'
  - 'KI-BEZUG, ausdrücklich, aber ohne eigene Anforderungen: Die Erläuterung nennt ''Artificial Intelligence
    Infrastructure Providers, and other Digital Infrastructure Providers operating within Nigeria'' als
    Adressaten und formuliert das Ziel, Nigeria als ''leading regional hub for cloud computing, sovereign
    digital infrastructure, artificial intelligence, and data-driven innovation'' zu positionieren. VERIFIZIERTER
    NEGATIVBEFUND: Die Leitlinie enthält KEINE eigenen Anforderungen an KI-Arbeitslasten, GPU, Trainingsdatensätze
    oder KI-spezifische Sicherheitskontrollen — diese stehen im NDIAF.'
  - Cloud First für Bundesbehörden mit dokumentierten Ausnahmen; Beschaffung ausschließlich über die Digital
    Regulatory Platform der NITDA.
  - Dienstgütevereinbarungen zwingend, mit Verfügbarkeit, Notfallwiederherstellung und Ausstiegsklausel;
    höchstens 90 Tage für die Datenrückführung.
  - 'INDUSTRIEPOLITISCHE MARKTZUGANGSSCHRANKE: Vorrang einheimischer Cloud-Anbieter; ausländische Anbieter
    benötigen eine schriftliche Feststellung der NITDA über fehlende lokale Kapazität oder den Status
    eines strategischen Investors. Das ist eine handelsrechtlich heikle Vorschrift — vgl. Art. 22 AfCFTA-Digitalhandelsprotokoll
    (Grenzen für Datenlokalisierung).'
  dokumente:
  - datum: 2026-08-04
    typ: norm
    titel: National Guideline for Cloud Computing in Nigeria 2026 (amtliche Endfassung)
    url: https://nitda.gov.ng/wp-content/uploads/2026/08/NATIONAL-GUIDELINE-FOR-CLOUD-COMPUTING-IN-NIGERIA-2026_Final.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext. Grundlage der Daten und der Zitate.
  - datum: 2026-08-04
    typ: norm
    titel: National Cloud Technical Guideline 2026
    url: https://nitda.gov.ng/wp-content/uploads/2026/08/NATIONAL-CLOUD-TECHNICAL-GUIDELINE-2026_-Final.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Technische Begleitleitlinie; Link geprüft, Inhalt nicht ausgewertet.
  - datum: 2025-01-01
    typ: bericht
    titel: NITDA'26 Cloud Investment Strategy 2025
    url: https://nitda.gov.ng/wp-content/uploads/2026/08/NITDA26-CLOUD-INV-STRATEGY-2025-FN-1.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Investitionsstrategie; Link geprüft, Inhalt nicht ausgewertet.
  offene_punkte:
  - Vereinbarkeit der Bevorzugung einheimischer Anbieter und der Datenlokalisierungsstufen mit Art. 20
    und 22 des AfCFTA-Digitalhandelsprotokolls ist ungeklärt — das Protokoll ist allerdings noch nicht
    in Kraft.
  - Der Inhalt der National Cloud Technical Guideline 2026 wurde nicht ausgewertet.
  monitoring_quellen:
  - https://nitda.gov.ng/regulations/
  bezug_regelwerke:
  - ng-ndiaf-2026
  - ng-nitda-act-2007
  - au-afcfta-digital-trade-protocol
