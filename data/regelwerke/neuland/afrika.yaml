- id: ng-ai-commission-bill-731
  jurisdiktion: ng
  kurztitel: Entwurf einer National Artificial Intelligence Commission (Senate Bill 731)
  offizieller_titel: 'Bill for an Act to Establish the National Artificial Intelligence Commission (genaue
    amtliche Bezeichnung nicht verifiziert)

    '
  fundstelle: Nationalversammlung Nigeria, Senat, Senate Bill 731 (nicht verifiziert)
  verfahrensnummer: SB 731 (nicht verifiziert)
  status: entwurf
  status_detail: 'NICHT VERIFIZIERBAR — DAS IST DAS WICHTIGSTE NEGATIVERGEBNIS DIESER DATEI FÜR NIGERIA.
    Ließ sich weder der Text noch die Existenz noch der Verfahrensstand des Senate Bill 731 an einer amtlichen
    Quelle belegen. Die Bill-Datenbank der Nationalversammlung (nass.gov.ng/bills) war über robots.txt
    gesperrt, der Bill-Tracker des Policy and Legal Advocacy Centre (placng.org) lieferte 404. Gegen die
    Annahme eines fortgeschrittenen Verfahrens sprechen zwei belastbare Negativbefunde: (1) Der amtliche
    NAIS-Zwischenbericht des NCAIR vom 29.04.2026 nennt bei den regulatorischen Entwicklungen KEIN AI
    Bill, KEINEN AI Act und KEINE National Artificial Intelligence Commission. (2) Die Volltextsuche auf
    nitda.gov.ng nach "AI bill" und "artificial intelligence" fördert bis August 2026 ausschließlich Presseerklärungen
    zutage, keine Gesetzgebungsmeldung. Wahrscheinlicher ist, dass die KI-Regulierung in Nigeria inzwischen
    über das National Digital Economy and e-Governance Bill 2025 läuft — dieses enthält ausdrücklich Vorschriften
    zu "emerging technologies such as Artificial Intelligence (AI)" und hat am 10.11.2025 eine öffentliche
    Anhörung durchlaufen.

    '
  kurzbeschreibung: 'Nach der (unverifizierten) Ausgangsangabe eines früheren Breitenscreenings sollte
    der Entwurf eine bundesweite National Artificial Intelligence Commission errichten, KI-Anbieter einer
    Registrierungspflicht unterwerfen, Verhaltensstandards setzen und der Kommission Durchsetzungsbefugnisse
    geben. Wäre er ergangen, wäre er das erste umfassende KI-Gesetz Afrikas gewesen. Es liegt KEIN amtlicher
    Beleg für Inhalt, Wortlaut oder Sanktionen vor; sämtliche inhaltlichen Angaben sind daher unverifiziert
    und dürfen nicht weiterverwendet werden, ohne am Text der Nationalversammlung geprüft zu werden.

    '
