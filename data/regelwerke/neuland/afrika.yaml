  offizieller_titel: ODPC — Guidance Note on Biometric Data
  fundstelle: Office of the Data Protection Commissioner, veröffentlicht November 2025
  status: softlaw
  status_detail: 'Verwaltungsleitlinie der kenianischen Datenschutzaufsicht ohne unmittelbare Bindungswirkung,
    aber maßgeblich für die Praxis der Behörde. FÜR KI DAS WICHTIGSTE KENIANISCHE SOFT-LAW-DOKUMENT: Sie
    behandelt ausdrücklich Gesichtserkennung und das Recht gegen automatisierte Entscheidungen.

    '
  kurzbeschreibung: 'Die Leitlinie legt aus, unter welchen Voraussetzungen biometrische Daten in Kenia
    verarbeitet werden dürfen. Sie stützt sich auf den Data Protection Act 2019, die General Regulations
    2021, Art. 31 der Verfassung, den Computer Misuse and Cybercrimes Act 2018 und den Children Act 2022.
    Biometrische Daten definiert sie als ''personal data resulting from specific technical processing
    based on physical, physiological or behavioral characterization'' und erfasst darunter Fingerabdruck,
    Gesichtsgeometrie, Netzhaut- und Irisscan, Stimmerkennung und DNA-Analyse. Verantwortliche brauchen
    eine Rechtsgrundlage nach s. 30 UND die Zusatzvoraussetzungen für sensible Daten nach s. 45; das berechtigte
    Interesse trägt biometrische Verarbeitung NICHT allein. Eine Datenschutz-Folgenabschätzung ist bei
    jeder biometrischen Verarbeitung Pflicht und mindestens sechzig Tage vorher einzureichen.

    '
  inkrafttreten:
    datum: 2025-11-01
    verifiziert: false
    quelle: https://www.odpc.go.ke/wp-content/uploads/2025/11/ODPC-–-Guidance-Note-on-Biometric-Data.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'GESICHTSERKENNUNG ausdrücklich adressiert, im Wortlaut: ''facial recognition technology may process
    or store facial images, posing varying levels of risk... the technology''s potential to identify individuals
    in public without their knowledge or consent and track their locations, movements, and companions.''
    Damit hat die kenianische Aufsicht die Risiken der Gesichtserkennung im öffentlichen Raum amtlich
    benannt, ohne sie zu verbieten.'
  - 'AUTOMATISIERTE ENTSCHEIDUNGEN, im Wortlaut: ''Data subjects have the right not to be subjected to
    an automated decision when it is based on automated processing that produces an adverse legal effect
    or significantly affects the individual.'' Das ist die behördliche Auslegung von s. 35 des Gesetzes
    im biometrischen Kontext.'
  - 'MENSCHLICHES EINGREIFEN konkretisiert: Verlangt wird ''human intervention'' durch ''someone who has
    the authority and competence to change the decision''. Diese Formel — Befugnis UND Fachkunde, die
    Entscheidung zu ändern — ist der Maßstab, an dem sich eine bloße Alibi-Kontrolle messen lassen muss,
    und in dieser Klarheit in vielen Rechtsordnungen nicht amtlich formuliert.'
  - 'Rechtsgrundlagen: s. 30 (allgemein) UND s. 45 (sensible Daten) kumulativ. Zulässig sind ausdrückliche
    informierte Einwilligung, Vertragserfüllung, gesetzliche Pflicht; berechtigtes Interesse nur nachrangig,
    nicht als alleinige Grundlage für biometrische Daten.'
  - 'DPIA-Pflicht: ''Regulation 49(1)(c) of the General Regulations, 2021, identifies processing of biometric
    data to be a high-risk processing operation''; Einreichung mindestens sechzig Tage vor Beginn jeder
    biometrischen Verarbeitung.'
  - 'BEFUND: Die Begriffe ''artificial intelligence'' und ''machine learning'' kommen in der Leitlinie
    NICHT vor. Kenia reguliert biometrische KI über das Datenschutzrecht, ohne sie KI zu nennen.'
