- id: ng-nitda-act-2007
  jurisdiktion: ng
  kurztitel: NITDA Act 2007
  offizieller_titel: 'National Information Technology Development Agency Act, 2007 (Ausgabe 2007-2019)

    '
  fundstelle: Bundesgesetz 2007; von der Behörde veröffentlichte Ausgabe 2007-2019
  status: anwendbar
  status_detail: 'In Kraft. s. 6 des Gesetzes ist die Ermächtigungsgrundlage, auf die NITDA ihre Regelungstätigkeit
    stützt — sowohl die NDPR 2019 als auch den Code of Practice 2022. Für die nigerianische KI-Regulierung
    ist das die entscheidende Norm: Solange kein KI-Gesetz besteht, ist s. 6 NITDA Act der Weg, auf dem
    verbindliche KI-Vorgaben ohne Parlament ergehen könnten.

    '
  kurzbeschreibung: 'Das Gesetz errichtet die National Information Technology Development Agency und ermächtigt
    sie, "a framework for the planning, research, development, standardization, application, coordination,
    monitoring, evaluation and regulation of Information Technology practices in Nigeria by developing
    standards, guidelines and regulations" zu schaffen. Diese weit gefasste Standardsetzungs- und Regulierungsbefugnis
    trägt die gesamte nigerianische Behördenregulierung im digitalen Bereich.

    '
  inkrafttreten:
    datum: 2007-01-01
    verifiziert: false
    quelle: https://nitda.gov.ng/wp-content/uploads/2020/11/NITDA-ACT-2007-2019-Edition1.pdf
  themenachsen:
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 's. 6: Ermächtigung, Standards, Leitlinien und Regelungen für IT-Praxis in Nigeria zu entwickeln.
    Diese Norm trägt NDPR 2019 und Code of Practice 2022 und wäre die Grundlage eines KI-Kodex ohne Gesetzgebung.'
  - Die Behörde selbst verfolgte nach eigener Mitteilung vom 04.03.2021 das Ziel, ihren Act 2007 'mit
    den Zielen der digitalen Wirtschaft in Einklang zu bringen' — ein Novellierungsvorhaben, dessen Stand
    nicht belegt ist.
  dokumente:
