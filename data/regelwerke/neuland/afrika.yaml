- id: ng-ndpr-2019
  jurisdiktion: ng
  kurztitel: Nigeria Data Protection Regulation 2019 (NDPR)
  offizieller_titel: Nigeria Data Protection Regulation, 2019
  fundstelle: 'Verwaltungsvorschrift der National Information Technology Development Agency (NITDA), erlassen
    auf Grundlage des NITDA Act 2007, 2019. Ergänzt durch das NDPR Implementation Framework 2021.

    '
  status: teilanwendbar
  status_detail: 'Vorgängerregelung des Nigeria Data Protection Act 2023. Sie gilt fort, soweit sie dem
    Gesetz nicht widerspricht; ihr praktischer Anwendungs- bereich ist seit 2023 stark geschrumpft. Sie
    bleibt als Auslegungsmaterial und für Altfälle bedeutsam und ist der historische Grund dafür, dass
    in Nigeria die IT-Behörde und nicht eine originäre Datenschutzbehörde den Datenschutz aufgebaut hat.

    '
  kurzbeschreibung: 'Die NDPR war von 2019 bis 2023 der maßgebliche nigerianische Datenschutzrahmen. Sie
    wurde von der NITDA als Behördenregelung erlassen — nicht als Parlamentsgesetz — und ist deshalb ein
    Beispiel für Regulierung durch Verwaltungsvorschrift, wie sie auch für KI im Gespräch ist. Das Implementation
    Framework 2021 konkretisiert die Pflichten, insbesondere die jährliche Audit-Einreichung durch lizenzierte
    Data Protection Compliance Organisations (DPCO).

    '
  inkrafttreten:
    datum: 2019-01-25
    verifiziert: false
    quelle: https://nitda.gov.ng/wp-content/uploads/2020/11/NigeriaDataProtectionRegulation11.pdf
  themenachsen:
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - Erlassen von der NITDA auf Grundlage des NITDA Act 2007 — Regulierung durch Behördenvorschrift statt
    durch Gesetz. Für die nigerianische KI-Debatte ist das der naheliegende Weg, falls das Gesetzgebungsverfahren
    stockt.
  - 'NDPR Implementation Framework 2021: Konkretisierung der Pflichten, insbesondere die Audit- und Berichtspflichten
    und das System der lizenzierten Data Protection Compliance Organisations (DPCO).'
  dokumente:
  - datum: 2019-01-25
    typ: norm
    titel: Nigeria Data Protection Regulation 2019 (amtlicher Volltext)
    url: https://nitda.gov.ng/wp-content/uploads/2020/11/NigeriaDataProtectionRegulation11.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtlicher Volltext auf der Seite der erlassenden Behörde; Link geprüft. Das Erlassdatum wurde
      nicht aus dem Dokument selbst verifiziert.
  - datum: 2021-01-01
    typ: leitlinie
    titel: NDPR Implementation Framework 2021
    url: https://nitda.gov.ng/wp-content/uploads/2021/01/NDPR-Implementation-Framework.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtliche Durchführungsleitlinie; Link geprüft.
  offene_punkte:
  - Das genaue Verhältnis von NDPR 2019 zum NDPA 2023 (Fortgeltung, teilweise Aufhebung) ist ohne den
    Gesetzestext nicht bestimmbar.
