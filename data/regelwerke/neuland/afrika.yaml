- id: ke-dp-general-regulations-2021
  jurisdiktion: ke
  kurztitel: Data Protection (General) Regulations 2021
  offizieller_titel: The Data Protection (General) Regulations, 2021
  fundstelle: Legal Notice unter dem Data Protection Act, No. 24 of 2019 (2021)
  status: anwendbar
  status_detail: 'In Kraft; sie konkretisieren die Betroffenenrechte, die Datenschutz-Folgenabschätzung
    und die Sicherheitsanforderungen. Für KI einschlägig vor allem Regulation 49, die biometrische Verarbeitung
    ausdrücklich als Hochrisikoverarbeitung einstuft und damit die DPIA-Pflicht auslöst.

    '
  kurzbeschreibung: 'Durchführungsverordnung zum Data Protection Act 2019. Sie regelt die Ausübung der
    Betroffenenrechte, die Anforderungen an Einwilligung, Direktwerbung, Auftragsverarbeitung, grenzüberschreitende
    Übermittlung und die Datenschutz-Folgenabschätzung. Regulation 49 Abs. 1 Buchst. c bestimmt die Verarbeitung
    biometrischer Daten als Hochrisikoverarbeitung (''Regulation 49(1)(c) of the General Regulations,
    2021, identifies processing of biometric data to be a high-risk processing operation'') — das ist
    die Norm, über die Gesichtserkennung und biometrische KI-Systeme in Kenia der behördlichen Vorabkontrolle
    unterfallen.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.odpc.go.ke/wp-content/uploads/2024/03/THE-DATA-PROTECTION-GENERAL-REGULATIONS-2021-1.pdf
  themenachsen:
