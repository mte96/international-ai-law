  offene_punkte:
  - 'ERSTE AUFGABE FÜR DEN NÄCHSTEN BEARBEITER: Existenz, amtliche Bezeichnung, Sponsor, Lesungsstand
    und Text des Senate Bill 731 an nass.gov.ng belegen. Der Zugang scheiterte hier ausschließlich an
