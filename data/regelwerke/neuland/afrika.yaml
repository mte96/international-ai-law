    typ: konsolidiert
    titel: NITDA Act 2007 (Ausgabe 2007-2019)
    url: https://nitda.gov.ng/wp-content/uploads/2020/11/NITDA-ACT-2007-2019-Edition1.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Von der Behörde selbst veröffentlichte Fassung; Link geprüft. Die vollständige amtliche Zitierweise
      (Act No. ... of 2007) ist der Behördenseite nicht zu entnehmen.
  - datum: 2021-03-04
