  regelungsschwerpunkte:
  - 'Regulation 49(1)(c): Verarbeitung biometrischer Daten ist Hochrisikoverarbeitung und löst die Pflicht
    zur Datenschutz-Folgenabschätzung nach s. 31 des Gesetzes aus. Verifiziert über die amtliche Auslegung
    der Aufsichtsbehörde in ihrer Guidance Note on Biometric Data (2025).'
  - Konkretisierung der Betroffenenrechte aus s. 26 ff. des Gesetzes, der Einwilligungsanforderungen und
    der Direktwerbung.
  - Anforderungen an die Datenschutz-Folgenabschätzung, die nach s. 31 des Gesetzes sechzig Tage vor Verarbeitungsbeginn
    einzureichen ist.
