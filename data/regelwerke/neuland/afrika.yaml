- id: ng-digital-economy-egovernance-bill-2025
  jurisdiktion: ng
  kurztitel: National Digital Economy and e-Governance Bill 2025
  offizieller_titel: National Digital Economy and e-Governance Bill, 2025
  fundstelle: 'Regierungsentwurf des Federal Ministry of Communications, Innovation and Digital Economy.
    Öffentliche Anhörung am 10.11.2025 im Nationalversammlungskomplex, Abuja, vor den gemeinsamen Ausschüssen
    von Senat und Repräsentantenhaus für IKT und Cybersicherheit sowie für Digitales und Informationstechnologie
    (Vorsitz: Sen. Shuaib Afolabi Salisu; Hon. Adedeji Stanley Olajide).

    '
  verfahrensnummer: National Digital Economy and e-Governance Bill, 2025
  status: verfahren
  status_detail: 'Im Verfahren. Der Entwurf durchlief vor der Anhörung eine Beteiligungsrunde in allen
    36 Bundesstaaten und dem Bundesterritorium; die öffentliche Anhörung fand am 10.11.2025 statt. Ein
    Beschluss ist nicht belegt. NACH DEM BEFUND DIESER SITZUNG IST DAS DER TATSÄCHLICHE TRÄGER DER NIGERIANISCHEN
    KI-REGULIERUNG — nicht der Senate Bill 731: Das Ministerium beschreibt den Entwurf ausdrücklich als
    Rahmen, der "ethical, transparent, and risk-based governance of emerging technologies such as Artificial
    Intelligence (AI)" gewährleistet.

    '
  kurzbeschreibung: 'Rahmengesetzentwurf für die digitale Transformation Nigerias. Er regelt die rechtliche
    Anerkennung elektronischer Kommunikation und elektronischer Aufzeichnungen (digitale Dokumente und
    Verträge), verpflichtet öffentliche Stellen zur Einführung digitaler Technologien und schafft einen
    risikobasierten Governance-Rahmen für aufkommende Technologien einschließlich künstlicher Intelligenz.
    Das Ministerium bezeichnet ihn als "first-of-its-kind on the continent". Adressaten sind öffentliche
    Stellen und, über das Regelungsrecht für aufkommende Technologien, auch private Anbieter. Sanktionen
    sind nicht belegt.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://fmcide.gov.ng/public-hearing-on-national-digital-economy-and-e-governance-bill-2025-holds-in-abuja/
