- id: ke-data-protection-act-2019
  jurisdiktion: ke
  kurztitel: Data Protection Act 2019 (Kenia)
  offizieller_titel: The Data Protection Act, No. 24 of 2019
  fundstelle: 'Act No. 24 of 2019. Ausgefertigt (assented) am 08.11.2019, in Kraft (commencement) am 25.11.2019.
    Langtitel: "AN ACT of Parliament to give effect to Article 31(c) and (d) of the Constitution; to establish
    the Office of the Data Protection Commissioner; to make provision for the regulation of the processing
    of personal data; to provide for the rights of data subjects and obligations of data controllers and
    processors; and for connected purposes".

    '
  verfahrensnummer: Act No. 24 of 2019
  status: anwendbar
  status_detail: 'In Kraft seit dem 25.11.2019. DAS IST DAS GESETZ, AN DEM KI-SACHVERHALTE IN KENIA HEUTE
    TATSÄCHLICH ENTSCHIEDEN WERDEN — nicht am KI-Entwurf. Die Aufsicht führt das Office of the Data Protection
    Commissioner (ODPC), das seit 2023 fortlaufend Determinations veröffentlicht.

    '
  kurzbeschreibung: 'Das kenianische Datenschutzgesetz gibt Art. 31 lit. c und d der Verfassung (Schutz
    der Privatsphäre) einfachgesetzlich Gestalt. Es errichtet das ODPC, regelt die Grundsätze der Verarbeitung
    (s. 25), die Rechte der Betroffenen (s. 26 ff.), die Datenschutz-Folgenabschätzung (s. 31) und — für
    KI zentral — in s. 35 ein Recht, keiner ausschließlich auf automatisierter Verarbeitung beruhenden
    Entscheidung unterworfen zu werden. Es bindet Verantwortliche und Auftragsverarbeiter, gleich ob öffentlich
    oder privat. Verwaltungsgeldbußen erreichen nach s. 63 höchstens 5 Mio. KES oder, bei Unternehmen,
    1 % des Jahresumsatzes des vorangegangenen Geschäftsjahres — je nachdem, welcher Betrag NIEDRIGER
    ist. Diese Deckelung nach unten ist ein wesentlicher Unterschied zur DSGVO und begrenzt die Abschreckungswirkung
    gegenüber Großunternehmen erheblich.

    '
  inkrafttreten:
    datum: 2019-11-25
    verifiziert: true
    quelle: https://www.odpc.go.ke/wp-content/uploads/2024/02/TheDataProtectionAct__No24of2019.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - sektor-oeffentlich
  - sektor-finanz
  - sektor-medizin
  regelungsschwerpunkte:
  - 's. 35 — DIE ZENTRALE KI-NORM KENIAS, im Wortlaut: ''(1) Every data subject has a right not to be
    subject to a decision based solely on automated processing, including profiling, which produces legal
    effects concerning or significantly affects the data subject.'' Abs. 2 nimmt aus: Erforderlichkeit
    für Vertragsschluss oder -durchführung, gesetzliche Ermächtigung mit geeigneten Schutzmaßnahmen, Einwilligung.'
  - 's. 35 Abs. 3 — DER PRAKTISCH WICHTIGSTE UNTERSCHIED ZU ART. 22 DSGVO: Auch WENN die Ausnahme greift,
    muss der Verantwortliche den Betroffenen ''as soon as reasonably practicable'' SCHRIFTLICH benachrichtigen,
    dass eine ausschließlich automatisierte Entscheidung ergangen ist; der Betroffene kann danach verlangen,
    dass die Entscheidung überdacht (reconsider) oder eine neue, nicht ausschließlich automatisierte Entscheidung
    getroffen wird. Art. 22 DSGVO kennt keine solche proaktive Mitteilungspflicht mit anschließendem Neubescheidungsanspruch.'
  - 's. 35 Abs. 4: Der Verantwortliche muss den Antrag binnen angemessener Frist prüfen, ihm nachkommen
    und den Betroffenen schriftlich über die ergriffenen Schritte UND das Ergebnis unterrichten. Abs.
    5 ermächtigt den Cabinet Secretary zu weiteren Schutzvorschriften — davon ist bis heute kein Gebrauch
    gemacht worden (siehe offene_punkte).'
  - 's. 25: Grundsätze — Rechtmäßigkeit, Fairness, Transparenz, Zweckbindung, Richtigkeit, angemessene
    Sicherheit.'
  - 's. 26: Rechte der Betroffenen — Information über die Verwendung, Auskunft, Widerspruch gegen die
    Verarbeitung ganz oder teilweise, Berichtigung und Löschung falscher oder irreführender Daten.'
  - 's. 31: Datenschutz-Folgenabschätzung bei hohem Risiko für Rechte und Freiheiten; Beschreibung der
    Verarbeitung, Erforderlichkeit und Verhältnismäßigkeit, Risiken, Abhilfemaßnahmen. Der Bericht ist
    SECHZIG TAGE VOR Beginn der Verarbeitung einzureichen — eine echte Vorabkontrolle, die die DSGVO so
    nicht kennt.'
  - 's. 33: Verarbeitung von Kinderdaten nur mit Einwilligung der Eltern/Sorgeberechtigten und mit Altersverifikationsmechanismen,
    die nach Technologie, Datenmenge und Schadenspotential auszugestalten sind.'
  - 's. 34: Einschränkung der Verarbeitung; s. 36: Widerspruchsrecht, das nur bei zwingendem berechtigtem
    Interesse überwunden werden kann; s. 37: kommerzielle Nutzung personenbezogener Daten nur mit ausdrücklicher
    Einwilligung oder gesetzlicher Ermächtigung mit Benachrichtigung; s. 38: Datenübertragbarkeit in maschinenlesbarem
    Format binnen dreißig Tagen.'
  - 's. 45: zulässige Gründe für die Verarbeitung sensibler Daten — für biometrische KI-Anwendungen die
    Eingangsnorm (zusammen mit s. 30).'
  - 's. 63: Verwaltungsgeldbußen höchstens 5 Mio. KES oder bei Unternehmen bis 1 % des Vorjahresumsatzes,
    ''whichever is lower''. Die Deckelung auf den NIEDRIGEREN Betrag ist ungewöhnlich und schwächt die
    Sanktion gegenüber umsatzstarken Unternehmen.'
