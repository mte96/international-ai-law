- id: au-afcfta-digital-trade-protocol
  jurisdiktion: africa
  kurztitel: AfCFTA-Digitalhandelsprotokoll
  offizieller_titel: 'Protocol to the Agreement Establishing the African Continental Free Trade Area on
    Digital Trade

    '
  fundstelle: 'Angenommen am 18.02.2024 von der Versammlung der Afrikanischen Union (37. ordentliche Sitzung,
    Addis Abeba). AU-Vertragssymbol 44963. Beruht auf Decision Assembly/AU/4(XXXII), 33. ordentliche Sitzung,
    Addis Abeba, Februar 2020, mit der die Verhandlungen mandatiert wurden.

    '
  verfahrensnummer: AU-Vertragssymbol 44963
  status: verabschiedet
  status_detail: 'Angenommen am 18.02.2024, NOCH NICHT IN KRAFT (Stand der amtlichen AU-Vertragsliste).
    Art. 47 verweist für das Inkrafttreten auf Art. 23 Abs. 2 und 4 des AfCFTA-Grundabkommens. Mehrere
    in dem Protokoll vorgesehene Anhänge — darunter der Anhang zu den fortgeschrittenen und aufkommenden
    Technologien (Art. 34) und der Anhang zu grenzüberschreitenden Datentransfers (Art. 20) — sind erst
    nach der Annahme zu erarbeiten und konnten nicht nachgewiesen werden. Ohne sie ist das Protokoll in
    seinen KI-relevanten Teilen nicht operabel.

    '
  kurzbeschreibung: 'Handelsvölkerrechtliches Protokoll zum afrikanischen Freihandelsabkommen mit 52 Artikeln
    in elf Teilen. Es regelt Marktzugang für digitale Produkte, Handelserleichterung (elektronische Vertrauensdienste,
    Signaturen, Verträge, Rechnungen, digitale Identitäten), Datenpolitik (grenzüberschreitende Datentransfers,
    Schutz personenbezogener Daten, Standort von Rechenanlagen, Dateninnovation), Vertrauen von Unternehmen
    und Verbrauchern (Quellcode, Cybersicherheit, Verbraucherschutz, Online-Sicherheit) sowie — als eigenen
    Teil VII — aufkommende Technologien. Adressaten sind die Vertragsstaaten; Sanktionen sind nicht vorgesehen,
    Streitigkeiten werden nach dem AfCFTA-Streitbeilegungsprotokoll ausgetragen (Art. 45).

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://au.int/en/treaties/protocol-agreement-establishing-african-continental-free-trade-area-digital-trade
  themenachsen:
  - marktzugang
  - datenschutz
  - governance
  - wettbewerb
  - vertrag
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Art. 34 (Emerging and Advanced Technologies) — die für KI zentrale Vorschrift. Die Vertragsstaaten
    verpflichten sich, Einführung und Regulierung aufkommender und fortgeschrittener Technologien zu erleichtern
    und Governance-Rahmen für deren ''ethical, trusted, safe, and responsible use'' zu entwickeln. Ein
    Anhang zu aufkommenden und fortgeschrittenen Technologien ist NACH der Annahme zu erarbeiten. BEFUND:
    Das Protokoll nennt künstliche Intelligenz nicht als eigenen Begriff, sondern erfasst sie unter ''emerging
    and advanced technologies''.'
  - 'Art. 20 (Cross-Border Data Transfers): Grundsatz der Freiheit grenzüberschreitender Datenübermittlung
    einschließlich personenbezogener Daten für Zwecke des digitalen Handels, mit Ausnahmen für legitime
    öffentliche Politikziele und wesentliche Sicherheitsinteressen, die weder willkürlich diskriminieren
    noch verdeckte Handelsbeschränkung sein dürfen. Konkretisierung durch einen noch zu erarbeitenden
    Anhang.'
  - 'Art. 21 (Protection of Personal Data): Pflicht jedes Vertragsstaats, einen Rahmen zum Schutz personenbezogener
    Daten der am digitalen Handel Beteiligten zu schaffen, Unternehmen zu Datenschutzkonzepten zu verpflichten,
    grenzüberschreitende Beschwerdemechanismen zu entwickeln und sich um die Einrichtung nationaler Datenschutzbehörden
    zu bemühen. Damit läuft das Protokoll neben der Malabo-Konvention — mit dem Unterschied, dass es auch
    Staaten erfasst, die Malabo nicht ratifiziert haben.'
  - 'Art. 22 (Location of Computing Facilities): Grenzen für Datenlokalisierungsauflagen — für KI-Infrastruktur
    und Rechenzentrumspolitik unmittelbar einschlägig.'
  - 'Art. 24 (Source Code): Verbot, die Übertragung von oder den Zugang zu Quellcode einer Software als
    Bedingung für Einfuhr, Vertrieb, Verkauf oder Nutzung zu verlangen. Ausnahme für Aufsichts- oder Justizbehörden,
    die die Aufbewahrung von Quellcode für Untersuchungen oder Gerichtsverfahren aus ''legitimate and
    legal public interest reasons'' verlangen können, näher zu bestimmen durch Anhang. FÜR KI-AUFSICHT
    ERSTRANGIG: Diese Vorschrift begrenzt handelsvölkerrechtlich, was eine afrikanische KI-Aufsicht an
    Modell- und Codeoffenlegung verlangen darf — der Konflikt mit Prüfbefugnissen nach dem Vorbild der
    EU-KI-Verordnung ist angelegt.'
  - 'Art. 14 (Digital Identities): Pflicht, digitale Identitätssysteme für natürliche und juristische
    Personen einzuführen oder aufrechtzuerhalten, mit Anhang zu Interoperabilität und gegenseitiger Anerkennung.
    Hintergrundnorm für die biometrischen Registerprojekte (Kenia: NIIMS/Huduma Namba; Nigeria: NIN).'
  - 'Art. 27 (Online Consumer Protection): Pflicht zu Verbraucherschutzrecht gegen irreführende, betrügerische
    und täuschende Geschäftspraktiken im Netz — die Norm, an der KI-gestützte Täuschung handelsvertraglich
    anknüpft.'
  - Art. 25 (Cybersecurity), Art. 29 (Online Safety and Security), Art. 28 (unerbetene kommerzielle elektronische
    Kommunikation).
  - 'Art. 47 (Entry into Force): Zeichnung und Ratifikation/Beitritt durch die AfCFTA-Vertragsstaaten
    nach deren Verfassungsverfahren; Inkrafttreten nach Art. 23 Abs. 2 und 4 des AfCFTA-Grundabkommens.
    Art. 50 sieht eine Überprüfung vor.'
