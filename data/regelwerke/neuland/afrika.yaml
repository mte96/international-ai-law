- id: au-afcfta-ip-protocol
  jurisdiktion: africa
  kurztitel: AfCFTA-Protokoll über Rechte des geistigen Eigentums
  offizieller_titel: 'Protocol to the Agreement Establishing the African Continental Free Trade Area on
    Intellectual Property Rights

    '
  fundstelle: 'Angenommen am 19.02.2023 (36. ordentliche Sitzung der AU-Versammlung). AU-Vertragssymbol
    45077.

    '
  status: verabschiedet
  status_detail: 'Angenommen am 19.02.2023, nach der amtlichen AU-Vertragsliste NOCH NICHT IN KRAFT. Art.
    34 öffnet es zur Zeichnung, Ratifikation und zum Beitritt durch die AfCFTA-Vertragsstaaten nach deren
    Verfassungsverfahren. ZENTRALER BEFUND FÜR DIE TRAININGSFRAGE IN AFRIKA: Die Wörter "artificial intelligence"
    und "data mining" kommen im Protokoll NICHT vor; Text and Data Mining, computergestützte Analyse und
    computererzeugte Werke sind NICHT geregelt.

    '
  kurzbeschreibung: 'Das Immaterialgüterprotokoll zum afrikanischen Freihandelsabkommen umfasst 42 Artikel
    in sieben Teilen. Es setzt Mindeststandards für Pflanzensorten, geografische Angaben, Marken, Urheberrecht
    und verwandte Schutzrechte, Patente, Gebrauchsmuster, Geschmacksmuster, nicht offengelegte Informationen,
    Halbleitertopografien, AUFKOMMENDE TECHNOLOGIEN (Art. 17), traditionelles Wissen, traditionelle kulturelle
    Ausdrucksformen und genetische Ressourcen. Es errichtet einen Ausschuss für Rechte des geistigen Eigentums
    (Art. 30) und ein AfCFTA Intellectual Property Office (Art. 31). Adressaten sind die Vertragsstaaten.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://au.int/en/treaties/protocol-agreement-establishing-african-continental-free-trade-area-intellectual-property
  themenachsen:
  - urheberrecht
  - marktzugang
  - governance
  - content
  regelungsschwerpunkte:
  - 'VERIFIZIERTER NEGATIVBEFUND, für die urheberrechtliche Streitstandsarbeit erstrangig: Die Wörter
    ''artificial intelligence'' und ''data mining'' kommen im Protokoll NICHT vor. Text and Data Mining,
    computergestützte Analyse und computererzeugte Werke sind nicht geregelt. Afrika hat auf kontinentaler
    Ebene KEINE Position zur Trainingsfrage.'
  - Art. 17 (Emerging Technologies) — der einzige Anknüpfungspunkt für KI. Ein eigener Artikel zu aufkommenden
    Technologien steht im Standardteil des Protokolls; sein Inhalt wurde im abgerufenen Umfang nicht ausformuliert
    wiedergegeben und ist nachzuprüfen.
  - 'Art. 11 (Copyright and Related Rights): Die Vertragsstaaten müssen ausgewogene Rahmen schaffen, die
    den Zugang zu Werken für Bildung und Forschung ermöglichen — im Wortlaut: ''State Parties shall provide
    exceptions and limitations for educational and research purposes in national contexts, online cross-border
    contexts, and multi-country research collaborations.'' DAS IST DIE EINZIGE SCHRANKENVORGABE DES PROTOKOLLS.
    Sie erfasst Forschung ausdrücklich, auch grenzüberschreitend und in Mehrländerkooperationen — ob darunter
    Forschungs-TDM fällt, ist die entscheidende, offene Auslegungsfrage. Art. 11 lässt den Staaten im
    Übrigen ausdrücklich Spielraum: Die Vorschrift ''shall in no way prejudice the right of State Parties
    to provide exceptions and limitations... consistent with Intellectual Property Rights treaties''.'
  - 'Art. 18-20 (traditionelles Wissen, traditionelle kulturelle Ausdrucksformen und Folklore, genetische
    Ressourcen): Anmelder müssen die QUELLE des genutzten traditionellen Wissens bzw. der Ausdrucksformen
    bzw. der genetischen Ressourcen offenlegen, den Nachweis der freien vorherigen informierten Zustimmung
    (free prior and informed consent) und den Nachweis gerechter Vorteilsteilhabe erbringen. FÜR KI HÖCHST
    BEDEUTSAM: Diese Offenlegungs-, Zustimmungs- und Teilhabepflichten treffen ''inventions or creations''
    — wer ein Modell auf afrikanischem traditionellem Wissen oder Folklore trainiert und daraus schutzfähige
    Ergebnisse ableitet, gerät in ihren Anwendungsbereich. Das ist ein afrikanischer Sonderweg ohne Entsprechung
    in der EU-KI-VO oder im US-Recht.'
  - 'Art. 30: Committee on Intellectual Property Rights. Art. 31: Errichtung eines AfCFTA Intellectual
    Property Office.'
  - 'Art. 34 (Entry into Force): Zeichnung, Ratifikation und Beitritt durch die AfCFTA-Vertragsstaaten
    nach deren Verfassungsverfahren. Art. 38 Überprüfung; Art. 40 und 41 sehen die Aushandlung von Anhängen
    vor.'
  dokumente:
  - datum: 2023-02-19
    typ: endfassung
    titel: AfCFTA Protocol on Intellectual Property Rights (amtlicher Vertragstext, englisch)
    url: https://au.int/sites/default/files/treaties/45077-treaty-EN_AfCFTA_Protocol_on_Intellectual_Property_Rights.pdf
    sprache: en
    urheber: African Union
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext. Grundlage der Artikelliste, des Wortlautzitats zu Art.
      11 und des Negativbefunds zu KI und TDM.
  - datum: 2023-02-19
    typ: uebersicht
    titel: Vertragsseite der AU zum Immaterialgüterprotokoll
    url: https://au.int/en/treaties/protocol-agreement-establishing-african-continental-free-trade-area-intellectual-property
    sprache: en
    urheber: African Union
    verifiziert: true
    notiz: Amtliche Vertragsseite mit fünf Sprachfassungen; Annahmedatum 19.02.2023, Vermerk 'Not yet
      entered into force'.
  offene_punkte:
  - Der Inhalt des Art. 17 (Emerging Technologies) ist nicht ausformuliert erfasst. Er ist der einzige
    Ort, an dem das Protokoll KI berühren könnte, und deshalb ERSTE PRÜFAUFGABE an diesem Protokoll.
  - Ob die Forschungsschranke des Art. 11 Text and Data Mining trägt, ist ungeklärt und wäre der afrikanische
    Anknüpfungspunkt für eine kontinentale TDM-Position.
  - Zahl der Unterzeichnungen und Ratifikationen sowie das Inkrafttreten sind der Vertragsseite nicht
    zu entnehmen.
  monitoring_quellen:
  - https://au.int/en/treaties
  bezug_regelwerke:
  - au-afcfta-digital-trade-protocol
  - ke-copyright-act-cap130
  - ng-copyright-act-2022
  letzte_pruefung: 2026-09-07
- id: ke-odpc-guidance-wahlen
  jurisdiktion: ke
  kurztitel: ODPC-Leitlinie zu Wahlzwecken
  offizieller_titel: ODPC Guidance Notes for Electoral Purposes
  fundstelle: Office of the Data Protection Commissioner, veröffentlicht Februar 2024 (Ablagestand)
  status: softlaw
  status_detail: 'Verwaltungsleitlinie ohne unmittelbare Bindungswirkung. Sie ist die kenianische Antwort
    auf die Erfahrung mit datengetriebenem Wahlkampf (Cambridge Analytica war in den kenianischen Wahlkämpfen
    2013 und 2017 tätig) und die einzige kenianische Verlautbarung, die automatisierte Entscheidungen
    im politischen Kontext behandelt.

    '
  kurzbeschreibung: 'Die Leitlinie bindet alle an Wahlen beteiligten Organisationen: die Independent Electoral
    and Boundaries Commission, politische Parteien, das Office of the Registrar of Political Parties,
    zivilgesellschaftliche und glaubensbasierte Organisationen, Beobachter und Freiwillige. Sie ordnet
    die acht Rechtsgrundlagen des s. 30 des Gesetzes den Wahlkontexten zu — für die Wählerregistrierung
    regelmäßig die öffentliche Aufgabe, für die Ersterhebung die Einwilligung, weil die Registrierung
    freiwillig ist — und verlangt Rechtmäßigkeit, Fairness und Transparenz, Datenminimierung, Richtigkeit
    mit regelmäßiger Überprüfung, Löschung nach Zweckerreichung, Datenschutzhinweise vor der Erhebung,
    Datenschutz-Folgenabschätzungen bei sensiblen Daten sowie Datenschutz durch Technikgestaltung und
    durch Voreinstellungen.

    '
  inkrafttreten:
    datum: 2024-02-01
    verifiziert: false
    quelle: https://www.odpc.go.ke/wp-content/uploads/2024/02/ODPC-Guidance-Notes-for-Electoral-Purposes.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - content
  - governance
  regelungsschwerpunkte:
  - 'AUTOMATISIERTE ENTSCHEIDUNGEN IM WAHLKONTEXT, im Wortlaut: Wähler oder Mitglieder haben "the right
    not to be subject to decision significantly affecting him or her based solely on an automated processing"
    ohne menschliches Eingreifen oder Erläuterung.'
  - 'GEZIELTE POLITISCHE WERBUNG, im Wortlaut: Wähler, die zielgerichtete digitale politische Werbung
    erhalten, behalten "the right to know why they are receiving such advertising material". Das ist ein
    Auskunftsanspruch über die Targeting-Gründe — der Sache nach eine Transparenzpflicht für politisches
    Mikrotargeting, wie sie die EU erst mit der Verordnung über politische Werbung eingeführt hat.'
  - 'Adressatenkreis ungewöhnlich weit: Wahlkommission, Parteien, Parteienregister, Zivilgesellschaft,
    glaubensbasierte Organisationen, Beobachter und Freiwillige.'
  - 'VERIFIZIERTER NEGATIVBEFUND: Die Leitlinie behandelt Profiling, Mikrotargeting als Begriff, Algorithmen,
    künstliche Intelligenz und synthetische Medien NICHT ausdrücklich. Kenia hat keine Regelung gegen
    Wahl-Deepfakes; einschlägig bleiben ss. 22 und 23 des Computer Misuse and Cybercrimes Act.'
  dokumente:
  - datum: 2024-02-01
    typ: leitlinie
    titel: ODPC Guidance Notes for Electoral Purposes
    url: https://www.odpc.go.ke/wp-content/uploads/2024/02/ODPC-Guidance-Notes-for-Electoral-Purposes.pdf
    sprache: en
    urheber: Office of the Data Protection Commissioner (Kenia)
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext. Ein Ausstellungsdatum ist dem Dokument nicht zu entnehmen;
      das Datum stammt aus dem Ablagepfad (2024/02).
  offene_punkte:
  - Kein Ausstellungsdatum im Dokument; die Datierung beruht auf dem Ablagepfad.
  - Ob die Leitlinie vor den nächsten kenianischen Parlamentswahlen (2027) überarbeitet wird — insbesondere
    um KI-erzeugte Wahlwerbung zu erfassen —, ist zu beobachten.
  monitoring_quellen:
  - https://www.odpc.go.ke/guidelines-2/
  bezug_regelwerke:
  - ke-data-protection-act-2019
  - ke-computer-misuse-act-2018
  letzte_pruefung: 2026-09-07
- id: ke-odpc-guidance-oeffentlicher-sektor
  jurisdiktion: ke
  kurztitel: ODPC-Leitlinie für den öffentlichen Sektor
  offizieller_titel: ODPC — Guidance Note for the Public Sector
  fundstelle: Office of the Data Protection Commissioner, veröffentlicht November 2025 (Ablagestand)
  status: softlaw
  status_detail: 'Verwaltungsleitlinie vom November 2025. Sie ist der Maßstab, an dem sich der kenianische
    Staat beim Einsatz automatisierter Systeme messen lassen muss, und bindet ausdrücklich auch die Bezirksregierungen
    (county governments) — in einem Staat mit devolvierter Verwaltung ist das erheblich.

    '
  kurzbeschreibung: 'Die Leitlinie bindet sämtliche öffentlichen Stellen Kenias: Ministerien, Staatsabteilungen,
    Bezirksregierungen, staatliche Körperschaften, teilautonome Behörden (SAGAs) und Bezirkskörperschaften.
    Sie stützt sich auf den Data Protection Act 2019, die General Regulations 2021, die Registration Regulations
    2021 und Art. 31 der Verfassung. Sie verlangt die Registrierung beim ODPC, die Umsetzung von sieben
    Verarbeitungsgrundsätzen, die Bestimmung einer Rechtsgrundlage, die Gewährung der Betroffenenrechte,
    Datenschutz-Folgenabschätzungen bei Hochrisikoverarbeitung, die Meldung von Verletzungen binnen 72
    Stunden, schriftliche Auftragsverarbeitungsverträge sowie Datenschutz durch Technikgestaltung und
    durch Voreinstellungen; die Benennung eines Datenschutzbeauftragten ist empfohlen, nicht vorgeschrieben.

    '
  inkrafttreten:
    datum: 2025-11-01
    verifiziert: false
    quelle: https://www.odpc.go.ke/wp-content/uploads/2025/11/ODPC-%E2%80%93-Guidance-Note-FOR-PUBLIC-SECTOR.pdf
  themenachsen:
  - datenschutz
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'AUTOMATISIERTE ENTSCHEIDUNGEN DER VERWALTUNG, im Wortlaut: "This right protects a data subject from
    being subjected to a fully automated decision" ohne "human intervention". Die Stelle muss die betroffene
    Person "as soon as reasonably practicable" unterrichten und Schritte zu menschlicher Überprüfung oder
    Neubescheidung einleiten, wenn die automatisierte Entscheidung rechtliche Wirkung entfaltet oder die
    Person erheblich beeinträchtigt. Das ist die Übertragung von s. 35 des Gesetzes auf den Staat — für
    automatisierte Verwaltungsentscheidungen in Kenia die maßgebliche Auslegung.'
  - 'Adressatenkreis: Ministerien, Staatsabteilungen, BEZIRKSREGIERUNGEN, staatliche Körperschaften, teilautonome
    Behörden (SAGAs), Bezirkskörperschaften. Die ausdrückliche Erstreckung auf die county-Ebene ist wichtig,
    weil dort die bürgernahen Verwaltungsverfahren stattfinden.'
  - Registrierungspflicht beim ODPC für öffentliche Stellen; sieben Verarbeitungsgrundsätze; Rechtsgrundlagen
    einschließlich öffentlicher Aufgabe, öffentlichen Interesses und Behördenfunktion — das berechtigte
    Interesse steht öffentlichen Stellen nur eingeschränkt zur Verfügung.
  - Datenschutz-Folgenabschätzung bei Hochrisikoverarbeitung; Meldung von Verletzungen binnen 72 Stunden;
    schriftliche Auftragsverarbeitungsverträge; Datenschutz durch Technikgestaltung und Voreinstellungen;
    Datenschutzbeauftragter empfohlen, nicht zwingend.
