- id: ng-ndiaf-2026
  jurisdiktion: ng
  kurztitel: National Digital Infrastructure Assurance Framework 2026
  offizieller_titel: National Digital Infrastructure Assurance Framework (NDIAF), 2026
  fundstelle: 'Erlassen von der National Information Technology Development Agency (NITDA) auf Grundlage
    der ss. 6 und 32 des NITDA Act 2007. Genehmigt am 04.08.2026, wirksam ab dem 01.01.2027.

    '
  status: verabschiedet
  status_detail: 'Erlassen und veröffentlicht, ANWENDBAR AB DEM 01.01.2027. DAS IST DER WICHTIGSTE BEFUND
    DIESER DATEI FÜR NIGERIA: Entgegen der Annahme, Nigeria habe keine verbindliche KI-Regulierung, unterwirft
    dieses Rahmenwerk Anbieter von KI-Infrastruktur einer Zertifizierungspflicht. Es tut das nicht über
    ein KI-Gesetz, sondern über die Standardsetzungsbefugnis der IT-Behörde — der Weg, den Nigeria seit
    der NDPR 2019 durchgehend geht.

    '
  kurzbeschreibung: 'Das Rahmenwerk schafft ein Zertifizierungssystem für digitale Infrastruktur mit vier
    Zertifizierungsklassen (Tier 1 integriert, Cloud Infrastructure, Cloud Service Provider, Service Integration
    Provider) und einem fortlaufenden Assurance-Zyklus aus Erstzertifizierung, jährlicher Überwachung,
    periodischer Neubewertung und Vorfallmeldung. Es bindet Cloud- und Rechenzentrumsbetreiber, öffentliche
    Stellen auf allen drei Ebenen, Betreiber kritischer Informationsinfrastruktur, regulierte Sektoren,
    Systemintegratoren und Managed-Service-Anbieter. Es ist für die öffentliche Beschaffung ZWINGEND.
    Es verlangt Datenresidenz in Nigeria für staatliche und regulierte Arbeitslasten, Nachweise finanzieller
    Leistungsfähigkeit, Berufshaftpflicht- und Cyberhaftpflichtversicherung sowie Governance-, Risiko-
    und Lieferkettenpflichten.

    '
  inkrafttreten:
    datum: 2027-01-01
    verifiziert: true
    quelle: https://nitda.gov.ng/wp-content/uploads/2026/08/NATIONAL-DIGITAL-INFRASTRUCTURE-ASSURANCE-FRAMEWORK-2026_Final.pdf
  anwendungsdaten:
  - datum: 2027-01-01
    was_gilt: Das Rahmenwerk wird wirksam; Anbieter von KI-Infrastruktur (AI Infrastructure Providers)
      und Sovereign Compute Providers unterliegen der Zertifizierungspflicht
    verifiziert: true
    quelle: https://nitda.gov.ng/wp-content/uploads/2026/08/NATIONAL-DIGITAL-INFRASTRUCTURE-ASSURANCE-FRAMEWORK-2026_Final.pdf
  themenachsen:
  - marktzugang
  - governance
  - sicherheit-export
  - sektor-oeffentlich
  - gpai
  regelungsschwerpunkte:
  - 'LEGALDEFINITION DES KI-INFRASTRUKTURANBIETERS, im Wortlaut: ''Artificial Intelligence (AI) Infrastructure
    Provider'' ist ein Anbieter von ''specialised computing infrastructure, platforms, services, or facilities
    designed to support artificial intelligence workloads, including high-performance computing, graphics
    processing units, model training, model inference, and related AI-enabled services''. Damit erfasst
    nigerianisches Recht ausdrücklich Modelltraining und Modellinferenz als regulierten Gegenstand — und
    zwar über die Infrastrukturseite.'
  - 'ZERTIFIZIERUNGSPFLICHT, im Wortlaut: ''Artificial Intelligence Infrastructure Providers and Sovereign
    Compute Providers shall obtain the Cloud Infrastructure Provider Certification, the Cloud Service
    Provider Certification, or both, according to the nature of their activities, together with such endorsements
    as the Agency may prescribe for artificial intelligence and sovereign compute infrastructure.'' Das
    ist eine echte Marktzugangsschranke für KI-Rechenkapazität — rechtsvergleichend eine Seltenheit; die
    EU-KI-VO reguliert Modelle und Systeme, nicht Rechenzentren.'
  - 'Vier Zertifizierungsklassen: Tier 1 (integriert), Cloud Infrastructure, Cloud Service Provider, Service
    Integration Provider. Dazu zweistufige Arbeitslast-Vermerke (workload assurance endorsements): Enhanced
    und Sovereign.'
  - 'Fortlaufender Assurance-Zyklus: Erstzertifizierung, jährliche Überwachung, periodische Neubewertung,
    Vorfallmeldung.'
  - Datenresidenz im nigerianischen Hoheitsgebiet für staatliche und regulierte Arbeitslasten.
  - 'Wirtschaftliche Zugangsvoraussetzungen: Nachweis finanzieller Leistungsfähigkeit, Berufshaftpflicht-
    und Cyberhaftpflichtversicherung. Governance-, Risikomanagement- und Lieferkettenpflichten. Risikobasierte,
    verhältnismäßige Überwachung.'
  - Verbindlich für die öffentliche Beschaffung; in regulierten Sektoren über sektorspezifische Instrumente
    einzuführen; anwendbar auf kritische Informationsinfrastruktur.
  dokumente:
  - datum: 2026-08-04
    typ: norm
    titel: National Digital Infrastructure Assurance Framework 2026 (amtliche Endfassung)
    url: https://nitda.gov.ng/wp-content/uploads/2026/08/NATIONAL-DIGITAL-INFRASTRUCTURE-ASSURANCE-FRAMEWORK-2026_Final.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext. Grundlage aller Wortlautzitate, der Daten (genehmigt
      04.08.2026, wirksam 01.01.2027) und der Rechtsgrundlage (ss. 6, 32 NITDA Act 2007).
  offene_punkte:
  - Welche 'endorsements' die Behörde für KI- und Sovereign-Compute-Infrastruktur vorschreiben wird, ist
    im Rahmenwerk nur angekündigt; die konkretisierenden Vermerke fehlen. Sie sind der eigentliche KI-Regelungsgehalt.
  - Ob die Zertifizierungspflicht auch ausländische Hyperscaler trifft, die nigerianische Kunden ohne
    Niederlassung in Nigeria bedienen, ist zu prüfen.
  - Verhältnis zur NDPC (Datenresidenz nach NDPA) und zur NCC (Telekommunikationslizenzen) ungeklärt.
  monitoring_quellen:
  - https://nitda.gov.ng/regulations/
  bezug_regelwerke:
  - ng-nitda-act-2007
  - ng-cloud-guideline-2026
  - ng-software-development-guideline-2026
  - ng-ndpa-2023
  letzte_pruefung: 2026-09-07
- id: ng-software-development-guideline-2026
  jurisdiktion: ng
  kurztitel: National Software Development Guideline 2026
  offizieller_titel: National Software Development Guideline, 2026
  fundstelle: 'Erlassen von der National Information Technology Development Agency (NITDA) auf Grundlage
    von s. 6 des NITDA Act 2007. Datum: 14.07.2026.

    '
  status: anwendbar
  status_detail: 'Vom 14.07.2026. FÜR KI ZENTRAL, WEIL DIE LEGALDEFINITION VON "SOFTWARE" KI-SYSTEME UND
    ALGORITHMISCHE ENTSCHEIDUNGSWERKZEUGE AUSDRÜCKLICH EINSCHLIESST. Damit gelten die Anforderungen der
    Leitlinie — Entwicklungslebenszyklus, Sicherheitsstandards, Dokumentation, Barrierefreiheit, Interoperabilität,
    Prüfpflichten und manipulationssichere Prüfpfade — unmittelbar auch für KI-Systeme, die in Nigeria
    eingesetzt werden.

    '
  kurzbeschreibung: 'Die Leitlinie bindet alle Software, die in Nigeria entwickelt, beschafft, geändert,
    integriert oder eingesetzt wird — einschließlich der Software von Drittanbietern, internationalen
    Auftragnehmern und privaten Stellen, die an staatliche Systeme angebunden sind. In regulierten Sektoren
    (Finanzen, Gesundheit, Bildung, kritische Infrastruktur) ist die Einhaltung Pflicht. Verlangt werden
    ein strukturierter Softwareentwicklungslebenszyklus, die Umsetzung der OWASP-Top-10-Gegenmaßnahmen
    und der ASVS-Konformität, eine umfassende Dokumentation, mindestens WCAG 2.1 Stufe AA für bürgerorientierte
    Systeme, standardisierte Datenformate und API-Kompatibilität, angemessene Validierung und Prüfung
    vor der Bereitstellung sowie detaillierte, manipulationssichere Prüfpfade (tamper-evident audit trails).

    '
  inkrafttreten:
    datum: 2026-07-14
    verifiziert: true
    quelle: https://nitda.gov.ng/wp-content/uploads/2026/08/National-Software-Development-Guideline-Signed.pdf
  themenachsen:
  - governance
  - marktzugang
  - sicherheit-export
  - haftung
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'LEGALDEFINITION, im Wortlaut: ''Software means any application, system, platform, digital solution,
    ARTIFICIAL INTELLIGENCE SYSTEM, ALGORITHMIC DECISION-MAKING TOOL, firmware, embedded system, or data
    processing pipeline developed, procured, deployed, or maintained for use in Nigeria.'' Nigeria hat
    damit KI-Systeme und algorithmische Entscheidungswerkzeuge in einer geltenden Behördenleitlinie legaldefiniert
    — ohne KI-Gesetz.'
  - 'ZUSATZPFLICHTEN FÜR KI, im Wortlaut: Systeme, die ''emerging technologies, including but not limited
    TO ARTIFICIAL INTELLIGENCE, distributed systems, and cloud-native architectures'' nutzen, müssen ''additional
    safeguards, transparency measures, and governance controls'' vorsehen. Das ist — der Sache nach —
    eine Transparenz- und Governance-Pflicht für KI-Systeme in Nigeria, geltend seit Juli 2026.'
  - 'Anwendungsbereich ausdrücklich extraterritorial wirkend: erfasst Drittanbieter, internationale Auftragnehmer
    und private Stellen, die an staatliche Systeme angebunden sind, sofern die Software ''for use in Nigeria''
    bestimmt ist.'
  - 'Sektorale Pflichtanwendung: Finanzen, Gesundheit, Bildung, kritische Infrastruktur.'
  - 'Technische Anforderungen: strukturierter SDLC; OWASP Top 10 und ASVS; Dokumentation (SRS, Architektur,
    API, Nutzer, Entwickler, Sicherheit, Betrieb, Lizenzierung); WCAG 2.1 Stufe AA für bürgerorientierte
    Systeme; standardisierte Datenformate und API-Kompatibilität; Validierung und Prüfung vor Bereitstellung;
    manipulationssichere Prüfpfade.'
  dokumente:
  - datum: 2026-07-14
    typ: norm
    titel: National Software Development Guideline (amtliche unterzeichnete Fassung)
    url: https://nitda.gov.ng/wp-content/uploads/2026/08/National-Software-Development-Guideline-Signed.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext. Grundlage der Wortlautzitate zur Legaldefinition und
      zu den KI-Zusatzpflichten.
  offene_punkte:
  - Wie die 'additional safeguards, transparency measures, and governance controls' für KI konkret aussehen,
    sagt die Leitlinie nicht; sie sind auslegungsbedürftig.
  - Ob und wie die Leitlinie durchgesetzt wird — Sanktionen sind nicht erkennbar —, ist offen. Die Durchsetzung
    dürfte über die IT-Projektfreigabe (siehe ng-it-clearance-2026) und die Beschaffung laufen.
  monitoring_quellen:
