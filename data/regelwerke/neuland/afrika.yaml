    verifiziert: true
    notiz: 'Dezember 2023. FÜR ALGORITHMISCHES SCORING EINSCHLÄGIG: definiert Profiling als ''any form
      of automated processing of personal data consisting of the use of personal data to evaluate certain
      personal aspects relating to a natural person''; erlaubt alternative Datenquellen (Mobilfunknutzung,
