  offene_punkte:
  - Der Ratifikationsstandsbericht nennt 20 Ratifikationen, listet aber namentlich 19 Staaten auf (Angola,
    Kap Verde, Côte d'Ivoire, Kongo, DR Kongo, Ghana, Guinea, Lesotho, Madagaskar, Mauretanien, Mauritius,
