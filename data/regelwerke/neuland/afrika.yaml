  regelungsschwerpunkte:
  - 'KI-BEZUG, amtlich bestätigt: Der Entwurf gewährleistet nach Darstellung des federführenden Ministeriums
    ''ethical, transparent, and risk-based governance of emerging technologies such as Artificial Intelligence
    (AI)''. Das ist der einzige belegte risikobasierte KI-Regelungsansatz im nigerianischen Gesetzgebungsverfahren.'
  - 'Elektronische Kommunikation und Aufzeichnungen: Stärkung der rechtlichen Anerkennung digitaler Dokumente
    und Verträge. Diese Vorschriften berühren unmittelbar die Beweisfrage bei KI-erzeugten Dokumenten
    und verzahnen sich mit dem Evidence Act.'
  - Digitalisierungspflicht öffentlicher Stellen (digital transformation mandates).
  - 'Verfahren: Beteiligung in allen 36 Bundesstaaten und im Bundesterritorium vor der Anhörung; öffentliche
    Anhörung am 10.11.2025 vor gemeinsamen Ausschüssen beider Häuser.'
