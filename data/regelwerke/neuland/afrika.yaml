    Verabschiedung 2026. Die amtlichen nigerianischen Quellen dieser Sitzung (NCAIR-Zwischenbericht 04/2026,
    NITDA-Volltextsuche bis 08/2026) erwähnen es nicht ein einziges Mal. Beide Befunde stehen nebeneinander.'
