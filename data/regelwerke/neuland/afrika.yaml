    urheber: NITDA
    verifiziert: true
    notiz: Belegt ein Novellierungsvorhaben zum NITDA Act; Stand des Vorhabens unbekannt.
  offene_punkte:
  - Die amtliche Aktennummer des Gesetzes (Act No. ... of 2007) fehlt; die Behördenseite nennt sie nicht.
  - Stand des Novellierungsvorhabens (NITDA Act Amendment/Repeal Bill) unbekannt.
