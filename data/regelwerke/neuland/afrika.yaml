- id: ke-computer-misuse-act-2018
  jurisdiktion: ke
  kurztitel: Computer Misuse and Cybercrimes Act 2018
  offizieller_titel: The Computer Misuse and Cybercrimes Act, 2018 (Cap. 79C)
  fundstelle: 'Act No. 5 of 2018, Cap. 79C der Laws of Kenya. Ausgefertigt (assented) am 16.05.2018, in
    Kraft (commenced) am 30.05.2018.

    '
  verfahrensnummer: Act No. 5 of 2018
  status: anwendbar
  status_detail: 'In Kraft seit dem 30.05.2018. Das Gesetz ist die kenianische Strafnorm, an der KI-gestützte
    Täuschung, Deepfakes und synthetische Inhalte heute gemessen werden — es kennt die Begriffe KI und
    Deepfake nicht, erfasst sie aber über die Tatbestände der Falschveröffentlichung (s. 22, 23) und der
    Identitätstäuschung (s. 29). Es errichtet in Teil II das National Computer and Cybercrimes Co-ordination
    Committee (NC4).

    '
  kurzbeschreibung: 'Das Gesetz gliedert sich in sieben Teile: Vorbemerkungen, das NC4, Straftaten (Teil
    III, ss. 14 bis 33 ff.), Ermittlungsverfahren, internationale Zusammenarbeit, allgemeine Vorschriften
    und delegierte Befugnisse. Für KI einschlägig sind vor allem s. 22 (false publications), s. 23 (publication
    of false information), s. 24 (child pornography), s. 27 (cyber harassment) und s. 29 (identity theft
    and impersonation). Die Strafrahmen reichen von 200.000 KES Geldstrafe bis zu 20 Mio. KES und von
    drei bis zu 25 Jahren Freiheitsstrafe. Adressat ist jedermann.

    '
  inkrafttreten:
    datum: 2018-05-30
    verifiziert: true
    quelle: https://new.kenyalaw.org/akn/ke/act/2018/5/eng@2022-12-31
  themenachsen:
  - content
  - sicherheit-export
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 's. 22 (False publications), im Wortlaut: ''A person who intentionally publishes false, misleading
    or fictitious data or misinforms with intent that the data shall be considered or acted upon as authentic,
    with or without any financial gain, commits an offence and shall, on conviction, be liable to a fine
    not exceeding five million shillings or to imprisonment for a term not exceeding two years, or to
    both.'' DIE ZENTRALE NORM FÜR SYNTHETISCHE INHALTE: Sie verlangt weder Vermögensschaden noch Gewinnabsicht,
    sondern nur den Vorsatz, dass die Daten als echt gelten oder als echt behandelt werden sollen — das
    trifft die Deepfake-Konstellation unmittelbar.'
  - 's. 23 (Publication of false information), im Wortlaut: ''A person who knowingly publishes information
    that is false in print, broadcast, data or over a computer system, that is calculated or results in
    panic, chaos, or violence among citizens of the Republic, or which is likely to discredit the reputation
    of any person commits an offence and shall on conviction, be liable to a fine not exceeding five million
    shillings or to imprisonment for a term not exceeding ten years, or to both.'' Die Alternative ''likely
    to discredit the reputation of any person'' ist außerordentlich weit und erfasst rufschädigende Deepfakes;
    sie ist zugleich der meistkritisierte Teil des Gesetzes (Meinungsfreiheit, Art. 33 der Verfassung).'
  - 's. 29 (Identity theft and impersonation): ''A person who fraudulently or dishonestly makes use of
    the electronic signature, password or any other unique identification feature of any other person
    commits an offence'' — Geldstrafe bis 200.000 KES oder Freiheitsstrafe bis drei Jahre. Ob Stimme und
    Gesicht ''unique identification feature'' im Sinne der Norm sind, ist die entscheidende, bislang ungeklärte
    Auslegungsfrage für Stimmklone und Gesichtstausch.'
  - 's. 16 (Unauthorised interference): Geldstrafe bis 10 Mio. KES oder Freiheitsstrafe bis fünf Jahre.'
  - 's. 24 (Child pornography): Geldstrafe bis 20 Mio. KES oder Freiheitsstrafe bis 25 Jahre — für synthetisch
    erzeugtes Material die einschlägige Norm, deren Anwendbarkeit auf rein computergenerierte Darstellungen
    ohne reales Opfer aber zu prüfen ist.'
  - 'Weitere Tatbestände: s. 14 unbefugter Zugang, s. 15 Zugang mit weitergehender Absicht, s. 17 unbefugtes
    Abfangen, s. 18 illegale Geräte und Zugangscodes, s. 21 Cyberspionage, s. 25 Computerfälschung, s.
    26 Computerbetrug, s. 27 Cyber-Belästigung, s. 28 Cybersquatting, s. 30 Phishing, s. 33 Cyberterrorismus.'
  - Teil II errichtet das National Computer and Cybercrimes Co-ordination Committee (NC4) als behördenübergreifende
    Koordinierungsstelle für Cybersicherheit.
  dokumente:
  - datum: 2018-05-16
    typ: konsolidiert
    titel: The Computer Misuse and Cybercrimes Act, Cap. 79C (konsolidierte Fassung, Stand 31.12.2022)
    url: https://new.kenyalaw.org/akn/ke/act/2018/5/eng@2022-12-31
    sprache: en
    urheber: National Council for Law Reporting (Kenya Law), mit Ermächtigung des Attorney-General
    verifiziert: true
    notiz: 'Amtliche konsolidierte Akoma-Ntoso-Fassung. Grundlage aller Wortlautzitate. HINWEIS: new.kenyalaw.org
      antwortete überwiegend mit HTTP 403; dieser Abruf gelang. Die Sperre ist offenbar eine Ratenbegrenzung,
      keine dauerhafte Blockade — mit Abstand zwischen den Abrufen ist das Portal nutzbar.'
  offene_punkte:
  - Ob s. 29 ('any other unique identification feature') Stimme und Gesichtszüge erfasst, ist nicht entschieden.
    Das ist die praktisch wichtigste offene Auslegungsfrage des kenianischen Deepfake-Strafrechts.
  - Die Verfassungsmäßigkeit der ss. 22 und 23 war Gegenstand von Verfahren des Bloggers Association of
    Kenya gegen den Attorney General; der Ausgang konnte nicht am amtlichen Urteilstext belegt werden
    (Rechtsprechungssuche auf new.kenyalaw.org war gesperrt).
  - Regulations unter dem Gesetz konnten nicht nachgewiesen werden; nc4.go.ke listet sie an, gibt aber
    keine Dateien aus.
