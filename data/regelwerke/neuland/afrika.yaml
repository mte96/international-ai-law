- id: ng-software-testing-2026
  jurisdiktion: ng
  kurztitel: Nationale Softwareprüfleitlinie und Prüforganisationslizenzierung 2026
  offizieller_titel: 'National Software Testing Guideline, 2026, und Software Testing Organisations Licensing
    Guideline (STOL), 2026

    '
  fundstelle: 'Beide erlassen von der NITDA auf Grundlage von s. 6 des NITDA Act 2007, unterzeichnet am
    14.07.2026 von Kashifu Inuwa Abdullahi (Director-General/CEO NITDA).

    '
  status: verabschiedet
  status_detail: 'Unterzeichnet am 14.07.2026, aber NOCH NICHT IN KRAFT: Beide Leitlinien bestimmen, dass
    der Anwendungsbeginn erst von der NITDA festzulegen und bekanntzugeben ist ("shall come into effect
    on a date to be determined and communicated by" der Behörde); die STOL sieht zusätzlich eine Übergangszeit
    vor. FÜR KI EINSCHLÄGIG, WEIL DIE PRÜFPFLICHT VOR DEM EINSATZ AUCH KI-SYSTEME ERFASST — die Softwaredefinition
    der Entwicklungsleitlinie schließt KI-Systeme und algorithmische Entscheidungswerkzeuge ausdrücklich
    ein.

    '
  kurzbeschreibung: 'Die Prüfleitlinie verlangt, dass sämtliche Software vor der Bereitstellung von einer
    NITDA-lizenzierten Prüforganisation getestet und zertifiziert wird; die Zertifizierung ist bei wesentlichen
    Änderungen zu erneuern. Geprüft werden funktionale Eigenschaften (Vollständigkeit, Richtigkeit, Angemessenheit)
    und nichtfunktionale (Leistung, Sicherheit, Benutzbarkeit, Kompatibilität, Zuverlässigkeit, Wartbarkeit,
    Portierbarkeit). Die Lizenzierungsleitlinie schafft drei Klassen von Prüforganisationen nach Auswirkung
    und Risiko des geprüften Systems (Klasse A hoch, B mittel, C gering) mit gestaffelten Anforderungen
    an Personal (2 bis über 20 zertifizierte Fachkräfte), Infrastruktur, Zertifizierungen (NDPA, ISO/IEC
    27001, CMMI/TMMi Stufe 3) und Lizenzgebühren von 2,5 Mio. bis 20 Mio. NGN.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://nitda.gov.ng/wp-content/uploads/2026/08/National-Software-Testing-Guideline-Signed.pdf
  themenachsen:
  - marktzugang
  - governance
  - sicherheit-export
  - haftung
  regelungsschwerpunkte:
  - 'KI-BEZUG, im Wortlaut: ''Testing requirements for emerging technologies, including but not limited
    to artificial intelligence, distributed systems, and cloud-native architectures''. Die Prüfleitlinie
    kündigt damit KI-spezifische Prüfanforderungen an, ohne sie im abgerufenen Umfang auszuformulieren.'
  - Prüfpflicht vor der Bereitstellung durch eine NITDA-LIZENZIERTE Prüforganisation; Zertifikatserneuerung
    bei wesentlichen Änderungen. Zusammen mit der Softwaredefinition der Entwicklungsleitlinie ('artificial
    intelligence system, algorithmic decision-making tool') ergibt das eine Vorabprüfung von KI-Systemen
    durch akkreditierte Dritte — der Sache nach eine Konformitätsbewertung, ohne so zu heißen.
  - 'Sicherheitsprüfung risikogestuft: SAST und SCA für alle Systeme; DAST und Secrets-Scanning ab Klasse
    B; IAST, API-Fuzzing und Penetrationstests für Klasse-A-Systeme.'
  - 'Drei Risikoklassen: Klasse A (hohe Auswirkung, hohes Risiko — Ausfall mit katastrophalen Folgen),
    Klasse B (mittlere Auswirkung, erhebliche Betriebsstörung ohne Katastrophe), Klasse C (geringe Auswirkung).'
  - 'Lizenzgebühren für Prüforganisationen: 2,5 Mio. bis 20 Mio. NGN, gestaffelt nach Klasse.'
  - 'VERIFIZIERTER NEGATIVBEFUND: Die Lizenzierungsleitlinie (STOL) selbst erwähnt künstliche Intelligenz,
    maschinelles Lernen und algorithmische Systeme mit KEINEM Wort. Die KI-Anknüpfung steht ausschließlich
    in der Prüfleitlinie und in der Entwicklungsleitlinie.'
  dokumente:
  - datum: 2026-07-14
    typ: norm
    titel: National Software Testing Guideline 2026 (unterzeichnete Fassung)
    url: https://nitda.gov.ng/wp-content/uploads/2026/08/National-Software-Testing-Guideline-Signed.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext; unterzeichnet 14.07.2026, Anwendungsbeginn noch festzulegen.
  - datum: 2026-07-14
    typ: norm
    titel: Software Testing Organisations Licensing Guideline (STOL) 2026
    url: https://nitda.gov.ng/wp-content/uploads/2026/08/Software-Testing-Organisations-Licensing-Guideline-Signed.pdf
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtlicher Volltext; unterzeichnet am 14.07.2026 von Kashifu Inuwa Abdullahi. Klassen, Personalanforderungen
      und Gebührenrahmen belegt.
  offene_punkte:
  - ANWENDUNGSBEGINN BEIDER LEITLINIEN OFFEN. Beide verweisen auf eine noch bekanntzugebende Entscheidung
    der NITDA. Das ist eine echte, aber noch undatierte Frist — zu beobachten.
  - Die angekündigten KI-spezifischen Prüfanforderungen sind im abgerufenen Umfang nicht ausformuliert.
    Sie wären das materiell interessanteste Stück.
  monitoring_quellen:
  - https://nitda.gov.ng/regulations/
  - https://nitda.gov.ng/draft-regulatory-instruments/
  bezug_regelwerke:
  - ng-software-development-guideline-2026
  - ng-nitda-act-2007
  - ng-ndiaf-2026
  letzte_pruefung: 2026-09-07
- id: ng-cybercrimes-act-2015-2024
  jurisdiktion: ng
  kurztitel: Cybercrimes Act 2015 (i.d.F. 2024)
  offizieller_titel: 'Cybercrimes (Prohibition, Prevention, etc.) Act, 2015, in der Fassung der Änderung
    von 2024

    '
  fundstelle: Bundesgesetz 2015, geändert 2024 — Fundstelle nicht verifiziert
  status: anwendbar
  status_detail: 'In Kraft; die Existenz des Gesetzes UND seiner Novelle von 2024 ist amtlich belegt durch
    die Nationale KI-Strategie Nigerias, die in Abschnitt 1.1.3.5 den "Cybercrimes (Prohibition and Prevention)
    Act 2015 (amendment 2024)" als bestehenden Rechtsrahmen für KI-bezogene Cyberrisiken anführt. DER
    GESETZESTEXT SELBST KONNTE NICHT ABGERUFEN WERDEN; Angaben zu einzelnen Tatbeständen und Strafrahmen
    werden deshalb bewusst nicht gemacht.

    '
  kurzbeschreibung: 'Das nigerianische Computerstrafgesetz von 2015, 2024 novelliert. Es ist nach der
    Darstellung der nationalen KI-Strategie einer der beiden Rechtsakte (neben dem Nigeria Data Protection
    Act 2023), an denen sich KI-bezogene Risiken in Nigeria heute messen. Es wäre die Norm, über die Deepfakes,
    KI-gestützter Betrug und Identitätstäuschung in Nigeria strafrechtlich erfasst würden. Inhalt und
    Strafrahmen sind hier unbelegt.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://ncair.nitda.gov.ng/wp-content/uploads/2025/09/National-Artificial-Intelligence-Strategy-19092025.pdf
  themenachsen:
  - content
  - sicherheit-export
  - haftung
  regelungsschwerpunkte:
  - 'AMTLICH BELEGT ist allein die Existenz und die Rolle des Gesetzes: Abschnitt 1.1.3.5 der Nationalen
    KI-Strategie führt den ''Cybercrimes (Prohibition and Prevention) Act 2015 (amendment 2024)'' als
    geltenden Rahmen an, der Cyberbedrohungen adressiert und auf den sich die KI-Grundsätze stützen.'
  - 'UNVERIFIZIERT: sämtliche Tatbestände, Strafrahmen und der Inhalt der Novelle 2024. Es werden keine
    Angaben behauptet.'
  dokumente:
  - datum: 2025-09-19
    typ: uebersicht
    titel: Nennung des Cybercrimes Act 2015 (i.d.F. 2024) in Abschnitt 1.1.3.5 der Nationalen KI-Strategie
    url: https://ncair.nitda.gov.ng/wp-content/uploads/2025/09/National-Artificial-Intelligence-Strategy-19092025.pdf
    sprache: en
    urheber: FMCIDE
    verifiziert: true
    notiz: Amtlicher mittelbarer Beleg für Existenz und Fassung des Gesetzes. KEIN Beleg für seinen Inhalt.
  offene_punkte:
  - 'DER GESETZESTEXT FEHLT — für 2015 wie für die Novelle 2024. Erfolglose Wege: nigerialii.org (Legislativdatenbank
    gibt keine Dokumente aus; der geratene Akoma-Ntoso-Pfad /akn/ng/act/2015/17/ lieferte 404), placng.org/lawsofnigeria
    (nur Stand 2004), nass.gov.ng (robots.txt-Sperre), nitda.gov.ng (Suche nach ''cybercrimes'' ohne Gesetzestreffer).
    SIEBTE AUFGABE FÜR DEN NÄCHSTEN BEARBEITER.'
  - 'Insbesondere zu klären: ob die Novelle 2024 synthetische Medien, Deepfakes oder KI-gestützten Betrug
    ausdrücklich erfasst. Kenia tut das über ss. 22, 23, 29 seines Gesetzes von 2018 nicht ausdrücklich,
    sondern nur mittelbar.'
  monitoring_quellen:
  - https://nigerialii.org/legislation/
  - https://nass.gov.ng/
