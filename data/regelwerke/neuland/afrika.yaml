- id: au-malabo-konvention
  jurisdiktion: africa
  kurztitel: Malabo-Konvention
  offizieller_titel: 'African Union Convention on Cyber Security and Personal Data Protection (Convention
    de l''Union africaine sur la cybersécurité et la protection des données à caractère personnel)

    '
  fundstelle: 'Angenommen von der Versammlung der Afrikanischen Union am 27.06.2014 in Malabo, Äquatorialguinea.
    AU-Vertragssymbol 29560-treaty-0048.

    '
  verfahrensnummer: AU-Vertrag Nr. 0048
  status: anwendbar
  status_detail: 'IN KRAFT SEIT DEM 08.06.2023 — dreißig Tage nach Hinterlegung der fünfzehnten Ratifikationsurkunde
    (Art. 36). Neun Jahre zwischen Annahme und Inkrafttreten. Stand des amtlichen Ratifikationsstandsberichts:
    21 Unterzeichnungen, 20 Ratifikationen/Beitritte, 20 Hinterlegungen. FÜR DIESE DATEI ENTSCHEIDEND:
    Nigeria hat die Konvention am 23.01.2024 lediglich UNTERZEICHNET, nicht ratifiziert; Kenia hat sie
    weder unterzeichnet noch ratifiziert. Beide Rechtsordnungen sind an sie also nicht gebunden.

    '
  kurzbeschreibung: 'Der einzige völkerrechtlich verbindliche gesamtafrikanische Rechtsakt zu Datenschutz
    und Cybersicherheit. Er verpflichtet die Vertragsstaaten, einen Rechtsrahmen für elektronische Transaktionen
    (Kapitel I), für den Schutz personenbezogener Daten (Kapitel II) und für Cybersicherheit und Cyberstrafrecht
    (Kapitel III) zu schaffen. Kapitel II verlangt die Einrichtung einer nationalen Datenschutzbehörde
    (Art. 11, 12), legt sechs Grundsätze der Datenverarbeitung fest (Art. 13) und gewährt den Betroffenen
    Rechte auf Information, Auskunft, Widerspruch und Berichtigung/Löschung (Art. 16-19). Die Konvention
    richtet sich an Staaten, nicht an Private; Sanktionen gegen Private ergeben sich erst aus dem jeweiligen
    nationalen Umsetzungsrecht.

    '
  inkrafttreten:
    datum: 2023-06-08
    verifiziert: true
    quelle: https://au.int/sites/default/files/AFRICAN%20UNION%20CONVENTION%20ON%20CYBER%20SECURITY%20AND%20PERSONAL%20DATA%20PROTECTION%20%281%29.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - sicherheit-export
  regelungsschwerpunkte:
  - 'BEFUND ZUR KI-RELEVANZ, ausdrücklich verifiziert: Das Wort ''automated'' kommt in der Konvention
    NICHT vor. Die Malabo-Konvention enthält KEIN Recht gegen ausschließlich automatisierte Entscheidungen
    und keine Profiling-Vorschrift. Sie ist damit deutlich schwächer als die DSGVO und als das nationale
    Recht Kenias (s. 35 Data Protection Act 2019) und Nigerias. Wer sie als afrikanisches Gegenstück zu
    Art. 22 DSGVO behandelt, irrt.'
  - 'Art. 11, 12: Pflicht zur Einrichtung einer unabhängigen nationalen Datenschutzbehörde mit Aufsichts-,
    Untersuchungs- und Sanktionsbefugnissen. Das ist der praktisch wichtigste Hebel — er ist in Kenia
    (ODPC) und Nigeria (NDPC) unabhängig von der Konvention verwirklicht.'
  - 'Art. 13: Sechs Grundsätze der Verarbeitung — Einwilligung und Rechtmäßigkeit (Grundsatz 1), Rechtmäßigkeit
    und Fairness (2), Zweckbindung, Erheblichkeit und Speicherung (3), Richtigkeit (4), Transparenz (5),
    Vertraulichkeit und Sicherheit (6). Art. 13 Grundsatz 1: ''Processing of personal data shall be deemed
    to be legitimate where the data subject has given his/her consent.'''
  - 'Art. 14: besondere Grundsätze für die Verarbeitung sensibler Daten. Art. 15: Zusammenführung (interconnection)
    von Dateien — die Vorschrift, die dem Aufbau staatlicher Registerverbünde Grenzen setzt und damit
    für biometrische Großsysteme einschlägig ist.'
  - Art. 16 Recht auf Information; Art. 17 Auskunftsrecht ('Any natural person whose personal data are
    to be processed may request from the controller...'); Art. 18 Widerspruchsrecht ('Any natural person
    has the right to object, on legitimate grounds, to the processing of the data relating to him/her');
    Art. 19 Recht auf Berichtigung, Vervollständigung, Aktualisierung, Sperrung oder Löschung.
  - 'Art. 29-31: Cyberstrafrecht. Art. 29 Straftaten, die für Informations- und Kommunikationstechnik
    spezifisch sind; Art. 30 Anpassung bestehender Straftatbestände an die IKT; Art. 31 Anpassung der
    Sanktionen. Über Art. 30 werden Bildmanipulation und Identitätstäuschung erfasst, ohne dass die Konvention
    Deepfakes benennt — sie ist zehn Jahre vor der generativen KI entstanden.'
  - 'Art. 36: Inkrafttreten dreißig Tage nach Hinterlegung der fünfzehnten Ratifikationsurkunde. Diese
    Schwelle wurde erst 2023 erreicht — die Konvention war neun Jahre lang totes Recht.'
