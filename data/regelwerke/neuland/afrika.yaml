- id: ng-nitda-code-of-practice-2022
  jurisdiktion: ng
  kurztitel: NITDA Code of Practice für Plattformen 2022
  offizieller_titel: 'Code of Practice for Interactive Computer Service Platforms/Internet Intermediaries

    '
  fundstelle: 'Erlassen von der National Information Technology Development Agency (NITDA) gemeinsam mit
    der Nigerian Communications Commission (NCC) und der National Broadcasting Commission (NBC) am 26.09.2022.
    Rechtsgrundlage: s. 6 des NITDA Act 2007 (Präambel).

    '
  status: anwendbar
  status_detail: 'In Kraft seit dem 26.09.2022. Nichteinhaltung wird als Verstoß gegen den Nigerian Communications
    Act 2003, den NBC Act 2004 und den NITDA Act 2007 behandelt. Die NITDA veröffentlicht jährliche Compliance-Berichte;
    der Bericht für 2024 erschien am 21.08.2025 und ist die aussagekräftigste öffentliche Quelle zur algorithmischen
    Inhaltemoderation in Afrika.

    '
  kurzbeschreibung: 'Der Code verpflichtet alle in Nigeria tätigen interaktiven Computerdienste und Internetvermittler
    einschließlich ihrer Tochtergesellschaften. Für "Large Service Platforms" (LSP) — Plattformen mit
    mehr als einer Million registrierter nigerianischer Nutzer — gelten nach Teil III verschärfte Pflichten.
    Kernpflichten sind Fristen für die Entfernung rechtswidriger Inhalte (48 Stunden für nicht einvernehmliche
    intime Aufnahmen und für Behördenmeldungen), ein Beschwerdebearbeitungsverfahren mit Überprüfungs-
    und Rechtsbehelfsmöglichkeit sowie eine jährliche Transparenzberichtspflicht für LSP. FÜR KI ZENTRAL:
    Teil III § 4 verpflichtet LSP zu "human supervision to review... automated tools... ensure freedom
    of expression" — eine ausdrückliche Pflicht zur menschlichen Aufsicht über automatisierte Inhaltemoderation.

    '
  inkrafttreten:
    datum: 2022-09-26
    verifiziert: true
    quelle: https://nitda.gov.ng/wp-content/uploads/2022/10/APPROVED-NITDA-CODE-OF-PRACTIVE-FOR-INTERACTIVE-COMPUTER-SERVICE-PLATFORMS-INTERNET-INTERMEDIARIES-2022-002.pdf
  themenachsen:
  - content
  - grundrechte
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'TEIL III § 4 — DIE KI-NORM DES CODE: Große Plattformen müssen ''human supervision to review... automated
    tools... ensure freedom of expression'' bereitstellen. Damit ist die menschliche Aufsicht über automatisierte
    Moderationswerkzeuge in Nigeria seit 2022 rechtlich verlangt — Jahre vor jedem KI-Gesetz und vor Art.
    14 EU-KI-VO.'
  - 'Anwendungsbereich: alle interaktiven Computerdienste und Internetvermittler in Nigeria einschließlich
    Tochter- und verbundener Gesellschaften. Schwelle für Large Service Platforms (LSP): über eine Million
    registrierte nigerianische Nutzer.'
  - 'Teil I § 1: Nicht einvernehmliche intime Aufnahmen — Empfangsbestätigung UND Entfernung binnen 48
    Stunden. Das ist die Norm, an der nicht einvernehmliche Deepfake-Pornografie in Nigeria plattformrechtlich
    anknüpft.'
  - 'Teil I § 3: rechtswidrige Inhalte auf Meldung einer Behörde — Empfangsbestätigung binnen 48 Stunden.
    Teil I § 4: von Nutzern gemeldete rechtswidrige Inhalte — Entfernung ''as soon as reasonably practicable''.'
  - 'Teil II §§ 9-10: Pflicht zu einem Beschwerdebearbeitungsmechanismus mit Überprüfung und Rechtsbehelf.'
  - 'Teil III § 10: jährlicher Compliance-Bericht der LSP mit Angaben zu entfernten Inhalten, geschlossenen
    Konten und erledigten/unerledigten Beschwerden.'
  - 'Sanktionsmechanik: Der Code enthält keine eigenen Bußgelder, sondern behandelt Verstöße als Verstöße
    gegen drei Gesetze (Nigerian Communications Act 2003, NBC Act 2004, NITDA Act 2007) — eine mittelbare
    Durchsetzung über drei Aufsichtsbehörden.'
  dokumente:
  - datum: 2022-09-26
    typ: norm
    titel: Code of Practice for Interactive Computer Service Platforms/Internet Intermediaries (amtliche
      Endfassung)
    url: https://nitda.gov.ng/wp-content/uploads/2022/10/APPROVED-NITDA-CODE-OF-PRACTIVE-FOR-INTERACTIVE-COMPUTER-SERVICE-PLATFORMS-INTERNET-INTERMEDIARIES-2022-002.pdf
    sprache: en
    urheber: NITDA, NCC, NBC
    verifiziert: true
    notiz: Amtlicher, maschinenlesbarer Volltext. Grundlage aller Paragraphenangaben, des Erlassdatums
      (26.09.2022) und der Rechtsgrundlage (s. 6 NITDA Act 2007).
  - datum: 2025-08-21
    typ: bericht
    titel: Compliance Report (2024) on the Code of Practice for Interactive Computer Service Platforms/Internet
      Intermediaries
    url: https://nitda.gov.ng/sdm_downloads/compliance-report-2024-on-the-code-of-practice-for-interactive-computer-service-platforms-internet-intermediaries-cop-for-icsps-iis/
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: 'AMTLICHER AUFSICHTSBERICHT, veröffentlicht am 21.08.2025 (Download über https://nitda.gov.ng/?sdm_process_download=1&download_id=9059).
      ERSTRANGIG FÜR DIE ALGORITHMISCHE MODERATION: Google, TikTok und LinkedIn haben vollständig berichtet;
      META hat die vorgeschriebene Vorlage NICHT verwendet, X (Twitter) hat ÜBERHAUPT NICHT berichtet.
      Zahlen 2024: rund 28 Mio. geschlossene Konten (Google 9.680.141, LinkedIn 16.121.996, TikTok 2.303.920)
      und rund 58,9 Mio. entfernte Inhalte (Google 50.113.273, LinkedIn 234.584, TikTok 8.561.255); wiederhergestellte
      Inhalte nach Widerspruch: Google 4.717, LinkedIn 637, TikTok 415.085. Alle drei Plattformen beschreiben
      mehrstufige Moderation aus Automatisierung und menschlicher Prüfung; Google nutzt ''a mix of machine
      learning and human moderators'' und verwendet menschlich geprüfte Inhalte, um KI-Modelle zu trainieren;
      LinkedIn bewertet Inhalte durch Modelle ''within milliseconds''; TikTok leitet automatisiert erkannte
      Inhalte an menschliche Moderatoren weiter, deren Entscheidungen die KI-Modelle verbessern.

      '
  offene_punkte:
  - Welche Folgen die Nichtberichterstattung von X (Twitter) und die formwidrige Berichterstattung von
    Meta hatten — ob Verfahren eingeleitet oder Sanktionen verhängt wurden —, ist nicht belegt. Das ist
    der interessanteste Durchsetzungsstrang.
  - Der Compliance-Bericht für 2025 war im September 2026 nicht auffindbar.
  - Ob der Code neben s. 6 NITDA Act 2007 eine tragfähige Ermächtigungsgrundlage für Pflichten gegenüber
    ausländischen Plattformen hat, ist rechtlich umstritten und wurde nicht geklärt.
