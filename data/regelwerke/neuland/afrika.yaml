- id: ng-evidence-act-2011
  jurisdiktion: ng
  kurztitel: Evidence Act 2011 (Nigeria) mit Novelle 2025
  offizieller_titel: Evidence Act, 2011, und Evidence (Amendment) Act, 2025 (Bezeichnungen NICHT verifiziert)
  fundstelle: Bundesgesetz 2011, geändert 2025 — Fundstelle nicht verifiziert
  status: anwendbar
  status_detail: 'NICHT VERIFIZIERT. Weder der Evidence Act 2011 noch die vom Auftrag genannte Novelle
    2025 zu elektronischen Beweismitteln konnten an einer amtlichen Quelle belegt werden. Es werden deshalb
    KEINE inhaltlichen Angaben gemacht. Der Eintrag steht als ausgewiesene Lücke, weil die Beweisfrage
    für KI-Erzeugnisse (Zulässigkeit und Beweiswert computergenerierter Aufzeichnungen, Umgang mit manipulierten
    Bild- und Tonaufnahmen) zu den praktisch wichtigsten Fragen gehört.

    '
  kurzbeschreibung: 'Nach der Ausgangsangabe des Auftrags das nigerianische Beweisrecht von 2011 mit einer
    Novelle von 2025 zu elektronischen Beweismitteln. Es wäre die Norm, über die in nigerianischen Verfahren
    entschieden würde, ob und unter welchen Voraussetzungen KI-erzeugte oder KI-veränderte Aufzeichnungen
    als Beweismittel zugelassen werden. Inhalt unbelegt.

    '
  inkrafttreten:
