- id: ng-startup-act-2022
  jurisdiktion: ng
  kurztitel: Nigeria Startup Act 2022
  offizieller_titel: Nigeria Startup Act, 2022
  fundstelle: Bundesgesetz 2022; von NITDA veröffentlichte Fassung ('Final Publication')
  status: anwendbar
  status_detail: 'In Kraft. Für KI mittelbar bedeutsam, weil das Gesetz den Rahmen für Regulierungs-Sandkästen
    und Innovationsförderung in Nigeria setzt — also den Ort, an dem KI-Erprobung rechtlich stattfinden
    kann, solange kein KI-Gesetz besteht. Der Inhalt wurde nicht ausgewertet.

    '
  kurzbeschreibung: 'Das nigerianische Start-up-Gesetz von 2022 schafft einen Rechtsrahmen für die Förderung
    technologiegetriebener Unternehmen, deren Bezeichnung (labelling) und ihre steuerliche und regulatorische
    Behandlung. Es ist das Gegenstück zur kenianischen Sandkastenregelung im KI-Gesetzentwurf 2026: Nigeria
    hat den Innovationsrahmen bereits im Gesetz, Kenia will ihn erst über den KI-Commissioner schaffen.

    '
  inkrafttreten:
