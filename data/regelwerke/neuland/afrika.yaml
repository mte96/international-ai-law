    typ: pressemitteilung
    titel: Nigeria Advances Citizen-Led Digital Governance with Online Harm Protection Bill
    url: https://nitda.gov.ng/nigeria-advances-citizen-led-digital-governance-with-online-harm-protection-bill/9037/
    sprache: en
    urheber: NITDA
    verifiziert: true
    notiz: Amtliche Mitteilung der zuständigen Behörde. Einzige erreichbare Quelle zum Entwurf; der Entwurfstext
      ist nicht verlinkt.
  offene_punkte:
  - Der Entwurfstext und das Weißbuch vom Dezember 2024 konnten nicht gefunden werden.
  - Ob und wie der Entwurf synthetische Medien und Deepfakes erfasst, ist nicht belegt; die Mitteilung
    nennt nur 'algorithmic bias' und 'misinformation'.
  - Verhältnis zum NITDA Code of Practice 2022 und zum National Digital Economy and e-Governance Bill
    2025 ungeklärt.
