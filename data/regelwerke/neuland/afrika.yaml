  offene_punkte:
  - s. 35 Abs. 5 ermächtigt den Cabinet Secretary, durch Regulations weitere Schutzmaßnahmen bei ausschließlich
    automatisierten Entscheidungen vorzusehen. In den Data Protection (General) Regulations 2021 ließ
    sich keine solche Vorschrift nachweisen. Ob die Ermächtigung ungenutzt geblieben ist, ist zu prüfen
    — sie wäre der naheliegendste Ort für KI-spezifische Konkretisierungen ohne neues Gesetz.
  - Es konnte keine Determination des ODPC gefunden werden, die s. 35 tragend anwendet. Ob die Norm je
    durchgesetzt wurde, ist offen.
  - 'Das Verhältnis von s. 35 zum KI-Gesetzentwurf 2026 (dort: Recht auf menschliches Eingreifen) ist
    im Entwurf nicht ausdrücklich geregelt; es droht Doppelregulierung mit zwei Behörden (ODPC und AI
    Commissioner).'
