  - Eine Bundestags-Drucksachennummer existierte am Stichtag noch nicht; nur die Bundesratsdrucksache
    ist belegt.
  - Kein Inkrafttretensdatum bestimmbar - Art. 3 knüpft an die Verkündung an, die noch aussteht.
  - Das Verhältnis zur KI-VO ist im Entwurf nicht ausdrücklich adressiert, obwohl KI-Systeme in Migration,
    Asyl und Grenzkontrolle nach Anhang III Nr. 7 KI-VO Hochrisikosysteme sind.
  - Verhältnis zu § 35a VwVfG und zu Art. 22 DSGVO im Entwurf nicht ausdrücklich geklärt; die Entwurfssystematik
    setzt auf verpflichtende manuelle Auswertung, definiert aber keine Mindestanforderungen an deren Tiefe.
