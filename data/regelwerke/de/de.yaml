    sind nicht nachweisbar (Sommerpause). WARNUNG — Verwechslungsgefahr: Die Abstimmung des Bundestages
    am 09.07.2026 über "Digitalisierung in der Migrationsverwaltung" betrifft NICHT das KIMVG, sondern
    das Migrationsverwaltungsdigitalisierungsweiterentwicklungsgesetz (MDWG), BT-Drs. 21/4080 — Datenaustausch
    zwischen Migrationsbehörden, Speicherung biometrischer Daten aus Aufenthaltstitelanträgen, Dokumentenzugriff
    im Visumverfahren. Die BMI-Gesetzgebungsseite war in zwei Versuchen nicht abrufbar (Serverfehler).'
- id: de-stpo-digitale-ermittlungsmassnahmen
  jurisdiktion: de
  kurztitel: StPO-Novelle digitale Ermittlungsmaßnahmen (§§ 98d, 98e StPO-E)
  offizieller_titel: Entwurf eines Gesetzes zur Änderung der Strafprozessordnung - digitale Ermittlungsmaßnahmen
  fundstelle: BT-Drs. 21/6806 vom 01.07.2026
  verfahrensnummer: BT-Drs. 21/6806
  status: verfahren
  status_detail: 'Gesetzentwurf der Bundesregierung, dem Bundestag am 01.07.2026 zugeleitet; Kabinettsfassung
    vom 20.04.2026. Die parlamentarischen Beratungen waren am Stichtag noch nicht abgeschlossen; Ausschussberatungen
    und Anhörungen ließen sich nicht verifizieren.

    Stand 07.09.2026, amtlich belegt: Erste Lesung am 08.07.2026 (KW 28). Nach halbstündiger Aussprache
    wurde BT-Drs. 21/6806 federführend an den Ausschuss für Recht und Verbraucherschutz überwiesen. Gemeinsam
    beraten wurden zwei weitere Regierungsentwürfe zur Stärkung digitaler Ermittlungsbefugnisse — BT-Drs.
    21/6132 (Polizeiarbeit) und BT-Drs. 21/6131 (internationaler Terrorismus), beide federführend Innenausschuss
    — sowie die Anträge BT-Drs. 21/6913 (Bündnis 90/Die Grünen, Rechtsstaatlichkeit und moderne Polizeiarbeit)
    und BT-Drs. 21/6917 (Die Linke, gegen biometrische Massenerkennung), ebenfalls federführend Innenausschuss.
    Eine Beschlussempfehlung liegt nicht vor; eine Anhörung im Rechtsausschuss ist nicht belegt.

    '
  kurzbeschreibung: 'Führt zwei neue strafprozessuale Eingriffsbefugnisse ein, die beide auf automatisierter
    Mustererkennung beruhen. § 98d StPO-E erlaubt den automatisierten biometrischen Abgleich von Bild-
    und Videomaterial mit öffentlich zugänglichen Daten aus dem Internet - faktisch eine Gesichtserkennung
    im offenen Netz. § 98e StPO-E erlaubt die automatisierte verfahrensübergreifende Datenanalyse. Adressat
    sind Staatsanwaltschaften und Polizei als Ermittlungspersonen. Die Befugnisse sind an Katalogtatbestände
    des § 100a Abs. 2 StPO und an Subsidiaritätsklauseln gebunden.

    '
