- id: de-markeng-ki-kennzeichen
  jurisdiktion: de
  kurztitel: Markenrechtliche Benutzung in KI-Ausgaben (MarkenG)
  offizieller_titel: § 14 Gesetz über den Schutz von Marken und sonstigen Kennzeichen
  fundstelle: MarkenG vom 25. Oktober 1994 (BGBl. I S. 3082; 1995 I S. 156; 1996 I S. 682), zuletzt geändert
    durch das Markenrechtsmodernisierungsgesetz vom 11. Dezember 2018 (BGBl. I S. 2357)
  celex: null
  status: anwendbar
  status_detail: In Kraft. Erste deutsche Entscheidung zur markenmäßigen Benutzung in KI-Übersichten 2026.
  inkrafttreten:
    datum: '1995-01-01'
    verifiziert: true
  themenachsen:
  - wettbewerb
  - content
  regelungsschwerpunkte:
  - 'Streitfrage: Ist die Nennung einer Marke in einer KI-generierten Suchzusammenfassung eine Benutzung
    im geschäftlichen Verkehr und markenmäßig? Das LG Berlin II (52 O 62/26 eV) hatte darüber im Zusammenhang
    mit Duftzwillingen zu entscheiden.'
  - § 14 Abs. 2 Nr. 3 MarkenG (Bekanntheitsschutz) ist einschlägig, wenn ein Modell den Ruf einer bekannten
    Marke zur Beschreibung eines Konkurrenzprodukts ausnutzt.
  - § 14 Abs. 7 MarkenG begründet die Haftung des Betriebsinhabers für Angestellte und Beauftragte — dieselbe
    Zurechnungsfrage wie in § 8 Abs. 2 UWG.
  - 'Parallelnorm des Unionsrechts: Art. 9 UMV (VO (EU) 2017/1001).'
