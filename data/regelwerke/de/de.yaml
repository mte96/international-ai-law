  regelungsschwerpunkte:
  - '§ 25a HSOG (Hessen): automatisierte Anwendung zur Datenanalyse; nach der Novelle 2023 gestufte Eingriffsschwellen
    in § 25a Abs. 2 Satz 1 Nr. 1-3; § 25a Abs. 2 Satz 3 erlaubt die Einbeziehung externer Datenquellen.'
  - '§ 23 Abs. 6, 6a, 7 PolG NRW: Grundlage für die Plattform DAR (Datenbankübergreifende Analyse und
    Recherche); die Landesdatenschutzbeauftragte Bettina Gayk hält die Norm für nicht verfassungskonform,
    weil sie den Zweckbindungsgrundsatz durchbricht, selbstlernende Systeme und KI-Training mit echten
    Personendaten zulässt und die Anonymisierungspflicht mit einem Aufwandsvorbehalt aushöhlt.'
  - 'Art. 61a BayPAG: Besondere technische Mittel zur anlassbezogenen Zusammenführung von Daten; erlaubt
    das automatisierte Zusammenführen personenbezogener Daten zur Abwehr von Gefahren für Personen, den
    Bestand des Staates und kritische Infrastrukturen; ausdrückliche Verbote automatisierter Einzelentscheidung
    und selbstlernender Systeme, dazu Personal-, Dokumentations- und Protokollierungspflichten.'
  - '§ 47a Abs. 3 PolG BW: Rechtsgrundlage für die Einbindung externer Datenquellen; Experimentierklausel
    für die Verarbeitung von Polizeidaten zu Entwicklung, Training, Test, Validierung und Monitoring von
    IT-Produkten einschließlich KI-Systemen und KI-Modellen außerhalb rein wissenschaftlicher Forschung.'
  - 'ASOG Berlin (Novelle Dezember 2025): erlaubt der Berliner Polizei, Datenbestände auf einer Plattform
    zusammenzuführen und KI-gestützt auszuwerten; der Senat erklärt, Palantir nicht einsetzen zu wollen,
    die Befugnis besteht aber.'
  - '§ 9b BKAG-E: automatisierte Datenanalyse durch das BKA, repressiv bei Verdacht einer Katalogtat nach
    § 100a StPO, präventiv bei hinreichenden Anhaltspunkten für eine künftige Katalogtat in absehbarer
    Zeit; flankiert von einem Diskriminierungsverbot (§ 9b Abs. 5 BKAG-E), Beschränkungen der Echtzeiteinbindung,
    Schulungs-, Datensicherheits- und Dokumentationspflichten.'
  - '§ 98e StPO-E: automatisierte verfahrensübergreifende Datenanalyse, Eingriffsschwelle schwere Straftat
    nach § 100a Abs. 2 StPO; § 98e Abs. 2 und Abs. 4 StPO-E enthalten Diskriminierungsschutz.'
  - 'Kritik am Diskriminierungsschutz: Die Formel, dass diskriminierende Algorithmen weder herausgebildet
    noch verwendet werden dürfen, wiederholt sich in § 9b Abs. 5, § 22 Abs. 3, § 39 Abs. 5, § 63c Abs.
    5 BKAG-E, §§ 46 Abs. 3, 58b Abs. 5 BPolG-E und § 98e Abs. 2, Abs. 4 StPO-E, bleibt aber abstrakt und
    ohne praktische Handlungsanleitung.'
  - 'Ungelöst nach BVerfG-Maßstab: Die Entwürfe sehen nach der Kritik im Verfassungsblog keine ausreichenden
    Speicherfristen und keine Speicherschwellen für den Grunddatenbestand vor - die dauerhafte Datenzusammenführung
    selbst sei bereits ein eigenständiger Grundrechtseingriff.'
