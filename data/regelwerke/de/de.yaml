- id: de-automatisierte-datenanalyse-polizei
  jurisdiktion: de
  kurztitel: Automatisierte Datenanalyse durch die Polizei
  offizieller_titel: Rechtsgrundlagen der automatisierten Datenanalyse und Datenauswertung in den Polizeigesetzen
    der Länder und im Bundesrecht (Nachfolgeregelungen zu BVerfG, Urteil vom 16.02.2023 - 1 BvR 1547/19,
    1 BvR 2634/20)
  fundstelle: 'Landesrecht: § 25a HSOG (Hessen); § 23 Abs. 6, 6a, 7 PolG NRW; Art. 61a BayPAG; § 47a PolG
    BW; ASOG Berlin (Novelle Dez. 2025). Bundesrecht im Entwurf: § 9b BKAG-E, §§ 46, 58b BPolG-E (BT-Drs.
    21/6132); §§ 98d, 98e StPO-E (BT-Drs. 21/6806).'
  verfahrensnummer: BT-Drs. 21/6132; BT-Drs. 21/6806
  status: teilanwendbar
  status_detail: 'Die Landesregelungen sind in Kraft und werden angewandt (Hessen, Bayern, Nordrhein-Westfalen,
    Baden-Württemberg, Berlin); Hamburg hat nach der Nichtigerklärung des § 49 Abs. 1 Alt. 1 PolDVG keine
    Nachfolgeregelung geschaffen. Die Bundesregelungen (§ 9b BKAG-E, §§ 98d, 98e StPO-E) sind Regierungsentwürfe
    im parlamentarischen Verfahren; die Kabinettsfassungen datieren vom 20.04.2026, die Beratungen sollten
    nach der Sommerpause 2026 beginnen. Gegen die Landesregelungen in Hessen, Bayern und Nordrhein-Westfalen
    sind Verfassungsbeschwerden beim BVerfG anhängig, gegen das Berliner ASOG ein Normenkontrollantrag
    beim VerfGH Berlin.

    '
  kurzbeschreibung: 'Regelungskomplex, der den Polizeibehörden erlaubt, bereits gespeicherte personenbezogene
    Daten datenbankübergreifend automatisiert zusammenzuführen und auszuwerten - in der Praxis überwiegend
    mit der Software Gotham bzw. VeRA des US-Anbieters Palantir. Adressaten sind die Landespolizeien sowie
    künftig BKA, Bundespolizei und Strafverfolgungsbehörden. Das BVerfG hat die automatisierte Datenanalyse
    als eigenständigen Grundrechtseingriff eingeordnet und verlangt je nach Eingriffsintensität eine konkretisierte
    Gefahr bzw. einen auf bestimmte Tatsachen gestützten Verdacht. Sanktioniert wird nicht der Bürger,
    sondern der Staat: Verstöße führen zur Verfassungswidrigkeit der Norm und - wie in Hamburg - zur Nichtigkeit.
    Die Regelungsmodelle der Länder unterscheiden sich erheblich in Textumfang, Eingriffsschwellen und
    Verfahrensvorschriften.

    '
