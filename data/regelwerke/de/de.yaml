- id: de-ki-vo-durchfuehrungsgesetz
  jurisdiktion: de
  kurztitel: KI-VO-Durchführungsgesetz (Mantelgesetz)
  offizieller_titel: Gesetz zur Durchführung der Verordnung (EU) 2024/1689
  fundstelle: BGBl. 2026 I Nr. 233 vom 28.07.2026
  verfahrensnummer: BT-Drs. 21/4594 (Regierungsentwurf, 09.03.2026); Beschlussempfehlung und Bericht des
    Ausschusses für Digitales und Staatsmodernisierung BT-Drs. 21/6407 (10.06.2026)
  status: anwendbar
  status_detail: 'In Kraft seit 29.07.2026. Das Mantelgesetz hat fünf Artikel: Artikel 1 ist das KI-MIG
    (separat erfasst), die Artikel 2 bis 4 ändern das Hinweisgeberschutzgesetz, das Erste Buch Sozialgesetzbuch
    und das Finanzdienstleistungsaufsichtsgesetz, Artikel 5 regelt das Inkrafttreten. Deutschland hat
    damit die EU-Frist für die Behördenbenennung (02.08.2025) um knapp ein Jahr verfehlt.

    '
  kurzbeschreibung: 'Nationales Durchführungsrecht zur KI-Verordnung. Es benennt die zuständigen Marktüberwachungs-
    und notifizierenden Behörden, bündelt die Aufsicht subsidiär bei der Bundesnetzagentur, richtet dort
    ein Koordinierungs- und Kompetenzzentrum (KoKIVO), eine unabhängige KI-Marktüberwachungskammer und
    mindestens ein KI-Reallabor ein und schafft eine zentrale Anlauf- und Beschwerdestelle. Die Geldbußen
    der KI-VO selbst (Art. 99: bis 35 Mio. EUR / 7 % des weltweiten Jahresumsatzes) werden nicht national
    nachgebildet, sondern von der jeweils sachlich zuständigen Behörde verhängt; das KI-MIG ergänzt sie
    um eigene Ordnungswidrigkeiten bis 50.000 EUR (§ 15 KI-MIG). Adressaten sind Anbieter, Betreiber,
    Einführer und Händler von KI-Systemen sowie die aufsichtführenden Behörden.

    '
  inkrafttreten:
    datum: 2026-07-29
    verifiziert: true
    quelle: https://www.bundesnetzagentur.de/1112336
  anwendungsdaten:
  - datum: 2026-06-11
