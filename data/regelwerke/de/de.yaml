  offene_punkte:
  - Erste Lesung und Ausschussüberweisung sind belegt (08.07.2026, Rechtsausschuss federführend). Offen
    bleibt, ob der Rechtsausschuss eine öffentliche Anhörung ansetzt.
  - § 98d StPO-E ist als biometrische Fernidentifizierung zu prüfen; das Verhältnis zu Art. 5 Abs. 1 lit.
    d und Art. 26 Abs. 10 KI-VO sowie zu Anhang III Nr. 6 KI-VO ist im Entwurf offenbar nicht ausdrücklich
    geregelt.
  - Unklar, ob ein Richtervorbehalt und in welcher Ausgestaltung für § 98d StPO-E vorgesehen ist; im abgerufenen
    Auszug nicht erkennbar.
