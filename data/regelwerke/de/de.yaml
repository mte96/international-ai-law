- id: de-gwb-algorithmen-marktmacht
  jurisdiktion: de
  kurztitel: Kartellrecht, algorithmische Kollusion und Plattformmacht (GWB)
  offizieller_titel: §§ 1, 19, 19a Gesetz gegen Wettbewerbsbeschränkungen
  fundstelle: GWB in der Fassung der Bekanntmachung vom 26. Juni 2013 (BGBl. I S. 1750, 3245); § 19a eingefügt
    durch das GWB-Digitalisierungsgesetz vom 18. Januar 2021 (BGBl. I S. 2)
  celex: null
  status: anwendbar
  status_detail: In Kraft. § 19a GWB seit dem 19.01.2021; die Befristung der Verfügungen auf fünf Jahre
    führt ab 2026 zu Verlängerungsverfahren.
  inkrafttreten:
    datum: '2021-01-19'
    verifiziert: true
    fundstelle_norm: GWB-Digitalisierungsgesetz vom 18.01.2021 (BGBl. I S. 2), Inkrafttreten am Tag nach
      der Verkündung.
  themenachsen:
  - wettbewerb
  - marktzugang
  regelungsschwerpunkte:
  - '§ 1 GWB: Klassische Preisabsprachen bleiben auch bei algorithmischer Umsetzung erfasst. Autonome
    algorithmische Kollusion ohne menschliche Abstimmung entzieht sich dem Vereinbarungs- und Abstimmungsbegriff
    — die zentrale Lücke.'
  - § 19 Abs. 2 Nr. 4 GWB nennt den Zugang zu Daten ausdrücklich; die Norm ist der Ansatzpunkt für Zugangsansprüche
    zu Trainingsdaten und Modellschnittstellen.
  - '§ 19a GWB: Die Feststellung überragender marktübergreifender Bedeutung erfasst inzwischen die Anbieter
    der wichtigsten Basismodelle; Abs. 2 Nr. 1 (Selbstbevorzugung) und Nr. 5 (Interoperabilität) sind
    für KI-Dienste einschlägig.'
  - 'Verhältnis zum DMA: § 19a GWB gilt neben der VO (EU) 2022/1925 und reicht sachlich weiter, weil er
    nicht an einen abschließenden Katalog zentraler Plattformdienste gebunden ist.'
