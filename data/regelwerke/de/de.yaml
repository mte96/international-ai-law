- id: de-mstv-medienintermediaere
  jurisdiktion: de
  kurztitel: 'Medienstaatsvertrag: Sorgfaltspflichten und Medienintermediäre'
  offizieller_titel: §§ 18, 19 sowie §§ 91 bis 96 Staatsvertrag zur Modernisierung der Medienordnung in
    Deutschland (Medienstaatsvertrag — MStV)
  fundstelle: Medienstaatsvertrag vom 14. bis 28. April 2020, in Kraft seit dem 7. November 2020; Landesrecht
    in allen sechzehn Ländern, zuletzt geändert durch den Fünften Medienänderungsstaatsvertrag
  celex: null
  status: anwendbar
  status_detail: In Kraft seit dem 07.11.2020. Länderrecht; die Anwendung auf generative Suchassistenten
    ist ungeklärt.
  inkrafttreten:
    datum: '2020-11-07'
    verifiziert: true
  themenachsen:
  - content
  - wettbewerb
  - governance
  regelungsschwerpunkte:
  - '§ 19 MStV: Journalistische Sorgfaltspflichten gelten für journalistisch-redaktionell gestaltete Telemedien.
    Ob KI-generierte Nachrichtenzusammenfassungen und Suchübersichten darunter fallen, ist die Kernfrage
    der deutschen Debatte um AI Overviews.'
  - § 93 MStV verpflichtet Medienintermediäre, die Kriterien für Zugang, Aggregation, Selektion und Präsentation
    von Inhalten sowie deren Gewichtung leicht wahrnehmbar, unmittelbar erreichbar und ständig verfügbar
    offenzulegen — eine Transparenzpflicht mit größerer Reichweite als Art. 27 DSA.
  - § 94 MStV verbietet die unbillige systematische Behinderung journalistisch-redaktioneller Angebote;
    die Norm ist der medienrechtliche Gegenpart zur kartellrechtlichen Selbstbevorzugung.
  - § 91 Abs. 2 MStV nimmt Intermediäre mit weniger als einer Million monatlichen Nutzern aus; die Schwelle
    entscheidet über die Erfassung KI-gestützter Assistenten.
  - 'Zuständigkeit: die Landesmedienanstalten, nicht die Bundesnetzagentur — Reibungsfläche zur KI-Aufsicht
    nach dem KI-MIG.'
