- id: de-ki-justiz
  jurisdiktion: de
  kurztitel: KI in der Justiz (Bund-Länder-Vorhaben)
  offizieller_titel: 'Digitalisierungsinitiative für die Justiz und Vorhaben der Länder zum Einsatz künstlicher
    Intelligenz in der Rechtspflege

    '
  fundstelle: Keine — kein Bundesgesetz zum KI-Einsatz in der Justiz nachweisbar
  verfahrensnummer: null
  status: idee
  status_detail: 'SCHWACHE QUELLENLAGE. Ein Bundesgesetz oder ein veröffentlichter Referentenentwurf speziell
    zum Einsatz von KI in der Justiz war nicht auffindbar. Das BMJV führt die Digitalisierung der Justiz
    und die Digitalisierungsinitiative als Themen, ohne dort ein KI-Gesetzgebungsvorhaben auszuweisen.
    Die praktische Entwicklung findet auf Länderebene in Pilotprojekten statt und wird fachpolitisch diskutiert
    (u.a. Veranstaltungsreihe "Justiz im Dialog" des Deutschen Richterbundes). Dieser Eintrag ist bewusst
    als Beobachtungsposten angelegt, nicht als belegtes Regelwerk.

    '
  kurzbeschreibung: 'Der Einsatz von KI in der deutschen Justiz bewegt sich in einem normativen Vakuum:
    Es gibt keine dem § 35a VwVfG entsprechende Rechtsgrundlage für gerichtliche Entscheidungen, das Prinzip
    des gesetzlichen Richters (Art. 101 Abs. 1 Satz 2 GG) und der Anspruch auf rechtliches Gehör (Art.
    103 Abs. 1 GG) setzen enge Grenzen. Zugleich stuft Anhang III Nr. 8 lit. a KI-VO Systeme, die Justizbehörden
    bei Sachverhaltsermittlung, Rechtsauslegung oder Rechtsanwendung unterstützen, als Hochrisiko-KI ein
    — mit Anwendungsbeginn 02.12.2027. Die Länder erproben unterdessen Assistenzsysteme für Massenverfahren
    und Aktenauswertung.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.bmjv.de/DE/themen/digitales/digitalisierung_justiz/digitalisierung_justiz_node.html
  anwendungsdaten:
  - datum: 2027-12-02
    was_gilt: 'Anwendungsbeginn der Hochrisiko-Pflichten für Anhang III Nr. 8 (Rechtspflege und demokratische
      Prozesse) nach der durch VO (EU) 2026/1744 geänderten Fassung der KI-VO. Bis dahin muss geklärt
      sein, wer Anbieter und wer Betreiber justizieller KI-Systeme ist.

      '
    verifiziert: false
    quelle: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX%3A02024R1689-20260727
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - berufsrecht
  - governance
  regelungsschwerpunkte:
  - 'Verfassungsrechtlicher Rahmen: Art. 92 GG (rechtsprechende Gewalt den Richtern anvertraut), Art.
    97 Abs. 1 GG (richterliche Unabhängigkeit), Art. 101 Abs. 1 Satz 2 GG (gesetzlicher Richter), Art.
    103 Abs. 1 GG (rechtliches Gehör). Sie schließen eine KI-gestützte Entscheidungsfindung ohne substanzielle
    richterliche Verantwortung aus; Assistenzsysteme zur Aktenstrukturierung und Recherche sind davon
    nicht betroffen.'
  - Anhang III Nr. 8 lit. a KI-VO erfasst Systeme, die Justizbehörden bei der Ermittlung und Auslegung
    von Sachverhalten und Rechtsvorschriften und bei der Rechtsanwendung unterstützen — nicht rein administrative
    Hilfsmittel. Erwägungsgrund 61 KI-VO nimmt Verwaltungstätigkeiten ohne Auswirkung auf die Rechtspflege
    aus.
  - Nach dem KI-MIG obliegt die Marktüberwachung im Justizbereich der unabhängigen KI-Marktüberwachungskammer
    bei der Bundesnetzagentur; Art. 74 Abs. 8 KI-VO verlangt für Anhang III Nr. 8 eine unabhängige Behörde.
  - Art. 27 KI-VO verlangt von Behörden als Betreibern eine Grundrechte-Folgenabschätzung; ihre Unterlassung
    ist nach § 15 KI-MIG mit bis zu 50.000 EUR bußgeldbewehrt. Das trifft Justizverwaltungen unmittelbar.
  - 'Länderprojekte (unverifiziert, aus Vorwissen): Assistenzsysteme für Massenverfahren an Oberlandesgerichten,
    Strukturierung umfangreicher Verfahrensakten, Anonymisierung von Entscheidungen für Veröffentlichungsdatenbanken.
    Namen, Träger und Stand sind hier nicht belegt und vor Übernahme zu prüfen.'
  dokumente:
  - datum: 2026-08-27
    typ: uebersicht
    titel: Digitalisierung der Justiz (Themenseite)
    url: https://www.bmjv.de/DE/themen/digitales/digitalisierung_justiz/digitalisierung_justiz_node.html
    sprache: de
    urheber: Bundesministerium der Justiz und für Verbraucherschutz
    verifiziert: true
    notiz: Belegt die Themenstruktur des BMJV; ein KI-Gesetzgebungsvorhaben für die Justiz ist dort nicht
      ausgewiesen.
  - datum: 2026-08-27
    typ: bericht
    titel: 'KI in der Justiz: Fluch und / oder Segen? (Justiz im Dialog, Potsdam)'
    url: https://www.drb.de/newsroom/presse-mediencenter/nachrichten-auf-einen-blick/nachricht/news/ki-in-der-justiz-fluch-und-oder-segen
    sprache: de
    urheber: Deutscher Richterbund
    verifiziert: false
    notiz: Beleg für die fachpolitische Debatte; Datum der Veranstaltung nicht ausgewiesen.
  offene_punkte:
  - 'ZU PRÜFEN: Existenz und Stand eines Gesetzes bzw. Entwurfs zum Einsatz von KI in der Justiz. Nicht
    auffindbar; das Suchbudget war erschöpft, bevor eine gezielte Recherche möglich war.'
  - 'ZU PRÜFEN: Namen, Träger und Stand der Länderprojekte (u.a. OLG-Assistenzsysteme) sowie Beschlüsse
    der Justizministerkonferenz zu KI.'
  - 'Ungeklärt: Ist ein Gericht, das ein selbst entwickeltes Assistenzsystem einsetzt, Anbieter im Sinne
    des Art. 3 Nr. 3 KI-VO — mit den vollen Hochrisiko-Pflichten?'
  - Kein Verfahrensrecht zur Offenlegung KI-gestützter Vorarbeiten gegenüber den Verfahrensbeteiligten
    (Art. 103 Abs. 1 GG).
