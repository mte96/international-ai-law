    was_gilt: BGH, Verhandlung I ZR 226/25 bis I ZR 230/25 zum Umfang des Auskunftsanspruchs über die
      Score-Logik.
    verifiziert: true
    quelle: https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2026/2026052.html
  - datum: 2026-10-21
    was_gilt: Angekündigter Verkündungstermin des BGH in den Verfahren I ZR 226/25 bis I ZR 230/25.
