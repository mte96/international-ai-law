  kurztitel: DSK-Orientierungshilfen zu KI und BfDI-Positionen
  offizieller_titel: 'Orientierungshilfen der Konferenz der unabhängigen Datenschutzaufsichtsbehörden
    des Bundes und der Länder (DSK) zu Künstlicher Intelligenz sowie Konsultationsverfahren und Positionspapiere
    der Bundesbeauftragten für den Datenschutz und die Informationsfreiheit (BfDI)

    '
  fundstelle: Keine amtliche Fundstelle — Verwaltungsverlautbarungen ohne Rechtsnormqualität
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Drei DSK-Orientierungshilfen zu KI liegen vor (06.05.2024, Juni 2025, Oktober 2025),
    dazu ein abgeschlossenes BfDI-Konsultationsverfahren zu KI-Modellen und personenbezogenen Daten (10.07.
    bis 31.08.2025) mit Auswertungsbericht. Keine Bindungswirkung; § 16a BDSG-E hätte die DSK institutionalisiert,
    ohne ihre Beschlüsse verbindlich zu machen. Faktisch bestimmen die Papiere die Prüfmaßstäbe der deutschen
    Aufsichtsbehörden.

    '
  kurzbeschreibung: 'Die deutschen Datenschutzaufsichtsbehörden haben ihre Erwartungen an KI-Systeme in
    drei Stufen konkretisiert: eine allgemeine Orientierungshilfe zu Auswahl und Einsatz von KI-Anwendungen
    (2024), eine Handreichung zu technischen und organisatorischen Maßnahmen bei Entwicklung und Betrieb
    (2025) und eine Spezialbetrachtung zu RAG-Architekturen (2025). Die BfDI hat parallel die Frage konsultiert,
    ob und wann trainierte Modelle selbst personenbezogene Daten enthalten — die Streitfrage hinter Löschungs-
    und Auskunftsansprüchen gegen Modellanbieter. Adressaten sind Verantwortliche und Auftragsverarbeiter;
    die Sanktion ergibt sich nicht aus den Papieren, sondern aus Art. 83 DSGVO.

    '
