- id: de-bdsg-scoring
  jurisdiktion: de
  kurztitel: Scoring und automatisierte Entscheidungen (§ 31 BDSG, § 37a BDSG-E, SCHUFA-Rechtsprechung)
  offizieller_titel: '§ 31 Bundesdatenschutzgesetz (Schutz des Wirtschaftsverkehrs bei Scoring und Bonitätsauskünften);
    § 37a BDSG-E (Scoring) im Entwurf eines Ersten Gesetzes zur Änderung des Bundesdatenschutzgesetzes

    '
  fundstelle: '§ 31 BDSG: BGBl. I 2017 S. 2097; § 37a BDSG-E: nicht verkündet'
  verfahrensnummer: BT-Drs. 20/10859 (Regierungsentwurf, 27.03.2024)
  status: entwurf
  status_detail: 'WIDERSPRÜCHLICHE QUELLENLAGE. Der Regierungsentwurf eines Ersten Gesetzes zur Änderung
    des BDSG (BT-Drs. 20/10859 vom 27.03.2024) enthielt § 37a BDSG-E als erste ausdrückliche nationale
    Rechtsgrundlage für Scoring nach EuGH C-634/21. Ein Teil der Sekundärliteratur meldet, die Norm sei
    in Kraft (Verweise auf eine Fassung mit Stand 20.11.2026 und eine Umsetzungsfrist 30.06.2026), ein
    anderer Teil hält ausdrücklich fest, § 37a BDSG sei "noch nicht in Kraft getreten". Ein Abruf der
    Norm bei dejure.org lieferte 404 — ein Indiz dafür, dass sie noch nicht gilt. Ohne Einsicht in das
    BGBl nicht auflösbar; hier als `entwurf` geführt.

    '
  kurzbeschreibung: 'Scoring ist der praktisch bedeutsamste Anwendungsfall automatisierter Entscheidungsfindung
    in Deutschland und der Testfall für Art. 22 DSGVO. Der EuGH hat mit Urt. v. 07.12.2023 – C-634/21
    (SCHUFA Holding) entschieden, dass bereits die Errechnung eines Wahrscheinlichkeitswerts eine automatisierte
    Entscheidung im Sinne des Art. 22 Abs. 1 DSGVO ist, wenn Dritte maßgeblich auf ihn abstellen. Der
    BGH klärt derzeit, wie weit der Auskunftsanspruch nach Art. 15 Abs. 1 lit. h DSGVO über die Logik
    des Scorings reicht (I ZR 226/25 bis I ZR 230/25, Verhandlung 18.06.2026, Verkündung angekündigt für
    21.10.2026). § 37a BDSG-E soll Scoring national legitimieren und zugleich begrenzen.

    '
  inkrafttreten: null
  anwendungsdaten:
  - datum: 2023-12-07
    was_gilt: 'EuGH C-634/21 (SCHUFA Holding): Errechnung eines Score-Werts ist automatisierte Einzelentscheidung
      nach Art. 22 DSGVO, wenn der Dritte maßgeblich darauf abstellt; grundsätzlich verboten ohne Rechtsgrundlage
      oder ausdrückliche Einwilligung.'
    verifiziert: true
    quelle: https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2026/2026052.html
  - datum: 2024-03-27
