  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-finanz
  - governance
  regelungsschwerpunkte:
  - '§ 37a BDSG-E: erste ausdrückliche nationale Rechtsgrundlage für automatisierte Bonitäts- und Wahrscheinlichkeitsbewertungen.
    Vorgesehen sind: nachweisbare statistische Relevanz der verwendeten Merkmale, Verbot besonderer Kategorien
    personenbezogener Daten nach Art. 9 DSGVO, Auskunft über die wesentlichen Faktoren, Einschränkung
    der Verwendung von Anschriftendaten (Geo-Scoring).'
  - '§ 16a BDSG-E: gesetzliche Verankerung der Datenschutzkonferenz. Eine Regelung zur Bindungswirkung
    der DSK-Beschlüsse wurde wegen verfassungsrechtlicher Bedenken (Mischverwaltung) nicht aufgenommen
    — DSK-Beschlüsse bleiben rechtlich unverbindlich.'
  - 'BGH I ZR 226/25 bis I ZR 230/25: Kernfrage ist, ob Art. 15 Abs. 1 lit. h DSGVO einen Anspruch auf
    Offenlegung der am stärksten gewichteten Score-Kriterien, der Prognosegüte und der einbezogenen Daten
    gibt — und ob dieser Anspruch schon bei bloßer Score-Berechnung besteht oder erst bei tatsächlicher
    Vertragsablehnung. Das Berufungsgericht (OLG Dresden) hatte weitgehend zugunsten der Betroffenen entschieden;
    der Senat hat in der Verhandlung eine Aufhebung angedeutet.'
  - EuGH C-203/22 (Dun & Bradstreet Austria, Urt. v. 27.02.2025) verlangt eine Erläuterung des Verfahrens
    und der Grundsätze in verständlicher Form — nicht die Offenlegung des Algorithmus. Die deutsche Linie
    muss sich daran messen lassen.
  - 'Relevanz für KI: Scoring ist der Fall, an dem sich die Reichweite von Art. 22 DSGVO und die Transparenzanforderungen
    an intransparente Modelle entscheiden. Die Antworten strahlen auf jede risikobasierte KI-Anwendung
    aus, die eine Person bewertet — Kreditvergabe, Versicherung, Betrugserkennung, Personalauswahl.'
  - Anhang III Nr. 5 lit. b KI-VO stuft KI-Systeme zur Bewertung der Kreditwürdigkeit natürlicher Personen
    als Hochrisiko ein; die BaFin ist insoweit sektorale Marktüberwachungsbehörde.
