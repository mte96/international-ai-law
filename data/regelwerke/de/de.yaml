- id: de-bgb-agb-kaufrecht-ki
  jurisdiktion: de
  kurztitel: AGB-Kontrolle und Mängelgewährleistung bei KI-Verträgen (BGB)
  offizieller_titel: §§ 305 bis 310, 434 Bürgerliches Gesetzbuch
  fundstelle: BGB in der Fassung der Bekanntmachung vom 2. Januar 2002 (BGBl. I S. 42, 2909; 2003 I S.
    738); §§ 434 ff. in der Fassung des Gesetzes zur Regelung des Verkaufs von Sachen mit digitalen Elementen
    vom 25. Juni 2021 (BGBl. I S. 2133)
  celex: null
  status: anwendbar
  status_detail: In Kraft. Kein KI-spezifischer Anpassungsbedarf normiert; die Anwendung auf probabilistische
    Systeme ist ungeklärt.
  inkrafttreten:
    datum: '2022-01-01'
    verifiziert: true
    fundstelle_norm: §§ 434 ff. in der Fassung vom 25.06.2021, anwendbar auf Verträge ab dem 01.01.2022.
  themenachsen:
  - vertrag
  - haftung
  regelungsschwerpunkte:
  - '§ 307 Abs. 1 Satz 2 BGB: Das Transparenzgebot ist der praktisch schärfste Angriffspunkt gegen Anbieter-AGB,
    die Modellwechsel, Leistungsänderungen und Trainingsnutzung von Eingaben offenlassen.'
  - '§ 307 Abs. 2 Nr. 2 BGB: Haftungsfreizeichnungen für Halluzinationen gefährden den Vertragszweck,
    wenn der Dienst gerade als Informationsquelle beworben wird.'
  - '§ 434 Abs. 3 BGB: Die objektiven Anforderungen knüpfen an die übliche Beschaffenheit vergleichbarer
    Sachen an — bei generativen Systemen ist gerade streitig, was üblich ist.'
  - 'Abgrenzung: Für Verbraucherverträge über digitale Produkte gelten vorrangig die §§ 327 ff. BGB (eigenes
    Regelwerk de-bgb-digitale-produkte); die §§ 305 ff. BGB gelten daneben und auch im B2B-Verkehr.'
