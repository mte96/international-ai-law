- id: de-agg-algorithmische-diskriminierung
  jurisdiktion: de
  kurztitel: AGG und algorithmische Benachteiligung
  offizieller_titel: §§ 1, 3, 7, 22 Allgemeines Gleichbehandlungsgesetz
  fundstelle: AGG vom 14. August 2006 (BGBl. I S. 1897), zuletzt geändert durch Gesetz vom 19. Dezember
    2022 (BGBl. I S. 2510)
  celex: null
  status: anwendbar
  status_detail: In Kraft seit dem 18.08.2006. Reformbedarf für algorithmische Systeme ist gutachtlich
    festgestellt, aber nicht umgesetzt.
  inkrafttreten:
    datum: '2006-08-18'
    verifiziert: true
  themenachsen:
  - grundrechte
  - arbeit
  regelungsschwerpunkte:
  - '§ 3 AGG: Die Unterscheidung von unmittelbarer und mittelbarer Benachteiligung passt nicht auf statistisch
    trainierte Systeme, die geschützte Merkmale über Proxy-Variablen rekonstruieren, ohne sie zu verarbeiten.'
  - '§ 22 AGG: Die Beweislastumkehr setzt Indizien voraus, die der Betroffene beweisen muss. Ohne Einsicht
    in die Systemlogik ist diese Hürde praktisch nicht zu nehmen — der Befund des Gutachtens von Spiecker
    gen. Döhmann und Towfigh für die Antidiskriminierungsstelle des Bundes.'
  - 'Adressatenlücke: Das AGG verpflichtet Arbeitgeber und Anbieter von Massengeschäften, nicht die Hersteller
    der eingesetzten Systeme.'
  - 'Verhältnis zur KI-VO: Art. 10 Abs. 2 und Abs. 5 KI-VO adressieren Verzerrungen im Trainingsdatensatz,
    begründen aber keine individuellen Ansprüche; das AGG begründet Ansprüche, erreicht aber den Hersteller
    nicht.'
  dokumente:
