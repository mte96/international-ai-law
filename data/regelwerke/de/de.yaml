  regelungsschwerpunkte:
  - '§ 201b StGB-E (Bundesratsfassung): ''Wer das Persönlichkeitsrecht verletzt, indem er einen mit computertechnischen
    Mitteln hergestellten oder veränderten Medieninhalt, der den Anschein einer wirklichkeitsgetreuen
    Bild- oder Tonaufnahme erweckt, einer dritten Person zugänglich macht'' — Freiheitsstrafe bis zwei
    Jahre; Qualifikation bis fünf Jahre bei Zugänglichmachen gegenüber der Öffentlichkeit oder bei Inhalten
    aus dem höchstpersönlichen Lebensbereich. Ausnahme: Wahrnehmung berechtigter Interessen (Kunst, Wissenschaft,
    Berichterstattung).'
  - '§ 201b StGB-E (BMJV-Fassung): enger gefasst auf Inhalte, die geeignet sind, dem Ansehen erheblich
    zu schaden; Strafrahmen bis zwei Jahre, subsidiär gegenüber schärferen Vorschriften. Erfasst auch
    nicht-sexualisierte synthetische Medien, die reale Ereignisse vorzutäuschen scheinen.'
  - '§ 184k StGB-E: Erweiterung auf die Herstellung UND Verbreitung sexualisierter Deepfakes ohne Einwilligung
    sowie auf voyeuristische Aufnahmen in Sauna und Umkleide; bis zwei Jahre.'
  - '§ 202e StGB-E: digitales Stalking / heimliche Überwachung mittels Spyware oder Standortverfolgung;
    bis zwei Jahre; erfordert die Feststellung wahrscheinlicher erheblicher Nachteile.'
  - 'Zivilrechtlicher Teil des GgdG: gerichtliches Verfahren zur Ermittlung anonymer Accountinhaber, richterlich
    angeordnete Accountsperre, Prozessstandschaft für gemeinnützige Organisationen.'
  - 'STREITPUNKT: Der Entwurf verpflichtet Internetzugangsanbieter zur dreimonatigen Speicherung von IP-Adressen.
    Die Gesellschaft für Freiheitsrechte lehnt das als anlasslose Massenspeicherung ab; die Vereinbarkeit
    mit der EuGH-Rechtsprechung zur Vorratsdatenspeicherung ist bestritten. HateAid begrüßt die zivilrechtlichen
    Instrumente, kritisiert aber die Kostenlast für Betroffene.'
  - 'BRAK-Kritik (Oktober 2024) am Bundesratsentwurf: Unbestimmtheit des Merkmals ''Persönlichkeitsrecht'';
    Vorschlag, statt eines neuen Tatbestands § 201a StGB zu ergänzen und auf die Eignung zur erheblichen
    Ansehensschädigung abzustellen. Die damalige Bundesregierung hielt die bestehenden Vorschriften für
    ausreichend und warnte vor Konflikten mit Art. 103 Abs. 2 GG.'
  - Auslöser der politischen Beschleunigung 2026 war ein öffentlich gewordener Fall nicht-einvernehmlicher
    Deepfakes einer prominenten Betroffenen.
