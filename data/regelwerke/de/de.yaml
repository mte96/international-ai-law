- id: de-zpo-ki-prozessrecht
  jurisdiktion: de
  kurztitel: Zivilprozessrecht und KI-erzeugte Schriftsätze (ZPO)
  offizieller_titel: §§ 138, 287, 294, 522 Zivilprozessordnung
  fundstelle: ZPO in der Fassung der Bekanntmachung vom 5. Dezember 2005 (BGBl. I S. 3202; 2006 I S. 431;
    2007 I S. 1781)
  celex: null
  status: anwendbar
  status_detail: In Kraft. Kein KI-spezifisches Prozessrecht; Offenlegungs- und Verifikationspflichten
    werden diskutiert, sind aber nicht normiert.
  inkrafttreten:
    datum: '1879-10-01'
    verifiziert: false
    fundstelle_norm: Maßgeblich ist die Neubekanntmachung vom 05.12.2005.
  themenachsen:
  - berufsrecht
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - '§ 138 Abs. 1 ZPO: Die Wahrheitspflicht bezieht sich auf tatsächliche Umstände. Ob sie auch erfundene
    Rechtsprechungszitate erfasst, ist die offene Frage der deutschen Halluzinationsfälle; das KG Berlin
    (17 WF 144/25) löst sie über das Berufsrecht.'
  - '§ 522 Abs. 2 ZPO: Der Zurückweisungsbeschluss ist der prozessuale Weg, auf dem Berufungsgerichte
    offensichtlich aussichtslose, auf erfundene Fundstellen gestützte Rechtsmittel erledigen.'
  - '§ 294 ZPO: Im einstweiligen Verfügungsverfahren ist die eidesstattliche Versicherung das Mittel,
    mit dem der menschliche Schöpfungsanteil an einem teilweise KI-erzeugten Werk glaubhaft gemacht wird
    (LG Frankfurt am Main, 2-06 O 401/25).'
  - § 287 ZPO trägt die Schätzung der Geldentschädigung für KI-generierte Persönlichkeitsrechtsverletzungen.
  - Keine Vorschrift verpflichtet Parteien oder Bevollmächtigte, den Einsatz generativer Systeme offenzulegen
    — anders als in mehreren Common-Law-Jurisdiktionen.
