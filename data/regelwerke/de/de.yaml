  themenachsen:
  - haftung
  - marktzugang
  - vertrag
  regelungsschwerpunkte:
  - 'Software als Produkt: erfasst werden Betriebssysteme, Firmware, Anwendungen und KI-Systeme, unabhängig
    von der Art der Bereitstellung oder Nutzung; Cloud-Bereitstellung eingeschlossen. Ausnahme nur für
    nicht kommerzielle Open-Source-Software.'
  - '§ 19 ProdHaftG-E: gerichtliche Offenlegungsanordnung. Der Beklagte muss relevante Beweismittel offenlegen,
    wenn der Kläger die Plausibilität seines Anspruchs hinreichend dargelegt hat. Die DIHK rügt fehlende
    Verfahrensschutzmechanismen für Geschäftsgeheimnisse.'
  - '§ 20 ProdHaftG-E: gesetzliche Vermutungen. Fehlervermutung bei Nichtbeachtung verbindlicher Sicherheitsanforderungen
    oder offensichtlicher Funktionsstörung; bei technischer oder wissenschaftlicher Komplexität genügt
    Wahrscheinlichkeit statt Vollbeweis. Das ist die für KI-Schäden entscheidende Beweiserleichterung,
    nachdem die eigenständige KI-Haftungsrichtlinie (AILD) von der Kommission zurückgezogen wurde.'
  - Erheblich veränderte Produkte (Upcycling, Refurbishing, wesentliche Software-Updates) begründen eine
    neue Herstellerhaftung.
  - Haftung von Akteuren der Lieferkette (Bevollmächtigte, Einführer, Fulfilment-Dienstleister, Online-Plattformen),
    wenn der Hersteller außerhalb der Union sitzt.
  - 'Anhörungskritik: DIHK sieht Überschießen über die Richtlinienvorgaben und Wettbewerbsnachteile; vzbv
    hält den vorprozessualen Offenlegungsmechanismus für unzureichend und fordert einen Entschädigungsfonds;
    die rechtswissenschaftlichen Sachverständigen rügen die systematische Einordnung ins Zivilrecht, die
    Unschärfe der Softwaredefinition und die Open-Source-Ausnahme.'
