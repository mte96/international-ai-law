- id: de-ki-migrationsverwaltungsgesetz
  jurisdiktion: de
  kurztitel: KI-Migrationsverwaltungsgesetz (KIMVG)
  offizieller_titel: Entwurf eines Gesetzes zum Einsatz künstlicher Intelligenz in der Migrationsverwaltung
    (KI-Migrationsverwaltungsgesetz - KIMVG)
  fundstelle: BR-Drs. 452/26 vom 14.08.2026; Referentenentwurf des BMI vom 25.06.2026. Ändert das Asylgesetz
    (Art. 1) und das Aufenthaltsgesetz (Art. 2).
  verfahrensnummer: BR-Drs. 452/26
  status: verfahren
  status_detail: 'Regierungsentwurf. Referentenentwurf des Bundesministeriums des Innern vom 25.06.2026,
    Kabinettsbeschluss am 29.07.2026, Eingang beim Bundesrat am 14.08.2026 (BR-Drs. 452/26), dort zunächst
    nur mit dem Status "Eingegangen", ohne angesetzte Beratung. Die Beratungen im Bundestag sollten nach
    der Sommerpause 2026 beginnen. Das Gesetz ist noch nicht in Kraft.

    '
  kurzbeschreibung: 'Erstes deutsches Fachgesetz, das den Einsatz künstlicher Intelligenz in einem behördlichen
    Massenverfahren ausdrücklich und bereichsspezifisch regelt. Adressaten sind das BAMF, die Ausländerbehörden,
    das Bundesverwaltungsamt, die Auslandsvertretungen, die Bundes- und Landespolizeien, die Bundesagentur
    für Arbeit und die Nachrichtendienste, soweit sie mit Migrationsangelegenheiten befasst sind. Das
    Gesetz erlaubt drei Dinge: die Nutzung personenbezogener Asyl- und Aufenthaltsdaten zum Training,
    zur Validierung und zum Test automatisierter Anwendungen, ein automatisiertes Verfahrensmonitoring
    zur Mustererkennung im Verfahrensverlauf und den automatisierten Abgleich mit öffentlich zugänglichen
    Internetdaten bei begründeten Zweifeln an den Angaben der Antragsteller. Eine eigene Bußgeldsanktion
    enthält es nicht; die Steuerung erfolgt über Erforderlichkeits-, Begründungs- und Nachprüfungspflichten
    sowie das Gebot manueller Auswertung der Abgleichsergebnisse.

    '
