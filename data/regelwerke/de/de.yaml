- id: de-betrvg-ki-mitbestimmung
  jurisdiktion: de
  kurztitel: Betriebliche Mitbestimmung beim KI-Einsatz (BetrVG)
  offizieller_titel: '§§ 80 Abs. 3, 87 Abs. 1 Nr. 6, 90, 95 Abs. 2a Betriebsverfassungsgesetz in der Fassung
    des Betriebsrätemodernisierungsgesetzes vom 14. Juni 2021

    '
  fundstelle: BGBl. I 2021 S. 1762 (Betriebsrätemodernisierungsgesetz)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Die KI-spezifischen Ergänzungen des BetrVG gelten seit dem 18.06.2021. Es gibt bislang
    keine höchstrichterliche BAG-Entscheidung, die ausdrücklich den Einsatz generativer KI unter § 87
    Abs. 1 Nr. 6 BetrVG fasst; maßgeblich ist weiterhin ArbG Hamburg, Beschl. v. 16.01.2024 – 24 BVGa
    1/24 (ChatGPT ohne Arbeitgeberzugriff nicht mitbestimmungspflichtig). Sekundärquellen behaupten für
    2026 eine verschärfende BAG-Rechtsprechung; ein Aktenzeichen ließ sich nicht verifizieren.

    '
  kurzbeschreibung: 'Das BetrVG enthält seit 2021 drei ausdrückliche KI-Bezüge: § 80 Abs. 3 Satz 2 fingiert
    die Erforderlichkeit eines Sachverständigen, wenn der Betriebsrat die Einführung oder Anwendung von
    KI zu beurteilen hat; § 90 Abs. 1 Nr. 3 erstreckt die Unterrichtungs- und Beratungspflicht auf Arbeitsverfahren
    und Arbeitsabläufe einschließlich KI; § 95 Abs. 2a stellt klar, dass Auswahlrichtlinien auch dann
    mitbestimmt sind, wenn sie ausschließlich oder mit Hilfe von KI erstellt werden. Praktisch am wichtigsten
    bleibt § 87 Abs. 1 Nr. 6 BetrVG: technische Einrichtungen, die zur Überwachung von Verhalten oder
    Leistung objektiv geeignet sind, sind erzwingbar mitbestimmt — auf eine Überwachungsabsicht kommt
    es nicht an. Rechtsfolge fehlender Mitbestimmung ist ein Unterlassungsanspruch und ein arbeitsrechtliches
    Verwertungsverbot.

    '
  inkrafttreten:
    datum: 2021-06-18
    verifiziert: true
    quelle: https://www.bmas.de/DE/Service/Gesetze-und-Gesetzesvorhaben/betriebsraetemodernisierungsgesetz.html
    fundstelle_norm: 'Art. 3 Betriebsrätemodernisierungsgesetz: "Dieses Gesetz tritt am Tag nach der Verkündung
      in Kraft." (Wortlaut nachgewiesen in BT-Drs. 19/28899). Verkündung am 17.06.2021, BGBl. I 2021 S.
      1762 (Angabe des BMAS) — daher Inkrafttreten am 18.06.2021.'
  anwendungsdaten:
  - datum: 2024-01-16
    was_gilt: 'ArbG Hamburg, Beschl. v. 16.01.2024 – 24 BVGa 1/24: Die bloße Erlaubnis, ChatGPT über private
      Accounts zu nutzen, ist mitbestimmungsfrei, wenn der Arbeitgeber keine eigene KI-Infrastruktur betreibt
      und keinen Zugriff auf Nutzungsdaten hat.'
    verifiziert: true
    quelle: https://www.bitkom.org/sites/main/files/2026-02/bitkom-leitfaden-kuenstliche-intelligenz-und-mitbestimmung.pdf
  - datum: 2024-12-05
    was_gilt: 'LAG Hessen, Beschl. v. 05.12.2024 – 5 TaBV 4/24: Datenschutzrechtliche Fragen unterliegen
      nicht der erzwingbaren Mitbestimmung nach § 87 Abs. 1 Nr. 6 BetrVG.'
    verifiziert: true
    quelle: https://www.bitkom.org/sites/main/files/2026-02/bitkom-leitfaden-kuenstliche-intelligenz-und-mitbestimmung.pdf
  themenachsen:
  - arbeit
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - '§ 87 Abs. 1 Nr. 6 BetrVG: objektive Eignung zur Verhaltens- oder Leistungsüberwachung genügt. Für
    KI-Systeme mit serverseitigem Logging, Prompt-Historie oder Nutzungsauswertung ist die Mitbestimmung
    damit praktisch immer eröffnet; die Hamburger Entscheidung betrifft den Sonderfall der Nutzung über
    private Accounts ohne Arbeitgeberzugriff.'
  - '§ 80 Abs. 3 Satz 2 BetrVG: Bei der Einführung oder Anwendung von KI gilt die Hinzuziehung eines Sachverständigen
    als erforderlich — ohne die sonst notwendige Erforderlichkeitsprüfung. Der Betriebsrat muss sich nicht
    auf eigene KI-Kenntnisse verweisen lassen. In der Gesetzesbegleitdokumentation wird ein Verhandlungsanhaltswert
    von 833 EUR Tagessatz genannt.'
  - '§ 90 Abs. 1 Nr. 3 BetrVG: rechtzeitige Unterrichtung über die Planung von Arbeitsverfahren und -abläufen
    einschließlich KI, mit den erforderlichen Unterlagen, und Beratung. Vor der Einführung, nicht danach.'
  - '§ 95 Abs. 2a BetrVG: Mitbestimmung bei Auswahlrichtlinien gilt auch, wenn diese ausschließlich oder
    mit Hilfe von KI erstellt werden (Einstellung, Versetzung, Umgruppierung, Kündigung).'
  - Flankierend Art. 26 Abs. 7 KI-VO (Informationspflicht gegenüber Arbeitnehmervertretungen) und Art.
    4 KI-VO (KI-Kompetenz, seit 02.02.2025) — Letzteres begründet Schulungsansprüche, die über § 37 Abs.
    6 BetrVG auch den Betriebsrat erfassen.
  - 'Typische Regelungsgegenstände einer KI-Betriebsvereinbarung: zugelassene Systeme, Zweckbindung, Verbot
    der Leistungs- und Verhaltenskontrolle, Protokollierung und Löschfristen, Human-in-the-Loop bei personellen
    Maßnahmen, Schulung, Änderungsverfahren bei Modellwechsel.'
  dokumente:
  - datum: 2026-02-01
    typ: leitlinie
    titel: Bitkom-Leitfaden Künstliche Intelligenz und Mitbestimmung
    url: https://www.bitkom.org/sites/main/files/2026-02/bitkom-leitfaden-kuenstliche-intelligenz-und-mitbestimmung.pdf
    sprache: de
    urheber: Bitkom e.V.
    verifiziert: true
    notiz: Systematische Darstellung der Mitbestimmungstatbestände mit Rechtsprechungsnachweisen; Arbeitgeberperspektive.
