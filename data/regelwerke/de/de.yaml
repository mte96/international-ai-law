- id: de-kug-bildnisschutz
  jurisdiktion: de
  kurztitel: Recht am eigenen Bild und an der Stimme (KUG)
  offizieller_titel: §§ 22, 23, 33 Gesetz betreffend das Urheberrecht an Werken der bildenden Künste und
    der Photographie (Kunsturhebergesetz)
  fundstelle: KunstUrhG vom 9. Januar 1907 (RGBl. S. 7), zuletzt geändert durch Gesetz vom 16. Februar
    2001 (BGBl. I S. 266)
  celex: null
  status: anwendbar
  status_detail: In Kraft seit 1907. Nur noch §§ 22 bis 24 und 33 KUG in Geltung; die übrigen Vorschriften
    sind durch das UrhG ersetzt.
  inkrafttreten:
    datum: '1907-07-01'
    verifiziert: false
    fundstelle_norm: RGBl. 1907 S. 7; Inkrafttretensdatum nicht gegen die amtliche Fassung geprüft.
  themenachsen:
  - grundrechte
  - content
  regelungsschwerpunkte:
  - § 22 KUG verlangt die Einwilligung des Abgebildeten für Verbreitung und öffentliche Zurschaustellung.
    Auf KI-generierte Bildnisse, die keine Aufnahme sind, wird die Norm analog angewandt; dasselbe gilt
    für nachgeahmte Stimmen (LG Berlin II, 2 O 202/24).
  - § 23 Abs. 1 KUG privilegiert Bildnisse der Zeitgeschichte; die Rückausnahme des Abs. 2 (berechtigtes
    Interesse) trägt die Abwägung bei synthetischen Darstellungen.
  - § 33 KUG ist die einzige geltende Strafnorm des Bildnisschutzes; sie erfasst nur Verbreitung und Zurschaustellung,
    nicht die Herstellung — dieselbe Lücke, die der Entwurf des § 201b StGB schließen soll.
  - 'Verhältnis zur DSGVO: Für den journalistischen Bereich gilt das KUG über die Öffnungsklausel des
    Art. 85 DSGVO fort; im Übrigen ist das Verhältnis ungeklärt.'
