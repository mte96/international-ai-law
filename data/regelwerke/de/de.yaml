  offene_punkte:
  - Ob und wann das erste deutsche KI-Reallabor tatsächlich eröffnet wird, ist nicht veröffentlicht; das
    Verfahren (Antragstellung, Auswahlkriterien, Ausstiegsplan nach Art. 57 Abs. 9 KI-VO) fehlt.
  - Kein veröffentlichtes Verwaltungsverfahren für die Zusammenarbeit mit BfDI und Landesdatenschutzbehörden
    nach Art. 74 Abs. 8 KI-VO.
  - Bislang keine erste Marktüberwachungsentscheidung oder Bußgeldpraxis dokumentiert.
  - Die Datumsangaben auf der Marktüberwachungsseite widersprechen dem durch VO (EU) 2026/1744 geänderten
    Zeitplan — Klärung durch die Behörde steht aus.
