- id: de-bnetza-ki-aufsicht
  jurisdiktion: de
  kurztitel: Aufsichtspraxis der Bundesnetzagentur (KI-Service-Desk, KoKIVO, Reallabore)
  offizieller_titel: 'Untergesetzliche Aufsichts- und Unterstützungsstrukturen der Bundesnetzagentur zur
    Verordnung (EU) 2024/1689: Koordinierungs- und Kompetenzzentrum für die KI-Verordnung (KoKIVO), KI-Service-Desk,
    KI-Compliance Kompass, Beschwerdestelle, KI-Reallabore

    '
  fundstelle: Keine eigene Rechtsquelle — Vollzug von §§ 2, 3, 8, 13 KI-MIG i.V.m. Art. 70, 74, 85, 57-59
    KI-VO
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Operativ seit dem 29.07.2026, in Teilen (KI-Service-Desk, KI-Compliance Kompass, FAQ,
    Factsheets) bereits vorher. Keine Bindungswirkung; die veröffentlichten Auslegungshilfen prägen aber
    die Verwaltungspraxis der zentralen deutschen KI-Aufsicht.

    '
  kurzbeschreibung: 'Die Bundesnetzagentur ist Marktüberwachungsbehörde für KI in Funkanlagen (Anhang
    I KI-VO) sowie für kritische Infrastruktur, Strafverfolgung und weitere Anhang-III-Bereiche, ist zentrale
    Anlauf- und Beschwerdestelle nach Art. 85 KI-VO und betreibt das KoKIVO als Kompetenzzentrum für alle
    deutschen Marktüberwachungs- und notifizierenden Behörden. Der KI-Service-Desk richtet sich niedrigschwellig
    an KMU und Start-ups (Risikoklassifizierung, Leitlinien, Kompetenzaufbau). Mindestens ein KI-Reallabor
    muss nach Art. 57 KI-VO bis zum 02.08.2027 betriebsbereit sein. Sanktionen verhängt die Behörde nach
    § 15 KI-MIG und Art. 99 KI-VO.

    '
  inkrafttreten:
    datum: 2026-07-29
    verifiziert: true
    quelle: https://www.bundesnetzagentur.de/1112336
  anwendungsdaten:
  - datum: 2026-03-01
    was_gilt: 'Veröffentlichung der Ergebnisse eines trilateralen Reallabor-Pilotprojekts, einschließlich
      Handreichung zu Hochrisiko-Anforderungen bei Medizinprodukten.

      '
    verifiziert: true
    quelle: https://www.bundesnetzagentur.de/DE/Fachthemen/Digitales/KI/5_Innovationen/start.html
  - datum: 2027-08-02
    was_gilt: Spätester Termin für ein betriebsbereites KI-Reallabor (Art. 57 Abs. 1 KI-VO i.V.m. § 13
      KI-MIG).
    verifiziert: true
    quelle: https://www.bundesnetzagentur.de/DE/Fachthemen/Digitales/KI/5_Innovationen/start.html
  themenachsen:
  - governance
  - marktzugang
  - sektor-medizin
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'KoKIVO: Unterstützung der nationalen Marktüberwachungs- und notifizierenden Behörden bei komplexen
    Entscheidungen, Sicherung einheitlicher Auslegung übergreifender Rechtsfragen, technische Expertise
    zu Funktionsweise und Risikobewertung, Mitwirkung in nationaler und internationaler Normung, Unterstützung
    freiwilliger Verhaltenskodizes für Nicht-Hochrisiko-KI (Art. 95 KI-VO).'
  - 'KI-Service-Desk: Online-Werkzeuge zur Risikoklassifizierung, Aufbereitung europäischer Leitlinien,
    Kompetenzaufbau; ausdrücklich an KMU und Start-ups adressiert. Präsident Klaus Müller: Rolle als ''Enabler
    und Ansprechpartner für das gesamte KI-Ökosystem''.'
  - 'KI-Compliance Kompass: Selbsteinschätzungswerkzeug zur Anwendbarkeit der KI-VO auf eine Organisation.'
  - 'Beschwerdestelle nach Art. 85 KI-VO: Entgegennahme und Prüfung von Beschwerden von Bürgerinnen, Bürgern
    und Unternehmen; Berücksichtigung bei Marktüberwachungsprüfungen.'
  - 'Reallabore: kontrollierte Entwicklung, Training und Validierung; Vorrangzugang für Forschungseinrichtungen
    (§ 13 KI-MIG); Ziel Rechtssicherheit und beschleunigter Marktzugang.'
  - 'WIDERSPRUCH: Die Marktüberwachungsseite der Bundesnetzagentur nennt als Geltungsdaten den 02.08.2026
    (Anhang III) und den 02.08.2027 (Anhang I). Das entspricht dem ursprünglichen Zeitplan der KI-VO.
    Nach der Änderung durch die VO (EU) 2026/1744 (Digital Omnibus on AI) gelten die Hochrisiko-Pflichten
    erst ab 02.12.2027 (Anhang III) bzw. 02.08.2028 (Anhang I). Die Behördenseite ist insoweit veraltet
    oder bezieht sich auf die Zuständigkeitsbegründung, nicht auf die Pflichtenanwendung.'
