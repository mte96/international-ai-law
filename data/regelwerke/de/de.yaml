- id: de-prodhaftg-modernisierung
  jurisdiktion: de
  kurztitel: Modernisierung des Produkthaftungsrechts (Umsetzung der PLD)
  offizieller_titel: Entwurf eines Gesetzes zur Modernisierung des Produkthaftungsrechts
  fundstelle: noch nicht verkündet
  verfahrensnummer: BT-Drs. 21/4297 (Regierungsentwurf, 25.02.2026); BR-Drs. 775/25 (19.12.2025)
  status: verfahren
  status_detail: 'Regierungsentwurf am 25.02.2026 in den Bundestag eingebracht, erste Lesung am 04.03.2026,
    öffentliche Anhörung des Rechtsausschusses am 13.04.2026. Stand 27.08.2026 sind zweite und dritte
    Lesung noch nicht erfolgt; eine Beschlussempfehlung des Rechtsausschusses ist nicht nachweisbar. Die
    Umsetzungsfrist der Richtlinie endet am 09.12.2026, zu dem Termin soll das Gesetz zugleich in Kraft
    treten. Das ist knapp, aber nicht ausgeschlossen — die Sitzungswochen im Herbst 2026 reichen rechnerisch
    aus.

    '
  kurzbeschreibung: 'Erste umfassende Reform des deutschen Produkthaftungsrechts seit 1989. Das ProdHaftG
    von 1989 wird nicht geändert, sondern vollständig neu gefasst. Kern für KI: Software wird eigenständiges
    Produkt, unabhängig von Bereitstellungsform und Speicherort, ausdrücklich einschließlich KI-Systemen
    und cloudbasierter Bereitstellung; nicht kommerzielle Open-Source-Software bleibt ausgenommen. Hinzu
    treten ein gerichtlicher Offenlegungsanspruch für Beweismittel und gesetzliche Fehler- und Kausalitätsvermutungen,
    die gerade bei technisch oder wissenschaftlich komplexen Produkten greifen. Adressaten sind Hersteller,
    Bevollmächtigte, Einführer, Fulfilment-Dienstleister, Plattformen und Anbieter erheblich veränderter
    Produkte.

    '
