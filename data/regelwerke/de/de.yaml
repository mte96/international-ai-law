- id: de-automatisierter-verwaltungsakt
  jurisdiktion: de
  kurztitel: Vollautomatisierter Verwaltungsakt (§ 35a VwVfG, § 155 Abs. 4 AO, § 31a SGB X)
  offizieller_titel: '§ 35a Verwaltungsverfahrensgesetz, § 155 Absatz 4 Abgabenordnung, § 31a Zehntes
    Buch Sozialgesetzbuch, eingefügt durch das Gesetz zur Modernisierung des Besteuerungsverfahrens vom
    18. Juli 2016

    '
  fundstelle: BGBl. I 2016 S. 1679
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Seit 01.01.2017 unverändert in Kraft. Die Normen sind die einzige allgemeine deutsche
    Rechtsgrundlage für vollautomatisierte Verwaltungsentscheidungen und stammen aus der Zeit vor generativer
    KI. Ihre Tatbestandsvoraussetzungen — kein Ermessen, kein Beurteilungsspielraum, ausdrückliche fachgesetzliche
    Zulassung — schließen den Einsatz lernender Systeme im Ergebnis weitgehend aus. Eine Anpassung an
    die KI-VO ist nicht erfolgt.

    '
  kurzbeschreibung: '§ 35a VwVfG erlaubt den vollständig automatisierten Erlass eines Verwaltungsakts
    nur, wenn dies durch Rechtsvorschrift zugelassen ist und weder ein Ermessen noch ein Beurteilungsspielraum
    besteht. § 155 Abs. 4 AO regelt die vollautomatisierte Steuerfestsetzung mit Risikomanagementsystemen
    und einem Aussteürungsvorbehalt, § 31a SGB X die Parallelvorschrift für die Sozialverwaltung mit dem
    Zusatz, dass für den Einzelfall bedeutsame tatsächliche Angaben des Beteiligten zu berücksichtigen
    sind. Adressaten sind Behörden aller Ebenen. Ein Verstoß führt zur Rechtswidrigkeit des Verwaltungsakts.

    '
  inkrafttreten:
    datum: 2017-01-01
    verifiziert: true
    quelle: https://dejure.org/gesetze/VwVfG/35a.html
  anwendungsdaten:
  - datum: 2017-01-01
    was_gilt: Anwendbarkeit von § 35a VwVfG, § 155 Abs. 4 AO und § 31a SGB X.
    verifiziert: true
    quelle: https://dejure.org/gesetze/SGB_X/31a.html
  - datum: 2027-12-02
    was_gilt: 'Anwendungsbeginn der Hochrisiko-Pflichten für Anhang-III-Systeme (nach VO (EU) 2026/1744
      verschoben) — betrifft u.a. KI-Systeme in Strafverfolgung, Migration, Justiz und bei wesentlichen
      öffentlichen Diensten und damit große Teile der Verwaltungsdigitalisierung.

      '
    verifiziert: false
    quelle: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX%3A02024R1689-20260727
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - '§ 35a VwVfG: ''Ein Verwaltungsakt kann vollständig durch automatische Einrichtungen erlassen werden,
    sofern dies durch Rechtsvorschrift zugelassen ist und weder ein Ermessen noch ein Beurteilungsspielraum
    besteht.'' Doppelter Vorbehalt: fachgesetzliche Zulassung plus gebundene Entscheidung. Lernende Systeme,
    deren Ergebnis nicht vollständig determiniert ist, passen dogmatisch nicht in diesen Rahmen.'
  - '§ 155 Abs. 4 AO: vollautomatisierte Steuerfestsetzung. Praktisch die größte Anwendung automatisierter
    Verwaltung in Deutschland; das Risikomanagementsystem nach § 88 Abs. 5 AO steuert Fälle zur personellen
    Bearbeitung aus. Die Auswahlkriterien dürfen nach § 88 Abs. 5 Satz 4 AO nicht veröffentlicht werden
    — ein struktureller Transparenzkonflikt mit Art. 86 KI-VO (Recht auf Erläuterung der Einzelfallentscheidung).'
  - '§ 31a SGB X: enthält als einzige der drei Normen ausdrücklich die Pflicht, für den Einzelfall bedeutsame
    tatsächliche Angaben des Beteiligten zu berücksichtigen, die im automatisierten Verfahren nicht ermittelt
    würden.'
  - 'Verhältnis zur KI-VO: Anhang III Nr. 5 lit. a (Zugang zu wesentlichen öffentlichen Diensten und Leistungen)
    und Nr. 8 (Rechtspflege und demokratische Prozesse) machen viele Verwaltungsanwendungen zu Hochrisiko-KI.
    Art. 26 Abs. 9 KI-VO verlangt für Behörden zusätzlich die Registrierung in der EU-Datenbank; Art.
    27 KI-VO die Grundrechte-Folgenabschätzung — deren Unterlassung nach § 15 KI-MIG bußgeldbewehrt ist
    (bis 50.000 EUR).'
  - 'Verhältnis zu Art. 22 DSGVO: § 35a VwVfG ist zugleich die mitgliedstaatliche Rechtsgrundlage im Sinne
    des Art. 22 Abs. 2 lit. b DSGVO — allerdings nur, soweit angemessene Schutzmaßnahmen bestehen.'
  dokumente:
  - datum: 2017-01-01
    typ: norm
    titel: § 35a VwVfG — Vollständig automatisierter Erlass eines Verwaltungsaktes
    url: https://dejure.org/gesetze/VwVfG/35a.html
    sprache: de
    urheber: Bundesgesetzgeber / dejure.org
    verifiziert: true
    notiz: Wortlaut, Inkrafttreten 01.01.2017 und Einführungsgesetz (BGBl. I 2016 S. 1679) bestätigt.
  - datum: 2017-01-01
    typ: norm
    titel: § 31a SGB X — Vollständig automatisierter Erlass eines Verwaltungsakts
    url: https://dejure.org/gesetze/SGB_X/31a.html
    sprache: de
    urheber: Bundesgesetzgeber / dejure.org
    verifiziert: true
    notiz: Enthält die Pflicht zur Berücksichtigung einzelfallbedeutsamer Angaben des Beteiligten.
  offene_punkte:
  - § 155 Abs. 4 AO wurde nicht aus einer Primärquelle abgerufen; Inhalt aus Vorwissen.
  - Keine Anpassung der §§ 35a VwVfG / 31a SGB X an die KI-VO in Sicht; der Gesetzgeber hat im KI-VO-Durchführungsgesetz
    nur das SGB I geändert.
  - Ungeklärt, ob ein KI-gestütztes Assistenzsystem, das eine gebundene Entscheidung vorbereitet, bereits
    einen 'vollständig automatisierten' Erlass darstellt.
  - Das Verhältnis der Geheimhaltung der Risikoparameter (§ 88 Abs. 5 Satz 4 AO) zu Art. 86 KI-VO ist
    ungelöst.
