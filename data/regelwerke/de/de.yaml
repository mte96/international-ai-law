  regelungsschwerpunkte:
  - '§ 823 Abs. 1 BGB: Über das sonstige Recht laufen das allgemeine Persönlichkeitsrecht, das Unternehmenspersönlichkeitsrecht
    und der eingerichtete und ausgeübte Gewerbebetrieb — die Anspruchsgrundlagen der deutschen Halluzinationsverfahren
    (LG Kiel, LG Hamburg, LG München I).'
  - '§ 1004 BGB analog: Die Gerichte tenorieren Unterlassung, nicht Schadensersatz. Offen ist, ob der
    Betreiber Störer oder unmittelbarer Täter ist und ob ein Disclaimer die Zurechnung unterbricht.'
  - '§ 831 BGB: Die Analogiefähigkeit für autonome Systeme ist der Kern der deutschen Zurechnungsdebatte;
    ein KI-System ist kein anderer im Sinne der Norm, die Exkulpation nach Abs. 1 Satz 2 passt nicht auf
    Modellverhalten.'
  - § 253 Abs. 2 BGB begrenzt den Ersatz immateriellen Schadens; die Geldentschädigung wegen schwerer
    Persönlichkeitsrechtsverletzung beruht deshalb auf Richterrecht, nicht auf dieser Norm.
  - '§ 134 BGB: Nichtigkeit von Verträgen über unerlaubte Rechtsdienstleistungen — der Hebel, über den
    die RDG-Verstöße im Legal-Tech-Bereich zivilrechtlich wirken.'
