  pruefvermerk:
  - '07.09.2026: Unverändert: Regierungsentwurf BT-Drs. 21/4297 vom 25.02.2026 weiterhin im parlamentarischen
    Verfahren. Letzte belegte Schritte bleiben Zuleitung an den Bundesrat 19.12.2025 (BR-Drs. 775/25),
    erster Durchgang 30.01.2026 (1061. Sitzung, TOP 38), Einbringung 25.02.2026, erste Lesung 04.03.2026,
    öffentliche Anhörung des Rechtsausschusses 13.04.2026. Weder Beschlussempfehlung noch zweite/dritte
    Lesung noch Gesetzesbeschluss noch zweiter Durchgang sind auffindbar. Einschränkung: Die DIP-Vorgangsseite
    329483 ist JavaScript-getrieben und lieferte nur die Programmhülle; der Befund beruht insoweit auf
    Negativevidenz aus gezielten Suchen über bundestag.de, dserver.bundestag.de und bundesrat.de. BEWERTUNG:
    Die Umsetzungsfrist des Art. 22 RL (EU) 2024/2853 läuft am 09.12.2026 ab. Bei noch ausstehender Beschlussempfehlung
    und rund dreizehn Wochen Restzeit wird die Einhaltung zunehmend unwahrscheinlich.'
- id: de-bgb-digitale-produkte
  jurisdiktion: de
  kurztitel: Vertragsrecht für digitale Produkte (§§ 327 ff. BGB) und KI
  offizieller_titel: '§§ 327 bis 327u BGB (Verträge über digitale Produkte), eingefügt durch das Gesetz
    zur Umsetzung der Richtlinie über bestimmte vertragsrechtliche Aspekte der Bereitstellung digitaler
    Inhalte und digitaler Dienstleistungen vom 25. Juni 2021

    '
  fundstelle: BGBl. I 2021 S. 2123
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 01.01.2022, unverändert. Für KI-Produkte gilt kein Sonderrecht: KI-Anwendungen
    für Verbraucher sind digitale Produkte im Sinne des § 327 BGB, im B2B-Bereich greift das allgemeine
    Kauf- bzw. Werkvertragsrecht. Die offene Frage ist, wie Beschaffenheitsvereinbarungen bei probabilistischen
    Systemen aussehen und wann Halluzinationen einen Mangel begründen.

    '
  kurzbeschreibung: '§§ 327 ff. BGB regeln Verbraucherverträge über die Bereitstellung digitaler Inhalte
    und Dienstleistungen. § 327e BGB definiert den Produktmangel über subjektive, objektive und Integrationsanforderungen,
    § 327f BGB begründet eine Aktualisierungspflicht des Unternehmers über den Bereitstellungszeitraum.
    Für KI-Systeme sind beide Normen einschlägig: das Modell ist ein digitales Produkt, Modell-Updates
    fallen unter die Aktualisierungspflicht, und die objektive Beschaffenheit richtet sich nach dem, was
    der Verbraucher bei Produkten derselben Art erwarten kann. Rechtsfolgen sind Nacherfüllung, Vertragsbeendigung
    und Minderung (§§ 327i ff. BGB).

    '
  inkrafttreten:
    datum: 2022-01-01
    verifiziert: true
    quelle: https://dejure.org/gesetze/BGB/327.html
  anwendungsdaten:
  - datum: 2022-01-01
    was_gilt: Anwendung auf Verbraucherverträge über digitale Produkte, die ab diesem Tag geschlossen
      werden.
    verifiziert: true
    quelle: https://dejure.org/gesetze/BGB/327.html
  themenachsen:
  - vertrag
  - haftung
  regelungsschwerpunkte:
  - '§ 327 Abs. 1 BGB: Anwendungsbereich auf Verbraucherverträge über die Bereitstellung digitaler Inhalte
    oder digitaler Dienstleistungen — erfasst SaaS-KI-Dienste und lokal ausgeführte Modelle gleichermaßen,
    auch bei Bezahlung mit Daten (§ 327 Abs. 3 BGB).'
  - '§ 327e BGB: Mangelbegriff. Praktisch offen ist, ob Halluzinationen, Bias oder Leistungsschwankungen
    nach Modell-Update einen Mangel darstellen. Argument für Mangelfreiheit: Probabilistik ist übliche
    Beschaffenheit generativer Systeme. Argument dagegen: die Werbeaussagen des Anbieters prägen die berechtigte
    Erwartung (§ 327e Abs. 3 Nr. 2 BGB).'
  - '§ 327f BGB: Aktualisierungspflicht. Für KI-Anbieter bedeutet das eine Pflicht zu Sicherheits- und
    Funktionsupdates während der Bereitstellungsdauer. Ein Modellwechsel, der Funktionen entfernt, kann
    als negative Änderung § 327r BGB unterfallen.'
  - 'Abgrenzung zur Produkthaftung: §§ 327 ff. BGB betreffen das Äquivalenzinteresse (Vertragserfüllung),
    das neue ProdHaftG das Integritätsinteresse (Schäden an Leben, Körper, Sachen, Daten). Beide erfassen
    künftig dasselbe Objekt — Software einschließlich KI.'
  - 'B2B: Für Unternehmensverträge über KI-Systeme gilt Kauf-, Miet- oder Werkvertragsrecht je nach Vertragsgestaltung;
    die Rechtsprechung dazu ist noch nicht ausgebildet. Praxisrelevant sind Leistungsbeschreibungen mit
    Genauigkeitsmetriken statt klassischer Beschaffenheitsangaben.'
  dokumente:
  - datum: 2022-01-01
    typ: norm
    titel: § 327 BGB — Anwendungsbereich (Verträge über digitale Produkte)
    url: https://dejure.org/gesetze/BGB/327.html
    sprache: de
    urheber: Bundesgesetzgeber / dejure.org
    verifiziert: true
    notiz: Belegt Wortlaut, Inkrafttreten 01.01.2022 und das Einführungsgesetz vom 25.06.2021 (BGBl. I
      S. 2123).
  offene_punkte:
  - Keine veröffentlichte deutsche Rechtsprechung zur Mangelhaftigkeit generativer KI-Ausgaben nach §§
    327e, 327f BGB.
  - Ob Modellversionswechsel eine Änderung nach § 327r BGB darstellt, ist ungeklärt.
  - Der Zusammenhang zwischen den Transparenzpflichten aus Art. 50 KI-VO und der objektiven Beschaffenheit
    nach § 327e BGB ist noch nicht dogmatisch aufgearbeitet.
