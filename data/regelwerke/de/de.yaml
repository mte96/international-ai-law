    quelle: https://www.bundestag.de/dokumente/textarchiv/2026/kw24-de-ki-1183820
  - datum: 2026-07-29
    was_gilt: 'Inkrafttreten: Zuständigkeitszuweisung an Bundesnetzagentur und Fachbehörden, KoKIVO, KI-Service-Desk,
      Beschwerdestelle, Bußgeldzuständigkeiten (§ 17 Abs. 1 KI-MIG), Reallabor-Auftrag.

      '
    verifiziert: true
    quelle: https://bmds.bund.de/aktuelles/pressemitteilungen/detail/neues-ki-gesetz-tritt-in-kraft
  themenachsen:
  - governance
  - marktzugang
  - sektor-finanz
  - sektor-oeffentlich
  - grundrechte
  regelungsschwerpunkte:
  - 'Artikel 1: KI-MIG — Teil 1 Allgemeine Vorschriften, Teil 2 Zuständige Behörden und Zusammenarbeit,
    Teil 3 Befugnisse, Teil 4 Innovationsförderung, Teil 5 Bußgeldvorschriften, Teil 6 Aufbewahrungspflichten.'
  - 'Artikel 2: Änderung des Hinweisgeberschutzgesetzes — Verstöße gegen die KI-VO werden in den sachlichen
    Anwendungsbereich des Hinweisgeberschutzes einbezogen (Umsetzung von Art. 87 KI-VO, der die Whistleblower-RL
    (EU) 2019/1937 für anwendbar erklärt).'
  - 'Artikel 3: Änderung des Ersten Buches Sozialgesetzbuch — Datenschutz beim Einsatz von KI im Sozialleistungsbereich.'
  - 'Artikel 4: Änderung des Finanzdienstleistungsaufsichtsgesetzes — Kosten- und Gebührenregelungen für
    die BaFin als sektorale Marktüberwachungsbehörde.'
  - 'Artikel 5: Inkrafttreten.'
  - '§ 15 KI-MIG: eigenständige nationale Ordnungswidrigkeitentatbestände — Verstöße gegen Informations-
    und Dokumentationspflichten nach Art. 21 KI-VO, Zugangsverweigerung nach Art. 21 Abs. 2, unterlassene
    Grundrechte-Folgenabschätzung nach Art. 27, unterlassene Aktualisierung/Mitteilung nach Art. 27 Abs.
    2 und 3, Informationspflichtverletzungen gegenüber der notifizierenden Behörde nach Art. 45, Verweigerung
    der Erläuterung gegenüber betroffenen Personen bei Hochrisiko-KI nach Anhang III Nr. 1, 3, 4, 5. Bußgeldrahmen:
    bis zu fünfzigtausend Euro (§ 15 Abs. 3).'
  - '§ 17 Abs. 1 KI-MIG: Verwaltungsbehörden im Sinne des § 36 Abs. 1 Nr. 1 OWiG sind die Marktüberwachungsbehörden
    nach § 2 Abs. 1 bis 8 und die notifizierenden Behörden nach § 3 Abs. 1 und 2 Satz 1 — jeweils für
    ihren Geschäftsbereich. Keine zentrale Bußgeldbehörde.'
  - 'Die Geldbußen des Art. 99 KI-VO gelten unmittelbar; der Gesetzgeber hat sie NICHT in nationales OWi-Recht
    überführt, sondern nur die zuständige Behörde bestimmt. Kritik: Doppelsanktionierungsrisiko und uneinheitliche
    Bußgeldpraxis über die Geschäftsbereiche hinweg.'
  - Unabhängige KI-Marktüberwachungskammer bei der Bundesnetzagentur für Hochrisiko-KI in besonders grundrechtssensiblen
    Feldern (Strafverfolgung, Grenzkontrolle, Justiz, demokratische Prozesse) — Art. 74 Abs. 8 KI-VO verlangt
    Unabhängigkeit.
  - 'Sektorale Zuständigkeiten bleiben unberührt: BaFin (Finanzsektor), BfArM/PEI (Medizinprodukte und
    Arzneimittel), BSI (Cybersicherheit), BfDI und Landesdatenschutzbehörden (Datenschutz, biometrische
    Systeme), Landesbehörden für Landesverwaltung.'
  - 'Ausschussänderungen gegenüber dem Regierungsentwurf: nicht-öffentliches Register für Hochrisiko-KI-Systeme;
    Evaluierung der Aufsichtsstruktur nach 18 Monaten und nach 3 Jahren; regelmäßige Überprüfung der Beratungsangebote
    auf Effizienz und Praxisnähe.'
  - 'Erfüllungsaufwand: rd. 4 Mio. EUR einmalig und 15,9 Mio. EUR jährlich beim Bund, 33,1 Mio. EUR jährlich
    bei den Ländern.'
  - 'Sachverständigenkritik in der Anhörung (23.03.2026): bis zu hundert beteiligte Behörden, fehlende
    formalisierte Koordinierungsmechanismen, Gefahr uneinheitlicher Durchsetzung.'
