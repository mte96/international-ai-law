  offene_punkte:
  - Der BGH kann in I ZR 281/25 dem EuGH vorlegen; dann verschiebt sich die Klärung um Jahre. Das LG München
    I hat eine Vorlage im OpenAI-Verfahren bereits abgelehnt.
  - Ob § 60d UrhG Datensatzersteller privilegiert, deren Datensätze anschließend kommerziell genutzt werden,
    ist der eigentliche Hebel und höchstrichterlich offen.
  - 'Rechtskraft: Keines der vier Urteile ist rechtskräftig. Suno-Berufung nicht bestätigt.'
  - Fundstelle des Gesetzes vom 31.05.2021 (BGBl. I 2021 S. 1204) nicht direkt verifiziert — gesetze-im-internet.de
    blockiert automatisierte Abrufe.
  - Ein Vergütungsmodell für Trainingsnutzungen wird politisch diskutiert, aber vom BMJV nicht als Gesetzesvorhaben
    geführt.
  - 'Inkrafttreten (07.06.2021) am 05.09.2026 nicht amtlich belegbar: § 44b UrhG ist auf gesetze-im-internet.de
    im Wortlaut nachgewiesen, die Fußnote des UrhG weist nur "Textnachweis Geltung ab: 10.10.1976" aus;
    die BGBl-Ausgabe I 2021 Nr. 27 liegt nur im bgbl.de-Archiv (Viewer, nicht auslesbar), die BMJ-Verfahrensseiten
    sind für automatisierte Abrufe gesperrt, BT-Drs. 19/27426 bricht vor dem Inkrafttretensartikel ab.
    Nächster Versuch: BGBl. I 2021 S. 1204 im Papierarchiv oder juris.'
