  - Stand des Gesetzgebungsverfahrens zu BT-Drs. 21/6132 und 21/6806 nach der Sommerpause 2026 nicht abschließend
    geklärt - Ausschussüberweisungen, Anhörungen und Beschlussempfehlungen ließen sich nicht verifizieren
    (DIP-API nur mit gültigem Schlüssel abrufbar).
  - Genaues Datum der Schaffung des Art. 61a BayPAG nicht verifiziert; die Norm bestand spätestens im
    Juli 2025 (Zeitpunkt der Verfassungsbeschwerde), die abgerufene Fassung gilt ab 01.04.2026.
  - Der einschlägige Paragraph des Berliner ASOG in der Fassung der Novelle vom Dezember 2025 konnte nicht
    ermittelt werden; die Berliner Landesrechtsdatenbank ist nur mit JavaScript abrufbar.
  - Ob Hamburg mittelfristig eine Nachfolgeregelung zu § 49 PolDVG schafft, ist offen; nach dem Urteil
    hatte Hamburg keine Entscheidung getroffen, die Norm war ohnehin nie angewandt worden.
  - Volltexte der Landesnormen (HSOG, PolG NRW, PolG BW, ASOG) konnten nicht im Wortlaut abgerufen werden;
    die amtlichen Landesrechtsportale (lareda.hessenrecht.hessen.de, recht.nrw.de, landesrecht-hamburg.de)
    sind JavaScript-gestützt oder per robots.txt gesperrt.
  - Der NRW-Vertrag mit Palantir läuft Mitte Oktober 2026 aus; ob NRW verlängert, auf eine europäische
    Alternative wechselt oder das Polizeigesetz zuvor ändert, ist offen.
  - 'Inkrafttreten des Sammeleintrags nicht verifizierbar: Er bündelt fünf Landesgesetze mit je eigener
    Inkrafttretensvorschrift. Zu prüfen ist die Fundstelle der hessischen Neufassung des § 25a HSOG im
    GVBl. Hessen 2023 (Recherche über das hessische Landesrecht-Portal, nicht über Sekundärquellen).'
