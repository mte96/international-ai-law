  regelungsschwerpunkte:
  - 'DSK-Orientierungshilfe 2024: Prüfraster für Verantwortliche — Zweckbestimmung, Rechtsgrundlage, Rolle
    (Verantwortlicher/Auftragsverarbeiter), Umgang mit Eingaben in cloudbasierte LLM, Verbot der Eingabe
    besonderer Kategorien ohne Rechtsgrundlage, Notwendigkeit menschlicher Letztentscheidung bei Art.
    22 DSGVO.'
  - 'DSK-Orientierungshilfe 2025 (TOM): technische und organisatorische Maßnahmen entlang des Lebenszyklus
    — Datenminimierung im Training, Schutz vor Extraktionsangriffen, Protokollierung, Rollen- und Rechtekonzepte,
    Löschkonzepte.'
  - 'DSK-Orientierungshilfe RAG 2025: Retrieval-Augmented Generation wird eigenständig behandelt, weil
    die Wissensbasis personenbezogene Daten enthält und Auskunfts- und Löschungsansprüche dort — anders
    als im Modellgewicht — technisch erfüllbar sind.'
  - 'BfDI-Konsultation ''KI-Modelle und personenbezogene Daten'' (10.07.–31.08.2025): Mehrheit der Stellungnahmen
    hält Modellanonymität unter Bedingungen für möglich; Prompt-Eingaben gelten überwiegend erst dann
    als Verarbeitung memorierter Daten, wenn diese in der Ausgabe erscheinen; für Löschung wird ein Vorgehen
    auf Systemebene bevorzugt, weil Machine Unlearning als unzuverlässig gilt. Eine rein quantitative
    Betrachtung der im Modell enthaltenen personenbezogenen Daten wird abgelehnt.'
  - BfDI-Konsultation 'KI in Strafverfolgung und Gefahrenabwehr' (30.09.–17.12.2021) mit Positionspapier
    und Auswertungsbericht — älteste der hier erfassten Positionierungen, weiterhin Referenz für Predictive
    Policing und biometrische Fernidentifizierung.
  - 'Zuständigkeitsverschränkung: Nach § 2 KI-MIG bleiben BfDI und Landesdatenschutzbehörden für Datenschutz
    und für biometrische Systeme zuständig; Art. 74 Abs. 8 KI-VO weist ihnen zusätzlich die Marktüberwachung
    für Hochrisiko-KI in Strafverfolgung, Grenzkontrolle, Justiz und Demokratie zu. Wie sich das zur KI-Marktüberwachungskammer
    der Bundesnetzagentur verhält, ist ungeklärt.'
