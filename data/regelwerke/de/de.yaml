  - datum: 2026-12-09
    was_gilt: 'Umsetzungsfrist der Richtlinie (EU) 2024/2853 (Art. 22 Abs. 1) und vorgesehenes Inkrafttreten
      des neuen ProdHaftG. Für Produkte, die bis einschließlich zu diesem Tag in Verkehr gebracht wurden,
      gilt weiterhin das ProdHaftG 1989.

      '
