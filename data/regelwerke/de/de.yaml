    verifiziert: true
    quelle: https://dserver.bundestag.de/btd/21/068/2106806.pdf
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - '§ 98d StPO-E - Automatisierter biometrischer Abgleich mit öffentlich zugänglichen Daten aus dem Internet.
    Eingriffsschwelle: ''bestimmte Tatsachen begründen den Verdacht, dass jemand als Täter oder Teilnehmer
    eine Straftat von auch im Einzelfall erheblicher Bedeutung, insbesondere eine in § 100a Absatz 2 bezeichnete
    Straftat, begangen hat''; Subsidiarität, wenn die Erforschung des Sachverhalts, die Identitätsfeststellung
    oder die Ermittlung des Aufenthaltsortes auf andere Weise wesentlich erschwert oder aussichtslos wäre.'
  - '§ 98e StPO-E - Automatisierte verfahrensübergreifende Datenanalyse. Höhere Schwelle: schwerwiegende,
    in § 100a Abs. 2 StPO bezeichnete schwere Straftat.'
  - § 98e Abs. 2 und Abs. 4 StPO-E enthalten das Verbot, diskriminierende Algorithmen herauszubilden oder
    zu verwenden - dieselbe Formel wie in § 9b Abs. 5 BKAG-E.
  - 'Systematische Einordnung: Die Vorschriften schließen an §§ 98a bis 98c StPO (Rasterfahndung, maschineller
    Datenabgleich) an und verlagern die Ermittlungslogik von der Abfrage einzelner Datenbestände zur musterbasierten
    Analyse; flankiert werden sie durch §§ 161, 163, 483 StPO.'
