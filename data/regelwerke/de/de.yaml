  pruefvermerk:
  - '07.09.2026: Textarchiv des Bundestages zu Mittwoch, 08.07.2026, abgerufen: "Entwürfe zur Stärkung
    der digitalen Befugnisse von Ermittlungsbehörden"; wörtlich "Nach halbstündiger Aussprache wurden
    die Entwürfe an die Ausschüsse überwiesen". Federführung für 21/6806 beim Rechtsausschuss, für 21/6132,
    21/6131, 21/6913 und 21/6917 beim Innenausschuss. Damit ist der bislang offene Verfahrensstand erstmals
    amtlich belegt. Dass die biometrische Massenerkennung Gegenstand eines eigenen Antrags der Linken
    ist, stützt die Einschätzung, dass § 98d StPO-E als biometrische Fernidentifizierung diskutiert wird.'
