  offene_punkte:
  - Ein Kabinettbeschluss zum Gesetz gegen digitale Gewalt ist für den 29.06.2026 amtlich verneint und
    bis 07.09.2026 nicht nachweisbar. Zu prüfen bleibt, ob das Kabinett im Herbst 2026 beschließt.
  - Verhältnis der beiden § 201b-StGB-Fassungen (Bundesrat vs. BMJV) ist ungeklärt — sie unterscheiden
    sich in Tatbestandsstruktur und Strafrahmen.
  - Die IP-Speicherpflicht ist der wahrscheinlichste Bruchpunkt des Vorhabens; ohne sie fehlt dem zivilrechtlichen
    Auskunftsverfahren die Datengrundlage.
  - Verhältnis zu Art. 50 Abs. 4 KI-VO (Offenlegungspflicht des Betreibers bei Deepfakes, anwendbar seit
    02.08.2026) und zu den neuen Verboten des Art. 5 Abs. 1 lit. ba, bb KI-VO, die nach Art. 113 Abs.
    3 lit. a KI-VO erst ab dem 02.12.2026 gelten, ist im Entwurf nicht ausgearbeitet. Die Übergangsfrist
    bis zum 02.12.2026 nach Art. 111 Abs. 4 KI-VO betrifft nur Art. 50 Abs. 2 und nur Systeme, die vor
    dem 02.08.2026 in Verkehr gebracht wurden.
