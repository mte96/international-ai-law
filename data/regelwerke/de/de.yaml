- id: de-uwg-ki-lauterkeitsrecht
  jurisdiktion: de
  kurztitel: Lauterkeitsrecht und KI-gestützte Kommunikation (UWG)
  offizieller_titel: §§ 3, 3a, 5, 5a, 8 Gesetz gegen den unlauteren Wettbewerb
  fundstelle: UWG in der Fassung der Bekanntmachung vom 3. März 2010 (BGBl. I S. 254), zuletzt geändert
    durch das Gesetz zur Stärkung des Verbraucherschutzes im Wettbewerbs- und Gewerberecht vom 10. August
    2021 (BGBl. I S. 3504)
  celex: null
  status: anwendbar
  status_detail: In Kraft. Die Zurechnung von Chatbot-Aussagen ist erstmals obergerichtlich entschieden
    (OLG Hamm, 12.05.2026).
  inkrafttreten:
    datum: '2004-07-08'
    verifiziert: false
    fundstelle_norm: Maßgeblich ist die Neubekanntmachung vom 03.03.2010.
  themenachsen:
  - wettbewerb
  - content
  regelungsschwerpunkte:
  - '§ 5 UWG: Das OLG Hamm (I-4 UKl 3/25) rechnet unwahre Angaben eines Kundenchatbots dem Unternehmen
    als eigene geschäftliche Handlung zu; der Chatbot ist kein unbeherrschbarer Dritter.'
  - § 8 Abs. 2 UWG erstreckt Unterlassungs- und Beseitigungsanspruch auf den Unternehmensinhaber, wenn
    Mitarbeiter oder Beauftragte handeln — die Zurechnungsnorm, deren Übertragung auf Softwareagenten
    diskutiert wird.
  - § 3a UWG ist der Transmissionsriemen, über den Verstöße gegen RDG, DSGVO und künftig die KI-VO lauterkeitsrechtlich
    verfolgbar werden.
  - § 5a Abs. 4 UWG verlangt die Kenntlichmachung des kommerziellen Zwecks; für KI-generierte Werbeformate
    und Empfehlungen ist das die praktisch wichtigste Kennzeichnungspflicht neben Art. 50 KI-VO.
