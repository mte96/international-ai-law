- id: de-gg-grundrechte-ki
  jurisdiktion: de
  kurztitel: Grundrechtliche Maßstäbe für den KI-Einsatz (GG)
  offizieller_titel: Art. 1, 2, 3, 5, 10, 12, 19 und 20 Grundgesetz für die Bundesrepublik Deutschland
  fundstelle: Grundgesetz für die Bundesrepublik Deutschland vom 23. Mai 1949 (BGBl. S. 1), zuletzt geändert
    durch das Gesetz zur Änderung des Grundgesetzes (Artikel 109, 115 und 143h) vom 22. März 2025 (BGBl.
    2025 I Nr. 94, ausgegeben am 24.03.2025)
  celex: null
  status: anwendbar
  status_detail: In Kraft. Sammeleintrag für die grundrechtliche Prüfungsschicht; die Justizverfassungsnormen
    (Art. 92, 97, 101, 103 GG) sind dem Regelwerk de-ki-justiz zugeordnet.
  inkrafttreten:
    datum: '1949-05-24'
    verifiziert: true
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Art. 2 Abs. 1 i.V.m. Art. 1 Abs. 1 GG: Recht auf informationelle Selbstbestimmung. Das BVerfG misst
    daran sämtliche Befugnisse zur automatisierten Datenanalyse; die Eingriffsintensität bestimmt sich
    nach Analysemethode und einbezogenem Datenbestand (hessenDATA).'
  - 'Art. 19 Abs. 3 GG: Grundlage des Unternehmenspersönlichkeitsrechts — die Grundrechtsposition, auf
    die sich Unternehmen gegen halluzinierte Tatsachenbehauptungen stützen.'
  - 'Art. 5 Abs. 3 GG: Kunst- und Wissenschaftsfreiheit begrenzt pauschale Deepfake-Verbote und bindet
    hochschulrechtliche Vorgaben zum KI-Einsatz in Prüfungen.'
  - 'Art. 3 Abs. 1 und 3 GG: verfassungsrechtlicher Bezugspunkt algorithmischer Diskriminierung; das AGG
    bleibt dahinter zurück, weil es Systemhersteller nicht erfasst.'
  - 'Art. 20 Abs. 3 GG: Vorbehalt des Gesetzes — Grund, weshalb die Ermittlungsgeneralklauseln der §§
    161, 163 StPO KI-gestützte Massenauswertung nicht tragen.'
