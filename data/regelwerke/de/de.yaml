- id: de-stgb-computerstrafrecht
  jurisdiktion: de
  kurztitel: Computer- und Datenstrafrecht beim KI-Einsatz (StGB)
  offizieller_titel: §§ 202a, 263a, 269 Strafgesetzbuch
  fundstelle: StGB in der Fassung der Bekanntmachung vom 13. November 1998 (BGBl. I S. 3322)
  celex: null
  status: anwendbar
  status_detail: In Kraft. Keine KI-spezifische Anpassung; die Diskussion verläuft über § 201b StGB-E
    (Regelwerk de-deepfake-strafrecht).
  inkrafttreten:
    datum: '1998-11-13'
    verifiziert: true
    fundstelle_norm: Neubekanntmachung des StGB; die Einzelnormen sind älter.
  themenachsen:
  - sicherheit-export
  - haftung
  regelungsschwerpunkte:
  - '§ 202a StGB: Die Zugangssicherung ist das begrenzende Merkmal. Prompt Injection und Modellextraktion
    erfüllen den Tatbestand nur, wenn eine besondere Sicherung überwunden wird — bei öffentlich zugänglichen
    Modellendpunkten regelmäßig nicht.'
  - § 263a StGB erfasst die unrichtige Gestaltung des Programms und die unbefugte Einwirkung auf den Verarbeitungsablauf;
    die Manipulation von Trainings- oder Eingabedaten eines entscheidenden Systems fällt darunter.
  - § 269 StGB ist der praktisch wichtigste Tatbestand gegen synthetisch erzeugte Urkundensurrogate, weil
    er auf die Wahrnehmbarkeit als unechte Urkunde abstellt.
  - 'Kein KI-spezifischer Straftatbestand: Anders als Italien mit Art. 61 Nr. 11-decies codice penale
    kennt das deutsche Recht keinen allgemeinen Erschwerungsgrund der Tatbegehung mittels KI.'
