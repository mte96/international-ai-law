  - datum: 2026-12-02
    was_gilt: 'Auf EU-Ebene treten die durch VO (EU) 2026/1744 eingefügten Verbotstatbestände des Art.
      5 Abs. 1 lit. ba) und bb) KI-VO in Kraft (KI-generierte nicht-einvernehmliche intime Darstellungen
      und Darstellungen sexuellen Kindesmissbrauchs). Das verschiebt den nationalen Regelungsbedarf, weil
      das Inverkehrbringen entsprechender Systeme unionsrechtlich verboten wird.

      '
