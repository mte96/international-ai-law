  offene_punkte:
  - 'WIDERSPRÜCHLICH: Mehrere Sekundärquellen behaupten für 2026 ein BAG-Urteil, das die Mitbestimmung
    bei ''praktisch jeder KI'' begründe. Ein Aktenzeichen konnte nicht verifiziert werden; die Quellen
    wirken automatisiert erstellt. Nicht übernehmen ohne Primärnachweis.'
