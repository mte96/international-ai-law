    titel: 'Gesetzgebungsverfahren: Erstes Gesetz zur Änderung des Bundesdatenschutzgesetzes'
    url: https://www.bmi.bund.de/SharedDocs/gesetzgebungsverfahren/DE/aendg_bdsg.html
    sprache: de
    urheber: Bundesministerium des Innern
    verifiziert: true
    notiz: Amtliche Verfahrensakte. Führt Referentenentwurf 09.08.2023 und Regierungsentwurf 07.02.2024;
      ein Verkündungsdatum ist dort nicht ausgewiesen.
  offene_punkte:
  - 'WIDERSPRUCH: Ist § 37a BDSG in Kraft? Sekundärquellen behaupten Geltung (teils mit Fassungsstand
    20.11.2026, teils mit Umsetzungsfrist 30.06.2026), andere verneinen sie ausdrücklich. Auflösung nur
    über das Bundesgesetzblatt möglich — recht.bund.de blockiert automatisierte Abrufe.'
  - Verkündungstermin des BGH am 21.10.2026 nur über LTO belegt, nicht über eine BGH-Terminmitteilung.
  - BGH VI ZR 67/23 (13.05.2025) und I ZR 97/25 (18.12.2025) sind über curia.europa.eu als deutsche Entscheidungen
    nachgewiesen, ihr Inhalt aber nicht aus der Primärquelle geprüft.
  - 'Widerspruch aufgelöst (05.09.2026): § 37a BDSG existiert nicht. Die amtliche Inhaltsübersicht des
    BDSG auf gesetze-im-internet.de führt § 36, § 37, § 38 ohne Zwischennorm; https://www.gesetze-im-internet.de/bdsg_2018/__37a.html
    liefert "Not Found". Das Erste Gesetz zur Änderung des BDSG (BT-Drs. 20/10859) ist damit nicht verkündet;
    die anderslautenden Sekundärquellen sind falsch. Kein Inkrafttretensdatum einzutragen.'
