- id: de-beschaeftigtendatenschutz-ki
  jurisdiktion: de
  kurztitel: § 26 BDSG und das Beschäftigtendatengesetz (BeschDG)
  offizieller_titel: '§ 26 Bundesdatenschutzgesetz (Datenverarbeitung für Zwecke des Beschäftigungsverhältnisses);
    Entwurf eines Gesetzes zur Regelung des Beschäftigtendatenschutzes (Beschäftigtendatengesetz — BeschDG)

    '
  fundstelle: '§ 26 BDSG: BGBl. I 2017 S. 2097; BeschDG: nicht verkündet'
  verfahrensnummer: Referentenentwurf BMI/BMAS vom 08.10.2024
  status: anwendbar
  status_detail: '§ 26 BDSG gilt fort, ist aber nach EuGH C-34/21 (Hessen, Urt. v. 20.03.2023) in Absatz
    1 unionsrechtswidrig, soweit er lediglich Art. 6 DSGVO wiederholt, ohne spezifischere Vorschriften
    im Sinne des Art. 88 Abs. 2 DSGVO zu enthalten. Der Referentenentwurf eines BeschDG vom 08.10.2024
    wollte § 26 BDSG aufheben und ersetzen; er ist mit dem Ende der 20. Wahlperiode der Diskontinuität
    anheimgefallen. Ob die Bundesregierung der 21. Wahlperiode einen neuen Entwurf vorgelegt hat, ließ
    sich nicht abschließend klären — es gibt Hinweise auf einen "neuen Referentenentwurf", aber keinen
    belastbaren Nachweis. Widersprüchliche Quellenlage.

    '
  kurzbeschreibung: '§ 26 BDSG ist die deutsche Öffnungsklausel-Norm für die Verarbeitung von Beschäftigtendaten.
    Beim KI-Einsatz im Arbeitsverhältnis (Bewerber-Screening, Leistungsanalyse, People Analytics, automatisierte
    Kündigungsvorbereitung) ist sie neben Art. 22 DSGVO die zentrale Rechtsgrundlage. Der Entwurf eines
    BeschDG sah in § 10 erhöhte Prüf- und Transparenzpflichten beim Einsatz von KI-Systemen gegenüber
    Beschäftigten vor und wäre die erste ausdrückliche deutsche Regelung des KI-Einsatzes im Beschäftigungsverhältnis
    gewesen. Sanktion bleibt der Bußgeldrahmen des Art. 83 DSGVO sowie Schadensersatz nach Art. 82 DSGVO.

    '
  inkrafttreten:
    datum: 2018-05-25
    verifiziert: true
    quelle: https://www.gesetze-im-internet.de/bdsg_2018/BJNR209710017.html
    fundstelle_norm: 'Art. 8 Abs. 1 DSAnpUG-EU vom 30.06.2017 (BGBl. I S. 2097); amtliche Fußnote zum
      BDSG auf gesetze-im-internet.de: "(+++ Textnachweis ab: 25.5.2018 +++)". § 26 BDSG gilt seither
      unverändert fort.'
  anwendungsdaten:
  - datum: 2023-03-30
    was_gilt: 'EuGH C-34/21: § 23 Abs. 1 Satz 1 HDSIG und wortgleiche Normen wie § 26 Abs. 1 BDSG genügen
      Art. 88 Abs. 2 DSGVO nicht.'
    verifiziert: false
    quelle: https://www.bitkom.org/sites/main/files/2026-02/bitkom-leitfaden-kuenstliche-intelligenz-und-mitbestimmung.pdf
  - datum: 2024-10-08
    was_gilt: Referentenentwurf BeschDG von BMI und BMAS; Aufhebung des § 26 BDSG vorgesehen, § 10 BeschDG-E
      zu KI-Einsatz.
    verifiziert: true
    quelle: https://www.activemind.legal/de/guides/beschaeftigtendatenschutzgesetz/
  - datum: 2025-03-25
    was_gilt: Diskontinuität mit dem Ende der 20. Wahlperiode; kein Kabinettbeschluss zum BeschDG erfolgt.
    verifiziert: false
    quelle: https://www.activemind.legal/de/guides/beschaeftigtendatenschutzgesetz/
  themenachsen:
  - datenschutz
  - arbeit
  - grundrechte
  regelungsschwerpunkte:
  - '§ 26 Abs. 1 BDSG: Verarbeitung, soweit für Begründung, Durchführung oder Beendigung des Beschäftigungsverhältnisses
    erforderlich. Nach EuGH C-34/21 als bloße Wiederholung des Art. 6 Abs. 1 lit. b DSGVO unionsrechtswidrig,
    soweit keine spezifischen Schutzmaßnahmen normiert sind. Praktische Folge: unmittelbarer Rückgriff
    auf Art. 6 DSGVO.'
  - '§ 10 BeschDG-E: gesteigerte Prüf- und Transparenzpflichten beim Einsatz von KI-Systemen gegenüber
    Beschäftigten — der Kern der KI-Relevanz des Vorhabens.'
  - Art. 22 DSGVO bleibt die Schranke für vollautomatisierte Entscheidungen mit rechtlicher Wirkung oder
    ähnlich erheblicher Beeinträchtigung (Bewerberauswahl, Kündigung, Beförderung). Beim KI-gestützten
    Screening ist entscheidend, ob eine menschliche Letztentscheidung substanziell ist oder nur formal.
  - Anhang III Nr. 4 KI-VO stuft KI-Systeme für Einstellung, Auswahl, Beförderung, Kündigung, Aufgabenzuweisung
    und Leistungsüberwachung als Hochrisiko ein — die Hochrisiko-Pflichten gelten nach der Änderung durch
    VO (EU) 2026/1744 erst ab 02.12.2027.
  - 'Art. 26 Abs. 7 KI-VO: Betreiber, die Hochrisiko-KI am Arbeitsplatz einsetzen, müssen die betroffenen
    Beschäftigten und ihre Vertretungen vorab informieren. Das ist eine unionsrechtliche Informationspflicht
    neben § 90 BetrVG.'
  - 'BAG, Urt. v. 08.05.2025 – 8 AZR 209/21: Bestätigung der Anwendung der DSGVO auf Beschäftigtendaten.'
  dokumente:
  - datum: 2024-12-12
    typ: uebersicht
    titel: 'Beschäftigtendatengesetz: Das sieht der Referentenentwurf vor'
    url: https://www.activemind.legal/de/guides/beschaeftigtendatenschutzgesetz/
    sprache: de
    urheber: activeMind.legal
    verifiziert: true
    notiz: Beleg für Datum des Referentenentwurfs, § 10 BeschDG-E zu KI und die geplante Aufhebung des
      § 26 BDSG.
  - datum: 2026-02-01
    typ: leitlinie
    titel: Bitkom-Leitfaden Künstliche Intelligenz und Mitbestimmung
    url: https://www.bitkom.org/sites/main/files/2026-02/bitkom-leitfaden-kuenstliche-intelligenz-und-mitbestimmung.pdf
    sprache: de
    urheber: Bitkom e.V.
    verifiziert: true
    notiz: Enthält die Rechtsprechungsübersicht (EuGH C-34/21, BAG 8 AZR 209/21, EuGH C-65/23) zum Beschäftigtendatenschutz
      bei KI.
  offene_punkte:
  - 'WIDERSPRÜCHLICH: Ob in der 21. Wahlperiode ein neuer Referentenentwurf eines BeschDG existiert, ist
    unklar. Es gibt Sekundärhinweise auf einen ''neuen Referentenentwurf'', aber kein amtliches Verfahrensdokument.
    Zu prüfen bei BMI und BMAS.'
  - Solange § 26 Abs. 1 BDSG unionsrechtswidrig ist, fehlt eine belastbare nationale Rechtsgrundlage für
    KI-gestützte Beschäftigtenanalysen.
  - Ob Betriebsvereinbarungen als 'spezifischere Vorschriften' im Sinne des Art. 88 DSGVO taugen, ist
    nach EuGH C-65/23 (19.12.2024) nur eingeschränkt möglich — sie müssen die Mindeststandards der DSGVO
    einhalten.
  - 'Statuskorrektur 05.09.2026: Status von "entwurf" auf "anwendbar" geändert — § 26 BDSG ist seit 25.05.2018
    in Kraft und wird angewandt; der Referentenentwurf des BeschDG ist mit dem Ende der 20. Wahlperiode
    der Diskontinuität anheimgefallen und deshalb kein eigener Rechtsetzungsstand des Regelwerks mehr.'
