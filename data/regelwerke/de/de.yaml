- id: de-urhg-tdm
  jurisdiktion: de
  kurztitel: TDM-Schranke §§ 44b, 60d UrhG und die deutschen KI-Urheberrechtsverfahren
  offizieller_titel: '§§ 44b, 60d Urheberrechtsgesetz (Text und Data Mining; Text und Data Mining für
    Zwecke der wissenschaftlichen Forschung), eingefügt durch das Gesetz zur Anpassung des Urheberrechts
    an die Erfordernisse des digitalen Binnenmarktes vom 31. Mai 2021

    '
  fundstelle: BGBl. I 2021 S. 1204 (Umsetzung der Art. 3, 4 DSM-RL (EU) 2019/790)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Die Schranken gelten seit dem 07.06.2021 unverändert. Ihre Reichweite für generatives
    KI-Training ist der zentrale urheberrechtliche Streitpunkt in Deutschland. Zwei Instanzenzüge laufen
    parallel: die LAION-Sache liegt beim BGH (I ZR 281/25, Verhandlung 03.09.2026), die GEMA-Verfahren
    gegen OpenAI und Suno beim LG bzw. OLG München. Erste- und zweitinstanzliche Rechtsprechung widersprechen
    sich inhaltlich: Hamburg bejaht die Schranken weit, München verneint § 44b UrhG für generative Modelle.

    '
  kurzbeschreibung: '§ 44b UrhG erlaubt Vervielfältigungen rechtmäßig zugänglicher Werke zum Zweck des
    Text und Data Mining, soweit der Rechtsinhaber sich die Nutzung nicht in maschinenlesbarer Form vorbehalten
    hat. § 60d UrhG privilegiert Forschungsorganisationen ohne kommerziellen Zweck; ein Nutzungsvorbehalt
    greift dort nicht. Adressaten sind Betreiber von Crawlern, Datensatzerstellern und KI-Trainingsläufen.
    Rechtsfolge eines Verstoßes sind Unterlassung, Auskunft und Schadensersatz nach §§ 97 ff. UrhG. Der
    Streit dreht sich um drei Fragen: ob KI-Training überhaupt TDM ist, welche Form ein maschinenlesbarer
    Vorbehalt haben muss und ob memorisierte Werke im Modell selbst eine Vervielfältigung darstellen.

    '
  inkrafttreten:
    datum: 2021-06-07
    verifiziert: false
    quelle: https://www.gesetze-im-internet.de/urhg/__44b.html
    fundstelle_norm: 'Art. 6 Abs. 1 des Gesetzes zur Anpassung des Urheberrechts an die Erfordernisse
      des digitalen Binnenmarktes vom 31.05.2021 (BGBl. I S. 1204) — Wortlaut am 05.09.2026 nicht an amtlicher
      Quelle einsehbar, daher verifiziert: false.'
  anwendungsdaten:
  - datum: 2024-09-27
    was_gilt: 'LG Hamburg, Urt. v. 27.09.2024 – 310 O 227/23 (Kneschke ./. LAION): Klage abgewiesen; §
      44b UrhG offengelassen, Zulässigkeit auf § 60d UrhG gestützt.'
    verifiziert: true
    quelle: https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2026/2026085.html
  - datum: 2025-11-11
    was_gilt: 'LG München I, Urt. v. 11.11.2025 – 42 O 14139/24 (GEMA ./. OpenAI): Verletzung von §§ 16,
      19a UrhG durch Memorisierung im Modell und durch Chatbot-Ausgaben; § 44b UrhG nicht einschlägig;
      Unterlassung, Auskunft, Schadensersatz.'
    verifiziert: true
    quelle: https://preubohlig.de/gema-v-openai-judgment-of-the-regional-court-of-munich-i/?lang=en
  - datum: 2025-12-08
    was_gilt: OpenAI legt Berufung ein — OLG München, Az. 6 U 3662/25 e.
    verifiziert: true
    quelle: https://urheber.info/diskurs/openai-legt-berufung-ein
  - datum: 2025-12-10
    was_gilt: 'OLG Hamburg, Urt. v. 10.12.2025 – 5 U 104/24: Berufung zurückgewiesen; § 44b UrhG erfasst
      auch die Prüfung, ob ein Bild zu einer Beschreibung passt, und Vorbereitungshandlungen für späteres
      KI-Training; der Vorbehalt in natürlicher Sprache war für 2021 nicht als maschinenlesbar nachgewiesen;
      zusätzlich § 60d UrhG. Revision zugelassen.'
    verifiziert: true
    quelle: https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=OLG+Hamburg&Datum=10.12.2025&Aktenzeichen=5+U+104%2F24
  - datum: 2026-07-31
    was_gilt: 'LG München I, Urt. v. 31.07.2026 – 42 O 763/25 (GEMA ./. Suno): Urheberrechtsverletzung
      durch Training in den USA und durch Speicherung/Ausgabe in Europa; europäische Gerichtsbarkeit auch
      für US-Training bejaht, wenn das System in Europa betrieben wird.'
    verifiziert: true
    quelle: https://www.gema.de/de/w/suno-entscheidung-2026
  - datum: 2026-09-03
    was_gilt: BGH, Verhandlungstermin I ZR 281/25 (Erstellen eines Datensatzes für KI-Training), 9:00
      Uhr.
    verifiziert: true
    quelle: https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2026/2026085.html
  themenachsen:
  - urheberrecht
  - content
  - gpai
  - haftung
  regelungsschwerpunkte:
  - '§ 44b Abs. 3 UrhG (Nutzungsvorbehalt, maschinenlesbar): Der Streitstand hat sich durch das OLG Hamburg
    verschoben. Maschinenlesbarkeit verlangt nach dem Berufungsurteil nicht nur technische Erfassbarkeit,
    sondern automatisierte Interpretierbarkeit dahin, dass erfasste Inhalte nicht ausgewertet werden.
    Ein Satz wie ''KI-Training verboten'' in natürlicher Sprache genügte für 2021 nicht; robots.txt und
    vergleichbare Signale sind der Referenzfall. Die Beweislast für Maschinenlesbarkeit zum konkreten
    Nutzungszeitpunkt trägt der Rechtsinhaber.'
  - '§ 60d UrhG (Forschungsschranke): Das OLG Hamburg hat LAION e.V. als Forschungsorganisation ohne kommerziellen
    Zweck eingeordnet, obwohl die erzeugten Datensätze faktisch kommerzielles Training ermöglichen. Das
    ist die praktisch folgenreichste Aussage — sie eröffnet einen Weg, den Nutzungsvorbehalt zu umgehen,
    weil § 60d ihn nicht kennt.'
  - 'BGH I ZR 281/25: Vorlagefrage im Kern, ob der Download eines Vorschaubildes zur Erstellung eines
    Trainingsdatensatzes (5,85 Mrd. Bild-Text-Paare) von § 44b oder § 60d UrhG gedeckt ist. Die Stockfoto-Website
    hatte den Zugriff durch ''automatisierte Programme, Applets, Bots oder Ähnliches'' untersagt. Verhandlung
    am 03.09.2026 — die erste höchstrichterliche Klärung der TDM-Schranke in der EU.'
  - 'LG München I 42 O 14139/24 (GEMA ./. OpenAI), Urt. v. 11.11.2025: Memorisierungsvermutung — reproduziert
    ein Modell komplexe geschützte Inhalte konsistent und wiederholbar ohne plausible Zufallserklärung,
    wird Memorisierung vermutet. Das Modell selbst ist damit Vervielfältigungsstück. § 44b UrhG greift
    nicht, weil die Ausgaben mit den Originalwerken konkurrieren und berechtigte Interessen der Rechtsinhaber
    beeinträchtigen (Dreistufentest). Eine EuGH-Vorlage lehnte das Gericht ab.'
  - 'LG München I 42 O 763/25 (GEMA ./. Suno), Urt. v. 31.07.2026: sechs Musikkompositionen (u.a. ''Forever
    Young'', ''Atemlos'', ''Mambo No. 5''). Die Kammer wies den Einwand zufälliger Ähnlichkeit wegen Komplexität
    und Länge der Werke zurück und rechnete Architektur und Memorisierung der Sphäre des Betreibers zu.
    Zusätzlich Vorwurf des Stream-Ripping von YouTube unter Umgehung technischer Schutzmaßnahmen. Anders
    als im OpenAI-Verfahren ging es um die Komposition, nicht um Liedtexte.'
  - 'Widerspruch Hamburg / München: Das OLG Hamburg legt § 44b UrhG weit aus und lässt § 60d als zweiten
    Rechtfertigungsgrund genügen; das LG München I verneint die Schranke für generative Modelle über den
    Dreistufentest. Die Fälle sind nicht identisch (Datensatzerstellung durch einen Forschungsverein gegen
    kommerzielles Training und Betrieb), aber die Begründungslinien sind unvereinbar.'
  - 'Gesetzgeberische Initiative: BT-Drs. 21/4758 vom 17.03.2026 (Fraktion Die Linke, ''Gesellschaftliche
    Risiken von KI-Anwendungen ernst nehmen'') fordert ein Opt-in-Prinzip statt des Opt-out, angemessene
    Vergütung für Trainingsnutzungen, Transparenzregeln, Verbandsklagerechte und zweckgebundene Abgaben
    der KI-Anbieter. Ein Regierungsentwurf zur Vergütung von Trainingsnutzungen existiert nicht.'
  - 'Bezug zur KI-VO: Art. 53 Abs. 1 lit. c KI-VO verpflichtet GPAI-Anbieter, Nutzungsvorbehalte nach
    Art. 4 Abs. 3 DSM-RL zu erkennen und zu beachten; Art. 53 Abs. 1 lit. d verlangt eine hinreichend
    detaillierte Zusammenfassung der Trainingsinhalte. Der GPAI-Verhaltenskodex konkretisiert das. Damit
    wird der urheberrechtliche Vorbehalt aufsichtsrechtlich flankiert.'
