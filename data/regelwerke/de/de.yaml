    datum: null
    verifiziert: false
    quelle: https://dserver.bundestag.de/brd/2026/0452-26.pdf
  anwendungsdaten:
  - datum: 2026-06-25
    was_gilt: Referentenentwurf des BMI (Bearbeitungsstand 25.06.2026, 11:16 Uhr) geht in die Verbändebeteiligung.
    verifiziert: true
    quelle: https://cdn.netzpolitik.org/wp-upload/2026/07/260625_RefE_Einsatz_KI_in_der_Migrationsverwaltung_c.pdf
  - datum: 2026-07-29
    was_gilt: Kabinettsbeschluss der Bundesregierung.
    verifiziert: true
    quelle: https://algorithmwatch.org/de/statement-zum-ki-migrationsverwaltungsgesetz-bundeskabinett-will-menschliche-schicksale-fur-evidenzlose-ki-forschung-nutzen/
  - datum: 2026-08-14
    was_gilt: Zuleitung an den Bundesrat als BR-Drs. 452/26.
    verifiziert: true
    quelle: https://dserver.bundestag.de/brd/2026/0452-26.pdf
  themenachsen:
  - sektor-oeffentlich
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Artikel 1 ändert das Asylgesetz: § 7 AsylG wird zu ''Verarbeitung personenbezogener Daten'' umbenannt
    und um die Befugnis erweitert, personenbezogene Daten zum Training, zur Validierung und zum Test automatisierter
    Anwendungen zu verarbeiten.'
  - '§ 7a AsylG-E: Automatisiertes Verfahrensmonitoring in Asylverfahren - Mustererkennung im Verfahrensverlauf,
    unter anderem zur Auffindung von Auffälligkeiten bei Ablehnungen.'
  - '§ 7b AsylG-E: Automatisierter Abgleich mit öffentlich zugänglichen Daten aus dem Internet. Drei kumulative
    Voraussetzungen: begründete Zweifel an der Richtigkeit entscheidungserheblicher Angaben, Erforderlichkeit
    des Abgleichs zur Klärung dieser Zweifel, verpflichtende manuelle Auswertung und Überprüfung der Ergebnisse
    durch die Behörde.'
  - 'Artikel 2 ändert das Aufenthaltsgesetz spiegelbildlich: § 86 AufenthG wird zu ''Verarbeitung personenbezogener
    Daten''; § 90d AufenthG-E regelt das automatisierte Verfahrensmonitoring in aufenthaltsrechtlichen
    Verfahren, § 90e AufenthG-E den automatisierten Internetabgleich.'
  - 'Artikel 3: Inkrafttreten am Tag nach der Verkündung - kein gestufter Anwendungsbeginn, keine Übergangsfrist,
    keine Evaluierungsklausel im Entwurfstext erkennbar.'
  - 'Kernbereichsschutz: Der Entwurf schützt den Kernbereich privater Lebensgestaltung nur, soweit Daten
    ''ausschließlich'' diesem zuzuordnen sind. Gemischte Datenbestände - im Asylverfahren der Regelfall,
    weil Verfolgungsschilderungen Traumata und Intimes mit verfahrenserheblichen Angaben verbinden - bleiben
    danach ungeschützt (Kritik PRO ASYL).'
  - 'Diskriminierungsschutz: Die Behörden haben sicherzustellen, ''dass diskriminierende Algorithmen weder
    herausgebildet noch verwendet werden'' - wortgleich mit § 9b Abs. 5 BKAG-E und § 98e StPO-E. Die Klausel
    bleibt abstrakt, obwohl Asyl- und Aufenthaltsverfahren gerade an geschützte Merkmale wie Ethnie, Religion
    und Geschlecht anknüpfen.'
  - 'Warum Fachgesetz im Massenverfahren: Anders als § 35a VwVfG, der nur den vollautomatisierten Erlass
    gebundener Verwaltungsakte betrifft, und anders als die KI-VO, die horizontal an Risikoklassen anknüpft,
    regelt das KIMVG erstmals bereichsspezifisch, welche konkreten KI-gestützten Arbeitsschritte in einem
    konkreten Massenverfahren zulässig sind - einschließlich der Verwendung der Verfahrensdaten selbst
    als Trainingsmaterial.'
  - 'Begründung des Entwurfs: ''Die Migrationsverwaltung sieht sich seit Jahren einem stetig steigenden
    Antragsaufkommen gegenüber. Die vorhandenen personellen und organisatorischen Kapazitäten reichen
    vielerorts nicht aus, um die Verfahren innerhalb angemessener Fristen zu bearbeiten.'' Ziel ist ein
    rechtssicherer und datenschutzkonformer Rahmen für effizientere, einheitlichere, qualitativ hochwertigere
    und sicherere Verfahren.'
