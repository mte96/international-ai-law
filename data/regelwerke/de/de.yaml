- id: de-deepfake-strafrecht
  jurisdiktion: de
  kurztitel: Deepfake-Strafbarkeit (§ 201b StGB-E) und Gesetz gegen digitale Gewalt
  offizieller_titel: 'Entwurf eines Gesetzes zum strafrechtlichen Schutz von Persönlichkeitsrechten vor
    Deepfakes (Bundesratsinitiative); Referentenentwurf eines Gesetzes gegen digitale Gewalt (GgdG) des
    Bundesministeriums der Justiz und für Verbraucherschutz

    '
  fundstelle: nicht verkündet
  verfahrensnummer: BR-Drs. 222/24; BT-Drs. 20/12605 (20. WP); BT-Drs. 21/1383 vom 27.08.2025; RefE GgdG,
    Bearbeitungsstand 16.04.2026; BT-Drs. 21/4949 (Bündnis 90/Die Grünen, § 184k StGB); BT-Drs. 21/6617
    (Antwort der Bundesregierung vom 29.06.2026)
  status: verfahren
  status_detail: 'Zwei parallele Stränge. Der Bundesratsentwurf (Initiative Bayern, 2024) wurde nach Diskontinuität
    zu Beginn der 21. Wahlperiode erneut eingebracht und am 27.08.2025 als BT-Drs. 21/1383 an den Bundestag
    übersandt; er ist dort nicht abgeschlossen. Das BMJV hat am 17.04.2026 einen eigenen Referentenentwurf
    eines Gesetzes gegen digitale Gewalt vorgestellt (Bearbeitungsstand 16.04.2026), der einen § 201b
    StGB neu, eine Erweiterung des § 184k StGB und einen § 202e StGB vorsieht sowie zivilrechtliche Instrumente
    (gerichtliches Auskunftsverfahren, Accountsperre) und eine dreimonatige IP-Speicherpflicht. Der Entwurf
    befand sich in der Länder- und Verbändebeteiligung; ein Kabinettbeschluss war für dieselbe Woche geplant,
    ist aber nicht belegt. Stand 27.08.2026 keine Verkündung.

    Stand 07.09.2026: Nach der Antwort der Bundesregierung vom 29.06.2026 (BT-Drs. 21/6617 auf die Kleine
    Anfrage BT-Drs. 21/6286) war der Entwurf eines Gesetzes gegen digitale Gewalt zu diesem Zeitpunkt
    weiterhin Referentenentwurf; das BMJV hatte ihn am 17.04.2026 veröffentlicht und die Länder- und Verbändebeteiligung
    eingeleitet. Ein Kabinettbeschluss ist bis 07.09.2026 nicht belegt. Dritter, bislang nicht erfasster
    Strang: Am 26.03.2026 (KW 13) fand die erste Lesung des Gesetzentwurfs von Bündnis 90/Die Grünen zur
    Änderung des § 184k StGB statt (BT-Drs. 21/4949, bildbasierte sexualisierte Gewalt einschließlich
    deepfake-generierter Darstellungen); der Entwurf wurde an die Ausschüsse überwiesen. Zum Bundesratsentwurf
    BT-Drs. 21/1383 ist kein neuer Verfahrensschritt nachweisbar.

    '
  kurzbeschreibung: 'Deutschland hat bislang keinen eigenständigen Straftatbestand für Deepfakes. Erfasst
    werden Einzelfälle über §§ 184b, 184c StGB, § 187 StGB (Verleumdung), § 201a StGB und § 33 KUG. Beide
    Entwürfe wollen diese Lücke schließen. Der Bundesratsentwurf stellt das Zugänglichmachen computertechnisch
    hergestellter oder veränderter Medieninhalte, die den Anschein einer wirklichkeitsgetreuen Bild- oder
    Tonaufnahme erwecken, unter Strafe (Grundtatbestand bis zwei Jahre, Qualifikation bei Öffentlichkeitszugang
    oder Betroffenheit des höchstpersönlichen Lebensbereichs bis fünf Jahre), mit Ausnahmen für Kunst,
    Wissenschaft und Berichterstattung. Der BMJV-Entwurf setzt bei der Rufschädigungseignung an und ergänzt
    § 184k StGB um sexualisierte Deepfakes. Adressaten sind natürliche Personen; flankierend treten Plattformpflichten
    aus dem DSA und die Kennzeichnungspflicht aus Art. 50 KI-VO hinzu.

    '
  inkrafttreten:
    datum: null
    verifiziert: false
    quelle: https://www.bmjv.de/SharedDocs/Pressemitteilungen/DE/2026/0417_Gesetz_gegen_digitale_Gewalt.html
