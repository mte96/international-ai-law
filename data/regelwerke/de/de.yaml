    werden — die BGBl-PDFs sind für automatisierte Abrufe gesperrt.
  - Wie die Geldbußen des Art. 99 KI-VO zwischen den Geschäftsbereichen abgegrenzt und Doppelsanktionen
    vermieden werden, ist gesetzlich nicht ausgeformt.
  - Verordnungsermächtigungen und untergesetzliche Ausgestaltung des Reallabor-Verfahrens (§ 13 KI-MIG)
    stehen aus.
  - Der genaue Inhalt der Änderung des SGB I (Artikel 3) ist nur als 'Datenschutz bei KI' belegt, nicht
    im Wortlaut geprüft.
  - Das durch den Ausschuss eingefügte nicht-öffentliche Hochrisiko-Register überschneidet sich mit der
    EU-Datenbank nach Art. 71 KI-VO; das Verhältnis ist ungeklärt.
