- id: de-berufsrecht-ki
  jurisdiktion: de
  kurztitel: Anwaltliches Berufsrecht, RDG und KI
  offizieller_titel: '§ 43e Bundesrechtsanwaltsordnung (Inanspruchnahme von Dienstleistungen); §§ 2, 3
    Rechtsdienstleistungsgesetz in der Auslegung durch die Rechtsprechung des Bundesgerichtshofs zu Legal-Tech-Anwendungen

    '
  fundstelle: '§ 43e BRAO: BGBl. I 2017 S. 3618 (Gesetz zur Neuregelung des Schutzes von Geheimnissen
    bei der Mitwirkung Dritter an der Berufsausübung schweigepflichtiger Personen)'
  verfahrensnummer: null
  status: anwendbar
  status_detail: '§ 43e BRAO gilt seit 09.11.2017 und ist die zentrale Norm für den Einsatz externer KI-Dienstleister
    in der Anwaltschaft. Das RDG ist unverändert; die Grenzen automatisierter Rechtsdienstleistungen sind
    durch BGH-Rechtsprechung markiert (I ZR 113/20 — smartlaw; VIII ZR 285/18 — wenigermiete.de). Ein
    KI-spezifisches Berufsrecht existiert nicht; die KI-VO wirkt über Anhang III Nr. 8 (Rechtspflege)
    nur auf Justizanwendungen, nicht auf anwaltliche Arbeitsmittel.

    '
  kurzbeschreibung: 'Für Anwältinnen und Anwälte, die KI-Werkzeuge einsetzen, sind zwei Regelungskomplexe
    maßgeblich. § 43e BRAO verlangt die sorgfältige Auswahl des Dienstleisters, eine Vereinbarung in Textform
    mit Verschwiegenheitsverpflichtung unter Hinweis auf die Strafbewehrung (§ 203 StGB), eine Beschränkung
    des Zugangs zu fremden Geheimnissen auf das Erforderliche, Regelungen zur Unterbeauftragung sowie
    bei Auslandsbezug einen vergleichbaren Geheimnisschutz; für mandatsbezogene Offenbarungen ist die
    Einwilligung des Mandanten erforderlich. Das RDG begrenzt, wieweit Softwareanbieter selbst Rechtsdienstleistungen
    erbringen dürfen. Verstöße gegen § 43e BRAO sind berufsrechtlich sanktioniert, Verstöße gegen das
    RDG führen zur Nichtigkeit nach § 134 BGB und zu wettbewerbsrechtlichen Ansprüchen.

    '
  inkrafttreten:
    datum: 2017-11-09
    verifiziert: true
    quelle: https://dejure.org/gesetze/BRAO/43e.html
  anwendungsdaten:
  - datum: 2017-11-09
    was_gilt: § 43e BRAO anwendbar — Rahmen für Auslagerung an Dienstleister einschließlich Cloud- und
      KI-Anbieter.
    verifiziert: true
    quelle: https://dejure.org/gesetze/BRAO/43e.html
  - datum: 2021-09-09
    was_gilt: 'BGH, Urt. v. 09.09.2021 – I ZR 113/20 (smartlaw): Ein digitaler Vertragsdokumentengenerator
      ist keine unerlaubte Rechtsdienstleistung, weil es an einer konkreten fremden Angelegenheit und
      an individueller Rechtsberatung fehlt.'
    verifiziert: true
    quelle: https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=09.09.2021&Aktenzeichen=I%20ZR%20113/20
  themenachsen:
  - berufsrecht
  - vertrag
  - datenschutz
  regelungsschwerpunkte:
  - '§ 43e Abs. 2 BRAO: Textformerfordernis für den Dienstleistungsvertrag, Verschwiegenheitsverpflichtung
    mit Hinweis auf die strafrechtlichen Folgen, Beschränkung des Zugangs auf das für die Leistungserbringung
    Erforderliche, ausdrückliche Regelung zulässiger Unterbeauftragung. Für SaaS-KI-Dienste bedeutet das:
    Standard-AGB großer Anbieter genügen regelmäßig nicht ohne Zusatzvereinbarung.'
  - '§ 43e Abs. 4 BRAO: Bei Dienstleistungen im Ausland ist zusätzlich zu prüfen, ob der Geheimnisschutz
    dem inländischen vergleichbar ist. Für US-Cloud-Anbieter ist das der neuralgische Punkt.'
  - '§ 43e Abs. 5 BRAO: Für die Offenbarung mandatsbezogener Geheimnisse ist die Einwilligung des Mandanten
    erforderlich — beim Hochladen von Mandatsunterlagen in ein externes KI-System die entscheidende Hürde.'
  - § 203 StGB flankiert strafrechtlich; § 203 Abs. 3 Satz 2 StGB privilegiert mitwirkende Personen, wenn
    die Voraussetzungen des § 43e BRAO eingehalten sind.
  - 'RDG-Grenze: BGH I ZR 113/20 (smartlaw) erlaubt schematische Dokumentgeneratoren, BGH VIII ZR 285/18
    (wenigermiete.de) erlaubt Inkassodienstleistern die Durchsetzung von Ansprüchen. Für generative KI,
    die individuelle Rechtsfragen beantwortet, ist die Abgrenzung offen — die Argumentation des BGH stellt
    auf das Fehlen individueller Prüfung ab, was bei LLM-Ausgaben gerade nicht gegeben ist.'
  - Art. 4 KI-VO (KI-Kompetenz, anwendbar seit 02.02.2025) trifft auch Kanzleien als Betreiber von KI-Systemen
    und begründet eine Schulungsobliegenheit.
  - 'Anhang III Nr. 8 lit. a KI-VO: KI-Systeme, die eine Justizbehörde bei der Ermittlung des Sachverhalts
    und der Rechtsauslegung oder bei der Rechtsanwendung unterstützen, sind Hochrisiko-KI. Das betrifft
    Gerichte, nicht Kanzleien.'
  dokumente:
  - datum: 2017-11-09
    typ: norm
    titel: § 43e BRAO — Inanspruchnahme von Dienstleistungen
    url: https://dejure.org/gesetze/BRAO/43e.html
    sprache: de
    urheber: Bundesgesetzgeber / dejure.org
    verifiziert: true
    notiz: Wortlaut und Inkrafttreten bestätigt; einschlägig für Cloud- und KI-Auslagerung.
  - datum: 2021-09-09
    typ: bericht
    titel: BGH, Urt. v. 09.09.2021 – I ZR 113/20 (smartlaw)
    url: https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=09.09.2021&Aktenzeichen=I%20ZR%20113/20
    sprache: de
    urheber: dejure.org
    verifiziert: true
    notiz: Grundsatzentscheidung zur RDG-Grenze automatisierter Rechtsdokumentenerstellung; zitierte Normen
      § 3a UWG, §§ 2 Abs. 1, 3 RDG.
  offene_punkte:
  - Keine aktuelle BRAK- oder DAV-Stellungnahme speziell zu KI im Anwaltsberuf über die BRAK-Website auffindbar
    (Newsroom und Stellungnahmenarchiv geprüft, Stand 26.08.2026). Möglicherweise in den Jahresarchiven;
    die Volltextsuche war nicht abrufbar.
  - Offen, ob der Einsatz generativer KI zur Erstellung individueller Schriftsätze durch Nichtanwälte
    eine Rechtsdienstleistung nach § 2 RDG darstellt. Keine höchstrichterliche Entscheidung.
  - Keine berufsrechtliche Kennzeichnungspflicht für KI-erstellte anwaltliche Arbeitsergebnisse.
  monitoring_quellen:
  - https://www.brak.de/interessenvertretung/stellungnahmen-der-brak/
  - https://www.brak.de/newsroom/
  - https://anwaltverein.de/de/interessenvertretung/stellungnahmen
  - https://www.bundesgerichtshof.de/
