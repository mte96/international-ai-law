  kurztitel: HB 452 (Utah, Mental-Health-Chatbots) und die Vorhaben 2026
  offizieller_titel: 'Artificial Intelligence Amendments — Mental Health Chatbots (House Bill 452, 2025);
    ergänzt durch HB 276 und HB 289 (2026)

    '
  fundstelle: Utah Code §§ 13-72a-101, 13-72a-201 bis 13-72a-203, 58-60-118 (Artificial Intelligence Applications
    Relating to Mental Health)
  verfahrensnummer: UT HB 452 (2025 General Session); HB 276, HB 289, HB 320 (2026); HB 438 (2026, nicht
    ausgefertigt)
  status: anwendbar
  status_detail: 'HB 452 ist seit der Session 2025 anwendbar. In der Session 2026 wurden HB 276 (Artificial
    Intelligence Modifications, Deepfakes/Voyeurismus) und HB 289 (Child Sexual Abuse Material Amendments)
    am 24.03.2026 sowie HB 320 am 18.03.2026 unterzeichnet. HB 438 (Companion Chatbot Safety Act) erscheint
    NICHT in der Unterzeichnungsliste des Gouverneurs. Ein weiteres Vorhaben, HB 286 (Sicherheitspläne
    für KI-Entwickler), wurde nach ausdrücklicher Intervention des Weißen Hauses im Februar 2026 gestoppt.

    '
  kurzbeschreibung: 'HB 452 regelt "mental health chatbots" — KI-Technologie, die Gespräche führt, wie
    sie eine Person mit einer lizenzierten Fachkraft für psychische Gesundheit vertraulich führen würde.
    Anbieter müssen vor und während der Interaktion klar offenlegen, dass es sich nicht um einen Menschen
    handelt; sie dürfen während der Sitzung nicht werben und keine personenbezogenen Gesundheitsdaten
    an Dritte verkaufen oder weitergeben (mit engen Ausnahmen). Entwickler müssen die Beteiligung lizenzierter
    Fachkräfte dokumentieren, regelmäßig testen und Vorkehrungen gegen diskriminierende Behandlung treffen.
    Durchsetzung durch die Division of Consumer Protection mit bis zu 2.500 USD je Verstoß; Gerichte können
    Unterlassung anordnen und Anwaltskosten zusprechen.

    '
