  regelungsschwerpunkte:
  - A 6578 würde New York zum zweiten Staat mit einer Trainingsdaten-Offenlegungspflicht machen. Für europäische
    Modellanbieter bedeutete das eine zweite, möglicherweise abweichende Datensatzzusammenfassung.
  - S 6954 (Provenienz) tritt neben Kalifornien SB 942/AB 853 — zwei Bundesstaaten mit Kennzeichnungspflichten
    für synthetische Inhalte, ohne abgestimmten technischen Standard.
  - S 9051 verschärft gegenüber GBL Art. 47 durch altersbezogene Funktionsverbote statt reiner Offenlegung.
  - 'Bereits im Januar 2026 in Kraft getreten und daher NICHT mehr hier erfasst: das New Yorker Gesetz
    zur Offenlegung ''synthetischer Darsteller'' in Werbung (erste US-Regelung dieser Art).'
  - A 11560 (Rechenzentrumsmoratorium) markiert das 2026 neu entstandene Regelungsfeld Rechenzentren,
    das 2026 landesweit 28 Gesetze hervorgebracht hat.
