- id: us-ny-gbl-art47
  jurisdiktion: us
  subjurisdiktion: us-ny
  kurztitel: AI Companion Safeguards (New York, GBL Art. 47)
  offizieller_titel: 'New York General Business Law, Article 47 — Safeguards for AI Companion Models (eingefügt
    durch den Haushaltsbegleitakt S 3008 / Budget Bill 2025-2026)

    '
  fundstelle: N.Y. Gen. Bus. Law §§ 1700 ff. (Article 47); Laws of New York 2025
  verfahrensnummer: NY S 3008 (2025-2026 Budget Bill, Part)
  status: anwendbar
  status_detail: 'Seit 05.11.2025 anwendbar. Gouverneurin Hochul hat am 10.11.2025 die betroffenen Anbieter
    förmlich angeschrieben und auf die Pflichten hingewiesen — ein ungewöhnlich direkter Vollzugsauftakt.
    Für 2027 steht mit dem Kids Chatbot Safety Act (S 9051) eine Verschärfung an.

    '
  kurzbeschreibung: 'Anbieter von "AI companion models" — KI-Systemen, die durch personalisierten Dialog
    eine anhaltende menschenähnliche Beziehung simulieren — müssen erstens sicherstellen, dass Nutzer
    erkennbar informiert werden, dass sie mit einer KI und nicht mit einem Menschen sprechen: zu Beginn
    und danach bei fortlaufender Interaktion mindestens alle drei Stunden. Zweitens müssen sie ein Verfahren
    betreiben, das Suizidgedanken oder Selbstverletzungsäußerungen erkennt und den Nutzer an Krisendienste
    verweist. Ausgenommen sind Kundenservice-Werkzeuge, interne Systeme und Produktivitätssoftware. Durchsetzung
    durch den Attorney General mit Zivilstrafen bis 15.000 USD je Tag; die Einnahmen fließen in ein Suizidpräventionsprogramm.
    Kein privates Klagerecht.

    '
  inkrafttreten:
    datum: 2025-11-05
    verifiziert: true
    quelle: https://www.fenwick.com/insights/publications/new-yorks-ai-companion-safeguard-law-takes-effect
  anwendungsdaten:
  - datum: 2025-11-05
    was_gilt: 'Volle Anwendbarkeit: 3-Stunden-Offenlegung, Suizid-Erkennungs- und Verweisprotokoll, Durchsetzung
      durch den Attorney General.'
    verifiziert: true
    quelle: https://www.fenwick.com/insights/publications/new-yorks-ai-companion-safeguard-law-takes-effect
  - datum: 2025-11-10
    was_gilt: Anschreiben der Gouverneurin an die Companion-AI-Anbieter mit Hinweis auf die geltenden
      Pflichten.
    verifiziert: false
    quelle: https://www.governor.ny.gov/news/governor-hochul-pens-letter-ai-companion-companies-notifying-them-safeguard-requirements-are
  themenachsen:
  - content
  - grundrechte
  - sektor-medizin
  - haftung
  regelungsschwerpunkte:
  - Die 3-Stunden-Offenlegung gilt für ALLE Nutzer, nicht nur für Minderjährige — das ist strenger als
    Kalifornien SB 243, wo die Pausenerinnerung nur bei erkannten Minderjährigen greift.
  - 15.000 USD je TAG ist die höchste Tagessanktion aller untersuchten Chatbot-Gesetze. Kein privates
    Klagerecht — der umgekehrte Sanktionsansatz zu Kalifornien.
  - Zweckbindung der Einnahmen an Suizidprävention — ein regulatorisch ungewöhnliches Element.
  - Die Regelung wurde im Haushaltsbegleitgesetz erlassen, nicht in einem eigenständigen Verfahren; das
    erklärt die knappe Regelungstiefe.
  - 'Wer sowohl in Kalifornien als auch in New York anbietet, muss beide Regime kumulativ erfüllen: NY-Frequenz
    für alle Nutzer, CA-Zusatzpflichten für Minderjährige, CA-Berichtspflicht ab 01.07.2027.'
  dokumente:
  - datum: 2025-11-10
    typ: bericht
    titel: New York's AI Companion Safeguard Law Takes Effect
    url: https://www.fenwick.com/insights/publications/new-yorks-ai-companion-safeguard-law-takes-effect
    sprache: en
    urheber: Fenwick & West LLP
    verifiziert: true
    notiz: Belegt Inkrafttreten 05.11.2025, die Pflichten im Einzelnen und die Sanktionshöhe von 15.000
      USD je Tag.
  - datum: 2025-11-10
    typ: pressemitteilung
    titel: Governor Hochul Pens Letter to AI Companion Companies Notifying Them Safeguard Requirements
      Are in Effect
    url: https://www.governor.ny.gov/news/governor-hochul-pens-letter-ai-companion-companies-notifying-them-safeguard-requirements-are
    sprache: en
    urheber: Office of the Governor of New York
    verifiziert: true
    notiz: 'Der Vollzugsauftakt vom 10.11.2025: die Gouverneurin adressiert die Anbieter unmittelbar und
      benennt beide Kernpflichten (Erkennung von Suizidäußerungen mit Verweis an Krisendienste; KI-Hinweis
      zu Sitzungsbeginn und danach alle drei Stunden) sowie die Zweckbindung der Bußgelder an Suizidprävention.
      Zeigt, dass New York anders als NYC bei LL 144 tatsächlich durchsetzen will.

      '
  offene_punkte:
  - Keine Altersverifikationspflicht; der Kids Chatbot Safety Act (S 9051) soll das ab 01.01.2027 nachholen,
    ist aber zum 27.08.2026 noch nicht unterzeichnet.
  - Keine bekannte Durchsetzungsmaßnahme des Attorney General (Stand 27.08.2026).
