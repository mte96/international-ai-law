- id: us-ny-session-2026
  jurisdiktion: us
  subjurisdiktion: us-ny
  kurztitel: New York — Sitzungsperiode 2026 (dem Gouverneur zugeleitete KI-Vorhaben)
  offizieller_titel: 'New York State Legislature, 2026 Session — verabschiedete, aber noch nicht ausgefertigte
    KI-Gesetze

    '
  fundstelle: Noch keine — Ausfertigung ausstehend
  verfahrensnummer: NY S 9051, A 6578, S 6954, S 8451, A 9349, A 11560, A 3411
  status: verabschiedet
  status_detail: 'Die Sitzungsperiode endete am 01.06.2026. Mindestens sechs KI-Vorlagen wurden verabschiedet
    und liegen der Gouverneurin vor; die Frist für Unterzeichnung oder Veto läuft bis zum 31.12.2026.
    Bis 27.08.2026 ist keine Entscheidung bekannt.

    '
  kurzbeschreibung: 'Die wichtigsten Vorlagen: S 9051 (Kids Chatbot Safety Act) untersagt KI-Companion-Chatbots
    bestimmte Funktionen gegenüber unter 18-Jährigen, anwendbar ab 01.01.2027, durchgesetzt vom Attorney
    General mit bis zu 25.000 USD je Verstoß. A 6578 (AI Training Data Transparency Act) verlangt von
    Entwicklern generativer KI eine veröffentlichte Zusammenfassung der Trainingsdatensätze — die New
    Yorker Entsprechung zu Kalifornien AB 2013. S 6954 verlangt die Kennzeichnung synthetischer Inhalte
    mit Angaben zu Erzeuger und technischen Details, anwendbar 180 Tage nach Ausfertigung. S 8451 (FAIR
    News Act) verlangt eine deutliche Offenlegung, wenn Nachrichteninhalte im Wesentlichen KI-generiert
    sind, mit 1.000 USD beim ersten und 5.000 USD bei weiteren Verstößen. Hinzu kommen A 9349 (Verbot
    von Überwachungspreisen) und A 11560 (Responsible Data Center Development Act, Moratorium).

    '
