  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: Kalifornien — Sitzungsperiode 2026 (laufende KI-Vorhaben)
  offizieller_titel: 'California Legislature, 2025-2026 Regular Session — zweites Jahr: KI-bezogene Gesetzesvorhaben
    vor der Vertagung am 31.08.2026

    '
  fundstelle: Noch keine — Verfahren laufen
  verfahrensnummer: diverse (AB 2, AB 1159, AB 1609, AB 1883, AB 1979, AB 2023, AB 2025, AB 2392, AB 2575,
    AB 2656, AB 2713, SB 300, SB 503, SB 574, SB 813, SB 867, SB 903, SB 947, SB 951, SB 1000, SB 1050,
    SB 1111, SB 1119, SB 1159)
  status: verabschiedet
  status_detail: 'Stand 27.08.2026: Die Legislative vertagt sich am 31.08.2026. Rund 24 KI-Vorhaben stehen
    unmittelbar vor der Schlussabstimmung, weitere sind bereits zugeleitet. Der Gouverneur hat danach
    30 Tage für Unterzeichnung oder Veto. Bereits unterzeichnet: AB 1651 (KI beim Anwaltsexamen, am 22.08.2026).
    Für europäische Anbieter sind vor allem AB 2713 (Provenienzdaten), SB 813 (AI Standards and Safety
    Commission), SB 1000 (KI-Offenlegung) und SB 947 (automatisierte Entscheidungen im Beschäftigungsverhältnis)
    relevant.

    Stand 07.09.2026: Die Sitzungsperiode ist beendet. Der 31.08.2026 war nach dem amtlichen Fristenkalender
    des Senats der letzte Tag, an dem beide Häuser Vorlagen verabschieden konnten (Cal. Const. Art. IV
    Sec. 10(c), J.R. 61(b)(17)). Der Gouverneur muss bis zum 30.09.2026 unterzeichnen oder ein Veto einlegen
    (Art. IV Sec. 10(b)(2)); ohne Handlung wird die Vorlage kraft Verfassung Gesetz. Belegbar beim Gouverneur
    liegen: SB 813 (McNerney, Rahmen für unabhängige Drittprüfungen von KI-Sicherheitsrisiken, verabschiedet
    30.08.2026), SB 947 (McNerney, No Robo Bosses Act of 2026, menschliche Aufsicht bei KI-gestützten
    Entlassungs- und Disziplinarentscheidungen; Assembly 30.08.2026 mit 53:14, Senat 31.08.2026 mit 28:10)
    und SB 1168 (McNerney, Kostenbeteiligung von Rechenzentren). Die Unterzeichnungsmeldung von gov.ca.gov
    vom 31.08.2026 umfasst dreizehn Vorlagen, darunter keine KI-Vorlage; eine spätere Meldung existiert
    bis 07.09.2026 nicht.

    '
  kurzbeschreibung: 'Kalifornien reguliert 2026 nicht mehr über ein Leitgesetz, sondern über eine Vielzahl
    sektoraler Vorhaben. Schwerpunkte: Chatbot- und Kindersicherheit (SB 1119, AB 2023, SB 300, SB 867,
    AB 2), Arbeitswelt (SB 947 als Nachfolger des 2025 vetierten No Robo Bosses Act, AB 1883 Überwachung
    am Arbeitsplatz, AB 2656 45-Tage-Vorabinformation vor KI-Einführung, SB 951 90-Tage-Anzeige vor technologiebedingtem
    Stellenabbau), Gesundheit (AB 1979, AB 2575, SB 503 Bias-Minderung, SB 903), Provenienz und Offenlegung
    (AB 2713, SB 1000, SB 1050, SB 1111), Bildung (AB 1159, AB 2392, AB 2071, SB 928), Berufsrecht (SB
    574, AB 1651) sowie mit SB 813 der Vorschlag einer eigenen KI-Standards- und Sicherheitskommission.

    '
