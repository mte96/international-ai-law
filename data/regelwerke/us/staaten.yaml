  offene_punkte:
  - 'Keine Rechtsverordnung, keine Aufsichtsbehörde mit Auslegungskompetenz: ''wesentliche Modifikation'',
    ''Deployment'' und der Zeitpunkt der Berichtspflicht sind ungeklärt.'
  - Ob das California Department of Technology zum 01.01.2027 tatsächlich eine Absenkung der 10^26-Schwelle
    empfiehlt, ist offen — das wäre der Hebel, der mittelgroße europäische Anbieter erstmals erfassen
    würde.
  - 'Verhältnis zu EO 14365 ungeklärt: SB 53 ist dort namentlich benannt, eine Klage der DOJ Task Force
    ist bis 27.08.2026 nicht erhoben.'
  - 'Widersprüchliche Quellen zum Unterzeichnungsdatum: Wikipedia nennt 25.09.2025, der ausgefertigte
    Text und die Mitteilung des Gouverneurs nennen 29.09.2025. Maßgeblich ist 29.09.2025.'
