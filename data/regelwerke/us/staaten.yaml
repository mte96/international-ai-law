  - datum: 2026-01-08
    typ: uebersicht
    titel: 'Zooming in on AI: California''s evolving AI legal landscape entering 2026'
    url: https://www.aoshearman.com/en/insights/ao-shearman-on-tech/zooming-in-on-ai-california-evolving-ai-legal-landscape-entering-2026
    sprache: en
