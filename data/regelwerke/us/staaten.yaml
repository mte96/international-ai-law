- id: us-ca-ab3030
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: AB 3030 / AB 489 (Kalifornien, KI im Gesundheitswesen)
  offizieller_titel: 'Health Care Services: Artificial Intelligence (Assembly Bill 3030, Calderon) — ergänzt
    durch AB 489 (2025), Health Care Professions: Deceptive Terms or Letters

    '
  fundstelle: 'AB 3030: Chapter 848, Statutes of 2024; Health & Safety Code §§ 1339.75 ff. — AB 489: Statutes
    of 2025'
  verfahrensnummer: CA AB 3030 (2023-2024); CA AB 489 (2025-2026)
  status: anwendbar
  status_detail: 'AB 3030 seit 01.01.2025 anwendbar, AB 489 seit 01.01.2026. Zusammen mit SB 1120 (Utilization
    Review, seit 01.01.2025) bilden sie das kalifornische Gesundheits-KI-Paket. Im Verfahren 2026 stehen
    mit AB 1979, AB 2575 und SB 503 drei Erweiterungen kurz vor der Verabschiedung.

    '
  kurzbeschreibung: 'AB 3030 verpflichtet Krankenhäuser, Kliniken, Praxisgruppen und Arztpraxen, jede
    mit generativer KI erzeugte Patientenkommunikation über klinische Informationen mit einem Hinweis
    auf die KI-Erzeugung und einer Anleitung zur Kontaktaufnahme mit einem menschlichen Behandler zu versehen.
    Der Hinweis muss bei Schrift am Anfang prominent stehen, bei Audio zu Beginn und am Ende gesprochen
    werden, bei Video und laufendem Chat durchgehend sichtbar sein. Die Pflicht entfällt, wenn ein lizenzierter
    Behandler die Mitteilung gelesen und geprüft hat. Rein administrative Kommunikation (Terminvergabe,
    Abrechnung) ist ausgenommen. Sanktion: Bußgelder und Approbations- bzw. Zulassungsmaßnahmen. AB 489
    ergänzt das um ein Verbot, dass ein KI-System durch Titel, Abkürzungen oder Bezeichnungen den Eindruck
    erweckt, die Nutzerin werde von einer lizenzierten Gesundheitsfachkraft behandelt.

    '
  inkrafttreten:
    datum: 2025-01-01
    verifiziert: true
    quelle: https://www.afslaw.com/perspectives/alerts/california-requires-disclaimers-health-care-providers-ai-generated-patient
  anwendungsdaten:
  - datum: 2025-01-01
    was_gilt: 'AB 3030: Kennzeichnungspflicht für GenKI-erzeugte klinische Patientenkommunikation; ebenso
      SB 1120 (KI in der Leistungsprüfung von Krankenversicherern).'
    verifiziert: true
    quelle: https://www.afslaw.com/perspectives/alerts/california-requires-disclaimers-health-care-providers-ai-generated-patient
  - datum: 2026-01-01
    was_gilt: 'AB 489: Verbot der Verwendung geschützter Berufsbezeichnungen und -titel durch KI-Systeme
      im Gesundheitskontext; durchsetzbar über die berufsrechtlichen Aufsichtsgremien.'
    verifiziert: true
    quelle: https://www.aoshearman.com/en/insights/ao-shearman-on-tech/zooming-in-on-ai-california-evolving-ai-legal-landscape-entering-2026
  themenachsen:
  - sektor-medizin
  - berufsrecht
  - content
  - haftung
  regelungsschwerpunkte:
  - 'Health & Safety Code § 1339.75: Auslöser ist die ''klinische Information'' — Informationen zum Gesundheitszustand
    der Patientin. Administrative Kommunikation ist ausgenommen.'
  - 'Der Human-Review-Ausnahmetatbestand ist der praktische Hebel: wer den Output durch eine lizenzierte
    Fachkraft lesen und freigeben lässt, entgeht der Kennzeichnungspflicht vollständig.'
  - 'Sanktionsdualismus: Einrichtungen über Bußgeld und Betriebserlaubnis, Ärztinnen über die Approbation
    (Medical Board of California).'
  - AB 489 zielt auf Chatbots, die sich als 'Dr.', 'Nurse' oder 'Therapist' ausgeben — die kalifornische
    Parallele zum Illinois WOPR Act, aber als reine Bezeichnungsregel statt als Tätigkeitsverbot.
  - 'SB 1120 (2024) flankiert: Bei der Leistungsprüfung durch Krankenversicherer darf KI die medizinische
    Notwendigkeit nicht allein entscheiden; die endgültige Ablehnung muss ein lizenzierter Arzt treffen.'
