- id: us-tx-hb149
  jurisdiktion: us
  subjurisdiktion: us-tx
  kurztitel: TRAIGA / HB 149 (Texas)
  offizieller_titel: 'Texas Responsible Artificial Intelligence Governance Act (House Bill 149, Capriglione)
    — Relating to the development, deployment, use of and rights regarding artificial intelligence systems

    '
  fundstelle: Texas Business & Commerce Code, Chapter 552 (neu eingefügt); Acts of the 89th Texas Legislature,
    Regular Session (2025)
  verfahrensnummer: TX HB 149 (89th Legislature, Regular Session, 2025)
  status: anwendbar
  status_detail: 'Am 22.06.2025 von Gouverneur Abbott unterzeichnet, seit 01.01.2026 anwendbar. Die im
    Entwurf noch vorgesehene umfassende Hochrisiko-Regulierung nach Colorado-Vorbild wurde im Verfahren
    gestrichen; übrig blieb ein absichtsbasiertes Verbotsregime mit deutlich strengeren Regeln für staatliche
    Stellen als für Private.

    '
  kurzbeschreibung: 'TRAIGA gilt für jeden, der in Texas Geschäfte betreibt oder Produkte und Dienste
    an Einwohner von Texas anbietet, sowohl für Entwickler als auch für Deployer. Es verbietet die ENTWICKLUNG
    ODER VERWENDUNG eines KI-Systems mit bestimmten Absichten: Verhaltensmanipulation zur Anstiftung zu
    Selbstverletzung, Fremdschädigung oder Straftaten; unzulässige Diskriminierung; die alleinige Absicht,
    Grundrechte zu verletzen; sowie die Erstellung oder Verbreitung von Darstellungen sexuellen Kindesmissbrauchs
    und expliziter Deepfakes mit Minderjährigen. Der Diskriminierungstatbestand verlangt ausdrücklich
    Absicht — ungleiche Auswirkungen allein genügen NICHT. Für staatliche Stellen gelten zusätzlich: Offenlegungspflicht
    vor oder bei der Interaktion, Verbot von Social Scoring und Verbot biometrischer Identifizierung aus
    öffentlich zugänglichen Quellen ohne Einwilligung. Im Gesundheitswesen ist der KI-Einsatz offenzulegen.
    Das Department of Information Resources betreibt eine 36-monatige Regulatory Sandbox mit vierteljährlichen
    Berichten. Durchsetzung ausschließlich durch den Attorney General mit 60-tägiger Heilungsfrist; kein
    privates Klagerecht. Lokale KI-Satzungen sind präemptiert.

    '
