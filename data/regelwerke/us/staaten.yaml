  pruefvermerk:
  - Bestaetigt an der amtlichen ILCS-Quellenangabe, die in der Vorrunde nicht abrufbar war (ilga.gov-Link
    im Eintrag laeuft ins Leere; Justia fuehrt den Wortlaut der Source-Note). Public Act 95-994 wurde
    am 03.10.2008 wirksam; das ist zugleich Ausfertigungs- und Wirksamkeitstag, weil das Gesetz keine
    abweichende Frist bestimmt. Die URL im Eintrag sollte auf die funktionierende ILCS- oder Justia-Adresse
    geaendert werden.
- id: us-il-hb1806
  jurisdiktion: us
  subjurisdiktion: us-il
  kurztitel: WOPR Act / HB 1806 (Illinois, KI in der Therapie)
  offizieller_titel: 'Wellness and Oversight for Psychological Resources Act (House Bill 1806), Public
    Act 104-0054

    '
  fundstelle: Public Act 104-0054 (2025); 225 ILCS 55 (Illinois Compiled Statutes, Professions)
  verfahrensnummer: IL HB 1806 (104th General Assembly, 2025)
  status: anwendbar
  status_detail: 'Am 04.08.2025 von Gouverneur Pritzker unterzeichnet und sofort in Kraft getreten. Erstes
    US-Gesetz, das KI-Therapie unmittelbar untersagt, nicht nur kennzeichnet. Vorbild für die vergleichbaren
    Regelungen 2026 in weiteren Staaten.

    '
  kurzbeschreibung: 'Der WOPR Act untersagt es jeder Stelle — ausdrücklich einschließlich internetbasierter
    künstlicher Intelligenz —, Therapie- oder Psychotherapiedienste zu erbringen, sofern sie nicht von
    einer lizenzierten Fachkraft erbracht werden. KI-Systeme dürfen keine eigenständigen klinischen Entscheidungen
    treffen, nicht unmittelbar mit Klienten über deren psychische Gesundheit kommunizieren, keine Behandlungspläne
    ohne fachliche Prüfung erzeugen und keine Emotionserkennung zu therapeutischen Zwecken betreiben.
    Zulässig bleibt der Einsatz für Verwaltungsaufgaben wie Terminvergabe und Abrechnung sowie für ergänzende,
    nicht-therapeutische Unterstützung — letzteres nur mit dokumentierter schriftlicher Einwilligung,
    die das Werkzeug und seinen Zweck konkret benennt. Durchsetzung durch das Illinois Department of Financial
    and Professional Regulation mit Zivilstrafen bis 10.000 USD je Verstoß.

    '
  inkrafttreten:
    datum: 2025-08-04
    verifiziert: true
    quelle: https://www.bakerdonelson.com/illinois-passes-extensive-law-regulating-ai-in-behavioral-health
  anwendungsdaten:
  - datum: 2025-08-04
    was_gilt: 'Sofortiges Inkrafttreten mit Unterzeichnung: Verbot der KI-Therapie, Einwilligungserfordernis
      für ergänzende Nutzung, Durchsetzung durch IDFPR.'
    verifiziert: true
    quelle: https://idfpr.illinois.gov/news/2025/gov-pritzker-signs-state-leg-prohibiting-ai-therapy-in-il.html
  themenachsen:
  - sektor-medizin
  - berufsrecht
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - Tätigkeitsverbot statt Kennzeichnungspflicht — der schärfste Regelungstyp im US-Gesundheits-KI-Recht.
    Kalifornien (AB 489) und Utah (HB 452) regeln denselben Bereich nur über Bezeichnungsverbote bzw.
    Offenlegung.
  - Ausdrückliches Verbot der Emotionserkennung im therapeutischen Kontext — Parallele zu Art. 5 Abs.
    1 lit. f KI-VO, dort allerdings auf Arbeitsplatz und Bildungseinrichtungen beschränkt.
  - 'Der Verwaltungs-/Ergänzungsvorbehalt ist eng: Selbst zulässige ergänzende Nutzung erfordert eine
    schriftliche, werkzeugkonkrete Einwilligung.'
  - 10.000 USD je Verstoß, bemessen nach Schwere des Schadens und den Umständen. Kein privates Klagerecht,
    aber berufsrechtliche Folgen für die Fachkraft.
  - 'Reichweite auf Anbieter außerhalb von Illinois: Das Verbot knüpft an die Leistungserbringung an Personen
    in Illinois an, nicht an den Sitz des Anbieters.'
  dokumente:
  - datum: 2025-08-04
    typ: pressemitteilung
    titel: Gov. Pritzker Signs Legislation Prohibiting AI Therapy in Illinois
    url: https://idfpr.illinois.gov/news/2025/gov-pritzker-signs-state-leg-prohibiting-ai-therapy-in-il.html
    sprache: en
    urheber: Illinois Department of Financial and Professional Regulation
    verifiziert: true
    notiz: 'Amtliche Mitteilung der zuständigen Aufsichtsbehörde. Achtung: Die Mitteilung ist auf den
      04.08.2025 datiert, spricht aber davon, der Gouverneur habe "am Freitag" unterzeichnet — das wäre
      der 01.08.2025. Die Sekundärliteratur nennt durchgehend den 04.08.2025.

      '
  - datum: 2025-08-12
    typ: bericht
    titel: Illinois Passes Extensive Law Regulating AI in Behavioral Health
    url: https://www.bakerdonelson.com/illinois-passes-extensive-law-regulating-ai-in-behavioral-health
    sprache: en
    urheber: Baker Donelson
    verifiziert: true
    notiz: Vollständige Darstellung von Verbotsumfang, zulässigen Nutzungen, Einwilligungserfordernis
      und Sanktionshöhe.
  offene_punkte:
  - Abgrenzung 'Therapie' zu allgemeinem Wohlbefinden-Coaching ist nicht scharf; Anbieter allgemeiner
    Wellness-Chatbots tragen ein Auslegungsrisiko.
  - Keine bekannte Durchsetzungsmaßnahme des IDFPR (Stand 27.08.2026).
