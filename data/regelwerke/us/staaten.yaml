  regelungsschwerpunkte:
  - 'Zurechnungsregel als eigentlicher Kern: Der Einsatz von KI ist keine Verteidigung gegen Verbraucherschutzverstöße.
    Diese Norm hat Utah 2024 als erster Staat kodifiziert; Kalifornien hat sie 2026 mit AB 316 nachgezogen.'
  - SB 226 hat die proaktive Offenlegungspflicht praktisch abgeschafft. Utah ist damit von einem strengen
    zu einem der mildesten Regime gewechselt — die Gegenbewegung zu Kalifornien.
  - '''High-risk artificial intelligence interaction'': sensible personenbezogene Daten oder personalisierte
    Empfehlungen mit Einfluss auf finanzielle, rechtliche, medizinische oder psychische Entscheidungen.
    Das ist die verbliebene proaktive Offenlegungspflicht.'
  - 'Safe Harbor mit Ausnahme: Wer klar offenlegt, ist geschützt — außer die beanstandete Aussage stammt
    vom KI-System selbst. Damit läuft der Safe Harbor bei generativen Systemen häufig leer.'
  - 'Reallabor mit ''regulatory mitigation agreements'': Das Office of AI Policy kann einzelvertraglich
    Pflichten aussetzen. Erste Vereinbarung war ElizaChat (Mental-Health-Chatbot) noch vor HB 452.'
  - 'Sonnenuntergang 01.07.2027: das Gesetz verfällt automatisch. Für die Planung europäischer Anbieter
    ist das ein echter Unsicherheitsfaktor.'
