- id: us-ca-ccpa-cpra
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: CCPA/CPRA (Cal. Civ. Code §§ 1798.100 ff.)
  offizieller_titel: 'California Consumer Privacy Act of 2018 (Assembly Bill 375), grundlegend geändert
    durch den California Privacy Rights Act of 2020 (Proposition 24), kodifiziert in Cal. Civ. Code §§
    1798.100-1798.199.100

    '
  fundstelle: Chapter 55, Statutes of 2018 (AB 375); Proposition 24 (2020); Cal. Civ. Code §§ 1798.100
    ff.
  verfahrensnummer: CA AB 375 (2017-2018 Regular Session); Proposition 24 (Wahl vom 03.11.2020)
  status: anwendbar
  status_detail: 'Seit 01.01.2020 anwendbar, in der CPRA-Fassung seit 01.01.2023. Für KI zweifach bedeutsam:
    Erstens stellt § 1798.140(v)(4)(C) seit der Änderung durch AB 1008 (2024) klar, dass personenbezogene
    Daten auch in abstrakten digitalen Formaten einschließlich KI-Systemen vorliegen können, die sie ausgeben
    können. Zweitens ist § 1798.185(a)(15)-(16) die Ermächtigungsgrundlage der ADMT-Verordnung der CPPA.

    '
  kurzbeschreibung: 'Das CCPA gewährt kalifornischen Verbrauchern Rechte auf Auskunft (§§ 1798.100, 1798.110,
    1798.115), Löschung (§ 1798.105), Berichtigung (§ 1798.106), Widerspruch gegen Verkauf und Weitergabe
    (§ 1798.120) und Beschränkung der Nutzung sensibler Daten (§ 1798.121). § 1798.140 enthält die Begriffsbestimmungen,
    darunter den besonders weiten Begriff der personenbezogenen Daten. § 1798.150 gewährt ein privates
    Klagerecht nur bei Datenschutzverletzungen. Durchsetzung durch die California Privacy Protection Agency
    und den Attorney General; die ADMT-Verordnung ist als eigener Regelwerkseintrag us-ca-cppa-admt erfasst.

    '
