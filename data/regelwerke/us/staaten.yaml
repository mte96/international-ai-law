  regelungsschwerpunkte:
  - '§ 1798.140(v)(4)(C) ist die weltweit erste ausdrückliche gesetzliche Aussage dazu, dass Modellgewichte
    personenbezogene Daten enthalten können — sie nimmt die Frage vorweg, die in Europa über Erwägungsgrund
    und EDSA-Stellungnahme 28/2024 geführt wird. Die kalifornische Antwort ist funktional: Es kommt darauf
    an, ob das System personenbezogene Daten ausgeben kann.'
  - § 1798.185(a)(15) verpflichtet die Agentur zur Regelung von Auskunfts- und Widerspruchsrechten bei
    automatisierter Entscheidungsfindung einschließlich „meaningful information about the logic“ — wörtlich
    der Wortlaut des Art. 15 Abs. 1 lit. h DSGVO. Kalifornien hat die europäische Formel übernommen, aber
    erst über eine Verordnung operationalisiert.
  - Das private Klagerecht ist auf Datenschutzverletzungen beschränkt (§ 1798.150) — anders als bei BIPA
    gibt es also keine Massenklagen wegen bloßer Transparenzverstöße. Deshalb ist die Durchsetzung behördlich
    und langsam.
  - Der Verbraucherbegriff erfasst auch Beschäftigte und Geschäftskontakte (seit 01.01.2023) — was die
    ADMT-Regeln zur faktischen Beschäftigtendatenschutzverordnung macht.
  eu_anbieter_relevanz: 'Für europäische Anbieter ist das CCPA in der Struktur vertraut, in der Anwendung
    aber anders geschnitten: Anknüpfungspunkt ist nicht die Niederlassung, sondern der Geschäftsbetrieb
    mit kalifornischen Verbrauchern oberhalb der Schwellenwerte (25 Mio. USD Jahresumsatz oder 100.000
    Verbraucher oder 50 Prozent Umsatz aus Datenverkauf). Wer eine DSGVO-Konformität aufgebaut hat, deckt
    Auskunft, Löschung und Berichtigung weitgehend ab; eigenständig aufzubauen sind der Widerspruch gegen
    „sharing“ (Cross-Context-Werbung), der Global Privacy Control und — ab 2027 — die ADMT-Vorabinformation.
    Der AB-1008-Klarstellung folgt praktisch, dass Auskunfts- und Löschbegehren auch gegenüber Modellen
    zu prüfen sind.

    '
