    was_gilt: 'Volle Anwendbarkeit: Verbotstatbestände, Behördenpflichten, Gesundheits-Offenlegung, Sandbox,
      Durchsetzung durch den Attorney General, Präemption lokaler Regelungen.

      '
    verifiziert: true
