  regelungsschwerpunkte:
  - '§ 22757.11: ''frontier model'' = Foundation Model, trainiert mit >10^26 Integer-/Gleitkommaoperationen.
    Reine Compute-Schwelle — anders als SB 1047 keine zusätzliche Kostenschwelle.'
  - '''large frontier developer'' = frontier developer mit >500 Mio. USD Jahresbruttoumsatz einschließlich
    verbundener Unternehmen. Nur diese trifft die Framework-Pflicht.'
  - '''catastrophic risk'' = vorhersehbares, materielles Risiko, dass ein Frontier-Modell den Tod oder
    die schwere Verletzung von mehr als 50 Menschen oder Sachschäden über 1 Mrd. USD wesentlich mitverursacht
    — über vier Kanäle: CBRN-Waffenhilfe, unkontrolliertes schädigendes Verhalten des Modells, Kontrollverlust,
    täuschende Unterwanderung menschlicher Aufsicht.'
  - 'Der Transparenzbericht ist NICHT vertraulich: er wird öffentlich publiziert (Modellbeschreibung,
    Einsatzzweck, Nutzungsbeschränkungen, Zusammenfassung der Katastrophenrisikobewertung).'
  - Kein privates Klagerecht. Ausschließliche Durchsetzung durch den Attorney General, bis 1 Mio. USD
    je Verstoß.
  - Whistleblower-Schutz gilt für 'covered employees' mit Verantwortung für Risikobewertung/-minderung;
    große Entwickler brauchen einen anonymen internen Kanal mit monatlichem Statusbericht an die meldende
    Person.
  - 'Meldeweg für kritische Vorfälle: Cal OES, nicht der Attorney General — das ist bewusst ein Katastrophenschutz-,
    kein Aufsichtskanal.'
  - 'CalCompute: Konsortium bei der Government Operations Agency; nur Berichtspflicht, keine Finanzierungszusage.'
