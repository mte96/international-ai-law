  - datum: 2025-10-01
    was_gilt: 'Volle Anwendbarkeit: ADS-Diskriminierungsverbot, Agenten- und Beihilfehaftung, vierjährige
      Aufbewahrungspflicht für ADS-Daten (§ 11013), Behandlung von Screening-Tests als potenziell unzulässige
      medizinische Untersuchung.

      '
    verifiziert: true
    quelle: https://calcivilrights.ca.gov/2025/06/30/civil-rights-council-secures-approval-for-regulations-to-protect-against-employment-discrimination-related-to-artificial-intelligence/
  themenachsen:
  - arbeit
  - grundrechte
  - haftung
  - datenschutz
  regelungsschwerpunkte:
  - 'ADS-Definition weiter als bei der CPPA: erfasst wird auch ein System, das die menschliche Entscheidung
    nur ERLEICHTERT (''facilitates''), nicht erst ersetzt.'
  - '''Agent'': ein Dienstleister, der eine traditionell vom Arbeitgeber ausgeübte Funktion wahrnimmt,
    ist selbst Arbeitgeber im Sinne des FEHA und haftet unmittelbar. Die Endfassung hat das gegenüber
    dem Entwurf eingegrenzt — nicht mehr jeder Anbieter, sondern nur der aktiv am Auswahlprozess Beteiligte.'
  - '§ 11013: vierjährige Aufbewahrung ''aller Daten, die im ADS verwendet werden oder daraus resultieren''
    sowie der Daten, mit denen ein ADS für DIESEN Arbeitgeber entwickelt oder angepasst wurde. Die Endfassung
    hat die ursprünglich geforderte Aufbewahrung sämtlicher Trainingsdaten gestrichen.'
  - 'Anti-Bias-Testing ist kein Safe Harbor, aber ein Beweismittel: Gerichte und Behörden würdigen Qualität,
    Wirksamkeit, Aktualität, Umfang, Ergebnisse und die Reaktion des Arbeitgebers darauf. Wer nicht testet,
    verliert dieses Verteidigungsmittel.'
  - Privates Klagerecht über den FEHA — anders als bei fast allen sonstigen US-KI-Gesetzen. Das ist der
    Grund, weshalb diese Regeln praktisch das schärfste kalifornische Beschäftigungs-KI-Instrument sind.
  - Kein Bias-Audit-Zwang und keine Veröffentlichungspflicht wie bei NYC LL 144 — die kalifornische Lösung
    setzt auf Haftung statt auf Prüfnachweis.
