  regelungsschwerpunkte:
  - Utah wählt bei psychischer Gesundheit den Offenlegungs- und Datenschutzansatz, Illinois (WOPR Act)
    den Verbotsansatz. Ein Anbieter, der beide Märkte bedient, muss sich am Illinois-Verbot orientieren.
  - 'Das Verbot der Werbung WÄHREND der Sitzung ist eine US-Besonderheit: es adressiert die Monetarisierung
    emotionaler Abhängigkeit unmittelbar.'
  - '2.500 USD je Verstoß ist die mildeste Sanktion aller untersuchten Chatbot-Regime (CA: 1.000 USD privat
    je Verstoß; NY: 15.000 USD je Tag).'
  - HB 276 (2026) führt Einwilligungserfordernisse für intime Deepfakes UND Provenienzdaten-Offenlegung
    ein — Utah nähert sich damit dem kalifornischen Kennzeichnungsansatz an.
  - 'Politisch bedeutsam: HB 286 (Pflicht zu Sicherheitsplänen für KI-Entwickler zum Schutz von Kindern)
    wurde nach Intervention des Weißen Hauses (''unfixable'') im Februar 2026 auf dem Boden des Repräsentantenhauses
    gestoppt. Der erste dokumentierte Fall, in dem die Bundesebene ein einzelstaatliches KI-Vorhaben direkt
    verhindert hat.'
