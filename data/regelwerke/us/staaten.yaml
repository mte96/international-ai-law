  - haftung
  regelungsschwerpunkte:
  - 'Regelungsmuster "algorithmische Preissetzung": kartellrechtlich, nicht grundrechtlich motiviert.
    Für europäische Anbieter von Pricing- und Revenue-Management-Software das relevanteste neue US-Risiko,
    weil es unmittelbar am Produkt ansetzt und nicht am Einsatzkontext.

    '
  - 'Anknüpfungspunkt ist der Wohnungsmarkt in New Jersey, nicht der Sitz des Softwareanbieters — die
    Norm wirkt damit wie die übrigen US-Staatengesetze marktbezogen und extraterritorial.

    '
  - 'Einordnung: Dies ist kein KI-Governance-Gesetz im engeren Sinne. Es steht hier, weil es eine verbindliche
    produktbezogene Pflicht begründet und weil das Muster 2026 in mindestens fünf Staaten parallel entstanden
    ist.

    '
