  regelungsschwerpunkte:
  - 'ABGRENZUNG ZUM COLORADO-MODELL — der entscheidende Punkt: Connecticut übernimmt von CO SB 24-205
    nur die Entwickler-Deployer-Struktur und den "substantial factor"-Gedanken. Es fehlen sämtliche materiellen
    Kernstücke des Colorado-Ansatzes: keine Sorgfaltspflicht gegen algorithmische Diskriminierung, kein
    Risikomanagementprogramm nach anerkanntem Rahmenwerk, keine Impact Assessments, keine Meldepflicht
    entdeckter Diskriminierung an den Attorney General. Der Anwendungsbereich ist zudem auf BESCHÄFTIGUNG
    beschränkt statt auf alle folgenreichen Entscheidungen in sieben Sektoren.

    '
  - 'Connecticut bleibt sogar hinter dem abgeschwächten CO SB 26-189 zurück: Dort haben Betroffene Rechte
    auf Datenzugang, Berichtigung und — soweit wirtschaftlich zumutbar — menschliche Überprüfung, sowie
    eine Nachinformation binnen 30 Tagen nach nachteiliger Entscheidung. Connecticut kennt nur die Vorabinformation,
    keine Verbraucherrechte und keine Nachinformation.

    '
  - 'FOLGERUNG: Nach der Aufhebung von CO SB 24-205 existiert in keinem US-Bundesstaat mehr eine sektorübergreifende
    Sorgfaltspflicht gegen algorithmische Diskriminierung. Das EU-nahe Risikomodell ist in den USA vollständig
    durch Transparenz- und Hinweismodelle ersetzt worden.

    '
  - 'Der Anti-Bias-Test hat dieselbe Beweisfunktion wie in den kalifornischen FEHA-Regeln: Der KI-Einsatz
    ist keine Verteidigung gegen einen Diskriminierungsvorwurf, aber Gerichte würdigen Qualität, Wirksamkeit,
    Aktualität, Umfang, Ergebnisse und die Reaktion des Arbeitgebers. Wer nicht testet, verliert dieses
    Verteidigungsmittel. Kein verpflichtender Bias Audit wie bei NYC LL 144.

    '
  - 'Vertragliche Zuweisung der Hinweispflichten zwischen Entwickler und Deployer ist zulässig, muss aber
    ausdrücklich dokumentiert werden — eine Regelungstechnik, die weder Colorado noch Kalifornien kennt
    und die für Anbieter von HR-Software unmittelbar praktisch wird.

    '
  - 'Provenienzschwelle von einer Million monatlichen Nutzern — IDENTISCH mit Kalifornien SB 942/AB 853.
    Connecticut ist damit der zweite Staat mit Provenienzpflichten an derselben Schwelle, aber ohne die
    kalifornische Pflicht zum kostenlosen öffentlichen Detektionswerkzeug.

    '
  - 'Vierter Staat mit Frontier-Bezug, aber nur mit dem arbeitsrechtlichen Teil: Repressalienverbot und
    anonymer Meldekanal für große Entwickler, ohne Safety Framework, ohne Transparenzbericht, ohne Vorfallmeldung.
    Connecticut greift also gezielt das Element von CA SB 53 heraus, das am wenigsten umstritten ist.

    '
  - 'Gesundheits-Ausnahmen: klinische Entscheidungsunterstützung, Medikamentenerinnerungen, Aufklärung
    und Krankheitsmanagement sind ausgenommen, SOFERN das System keine anthropomorphen Merkmale trägt
    und sich nicht als Mensch geriert. Die Ausnahme entfällt also genau dann, wenn das System wie ein
    Chatbot wirkt.

    '
  - 'Zweispuriges Sanktionsregime: AEDT-Verstöße nur durch den Attorney General über den Connecticut Unfair
    Trade Practices Act; für die Chatbot-Vorschriften dagegen ein privates Klagerecht mit bis zu 25.000
    USD je Verstoß — die höchste Einzelsanktion aller US-Chatbot-Gesetze mit privatem Klagerecht (CA SB
    243: mindestens 1.000 USD je Verstoß).

    '
  - 'VERFAHRENSGESCHICHTE als eigenständiger Befund: SB 2 (2024) und SB 2 (2025) passierten jeweils den
    Senat und starben im Repräsentantenhaus, in beiden Jahren unter dem Eindruck von Vorbehalten des Gouverneurs.
    Erfolgreich war 2026 erst die Verbindung mit vom Gouverneur unterstützten Inhalten (Minderjährigenschutz
    auf sozialen Plattformen) und der Verzicht auf den Diskriminierungsteil — 131:17 im Repräsentantenhaus
    gegenüber zwei Jahren ohne Aufruf. Das ist das Muster, nach dem KI-Gesetzgebung in den USA 2026 mehrheitsfähig
    wird.

    '
