- id: us-il-bipa
  jurisdiktion: us
  subjurisdiktion: us-il
  kurztitel: BIPA (Illinois, biometrische Daten)
  offizieller_titel: Biometric Information Privacy Act (740 ILCS 14), geändert durch Senate Bill 2979
    (2024)
  fundstelle: '740 ILCS 14/1 ff.; Public Act 95-994 (2008); Änderung: Public Act 103-0769 (2024)'
  verfahrensnummer: IL SB 2979 (103rd General Assembly, 2024)
  status: anwendbar
  status_detail: 'Seit 2008 in Kraft, am 02.08.2024 durch SB 2979 mit sofortiger Wirkung novelliert. Trotz
    der Haftungsbegrenzung bleibt BIPA das schärfste Datenschutzinstrument der USA gegen Gesichtserkennung
    und die biometrische Anreicherung von Trainingsdaten — allein wegen des privaten Klagerechts mit pauschalem
    gesetzlichem Schadensersatz.

    '
  kurzbeschreibung: 'BIPA verbietet privaten Stellen, biometrische Identifikatoren (Fingerabdruck, Stimmabdruck,
    Netzhaut- oder Iris-Scan, Hand- oder Gesichtsgeometrie) ohne vorherige schriftliche Information über
    Zweck und Aufbewahrungsdauer und ohne schriftliche Einwilligung zu erheben, zu kaufen oder zu erhalten;
    Verkauf und Vermietung sind absolut verboten, Weitergabe nur mit Einwilligung. Es besteht ein privates
    Klagerecht mit gesetzlichem Schadensersatz von 1.000 USD bei Fahrlässigkeit und 5.000 USD bei Vorsatz
    oder Leichtfertigkeit, zuzüglich Anwaltskosten; Verjährung fünf Jahre. SB 2979 begrenzte die Haftung:
    Wer denselben biometrischen Identifikator derselben Person mit derselben Methode mehrfach erhebt,
    begeht nur EINEN Verstoß mit höchstens einer Entschädigung — zuvor zählte jeder einzelne Scan. Zugleich
    wurde die elektronische Signatur ausdrücklich als schriftliche Einwilligung anerkannt.

    '
  inkrafttreten:
    datum: 2008-10-03
    verifiziert: true
    quelle: https://law.justia.com/codes/illinois/chapter-740/act-740-ilcs-14/
    fundstelle_norm: 'Amtliche Quellenangabe der Illinois Compiled Statutes zu 740 ILCS 14/1: ''(Source:
      P.A. 95-994, eff. 10-3-08.)'''
  anwendungsdaten:
  - datum: 2024-08-02
    was_gilt: Novelle durch SB 2979 (Public Act 103-769) — Begrenzung auf einen Verstoss je betroffener
      Person und je Verfahrensart (740 ILCS 14/20), Klarstellung zur elektronischen Einwilligung; mit
      sofortiger Wirkung ab Ausfertigung
    verifiziert: true
    quelle: https://law.justia.com/codes/illinois/chapter-740/act-740-ilcs-14/
  themenachsen:
  - datenschutz
  - grundrechte
  - haftung
  - urheberrecht
  regelungsschwerpunkte:
  - Privates Klagerecht mit pauschaliertem Schadensersatz ohne Nachweis eines konkreten Schadens (Rosenbach
    v. Six Flags, Ill. 2019) — der Grund, weshalb BIPA das teuerste US-Datenschutzgesetz ist.
  - 'Wirkung von SB 2979 am Beispiel: 100 Beschäftigte, tägliche Zeiterfassung per Iris-Scan über ein
    Jahr — vor der Novelle bis 130 Mio. USD bei Leichtfertigkeit, danach 500.000 USD.'
  - 'Bedeutung für Trainingsdaten: Wer Gesichtsbilder aus dem Netz zur Erzeugung von Gesichtsgeometrie-Vektoren
    verarbeitet, erhebt biometrische Identifikatoren von Illinois-Einwohnern — ohne deren Einwilligung
    ist das rechtswidrig. Das ist der Anspruchsgrund der Clearview-AI-Verfahren.'
  - BIPA kennt keine Ausnahme für öffentlich zugängliche Daten. Ein aus Web-Scraping trainiertes Gesichtserkennungsmodell
    ist dadurch in Illinois praktisch nicht rechtmäßig herstellbar.
  - Klägerseite dehnt BIPA fortlaufend auf neue Technologien aus — virtuelle Anprobe, Avatare, Stimmklonung,
    Emotionserkennung. Für europäische Anbieter das relevanteste Prozessrisiko in den USA.
  - Keine Anwendung auf staatliche Stellen und auf bestimmte Finanzinstitute (GLBA-Ausnahme).
  dokumente:
  - datum: 2024-08-08
    typ: bericht
    titel: Illinois BIPA Reform Takes Effect
    url: https://www.kslaw.com/news-and-insights/illinois-bipa-reform-takes-effect
    sprache: en
    urheber: King & Spalding LLP
    verifiziert: true
    notiz: Belegt Datum und Inhalt von SB 2979 einschließlich Rechenbeispiel zur Haftungsbegrenzung und
      Hinweis auf die Ausdehnung auf KI-Technologien.
  - datum: 2025-01-01
    typ: konsolidiert
    titel: 740 ILCS 14 — Biometric Information Privacy Act (konsolidierte Fassung)
    url: https://law.justia.com/codes/illinois/chapter-740/act-740-ilcs-14/
    sprache: en
    urheber: Justia / Illinois General Assembly
    verifiziert: false
    notiz: Konsolidierter Gesetzestext zur Prüfung des Wortlauts der Einwilligungs- und Aufbewahrungspflichten.
  offene_punkte:
  - Ob die Erzeugung eines Gesichtsgeometrie-Vektors allein zum Modelltraining (ohne Identifizierungszweck)
    eine 'Erhebung' im Sinne von BIPA ist, bleibt umstritten.
  - 'Nachahmergesetze: Texas CUBI und Washington HB 1493 kennen kein privates Klagerecht; BIPA bleibt
    der Ausreißer. Mehrere Staaten prüfen 2026 eigene Regelungen.'
  - 'Inkrafttreten des BIPA (03.10.2008) nicht amtlich geprüft: ilga.gov ist für WebFetch nicht erreichbar
    (404 auf der alten URL) und im Browser für diese Sitzung nicht freigegeben. Zu prüfen ist die Source-Angabe
    am Ende von 740 ILCS 14/5 ff.'
  monitoring_quellen:
  - https://www.troutman.com/state-artificial-intelligence-law-tracker/
