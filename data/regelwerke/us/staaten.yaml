- id: us-il-sb315
  jurisdiktion: us
  subjurisdiktion: us-il
  kurztitel: AI Safety Measures Act / SB 315 (Illinois, Frontier-Modelle)
  offizieller_titel: Illinois Artificial Intelligence Safety Measures Act (Senate Bill 315)
  fundstelle: Public Act der 104th General Assembly, Session 2026 (unterzeichnet 06.07.2026)
  verfahrensnummer: IL SB 315 (104th General Assembly, 2026)
  status: verabschiedet
  status_detail: 'Am 06.07.2026 von Gouverneur Pritzker unterzeichnet, wirksam ab 01.01.2027, Kernpflichten
    und Audits ab 01.01.2028. Illinois ist damit der erste US-Bundesstaat, der ein verpflichtendes unabhängiges
    DRITTAUDIT für Frontier-Entwickler vorschreibt — die Pflicht, die Kalifornien in SB 1047 vorgesehen
    und in SB 53 gestrichen hatte.

    '
  kurzbeschreibung: 'Das Gesetz übernimmt die Schwellen von SB 53 und RAISE Act (Foundation Model mit
    über 10^26 Rechenoperationen; "large frontier developer" ab 500 Mio. USD konzernweitem Jahresumsatz),
    geht bei den Pflichten aber darüber hinaus. Entwickler müssen ein Safety Framework zum Umgang mit
    katastrophalen Risiken erstellen, umsetzen und veröffentlichen — mit Kapazitätsschwellen, Sicherung
    der Modellgewichte und Umsetzungspraktiken —, es jährlich überprüfen und wesentliche Änderungen binnen
    30 Tagen anzeigen. Vor dem Deployment neuer oder wesentlich veränderter Modelle ist ein Transparenzbericht
    mit der Zusammenfassung der Katastrophenrisikobewertung und der Beteiligung externer Prüfer zu veröffentlichen.
    Ab dem späteren der beiden Zeitpunkte 01.01.2028 oder 90 Tage nach erstmaliger Qualifikation als large
    frontier developer ist ein unabhängiges Audit der Einhaltung und der internen Kontrollen durchzuführen;
    der Prüfer muss technische Expertise für die Sicherheit von Frontier-Modellen besitzen und nach anerkannten
    Prüfungsgrundsätzen arbeiten, der geschwärzte Bericht ist binnen 30 Tagen zu veröffentlichen. Kritische
    Sicherheitsvorfälle sind binnen 72 Stunden zu melden, bei unmittelbarer Gefahr binnen 24 Stunden an
    die Strafverfolgung. Zusätzlich ist eine jährlich zu erneuernde Offenlegungserklärung zu hinterlegen.
    Durchsetzung ausschließlich durch den Attorney General mit bis zu 1 Mio. USD beim ersten und bis zu
    3 Mio. USD bei weiteren Verstößen.

    '
  inkrafttreten:
    datum: 2027-01-01
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2026/07/illinois-enacts-ai-safety-law-becoming-first-state
  anwendungsdaten:
  - datum: 2026-07-06
    was_gilt: Unterzeichnung durch Gouverneur Pritzker.
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2026/07/illinois-enacts-ai-safety-law-becoming-first-state
  - datum: 2027-01-01
    was_gilt: Inkrafttreten des Gesetzes; Beginn der Offenlegungserklärung und der Vorfallmeldepflichten.
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2026/07/illinois-enacts-ai-safety-law-becoming-first-state
  - datum: 2028-01-01
    was_gilt: 'Kernpflichten: veröffentlichtes Safety Framework, Transparenzberichte und — als Erstes
      in den USA — das unabhängige Drittaudit (bzw. 90 Tage nach erstmaliger Qualifikation, falls später).

      '
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2026/07/illinois-enacts-ai-safety-law-becoming-first-state
  themenachsen:
  - gpai
  - governance
  - sicherheit-export
  - marktzugang
  regelungsschwerpunkte:
  - 'Das Drittaudit ist der Unterschied: SB 53 (CA) und RAISE Act (NY) kennen keines. Illinois verlangt
    Prüferqualifikation, Prüfungsstandards und Veröffentlichung des geschwärzten Berichts binnen 30 Tagen.'
  - Meldefrist 72 Stunden (wie New York), nicht 15 Tage (wie Kalifornien). Wer alle drei Regime bedient,
    muss faktisch nach der 72-Stunden-Frist arbeiten.
  - 'Katastrophenschwelle: mehr als 50 Tote oder Schwerverletzte — identisch mit Kalifornien. Für New
    York nach der Chapter Amendment widersprechen sich die Quellen (50 oder 100); siehe us-ny-raise.

    '
  - 'Registrierungselement: jährlich zu erneuernde Offenlegungserklärung mit Identifikationsdaten, auch
    bei Eigentümerwechsel. Das ist ein Ansatz von Anbieterregistrierung, den weder CA noch NY kennen.'
  - Sanktionen 1 Mio. / 3 Mio. USD entsprechen New York; Kalifornien kennt nur die 1-Mio.-Stufe.
  dokumente:
  - datum: 2026-07-10
    typ: bericht
    titel: Illinois Enacts AI Safety Law, Becoming First State to Mandate Independent Third-Party Audits
      of Frontier AI Developers
    url: https://www.skadden.com/insights/publications/2026/07/illinois-enacts-ai-safety-law-becoming-first-state
    sprache: en
    urheber: Skadden, Arps, Slate, Meagher & Flom LLP
    verifiziert: true
    notiz: Vollständige Pflichtenbeschreibung samt Vergleichstabelle Illinois / Kalifornien / New York.
      Die beste Einzelquelle zum Drei-Staaten-Block.
  - datum: 2026-07-08
    typ: pressemitteilung
    titel: Illinois Gov. Pritzker signs nation's 'most protective' AI Safety Measures Act into law
    url: https://www.transparencycoalition.ai/news/illinois-gov-pritzker-signs-landmark-ai-safety-measures-act-into-law
    sprache: en
    urheber: Transparency Coalition
    verifiziert: true
    notiz: 'Bestätigt Unterzeichnung am 06.07.2026 und die Urheberschaft (Sen. Mary Edly-Allen, Rep. Daniel
      Didech). Benennt das jährliche unabhängige Drittaudit ausdrücklich als erste derartige Pflicht in
      einem einzelstaatlichen KI-Gesetz; nennt zusätzlich einen Whistleblower-Schutz für "covered employees",
      den die Kanzleianalysen nicht hervorheben.

      '
  offene_punkte:
  - Es existiert kein etablierter Markt für qualifizierte Frontier-Safety-Auditoren. Ob bis 01.01.2028
    genügend Prüfer verfügbar sind, ist die zentrale Umsetzungsfrage.
  - '''Generally accepted auditing standards'' für Frontier-Modell-Sicherheit existieren nicht; der Verweis
    läuft derzeit ins Leere.'
  - Illinois ist in EO 14365 nicht namentlich benannt, das Gesetz stammt aber aus der Zeit danach. Eine
    Anfechtung ist wahrscheinlich.
