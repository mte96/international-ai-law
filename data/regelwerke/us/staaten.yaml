  - datum: 2025-10-15
    typ: bericht
    titel: California AI Transparency Act Amendments Signed Into Law
    url: https://www.troutmanprivacy.com/2025/10/california-ai-transparency-act-amendments-signed-into-law/
    sprache: en
    urheber: Troutman Pepper Locke
    verifiziert: false
    notiz: Darstellung der AB-853-Änderungen unmittelbar nach Unterzeichnung; erklärt die Verschiebung
      des Anwendungsbeginns.
  offene_punkte:
  - Kein benannter technischer Standard. Ob eine C2PA-konforme Implementierung die Anforderungen erfüllt,
    ist nicht amtlich bestätigt.
  - 'Verhältnis zur Kennzeichnungspflicht nach Art. 50 KI-VO: beide verlangen maschinenlesbare Markierung,
    aber mit unterschiedlichem Pflichtenumfang. Doppelimplementierung ist derzeit der sichere Weg.'
  - Unklar, wer 'large online platform' im Sinne der Stufe 2 ist — die Schwelle wird in den ausgewerteten
    Quellen nicht einheitlich beziffert.
