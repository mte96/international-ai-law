- id: us-ca-sb53
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: SB 53 / TFAIA (Kalifornien, Frontier-Modelle)
  offizieller_titel: 'Transparency in Frontier Artificial Intelligence Act (Senate Bill 53, Wiener) —
    An act to add Chapter 25.1 (commencing with Section 22757.10) to Division 8 of the Business and Professions
    Code, to add Section 11546.8 to the Government Code, and to add Chapter 5.1 (commencing with Section
    1107) to Part 3 of Division 2 of the Labor Code, relating to artificial intelligence

    '
  fundstelle: Chapter 138, Statutes of 2025; Bus. & Prof. Code §§ 22757.10-22757.16; Gov. Code § 11546.8;
    Lab. Code §§ 1107 ff.
  verfahrensnummer: CA SB 53 (2025-2026 Regular Session)
  status: anwendbar
  status_detail: 'Am 29.09.2025 unterzeichnet, seit 01.01.2026 anwendbar. Erstes Frontier-Modell-Gesetz
    eines US-Bundesstaates. Bis 27.08.2026 ist keine öffentliche Durchsetzungsmaßnahme des Attorney General
    bekannt; die Compliance läuft bisher über die freiwillig publizierten Frameworks der großen Labore.
    In EO 14365 namentlich als problematisches einzelstaatliches Gesetz benannt.

    '
  kurzbeschreibung: 'Das Gesetz verpflichtet "frontier developers" — wer ein Foundation Model mit mehr
    als 10^26 Integer- oder Gleitkommaoperationen trainiert oder dessen Training veranlasst hat — zur
    Veröffentlichung eines Transparenzberichts vor jedem Deployment. "Large frontier developers" (über
    500 Mio. USD Jahresumsatz konzernweit) müssen zusätzlich ein "Frontier AI Framework" veröffentlichen
    und jährlich überprüfen, das beschreibt, wie katastrophale Risiken erkannt, gemindert und governt
    werden und welche nationalen und internationalen Standards eingearbeitet wurden. Kritische Sicherheitsvorfälle
    sind binnen 15 Tagen an das California Office of Emergency Services zu melden, bei unmittelbarer Todes-
    oder Verletzungsgefahr binnen 24 Stunden. Beschäftigte, die katastrophale Risiken melden, sind vor
    Repressalien geschützt; große Entwickler müssen einen anonymen Meldekanal mit monatlichem Statusupdate
    betreiben. Durchsetzung ausschließlich durch den Attorney General, bis zu 1 Mio. USD Zivilstrafe je
    Verstoß.

    '
