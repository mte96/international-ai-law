- id: us-ca-sb243
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: SB 243 (Kalifornien, Companion-Chatbots und Kindersicherheit)
  offizieller_titel: 'Companion Chatbots (Senate Bill 243, Padilla) — Operator Requirements for Companion
    Chatbot Platforms

    '
  fundstelle: Statutes of 2025; Business and Professions Code, Division 8
  verfahrensnummer: CA SB 243 (2025-2026 Regular Session)
  status: anwendbar
  status_detail: 'Am 13.10.2025 unterzeichnet, seit 01.01.2026 anwendbar. Das erste Companion-Chatbot-Gesetz
    eines US-Bundesstaates mit privatem Klagerecht. Die Berichtspflicht an das Office of Suicide Prevention
    beginnt erst am 01.07.2027. Im Verfahren 2026 stehen mit SB 1119, AB 2023, SB 300 und SB 867 vier
    Verschärfungen kurz vor der Verabschiedung.

    '
  kurzbeschreibung: 'Betreiber von Companion-Chatbot-Plattformen — KI-Systemen mit natürlicher Sprachschnittstelle,
    die adaptive, menschenähnliche Antworten geben und über einzelne Interaktionen hinweg eine Beziehung
    aufrechterhalten — müssen klar offenlegen, dass es sich um KI handelt, wenn eine vernünftige Person
    das System für einen Menschen halten könnte. Bei erkannten Minderjährigen kommen hinzu: ausdrückliche
    KI-Offenlegung, alle drei Stunden ein Hinweis auf eine Pause, und das Verbot sexuell expliziter Inhalte.
    Alle Plattformen müssen warnen, dass Companion-Chatbots für manche Minderjährige ungeeignet sein können.
    Betreiber müssen ein veröffentlichtes Protokoll für Suizid- und Selbstverletzungsäußerungen vorhalten
    und auf Krisendienste verweisen. Ab 01.07.2027 ist jährlich an das kalifornische Office of Suicide
    Prevention zu berichten. Anders als fast alle anderen KI-Gesetze der Staaten gibt es ein privates
    Klagerecht mit mindestens 1.000 USD je Verstoß oder dem tatsächlichen Schaden, zuzüglich Anwaltskosten.

    '
  inkrafttreten:
    datum: 2026-01-01
    verifiziert: true
    quelle: https://www.ashurstperkinscoie.com/en/insights/california-companion-chatbot-law-now-in-effect/
  anwendungsdaten:
  - datum: 2026-01-01
    was_gilt: 'Offenlegungspflicht, Schutzvorkehrungen für erkannte Minderjährige (3-Stunden-Erinnerung,
      Verbot sexueller Inhalte), Krisenprotokoll und dessen Veröffentlichung, privates Klagerecht.

      '
    verifiziert: true
    quelle: https://www.ashurstperkinscoie.com/en/insights/california-companion-chatbot-law-now-in-effect/
  - datum: 2027-07-01
    was_gilt: 'Erste jährliche Meldung an das Office of Suicide Prevention: Zahl der ausgegebenen Krisendienst-Verweise
      und Beschreibung der eingesetzten Protokolle.

      '
    verifiziert: true
    quelle: https://www.ashurstperkinscoie.com/en/insights/california-companion-chatbot-law-now-in-effect/
  themenachsen:
  - grundrechte
  - content
  - haftung
  - sektor-medizin
  - datenschutz
  regelungsschwerpunkte:
  - 'Ausnahmen: Kundenservice-Bots, betriebliche Werkzeuge, spielinterne Charaktere ohne beziehungsbildende
    Funktion, Standalone-Geräte ohne fortlaufende Beziehung.'
  - Privates Klagerecht mit Mindestschaden 1.000 USD je Verstoß — der einzige kalifornische KI-Tatbestand
    mit dieser Sanktionsstruktur. Praktisch das größte Prozessrisiko.
  - Die 3-Stunden-Pausenerinnerung gilt nur bei ERKANNTEN Minderjährigen; das Gesetz verlangt keine Altersverifikation.
    Das ist die Hauptlücke, die die 2026er Nachfolgevorhaben schließen sollen.
  - Krisenprotokoll muss veröffentlicht werden — Compliance ist also öffentlich überprüfbar.
  - 'Kalifornien und New York haben nahezu zeitgleich, aber unterschiedlich reguliert: NY (GBL Art. 47,
    seit 05.11.2025) verlangt die Offenlegung alle drei Stunden für ALLE Nutzer und ahndet mit bis zu
    15.000 USD pro Tag durch den Attorney General, ohne privates Klagerecht.'
  - SB 243 ist die Blaupause für die 14 Companion-Chatbot-Gesetze, die 2026 in anderen Staaten erlassen
    wurden.
