  regelungsschwerpunkte:
  - 'SB 947 (''No Robo Bosses'' Nachfolger): 2025 als SB 7 vetiert, 2026 aus dem Suspense File freigegeben
    (10:4). Würde Hinweis-, Auskunfts- und Überprüfungsrechte bei automatisierten Beschäftigungsentscheidungen
    einführen — die Lücke, die die FEHA-Regeln offenlassen.'
  - 'SB 813: Errichtung einer California AI Standards and Safety Commission. Wäre der erste einzelstaatliche
    KI-Regulierer mit eigener Auslegungskompetenz und würde die derzeitige Zersplitterung (CPPA, Civil
    Rights Council, Cal OES, CDT, Medical Board) bündeln.'
  - AB 2713 und SB 1000 schärfen die Provenienz- und Offenlegungsvorgaben von SB 942/AB 853 nach, bevor
    deren Stufe 2 am 01.01.2027 greift.
  - 'AB 2656: 45-Tage-Vorabinformation der Belegschaft vor der Einführung generativer KI. SB 951: 90-Tage-Anzeige
    vor technologiebedingter Verdrängung. Beide sind für europäische Arbeitgeber mit kalifornischen Standorten
    unmittelbar relevant.'
  - 'SB 1159: KI-Systeme gelten nicht als ''person'' im Sinne des California Public Records Act — bereits
    am 20.08.2026 mit 37:0 im Senat endgültig verabschiedet.'
  - 'Flankierend zwei Executive Orders des Gouverneurs 2026: EO N-5-26 (30.03.2026, Beschaffung zertifizierter
    verantwortungsvoller KI durch den Staat) und EO N-6-26 (21.05.2026, Vorbereitung von Beschäftigten
    und Unternehmen auf KI-bedingte Verwerfungen).'
