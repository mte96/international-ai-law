  offene_punkte:
  - Keine der untersuchten Normen enthält eine ausdrückliche Regel zur Vertreterbestellung wie Art. 22
    KI-VO. Wie ein Attorney General gegen einen Anbieter ohne US-Präsenz vollstreckt, ist ungeklärt.
  - Ob eine nach EU-Recht erstellte Trainingsdatenzusammenfassung als 'high-level summary' im Sinne von
    AB 2013 genügt, ist nicht amtlich geklärt. Bis dahin ist von zwei getrennten Dokumenten auszugehen.
  - Der Interessenkonflikt zwischen den kalifornischen Offenlegungspflichten und Geschäftsgeheimnisschutz
    ist in SB 53 und AB 2013 nicht ausdrücklich gelöst (anders als in Colorado SB 26-189, das eine Trade-Secret-Ausnahme
    kennt).
