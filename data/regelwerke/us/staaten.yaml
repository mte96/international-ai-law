  pruefvermerk:
  - '07.09.2026: Amtlicher Fristenkalender des kalifornischen Senats für 2026 gelesen: "Aug. 31 — Last
    day for each house to pass bills"; "Sept. 30 — Last day for Governor to sign or veto bills passed
    by the Legislature before Sept. 1 and in the Governor''s possession on or after Sept. 1". EINSCHRÄNKUNG:
    leginfo.legislature.ca.gov ist per robots.txt gesperrt; die Bill History war nicht abrufbar. Die Liste
    der KI-Vorlagen beim Gouverneur stützt sich auf Mitteilungen der amtlichen Senatsdomäne und ist deshalb
    NICHT abschließend — zu Vorlagen anderer Autoren (Padilla, Wiener, Umberg, Becker) war der Enrollment-Stand
    nicht zu belegen. WIDERSPRUCH, nicht aufgelöst: sd05.senate.ca.gov führt SB 420 als "No Tax Breaks
    for Detention Centers", leginfo als "Automated decision systems" (Padillas AI Bill of Rights); SB
    420 ist deshalb nicht als KI-Vorlage beim Gouverneur geführt. WARNUNG — Verwechslungsgefahr: Treffer
    zu "Senator Wiener''s Landmark AI Bill Awaits Newsom''s Decision" betreffen SB 53 aus dem Jahr 2025,
    nicht die Sitzungsperiode 2026.'
- id: us-co-sb24-205
