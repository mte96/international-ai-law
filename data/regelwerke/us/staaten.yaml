  kurztitel: HB 3773 (Illinois, KI im Beschäftigungsverhältnis)
  offizieller_titel: 'Amendment to the Illinois Human Rights Act — Artificial Intelligence in Employment
    (House Bill 3773), Public Act 103-0804

    '
  fundstelle: Public Act 103-0804; 775 ILCS 5/2-102, 5/2-103
  verfahrensnummer: IL HB 3773 (103rd General Assembly, 2024)
  status: anwendbar
  status_detail: 'Seit 01.01.2026 anwendbar. Die zur Konkretisierung angekündigten Regeln des Illinois
    Department of Human Rights wurden am 15.05.2026 im Illinois Register veröffentlicht und bereits am
    02.06.2026 wieder zurückgezogen; die für den 10.06.2026 angesetzte Anhörung entfiel. Es gilt also
    das Gesetz ohne Ausführungsvorschriften.

    '
  kurzbeschreibung: 'Das Gesetz erweitert den Illinois Human Rights Act. Arbeitgebern ist es untersagt,
    KI einzusetzen, die wegen eines geschützten Merkmals eine diskriminierende Wirkung bei Einstellung,
    Beförderung, Auswahl für Fortbildung, Entlassung, Disziplinarmaßnahmen, Vertragsverlängerung oder
    sonstigen Beschäftigungsbedingungen erzeugt. Ausdrücklich untersagt ist außerdem, die Postleitzahl
    als Stellvertretermerkmal für ein geschütztes Merkmal zu verwenden. Arbeitgeber müssen Bewerber und
    Beschäftigte informieren, wenn KI für eine erfasste Entscheidung eingesetzt wird. Anders als Texas
    verlangt Illinois KEINE Diskriminierungsabsicht — die Wirkung genügt. Durchsetzung über das Illinois
    Department of Human Rights, die Human Rights Commission und den regulären Klageweg einschließlich
    privatem Klagerecht.

    '
