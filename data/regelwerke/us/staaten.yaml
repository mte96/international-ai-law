- id: us-ny-raise
  jurisdiktion: us
  subjurisdiktion: us-ny
  kurztitel: RAISE Act (New York, Frontier-Modelle)
  offizieller_titel: 'Responsible AI Safety and Education Act (RAISE Act) — Senate Bill S6953B / Assembly
    Bill A6453B, in der Fassung der Chapter Amendment 2026

    '
  fundstelle: Laws of New York 2025, Chapter (Unterzeichnung 19.12.2025); Änderungsgesetz unterzeichnet
    27.03.2026
  verfahrensnummer: NY S6953B / A6453B (2025-2026 Legislative Session); Chapter Amendment S8828 (2026)
  status: verabschiedet
  status_detail: 'Am 19.12.2025 von Gouverneurin Hochul unterzeichnet, danach durch eine Chapter Amendment
    (eingebracht 06.01.2026, zweite Kammer 11.03.2026, unterzeichnet 27.03.2026) an die kalifornische
    TFAIA angeglichen. Anwendbar ab 01.01.2027. Die Meldefrist bleibt mit 72 Stunden deutlich strenger
    als in Kalifornien.

    '
  kurzbeschreibung: 'Der RAISE Act verpflichtet "large frontier developers" — Entwickler von Foundation
    Models mit mehr als 10^26 Integer- oder Gleitkommaoperationen und mehr als 500 Mio. USD Jahresumsatz
    — zur Veröffentlichung eines Frontier AI Framework mit Sicherheitsprotokollen und Risikominderungsansätzen
    sowie zur Veröffentlichung eines Transparenzberichts vor dem Deployment neuer oder wesentlich veränderter
    Modelle, einschließlich Kontaktangaben und Nutzungsbeschränkungen. Kritische Sicherheitsvorfälle sind
    binnen 72 Stunden nach Feststellung oder nach Kenntnis hinreichender Tatsachen für die begründete
    Annahme eines Vorfalls an eine neu geschaffene Stelle beim New York State Department of Financial
    Services zu melden. Durchsetzung durch den Attorney General mit bis zu 1 Mio. USD beim ersten und
    bis zu 3 Mio. USD bei weiteren Verstößen; die DFS-Stelle kann zusätzlich 1.000 USD je Tag für unterlassene
    Offenlegungserklärungen verhängen.

    '
  inkrafttreten:
    datum: 2027-01-01
    verifiziert: true
    quelle: https://www.wiley.law/alert-New-York-Finalizes-RAISE-Act-for-Frontier-AI-Models-Law-Takes-Effect-January-1-2027
  anwendungsdaten:
  - datum: 2025-12-19
    was_gilt: Unterzeichnung der Ursprungsfassung durch Gouverneurin Hochul, verbunden mit der Vereinbarung
      einer Chapter Amendment.
    verifiziert: true
    quelle: https://www.governor.ny.gov/news/governor-hochul-signs-nation-leading-legislation-require-ai-frameworks-ai-frontier-models
  - datum: 2026-03-27
    was_gilt: 'Unterzeichnung der Chapter Amendment: Angleichung von Definitionen und Schwellen an die
      kalifornische TFAIA; die 72-Stunden-Meldefrist bleibt erhalten.

      '
    verifiziert: true
    quelle: https://www.wiley.law/alert-New-York-Finalizes-RAISE-Act-for-Frontier-AI-Models-Law-Takes-Effect-January-1-2027
  - datum: 2027-01-01
    was_gilt: 'Anwendungsbeginn: Frontier AI Framework, Transparenzbericht vor Deployment, 72-Stunden-Vorfallmeldung
      an die DFS-Stelle, Offenlegungserklärung.

      '
    verifiziert: true
    quelle: https://www.wiley.law/alert-New-York-Finalizes-RAISE-Act-for-Frontier-AI-Models-Law-Takes-Effect-January-1-2027
  themenachsen:
  - gpai
  - governance
  - sicherheit-export
  - marktzugang
  regelungsschwerpunkte:
  - 'Die Chapter Amendment ist der wichtigste Vorgang: New York hat sein Gesetz bewusst an Kalifornien
    angeglichen, um Doppelregulierung zu vermeiden. Ein Framework kann beide Regime bedienen.'
  - 'Bleibende Unterschiede zu SB 53: Meldefrist 72 Stunden statt 15 Tage (die 24-Stunden-Frist bei unmittelbarer
    Gefahr ist in beiden Gesetzen identisch); Sanktionsstufe bis 3 Mio. USD für Wiederholungsfälle gegenüber
    einheitlich 1 Mio. USD in Kalifornien; Aufsichtsstelle beim Department of Financial Services statt
    beim Katastrophenschutz.

    '
  - 'Die Katastrophenschwelle ist nach der Chapter Amendment strittig: Cooley (Auswertung speziell der
    Änderung) nennt wie Kalifornien mehr als 50 Betroffene oder über 1 Mrd. USD Schaden, Wiley nennt 100
    Betroffene. Für die Praxis ist von der strengeren Schwelle (50 Betroffene) auszugehen.

    '
  - 'Die Ansiedlung beim DFS ist bemerkenswert: New York behandelt Frontier-KI aufsichtsrechtlich wie
    eine Finanzmarktfrage, mit einer stehenden Fachbehörde statt einer Meldestelle.'
  - 'Kein Frontier-Developer-Status unterhalb der Umsatzschwelle: Anders als SB 53 (das alle frontier
    developers zum Transparenzbericht verpflichtet) adressiert der RAISE Act nach der Angleichung schwerpunktmäßig
    large frontier developers.'
  - Auslöser der 72-Stunden-Frist ist bereits die Kenntnis hinreichender Tatsachen für eine begründete
    Annahme — nicht erst die abschließende Feststellung.
