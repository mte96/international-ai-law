- id: us-ca-ab1008
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: AB 1008 (Kalifornien, personenbezogene Daten in KI-Systemen)
  offizieller_titel: 'California Consumer Privacy Act of 2018: Personal Information (Assembly Bill 1008,
    Bauer-Kahan)

    '
  fundstelle: Chapter 804, Statutes of 2024; Civil Code § 1798.140 (v)
  verfahrensnummer: CA AB 1008 (2023-2024 Regular Session)
  status: anwendbar
  status_detail: 'Seit 01.01.2025 in Kraft. Praktisch die folgenreichste kalifornische KI-Norm überhaupt,
    weil sie das gesamte CCPA-Auskunfts-, Lösch- und Opt-out-Regime auf Modellgewichte anwendbar machen
    kann.

    '
  kurzbeschreibung: 'AB 1008 stellt klar, dass "personal information" im Sinne des CCPA in jedem Format
    vorliegen kann, ausdrücklich auch in "abstract digital formats" einschließlich komprimierter oder
    verschlüsselter Dateien, Metadaten und künstlicher Intelligenz-Systeme, die personenbezogene Daten
    ausgeben können. Damit unterfällt ein Modell, dessen Gewichte personenbezogene Daten reproduzieren
    können, potenziell den Betroffenen- rechten des CCPA — Auskunft, Löschung, Korrektur, Widerspruch
    gegen Verkauf und Weitergabe. Durchsetzung durch die California Privacy Protection Agency und den
    Attorney General; begrenztes privates Klagerecht nur bei Datenschutzverletzungen.

    '
  inkrafttreten:
    datum: 2025-01-01
    verifiziert: true
    quelle: https://www.mofo.com/artificial-intelligence/california
  anwendungsdaten:
  - datum: 2025-01-01
    was_gilt: Erweiterte Definition personenbezogener Daten gilt; KI-Systeme, die personenbezogene Daten
      ausgeben können, sind erfasst.
    verifiziert: true
    quelle: https://www.mofo.com/artificial-intelligence/california
  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  regelungsschwerpunkte:
  - 'Civil Code § 1798.140 (v)(1): ''personal information'' umfasst Daten ''in any format, including ...
    abstract digital formats'' und ausdrücklich KI-Systeme, die personenbezogene Daten ausgeben können.'
  - 'Die zentrale techno-juristische Streitfrage: enthält ein LLM personenbezogene Daten oder nur eine
    statistische Repräsentation? AB 1008 beantwortet sie im Zweifel zulasten des Anbieters, ohne die Frage
    dogmatisch zu klären.'
  - 'Folgeproblem Löschungsanspruch: Ein CCPA-Löschungsverlangen gegen Modellgewichte ist technisch nur
    über Machine Unlearning oder Retraining erfüllbar. Ausnahmen des § 1798.105 (d) (u.a. interne Nutzung,
    Sicherheit) können greifen, sind aber ungeklärt.'
  - 'Verzahnung mit AB 2013: die Pflicht, CCPA-Personenbezug in den Trainingsdaten offenzulegen, liefert
    die Tatsachengrundlage für AB-1008-Ansprüche.'
  - 'Verzahnung mit den CPPA-ADMT-Regeln: Training eines ADMT mit personenbezogenen Daten löst eine Risikobewertungspflicht
    aus.'
  dokumente:
  - datum: 2024-10-15
    typ: stellungnahme
    titel: Do LLMs Contain Personal Information? California AB 1008 Highlights Evolving, Complex Techno-Legal
      Debate
    url: https://fpf.org/blog/do-llms-contain-personal-information-california-ab-1008-highlights-evolving-complex-techno-legal-debate/
    sprache: en
    urheber: Future of Privacy Forum
    verifiziert: true
    notiz: 'Analyse der Kernfrage, ob Modellgewichte personenbezogene Daten enthalten. Stellt die europäischen
      Gegenpositionen gegenüber: Die Hamburgische Datenschutzaufsicht und die dänische Aufsicht verneinen
      einen Personenbezug der Gewichte (Tokenisierung als abstrakte mathematische Repräsentation), während
      ein relativer Ansatz auf die Identifizierbarkeit im Output abstellt. Der EDPB hat betont, dass technische
      Unmöglichkeit die Nichterfüllung der DSGVO nicht rechtfertigt, die Frage aber offengelassen. Damit
      ist der transatlantische Gleichlauf des Problems belegt.

      '
  - datum: 2024-07-16
    typ: ausschussbericht
    titel: CPPA Board Memo on AB 1008
