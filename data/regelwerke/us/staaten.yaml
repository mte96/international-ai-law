  regelungsschwerpunkte:
  - 'Der Absichtsmaßstab ist der Kern: Alle Verbote setzen eine INTENTION voraus. Ein diskriminierend
    wirkendes, aber nicht diskriminierend gemeintes System ist nach TRAIGA zulässig. Das ist die bewusste
    Gegenposition zu Colorado und Illinois.'
  - 'KI-Definition weit: jedes maschinengestützte System, das aus Eingaben ableitet, wie Ausgaben — Inhalte,
    Entscheidungen, Vorhersagen, Empfehlungen — zu erzeugen sind, die physische oder virtuelle Umgebungen
    beeinflussen können.'
  - 'Asymmetrie öffentlich/privat: Social-Scoring-Verbot, Offenlegungspflicht und das Verbot biometrischer
    Identifizierung ohne Einwilligung treffen nur staatliche Stellen. Private trifft nur der Absichtskatalog.'
  - 'Sanktionen: heilbare Verstöße 10.000-12.000 USD, nicht heilbare 80.000-200.000 USD, fortdauernde
    Verstöße 2.000-40.000 USD je Tag.'
  - 'Regulatory Sandbox beim Department of Information Resources: 36 Monate Befreiung von Lizenzanforderungen,
    aber NICHT von den TRAIGA-Kernverboten. Vierteljährliche Leistungsberichte.'
  - 'Flankierend SB 1188 (2025): Ärztliche Prüfung KI-generierter Behandlungsdokumentation und detaillierte
    Patienteninformation.'
  - 'Präemption lokaler Regelungen: Städte und Countys in Texas dürfen KI nicht eigenständig regulieren.
    Texas nimmt gegenüber seinen Kommunen genau die Position ein, die der Bund gegenüber den Staaten beansprucht.'
