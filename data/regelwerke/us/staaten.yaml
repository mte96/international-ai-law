- id: us-ca-cppa-admt
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: CPPA-Regeln zu ADMT, Risikobewertung und Cybersicherheits-Audit
  offizieller_titel: 'California Consumer Privacy Act Regulations — Automated Decisionmaking Technology,
    Risk Assessments, Cybersecurity Audits and Insurance (CCPA-Durchführungsverordnung der California
    Privacy Protection Agency)

    '
  fundstelle: Cal. Code Regs. tit. 11, div. 6 (CCPA-Regulations); genehmigt vom Office of Administrative
    Law am 23.09.2025, hinterlegt beim Secretary of State
  verfahrensnummer: CPPA Rulemaking Package ADMT/Risk Assessments/Cybersecurity Audits
  status: teilanwendbar
  status_detail: 'Seit 01.01.2026 in Kraft, aber mit langen Übergangsfristen. Die eigentliche ADMT-Compliance
    ist erst zum 01.04.2027 geschuldet, die erste Meldung über Risikobewertungen zum 01.04.2028, das erste
    Cybersicherheits-Audit gestaffelt ab 01.04.2028. In EO 14365 namentlich als problematisch benannt.

    '
  kurzbeschreibung: 'Die Verordnung konkretisiert drei Pflichtenkreise des CCPA. Erstens ADMT: Wer Technologie
    einsetzt, die personenbezogene Daten verarbeitet und menschliche Entscheidungsfindung ersetzt oder
    wesentlich ersetzt, um eine "significant decision" über Finanzen, Wohnen, Bildung, Beschäftigung oder
    Gesundheitsversorgung zu treffen, muss vorab informieren, ein Opt-out anbieten, Auskunft über die
    Logik geben und ein Widerspruchsverfahren vorhalten. Werbung ist ausdrücklich ausgenommen. Zweitens
    Risikobewertungen: Sie sind unter anderem verpflichtend beim Verkauf und Teilen personenbezogener
    Daten für Cross-Context-Werbung, bei der Verarbeitung sensibler Daten, beim ADMT-Einsatz für wesentliche
    Entscheidungen, beim Profiling im Bildungs- und Beschäftigungskontext und beim Training eines ADMT
    mit personenbezogenen Daten. Drittens jährliche unabhängige Cybersicherheits-Audits für Unternehmen
    oberhalb definierter Umsatz- und Verarbeitungsschwellen. Durchsetzung durch die CPPA und den Attorney
    General.

    '
  inkrafttreten:
    datum: 2026-01-01
    verifiziert: true
    quelle: https://cppa.ca.gov/regulations/ccpa_updates.html
  anwendungsdaten:
  - datum: 2025-09-23
    was_gilt: Genehmigung durch das Office of Administrative Law und Hinterlegung beim Secretary of State.
    verifiziert: true
    quelle: https://cppa.ca.gov/regulations/ccpa_updates.html
  - datum: 2026-01-01
    was_gilt: Inkrafttreten der Verordnung; Beginn der gestaffelten Einführung. Ab hier zählen die Bezugsjahre
      für die Audit- und Risikobewertungsfristen.
    verifiziert: true
    quelle: https://cppa.ca.gov/regulations/ccpa_updates.html
  - datum: 2027-04-01
    was_gilt: 'ADMT-Compliance-Stichtag: Unternehmen, die ADMT für wesentliche Entscheidungen einsetzen,
      müssen vorherige Nutzungshinweise, Opt-out-Möglichkeit, Auskunft über die Entscheidungslogik, Widerspruchsverfahren
      und die zugehörige Risikobewertung umgesetzt haben.

      '
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2025/10/california-finalizes-cppa-regulations
  - datum: 2027-12-31
    was_gilt: Stichtag für die Durchführung der ersten Risikobewertungen für bereits laufende Verarbeitungstätigkeiten.
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2025/10/california-finalizes-cppa-regulations
  - datum: 2028-04-01
    was_gilt: 'Erste Meldung an die CPPA über die in 2026 und 2027 durchgeführten Risikobewertungen (gemeldet
      werden Angaben zur Bewertung, nicht die Bewertung selbst). Zugleich erstes Cybersicherheits-Audit
      für Unternehmen mit über 100 Mio. USD Umsatz im Jahr 2026.

      '
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2025/10/california-finalizes-cppa-regulations
  - datum: 2029-04-01
    was_gilt: Cybersicherheits-Audit für Unternehmen mit 50 bis 100 Mio. USD Umsatz im Jahr 2027.
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2025/10/california-finalizes-cppa-regulations
  - datum: 2030-04-01
    was_gilt: Cybersicherheits-Audit für Unternehmen mit unter 50 Mio. USD Umsatz im Jahr 2028.
    verifiziert: true
    quelle: https://www.skadden.com/insights/publications/2025/10/california-finalizes-cppa-regulations
  themenachsen:
  - datenschutz
  - arbeit
  - sektor-finanz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'ADMT-Definition: Technologie, die personenbezogene Daten verarbeitet UND Berechnungen nutzt, um menschliche
    Entscheidungsfindung zu ersetzen oder wesentlich zu ersetzen (''replace or substantially replace'').
    Reine Entscheidungsunterstützung fällt heraus — das ist enger als die FEHA-Definition des Civil Rights
    Council.'
  - '''Significant decision'': Finanzen, Wohnen, Bildung, Beschäftigung, Gesundheitsversorgung. Werbung
    wurde im Verfahren ausdrücklich herausgenommen — der wichtigste Kompromiss gegenüber dem Entwurf.'
  - 'Risikobewertungspflicht beim TRAINING eines ADMT mit personenbezogenen Daten: das trifft Modellentwickler,
    nicht nur Anwender.'
  - Die Risikobewertung wird der CPPA nicht im Volltext vorgelegt — nur eine Meldung über ihre Durchführung.
    Die Behörde kann den Volltext aber anfordern.
  - 'Cybersicherheits-Audit: unabhängig, jährlich, umsatzgestaffelt; das erste greift erst 2028, die Bezugsgröße
    ist aber schon der Umsatz 2026.'
  - 'Verzahnung mit AB 1008: sobald ein Modell personenbezogene Daten enthält, greifen CCPA-Betroffenenrechte
    und damit auch dieses Regime.'
  dokumente:
  - datum: 2025-09-23
    typ: endfassung
    titel: CCPA Updates — Approved Regulations (ADMT, Risk Assessments, Cybersecurity Audits, Insurance)
    url: https://cppa.ca.gov/regulations/ccpa_updates.html
    sprache: en
    urheber: California Privacy Protection Agency
    verifiziert: true
    notiz: Amtliche Rulemaking-Seite mit dem genehmigten Verordnungstext, dem Final Statement of Reasons
      und dem Genehmigungsdatum.
  - datum: 2025-10-09
    typ: bericht
    titel: California Finalizes CCPA Regulations for Automated Decision-Making Technology, Risk Assessments
      and Cybersecurity Audits
    url: https://www.skadden.com/insights/publications/2025/10/california-finalizes-cppa-regulations
    sprache: en
    urheber: Skadden, Arps, Slate, Meagher & Flom LLP
    verifiziert: true
    notiz: Vollständige Fristentabelle (01.04.2027, 31.12.2027, 01.04.2028/2029/2030) und die maßgeblichen
      Definitionen. Die belastbarste Einzelquelle für die Staffelung.
  offene_punkte:
  - Abgrenzung 'substantially replace' zu bloßer Entscheidungsunterstützung ist die Kernfrage der Anwendbarkeit
    und noch ohne Auslegungspraxis.
  - Divergenz zur FEHA-Definition des Civil Rights Council ('makes or facilitates'), die weiter ist. Ein
    Beschäftigungssystem kann unter FEHA fallen, aber nicht unter die CPPA-ADMT-Regeln — und umgekehrt
    greift dann nur eines der beiden Pflichtenpakete.
  - EO 14365 nennt die CCPA-ADMT-Regeln ausdrücklich; eine Anfechtung durch die DOJ Task Force ist bis
    27.08.2026 nicht erhoben, bleibt aber möglich.
