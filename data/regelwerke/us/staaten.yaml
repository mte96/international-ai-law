    typ: bericht
    titel: Pared Back Version of the Texas Responsible Artificial Intelligence Governance Act Signed Into
      Law
    url: https://www.klgates.com/Pared-Back-Version-of-the-Texas-Responsible-Artificial-Intelligence-Governance-Act-Signed-Into-Law-6-24-2025
    sprache: en
    urheber: K&L Gates LLP
    verifiziert: true
    notiz: 'Dokumentiert, was gegenüber dem Ursprungsentwurf HB 1709 gestrichen wurde: Offenlegungspflichten
      privater Arbeitgeber gegenüber Bewerbern und Beschäftigten, verpflichtende Impact Assessments zur
      Erkennung und Minderung algorithmischer Verzerrung sowie Pflicht zu Risikominderungsrichtlinien
      für Entwickler und Deployer. Damit entfielen praktisch alle Pflichten des Privatsektors. Wichtig,
      um die politische Richtung der Südstaaten zu verstehen.

      '
  offene_punkte:
  - 'Praktische Bedeutung des Absichtserfordernisses: Wie ein Attorney General Absicht bei einem trainierten
    Modell nachweisen will, ist ungeklärt. Bis 27.08.2026 keine bekannte Durchsetzungsmaßnahme.'
  - 'Der im Ursprungsentwurf HB 1709 vorgesehene Texas Artificial Intelligence Council wird weder von
    Baker Botts noch von K&L Gates als Bestandteil der Endfassung genannt; beide beschreiben nur das Department
    of Information Resources als Träger des Reallabors. Vor einer Verwendung des Begriffs ist der Gesetzestext
    zu prüfen.

    '
  - 'Gestrichen wurden vor der Verabschiedung sämtliche Privatsektor-Kernpflichten des Entwurfs: Offenlegung
    gegenüber Bewerbern und Beschäftigten, Impact Assessments und Risikominderungsrichtlinien. Der Vergleich
    mit dem Entwurf erklärt, warum TRAIGA trotz weiten Anwendungsbereichs praktisch mild ist.

    '
  - TRAIGA ist das Modell, auf das sich die Bundesregierung bei EO 14365 als 'nicht onerous' beruft. Für
    europäische Anbieter ist es das mit Abstand am leichtesten zu erfüllende der sechs untersuchten Regime.
