- id: us-nj-fair-act
  jurisdiktion: us
  kurztitel: FAIR Act (New Jersey, algorithmische Mietpreisbildung)
  offizieller_titel: 'Forbidding the Algorithmic Inflation of Rent (FAIR) Act (Assembly Bill No. 3497,
    2026-2027 Legislative Session)

    '
  fundstelle: P.L. 2026, c. 43 (New Jersey)
  verfahrensnummer: NJ A 3497 (2026-2027 Legislative Session)
  status: verabschiedet
  status_detail: 'Am 30.06.2026 von beiden Kammern angenommen (Assembly 57:22, Senat 33:4) und am 20.07.2026
    vom Gouverneur unterzeichnet. Eine der ersten US-Regelungen, die den Einsatz von Algorithmen zur Mietpreisbildung
    unmittelbar verbietet. Der genaue Anwendungsbeginn konnte nicht verifiziert werden.

    '
  kurzbeschreibung: 'Der FAIR Act untersagt den Einsatz algorithmischer Systeme zur koordinierten Festsetzung,
    Empfehlung oder Beeinflussung von Mieten für Wohnraum in New Jersey. Er gehört zu dem 2026 schnell
    wachsenden Regelungsmuster gegen algorithmische Preissetzung, das sich vom klassischen KI-Recht dadurch
    unterscheidet, dass es kartellrechtlich motiviert ist: Angegriffen wird nicht die Intransparenz oder
    Diskriminierungswirkung des Systems, sondern seine Eignung, zwischen Wettbewerbern eine Preisabstimmung
    ohne ausdrückliche Absprache herzustellen. Vergleichbare Regelungen bestehen in Colorado und Maryland
    (allgemeine Preisalgorithmen) sowie in Kalifornien (AB 325, Preisalgorithmen unter Verwendung von
    Wettbewerberdaten, seit 01.01.2026); in New York liegt A 9349 (Überwachungspreise) dem Gouverneur
    vor.

    '
