- id: us-ca-feha-ads
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: FEHA-Regeln zu automatisierten Entscheidungssystemen (Beschäftigung)
  offizieller_titel: 'Employment Regulations Regarding Automated-Decision Systems — Änderungen der Diskriminierungsverordnung
    zum Fair Employment and Housing Act durch den California Civil Rights Council

    '
  fundstelle: Cal. Code Regs. tit. 2, §§ 11008, 11008.1, 11009, 11013, 11017.1, 11020, 11028, 11071, 11072;
    genehmigt vom Office of Administrative Law am 27.06.2025
  verfahrensnummer: Civil Rights Council Rulemaking, ADS Employment Regulations
  status: anwendbar
  status_detail: 'Seit 01.10.2025 anwendbar. Kein neues Verbot, sondern eine Klarstellung, wie das bestehende
    Antidiskriminierungsrecht des FEHA auf automatisierte Systeme angewendet wird — genau deshalb praktisch
    wirksam: es gilt sofort und über die etablierten FEHA-Klagewege einschließlich privatem Klagerecht.

    '
  kurzbeschreibung: 'Die Verordnung stellt klar, dass der Einsatz eines automatisierten Entscheidungssystems
    im Beschäftigungsverhältnis eine unzulässige Diskriminierung darstellen kann, wenn er Bewerberinnen
    oder Beschäftigte wegen eines geschützten Merkmals benachteiligt. Ein ADS ist ein rechnerischer Prozess,
    der eine Entscheidung über eine Beschäftigungsleistung trifft oder die menschliche Entscheidung darüber
    unterstützt, abgeleitet aus KI, maschinellem Lernen, Statistik oder anderen Datenverarbeitungstechniken;
    generative Systeme sind eingeschlossen. Arbeitgeber haften auch für Systeme Dritter, sofern der Anbieter
    als "agent" eine traditionell dem Arbeitgeber zukommende Funktion ausübt; Beihilfe- und Anstiftungshaftung
    erfasst auch Entwickler und Implementierer. Alle ADS-bezogenen Daten sind mindestens vier Jahre aufzubewahren.
    Persönlichkeits- oder Eignungstests, die auf Behinderungen oder psychische Gesundheit schließen lassen,
    können unzulässige medizinische Untersuchungen sein.

    '
