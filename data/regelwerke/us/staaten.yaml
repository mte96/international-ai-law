  kurztitel: SB 1047 (Kalifornien, Veto 2024)
  offizieller_titel: 'Safe and Secure Innovation for Frontier Artificial Intelligence Models Act (Senate
    Bill 1047, Wiener)

    '
  fundstelle: Nicht in Kraft getreten — Veto des Gouverneurs vom 29.09.2024
  verfahrensnummer: CA SB 1047 (2023-2024 Regular Session)
  status: gescheitert
  status_detail: 'Von beiden Kammern verabschiedet, am 29.09.2024 von Gouverneur Newsom per Veto gestoppt.
    Kein Überstimmungsversuch. Der Nachfolger SB 53 (2025) hat den Regelungsgedanken in stark abgeschwächter,
    transparenzbasierter Form umgesetzt.

    '
  kurzbeschreibung: 'SB 1047 hätte Entwickler von Modellen oberhalb von 10^26 Operationen und 100 Mio.
    USD Trainingskosten verpflichtet, vor dem Training ein Sicherheitsprotokoll zu erstellen, einen "Full
    Shutdown"-Kill-Switch vorzuhalten, jährliche Drittprüfungen durchführen zu lassen und unter Strafandrohung
    zu bescheinigen, dass das Modell keine "critical harms" (Massenopfer, Schäden über 500 Mio. USD) ermöglicht.
    Durchsetzung durch den Attorney General mit Unterlassungs- und Schadensersatzklagen. Newsom begründete
    das Veto damit, dass die Schwellen allein an Rechenleistung anknüpften und kleine, aber gefährliche
    Modelle ausklammerten, während sie große Modelle unabhängig vom Einsatzkontext belasteten.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.gibsondunn.com/regulating-the-future-eight-key-takeaways-from-californias-sb-1047-vetoed-by-governor-newsom/
