  kurztitel: Utah AI Policy Act (SB 149, geändert durch SB 226 und SB 332)
  offizieller_titel: 'Artificial Intelligence Policy Act (Senate Bill 149, 2024), geändert durch Senate
    Bill 226 (Artificial Intelligence Amendments, 2025) und Senate Bill 332 (Artificial Intelligence Revisions,
    2025)

    '
  fundstelle: Utah Code Title 13, Chapter 2 und Chapter 72 (Artificial Intelligence Policy Act)
  verfahrensnummer: UT SB 149 (2024 General Session); SB 226, SB 332 (2025 General Session); HB 320 (2026)
  status: anwendbar
  status_detail: 'Seit 01.05.2024 in Kraft, 2025 durch SB 226 inhaltlich deutlich entschärft und durch
    SB 332 mit einem verlängerten Sonnenuntergang bis 01.07.2027 versehen. 2026 wurde mit HB 320 (unterzeichnet
    18.03.2026) das Office of Artificial Intelligence Policy umgestaltet. Utah ist der einzige der sechs
    untersuchten Staaten, dessen KI-Grundgesetz eine Verfallsklausel trägt.

    '
  kurzbeschreibung: 'Das Gesetz war ursprünglich das erste allgemeine KI-Offenlegungsgesetz eines US-Bundesstaates:
    Wer generative KI im Verbraucherkontakt einsetzt, musste dies offenlegen, in regulierten Berufen proaktiv,
    sonst auf Nachfrage. SB 226 hat die Pflicht 2025 auf zwei Fälle reduziert: eine Offenlegung ist geschuldet,
    wenn ein Verbraucher oder Lieferant ausdrücklich danach fragt, und — prominent — bei "high-risk artificial
    intelligence interactions", also solchen, bei denen sensible personenbezogene Daten erhoben oder personalisierte
    Empfehlungen gegeben werden, die finanzielle, rechtliche, medizinische oder psychosoziale Entscheidungen
    wesentlich beeinflussen können. SB 226 schuf zudem einen Safe Harbor für Anbieter, die klar und deutlich
    offenlegen — dieser greift jedoch nicht, wenn die verletzende Aussage vom KI-System selbst stammt.
    Zentral bleibt die Zurechnungsregel: Wer KI im Verbraucherkontakt einsetzt, kann sich nicht darauf
    berufen, die KI habe die rechtswidrige Aussage getroffen. Durchsetzung durch die Division of Consumer
    Protection; flankierend betreibt das Office of Artificial Intelligence Policy ein Reallabor mit "regulatory
    mitigation agreements".

    '
