- id: us-staaten-uebersicht
  jurisdiktion: us
  kurztitel: Gesamtlage KI-Gesetzgebung der US-Bundesstaaten (Sammeleintrag)
  offizieller_titel: 'Überblick über die KI-Gesetzgebung der 50 US-Bundesstaaten außerhalb Kaliforniens,
    Colorados, Texas'', Illinois'', New Yorks und Utahs — Stand 27. August 2026

    '
  fundstelle: Sammeleintrag; keine einheitliche Fundstelle
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'Zahlen zum Stichtag: 2025 haben nach NCSL alle 50 Staaten sowie Puerto Rico, die Virgin
    Islands und der District of Columbia KI-Gesetze eingebracht; 38 Staaten haben rund 100 Maßnahmen erlassen.
    Für 2026 weisen die Tracker abweichende, aber gleichgerichtete Zahlen aus: MultiState zählte bis März
    2026 in 45 Staaten 1.561 eingebrachte Vorlagen; die Transparency Coalition zählte bis Jahresmitte
    84 neue Gesetze in 27 Staaten, bis August rund 85; TechPolicy.Press zählte zum 01.07.2026 109 KI-Gesetze
    plus 28 Rechenzentrumsgesetze in 29 Staaten (2025 waren es zum gleichen Stichtag 121 bzw. 27 in 39
    Staaten). Die Zählweisen unterscheiden sich; einheitlich ist der Befund: leicht rückläufige Zahl aktiver
    Staaten, aber unverändert hohes Gesetzesvolumen.

    '
  kurzbeschreibung: 'Die einzelstaatliche KI-Regulierung der USA ist 2026 kein einheitliches Feld mehr,
    sondern zerfällt in sechs klar erkennbare Regelungsmuster mit jeweils eigenem Verbreitungsgrad. Ein
    umfassendes, EU-nahes Risikoregime hat sich NICHT durchgesetzt — der einzige Versuch (Colorado) ist
    gescheitert. Stattdessen dominieren enge, sektorale und offenlegungsorientierte Gesetze. Parallel
    hat der Bund mit Executive Order 14365 vom 11.12.2025 einen Präemptionsdruck aufgebaut, der messbar
    auf die Landesgesetzgebung durchschlägt: Er hat den Colorado-Reset mit ausgelöst, ein Utah-Vorhaben
    direkt gestoppt und die Gesetzgebung erkennbar in als unbedenklich geltende Felder (Kinderschutz,
    Rechenzentren) umgelenkt.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.techpolicy.press/where-state-ai-legislation-stands-half-way-into-2026/
  anwendungsdaten:
  - datum: 2025-12-11
    was_gilt: 'Executive Order 14365 ("Ensuring a National Policy Framework for Artificial Intelligence")
      unterzeichnet: AI Litigation Task Force beim DOJ (Einrichtung binnen 30 Tagen, operativ ab 10.01.2026),
      Commerce-Bewertung "onerous" einzelstaatlicher Gesetze binnen 90 Tagen (11.03.2026), FTC-Grundsatzerklärung
      und FCC-Verfahren, Bindung von BEAD-Breitbandmitteln (42 Mrd. USD) an die Rücknahme beanstandeter
      Landesgesetze.

      '
    verifiziert: true
    quelle: https://www.whitecase.com/insight-alert/state-ai-laws-under-federal-scrutiny-key-takeaways-executive-order-establishing
  - datum: 2026-05-27
    was_gilt: 'Connecticut erlässt das umfassendste Omnibus-KI-Gesetz 2026 (Online-Sicherheit, KI-Begleiter,
      Beschäftigungs-KI, Provenienz, Whistleblower-Schutz für Frontier-Entwickler) mit gestaffelten Terminen
      01.10.2026, 01.01.2027, 01.10.2027 und 01.01.2028.

      '
    verifiziert: true
    quelle: https://www.mofo.com/resources/insights/260608-connecticut-enacts-sweeping-ai-law
  - datum: 2026-07-20
    was_gilt: New Jersey erlässt den FAIR Act (A 3497) gegen algorithmische Mietpreisabstimmung — eine
      der ersten US-Regelungen zu KI im Wohnungsmarkt.
    verifiziert: true
    quelle: https://www.transparencycoalition.ai/news/ai-legislative-update-august21-2026
