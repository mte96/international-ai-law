  kurztitel: Colorado AI Act (SB 24-205) — aufgehoben, nie angewandt
  offizieller_titel: 'Concerning Consumer Protections in Interactions with Artificial Intelligence Systems
    (Senate Bill 24-205)

    '
  fundstelle: Colo. Rev. Stat. Title 6, Article 1, Part 17 (aufgehoben und neu erlassen durch SB 26-189)
  verfahrensnummer: 'CO SB 24-205 (2024 Regular Session); Verschiebungen: SB 25B-004 (2025 Special Session);
    Aufhebung: SB 26-189 (2026)'
  status: aufgehoben
  status_detail: 'Am 17.05.2024 unterzeichnet, ursprünglich anwendbar ab 01.02.2026, per SB 25B-004 (unterzeichnet
    28.08.2025, Sonderperiode) auf den 30.06.2026 verschoben. Am 27.04.2026 setzte das US District Court
    for the District of Colorado die Durchsetzung im Verfahren xAI v. Colorado im Wege eines Stipulated
    Order aus. Am 14.05.2026 hob SB 26-189 das Gesetz auf und ersetzte es. Ergebnis: Der erste umfassende
    Anti-Diskriminierungs-Ansatz der USA ist NIE ANWENDBAR GEWORDEN.

    '
  kurzbeschreibung: 'SB 24-205 wäre das erste umfassende einzelstaatliche KI-Gesetz der USA gewesen. Es
    verpflichtete Entwickler und Deployer von "high-risk artificial intelligence systems" — Systemen,
    die einen wesentlichen Faktor bei folgenreichen Entscheidungen über Bildung, Beschäftigung, Finanzdienstleistungen,
    staatliche Leistungen, Gesundheitsversorgung, Wohnen, Versicherungen oder Rechtsdienstleistungen bilden
    — zu angemessener Sorgfalt zum Schutz vor algorithmischer Diskriminierung. Deployer mussten ein Risikomanagementprogramm
    nach anerkanntem Rahmenwerk (NIST AI RMF, ISO/IEC 42001) unterhalten, jährliche und anlassbezogene
    Impact Assessments durchführen, Verbraucher vor der Entscheidung informieren, bei nachteiligen Entscheidungen
    Gründe und Korrekturrechte mitteilen und dem Attorney General entdeckte Diskriminierung binnen 90
    Tagen melden. Entwickler mussten umfangreiche Dokumentation bereitstellen. Durchsetzung ausschließlich
    durch den Attorney General nach dem Colorado Consumer Protection Act.

    '
