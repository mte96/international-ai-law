    auf angemessene Vorkehrungen und vorgeschriebener Gesetzeswortlaut. Diese Liste bleibt der beste verfügbare
    Compliance-Maßstab, obwohl sie nicht in Kraft ist.'
  - Privates Klagerecht über den IHRA — wie in Kalifornien unter FEHA, anders als bei fast allen sonstigen
    KI-Gesetzen der Staaten.
  - Keine Bias-Audit-Pflicht und keine Veröffentlichungspflicht wie NYC LL 144.
