  - 'Der Anwendungsbeginn ist nicht ermittelt. New Jersey kennt sowohl sofortige Wirksamkeit als auch
    Fristen; ohne Einsicht in den Gesetzestext ist das nicht zu klären.

    '
  - 'Der genaue Verbotstatbestand (nur koordinierte Preissetzung zwischen Wettbewerbern oder auch die
    individuelle algorithmische Mietpreisoptimierung) konnte nicht verifiziert werden. Das ist die entscheidende
    Frage für die Reichweite.

    '
  - 'Sanktionen und Durchsetzungszuständigkeit sind nicht ermittelt.

    '
