- id: us-ct-2026
  jurisdiktion: us
  kurztitel: CART Act / SB 5 (Connecticut)
  offizieller_titel: 'An Act Concerning Online Safety (Substitute Senate Bill No. 5, 2026 Regular Session)
    — im Gesetz selbst als "Connecticut Artificial Intelligence Responsibility and Transparency Act" (CART
    Act) bezeichnet

    '
  fundstelle: Public Act 26-15 (Connecticut, 2026)
  verfahrensnummer: 'CT SB 5 (2026 Regular Session); gescheiterte Vorläufer: SB 2 (2024 Regular Session)
    und SB 2 (2025 Regular Session), beide Maroney

    '
  status: teilanwendbar
  status_detail: 'Am 27.05.2026 von Gouverneur Lamont unterzeichnet, nach zwei gescheiterten Anläufen
    in den Jahren 2024 und 2025. Die Staatsorganisationsvorschriften (u.a. Artificial Intelligence Policy
    Office) gelten seit der Ausfertigung; die materiellen Pflichten setzen erst am 01.10.2026 ein und
    laufen gestaffelt bis 01.03.2028. Mit 71 Seiten das umfassendste einzelstaatliche KI-Gesetz des Jahres
    2026 — aber gerade nicht die Fortsetzung des Colorado-Modells.

    '
  kurzbeschreibung: 'Der CART Act ist ein Omnibusgesetz mit sechs weitgehend unabhängigen Regelungsblöcken.
    Erstens automatisierte Beschäftigungsentscheidungen (AEDT): Wird eine solche Technologie als "substantial
    factor" bei Einstellung, Beförderung, Disziplinierung, Entlassung, Weiterbeschäftigung oder Auswahl
    für Weiterbildung eingesetzt, ist vor der Entscheidung schriftlich zu informieren — über Werkzeug,
    Handelsname, Zweck, Art der Entscheidung, Kategorien und Quellen der ausgewerteten personenbezogenen
    Daten, deren Bewertung sowie eine Kontaktstelle; bei interaktiven Werkzeugen genügt der Hinweis, dass
    keine Person antwortet, sofern das nicht ohnehin offensichtlich ist. Zweitens KI-Begleiter: Betreiber
    müssen evidenzbasierte Protokolle zur Erkennung von Suizid-, Selbstverletzungs- und Gewaltäußerungen
    vorhalten, den KI-Charakter offenlegen und gegenüber Minderjährigen manipulative Bindungstechniken,
    sexuelle Interaktion und unregulierte psychische Gesundheitsdienste unterlassen. Drittens Inhaltsprovenienz:
    Anbieter generativer KI mit über einer Million monatlichen Nutzern müssen KI-erzeugte Audio-, Bild-
    und Videoinhalte authentifizierbar machen und gegen Manipulation sichern. Viertens Frontier-Modelle:
    Verbot von Repressalien gegen Beschäftigte, die katastrophale Risiken melden; große Entwickler müssen
    einen anonymen Meldekanal betreiben und Leitungsorgane vierteljährlich unterrichten. Fünftens Minderjährigenschutz
    auf sozialen Plattformen. Sechstens staatliche Struktur: Artificial Intelligence Policy Office, Reallabor,
    freiwilliges Safe-Harbor-Programm und Qualifizierungsinitiativen. Durchsetzung der AEDT-Vorschriften
    ausschließlich durch den Attorney General über den Connecticut Unfair Trade Practices Act mit einer
    bis zum 31.12.2027 befristeten Heilungsmöglichkeit; für die Chatbot-Vorschriften besteht ein privates
    Klagerecht mit bis zu 25.000 USD je Verstoß.

    '
