  regelungsschwerpunkte:
  - 'MUSTER 1 — Companion-Chatbots und Kindersicherheit (dominant): 14 Gesetze allein 2026, aufbauend
    auf Kalifornien SB 243 und New York GBL Art. 47. Kern: Offenlegung, dass kein Mensch antwortet; Suizid-
    und Selbstverletzungsprotokoll; Sonderregeln für Minderjährige. Republikanisch geführte Staaten ergänzen
    Altersverifikation und Elternrechte. Utah, Connecticut und New York verschärfen 2026/2027 nach.'
  - 'MUSTER 2 — Deepfakes, Wahlen und nicht einvernehmliche Bilder: das älteste und breiteste Muster,
    in der überwiegenden Mehrzahl der Staaten vorhanden, 2026 mit wachsender überparteilicher Unterstützung.
    Typischer Inhalt: Kennzeichnungspflicht für politische Werbung in einem Zeitfenster vor der Wahl,
    Verbot nicht einvernehmlicher intimer Darstellungen, KI-generiertes CSAM. Beispiele 2026: Utah HB
    276 und HB 289.'
  - 'MUSTER 3 — Gesundheit und psychische Gesundheit: sechs Gesetze allein 2026 zur KI-Nutzung durch Krankenversicherer
    (Leistungsprüfung darf nicht allein durch KI erfolgen). Daneben Verbote und Beschränkungen der KI-Therapie
    (Illinois WOPR Act als schärfste Ausprägung, Utah HB 452 als mildere), Kennzeichnungspflichten für
    KI-generierte Patientenkommunikation (Kalifornien AB 3030) und Bezeichnungsverbote (Kalifornien AB
    489).'
  - 'MUSTER 4 — Beschäftigung und automatisierte Entscheidungen: der zerfaserteste Bereich. Vier unterschiedliche
    Ansätze konkurrieren: Bias-Audit mit Veröffentlichung (NYC LL 144), Antidiskriminierung über Wirkungsmaßstab
    (Illinois HB 3773, kalifornische FEHA-Regeln), Auskunfts- und Überprüfungsrechte (Colorado SB 26-189,
    Connecticut ab 01.10.2027) und datenschutzrechtliche Opt-outs (CPPA-ADMT-Regeln ab 01.04.2027). Es
    gibt keinen gemeinsamen Nenner.'
  - 'MUSTER 5 — Frontier-Modelle: der neueste und am schnellsten konvergierende Bereich. Drei Staaten,
    identische Schwellen (10^26 Operationen, 500 Mio. USD Umsatz): Kalifornien SB 53 (seit 01.01.2026),
    New York RAISE Act (ab 01.01.2027), Illinois SB 315 (ab 01.01.2027, Drittaudits ab 01.01.2028). Connecticut
    hat 2026 flankierend Whistleblower-Schutz für Frontier-Entwickler erlassen. Nur Illinois verlangt
    ein unabhängiges Drittaudit.'
  - 'MUSTER 6 — Rechenzentren (2026 neu entstanden): 28 Gesetze in einem Jahr, erstmals sowohl in republikanisch
    als auch in demokratisch geführten Staaten. Inhalte: Schutz der Netzentgeltzahler, Aufsichtspflichten,
    Rücknahme von Steueranreizen, Moratorien. Maine hat ein Moratorium vetiert, New Yorks A 11560 liegt
    der Gouverneurin vor. Für Modellanbieter mit US-Rechenkapazität der praktisch relevanteste neue Bereich.'
  - 'MUSTER 7 — algorithmische Preissetzung: Colorado und Maryland (allgemeine Preisalgorithmen), New
    Jersey FAIR Act (Mietpreise), Kalifornien AB 325 (Preisalgorithmen mit Wettbewerberdaten), New York
    A 9349 (Überwachungspreise, dem Gouverneur vorliegend). Ein kartellrechtlich geprägtes, schnell wachsendes
    Feld.'
  - 'BEOBACHTUNGSLISTE 2027: Connecticut (Umsetzung des Omnibus-Gesetzes und weitere Verschärfung), Massachusetts,
    New Jersey, Michigan, Pennsylvania, Ohio und North Carolina (2026 aktive, aber noch nicht abgeschlossene
    Verfahren); Vermont (Neurodaten); Utah (Sonnenuntergang des AI Policy Act zum 01.07.2027); Colorado
    (Rechtsverordnung des Attorney General und Ausgang des xAI-Verfahrens); und generell die Frage, ob
    der Bund 2027 ein Präemptionsgesetz erlässt.'
  - 'FÖDERALER GEGENDRUCK: EO 14365 benennt namentlich den Colorado AI Act (''probably the most excessive''),
    Kalifornien SB 53, Kalifornien AB 2013, die CCPA-ADMT-Regeln und NYC Local Law 144. Die DOJ AI Litigation
    Task Force hat bis 27.08.2026 keine eigene Klage erhoben, ist aber in xAI v. Colorado als Intervenient
    beigetreten (24.04.2026). Politisch wirksam ist die EO bereits: Colorado hat sein Gesetz ersetzt,
    Utah HB 286 wurde gestoppt, Illinois hat seine IDHR-Regeln zurückgezogen.'
