      legt der Legislative seinen Vorschlag für den öffentlichen Rechencluster vor.

      '
    verifiziert: true
    quelle: https://www.lw.com/en/insights/california-assumes-role-as-lead-us-regulator-of-ai
  - datum: 2027-01-01
    was_gilt: 'Beginn der jährlichen Überprüfung der Legaldefinitionen ("frontier model", "large frontier
      developer") durch das California Department of Technology mit Empfehlung an die Legislative (Gov.
      Code § 11546.8). Die Compute- und Umsatzschwellen können dadurch abgesenkt werden.

      '
