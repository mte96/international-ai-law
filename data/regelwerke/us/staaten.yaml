    '
  - 'Der Wortlaut von Public Act 26-15 konnte nicht eingesehen werden (cga.ct.gov per robots.txt gesperrt).
    Die Abschnittszählung und die genauen "Effective"-Vermerke je Abschnitt sind daher nicht einzelnormscharf
