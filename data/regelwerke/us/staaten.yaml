- id: us-ca-sb942-ab853
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: SB 942 / AB 853 (California AI Transparency Act, Provenienz)
  offizieller_titel: 'California AI Transparency Act (Senate Bill 942, Becker, 2024), geändert und gestaffelt
    durch Assembly Bill 853 (Wicks, 2025)

    '
  fundstelle: 'SB 942: Chapter 291, Statutes of 2024; Bus. & Prof. Code §§ 22757 ff. — AB 853: Statutes
    of 2025'
  verfahrensnummer: CA SB 942 (2023-2024); CA AB 853 (2025-2026)
  status: teilanwendbar
  status_detail: 'Ursprünglich zum 01.01.2026 vorgesehen, durch AB 853 auf den 02.08.2026 verschoben.
    Die Kernpflichten für GenKI-Anbieter sind seit 02.08.2026 — also seit 25 Tagen — anwendbar. Zwei weitere
    Stufen folgen: große Online-Plattformen und Hosting-Plattformen zum 01.01.2027, Aufnahmegeräte zum
    01.01.2028.

    '
  kurzbeschreibung: 'Anbieter generativer KI-Systeme mit mehr als einer Million monatlichen Besuchern
    oder Nutzern, die in Kalifornien öffentlich zugänglich sind, müssen in jeden erzeugten oder veränderten
    Inhalt eine maschinenlesbare latente Kennzeichnung einbetten, die den Inhalt eindeutig identifiziert
    und Name und Version des Systems sowie Erstellungs- bzw. Änderungszeitpunkt trägt; sie muss dauerhaft
    und für Erkennungswerkzeuge lesbar sein. Zusätzlich müssen sie den Nutzern die Option auf eine sichtbare
    (manifeste) Kennzeichnung in Bild, Video und Audio anbieten und ein kostenloses, öffentlich zugängliches
    Erkennungswerkzeug bereitstellen. Ab 01.01.2027 müssen große Online-Plattformen eingebettete Provenienzdaten
    auslesen und anzeigen, und Hosting-Plattformen dürfen keine nicht konformen GenKI-Systeme wissentlich
    anbieten. Ab 01.01.2028 müssen Hersteller von Aufnahmegeräten die Aufnahme von Provenienzdaten standardmäßig
    ermöglichen. Durchsetzung durch den Attorney General, 5.000 USD je Verstoß, jeder Tag ein eigener
    Verstoß; kein privates Klagerecht, aber Unterlassungsansprüche und Anwaltskosten.

    '
  inkrafttreten:
    datum: 2026-08-02
    verifiziert: true
    quelle: https://www.morganlewis.com/pubs/2026/08/new-california-ai-disclosure-rules-become-operative
  anwendungsdaten:
  - datum: 2026-01-01
    was_gilt: AB 853 selbst tritt in Kraft und verschiebt die SB-942-Pflichten vom 01.01.2026 auf den
      02.08.2026; zugleich werden Plattform- und Gerätepflichten neu eingefügt.
    verifiziert: true
    quelle: https://www.aoshearman.com/en/insights/ao-shearman-on-tech/zooming-in-on-ai-california-evolving-ai-legal-landscape-entering-2026
  - datum: 2026-08-02
    was_gilt: 'Stufe 1 — GenKI-Anbieter mit über 1 Mio. monatlichen Nutzern: latente Kennzeichnung Pflicht,
      manifeste Kennzeichnung als Option anzubieten, kostenloses Erkennungswerkzeug bereitzustellen.

      '
    verifiziert: true
    quelle: https://www.morganlewis.com/pubs/2026/08/new-california-ai-disclosure-rules-become-operative
  - datum: 2027-01-01
    was_gilt: 'Stufe 2 — große Online-Plattformen müssen eingebettete Provenienzdaten erkennen und dem
      Nutzer anzeigen; Hosting-Plattformen dürfen GenKI-Systeme ohne konforme Kennzeichnung nicht wissentlich
      zum Download oder zur Nutzung anbieten.

      '
    verifiziert: true
    quelle: https://www.morganlewis.com/pubs/2026/08/new-california-ai-disclosure-rules-become-operative
  - datum: 2028-01-01
    was_gilt: 'Stufe 3 — Hersteller von Aufnahmegeräten (Kameras, Smartphones, Rekorder) müssen die Aufnahme
      von Provenienzdaten in erfasste Inhalte standardmäßig ermöglichen.

      '
    verifiziert: true
    quelle: https://www.morganlewis.com/pubs/2026/08/new-california-ai-disclosure-rules-become-operative
  themenachsen:
  - content
  - gpai
  - marktzugang
  - governance
  regelungsschwerpunkte:
  - Schwelle 1 Mio. monatliche Besucher/Nutzer — deutlich niedriger als jede Frontier-Schwelle. Mittelgroße
    europäische GenKI-Dienste können erfasst sein.
  - Latente Kennzeichnung muss 'durable' und mit Erkennungswerkzeugen kompatibel sein — de facto ein Verweis
    auf C2PA/Content Credentials, ohne den Standard zu nennen.
  - Die manifeste Kennzeichnung ist nur als NUTZEROPTION geschuldet, nicht zwingend — anders als Art.
    50 KI-VO, der beim Deep Fake eine Offenlegung verlangt.
  - Die Pflicht zum kostenlosen öffentlichen Detektionswerkzeug ist eine US-Besonderheit ohne EU-Entsprechung
    und die teuerste Einzelpflicht.
  - '5.000 USD je Verstoß mit Tagesmultiplikator: bei laufendem Betrieb kumuliert die Sanktion schnell
    in Millionenhöhe.'
  - AB 853 hat die Regelungstiefe von SB 942 erheblich erweitert (Plattform- und Gerätepflichten), obwohl
    es formal nur eine Änderungsnovelle ist.
  - AB 2713 (2026er Verfahren) würde die Provenienz- und Signaturvorgaben erneut nachschärfen.
  dokumente:
  - datum: 2026-08-05
    typ: bericht
    titel: New California AI Disclosure Rules Become Operative
    url: https://www.morganlewis.com/pubs/2026/08/new-california-ai-disclosure-rules-become-operative
    sprache: en
