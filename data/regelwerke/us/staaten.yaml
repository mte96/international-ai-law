  regelungsschwerpunkte:
  - 'Civil Code § 3111: Adressat ist der ''developer'', nicht der Deployer — die Pflicht trifft also auch
    europäische Modellanbieter, die ihr Modell in Kalifornien verfügbar machen.'
  - 'Rückwirkung auf den 01.01.2022 ist die praktisch schärfste Regel: sie erfasst Modelle, deren Trainingsdatendokumentation
    nie für Veröffentlichung gedacht war.'
  - Ausdrückliche Pflicht zur Angabe, ob die Datensätze urheberrechtlich geschütztes Material enthalten
    — Zulieferung für die laufenden US-Urheberrechtsverfahren gegen Modellanbieter.
  - Ausdrückliche Pflicht zur Angabe, ob personenbezogene Daten im Sinne des CCPA enthalten sind — Verzahnung
    mit AB 1008 und den CPPA-Regeln.
  - 'Regelungslücke: kein benannter Vollzugsadressat, keine ausdrückliche Sanktionsnorm, kein privates
    Klagerecht. Durchsetzung faktisch über das allgemeine Lauterkeitsrecht (Unfair Competition Law, Bus.
    & Prof. Code § 17200).'
  - 'Unbestimmt: ''high-level summary'' und ''substantial modification'' sind nicht definiert.'
