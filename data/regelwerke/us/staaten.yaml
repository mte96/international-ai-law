    notiz: 'Detaillierter Vergleich der verbliebenen Abweichungen gegenüber SB 53 nach der Angleichung.
      WIDERSPRUCH ZU WILEY: Cooley berichtet, die Katastrophenschwelle des geänderten RAISE Act sei mit
      der kalifornischen identisch (mehr als 50 Betroffene bzw. über 1 Mrd. USD Schaden); Wiley legt 100
      Betroffene zugrunde. Cooley ist hier vorzuziehen, weil der Beitrag speziell die Chapter Amendment
      auswertet. Beide Angaben sind im Feld offene_punkte vermerkt.

      '
  offene_punkte:
  - Die DFS-Stelle war zum 27.08.2026 noch nicht öffentlich operativ; Meldeweg und Formulare sind unbekannt.
  - Widersprüchliche Bill-Nummern in den Quellen (S6953B/A6453B als Ursprung, S8828 als Chapter Amendment).
    Beide sind hier erfasst.
  - 'Widersprüchliche Quellen zur Katastrophenschwelle nach der Chapter Amendment: Cooley (01.04.2026)
    nennt mehr als 50 Betroffene — identisch mit Kalifornien —, Wiley (02.04.2026) nennt 100. Nicht geglättet;
    im Zweifel ist die strengere Schwelle maßgeblich.

    '
  - Anfechtungsrisiko unter EO 14365 wie bei Kalifornien und Illinois.
