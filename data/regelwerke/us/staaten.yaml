  - arbeit
  - datenschutz
  - sektor-finanz
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'ENTFALLEN gegenüber SB 24-205: Sorgfaltspflicht gegen algorithmische Diskriminierung, verpflichtendes
    Risikomanagementprogramm, Impact Assessments, jährliche Überprüfungen, Meldepflicht entdeckter Diskriminierung
    an den Attorney General. Das ist die eigentliche Nachricht.'
  - 'NEU: ''materially influence'' als Schwelle — nur ein nicht geringfügiger (''non-de minimis'') Einfluss
    auf das Ergebnis löst Pflichten aus. Der Attorney General darf den Begriff durch Verordnung schärfen.'
  - 'Ausdrückliche Ausnahmen: Anti-Malware, Taschenrechner, Tabellenkalkulationen mit menschlicher Analyse,
    Zusammenfassungswerkzeuge, verbrauchergerichtete Chatbots ohne Beauftragung für folgenreiche Entscheidungen.'
  - Haftungsverteilung nach Verantwortungsanteilen; gesamtschuldnerische Haftung ist ausgeschlossen. Entwickler
    haften nicht, wenn der Deployer die Technologie zweckwidrig einsetzt. Freistellungsklauseln für eigene
    Verstöße sind unwirksam.
  - 'Verbraucherrechte: Vorabinformation, Nachinformation binnen 30 Tagen, Datenzugang, Berichtigung,
    menschliche Überprüfung ''soweit wirtschaftlich zumutbar'' — der letzte Vorbehalt entwertet das Recht
    praktisch.'
  - 'Aufbewahrung: drei Jahre für Entwickler wie Deployer (SB 24-205 kannte keine einheitliche Frist).'
  - Rechtsdienstleistungen sind aus dem Katalog der folgenreichen Entscheidungen herausgenommen.
