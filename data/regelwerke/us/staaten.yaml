  regelungsschwerpunkte:
  - 'Das Gesetz war bewusst am EU-Modell orientiert: Risikoklassen, Impact Assessments, Risikomanagement
    nach Norm, Entwickler-Deployer-Kette. Genau diese EU-Nähe wurde ihm politisch zum Verhängnis.'
  - Zentrale Neuerung war die 'duty of reasonable care' gegen algorithmische Diskriminierung — eine echte
    Sorgfaltspflicht mit Beweislastumkehr über eine Rebuttable Presumption bei Rahmenwerks-Compliance.
    Sie ist im Nachfolger ersatzlos entfallen.
  - 'Klagegründe von xAI: Kompelled Speech nach dem Ersten Zusatzartikel (die Offenlegungspflichten zwängen
    zu Aussagen), Gleichheitssatz (die rasse- und geschlechtsbezogenen Pflichten), Belastung des zwischenstaatlichen
    Handels.'
  - Das DOJ ist am 24.04.2026 als Intervenient beigetreten — die erste Anwendung der AI Litigation Task
    Force aus EO 14365 auf ein konkretes Landesgesetz.
  - 'Lehre für die Prognose: Ein US-Bundesstaat kann ein EU-nahes Risikoregime derzeit politisch und prozessual
    nicht durchhalten. Die 2026 überlebenden Regime sind Transparenz- und Auskunftsregime.'
