- id: us-ca-ab2013
  jurisdiktion: us
  subjurisdiktion: us-ca
  kurztitel: AB 2013 (Kalifornien, Trainingsdaten-Transparenz)
  offizieller_titel: 'Generative Artificial Intelligence: Training Data Transparency (Assembly Bill 2013,
    Bauer-Kahan)

    '
  fundstelle: Chapter 817, Statutes of 2024; Civil Code § 3111
  verfahrensnummer: CA AB 2013 (2023-2024 Regular Session)
  status: anwendbar
  status_detail: 'Seit 01.01.2026 muss die Offenlegung tatsächlich vorliegen. Das Gesetz ist formal zum
    01.01.2025 operativ geworden, die Pflicht selbst greift aber erst "on or before January 1, 2026" —
    daher die abweichenden Datumsangaben in der Sekundärliteratur. In EO 14365 namentlich als problematisch
    benannt.

    '
  kurzbeschreibung: 'Wer ein generatives KI-System oder einen entsprechenden Dienst entwickelt, kodiert,
    produziert oder wesentlich modifiziert und in Kalifornien öffentlich zugänglich macht, muss auf seiner
    Website eine "high-level summary" der zum Training verwendeten Datensätze veröffentlichen. Erfasst
    sind rückwirkend alle Systeme, die am oder nach dem 01.01.2022 erstmals veröffentlicht oder wesentlich
    verändert wurden. Die Zusammenfassung muss Herkunft und Eigentümer der Daten, Umfang und Zahl der
    Datenpunkte, den Zusammenhang zum Systemzweck, Erhebungs- und Verarbeitungsmethode, den immaterialgüterrechtlichen
    Status (urheberrechtlich, markenrechtlich, patentrechtlich geschützt oder gemeinfrei, mit Lizenzangabe),
    das Vorliegen personenbezogener Daten im Sinne des CCPA, Zeiträume und den Einsatz synthetischer Daten
    benennen. Ausgenommen sind Systeme allein für Cybersicherheitstests, für den Luftverkehr im nationalen
    Luftraum sowie für Zwecke der nationalen Sicherheit, des Militärs und der Verteidigung des Bundes.

    '
  inkrafttreten:
