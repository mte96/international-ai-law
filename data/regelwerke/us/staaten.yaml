- id: us-staaten-extraterritorial
  jurisdiktion: us
  kurztitel: Extraterritoriale Reichweite der US-Staatengesetze auf europäische Anbieter
  offizieller_titel: 'Einordnung: Welche KI-Gesetze der US-Bundesstaaten auf in Europa ansässige Anbieter
    durchschlagen und über welchen Anknüpfungspunkt

    '
  fundstelle: Analyseeintrag; Anknüpfungspunkte aus den jeweils genannten Regelwerken
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Sämtliche untersuchten Gesetze knüpfen an den Markt, nicht an den Sitz an. Ein europäischer
    Anbieter ohne jede US-Niederlassung kann daher vollumfänglich erfasst sein, sobald er seine Dienste
    Einwohnern des jeweiligen Staates anbietet. Die praktische Durchsetzbarkeit ist eine andere Frage
    als die Anwendbarkeit: Ohne US-Vermögen und ohne US-Tochtergesellschaft ist die Vollstreckung schwierig,
    aber der Marktausschluss und die Haftung der US-Vertriebspartner bleiben.

    '
  kurzbeschreibung: 'Vier Anknüpfungstypen lassen sich unterscheiden. Erstens der Entwicklerbezug ohne
    jede Marktbedingung: Kalifornien SB 53, New York RAISE Act und Illinois SB 315 knüpfen an das TRAINING
    eines Modells oberhalb der Compute-Schwelle an — nach dem Wortlaut ist der Ort des Trainings unerheblich,
    die praktische Anknüpfung erfolgt über das Deployment im Staat. Zweitens der Marktbezug mit Nutzerschwelle:
    Kalifornien SB 942/AB 853 gilt für jeden GenKI-Anbieter mit über einer Million monatlichen Nutzern,
    dessen Dienst in Kalifornien öffentlich zugänglich ist. Drittens der reine Angebotsbezug: Kalifornien
    AB 2013, SB 243 und die New Yorker Companion-Regeln, Texas TRAIGA, Illinois BIPA und WOPR Act sowie
    Colorado SB 26-189 knüpfen daran an, dass das System Einwohnern des Staates angeboten oder ihnen gegenüber
    eingesetzt wird. Viertens der Arbeitgeber- und Deployerbezug: die kalifornischen FEHA-Regeln, Illinois
    HB 3773, NYC LL 144 und die CPPA-ADMT-Regeln treffen europäische Unternehmen als Arbeitgeber oder
    Datenverarbeiter mit Beschäftigten oder Kunden im jeweiligen Staat.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.techpolicy.press/where-state-ai-legislation-stands-half-way-into-2026/
  anwendungsdaten: []
  themenachsen:
  - marktzugang
  - governance
  - gpai
  - arbeit
  - datenschutz
  regelungsschwerpunkte:
  - 'HÖCHSTE REICHWEITE — Kalifornien SB 942/AB 853 (Provenienz): Die Schwelle von 1 Mio. monatlichen
    Nutzern ist niedrig genug, dass mittelgroße europäische GenKI-Dienste erfasst sind. Die Pflicht zum
    kostenlosen öffentlichen Detektionswerkzeug ist mit EU-Compliance nicht abgedeckt und muss eigens
    gebaut werden. Anwendbar seit 02.08.2026, Plattformstufe ab 01.01.2027.'
  - 'HOHE REICHWEITE — Kalifornien AB 2013 (Trainingsdaten): Jeder europäische Modellanbieter, dessen
    System in Kalifornien öffentlich zugänglich ist, muss eine Datensatzzusammenfassung veröffentlichen,
    rückwirkend für alles seit 01.01.2022. Die Zusammenfassung nach Art. 53 Abs. 1 lit. d KI-VO (Vorlage
    des AI Office) deckt AB 2013 NICHT ab: AB 2013 verlangt zusätzlich Angaben zu Eigentum, Lizenzstatus,
    Zeiträumen und synthetischen Daten. Doppelte Dokumentation erforderlich.'
  - 'HOHE REICHWEITE — Illinois BIPA: Gilt für jedes Unternehmen, das biometrische Identifikatoren von
    Illinois-Einwohnern verarbeitet, ohne Ausnahme für öffentlich zugängliche Daten und ohne Sitzanknüpfung.
    Wegen des privaten Klagerechts mit pauschalem Schadensersatz das größte einzelne Prozessrisiko der
    USA für europäische Anbieter von Gesichts-, Stimm- oder Emotionserkennung. Ein aus Web-Scraping trainiertes
    Gesichtserkennungsmodell ist in Illinois praktisch nicht rechtmäßig.'
  - 'HOHE REICHWEITE, aber enger Adressatenkreis — SB 53 / RAISE Act / SB 315: Erfasst sind nur Entwickler
    oberhalb von 10^26 Operationen. In Europa betrifft das derzeit eine sehr kleine Zahl von Anbietern.
    Wer aber betroffen ist, muss ab 01.01.2027 drei Regime parallel bedienen — praktisch nach dem jeweils
    strengsten Maßstab: 72-Stunden-Meldung (NY/IL), Katastrophenschwelle 50 Personen (CA/IL), Drittaudit
    (IL ab 01.01.2028), Sanktionsstufe 3 Mio. USD (NY/IL). Das Frontier AI Framework nach SB 53 kann als
    Grundlage für alle drei dienen, ebenso wie es weitgehend mit dem EU-GPAI-Verhaltenskodex und Art.
    55 KI-VO harmoniert.'
  - 'MITTLERE REICHWEITE — Kalifornien SB 243 und New York GBL Art. 47 (Companion-Chatbots): Erfassen
    jeden Anbieter, dessen Companion-Chatbot Einwohnern zugänglich ist. Kalifornien ist wegen des privaten
    Klagerechts (mindestens 1.000 USD je Verstoß) das größere Risiko, New York wegen der Tagessanktion
    von 15.000 USD das teurere bei Dauerverstößen. Art. 50 KI-VO deckt nur die Offenlegung ab, nicht die
    Krisenprotokolle und nicht die Frequenzvorgaben.'
  - 'MITTLERE REICHWEITE — Colorado SB 26-189 ab 01.01.2027: Keine Größen- oder Beschäftigtenschwelle.
    Ein europäischer Anbieter, dessen ADMT eine folgenreiche Entscheidung in Colorado wesentlich beeinflusst,
    trifft die Entwicklerdokumentationspflicht gegenüber dem Deployer und die dreijährige Aufbewahrung.
    Die Dokumentation überschneidet sich stark mit Anhang IV KI-VO und den Anbieterinformationen nach
    Art. 13 KI-VO — hier ist EU-Compliance weitgehend nachnutzbar.'
  - 'MITTLERE REICHWEITE — CPPA-ADMT-Regeln ab 01.04.2027: Treffen europäische Unternehmen, die als ''business''
    im Sinne des CCPA gelten (Umsatzschwelle 25 Mio. USD oder Verarbeitung von 100.000 Verbrauchern/Haushalten).
    Die Risikobewertungspflicht beim TRAINING eines ADMT mit personenbezogenen Daten trifft auch reine
    Modellentwickler. Überschneidung mit Art. 35 DSGVO groß, aber Meldeformat und Fristen abweichend.'
  - 'NIEDRIGE REICHWEITE — Texas TRAIGA: Trotz weitem Anwendungsbereich das mildeste Regime, weil alle
    Verbote Absicht voraussetzen. Ein sorgfältig entwickeltes europäisches System erfüllt TRAIGA praktisch
    automatisch. Relevanz vor allem für Anbieter an texanische Behörden (dort Offenlegungspflicht, Social-Scoring-Verbot,
    Biometrieverbot).'
  - 'ARBEITGEBERSEITE — europäische Unternehmen mit US-Beschäftigten: Die kalifornischen FEHA-Regeln (seit
    01.10.2025, vierjährige Aufbewahrung, privates Klagerecht), Illinois HB 3773 (seit 01.01.2026, Wirkungsmaßstab,
    privates Klagerecht) und NYC LL 144 (Bias Audit mit Veröffentlichung) greifen unabhängig vom Sitz
    des Arbeitgebers, sobald Bewerber oder Beschäftigte im jeweiligen Gebiet betroffen sind. Das trifft
    praktisch jedes europäische Unternehmen mit US-Vertriebsstandort.'
  - 'PRAKTISCHE FOLGERUNG: Die EU-Compliance ist für die US-Staatenlage eine notwendige, aber keine hinreichende
    Grundlage. Nachnutzbar sind Modelldokumentation (Anhang IV/Art. 53), Risikomanagement (Art. 9), das
    GPAI-Sicherheitsframework und die DSFA. Eigens zu bauen sind: das kalifornische Detektionswerkzeug,
    die AB-2013-Datensatzzusammenfassung im kalifornischen Format, die Krisenprotokolle der Chatbot-Gesetze,
    das BIPA-Einwilligungsmanagement, die vierjährige ADS-Aufbewahrung nach FEHA und — ab 2028 — das Illinois-Drittaudit.'
