    url: https://www.skadden.com/insights/publications/2025/10/new-california-companion-chatbot-law
    sprache: en
    urheber: Skadden, Arps, Slate, Meagher & Flom LLP
    verifiziert: true
    notiz: Definitionen, Ausnahmekatalog und Sanktionsstruktur einschließlich des privaten Klagerechts.
  - datum: 2025-11-20
    typ: bericht
    titel: 'New York and California Enact Landmark AI Companion Laws: What Operators Need to Know'
    url: https://www.mofo.com/resources/insights/251120-new-york-and-california-enact-landmark-ai
    sprache: en
    urheber: Morrison Förster
    verifiziert: true
    notiz: 'Direktvergleich SB 243 und New York GBL Art. 47. Bestätigt ausdrücklich, dass BEIDE Gesetze
      für Betreiber gelten, die Nutzer im jeweiligen Staat bedienen, UNABHÄNGIG VOM SITZ DES BETREIBERS
      — der klarste Beleg für die extraterritoriale Reichweite. Bestätigt zudem die Frequenzasymmetrie
      (NY: alle drei Stunden für alle Nutzer; CA: nur bei erkannten Minderjährigen) und die Sanktionsasymmetrie
      (NY: bis 15.000 USD je Tag, nur AG; CA: 1.000 USD je Verstoß oder tatsächlicher Schaden, privates
      Klagerecht).

      '
  offene_punkte:
  - 'Widersprüchliche Quellenangabe: eine Kanzleianalyse nennt den 13.10.2025 (Unterzeichnungstag) als
    Wirksamkeitsdatum. Maßgeblich und mehrfach bestätigt ist der 01.01.2026.'
  - '''Erkannter Minderjähriger'' ist nicht definiert; ohne Altersverifikationspflicht bleibt der Schutz
    von der Selbstauskunft abhängig.'
  - SB 1119 / AB 2023 (Chatbot-Sicherheit), SB 300 (sexuell explizite Inhalte), SB 867 (Verbot von Chatbots
    in Kinderspielzeug) stehen Ende August 2026 vor der Schlussabstimmung; die Entscheidung des Gouverneurs
    fällt binnen 30 Tagen nach Zuleitung.
