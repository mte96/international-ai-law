  - Bis 31.08.2026 ist offen, welche Vorlagen die Schlussabstimmung überstehen; bis Ende September/Oktober
    2026, welche der Gouverneur unterzeichnet. Diese Datei ist danach neu zu prüfen.
  - Newsom hat 2025 sechs KI-Vorlagen vetiert (u.a. SB 7). Eine ähnliche Vetoquote ist einzuplanen.
  - Unter dem Druck von EO 14365 ist unklar, ob Kalifornien 2026 weiter expansiv reguliert oder — wie
    Colorado — zurückrudert. Bis 27.08.2026 gibt es kein Anzeichen für einen kalifornischen Rückzug.
