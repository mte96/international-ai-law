- id: us-co-sb26-189
  jurisdiktion: us
  subjurisdiktion: us-co
  kurztitel: SB 26-189 (Colorado, Automated Decision-Making Technology)
  offizieller_titel: 'Concerning Automated Decision-Making Technology (Senate Bill 26-189) — Aufhebung
    und Neuerlass von Part 17 of Article 1 of Title 6, C.R.S.

    '
  fundstelle: Chapter 131, Session Laws of Colorado 2026; Colo. Rev. Stat. Title 6, Article 1, Part 17
  verfahrensnummer: CO SB 26-189 (2026 Regular Session)
  status: verabschiedet
  status_detail: 'Am 14.05.2026 von Gouverneur Polis unterzeichnet und zu diesem Datum in Kraft getreten;
    die Pflichten gelten aber erst für folgenreiche Entscheidungen ab dem 01.01.2027. Bis zu demselben
    Datum muss der Attorney General die Offenlegungsanforderungen durch Rechtsverordnung konkretisieren.
    Anwendbarkeit steht unter dem Vorbehalt der fortdauernden Klage von xAI.

    '
  kurzbeschreibung: 'SB 26-189 ersetzt den EU-nahen Risikoansatz durch ein Transparenz- und Auskunftsregime.
    Erfasst ist "covered automated decision-making technology": Technologie, die personenbezogene Daten
    verarbeitet und Ergebnisse erzeugt, die eine folgenreiche Entscheidung wesentlich beeinflussen ("materially
    influence" = nicht nur geringfügiger Faktor durch Einschränken, Rangordnen, Bewerten oder Klassifizieren).
    Erfasste Bereiche: Bildung, Beschäftigung, Wohnimmobilien, Finanz- und Kreditdienstleistungen, Versicherungen,
    Gesundheitsversorgung und wesentliche staatliche Leistungen — Rechtsdienstleistungen sind anders als
    früher ausgenommen. Entwickler müssen Deployern technische Dokumentation zu Verwendungszweck, bekannten
    Grenzen, Trainingsdatenkategorien und Anleitungen zur menschlichen Überprüfung bereitstellen und Unterlagen
    drei Jahre aufbewahren; Geschäftsgeheimnisse dürfen zurückgehalten werden. Deployer müssen vor dem
    Einsatz klar und deutlich informieren, nach einer nachteiligen Entscheidung binnen 30 Tagen in einfacher
    Sprache erläutern, welche Rolle die Technologie spielte, und auf Verlangen Datenzugang, Datenberichtigung
    und — soweit wirtschaftlich zumutbar — eine sinnvolle menschliche Überprüfung ermöglichen. Kein privates
    Klagerecht; ausschließliche Durchsetzung durch den Attorney General nach dem Colorado Consumer Protection
    Act mit 60-tägiger Heilungsfrist, die zum 01.01.2030 ausläuft.

    '
