  regelungsschwerpunkte:
  - 'Schwelle: 10^26 Integer-/Gleitkommaoperationen UND >100 Mio. USD Trainingskosten (kumulativ) — später
    von SB 53 auf die reine Compute-Schwelle reduziert.'
  - Kill-Switch-Pflicht ('full shutdown') — in SB 53 ersatzlos gestrichen; das ist der wichtigste inhaltliche
    Unterschied.
  - Verpflichtendes jährliches Drittaudit — in SB 53 gestrichen, 2026 aber von Illinois SB 315 wieder
    aufgegriffen.
  - Haftungsstandard 'reasonable assurance' gegen critical harms — durch reine Offenlegungspflichten ersetzt.
  - 'Whistleblower-Schutz und CalCompute-Cluster: die beiden einzigen Elemente, die weitgehend unverändert
    in SB 53 übernommen wurden.'
