  anwendungsdaten:
  - datum: 2026-01-01
    was_gilt: 'Stichtag der Offenlegungspflicht: bis zu diesem Tag — und danach vor jeder Neuveröffentlichung
      oder wesentlichen Modifikation — muss die Datensatzzusammenfassung öffentlich zugänglich sein. Rückwirkende
      Erfassung aller Systeme ab Veröffentlichung/Update 01.01.2022.

      '
    verifiziert: true
    quelle: https://www.crowell.com/en/insights/client-alerts/californias-ab-2013-requires-generative-ai-data-disclosure-by-january-1-2026
