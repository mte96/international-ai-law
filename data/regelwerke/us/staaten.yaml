    '
  fundstelle: 'NYC Admin. Code §§ 20-870 bis 20-874; Ausführungsregeln: Rules of the City of New York,
    Title 6, Chapter 5, Subchapter T'
  verfahrensnummer: NYC Int. 1894-2020 / Local Law 144 of 2021
  status: anwendbar
  status_detail: 'Seit 05.07.2023 durchsetzbar. Der Prüfbericht des New York State Comptroller vom 02.12.2025
    stellt fest, dass das Department of Consumer and Worker Protection praktisch nicht durchsetzt: im
    Prüfzeitraum Juli 2023 bis Juni 2025 gingen ZWEI Beschwerden ein, es gab keine dokumentierten Vollzugsmaßnahmen.
    Das Gesetz ist damit das Musterbeispiel für ein weitreichendes, aber nicht vollzogenes Regime.

    '
  kurzbeschreibung: 'Arbeitgeber und Personalvermittler dürfen in New York City ein automatisiertes Beschäftigungsentscheidungswerkzeug
    (AEDT) nur einsetzen, wenn es innerhalb des vorangegangenen Jahres einem unabhängigen Bias Audit unterzogen
    wurde, wenn eine Zusammenfassung der Prüfergebnisse öffentlich auf der Website veröffentlicht ist
    und wenn Bewerber und Beschäftigte mindestens zehn Werktage vor dem Einsatz informiert wurden — einschließlich
    der Möglichkeit, ein alternatives Verfahren oder angemessene Vorkehrungen zu verlangen. Der Bias Audit
    muss Auswahlquoten und Impact Ratios nach Geschlecht sowie nach den kombinierten Kategorien Rasse/Ethnie
    ausweisen. Durchsetzung durch das Department of Consumer and Worker Protection; kein privates Klagerecht.

    '
  inkrafttreten:
    datum: 2023-01-01
    verifiziert: true
    quelle: https://www.lawandtheworkplace.com/wp-content/uploads/sites/29/2023/03/Local-Law-144.pdf
    fundstelle_norm: '§ 2 des Local Law 144 of 2021: ''This local law takes effect on January 1, 2023.''
      Beschlossen vom City Council am 10.11.2021, ohne Unterschrift des Buergermeisters am 13.12.2021
      Gesetz geworden'
  anwendungsdaten:
  - datum: 2023-07-05
    was_gilt: 'Beginn der Durchsetzung durch das Department of Consumer and Worker Protection nach Erlass
      der Ausfuehrungsregeln (6 RCNY ch. 5 subch. T): ''DCWP will begin enforcement of this law and rule
      on July 5, 2023'''
    verifiziert: true
    quelle: https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page
  themenachsen:
  - arbeit
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - Weltweit erste verbindliche Bias-Audit-Pflicht mit Veröffentlichungszwang. Sie ist das Vorbild für
    die Audit-Diskussion in der EU (Art. 27 KI-VO Grundrechte-Folgenabschätzung) und für Colorado SB 24-205.
  - Prüfumfang beschränkt auf Geschlecht und Rasse/Ethnie — Alter, Behinderung und andere geschützte Merkmale
    sind NICHT erfasst. Die zentrale inhaltliche Schwäche.
  - 10 Werktage Vorlauf für die Bewerberinformation samt Recht auf alternatives Verfahren — die einzige
    US-Norm mit einer solchen Wartefrist.
  - 'Der Comptroller-Bericht: DCWP prüfte in zwei Jahren einmal 32 Unternehmen und fand einen Verstoß;
    die Prüfer fanden bei denselben Unternehmen mindestens 17 mögliche Verstöße. Die Beschwerdewege funktionieren
    nicht.'
  - Kein privates Klagerecht — anders als bei den kalifornischen FEHA-Regeln und Illinois HB 3773. Ohne
    funktionierende Behördendurchsetzung bleibt das Gesetz weitgehend folgenlos.
  - In EO 14365 namentlich als problematisches Regelwerk benannt.
