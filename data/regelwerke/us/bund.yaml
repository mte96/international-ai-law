- id: us-fre
  jurisdiktion: us
  kurztitel: Federal Rules of Evidence
  offizieller_titel: 'Federal Rules of Evidence, erlassen durch Pub. L. 93-595 und fortgeschrieben nach
    dem Rules Enabling Act (28 U.S.C. §§ 2071-2077)

    '
  fundstelle: Pub. L. 93-595, 88 Stat. 1926 (02.01.1975); 28 U.S.C. App.
  verfahrensnummer: Rules Enabling Act, 28 U.S.C. §§ 2071-2077
  status: anwendbar
  status_detail: 'Seit 01.07.1975 in Kraft. Rule 702 wurde zum 01.12.2023 neu gefasst und verlangt nun
    ausdrücklich, dass das Gericht die Zuverlässigkeit „more likely than not“ feststellt. Der vorgeschlagene
    Rule 707 (maschinell erzeugter Beweis) durchlief bis 16.02.2026 die öffentliche Stellungnahme, ist
    aber am 05.09.2026 auf der amtlichen Liste der anhängigen Änderungen NICHT ausgewiesen; anhängig sind
    stattdessen Rule 801 (01.12.2026) sowie die Rules 104 und 902 (01.12.2028), die den Deepfake-Einwand
    über Vorfragen und Authentifizierung adressieren.

    '
  kurzbeschreibung: 'Das Beweisrecht der US-Bundesgerichte. Rule 702 regelt den Sachverständigenbeweis:
    Zulässig ist er nur, wenn er auf ausreichenden Tatsachen beruht, auf zuverlässigen Grundsätzen und
    Methoden, und wenn diese auf den Fall zuverlässig angewandt wurden (Daubert-Maßstab). Rule 901 verlangt
    für jedes Beweismittel den Nachweis, dass es das ist, wofür es ausgegeben wird; Rule 902 zählt selbstauthentifizierende
    Beweismittel auf. Der vorgeschlagene Rule 707 will maschinell erzeugte Ergebnisse, die ohne menschlichen
    Sachverständigen eingeführt werden, denselben Zuverlässigkeitsanforderungen wie Rule 702 unterwerfen.

    '
  inkrafttreten:
    datum: 1975-07-01
    verifiziert: true
    quelle: https://www.uscourts.gov/rules-policies/current-rules-practice-procedure/federal-rules-evidence
  anwendungsdaten:
  - datum: 2023-12-01
    was_gilt: 'Neufassung des Rule 702: Das Gericht muss die Zulässigkeitsvoraussetzungen mit überwiegender
      Wahrscheinlichkeit feststellen.

      '
    verifiziert: true
    quelle: https://www.uscourts.gov/rules-policies/current-rules-practice-procedure/federal-rules-evidence
  - datum: 2025-08-15
    was_gilt: 'Vorschlag eines Rule 707 (machine-generated evidence) zur öffentlichen Stellungnahme gestellt;
      Frist bis 16.02.2026.

      '
    verifiziert: true
    quelle: https://www.uscourts.gov/rules-policies/proposed-amendments-published-public-comment
  - datum: 2026-12-01
    was_gilt: Anhängige Änderung des Rule 801 tritt in Kraft.
    verifiziert: true
    quelle: https://www.uscourts.gov/rules-policies/pending-rules-and-forms-amendments
  - datum: 2028-12-01
    was_gilt: 'Voraussichtliches Inkrafttreten der Änderungen zu Rule 104 (Vorfragen) und Rule 902 (Selbstauthentifizierung)
      — die Vorschriften, an denen der Deepfake-Einwand ansetzt.

      '
    verifiziert: true
    quelle: https://www.uscourts.gov/rules-policies/pending-rules-and-forms-amendments
  themenachsen:
  - berufsrecht
  - content
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - 'Rule 702 wirkt gegenüber Sachverständigen schärfer als Rule 11 gegenüber Anwälten: Das Gericht sanktioniert
    nicht, es verwirft das Beweismittel vollständig (Kohls v. Ellison — die Erklärung eines Fehlinformationsforschers
    mit drei GPT-4o-erfundenen Nachweisen wurde insgesamt ausgeschlossen).'
  - 'WIDERSPRUCH, DER SO STEHEN BLEIBT: Rule 707 ist am 05.09.2026 auf uscourts.gov nicht als anhängige
    Änderung ausgewiesen, obwohl er das Stellungnahmeverfahren durchlaufen hat. Die wahrscheinlichste
    Deutung ist die Überführung in die Änderungen zu Rule 104 und 902.'
  - 'Der rechtspolitisch eigentliche Streit ist nicht Rule 707, sondern der „liar''s dividend“: Sobald
    jedes Video gefälscht sein kann, wird die Fälschungsbehauptung zur Standardverteidigung, und die Verteilung
    der Beweislast entscheidet den Prozess. Dazu schweigen alle Vorschläge.'
  - Rule 707 wäre die erste ausdrücklich auf maschinelle Erzeugung zugeschnittene Beweisregel des US-Bundesrechts
    — bis dahin behilft sich die Praxis mit Rule 702 analog und Rule 901(b)(9) (Verfahren, das ein zutreffendes
    Ergebnis erzeugt).
  eu_anbieter_relevanz: 'Mittelbar relevant: Wer als europäischer Anbieter in einem US-Verfahren die Funktionsweise
    seines Modells belegen will, muss den Daubert-Maßstab erfüllen — Reproduzierbarkeit, Fehlerraten,
    Peer Review. Das deckt sich inhaltlich mit den Nachweisanforderungen des Art. 15 KI-VO (Genauigkeit,
    Robustheit) und den Aufzeichnungspflichten des Art. 12 KI-VO, weshalb eine gemeinsam geführte Evaluationsdokumentation
    beiden Zwecken dient.

    '
  dokumente:
  - datum: 2026-09-05
    typ: endfassung
    titel: Federal Rules of Evidence (amtliche Fassung)
    url: https://www.uscourts.gov/rules-policies/current-rules-practice-procedure/federal-rules-evidence
    sprache: en
    urheber: Administrative Office of the United States Courts
    verifiziert: true
    notiz: 'Amtlicher Text der Rules 702, 901 und 902.

      '
  - datum: 2026-08-14
    typ: uebersicht
    titel: Pending Rules and Forms Amendments
    url: https://www.uscourts.gov/rules-policies/pending-rules-and-forms-amendments
    sprache: en
    urheber: Administrative Office of the United States Courts
    verifiziert: true
    notiz: 'Am 05.09.2026 geprüft: Rule 707 NICHT als anhängig ausgewiesen; anhängig sind Rule 801 (01.12.2026)
      sowie Rules 104 und 902 (01.12.2028).

      '
