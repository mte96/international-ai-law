  regelungsschwerpunkte:
  - Vier Kernfunktionen Govern, Map, Measure, Manage; sieben Merkmale vertrauenswürdiger KI (u. a. Validität,
    Sicherheit, Erklärbarkeit, Datenschutz, Fairness).
  - 'Profile als Anpassungsmechanismus: Generative AI Profile (NIST AI 600-1) und angekündigtes Critical
    Infrastructure Profile.'
  - Der Streichungsauftrag des Action Plan trifft die Fairness- und Fehlinformationsdimension — genau
    jene Merkmale, über die das Rahmenwerk bislang an die europäische Grundrechtsperspektive anschlussfähig
    war.
  - 'Interessenlage bemerkenswert: Die Industrie verteidigt das Rahmenwerk gegen die eigene Deregulierungsagenda,
    weil sie eine „common language" und die Vermeidung eigener Landesrahmenwerke will.'
  - OSTP-Direktor Kratsios betont die Rolle von NIST als standardsetzende, nicht regulierende Stelle —
    die Überarbeitung wird das Rahmenwerk nicht verbindlich machen.
  eu_anbieter_relevanz: 'Praktisch der wichtigste Brückenkopf zwischen KI-VO und US-Markt. Wer ein Risikomanagementsystem
    nach Art. 9 KI-VO und ISO/IEC 42001 betreibt, kann es über die veröffentlichten Crosswalks weitgehend
    auf das AI RMF abbilden. Konkrete Handlungsempfehlung wegen der anstehenden Überarbeitung: Vertragliche
    Verweise auf „NIST AI RMF" versionieren („AI RMF 1.0, Fassung vom 26.01.2023"), da eine Neufassung
    den Prüfmaßstab inhaltlich verändern kann — insbesondere dort, wo der Colorado AI Act das Rahmenwerk
    als Safe Harbor in Bezug nimmt.

    '
