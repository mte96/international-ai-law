    typ: stellungnahme
    titel: 'The TRAIN Act: Forcing Transparency in AI Training Data'
    url: https://btlj.org/2026/05/the-train-act-forcing-transparency-in-ai-training-data/
    sprache: en
    urheber: Berkeley Technology Law Journal
    verifiziert: false
    notiz: Rechtswissenschaftliche Einordnung; in dieser Sitzung nicht abgerufen.
  offene_punkte:
  - Ausschussstand beider Fassungen unbekannt.
  - Ob die Vermutungsregel mit dem Schutz von Geschäftsgeheimnissen nach dem Defend Trade Secrets Act
    vereinbar ausgestaltet ist.
