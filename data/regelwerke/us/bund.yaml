- id: us-copyright-ai-bericht
  jurisdiktion: us
  kurztitel: Copyright Office — Bericht Copyright and AI
  offizieller_titel: 'U.S. Copyright Office, Copyright and Artificial Intelligence — Part 1: Digital Replicas;
    Part 2: Copyrightability; Part 3: Generative AI Training

    '
  fundstelle: Berichte des Register of Copyrights an den Kongress
  verfahrensnummer: Notice of Inquiry, 88 FR 59942 (30. August 2023)
  status: softlaw
  status_detail: 'Teil 1 (Digital Replicas, Juli 2024) und Teil 2 (Copyrightability, Januar 2025) sind
    veröffentlicht. Teil 3 (Generative AI Training) erschien am 9. Mai 2025 ausdrücklich als „Pre-Publication
    Version"; eine Endfassung war bei Rechercheschluss nicht auffindbar. Das Amt hatte angekündigt, die
    Endfassung werde „no substantive difference from the current draft" aufweisen. Einen Tag nach Veröffentlichung
    wurde Register of Copyrights Shira Perlmutter entlassen — der zeitliche Zusammenhang ist unbestritten,
    der ursächliche umstritten.

    '
  kurzbeschreibung: 'Die dreiteilige Untersuchung ist die maßgebliche amtliche US-Positionierung zum Urheberrecht
    und KI. Teil 1 empfiehlt ein Bundesgesetz gegen unautorisierte digitale Nachbildungen — die Grundlage
    des NO FAKES Act. Teil 2 hält fest, dass rein KI-generierte Ergebnisse nicht schutzfähig sind, menschliche
    Beiträge — Auswahl, Anordnung, Bearbeitung — aber sehr wohl, und dass Prompts allein regelmäßig nicht
    ausreichen. Teil 3 lehnt eine pauschale Fair-Use-Privilegierung des Trainings ab, hält Training je
    nach Funktionsweise und Marktwirkung für unterschiedlich transformativ und führt mit der „market dilution"
    eine neue Schadenskategorie im vierten Fair-Use-Faktor ein. Empfohlen werden freiwillige und kollektive
    Lizenzmodelle; Zwangslizenzen werden als verfrüht abgelehnt.

    '
  inkrafttreten:
    datum: 2024-07-31
    verifiziert: true
    quelle: https://newsroom.loc.gov/news/copyright-office-releases-part-1-of-artificial-intelligence-report--recommends-federal-digital-repli/s/33eeaa40-8847-4668-9c58-8a45c3ac9e01
    fundstelle_norm: Kein Rechtsakt. Massgeblich ist die Veroeffentlichung von Part 1 (Digital Replicas)
      am 31.07.2024, bekanntgegeben durch die Library of Congress ('Copyright Office Releases Part 1 of
      Artificial Intelligence Report, Recommends Federal Digital Replica Law')
  anwendungsdaten:
  - datum: 2025-01-29
    was_gilt: Part 2 (Copyrightability) — Veroeffentlichung durch das Copyright Office
    verifiziert: true
    quelle: https://www.loc.gov/item/prn-25-010/copyright-office-releases-part-2-of-artificial-intelligence-report/2025-01-29/
  - datum: 2025-05-09
    was_gilt: Part 3 (Generative AI Training) — ausdruecklich als 'Pre-Publication Version'; eine Endfassung
      war am 06.09.2026 nicht auffindbar
    verifiziert: false
    quelle: https://www.copyright.gov/ai/
  themenachsen:
  - urheberrecht
  - gpai
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 'Teil 2: Rein KI-generierte Ergebnisse sind nicht schutzfähig; menschliche Auswahl, Anordnung und
    Bearbeitung können es sein. Prompts allein genügen regelmäßig nicht — dies ist zugleich die Registrierungspraxis
    des Amtes.'
  - 'Teil 3, Fair Use: „Making commercial use of vast troves of copyrighted works to produce expressive
    content that competes with them in existing markets … goes beyond established fair use boundaries."
    Keine kategorische Privilegierung, sondern Einzelfallprüfung nach Funktionsweise und Marktwirkung.'
  - 'Teil 3, Market Dilution: „The speed and scale at which AI systems generate content pose a serious
    risk of diluting markets for works of the same kind as in their training data." Das Amt räumt selbst
    ein, dass dies richterrechtliches Neuland ist und Gerichte empirische Belege verlangen dürften.'
  - 'Teil 3, Lizenzierung: Vorrang freiwilliger und kollektiver Lizenzierung, ausdrücklich einschließlich
    erweiterter kollektiver Lizenzen nach skandinavischem Vorbild; Zwangslizenzen werden als verfrüht
    abgelehnt.'
  - 'Institutionell: Der Bericht ist eine Empfehlung ohne Bindungswirkung. Bundesgerichte sind daran nicht
    gebunden, ziehen ihn aber als sachverständige Stellungnahme heran. Die personellen Turbulenzen mindern
    sein politisches Gewicht, nicht seine fachliche Verwertbarkeit.'
  eu_anbieter_relevanz: 'Zentral für jeden europäischen Modellanbieter, der US-Werke im Training verwendet
    oder Ergebnisse in den USA verwertet. Drei Punkte: Erstens gibt es in den USA keine dem § 44b UrhG
    oder Art. 4 DSM-Richtlinie entsprechende Text- und Data-Mining-Schranke — die europäische Opt-out-Logik
    hat im US-Recht kein Gegenstück, und die Vorbehaltserklärung nach Art. 53 Abs. 1 lit. c KI-VO entfaltet
    dort keine Wirkung. Zweitens erhöht die Market-Dilution-Theorie das Prozessrisiko gerade für Modelle,
    die Werke im Stil bestimmter Urheber erzeugen. Drittens ist die Schutzfähigkeit KI-erzeugter Ergebnisse
    in den USA enger als in Europa; wer Kunden Rechte an Modellausgaben zusichert, sollte diese Zusage
    auf den menschlichen Bearbeitungsanteil beschränken.

    '
  dokumente:
  - datum: 2025-05-09
    typ: bericht
    titel: 'Copyright and Artificial Intelligence, Part 3: Generative AI Training (Pre-Publication Version)'
    url: https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-3-Generative-AI-Training-Report-Pre-Publication-Version.pdf
    sprache: en
    urheber: U.S. Copyright Office
    verifiziert: true
    notiz: 'Amtlicher Volltext. Der Dateiname selbst belegt den fortdauernden Vorabstatus — es gibt keine
      Endfassung unter einem entsprechenden Pfad.

      '
  - datum: 2026-08-01
    typ: uebersicht
    titel: Artificial Intelligence Study — U.S. Copyright Office
    url: https://www.copyright.gov/policy/artificial-intelligence/
    sprache: en
    urheber: U.S. Copyright Office
    verifiziert: true
    notiz: Amtliche Verfahrensseite mit der Notice of Inquiry und den Kommentierungsfristen.
  - datum: 2025-05-12
    typ: stellungnahme
    titel: 'U.S. Copyright Office Releases Part 3 of AI Report: What Authors Should Know'
    url: https://authorsguild.org/news/us-copyright-office-ai-report-part-3-what-authors-should-know/
    sprache: en
    urheber: The Authors Guild
    verifiziert: true
    notiz: 'Belegt Datum, Vorabstatus, die Zusage „no substantive difference" und den zeitlichen Zusammenhang
      mit der Entlassung Perlmutters.

      '
  - datum: 2025-12-01
    typ: bericht
    titel: What is Happening with the Register of Copyrights?
    url: https://authorsalliance.substack.com/p/what-is-happening-with-the-register
    sprache: en
    urheber: Authors Alliance
    verifiziert: true
    notiz: 'Verfahrensstand: Perlmutter v. Blanche, D.D.C. 25-cv-1659 und D.C. Cir. 25-5285; einstweilige
      Anordnung im September 2025, Zurückstellung durch den Supreme Court im Oktober 2025, Amtsausübung
      dauert an.

      '
  - datum: 2025-07-08
    typ: stellungnahme
    titel: Unpacking the US Copyright Office's Third Report on Generative AI
    url: https://itsartlaw.org/art-law/unpacking-the-us-copyright-offices-third-report-on-generative-ai/
    sprache: en
    urheber: Center for Art Law
    verifiziert: true
    notiz: 'Detailanalyse der Fair-Use-Prüfung, der Market-Dilution-Theorie und der Empfehlung erweiterter
      kollektiver Lizenzen.

      '
  offene_punkte:
  - Teil 3 ist seit über 15 Monaten Vorabfassung — ob eine Endfassung erscheint, ist offen und politisch
    aufgeladen.
  - Publikationsdaten von Teil 1 und Teil 2 nicht primärquellenbelegt.
  - Ausgang von Perlmutter v. Blanche hängt an Trump v. Cook und Trump v. Slaughter.
  - Verhältnis zur Rechtsprechung (u. a. Bartz v. Anthropic, Kadrey v. Meta) in dieser Datei nicht erfasst.
  - 'Veröffentlichungsdatum von Part 1 des Berichts "Copyright and Artificial Intelligence" (31.07.2024)
    nicht amtlich bestätigt: Die Übersichtsseiten copyright.gov/ai und copyright.gov/policy/artificial-intelligence
    liefern über WebFetch nur den Text zur Initiative von 2023. Zu prüfen an den PDF-Deckblättern von
    Part 1, Part 2 und Part 3; die späteren Teile gehören als Stufen in anwendungsdaten.'
  monitoring_quellen:
  - https://www.copyright.gov/ai/
  - https://www.copyright.gov/policy/artificial-intelligence/
  bezug_regelwerke:
  - us-no-fakes-act
  - us-train-act
  letzte_pruefung: 2026-09-05
  pruefvermerk:
  - 'Bestaetigt fuer Part 1 (31.07.2024) und Part 2 (29.01.2025) an den Mitteilungen der Library of Congress.
    Das Datum von Part 3 (09.05.2025) liess sich an copyright.gov nicht bestaetigen — die Uebersichtsseite
    gibt die Teile nicht mit Daten aus; es bleibt in anwendungsdaten mit verifiziert: false stehen. Der
    Status der Pre-Publication Version ist unveraendert.'
- id: us-uspto-erfinderschaft
  jurisdiktion: us
  kurztitel: USPTO — Erfinderschaft bei KI-Unterstützung
  offizieller_titel: 'Revised Inventorship Guidance for AI-Assisted Inventions

    '
  fundstelle: 90 FR 54636 (28. November 2025)
  verfahrensnummer: USPTO-Bekanntmachung 2025-21457
  status: softlaw
  status_detail: 'Geltende Prüfungsrichtlinie; ersetzt die Inventorship Guidance vom 13. Februar 2024.
    Ergänzt durch eine überarbeitete Leitlinie zur Patentfähigkeit KI-bezogener Erfindungen nach 35 U.S.C.
    § 101 (Ende 2025). Richtlinien binden die Prüfer, nicht die Gerichte.

    '
  kurzbeschreibung: 'Klärt, wer bei KI-unterstützten Erfindungen als Erfinder zu benennen ist. Ausgangspunkt
    bleibt Thaler v. Vidal: Nur natürliche Personen können Erfinder sein; KI-Systeme können weder Erfinder
    noch Miterfinder sein. Neu ist die Abkehr von der Vidal-Methodik: Die Pannu-Faktoren sind ausschließlich
    für die Frage anzuwenden, ob mehrere natürliche Personen Miterfinder sind — nicht dafür, ob ein einzelner
    Mensch neben einem KI-System einen hinreichenden Beitrag geleistet hat. KI-Werkzeuge werden ausdrücklich
    mit Laborgeräten, Software und Forschungsdatenbanken gleichgestellt.

    '
  inkrafttreten:
    datum: 2025-11-28
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/11/28/2025-21457/revised-inventorship-guidance-for-ai-assisted-inventions
  anwendungsdaten:
  - datum: 2024-02-13
    was_gilt: Frühere Inventorship Guidance (Vidal); nunmehr ersetzt.
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/11/28/2025-21457/revised-inventorship-guidance-for-ai-assisted-inventions
  - datum: 2025-11-28
    was_gilt: Veröffentlichung der überarbeiteten Leitlinie, 90 FR 54636.
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/11/28/2025-21457/revised-inventorship-guidance-for-ai-assisted-inventions
  themenachsen:
  - urheberrecht
  - governance
  - wettbewerb
  regelungsschwerpunkte:
  - 'Wörtlich: Die Pannu-Faktoren „only apply when determining whether multiple natural persons qualify
    as joint inventors" — der methodische Bruch mit der Leitlinie von 2024, die den Menschen gegenüber
    der KI an den Pannu-Faktoren messen wollte.'
  - 'KI als Instrument: „analogous to laboratory equipment, computer software, research databases, or
    any other tool that assists in the inventive process" — die Entlastung für Anmelder, weil der KI-Einsatz
    die Erfinderschaft nicht mehr in Frage stellt.'
  - 'Thaler v. Vidal bleibt bindend: Nur natürliche Personen können Erfinder sein. Eine Anmeldung, die
    ein KI-System als Erfinder benennt, ist unheilbar fehlerhaft.'
  - 'Nicht geregelt bleibt die Offenlegungspflicht: Ob und wie der KI-Einsatz gegenüber dem Amt anzuzeigen
    ist, ergibt sich weiterhin nur aus der allgemeinen Duty of Disclosure nach 37 C.F.R. § 1.56.'
  - 'Parallel überarbeitet: Leitlinie zur Patentfähigkeit nach § 101 mit Auswirkungen auf softwarebezogene
    KI-Ansprüche.'
  eu_anbieter_relevanz: 'Für europäische Anmelder erfreulich, weil die US-Praxis sich der europäischen
    annähert: Auch das EPA verlangt eine natürliche Person als Erfinder (J 8/20, J 9/20 — DABUS) und behandelt
    KI als Werkzeug. Wer eine Erfindung in beiden Rechtsordnungen anmeldet, kann dieselbe Erfinderbenennung
    verwenden. Praktisch zu beachten: Die US-Duty-of-Disclosure ist strenger als die europäische Praxis;
    der KI-Einsatz und der menschliche Beitrag sollten für US-Anmeldungen laborbuchartig dokumentiert
    werden, weil ein Streit über die Erfinderschaft im US-Verfahren zur Unwirksamkeit des Patents führen
    kann.

    '
