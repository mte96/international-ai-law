- id: us-nist-ai-600-1
  jurisdiktion: us
  kurztitel: NIST Generative AI Profile
  offizieller_titel: 'NIST AI 600-1 — Artificial Intelligence Risk Management Framework: Generative Artificial
    Intelligence Profile

    '
  fundstelle: NIST AI 600-1, 26. Juli 2024
  verfahrensnummer: erstellt aufgrund EO 14110 Sec. 4.1
  status: softlaw
  status_detail: 'Freiwillig; weiterhin veröffentlicht, obwohl die auftraggebende Executive Order aufgehoben
    ist. Vom Überarbeitungsauftrag des AI Action Plan mittelbar erfasst, da es dieselben Merkmalskategorien
    verwendet.

    '
  kurzbeschreibung: 'Anwendungsprofil des AI RMF für generative KI. Benennt zwölf spezifische Risiken
    generativer Systeme — darunter CBRN-Information, Konfabulation, gefährliche und gewalttätige Empfehlungen,
    Datenschutz, schädliche Verzerrungen, Umweltwirkungen, Informationsintegrität, geistiges Eigentum,
    unerwünschte intime Darstellungen und Risiken der Wertschöpfungskette — und ordnet ihnen über 200
    Handlungsvorschläge zu.

    '
  inkrafttreten:
    datum: 2024-07-26
    verifiziert: true
    quelle: https://www.nist.gov/itl/ai-risk-management-framework
  anwendungsdaten:
