  verfahrensnummer: NDAA FY2026
  status: anwendbar
  status_detail: 'Im Dezember 2025 Gesetz geworden. Enthält KI-Vorschriften für den Verteidigungsbereich
    sowie den Comprehensive Outbound Investment National Security Act (Abschnitte 8501 bis 8607) mit 150
    Mio. USD jährlich. Enthält ausdrücklich KEINE Verdrängung einzelstaatlicher KI-Gesetze und nicht den
    GAIN AI Act.

    '
  kurzbeschreibung: 'Das jährliche Verteidigungsgesetz ist in der Praxis das zuverlässigste Vehikel für
    KI-Gesetzgebung im US-Kongress, weil es jedes Jahr verabschiedet werden muss. Die FY2026-Fassung regelt
    KI-Beschaffung und -Einsatz im Verteidigungsministerium und verschärft die Kontrolle ausgehender Investitionen
    in chinesische Verteidigungs- und Überwachungstechnologie. Für zivile Anbieter unmittelbar relevant
    ist vor allem das Outbound-Investment-Regime.

    '
  inkrafttreten:
    datum: 2025-12-18
    verifiziert: true
    quelle: https://www.congress.gov/bill/119th-congress/senate-bill/1071
    fundstelle_norm: 'Congress.gov zu S.1071, 119. Kongress (National Defense Authorization Act for Fiscal
      Year 2026): "12/18/2025 Became Public Law No: 119-60." Das Gesetz tritt mangels abweichender Bestimmung
      mit der Inkraftsetzung in Kraft. Zuvor gespeichert: 31.12.2025 mit dem Vermerk "Public Law nicht
      verifiziert".'
  anwendungsdaten:
