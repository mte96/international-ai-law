- id: us-apa
  jurisdiktion: us
  kurztitel: APA (5 U.S.C. §§ 551 ff.)
  offizieller_titel: 'Administrative Procedure Act of 1946, kodifiziert in 5 U.S.C. §§ 551-559 und 701-706

    '
  fundstelle: Act of June 11, 1946, ch. 324, 60 Stat. 237; 5 U.S.C. § 706
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Seit 1946 in Kraft. Im KI-Bestand ist der APA die Klageschiene gegen das Copyright Office:
    Thaler v. Perlmutter und Allen v. Perlmutter greifen die Zurückweisung der Registrierung als willkürlich
    an. Nach Loper Bright Enterprises v. Raimondo (2024) ist die Chevron-Deferenz entfallen — Gerichte
    legen Gesetze nun selbst aus, was die Angriffsfläche behördlicher KI-Leitlinien erhöht.

    '
  kurzbeschreibung: '§ 706(2)(A) verpflichtet die Gerichte, Behördenentscheidungen aufzuheben, die willkürlich,
    launenhaft, ermessensmissbräuchlich oder sonst nicht rechtskonform sind; § 706(2)(C) erfasst das Handeln
    außerhalb der gesetzlichen Befugnis. Der Maßstab ist deferentiell in der Tatsachenwürdigung, seit
    Loper Bright aber nicht mehr in der Gesetzesauslegung. Der APA ist damit das allgemeine Instrument,
    mit dem KI-bezogene Verwaltungspraxis — Registrierungsablehnungen, Leitlinien, Exportkontrollregeln
    — gerichtlich überprüft wird.

    '
  inkrafttreten:
    datum: 1946-09-11
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title5-section706&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2024-06-28
    was_gilt: 'Loper Bright Enterprises v. Raimondo: Aufgabe der Chevron-Deferenz; Gerichte entscheiden
      Auslegungsfragen selbst.

      '
    verifiziert: false
    quelle: https://www.supremecourt.gov/
  themenachsen:
  - sektor-oeffentlich
  - governance
  - urheberrecht
  - marktzugang
  regelungsschwerpunkte:
  - 'Der APA ist der Grund, warum die Frage der maschinellen Urheberschaft überhaupt vor Gericht kam:
    Thaler und Allen klagen nicht auf Feststellung, sondern gegen einen Verwaltungsakt des Copyright Office.
    Der Prüfungsmaßstab ist deshalb ein anderer als in einer Verletzungsklage.'
  - Nach Loper Bright sind die Leitlinien des Copyright Office und des USPTO zur KI-Urheberschaft und
    -Erfinderschaft nicht mehr durch Deferenz geschützt — sie überzeugen nur noch, soweit sie überzeugen
    (Skidmore).
  - 'Die Kehrseite: Auch der Rückzug behördlicher KI-Leitlinien (EEOC, CFPB) ist APA-pflichtig, soweit
    er förmliche Regeln betrifft — bei bloßen Auslegungshilfen dagegen nicht, weshalb der Rückzug 2025
    weitgehend angriffsfest war.'
  eu_anbieter_relevanz: 'Mittelbar relevant für jeden, der eine US-Behördenentscheidung angreifen will
    — etwa eine BIS-Exportlizenzentscheidung oder eine Registrierungsablehnung. Wichtiger ist die strukturelle
    Einsicht: Weil das US-Bundesrecht kein KI-Gesetz kennt, findet die KI-Regulierung dort in Verwaltungspraxis
    statt, und der APA ist ihr einziges allgemeines Korrektiv. Wer die US-Rechtslage beobachtet, muss
    deshalb Behördendokumente, nicht Gesetzblätter lesen.

    '
  dokumente:
  - datum: 1946-06-11
    typ: endfassung
    titel: 5 U.S.C. § 706 — Scope of review
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title5-section706&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Amtlicher Text des Prüfungsmaßstabs.

      '
  offene_punkte:
  - Wirkung von Loper Bright auf die Leitlinien des Copyright Office zur KI-Urheberschaft — bislang nicht
    gerichtlich geprüft.
