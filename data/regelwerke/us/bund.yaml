- id: us-28-usc-verfahren
  jurisdiktion: us
  kurztitel: 28 U.S.C. (Gerichtsverfassung und Verfahren)
  offizieller_titel: 'Title 28 of the United States Code — Judiciary and Judicial Procedure

    '
  fundstelle: Act of June 25, 1948, ch. 646, 62 Stat. 869; 28 U.S.C. §§ 1 ff.
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Seit 01.09.1948 in Kraft. Im KI-Bestand tragen drei Vorschriften: § 1927 (Kostenhaftung
    des Prozessvertreters bei mutwilliger Verfahrensverlängerung — neben Rule 11 die zweite Sanktionsschiene
    der Halluzinationsfälle), § 1292(b) (Zulassung der Zwischenrevision — der Weg, auf dem die Fair-Use-Frage
    in ROSS zum Third Circuit gelangte und in Kadrey gerade nicht zum Ninth Circuit) und §§ 2071-2077
    (Rules Enabling Act — Grundlage des Verfahrens, in dem Fed. R. Evid. 707 erarbeitet wird).

    '
  kurzbeschreibung: '§ 1927 verpflichtet Anwälte, die ein Verfahren unangemessen und mutwillig vervielfachen,
    persönlich zur Erstattung der dadurch verursachten Mehrkosten. § 1292(b) erlaubt dem erstinstanzlichen
    Gericht, eine Zwischenentscheidung zur Revision zuzulassen, wenn sie eine kontrollierende Rechtsfrage
    betrifft, über die vernünftigerweise Meinungsverschiedenheit besteht, und die sofortige Entscheidung
    das Verfahren wesentlich fördert; das Berufungsgericht entscheidet über die Annahme nach Ermessen.
    §§ 2071-2077 regeln, wie die Bundesgerichte ihre Verfahrensregeln setzen: Advisory Committee, öffentliche
    Stellungnahme, Judicial Conference, Supreme Court, Vorlage an den Kongress.

    '
  inkrafttreten:
    datum: 1948-09-01
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?path=/prelim@title28&edition=prelim
  anwendungsdaten:
  - datum: 2025-05-06
    was_gilt: 'Lacey v. State Farm: § 1927 neben Rule 11 und inhärenter Befugnis als Grundlage einer 31.000-USD-Sanktion
      wegen KI-erzeugter Scheinzitate.

      '
    verifiziert: false
    quelle: https://www.courtlistener.com/
  themenachsen:
  - berufsrecht
  - haftung
  - urheberrecht
  - governance
  regelungsschwerpunkte:
  - § 1927 setzt anders als Rule 11 subjektiv an („unreasonably and vexatiously“) und erfasst deshalb
    gerade das Festhalten an erfundenen Fundstellen nach Beanstandung — die Fallgruppe, in der die Sanktionen
    am höchsten ausfallen.
  - '§ 1292(b) ist der Grund, warum die Fair-Use-Frage überhaupt vor ein Berufungsgericht gelangt: Ohne
    Zwischenrevision müsste erst ein Geschworenenverfahren durchgeführt werden. Judge Bibas hat sie in
    ROSS zugelassen, Judge Chhabria in Kadrey verweigert — die Verfahrensentscheidung bestimmt, welche
    Frage zuerst obergerichtlich geklärt wird.'
  - 'Der Rules Enabling Act erklärt, warum eine KI-Beweisregel Jahre braucht: Vorschlag, Stellungnahme,
    Advisory Committee, Standing Committee, Judicial Conference, Supreme Court, siebenmonatige Vorlagefrist
    an den Kongress. Rule 707 hat diesen Weg bislang nicht abgeschlossen.'
  eu_anbieter_relevanz: 'Praktisch relevant für die Prozessstrategie in US-Verfahren: § 1292(b) ist das
    einzige Mittel, eine Grundsatzfrage vor Abschluss der ersten Instanz klären zu lassen — für europäische
    Beklagte mit hohem Schadensrisiko oft die einzige Möglichkeit, den Vergleichsdruck zu senken. § 1927
    trifft auch ausländische, pro hac vice zugelassene Prozessvertreter persönlich.

    '
