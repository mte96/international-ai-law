- id: us-nist-ai-rmf
  jurisdiktion: us
  kurztitel: NIST AI RMF 1.0
  offizieller_titel: 'NIST AI 100-1 — Artificial Intelligence Risk Management Framework (AI RMF 1.0)

    '
  fundstelle: NIST AI 100-1, 26. Januar 2023
  verfahrensnummer: 'gesetzliche Grundlage: National AI Initiative Act of 2020'
  status: softlaw
  status_detail: 'Ausdrücklich freiwillig. Der AI Action Plan vom 23.07.2025 ordnet eine Überarbeitung
    an, die Bezüge auf „misinformation, Diversity, Equity, and Inclusion, and climate change" streichen
    soll. NIST bestätigt auf seiner Seite, das Rahmenwerk werde „als Teil des White House AI Action Plan"
    überarbeitet. Am 13.02.2026 haben zehn Wirtschaftsverbände — darunter Alliance for Automotive Innovation,
    American Bankers Association und BSA — Handelsminister Lutnick schriftlich gebeten, das Rahmenwerk
    im Kern zu erhalten. Eine überarbeitete Fassung war bei Rechercheschluss nicht veröffentlicht.

    '
  kurzbeschreibung: 'Das AI RMF ist der faktische Referenzrahmen für KI-Governance in den USA: vier Funktionen
    (Govern, Map, Measure, Manage), sieben Merkmale vertrauenswürdiger KI und ein begleitendes Playbook.
    Es ist rechtlich unverbindlich, wird aber in Verträgen, Versicherungspolicen, Prüfungsstandards und
    einzelstaatlichen Gesetzen — etwa im Colorado AI Act als Safe-Harbor-Maßstab — in Bezug genommen.
    Diese Verweise machen die anstehende Überarbeitung zu einer Frage mit vertragsrechtlicher Sprengkraft.

    '
