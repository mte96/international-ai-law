- id: us-ostp-ai-regulatory-reform
  jurisdiktion: us
  kurztitel: OSTP — KI-Regulierungsabbau
  offizieller_titel: 'Office of Science and Technology Policy — Notice of Request for Information; Regulatory
    Reform on Artificial Intelligence

    '
  fundstelle: 90 FR (26. September 2025), Dokument 2025-18737
  verfahrensnummer: OSTP RFI 2025-18737
  status: verfahren
  status_detail: 'Konsultation abgeschlossen; Auswertung läuft. OSTP-Direktor Michael Kratsios koordiniert
    die KI-Politik der Administration, führt den National Science and Technology Council und ist gemeinsam
    mit dem Special Advisor for AI and Crypto Adressat des Auftrags aus EO 14365, einen Gesetzesvorschlag
    für einen bundeseinheitlichen Rahmen zu entwerfen. Dieser Vorschlag wurde im März 2026 vorgelegt.

    '
  kurzbeschreibung: 'Das OSTP ist die politikkoordinierende Stelle der Exekutive für KI. Es hat den AI
    Action Plan erarbeitet, betreibt das Verzeichnis KI-hemmender Bundesvorschriften und hat mit der RFI
    vom 26.09.2025 systematisch abgefragt, welche Bundesregelungen die KI-Entwicklung und -Anwendung behindern.
    Eigene Rechtsetzungsbefugnis hat das OSTP nicht; es wirkt über Präsidialdokumente, Haushaltsleitlinien
    gemeinsam mit OMB und über die Vorbereitung von Gesetzesvorschlägen.

    '
  inkrafttreten:
    datum: 2025-09-26
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/09/26/2025-18737/notice-of-request-for-information-regulatory-reform-on-artificial-intelligence
  anwendungsdaten:
  - datum: 2025-10-27
    was_gilt: Ende der Kommentierungsfrist (Eingaben u. a. der US-Handelskammer vom 23.10.2025).
    verifiziert: false
    quelle: https://www.uschamber.com/technology/response-to-ostps-request-for-information-on-regulatory-reform-for-artificial-intelligence
  - datum: 2026-03-20
    was_gilt: 'Vorlage der Gesetzesempfehlungen des Weißen Hauses für einen nationalen KI-Rahmen mit Verdrängung
      einzelstaatlichen Rechts (Auftrag aus EO 14365).

      '
    verifiziert: false
    quelle: https://www.ropesgray.com/en/insights/alerts/2026/03/the-white-house-legislative-recommendations-national-policy-framework-for-artificial-intelligence-an
  themenachsen:
  - governance
  - marktzugang
  - wettbewerb
  regelungsschwerpunkte:
  - 'Die RFI ist der Suchmechanismus für eine Deregulierungsagenda: Sie fragt Unternehmen, welche Bundesvorschriften
    KI-Einsatz behindern. Ergebnisse fließen in Ressort-Rulemaking und Gesetzesvorschläge.'
  - OSTP als Autor des Preemption-Gesetzesvorschlags vom März 2026 — Bindeglied zwischen EO 14365 und
    dem Kongressverfahren.
  - Kratsios hat öffentlich die Rolle von NIST als standardsetzende, nicht regulierende Stelle betont
    — maßgeblich für die Einordnung des AI RMF als Soft Law.
  eu_anbieter_relevanz: 'Mittelbar. Europäische Anbieter mit US-Präsenz können sich an OSTP-Konsultationen
    beteiligen; die Verfahren sind offen. Praktisch wichtiger: Die RFI-Auswertung zeigt an, welche Sektorregelungen
    (Medizin, Finanz, Verkehr) als Nächstes gelockert werden — was Marktzugangschancen eröffnet, aber
    auch die Divergenz zum EU-Schutzniveau vergrößert.

    '
