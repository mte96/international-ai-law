- id: us-sec-ki
  jurisdiktion: us
  kurztitel: SEC — KI in Wertpapiermärkten
  offizieller_titel: 'Securities and Exchange Commission — Durchsetzung gegen „AI washing" und Aufsicht
    über KI-Einsatz bei Wertpapierdienstleistern

    '
  fundstelle: Securities Act 1933, Exchange Act 1934, Advisers Act 1940
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Kein KI-spezifisches Regelwerk. Die SEC verfolgt irreführende KI-Angaben mit den allgemeinen
    Betrugstatbeständen. Die 2023 vorgeschlagene Regel zu „predictive data analytics" und Interessenkonflikten
    wurde nach breiter Kritik nicht weiterverfolgt; ihr formaler Rücknahmestatus konnte nicht verifiziert
    werden. Zuständig ist seit 2025 die Cyber and Emerging Technologies Unit (CETU).

    '
  kurzbeschreibung: 'Die SEC behandelt KI als Offenlegungs- und Betrugsthema, nicht als Produktsicherheitsthema.
    Wer den Einsatz von KI im Anlageprozess oder in Produkten unzutreffend darstellt, verstößt gegen die
    Betrugsvorschriften — unabhängig davon, ob das System funktioniert. Sanktionen sind Zivilbussen, Gewinnabschöpfung,
    Berufsverbote und in schweren Fällen parallele Strafverfahren.

    '
  inkrafttreten:
    datum: 2024-03-18
    verifiziert: true
    quelle: https://www.debevoise.com/insights/publications/2024/03/ai-enforcement-starts-with-washing-the-sec-charges
    fundstelle_norm: Kein Rechtsakt mit Inkrafttretensvorschrift; der Eintrag buendelt die Verfolgungspraxis
      nach Securities Act 1933, Exchange Act 1934 und Advisers Act 1940. Eingetragen ist der Tag der ersten
      'AI washing'-Verfahren (Delphia (USA) Inc. und Global Predictions Inc.), angekuendigt durch SEC-Pressemitteilung
      vom 18.03.2024
  anwendungsdaten:
  - datum: 2024-03-18
    was_gilt: 'Delphia Inc. und Global Predictions Inc.: erste „AI washing"- Verfahren, Zivilbussen von
      zusammen 400.000 USD. Datum nicht verifiziert.

      '
    verifiziert: false
    quelle: https://www.dlapiper.com/en-us/insights/publications/ai-outlook/2025/sec-emphasizes-focus-on-ai-washing
  - datum: 2025-01-01
    was_gilt: 'Presto Automation Inc.: Vergleich wegen unzutreffender Angaben zu KI-Fähigkeiten.'
    verifiziert: false
    quelle: https://www.dlapiper.com/en-us/insights/publications/ai-outlook/2025/sec-emphasizes-focus-on-ai-washing
  - datum: 2025-04-01
    was_gilt: 'Nate, Inc.: Verfahren anhängig, flankiert von strafrechtlichen Vorwürfen wegen Wire Fraud.

      '
    verifiziert: false
    quelle: https://www.dlapiper.com/en-us/insights/publications/ai-outlook/2025/sec-emphasizes-focus-on-ai-washing
  themenachsen:
  - sektor-finanz
  - wettbewerb
  - haftung
  - content
  regelungsschwerpunkte:
  - '„AI washing" als Leitbegriff: Maßstab ist die Transparenz über die tatsächlich eingesetzte Technologie
    — die Abgrenzung zwischen echtem maschinellen Lernen und „repackaged rule-based automation under an
    AI label" ist der zentrale Prüfpunkt.'
  - Cyber and Emerging Technologies Unit (CETU) mit Zuständigkeit für prädiktive Datenanalyse, KI-gestützten
    Handel, Chatbots und KI-generierte Anlageberatung.
  - 'Der Fall Nate zeigt das Eskalationsmuster: zivilrechtliche und strafrechtliche Verfolgung parallel.'
  - Die gescheiterte PDA-Regel von 2023 ist das Beispiel dafür, dass ein KI-spezifisches Aufsichtsregime
    im US-Finanzrecht derzeit nicht durchsetzbar ist.
  eu_anbieter_relevanz: 'Relevant für europäische Anbieter von KI-Werkzeugen für den US-Finanzsektor und
    für europäische Emittenten mit US-Notierung. Zwei Prüfpunkte: Erstens muss die Beschreibung des KI-Einsatzes
    in Verkaufsunterlagen, Prospekten und Jahresberichten der technischen Realität entsprechen; die Systembeschreibung
    nach Art. 11 und Anhang IV KI-VO ist dafür die belastbare Grundlage. Zweitens ist bei Anlageprodukten
    die Grenze zwischen Modellbeschreibung und Renditeversprechen zu wahren. Der Maßstab ist strenger
    als das europäische Marktmissbrauchsrecht, weil bereits die Technologiebezeichnung selbst täuschungsrelevant
    sein kann.

    '
  dokumente:
  - datum: 2025-06-01
    typ: stellungnahme
    titel: SEC emphasizes focus on 'AI washing' despite perceived enforcement slowdown
    url: https://www.dlapiper.com/en-us/insights/publications/ai-outlook/2025/sec-emphasizes-focus-on-ai-washing
    sprache: en
    urheber: DLA Piper
    verifiziert: true
    notiz: 'Fallübersicht mit Delphia, Global Predictions, Presto Automation und Nate sowie Beschreibung
      des CETU-Mandats.

      '
  - datum: 2026-01-01
    typ: bericht
    titel: 'Artificial Intelligence in Capital Markets: Policy Issues (CRS IF13103)'
    url: https://www.congress.gov/crs-product/IF13103
    sprache: en
    urheber: Congressional Research Service
    verifiziert: false
    notiz: Amtliche Übersicht; congress.gov in dieser Sitzung nicht abrufbar.
  offene_punkte:
  - Formaler Status der 2023 vorgeschlagenen PDA-Regel (Conflicts of Interest Associated with the Use
    of Predictive Data Analytics) nicht verifiziert — Rücknahme wahrscheinlich, aber nicht belegt.
  - Alle Verfahrensdaten stammen aus einer Sekundärquelle; Aktenzeichen fehlen.
  - Datum 18.03.2024 nicht an einer amtlichen SEC-Quelle geprüft, sondern einer Kanzleiquelle entnommen.
    Zu prüfen an den SEC-Pressemitteilungen zu Delphia und Global Predictions vom März 2024.
