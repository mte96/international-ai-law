- id: us-omb-m-26-04
  jurisdiktion: us
  kurztitel: OMB M-26-04 (Unbiased AI Principles)
  offizieller_titel: 'OMB Memorandum M-26-04 — Increasing Public Trust in Artificial Intelligence Through
    Unbiased AI Principles

    '
  fundstelle: OMB M-26-04, 11. Dezember 2025
  verfahrensnummer: M-26-04
  status: anwendbar
  status_detail: 'In Kraft; gilt sofort für alle neuen LLM-Beschaffungen. Behörden mussten ihre Beschaffungsrichtlinien
    bis 11.03.2026 anpassen. Das Memorandum enthält eine Sunset-Klausel nach zwei Jahren (11.12.2027).
    Umsetzung in Ressortvorschriften belegt, etwa DOE Acquisition Letter 2026-05 vom 08.05.2026.

    '
  kurzbeschreibung: 'Operationalisiert EO 14319. Behörden müssen von LLM-Anbietern Transparenzunterlagen
    anfordern: Nutzungsrichtlinien, Model- oder System-Cards und Meldewege für Ausgaben, die den Unbiased
    AI Principles zuwiderlaufen. Erweiterte Unterlagen können System-Prompts, Sicherheitsfilter, Bias-Evaluierungen
    und ausdrücklich „adjustments to comply with foreign or state regulations" umfassen. Bestehende Verträge
    sind „to the extent practicable" anzupassen. Nationale Sicherheitssysteme sind ausgenommen, zur Einhaltung
    aber angehalten.

    '
  inkrafttreten:
    datum: 2025-12-11
    verifiziert: true
    quelle: https://www.lawfaremedia.org/article/omb-releases-guidance-on-trump-s--woke-ai--executive-order
  anwendungsdaten:
