- id: us-caisi
  jurisdiktion: us
  kurztitel: CAISI (vormals US AI Safety Institute)
  offizieller_titel: 'Center for AI Standards and Innovation (CAISI), National Institute of Standards
    and Technology, U.S. Department of Commerce

    '
  fundstelle: Behördliche Einrichtung bei NIST; Umbenennung Juni 2025
  verfahrensnummer: —
  status: softlaw
  status_detail: 'Aktiv. Aus dem 2023 gegründeten US AI Safety Institute im Juni 2025 umbenannt und neu
    ausgerichtet: statt „Safety" nun „Standards and Innovation", mit Schwerpunkt auf nationaler Sicherheit,
    Wettbewerbsbewertung gegnerischer Modelle und freiwilliger Zusammenarbeit. Der Diskussionsentwurf
    des Great American AI Act würde CAISI gesetzlich verankern und die Mittel von 15 auf 100 Mio. USD
    jährlich erhöhen.

    '
  kurzbeschreibung: 'CAISI ist der zentrale Ansprechpartner der Industrie im Bund für Modelltests und
    gemeinsame Forschung. Es entwickelt Sicherheits- und Standardleitlinien, führt unklassifizierte Evaluierungen
    zu Cyber-, Bio- und Chemiewaffenrisiken durch, bewertet die Fähigkeiten amerikanischer und gegnerischer
    Modelle, identifiziert Sicherheitslücken und Risiken ausländischer Einflussnahme und vertritt die
    USA in der internationalen Standardisierung. Es hat keine Anordnungsbefugnis; die Zusammenarbeit mit
    Entwicklern beruht auf freiwilligen Vereinbarungen.

    '
  inkrafttreten:
    datum: 2025-06-03
    verifiziert: true
    quelle: https://www.commerce.gov/news/press-releases/2025/06/statement-us-secretary-commerce-howard-lutnick-transforming-us-ai
    fundstelle_norm: Kein Rechtsakt mit Inkrafttretensvorschrift. Massgeblich ist die Erklaerung des Handelsministers
      Howard Lutnick vom 03.06.2025 ('FOR IMMEDIATE RELEASE, Tuesday, June 3, 2025'), mit der das U.S.
      AI Safety Institute in das Center for AI Standards and Innovation umgewandelt wurde
  anwendungsdaten:
  - datum: 2025-09-30
    was_gilt: 'Veröffentlichung der Evaluierung der DeepSeek-Modelle (aktualisiert am 20.11.2025). Befunde
      unter anderem: Agenten auf Basis des sichersten DeepSeek-Modells befolgten im Mittel zwölfmal häufiger
      schädliche Anweisungen als US-Referenzmodelle; bei einer verbreiteten Jailbreak-Technik antwortete
      das Modell auf 94 Prozent offen schädlicher Anfragen gegenüber 8 Prozent bei den US-Referenzmodellen.

      '
    verifiziert: true
    quelle: https://www.nist.gov/news-events/news/2025/09/caisi-evaluation-deepseek-ai-models-finds-shortcomings-and-risks
  - datum: 2026-03-01
    was_gilt: CRADA mit OpenMined zur Ermöglichung abgesicherter Modellevaluierungen.
    verifiziert: true
    quelle: https://www.nist.gov/caisi
  - datum: 2026-05-01
    was_gilt: Evaluierung von DeepSeek V4 Pro.
    verifiziert: true
    quelle: https://www.nist.gov/news-events/news/2026/05/caisi-evaluation-deepseek-v4-pro
  - datum: 2026-07-01
    was_gilt: 'Gemeinsame Bewertung der Cyberfähigkeiten von Kimi K3 mit dem britischen AI Security Institute;
      Bewertung von Z.ai GLM-5.2.

      '
    verifiziert: true
    quelle: https://www.nist.gov/caisi
  themenachsen:
  - gpai
  - sicherheit-export
  - governance
  regelungsschwerpunkte:
  - 'Umbenennung als Programmwechsel: Der Begriff „Safety" ist bewusst entfernt; Auftrag ist nun Standardsetzung,
    Innovationsförderung und Sicherheitsbewertung gegnerischer Systeme.'
  - Evaluierungspraxis richtet sich schwerpunktmäßig gegen chinesische Modelle (DeepSeek, Kimi, Z.ai)
    — Wettbewerbs- und Sicherheitsbewertung sind institutionell verschmolzen.
  - Fortbestehende internationale Zusammenarbeit mit dem britischen AI Security Institute — eine der wenigen
    Brücken zwischen dem US- und dem europäisch-britischen Sicherheitsdiskurs.
  - Keine Anordnungsbefugnis; alle Vereinbarungen mit Entwicklern sind freiwillig. Der Great American
    AI Act würde daran ansetzen und CAISI mit Auditakkreditierung betrauen.
  eu_anbieter_relevanz: 'Für europäische Frontier-Anbieter der naheliegendste Kooperationspunkt im US-Bund
    und zugleich eine Brücke: Wer bereits mit dem britischen AISI oder dem EU-KI-Büro zusammenarbeitet,
    kann Evaluierungsartefakte weitgehend wiederverwenden. Zu beachten ist die sicherheitspolitische Aufladung
    — Evaluierungsergebnisse können zur Wettbewerbsbewertung herangezogen werden. Für die KI-VO relevant:
    CAISI-Evaluierungen sind kein Konformitätsnachweis nach Art. 55 KI-VO und ersetzen weder Modellbewertung
    noch Meldewege gegenüber dem KI-Büro.

    '
