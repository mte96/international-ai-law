  - datum: 2026-08-01
    was_gilt: '60 Tage: Eingestuftes Benchmarking-Verfahren zur Bestimmung von „covered frontier models"
      sowie Ausgestaltung des freiwilligen Frühzugangsrahmens; Ausbau der Tech-Force-Cyberrekrutierung
      durch OPM.

      '
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2026/06/05/2026-11415/promoting-advanced-artificial-intelligence-innovation-and-security
  themenachsen:
  - gpai
  - sicherheit-export
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Sec. 3(c) wörtlich: „Nothing in this section shall be construed to authorize the creation of a mandatory
    governmental licensing, preclearance, or permitting requirement." — Die bewusste Absage an ein Zulassungsregime
    und der schärfste konzeptionelle Gegensatz zur KI-VO.

    '
  - 'Sec. 3(b): Freiwilliger Frühzugang von bis zu 30 Tagen vor Veröffentlichung, unter Zusicherung von
    Vertraulichkeit, Cybersicherheit, Insider-Risk- und IP-Schutz; gemeinsame Auswahl von „trusted partners"
    für Vorabzugang.'
  - 'Schwellenwerte NICHT öffentlich: Maßstab sind fortgeschrittene Cyberfähigkeiten, nicht Rechenaufwand
    — ein methodischer Bruch mit dem FLOP-Ansatz von EO 14110 und Art. 51 KI-VO. Letztentscheidung durch
    den NSA-Direktor.'
  - 'Sec. 4: Priorisierung der Verfolgung nach 18 U.S.C. §§ 1028, 1030, 1343 bei KI-gestützten Computerdelikten
    und Datendiebstahl.'
  - 'Widerspruch in den Quellen: Eine Kanzleipublikation bezeichnet die Anordnung als „EO 14178"; die
    Federal-Register-Fundstelle und der CRS-Bericht IF13268 nennen übereinstimmend EO 14409. Maßgeblich
    ist 91 FR 34565.'
  eu_anbieter_relevanz: 'Für europäische Frontier-Modellanbieter mit US-Marktpräsenz eine Einladung, kein
    Zwang. Die Teilnahme bringt Zugang zu US-Sicherheitsbewertungen und potenziell Reputationsvorteile
    in der Bundesbeschaffung, verlangt aber die Preisgabe eines Vorab-Modells an US-Sicherheitsbehörden.
    Das ist mit Geschäftsgeheimnisschutz, Exportkontrolle und gegebenenfalls europäischen Souveränitätszusagen
    abzugleichen. Wichtig für die Systematik: Anders als Art. 55 KI-VO entsteht hier keine Pflicht zu
    Modellevaluierung, Adversarial Testing oder Vorfallmeldung — wer beides bedient, kann die KI-VO-Unterlagen
    als Grundlage nutzen, muss aber die Weitergabe an US-Stellen datenschutz- und geheimnisrechtlich gesondert
    absichern.

    '
