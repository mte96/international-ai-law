- id: us-take-it-down-act
  jurisdiktion: us
  kurztitel: TAKE IT DOWN Act
  offizieller_titel: 'Tools to Address Known Exploitation by Immobilizing Technological Deepfakes on Websites
    and Networks Act (TAKE IT DOWN Act)

    '
  fundstelle: Public Law No. 119-12
  verfahrensnummer: S. 146, 119. Kongress
  status: anwendbar
  status_detail: 'Seit 19. Mai 2025 Gesetz; die strafrechtlichen Vorschriften gelten seither. Die Plattformpflichten
    galten nach einjähriger Übergangsfrist ab 19. Mai 2026; die FTC hat die Durchsetzung im Mai 2026 aufgenommen.
    Damit das einzige KI-spezifische US-Bundesgesetz mit unmittelbaren Pflichten für private Anbieter.

    '
  kurzbeschreibung: 'Stellt die Veröffentlichung nicht einvernehmlicher intimer Darstellungen unter Strafe
    — ausdrücklich einschließlich KI-generierter Deepfakes — und verpflichtet Plattformen, entsprechende
    Inhalte binnen 48 Stunden nach Meldung durch die betroffene Person zu entfernen und zumutbare Anstrengungen
    zur Entfernung von Kopien zu unternehmen. Strafrahmen bis zwei Jahre Freiheitsstrafe, erhöht bei Minderjährigen.
    Die zivilrechtliche Durchsetzung der Plattformpflichten liegt bei der FTC; Verstöße gelten als unlautere
    oder irreführende Handlung nach Section 5 FTC Act.

    '
