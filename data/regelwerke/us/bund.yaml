- id: us-fda-ki-medizinprodukte
  jurisdiktion: us
  kurztitel: FDA — KI in Medizinprodukten
  offizieller_titel: 'FDA-Leitlinien zu KI-gestützten Medizinprodukten: „Marketing Submission Recommendations
    for a Predetermined Change Control Plan for Artificial Intelligence-Enabled Device Software Functions"
    (Endfassung) und „Artificial Intelligence-Enabled Device Software Functions: Lifecycle Management
    Considerations and Marketing Submission Recommendations" (Entwurf)

    '
  fundstelle: 'FDA Guidance (CDRH); Bekanntmachung der Verfügbarkeit: 89 FR 96259 vom 04.12.2024'
  verfahrensnummer: —
  status: softlaw
  status_detail: 'Die PCCP-Endfassung ist in Kraft und wird für das Haushaltsjahr 2026 auf der A-Liste
    zur weiteren Finalisierung geführt. Die umfassende Lifecycle-Leitlinie ist weiterhin Entwurf und steht
    auf der B-Liste („as resources permit") — eine Finalisierung ist damit nicht priorisiert. Widersprüchliche
    Quellenangaben zum Entwurfsdatum (Januar 2025 laut FDA-Pressemitteilung, Januar 2024 laut Kanzleianalyse
    der Leitlinienagenda); maßgeblich ist die FDA-Pressemitteilung vom 6. Januar 2025.

    '
  kurzbeschreibung: 'Die FDA reguliert KI in Medizinprodukten nicht über ein KI-Sondergesetz, sondern
    über das bestehende Zulassungsrecht (510(k), De Novo, PMA). Kernstück ist der Predetermined Change
    Control Plan: Hersteller können vorab genehmigen lassen, welche Modelländerungen sie ohne neue Zulassungsentscheidung
    vornehmen dürfen — die Antwort auf das Problem lernender Systeme in einem Zulassungsregime, das auf
    statische Produkte zugeschnitten ist. Der Entwurf zur Lifecycle-Leitlinie ergänzt Anforderungen an
    Transparenz, Verzerrungsminderung und Leistungsüberwachung nach Inverkehrbringen. Sanktionen ergeben
    sich aus dem allgemeinen Produktrecht (Warning Letters, Rückruf, Untersagung).

    '
  inkrafttreten:
    datum: 2024-12-04
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2024/12/04/2024-28371/marketing-submission-recommendations-for-a-predetermined-change-control-plan-for-artificial
    fundstelle_norm: Guidance-Dokumente der FDA haben keine Inkrafttretensvorschrift. Maßgeblich ist die
      Bekanntmachung der Verfügbarkeit der endgültigen Guidance "Marketing Submission Recommendations
      for a Predetermined Change Control Plan for Artificial Intelligence-Enabled Device Software Functions"
      im Federal Register, citation 89 FR 96259, publication_date 2024-12-04.
