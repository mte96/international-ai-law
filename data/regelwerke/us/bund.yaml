- id: us-eo-14409
  jurisdiktion: us
  kurztitel: EO 14409 (Frontier-Modelle und Cybersicherheit)
  offizieller_titel: 'Executive Order 14409 of June 2, 2026 — Promoting Advanced Artificial Intelligence
    Innovation and Security

    '
  fundstelle: 91 FR 34565 (5. Juni 2026)
  verfahrensnummer: EO 14409
  status: anwendbar
  status_detail: 'In Kraft. Die 60-Tage-Frist für die Festlegung der Schwellen für „covered frontier models"
    durch NSA, Treasury und CISA lief am 01.08.2026 ab; ob und in welcher Form die Festlegung erfolgte,
    ist wegen ihrer Einstufung als Verschlusssache nicht öffentlich feststellbar.

    '
  kurzbeschreibung: 'Erste bundesrechtliche Befassung mit Frontier-Modellen seit Aufhebung von EO 14110
    — und bewusst als Freiwilligkeitsmodell konstruiert. Entwickler können sich an die Bundesregierung
    wenden, um klären zu lassen, ob ihr Modell als „covered frontier model" gilt, und der Regierung bis
    zu 30 Tage vor der Veröffentlichung Zugang zu Sicherheitsprüfungen gewähren. Die Schwellenwerte werden
    über ein eingestuftes Benchmarking-Verfahren anhand fortgeschrittener Cyberfähigkeiten bestimmt; die
    Letztentscheidung trifft der Direktor der NSA. Daneben: KI-gestützte Cyberabwehr für Bundesbehörden,
    kritische Infrastruktur und Länder/Kommunen, eine AI-Cybersecurity-Clearinghouse beim Finanzministerium
    und ein Strafverfolgungsschwerpunkt des Justizministeriums.

    '
  inkrafttreten:
    datum: 2026-06-02
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2026/06/05/2026-11415/promoting-advanced-artificial-intelligence-innovation-and-security
  anwendungsdaten:
  - datum: 2026-07-02
    was_gilt: '30 Tage: Priorisierung der Cyberabwehr für National Security Systems; CISA-Direktiven;
      Einrichtung der AI Cybersecurity Clearinghouse beim Finanzministerium; OMB-Prüfung, ob Bundesförderprogramme
      KI-gestützte Schwachstellenerkennung finanzieren können.

      '
