- id: us-ftc-operation-ai-comply
  jurisdiktion: us
  kurztitel: FTC — Operation AI Comply
  offizieller_titel: 'Federal Trade Commission, Operation AI Comply — Durchsetzungsinitiative gegen irreführende
    KI-Behauptungen nach Section 5 FTC Act

    '
  fundstelle: 15 U.S.C. § 45 (Section 5 FTC Act)
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Im September 2024 gestartet und unter der Ferguson-FTC fortgeführt — der seltene Fall
    einer über den Regierungswechsel hinweg stabilen KI-Politik. Die FTC verfolgt allerdings inzwischen
    zwei Linien zugleich: Durchsetzung gegen überzogene KI-Werbeversprechen einerseits, und den Preemption-Auftrag
    aus EO 14365 Sec. 7 andererseits.

    '
  kurzbeschreibung: 'Die FTC wendet das allgemeine Verbot unlauterer und irreführender Handelspraktiken
    auf KI an. Erfasst werden falsche Behauptungen über KI-Fähigkeiten, KI-gestützte Einkommensversprechen
    und Werkzeuge, die Täuschung ermöglichen. Sanktionen sind Unterlassungsanordnungen, Rückzahlungs-
    und Herausgabeanordnungen sowie Zivilbussen bei Verstoß gegen bestehende Anordnungen. Es gibt keine
    KI-spezifische Rechtsgrundlage — das ist der Kern des US-Ansatzes: bestehendes Verbraucherschutzrecht
    statt neuer Marktzugangsregeln.

    '
  inkrafttreten:
    datum: 2024-09-25
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases/2024/09/ftc-announces-crackdown-deceptive-ai-claims-schemes
  anwendungsdaten:
  - datum: 2024-09-25
    was_gilt: 'Start mit fünf Verfahren: DoNotPay („robot lawyer"), Rytr (Werkzeug zur Erzeugung gefälschter
      Bewertungen), Ascent Ecom, Ecommerce Empire Builders, FBA Machine.

      '
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases/2024/09/ftc-announces-crackdown-deceptive-ai-claims-schemes
  - datum: 2025-03-01
    was_gilt: 'Click Profit: Urteile über mehr als 20 Mio. USD gegen die Gründer wegen unbelegter Einkommensversprechen.

      '
    verifiziert: false
    quelle: https://www.beneschlaw.com/insight/one-year-in-ftcs-operation-ai-comply-continues-under-new-administration-signaling-enduring-enforcement-focus/
  - datum: 2025-04-01
    was_gilt: 'Workado: Anordnung wegen der Behauptung einer 98-prozentigen Genauigkeit der KI-Erkennungssoftware
      bei tatsächlich 53 Prozent; keine Geldsanktion, aber Beleg- und Überwachungspflichten.

      '
    verifiziert: false
    quelle: https://www.beneschlaw.com/insight/one-year-in-ftcs-operation-ai-comply-continues-under-new-administration-signaling-enduring-enforcement-focus/
  - datum: 2025-08-01
    was_gilt: 'Air AI: Klage wegen irreführender Wachstums- und Einkommensversprechen anhängig.'
    verifiziert: false
    quelle: https://www.beneschlaw.com/insight/one-year-in-ftcs-operation-ai-comply-continues-under-new-administration-signaling-enduring-enforcement-focus/
  themenachsen:
  - wettbewerb
  - content
  - haftung
  - marktzugang
  regelungsschwerpunkte:
  - 'Der Fall Workado ist der wichtigste für Anbieter: Werbliche Genauigkeitsangaben müssen belegbar sein.
    Wer „98 Prozent Genauigkeit" behauptet, braucht eine reproduzierbare Messgrundlage — die Anordnung
    verlangt laufende Substantiierung.'
  - 'Der Fall Rytr weitet die Haftung auf Werkzeuganbieter aus: Ein Werkzeug, dessen vorhersehbare Nutzung
    Täuschung ermöglicht, kann selbst unlauter sein — auch ohne eigene Falschbehauptung.'
  - Keine KI-spezifische Rechtsgrundlage. Section 5 FTC Act genügt; Durchsetzung ist damit unabhängig
    vom Gesetzgeber.
  - 'Spannungslage seit EO 14365: Dieselbe Behörde soll einerseits Verbraucher vor irreführenden KI-Aussagen
    schützen und andererseits einzelstaatliche Schutzgesetze als bundesrechtlich verdrängt einstufen.'
  eu_anbieter_relevanz: 'Das schärfste unmittelbar geltende US-Haftungsrisiko für europäische KI-Anbieter
    — und unabhängig von Umsatz, Sitz oder Modellgröße. Zwei Prüfpunkte: Erstens muss jede quantitative
    Leistungsangabe in Marketing, Datenblatt und Model Card durch eine dokumentierte, reproduzierbare
    Messung gedeckt sein; die Genauigkeits- und Robustheitsangaben nach Art. 13 Abs. 3 lit. b KI-VO sind
    dafür verwendbar, müssen aber mit der US-Werbeaussage übereinstimmen. Zweitens ist bei Werkzeugen
    mit missbrauchsanfälliger Funktion die vorhersehbare Fehlnutzung zu bewerten — die Fehlanwendungsanalyse
    nach Art. 9 Abs. 2 lit. b KI-VO deckt das ab.

    '
