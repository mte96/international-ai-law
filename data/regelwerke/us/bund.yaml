- id: us-omb-m-25-21
  jurisdiktion: us
  kurztitel: OMB M-25-21 (Behördennutzung)
  offizieller_titel: 'OMB Memorandum M-25-21 — Accelerating Federal Use of AI through Innovation, Governance,
    and Public Trust

    '
  fundstelle: OMB M-25-21, 3. April 2025
  verfahrensnummer: M-25-21
  status: anwendbar
  status_detail: 'Geltendes Rahmenwerk für die KI-Nutzung durch Bundesbehörden. Ersetzt M-24-10. Umsetzungsfristen
    für CAIOs, Governance-Boards und Strategien sind 2025 abgelaufen; jährliche Inventarpflicht läuft
    fort.

    '
  kurzbeschreibung: 'Verpflichtet Bundesbehörden zur Benennung von Chief AI Officers binnen 60 Tagen,
    zur Einrichtung von KI-Governance-Boards in den CFO-Act-Behörden binnen 90 Tagen und zur Vorlage von
    Strategien zum Abbau von Innovationshemmnissen binnen 180 Tagen. Für „high-impact AI" — Systeme, deren
    Ergebnis maßgebliche Grundlage rechtlich oder tatsächlich erheblicher Entscheidungen über Rechte oder
    Sicherheit ist — verlangt es Tests vor der Inbetriebnahme, KI-Folgenabschätzungen, menschliche Aufsicht
    mit Eingriffsmöglichkeit sowie Abhilfe- und Beschwerdewege für Betroffene. Behörden müssen Risikoeinstufungen
    und Ausnahmegenehmigungen mit Begründung veröffentlichen.

    '
  inkrafttreten:
    datum: 2025-04-03
    verifiziert: true
    quelle: https://www.hunton.com/privacy-and-cybersecurity-law-blog/omb-issues-revised-policies-on-ai-use-and-procurement-by-federal-agencies
  anwendungsdaten:
  - datum: 2025-06-02
    was_gilt: '60 Tage: Benennung der Chief AI Officers.'
    verifiziert: true
    quelle: https://www.hunton.com/privacy-and-cybersecurity-law-blog/omb-issues-revised-policies-on-ai-use-and-procurement-by-federal-agencies
  - datum: 2025-07-02
    was_gilt: '90 Tage: KI-Governance-Boards in den CFO-Act-Behörden.'
    verifiziert: true
    quelle: https://www.hunton.com/privacy-and-cybersecurity-law-blog/omb-issues-revised-policies-on-ai-use-and-procurement-by-federal-agencies
  - datum: 2025-09-30
    was_gilt: '180 Tage: Behördenstrategien zum Abbau von Hemmnissen der KI-Einführung.'
    verifiziert: true
    quelle: https://www.hunton.com/privacy-and-cybersecurity-law-blog/omb-issues-revised-policies-on-ai-use-and-procurement-by-federal-agencies
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - '„High-impact AI" ersetzt die Doppelkategorie von M-24-10. Definition: Ergebnis dient als „principal
    basis for decisions or actions that have a legal, material, binding, or significant effect on rights
    or safety" — funktional dem Hochrisikobegriff des Anhangs III KI-VO ähnlich, aber ohne Listenprinzip.'
  - 'Mindestpraktiken: Pre-Deployment-Test, KI-Folgenabschätzung vor und während des Betriebs, menschliche
    Aufsicht mit Eingriffsmöglichkeit, Abhilfe- und Beschwerdemechanismus.'
  - 'Waiver-Möglichkeit mit Veröffentlichungspflicht — der zentrale Unterschied zur KI-VO: Pflichten sind
    abdingbar, wenn die Behörde dies begründet.'
  - Jährliche öffentliche KI-Anwendungsfall-Inventare bleiben bestehen.
  eu_anbieter_relevanz: 'Für jeden europäischen Anbieter mit US-Behördengeschäft der praktische Maßstab.
    Gute Nachricht: Die Artefakte, die die KI-VO ohnehin verlangt — technische Dokumentation, Risikomanagement,
    Testprotokolle, Vorkehrungen zur menschlichen Aufsicht — decken die Anforderungen an „high-impact
    AI" weitgehend ab. Zu ergänzen sind das behördenspezifische Impact-Assessment-Format und die Mitwirkung
    an öffentlichen Anwendungsfall-Inventaren, die Produktinformationen offenlegen können.

    '
