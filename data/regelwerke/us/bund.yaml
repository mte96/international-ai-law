- id: us-title-vii
  jurisdiktion: us
  kurztitel: Title VII Civil Rights Act (42 U.S.C. § 2000e)
  offizieller_titel: 'Title VII of the Civil Rights Act of 1964 — Equal Employment Opportunity, kodifiziert
    in 42 U.S.C. §§ 2000e ff., geändert durch den Civil Rights Act of 1991

    '
  fundstelle: Pub. L. 88-352, tit. VII, 78 Stat. 253; 42 U.S.C. §§ 2000e bis 2000e-17
  verfahrensnummer: H.R. 7152, 88. Kongress
  status: anwendbar
  status_detail: 'Seit 02.07.1965 anwendbar. Trotz des Rückzugs der EEOC-Leitlinien zum KI-Einsatz im
    Jahr 2025 bleibt Title VII die tragende Anspruchsgrundlage gegen algorithmische Personalauswahl —
    die Rechtsprechung (Mobley v. Workday) hat sich unabhängig von den Behördenleitlinien fortentwickelt.

    '
  kurzbeschreibung: '§ 2000e-2(a) verbietet Arbeitgebern, wegen Rasse, Hautfarbe, Religion, Geschlecht
    oder nationaler Herkunft zu benachteiligen (a)(1) oder Beschäftigte so einzuteilen, dass ihnen Beschäftigungschancen
    entzogen werden (a)(2). § 2000e-2(k) kodifiziert die disparate-impact-Dogmatik: Der Kläger muss eine
    bestimmte Beschäftigungspraxis und deren benachteiligende Wirkung darlegen, der Arbeitgeber muss Geschäftsnotwendigkeit
    und Stellenbezug nachweisen, der Kläger kann eine gleichwertige mildere Alternative aufzeigen. § 2000e(b)
    definiert den Arbeitgeber einschließlich seiner „agents“ — die Vorschrift, über die Mobley v. Workday
    den Softwareanbieter selbst erfasst.

    '
  inkrafttreten:
    datum: 1965-07-02
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section2000e-2&num=0&edition=prelim
  anwendungsdaten:
  - datum: 1991-11-21
    was_gilt: 'Civil Rights Act of 1991 fügt § 2000e-2(k) ein und kodifiziert damit die disparate-impact-Analyse
      gegen Wards Cove.

      '
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section2000e-2&num=0&edition=prelim
  - datum: 2024-07-12
    was_gilt: 'Mobley v. Workday (N.D. Cal.): Der Anbieter eines Auswahlsystems kann „agent“ des Arbeitgebers
      und damit selbst Adressat des Title VII sein.

      '
    verifiziert: false
    quelle: https://www.eeoc.gov/
  themenachsen:
  - arbeit
  - grundrechte
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'DIE ZENTRALE NEUERUNG: Mobley v. Workday erstreckt die Haftung über die „agent“-Definition des §
    2000e(b) auf den Softwareanbieter. Damit haftet erstmals ein KI-Anbieter unmittelbar nach Antidiskriminierungsrecht,
    ohne Arbeitgeber zu sein — funktional das, was Kalifornien mit den FEHA-ADS-Regeln normiert hat.'
  - '§ 2000e-2(k) disparate impact ist die eigentlich passende Figur für algorithmische Auswahl: Es bedarf
    keiner Absicht, nur einer nachweisbaren statistischen Benachteiligung. Die Vier-Fünftel-Regel der
    EEOC (29 C.F.R. § 1607.4(D)) ist der praktische Schwellenwert, den auch die Bias Audits nach NYC Local
    Law 144 abbilden.'
  - 'Beweisproblem der Klägerseite: Ohne Zugang zum Modell ist die „bestimmte Beschäftigungspraxis“ schwer
    zu benennen. Deshalb ist die Kollektivklage (Mobley collective action nach ADEA) und die Vier-Fünftel-Statistik
    das eigentliche Kampfmittel, nicht die Modellprüfung.'
  - 'Das Zusammenspiel mit dem Rückzug der Behördenleitlinien 2025 ist der bemerkenswerteste Befund: Die
    materielle Rechtslage hat sich nicht geändert, nur die behördliche Unterstützung ist entfallen — durchgesetzt
    wird jetzt privat.'
  eu_anbieter_relevanz: 'Für europäische HR-Softwareanbieter mit US-Kunden folgt aus Mobley v. Workday
    eine unmittelbare Eigenhaftung, unabhängig davon, wie die Verträge die Verantwortung zuweisen. Die
    Parallele zur KI-VO ist eng: Was dort Art. 26 (Betreiberpflichten) vom Art. 16 (Anbieterpflichten)
    trennt, wird hier über die agent-Doktrin zusammengeführt. Praktisch heißt das: Bias-Testing nicht
    nur anbieten, sondern durchführen und dokumentieren — es ist in beiden Ordnungen das entscheidende
    Verteidigungsmittel.

    '
  dokumente:
  - datum: 1991-11-21
    typ: endfassung
    titel: 42 U.S.C. § 2000e-2 — Unlawful employment practices
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section2000e-2&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Amtlicher Text; (a) Verbotstatbestände, (k) Beweislastverteilung bei disparate impact.

      '
  offene_punkte:
  - Ob die agent-Doktrin auch Modellzulieferer erfasst, die nicht selbst auswählen (offen nach Mobley
    SAC).
  - Ob die Vier-Fünftel-Regel nach dem Rückzug der EEOC-Leitlinien Bestand hat.
