    — Schutz für Beschäftigte, die Sicherheits- oder Rechtsverstöße melden.'
  - 'Kennzeichnung: AI Labeling Act of 2026 (Senat, 25. Juni 2026) — Offenlegungspflicht für KI-generierte
    Inhalte bei Plattformen mit mindestens 10 Mio. US-Nutzern, Durchsetzung durch die FTC, technische
    Standards durch NIST. Funktional das Gegenstück zu Art. 50 KI-VO.'
  - 'Wahlen: H.R. 5272 und S. 1213 Protect Elections from Deceptive AI Act.'
  - 'China und Modellsicherheit: H.R. 8283 Deterring American AI Model Theft Act of 2026 (Moolenaar u.
    a.) — Strafbarkeit des Diebstahls amerikanischer Modellgewichte; H.R. 7058 Foreign Adversary AI Risk
    Assessment and Diplomacy Act; H.R. 6996 Full AI Stack Export Promotion Act.'
  - 'Rechenzentren und Energie: S. 4214 AI Data Center Moratorium Act (Sanders); S. 4213 Data Center Water
    and Energy Transparency Act (Durbin); H.R. 6529 Protecting Families from AI Data Center Energy Costs
    Act (Beyer u. a.).'
  - 'Kinder und Jugend: H.R. 8382 — Verbot von KI-Chatbot-Komponenten in Kinderprodukten, die erste produktbezogene
    Bundesbeschränkung; S. 4199 Youth AI Privacy Act.'
  - 'Sonstige: H.R. 238 Healthy Technology Act (KI als Verschreibungsberechtigte); H.R. 7997 Research
    and Oversight of AI in Courts Act; H.R. 7786 AI Fraud Accountability Act; S. 1290 AI and Critical
    Technology Workforce Framework Act; H.R. 3679 Small Business AI Advancement Act; H.R. 1694 AI Accountability
    Act; H.R. 2152 AI PLAN Act.'
  eu_anbieter_relevanz: 'Drei Vorlagen verdienen aktive Beobachtung, weil sie unmittelbar an KI-VO-Pflichten
    anschließen und deren Artefakte wiederverwendbar machen würden: H.R. 8094 (Trainingsdaten-Zusammenfassungen,
    vgl. Art. 53 KI-VO), der AI Labeling Act (Kennzeichnung, vgl. Art. 50 KI-VO) und S. 1792 (Whistleblower-Schutz,
    vgl. die Meldewege der KI-VO). Sollte eine davon Gesetz werden, sinken die Grenzkosten der US-Compliance
    für Anbieter, die europäisch bereits konform sind, erheblich. H.R. 8283 (Modellgewichtsdiebstahl)
    ist für die Sicherungsanforderungen an Modellgewichte relevant.

    '
