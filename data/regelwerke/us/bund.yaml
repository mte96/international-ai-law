- id: us-patent-act
  jurisdiktion: us
  kurztitel: Patent Act (35 U.S.C.)
  offizieller_titel: 'Patent Act of 1952, kodifiziert als Title 35 of the United States Code — Patents,
    geändert durch den Leahy-Smith America Invents Act (Pub. L. 112-29)

    '
  fundstelle: Act of July 19, 1952, ch. 950, 66 Stat. 792; 35 U.S.C. §§ 1 ff.
  verfahrensnummer: H.R. 1249 (America Invents Act, 112. Kongress)
  status: anwendbar
  status_detail: 'Seit 01.01.1953 anwendbar; die für KI maßgebliche Definition des „inventor“ in § 100(f)
    wurde erst durch den America Invents Act mit Wirkung zum 16.09.2011 eingefügt. Genau diese Definition
    trägt die Entscheidung Thaler v. Vidal (Fed. Cir. 2022): „individual“ meint eine natürliche Person,
    eine KI kann nicht Erfinder sein. Der Supreme Court hat die Revision am 24.04.2023 nicht angenommen.

    '
  kurzbeschreibung: '§ 101 bestimmt den patentfähigen Gegenstand („any new and useful process, machine,
    manufacture, or composition of matter“) und ist über die Alice/Mayo-Rechtsprechung zugleich die Hürde
    für Software- und Modellansprüche. § 100(f) definiert den Erfinder als „the individual or, if a joint
    invention, the individuals collectively who invented or discovered the subject matter of the invention“.
    § 115 verlangt vom Erfinder einen Eid oder eine Erklärung, sich für den Erfinder zu halten — eine
    Pflicht, die eine Maschine nicht erfüllen kann. Zusammen ergeben die drei Vorschriften die Antwort
    des US-Rechts auf die KI-Erfinderschaft: Der Beitrag der Maschine ist patentierbar, aber nur, wenn
    ein Mensch benannt wird, der einen erheblichen schöpferischen Beitrag geleistet hat.

    '
  inkrafttreten:
    datum: 1953-01-01
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?path=/prelim@title35&edition=prelim
  anwendungsdaten:
  - datum: 2011-09-16
    was_gilt: America Invents Act fügt die Legaldefinitionen § 100(f)-(j) ein, darunter „inventor“ = „individual“.
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid%3AUSC-prelim-title35-section100&num=0&edition=prelim
  - datum: 2024-02-13
    was_gilt: 'USPTO veröffentlicht die Inventorship Guidance for AI-Assisted Inventions (89 FR 10043)
      — Erfinderschaft nur bei erheblichem menschlichem Beitrag nach den Pannu-Kriterien.

      '
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2024/02/13/2024-02623/inventorship-guidance-for-ai-assisted-inventions
  themenachsen:
  - urheberrecht
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - '§ 100(f) „individual“: Der Federal Circuit stützt Thaler v. Vidal ausschließlich auf den Wortlaut
    — „individual“ bedeute im allgemeinen Sprachgebrauch und in der Rechtsprechung des Supreme Court eine
    natürliche Person. Damit läuft die Entscheidung strukturell parallel zur urheberrechtlichen Thaler-Linie
    zu 17 U.S.C. § 102(a), ohne dass eine der beiden auf die andere gestützt wäre.'
  - § 115 verlangt eine Erklärung des Erfinders unter Strafandrohung. Eine Maschine kann sie nicht abgeben,
    ein Anmelder kann sie nicht für sie abgeben — die verfahrensrechtliche Sperre wirkt unabhängig von
    der materiellen Frage.
  - '§ 101 ist die eigentliche Hürde für KI-Erfindungen mit menschlichem Erfinder: Nach Alice v. CLS Bank
    sind abstrakte Ideen ohne erfinderisches Konzept nicht patentfähig, was Modellarchitekturen und Trainingsverfahren
    regelmäßig trifft.'
  - 'NICHT: Der Urteilsbestand enthält bislang keine US-Patententscheidung. Thaler v. Vidal (Fed. Cir.,
    43 F.4th 1207) ist erfasst nur über die Regelwerksebene und die USPTO-Leitlinie.'
  eu_anbieter_relevanz: 'Die US-Antwort deckt sich im Ergebnis mit EPA (Entscheidungen J 8/20 und J 9/20
    zu DABUS) und mit § 37 PatG: Erfinder kann nur eine natürliche Person sein. Praktisch bedeutsam ist
    die abweichende Begründung: Das EPA stützt sich auf die Rechtsfähigkeit, der Federal Circuit auf den
    Wortlaut „individual“. Für europäische Anmelder folgt daraus dieselbe Handlungsanweisung — der menschliche
    Beitrag zur Konzeption ist zu dokumentieren, und zwar erfindungsspezifisch, nicht pauschal für das
    ganze Portfolio.

    '
  dokumente:
  - datum: 2011-09-16
    typ: endfassung
    titel: 35 U.S.C. § 100 — Definitions
    url: https://uscode.house.gov/view.xhtml?req=granuleid%3AUSC-prelim-title35-section100&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Am amtlichen Text geprüft: § 100(f) definiert „inventor“ als „the individual or, if a joint
      invention, the individuals collectively who invented or discovered the subject matter of the invention“;
      eingefügt durch AIA § 3(a)(2).

      '
  - datum: 2024-02-13
    typ: leitlinie
    titel: Inventorship Guidance for AI-Assisted Inventions
    url: https://www.federalregister.gov/documents/2024/02/13/2024-02623/inventorship-guidance-for-ai-assisted-inventions
    sprache: en
    urheber: United States Patent and Trademark Office
    verifiziert: true
    notiz: 'Konkretisiert, wann der menschliche Beitrag für die Erfinderbenennung genügt (Pannu-Faktoren).

      '
  offene_punkte:
  - Ob § 101 KI-gestützte Verfahrensansprüche nach Alice trägt, ist einzelfallabhängig und im Urteilsbestand
    nicht abgebildet.
  - Keine US-Patententscheidung — Thaler v. Vidal wäre zu erfassen.
