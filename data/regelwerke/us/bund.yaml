- id: us-bis-ai-diffusion-rule
  jurisdiktion: us
  kurztitel: AI Diffusion Rule (zurückgezogen)
  offizieller_titel: 'Framework for Artificial Intelligence Diffusion — Interim Final Rule des Bureau
    of Industry and Security

    '
  fundstelle: 90 FR 4544 (15. Januar 2025); zurückgenommen Mai 2025
  verfahrensnummer: BIS Interim Final Rule, Januar 2025
  status: aufgehoben
  status_detail: 'Am 13. Januar 2025 als Interim Final Rule erlassen, mit Wirksamkeit zum 15. Mai 2025.
    Vor Wirksamwerden im Mai 2025 von BIS zurückgenommen. Der Rechnungshof (GAO) hat die Anwendbarkeit
    des Congressional Review Act auf die Rücknahme geprüft (B-337935). Ersetzt durch Einzelfallpolitik
    und ab Januar 2026 durch eine neue Lizenzprüfungspolitik.

    '
  kurzbeschreibung: 'Die AI Diffusion Rule hätte die weltweite Verbreitung fortgeschrittener KI-Rechenleistung
    und geschlossener Modellgewichte über ein dreistufiges Ländermodell gesteuert: eine kleine Gruppe
    enger Verbündeter ohne Mengenbeschränkung, eine große Mittelgruppe mit Länderobergrenzen und Validated-End-User-Programmen,
    und die Embargoländer. Sie war das erste Regelwerk überhaupt, das Modellgewichte als exportkontrollpflichtiges
    Gut behandelte. Die Rücknahme kam nach massiver Kritik verbündeter Staaten und der Industrie an der
    Einordnung enger Partner in die Mittelgruppe.

    '
  inkrafttreten:
    datum: 2025-01-13
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/01/15/2025-00636/framework-for-artificial-intelligence-diffusion
    fundstelle_norm: 'Interim Final Rule "Framework for Artificial Intelligence Diffusion", Federal-Register-Dokument
      2025-00636, citation 90 FR 4544, publication_date 2025-01-15, effective_on 2025-01-13. Die Regel
      wurde also zwei Tage vor der Veröffentlichung wirksam (Tag der öffentlichen Auslegung). Zuvor gespeichert:
      15.01.2025 — das ist der Tag der Veröffentlichung, nicht der Wirksamkeit.'
  anwendungsdaten:
  - datum: 2025-01-13
    was_gilt: Erlass als Interim Final Rule; vorgesehene Wirksamkeit 15.05.2025.
    verifiziert: false
    quelle: https://www.wilmerhale.com/en/insights/client-alerts/20250515-us-export-controls-on-ai-diffusion-officially-paused-but-new-guidance-elevates-risk-for-ai-related-exports
  - datum: 2025-05-13
    was_gilt: 'Rücknahme durch BIS vor Wirksamwerden; gleichzeitig Leitlinien zu fortgeschrittenen Rechen-Schaltkreisen
      und eine Mitteilung über „high probability"-Kenntnis bei Umgehungsgeschäften.

      '
    verifiziert: false
    quelle: https://www.wiley.law/alert-BIS-Rescinds-AI-Diffusion-Rule
  themenachsen:
  - sicherheit-export
  - gpai
  - marktzugang
  - wettbewerb
  regelungsschwerpunkte:
  - Erstmalige Erfassung von Modellgewichten als Exportkontrollgut — die konzeptionell folgenreichste
    Neuerung, unabhängig von der Rücknahme. Offene Gewichte waren ausgenommen.
  - Dreistufiges Ländermodell mit Länderobergrenzen für Rechenleistung; mehrere EU-Mitgliedstaaten wären
    in der Mittelgruppe gelandet — der Hauptgrund für den europäischen Widerstand.
  - Ersetzt durch eine Kombination aus Einzelfalllizenzierung, Warnhinweisen zu bestimmten chinesischen
    Chips und verschärften Sorgfaltspflichten — mehr Unsicherheit, nicht weniger.
  - 'GAO-Prüfung B-337935 zur CRA-Anwendbarkeit auf die Rücknahme: ein seltener Fall, in dem die Aufhebung
    einer Regel selbst überprüft wird.'
  eu_anbieter_relevanz: 'Die Rücknahme war für europäische Anbieter eine unmittelbare Entlastung, weil
    Länderobergrenzen für Rechenleistung in EU-Mitgliedstaaten entfallen sind. Der konzeptionelle Präzedenzfall
    bleibt aber bestehen: Modellgewichte können exportkontrollpflichtig sein. Wer geschlossene Modelle
    mit US-Ursprungstechnologie weiterentwickelt oder US-Beschleuniger nutzt, sollte die De-minimis- und
    Direct-Product-Regeln der EAR prüfen, bevor Gewichte in Drittländer übertragen werden.

    '
