- id: us-eo-14365
  jurisdiktion: us
  kurztitel: EO 14365 (Preemption einzelstaatlicher KI-Gesetze)
  offizieller_titel: 'Executive Order 14365 of December 11, 2025 — Ensuring a National Policy Framework
    for Artificial Intelligence

    '
  fundstelle: 90 FR 58499 (16. Dezember 2025)
  verfahrensnummer: EO 14365
  status: anwendbar
  status_detail: 'In Kraft; Umsetzung uneinheitlich. Die AI Litigation Task Force beim Justizministerium
    wurde eingerichtet und ist seit 24.04.2026 als Intervenientin im Verfahren xAI v. Weiser gegen den
    Colorado AI Act tätig. Die vom Handelsministerium bis 11.03.2026 geschuldete Liste „onerous" einzelstaatlicher
    KI-Gesetze war bei Rechercheschluss nicht veröffentlicht. Die FTC legte am 01.07.2026 einen Entwurf
    des geforderten Policy Statement vor. Der Stand der FCC-Rulemaking konnte nicht abschließend geklärt
    werden.

    '
  kurzbeschreibung: 'Die zentrale bundesrechtliche Antwort auf den Flickenteppich einzelstaatlicher KI-Gesetze,
    nachdem ein gesetzliches Moratorium zweimal gescheitert war. Die Anordnung verdrängt einzelstaatliches
    Recht nicht selbst — sie errichtet einen Apparat, der es angreifen soll: eine Prozessführungseinheit
    beim Justizministerium, eine Negativliste des Handelsministeriums, Förderkonditionierung über BEAD-Mittel,
    ein FTC-Policy-Statement zur impliziten Verdrängung und ein FCC-Verfahren zu bundeseinheitlichen Melde-
    und Offenlegungsstandards. Ausdrücklich unberührt bleiben einzelstaatliche Regelungen zu Kinderschutz,
    Rechenzentrums- Standortrecht und staatlicher Eigenbeschaffung.

    '
  inkrafttreten:
    datum: 2025-12-11
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/12/16/2025-23092/ensuring-a-national-policy-framework-for-artificial-intelligence
  anwendungsdaten:
  - datum: 2026-01-10
    was_gilt: '30 Tage: Einrichtung der AI Litigation Task Force durch den Attorney General.'
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/12/16/2025-23092/ensuring-a-national-policy-framework-for-artificial-intelligence
  - datum: 2026-03-11
    was_gilt: '90 Tage: Liste des Handelsministeriums über einzelstaatliche KI-Gesetze, die mit der Bundespolitik
      kollidieren; BEAD-Mitteilung zur Förderkonditionierung; FTC-Policy-Statement; Einleitung des FCC-Verfahrens.

      '
    verifiziert: true
    quelle: https://www.whitecase.com/insight-alert/state-ai-laws-under-federal-scrutiny-key-takeaways-executive-order-establishing
  themenachsen:
  - governance
  - marktzugang
  - wettbewerb
  - grundrechte
  - content
  regelungsschwerpunkte:
  - 'Sec. 3: AI Litigation Task Force beim DOJ; Angriffsgründe sind Dormant Commerce Clause, bundesrechtliche
    Verdrängung und First Amendment.'
  - 'Sec. 4: Handelsministerium identifiziert „onerous laws that conflict", insbesondere solche, die eine
    Veränderung von Modellausgaben oder verfassungsrechtlich problematische Offenlegungen verlangen. Colorado
    SB24-205 wird in der Begründung namentlich genannt.'
  - 'Sec. 6: FCC-Rulemaking zu einem bundeseinheitlichen KI-Melde- und Offenlegungsstandard mit Verdrängungswirkung
    — der rechtlich anspruchsvollste Teil, weil die FCC-Zuständigkeit für KI-Modelle zweifelhaft ist.'
  - 'Sec. 7: FTC-Statement dazu, wann einzelstaatliche Vorgaben, die „alterations to truthful outputs"
    verlangen, gegen das Verbot unlauterer und irreführender Praktiken verstoßen — die Umkehrung des klassischen
    Verbraucherschutzarguments.'
  - 'Sec. 5 BEAD-Konditionierung wörtlich: "States with onerous AI laws identified pursuant to section
    4 of this order are ineligible for non-deployment funds, to the maximum extent allowed by Federal
    law." Rechtlich angreifbar wegen der Zweckbindung des Infrastructure Investment and Jobs Act und der
    Spending-Clause-Rechtsprechung (South Dakota v. Dole; NFIB v. Sebelius).'
  - 'Sec. 8 Ausnahmen des Gesetzesvorschlags wörtlich: "child safety protections"; "AI compute and data
    center infrastructure, other than generally applicable permitting reforms"; "State government procurement
    and use of AI"; "other topics as shall be determined". Die letzte, offene Kategorie relativiert den
    Ausnahmekatalog erheblich.'
  - 'Rechtsdogmatisch entscheidend: Eine Executive Order kann einzelstaatliches Recht nicht verdrängen.
    Preemption setzt Bundesgesetz oder eine wirksame Bundesregelung voraus. Die Anordnung ist deshalb
    ein Zielmechanismus, kein Verdrängungsakt.'
  eu_anbieter_relevanz: 'Die praktisch wichtigste Einordnung: Für einen europäischen Anbieter bedeutet
    EO 14365 KEINE Entlastung von einzelstaatlichen Pflichten. Colorado, Kalifornien, Texas, Illinois
    und New York gelten fort, solange kein Gericht sie aufhebt oder der Kongress sie verdrängt. Die Anordnung
    erzeugt lediglich Rechtsunsicherheit über die Fortgeltungsdaür. Compliance-Empfehlung: Weiterhin auf
    das strengste einschlägige Landesrecht auslegen; die Dokumentationslasten aus KI-VO-Compliance decken
    den größten Teil des kalifornischen und Colorado-Regimes ohnehin ab. Zusätzlich zu beobachten ist
    der gegenläufige Effekt: Wer Modellausgaben zur Erfüllung europäischer Vorgaben steuert, kann nach
    Sec. 4 und dem FTC-Entwurf ins Visier geraten.

    '
  dokumente:
  - datum: 2025-12-16
    typ: endfassung
    titel: Executive Order 14365 — Ensuring a National Policy Framework for Artificial Intelligence
    url: https://www.federalregister.gov/documents/2025/12/16/2025-23092/ensuring-a-national-policy-framework-for-artificial-intelligence
    sprache: en
    urheber: The White House / Office of the Federal Register
    verifiziert: true
    notiz: Amtlicher Volltext, 90 FR 58499.
  - datum: 2026-01-15
    typ: stellungnahme
    titel: 'State AI laws under federal scrutiny: Key takeaways from the executive order establishing
      federal AI policy framework'
    url: https://www.whitecase.com/insight-alert/state-ai-laws-under-federal-scrutiny-key-takeaways-executive-order-establishing
    sprache: en
    urheber: White & Case LLP
    verifiziert: true
    notiz: 'Systematische Aufbereitung der Fristen und der verfassungsrechtlichen Grenzen; hält fest,
      dass die Anordnung einzelstaatliches Recht allein nicht verdrängen kann.

      '
  - datum: 2026-04-24
    typ: stellungnahme
    titel: DOJ Joins xAI in Lawsuit Challenging Colorado AI Act
    url: https://www.jenner.com/en/news-insights/client-alerts/doj-joins-xai-in-lawsuit-challenging-colorado-ai-act
    sprache: en
    urheber: Jenner & Block LLP
    verifiziert: true
    notiz: 'Belegt die erste operative Handlung der Task Force: Intervention in xAI v. Weiser, D. Colo.
      1:26-cv-01515. Klage von xAI am 09.04.2026, DOJ-Interventionsantrag am 24.04.2026.

      '
  - datum: 2026-01-20
    typ: stellungnahme
    titel: The AI Preemption Executive Order's BEAD Strategy Faces Steep Legal Hurdles
    url: https://www.lawfaremedia.org/article/the-ai-preemption-executive-order-s-bead-strategy-faces-steep-legal-hurdles
    sprache: en
    urheber: Lawfare
    verifiziert: false
    notiz: 'Analysiert die Spending-Clause-Probleme der BEAD-Konditionierung. In dieser Sitzung nur über
      Suchtreffer belegt, nicht abgerufen.

      '
  offene_punkte:
  - Liste des Handelsministeriums nach Sec. 4 bei Rechercheschluss nicht veröffentlicht — Frist 11.03.2026
    verstrichen.
  - Stand des FCC-Verfahrens nach Sec. 6 nicht verifiziert.
  - Ausgang von xAI v. Weiser offen; xAI hat den Antrag auf einstweilige Verfügung bis zum Abschluss des
    Rulemaking des Colorado Attorney General zurückgestellt.
  - Ob weitere Klagen gegen Kalifornien (TFAIA) oder Illinois folgen.
