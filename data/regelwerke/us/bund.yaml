- id: us-bis-chip-lizenzpolitik-2026
  jurisdiktion: us
  kurztitel: BIS-Lizenzpolitik für KI-Chips (Januar 2026)
  offizieller_titel: 'Bureau of Industry and Security — Revidierte Lizenzprüfungspolitik für fortgeschrittene
    Rechen-Waren (KI-Halbleiter) mit Bestimmung China und Macau

    '
  fundstelle: 91 FR 1684; Federal-Register-Dokument 2026-00789, veröffentlicht und wirksam am 15.01.2026
  verfahrensnummer: BIS-Regel 2026-00789
  status: anwendbar
  status_detail: 'In Kraft seit 15. Januar 2026. Ersetzt die bisherige Praxis der „presumption of denial"
    für Chips bis zur Leistungsklasse H200 und AMD MI325X durch eine Einzelfallprüfung mit umfangreichen
    Zusicherungen. Die Angaben stammen aus einer Kanzleianalyse; der Federal-Register-Volltext konnte
    nicht abgerufen werden.

    '
  kurzbeschreibung: 'Kodifiziert die Chip-Exportpolitik der Administration. Für Chips, die die Leistungsklasse
    H200 beziehungsweise AMD MI325X nicht überschreiten, gilt bei Ausfuhren nach China und Macau statt
    der Ablehnungsvermutung eine Einzelfallprüfung. Der Exporteur muss zusichern: technische Spezifikationen
    durch unabhängige US-Prüfstellen verifiziert; die nach China ausgeführte aggregierte Rechenleistung
    liegt unter 50 Prozent der an US-Kunden gelieferten Einheiten; keine Umlenkung globaler Fertigungskapazität
    zulasten von US-Endnutzern; dokumentierte Sicherheits- und Know-your-Customer-Verfahren beim Kunden;
    Benennung der Fernnutzer in Ländern besonderer Besorgnis. Bei KI-as-a-Service-Konstellationen ist
    zusätzlich zuzusichern, dass keine unerklärte Übertragung von Modellgewichten und kein Fernzugriff
    gelisteter Parteien auf die trainierten Algorithmen erfolgt.

    '
  inkrafttreten:
    datum: 2026-01-15
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2026/01/15/2026-00789/revision-to-license-review-policy-for-advanced-computing-commodities
    fundstelle_norm: '"Revision to License Review Policy for Advanced Computing Commodities", Federal-Register-Dokument
      2026-00789, citation 91 FR 1684, publication_date 2026-01-15, effective_on 2026-01-15. Die zuvor
      gespeicherte Angabe "veröffentlicht 13. Januar 2026" trifft nicht zu; Veröffentlichung und Wirksamkeit
      fallen auf den 15.01.2026.'
  anwendungsdaten:
  - datum: 2026-01-13
    was_gilt: Veröffentlichung der Regel.
    verifiziert: false
    quelle: https://www.mayerbrown.com/en/insights/publications/2026/01/administration-policies-on-advanced-ai-chips-codified
  - datum: 2026-01-15
    was_gilt: Wirksamwerden; Umstellung auf Einzelfallprüfung mit Zusicherungskatalog.
    verifiziert: false
    quelle: https://www.mayerbrown.com/en/insights/publications/2026/01/administration-policies-on-advanced-ai-chips-codified
  themenachsen:
  - sicherheit-export
  - gpai
  - marktzugang
  - wettbewerb
  - vertrag
  regelungsschwerpunkte:
  - Die 50-Prozent-Zusicherung bindet Exportmengen an die Belieferung des US-Marktes — funktional das,
    was der gescheiterte GAIN AI Act gesetzlich hätte anordnen sollen, nun als Lizenzbedingung.
  - Verifikation technischer Spezifikationen durch unabhängige US-Prüfstellen — eine neue Zertifizierungsschicht
    in der Lieferkette.
  - 'Modellgewichte im KI-as-a-Service-Kontext: Zusicherung, dass keine „undisclosed transfer of model
    weights" und kein Fernzugriff gelisteter Parteien auf trainierte Algorithmen erfolgt. Damit lebt die
    Gewichtskontrolle der aufgehobenen Diffusion Rule als Lizenzbedingung fort.'
  - 'Benennung der Fernnutzer: Cloud- und Hosting-Anbieter müssen ihre Kundenstruktur in Ländern besonderer
    Besorgnis offenlegen.'
  eu_anbieter_relevanz: 'Erheblicher praktischer Aufwand für europäische Cloud- und Rechenzentrumsbetreiber
    sowie für Modellanbieter, die auf US-Beschleunigern trainieren. Drei Handlungspunkte: Erstens sind
    Know-your-Customer-Verfahren so aufzusetzen, dass Fernnutzer aus Ländern besonderer Besorgnis identifizierbar
    sind — das kollidiert potenziell mit der Datenminimierung nach DSGVO und ist über Zweckbestimmung
    und Rechtsgrundlage sauber abzubilden. Zweitens sind Weitergaben von Modellgewichten an Konzerngesellschaften
    oder Partner in Drittländern exportkontrollrechtlich zu bewerten, auch wenn keine physische Ware bewegt
    wird. Drittens sollten Beschaffungsverträge für Beschleuniger die Zusicherungspflichten und deren
    Weiterreichung an Endkunden ausdrücklich regeln, weil sie sonst beim europäischen Betreiber hängen
    bleiben.

    '
