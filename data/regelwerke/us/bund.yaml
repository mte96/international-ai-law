- id: us-sherman-act
  jurisdiktion: us
  kurztitel: Sherman Act (15 U.S.C. §§ 1-7)
  offizieller_titel: 'Sherman Antitrust Act of 1890, kodifiziert in Title 15, Chapter 1 of the United
    States Code

    '
  fundstelle: Act of July 2, 1890, ch. 647, 26 Stat. 209; 15 U.S.C. §§ 1-7
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Seit 1890 in Kraft. Section 1 trägt sämtliche US-Verfahren zur algorithmischen Preisbildung:
    Gibson v. Cendyn (Hotelpreise, abgewiesen), Cornish-Adebiyi v. RealPage (Mietpreise, erstinstanzlich
    abgewiesen, Third Circuit 2026), DOJ v. RealPage (Vergleich 2025) und Agri Stats (Vergleich 2026).
    Der Streitstand hat sich binnen zwei Jahren von „gemeinsame Software genügt nicht“ zu „Einspeisung
    vertraulicher eigener Daten kann genügen“ verschoben.

    '
  kurzbeschreibung: '§ 1 erklärt jeden Vertrag, jede Verbindung in Form eines Trusts oder anderweitig
    und jede Verschwörung zur Beschränkung des zwischenstaatlichen Handels für rechtswidrig und stellt
    sie unter Strafe (bis 100 Mio. USD für Unternehmen, bis 1 Mio. USD und zehn Jahre für natürliche Personen).
    Tatbestandlich verlangt § 1 eine Willensübereinstimmung; einseitiges Parallelverhalten genügt nicht.
    Für algorithmische Preisbildung ist damit entscheidend, ob die gemeinsame Nutzung einer Empfehlungssoftware
    die Vereinbarung ersetzt (hub and spoke: Fehlt der „rim“, scheitert die Klage).

    '
  inkrafttreten:
    datum: 1890-07-02
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section1&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2004-06-22
    was_gilt: 'Antitrust Criminal Penalty Enhancement Act erhöht den Strafrahmen des § 1 auf 100 Mio.
      USD bzw. zehn Jahre.

      '
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section1&num=0&edition=prelim
  themenachsen:
  - wettbewerb
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'DIE ENTSCHEIDENDE UNTERSCHEIDUNG: Nicht die gemeinsame Nutzung derselben Software begründet die Vereinbarung,
    sondern die wissentliche Einspeisung eigener vertraulicher Wettbewerbsdaten in einen von Wettbewerbern
    gemeinsam genutzten Algorithmus. Gibson v. Cendyn verneinte den ersten Fall, Cornish-Adebiyi vor dem
    Third Circuit prüft den zweiten.'
  - 'Hub-and-Spoke-Dogmatik: Der Softwareanbieter ist der „hub“, die Wettbewerber die „spokes“; ohne „rim“
    — den horizontalen Konsens zwischen den Wettbewerbern — fehlt die Vereinbarung. Der Vortrag zum Datenfluss
    ersetzt in der neuen Rechtsprechung den Vortrag zur Absprache.'
  - 'Abgrenzung zum zulässigen Benchmarking: Agri Stats zeigt die Grenze — aggregierte, verzögerte und
    anonymisierte Branchendaten sind zulässig, disaggregierte, aktuelle und zuordenbare Preis-, Mengen-
    und Kostendaten sind es nicht.'
  - Die Vergleiche (DOJ v. RealPage 2025, RealPage MDL 2026, Agri Stats 2026) enthalten Verhaltensauflagen
    zur Datenverarbeitung, die faktisch zu Compliance-Standards für Preisempfehlungssoftware werden —
    praktisch bedeutsamer als die streitigen Entscheidungen.
  eu_anbieter_relevanz: 'Funktional das Gegenstück zu Art. 101 AEUV und § 1 GWB, mit einem wichtigen Unterschied:
    Das US-Recht kennt die Kategorie der abgestimmten Verhaltensweise („concerted practice“) nicht als
    eigenständigen Tatbestand, verlangt also eine Vereinbarung — was die Hürde nominell erhöht. Für Anbieter
    von Preis-, Vergütungs- oder Kapazitätsoptimierung folgt beiderseits dieselbe Produktanforderung:
    Eingangsdaten des Kunden dürfen nicht in Empfehlungen für dessen Wettbewerber einfließen, und die
    Trennung muss technisch nachweisbar sein, nicht nur vertraglich zugesichert.

    '
  dokumente:
  - datum: 1890-07-02
    typ: endfassung
    titel: 15 U.S.C. § 1 — Trusts, etc., in restraint of trade illegal; penalty
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section1&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Am amtlichen Text geprüft: Wortlaut und Strafrahmen (100 Mio. USD / 1 Mio. USD / zehn Jahre).

      '
  offene_punkte:
  - Entscheidung des Third Circuit in Cornish-Adebiyi steht aus (Stand 05.09.2026 als Rechtsmittelverfahren
    geführt).
  - Ob ein Anbieter selbst als Kartellant haftet, wenn er die Daten ohne Wissen der Kunden zusammenführt.
