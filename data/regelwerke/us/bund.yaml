  pruefvermerk:
  - Bestaetigt. Mehrere unabhaengige Kanzleianalysen datieren die beiden ersten AI-washing-Verfahren auf
    den 18.03.2024. Das Datum ist als Anker fuer eine Verfolgungspraxis gesetzt, nicht als Inkrafttreten
    einer Norm — das steht so auch im fundstelle_norm-Feld des Eintrags. Der Ruecknahmestatus der 2023
    vorgeschlagenen Predictive-Data-Analytics-Regel bleibt ungeklaert.
- id: us-cfpb-rueckzug
  jurisdiktion: us
  kurztitel: CFPB — Rücknahme der KI-Leitlinien
  offizieller_titel: 'Consumer Financial Protection Bureau — Interpretive Rules, Policy Statements, and
    Advisory Opinions; Withdrawal

    '
  fundstelle: 90 FR 20084 (12. Mai 2025)
  verfahrensnummer: CFPB-Bekanntmachung 2025-08286
  status: aufgehoben
  status_detail: 'Am 12. Mai 2025 hat das CFPB 67 Auslegungsregeln, Grundsatzerklärungen und Beratungsstellungnahmen
    mit sofortiger Wirkung zurückgenommen — darunter beide für KI maßgeblichen Rundschreiben. Die zugrunde
    liegenden Gesetze (ECOA, Regulation B, FCRA) gelten unverändert fort; entfallen ist nur die behördliche
    Auslegung.

    '
  kurzbeschreibung: 'Die KI-relevanten Rundschreiben des CFPB betrafen die Begründungspflicht bei ablehnenden
    Kreditentscheidungen: Wer eine Kreditentscheidung auf komplexe Algorithmen stützt, muss dem Antragsteller
    nach dem Equal Credit Opportunity Act die konkreten Hauptgründe nennen — der Verweis auf ein undurchschaubares
    Modell genügt nicht, und die Musterformulare der Regulation B decken nicht jeden Ablehnungsgrund ab.
    Diese Auslegung ist zurückgenommen. Die gesetzliche Begründungspflicht selbst besteht fort, ihre Anwendung
    auf KI-Systeme ist nun aber ungeklärt.

    '
  inkrafttreten:
    datum: 2025-05-12
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/05/12/2025-08286/interpretive-rules-policy-statements-and-advisory-opinions-withdrawal
