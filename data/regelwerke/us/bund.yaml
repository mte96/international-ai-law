- id: us-cfaa
  jurisdiktion: us
  kurztitel: CFAA (18 U.S.C. § 1030)
  offizieller_titel: 'Computer Fraud and Abuse Act of 1986, kodifiziert als 18 U.S.C. § 1030 — Fraud and
    related activity in connection with computers

    '
  fundstelle: Pub. L. 99-474, 100 Stat. 1213; 18 U.S.C. § 1030
  verfahrensnummer: H.R. 4718, 99. Kongress
  status: anwendbar
  status_detail: 'Seit 1986 in Kraft, zuletzt 2008 geändert. Nach Van Buren v. United States (2021) und
    hiQ Labs v. LinkedIn (9th Cir. 2022) erfasst der CFAA das Scraping öffentlich zugänglicher Daten nicht
    mehr. Die neue Streitfrage lautet: Wer greift zu, wenn ein KI-Agent im Auftrag eines Nutzers eine
    fremde Website ansteuert — der Nutzer oder der Anbieter des Agenten (Amazon v. Perplexity, Ninth Circuit)?

    '
  kurzbeschreibung: '§ 1030(a)(2)(C) stellt es unter Strafe, vorsätzlich ohne Berechtigung oder unter
    Überschreitung der Berechtigung auf einen geschützten Rechner zuzugreifen und dadurch Informationen
    zu erlangen. § 1030(e)(6) definiert „exceeds authorized access“ als das Erlangen von Informationen,
    zu denen der Zugreifende nicht berechtigt ist — nach Van Buren ein „gates-up-or-down“-Test, der Verstöße
    gegen Nutzungsbedingungen ausschließt. § 1030(g) gewährt ein privates Klagerecht bei Schäden über
    5.000 USD.

    '
  inkrafttreten:
    datum: 1986-10-16
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title18-section1030&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2021-06-03
    was_gilt: 'Van Buren v. United States: „exceeds authorized access“ erfasst nur Bereiche, die dem Zugreifenden
      verschlossen sind — nicht die zweckwidrige Nutzung offener Bereiche.

      '
    verifiziert: false
    quelle: https://www.supremecourt.gov/
  - datum: 2022-04-18
    was_gilt: 'hiQ Labs v. LinkedIn (9th Cir.): Das Scraping öffentlich zugänglicher Profildaten fällt
      nicht unter den CFAA.

      '
    verifiziert: false
    quelle: https://www.ca9.uscourts.gov/
  themenachsen:
  - wettbewerb
  - marktzugang
  - datenschutz
  - vertrag
  regelungsschwerpunkte:
  - 'DIE NEUE FRAGE — Zurechnung agentischen Handelns: Wenn ein Browser-Agent im Auftrag eines eingeloggten
    Nutzers dessen Konto bedient, ist der Zugriff dann autorisiert? Amazon v. Perplexity stellt die Frage
    erstmals obergerichtlich. Die Antwort entscheidet über das Geschäftsmodell agentischer Assistenten
    insgesamt.'
  - 'Nach Van Buren und hiQ ist der CFAA als Anti-Scraping-Instrument weitgehend entwertet. An seine Stelle
    treten drei Ersatzansprüche: 17 U.S.C. § 1201 (Umgehung von Bot-Abwehr), Vertragsbruch (Nutzungsbedingungen)
    und einzelstaatliche Computerstrafgesetze wie Cal. Penal Code § 502 (CDAFA), der enger an den Wortlaut
    „without permission“ anknüpft.'
  - § 1030(g) mit der 5.000-USD-Schwelle macht den CFAA zum Zivilrechtsinstrument der Plattformbetreiber
    — die strafrechtliche Verfolgung spielt im KI-Kontext keine Rolle.
  - 'Otter.ai zeigt die dritte Front: Der CFAA neben ECPA und CIPA gegen KI-Protokolldienste, die sich
    über die Kalendereinbindung selbst in Videokonferenzen einwählen.'
  eu_anbieter_relevanz: 'Funktional das Gegenstück zu § 202a StGB und Art. 3 RL 2013/40/EU, aber mit privatem
    Klagerecht — das ist der praktische Unterschied. Wer als europäischer Anbieter agentische Funktionen
    für den US-Markt entwickelt, muss davon ausgehen, unmittelbar von Plattformbetreibern verklagt zu
    werden. Handlungsanweisung: Zugriffe des Agenten technisch dem Nutzerkonto und der Nutzersitzung zuordnen,
    Bot-Abwehr nicht umgehen, und den Agentenverkehr als solchen kennzeichnen — die Kennzeichnung ist
    zugleich die beste Verteidigung gegen den § 1201-Vorwurf.

    '
  dokumente:
  - datum: 1986-10-16
    typ: endfassung
    titel: 18 U.S.C. § 1030 — Fraud and related activity in connection with computers
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title18-section1030&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Am amtlichen Text geprüft: (a)(2)(C) Zugriffstatbestand, (e)(6) Definition „exceeds authorized
      access“, (g) privates Klagerecht ab 5.000 USD Schaden.

      '
  offene_punkte:
  - Entscheidung des Ninth Circuit in Amazon v. Perplexity zur Zurechnung agentischer Zugriffe steht aus.
  - Ob Cal. Penal Code § 502 (CDAFA) weiter reicht als der CFAA — als Parallelanspruch geführt, ohne eigenen
    Regelwerkseintrag.
  monitoring_quellen:
  - https://www.justice.gov/criminal/criminal-ccips
  - https://uscode.house.gov/
  bezug_regelwerke:
  - us-dmca
  - us-copyright-act
  - us-ca-cipa
