  regelungsschwerpunkte:
  - „Prioritize U.S.-developed AI solutions" — die für europäische Anbieter kritischste Vorgabe. Kein
    Ausschluss, aber eine Präferenzregel, die im Vergabeverfahren begründungsbedürftig überwunden werden
    muss.
  - 'Datenschutzklausel: vertraglicher Ausschluss der Nutzung von Regierungsdaten für Modelltraining.'
  - 'Anti-Lock-in-Anforderungen: Wissenstransfer, Datenportabilität, Ausstiegsfähigkeit.'
  eu_anbieter_relevanz: 'Zentrale Marktzugangshürde. Die Präferenz für US-entwickelte Lösungen wirkt neben
    bestehenden Buy-American- und TAA-Regeln. Europäische Anbieter sollten prüfen, ob eine US-Tochter
    mit substanzieller Entwicklungsleistung die Präferenzregel entschärft, und die Datenschutz- sowie
    Portabilitätsklauseln vertraglich abbilden — sie sind mit den Anforderungen aus Art. 25 KI-VO an die
    Wertschöpfungskette gut kompatibel.

    '
