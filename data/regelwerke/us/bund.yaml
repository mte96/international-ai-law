- id: us-eeoc-dol-rueckzug
  jurisdiktion: us
  kurztitel: EEOC/DOL/OFCCP — Rücknahme der KI-Arbeitsleitlinien
  offizieller_titel: 'Entfernung der KI-bezogenen Leitlinien von EEOC, Department of Labor und OFCCP nach
    Executive Order 14179

    '
  fundstelle: Keine förmliche Bekanntmachung; Entfernung von den Behördenseiten
  verfahrensnummer: —
  status: aufgehoben
  status_detail: 'Sämtliche KI-bezogenen Leitlinien der Arbeitsbehörden wurden Anfang 2025 ohne förmliche
    Rücknahmebekanntmachung von den Behördenseiten entfernt — nach übereinstimmender Darstellung „seemingly
    overnight". Exakte Entfernungsdaten sind nicht dokumentiert, was ein eigenständiges Problem für die
    Nachvollziehbarkeit ist. Title VII, ADA, FLSA, FMLA und der PUMP Act gelten unverändert fort.

    '
  kurzbeschreibung: 'Betroffen sind sechs Dokumente: die EEOC-Handreichung vom Mai 2023 zu nachteiligen
    Auswirkungen von KI-Auswahlverfahren nach Title VII, die EEOC-Handreichung vom Mai 2022 zu ADA-Verstößen
    durch KI-gestützte Bewerberauswahl, das EEOC-Faktenblatt „Wearables in the Workplace" vom Dezember
    2024, das DOL Field Assistance Bulletin vom April 2024 zu arbeitsrechtlichen Verstößen durch KI-Einsatz,
    die DOL-Roadmap vom Oktober 2024 zu „AI principles for worker well-being" sowie die OFCCP-Leitlinie
    vom April 2024 „Artificial Intelligence and Equal Employment Opportunity for Federal Contractors".
    Ein Ersatz wurde nicht geschaffen.

    '
  inkrafttreten:
    datum: 2025-01-23
    verifiziert: false
    quelle: https://www.eeoc.gov/
    fundstelle_norm: 'Kein Rechtsakt: Rücknahme von Leitlinien durch Entfernung von den Behördenseiten,
      ohne förmliche Bekanntmachung im Federal Register.'
  anwendungsdaten:
  - datum: 2025-02-21
    was_gilt: 'Dokumentation der Entfernung durch Kanzleianalysen; exakte Entfernungsdaten nicht feststellbar.

      '
    verifiziert: true
    quelle: https://www.cooley.com/news/insight/2025/2025-02-21-gone-but-not-forgotten-federal-laws-still-apply-despite-guidance-disappearance-act
  themenachsen:
  - arbeit
  - grundrechte
  - berufsrecht
  regelungsschwerpunkte:
  - 'Kernaussage der entfernten EEOC-Leitlinie von 2023: Der Vier-Fünftel-Maßstab des Uniform Guidelines
    on Employee Selection Procedures ist auf algorithmische Auswahlverfahren anwendbar, und der Arbeitgeber
    haftet auch dann, wenn das Werkzeug von einem Dritten stammt.'
  - 'Kernaussage der ADA-Leitlinie von 2022: Algorithmische Auswahl kann Menschen mit Behinderungen unzulässig
    ausschließen; angemessene Vorkehrungen sind auch im automatisierten Verfahren zu treffen.'
  - 'Rechtslage unverändert: Title VII (Disparate Impact, 42 U.S.C. § 2000e-2(k)) und die ADA gelten fort.
    Entfallen ist die Konkretisierung, nicht die Haftung.'
  - Verstärkter Effekt durch die Rücknahme der bundesweiten Disparate-Impact-Durchsetzungspolitik; die
    praktische Durchsetzung verlagert sich auf Privatklagen und auf die Bundesstaaten (Illinois, New York
    City Local Law 144, Colorado, Kalifornien).
  - 'Fehlende Dokumentation der Entfernung ist selbst ein Befund: Es gibt keine Federal-Register-Bekanntmachung,
    an der sich ein Vertrauensschutz festmachen ließe.'
  eu_anbieter_relevanz: 'Für europäische Anbieter von HR- und Recruiting-KI die trügerischste Lage im
    gesamten Datensatz. Der Wegfall der Leitlinien senkt das Aufsichtsrisiko, erhöht aber das Prozessrisiko,
    weil Gerichte den Maßstab nun ohne behördliche Vorgabe bestimmen und die einzelstaatlichen Regime
    — die von EO 14365 gerade nicht wirksam verdrängt werden — voll durchgreifen. Empfehlung: Die Bias-Prüfungen
    und Datenqualitätsnachweise nach Art. 10 KI-VO und die Protokollierung nach Art. 12 KI-VO unverändert
    weiterführen; sie sind zugleich der wirksamste Nachweis im US-Zivilprozess und die Grundlage für die
    Audits nach New York City Local Law 144 und Colorado SB24-205.

    '
  dokumente:
  - datum: 2025-02-21
    typ: stellungnahme
    titel: 'Gone but Not Forgotten: Federal Laws Still Apply Despite AI Guidance Disappearance Act'
    url: https://www.cooley.com/news/insight/2025/2025-02-21-gone-but-not-forgotten-federal-laws-still-apply-despite-guidance-disappearance-act
    sprache: en
    urheber: Cooley LLP
    verifiziert: true
    notiz: 'Vollständigste auffindbare Aufstellung der entfernten Dokumente mit Ursprungsdaten; belegt
      auch die fehlende förmliche Rücknahme.

      '
  - datum: 2025-09-04
    typ: bericht
    titel: 'AI in the Workplace: US Legal Developments'
    url: https://www.cooley.com/news/insight/2025/2025-09-04-ai-in-the-workplace-us-legal-developments
    sprache: en
    urheber: Cooley LLP
    verifiziert: false
    notiz: Fortschreibung mit der Verlagerung auf die Einzelstaaten; nicht abgerufen.
  offene_punkte:
  - Exakte Entfernungsdaten der einzelnen Dokumente nicht feststellbar.
  - Ob EEOC oder DOL Ersatzleitlinien planen — keine Anhaltspunkte.
  - Archivierte Fassungen der entfernten Dokumente wären für die Beweisführung wertvoll; Fundstellen nicht
    gesichert.
  - Datum der Rücknahme der KI-Arbeitsleitlinien (23.01.2025) nicht amtlich belegbar, weil es keine förmliche
    Bekanntmachung gibt. Zu prüfen an Web-Archiv-Aufnahmen der EEOC- und DOL-Seiten oder an EO 14179 vom
    23.01.2025, an das die Rücknahme anknüpft.
  - 'Inkrafttreten nicht belegbar: eeoc.gov, dol.gov, federalregister.gov. Es gibt keine foermliche Ruecknahmebekanntmachung:
    Die KI-Leitlinien wurden Anfang 2025 ohne Federal-Register-Notice von den Behoerdenseiten entfernt.
    Ein Entfernungsdatum ist nirgends dokumentiert; der eingetragene 23.01.2025 laesst sich weder belegen
    noch widerlegen. Genau dieser Umstand — eine Rechtsaenderung ohne nachvollziehbares Datum — ist der
    Befund des Eintrags. Verifiziert bleibt false.'
  monitoring_quellen:
  - https://www.eeoc.gov/newsroom
  - https://www.dol.gov/agencies/whd/field-assistance-bulletins
