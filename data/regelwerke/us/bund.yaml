- id: us-eo-14318
  jurisdiktion: us
  kurztitel: EO 14318 (Rechenzentren-Genehmigung)
  offizieller_titel: 'Executive Order 14318 of July 23, 2025 — Accelerating Federal Permitting of Data
    Center Infrastructure

    '
  fundstelle: 90 FR 35961 (28. Juli 2025)
  verfahrensnummer: EO 14318
  status: anwendbar
  status_detail: 'In Kraft. Umsetzung läuft über EPA-Leitlinien für beschleunigte Umweltprüfungen an Brownfield-
    und Superfund-Standorten, über FAST-41-Aufnahme qualifizierender Vorhaben und über die Bereitstellung
    von Bundesliegenschaften durch Innen-, Energie- und Verteidigungsministerium.

    '
  kurzbeschreibung: 'Beschleunigt Genehmigungen für KI-Rechenzentren und die zugehörige Energieinfrastruktur.
    Definiert „qualifying projects" über Schwellen von 500 Mio. USD Investitionsvolumen oder mehr als
    100 MW zusätzlicher Netzlast. Ordnet die Nutzung bestehender NEPA-Kategorieausnahmen an, stellt klar,
    dass NEPA bei Bundeszuschüssen unter 50 Prozent der Projektkosten nicht als „major Federal action"
    greift, und öffnet Bundesland sowie Militärliegenschaften für Rechenzentrumsbau. Sieht Darlehen, Bürgschaften,
    Steueranreize und Abnahmeverträge des Handelsministeriums vor. Keine Sanktionen — reines Förder- und
    Verfahrensrecht.

    '
  inkrafttreten:
    datum: 2025-07-23
    verifiziert: true
    quelle: https://www.whitehouse.gov/presidential-actions/2025/07/accelerating-federal-permitting-of-data-center-infrastructure/
  anwendungsdaten:
  - datum: 2025-08-02
    was_gilt: '10-Tage-Frist: Behörden benennen bestehende NEPA-Kategorieausnahmen für qualifizierende
      Vorhaben.'
    verifiziert: true
    quelle: https://www.whitehouse.gov/presidential-actions/2025/07/accelerating-federal-permitting-of-data-center-infrastructure/
  - datum: 2025-08-22
    was_gilt: '30-Tage-Frist: FAST-41-Executive-Director kann qualifizierende Vorhaben als Transparency
      Projects listen.'
    verifiziert: true
    quelle: https://www.whitehouse.gov/presidential-actions/2025/07/accelerating-federal-permitting-of-data-center-infrastructure/
  - datum: 2026-01-19
    was_gilt: '180-Tage-Fristen: EPA-Leitlinien zu beschleunigten Umweltprüfungen an Brownfield-/Superfund-Standorten;
      Überprüfung der Nationwide Permits durch das Army Corps of Engineers (CWA § 404, RHA § 10).

      '
    verifiziert: true
    quelle: https://www.whitehouse.gov/presidential-actions/2025/07/accelerating-federal-permitting-of-data-center-infrastructure/
  themenachsen:
  - governance
  - sektor-oeffentlich
  - wettbewerb
  regelungsschwerpunkte:
  - 'Schwellenwerte: 500 Mio. USD Capex ODER > 100 MW zusätzliche Netzlast; ein „data center project"
    verlangt > 100 MW neue Last für Inferenz, Training, Simulation oder synthetische Datenerzeugung.'
  - '„Covered components" erfassen die gesamte Kette: Energieinfrastruktur, Leistungselektronik, Halbleiter,
    Netzwerktechnik, Speicher — damit sind auch europäische Zulieferer im Anwendungsbereich der Förderinstrumente.'
  - NEPA-Ausnahme bei Bundesförderung unter 50 Prozent der Projektkosten — eine bewusste Konstruktion,
    um Fördermittel ohne Umweltprüfungspflicht auszureichen.
  - 'Rechtspolitisch umstritten: Bundesstaaten und Kommunen behalten ihre Genehmigungshoheit; EO 14365
    nimmt Rechenzentrums-Standortrecht ausdrücklich von der Preemption-Agenda aus.'
  eu_anbieter_relevanz: 'Positiv und konkret. Europäische Hersteller von Netz-, Kühl-, Trafo- und Speichertechnik
    können als Lieferanten „covered components" an geförderten Vorhaben partizipieren; Darlehens- und
    Bürgschaftsprogramme des Handelsministeriums stehen grundsätzlich offen. Zu beachten sind Buy-American-Klauseln
    in den einzelnen Förderprogrammen und die Exportkontrolle für Rechenkomponenten (siehe us-bis-chip-lizenzpolitik-2026).

    '
  dokumente:
  - datum: 2025-07-23
    typ: endfassung
    titel: Accelerating Federal Permitting of Data Center Infrastructure
    url: https://www.whitehouse.gov/presidential-actions/2025/07/accelerating-federal-permitting-of-data-center-infrastructure/
    sprache: en
    urheber: The White House
    verifiziert: true
    notiz: Volltext mit den Schwellenwerten und Fristen.
  offene_punkte:
  - Ob die NEPA-Kategorieausnahmen gerichtlich Bestand haben — Umweltverbände haben Klagen angekündigt;
    keine Entscheidung auffindbar.
  - 'Verhältnis zu den Strompreisdebatten: mehrere Kongressvorlagen (S. 4213, S. 4214, H.R. 6529) zielen
    gegen die Lastenverteilung.'
  monitoring_quellen:
  - https://www.permits.performance.gov/
  - https://www.federalregister.gov/agencies/environmental-protection-agency
