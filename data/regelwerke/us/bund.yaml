- id: us-great-american-ai-act
  jurisdiktion: us
  kurztitel: Great American AI Act of 2026
  offizieller_titel: Great American Artificial Intelligence Act of 2026 (Diskussionsentwurf)
  fundstelle: Diskussionsentwurf; noch keine Bill-Nummer
  verfahrensnummer: Diskussionsentwurf vom 4. Juni 2026 (119. Kongress)
  status: entwurf
  status_detail: 'Am 4. Juni 2026 von den Abgeordneten Jay Obernolte (R-CA) und Lori Trahan (D-MA) als
    269-seitiger Diskussionsentwurf vorgestellt, mitgetragen von Subramanyam (D-VA), Franklin (R-FL),
    Peters (D-CA) und Houchin (R-IN). Bei Rechercheschluss NICHT förmlich eingebracht, daher ohne Bill-Nummer.
    Trahan bezeichnet ihn als „opening bid, not a final answer". Die Ko-Vorsitzenden der House Democratic
    Commission on AI erklärten, der Entwurf könne „nicht als Grundlage für einen produktiven Dialog dienen".

    '
  kurzbeschreibung: 'Der dritte und bislang ernsthafteste Anlauf zu einem bundeseinheitlichen KI-Rahmen.
    Vier Titel: Frontier-AI-Governance, Arbeitsmarkt, Cybersicherheit, Forschung und internationale Zusammenarbeit.
    Adressat sind „large frontier developers" — Unternehmen mit über 500 Mio. USD Jahresumsatz, die Frontier-Modelle
    trainiert haben. Kernstück ist eine dreijährige Verdrängung einzelstaatlicher Gesetze, die „specifically
    regulating the development" von KI-Modellen betreffen, mit Sunset im Dezember 2029. Im Gegenzug: verpflichtende
    Transparenzberichte, unabhängige Audits, Whistleblower-Schutz und die gesetzliche Verankerung von
    CAISI mit 100 Mio. USD jährlich für 2027 bis 2029.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.techpolicy.press/unpacking-the-great-american-artificial-intelligence-act-of-2026/
  anwendungsdaten:
  - datum: 2026-06-04
    was_gilt: Vorstellung des Diskussionsentwurfs.
    verifiziert: true
    quelle: https://www.techpolicy.press/unpacking-the-great-american-artificial-intelligence-act-of-2026/
  - datum: 2029-12-31
    was_gilt: Vorgesehener Sunset der dreijährigen Verdrängungsregelung.
    verifiziert: true
    quelle: https://www.techpolicy.press/unpacking-the-great-american-artificial-intelligence-act-of-2026/
  themenachsen:
  - gpai
  - governance
  - marktzugang
  - arbeit
  - urheberrecht
  - haftung
  regelungsschwerpunkte:
  - 'Verdrängungsumfang bewusst eng: Erfasst sind nur Landesgesetze, die „specifically regulating the
    development" von Modellen betreffen — nicht Produkte, nicht Bereitstellung, nicht Nutzung. Trahan
    betont, die Staaten behielten die volle Zuständigkeit für die Einsatzphase, „where AI systems actually
    interact with real people".'
  - Savings Clauses für allgemein anwendbares Recht, Datenschutz, Verbraucherschutz, Antidiskriminierungs-
    und Bürgerrechtsdurchsetzung — die Antwort auf das Scheitern der Totalverdrängung.
  - 'Auditregime: unabhängige Prüfstellen mit Lizenzierung, eingebettet beim Entwickler, mit laufender
    Verifikation von Sicherheits- und Sicherungsverfahren. Prüfberichte gehen an die Generalstaatsanwälte
    der Bundesstaaten, die Verstöße verfolgen — ein kooperatives Durchsetzungsmodell zwischen Bund und
    Ländern.'
  - Whistleblower-Schutz mit Wiedereinstellung, doppelter Nachzahlung nebst Zinsen, Schadensersatz und
    Anwaltskosten.
  - 'Arbeitsmarkttitel: AI Workforce Research Hub beim Arbeitsministerium binnen 90 Tagen; Änderung des
    WARN Act, wonach Arbeitgeber bei Massenentlassungen die Rolle von KI angeben müssen.'
  - Verlängerung des Cybersecurity Information Sharing Act bis 2035; NSF-Bildungsprogramme.
  - 'Kritik: Public Citizen, Public Knowledge und AFL-CIO wenden sich gegen die Verdrängung. Unterstützung
    von BSA und ITI.'
  eu_anbieter_relevanz: 'Das derzeit wichtigste Beobachtungsobjekt. Würde er Gesetz, entstünde erstmals
    ein US-Bundespflichtenkreis, der strukturell an die KI-VO heranreicht: Transparenzberichte und unabhängige
    Audits für Frontier-Entwickler entsprechen funktional Art. 53 bis 55 KI-VO. Die Umsatzschwelle von
    500 Mio. USD schließt die meisten europäischen Anbieter derzeit aus; wer sie überschreitet, sollte
    die KI-VO-Modelldokumentation so führen, dass sie in ein US-Transparenzberichtsformat überführbar
    ist. Für Anbieter unterhalb der Schwelle bliebe die Verdrängungsklausel der eigentliche Gewinn — allerdings
    nur für die Entwicklungsphase, nicht für Bereitstellung und Nutzung, wo Colorado, Kalifornien, Texas
    und Illinois weiter gälten.

    '
