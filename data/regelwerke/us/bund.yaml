- id: us-moratorium-reconciliation-2025
  jurisdiktion: us
  kurztitel: Moratorium für einzelstaatliche KI-Gesetze (Reconciliation 2025)
  offizieller_titel: 'Moratoriumsklausel im Reconciliation-Paket der 119. Kongressperiode („One Big Beautiful
    Bill Act"), Abschnitt zur Beschränkung der Durchsetzung einzelstaatlicher KI-Regelungen

    '
  fundstelle: Aus dem Gesetzentwurf gestrichen; nicht Gesetz geworden
  verfahrensnummer: H.R. 1, 119. Kongress (Reconciliation)
  status: gescheitert
  status_detail: 'Der Senat strich die Klausel mit 99 zu 1 Stimmen. Ursprünglich als zehnjähriges, zuletzt
    als fünfjähriges Moratorium konzipiert. Der Vorgang ist der Grund dafür, dass die Administration ab
    Ende 2025 auf Exekutivrecht (EO 14365) und Prozessführung umgestellt hat.

    '
  kurzbeschreibung: 'Der erste und weitreichendste Versuch, einzelstaatliche KI-Gesetze bundesrechtlich
    zu suspendieren. Die Klausel hätte den Bundesstaaten für zehn — nach Überarbeitung fünf — Jahre die
    Durchsetzung eigener KI-Regelungen untersagt, teilweise gekoppelt an den Zugang zu Breitbandfördermitteln.
    Sie scheiterte im Senat an parteiübergreifendem Widerstand, unter anderem wegen der Byrd-Rule-Problematik
    im Reconciliation-Verfahren und wegen des Widerstands von Generalstaatsanwälten und Gouverneuren beider
    Parteien.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.fisherphillips.com/en/insights/insights/congress-again-drops-bid-to-block-state-ai-laws
  anwendungsdaten:
  - datum: 2025-07-01
    was_gilt: 'Streichung der Klausel durch den Senat mit 99 zu 1 Stimmen. Tagesdatum aus Sekundärquelle;
      Abstimmungsnummer nicht verifiziert.

      '
    verifiziert: false
    quelle: https://www.fisherphillips.com/en/insights/insights/congress-again-drops-bid-to-block-state-ai-laws
  themenachsen:
  - governance
  - marktzugang
  - grundrechte
  regelungsschwerpunkte:
  - Konstruktion über die Ausgabenkompetenz statt über eine Sachregelung — deshalb überhaupt reconciliation-fähig,
    deshalb aber auch Byrd-Rule-anfällig.
  - Das Abstimmungsergebnis 99:1 ist der härteste Beleg dafür, dass eine gesetzliche Totalverdrängung
    im Senat derzeit nicht mehrheitsfähig ist. Jede spätere Preemption-Konstruktion — EO 14365, Great
    American AI Act — reagiert auf dieses Ergebnis.
  - 'Gescheitert ist die Totalverdrängung, nicht die Idee: Der spätere Ansatz ist enger (nur Modellentwicklung,
    drei Jahre, mit Ausnahmekatalogen).'
  eu_anbieter_relevanz: 'Entscheidend für die Planungsgrundlage: Ein europäischer Anbieter kann NICHT
    damit rechnen, dass einzelstaatliche KI-Pflichten kurzfristig entfallen. Die Compliance-Architektur
    ist auf das strengste einschlägige Landesrecht auszulegen; Bundesrecht bringt derzeit keine Entlastung,
    sondern zusätzliche Anforderungen im Beschaffungs- und Exportkontrollbereich.

    '
