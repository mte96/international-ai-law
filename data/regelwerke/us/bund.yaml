  kurzbeschreibung: 'Erstes verbindliches Rahmenwerk für die KI-Nutzung durch Bundesbehörden. Führte Chief
    AI Officers, KI-Governance-Boards, jährliche KI-Anwendungsfall-Inventare sowie verbindliche Mindestpraktiken
