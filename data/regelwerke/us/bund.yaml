  kurzbeschreibung: 'Verstetigt die National Artificial Intelligence Research Resource (NAIRR) gesetzlich.
    Ziel ist es, Rechenleistung, Datensätze und Werkzeuge für die KI-Forschung außerhalb der großen Konzerne
    verfügbar zu machen. Ohne Gesetz läuft NAIRR als Pilotprojekt der National Science Foundation ohne
    gesicherte Finanzierung. Der Entwurf enthält keine Pflichten für Private; er ist Förder-, nicht Ordnungsrecht.

    '
