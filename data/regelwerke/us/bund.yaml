regelwerke:
- id: us-eo-14110
  jurisdiktion: us
  kurztitel: EO 14110 (Biden-KI-Verordnung)
  offizieller_titel: 'Executive Order 14110 of October 30, 2023 — Safe, Secure, and Trustworthy Development
    and Use of Artificial Intelligence

    '
  fundstelle: 88 FR 75191 (1. November 2023)
  verfahrensnummer: EO 14110
  status: aufgehoben
  status_detail: 'Aufgehoben am 20. Januar 2025 durch Executive Order 14148 („Initial Rescissions of Harmful
    Executive Orders and Actions", Ziffer (ggg)). Die Aufhebung erfolgte NICHT durch EO 14179 — das ist
    eine verbreitete Fehlangabe. EO 14179 vom 23.01.2025 ordnete lediglich die Überprüfung und Rücknahme
    der auf EO 14110 gestützten Maßnahmen an.

    '
  kurzbeschreibung: 'Erste umfassende KI-Anordnung der US-Exekutive. Verpflichtete Anbieter von „dual-use
    foundation models" gestützt auf den Defense Production Act zur Meldung von Trainingsläufen und Red-Team-Ergebnissen
    an das Handelsministerium oberhalb einer Rechenschwelle (10^26 Operationen), verpflichtete IaaS-Anbieter
    zu KYC-Pflichten bei ausländischen Kunden, beauftragte NIST mit Sicherheitsstandards und Wasserzeichen-Leitlinien,
    verlangte Chief AI Officers in Bundesbehörden und enthielt Vorgaben zu Bürgerrechten, Arbeitnehmerschutz
    und Einwanderung von Fachkräften. Eigene Sanktionen gegenüber Privaten enthielt sie nur mittelbar
    über den Defense Production Act.

    '
  inkrafttreten:
    datum: 2023-10-30
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2023/11/01/2023-24283/safe-secure-and-trustworthy-development-and-use-of-artificial-intelligence
  anwendungsdaten:
  - datum: 2023-10-30
    was_gilt: Unterzeichnung, sofortige Wirkung.
    verifiziert: true
    quelle: https://en.wikipedia.org/wiki/Executive_Order_14110
  - datum: 2025-01-20
    was_gilt: 'Vollständige Aufhebung durch EO 14148. Meldepflichten für Foundation-Model-Trainingsläufe
      entfallen ersatzlos.

      '
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/01/28/2025-01901/initial-rescissions-of-harmful-executive-orders-and-actions
  themenachsen:
  - gpai
  - governance
  - sektor-oeffentlich
  - sicherheit-export
  - grundrechte
  regelungsschwerpunkte:
  - 'Sec. 4.2: Meldepflicht für Trainingsläufe von Dual-Use-Foundation-Models oberhalb 10^26 Operationen,
    gestützt auf Defense Production Act — der einzige echte Zwangsmechanismus der Anordnung.'
  - 'Sec. 4.2(c): KYC-Pflichten für US-IaaS-Anbieter bei ausländischen Nutzern großer Trainingsläufe —
    Vorläufer der späteren Exportkontrolldebatte.'
  - 'Sec. 4.5: NIST-Auftrag zu synthetischen Medien, Wasserzeichen und Content Provenance.'
  - 'Sec. 10: Chief AI Officers und Governance-Boards in Bundesbehörden — dieser Teil hat die Aufhebung
    strukturell überlebt und lebt in M-25-21 fort.'
  - Kein Zulassungs- oder Lizenzregime, keine Verbotstatbestände — insofern nie ein Gegenstück zur KI-VO.
  eu_anbieter_relevanz: 'Historisch. Wer ab 2023 Compliance-Prozesse auf die 10^26-Meldeschwelle ausgerichtet
    hat, kann diese seit 20.01.2025 abbauen. Relevanz heute nur noch als Erklärung dafür, warum US-Bundesrecht
    2026 keine Modell-Meldepflicht kennt — und warum die Einzelstaaten diese Lücke gefüllt haben.

    '
  dokumente:
  - datum: 2023-11-01
    typ: endfassung
    titel: Executive Order 14110 — Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence
    url: https://www.federalregister.gov/documents/2023/11/01/2023-24283/safe-secure-and-trustworthy-development-and-use-of-artificial-intelligence
    sprache: en
    urheber: The White House / Office of the Federal Register
    verifiziert: true
    notiz: Amtlicher Volltext. Referenzpunkt für alles, was seit 2025 rückgängig gemacht wurde.
  - datum: 2025-01-28
    typ: endfassung
    titel: Executive Order 14148 — Initial Rescissions of Harmful Executive Orders and Actions
    url: https://www.federalregister.gov/documents/2025/01/28/2025-01901/initial-rescissions-of-harmful-executive-orders-and-actions
    sprache: en
    urheber: The White House
    verifiziert: true
    notiz: 'Das tatsächliche Aufhebungsinstrument. Ziffer (ggg) der Liste nennt EO 14110 ausdrücklich.
      90 FR 8237.

      '
  offene_punkte:
  - Einzelne auf EO 14110 gestützte Behördenmaßnahmen (etwa NIST-Publikationen) bestehen fort, weil sie
    eigenständige Rechtsgrundlagen haben — im Einzelfall zu prüfen.
