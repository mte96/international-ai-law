    der KI-VO am nächsten kommende US-Bundeskonstruktion; in M-25-21 zur einheitlichen Kategorie „high-impact
    AI" zusammengeführt.
  - Historisch bedeutsam, weil die Governance-Architektur (CAIO, Boards, Inventare) die Aufhebung von
    EO 14110 überlebt hat.
