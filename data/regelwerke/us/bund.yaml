  regelungsschwerpunkte:
  - 'Definition des „full-stack AI export package": KI-optimierte Hardware (Chips, Server, Beschleuniger),
    Rechenzentrumsspeicher, Cloud, Netzwerk; Datenpipelines und Labeling; Modelle; Cybersicherheit; sektorale
    Endanwendungen (Gesundheit, Landwirtschaft, Bildung).'
  - 'Geopolitische Stoßrichtung: Verdrängung chinesischer Anbieter in Drittmärkten; Empfängerstaaten müssen
    Sicherheitsanforderungen erfüllen.'
  - 'Verzahnung mit der Exportkontrolle: Die Förderung setzt Einhaltung der EAR voraus — das Programm
    ist damit auch ein Instrument, um Abnehmerländer an das US-Kontrollregime zu binden.'
  eu_anbieter_relevanz: 'Zweischneidig. Europäische Anbieter sind keine Adressaten der Förderung, konkurrieren
    aber in Drittmärkten mit staatlich flankierten US-Paketen. Wer als Zulieferer in ein US-Konsortium
    eintritt, unterwirft sich faktisch dem US-Exportkontrollregime einschließlich Re-Export- und De-minimis-Regeln.
    Für EU-Cloud- und Modellanbieter ist zusätzlich zu prüfen, ob eine Teilnahme mit Souveränitätszusagen
    gegenüber europäischen Kunden vereinbar ist.

    '
