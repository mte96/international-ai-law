- id: us-ai-action-plan
  jurisdiktion: us
  kurztitel: AI Action Plan
  offizieller_titel: 'Winning the Race: America''s AI Action Plan'
  fundstelle: Weißes Haus, 23. Juli 2025 (kein Federal Register)
  verfahrensnummer: erstellt aufgrund EO 14179 Sec. 4
  status: softlaw
  status_detail: 'Strategiepapier ohne Bindungswirkung, aber faktisch der Fahrplan der Bundes-KI-Politik.
    Nach einer Bilanz der Industrievereinigung ITI vom 22.07.2026 sind wesentliche Bausteine umgesetzt
    — EO 14365, EO 14409, das American AI Exports Program, Arbeitskräfte- und Energieinitiativen. Offen
    bleiben vor allem eine gesetzliche Preemption-Regelung und eine umfassende Genehmigungsreform. Eine
    amtliche Fortschrittszählung der über 90 Maßnahmen wurde nicht gefunden.

    '
  kurzbeschreibung: 'Der Plan bündelt über 90 Maßnahmen in drei Säulen: Beschleunigung der KI-Innovation,
    Aufbau amerikanischer KI-Infrastruktur sowie internationale KI-Diplomatie und Sicherheit. Er ist rechtlich
    unverbindlich, hat aber nahezu jede nachfolgende Exekutivmaßnahme vorgezeichnet — von der Überarbeitung
    des NIST-Rahmenwerks über die Beschaffung ideologisch neutraler Sprachmodelle und die Rechenzentrumsgenehmigung
    bis zum Exportprogramm und zur Nukleinsäure-Synthesekontrolle. Sanktionen enthält er nicht; sein Hebel
    ist die Bundesförderung.

    '
  inkrafttreten:
    datum: 2025-07-23
    verifiziert: true
    quelle: https://www.whitehouse.gov/wp-content/uploads/2025/07/Americas-AI-Action-Plan.pdf
  anwendungsdaten:
  - datum: 2025-07-23
    was_gilt: Veröffentlichung zusammen mit den EOs 14318, 14319 und 14320.
    verifiziert: true
    quelle: https://www.whitehouse.gov/wp-content/uploads/2025/07/Americas-AI-Action-Plan.pdf
  themenachsen:
  - governance
  - gpai
  - sicherheit-export
  - arbeit
  - content
  - sektor-oeffentlich
  - wettbewerb
  regelungsschwerpunkte:
  - 'Säule I — Accelerate AI Innovation: Überarbeitung des NIST AI RMF mit dem ausdrücklichen Auftrag,
    Bezüge auf „misinformation, Diversity, Equity, and Inclusion, and climate change" zu streichen; Beschaffung
    nur von Frontier-Modellen, die „objective and free from top-down ideological bias" sind; Förderung
    offener Gewichte; Aufbau eines Evaluations-Ökosystems mit halbjährlichen CAISI-Treffen; NIST-Leitlinien
    zu Deepfake-Erkennung und ein Vorschlag für Beweisregeln zu synthetischen Medien in den Federal Rules
    of Evidence; AI Workforce Research Hub und Umschulungsförderung.'
  - 'Säule II — Build American AI Infrastructure: NEPA-Kategorieausnahmen für Rechenzentren, FAST-41-Ausweitung,
    Netzstabilisierung und dispatchable power, CHIPS-Programm ohne „extraneous policy requirements", technische
    Standards für hochsichere Rechenzentren.'
  - 'Säule III — Lead in International AI Diplomacy and Security: Export des vollen amerikanischen Stacks
    an Verbündete; neue Exportkontrollen für Halbleiter-Subsysteme und ein Chip-Monitoring-Programm; verbindliche
    Nukleinsäure-Synthesekontrolle mit Sequenz- und Kundenprüfung für bundesgeförderte Forschung; Partnerschaften
    zur Bewertung von CBRNE- und Cyberrisiken in Frontier-Modellen.'
  - 'Qürschnittsprinzip zu den Einzelstaaten: Bundes-KI-Förderung soll das Regulierungsklima des jeweiligen
    Staates berücksichtigen; Staaten mit „burdensome AI regulations" sollen weniger Unterstützung erhalten.
    Dieser Satz ist die programmatische Wurzel der BEAD-Konditionierung in EO 14365.'
  eu_anbieter_relevanz: 'Der Plan ist die verlässlichste Prognosegrundlage für kommende US-Anforderungen.
    Drei Punkte mit direktem Handlungsbezug: Erstens wird das NIST-Rahmenwerk, auf das viele europäische
    Anbieter ihre US-Governance stützen, inhaltlich verändert — Verweise in Kundenverträgen auf „NIST
    AI RMF" sollten versioniert werden. Zweitens ist die Förderung offener Gewichte ein Marktsignal für
    europäische Open-Weight-Anbieter. Drittens verschärfen die angekündigten Exportkontrollen für Halbleiter-Subsysteme
    die Lieferkettenprüfung auch für EU-Hersteller mit US-Vorprodukten.

    '
  dokumente:
  - datum: 2025-07-23
    typ: bericht
    titel: 'Winning the Race: America''s AI Action Plan'
    url: https://www.whitehouse.gov/wp-content/uploads/2025/07/Americas-AI-Action-Plan.pdf
    sprache: en
    urheber: The White House / OSTP
    verifiziert: true
    notiz: Primärquelle. Enthält die drei Säulen und alle Einzelmaßnahmen im Wortlaut.
  - datum: 2026-07-22
    typ: bericht
    titel: 'America''s AI Action Plan: Progress, Priorities, and Next Steps'
    url: https://www.itic.org/news-events/techwonk-blog/americas-ai-action-plan-progress-priorities-and-next-steps
    sprache: en
    urheber: Information Technology Industry Council
    verifiziert: true
    notiz: 'Einjahresbilanz aus Industriesicht. Benennt Umsetzungserfolge (EO 14365, EO 14409, Exportprogramm,
      Ratepayer Protection Pledge, AI Literacy Framework) und offene Punkte (gesetzliche Preemption, Genehmigungsreform).
      Keine amtliche Zählung.

      '
  offene_punkte:
  - Keine amtliche Fortschrittsübersicht über die mehr als 90 Maßnahmen auffindbar.
  - Der Auftrag zur Streichung von Fehlinformations-, DEI- und Klimabezügen aus dem NIST-Rahmenwerk war
    bei Rechercheschluss nicht abgeschlossen (siehe us-nist-ai-rmf).
  - 'Federal Rules of Evidence zu synthetischen Medien: Stand des Verfahrens beim Judicial Conference
    Advisory Committee nicht geprüft.'
