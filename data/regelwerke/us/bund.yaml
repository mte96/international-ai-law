- id: us-ftc-policy-statement-ai-accuracy
  jurisdiktion: us
  kurztitel: 'FTC-Entwurf: Unterdrückung der Genauigkeit in KI-Systemen'
  offizieller_titel: 'Federal Trade Commission''s Proposed Policy Statement Concerning the Suppression
    of Accuracy in Artificial Intelligence Systems

    '
  fundstelle: Federal-Register-Bekanntmachung Juli 2026; Docket FTC-2026-0859
  verfahrensnummer: FTC-2026-0859
  status: entwurf
  status_detail: 'Am 1. Juli 2026 mit 2 zu 0 Stimmen zur Veröffentlichung freigegeben; Kommentierungsfrist
    bis 31. Juli 2026 abgelaufen. Endfassung bei Rechercheschluss nicht veröffentlicht. Erfüllt den Auftrag
    aus EO 14365 Sec. 7.

    '
  kurzbeschreibung: 'Der Entwurf stellt zwei Dinge fest. Erstens: Wer die Ausgaben eines KI-Systems verzerrt,
    um undeklarierte ideologische Ziele zu verfolgen, kann Verbraucher täuschen und damit gegen Section
    5 FTC Act verstoßen — maßgeblich sind die „reasonable consumer expectations for objectivity and accuracy".
    Zweitens: Einzelstaatliche Gesetze, die Anbieter zur Veränderung wahrheitsgemäßer Ausgaben zwingen,
    seien insoweit bundesrechtlich verdrängt, als sie mit dem bundesrechtlichen Regelungsprogramm kollidieren;
    der Colorado AI Act wird namentlich genannt.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases/2026/07/ftc-seeks-public-comment-policy-statement-addressing-ai-accuracy
  anwendungsdaten:
  - datum: 2026-07-01
    was_gilt: Freigabe des Entwurfs mit 2 zu 0 Stimmen; Beginn der Kommentierung.
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases/2026/07/ftc-seeks-public-comment-policy-statement-addressing-ai-accuracy
  - datum: 2026-07-31
    was_gilt: Ende der Kommentierungsfrist (Docket FTC-2026-0859).
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases/2026/07/ftc-seeks-public-comment-policy-statement-addressing-ai-accuracy
  themenachsen:
  - content
  - wettbewerb
  - governance
  - marktzugang
  - grundrechte
  regelungsschwerpunkte:
  - 'Dogmatisch neuartig: Verbraucherschutzrecht wird als Verdrängungsgrund gegen Verbraucherschutzgesetze
    der Länder eingesetzt. Die Konstruktion läuft über „implied conflict preemption" — ohne Bundesgesetz
    mit Regelungsprogramm ist das rechtlich angreifbar, weil eine Policy Statement der FTC keine Rechtsnorm
    ist.'
  - Maßstab „reasonable consumer expectations for objectivity and accuracy" — ein neuer, unbestimmter
    Erwartungshorizont für Modellausgaben.
  - Abstimmungsverhältnis 2 zu 0 zeigt die reduzierte Besetzung der Kommission; die Legitimationsbasis
    ist entsprechend schmal.
  - 'Kritik (u. a. Tech Policy Press): Der Entwurf bleibe in der Sache unbestimmt und diene primär der
    Flankierung von EO 14365.'
  eu_anbieter_relevanz: 'Der schärfste Konfliktpunkt für europäische Anbieter im gesamten US-Bundesrecht.
    Zwei gegenläufige Pflichtenkreise treffen aufeinander: Die KI-VO und der DSA verlangen Maßnahmen gegen
    bestimmte Modellausgaben; der FTC-Entwurf behandelt undeklarierte Steuerung als potenzielle Täuschung.
    Der Ausweg liegt in beiden Ordnungen im gleichen Instrument — Transparenz. Wer die regulatorisch veranlassten
    Modellanpassungen in der Systembeschreibung, der Model Card und den Nutzungsbedingungen offenlegt
    und begründet, erfüllt sowohl die Offenlegungsanforderung aus M-26-04 als auch die Erwartung des FTC-Entwurfs,
    weil die Steuerung dann nicht mehr „undisclosed" ist. Verschweigen ist die einzige klar riskante Option.

    '
