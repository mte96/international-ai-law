- id: us-train-act
  jurisdiktion: us
  kurztitel: TRAIN Act
  offizieller_titel: 'Transparency and Responsibility for Artificial Intelligence Networks Act (TRAIN
    Act) of 2025

    '
  fundstelle: Nicht Gesetz geworden
  verfahrensnummer: S. 2455 (Welch/Blackburn u. a.); H.R. 7209
  status: verfahren
  status_detail: 'In den Ausschüssen anhängig. Senatsfassung S. 2455 im Juli 2025 eingebracht, Hausfassung
    H.R. 7209 folgte 2026. Von Verwertungs- und Kreativverbänden unterstützt, von der Technologiebranche
    abgelehnt.

    '
  kurzbeschreibung: 'Verschafft Rechteinhabern ein administratives Auskunftsrecht über KI-Trainingsdaten.
    Wer glaubhaft macht, dass sein Werk zum Training eines generativen Modells verwendet wurde, kann eine
    gerichtliche Subpoena erwirken, mit der der Modellentwickler die Trainingsdaten offenlegen muss, soweit
    sie das betreffende Werk betreffen. Verweigert der Entwickler die Auskunft, greift eine widerlegliche
    Vermutung, dass das Werk verwendet wurde. Das Gesetz schafft keinen eigenen Anspruch, sondern beseitigt
    das Beweisproblem, an dem die meisten US-Urheberrechtsklagen gegen KI-Anbieter derzeit scheitern.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.congress.gov/bill/119th-congress/senate-bill/2455/text
    fundstelle_norm: Kein Inkrafttreten — S. 2455 (Juli 2025) und H.R. 7209 (2026) bis 06.09.2026 in den
      Ausschuessen anhaengig
  anwendungsdaten:
  - datum: 2025-07-24
    was_gilt: 'Einbringung der Senatsfassung; Datum aus der Pressemitteilung des Antragstellers.

      '
    verifiziert: true
    quelle: https://www.welch.senate.gov/wp-content/uploads/2025/07/TRAIN-Act-of-2025-Bill-Text.pdf
  themenachsen:
  - urheberrecht
  - gpai
  - content
  - haftung
  regelungsschwerpunkte:
  - 'Kern ist die Beweislastumkehr: Verweigerte Auskunft begründet die widerlegliche Vermutung der Nutzung.
    Das ist der schärfste Hebel, weil er Geschäftsgeheimnisschutz gegen Prozessrisiko ausspielt.'
  - Beschränkung auf werkbezogene Auskunft — keine vollständige Offenlegung des Trainingskorpus. Damit
    deutlich enger als die Zusammenfassungspflicht nach Art. 53 Abs. 1 lit. d KI-VO.
  - Verfahrensweg über Subpoena beim Bundesgericht statt über eine Behörde — typisch amerikanische Konstruktion
    ohne Aufsichtsstelle.
  - 'Verhältnis zum Copyright-Office-Bericht Teil 3: Der Bericht empfiehlt Lizenzmärkte; der TRAIN Act
    schafft die Transparenz, die solche Märkte voraussetzen.'
  eu_anbieter_relevanz: 'Für europäische Modellanbieter mit US-Nutzern das wichtigste urheberrechtliche
    Beobachtungsobjekt. Wer die Zusammenfassung der Trainingsinhalte nach Art. 53 KI-VO ohnehin erstellt
    und die Herkunftsdokumentation werkbezogen führt, kann eine Subpoena beantworten, ohne den gesamten
    Korpus offenzulegen. Wer die KI-VO-Dokumentation nur aggregiert führt, hat im US-Verfahren ein Problem:
    Die Vermutungsregel greift bei Nichtauskunft unabhängig davon, ob die Daten überhaupt noch vorhanden
    sind. Empfehlung: Werkbezogene Abfragbarkeit des Trainingskorpus technisch vorbereiten.

    '
  dokumente:
  - datum: 2025-07-24
    typ: entwurf
    titel: TRAIN Act of 2025 — Bill Text
    url: https://www.welch.senate.gov/wp-content/uploads/2025/07/TRAIN-Act-of-2025-Bill-Text.pdf
