    url: https://www.welch.senate.gov/wp-content/uploads/2025/07/20250724-Transparency-and-Responsibility-for-Artificial-Intelligence-Networks-TRAIN-Act-of-2025-One-Pager-1.pdf
    sprache: en
    urheber: Office of Senator Peter Welch
    verifiziert: true
    notiz: Kurzdarstellung des Regelungsmechanismus einschließlich der Vermutungsregel.
