- id: us-copyright-act
  jurisdiktion: us
  kurztitel: Copyright Act (17 U.S.C.)
  offizieller_titel: 'Copyright Act of 1976, kodifiziert als Title 17 of the United States Code — Copyrights

    '
  fundstelle: Pub. L. 94-553, 90 Stat. 2541 (19.10.1976); 17 U.S.C. §§ 101 ff.
  verfahrensnummer: S. 22, 94. Kongress
  status: anwendbar
  status_detail: 'Seit 01.01.1978 anwendbar, seither vielfach geändert (unter anderem Berne Convention
    Implementation Act 1988, Copyright Renewal Act 1992, Sonny Bono Term Extension Act 1998, DMCA 1998,
    Music Modernization Act 2018). Das Gesetz ist die Anspruchsgrundlage nahezu aller US-Verfahren über
    KI-Training; kein einziger KI-spezifischer Paragraph wurde bislang eingefügt. Die gesamte Auseinandersetzung
    wird mit dem Bestand von 1976 geführt.

    '
  kurzbeschreibung: 'Regelt Schutzgegenstand (§ 102), Ausschluss von Ideen und Verfahren (§ 102(b)), Sammelwerke
    (§ 103), die ausschließlichen Rechte des Urhebers (§ 106), die Schranke des Fair Use (§ 107) samt
    vier Faktoren, die Erstinhaberschaft (§ 201), die Trennung von Werk und Werkstück (§ 202), die Übertragungsform
    (§ 204), die Verdrängung einzelstaatlichen Rechts (§ 301), die Registrierung als Klagevoraussetzung
    (§ 411) und als Voraussetzung für gesetzlichen Schadensersatz (§ 412) sowie die Rechtsfolgen (§§ 501-505).
    Es kennt keine gesetzliche Text- und Data-Mining-Schranke; an ihre Stelle tritt die richterrechtlich
    fortentwickelte Generalklausel des Fair Use.

    '
  inkrafttreten:
    datum: 1978-01-01
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?path=/prelim@title17&edition=prelim
  anwendungsdaten:
  - datum: 1978-01-01
    was_gilt: Inkrafttreten des Copyright Act of 1976.
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?path=/prelim@title17&edition=prelim
  - datum: 1998-10-28
    was_gilt: 'Digital Millennium Copyright Act fügt Chapter 12 (§§ 1201-1205) ein — eigener Regelwerkseintrag
      us-dmca.

      '
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?path=/prelim@title17/chapter12&edition=prelim
  themenachsen:
  - urheberrecht
  - content
  - gpai
  - haftung
  regelungsschwerpunkte:
  - § 107 Fair Use ist die zentrale Streitfrage des gesamten US-KI-Urheberrechts. Die vier Faktoren sind
    nicht abschließend („shall include“); entschieden wird faktisch über Faktor eins (Transformativität)
    und Faktor vier (Marktwirkung). Bartz und Kadrey haben Faktor vier für das Training bejaht bzw. offen
    gelassen, Thomson Reuters v. ROSS hat ihn für ein Konkurrenzprodukt verneint.
  - § 102(a) verlangt „original works of authorship“ — die Textgrundlage der Thaler-Linie, wonach ein
    menschlicher Urheber erforderlich ist. Das Wort „human“ steht nicht im Gesetz; das D.C. Circuit erschließt
    es aus dem Systemzusammenhang mit §§ 201(a), 203, 204(a) und 302(a).
  - '§ 202 trennt Eigentum am Werkstück vom Urheberrecht. Praktisch entscheidend für die Bartz-Linie:
    Der Kauf eines Buches erlaubt keine Vervielfältigung zum Training, das rechtmäßig erworbene Exemplar
    verschiebt aber die Fair-Use-Abwägung gegenüber der Schattenbibliothek.'
  - '§§ 411(a) und 412 sind der stille Filter jeder Sammelklage: Ohne Registrierung keine Klage, ohne
    rechtzeitige Registrierung kein gesetzlicher Schadensersatz und keine Anwaltskosten. Daran scheitert
    die Zertifizierung von Massenklassen häufiger als an materiellen Fragen.'
  - § 504(c) mit 750 bis 30.000 USD je Werk und bis zu 150.000 USD bei Vorsatz erzeugt den Vergleichsdruck,
    der die Verfahren tatsächlich beendet — der Anthropic-Vergleich über 1,5 Mrd. USD entspricht rund
    3.000 USD je Werk und liegt damit im unteren Bereich der Vorsatzspanne.
  - § 301(a) verdrängt einzelstaatliche Ansprüche, die einem der ausschließlichen Rechte äquivalent sind
    — der Hebel, mit dem Anbieter vertrags- und deliktsrechtliche Scraping-Klagen abzuwehren versuchen
    (Reddit v. Anthropic).
  eu_anbieter_relevanz: 'Für europäische Anbieter, die Modelle in den USA trainieren, dort anbieten oder
    US-Daten verwenden, ist § 107 die maßgebliche Erlaubnisnorm — mit einem grundlegend anderen Zuschnitt
    als Art. 4 DSM-RL und § 44b UrhG: Fair Use kennt keinen Rechtsvorbehalt (opt-out), sondern eine nachgelagerte
    richterliche Abwägung, deren Ergebnis erst im Prozess feststeht. Wer sich auf § 44b UrhG stützt, hat
    für den US-Markt nichts gewonnen; wer sich auf Fair Use stützt, hat für Europa nichts gewonnen. Die
    praktische Folge ist eine doppelte Datenherkunftsdokumentation: Rechtmäßigkeit des Zugangs (für Bartz/Kadrey)
    und Beachtung maschinenlesbarer Vorbehalte (für Art. 53 Abs. 1 lit. c KI-VO).

    '
  dokumente:
  - datum: 1976-10-19
    typ: endfassung
    titel: Title 17 — Copyrights, United States Code (Amtlicher Text)
    url: https://uscode.house.gov/view.xhtml?path=/prelim@title17&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel, U.S. House of Representatives
    verifiziert: true
    notiz: 'Amtliche Fassung. Grundlage der Einzelnormen im Normverzeichnis.

      '
  - datum: 1976-10-19
    typ: endfassung
    titel: '17 U.S.C. § 107 — Limitations on exclusive rights: Fair use'
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title17-section107&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Am amtlichen Text geprüft: Die vier Faktoren stehen in § 107 Satz 2 Nr. 1-4; Satz 3 stellt
      klar, dass Unveröffentlichtheit Fair Use nicht ausschließt.

      '
  offene_punkte:
  - Ob Fair Use das Training mit rechtswidrig beschafften Werken deckt, ist zwischen Bartz und Kadrey
    unterschiedlich beantwortet und beim Third Circuit (ROSS) sowie beim Ninth Circuit anhängig.
  - Ob die Marktverwässerung durch KI-erzeugte Konkurrenzwerke ein Schaden im Sinne von Faktor vier ist
    (Kadrey, obiter bejaht) — obergerichtlich ungeklärt.
