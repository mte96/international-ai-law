- id: us-no-fakes-act
  jurisdiktion: us
  kurztitel: NO FAKES Act
  offizieller_titel: 'Nurture Originals, Foster Art, and Keep Entertainment Safe Act (NO FAKES Act) of
    2025 / of 2026

    '
  fundstelle: Nicht Gesetz geworden
  verfahrensnummer: 'S. 1367 (2025, Blackburn/Klobuchar/Tillis/Cassidy/Schiff u. a.); S. 4591 und H.R.
    8915 (Neufassung 2026)

    '
  status: verfahren
  status_detail: 'In den Ausschüssen anhängig. Die Fassung von 2025 (S. 1367) wurde 2026 durch eine überarbeitete
    Fassung ersetzt (S. 4591 im Senat, H.R. 8915 im Repräsentantenhaus). Trotz breiter Unterstützung aus
    der Unterhaltungsindustrie und wachsendem Druck durch einzelstaatliche Regelungen bislang keine Abstimmung.

    '
  kurzbeschreibung: 'Schafft ein bundesrechtliches, vererbliches Recht an der eigenen Stimme und dem eigenen
    Abbild gegenüber KI-generierten digitalen Nachbildungen. Erfasst werden Herstellung und Verbreitung
    unautorisierter „digital replicas" sowie Werkzeuge, deren Hauptzweck deren Erzeugung ist. Vorgesehen
    sind ein Notice-and-Takedown-Verfahren mit Haftungsprivileg für kooperierende Plattformen, pauschalierter
    Schadensersatz und eine ausdrückliche Verdrängung abweichenden einzelstaatlichen Rechts in Teilbereichen
    — letzteres ist der umstrittenste Punkt, weil Kalifornien, Tennessee und weitere Staaten bereits eigene
    Regelungen haben.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.congress.gov/bill/119th-congress/senate-bill/4591
    fundstelle_norm: Kein Inkrafttreten — S. 4591 (NO FAKES Act of 2026) im Juni 2026 vom Senate Judiciary
      Committee gebilligt, bis 06.09.2026 nicht verabschiedet
  anwendungsdaten:
  - datum: 2025-04-09
    was_gilt: Einbringung von S. 1367 (NO FAKES Act of 2025). Datum nicht verifiziert.
    verifiziert: false
    quelle: https://legisletter.org/issues/ai-regulation
  - datum: 2026-06-01
    was_gilt: 'Einbringung der Neufassung S. 4591 / H.R. 8915. Genaue Daten nicht verifiziert.

      '
    verifiziert: false
    quelle: https://www.congress.gov/bill/119th-congress/senate-bill/4591
  themenachsen:
  - urheberrecht
  - content
  - haftung
  - grundrechte
  regelungsschwerpunkte:
  - 'Persönlichkeitsrecht statt Urheberrecht: Das Recht ist eigenständig, vererblich und läuft nicht über
    § 106 Copyright Act — eine für das US-Recht neuartige Konstruktion, die dem deutschen Recht am eigenen
    Bild näher steht als dem Urheberrecht.'
  - Haftungsprivileg für Plattformen bei Einhaltung des Notice-and-Takedown-Verfahrens — bewusst dem DMCA
    nachgebildet.
  - Erfassung von Werkzeugen, deren Hauptzweck die Erzeugung unautorisierter Nachbildungen ist — trifft
    potenziell Modellanbieter, nicht nur Verbreiter.
  - Teilweise Verdrängung einzelstaatlichen Rechts; Kritik von Bürgerrechtsorganisationen wegen möglicher
    Übermaßentfernung und First-Amendment-Bedenken bei Satire und Berichterstattung.
  - Verhältnis zum Copyright-Office-Bericht Teil 1 (Digital Replicas, Juli 2024), der ein solches Bundesgesetz
    ausdrücklich empfohlen hat.
  eu_anbieter_relevanz: 'Für Anbieter von Stimm- und Bildgenerierungsmodellen sowie für Plattformen mit
    US-Nutzern hoch relevant. Ein europäischer Anbieter, der bereits Herkunftskennzeichnung und Einwilligungsnachweise
    für Stimmklone nach Art. 50 KI-VO führt, hätte einen großen Teil der Nachweislast erfüllt. Neu wäre
    der US-typische Notice-and-Takedown- Apparat mit Gegendarstellungsverfahren und die Frage, ob das
    eigene Werkzeug unter die Tool-Klausel fällt. Bis zur Verabschiedung gelten weiterhin die einzelstaatlichen
    Rechte am eigenen Bild (Kalifornien AB 1836/2602, Tennessee ELVIS Act).

    '
