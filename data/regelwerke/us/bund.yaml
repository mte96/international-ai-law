    was_gilt: Ablösung durch OMB M-25-21 in Umsetzung von Sec. 5(b) der Executive Order 14179 — seither
      ist M-24-10 nicht mehr anwendbar
    verifiziert: true
    quelle: https://bidenwhitehouse.archives.gov/omb/management/ofcio/m-24-10-advancing-governance-innovation-and-risk-management-for-agency-use-of-artificial-intelligence/
