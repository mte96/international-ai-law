- id: us-frcp
  jurisdiktion: us
  kurztitel: Federal Rules of Civil Procedure
  offizieller_titel: 'Federal Rules of Civil Procedure, erlassen durch den Supreme Court auf Grundlage
    des Rules Enabling Act (28 U.S.C. §§ 2071-2077)

    '
  fundstelle: 28 U.S.C. App.; amtlicher Text beim Administrative Office of the U.S. Courts
  verfahrensnummer: Rules Enabling Act, 28 U.S.C. §§ 2071-2077
  status: anwendbar
  status_detail: 'Seit 1938 in Kraft, jährlich fortgeschrieben. Für den KI-Bestand tragen drei Regeln:
    Rule 11 (Erklärungspflicht des Unterzeichners — Grundlage sämtlicher Halluzinationssanktionen), Rule
    23 (Sammelklage — Grundlage der Zertifizierungs- und Vergleichsentscheidungen in Bartz, Andersen und
    Clearview) und Rule 26 (Discovery — Grundlage des Streits über die Herausgabe von 20 Mio. Chatprotokollen
    in NYT v. OpenAI). Änderungen zu den Rules 7.1, 26, 41, 45 und 81 sind zum 01.12.2027 anhängig.

    '
  kurzbeschreibung: 'Das Prozessrecht der US-Bundesgerichte. Rule 11(b) verpflichtet jeden Unterzeichnenden,
    mit der Einreichung zu bescheinigen, dass er nach zumutbarer Prüfung von der Richtigkeit der rechtlichen
    und tatsächlichen Ausführungen ausgeht; Rule 11(c) regelt die Sanktion — von der Rüge über Geldbußen
    bis zur Erstattung der gegnerischen Kosten, nach vorheriger Anhörung und mit der 21-tägigen Rücknahmemöglichkeit
    („safe harbor“). Rule 23 regelt die Sammelklage: (a)(4) angemessene Vertretung, (b)(3) Überwiegen
    gemeinsamer Fragen, (e) gerichtliche Genehmigung jedes Vergleichs. Rule 26(b)(1) begrenzt die Ausforschung
    auf Verhältnismäßiges.

    '
  inkrafttreten:
    datum: 1938-09-16
    verifiziert: true
    quelle: https://www.uscourts.gov/rules-policies/current-rules-practice-procedure
  anwendungsdaten:
  - datum: 1983-08-01
    was_gilt: 'Rule 11 wird um die Pflicht zur „reasonable inquiry“ ergänzt — der Maßstab, an dem KI-erzeugte
      Scheinzitate heute gemessen werden.

      '
    verifiziert: false
    quelle: https://www.law.cornell.edu/rules/frcp/rule_11
  - datum: 2027-12-01
    was_gilt: Anhängige Änderungen der Rules 7.1, 26, 41, 45 und 81 sollen in Kraft treten.
    verifiziert: true
    quelle: https://www.uscourts.gov/rules-policies/pending-rules-and-forms-amendments
  themenachsen:
  - berufsrecht
  - haftung
  - governance
  - urheberrecht
  regelungsschwerpunkte:
  - 'Rule 11(b) trägt die gesamte Halluzinationsrechtsprechung seit Mata v. Avianca (S.D.N.Y. 2023). Der
    Maßstab ist objektiv: Nicht der Einsatz generativer KI ist pflichtwidrig, sondern das Einreichen ungeprüfter
    Fundstellen. Verschärfend wirkt regelmäßig erst das Festhalten nach Beanstandung — die Sanktionshöhe
    folgt der Reaktion, nicht dem Fehler.'
  - Rule 11 erfasst nur Bundesgerichte; nicht anwaltlich vertretene Parteien und Landesgerichte werden
    über Parallelvorschriften erfasst (22 N.Y.C.R.R. § 130-1.1, Ill. S. Ct. R. 375(b), Mo. R. Civ. P.
    84.19) — der Bestand bildet diese Streuung ab.
  - 'Rule 23(b)(3) ist der eigentliche Engpass der Urheberrechtssammelklagen: Rechtsinhaberschaft und
    Registrierung nach 17 U.S.C. § 411 sind individuell zu klären, was das Überwiegen gemeinsamer Fragen
    in Frage stellt. In Bartz wurde die Klasse gleichwohl zertifiziert, in Andersen ist es offen.'
  - Rule 23(e) verlangt die gerichtliche Angemessenheitsprüfung jedes Vergleichs — der Grund, warum die
    1,5-Mrd.-USD-Einigung in Bartz zweistufig (vorläufig und endgültig) erfasst ist.
  - 'Rule 26(b)(1) Verhältnismäßigkeit: In NYT v. OpenAI wird sie gegen das Vertraulichkeitsinteresse
    von Millionen unbeteiligter Nutzer abgewogen — die erste große Datenschutzfrage des US-Discovery-Rechts
    im KI-Kontext.'
  eu_anbieter_relevanz: 'Europäische Unternehmen, die in den USA verklagt werden, treffen die Discovery-Pflichten
    der Rule 26 unmittelbar; die Herausgabe von Nutzergesprächen kollidiert mit Art. 6 und Art. 48 DSGVO
    und ist über eine Schutzanordnung (protective order) sowie Anonymisierung zu steuern. Für deutsche
    Prozessvertreter praktisch bedeutsamer ist Rule 11: Sie gilt auch für pro hac vice zugelassene ausländische
    Anwälte, und der Widerruf dieser Zulassung (Withers v. Aberdeen) ist die für sie einschneidendste
    Sanktion.

    '
  dokumente:
  - datum: 2026-09-05
    typ: endfassung
    titel: Federal Rules of Civil Procedure (amtliche Fassung)
    url: https://www.uscourts.gov/rules-policies/current-rules-practice-procedure/federal-rules-civil-procedure
    sprache: en
    urheber: Administrative Office of the United States Courts
    verifiziert: true
    notiz: 'Amtlicher Text. Grundlage der Einzelnormen im Normverzeichnis.

      '
  - datum: 2026-08-14
    typ: uebersicht
    titel: Pending Rules and Forms Amendments
    url: https://www.uscourts.gov/rules-policies/pending-rules-and-forms-amendments
    sprache: en
    urheber: Administrative Office of the United States Courts
    verifiziert: true
    notiz: 'Am 05.09.2026 geprüft: anhängig sind Civil Rules 7.1, 26, 41, 45, 81 (01.12.2027) sowie 5,
      5.2, 6, 55 (01.12.2028). Eine KI-spezifische Zivilprozessregel ist NICHT anhängig.

      '
  offene_punkte:
  - Ob eine bundeseinheitliche Offenlegungspflicht für den KI-Einsatz in Schriftsätzen kommt — bislang
    nur richterliche Einzelanordnungen (standing orders).
  - Ob Rule 11 auf den Einsatz agentischer Systeme durch Kanzleien zugeschnitten werden muss (Lacey v.
    State Farm wirft die Organisationsfrage auf, beantwortet sie aber nicht).
  monitoring_quellen:
  - https://www.uscourts.gov/rules-policies/pending-rules-and-forms-amendments
  - https://www.uscourts.gov/rules-policies/records-and-archives-rules-committees
