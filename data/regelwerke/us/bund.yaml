    verifiziert: true
    quelle: https://www.lawfaremedia.org/article/omb-releases-guidance-on-trump-s--woke-ai--executive-order
  - datum: 2027-12-11
    was_gilt: Sunset des Memorandums nach zwei Jahren, sofern nicht verlängert.
    verifiziert: true
    quelle: https://www.lawfaremedia.org/article/omb-releases-guidance-on-trump-s--woke-ai--executive-order
  themenachsen:
  - sektor-oeffentlich
  - vertrag
  - content
  - marktzugang
  - governance
  regelungsschwerpunkte:
  - 'Der Offenlegungskatalog ist das eigentliche Regelungsinstrument: nicht Verbot bestimmter Modellverhalten,
    sondern erzwungene Transparenz über deren Steuerung.'
  - Ausdrückliche Nennung von Anpassungen zur Erfüllung ausländischer oder einzelstaatlicher Vorschriften
    als offenlegungspflichtiger Umstand — die schärfste Schnittstelle zwischen US-Beschaffungsrecht und
    KI-VO/DSA-Compliance.
  - Sunset nach zwei Jahren begrenzt die Planungshorizonte; Vertragslaufzeiten sollten dies abbilden.
  - Umsetzung in Ressortrecht, etwa DOE Acquisition Letter 2026-05 (Policy Flash 2026-45 vom 08.05.2026).
  eu_anbieter_relevanz: 'Der konkreteste Konfliktpunkt zwischen europäischem und US-Bundesrecht im gesamten
    Datensatz. Ein europäischer LLM-Anbieter, der Ausgaben zur Erfüllung von Art. 5 KI-VO, des DSA oder
    nationaler Vorgaben steuert, muss dies gegenüber US-Bundeskunden offenlegen. Verheimlichen wäre vertragswidrig
    und könnte zusätzlich unter den FTC-Entwurf vom 01.07.2026 fallen. Praktische Empfehlung: Eine gesonderte,
    gegenüber Behörden vorlagefähige Darstellung aller regulatorisch veranlassten Modellanpassungen führen
    — nach Rechtsgrundlage, Zweck und Wirkung getrennt — und die Ausserbetriebnahmekostenklausel aus EO
    14319 Sec. 4 im Vertrag ausdrücklich auf schuldhafte Verstöße begrenzen.

    '
