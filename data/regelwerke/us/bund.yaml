- id: us-adea
  jurisdiktion: us
  kurztitel: ADEA (29 U.S.C. §§ 621 ff.)
  offizieller_titel: 'Age Discrimination in Employment Act of 1967, kodifiziert in 29 U.S.C. §§ 621-634

    '
  fundstelle: Pub. L. 90-202, 81 Stat. 602; 29 U.S.C. §§ 621-634
  verfahrensnummer: S. 830, 90. Kongress
  status: anwendbar
  status_detail: 'Seit 12.06.1968 anwendbar. Im KI-Bestand trägt die ADEA zwei Entscheidungen: EEOC v.
    iTutorGroup (2023, programmierter Altersschwellenwert — unmittelbare Diskriminierung durch Codezeile)
    und die bundesweite Kollektivklage in Mobley v. Workday, die auf § 626(b) i.V.m. § 216(b) FLSA gestützt
    ist.

    '
  kurzbeschreibung: '§ 623(a) verbietet Arbeitgebern, Personen ab 40 Jahren wegen ihres Alters bei Einstellung,
    Entlassung, Vergütung oder sonstigen Beschäftigungsbedingungen zu benachteiligen. § 626(b) verweist
    für die Durchsetzung auf das Verfahren des Fair Labor Standards Act, insbesondere § 216(b): Die Kollektivklage
    ist eine opt-in-Klage, nicht eine Klasse nach Rule 23 — der Grund, warum in Mobley v. Workday eine
    bundesweite ADEA-Kollektive zugelassen werden konnte, während die Title-VII-Ansprüche eine Rule-23-Klasse
    erfordern.

    '
  inkrafttreten:
    datum: 1968-06-12
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title29-section623&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2023-09-11
    was_gilt: 'EEOC v. iTutorGroup: Vergleich über 365.000 USD wegen automatisierter Aussortierung von
      Bewerbern nach Altersschwellenwert — der erste KI-Diskriminierungsvergleich der EEOC.

      '
    verifiziert: false
    quelle: https://www.eeoc.gov/newsroom
  themenachsen:
  - arbeit
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'iTutorGroup ist der lehrreichste Fall des Bestands, weil er zeigt, dass die schwierigen Fragen der
    Modellprüfung entfallen können: Der Altersschwellenwert war eine explizite Regel im Auswahlsystem,
    also unmittelbare Diskriminierung. Nicht jedes „KI-Diskriminierungsverfahren“ ist ein Verfahren über
    ein lernendes System.'
  - '§ 626(b) i.V.m. § 216(b) FLSA: Die opt-in-Kollektive umgeht die Zertifizierungshürden der Rule 23
    und macht die ADEA zum bevorzugten Vehikel gegen anbieterübergreifende Auswahlsoftware — die „common
    policy“ ist die Software selbst, nicht die Personalpolitik der einzelnen Arbeitgeber.'
  - Anders als Title VII kennt die ADEA nach Smith v. City of Jackson eine engere disparate-impact-Prüfung
    (reasonable factors other than age), was die Verteidigung erleichtert.
  eu_anbieter_relevanz: 'Das deutsche und europäische Pendant ist § 1 AGG i.V.m. RL 2000/78/EG; die Altersgrenze
    von 40 Jahren kennt das europäische Recht nicht, dafür ist die Rechtfertigungsmöglichkeit dort weiter
    (Art. 6 RL 2000/78/EG). Für Anbieter von Auswahlsoftware ist die praktische Lehre identisch: Alter
    darf weder als Merkmal noch als Stellvertretermerkmal (Abschlussjahr, „digital native“, Berufserfahrung
    in Jahren als hartes Ausschlusskriterium) in die Auswahl eingehen.

    '
  dokumente:
  - datum: 1967-12-15
    typ: endfassung
    titel: 29 U.S.C. § 623 — Prohibition of age discrimination
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title29-section623&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Amtlicher Text der Verbotsnorm.

      '
  - datum: 1967-12-15
    typ: endfassung
    titel: 29 U.S.C. § 626 — Recordkeeping, investigation, and enforcement
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title29-section626&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: '§ 626(b) verweist auf § 216(b) FLSA — Grundlage der opt-in-Kollektivklage.

      '
  offene_punkte:
  - Ob die Workday-Kollektive im Hauptsacheverfahren Bestand hat.
  - Reichweite der reasonable-factors-Verteidigung bei lernenden Modellen.
