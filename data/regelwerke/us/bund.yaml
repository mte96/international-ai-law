  - datum: 2026-05-19
    was_gilt: 'Ende der einjährigen Übergangsfrist: Plattformen müssen ein Melde- und Entfernungsverfahren
      eingerichtet haben. FTC-Durchsetzung beginnt.

      '
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases/2026/05/ftc-begins-enforcing-take-it-down-act
  themenachsen:
  - content
  - grundrechte
  - haftung
  - datenschutz
  regelungsschwerpunkte:
  - 48-Stunden-Frist ab Meldung durch die betroffene Person — deutlich kürzer als die Reaktionsfristen
    des DSA und ohne dessen Verfahrensgarantien für den Uploader.
  - Erfasst „digital forgeries", also KI-generierte Darstellungen, ausdrücklich neben echten Aufnahmen
    — der eigentliche KI-Bezug des Gesetzes.
  - 'Durchsetzung über Section 5 FTC Act: Verstöße gelten als unlautere Handelspraxis. Die FTC nennt in
    ihrer Handreichung Zivilbussen von bis zu 53.088 USD je Verstoß.'
  - 'Erwartungen der FTC an die Umsetzung: klar erkennbares Melde- und Entfernungsverfahren, Entfernung
    der Inhalte und aller bekannten identischen Kopien binnen 48 Stunden, Vergabe einer Vorgangsnummer
    je Meldung und Statusrückmeldung an die betroffene Person.'
  - 'Verfassungsrechtliche Kritik von EFF, CDT und Authors Guild: Unbestimmtheit der Tatbestände, Gefahr
    der Übererfüllung durch Plattformen, mögliche Kollision mit Ende-zu-Ende-Verschlüsselung, Missbrauchsanfälligkeit
    nach dem Muster des DMCA-Notice-Verfahrens.'
  - Keine bekannten Gerichtsverfahren zur Verfassungsmäßigkeit bei Rechercheschluss.
  eu_anbieter_relevanz: 'Unmittelbar und ohne Schwellenwert einschlägig für jeden europäischen Anbieter,
    der eine Plattform mit nutzergenerierten Inhalten für US-Nutzer betreibt oder ein generatives Bild-
    oder Videomodell öffentlich zugänglich macht. Die 48-Stunden-Frist unterschreitet die DSA-Praxis deutlich
    und verlangt einen eigenen, ganzjährig besetzten Meldekanal mit dokumentierter Bearbeitungszeit. Positiv:
    Die Anforderungen laufen inhaltlich parallel zu den neuen NCII-Verbotstatbeständen der KI-VO (Art.
    5 Abs. 1 lit. ba/bb ab 02.12.2026) — ein gemeinsamer Erkennungs- und Entfernungsprozess ist aufsetzbar,
    die Fristen sind aber getrennt zu steuern.

    '
