- id: us-ftc-act
  jurisdiktion: us
  kurztitel: FTC Act (15 U.S.C. §§ 41 ff.)
  offizieller_titel: 'Federal Trade Commission Act of 1914, kodifiziert in Title 15, Chapter 2, Subchapter
    I of the United States Code

    '
  fundstelle: Act of Sept. 26, 1914, ch. 311, 38 Stat. 717; 15 U.S.C. §§ 41-58
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Seit 1914 in Kraft. Section 5 (15 U.S.C. § 45) ist mangels eines KI-Bundesgesetzes die
    praktisch wichtigste Durchsetzungsnorm der USA gegen KI-Anbieter: Alle Verfahren der Operation AI
    Comply (Rytr, DoNotPay, Evolv, IntelliVision) sind darauf gestützt, ebenso die Durchsetzung des TAKE
    IT DOWN Act. Die Rytr-Verfügung wurde am 2025 auf Antrag wieder aufgehoben — die Kehrtwende der Kommission
    zur Frage, ob Missbrauchseignung allein genügt.

    '
  kurzbeschreibung: '§ 45(a)(1) erklärt unlautere Wettbewerbsmethoden sowie unlautere oder irreführende
    Handlungen und Praktiken im Handelsverkehr für rechtswidrig; § 45(a)(2) weist der Kommission die Unterbindungsbefugnis
    zu. Unlauter ist eine Praxis nach § 45(n) nur, wenn sie erheblichen, für Verbraucher vernünftigerweise
    nicht vermeidbaren Schaden verursacht, der nicht durch Vorteile aufgewogen wird. § 46(b) gibt der
    Kommission die Befugnis, von Unternehmen ohne konkreten Verdacht Berichte und Auskünfte zu verlangen
    — Grundlage der 6(b)-Studie zu Companion-Chatbots.

    '
  inkrafttreten:
    datum: 1914-09-26
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section45&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2024-09-25
    was_gilt: FTC startet Operation AI Comply — gebündelte Section-5-Verfahren gegen KI-Anbieter.
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases
  - datum: 2026-05-19
    was_gilt: Beginn der FTC-Durchsetzung der Plattformpflichten des TAKE IT DOWN Act über Section 5.
    verifiziert: true
    quelle: https://www.ftc.gov/news-events/news/press-releases/2026/05/ftc-begins-enforcing-take-it-down-act
  themenachsen:
  - content
  - governance
  - wettbewerb
  - marktzugang
  regelungsschwerpunkte:
  - 'Section 5 ist der Ersatz für das fehlende KI-Bundesgesetz. Angegriffen werden nicht Modelle, sondern
    Aussagen über Modelle: unbelegte Leistungsversprechen (Evolv, IntelliVision), irreführende Selbstbezeichnungen
    (DoNotPay: „world''s first robot lawyer“) und Manipulationsdesign (Replika-Beschwerde).'
  - 'DIE GRENZFRAGE — Werkzeughaftung: In Rytr untersagte die Kommission ein generatives Werkzeug wegen
    seiner Missbrauchseignung („means and instrumentalities“), ohne dass ein Verbraucher getäuscht worden
    wäre. Die Aufhebung 2025 markiert die Rücknahme dieser Linie und ist der wichtigste Befund des Bestands
    zur Reichweite von Section 5.'
  - § 46(b) erlaubt anlasslose Marktermittlung. Die 6(b)-Studie zu Companion-Chatbots verpflichtet Anbieter
    zur Offenlegung von Sicherheitsmaßnahmen und Monetarisierungsmodellen — faktisch eine Vorstufe der
    Regulierung ohne Rechtsetzungsakt.
  - 'Section 5 wirkt zudem als Durchsetzungsschiene fremder Gesetze: Verstöße gegen den TAKE IT DOWN Act
    und gegen einzelstaatliche Unfair-Trade-Practices-Gesetze (Connecticut CUTPA) gelten als unlautere
    Handlung — die Sanktionsnorm wird ausgeliehen.'
  eu_anbieter_relevanz: 'Section 5 gilt für jeden Anbieter, der US-Verbraucher erreicht, ohne Schwelle
    und ohne Niederlassungserfordernis. Praktisch bedeutet das: Jede Werbeaussage über Genauigkeit, Diskriminierungsfreiheit
    oder Sicherheit eines KI-Systems muss vor Veröffentlichung belegbar sein („competent and reliable
    evidence“), und der Beleg muss aufbewahrt werden. Das ist strenger als § 5 UWG, weil die FTC den Beleg
    zum Zeitpunkt der Aussage verlangt, nicht erst im Prozess. Wer für die KI-VO ohnehin Evaluationsberichte
    nach Art. 15 führt, kann sie hierfür nutzen — die Marketingaussage muss dann aber am Evaluationsergebnis
    ausgerichtet werden, nicht umgekehrt.

    '
  dokumente:
  - datum: 1914-09-26
    typ: endfassung
    titel: 15 U.S.C. § 45 — Unfair methods of competition unlawful
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section45&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Am amtlichen Text geprüft: § 45(a)(1) erklärt unlautere und irreführende Praktiken für rechtswidrig.

      '
  - datum: 1914-09-26
    typ: endfassung
    titel: 15 U.S.C. § 46 — Additional powers of Commission
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section46&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: '§ 46(b) trägt die 6(b)-Studien.

      '
  offene_punkte:
  - Ob die Rücknahme der Rytr-Verfügung die Werkzeughaftung dauerhaft ausschließt oder nur diesen Einzelfall
    betrifft.
  - Reichweite der FTC-Befugnis nach AMG Capital (keine Rückzahlungsanordnung nach § 13(b)) im KI-Kontext.
  monitoring_quellen:
  - https://www.ftc.gov/news-events/news/press-releases
  - https://www.ftc.gov/legal-library/browse/cases-proceedings
