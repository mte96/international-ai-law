- id: us-eo-14320
  jurisdiktion: us
  kurztitel: EO 14320 (AI-Stack-Export)
  offizieller_titel: 'Executive Order 14320 of July 23, 2025 — Promoting the Export of the American AI
    Technology Stack

    '
  fundstelle: '90 FR 35393 ff. (28. Juli 2025); verifiziert: false'
  verfahrensnummer: EO 14320
  status: anwendbar
  status_detail: 'In Kraft und operativ. Das American AI Exports Program wurde am 28.10.2025 im Federal
    Register eingerichtet; ein Call for Proposals für „Pre-Set Consortia" folgte am 10.04.2026 (91 FR
    18412).

    '
  kurzbeschreibung: 'Errichtet das American AI Exports Program beim Handelsministerium. Industriekonsortien
    können „full-stack AI export packages" anbieten — Hardware, Datenpipelines, Modelle, Cybersicherheit
    und Endanwendungen aus einer Hand — und dafür diplomatische und finanzielle Unterstützung des Bundes
    erhalten. Das Außenministerium führt eine Economic Diplomacy Action Group; EXIM Bank und Development
    Finance Corporation stellen Darlehen, Bürgschaften, Beteiligungen und Investitionsrisikoversicherungen
    bereit. Antragsteller müssen Zielmärkte benennen und die Einhaltung des US-Exportkontroll- und Investitionsrechts
    zusichern. Keine Sanktionen; Steuerung über Zugang zu Förderung.

    '
  inkrafttreten:
    datum: 2025-07-23
    verifiziert: true
    quelle: https://www.whitehouse.gov/presidential-actions/2025/07/promoting-the-export-of-the-american-ai-technology-stack/
  anwendungsdaten:
  - datum: 2025-10-21
    was_gilt: 90-Tage-Frist für den öffentlichen Aufruf des Handelsministeriums.
    verifiziert: true
    quelle: https://www.whitehouse.gov/presidential-actions/2025/07/promoting-the-export-of-the-american-ai-technology-stack/
  - datum: 2025-10-28
    was_gilt: 'Bekanntmachung des American AI Exports Program als Request for Information, 90 FR 48726;
      Kommentierungsfrist bis 28.11.2025.

      '
    verifiziert: true
