  jurisdiktion: us
  kurztitel: FTC 6(b)-Studie zu Companion-Chatbots
  offizieller_titel: 'FTC-Untersuchung nach Section 6(b) FTC Act zu KI-Chatbots, die als Begleiter fungieren,
    und deren Risiken für Kinder und Jugendliche

    '
  fundstelle: 15 U.S.C. § 46(b) (Section 6(b) FTC Act)
  verfahrensnummer: 6(b)-Orders vom 11. September 2025
  status: verfahren
  status_detail: 'Auskunftsverlangen am 11.09.2025 an sieben Unternehmen erlassen. Ergebnisbericht bei
    Rechercheschluss nicht veröffentlicht.

    '
  kurzbeschreibung: 'Die FTC nutzt ihre Marktuntersuchungsbefugnis nach Section 6(b), um von Alphabet,
    Character Technologies, Instagram, Meta Platforms, OpenAI, Snap und X.AI Auskunft über den Umgang
    mit Companion-Chatbots zu verlangen. Gefragt wird nach Messung, Test und Überwachung möglicher Schäden,
    nach Maßnahmen zur Beschränkung des Zugangs von Kindern und Jugendlichen, nach Hinweisen an Nutzer
    und Eltern, nach der Einhaltung der COPPA-Rule, nach der Entwicklung und Freigabe von Charakteren,
    nach der Monetarisierung von Engagement und nach Datenerhebung und -weitergabe. Eine 6(b)-Untersuchung
    dient nicht der Durchsetzung, mündet aber regelmäßig in Berichte, die Rechtsetzung und spätere Verfahren
    vorbereiten.

    '
