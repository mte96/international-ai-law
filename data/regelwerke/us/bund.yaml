  offizieller_titel: 'Guaranteeing Access and Innovation for National Artificial Intelligence Act (GAIN
    AI Act) of 2025

    '
  fundstelle: Aus dem NDAA FY2026 gestrichen; nicht Gesetz geworden
  verfahrensnummer: H.R. 5885 (Krishnamoorthi, Moran, Gottheimer, Crawford); Senatsfassung im NDAA-Verfahren
  status: gescheitert
  status_detail: 'Aus der Konferenzfassung des NDAA FY2026 vom 7. Dezember 2025 herausgenommen. Der Vorstoß
    lebt in der laufenden Kongressperiode als eigenständige Vorlage fort, hat aber nach der Streichung
    erheblich an Aussicht verloren. Von CSIS und Teilen der Halbleiterindustrie als wettbewerbsschädlich
    kritisiert.

    '
  kurzbeschreibung: 'Hätte amerikanische Chiphersteller verpflichtet, die Nachfrage von US-Abnehmern vorrangig
    zu bedienen, bevor fortgeschrittene KI-Chips an China und andere Waffenembargoländer verkauft werden
    dürfen. Ein inlandsbezogener Vorrangmechanismus statt eines klassischen Exportverbots.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.akingump.com/en/insights/alerts/congress-moves-forward-with-ai-measures-in-key-defense-legislation
  anwendungsdaten:
  - datum: 2025-12-07
    was_gilt: 'Ausschluss aus der NDAA-Konferenzfassung: „The final NDAA also excludes the GAIN AI Act,
      which would have required U.S. chipmakers to prioritize American customers before selling advanced
      AI chips to China and other arms-embargoed countries."

      '
    verifiziert: true
    quelle: https://www.akingump.com/en/insights/alerts/congress-moves-forward-with-ai-measures-in-key-defense-legislation
  themenachsen:
  - sicherheit-export
  - wettbewerb
  - marktzugang
  regelungsschwerpunkte:
  - Vorrangmechanismus statt Exportverbot — rechtlich neuartig und handelsrechtlich angreifbar.
  - 'CSIS-Kritik: Der Vorrang würde die globale Wettbewerbsfähigkeit amerikanischer Chiphersteller schwächen
    und Abnehmer zu nicht-amerikanischen Anbietern treiben.'
  - Das Scheitern zeigt die Grenze der Exportkontrollverschärfung dort, wo sie die Absatzinteressen der
    eigenen Industrie trifft.
  eu_anbieter_relevanz: 'Wäre für europäische Abnehmer unmittelbar spürbar gewesen: Ein gesetzlicher Vorrang
    amerikanischer Kunden hätte Beschaffungszeitpläne europäischer Rechenzentren verzögert, da die Vorrangregel
    nicht nach Embargoländern und Verbündeten differenziert hätte. Das Scheitern ist insofern eine Entlastung.
    Zu beobachten bleibt, ob Vorrangelemente im FY2027-Verfahren wiederkehren.

    '
