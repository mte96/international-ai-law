    typ: stellungnahme
    titel: BIS Revises License Review Policy for Advanced Computing Commodities (AI Semiconductors) to
      China and Macau
    url: https://sanctionsnews.bakermckenzie.com/bis-revises-license-review-policy-for-advanced-computing-commodities-ai-semiconductors-to-china-and-macau-when-exported-from-the-united-states/
    sprache: en
    urheber: Baker McKenzie
    verifiziert: false
    notiz: Zweitquelle zur Absicherung; nicht abgerufen.
  offene_punkte:
  - Federal-Register-Fundstelle (Band und Seite) nicht verifiziert; nur die Dokumentnummer 2026-00789
    ist belegt.
  - Ob und wie die 50-Prozent-Zusicherung überprüft wird.
  - Verhältnis zum Chip Security Act, falls dieser Standortverifikation gesetzlich vorschreibt.
