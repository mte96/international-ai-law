- id: us-eo-14319
  jurisdiktion: us
  kurztitel: EO 14319 (Preventing Woke AI)
  offizieller_titel: 'Executive Order 14319 of July 23, 2025 — Preventing Woke AI in the Federal Government

    '
  fundstelle: 90 FR 35389 (28. Juli 2025)
  verfahrensnummer: EO 14319
  status: anwendbar
  status_detail: 'In Kraft; durch OMB-Memorandum M-26-04 vom 11.12.2025 operativ umgesetzt. Behörden mussten
    ihre Beschaffungsrichtlinien bis 11.03.2026 anpassen.

    '
  kurzbeschreibung: 'Bindet die Bundesbeschaffung großer Sprachmodelle an zwei „Unbiased AI Principles":
    Wahrheitssuche und ideologische Neutralität. Adressiert sind unmittelbar die Bundesbehörden, mittelbar
    aber alle LLM-Anbieter, die an den Bund liefern wollen. Neue Verträge müssen Compliance-Klauseln enthalten;
    bei Kündigung wegen Verstoß sind dem Anbieter die Ausserbetriebnahmekosten aufzuerlegen. Bestehende
    Verträge sind „where practicable" anzupassen. Nationale Sicherheitssysteme sind ausgenommen.

    '
  inkrafttreten:
    datum: 2025-07-23
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/07/28/2025-14217/preventing-woke-ai-in-the-federal-government
  anwendungsdaten:
  - datum: 2025-11-20
    was_gilt: 120-Tage-Frist für die OMB-Leitlinie; erfüllt durch M-26-04 am 11.12.2025 (mit Verzug).
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/07/28/2025-14217/preventing-woke-ai-in-the-federal-government
  - datum: 2026-03-11
    was_gilt: '90 Tage nach OMB-Leitlinie: Behörden mussten ihre Beschaffungsrichtlinien angepasst haben;
      die Grundsätze gelten sofort für alle neuen LLM-Beschaffungen.

      '
    verifiziert: true
    quelle: https://www.lawfaremedia.org/article/omb-releases-guidance-on-trump-s--woke-ai--executive-order
  themenachsen:
  - sektor-oeffentlich
  - marktzugang
  - content
  - governance
  - vertrag
  regelungsschwerpunkte:
  - 'Sec. 3(a) Truth-seeking wörtlich: „LLMs shall be truthful in responding to user prompts seeking factual
    information or analysis. LLMs shall prioritize historical accuracy, scientific inquiry, and objectivity,
    and shall acknowledge uncertainty where reliable information is incomplete or contradictory."

    '
  - 'Sec. 3(b) Ideological Neutrality wörtlich: „LLMs shall be neutral, nonpartisan tools that do not
    manipulate responses in favor of ideological dogmas such as DEI. Developers shall not intentionally
    encode partisan or ideological judgments into an LLM''s outputs unless those judgments are prompted
    by or otherwise readily accessible to the end user." — Die Einschränkung „intentionally" und der Vorbehalt
    der Offenlegung sind die entscheidenden Weichenstellungen: verlangt wird Transparenz über Steuerung,
    nicht deren Unterlassung."

    '
  - 'Sec. 4: Vertragsklauselpflicht plus Ausserbetriebnahmekosten zulasten des Anbieters bei Kündigung
    wegen Nichteinhaltung nach angemessener Nachfrist — eine wirtschaftlich empfindliche Sanktion ohne
    Bußgeldcharakter.'
  - Ausnahme für National Security Systems; die OMB-Leitlinie durfte weitere Ausnahmen vorsehen.
  - 'Verfassungsrechtlich umstritten: Kritiker sehen in der Vorgabe zulässiger Modellinhalte für Auftragnehmer
    eine Form von Government Speech mit First-Amendment-Problematik.'
  eu_anbieter_relevanz: 'Direkt einschlägig für jeden europäischen LLM-Anbieter mit US-Bundesgeschäft.
    Die praktische Kollision zur EU liegt nicht im Verbot bestimmter Ausgaben, sondern in der Offenlegungspflicht:
    M-26-04 lässt Behörden System-Prompts, Sicherheitsfilter, Bias-Evaluierungen und ausdrücklich „adjustments
    to comply with foreign or state regulations" abfragen. Wer sein Modell für Art. 5 KI-VO oder den DSA
    nachjustiert hat, muss diese Anpassungen gegenüber US-Bundeskunden offenlegen und riskiert, dass sie
    als ideologische Steuerung eingeordnet werden. Empfehlung: Steuerungsentscheidungen dokumentieren,
    begründen und als offengelegte Produkteigenschaft führen, statt sie zu verbergen.

    '
  dokumente:
  - datum: 2025-07-28
    typ: endfassung
    titel: Executive Order 14319 — Preventing Woke AI in the Federal Government
    url: https://www.federalregister.gov/documents/2025/07/28/2025-14217/preventing-woke-ai-in-the-federal-government
    sprache: en
    urheber: The White House / Office of the Federal Register
    verifiziert: true
    notiz: Amtlicher Volltext, 90 FR 35389, mit den wörtlichen Prinzipiendefinitionen.
  - datum: 2025-12-11
    typ: leitlinie
    titel: 'Analyse: OMB Releases Guidance on Trump''s ''Woke AI'' Executive Order'
    url: https://www.lawfaremedia.org/article/omb-releases-guidance-on-trump-s--woke-ai--executive-order
    sprache: en
    urheber: Lawfare
    verifiziert: true
    notiz: 'Belegt Inhalt und Fristen von M-26-04, insbesondere die Offenlegungskataloge und die Zwei-Jahres-Sunset-Klausel.

      '
  offene_punkte:
  - Keine gerichtliche Überprüfung der First-Amendment-Frage bekannt (Stand 27.08.2026).
  - Unklar, wie „intentionally" in der Praxis von Sicherheitsfiltern abgegrenzt wird, die aus Haftungsgründen
    gesetzt sind.
