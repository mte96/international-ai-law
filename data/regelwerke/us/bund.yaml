- id: us-ada
  jurisdiktion: us
  kurztitel: ADA (42 U.S.C. §§ 12101 ff.)
  offizieller_titel: 'Americans with Disabilities Act of 1990, Title I — Employment, kodifiziert in 42
    U.S.C. §§ 12111-12117, geändert durch den ADA Amendments Act of 2008

    '
  fundstelle: Pub. L. 101-336, 104 Stat. 327; 42 U.S.C. §§ 12101 ff.
  verfahrensnummer: S. 933, 101. Kongress
  status: anwendbar
  status_detail: 'Seit 26.07.1992 anwendbar. Im KI-Bestand trägt die ADA die Verfahren gegen Videointerview-
    und Spracherkennungssysteme (ACLU-Beschwerde gegen Intuit und HireVue) sowie den Behinderungsstrang
    in Mobley v. Workday.

    '
  kurzbeschreibung: '§ 12112(a) verbietet die Benachteiligung qualifizierter Personen wegen einer Behinderung.
    § 12112(b)(6) erklärt es zur Diskriminierung, Auswahlkriterien zu verwenden, die Menschen mit Behinderung
    aussortieren, sofern das Kriterium nicht stellenbezogen und geschäftsnotwendig ist; § 12112(b)(7)
    verlangt, dass Eignungstests die zu messende Fähigkeit erfassen und nicht die Behinderung. Für KI-Auswahlsysteme
    ist das die schärfste der drei bundesrechtlichen Antidiskriminierungsnormen, weil es nicht auf Gruppenstatistik,
    sondern auf die individuelle Eignung ankommt.

    '
  inkrafttreten:
    datum: 1992-07-26
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section12112&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2009-01-01
    was_gilt: ADA Amendments Act erweitert den Behinderungsbegriff und kehrt die restriktive Rechtsprechung
      um.
    verifiziert: true
    quelle: https://www.eeoc.gov/statutes/ada-amendments-act-2008
  themenachsen:
  - arbeit
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - '§ 12112(b)(6)/(7) trifft KI-Auswahlsysteme genauer als Title VII: Nicht die statistische Verteilung
    ist maßgeblich, sondern ob das Verfahren die zu messende Fähigkeit erfasst. Eine Spracherkennung mit
    schlechterer Leistung bei gehörlosen Sprechern misst nicht die Eignung, sondern die Behinderung.'
  - Die ADA verlangt angemessene Vorkehrungen (reasonable accommodation) — daraus folgt bei automatisierten
    Verfahren ein Anspruch auf einen alternativen Auswahlweg. Genau diesen Anspruch normiert NYC Local
    Law 144 als Hinweispflicht.
  - 'Praktisch bedeutsam ist die Emotions- und Persönlichkeitsanalyse: Wer aus Mimik, Stimme oder Antwortverhalten
    auf Persönlichkeitsmerkmale schließt, erhebt faktisch Gesundheitsdaten — was § 12112(d) (medizinische
    Untersuchungen vor dem Angebot) eigenständig verbietet. Die kalifornischen FEHA-Regeln greifen genau
    das auf.'
  eu_anbieter_relevanz: 'Das europäische Pendant ist Art. 5 RL 2000/78/EG und § 8 AGG; die Emotionserkennung
    am Arbeitsplatz ist in der Union zusätzlich nach Art. 5 Abs. 1 lit. f KI-VO verboten, in den USA nur
    mittelbar über die ADA erfasst. Für Anbieter bedeutet das: Ein Produkt, das für den EU-Markt ohnehin
    ohne Emotionserkennung auskommen muss, ist auch die risikoärmere US-Variante — die strengere Ordnung
    setzt hier den globalen Produktstandard.

    '
  dokumente:
  - datum: 1990-07-26
    typ: endfassung
    titel: 42 U.S.C. § 12112 — Discrimination (ADA Title I)
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section12112&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Amtlicher Text; (b)(6) Auswahlkriterien, (b)(7) Eignungstests, (d) medizinische Untersuchungen.

      '
  offene_punkte:
  - Ob die ACLU-Beschwerden gegen Intuit/HireVue zu einem Verfahren führen — Stand 05.09.2026 offen.
  - Ob Zugänglichkeitsanforderungen an Konversationsschnittstellen selbst aus Title III folgen.
  monitoring_quellen:
  - https://www.eeoc.gov/newsroom
  - https://www.ada.gov/
