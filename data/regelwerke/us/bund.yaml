  - datum: 2025-05-12
    was_gilt: 'Rücknahme beider Rundschreiben sowie von Circular 2024-01 (Preferencing and Steering by
      Digital Intermediaries) und Circular 2024-06 (Background Dossiers and Algorithmic Scores for Hiring,
      Promotion, and Other Employment Decisions), sofort wirksam.

      '
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/05/12/2025-08286/interpretive-rules-policy-statements-and-advisory-opinions-withdrawal
  themenachsen:
  - sektor-finanz
  - grundrechte
  - datenschutz
  - arbeit
  regelungsschwerpunkte:
  - 'Begründung der Rücknahme: Das CFPB nehme „all guidance materials" zurück, um zu prüfen, ob die Auslegungen
    mit dem jeweiligen Gesetz oder der Verordnung vereinbar sind — eine pauschale, nicht KI-spezifische
    Maßnahme.'
  - 'Circular 2024-06 zu algorithmischen Bewerberdossiers ist der Verbindungspunkt zum Arbeitsrecht: Auch
    dort ist die behördliche Auslegung entfallen, während der Fair Credit Reporting Act fortgilt.'
  - 'Rechtlich entscheidend: Die Rücknahme einer Auslegung ändert das Gesetz nicht. Die Begründungspflicht
    nach ECOA § 701(d) und Regulation B § 1002.9 gilt unverändert — nur ohne behördliche Konkretisierung
    für algorithmische Entscheidungen.'
  - 'Praktische Folge: Rechtsunsicherheit zugunsten der Anbieter im Aufsichtsverfahren, zulasten der Anbieter
    im Zivilprozess, weil Gerichte die Auslegungsfrage nun eigenständig beantworten.'
  eu_anbieter_relevanz: 'Für europäische Anbieter von Kredit-Scoring- und Underwriting-Systemen mit US-Geschäft
    eine trügerische Entlastung. Die gesetzliche Begründungspflicht besteht fort und ist zivilrechtlich
    durchsetzbar; entfallen ist nur der behördliche Maßstab, an dem man sich ausrichten konnte. Empfehlung:
    Die Erklärbarkeitsartefakte nach Art. 13 und Art. 86 KI-VO — insbesondere die Pflicht zur Erläuterung
    der Rolle des Systems bei der Einzelentscheidung — weiterführen und als Nachweis gegenüber US-Kunden
    verwenden. Sie erfüllen den ECOA- Standard der „specific principal reasons" regelmäßig mit.

    '
