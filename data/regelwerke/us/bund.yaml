- id: us-dmca
  jurisdiktion: us
  kurztitel: DMCA (17 U.S.C. §§ 1201-1205)
  offizieller_titel: 'Digital Millennium Copyright Act of 1998, Title I — WIPO Copyright and Performances
    and Phonograms Treaties Implementation Act, kodifiziert als Chapter 12 of Title 17 of the United States
    Code

    '
  fundstelle: Pub. L. 105-304, 112 Stat. 2860 (28.10.1998); 17 U.S.C. §§ 1201-1205
  verfahrensnummer: H.R. 2281, 105. Kongress
  status: anwendbar
  status_detail: 'Seit 28.10.1998 in Kraft; § 1201 mit einer dreijährigen Ausnahmeregelung durch den Librarian
    of Congress. § 1202(b) ist Gegenstand eines laufenden Circuit-Splits: Der Ninth Circuit hat in Doe
    v. GitHub das vom District Court angenommene Identitätserfordernis zu prüfen, der Second Circuit hat
    in Raw Story über das Art.-III-Standing entschieden. Für KI-Verfahren ist § 1202(b) der wichtigste
    Nebenanspruch neben § 106.

    '
  kurzbeschreibung: '§ 1201 verbietet die Umgehung wirksamer technischer Zugangskontrollen (a) und den
    Vertrieb von Umgehungsmitteln (a)(2), (b). § 1202 schützt die Urheberrechtsverwaltungsinformation
    (copyright management information, CMI): Verboten ist die vorsätzliche Entfernung oder Änderung (b)(1)
    sowie die Verbreitung von Werken in Kenntnis der unbefugten Entfernung ((b)(2) und (b)(3)) — jeweils
    nur, wenn der Täter weiß oder begründeten Anlass zu der Annahme hat, dass dies eine Verletzung veranlassen,
    ermöglichen, erleichtern oder verbergen wird („double scienter“). § 1203 gewährt gesetzlichen Schadensersatz
    von 2.500 bis 25.000 USD je Verstoß — der Grund, warum § 1202(b) in Massenklagen gegen KI-Anbieter
    geltend gemacht wird.

    '
  inkrafttreten:
    datum: 1998-10-28
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?path=/prelim@title17/chapter12&edition=prelim
  anwendungsdaten:
  - datum: 2000-10-28
    was_gilt: Umgehungsverbot des § 1201(a)(1)(A) wird nach der zweijährigen Übergangsfrist anwendbar.
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title17-section1201&num=0&edition=prelim
  themenachsen:
  - urheberrecht
  - content
  - gpai
  - haftung
  regelungsschwerpunkte:
  - 'CIRCUIT-SPLIT ZU § 1202(b): Ob die verbreitete Kopie mit dem Original identisch sein muss („identicality
    requirement“), entscheidet über die Anwendbarkeit auf KI-Ausgaben. Das District Court N.D. Cal. hat
    es in Doe v. GitHub bejaht, der Ninth Circuit hat die Frage zur Entscheidung angenommen. Wird das
    Erfordernis verworfen, wird § 1202(b) zum Massenanspruch gegen jedes Modell, dessen Trainingskorpus
    aus dem offenen Netz stammt.'
  - 'ZWEITE STREITFRAGE — Art.-III-Standing: Raw Story v. OpenAI (S.D.N.Y., Judge McMahon) hat die Klage
    mangels konkreten Schadens abgewiesen; The Intercept v. OpenAI (Judge Rakoff, dasselbe Gericht) hat
    sie zugelassen. Beide Linien liegen dem Second Circuit vor.'
  - '§ 1201 im Scraping-Kontext: Ist eine robots.txt eine wirksame Zugangskontrolle (Ziff Davis v. OpenAI
    — verneint), sind CAPTCHAs und JavaScript-Challenges es (Reddit v. SerpApi)? Der Streit entscheidet,
    ob das Umgehen von Bot-Abwehr strafbewehrt ist, obwohl der Inhalt für Menschen frei lesbar bleibt.'
  - 'Der doppelte Vorsatz („double scienter“) ist die eigentliche Hürde: Auch wer CMI entfernt, haftet
    nur, wenn er dabei Verletzungsförderung erkennt oder erkennen muss. Bei automatisierter Trainingsdatenaufbereitung
    ist das schwer darzulegen — und genau deshalb wird über das Identitätserfordernis gestritten.'
  eu_anbieter_relevanz: 'Funktional das US-Gegenstück zu § 95a UrhG und Art. 6 InfoSoc-RL, aber mit einem
    zusätzlichen, in Europa unbekannten Anspruch: Die Entfernung von Metadaten (Urhebervermerk, Lizenzangabe,
    C2PA-Manifest) aus Trainingsdaten ist in den USA eigenständig sanktioniert, mit pauschaliertem Schadensersatz
    je Verstoß. Wer Trainingskorpora normalisiert und dabei EXIF-, IPTC- oder Content-Credentials-Daten
    verwirft, schafft damit eine Anspruchsgrundlage, die vom Ausgang des Fair-Use-Streits unabhängig ist.
    Praktische Folge: Metadaten im Vorverarbeitungspfad erhalten oder die Entfernung dokumentiert begründen.

    '
  dokumente:
  - datum: 1998-10-28
    typ: endfassung
    titel: 17 U.S.C. § 1202 — Integrity of copyright management information
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title17-section1202&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Am amtlichen Text geprüft: (b)(1) vorsätzliche Entfernung, (b)(2) Verbreitung von CMI, (b)(3)
      Verbreitung des Werks; Definition der CMI in (c) einschließlich „terms and conditions for use“.

      '
  - datum: 1998-10-28
    typ: endfassung
    titel: 17 U.S.C. § 1201 — Circumvention of copyright protection systems
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title17-section1201&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Grundlage für die Scraping-Verfahren gegen Bot-Abwehrmaßnahmen.

      '
  offene_punkte:
  - Entscheidung des Ninth Circuit in Doe v. GitHub zum Identitätserfordernis steht aus.
  - Entscheidung des Second Circuit in Raw Story v. OpenAI zum Art.-III-Standing steht aus.
  - Ob § 1201 auch dann greift, wenn die Zugangskontrolle nur Maschinen, nicht Menschen aussperrt.
