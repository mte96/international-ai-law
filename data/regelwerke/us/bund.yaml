- id: us-fair-housing-act
  jurisdiktion: us
  kurztitel: Fair Housing Act (42 U.S.C. §§ 3601 ff.)
  offizieller_titel: 'Title VIII of the Civil Rights Act of 1968 (Fair Housing Act), kodifiziert in 42
    U.S.C. §§ 3601-3631

    '
  fundstelle: Pub. L. 90-284, tit. VIII, 82 Stat. 81; 42 U.S.C. §§ 3601-3631
  verfahrensnummer: H.R. 2516, 90. Kongress
  status: anwendbar
  status_detail: 'Seit 11.04.1968 in Kraft. Im KI-Bestand trägt der FHA die Leitentscheidung Louis v.
    SafeRent Solutions (D. Mass. 2022/2023, Vergleich über 2,3 Mio. USD): Der Anbieter eines algorithmischen
    Mieter-Scorings haftet unmittelbar, weil das Modell Wohngeldempfänger mittelbar benachteiligte.

    '
  kurzbeschreibung: '§ 3604(a) verbietet die Verweigerung von Verkauf oder Vermietung wegen Rasse, Hautfarbe,
    Religion, Geschlecht, Familienstand oder nationaler Herkunft; § 3604(f) erstreckt das Verbot auf Behinderung.
    § 3605(a) verbietet die Diskriminierung bei wohnungsbezogenen Finanz- und Maklerdienstleistungen —
    die Vorschrift, unter die Scoring- und Bonitätsdienste fallen. Der FHA erfasst nach ständiger Rechtsprechung
    und Texas Dept. of Housing v. Inclusive Communities (2015) auch die mittelbare Benachteiligung (disparate
    impact); die HUD-Verordnung 24 C.F.R. § 100.500 regelt die Beweislastverteilung.

    '
  inkrafttreten:
    datum: 1968-04-11
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section3604&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2015-06-25
    was_gilt: 'Inclusive Communities Project: Der Supreme Court bestätigt die disparate-impact-Haftung
      nach dem FHA.

      '
    verifiziert: false
    quelle: https://www.supremecourt.gov/
  - datum: 2024-11-20
    was_gilt: 'Louis v. SafeRent Solutions: Vergleich über 2,3 Mio. USD; SafeRent verzichtet fünf Jahre
      lang auf Score-Empfehlungen für Mieter mit Wohngeld.

      '
    verifiziert: false
    quelle: https://www.justice.gov/crt
  themenachsen:
  - grundrechte
  - haftung
  - governance
  - sektor-finanz
  regelungsschwerpunkte:
  - 'SafeRent ist der Prototyp der algorithmischen mittelbaren Diskriminierung: Das Modell verarbeitete
    Schulden- und Bonitätsmerkmale, ignorierte aber die staatliche Zahlungsgarantie des Wohngeldes — ein
    sachlich unvollständiges Merkmalsset erzeugte eine geschützte Gruppenbenachteiligung, ohne dass ein
    geschütztes Merkmal verarbeitet wurde.'
  - Der FHA erfasst den Anbieter unmittelbar, weil § 3604 nicht auf den Vermieter beschränkt ist, sondern
    jede Person erfasst, die die Wohnraumversorgung verweigert oder anderweitig unzugänglich macht — anders
    als Title VII bedarf es keiner agent-Konstruktion.
  - Der Vergleich enthält eine Produktauflage (fünf Jahre kein Score für Wohngeldempfänger) — die in den
    USA übliche Form, in der KI-Regulierung ohne Gesetz entsteht.
  - 'Der New Jersey FAIR Act und die RealPage-Verfahren zeigen die zweite Front: Nicht die Auswahl der
    Mieter, sondern die algorithmische Bildung der Miete selbst.'
  eu_anbieter_relevanz: 'Ein unmittelbares europäisches Pendant fehlt — RL 2000/43/EG erfasst den Wohnraumzugang
    nur wegen Rasse und ethnischer Herkunft, § 19 Abs. 2 AGG ist enger. Für Anbieter von Scoring-Systemen
    ist gleichwohl die dogmatische Lehre übertragbar und deckt sich mit Art. 10 Abs. 2 lit. f KI-VO: Ein
    unvollständiges Merkmalsset ist selbst ein Verzerrungsrisiko. Wohnraumbezogenes Scoring ist zudem
    Hochrisiko nach Anhang III Nr. 5 lit. b KI-VO.

    '
  dokumente:
  - datum: 1968-04-11
    typ: endfassung
    titel: 42 U.S.C. § 3604 — Discrimination in the sale or rental of housing
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section3604&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Amtlicher Text der zentralen Verbotsnorm.

      '
  - datum: 1968-04-11
    typ: endfassung
    titel: 42 U.S.C. § 3605 — Discrimination in residential real estate-related transactions
    url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section3605&num=0&edition=prelim
    sprache: en
    urheber: Office of the Law Revision Counsel
    verifiziert: true
    notiz: 'Erfasst Scoring- und Bonitätsdienste im Wohnraumkontext.

      '
  offene_punkte:
  - Ob die HUD-Verordnung zur disparate-impact-Beweislast (24 C.F.R. § 100.500) in der aktuellen Legislaturperiode
    geändert wird.
  - Ob die SafeRent-Produktauflage nach Ablauf der fünf Jahre fortgeführt wird.
  monitoring_quellen:
  - https://www.hud.gov/program_offices/fair_housing_equal_opp
  - https://www.justice.gov/crt
  bezug_regelwerke:
  - us-title-vii
  - us-nj-fair-act
  - us-cfpb-rueckzug
