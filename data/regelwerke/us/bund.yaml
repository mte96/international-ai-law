  status_detail: 'H.R. 2385 wurde im Juni 2026 vom House Science, Space and Technology Committee angenommen;
    Plenarbehandlung ausstehend. Senatsfassung S. 4441 anhängig. Unterstützt von IEEE-USA, SeedAI und
    ITI.

