  offizieller_titel: 'National Security Presidential Memorandum 11 (5. Juni 2026) — KI-Nutzung im Verteidigungs-
    und Nachrichtendienstbereich

    '
  fundstelle: 'Nicht im Federal Register veröffentlicht; verifiziert: false'
  verfahrensnummer: NSPM-11
  status: anwendbar
  status_detail: 'Nach Sekundärberichterstattung am 05.06.2026 erlassen; ersetzt das Biden-Memorandum
    NSM-25 vom Oktober 2024. Primärquelle nicht auffindbar — Angaben daher unverifiziert.

    '
  kurzbeschreibung: 'Beschleunigt die militärische und nachrichtendienstliche KI-Nutzung. Nach der verfügbaren
    Berichterstattung verlangt das Memorandum Lieferantenvielfalt, jährliche Überprüfung der Politik zu
    autonomen Waffensystemen und ermöglicht die Kündigung von Verträgen mit Unternehmen, deren Verhaltensmuster
    der Politik der Administration zuwiderlaufen. Der Vorgänger NSM-25 enthielt demgegenüber ein ausgeprägteres
    Risiko- und Grundrechtsraster.

    '
  inkrafttreten:
    datum: 2026-06-05
    verifiziert: false
    quelle: https://www.whitehouse.gov/presidential-actions/
    fundstelle_norm: National Security Presidential Memorandum 11; nicht im Federal Register veröffentlicht,
      daher keine amtliche Fundstelle mit Datumsangabe.
  anwendungsdaten: []
  themenachsen:
  - sektor-oeffentlich
  - sicherheit-export
  - governance
  - vertrag
  regelungsschwerpunkte:
  - Ablösung von NSM-25 (Biden, Oktober 2024) — die Grundrechts- und Risikovorgaben für KI im Sicherheitsbereich
    werden dadurch materiell verändert.
  - Kündigungsrecht bei „patterns inconsistent with administration policies" — eine politisch konditionierte
    Vertragsklausel mit erheblichem Konfliktpotenzial für Anbieter mit internationalem Kundenkreis.
  - Lieferantenvielfalt als ausdrückliches Ziel — für nicht-amerikanische Anbieter theoretisch eine Öffnung,
    praktisch durch Sicherheitsüberprüfungen begrenzt.
  eu_anbieter_relevanz: 'Für europäische Anbieter mit US-Verteidigungsgeschäft potenziell einschneidend:
    Ein Kündigungsrecht wegen politisch unerwünschter Verhaltensmuster kann mit europäischen Compliance-Pflichten
    kollidieren — etwa wenn Modellsteuerung zur Erfüllung der KI-VO oder des DSA als solches Muster gewertet
    würde. Vertragsgestaltung mit ausdrücklicher Regelung dieses Konflikts empfohlen.

    '
