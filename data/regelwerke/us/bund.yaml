      das Haushaltsjahr 2027 aufgenommen; die Konferenzfassung lag am 06.09.2026 nicht vor
  anwendungsdaten:
  - datum: 2026-07-14
    was_gilt: 'Aufnahme in das Manager''s Amendment zum Senats-NDAA FY2027, zusammen mit AI OVERWATCH
      Act und MATCH Act.

      '
    verifiziert: true
    quelle: https://ari.us/senate-ndaa-takes-major-step-to-strengthen-ai-chip-export-controls/
  themenachsen:
  - sicherheit-export
  - marktzugang
  - wettbewerb
  regelungsschwerpunkte:
  - Standortverifikation als Hardware-Anforderung — ein Paradigmenwechsel von der dokumentenbasierten
    Exportkontrolle zur technisch erzwungenen Nachverfolgung.
  - Der NDAA ist das erprobte Vehikel für Exportkontrollgesetzgebung; nach dem Scheitern des GAIN AI Act
    im FY2026-Verfahren ist der FY2027-Anlauf der zweite Versuch.
  - 'Praktische Folgefragen: Datenschutz und Zugriffsrechte auf Telemetriedaten, Umgang mit legalen Standortwechseln,
    Nachrüstung bereits ausgelieferter Hardware.'
  eu_anbieter_relevanz: 'Erhebliche Folgen für europäische Rechenzentrums- und Cloud-Betreiber, die US-Beschleuniger
    einsetzen: Standortverifikation bedeutet, dass US-Behörden mittelbar Kenntnis vom Aufstellungsort
    und gegebenenfalls vom Betriebszustand europäischer Anlagen erhalten könnten. Das berührt Souveränitätszusagen
    gegenüber öffentlichen Kunden in der EU und ist datenschutzrechtlich zu bewerten. Beschaffungsverträge
    sollten Telemetriedatenflüsse ausdrücklich regeln.

    '
