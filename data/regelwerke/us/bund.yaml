- id: us-eo-14179
  jurisdiktion: us
  kurztitel: EO 14179 (Removing Barriers)
  offizieller_titel: 'Executive Order 14179 of January 23, 2025 — Removing Barriers to American Leadership
    in Artificial Intelligence

    '
  fundstelle: 90 FR 8741 (31. Januar 2025)
  verfahrensnummer: EO 14179
  status: anwendbar
  status_detail: 'In Kraft und Grundlage der gesamten KI-Politik der Administration. Ihr Auftrag aus Sec.
    4 ist mit dem AI Action Plan vom 23.07.2025 erfüllt; ihr Auftrag aus Sec. 5 (Revision der OMB-Memoranda)
    mit M-25-21 und M-25-22 vom 03.04.2025.

    '
  kurzbeschreibung: 'Grundsatzanordnung der zweiten Trump-Administration zur KI. Erklärt „global AI dominance"
    zum Politikziel und verlangt KI-Systeme „free from ideological bias or engineered social agendas".
    Ordnet an, alle unter EO 14110 ergangenen Maßnahmen zu überprüfen und zu suspendieren, zu revidieren
    oder aufzuheben, soweit sie der neuen Politik entgegenstehen. Setzt zwei Fristen: 180 Tage für einen
    AI Action Plan, 60 Tage für die Überarbeitung der OMB-Memoranda M-24-10 und M-24-18. Enthält selbst
    keine Pflichten für Private und keine Sanktionen.

    '
  inkrafttreten:
    datum: 2025-01-23
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/01/31/2025-02172/removing-barriers-to-american-leadership-in-artificial-intelligence
  anwendungsdaten:
  - datum: 2025-01-23
    was_gilt: Unterzeichnung; sofortiger Überprüfungsauftrag an alle Behörden (Sec. 5).
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/01/31/2025-02172/removing-barriers-to-american-leadership-in-artificial-intelligence
  - datum: 2025-03-24
    was_gilt: 60-Tage-Frist für die Revision der OMB-Memoranda M-24-10 und M-24-18.
    verifiziert: true
    quelle: https://www.federalregister.gov/documents/2025/01/31/2025-02172/removing-barriers-to-american-leadership-in-artificial-intelligence
  - datum: 2025-07-22
    was_gilt: 180-Tage-Frist für die Vorlage des AI Action Plan; erfüllt am 23.07.2025.
    verifiziert: true
    quelle: https://www.whitehouse.gov/wp-content/uploads/2025/07/Americas-AI-Action-Plan.pdf
  themenachsen:
  - governance
  - marktzugang
  - sektor-oeffentlich
  - gpai
  regelungsschwerpunkte:
  - 'Sec. 1: Zielbestimmung — KI „free from ideological bias or engineered social agendas". Diese Formel
    ist die Wurzel von EO 14319, OMB M-26-04 und der FTC-Policy-Statement-Initiative von 07/2026.'
  - 'Sec. 3: KI-Definition durch Verweis auf 15 U.S.C. 9401(3) — nicht die OECD/EU-Definition, sondern
    die des National AI Initiative Act 2020. Für Definitionsabgleiche mit der KI-VO relevant.'
  - 'Sec. 5: Rücknahmeauftrag. Praktische Folge war das stille Verschwinden der EEOC-, DOL- und OFCCP-Leitlinien
    zu KI im Arbeitsverhältnis.'
  - Enthält keine Adressierung Privater — Wirkung entsteht ausschließlich mittelbar über Beschaffung,
    Förderrecht und Behördenpraxis.
  eu_anbieter_relevanz: 'Kein unmittelbarer Pflichtenkreis. Mittelbar erheblich: Die Anordnung verschiebt
    den Erwartungshorizont amerikanischer Aufsicht von Risikominimierung zu Innovationsförderung. Wer
    ein KI-VO-konformes Produkt in die USA liefert, findet dort keinen Anerkennungsmechanismus für europäische
    Konformitätsnachweise — und muss umgekehrt damit rechnen, dass in der Bundesbeschaffung gerade jene
    Sicherheits- und Fairness-Vorkehrungen erklärungsbedürftig werden, die die KI-VO verlangt (siehe EO
    14319 / M-26-04).

    '
  dokumente:
  - datum: 2025-01-31
    typ: endfassung
    titel: Executive Order 14179 — Removing Barriers to American Leadership in Artificial Intelligence
    url: https://www.federalregister.gov/documents/2025/01/31/2025-02172/removing-barriers-to-american-leadership-in-artificial-intelligence
    sprache: en
    urheber: The White House / Office of the Federal Register
    verifiziert: true
    notiz: Amtlicher Volltext, 90 FR 8741.
  - datum: 2025-02-06
    typ: konsultation
    titel: Request for Information on the Development of an Artificial Intelligence (AI) Action Plan
    url: https://www.federalregister.gov/documents/2025/02/06/2025-02305/request-for-information-on-the-development-of-an-artificial-intelligence-ai-action-plan
    sprache: en
    urheber: OSTP / NSF
    verifiziert: true
    notiz: 'Öffentliche Konsultation zur Vorbereitung des Action Plan. Über 10.000 Eingaben; zeigt, welche
      Industriepositionen in den Plan eingeflossen sind.

      '
  offene_punkte:
  - Ob eine künftige Administration die Anordnung ebenso schnell zurücknehmen kann wie EO 14110 — die
    gesamte US-Bundes-KI-Politik steht auf Exekutivrecht und ist damit wahlperiodisch volatil.
