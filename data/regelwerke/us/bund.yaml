- id: us-chip-security-act
  jurisdiktion: us
  kurztitel: Chip Security Act
  offizieller_titel: 'Chip Security Act — Gesetzentwurf zur Standortverifikation bei der Ausfuhr fortgeschrittener
    KI-Chips

    '
  fundstelle: Nicht Gesetz geworden
  verfahrensnummer: Bill-Nummer nicht verifiziert; im Manager's Amendment zum Senats-NDAA FY2027 enthalten
  status: verfahren
  status_detail: 'Vom House Select Committee on the CCP angenommen; am 14. Juli 2026 in das Manager''s
    Amendment zum Senats-NDAA für das Haushaltsjahr 2027 aufgenommen, gemeinsam mit dem AI OVERWATCH Act
    und dem MATCH Act. Endgültige Aufnahme in die Konferenzfassung bei Rechercheschluss offen. Von Teilen
    der Industrie unterstützt.

    '
  kurzbeschreibung: 'Verpflichtet Exporteure fortgeschrittener KI-Chips, Mechanismen zur Standortverifikation
    einzubauen, mit denen die Verbringung in Embargoländer erkannt und verhindert werden kann. Zielrichtung
    ist die Unterbindung des Chip-Schmuggels nach China. Flankiert vom AI OVERWATCH Act (Verhinderung
    des Abflusses amerikanischer KI-Chips an das chinesische Militär) und vom MATCH Act (Beschränkung
    des Zugangs zu Chokepoint-Fertigungsanlagen).

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://ari.us/senate-ndaa-takes-major-step-to-strengthen-ai-chip-export-controls/
