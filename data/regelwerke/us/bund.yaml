  themenachsen:
  - gpai
  - content
  - urheberrecht
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - Die Risikotaxonomie ist die detaillierteste amtliche US-Aufstellung generativer KI-Risiken und deckt
    sich in weiten Teilen mit den systemischen Risiken nach Art. 55 KI-VO — brauchbar als Mapping-Grundlage.
  - Ausdrückliche Behandlung von Risiken der Wertschöpfungskette und der Datenherkunft — anschlussfähig
    an Art. 25 und Art. 53 KI-VO.
  - 'Institutionell bemerkenswert: Das Dokument überlebt die Aufhebung seiner Rechtsgrundlage, weil NIST
    eine eigenständige Standardisierungskompetenz hat.'
  eu_anbieter_relevanz: 'Das nützlichste einzelne US-Dokument für europäische GPAI-Anbieter. Die Risikoliste
    lässt sich als Gegenprobe zur Modellbewertung nach Art. 55 KI-VO und zum GPAI-Verhaltenskodex verwenden;
    die Handlungsvorschläge liefern konkrete Massnahmenformulierungen für die technische Dokumentation.
    Kein Konformitätsnachweis, aber ein belastbarer Nachweis des Standes der Technik gegenüber US-Kunden.

    '
