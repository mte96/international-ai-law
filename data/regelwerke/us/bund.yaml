- id: us-lanham-act
  jurisdiktion: us
  kurztitel: Lanham Act (15 U.S.C. §§ 1051 ff.)
  offizieller_titel: 'Trademark Act of 1946 (Lanham Act), kodifiziert in 15 U.S.C. §§ 1051-1141n

    '
  fundstelle: Act of July 5, 1946, ch. 540, 60 Stat. 427; 15 U.S.C. § 1125(a) (Section 43(a))
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Seit 1947 in Kraft. Im KI-Bestand tritt Section 43(a) durchgängig als Nebenanspruch
    neben das Urheberrecht auf: Getty (Wasserzeichen in Ausgaben), Andersen (trade dress und false endorsement),
    Dow Jones und CNN gegen Perplexity (halluzinierte Zuschreibungen), Lehrman v. Lovo (abgewiesen). Nach
    Dastar v. Twentieth Century Fox (2003) kann Section 43(a) nicht als Ersatzurheberrecht dienen — die
    Grenze, an der die meisten dieser Ansprüche scheitern.

    '
  kurzbeschreibung: '§ 1125(a)(1)(A) verbietet im geschäftlichen Verkehr irreführende Herkunfts- oder
    Zuordnungsangaben, die eine Verwechslung über Ursprung, Zugehörigkeit oder Billigung hervorrufen können
    (false designation of origin, false endorsement); § 1125(a)(1)(B) verbietet irreführende Angaben über
    Eigenschaften der eigenen oder fremden Ware (false advertising). Für generative Systeme ist die Vorschrift
    dort einschlägig, wo Ausgaben fremde Kennzeichen reproduzieren (Wasserzeichen, Markenzeichen) oder
    wo einer Quelle Aussagen zugeschrieben werden, die sie nie getroffen hat.

    '
  inkrafttreten:
    datum: 1947-07-05
    verifiziert: true
    quelle: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section1125&num=0&edition=prelim
  anwendungsdaten:
  - datum: 2003-06-02
    was_gilt: 'Dastar Corp. v. Twentieth Century Fox: „origin“ meint die Herkunft der Ware, nicht die
      Urheberschaft des Inhalts — Section 43(a) ist kein Ersatzurheberrecht.

      '
    verifiziert: false
    quelle: https://www.supremecourt.gov/
  themenachsen:
  - urheberrecht
  - content
  - wettbewerb
  - haftung
  regelungsschwerpunkte:
  - 'Die halluzinierte Zuschreibung ist der eigentliche KI-Fall des Lanham Act: Wenn ein Suchsystem einer
    Nachrichtenmarke Aussagen zuschreibt, die in deren Berichterstattung nicht stehen, ist das eine irreführende
    Herkunftsangabe — unabhängig davon, ob eine Urheberrechtsverletzung vorliegt (Dow Jones v. Perplexity,
    CNN v. Perplexity).'
  - 'Reproduziertes Wasserzeichen (Getty v. Stability): Das Modell hat die Bildmarke mitgelernt und gibt
    sie in Ausgaben wieder — der klarste Markenfall des Bestands, weil kein Dastar-Problem besteht.'
  - 'Dastar ist die Grenze: Der Vorwurf, ein Modell habe fremde Inhalte ohne Urhebernennung wiedergegeben,
    trägt keinen Lanham-Anspruch. Deshalb sind die Section-43(a)-Ansprüche in Andersen und Lehrman gescheitert.'
  - 'Trade dress im Stilkontext: Der Versuch, den Stil eines Künstlers als schutzfähige Aufmachung zu
    reklamieren (Andersen), ist bislang erfolglos — er würde das urheberrechtliche Stilfreihaltebedürfnis
    unterlaufen.'
  eu_anbieter_relevanz: 'Die Fallgruppen entsprechen §§ 5, 5a UWG und Art. 9 UMV. Die praktisch wichtigste
    Lehre ist für Anbieter von RAG- und Suchsystemen dieselbe wie in Europa: Zitat und Zuschreibung müssen
    belegbar sein. Wo eine Quelle genannt wird, muss die Aussage in ihr stehen — die Quellenangabe ist
    rechtlich eine Herkunftsangabe, kein Höflichkeitshinweis. Das deckt sich mit den Transparenzanforderungen
    des Art. 50 Abs. 1 KI-VO nicht, geht ihnen vielmehr voraus.

    '
  dokumente:
