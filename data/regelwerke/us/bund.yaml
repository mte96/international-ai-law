  - wettbewerb
  regelungsschwerpunkte:
  - 'Comprehensive Outbound Investment National Security Act, Abschnitte 8501 bis 8607: Beschränkungen
    für US-Investitionen in chinesische Verteidigungs- und Überwachungstechnologie, 150 Mio. USD jährlich
    Vollzugsmittel.'
  - Keine Verdrängung einzelstaatlicher KI-Gesetze — die politisch wichtigste Negativfeststellung des
    Gesetzes.
  - KI-Beschaffung und -Einsatz im Verteidigungsministerium; Einzelheiten nicht ausgewertet.
  eu_anbieter_relevanz: 'Für europäische Anbieter mit US-Investoren oder US-Tochtergesellschaften ist
    das Outbound-Investment-Regime zu prüfen: Es kann Beteiligungen an KI-Unternehmen mit China-Bezug
    erfassen. Für Verteidigungslieferanten gelten zusätzlich die Beschaffungsvorschriften des DoD, die
    strenger sind als die zivilen OMB-Vorgaben.

