- id: us-verfassung
  jurisdiktion: us
  kurztitel: US-Verfassung (First Amendment, Art. III)
  offizieller_titel: 'Constitution of the United States of America (1787) nebst Amendments

    '
  fundstelle: U.S. Const.; amtliche Fassung bei congress.gov (Constitution Annotated)
  verfahrensnummer: —
  status: anwendbar
  status_detail: 'Für den KI-Bestand tragen fünf Vorschriften: das First Amendment (Meinungsfreiheit —
    Angriffsmittel gegen jedes einzelstaatliche KI-Gesetz und Einrede gegen Chatbot-Haftung), Art. III
    § 2 (Klagebefugnis — Filter aller DMCA- und Datenschutzsammelklagen), die Commerce Clause und die
    Supremacy Clause (Kompetenz- und Verdrängungsfragen im Preemption-Streit) sowie das Fourteenth Amendment.

    '
  kurzbeschreibung: 'Das First Amendment verbietet dem Bund und — über das Fourteenth Amendment — den
    Bundesstaaten Gesetze, die die Rede- und Pressefreiheit verkürzen; inhaltsbezogene Beschränkungen
    unterliegen der strict scrutiny. Art. III § 2 beschränkt die Bundesgerichtsbarkeit auf „Cases“ und
    „Controversies“ — daraus folgt das Standing-Erfordernis: konkreter, individueller und tatsächlicher
    oder unmittelbar drohender Schaden, kausal und durch die begehrte Entscheidung behebbar (TransUnion
    v. Ramirez). Die Commerce Clause (Art. I § 8 cl. 3) begründet die Bundeskompetenz und begrenzt in
    ihrer ruhenden Ausprägung die Bundesstaaten; die Supremacy Clause (Art. VI cl. 2) trägt die Verdrängung.

    '
  inkrafttreten:
    datum: 1789-03-04
    verifiziert: true
    quelle: https://constitution.congress.gov/
  anwendungsdaten:
  - datum: 1791-12-15
    was_gilt: Ratifikation der Bill of Rights einschließlich des First Amendment.
    verifiziert: true
    quelle: https://constitution.congress.gov/constitution/amendment-1/
  - datum: 1868-07-09
    was_gilt: 'Ratifikation des Fourteenth Amendment; über dessen Due Process Clause bindet das First
      Amendment auch die Bundesstaaten.

      '
    verifiziert: true
    quelle: https://constitution.congress.gov/constitution/amendment-14/
  themenachsen:
  - grundrechte
  - content
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 'DIE ZENTRALE OFFENE FRAGE DES US-KI-RECHTS: Ist der Output eines Sprachmodells geschützte Rede? Garcia
    v. Character Technologies hat es für die Zulassungsstufe verneint („not convinced ... that output
    is speech“), Kohls v. Bonta hat kalifornische Deepfake-Wahlgesetze am First Amendment scheitern lassen,
    xAI v. Weiser greift den Colorado AI Act unter anderem darauf. Eine höchstrichterliche Klärung fehlt.'
  - 'Art. III Standing ist der stillste, aber wirksamste Filter: Raw Story v. OpenAI scheiterte daran,
    nicht an § 1202(b); Popa v. Microsoft ebenso. Die bloße technische Möglichkeit einer Auswertung genügt
    nicht — es bedarf eines Schadens mit Entsprechung im common law.'
  - 'First Amendment als Angriffsmittel gegen Regulierung: Jedes bedeutende einzelstaatliche KI-Gesetz
    wird inzwischen darauf angegriffen (SB 243, SB 53, Colorado SB 24-205, CAADCA). Die Compelled-Speech-Doktrin
    trifft dabei besonders Kennzeichnungs- und Offenlegungspflichten.'
  - Supremacy und Commerce Clause tragen die Preemption-Strategie der Exekutive (EO 14365, DOJ AI Litigation
    Task Force) — der Versuch, einzelstaatliche KI-Gesetze ohne Bundesgesetz durch Prozessführung zu verdrängen.
    Ohne Bundesregelung ist die dogmatische Grundlage schmal.
  - 'IP-Klausel (Art. I § 8 cl. 8): „to promote the Progress of Science and useful Arts, by securing for
    limited Times to Authors and Inventors“ — die Textgrundlage, aus der die Thaler-Linie das Menschlichkeitserfordernis
    mitherleitet.'
  eu_anbieter_relevanz: 'Für europäische Anbieter ist das First Amendment vor allem ein Prognoserisiko:
    Es macht US-Transparenz- und Kennzeichnungspflichten unsicherer, als ihr Gesetzestext vermuten lässt
    — ein Compliance-Aufbau nach SB 942 oder SB 243 kann durch eine einstweilige Anordnung entwertet werden.
    Umgekehrt schützt es US-Anbieter nicht gegen europäische Pflichten: Art. 50 KI-VO und der DSA sind
    nicht am First Amendment zu messen. Wer beide Märkte bedient, sollte die europäischen Pflichten als
    Mindeststandard implementieren und die US-Besonderheiten additiv, nicht alternativ, abbilden.

    '
  dokumente:
  - datum: 2026-09-05
    typ: endfassung
    titel: Constitution Annotated — First Amendment
    url: https://constitution.congress.gov/constitution/amendment-1/
    sprache: en
    urheber: Congressional Research Service / Library of Congress
    verifiziert: true
    notiz: 'Amtliche annotierte Fassung.

      '
  - datum: 2026-09-05
    typ: endfassung
    titel: Constitution Annotated — Article III
    url: https://constitution.congress.gov/constitution/article-3/
    sprache: en
    urheber: Congressional Research Service / Library of Congress
    verifiziert: true
    notiz: 'Grundlage der Standing-Doktrin (Case-or-Controversy-Erfordernis, Art. III § 2 cl. 1).

      '
  offene_punkte:
  - Ob Modelloutput geschützte Rede ist — obergerichtlich ungeklärt, nur Zulassungsentscheidungen.
  - Ob Kennzeichnungspflichten als zulässige Regelung rein tatsächlicher, unumstrittener Angaben (Zauderer)
    oder als compelled speech zu behandeln sind.
  monitoring_quellen:
  - https://constitution.congress.gov/
  - https://www.supremecourt.gov/
