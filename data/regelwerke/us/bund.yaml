    14365 aufzuheben und die Regelungskompetenz der Bundesstaaten für KI ausdrücklich zu erhalten. Senatsfassung
    von Brian Schatz mit Coons, Blunt Rochester, Murphy, Kim und Duckworth; Hausfassung von Don Beyer
    mit Lieu, Matsui, Jacobs, McClain-Delaney und weiteren, insgesamt 34 Mitantragstellern.

