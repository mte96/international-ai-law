  - '07.09.2026: Unverändert. H.R.7209, letzte Aktion 22.01.2026.'
- id: us-guard-act
  jurisdiktion: us
  kurztitel: GUARD Act (KI-Chatbots und Minderjährige)
  offizieller_titel: 'Guidelines for User Age-verification and Responsible Dialogue Act (GUARD Act)

    '
  fundstelle: Nicht Gesetz geworden
  verfahrensnummer: S. 3062, 119. Kongress (Hawley, Blumenthal u. a.)
  status: verfahren
  status_detail: 'Im Mai 2026 vom Senate Judiciary Committee einstimmig angenommen und damit die am weitesten
    fortgeschrittene KI-Vorlage der laufenden Kongressperiode neben den bereits erlassenen Gesetzen. Plenarbehandlung
    im Senat bei Rechercheschluss ausstehend.

    '
  kurzbeschreibung: 'Reguliert KI-Begleit-Chatbots im Verhältnis zu Minderjährigen. Vorgesehen sind Altersverifikation,
    das Verbot, Minderjährigen Begleit-Chatbots bereitzustellen, wiederkehrende Offenlegungspflichten,
    dass es sich nicht um einen Menschen handelt, sowie strafrechtliche Sanktionen für Anbieter, deren
    Systeme Minderjährige zu Selbstverletzung oder sexualisierten Inhalten anleiten. Reaktion auf dokumentierte
    Suizidfälle im Zusammenhang mit Companion-Chatbots. Bemerkenswert ist der Ausnahmekatalog von EO 14365,
    der einzelstaatlichen Kinderschutz ausdrücklich unangetastet lässt — Bund und Länder ziehen hier ausnahmsweise
    in dieselbe Richtung.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.hawley.senate.gov/senator-hawleys-guard-act-to-protect-kids-from-ai-chatbots-passes-committee-unanimously/
    fundstelle_norm: Kein Inkrafttreten — im Mai 2026 vom Senate Judiciary Committee einstimmig angenommen,
      Plenarbehandlung bis 06.09.2026 ausstehend
  anwendungsdaten:
  - datum: 2025-10-28
    was_gilt: Einbringung; Datum nicht verifiziert.
    verifiziert: false
    quelle: https://time.com/7328967/ai-josh-hawley-richard-blumenthal-minors-chatbots/
  - datum: 2026-05-01
    was_gilt: 'Einstimmige Annahme im Senate Judiciary Committee. Genauer Tag nicht verifiziert.

      '
    verifiziert: false
    quelle: https://www.hawley.senate.gov/senator-hawleys-guard-act-to-protect-kids-from-ai-chatbots-passes-committee-unanimously/
  themenachsen:
  - grundrechte
  - content
  - haftung
  - datenschutz
  regelungsschwerpunkte:
  - Altersverifikation als Zugangsvoraussetzung — datenschutzrechtlich heikel, weil sie Identitätsdaten
    bei Chatbot-Anbietern anfallen lässt.
  - Wiederkehrende Offenlegung der Nicht-Menschlichkeit — funktional identisch mit Art. 50 Abs. 1 KI-VO,
    aber mit strafrechtlicher Flankierung.
  - Strafbewehrung für Anbieter, nicht nur Bußgelder — der schärfste Ansatz aller US-Bundesvorlagen zu
    KI.
  - Einstimmigkeit im Ausschuss ist das stärkste Signal für die Verabschiedungsfähigkeit KI-bezogener
    Kinderschutzregeln; parallel laufen H.R. 8382 (Verbot von KI-Chatbot-Komponenten in Kinderprodukten)
    und S. 4199 (Youth AI Privacy Act).
  eu_anbieter_relevanz: 'Hoch relevant für jeden Anbieter dialogfähiger Systeme mit US-Endkunden. Die
    Offenlegungspflicht deckt sich mit Art. 50 KI-VO und ist damit weitgehend abgedeckt; neu und aufwendig
    sind die Altersverifikation und die strafrechtliche Verantwortlichkeit für Modellausgaben gegenüber
    Minderjährigen. Zu beachten ist die Kollision mit der Datenminimierung nach DSGVO: Altersverifikation
    für den US-Markt sollte technisch getrennt und datensparsam (Zero-Knowledge- oder Attributnachweis)
    umgesetzt werden. Da EO 14365 Kinderschutz von der Preemption ausnimmt, kumulieren hier Bundes- und
    Landesrecht.

    '
