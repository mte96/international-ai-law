    quelle: https://www.hlc.com/en/publications/fda-device-guidance-agenda-what-to-watch-in-2026
  themenachsen:
  - sektor-medizin
  - marktzugang
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'PCCP als Kernkonstruktion: Vorabgenehmigung eines Änderungskorridors mit Beschreibung der geplanten
    Änderungen, der Änderungsprotokolle und der Auswirkungsbewertung. Ohne PCCP ist jede wesentliche Modelländerung
    neu zulassungspflichtig.'
  - Der Lifecycle-Entwurf adressiert Transparenz gegenüber Anwendern und Patienten, Verzerrungsminderung
    über den gesamten Lebenszyklus sowie Leistungsüberwachung nach Inverkehrbringen — inhaltlich das US-Pendant
    zu Art. 61 und Art. 72 KI-VO.
  - 'Priorisierungssignal: Die PCCP-Leitlinie steht auf der A-Liste, die umfassende KI-Lifecycle-Leitlinie
    auf der B-Liste. Die FDA priorisiert das Änderungsmanagement, nicht die Querschnitts-KI-Anforderungen.'
  - Kein KI-spezifisches Sanktionsregime — es bleibt bei den Instrumenten des FD&C Act.
  eu_anbieter_relevanz: 'Für europäische Medizin-KI-Hersteller die günstigste Konstellation im gesamten
    Datensatz, weil hier ausnahmsweise eine echte Konvergenz besteht. Der PCCP entspricht funktional dem
    Änderungskonzept nach Art. 43 Abs. 4 KI-VO für vorab festgelegte Änderungen bei Hochrisikosystemen;
    die MDR-Dokumentation, die klinische Bewertung und die Post-Market-Surveillance decken den größten
    Teil der FDA-Erwartungen ab. Praktische Empfehlung: Den PCCP und das KI-VO-Änderungskonzept in einem
    Dokument mit zwei Anhängen führen, damit Änderungsprotokolle und Auswirkungsbewertungen nur einmal
    gepflegt werden. Zu beachten: Die FDA verlangt die Vorabgenehmigung, die KI-VO nur die Vorabfestlegung
    — der US-Weg ist verfahrensrechtlich aufwendiger.

    '
