- id: tw-strafgesetzbuch
  jurisdiktion: tw
  kurztitel: Strafgesetzbuch Taiwan (中華民國刑法), Kapitel 28-1
  offizieller_titel: 中華民國刑法 — Criminal Code of the Republic of China
  fundstelle: 'Verkuendet 01.01.1935 (民國24年1月1日); die hier massgeblichen §§ 319-1 bis 319-6 und das Kapitel
    28-1 妨害性隱私及不實性影像罪 wurden durch die Novelle vom 08.02.2023 (民國112年2月8日), 華總一義字第11200007241號, eingefuegt
    und traten mit der Verkuendung in Kraft; zugleich wurde § 10 um die Definition des 性影像 (Abs. 8) ergaenzt.
    Letzte Novelle des Gesetzes: 22.07.2026 (民國115年7月22日).

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Anwendbar seit 08.02.2023. Das Kapitel 28-1 ist die einzige Stelle des taiwanischen
    Strafrechts mit einem ausdruecklichen Deepfake-Tatbestand. Er ist auf sexuelle Bilder beschraenkt;
    ein allgemeiner Straftatbestand fuer Deepfakes existiert nicht. Politische Deepfakes werden ueber
    § 104 Abs. 2 選罷法 erfasst, kommerzielle ueber § 339-4 und § 31 詐欺犯罪危害防制條例.

    '
  kurzbeschreibung: 'Taiwan hat im Februar 2023 — vor der KI-VO, vor dem daenischen Modell und vor dem
    US-amerikanischen TAKE IT DOWN Act — ein eigenes Strafrechtskapitel gegen sexualisierte Deepfakes
    geschaffen. § 319-4 stellt das Herstellen unwahrer sexueller Bilder einer anderen Person durch Computersynthese
    oder andere technische Methoden in Verbreitungsabsicht unter Strafe (bis fuenf Jahre, bis 500.000
    NTD); Abs. 2 stellt das blosse Verbreiten gleich, Abs. 3 erhoeht bei Gewinnerzielungsabsicht auf sieben
    Jahre und 700.000 NTD. § 319-5 ordnet die zwingende Einziehung an. Anders als § 319-1 Abs. 1 und §
    319-3 Abs. 1 ist § 319-4 ein Offizialdelikt (§ 319-6 e contrario) — das Opfer muss keinen Strafantrag
    stellen. SANKTION: Freiheitsstrafe und Geldstrafe wie beschrieben, zuzueglich Einziehung.

    '
  inkrafttreten:
    datum: 2023-02-08
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=C0000001
