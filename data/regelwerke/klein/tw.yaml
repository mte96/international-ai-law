  themenachsen:
  - content
  - grundrechte
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - '''SIEBEN JAHRE FUER POLITISCHE DEEPFAKES: § 104 Abs. 2 ist strenger als jede Deepfake-Vorschrift
    der EU-Mitgliedstaaten und strenger als § 319-4 StGB Taiwan. Der Strafrahmen von sieben Jahren steht
    neben dem Grundtatbestand von fuenf Jahren; die Qualifikation setzt voraus, dass das Material den
    KANDIDATEN SELBST zeigt — Deepfakes Dritter oder fiktiver Personen fallen nicht darunter.''

    '
  - '''GEGENSTAND DER QUALIFIKATION sind ausdruecklich 聲音、影像、電磁紀錄 (Stimme, Bilder, elektromagnetische
    Aufzeichnungen). Reiner Text ist nicht erfasst — eine von einem Sprachmodell erfundene Aussage in
    Textform bleibt beim Grundtatbestand.''

    '
  - '''AUSLANDSBEZUG: § 51-1 verbietet Medien und Internetdiensteanbietern, Wahlwerbung mittelbar oder
    unmittelbar im Auftrag auslaendischer, festlandchinesischer sowie hongkonger und macauischer Personen
    und Einrichtungen zu schalten, und verpflichtet zur Pruefung samt schriftlicher Versicherung des Auftraggebers.
    Das ist der taiwanische Zuschnitt des Problems: nicht Desinformation als solche, sondern Desinformation
    aus der Volksrepublik.''

    '
  - '''WERBEARCHIV MIT TARGETING-PARAMETERN: § 51-2 verlangt die vierjaehrige Aufbewahrung der Anzeigendatei,
    der eingestellten Zielgruppen und Bedingungen sowie der Versicherung. Die Ausfuehrungsverordnung erlaesst
    die zentrale Wahlkommission. Das entspricht funktional dem Anzeigenarchiv der VO (EU) 2024/900.''

    '
  - '''ZWINGENDE EHRENRECHTSABERKENNUNG: § 113 Abs. 3 ist lex specialis zu § 37 Abs. 2 StGB und greift
    ohne die dortige Mindeststrafschwelle von einem Jahr — auch bei einer Freiheitsstrafe von fuenf Monaten,
    wie das 臺灣南投地方法院 am 19.08.2026 entschieden hat.''

    '
