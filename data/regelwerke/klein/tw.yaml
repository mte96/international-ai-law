- id: tw-patentgesetz
  jurisdiktion: tw
  kurztitel: Patentgesetz Taiwan (專利法)
  offizieller_titel: 專利法 — Patent Act
  fundstelle: 'Neufassung vom 21.12.2011 (民國100年12月21日), in Kraft seit 01.01.2013; zuletzt geaendert am
    04.05.2022 (民國111年5月4日), 華總一經字第11100037451號 (Einfuegung des § 60-1), in Kraft seit 01.07.2022 (行政院院臺經字第1110017213號).
    Rechtskategorie: 行政 ＞ 經濟部 ＞ 智慧財產權目.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Vollstaendig anwendbar. Das Gesetz enthaelt keine KI-spezifische Vorschrift. Die KI-Frage
    ist in Taiwan durch Rechtsprechung geklaert: Erfinder muss eine natuerliche Person sein; ein KI-System
    kann nicht Erfinder sein (智慧財產及商業法院 110年度行專訴字第3號 und 第4號; 最高行政法院 111年度上字第55號 und 110年度上字第813號).

    '
  kurzbeschreibung: 'Taiwans Patentgesetz kennt drei Schutzrechte (Erfindung, Gebrauchsmuster, Design).
    Fuer KI sind vier Vorschriften massgeblich: § 5 Abs. 2 (Recht auf das Patent steht dem Erfinder zu),
    § 21 (Erfindung als Schoepfung technischer Ideen unter Nutzung von Naturgesetzen), § 22 (Neuheit und
    erfinderische Taetigkeit) und § 26 (Offenbarung, die den Fachmann zur Ausfuehrung befaehigt). Auf
    dieser Grundlage hat das TIPO 2020 zwei Anmeldungen von Stephen Thaler, die das KI-System DABUS als
    Erfinder benannten, nach § 17 Abs. 1 als nicht angenommen behandelt; beide Instanzenzuege sind rechtskraeftig
    gegen den Anmelder ausgegangen. SANKTION: keine Strafvorschrift fuer die Falschbenennung; die Folge
    ist die Nichtannahme der Anmeldung.

    '
  inkrafttreten:
    datum: 2013-01-01
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=J0070007
  anwendungsdaten:
  - datum: 2022-07-01
    was_gilt: 'Inkrafttreten des § 60-1 (Verhaeltnis von Patentnichtigkeitsverfahren und Arzneimittelzulassung),
      festgesetzt durch den Exekutiv-Yuan am 13.06.2022.

      '
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=J0070007
  themenachsen:
  - urheberrecht
  - marktzugang
  - governance
  regelungsschwerpunkte:
  - '''§ 5 Abs. 2: Anmeldeberechtigt ist der Erfinder, Gebrauchsmusterschoepfer oder Designer bzw. dessen
    Rechtsnachfolger. Aus der Uebertragbarkeit und Vererblichkeit des Anmelderechts (§§ 6 Abs. 1, 7 Abs.
    4) folgert die Rechtsprechung, dass der Erfinder Rechtsfaehigkeit besitzen muss — und damit natuerliche
    Person sein muss.''

    '
  - '''NAMENSNENNUNGSRECHT ALS PERSOENLICHKEITSRECHT: Die 專利法施行細則 §§ 16, 31 und 83 verlangen die Angabe
    von Name und Staatsangehoerigkeit des Erfinders in Anmeldung und Veroeffentlichungsblatt. Das TIPO
    leitet daraus in seiner 專利法逐條釋義 zu § 5 ab: "由於法人之研發工作，係透過自然人 進行，所以本法所稱之發明人、新型創作人及設計人，均僅限於自然人." Das
    專利審查基準 Teil 1 Kap. 1-2-1 sagt es ausdruecklich: 發明人必為自然人.''

    '
  - '''§ 17 Abs. 1 ist die verfahrensrechtliche Schaltstelle: wird eine gesetzte Frist zur Nachreichung
    versaeumt, wird die Anmeldung nicht angenommen (不予受理). Ueber diesen Weg — nicht ueber eine materielle
    Zurueckweisung — hat das TIPO die DABUS-Anmeldungen erledigt.''

    '
  - '''§ 26 (Offenbarung) ist der Pruefungsmassstab, an dem KI-gestuetzte Erfindungen scheitern koennen:
    die Beschreibung muss den Fachmann in die Lage versetzen, die Erfindung auszufuehren. Bei trainierten
    Modellen ist umstritten, ob die Angabe von Architektur und Trainingsdaten dafuer genuegt. Taiwanische
    Rechtsprechung dazu gibt es bis zum 06.09.2026 nicht.''

    '
