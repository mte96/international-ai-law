  regelungsschwerpunkte:
  - '''RICHTERRECHTLICHE KI-DOKTRIN OHNE GESETZESGRUNDLAGE: Weder § 90-1 法院組織法 noch § 8 der Verordnung
    erwaehnen KI, Deepfakes oder Manipulationsrisiken. Die Gerichte haben das Risiko in das Erlaubnisermessen
    hineingelesen. Das ist funktional dasselbe Vorgehen wie in Mexiko (autocontención) und Kolumbien —
    mit umgekehrtem Vorzeichen: dort begrenzt das Gericht den eigenen KI-Einsatz, hier begrenzt es die
    Rechte der Partei wegen fremden KI-Einsatzes.''

    '
  - '''BREITE ANWENDUNG: Die Erwaegung findet sich zwischen September 2025 und August 2026 in mindestens
    acht Entscheidungen des 臺北高等行政法院 (Hoehere und Bezirkskammer) sowie in einer Familiensache des 臺灣臺北地方法院
    — sie ist keine Einzelmeinung, sondern eine gefestigte Spruchpraxis.''

    '
  - '''RECHTSSCHUTZPROBLEM: Der Antragsteller will die Richtigkeit des Sitzungsprotokolls ueberpruefen.
    Wird ihm die Aufzeichnung mit Blick auf ein abstraktes Manipulationsrisiko verweigert, traegt er die
    Beweislast fuer eine Protokollunrichtigkeit, die er nicht belegen kann. Die Gerichte begegnen dem
    mit dem Hinweis auf andere, gerichtsintern bereitgestellte Ueberpruefungswege.''

    '
