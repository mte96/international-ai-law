  regelungsschwerpunkte:
  - '''Rechtsgrundlage und Zweck (Nr. 2.1): 本框架由數位發展部依據《人工智慧基本法》 第16 條訂定 — erlassen auf der Grundlage
    des Art. 16 KI-Basisgesetz. Das ist die erste und bislang einzige förmliche Durchführungsvorschrift
    zum Rahmengesetz.''

    '
  - '''KATEGORIE A — 「AI 系統本身之技術設計缺陷」 (technische Konstruktionsmängel des Systems selbst), acht Untertypen:
    (A1) Sicherheitslücken und Angriffe auf das KI-System; (A2) fehlende Transparenz oder Erklärbarkeit;
    (A3) Abweichung des KI-Verhaltens von menschlicher Absicht und gesellschaftlichen Werten; (A4) gefährliche
    Fähigkeiten der KI; (A5) Beeinträchtigung der Privatsphäre und Verstöße gegen das Datenschutzrecht;
    (A6) Fragen des geistigen Eigentums; (A7) unzulässige Diskriminierung oder Verzerrung; (A8) fehlerhafte
    oder irreführende Informationen.''

    '
  - '''KATEGORIE B — 「部署後操作及人機互動問題」 (Betrieb nach dem Einsatz und Mensch-Maschine-Interaktion), sechs
    Untertypen: (B1) Überabhängigkeit und unsichere Nutzung; (B2) Verlust menschlicher Autonomie; (B3)
    Erzeugung rechtswidriger Inhalte; (B4) Betrug und Missbrauch von Deepfake-Technik; (B5) Einsatz in
    Cyberangriffen; (B6) unbefugtes Verhalten von KI-Agenten. Untertyp (B6) ist bemerkenswert: Der Rahmen
    benennt agentische KI ausdrücklich als eigenen Risikotyp.''

    '
  - '''KATEGORIE C — 「社會結構與環境衝擊」 (Auswirkungen auf Gesellschaftsstruktur und Umwelt), sechs Untertypen:
    (C1) Ungleichgewicht der Wettbewerbsordnung zwischen Unternehmen und Staaten; (C2) Machtkonzentration
    und ungerechte Nutzenverteilung; (C3) Verschärfung der Ungleichheit und Verschlechterung der Beschäftigungsqualität;
    (C4) Entwertung menschlicher schöpferischer Leistung in Wirtschaft und Kultur; (C5) Umweltschäden;
    (C6) kognitive Kriegführung und Informationssouveränität (認知作戰與資訊主權). Untertyp (C6) hat in keinem
    westlichen Rahmenwerk eine Entsprechung und spiegelt Taiwans spezifische Bedrohungslage durch Informationsoperationen.''

    '
  - '''Vierschrittiges Verfahren: 盤點應用情境 → 識別風險 → 評估風險 → 應對風險 (Anwendungsszenarien erfassen — Risiken
    identifizieren — Risiken bewerten — Risiken behandeln), mit Prüfbögen in den Anhängen; Anhang 1 führt
    die zwanzig Untertypen tabellarisch, Anhang 2 die zugehörigen Maßnahmen.''

    '
  - '''Anwendungsbereich: 民用領域之 AI 應用 — zivile KI-Anwendungen. Militärische Zwecke sind ausdrücklich ausgenommen;
    verteidigungsbezogene KI-Systeme unterliegen gesondertem Verteidigungsrecht. Das entspricht funktional
    der Bereichsausnahme des Art. 2 Abs. 3 KI-VO, ist hier aber im untergesetzlichen Rahmen und nicht
    im Gesetz selbst geregelt: Das KI-Basisgesetz kennt keine ausdrückliche Ausnahme für nationale Sicherheit
    und Verteidigung.''

    '
  - '''Systemunterschied zur KI-Verordnung: Der taiwanische Rahmen ordnet Risiken keine Rechtsfolgen zu.
    Er erzeugt keine Pflichtenkataloge, sondern ein Vokabular. Erst die Fachaufsicht entscheidet nach
    Art. 16 Abs. 2 KI-Basisgesetz, welche Rechtsfolge sie an welchen Risikotyp knüpft. Für die vergleichende
    Arbeit ist das der interessanteste Punkt: Taiwan trennt Risikotaxonomie und Rechtsfolge, die EU verbindet
    beide in Anhang III.''

    '
