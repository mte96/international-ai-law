  regelungsschwerpunkte:
  - 'Aufbau: 20 Artikel ohne Kapitelgliederung. Art. 1-3 Zweck, Behörde, Begriff; Art. 4-5 Grundsätze
    und Schutzauftrag; Art. 6 Strategiekomitee; Art. 7-13 Förderauftrag (Bildung, Kooperation, Haushalt,
    Förderung, Reallabore, internationale Zusammenarbeit, Daten); Art. 14-17 Schutzauftrag (Datenschutz,
    Arbeit, Risikoklassifizierung, Haftung); Art. 18-19 Rechtsanpassung und staatlicher KI-Einsatz; Art.
    20 Inkrafttreten.

    '
  - '''Art. 1: Zweckbestimmung mit neun Zielen — 建設智慧國家 (Aufbau eines intelligenten Staates), 以人為本 (menschenzentriert),
    數位平權 (digitale Gleichstellung), 保障人民基本權利, 維護國家文化價值 (Wahrung nationaler Kulturwerte), 提升國際競爭力. Satz
    2 enthält eine Subsidiaritätsklausel: 本法未規定者，適用其他法律之規定 — was dieses Gesetz nicht regelt, richtet sich
    nach den übrigen Gesetzen. Das ist der klassische Bauplan eines taiwanischen 基本法.''

    '
  - '''Art. 2 (BEHÖRDENARCHITEKTUR): Zentrale Behörde ist der 國家科學及技術委員會 (National Science and Technology
    Council, NSTC), auf lokaler Ebene die Regierungen der Sonderstädte und Landkreise. Abs. 2 verweist
    alle in die Ressortzuständigkeit fallenden Materien an die jeweiligen 目的事業主管機關 (Fachaufsichtsbehörden).
    Diese Aufspaltung ist der Schlüssel zum Verständnis des Gesetzes: es gibt keine zentrale KI-Marktaufsicht
    taiwanischer Prägung, sondern eine Koordinierungsbehörde (NSTC), ein operatives Ministerium (數位發展部/MODA,
    Art. 5 und 16) und n Fachaufsichten.''

    '
  - '''Art. 3 (KI-BEGRIFF): 具自主運行能力之系統，該系統透過輸入或感測，經由機器學習 及演算法，可為明確或隱含之目標實現預測、內容、建議或決策等影響實體或虛擬環境之產出. Amtliche
    Übersetzung: a system capable of autonomous operation, which, through input or sensing and by means
    of machine learning and algorithms, can generate outputs such as predictions, content, recommendations,
    or decisions that affect physical or virtual environments to achieve explicit or implicit objectives.
    Der Text folgt erkennbar der OECD-Definition von 2023 und damit auch Art. 3 Nr. 1 KI-VO — mit einem
    wesentlichen Unterschied: er verengt die technische Grundlage ausdrücklich auf 機器學習及演算法 (maschinelles
    Lernen UND Algorithmen), während die KI-VO technologieneutral formuliert. Ein rein regelbasiertes
    Expertensystem fällt nach dem Wortlaut nicht unter das taiwanische Gesetz.''

    '
  - '''Art. 4 (SIEBEN GRUNDSÄTZE): (1) 永續發展與福祉 Nachhaltigkeit und Wohlergehen, einschließlich Bildung
    zur Verringerung digitaler Spaltung; (2) 人類自主 menschliche Autonomie, Achtung des Persönlichkeitsrechts
    (人格權), menschliche Aufsicht, Rechtsstaatlichkeit und demokratische Werte; (3) 隱私保護與資料治理 Datenschutz
    und Datengovernance, ausdrücklich einschließlich der Geschäftsgeheimnisse von Unternehmen (營業秘密) und
    des Datenminimierungsgrundsatzes, zugleich Förderung der Öffnung nicht sensibler Daten; (4) 資安與安全
    Cybersicherheit; (5) 透明與可解釋 Transparenz und Erklärbarkeit — die Ausgaben von KI sind 適當資訊揭露或標記 (angemessen
    offenzulegen oder zu kennzeichnen); (6) 公平與不歧視; (7) 問責 Rechenschaft, ausdrücklich unterteilt in 內部治理責任
    (interne Governance-Verantwortung) und 外部社會責任 (externe gesellschaftliche Verantwortung). Adressat
    der Grundsätze ist nach dem Wortlaut die Regierung (政府推動人工智慧之研發與應用), nicht der Entwickler.''

    '
  - '''Art. 5 (SCHUTZAUFTRAG UND HOCHRISIKO-KENNZEICHNUNG): Abs. 1 nennt den Katalog abzuwehrender Folgen
    — Verletzung von Leben, Körper, Freiheit oder Eigentum; Zerstörung der sozialen Ordnung, der nationalen
    Sicherheit oder der ökologischen Umwelt; Verzerrung, Diskriminierung, irreführende Werbung, Informationsmanipulation
    oder Fälschung. Abs. 2 ist die einzige Vorschrift des Gesetzes mit produktbezogenem Regelungsgehalt:
    Wird ein KI-Produkt oder -System von der zuständigen Fachaufsicht IM BENEHMEN MIT DEM DIGITALMINISTERIUM
    als Hochrisikoanwendung eingestuft, 應明確標示注意事項或警語 — sind Hinweise oder Warnhinweise deutlich anzubringen.
    Abs. 2 stellt zugleich das Kindeswohl als Leitprinzip voran (以兒少最佳利益為原則). Abs. 3 und 4 verpflichten
    das Digitalministerium zur Bereitstellung von Bewertungs- und Verifizierungswerkzeugen und deren Erarbeitung
    unter Anhörung von Interessengruppen, Industrie, Wissenschaft, Zivilgesellschaft und Rechtsexperten.''

    '
  - '''Art. 6 (STRATEGIEKOMITEE): 國家人工智慧戰略特別委員會 beim Exekutiv-Yuan, einberufen vom Premierminister, besetzt
    mit Wissenschaft, Verbänden, Industrie, Ministern ohne Geschäftsbereich, Behördenleitern und den Leitern
    der Kommunalverwaltungen. Aufgabe: Koordinierung, Förderung und Aufsicht über sämtliche nationalen
    KI-Angelegenheiten sowie Beschlussfassung über die 國家人工智慧發展綱領 (National AI Development Guidelines).
    Mindestens eine Sitzung jährlich; bei plötzlichen Notlagen oder Großereignissen ist eine Sondersitzung
    einzuberufen. Geschäftsstelle: NSTC. Das Komitee wurde am 21.05.2026 vom Premierminister förmlich
    eingesetzt.''

    '
  - '''Art. 11 (INNOVATIONSVORRANG UND REALLABORE): Abs. 1 Satz 2 enthält eine bemerkenswerte Kollisionsregel:
    相關法規之解釋與適用，如與其他法規扞格， 在符合本法第四條基本原則之前提下，以促進新技術與服務之提供為優先原則 — kollidieren Auslegung und Anwendung einschlägiger
    Vorschriften mit anderen Vorschriften, gilt vorbehaltlich der Grundsätze des Art. 4 der Vorrang der
    Förderung neuer Technologien und Dienste. Das ist ein gesetzlich angeordnetes Auslegungsprinzip zugunsten
    der Innovation, das im europäischen Recht keine Entsprechung hat. Abs. 2 ermächtigt die Fachaufsichten
    zur Einrichtung von Reallaboren (創新實驗環境).''

    '
  - '''Art. 13 Abs. 2 (DATEN UND GEISTIGES EIGENTUM): 政府應致力提升我國人工智慧 使用資料之品質與數量，確保訓練及產出結果足以展現國家多元文化價值與維護智慧財產權
    — die Regierung soll Qualität und Menge der für KI genutzten Daten erhöhen und sicherstellen, dass
    Training und Ausgabe die kulturelle Vielfalt des Landes abbilden UND das geistige Eigentum wahren.
    Das ist die einzige urheberrechtliche Aussage des Gesetzes und zugleich der Anknüpfungspunkt für die
    Leitlinienarbeit des TIPO.''

    '
  - '''Art. 16 (RISIKOKLASSIFIZIERUNG): Abs. 1 verpflichtet das Digitalministerium, unter Bezugnahme auf
    internationale Standards einen mit internationalen Rahmenwerken interoperablen 人工智慧風險分類框架 zu betreiben
    und die Fachaufsichten bei der Aufstellung risikobasierter Verwaltungsvorschriften zu unterstützen.
    Abs. 2 verpflichtet die Fachaufsichten, dem Rahmen folgend eigene risikobasierte Vorschriften zu erlassen
    und die Branchen bei Selbstverpflichtungen zu unterstützen; liegt ein Fall des Art. 5 Abs. 1 vor,
    應依法令限制或禁止之 — ist er nach den Gesetzen zu beschränken oder zu verbieten. Der Verweis auf 法令 macht deutlich:
    das Verbot folgt nicht aus diesem Gesetz, sondern aus dem jeweiligen Fachrecht.''

    '
  - '''Art. 17 (HAFTUNG): Abs. 1 — bei der Anwendung von Hochrisiko-KI soll die Regierung 明確其責任歸屬及歸責條件
    (Haftungszuordnung und Zurechnungsvoraussetzungen klarstellen) und 救濟、補償或保險機制 (Rechtsschutz-, Entschädigungs-
    oder Versicherungsmechanismen) errichten. Abs. 2 nimmt die Forschung und Entwicklung VOR der tatsächlichen
    Anwendung aus, mit Rückausnahme für Tests in realer Umgebung und für die Nutzung der Entwicklungsergebnisse
    zur Erbringung von Produkten und Diensten. Das ist eine Regelungsanweisung an den Gesetzgeber, keine
    Anspruchsgrundlage: Ein Geschädigter kann aus Art. 17 heute nichts herleiten.''

    '
  - '''Art. 18 (ZWEIJAHRESFRIST): Abs. 1 — die Regierung hat ihr Fachrecht und ihre Verwaltungsmaßnahmen
    zu überprüfen; wo sie diesem Gesetz widersprechen oder wo Regelungen fehlen, ist die Rechtsetzung,
    -änderung oder -aufhebung binnen ZWEI JAHREN ab Inkrafttreten abzuschließen — Frist: 14.01.2028. Abs.
    2 ordnet für die Übergangszeit an, dass bei Regelungslücken die zentrale Fachaufsicht im Benehmen
    mit der zentralen Behörde (NSTC) nach diesem Gesetz auslegt und anwendet. Damit wirkt das Gesetz bereits
    vor jeder Fachrechtsanpassung als Auslegungsmaßstab.''

    '
  - '''Art. 19 (STAATLICHER KI-EINSATZ): Abs. 1 — setzt die Regierung KI zur Aufgabenerfüllung oder Dienstleistungserbringung
    ein, hat sie eine Risikobewertung durchzuführen und Gegenmaßnahmen zu planen. Abs. 2 — je nach Art
    der Aufgabe sind Nutzungsvorschriften oder interne Kontrollmechanismen zu erlassen. Diese Vorschrift
    ist die Rechtsgrundlage der Justizleitlinie des 司法院 vom 22.04.2026 und der Ressortleitlinien.''

    '
  - '''FÜNF BEGLEITENDE ENTSCHLIESSUNGEN (附帶決議, angenommen am 23.12.2025, übermittelt am 08.01.2026 mit
    台立院議字第1140704341號): (1) Der für Technologie zuständige Minister ohne Geschäftsbereich hat das Digitalministerium
    gemeinsam mit NSTC, Bildungs- und Gesundheitsministerium anzuweisen, binnen drei Monaten nach der
    dritten Lesung eine Kinder- und Jugendfolgenabschätzung zum KI-Einsatz abzuschließen und zu veröffentlichen;
    (2) entsprechend für Kinderwohl-, Menschenrechts- und Geschlechterfolgenabschätzung, jeweils mit dauerhaftem
    Bewertungsmechanismus; (3) sämtliche staatlichen Stellen haben binnen sechs Monaten die Risikobewertung
    ihrer bestehenden KI-gestützten Dienste abzuschließen und binnen eines Jahres Nutzungsvorschriften
    oder interne Kontrollen einzurichten; (4) zur Infrastruktur im Sinne des Art. 10 zählen ausdrücklich
    Rechenzentren und Energieanlagen; (5) das Bildungsministerium hat binnen sechs Monaten Leitlinien
    zur KI-Nutzung und zum KI-Lernen für Schulen zu veröffentlichen, die Minderjährigenschutz, Informationsethik,
    Privatsphäre und richtige Nutzung abdecken. Die Entschließungen (1), (2), (3) und (5) sind erfüllt
    worden — die Folgenabschätzungen wurden bis Mai 2026 vorgelegt, die Schulleitlinie am 05.06.2026 erlassen.''

    '
  - '''GESETZGEBUNGSVERFAHREN — 34 VORLAGEN: Die dritte Lesung erfasste im Wege der 併案審查 (verbundene Beratung)
    33 Abgeordneten- und Fraktionsvorlagen plus die Regierungsvorlage (20政11015829). Vorlagen unter dem
    Titel 人工智慧基本法草案 stammten u.a. von 葛如鈞等37人, 邱若華等17人, 羅廷瑋等17人, 萬美玲等18人, 許宇甄等20人, 張嘉郡等21人, 林倩綺等23人, 邱議瑩等20人,
    吳宗憲等17人, 賴士葆等28人, 楊瓊瓔等26人, 許智傑等27人, 林宜瑾等26人, 張雅琳等18人, 謝衣鳯等17人, 陳秀寳等25人, 林思銘等17人, 范雲等18人, 徐巧芯等16人,
    王美惠等18人, 廖偉翔等19人, 賴瑞隆等20人, 吳沛憶等23人, 郭昱晴等19人, 林月琴等28人, 徐富癸等16人, 黃捷等17人, 邱鎮軍等22人, 陳菁徽等21人, 葉元之等18人 und
    伍麗華Saidhai Tahovecahe等21人. Federführend berieten der Bildungs- und Kulturausschuss und der Verkehrsausschuss
    (教育及文化、交通兩委員會) gemeinsam. Diese Zahl konkurrierender Vorlagen ist selbst ein Befund: Praktisch jede
    Fraktion und zahlreiche einzelne Abgeordnete beider Lager hatten eine eigene Fassung eingebracht.''

    '
  - '''ABWEICHENDES REGELUNGSMODELL DER TPP: Die Fraktion der 台灣民眾黨 (Taiwan People''''s Party) legte als
    einzige keinen Entwurf für ein 基本法 vor, sondern für ein 人工智慧發展及管理條例 (Artificial Intelligence Development
    and Management Act) — also für ein Regelungsgesetz mit unmittelbaren Pflichten statt eines Grundsatzgesetzes.
    Diese Fassung ist im Verfahren nicht durchgedrungen. Sie markiert die eigentliche Grundsatzentscheidung
    des taiwanischen Gesetzgebers: Grundsätze statt Ge- und Verbote.''

    '
  - '''WAS DAS GESETZ NICHT ENTHÄLT: keine Verbotstatbestände (kein Pendant zu Art. 5 KI-VO), keine Konformitätsbewertung,
    keine Registrierung, keine Marktüberwachungsbehörde, keine Sanktionen, keine GPAI-Vorschriften, keine
    Transparenzpflicht des Anbieters gegenüber dem Nutzer (Art. 4 Nr. 5 richtet sich an die Regierung),
    keine Trainingsdaten-Offenlegung, keine Regelung der Urheberrechtsschranken. Wer das Gesetz mit der
    KI-VO vergleicht, vergleicht ein Staatszielbestimmungsgesetz mit einem Produktsicherheitsrecht.''

    '
