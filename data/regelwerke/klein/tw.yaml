regelwerke:
- id: tw-ki-basisgesetz
  jurisdiktion: tw
  kurztitel: KI-Basisgesetz Taiwan (人工智慧基本法)
  offizieller_titel: 人工智慧基本法 — Artificial Intelligence Basic Act
  fundstelle: 'Präsidialerlass vom 14.01.2026 (民國115年1月14日), 華總一義字第11500001671號令, 制定公布全文 20 條；並自公布之日起施行.
    Legislativ-Yuan-Drucksache: 公報 115卷001期 總號5400. Gesetzeskategorie: 行政 ＞ 國家科學及技術委員會 ＞ 科學技術目.

    '
  verfahrensnummer: '院總第20號; Regierungsvorlage 20政11015829; dritte Lesung im 立法院第11屆第4會期第14次會議 am 23.12.2025
    (1141223)

    '
  status: anwendbar
  status_detail: 'In Kraft seit dem 14.01.2026 (Art. 20: 自公布之日起施行 — mit dem Tag der Verkündung). Vollständig
    anwendbar, aber als 基本法 (Grundsatzgesetz) ohne unmittelbare Verhaltenspflichten für Private und ohne
    Sanktionsvorschriften. Die Umsetzung läuft: Der Exekutiv-Yuan hat am 21.05.2026 den Bericht des Digitalministeriums
    zur ''Durchführungsplanung'' entgegengenommen, das 國家人工智慧戰略特別委員會 (Art. 6) eingesetzt und den NSTC
    mit der Erarbeitung der ersten 國家人工智慧發展綱領 beauftragt. Der Risikoklassifizierungsrahmen nach Art. 16
    ist am 07.07.2026 ergangen.

    '
  kurzbeschreibung: 'Zweites eigenständiges KI-Rahmengesetz Ostasiens nach dem südkoreanischen. Es verpflichtet
    in 20 Artikeln ausschließlich die öffentliche Hand: Es legt sieben Governance-Grundsätze fest (Art.
    4), definiert KI (Art. 3) in enger Anlehnung an die OECD-Definition, verpflichtet die Regierung, schädigende
    Anwendungen zu verhindern (Art. 5 Abs. 1), sieht für als hochriskant eingestufte Produkte eine Hinweis-
    und Warnpflicht vor (Art. 5 Abs. 2), errichtet ein Strategiekomitee beim Exekutiv-Yuan (Art. 6), regelt
    Bildung (Art. 7), Haushalt (Art. 9), Förderung (Art. 10), Reallabore (Art. 11), Datengovernance (Art.
    13), Datenschutz durch Voreinstellung (Art. 14), Arbeitnehmerrechte (Art. 15), eine international
    anschlussfähige Risikoklassifizierung (Art. 16), Haftungszuordnung und Entschädigungsmechanismen für
    Hochrisiko-KI (Art. 17), eine Zweijahresfrist zur Anpassung des gesamten Fachrechts (Art. 18) und
    Risikobewertungspflichten für den staatlichen KI-Einsatz (Art. 19). SANKTION: keine. Das Gesetz enthält
    weder Bußgeld- noch Straftatbestände; die Durchsetzung erfolgt über das jeweilige Fachrecht, das nach
    Art. 18 bis zum 14.01.2028 angepasst werden muss.

    '
