    quelle: https://www.ey.gov.tw/Page/9277F759E41CCD91/999df6da-6539-4941-913f-5125d684c58d
  - datum: 2026-07-07
    was_gilt: 'Erlass und Inkrafttreten des Rahmens v1.0 (數位策略字第1150015933號).

