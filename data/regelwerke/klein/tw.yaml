  - datum: 2026-01-14
    was_gilt: 'Mit Inkrafttreten des KI-Basisgesetzes tritt Art. 19 als gesetzliche Grundlage neben die
      Leitlinie; die Ressorts sind nunmehr gesetzlich zur Risikobewertung und zum Erlass eigener Nutzungsvorschriften
      verpflichtet.

      '
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0160093
  themenachsen:
  - sektor-oeffentlich
  - governance
  - datenschutz
  - urheberrecht
  regelungsschwerpunkte:
  - '''Aufbau: Zweck (Nr. 1), zu beachtende Punkte beim Einsatz generativer KI (Nr. 2 bis 8), entsprechend
    anwendende Einrichtungen (Nr. 9), Ermächtigung anderer Behörden zur Aufstellung eigener Regeln unter
    Anlehnung an diese Leitlinie (Nr. 10).''

    '
  - '''Nr. 7 (in der Fassung, die die weiterleitenden Behördenmitteilungen zitieren): 使用生成式 AI 應遵守資通安全、個人資料保護、著作權及相關資訊使用規定，
    並注意其侵害智慧財產權與人格權之可能性。各機關得依使用生成式 AI 之設備及業務性質， 訂定使用生成式 AI 之規範或內控管理措施 — beim Einsatz generativer KI sind
    die Vorschriften über Informationssicherheit, Datenschutz, Urheberrecht und Informationsnutzung einzuhalten
    und die Möglichkeit der Verletzung von Immaterialgüter- und Persönlichkeitsrechten zu beachten; die
    Behörden können nach Art der Geräte und Aufgaben eigene Vorschriften oder interne Kontrollmaßnahmen
    erlassen. Diese Nummer ist der Vorläufer des heutigen Art. 19 Abs. 2 KI-Basisgesetz.''

    '
  - 'Leitbegriffe der Leitlinie sind Sicherheit (安全性), Privatheit und Datengovernance (隱私性、資料治理), Rechenschaft
    (問責) sowie Autonomie und Kontrolle (自主權與控制權). Der NSTC hat zugesagt, die Leitlinie rollierend an die
    internationale Entwicklung anzupassen (滾動調整).

    '
  - 'Bedeutung für die Rechtsvergleichung: Die Leitlinie ist funktional das taiwanische Gegenstück zur
    italienischen Art. 14 Legge 132/2025 und zu den Verwaltungs-KI-Vorgaben des griechischen N. 4961/2022
    — nur eben zweieinhalb Jahre früher und ohne Gesetzesrang.

    '
