  offene_punkte:
  - 'Der Volltext der Leitlinie ist nicht öffentlich abrufbar. Die Regelungsinhalte sind über die amtliche
    Bekanntgabe des 司法院 belegt, der Wortlaut der einzelnen Nummern nicht.

    '
  - 'Die Leitlinie verweist auf ''vom 司法院 genehmigte oder gebilligte'' KI-Systeme. Eine Liste dieser Systeme
    ist nicht veröffentlicht.

    '
  - 'Ob die Leitlinie auch für Rechtsanwälte und sonstige externe Nutzer Wirkungen entfaltet (etwa über
    Verfahrensordnungen), ist nicht geregelt; sie bindet nach ihrem Wortlaut nur die Bediensteten des
    司法院 und der nachgeordneten Gerichte.

    '
