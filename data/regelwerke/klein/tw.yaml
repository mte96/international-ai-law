  jurisdiktion: tw
  kurztitel: Datenschutzgesetz Taiwan (個人資料保護法, PDPA)
  offizieller_titel: 個人資料保護法 — Personal Data Protection Act
  fundstelle: 'Urspruenglich 電腦處理個人資料保護法 vom 11.08.1995 (民國84年8月11日); Umbenennung und Neufassung am 26.05.2010
    (民國99年5月26日), in Kraft seit 01.10.2012. Zuletzt geaendert am 11.11.2025 (民國114年11月11日), 華總一經字第11400114521號.
    Rechtskategorie: 行政 ＞ 個人資料保護委員會籌備處 ＞ 通用目.

    '
  verfahrensnummer: 'Regierungsvorlage des Exekutiv-Yuan vom 27.03.2025 (民國114年3月27日); dritte Lesung im
    立法院院會第11屆第4會期第5次會議 am 17.10.2025.

    '
  status: teilanwendbar
  status_detail: 'Das Gesetz in seiner Fassung von 2015 ist anwendbar. Die beiden entscheidenden Novellen
    sind es NICHT: § 1-1 (Zustaendigkeit der 個人資料保護委員會), eingefuegt am 31.05.2023, und das gesamte Paket
    vom 11.11.2025 (Meldepflicht bei Datenschutzvorfaellen, Datenschutz- beauftragte der Behoerden, Beschraenkung
    internationaler Transfers, Audit- und Pruefbefugnisse, neues Kapitel III-1) treten erst in Kraft,
    wenn der Exekutiv-Yuan das Datum bestimmt. Das setzt nach amtlicher Auskunft der Vorbereitungsstelle
    die Verabschiedung des noch nicht beschlossenen 個人資料保護委員會組織法 voraus. Bis dahin bleibt es bei der dezentralen
    Aufsicht durch die jeweiligen Fachaufsichten — die das 最高行政法院 am 07.08.2026 ausdruecklich bestaetigt
    hat.

    '
  kurzbeschreibung: 'Taiwans Datenschutzgesetz ist aelter als die DSGVO und folgt einer anderen Grundstruktur:
    keine zentrale Aufsichtsbehoerde, sondern dezentrale Aufsicht durch die Fachaufsichten (分散式管理); keine
    Rechtsgrundlagensystematik nach Art. 6 DSGVO, sondern getrennte Kataloge fuer oeffentliche (§§ 15,
    16) und nichtoeffentliche Stellen (§§ 19, 20); und — fuer KI entscheidend — KEIN Recht auf Nichtunter-
    werfung unter automatisierte Entscheidungen und KEIN Anspruch auf Auskunft ueber die Entscheidungslogik.
    Das taiwanische Recht kennt kein Aequivalent zu Art. 22 DSGVO. SANKTION: Bussgelder von 20.000 bis
    200.000 NTD (§ 48) und, was in der Praxis wichtiger ist, die Strafvorschrift des § 41 mit Freiheitsstrafe
    bis zu fuenf Jahren und Geldstrafe bis zu 1.000.000 NTD — die in KI-Faellen regelmaessig die schwerste
    Norm der Idealkonkurrenz ist.

    '
