  regelungsschwerpunkte:
  - '''§ 31 Abs. 4 — TAIWANS DEEPFAKE-DEFINITION: 以電腦合成或其他科技方法 製作本人不實之言行，並足使他人誤信為真之技術表現形式. Drei Merkmale:
    technische Erzeugung, Unwahrheit der dargestellten Aeusserung oder Handlung DER BETROFFENEN PERSON
    SELBST, und Eignung zur Taeuschung ueber die Echtheit. Rein fiktive Personen sind nicht erfasst.''

    '
  - '''§ 31 Abs. 1 Nr. 4 ist eine Offenlegungspflicht des PLATTFORM- BETREIBERS, nicht des Werbetreibenden
    und nicht des KI-Anbieters. Taiwan hat damit bewusst NICHT das chinesische Modell der Anbieterkennzeichnung
    uebernommen (vgl. 互聯網信息服務深度合成管理規定), sondern eine Intermediaerspflicht in einem eng umgrenzten Kontext.''

    '
  - '''ABS. 2 ENTHAELT EINE RISIKOBASIERTE ERLEICHTERUNG: Hat der Betreiber die Identitaet nach § 30 Abs.
    2 Nr. 1 verifiziert und handelt es sich nicht um einen Hochrisiko-Geschaeftspartner, darf die Offenlegung
    vereinfacht werden. Das ist derselbe risikobasierte Ansatz, den Art. 16 KI-Basisgesetz zwei Jahre
    spaeter verallgemeinert hat.''

    '
  - '''ZUSTAENDIG ist die 數位經濟相關產業主管機關 — also das Digitalministerium. Damit liegt die einzige geltende
    KI-Kennzeichnungspflicht bei derselben Behoerde, die Art. 5 Abs. 2 und Art. 16 KI-Basisgesetz ausfuehrt.''

    '
