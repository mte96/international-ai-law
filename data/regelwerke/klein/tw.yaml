  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - '''KEIN ART. 22 DSGVO: Das PDPA kennt weder ein Verbot noch eine Beschraenkung automatisierter Einzelentscheidungen
    und keinen Anspruch auf Erlaeuterung der Entscheidungslogik. § 3 zaehlt fuenf unverzichtbare Betroffenenrechte
    auf — Auskunft, Kopie, Berichtigung, Unterlassung, Loeschung — und keines davon erfasst die Logik
    einer algorithmischen Entscheidung. Diese Luecke ist der Grund, weshalb Art. 14 KI-Basisgesetz auf
    "Datenschutz durch Voreinstellung und Technikgestaltung" ausweicht statt auf Betroffenenrechte.''

    '
  - '''§ 19 Abs. 1 Nr. 7 (Daten aus allgemein zugaenglichen Quellen) ist die Vorschrift, auf die sich
    Web Scraping fuer Trainingszwecke in Taiwan stuetzen muesste. Sie steht unter einem Interessenvorbehalt
    zugunsten des Betroffenen und wird durch die Loeschpflicht des Abs. 2 flankiert: Widerspricht der
    Betroffene, ist die Verarbeitung einzustellen. Das ist ein gesetzliches Opt-out — nicht im Urheberrecht,
    sondern im Datenschutzrecht.''

    '
  - '''§ 41 ALS SCHWERSTE NORM: Wer in Schaedigungsabsicht gegen § 20 Abs. 1 verstoesst, wird mit Freiheitsstrafe
    bis zu fuenf Jahren und Geldstrafe bis 1.000.000 NTD bestraft. Weil § 319-4 Abs. 2 StGB nur bis 500.000
    NTD reicht, ist in der taiwanischen Praxis bei KI-Deepfakes das Datenschutzstrafrecht die schwerere
    Norm — mit der Folge, dass Gerichte aus der Idealkonkurrenz heraus nach § 41 PDPA verurteilen und
    nicht nach dem Deepfake-Tatbestand (臺灣新竹地方法院 115年度訴字第339號; 臺灣臺北地方法院 115年度訴字第41號).''

    '
  - '''DEZENTRALE AUFSICHT: § 22 Abs. 1 weist die Aufsicht ueber nichtoeffentliche Stellen den zentralen
    Fachaufsichten und den Kommunen zu. Das 最高行政法院 hat am 07.08.2026 entschieden, dass die Befugnisse
    aus §§ 27 und 48 — anders als die aus §§ 22 bis 26 — NICHT auf nachgeordnete Behoerden uebertragen
    werden koennen. Fuer die KI-Aufsicht bedeutet das: Auch die Befugnisse aus Art. 5 Abs. 2 und Art.
    16 KI-Basisgesetz sind bei der jeweiligen zentralen Fachaufsicht selbst angesiedelt.''

    '
  - '''§ 6 Abs. 1 Nr. 4 (Forschungsprivileg fuer besondere Datenkategorien) ist die Grundlage der taiwanischen
    Gesundheitsdatennutzung. Sie war Gegenstand der Verfassungsgerichtsentscheidung 111年憲判字第13號 (2022),
    die die Errichtung einer unabhaengigen Aufsichtsbehoerde und einen Widerspruchsmechanismus verlangte
    — der Ausloeser fuer § 1-1 und die 個人資料保護委員會.''

    '
