  offizieller_titel: '高級中等以下學校人工智慧使用和學習指引 — Guidelines on the Use of and Learning about Artificial Intelligence
    in Schools at and below the Senior Secondary Level

    '
  fundstelle: 'Erlass des 教育部 (Ministry of Education) vom 05.06.2026 (民國115年6月5日), 臺教資（一）字第1152701618號函,
    ergangen ausdrücklich in Ausführung der fünften begleitenden Entschließung des Legislativ-Yuan zum
    人工智慧基本法.

    '
  verfahrensnummer: 臺教資（一）字第1152701618號
  status: softlaw
  status_detail: 'In Kraft seit dem 05.06.2026, an die Schulverwaltungen weitergeleitet ab dem 12.06.2026.
    Sie tritt neben die bereits bestehenden Instrumente des Ministeriums (中小學數位教學指引 3.0 vom August 2024,
    中小學使用生成式人工智慧注意事項 2.1, 中小學生成式AI之學習應用手冊) und ist die erste, die unmittelbar auf das KI-Basisgesetz zurückgeht.

    '
  kurzbeschreibung: 'Die Leitlinie richtet sich getrennt an Schulleitungen, Lehrkräfte, Schülerinnen und
    Schüler sowie Eltern und beschreibt für jede Rolle, wie KI sicher, angemessen und verantwortlich genutzt
    wird. Sie stellt die körperliche und geistige Entwicklung und den Schutz Minderjähriger in den Mittelpunkt
    (重視未成年人之身心發展與保護), verlangt Nutzung unter angemessener Anleitung und Begleitung, integriert Informationsethik
    und verbindet Datenschutz mit Informationssicherheit. Sanktion: keine; Umsetzung über die Schulaufsicht.

    '
  inkrafttreten:
    datum: 2026-06-05
    verifiziert: true
    quelle: https://unfps.ntct.edu.tw/p/404-1066-499881.php
  anwendungsdaten:
  - datum: 2025-12-23
    was_gilt: 'Der Legislativ-Yuan beschließt mit der fünften begleitenden Entschließung zum KI-Basisgesetz,
      dass das Bildungsministerium binnen sechs Monaten Leitlinien zur KI-Nutzung und zum KI-Lernen an
      Schulen zu veröffentlichen hat (Minderjährigenschutz, Informationsethik, Privatsphäre und Sicherheit,
      richtige Nutzung).

      '
    verifiziert: false
    quelle: https://www.ttsh.tp.edu.tw/wp-content/uploads/doc/g151/人工智慧基本法附帶決議.pdf
  - datum: 2026-06-05
    was_gilt: 'Erlass der Leitlinie (臺教資（一）字第1152701618號) — die Frist der Entschließung ist damit gewahrt.

      '
    verifiziert: true
    quelle: https://unfps.ntct.edu.tw/p/404-1066-499881.php
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - '''Rechtsgrundlage im Weiterleitungsschreiben ausdrücklich benannt: 依據教育部115年6月5日臺教資（一）字第1152701618號函及立法院第11屆第4會期
    第14次會議制定「人工智慧基本法」通過之附帶決議第5項事項辦理 — die Leitlinie ergeht auf der Grundlage des Ministerialerlasses und
    der fünften begleitenden Entschließung des Legislativ-Yuan zum KI-Basisgesetz. Das ist der seltene
    Fall einer parlamentarischen Entschließung, deren Erfüllung sich urkundlich nachweisen lässt.''

    '
  - '''Rollendifferenzierung: Die Leitlinie behandelt getrennt 校長 (Schulleitung), 教師 (Lehrkräfte), 學生
    (Schülerinnen und Schüler) und 家長 (Eltern) — ein Regelungsansatz, der in europäischen Bildungs-KI-Leitlinien
    unüblich ist.''

    '
  - '''Leitprinzipien: 重視未成年人之身心發展與保護，強調在適當引導與陪伴下使用人工智慧； 同時融入資訊倫理觀念，培養正確使用態度與責任意識，兼顧隱私保護與資訊安全 — Schutz
    der körperlichen und geistigen Entwicklung Minderjähriger, Nutzung nur unter angemessener Anleitung
    und Begleitung, Vermittlung von Informationsethik, Aufbau einer verantwortungsbewussten Nutzungshaltung,
    Datenschutz und Informationssicherheit zugleich.''

    '
  - 'Verhältnis zu Art. 5 Abs. 2 KI-Basisgesetz: Dieser stellt das Kindeswohl (兒少最佳利益) als Leitprinzip
    an den Anfang der Hochrisiko-Kennzeichnung. Die Schul-Leitlinie ist die erste konkrete Ausfüllung
    dieses Prinzips.

    '
  - 'Bestehende Vorläuferinstrumente des Ministeriums, die neben der neuen Leitlinie fortgelten: 中小學數位教學指引
    (1.0 von 2022, 3.0 vom August 2024), 中小學使用生成式人工智慧注意事項 2.1 (Fassungen für Lehrkräfte, Verwaltungspersonal
    und Eltern) sowie das 中小學生成式AI之學習應用手冊.

    '
