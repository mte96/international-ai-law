  offizieller_titel: 詐欺犯罪危害防制條例 — Fraud Crime Hazard Prevention Act
  fundstelle: 'Verkuendet 31.07.2024 (民國113年7月31日), 華總一義字第11300068891號, 58 Artikel. Die meisten Vorschriften
    gelten seit dem Tag der Verkuendung; §§ 19, 20, 22, 24 seit 30.11.2024 (行政院院臺打詐字第 1131032356號); §
    39 Abs. 2 bis 5 (Verkehrssteuerung, DNS-Sperre, Zugangsbeschraenkung) und § 40 Abs. 1 Nr. 6 harren
    weiterhin der Bestimmung durch den Exekutiv-Yuan. Zuletzt geaendert 21.01.2026 (民國115年1月21日), 華總一義字第11500003941號.
    Rechtskategorie: 行政 ＞ 內政部 ＞ 警政目.

    '
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'Ueberwiegend anwendbar. §§ 30 und 31 — die fuer KI massgeblichen Vorschriften — gelten
    seit dem 31.07.2024. Die Netzsperrenvorschriften des § 39 Abs. 2 bis 5 sind am 06.09.2026 weiterhin
    nicht in Kraft.

    '
  kurzbeschreibung: 'Das Betrugsbekaempfungsgesetz vom Juli 2024 enthaelt die einzige Legaldefinition
    des Deepfake und die einzige gesetzliche Kennzeichnungspflicht fuer KI-erzeugte Inhalte im taiwanischen
    Recht — und zwar nicht im Medien- oder KI-Recht, sondern im Betrugsstrafrecht. § 31 Abs. 1 Nr. 4 verpflichtet
    Internet-Werbeplattformbetreiber, in der Anzeige offenzulegen, dass sie Deepfake-Technik oder KI-generierte
    Personenbilder verwendet; § 31 Abs. 4 definiert Deepfake als technische Ausdrucksform, die unwahre
    Aeusserungen oder Handlungen der betroffenen Person erzeugt und geeignet ist, andere an ihre Echtheit
    glauben zu lassen. § 30 verpflichtet dieselben Plattformen zur Identitaetsverifizierung von Auftraggeber
    und Finanzier mittels digitaler Signatur oder FIDO, zu einer Risikoanalyse, einem Betrugspraeventionsplan
    und einem jaehrlichen Transparenzbericht. SANKTION: Verwaltungsstrafen nach den §§ 42 ff.; die konkrete
    Hoehe wurde nicht geprueft.

    '
