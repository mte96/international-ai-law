  - datum: 2026-03-23
    typ: uebersicht
    titel: AI 基本法｜治理與評測 — Themenseite des Digitalministeriums
    url: https://moda.gov.tw/major-policies/ai/governance/19248.html
    sprache: zh
    urheber: 數位發展部
    verifiziert: false
    notiz: 'Sammelseite mit Volltext und begleitenden Entschließungen als PDF. In dieser Sitzung nur über
      den IPFS-Spiegel (ipfs.moda.gov.tw) nachgewiesen; die Hauptdomain wurde nicht abgerufen.

      '
  offene_punkte:
  - 'Die 國家人工智慧發展綱領 (National AI Development Guidelines) nach Art. 6 ist am 06.09.2026 noch nicht veröffentlicht.
    Der NSTC erarbeitet sie; die Verabschiedung erfolgt durch das Strategiekomitee. Sie wird das eigentliche
    Steuerungsdokument.

    '
  - 'Art. 5 Abs. 2 macht die Hinweis- und Warnpflicht von einer Einstufung als Hochrisikoanwendung durch
    die jeweilige Fachaufsicht ''im Benehmen mit dem Digitalministerium'' abhängig. Bis heute ist keine
    einzige solche Einstufung veröffentlicht. Die Vorschrift läuft damit vorerst leer.

    '
  - 'Art. 17 verlangt Haftungszuordnung und Entschädigungs- oder Versicherungsmechanismen für Hochrisiko-KI.
    Kein Ressort hat dazu bisher einen Entwurf vorgelegt. Die Frist des Art. 18 (14.01.2028) gilt auch
    hierfür.

    '
  - 'Ob die Zweijahresfrist des Art. 18 zu einer Novelle des Urheberrechtsgesetzes führt, ist offen: Das
    TIPO hat sich in der Anhörung vom 20.07.2026 ausdrücklich gegen eine TDM-Schranke nach europäischem
    oder japanischem Vorbild ausgesprochen (siehe tw-tipo-genai-urheberrecht).

    '
  - 'Verhältnis zum Recht der Volksrepublik China: Taiwan hat bewusst KEINE der chinesischen Kennzeichnungspflichten
    für KI-generierte Inhalte übernommen; die einzige gesetzliche Kennzeichnungspflicht steht in § 31
    詐欺犯罪危害防制條例 und betrifft nur Werbung auf Internet-Werbeplattformen.

    '
