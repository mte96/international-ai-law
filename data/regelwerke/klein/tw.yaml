    verifiziert: true
    quelle: https://www.ey.gov.tw/Page/448DE008087A1971/40c1a925-121d-4b6b-8f40-7e9e1a5401f2
  - datum: 2023-10-03
    was_gilt: 'Förmliches Rundschreiben an die Behörden, Geltung ab sofort. Dieses Datum tragen die weiterleitenden
