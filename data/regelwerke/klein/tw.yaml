- id: tw-urhg
  jurisdiktion: tw
  kurztitel: Urheberrechtsgesetz Taiwan (著作權法)
  offizieller_titel: 著作權法 — Copyright Act
  fundstelle: 'Erstmals verkuendet am 14.05.1928 (民國17年5月14日); geltende Fassung nach 22 Novellen, zuletzt
    15.06.2022 (民國111年6月15日), 華總一經字第11100049761號 (§§ 46, 47, 48 geaendert, § 46-1 eingefuegt). Die Novelle
    vom 04.05.2022 (華總一經字第11100037471號, §§ 91, 91-1, 100, 117 geaendert, §§ 98, 98-1 gestrichen) ist bis
    heute nicht in Kraft: ihr Inkrafttreten bestimmt der Exekutiv-Yuan und hat es bis zum 06.09.2026 nicht
    getan. Rechtskategorie: 行政 ＞ 經濟部 ＞ 智慧財產權目.

    '
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'Anwendbar mit einer offenen Teilstelle: Die Strafrechtsnovelle vom 04.05.2022 ist mangels
    Bestimmung des Inkrafttretens durch den Exekutiv-Yuan seit vier Jahren nicht in Kraft. Fuer KI ist
    das Gesetz unveraendert: Es kennt KEINE Schranke fuer Text und Data Mining, keine Regelung KI-erzeugter
    Ausgaben und keine Opt-out-Vorschrift. Die Zweijahresfrist des Art. 18 KI-Basisgesetz (14.01.2028)
    erfasst auch das Urheberrechtsgesetz; das TIPO hat bis zum 06.09.2026 keinen Novellierungsentwurf
    vorgelegt.

    '
  kurzbeschreibung: 'Taiwans Urheberrecht ist ein Mischsystem: kontinentaleuropaeische Werkkategorien
    und Urheberpersoenlichkeitsrechte, aber eine Fair-Use-Generalklausel nach US-Vorbild (§ 65) mit den
    vier Faktoren des 17 U.S.C. § 107. Fuer KI folgt daraus ein anderer Streitstand als in der EU: Es
    gibt keine TDM-Schranke, ueber die man streiten koennte, sondern eine offene Abwaegungsklausel, deren
    Anwendung auf das Training generativer Modelle bisher weder Gesetzgeber noch Gerichte entschieden
    haben. Sanktion: Das Gesetz ist in weiten Teilen Strafrecht — § 91 stellt die unbefugte Vervielfaeltigung
    mit bis zu drei, bei Verkaufsabsicht mit bis zu fuenf Jahren Freiheitsstrafe unter Strafe. Schutzfaehigkeit
    KI-erzeugter Ausgaben: nach der Auslegung des TIPO nur bei tatsaechlichem menschlichem Schoepfungsbeitrag.

    '
  inkrafttreten:
    datum: 1928-05-14
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=J0070017
  anwendungsdaten:
  - datum: 2022-05-04
    was_gilt: 'Novelle der Strafvorschriften (§§ 91, 91-1, 100, 117; Streichung §§ 98, 98-1). Inkrafttreten
      durch den Exekutiv-Yuan zu bestimmen — bis 06.09.2026 nicht bestimmt.

      '
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=J0070017
  - datum: 2022-06-15
    was_gilt: 'Letzte in Kraft getretene Novelle: Neufassung der Bildungsschranken §§ 46, 47, 48 und Einfuegung
      des § 46-1 (Fernunterricht).

      '
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=J0070017
  themenachsen:
  - urheberrecht
  - content
  - gpai
  regelungsschwerpunkte:
  - '''FAIR USE STATT TDM-SCHRANKE: § 65 Abs. 2 uebernimmt die vier Faktoren des US-Rechts woertlich und
    erstreckt sie ausdruecklich auf "sonstige Faelle angemessener Nutzung" ausserhalb der Schrankenkataloge
    der §§ 44 bis 63. Taiwan ist damit die einzige ostasiatische Rechtsordnung mit einer offenen Fair-Use-Generalklausel
    — Japan hat Art. 30-4 UrhG, Korea eine enumerative Schranke, die Volksrepublik ebenfalls. Wer in Taiwan
    fuer das Training argumentiert, argumentiert mit US-Dogmatik, nicht mit europaeischer.''

    '
  - '''KEINE OPT-OUT-VORSCHRIFT: Das Gesetz kennt kein Aequivalent zu Art. 4 Abs. 3 DSM-RL. Ein Rechtsvorbehalt
    des Rechtsinhabers hat im taiwanischen Urheberrecht keine gesetzliche Wirkung; er kann allenfalls
    im Rahmen des ersten und vierten Faktors des § 65 Abs. 2 beruecksichtigt werden.''

    '
  - '''§ 22 ABS. 3 ALS EINZIGE TECHNISCHE AUSNAHME: Voruebergehende Vervielfaeltigungen sind vom Vervielfaeltigungsrecht
    ausgenommen, wenn sie bei rechtmaessiger Netzuebermittlung oder rechtmaessiger Werknutzung technisch
    notwendig, fluechtig oder begleitend sind und keine eigenstaendige wirtschaftliche Bedeutung haben.
    Computerprogramme sind ausgenommen. Die Vorschrift traegt das Trainingskopieren nicht: Das Einlesen
    in einen Trainingsdatensatz ist weder fluechtig noch ohne eigenstaendige wirtschaftliche Bedeutung.''

    '
  - '''§ 10-1 (Idea-expression-Dichotomie) ist die Norm, an der die Behauptung eines Urheberrechtsschutzes
    an Prompts scheitert: geschuetzt ist nur die Ausdrucksform, nicht das Verfahren, das System oder die
    Betriebsmethode.''

    '
  - '''STRAFRECHTLICHE DURCHSETZUNG: § 91 (Vervielfaeltigung), § 92 (oeffentliche Uebertragung) und §
    87 (fiktive Verletzungen) machen das Urheberrecht zum Anknuepfungspunkt der Staatsanwaltschaft. Fuer
    KI-Anbieter bedeutet das ein anderes Risikoprofil als in Europa: nicht Schadensersatz, sondern Anklage.''

    '
  dokumente:
  - datum: 2022-06-15
    typ: konsolidiert
    titel: 著作權法 — amtlicher chinesischer Volltext (全國法規資料庫)
    url: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0070017
    sprache: zh
    urheber: 法務部 / 全國法規資料庫
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung mit allen 117 Artikeln.
  - datum: 2022-06-15
    typ: konsolidiert
    titel: Copyright Act — amtliche englische Fassung
    url: https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070017
    sprache: en
    urheber: 法務部
    verifiziert: false
    notiz: 'Die englische Fassung der Gesetzessammlung; im Rahmen dieser Sitzung nur die chinesische Einzelnormseite
      abgerufen.

      '
  - datum: 2022-06-15
    typ: uebersicht
    titel: 著作權法 沿革 — Rechtsgeschichte mit 22 Novellen
    url: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=J0070017
    sprache: zh
    urheber: 法務部
    verifiziert: true
    notiz: 'Belegt, dass die Novelle vom 04.05.2022 bis heute nicht in Kraft gesetzt worden ist — ein
      Beispiel dafuer, wie lange in Taiwan die Bestimmung des Inkrafttretens durch den Exekutiv-Yuan dauern
      kann. Fuer die Prognose zur Frist des Art. 18 KI-Basisgesetz relevant.

      '
  offene_punkte:
  - 'Ob das Training generativer Modelle auf geschuetzten Werken unter § 65 faellt, ist in Taiwan weder
    gesetzlich noch gerichtlich geklaert. Bis zum 06.09.2026 existiert keine einzige taiwanische Entscheidung
    dazu.

    '
  - 'Ob die Zweijahresfrist des Art. 18 KI-Basisgesetz (14.01.2028) zu einer Urheberrechtsnovelle fuehrt,
    ist offen. Das TIPO hat bis heute keinen Entwurf vorgelegt.

    '
