- id: tw-wahlgesetz
  jurisdiktion: tw
  kurztitel: Wahl- und Abberufungsgesetz (公職人員選舉罷免法)
  offizieller_titel: 公職人員選舉罷免法 — Public Officials Election and Recall Act
  fundstelle: 'Verkuendet 14.05.1980 (民國69年5月14日); die Deepfake- und Werbetransparenzvorschriften wurden
    durch die grosse Novelle vom 09.06.2023 (民國112年6月9日), 華總一義字第11200050131號, eingefuegt (u.a. §§ 51-1
    bis 51-3, 104-1; Neufassung des § 104). Zuletzt geaendert am 01.07.2026 (民國115年7月1日). Rechtskategorie:
    行政 ＞ 內政部 ＞ 民政目.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Anwendbar seit 09.06.2023. Die Deepfake-Qualifikation des § 104 Abs. 2 galt erstmals
    fuer die Wahlen zum Praesidenten und zum Legislativ-Yuan am 13.01.2024 und fuer die Abberufungswellen
    2025. Bis zum 06.09.2026 ist in der amtlichen Entscheidungsdatenbank keine rechtskraeftige Verurteilung
    nach § 104 Abs. 2 nachweisbar; die Vorschrift wird in Wahlstrafverfahren zitiert, die Verurteilungen
    ergehen aber nach Abs. 1 oder nach § 41 PDPA.

    '
  kurzbeschreibung: 'Taiwan hat 2023 als eine der ersten Rechtsordnungen weltweit einen besonderen Straftatbestand
    fuer politische Deepfakes geschaffen. § 104 Abs. 2 erhoeht die Strafe fuer die Verbreitung unwahrer
    Tatsachen in Wahlbeeinflussungsabsicht von fuenf auf SIEBEN Jahre, wenn sie durch Verbreiten, Senden
    oder Zugaenglichmachen deepgefaelschter Stimme, Bilder oder elektromagnetischer Aufzeichnungen des
    Kandidaten, Abberufungsbetroffenen oder Initiators geschieht; Abs. 3 erhoeht bei Gewinnerzielungsabsicht
    um bis zur Haelfte und stellt eine Geldstrafe von 2 bis 10 Mio. NTD daneben. Flankierend verpflichten
    §§ 51-1 und 51-2 Medien und Internetdiensteanbieter zur Auftraggeberpruefung, zum Verbot auslaendischer
    und festlandchinesischer Auftraege und zu einer vierjaehrigen Aufbewahrung des Werbearchivs samt Targeting-Parametern.
    § 113 Abs. 3 ordnet bei jeder Freiheitsstrafe zwingend die Aberkennung der buergerlichen Ehrenrechte
    an.

    '
