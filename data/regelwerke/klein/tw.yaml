  - datum: 2024-09-13
    was_gilt: Ende der Konsultationsfrist (60 Tage).
    verifiziert: false
    quelle: https://law.nstc.gov.tw/LawContent.aspx?id=GL000592
  - datum: 2025-08-28
    was_gilt: 'Ersetzt durch die Regierungsvorlage des Exekutiv-Yuan (17 Artikel), federführend Digitalministerium.

      '
    verifiziert: true
    quelle: https://www.nstc.gov.tw/folksonomy/detail/ed981806-1852-4b63-8dfd-9eea04157971?l=ch
  themenachsen:
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - 'Der Entwurf wurde nach dem Verfahren der amtlichen Vorankündigung öffentlich bekanntgemacht — ein
    Konsultationsmodell, das dem deutschen Referentenentwurf mit Verbändeanhörung entspricht. Frist: 60
    Tage.

    '
  - 'Der Evaluierungsbericht des Legislativ-Yuan vom 22.10.2025 hält fest, dass die dem Parlament zugeleitete
    Fassung 17 Artikel hatte, und empfiehlt Änderungen an Art. 3 (KI-Begriff), Art. 4 (Grundsätze), Art.
    7 (Bildung) und Art. 16 (Risikoklassifizierung) sowie die Einfügung eines weiteren Artikels. Das verabschiedete
    Gesetz hat 20 Artikel; die Differenz geht auf die Ausschussberatung und die Fraktionsverhandlung zurück.

    '
  dokumente:
  - datum: 2024-07-15
    typ: entwurf
