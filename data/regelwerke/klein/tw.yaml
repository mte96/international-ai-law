- id: tw-fsc-ki-leitlinie
  jurisdiktion: tw
  kurztitel: FSC-Leitlinie zum KI-Einsatz im Finanzsektor
  offizieller_titel: '金融業運用人工智慧（AI）指引 — Guidelines on the Application of Artificial Intelligence by the
    Financial Industry

    '
  fundstelle: 'Erlass der 金融監督管理委員會 (Financial Supervisory Commission) vom 20.06.2024 (民國113年6月20日), veroeffentlicht
    im 主管法規共用系統 unter GL003920. Vorlaeufer: 金融業運用人工智慧（AI）之核心原則與相關推動政策 vom 17.10.2023 (民國112年10月17日), GL003916.

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Nicht bindende Aufsichtsleitlinie. Sie ist gleichwohl der Prototyp der sektoralen Regelung,
    die Art. 16 Abs. 2 KI-Basisgesetz von allen Fachaufsichten verlangt — die FSC hat sie zwei Jahre vor
    dem Basisgesetz erlassen. Die Bankenvereinigung (銀行公會) hat auf ihrer Grundlage eigene Branchenregeln
    beschlossen.

    '
  kurzbeschreibung: 'Die FSC hat den KI-Einsatz im Finanzsektor in zwei Schritten geregelt: im Oktober
    2023 mit sechs Kernprinzipien und einer Foerderpolitik, im Juni 2024 mit der eigentlichen Leitlinie.
    Sie richtet sich an alle beaufsichtigten Finanzinstitute und deckt den gesamten Lebenszyklus ab —
    Governance und Verantwortlichkeit, Fairness und Menschenzentrierung, Schutz von Privatsphaere und
    Kundenrechten, Systemrobustheit und Sicherheit, Transparenz und Erklaerbarkeit sowie Nachhaltigkeit.
    Kernmechanismus ist ein risikobasierter Ansatz: Die Institute haben ihre KI-Anwendungen selbst zu
    klassifizieren und die Kontrolldichte daran auszurichten; ausgelagerte KI-Dienste bleiben in der Verantwortung
    des Instituts. SANKTION: keine unmittelbare; die Leitlinie wirkt ueber die allgemeine Aufsicht und
    die interne Revisionspflicht.

    '
  inkrafttreten:
    datum: 2024-06-20
    verifiziert: true
    quelle: https://law.fsc.gov.tw/LawContent.aspx?id=GL003920
  anwendungsdaten:
  - datum: 2023-10-17
    was_gilt: 'Veroeffentlichung der Kernprinzipien und der Foerderpolitik (GL003916) nach oeffentlicher
      Konsultation im August 2023.

      '
    verifiziert: true
    quelle: https://law.fsc.gov.tw/LawContent.aspx?id=GL003916
  - datum: 2024-06-20
    was_gilt: Erlass der Leitlinie selbst (GL003920).
    verifiziert: true
    quelle: https://law.fsc.gov.tw/LawContent.aspx?id=GL003920
  themenachsen:
  - sektor-finanz
  - governance
  - marktzugang
  - grundrechte
  regelungsschwerpunkte:
  - '''ZEITLICHER VORLAUF: Die FSC hat den risikobasierten Ansatz im Juni 2024 eingefuehrt — 25 Monate
    vor dem Risikoklassifizierungsrahmen des Digitalministeriums vom 07.07.2026. Wer verstehen will, wie
    Taiwan Art. 16 Abs. 2 KI-Basisgesetz mit Leben fuellen wird, liest die FSC-Leitlinie, nicht das Basisgesetz.''

    '
  - '''AUSLAGERUNGSVERANTWORTUNG: Die Leitlinie stellt klar, dass die Verantwortung fuer ausgelagerte
    oder eingekaufte KI-Dienste beim Institut bleibt. Das ist die funktionale Entsprechung der Wertschoepfungskettenregelung
    der KI-VO — ohne deren Rollenbegriffe.''

    '
