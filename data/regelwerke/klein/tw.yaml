  - 'Ein allgemeiner Deepfake-Straftatbestand ausserhalb des sexuellen Bereichs und des Wahlrechts fehlt.
    Wer ein Deepfake-Video eines Unternehmers oder Beamten erstellt, ist nur ueber Ehrschutzdelikte (§§
