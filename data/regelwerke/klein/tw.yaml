- id: tw-ki-basisgesetz-entwurf-nstc-2024
  jurisdiktion: tw
  kurztitel: NSTC-Entwurf eines KI-Basisgesetzes (2024)
  offizieller_titel: 人工智慧基本法草案 (Entwurf des National Science and Technology Council)
  fundstelle: 'Bekanntmachung des 國家科學及技術委員會 vom 15.07.2024 (民國113年7月15日), 科會前字第1130048999號, ergangen
    auf der Grundlage eines Erlasses des Generalsekretärs des Exekutiv-Yuan vom 23.10.2023. Konsultationszeitraum
    15.07.2024 bis 13.09.2024.

    '
  verfahrensnummer: 科會前字第1130048999號
  status: aufgehoben
  status_detail: 'Ersetzt. Der NSTC-Entwurf vom Juli 2024 war die erste amtliche Fassung eines taiwanischen
    KI-Rahmengesetzes. Er wurde nach der Konsultation nicht unverändert weiterverfolgt: 2025 übernahm
    das Digitalministerium die Federführung, überarbeitete den Text und legte ihn dem Kabinett vor, das
    ihn am 28.08.2025 als Regierungsvorlage mit 17 Artikeln beschloss. Verabschiedet wurde am 23.12.2025
    eine Fassung mit 20 Artikeln.

    '
  kurzbeschreibung: 'Erster amtlicher Entwurf. Er folgte bereits der Grundanlage des späteren Gesetzes
    (Grundsatzgesetz ohne Sanktionen, sieben Governance-Grundsätze, Ressortprinzip), unterschied sich
    aber in der Artikelzahl und — nach dem Befund des NSTC selbst — in der Frage der zuständigen Behörde:
    Die Regierungsvorlage enthielt, dem taiwanischen Gesetzgebungsstil für 基本法 folgend, ursprünglich überhaupt
    keine Bestimmung einer Fachaufsicht. Der Legislativ-Yuan hat den NSTC erst im Verfahren in Art. 2
    eingesetzt. Der Entwurf ist erfasst, weil er erklärt, warum das geltende Gesetz eine so ungewöhnliche
    Behördenarchitektur hat.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://law.nstc.gov.tw/LawContent.aspx?id=GL000592
  anwendungsdaten:
