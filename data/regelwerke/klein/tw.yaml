- id: tw-judicial-yuan-ki-leitlinie
  jurisdiktion: tw
  kurztitel: Justiz-Leitlinie zum KI-Einsatz (司法院-Leitlinie 2026)
  offizieller_titel: '司法院及所屬各機關使用人工智慧系統參考指引 — Reference Guidelines on the Use of Artificial Intelligence
    Systems by the Judicial Yuan and its Subordinate Agencies

    '
  fundstelle: 'Rundschreiben (函頒) des 司法院 (Judicial Yuan) vom 22.04.2026 (民國115年4月22日). Bekanntgabe in
    司法周刊 第2311期 第1版 vom 05.06.2026; Nachweis der Rechtsetzung in der Rubrik 法制動態 des 司法周刊: 「司法院115年4月22日訂定『司法院及所屬各機關使用人工智慧系統參考指引』」.

    '
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'In Kraft seit dem 22.04.2026 und in der Gerichtspraxis angewandt: Mehrere Instanzgerichte
    (臺中地院, 南投地院, 士林地院, 金門高分院) berufen sich in ihren Fortbildungsmitteilungen seit Mai 2026 ausdrücklich
    auf sie. Das 司法院 hat angekündigt, die Leitlinie fortzuschreiben (適時調整指引). Verwaltungsvorschrift ohne
    Außenwirkung gegenüber den Verfahrensbeteiligten; für die Richterschaft dienstrechtlich verbindlich.

    '
  kurzbeschreibung: 'Eine der weltweit wenigen ausdrücklichen Regelungen des KI-Einsatzes durch Gerichte,
    und die bislang klarste in Ostasien. Sie enthält drei Regelungsblöcke: ein absolutes Eingabeverbot
    für geschützte und nicht öffentliche Verfahrensdaten in nicht genehmigte KI-Systeme; eine funktionale
    Begrenzung der KI auf das Hilfsmittel (審判輔助工具) mit einem Kernbereichsvorbehalt zugunsten des Richters;
    und eine Kompetenzanforderung an den Nutzer. Sanktion: keine eigene; Verstöße betreffen die Amts-
    und Verschwiegenheitspflichten und können dienstaufsichtlich geahndet werden.

    '
  inkrafttreten:
    datum: 2026-04-22
    verifiziert: true
    quelle: https://www.judicial.gov.tw/tw/cp-1429-1559552-524e3-1.html
  anwendungsdaten:
  - datum: 2026-04-22
    was_gilt: Erlass der Leitlinie durch Rundschreiben des 司法院.
    verifiziert: true
    quelle: https://www.judicial.gov.tw/tw/cp-1429-1559552-524e3-1.html
  - datum: 2026-06-05
    was_gilt: 'Amtliche Bekanntgabe in 司法周刊 第2311期 第1版 unter der Überschrift 「兼顧科技創新與資通安全」.

      '
    verifiziert: true
    quelle: https://www.judicial.gov.tw/tw/cp-1429-1559552-524e3-1.html
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - governance
  - datenschutz
  regelungsschwerpunkte:
  - '''EINGABEVERBOT: 涉及受法律保護之機密資訊、個人資料或未對公眾公開之訴訟資料 （如未公開之起訴書、書狀、筆錄、法庭錄音、調查訪視紀錄、裁判草稿等）， 禁止輸入、上傳或以任何形式提供予非經司法院核准或核備使用之人工智慧系統
    — gesetzlich geschützte Geheimnisse, personenbezogene Daten und nicht öffentliche Verfahrensunterlagen
    (namentlich unveröffentlichte Anklageschriften, Schriftsätze, Protokolle, Gerichtsaufzeichnungen,
    Ermittlungs- und Besuchsprotokolle sowie Entscheidungsentwürfe) dürfen nicht in KI-Systeme eingegeben,
    hochgeladen oder auf sonstige Weise übermittelt werden, die nicht vom 司法院 genehmigt oder gebilligt
    sind. Bemerkenswert ist die ausdrückliche Erfassung des ENTSCHEIDUNGSENTWURFS (裁判草稿) — genau der Anwendungsfall,
    den das 司法院 selbst mit seinem Projekt zur KI-gestützten Erstellung strafrechtlicher Entscheidungsentwürfe
    erprobt hatte.''

    '
  - '''FUNKTIONALE BEGRENZUNG: 本指引將人工智慧系統定位為「審判輔助工具」，其功能僅限於 協助法官進行資料檢索、摘要分析及輔助作業流程優化 — die Leitlinie ordnet
    KI-Systeme als Hilfsmittel der Rechtsprechung ein; ihre Funktion ist beschränkt auf die Unterstützung
    des Richters bei Recherche, zusammenfassender Analyse und Optimierung von Arbeitsabläufen.''

    '
  - '''KERNBEREICHSVORBEHALT: 至於證據價值之判斷、事實認定、法律適用或量刑等核心工作， 仍須由法官親自為之 — die Kernaufgaben, nämlich die Beurteilung
    des Beweiswerts, die Tatsachenfeststellung, die Rechtsanwendung und die Strafzumessung, hat der Richter
    persönlich vorzunehmen. Das ist wortgleich die Linie des italienischen Art. 15 Abs. 1 Legge 132/2025
    (jede Entscheidung über Auslegung und Anwendung des Gesetzes bleibt dem Richter vorbehalten) und des
    kolumbianischen Acuerdo PCSJA24-12243 (Art. 8), aber mit einem zusätzlichen Element: Die taiwanische
    Fassung nennt die STRAFZUMESSUNG (量刑) ausdrücklich mit, weil in Taiwan KI-gestützte Strafzumessungsdatenbanken
    seit Jahren im Einsatz sind.''

    '
  - '''KI-KOMPETENZ: 同仁於公務使用人工智慧系統前，應具備人工智慧基本知識與素養， 充分瞭解系統之功能限制、倫理規範及潛在風險 — vor dem dienstlichen Einsatz
    müssen die Bediensteten über KI-Grundkenntnisse verfügen und die Funktionsgrenzen, die ethischen Vorgaben
    und die potenziellen Risiken des Systems vollständig verstehen. Funktional das Pendant zu Art. 4 KI-VO
    (KI-Kompetenz).''

    '
  - '''BEGRÜNDUNGSANSATZ: Die amtliche Mitteilung begründet die Zurückhaltung damit, dass 各國司法針對人工智慧之應用普遍採取較為審慎之態度
    (die Justizverwaltungen weltweit gehen mit KI überwiegend vorsichtig um) und dass 司法案件具高度機敏性 (Justizsachen
    sind hochsensibel), sowie mit dem Satz 司法公信力仍是不可動搖的基石 — die Glaubwürdigkeit der Justiz bleibt der
    unverrückbare Grundstein.''

    '
  - 'Systematische Einordnung: Die Leitlinie ist Ausfluss des Art. 19 KI-Basisgesetz, formal aber ein
    Akt der richterlichen Selbstverwaltung — das 司法院 ist eines der fünf Yuan und dem Exekutiv-Yuan nicht
    unterstellt. Die Regelung war durch Nr. 10 der Exekutiv-Yuan-Leitlinie von 2023 bereits angelegt,
    die andere Verfassungsorgane ausdrücklich zur Anlehnung ermächtigt hatte.

    '
