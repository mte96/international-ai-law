  kurztitel: TIPO-Auskuenfte zu generativer KI und Urheberrecht
  offizieller_titel: '經濟部智慧財產局 著作權主題網 解釋資料 — Auslegungsauskuenfte des Intellectual Property Office zu
    generativer KI (電子郵件字-Reihe)

    '
  fundstelle: 'Auskunft 電子郵件1140522c vom 22.05.2025 (民國114年5月22日) sowie weitere Auskuenfte derselben Reihe,
    u.a. 電子郵件字第1140829號 zum Training generativer KI mit historischen Fotografien. Veroeffentlicht im 著作權主題網
    des TIPO.

    '
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Verwaltungsauskuenfte ohne Bindungswirkung fuer die Gerichte. Sie sind gleichwohl die
    einzige amtliche Auslegungsquelle Taiwans zu generativer KI und Urheberrecht und werden von Kanzleien
    und Hochschulen als massgeblich behandelt. Ein Gesetzgebungsvorhaben ist daraus bis zum 06.09.2026
    nicht geworden.

    '
  kurzbeschreibung: 'Das TIPO beantwortet auf seiner Themenseite Anfragen zum Urheberrecht und veroeffentlicht
    die Antworten als 電子郵件字-Auskuenfte. Zur generativen KI hat es eine gefestigte Linie: Wird die KI nur
    als Hilfswerkzeug eingesetzt und leistet ein Mensch einen tatsaechlichen schoepferischen Beitrag,
    entsteht Urheberrechtsschutz und der schaffende Mensch — nicht das Unternehmen — ist Urheber, soweit
    nicht Arbeits- oder Auftragsverhaeltnisse etwas anderes bestimmen. Erfolgt der Schaffensvorgang dagegen
    vollstaendig durch KI-Algorithmen ohne menschlichen geistigen Beitrag, besteht kein Urheberrechtsschutz.
    Fuer die kommerzielle Nutzung warnt das TIPO vor Verletzungen, wenn die erzeugten Bilder den Trainingsdaten
    wesentlich aehneln, und verweist auf die Nutzungsbedingungen der Anbieter. SANKTION: keine — die Auskuenfte
    binden niemanden.

    '
  inkrafttreten:
    datum: 2025-05-22
    verifiziert: true
    quelle: https://www.tipo.gov.tw/tw/copyright/692-34252.html
  anwendungsdaten:
  - datum: 2026-04-05
    was_gilt: 'TIPO-Newsletter Nr. 238 behandelt die Rechtmaessigkeit des Trainings generativer Modelle
      (mit Bezug auf GEMA gegen OpenAI) und die Eignung der europaeischen TDM-Schranken fuer das KI-Training.

      '
    verifiziert: true
    quelle: https://www.tipo.gov.tw/tw/tipo1/90.html?id=80958
  themenachsen:
  - urheberrecht
  - gpai
  - content
  regelungsschwerpunkte:
  - '''ZWEISTUFIGE PRUEFUNG: (1) KI als Hilfswerkzeug mit tatsaechlichem menschlichem Schoepfungsbeitrag
    — Schutz, Urheber ist der Mensch; (2) Schaffensvorgang vollstaendig durch Algorithmen ohne menschlichen
    geistigen Beitrag — kein Schutz. Das entspricht der US-Linie (Thaler v. Perlmutter) und weicht ausdruecklich
    von der chinesischen ab (Li gegen Liu, Internetgericht Peking 2023).''

    '
  - '''SUBSTANTIAL SIMILARITY ALS RISIKOMASSSTAB: Das TIPO warnt vor Verletzungen, wenn die Ausgabe den
    Trainingswerken "wesentlich aehnelt". Damit verlagert es die Frage vom Training auf den Output — dieselbe
    Weichenstellung wie im US-Recht, und eine andere als in der EU, wo Art. 4 DSM-RL beim Input ansetzt.''

    '
  - '''KEIN VORSTOSS FUER EINE TDM-SCHRANKE: Der TIPO-Newsletter befasst sich zwar mit den europaeischen
    TDM-Vorschriften, aber ausdruecklich unter der Fragestellung ihrer "Anwendungsschwierigkeiten". Ein
    Gesetzentwurf zur Einfuehrung einer TDM-Schranke nach europaeischem oder japanischem Vorbild liegt
    am 06.09.2026 nicht vor.''

    '
