    sprache: zh
    urheber: 法務部 / 全國法規資料庫
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung, 159 Artikel.
  - datum: 2022-05-04
    typ: uebersicht
    titel: 專利法 沿革 — Rechtsgeschichte
    url: https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=J0070007
    sprache: zh
    urheber: 法務部
    verifiziert: true
    notiz: Belegt Verkuendungs- und Inkrafttretensdaten aller Novellen.
  offene_punkte:
  - 'Ob KI-gestuetzte, aber menschlich veranlasste Erfindungen einen besonderen Offenbarungsmassstab nach
    § 26 erfordern, ist in Taiwan ungeklaert.

    '
  - 'Das TIPO hat bis zum 06.09.2026 keine Pruefungsrichtlinie zu KI-gestuetzten Erfindungen veroeffentlicht,
    wie sie EPA, USPTO und JPO haben.

    '
