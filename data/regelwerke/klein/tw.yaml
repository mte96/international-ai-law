- id: tw-mohw-genai-krankenhaus
  jurisdiktion: tw
  kurztitel: MOHW-Leitlinie zu generativer KI in Gesundheitseinrichtungen
  offizieller_titel: '醫療機構應用生成式人工智慧指引 — Guidelines on the Application of Generative Artificial Intelligence
    by Medical Institutions

    '
  fundstelle: 'Rundschreiben (函頒) des 衛生福利部 (Ministry of Health and Welfare) vom 29.05.2026 (民國115年5月29日),
    衛部醫字第1151663164號函.

    '
  verfahrensnummer: 衛部醫字第1151663164號
  status: softlaw
  status_detail: 'Nicht bindende Ressortleitlinie, erlassen unter der Geltung des KI-Basisgesetzes und
    der Sache nach eine Ausfuehrung des Art. 16 Abs. 2 fuer den Gesundheitsbereich. Sie ist die erste
    taiwanische Verwaltungsvorschrift, die generative KI ueber ihren gesamten Einfuehrungslebenszyklus
    regelt.

    '
  kurzbeschreibung: 'Die Leitlinie ordnet den Einsatz generativer KI in Krankenhaeusern und Kliniken entlang
    von sechs Risikotypen und neun Handlungspunkten. Risikotypen: Grundmodellrisiken (systematische Verzerrungen
    aus Architektur, Trainingsstrategie und Trainingsdaten mit der Folge fehlerhafter Diagnosen bei bestimmten
    Erkrankungen oder Patientengruppen), Datenquellenrisiken (minderwertige, veraltete oder unzuverlaessige
    Wissensbasen und Patientenakten), Ausgaberisiken (plausible, aber falsche Inhalte — erfundene Fachliteratur,
    falsche Arzneimittelwechselwirkungen), Cybersicherheitsrisiken (Prompt Injection, Datendiebstahl,
    Modellmanipulation, Data Poisoning), Ueberabhaengigkeitsrisiken (Verlust des klinischen Urteilsvermoegens)
    und Dienstunterbrechungsrisiken (Abhaengigkeit von externen Cloud-APIs). Die neun Handlungspunkte
    gliedern sich in die Phasen vor der Einfuehrung (Risikoinventur, Rechtskonformitaetspruefung, Sicherheits-
    und Datenschutzbewertung), Integration (Systemintegration und Leistungsvalidierung, Lieferantenmanagement)
    und nach der Einfuehrung (fortlaufende Ueberwachung und Abweichungsmanagement, Risikokultur, Verantwortungsteilung
    und Schulung, Informationstransparenz). SANKTION: keine.

    '
  inkrafttreten:
    datum: 2026-05-29
    verifiziert: true
    quelle: https://www.mohw.gov.tw/dl-100614-c7d35394-0a6b-448e-9d90-295294596d98.html
  anwendungsdaten: []
  themenachsen:
  - sektor-medizin
  - governance
  - datenschutz
  - haftung
  regelungsschwerpunkte:
  - '''HALLUZINATION ALS EIGENER RISIKOTYP: Der dritte Risikotyp nennt ausdruecklich erfundene medizinische
    Fachliteratur und falsche Arzneimittelwechselwirkungen. Das ist die erste taiwanische Verwaltungsvorschrift,
    die die Halluzination als Regelungsgegenstand benennt — und sie tut es im Gesundheitswesen, nicht
    im Berufsrecht.''

    '
  - '''PROMPT INJECTION ALS AUFSICHTLICHES RISIKO: Der vierte Risikotyp nennt Prompt-Injection-Angriffe
    neben Datendiebstahl, Modellmanipulation und Data Poisoning. Damit ist eine spezifisch generative
    Angriffsform in eine amtliche Risikotaxonomie aufgenommen.''

    '
  - '''DIENSTUNTERBRECHUNG DURCH API-AENDERUNG: Der sechste Risikotyp nennt die Abhaengigkeit von externen
    Cloud-APIs und ausdruecklich Diensteinstellungen, API-Aenderungen und Preisanpassungen als Patientensicherheitsrisiko.
    Das ist eine wirtschaftliche Abhaengigkeitsbetrachtung, wie sie im europaeischen Medizinprodukterecht
    fehlt.''

    '
  - '''LEBENSZYKLUSSTRUKTUR: Die neun Punkte folgen den Phasen vor, waehrend und nach der Einfuehrung.
    Diese Struktur entspricht dem Aufbau der ISO/IEC 42001 und ist damit anschlussfaehig an den Anspruch
    des Art. 16 Abs. 1 KI-Basisgesetz auf internationale Interoperabilitaet.''

    '
