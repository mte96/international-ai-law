  offene_punkte:
  - 'Das 個人資料保護委員會組織法 ist am 06.09.2026 noch nicht verabschiedet. Solange es fehlt, kann weder die Kommission
    errichtet noch die Novelle vom 11.11.2025 in Kraft gesetzt werden. Taiwan hat damit seit ueber drei
    Jahren ein Datenschutzgesetz, dessen Aufsichtsbehoerde auf dem Papier steht.

    '
  - 'Ob die Novelle eine Rechtsgrundlage fuer KI-Training schafft, ist offen: Die veroeffentlichten Regelungspunkte
    betreffen Aufsicht und Sicherheit, nicht die Zulaessigkeit der Verarbeitung.

    '
