- id: tw-werbetransparenz-vo
  jurisdiktion: tw
  kurztitel: Werbetransparenzverordnung (網路廣告資訊揭露基準及作業辦法)
  offizieller_titel: '網路廣告資訊揭露基準及作業辦法 — Regulations on the Standards and Operating Procedures for Information
    Disclosure in Online Advertising

    '
  fundstelle: 'Erlassen vom 數位發展部 (Ministry of Digital Affairs) am 28.11.2024 (民國113年11月28日) auf der Grundlage
    des § 31 Abs. 5 詐欺犯罪危害防制條例; in Kraft seit dem 30.11.2024 (§ 5). Rechtskategorie: 行政 ＞ 數位發展部 ＞ 數位產業目.
    Eine von vier Durchfuehrungsverordnungen des Digitalministeriums zu den Pflichten der Internet-Werbeplattformen.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 30.11.2024. Damit ist Taiwans einzige gesetzliche Kennzeichnungspflicht
    fuer KI-erzeugte Inhalte seit fast zwei Jahren durchfuehrungsreif — mehr als ein Jahr vor dem KI-Basisgesetz.

    '
  kurzbeschreibung: 'Die Verordnung konkretisiert die Offenlegungspflichten des § 31 詐欺犯罪危害防制條例 und damit
    auch dessen Nummer 4, die den Hinweis auf Deepfake-Technik und KI-generierte Personenbilder verlangt.
    Drei Regelungen sind fuer KI von Bedeutung: Die Angaben sind in der Werbeoberflaeche selbst anzubringen
    und nicht in verlinkten Nebenbedingungen (§ 2 Abs. 1); der Plattformbetreiber hat den KI-Hinweis vom
    Auftraggeber und vom Finanzier bereits bei der Auftragserteilung zu verlangen (§ 2 Abs. 3), womit
    die Pflicht in die Werbekette durchgereicht wird; und wer Dritten die unmittelbare Schaltung ueberlaesst,
    hat mindestens viermal jaehrlich zu pruefen und die Pruefungen drei Jahre lang zu dokumentieren (§
    4). SANKTION: nach den §§ 42 ff. 詐欺犯罪危害防制條例; nicht geprueft.

    '
  inkrafttreten:
    datum: 2024-11-30
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0030157
  anwendungsdaten:
  - datum: 2024-11-28
    was_gilt: Erlass der Verordnung durch das Digitalministerium.
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0030157
  - datum: 2024-11-30
    was_gilt: 'Inkrafttreten nach § 5. Ab diesem Tag ist die Offenlegung von Deepfake-Technik und KI-generierten
      Personenbildern in Internetwerbung durchsetzbar.

      '
    verifiziert: true
    quelle: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0030157
  themenachsen:
  - content
  - marktzugang
  - sektor-finanz
  regelungsschwerpunkte:
  - '''§ 2 ABS. 3 IST DIE INTERESSANTESTE VORSCHRIFT: Sie verpflichtet den Plattformbetreiber, den KI-Hinweis
    nicht selbst zu ermitteln, sondern vom Auftraggeber und vom Finanzier einzufordern. Die Kennzeichnung
    beruht damit auf einer Erklaerung des Werbetreibenden, nicht auf einer technischen Erkennung durch
    die Plattform — eine pragmatische Loesung des Detektionsproblems, das die taiwanische Kriminaltechnik
    nach eigener Auskunft nicht loesen kann.''

    '
  - '''PLATZIERUNG IN DER WERBEOBERFLAECHE: § 2 Abs. 1 verlangt die Anbringung im 廣告表層 und laesst nur
    bei begrenztem Anzeigenraum einen Verweis zu — und auch dann nicht fuer die Werbekennzeichnung selbst.
    Das ist strenger als die Praxis vieler Plattformen, die Transparenzangaben in verlinkte Bibliotheken
    auslagern.''

    '
  - '''VIER PRUEFUNGEN JAEHRLICH: § 4 verlangt bei Direktschaltung durch Dritte mindestens vierteljaehrliche
    Kontrollen mit dreijaehriger Dokumentation und raeumt der Fachaufsicht ein Stichprobenrecht ein. Das
    ist eine Auditpflicht, wie sie das KI-Basisgesetz nicht kennt.''

    '
  dokumente:
  - datum: 2024-11-28
    typ: delegiert
    titel: 網路廣告資訊揭露基準及作業辦法 — amtlicher Volltext
    url: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0030157
    sprache: zh
    urheber: 數位發展部 / 全國法規資料庫
    verifiziert: true
    notiz: 'Fuenf Paragraphen. § 1 nennt die Ermaechtigungsgrundlage, § 2 Abs. 3 reicht die KI-Kennzeichnung
      an den Werbetreibenden durch, § 5 setzt das Inkrafttreten auf den 30.11.2024.

      '
  offene_punkte:
  - 'Die drei weiteren Durchfuehrungsverordnungen des Digitalministeriums zum Betrugsbekaempfungsgesetz
    (Identitaetsverifizierung, Betrugspraeventionsplan, Transparenzbericht) wurden nicht erfasst.

    '
  - 'Die Sanktionsvorschriften der §§ 42 ff. 詐欺犯罪危害防制條例 und die bisherige Bussgeldpraxis des 數位產業署 sind
    nicht geprueft.

    '
