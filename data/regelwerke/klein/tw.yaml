  offizieller_titel: 法院組織法 — Court Organization Act
  fundstelle: '§§ 90-1 und 90-3 in der Fassung vom 16.07.2025 (民國114年7月16日); Ausfuehrungsverordnung 法庭錄音錄影及其利用保存辦法
    in der Fassung vom 22.07.2022 (民國111年7月22日), § 8 Abs. 1.

    '
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Anwendbar. Aufgenommen, weil die taiwanischen Gerichte seit September 2025 aus diesen
    Vorschriften eine eigenstaendige KI-Doktrin entwickelt haben: Das Risiko, dass eine herausgegebene
    Gerichtsaufzeichnung ausserhalb der gerichtlichen Kontrolle mit KI-Technik deepgefaelscht wird, rechtfertigt
    die Ablehnung des Herausgabeantrags.

    '
  kurzbeschreibung: '§ 90-1 Abs. 1 gibt Parteien und Akteneinsichtsberechtigten einen Anspruch auf Herausgabe
    der Gerichtsaufzeichnung zur Wahrung ihrer rechtlichen Interessen; § 8 Abs. 1 der Ausfuehrungsverordnung
    macht die Herausgabe von einer begruendeten richterlichen Erlaubnisentscheidung abhaengig. In dieses
    Ermessen haben die taiwanischen Gerichte seit 2025 das Deepfake-Risiko eingestellt: Es gebe derzeit
    keinen verlaesslichen Mechanismus, der verhindere, dass eine einmal herausgegebene Aufzeichnung nach
    dem Verlassen des ausschliesslichen gerichtlichen Verwaltungsbereichs von Dritten mit KI-Technik deepgefaelscht
    werde; wo das Gericht dem Antragsteller andere Wege zur Ueberpruefung der Protokollrichtigkeit von
    Amts wegen eroeffne, sei der Antrag abzulehnen. SANKTION: keine — es geht um eine Ermessensentscheidung
    im Zwischenverfahren.

    '
