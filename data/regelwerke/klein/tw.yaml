  themenachsen:
  - content
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - '''TATBESTANDSTECHNIK: § 319-4 knuepft nicht an "KI" an, sondern an "Computersynthese oder andere
    technische Methoden" (以電腦合成或其他 科技方法). Das ist technikneutral und erfasst auch Photomontagen ohne maschinelles
    Lernen. Die taiwanische Gesetzgebung hat damit den Fehler vermieden, den Tatbestand an eine Technikgeneration
    zu binden.''

    '
  - '''ANKNUEPFUNG AN § 10 ABS. 8: Der Begriff des 性影像 ist eng definiert (Geschlechtsverkehr, Geschlechtsteile
    oder objektiv sexuell erregende bzw. schamverletzende Koerperpartien und Handlungen). Ein Deepfake,
    der eine Person nur in einer kompromittierenden, aber nicht sexuellen Situation zeigt, faellt nicht
    darunter.''

    '
  - '''OFFIZIALDELIKT: § 319-6 macht nur § 319-1 Abs. 1 und § 319-3 Abs. 1 samt Versuch antragsabhaengig.
    § 319-4 ist damit von Amts wegen zu verfolgen — ein bewusst strengerer Massstab fuer synthetische
    als fuer echte Aufnahmen.''

    '
  - '''PRAKTISCHE NACHRANGIGKEIT: In der Rechtsprechung tritt § 319-4 in der Idealkonkurrenz regelmaessig
    hinter § 41 PDPA zurueck, weil dessen Geldstrafrahmen hoeher ist. Die Gerichte verurteilen dann wegen
    unbefugter Nutzung personenbezogener Daten — mit der Folge, dass die Deepfake-Vorschrift in den Urteilstenoren
    kaum sichtbar wird (臺灣新竹地方法院 115年度訴字第339號 vom 12.06.2026).''

    '
  - '''§ 339-4 (qualifizierter Betrug) ist die Norm, unter der KI-gestuetzter Anlagebetrug mit gefaelschten
    Prominentenvideos abgeurteilt wird. Ob Nr. 4 auf KI-erzeugte Inhalte beschraenkt ist, war Gegenstand
    des Streits im Verfahren 臺灣高等法院 115年度上訴字第3891號.''

    '
