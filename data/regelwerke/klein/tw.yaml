- id: tw-ki-risikoklassifizierung
  jurisdiktion: tw
  kurztitel: KI-Risikoklassifizierungsrahmen (人工智慧風險分類框架)
  offizieller_titel: 人工智慧風險分類框架 (v1.0) — AI Risk Classification Framework
  fundstelle: 'Erlass des 數位發展部 (Ministry of Digital Affairs) vom 07.07.2026 (民國115年7月7日), 數位策略字第1150015933號:
    「訂定『人工智慧風險分類框架』，並自即日生效」 — in Kraft mit dem Tag des Erlasses. Aufgenommen in das Rechtsportal des Ministeriums
    (數位發展部主管法規共用系統, 體系: 數位策略目).

    '
  verfahrensnummer: 數位策略字第1150015933號
  status: softlaw
  status_detail: 'In Kraft seit dem 07.07.2026. Verwaltungsvorschrift ohne unmittelbare Außenwirkung gegenüber
    Privaten: Der Rahmen ist nach Art. 16 Abs. 1 KI-Basisgesetz das gemeinsame Referenzraster, an dem
    die Fachaufsichten ihre eigenen risikobasierten Verwaltungsvorschriften auszurichten haben. Verbindlich
    wird er erst über diese Fachvorschriften, die nach Art. 18 KI-Basisgesetz bis Januar 2028 zu erlassen
    sind.

    '
  kurzbeschreibung: 'Das materiell wichtigste Durchführungsinstrument des KI-Basisgesetzes. Anders als
    die KI-Verordnung klassifiziert der Rahmen nicht nach RisikoSTUFEN (verboten / hoch / begrenzt / minimal),
    sondern nach RisikoTYPEN: drei Kategorien mit insgesamt zwanzig Untertypen, die den Behörden eine
    gemeinsame Sprache für die Risikoidentifikation geben. Dazu tritt ein vierschrittiges Verfahren (Anwendungsszenarien
    erfassen — Risiken identifizieren — Risiken bewerten — Risiken behandeln) mit Prüfbögen. Anwendungsbereich:
    ausschließlich zivile KI-Anwendungen (民用領域之 AI 應用); militärische Anwendungen sind ausdrücklich ausgenommen
    und dem Verteidigungsrecht vorbehalten. Sanktion: keine.

    '
  inkrafttreten:
    datum: 2026-07-07
    verifiziert: true
