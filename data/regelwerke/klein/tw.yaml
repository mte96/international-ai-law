  kurztitel: Exekutiv-Yuan-Leitlinie zu generativer KI in der Verwaltung
  offizieller_titel: '行政院及所屬機關（構）使用生成式AI參考指引 — Reference Guidelines for the Use of Generative AI by the
    Executive Yuan and its Subordinate Agencies

    '
  fundstelle: 'Beschluss der Kabinettssitzung des 行政院 vom 31.08.2023 (民國112年8月31日); Rundschreiben (函頒)
    nach mehreren weiterleitenden Behördenmitteilungen am 03.10.2023 (民國112年10月3日), ''self即日生效'' — mit
    sofortiger Wirkung. Erarbeitet vom 國家科學及技術委員會 gemeinsam mit zwölf Ressorts sowie Technik- und Rechtssachverständigen.
    Zehn Nummern.

    '
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'In Kraft und angewandt. Verwaltungsvorschrift ohne Außenwirkung (參考指引 — Referenzleitlinie).
    Sie ist der älteste KI-spezifische Rechtsakt Taiwans und lag zweieinhalb Jahre vor dem KI-Basisgesetz.
    Nach dessen Art. 19 Abs. 2 haben die Ressorts nunmehr eigene, an der Aufgabenart ausgerichtete Nutzungsvorschriften
    zu erlassen; die Leitlinie bleibt daneben Auffangregelung und ausdrücklicher Bezugspunkt für die Regelwerke
    von Judikative (2026) und anderen Verfassungsorganen.

    '
  kurzbeschreibung: 'Die Leitlinie bindet sämtliche Stellen des Exekutiv-Yuan und seiner nachgeordneten
    Behörden und Einrichtungen beim dienstlichen Einsatz generativer KI. Kernaussagen: Verantwortungsbewusster
    und vertrauenswürdiger Einsatz; Beachtung von Informationssicherheit, Datenschutz, Urheberrecht und
    Informationsnutzungsregeln; Bewusstsein für die Gefahr der Verletzung von Immaterialgüter- und Persönlichkeitsrechten;
    Wahrung von Autonomie und Kontrolle. Nr. 9 erstreckt die Geltung im Wege der entsprechenden Anwendung
    (準用) auf weitere Einrichtungen, Nr. 10 ermächtigt andere Verfassungsorgane, sich an ihr zu orientieren.
    Genau davon hat das 司法院 im Jahr 2026 Gebrauch gemacht. Sanktion: keine; Verstöße werden dienstrechtlich
    behandelt.

    '
  inkrafttreten:
    datum: 2023-08-31
    verifiziert: true
    quelle: https://www.ey.gov.tw/Page/448DE008087A1971/40c1a925-121d-4b6b-8f40-7e9e1a5401f2
  anwendungsdaten:
