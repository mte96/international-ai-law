  pruefvermerk:
  - 'FEHLER, doppelt. Eingetragen war 2025-07-16 — der Verkuendungstag (公布日) einer Novelle, die (1) erst
    drei Monate spaeter, am 16.10.2025, in Kraft trat (§ 115 letzter Satz: 自公布後三個月施行) und (2) die hier
    einschlaegigen §§ 90-1 und 90-3 gar nicht beruehrt: geaendert wurden die §§ 86, 90, 91, 93 und 115.
    Die fuer die taiwanische Deepfake-Doktrin tragenden §§ 90-1 und 90-3 stammen unveraendert aus der
    Novelle vom 01.07.2015 und gelten seit dem 03.07.2015. Die Bestandsangabe ''in der Fassung vom 16.07.2025''
    in der fundstelle ist entsprechend zu berichtigen. Jahreszaehlung 民國: 21=1932, 24=1935, 104=2015,
    111=2022, 114=2025, 115=2026. Vorher: 2025-07-16.'
- id: tw-tipo-genai-urheberrecht
