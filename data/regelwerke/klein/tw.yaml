- id: tw-ki-entwicklungs-verwaltungsgesetz-tpp
  jurisdiktion: tw
  kurztitel: TPP-Entwurf eines KI-Entwicklungs- und Verwaltungsgesetzes
  offizieller_titel: 人工智慧發展及管理條例草案 (Artificial Intelligence Development and Management Act, Entwurf)
  fundstelle: 'Vorlage der Fraktion 台灣民眾黨黨團 (Taiwan People''s Party Caucus) im Legislativ-Yuan, 11. Wahlperiode,
    unter der Sammelnummer 院總第20號; verbunden beraten mit den Vorlagen zum 人工智慧基本法.

    '
  verfahrensnummer: 院總第20號 (Fraktionsvorlage der 台灣民眾黨黨團)
  status: gescheitert
  status_detail: 'Nicht durchgedrungen. Der Entwurf wurde am 19. und 23.12.2025 gemeinsam mit den 33 anderen
    Vorlagen beraten; das Plenum verabschiedete das 人工智慧基本法, nicht das 條例. Die Vorlage ist damit erledigt.

    '
  kurzbeschreibung: 'Der einzige der 34 Entwürfe, der kein Grundsatzgesetz (基本法), sondern ein Regelungsgesetz
    (條例) vorsah. Die Bezeichnung ist juristisch bedeutsam: Ein 基本法 richtet sich in der taiwanischen Gesetzestechnik
    an den Staat und enthält Zielbestimmungen und Aufträge; ein 條例 ist ein Sonderfachgesetz mit unmittelbaren
    Pflichten und regelmäßig mit Sanktionen. Der Titel ''Entwicklung UND Verwaltung'' (發展及管理) markiert
    denselben Gegensatz wie die europäische Debatte zwischen Förderrecht und Produktregulierung. Das Scheitern
    dieses Entwurfs ist die eigentliche Grundsatzentscheidung des taiwanischen Gesetzgebers: Taiwan hat
    sich bewusst gegen ein Ge- und Verbotsgesetz entschieden.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://lis.ly.gov.tw/billtpc/dispprog
  anwendungsdaten:
  - datum: 2025-12-23
    was_gilt: 'Erledigt durch Verabschiedung des 人工智慧基本法 in der verbundenen Beratung.

      '
    verifiziert: true
    quelle: https://lis.ly.gov.tw/billtpc/dispprog
  themenachsen:
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - '''Die amtliche Verfahrensakte des Legislativ-Yuan führt die Vorlage wörtlich als: 台灣民眾黨黨團擬具「人工智慧發展及管理條例草案」
    — innerhalb einer Aufzählung, in der alle übrigen Vorlagen als 「人工智慧基本法草案」 bezeichnet sind. Der Unterschied
    ist damit amtlich dokumentiert.''

    '
  - 'Der Volltext der TPP-Vorlage ließ sich nicht beschaffen (Drucksachen auf ly.gov.tw nicht erreichbar).
    Der Regelungsgehalt ist daher nicht erfasst; belegt ist allein die Existenz und der abweichende Gesetzestyp.

    '
  dokumente:
