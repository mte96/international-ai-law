    typ: bericht
    titel: 智慧財產權電子報 第 238 期 — KI, Trainingsdaten und TDM
    url: https://www.tipo.gov.tw/tw/tipo1/90.html?id=80958
    sprache: zh
    urheber: 經濟部智慧財產局 (TIPO)
    verifiziert: true
    notiz: 'Amtlicher Newsletter. Behandelt GEMA gegen OpenAI, die europaeischen TDM-Schranken und die
