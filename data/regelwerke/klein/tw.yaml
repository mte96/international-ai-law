    notiz: 'Die Rechtsinhaltsseite GL000592 des NSTC-Rechtsportals führt heute die geltende Fassung des
      Gesetzes; die eigentliche Entwurfsseite (law.nstc.gov.tw/DraftOpinionContent.aspx) lieferte in dieser
      Sitzung einen Systemfehler. Bekanntmachungsdatum und Aktenzeichen sind über die Konsultationsplattform
      join.gov.tw belegt, nicht durch direkten Abruf der Entwurfsseite.

      '
