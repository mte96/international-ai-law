      '
  offene_punkte:
  - 'Die vom Vorgaenger angenommene Anhoerung des TIPO vom 20.07.2026, in der es sich gegen eine TDM-Schranke
    ausgesprochen haben soll, liess sich nicht belegen. Der Befund bleibt offen.

    '
  - 'Die Auskuenfte sind ueber die Themenseite einzeln abrufbar; eine konsolidierte amtliche Darstellung
    der TIPO-Linie zu KI existiert nicht.

    '
