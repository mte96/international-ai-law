  offizieller_titel: ACUERDO DE LA JUNTA GENERAL EJECUTIVA DEL INSTITUTO NACIONAL ELECTORAL, POR EL QUE
    SE APRUEBAN LOS LINEAMIENTOS Y PRINCIPIOS PARA EL DESARROLLO ESTRATÉGICO Y USO REGULADO DE LA INTELIGENCIA
    ARTIFICIAL EN EL INSTITUTO NACIONAL ELECTORAL
  fundstelle: Clave de documento INE/CG175/2025; Junta General Ejecutiva, 20 de agosto de 2025
  verfahrensnummer: Anlagen JGEor202508-20-ap-5-2.pdf und JGEor202508-20-ap-5-2-a.pdf
  status: anwendbar
  status_detail: 'Vom 20.08.2025. Verwaltungsintern bindend fuer das Instituto Nacional Electoral. Es
    ist die erste und bislang einzige mexikanische Verwaltungsvorschrift, die den KI-Einsatz einer Bundesbehoerde
    regelt. Formaler Hinweis: Das Dokument traegt die Kennung ''INE/CG175/2025'' (CG steht sonst fuer
    Consejo General), stammt aber ausweislich seines Titels und der Ablage in der Sammlung ''Junta General
    Ejecutiva / Acuerdos'' von der Junta General Ejecutiva. Die Bezeichnung ist damit in sich widerspruechlich
    und in Sekundaerquellen entsprechend uneinheitlich.

    '
  kurzbeschreibung: 'Die Lineamientos legen Grundsaetze und Verfahren fuer die strategische Entwicklung
    und den geregelten Einsatz kuenstlicher Intelligenz innerhalb des INE fest. Ihre Bedeutung liegt weniger
    im Inhalt als in der Rolle des Urhebers: Das INE ist die einzige grosse mexikanische Bundeseinrichtung,
    die die Verfassungsreform von 2024 unbeschadet ueberstanden hat und ihre Autonomie behielt — und die
    einzige, die sich selbst KI-Regeln gegeben hat, waehrend Justiz und Bundesverwaltung ohne solche arbeiten.
    Sanktionen sind dienstrechtlich; Aussenwirkung entfalten die Lineamientos nicht.

    '
