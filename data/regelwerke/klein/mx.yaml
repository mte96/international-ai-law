- id: mx-scjn-ia-institucional
  jurisdiktion: mx
  kurztitel: KI-Einsatz der SCJN — Praxis ohne Regelwerk
  offizieller_titel: Uso institucional de inteligencia artificial en la Suprema Corte de Justicia de la
    Nación (asistente virtual JusticIA; acuerdo del Pleno de septiembre de 2026)
  fundstelle: Comunicado de Prensa der SCJN vom 27.05.2025 (JusticIA); Beschluss des Pleno vom 03./04.09.2026
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Die SCJN setzt seit Mai 2025 den Assistenten JusticIA fuer den Zugang zu Rechtsprechungsinformationen
    ein. Am 03./04.09.2026 hat das Pleno beschlossen, KI ab der folgenden Woche als Unterstuetzungswerkzeug
    fuer die richterliche Arbeit der Ministras und Ministros einzusetzen. Eine foermliche Regelung — ein
    acuerdo general oder Lineamientos — ist nicht ersichtlich. Ministra Loretta Ortiz Ahlf hat dem ausdruecklich
    widersprochen: ''Fue una decisión del Pleno, yo no estaba tan de acuerdo... primero debería de haber
    la regulación de la utilización de la IA en los procesos más judiciales y jurídicos en la Corte.''

    '
  kurzbeschreibung: 'Der Vorgang ist juristisch bemerkenswert, weil er das Gegenstueck zur Jurisprudencia
    der Kollegialgerichte bildet. Ein Kollegialgericht des Zweiten Kreises hat sich 2025/2026 aus eigenem
    Antrieb Regeln fuer den KI-Einsatz gegeben (autocontención) und diese zu bindender Jurisprudencia
    verdichtet; das Hoechstgericht fuehrt KI 2026 ohne vorherige Regelung ein. Die Jurisprudencia bindet
    die Kollegialgerichte, nicht aber die SCJN. Sanktionen oder Rechtsfolgen sind nicht geregelt; wer
    eine Verletzung der Jurisprudencia-Mindestelemente ruegen will, ist auf den Amparo verwiesen. Fuer
    die Verwaltung insgesamt existiert keine KI-Regelung: Der Acuerdo General des Órgano de Administración
    Judicial vom 17.04.2026 zum elektronischen Aktenverfahren und zur Videokonferenz enthaelt keine KI-Vorschrift.

    '
  inkrafttreten: null
  anwendungsdaten:
  - datum: 2025-05-27
    was_gilt: Inbetriebnahme des Asistente Virtual JusticIA fuer die Recherche in Tesis, Urteilen, Acuerdos,
      Voten und Normenkontrollverfahren.
    verifiziert: true
    quelle: https://www.internet2.scjn.gob.mx/red2/comunicados/comunicado.asp?id=8279
  - datum: 2026-09-07
    was_gilt: Beginn des KI-Einsatzes als Unterstuetzungswerkzeug in der richterlichen Arbeit der Ministras
      und Ministros (Beschluss des Pleno).
    verifiziert: false
    quelle: https://www.cronica.com.mx/jalisco/guadalajara/2026/09/04/ministros-de-la-suprema-corte-usaran-la-inteligencia-artificial-como-herramienta-de-apoyo/
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - 'JusticIA: Assistent fuer den Zugang zu Justizinformationen in natuerlicher Sprache, ''a través de
    respuestas basadas en fuentes oficiales''. Erfasst Transparenz, Justicia digital, Datenschutzpflichten
    der SCJN, Beschwerden gegen Bedienstete sowie Kriterien und Entscheidungen der SCJN und der uebrigen
    Organe des Bundesjustizwesens einschliesslich Tesis, Urteilen, Acuerdos, Voten, controversias constitucionales
    und acciones de inconstitucionalidad.'
  - 'Beschluss des Pleno vom September 2026: KI als ''herramienta de apoyo'' in der Rechtsprechungstaetigkeit,
    ohne vorherige normative Grundlage. Abweichende Auffassung von Ministra Loretta Ortiz Ahlf.'
  - 'Kontrast zur Jurisprudencia: Die Tesis II.2o.C. J/2 K (12a.) verlangt fuer den KI-Einsatz Verhaeltnismaessigkeit
    und Unschaedlichkeit, Datenschutz, Transparenz und Erklaerbarkeit sowie menschliche Aufsicht — und
    untersagt den Einsatz ausdruecklich fuer die Auslegung und Anwendung von Normen. Ob die SCJN diese
    Grenze fuer sich uebernimmt, ist offen.'
  - 'Órgano de Administración Judicial: Der Acuerdo General des Pleno vom 17.04.2026 zum elektronischen
    Aktenverfahren und zu Videokonferenzen (DOF, Vespertina, 17.04.2026) regelt digitale Signatur, elektronische
    Zustellung und technische Infrastruktur, aber keine KI-Anwendung. Nach der Justizreform 2024 ist das
    OAJ an die Stelle des Consejo de la Judicatura Federal getreten.'
