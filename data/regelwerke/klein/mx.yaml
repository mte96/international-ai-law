    die ''creados íntegramente mediante inteligencia artificial'' sind. Damit geht das Land weiter als
    Sinaloa: Erfasst werden nicht nur manipulierte, sondern vollstaendig synthetisch erzeugte Darstellungen,
    bei denen es kein Ausgangsbild einer realen Person gibt. Strafrahmen: ein bis acht Jahre Freiheitsstrafe
    zuzueglich Geldstrafe. Das ist der weiteste Strafrahmen unter den mexikanischen Landesregelungen und
    liegt oberhalb des Bundesrahmens des Art. 199 Octies CPF (drei bis sechs Jahre).

    '
