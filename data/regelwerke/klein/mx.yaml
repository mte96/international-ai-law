- id: mx-minuta-deepfakes-ia-2026
  jurisdiktion: mx
  kurztitel: Minuta Deepfake-Strafrecht 2026 (im Senat)
  offizieller_titel: Proyecto de decreto por el que se reforman y adicionan los artículos 199 Octies y
    199 Nonies del Código Penal Federal y el artículo 16 de la Ley General para Prevenir, Sancionar y
    Erradicar los Delitos en Materia de Trata de Personas y para la Protección y Asistencia a las Víctimas
    de estos Delitos, en materia de creación de contenido íntimo mediante inteligencia artificial
  fundstelle: Minuta der Cámara de Diputados; Eingang im Senado de la República am 02.09.2026
  verfahrensnummer: Beschluss der Cámara de Diputados am 29.04.2026 mit 455 Stimmen; im Senat verwiesen
    an die Comisiones Unidas de Justicia; de Análisis, Seguimiento y Evaluación sobre la Aplicación y
    Desarrollo de la Inteligencia Artificial en México; y de Estudios Legislativos, Segunda
  status: verfahren
  status_detail: 'Von der Cámara de Diputados am 29.04.2026 einstimmig beschlossen und an den Senat weitergeleitet;
    dort am 02.09.2026 eingegangen und an drei vereinigte Ausschuesse verwiesen. La Jornada berichtete
    am 05.09.2026, der Senat wolle die Vorlage in der bis zum 15.12.2026 laufenden ordentlichen Sitzungsperiode
    vorrangig behandeln. Zum Datum der Beschlussfassung besteht ein WIDERSPRUCH: Ein Legislativtracker
    fuehrt eine Abstimmung vom 17.02.2026 mit 442 Stimmen; die Presseberichte nennen einhellig den 29.04.2026
    mit 455 Stimmen. Moeglich sind zwei getrennte Vorlagen; nicht aufgeloest.

    '
  kurzbeschreibung: 'Der erste Versuch, kuenstliche Intelligenz ausdruecklich in das Bundesstrafgesetzbuch
    zu schreiben. Strafbar sein soll, wer ohne Einwilligung mittels KI-Werkzeugen oder digitaler Bearbeitungsprogramme
    intimes sexuelles Material einer identifizierbaren volljaehrigen Person erzeugt, simuliert oder bearbeitet,
    sowie die Weiterverbreitung solchen Materials. Strafrahmen: vier bis acht Jahre Freiheitsstrafe und
    vierhundert bis tausend UMA — also deutlich schaerfer als der geltende Art. 199 Octies (drei bis sechs
    Jahre, fuenfhundert bis tausend UMA). Verschaerfte Strafen sind vorgesehen, wenn Minderjaehrige oder
    Personen betroffen sind, die die Handlung nicht verstehen koennen, und zwar unabhaengig davon, ob
    ein identifizierbares reales Opfer existiert. Parallel wird Art. 16 des Menschenhandelsgesetzes angepasst.

    '
  inkrafttreten: null
