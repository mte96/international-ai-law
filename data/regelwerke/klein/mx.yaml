- id: mx-lfda
  jurisdiktion: mx
  kurztitel: LFDA — mexikanisches Urheberrechtsgesetz
  offizieller_titel: Ley Federal del Derecho de Autor
  fundstelle: Diario Oficial de la Federación, 24 de diciembre de 1996; última reforma DOF 14-05-2026
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Geltende Fassung nach der Artistenreform vom 14.05.2026. Das Gesetz behaelt den strikt
    personalen Werkbegriff bei — Art. 12: ''Autor es la persona física que ha creado una obra literaria
    y artística'' —, auf den die SCJN im Amparo Directo 6/2025 die Verneinung der Schutzfaehigkeit von
    KI-Output gestuetzt hat. Es enthaelt KEINE Schranke fuer Text und Data Mining. Zustaendige Behoerde
    ist das Instituto Nacional del Derecho de Autor (INDAUTOR).

    '
  kurzbeschreibung: 'Das Urheberrechtsgesetz ist in Mexiko die Rechtsordnung, in der KI zuerst hoechstrichterlich
    behandelt wurde. Es schuetzt Werke ''de creación original'' (Art. 3), weist die Urheberschaft ausschliesslich
    natuerlichen Personen zu (Art. 12) und kennt Urheberpersoenlichkeitsrechte als unverzichtbar und unveraeusserlich.
    Seit dem 15.05.2026 enthaelt es zusaetzlich das KI-Klonverbot der Art. 87, 118 Fr. VII und 121 und
    die Klarstellung des Art. 102 zur Schutzfaehigkeit von KI-Software. Eine TDM-Schranke fehlt: Die Schrankenregelung
    des Art. 148 ist ein enumerativer Katalog ohne Auffangtatbestand und ohne Bezug zu Analysenutzungen.
    Wer in Mexiko ein Modell auf geschuetztem Material trainiert, kann sich auf keine ausdrueckliche gesetzliche
    Erlaubnis stuetzen. Sanktionen: Verwaltungsbussen des Titels XII sowie die Straftatbestaende der Art.
    424 ff. Código Penal Federal.

    '
  inkrafttreten:
    datum: 1997-03-24
    verifiziert: true
    quelle: https://www.ordenjuridico.gob.mx/Documentos/Federal/wo17068.doc
    fundstelle_norm: TRANSITORIOS PRIMERO.- 'La presente Ley entrará en vigor a los noventa días siguientes
      a su publicación en el Diario Oficial de la Federación' (DOF vom 24.12.1996); der neunzigste Tag
      ist der 24.03.1997
  anwendungsdaten:
  - datum: 2026-05-15
    was_gilt: KI-Klonverbot der Art. 87, 118 Fr. VII und 121 anwendbar.
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5787418&fecha=14/05/2026
  - datum: 2025-07-02
    was_gilt: 'Auslegung der Art. 3, 11 und 12 durch die Segunda Sala der SCJN im Amparo Directo 6/2025:
      KI kann weder Urheberin sein noch Traegerin von Urheberpersoenlichkeitsrechten.'
    verifiziert: true
    quelle: https://transparencia-ciudadana.scjn.gob.mx/sites/default/files/page/2025-08/scjn-ad-6-2025.pdf
  themenachsen:
  - urheberrecht
  - content
  - grundrechte
  - vertrag
  regelungsschwerpunkte:
  - 'Art. 3: ''Las obras protegidas por esta Ley son aquellas de creación original susceptibles de ser
    divulgadas o reproducidas en cualquier forma o medio.'' Originalitaet als Schutzvoraussetzung.'
  - 'Art. 11: Das Urheberrecht ist die staatliche Anerkennung zugunsten von Schoepfern und begruendet
    Urheberpersoenlichkeits- und Verwertungsrechte.'
  - 'Art. 12: ''Autor es la persona física que ha creado una obra literaria y artística.'' Der Satz, auf
    dem die gesamte mexikanische Doktrin zur KI-Autorschaft ruht. Die SCJN hat im Amparo Directo 6/2025
    daraus abgeleitet, dass der KI ''individualidad, originalidad, creatividad, experiencia, percepción
    del entorno y sentimientos'' fehlen. Zugleich hat sie klargestellt, dass hybride Werke mit substanziellem
    menschlichem Beitrag eintragungsfaehig bleiben.'
  - 'Art. 13: Enumerativer Katalog von vierzehn geschuetzten Werkarten, darunter programas de cómputo;
    ergaenzt durch die Analogieklausel.'
  - 'Art. 87 n.F.: Bild- und Stimmschutz ausuebender Kuenstler einschliesslich KI-Ergebnisse (siehe mx-decreto-artistas-ia-2026).'
  - 'Art. 102 n.F.: ''Los programas de computación, incluidos los de inteligencia artificial, se protegen
    en los mismos términos que las obras literarias.'''
  - 'Art. 118 Fr. VII und Art. 121 n.F.: Leistungsschutz gegen KI-Klonung, Schriftformerfordernis.'
  - 'TDM-LUECKE: Weder Art. 148 noch eine andere Vorschrift erlaubt Vervielfaeltigungen zu Analyse- oder
    Trainingszwecken. Es gibt in Mexiko weder eine DSM-artige Schranke noch einen Fair-Use-Auffangtatbestand.
    Das ist der schaerfste Unterschied zum US-Recht und zugleich der Grund, warum die mexikanische Diskussion
    sich ganz auf den Output verlagert hat.'
