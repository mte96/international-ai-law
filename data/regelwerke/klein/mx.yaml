      Ley Federal del Derecho de Autor.
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5787418&fecha=14/05/2026
  themenachsen:
  - urheberrecht
  - arbeit
  - content
  - grundrechte
  - vertrag
  regelungsschwerpunkte:
  - 'Art. 87 LFDA n.F. Abs. 1 und 2 (woertlich): ''La imagen, incluida la voz, de las personas artistas
    intérpretes o ejecutantes, así como de sus personajes, sólo puede ser usada o publicada, con su consentimiento
    expreso, o bien con el de sus representantes o los titulares de los derechos correspondientes. La
    protección a la que se refiere el párrafo anterior abarca los resultados generados por sistemas de
    inteligencia artificial o cualquier otra tecnología.'' Damit erstreckt Mexiko den Bild- und Stimmschutz
    ausdruecklich auf KI-Ausgaben — die Vorschrift knuepft an das ERGEBNIS an, nicht an das Verfahren,
    und erfasst damit auch Ausgaben, die kein geschuetztes Werk reproduzieren.'
  - 'Art. 87 LFDA n.F. Abs. 3: Die Einwilligung ist aus wichtigem Grund widerruflich, es sei denn, das
    Recht ist nach Art. 118 letzter Absatz erschoepft; der Widerrufende haftet fuer daraus entstehende
    Schaeden. Eine Widerrufslösung, die im europaeischen Recht kein Vorbild hat.'
  - 'Art. 118 Fr. VII LFDA n.F. (woertlich): ''La suplantación de sus interpretaciones o ejecuciones por
    sistemas de inteligencia artificial o cualquier otra tecnología que resulten en generación de clones
    de sus interpretaciones...'' — die Ersetzung durch KI wird als eigenstaendige Verwertungsart in den
    Katalog der Leistungsschutzrechte aufgenommen. Das ist mehr als ein Persoenlichkeitsschutz: Es ist
    ein handelbares Ausschliesslichkeitsrecht.'
  - 'Art. 121 LFDA n.F. Abs. 2 (woertlich): ''Cualquier clonación o suplantación de la voz o imagen realizada
    con sistemas de inteligencia artificial o cualquier otra tecnología que resulten en generación de
    clones de sus interpretaciones o que simulen su voz de manera identificable, requerirá de un acuerdo
    previo y por escrito entre las partes.'' Schriftformerfordernis; die Wendung ''que simulen su voz
    de manera identificable'' ist der Zurechnungsmassstab — Identifizierbarkeit, nicht Werkidentitaet.'
  - 'Art. 102 LFDA: ''Los programas de computación, incluidos los de inteligencia artificial, se protegen
    en los mismos términos que las obras literarias.'' Klarstellung, dass KI-Software als Computerprogramm
    geschuetzt ist. Diese Ergaenzung stammt aus der Reihe der Reformen 2025/2026 und ist von der Frage
    der Schutzfaehigkeit des OUTPUTS strikt zu trennen, die die SCJN im Amparo Directo 6/2025 verneint
    hat.'
  - 'Art. 163 Fr. IX LFDA n.F.: Vertraege ueber Interpretation, Sprechertaetigkeit, Werbesprecher, Synchronisation
    oder Auffuehrung werden in den Katalog der beim Registro Público del Derecho de Autor eintragbaren
    Vertraege aufgenommen — praktisch der Nachweisweg fuer die Schriftform des Art. 121.'
  - 'Art. 305 Bis LFT n.F. (woertlich): ''En los contratos que regulen la relación laboral de las personas
    trabajadoras artistas intérpretes o ejecutantes, se deberán estipular de manera específica las condiciones
    y la remuneración correspondiente para la utilización de su imagen o voz a través de sistemas de inteligencia
    artificial o cualquier otra tecnología.'' Der Arbeitsvertrag wird zum Instrument der KI-Governance;
    fehlt die Klausel, ist der Vertrag unvollstaendig und die Nutzung nicht gedeckt.'
  - 'Art. 304 LFT n.F.: Erweiterung des persoenlichen Anwendungsbereichs auf ''salas de doblaje'' und
    ''cualquier otro lugar o entorno donde se lleve a cabo la interpretación y/o ejecución'' — die Synchronsprecherbranche,
    die den politischen Druck fuer die Reform erzeugt hat, wird ausdruecklich erfasst.'
  - 'Transitorio Tercero: ''El Reglamento de la Ley Federal del Derecho de Autor deberá ser reformado
    y adicionado dentro de los sesenta días siguientes a la entrada en vigor del presente Decreto.'''
