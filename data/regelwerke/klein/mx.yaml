- id: mx-sinaloa-cp-185-bis-c
  jurisdiktion: mx
  bundesstaat: Sinaloa
  kurztitel: Art. 185 Bis C CP Sinaloa — KI-Deepfake-Straftatbestand
  offizieller_titel: Código Penal para el Estado de Sinaloa, artículo 185 Bis C, párrafos quinto y sexto
    (adicionados por decreto publicado el 12 de febrero de 2024 en el Periódico Oficial El Estado de Sinaloa)
  fundstelle: Periódico Oficial El Estado de Sinaloa, 12 de febrero de 2024
  verfahrensnummer: Einstimmig beschlossen vom H. Congreso del Estado de Sinaloa am 25.01.2024
  status: anwendbar
  status_detail: 'In Kraft und vom Pleno der SCJN am 20.02.2025 in der Acción de Inconstitucionalidad
    66/2024 einstimmig mit neun Stimmen fuer verfassungsgemaess erklaert. Damit ist dies der erste KI-Straftatbestand
    der Welt, dessen Vereinbarkeit mit dem strafrechtlichen Bestimmtheitsgebot hoechstrichterlich geprueft
    und bejaht wurde.

    '
  kurzbeschreibung: 'Die Absaetze fuenf und sechs des Art. 185 Bis C erweitern den 2023 geschaffenen Tatbestand
    der violación a la intimidad sexual: Bestraft wird auch, wer mittels kuenstlicher Intelligenz Bilder,
    Toene oder Videos intimen sexuellen Inhalts einer Person manipuliert, um wirklichkeitsnahe falsche
    Sachverhalte zu erzeugen, und sie ohne ausdrueckliche Einwilligung ueber Druck- oder elektronische
    Medien zu verbreiten beabsichtigt. Der Landesgesetzgeber hat kuenstliche Intelligenz dabei ausdruecklich
    definiert als ''las aplicaciones, programas o tecnología que analicen fotografías, audios o videos
    y ofrezcan ajustes automáticos para hacerles alteraciones o modificaciones''. Strafrahmen: drei bis
    sechs Jahre Freiheitsstrafe und fuenfhundert bis tausend Tagessaetze Geldstrafe. Angegriffen wurde
    ausdruecklich die Wortfolge ''a quien haciendo uso de la Inteligencia Artificial''.

    '
  inkrafttreten:
    datum: 2024-02-13
    verifiziert: false
    quelle: https://fiscaliasinaloa.mx/Contenido/Normatividad/Leyes/Codigo%20Penal%20para%20el%20Estado%20de%20Sinaloa.pdf
    fundstelle_norm: 'Decreto No. 699 (P.O. ''El Estado de Sinaloa'' No. 019 vom 12.02.2024), TRANSITORIO
