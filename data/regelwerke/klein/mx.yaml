- id: mx-reforma-art-73-ia
  jurisdiktion: mx
  kurztitel: Verfassungsaenderung Art. 73 — KI-Kompetenz des Bundes
  offizieller_titel: Iniciativa con proyecto de decreto por el que se adiciona una fracción al artículo
    73 de la Constitución Política de los Estados Unidos Mexicanos, en materia de inteligencia artificial
  fundstelle: Senado de la República (03.02.2026) und Cámara de Diputados (05.08.2026)
  verfahrensnummer: 'Senat: Sen. Saúl Monreal Ávila (MORENA), 03.02.2026 — neue Fraktion XXXII des Art.
    73. Diputados: Dip. Gabriela Jiménez Godoy (MORENA), 05.08.2026'
  status: verfahren
  status_detail: 'Zwei parallele Vorhaben in beiden Kammern, beide in den Ausschuessen. Sie sind die verfassungsrechtliche
    Voraussetzung fuer jedes allgemeine KI-Gesetz des Bundes. Ohne sie kann der Kongress eine ''ley general''
    nur auf Annexkompetenzen stuetzen, was jede Landesregierung im Wege der controversia constitucional
    angreifen koennte.

    '
  kurzbeschreibung: 'Die Vorhaben wollen dem Congreso de la Unión die Befugnis geben, allgemeine Gesetze
    ueber Regulierung, Governance, Entwicklung und ethische Nutzung kuenstlicher Intelligenz zu erlassen.
    Der verfassungsrechtliche Hintergrund ist die Kompetenzordnung des mexikanischen Bundesstaates: Was
    Art. 73 nicht ausdruecklich dem Bund zuweist, verbleibt nach Art. 124 CPEUM bei den Bundesstaaten.
    Genau darum haben rund zweihundert KI-bezogene Vorhaben in den Landesparlamenten stattgefunden und
    39 sind angenommen worden, waehrend der Bund nichts erlassen hat. Sanktionen enthalten die Vorhaben
    nicht; sie sind reine Kompetenznormen.

    '
  inkrafttreten: null
  anwendungsdaten:
  - datum: 2026-02-03
    was_gilt: Einbringung im Senat durch Sen. Saúl Monreal Ávila (MORENA).
    verifiziert: false
    quelle: https://www.observatorio-ia-mexico.com/proceso-legislativo
  - datum: 2026-08-05
    was_gilt: Einbringung in der Cámara de Diputados durch Dip. Gabriela Jiménez Godoy (MORENA).
    verifiziert: false
    quelle: https://comunicacionsocial.diputados.gob.mx/index.php/boletines/-impulsan-reforma-constitucional-para-que-el-congreso-regule-el-uso-de-la-inteligencia-artificial-y-dispositivos-afines
  themenachsen:
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - Einfuegung einer neuen Fraktion in Art. 73 CPEUM, die dem Kongress die Gesetzgebung ueber kuenstliche
    Intelligenz zuweist.
  - 'Verfassungsrechtlicher Kern: Ohne die Aenderung greift Art. 124 CPEUM — die nicht ausdruecklich dem
    Bund zugewiesenen Befugnisse verbleiben bei den Bundesstaaten. Das erklaert, warum das mexikanische
    KI-Recht bislang Landesstrafrecht ist.'
  - 'Verfahrensfolge: Eine Verfassungsaenderung erfordert nach Art. 135 CPEUM Zweidrittelmehrheiten in
    beiden Kammern und die Zustimmung der Mehrheit der Landesparlamente. Der Zeitbedarf ist erheblich.'
