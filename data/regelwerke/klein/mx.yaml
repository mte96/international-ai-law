- id: mx-reforma-simplificacion-organica
  jurisdiktion: mx
  kurztitel: Verfassungsreform simplificación orgánica — Aufloesung des INAI
  offizieller_titel: DECRETO por el que se reforman, adicionan y derogan diversas disposiciones de la
    Constitución Política de los Estados Unidos Mexicanos, en materia de simplificación orgánica
  fundstelle: Diario Oficial de la Federación, 20 de diciembre de 2024
  verfahrensnummer: Iniciativa del Ejecutivo Federal (Andrés Manuel López Obrador, Februar 2024); verabschiedet
    vom Congreso de la Unión und den Landesparlamenten im November/Dezember 2024
  status: anwendbar
  status_detail: 'In Kraft seit 21.12.2024. Sieben autonome Verfassungsorgane wurden aufgeloest, darunter
    das INAI (Datenschutz und Transparenz), das IFT (Telekommunikation) und die COFECE (Wettbewerb). Die
    Ausfuehrung erfolgte am 20.03.2025 durch drei neue Gesetze und am 16.07.2025 durch die Telekommunikationsreform.
    Die Datenschutzaufsicht liegt seither bei der Secretaría Anticorrupción y Buen Gobierno, also bei
    einem Ressort der Bundesverwaltung.

    '
  kurzbeschreibung: 'Kernstueck der institutionellen Umgestaltung Mexikos unter der Regierung Sheinbaum.
    Der Beschluss beseitigt die verfassungsrechtliche Verankerung unabhaengiger Aufsichtsorgane und verlagert
    deren Aufgaben in die zentrale Bundesverwaltung. Fuer das KI-Recht ist das die folgenreichste Aenderung
    des mexikanischen Rechts der letzten Jahre: Die Datenschutzaufsicht, die in jeder anderen Rechtsordnung
    die erste KI-Aufsichtsbehoerde ist, wird in Mexiko von einem weisungsgebundenen Ministerium gefuehrt.
    Der Transitorio Segundo setzte dem Kongress eine Frist von neunzig Kalendertagen fuer die Anpassung
    der einfachen Gesetze; sie wurde mit dem Gesetzespaket vom 20.03.2025 eingehalten. Eigene Sanktionen
    enthaelt der Beschluss nicht.

    '
