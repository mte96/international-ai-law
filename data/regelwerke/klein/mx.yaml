- id: mx-decreto-artistas-ia-2026
  jurisdiktion: mx
  kurztitel: Artistenreform 2026 — Stimm- und Bildklonverbot
  offizieller_titel: DECRETO por el que se reforman y adicionan diversas disposiciones de la Ley Federal
    del Trabajo y de la Ley Federal del Derecho de Autor, en materia de derechos de las personas trabajadoras
    artistas intérpretes o ejecutantes
  fundstelle: Diario Oficial de la Federación, 14 de mayo de 2026
  verfahrensnummer: Beschlossen vom Congreso de la Unión am 15.04.2026 (Dip. Kenia López Rabadán, Presidenta
    de la Cámara de Diputados; Sen. Laura Itzel Castillo Juárez, Presidenta del Senado)
  status: anwendbar
  status_detail: 'In Kraft seit 15.05.2026 (Transitorio Primero: Tag nach der Verkuendung). Dies ist die
    einzige Vorschriftengruppe des geltenden mexikanischen Bundesrechts, die kuenstliche Intelligenz materiell
    und ausdruecklich regelt. Der Transitorio Tercero verpflichtete die Exekutive, das Reglamento de la
    Ley Federal del Derecho de Autor binnen sechzig Tagen anzupassen; diese Frist lief am 13.07.2026 ab.
    Eine Anpassung ist bis zum 05.09.2026 nicht nachweisbar.

    '
  kurzbeschreibung: 'Das Dekret verankert im Urheber- und im Arbeitsrecht ein Zustimmungserfordernis fuer
    die Nachbildung von Stimme und Bild ausuebender Kuenstlerinnen und Kuenstler durch KI-Systeme. Es
    wirkt auf drei Ebenen: als Leistungsschutzrecht (Art. 118 Fr. VII LFDA: die Ersetzung der Darbietung
    durch KI-Systeme wird zum ausschliesslichen Recht der ausuebenden Person), als Persoenlichkeitsrecht
    (Art. 87 LFDA: der Schutz von Bild und Stimme erfasst ''los resultados generados por sistemas de inteligencia
    artificial o cualquier otra tecnología''), und als arbeitsvertragliche Pflicht (Art. 305 Bis LFT:
    der Arbeitsvertrag muss Bedingungen und Verguetung fuer die Nutzung von Bild oder Stimme durch KI-Systeme
    ausdruecklich regeln). Art. 121 LFDA verlangt fuer jede Klonung oder Ersetzung von Stimme oder Bild
    durch KI ''un acuerdo previo y por escrito entre las partes''. Sanktionsseitig greifen die urheberrechtlichen
    Verwaltungsbussen der LFDA (fuer eine der betroffenen Fraktionen tausend bis fuenftausend Tagessaetze
    des Mindestlohns).

    '
  inkrafttreten:
    datum: 2026-05-15
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5787418&fecha=14/05/2026
  anwendungsdaten:
