  regelungsschwerpunkte:
  - Risikobasierter Ansatz mit verbotenen Praktiken und einem Register fuer Hochrisikosysteme — strukturell
    an der KI-VO orientiert.
  - 'Verbotene Praktiken u.a.: ''manipulación cognitiva, política, electoral o social con fines ilícitos
    o contrarios a los principios democráticos, de manera deliberada''; nicht einvernehmliche sexuelle
    Deepfakes; anlasslose Massenueberwachung; Wahldesinformation.'
  - 'Behoerdenarchitektur in drei Ebenen: Autoridad Nacional de Inteligencia Artificial (Koordinierung),
    SECIHTI (Wissenschaft und Entwicklung), ATDT (Betrieb). Weil das IFT nicht mehr existiert, muss eine
    neue Behoerde geschaffen werden — genau daran entzuendet sich die Kritik, der Entwurf raeume der kuenftigen
    Behoerde uebermaessige Ermessensspielraeume ein (María Solange Maqueo, Universidad La Salle).'
  - Fuenf Neurorechte — im lateinamerikanischen Vergleich die zweite Rechtsordnung nach Chile, die Neurorechte
    in ein KI-Gesetz aufnimmt.
  - Dreistufiges Sanktionsregime leve / grave / gravísima mit Freiheitsstrafe in den schwersten Faellen.
    Damit wuerde Mexiko den in Europa strikt getrennten Bereich von Produktregulierung und Strafrecht
    in einem Gesetz zusammenfuehren.
  - 'Verfassungsrechtliche Schwaeche: Ein ''ley general'' setzt eine Bundeskompetenz voraus. Solange Art.
    73 CPEUM keine KI-Kompetenz kennt, ist der Entwurf angreifbar. Deshalb laufen die beiden Verfassungsaenderungsvorhaben
    parallel.'
