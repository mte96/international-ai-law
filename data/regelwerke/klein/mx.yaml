  offene_punkte:
  - Kein Durchfuehrungsreglement zur Fassung 2025. Ob das Reglamento von 2011 fortgilt, ist umstritten.
  - Reichweite der Ausnahme fuer 'fuentes de acceso público' beim Scraping fuer Modelltraining — bislang
    keine veroeffentlichte Entscheidung der Secretaría.
  - Ob die Secretaría Anticorrupción y Buen Gobierno eine eigene Auslegungspraxis zum Widerspruchsrecht
    des Art. 26 Fr. II gegen KI-gestuetzte Entscheidungen entwickelt, ist offen; INAI-Kriterien aus der
    Zeit vor 2025 sind formell nicht mehr bindend.
