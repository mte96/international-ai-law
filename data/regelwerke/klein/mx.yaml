- id: mx-iniciativa-monreal-2024
  jurisdiktion: mx
  kurztitel: Ley Federal que Regula la IA (2024) — gescheitert
  offizieller_titel: Iniciativa con proyecto de decreto por el que se expide la Ley Federal que Regula
    la Inteligencia Artificial
  fundstelle: Senado de la República, LXV Legislatura (April 2024)
  verfahrensnummer: Sen. Ricardo Monreal Ávila
  status: gescheitert
  status_detail: 'Der erste ernsthafte mexikanische Anlauf zu einem Bundes-KI-Gesetz. Er ordnete die Aufsicht
    dem Instituto Federal de Telecomunicaciones zu. Mit der Verfassungsreform vom 20.12.2024 und der Abloesung
    des IFT durch die LMTR im Juli 2025 wurde die Konstruktion gegenstandslos; der Entwurf gilt als desechada.
    Ricardo Monreal hat im Februar 2026 als Fraktionsvorsitzender in der Cámara de Diputados einen neuen
    Anlauf unternommen.

    '
  kurzbeschreibung: 'Der Entwurf sah eine Risikoklassifizierung in ''inaceptables, alto riesgo y bajo
    riesgo'' vor, Transparenzpflichten, Zertifizierungsmechanismen und Regelungen zur zivilrechtlichen
    Haftung; zustaendige Behoerde sollte das IFT sein. Er ist als Negativbeispiel lehrreich: Ein KI-Gesetz,
    das seine Aufsicht an ein autonomes Fachorgan haengt, faellt mit diesem Organ. Sanktionen sah der
    Entwurf verwaltungsrechtlich vor; ein Straftatbestand war nicht enthalten.

    '
  inkrafttreten: null
