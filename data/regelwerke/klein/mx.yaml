- id: mx-lgpdppso
  jurisdiktion: mx
  kurztitel: LGPDPPSO — Datenschutz im oeffentlichen Sektor
  offizieller_titel: Ley General de Protección de Datos Personales en Posesión de Sujetos Obligados
  fundstelle: Diario Oficial de la Federación, 20 de marzo de 2025; última reforma DOF 14-11-2025
  verfahrensnummer: Teil des Dekrets vom 20.03.2025
  status: anwendbar
  status_detail: 'In Kraft seit 21.03.2025; ersetzt das gleichnamige Gesetz von 2017. Bindet Behoerden,
    Gerichte, Parteien, Gewerkschaften und alle Stellen, die oeffentliche Mittel verwenden — in Bund,
    Laendern und Gemeinden. Aufsicht: Secretaría Anticorrupción y Buen Gobierno (Art. 3 Fr. XXVI, Art.
    81) neben den ''autoridades garantes'' der Laender (Art. 83).

    '
  kurzbeschreibung: 'Das Gegenstueck zur LFPDPPP fuer den oeffentlichen Sektor und damit das Regelwerk,
    an dem sich jeder KI-Einsatz der mexikanischen Verwaltung und Justiz messen lassen muss. Es kennt
    — anders als das Privatsektorgesetz — eine Datenschutz-Folgenabschaetzung (Art. 68) und wiederholt
    in Art. 41 Fr. II das Widerspruchsrecht gegen automatisierte Verarbeitung. Die Jurisprudencia zum
    KI-Einsatz in der Justiz fordert als eines ihrer vier Mindestelemente ausdruecklich den ''Schutz der
    personenbezogenen Daten der Gerichtsakte''; die materielle Grundlage dieses Elements ist dieses Gesetz.
    Sanktionen richten sich gegen Amtstraeger und folgen dem Recht der administrativen Verantwortlichkeit.

    '
  inkrafttreten:
    datum: 2025-03-21
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5752569&fecha=20/03/2025
  anwendungsdaten:
  - datum: 2025-03-21
    was_gilt: Anwendbarkeit; Abrogation der LGPDPPSO vom 26.01.2017.
    verifiziert: true
    quelle: https://www.diputados.gob.mx/LeyesBiblio/pdf/LGPDPPSO.pdf
  themenachsen:
  - datenschutz
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Art. 3 Fr. XXVI: Legaldefinition ''Secretaría'' = Secretaría Anticorrupción y Buen Gobierno.'
  - 'Art. 15: Einwilligungserfordernis fuer sensible Daten.'
  - 'Art. 41 Fr. II: Widerspruchsrecht, wenn ''sus datos personales sean objeto de un tratamiento automatizado,
    el cual le produzca efectos jurídicos no deseados o afecte de manera significativa sus intereses''.
    Wortgleich mit Art. 26 Fr. II LFPDPPP — der mexikanische Gesetzgeber hat die Vorschrift 2025 in beide
    Gesetze uebernommen, ohne sie an den KI-Einsatz anzupassen.'
  - 'Art. 68: ''deberá realizar una evaluación de impacto en la protección de datos personales''. Die
    einzige Folgenabschaetzungspflicht des mexikanischen Datenschutzrechts. Sie trifft ausschliesslich
    oeffentliche Stellen und ist damit der einzige rechtlich greifbare Anknuepfungspunkt fuer eine Grundrechte-Folgenabschaetzung
    beim KI-Einsatz der Verwaltung.'
  - 'Art. 81 bis 83: Zustaendigkeiten der Secretaría und der Landesgarantiestellen; Art. 86 bis 100: Ueberpruefungsverfahren
    (recurso de revisión).'
  - Kein Verweis auf 'inteligencia artificial'. Wie im Privatsektorrecht fehlt jede KI-spezifische Pflicht;
    der KI-Einsatz der Verwaltung wird ueber die allgemeinen Grundsaetze und die Folgenabschaetzung erfasst.
  dokumente:
  - datum: 2025-03-20
    typ: endfassung
    titel: DECRETO por el que se expiden la LGTAIP; la LGPDPPSO; la LFPDPPP ... (DOF 20/03/2025)
    url: https://www.dof.gob.mx/nota_detalle.php?codigo=5752569&fecha=20/03/2025
    sprache: es
    urheber: Congreso General de los Estados Unidos Mexicanos
    verifiziert: true
    notiz: Amtliche Verkuendung des Pakets.
  - datum: 2025-11-14
    typ: konsolidiert
    titel: Ley General de Protección de Datos Personales en Posesión de Sujetos Obligados — texto vigente
    url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LGPDPPSO.pdf
    sprache: es
    urheber: Cámara de Diputados
