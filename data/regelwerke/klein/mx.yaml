- id: mx-plan-nacional-ia-2026
  jurisdiktion: mx
  kurztitel: Plan Nacional de Inteligencia Artificial (ATDT, 2026)
  offizieller_titel: Plan Nacional de Inteligencia Artificial
  fundstelle: Agencia de Transformación Digital y Telecomunicaciones (ATDT), April 2026
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Im April 2026 von der Agencia de Transformación Digital y Telecomunicaciones vorgelegt
    und flankierend zur Vorstellung des Marco Normativo der Senatskommission am 30.04.2026 praesentiert.
    Kein Rechtsakt, keine Verkuendung im DOF, keine Bindungswirkung. Er ist damit das mexikanische Gegenstueck
    zu einer nationalen KI-Strategie — mit dem Unterschied, dass Mexiko bis heute keine im DOF veroeffentlichte
    Estrategia Nacional de Inteligencia Artificial besitzt.

    '
  kurzbeschreibung: 'Der Plan ruht auf drei Saeulen: ''un marco ético y legal sólido'', ''capacidades:
    talento y software público'' und ''infraestructura estratégica para la soberanía tecnológica''. Er
    ordnet sich in die Technologiepolitik der Regierung Sheinbaum ein, zu der die Projekte Kutsari (Halbleiterdesign),
    Quetzal (Drohnen), Olinia (Elektrofahrzeuge) und Coatlicue gehoeren, sowie der Aufbau einer Fábrica
    de IA mit dem nach eigenen Angaben leistungsfaehigsten Rechner Lateinamerikas. Rechtlich ist er ohne
    Wirkung; politisch ist er der Rahmen, in dem die ATDT ihre Rolle als kuenftige Betriebsbehoerde eines
    KI-Gesetzes begruendet.

    '
  inkrafttreten: null
  anwendungsdaten:
  - datum: 2026-04-30
    was_gilt: Oeffentliche Vorstellung im Umfeld der Praesentation des senatorischen Marco Normativo.
    verifiziert: false
    quelle: https://www.amcp.mx/plan-nacional-de-inteligencia-artificial-atdt-abril-2026/
  themenachsen:
  - governance
  - gpai
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Saeule 1: ''Un marco ético y legal sólido'' — Bekenntnis zu einem kuenftigen Rechtsrahmen, ohne ihn
    zu ersetzen.'
  - 'Saeule 2: ''Capacidades: talento y software público'' — oeffentliche Software und Kompetenzaufbau
    statt Marktregulierung.'
  - 'Saeule 3: ''Infraestructura estratégica para la soberanía tecnológica'' — Rechenkapazitaet, Halbleiter,
    souveraene Modelle.'
  - 'Institutionelle Bedeutung: Der Plan positioniert die ATDT, nicht die kuenftige Autoridad Nacional
    de IA, als operative Traegerin der KI-Politik. Das ist eine Vorentscheidung ueber die Behoerdenarchitektur,
    die der Gesetzgeber noch nicht getroffen hat.'
