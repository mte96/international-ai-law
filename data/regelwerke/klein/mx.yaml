  offene_punkte:
  - Ob eine KI-Kompetenz in Art. 73 aufgenommen wird, entscheidet ueber die Verfassungsmaessigkeit jedes
    kuenftigen Bundes-KI-Gesetzes. Beide Vorhaben liegen in den Ausschuessen.
  - Ob die verwaltungsinterne Datenschutzkontrolle nach Art. 6 A n.F. den Unabhaengigkeitsanforderungen
    des Uebereinkommens 108+ und des EU-Angemessenheitsdialogs genuegt, ist offen.
