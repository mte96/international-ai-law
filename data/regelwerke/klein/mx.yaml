  - 'Kennzeichnungsgebot: sichtbares oder hoerbares digitales Transparenzkennzeichen bei synthetischen
    Darstellungen — funktional das mexikanische Gegenstueck zu Art. 50 KI-VO, aber sektoral auf Wahlpropaganda
    und Minderjaehrige begrenzt.'
