- id: mx-lft
  jurisdiktion: mx
  kurztitel: LFT — Bundesarbeitsgesetz
  offizieller_titel: Ley Federal del Trabajo
  fundstelle: Diario Oficial de la Federación, 1 de abril de 1970; última reforma DOF 14-05-2026
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Geltende Fassung mit dem durch die Artistenreform eingefuegten Art. 305 Bis. Ausserhalb
    des Kapitels ueber ausuebende Kuenstler enthaelt das Gesetz keine KI-spezifische Vorschrift; insbesondere
    gibt es keine allgemeine Unterrichtungspflicht ueber algorithmisches Management. Eine entsprechende
    Initiative vom April 2026 liegt in den Ausschuessen.

    '
  kurzbeschreibung: 'Das Bundesarbeitsgesetz regelt seit dem 15.05.2026 in Art. 305 Bis, dass Arbeitsvertraege
    ausuebender Kuenstlerinnen und Kuenstler die Bedingungen und die Verguetung fuer die Nutzung von Bild
    oder Stimme durch KI-Systeme ausdruecklich festlegen muessen. Das ist der einzige arbeitsrechtliche
    KI-Tatbestand des mexikanischen Bundesrechts. Fuer alle uebrigen Beschaeftigten gilt nur das allgemeine
    Recht: Art. 132 (Arbeitgeberpflichten), das Verbot der Diskriminierung (Art. 2 und 3) und die Regeln
    ueber Telearbeit (Kapitel XII Bis, Art. 330-A ff.), die eine Bereitstellungs- und Fuersorgepflicht
    fuer eingesetzte Technik begruenden. Sanktionen richten sich nach Titel XVI (Art. 992 ff.).

    '
