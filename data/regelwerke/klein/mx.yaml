  - grundrechte
  regelungsschwerpunkte:
  - 'Art. 305 Bis: KI-Klausel als zwingender Vertragsinhalt (Volltext siehe mx-decreto-artistas-ia-2026).'
  - 'Art. 304 n.F.: Erweiterung auf ''salas de doblaje'' und jeden Ort, an dem eine Darbietung stattfindet.'
  - KEINE allgemeine Regelung des algorithmischen Managements. Es gibt keine Unterrichtungspflicht bei
    KI-gestuetzter Aufgabenverteilung oder Leistungsbewertung und kein Recht auf menschliches Eingreifen
    — anders als in Italien (Art. 11 legge 132/2025 mit Verweis auf das decreto trasparenza) oder Spanien
    (Art. 64.4 lit. d ET).
  - 'Vorhaben: Eine Initiative vom April 2026 will Beschaeftigte informieren, wenn KI-Systeme in Aufgabenzuweisung
    und Leistungsbewertung eingreifen, und menschliches Eingreifen bei Entscheidungen mit Auswirkung auf
    Arbeitsrechte vorschreiben. Nur ueber Sekundaerquelle belegt.'
