- id: mx-lfpdppp
  jurisdiktion: mx
  kurztitel: LFPDPPP 2025 — Datenschutz im Privatsektor
  offizieller_titel: Ley Federal de Protección de Datos Personales en Posesión de los Particulares
  fundstelle: Diario Oficial de la Federación, 20 de marzo de 2025
  verfahrensnummer: Teil des Dekrets vom 20.03.2025 (LGTAIP, LGPDPPSO, LFPDPPP und Reform des Art. 37
    Fr. XV LOAPF)
  status: anwendbar
  status_detail: 'In Kraft seit 21.03.2025 (Transitorio Primero). Die Fassung von 2010 ist abrogiert.
    Aufsichtsbehoerde ist nicht mehr das INAI, sondern die Secretaría Anticorrupción y Buen Gobierno (Art.
    2 Fr. XV). Eine Reform vom 14.11.2025 hat Art. 4 an das Código Nacional de Procedimientos Civiles
    y Familiares angepasst; sie wird wirksam, sobald die Bundesstaaten das Nationale Verfahrensgesetzbuch
    uebernehmen, spaetestens automatisch am 01.04.2027. Ein Durchfuehrungsreglement zur neuen Fassung
    liegt bislang nicht vor; das Reglamento von 2011 gilt fort, soweit es nicht widerspricht.

    '
  kurzbeschreibung: 'Das zentrale Datenschutzgesetz fuer private Verantwortliche und damit das wichtigste
    geltende Regelwerk fuer KI-Training und KI-gestuetzte Entscheidungen in Mexiko. Es verpflichtet Verantwortliche
    auf die Grundsaetze licitud, finalidad, lealtad, consentimiento, calidad, proporcionalidad, información
    und responsabilidad (Art. 5), verlangt fuer sensible Daten ausdrueckliche schriftliche Einwilligung
    (Art. 8) und gibt der betroffenen Person in Art. 26 Fr. II ein Widerspruchsrecht gegen automatisierte
    Verarbeitung, die unerwuenschte Rechtsfolgen erzeugt oder ihre Interessen, Rechte oder Freiheiten
    erheblich beeintraechtigt — die einzige Vorschrift des geltenden mexikanischen Bundesrechts, die algorithmischen
    Entscheidungen unmittelbar entgegentritt. Sanktionen: Geldbussen von 100 bis 160.000 UMA (Art. 59
    Fr. I fuer die Verstoesse der Fraktionen II bis VII) und von 200 bis 320.000 UMA (Fraktionen VIII
    bis XVIII), bei sensiblen Daten Verdoppelung; daneben Straftatbestaende von drei Monaten bis fuenf
    Jahren Freiheitsstrafe (Art. 62 ff.).

    '
