- id: mx-lfpdppp-2010
  jurisdiktion: mx
  kurztitel: LFPDPPP 2010 — abgeloestes Datenschutzgesetz
  offizieller_titel: Ley Federal de Protección de Datos Personales en Posesión de los Particulares (05-07-2010)
  fundstelle: Diario Oficial de la Federación, 5 de julio de 2010
  verfahrensnummer: ''
  status: aufgehoben
  status_detail: 'Abrogiert mit Wirkung vom 21.03.2025 durch Transitorio Segundo des Dekrets vom 20.03.2025.
    Zusammen mit ihr wurden die LGTAIP 2015, die LFTAIP 2016 und die LGPDPPSO 2017 aufgehoben. Bedeutung
    heute nur noch fuer Altfaelle und fuer das Verstaendnis der Aufsichtsarchitektur: Unter ihr lag die
    Aufsicht beim IFAI, spaeter beim INAI, also bei einem unabhaengigen Organ.

    '
  kurzbeschreibung: 'Erstes umfassendes mexikanisches Datenschutzgesetz fuer den Privatsektor. Es begruendete
    die derechos ARCO, den Aviso de Privacidad und die Aufsicht durch ein unabhaengiges Organ. Seine Bedeutung
    fuer das KI-Recht liegt darin, dass die gesamte Auslegungspraxis zu Trainingsdaten, Scraping und automatisierter
    Verarbeitung, die das INAI zwischen 2010 und 2024 aufgebaut hat, auf ihm beruht — und mit der Aufloesung
    des INAI formell den Boden verloren hat. Sanktionen entsprachen weitgehend denen der Fassung 2025.

    '
  inkrafttreten:
    datum: 2010-07-06
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5150631&fecha=05/07/2010
    fundstelle_norm: TRANSITORIOS PRIMERO.- 'El presente Decreto entrará en vigor al día siguiente al
      de su publicación en el Diario Oficial de la Federación' (DOF vom 05.07.2010)
  anwendungsdaten:
  - datum: 2025-03-21
    was_gilt: Ausserkrafttreten (Transitorio Segundo des Dekrets vom 20.03.2025).
    verifiziert: true
    quelle: https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPDPPP.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  regelungsschwerpunkte:
  - Aufsicht durch das IFAI/INAI als autonomes Organ — der entscheidende Unterschied zur Fassung 2025.
  - Reglamento de la LFPDPPP (DOF 21.12.2011) und die Lineamientos del Aviso de Privacidad (DOF 17.01.2013)
    waren die praktisch wichtigsten Ausfuehrungsvorschriften; ihr Fortgelten unter der Fassung 2025 ist
    ungeklaert.
