- id: mx-cdmx-cp-2026
  jurisdiktion: mx
  bundesstaat: Ciudad de México
  kurztitel: Strafrechtsreform CDMX 2026 — digitale Erpressung
  offizieller_titel: Dictamen por el que se reforman y adicionan diversas disposiciones del Código Penal
    para el Distrito Federal, en materia de extorsión y hostigamiento coercitivo
  fundstelle: Congreso de la Ciudad de México, III Legislatura; Plenarbeschluss vom 27.05.2026
  verfahrensnummer: Dictamen aus zehn Initiativen, darunter eine der Jefa de Gobierno Clara Brugada
  status: verabschiedet
  status_detail: 'Am 27.05.2026 einstimmig vom Plenum des Congreso de la Ciudad de México beschlossen.
    WICHTIGER VORBEHALT: Die amtliche Parlamentsmitteilung zu diesem Beschluss erwaehnt kuenstliche Intelligenz
    mit keinem Wort — eine Volltextsuche der Mitteilung nach ''artificial'' bleibt ohne Treffer. Die Zuschreibung
    von KI-Tatbestaenden (Stimmklonung, Deepfakes, Identitaetsuebernahme mittels KI) an diese Reform stammt
    ausschliesslich aus der Presseberichterstattung. Der Widerspruch ist nicht aufgeloest.

    '
  kurzbeschreibung: 'Die Reform verschaerft die Erpressungstatbestaende des Strafgesetzbuchs der Hauptstadt
    und fuegt neue Begehungsformen ein, darunter nach Presseberichten die Identitaetsuebernahme mittels
    kuenstlicher Intelligenz, die Klonung von Stimmen und manipulierte Videos. Belegt sind aus amtlicher
    Quelle nur das Datum, die Einstimmigkeit, die Zusammenfuehrung von zehn Initiativen und das Ziel,
    das Landesrecht an den Bundesrahmen anzugleichen. Aus Presseberichten stammen die Strafrahmen: zehn
    bis fuenfzehn Jahre Freiheitsstrafe und zweitausend bis dreitausend UMA fuer gewaltsame Beitreibung,
    drei bis sieben Jahre und fuenfhundert bis tausend UMA fuer koerperlichen oder seelischen Zwang. Parallel
    liegt seit dem 26.02.2026 eine Initiative der Dip. Diana Sánchez Barrios vor, Art. 188 des Strafgesetzbuchs
    um einen Deepfake-Tatbestand zu Lasten Minderjaehriger zu ergaenzen (sieben bis zwoelf Jahre, tausend
    bis zweitausend Tagessaetze, sowie Einziehung und Vernichtung der Tatmittel).

    '
