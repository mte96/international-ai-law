  pruefvermerk:
  - 'Am DOF-Volltext geprueft. Das Inkrafttretensdatum war richtig. Der im Bestand gefuehrte Stichtag
    ''Februar 2026'' hat im Dekret KEINE Grundlage und ist ersatzlos gestrichen: Das Dekret kennt nur
    Fristen von 30 Arbeits-, 60, 90, 120 und 180 natuerlichen Tagen ab Inkrafttreten, die saemtlich 2025
    ablaufen. Die beiden neu aufgenommenen Anwendungsdaten geben die tatsaechlichen Umsetzungsfristen
    wieder. Vorher: Anwendungsdatum 2026-02-01 (''verbreitet genannter Stichtag fuer die behoerdliche
    Nutzung der biometrischen CURP'') ohne Quelle — entfernt..'
- id: mx-lgia-senado
  jurisdiktion: mx
  kurztitel: Ley General de IA — Senatsentwurf 2026
  offizieller_titel: Iniciativa con proyecto de decreto por el que se expide la Ley General para Regular
    y Fomentar la Inteligencia Artificial
  fundstelle: Senado de la República, LXVI Legislatura; erarbeitet in der Comisión de Análisis, Seguimiento
    y Evaluación sobre la Aplicación y Desarrollo de la Inteligencia Artificial en México
  verfahrensnummer: Vorsitz Sen. Rolando Zapata Bello (PRI); angekuendigte Vorlage fuer den 22.04.2026,
    verschoben; multipartidistische Fassung vom 23./30.04.2026; Fassung vom 07.05.2026
  status: entwurf
  status_detail: 'Der weitreichendste mexikanische KI-Gesetzentwurf. Er wurde am 30.04.2026 von der Senatskommission
    oeffentlich vorgestellt, aber nicht mehr im Plenum eingebracht, bevor die Sitzungsperiode endete.
    Die urspruenglich fuer den 22.04.2026 angekuendigte Vorlage war am Vorabend von der Tagesordnung genommen
    worden. Stand 05.09.2026 liegt kein verabschiedeter Text vor; die Kommission ist zugleich mitberatender
    Ausschuss der Deepfake-Minuta. Vorbehalt: Alle inhaltlichen Angaben stammen aus Sekundaerquellen,
    weil senado.gob.mx und comisiones.senado.gob.mx den automatisierten Abruf mit HTTP 403 verweigern.

    '
  kurzbeschreibung: 'Ein risikobasiertes Rahmengesetz nach europaeischem Vorbild, das nach uebereinstimmenden
    Berichten 223 Artikel in vierzehn Titeln umfasst, dazu zehn Uebergangsvorschriften und ein Begriffsglossar.
    Vorgesehen sind verbotene Anwendungen (kognitive, politische, wahlbezogene und soziale Manipulation
    zu rechtswidrigen oder demokratiefeindlichen Zwecken; nicht einvernehmliche sexuelle Deepfakes; Manipulation
    von Bild, Ton oder Video zur Demuetigung, Erpressung oder Belaestigung; anlasslose Massenueberwachung;
    Systeme zu Betrug und Identitaetsdiebstahl; Wahldesinformation), ein Register fuer Hochrisikosysteme,
    Reallabore und eine Autoridad Nacional de Inteligencia Artificial neben SECIHTI (Forschung) und ATDT
    (Betrieb). Sanktionen sind dreistufig — leve, grave, gravísima — und reichen von der Verwarnung ueber
    die Aussetzung des Systems bis zu Freiheitsstrafe in den schwersten Faellen. Bemerkenswert ist die
    Aufnahme von fuenf Neurorechten (personale Identitaet, mentale Privatheit, kognitive Integritaet,
    Autonomie, Schutz vor Manipulation).

    '
