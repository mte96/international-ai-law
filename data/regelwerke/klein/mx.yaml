  - haftung
  regelungsschwerpunkte:
  - Erweiterung des Art. 199 Octies CPF um die Tathandlungen 'generar, simular o editar' unter Verwendung
    von KI-Werkzeugen oder digitalen Bearbeitungsprogrammen; Anknuepfung an die Identifizierbarkeit der
    abgebildeten Person.
  - 'Strafrahmen: vier bis acht Jahre Freiheitsstrafe, vierhundert bis tausend UMA (Tageswert).'
  - Erstreckung auf Inhalte, die Minderjaehrige oder verstaendnisunfaehige Personen darstellen, 'aun cuando
    el contenido no corresponda a hechos reales' — die Loesung vom realen Opfer wird ausdruecklich in
    den Tatbestand geschrieben.
  - Anpassung des Art. 16 der Ley General para Prevenir, Sancionar y Erradicar los Delitos en Materia
    de Trata de Personas.
  - Verweisung im Senat auch an den KI-Ausschuss — das ist die erste Gesetzgebungsvorlage, bei der die
    Comisión de Análisis, Seguimiento y Evaluación sobre la Aplicación y Desarrollo de la Inteligencia
    Artificial en México foermlich mitberatend ist.
