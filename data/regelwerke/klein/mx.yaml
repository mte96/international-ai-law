- id: mx-lmtr
  jurisdiktion: mx
  kurztitel: LMTR — Telekommunikations- und Rundfunkgesetz 2025
  offizieller_titel: Ley en Materia de Telecomunicaciones y Radiodifusión
  fundstelle: Diario Oficial de la Federación, 16 de julio de 2025
  verfahrensnummer: Iniciativa del Ejecutivo Federal (April 2025); im Senat wegen der urspruenglichen
    Sperrbefugnis fuer digitale Plattformen zurueckgezogen und im Juni/Juli 2025 neu verhandelt
  status: anwendbar
  status_detail: 'In Kraft seit 17.07.2025. Hebt die Ley Federal de Telecomunicaciones y Radiodifusión
    von 2014 auf. Regulierungsbehoerde ist die Comisión Reguladora de Telecomunicaciones (CRT), die am
    19.10.2025 ihre Arbeit aufnahm; die Agencia de Transformación Digital y Telecomunicaciones (ATDT)
    fuehrt die Politik. Wichtigster Befund fuer dieses Projekt: Das Gesetz enthaelt NULL Fundstellen des
    Begriffs ''inteligencia artificial''. Die im Februar 2026 im Senat eingebrachte Initiative, KI-Pflichten
    in dieses Gesetz einzufuegen, liegt in den Ausschuessen.

    '
  kurzbeschreibung: 'Das neue Rahmengesetz fuer Telekommunikation und Rundfunk. Es setzt die Verfassungsreform
    vom Dezember 2024 um, indem es das IFT durch die CRT ersetzt und die politische Steuerung bei der
    ATDT buendelt. Es definiert in Art. 3 Fr. L den Begriff der ''plataforma digital'' als Internetdienst
    von Intermediaeren zum Anbieten oder Vermitteln von Guetern, Diensten, Anwendungen, Produkten oder
    Inhalten — eine Definition, unter die generative KI-Dienste fallen koennen, ohne dass daran materielle
    Pflichten geknuepft waeren. Sanktionen richten sich nach dem allgemeinen Sanktionsteil des Gesetzes
    gegen Konzessionaere und Diensteanbieter, nicht gegen Modellanbieter.

    '
  inkrafttreten:
    datum: 2025-07-17
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5763167&fecha=16/07/2025
  anwendungsdaten:
  - datum: 2025-07-17
    was_gilt: Inkrafttreten; Abrogation der LFTR 2014.
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5763167&fecha=16/07/2025
  - datum: 2025-10-19
    was_gilt: Aufnahme der Taetigkeit durch die Comisión Reguladora de Telecomunicaciones als neuer Regulierer.
    verifiziert: false
    quelle: https://www.jornada.com.mx/noticia/2025/10/19/economia/inicia-funciones-la-crt-nuevo-regulador-en-telecomunicaciones
  themenachsen:
  - governance
  - content
  - marktzugang
  - grundrechte
  regelungsschwerpunkte:
  - 'BEFUND: Volltextsuche im amtlichen DOF-Text ergibt null Treffer fuer ''inteligencia artificial''.
    Das Gesetz regelt KI nicht. Wer Mexiko als Beispiel fuer sektorale KI-Regulierung im Telekommunikationsrecht
    anfuehrt, irrt — die entsprechenden Vorschriften sind Entwurfsstadium.'
  - 'Art. 3 Fr. III: Legaldefinition ''Agencia'' = Agencia de Transformación Digital y Telecomunicaciones;
    Fr. XVI: ''Comisión'' = Comisión Reguladora de Telecomunicaciones. Die Trennung von politischer Steuerung
    (ATDT) und Regulierung (CRT) ersetzt das einheitliche autonome IFT.'
  - 'Art. 3 Fr. L: ''Plataforma digital: Servicio digital que prestan intermediarios a través de Internet
    a fin de, entre otros, ofrecer, proveer, comercializar o intermediar bienes, servicios, aplicaciones,
    productos o contenidos.'' Anknuepfungspunkt fuer kuenftige Plattform- und KI-Pflichten.'
  - 'Die im Entwurf enthaltene Befugnis zur voruebergehenden Sperrung digitaler Plattformen (urspruenglicher
    Art. 109) wurde nach oeffentlicher Kritik gestrichen. Der Vorgang ist fuer die Bewertung kuenftiger
    Content-Regulierung zu KI-Inhalten aufschlussreich: Eine Sperrbefugnis war politisch nicht durchsetzbar.'
  dokumente:
