  offizieller_titel: Ley Federal de Telecomunicaciones y Radiodifusión (14-07-2014)
  fundstelle: Diario Oficial de la Federación, 14 de julio de 2014
  verfahrensnummer: ''
  status: aufgehoben
  status_detail: 'Abrogiert am 17.07.2025 durch die LMTR. Sie war das Gesetz, das dem IFT seine Befugnisse
    gab. Mehrere KI-Gesetzentwuerfe der Jahre 2023 und 2024 wiesen dem IFT die kuenftige KI-Aufsicht zu;
    mit der Aufhebung ist diese Konstruktion entfallen.

    '
  kurzbeschreibung: 'Rahmengesetz der Telekommunikationsreform von 2013/2014. Fuer das KI-Recht nur mittelbar
    bedeutsam: Es begruendete das Instituto Federal de Telecomunicaciones als autonomes Fachorgan mit
    Wettbewerbsbefugnissen im Telekommunikations- und Rundfunksektor. Der Entwurf einer Ley Federal que
    Regula la Inteligencia Artificial von 2024 sah das IFT als ''autoridad competente'' vor. Mit der Aufhebung
    des Gesetzes und der Aufloesung des IFT wurde diese Zuweisung gegenstandslos.

    '
  inkrafttreten:
