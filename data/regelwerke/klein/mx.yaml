  - haftung
  regelungsschwerpunkte:
  - 'Art. 1: ''La presente Ley es de orden público y de observancia general en todo el territorio nacional
    y tiene por objeto la protección de los datos personales en posesión de los particulares'' — Geltung
    fuer alle privaten Verantwortlichen im Staatsgebiet; kein ausdruecklicher extraterritorialer Anwendungsbereich
    nach dem Marktortprinzip, anders als Art. 3 DSGVO. Fuer auslaendische Modellanbieter ist das die entscheidende
    Schwaeche des Gesetzes.'
  - 'Art. 2 Fr. XV: ''Secretaría: Secretaría Anticorrupción y Buen Gobierno''. Diese Legaldefinition ist
    die eigentliche Zaesur: Die Aufsicht ueber die Verarbeitung personenbezogener Daten durch Private
    liegt bei einem weisungsgebundenen Ressort der Bundesverwaltung.'
  - 'Art. 2 Fr. IV (consentimiento): ''Manifestación de la voluntad libre, específica e informada de la
    persona titular''; Fr. VI: sensible Daten sind solche, die rassische oder ethnische Herkunft, Gesundheitszustand,
    genetische Information, religioese, philosophische oder politische Ueberzeugungen oder die sexuelle
    Praeferenz offenbaren.'
  - 'Art. 5: Grundsatzkatalog licitud, finalidad, lealtad, consentimiento, calidad, proporcionalidad,
    información, responsabilidad. Ein Grundsatz der Datenminimierung fehlt als eigener Punkt; er wird
    ueber proporcionalidad und finalidad hergeleitet.'
  - 'Art. 7 und 8: Einwilligung ist grundsaetzlich auch stillschweigend moeglich; fuer Vermoegens- und
    Finanzdaten sowie fuer sensible Daten ist ausdrueckliche (bei sensiblen Daten schriftliche) Einwilligung
    erforderlich. Fuer das Training generativer Modelle auf Datenbestaenden mit sensiblen Daten ist das
    die schaerfste Schranke des Gesetzes.'
  - 'Art. 9: Ausnahmen vom Einwilligungserfordernis, darunter Daten aus ''fuentes de acceso público''
    und ''datos disociados''. Die Ausnahme fuer oeffentlich zugaengliche Quellen ist der Angelpunkt jeder
    Diskussion ueber Web Scraping zu Trainingszwecken; eine Interessenabwaegung wie Art. 6 Abs. 1 lit.
    f DSGVO kennt das Gesetz nicht.'
  - 'Art. 18 und 19: Pflicht zu administrativen, technischen und physischen Sicherheitsmassnahmen; Sicherheitsvorfaelle,
    die Rechte beeintraechtigen, sind ''de forma inmediata'' mitzuteilen.'
  - 'Art. 21 bis 26 (derechos ARCO): Zugang, Berichtigung, Loeschung, Widerspruch. Art. 26 Fr. II gibt
    das Widerspruchsrecht, wenn ''sus datos personales sean objeto de un tratamiento automatizado, el
    cual le produzca efectos jurídicos no deseados'' oder die Interessen, Rechte oder Freiheiten erheblich
    beeintraechtigt werden. Anders als Art. 22 DSGVO ist das kein grundsaetzliches Verbot mit Erlaubnisvorbehalt,
    sondern ein geltendzumachendes Widerspruchsrecht — die Beweis- und Initiativlast liegt bei der betroffenen
    Person.'
  - 'Art. 27 bis 34: Antwortfrist von zwanzig Tagen, Umsetzungsfrist von weiteren fuenfzehn Tagen; die
    Ausuebung ist unentgeltlich, mit Ausnahme der Kosten fuer Vervielfaeltigung und Versand.'
  - 'Art. 59: Bussgeldrahmen. Fr. I: 100 bis 160.000 UMA; Fr. II: 200 bis 320.000 UMA; bei Wiederholung
    zusaetzlich 100 bis 320.000 UMA; bei sensiblen Daten Verdoppelung.'
  - 'Art. 62 bis 64: Straftatbestaende. Unbefugtes Herbeifuehren einer Sicherheitsverletzung: drei Monate
    bis drei Jahre; taeuschungsbedingte Verarbeitung zur Gewinnerzielung: sechs Monate bis fuenf Jahre;
    bei sensiblen Daten Verdoppelung.'
  - 'Was FEHLT: Das Gesetz erwaehnt weder ''inteligencia artificial'' noch ''perfilamiento'' noch eine
    ''evaluación de impacto''. Es gibt keine Datenschutz-Folgenabschaetzung fuer den Privatsektor, keine
    Regelung des Profilings und keinen Auskunftsanspruch auf die Logik automatisierter Entscheidungen.
    Wer in Mexiko ein Hochrisiko-KI-System betreibt, trifft im Datenschutzrecht auf keine spezifische
    Pflicht.'
