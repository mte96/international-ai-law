  - datum: 2025-03-20
    typ: endfassung
    titel: DECRETO por el que se expiden la Ley General de Transparencia y Acceso a la Información Pública;
      la Ley General de Protección de Datos Personales en Posesión de Sujetos Obligados; la Ley Federal
      de Protección de Datos Personales en Posesión de los Particulares; y se reforma el artículo 37,
      fracción XV, de la Ley Orgánica de la Administración Pública Federal
    url: https://www.dof.gob.mx/nota_detalle.php?codigo=5752569&fecha=20/03/2025
    sprache: es
    urheber: Congreso General de los Estados Unidos Mexicanos
    verifiziert: true
    notiz: Das Ausfuehrungspaket. Der amtliche Titel belegt, dass alle drei Gesetze in einem einzigen
      Dekret erlassen wurden und zugleich Art. 37 Fr. XV LOAPF geaendert wurde — die Vorschrift, die der
      Secretaría Anticorrupción y Buen Gobierno die Datenschutzaufsicht zuweist.
  offene_punkte:
  - 'Unabhaengigkeit der Aufsicht: Ob eine dem Praesidialkabinett angehoerende Sekretariatsbehoerde die
    Anforderungen an eine Datenschutzaufsicht erfuellt, ist voelker- und europarechtlich ungeklaert und
    beruehrt Mexikos Stellung im Abkommen 108+ und im modernisierten EU-Mexiko-Globalabkommen.'
  - 'Die Landesebene: Die Landesgarantieorgane (organismos garantes locales) wurden parallel aufgeloest;
    der Uebergang ist in mehreren Bundesstaaten noch nicht abgeschlossen.'
