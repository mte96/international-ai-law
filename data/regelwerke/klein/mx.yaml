- id: mx-ine-lineamientos-nna-2026
  jurisdiktion: mx
  kurztitel: INE-Lineamientos Kinderschutz und Deepfake-Verbot (2026)
  offizieller_titel: Lineamientos y anexos para la protección de los derechos de niñas, niños y adolescentes
    en materia político-electoral
  fundstelle: Consejo General del Instituto Nacional Electoral, Sesión Extraordinaria vom 3 de septiembre
    de 2026
  verfahrensnummer: Acuerdo-Nummer nicht ermittelt
  status: verabschiedet
  status_detail: 'Am 03.09.2026 vom Consejo General des INE beschlossen — zwei Tage vor dem Stichtag dieser
    Erfassung. Die Lineamientos verbieten Deepfakes, die Minderjaehrige faelschlich darstellen, und knuepfen
    den Einsatz synthetischer Darstellungen an Einwilligung, Kennzeichnung und Nachvollziehbarkeit. Anwendungsbereich
    ist die politisch-wahlbezogene Propaganda; als Anlass wird die Consulta Infantil y Juvenil 2027 genannt.
    Der amtliche Acuerdo-Text war zum Stichtag nicht ermittelbar.

    '
  kurzbeschreibung: 'Die erste mexikanische Vorschrift, die synthetische Inhalte in der politischen Kommunikation
    ausdruecklich regelt. Verboten ist ''la simulación o creación de deepfakes que proyecten falsamente
    la presencia de menores''. Werden synthetische Darstellungen eingesetzt, sind technische Rueckverfolgbarkeit,
    Verfahrensdokumentation und ein sichtbares oder hoerbares digitales Transparenzkennzeichen vorgeschrieben,
    das das Publikum auf die technologische Manipulation hinweist; zusaetzlich sind die schriftliche Einwilligung
    der Sorgeberechtigten und die informierte Stellungnahme der Minderjaehrigen selbst erforderlich. Fehlt
    eine wirksame Einwilligung, sind Bild und Stimme unkenntlich zu machen. Sanktionen folgen dem wahlrechtlichen
    Sanktionsverfahren (procedimiento especial sancionador).

    '
  inkrafttreten:
    datum: 2026-09-03
    verifiziert: false
    quelle: https://centralelectoral.ine.mx/2026/09/03/aprueba-ine-nuevos-lineamientos-para-proteger-los-derechos-de-ninas-ninos-y-adolescentes-en-materia-politico-electoral/
  anwendungsdaten:
