  - Risikoklassen 'inaceptables, alto riesgo y bajo riesgo' — eine Dreiteilung, die die vierte Stufe der
    KI-VO (minimales Risiko) weglaesst.
  - Zuweisung der Aufsicht an das Instituto Federal de Telecomunicaciones.
  - Zivilrechtliche Haftung, Transparenzpflichten, Zertifizierungsmechanismen.
  - 'Lehre: Die Organisationsreform hat das Regulierungsvorhaben erledigt. Wer heute in Mexiko ein KI-Gesetz
    schreibt, muss zugleich eine Behoerde erfinden.'
