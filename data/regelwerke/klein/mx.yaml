  regelungsschwerpunkte:
  - Allgemeiner Strafschaerfungsgrund fuer den Einsatz kuenstlicher Intelligenz — anders als in Sinaloa
    nicht an ein bestimmtes Delikt gebunden. Funktional entspricht das Art. 61 Nr. 11-decies des italienischen
    Codice penale, den die legge 132/2025 eingefuehrt hat. Die mexikanische Mehrheit hielt eine solche
    Konstruktion fuer unvereinbar mit dem Bestimmtheitsgebot, konnte sich aber wegen des Mehrheitserfordernisses
    nicht durchsetzen.
  - 'Verfahrensrechtliche Besonderheit: Nach Art. 105 Fr. II letzter Absatz CPEUM bedarf die Ungueltigerklaerung
    einer Norm in der Acción de Inconstitucionalidad einer Mehrheit von mindestens acht Stimmen. Bleibt
    der Entwurf darunter, wird das Verfahren eingestellt und die Norm bleibt in Kraft — ohne dass die
    Mehrheitsauffassung Bindungswirkung erlangt.'
  dokumente:
  - datum: 2025-01-01
    typ: endfassung
    titel: Acción de Inconstitucionalidad 104/2024 — engrose (SCJN)
    url: https://www2.scjn.gob.mx/juridica/engroses/3/2024/19/3_334447_7140_firmado.pdf
    sprache: es
    urheber: Suprema Corte de Justicia de la Nación
    verifiziert: false
    notiz: 'AMTLICHE FUNDSTELLE NACHGEWIESEN, ABER NICHT LESBAR. Der Pfad stammt aus der Trefferliste
      einer Suche nach ''acción de inconstitucionalidad 104/2024 promovente''. Drei Abrufversuche gescheitert:
      WebFetch meldet ''Too many redirects'', curl wird vom Egress-Proxy abgewiesen, im Browser fehlt
      die Berechtigung fuer Screenshots auf www2.scjn.gob.mx und der PDF-Viewer ist fuer die Textextraktion
      nicht erreichbar. Dies ist gegenueber dem bisherigen Bestand (''amtliche Fundstelle nicht auffindbar'')
      ein Fortschritt: die Fundstelle existiert.'
  offene_punkte:
  - 'Artikelnummer, Wortlaut, Strafrahmen und Verkuendungsdatum der angegriffenen Vorschrift sind offen.
    Der Eintrag mx-2024-scjn-ai-104-2024 traegt zu Recht ''zweifelhaft: true''.'
  - Auch die Existenz eines Comunicado zu AI 104/2024 liess sich nicht bestaetigen.
  - 'Inkrafttreten nicht belegbar: Kein Inkrafttretensdatum belegbar: congresoqroo.gob.mx ist durch Cloudflare
    gesperrt, ein Zugang zum Periódico Oficial del Estado de Quintana Roo bestand nicht; der Transitorio
    des Dekrets liess sich daher nicht lesen. NEU BELEGT aus dem amtlichen Engrose der SCJN (www2.scjn.gob.mx/juridica/engroses/3/2024/19/3_334447_7140_firmado.pdf)
    ist dagegen die Identitaet der Vorschrift, die bislang vollstaendig offen war: Es handelt sich um
    den Artículo 20 Bis des Código Penal para el Estado Libre y Soberano de Quintana Roo, eingefuegt durch
    das Decreto número 211, veroeffentlicht am 10.04.2024 im Periódico Oficial del Estado de Quintana
    Roo. Angreiferin war die Consejería Jurídica des Bundes, Ponentin Ministra Loretta Ortiz Ahlf. Bestaetigt
    ist auch der Ausgang: Der Entwurf, die Vorschrift wegen Verstosses gegen das Bestimmtheitsgebot (Art.
    14 CPEUM, Art. 9 AMRK) fuer nichtig zu erklaeren, erreichte nur fuenf Stimmen; die Norm bleibt in
    Kraft. Status ''anwendbar'' ist damit bestaetigt.'
