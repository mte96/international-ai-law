  regelungsschwerpunkte:
  - 'Neufassung des Art. 6 Apartado A CPEUM: Statt eines autonomen Garantieorgans entscheiden ueber Rechtsbehelfe
    gegen Entscheidungen der verpflichteten Stellen kuenftig ''las autoridades de control interno y vigilancia
    u homólogos en el ámbito federal y local''. Der Wechsel von externer zu interner Kontrolle ist der
    dogmatische Kern der Reform.'
  - 'Transitorio Primero: Inkrafttreten am Tag nach der Verkuendung, mit Ausnahme des Transitorio Décimo.'
  - 'Transitorio Segundo: ''El Congreso de la Unión tendrá un plazo de noventa días naturales a partir
    de la entrada en vigor del presente Decreto para realizar las adecuaciones necesarias a las leyes
    que correspondan.'' Zusaetzlich Auftrag an den Ejecutivo Federal, die Aufloesungsdekrete zu erlassen
    und Doppelstrukturen zu beseitigen (Bezug auf Art. 134 Abs. 3 CPEUM).'
  - Aufgeloest werden INAI, IFT, COFECE, CRE, CNH, MEJOREDU und CONEVAL. Fuer das KI-Recht relevant sind
    vor allem INAI (Datenschutz), IFT (das in mehreren KI-Gesetzentwuerfen als kuenftige KI-Aufsichtsbehoerde
    vorgesehen war und nun nicht mehr existiert) und COFECE (Marktmacht bei Rechenkapazitaeten und Modellen).
  - 'Praktische Folge fuer die KI-Regulierung: Der 2024 in den Senat eingebrachte Entwurf eines Bundes-KI-Gesetzes
    (Ricardo Monreal) wies die Zustaendigkeit dem IFT zu. Mit dessen Aufloesung wurde der Entwurf gegenstandslos
    — ein selten klarer Fall, in dem eine Organisationsreform ein materielles Regulierungsvorhaben erledigt
    hat.'
