- id: mx-curp-biometrica
  jurisdiktion: mx
  kurztitel: CURP biométrica — biometrische Bevoelkerungskennung
  offizieller_titel: DECRETO por el que se reforman, adicionan y derogan diversas disposiciones de la
    Ley General en Materia de Desaparición Forzada de Personas, Desaparición Cometida por Particulares
    y del Sistema Nacional de Búsqueda de Personas, de la Ley General de Población y de otros ordenamientos
  fundstelle: Diario Oficial de la Federación, 16 de julio de 2025
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Teil des Gesetzespakets vom 16.07.2025. Die Clave Única de Registro de Población wird
    um biometrische Merkmale (Fingerabdruecke, Iris, Gesichtsbild) erweitert und zum einheitlichen Identitaetsnachweis
    ausgebaut. Der Zeitplan fuer die verpflichtende Ausstellung ist umstritten; verbreitet genannt wird
    Februar 2026 als Stichtag fuer Behoerden. Der Stichtag konnte nicht an einer amtlichen Quelle verifiziert
    werden.

    '
  kurzbeschreibung: 'Fuer das KI-Recht ist die biometrische CURP der Datenbestand, auf dem jede kuenftige
    staatliche Gesichtserkennung in Mexiko aufsetzen wird. Sie entsteht im Rahmen eines Gesetzes zur Suche
    nach verschwundenen Personen, wird aber ueber die Plataforma Única de Identidad allgemein nutzbar
    und ist mit der Plataforma Central de Inteligencia des LSNIIMSP verknuepfbar. Das Paket wurde am selben
    Tag verkuendet wie das Nachrichtendienstgesetz, dessen Art. 32 den KI-Einsatz auf biometrischen Registern
    ausdruecklich erlaubt. Beides zusammen ergibt die rechtliche Grundlage fuer eine landesweite biometrische
    Infrastruktur ohne unabhaengige Datenschutzaufsicht. Eigene Sanktionen enthaelt das Dekret nicht.

    '
  inkrafttreten:
    datum: 2025-07-17
    verifiziert: true
