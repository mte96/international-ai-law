  regelungsschwerpunkte:
  - 'Tatbestand (SCJN-Wiedergabe): ''... también será sancionado quien mediante uso de la Inteligencia
    Artificial, manipule imágenes, audios o videos, de contenido íntimo sexual de una persona, para crear
    hechos falsos con apariencia real, con el propósito de difundirlos a través de medios impresos o electrónicos,
    sin el respectivo consentimiento expreso.'''
  - 'Legaldefinition (SCJN-Wiedergabe): ''... el legislador local definió a la Inteligencia Artificial
    como las aplicaciones, programas o tecnología que analicen fotografías, audios o videos y ofrezcan
    ajustes automáticos para hacerles alteraciones o modificaciones.'' Eine funktionale, wirkungsbezogene
    Definition ohne technische Merkmale — kein Bezug auf Autonomie, Lernfaehigkeit oder Modellarchitektur,
    anders als Art. 3 Nr. 1 KI-VO.'
  - 'Strafrahmen: drei bis sechs Jahre Freiheitsstrafe, fuenfhundert bis tausend Tagessaetze.'
  - 'Verfassungsrechtliche Bewertung durch die SCJN: Es sei ''imposible, por las propias características
    del lenguaje, que el legislador defina de manera unívoca y exacta todas las palabras contenidas en
    un tipo penal''; zudem existiere ''no ... una definición única del concepto de Inteligencia Artificial''.
    Die Definition erlaube den Buergerinnen und Buergern, ''comprender el núcleo esencial del delito sin
    la necesidad de utilizar un lenguaje técnico y especializado''.'
  - 'Entstehungsgeschichte: Art. 185 Bis C wurde am 07.03.2023 im Rahmen der Sinaloa-Fassung der Ley Olimpia
    geschaffen (Erhoehung des Strafrahmens von einem bis drei auf drei bis sechs Jahre); die KI-Absaetze
    kamen erst 2024 hinzu.'
