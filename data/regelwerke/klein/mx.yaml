- id: mx-quintanaroo-cp-ia
  jurisdiktion: mx
  bundesstaat: Quintana Roo
  kurztitel: KI als allgemeiner Strafschaerfungsgrund (Quintana Roo)
  offizieller_titel: Código Penal para el Estado Libre y Soberano de Quintana Roo — Vorschrift ueber den
    Einsatz kuenstlicher Intelligenz als Strafschaerfungsgrund (Bezeichnung nicht verifiziert)
  fundstelle: Periódico Oficial del Estado de Quintana Roo (Datum nicht ermittelt)
  verfahrensnummer: Gegenstand der Acción de Inconstitucionalidad 104/2024
  status: anwendbar
  status_detail: 'NICHT VERIFIZIERT. Die Vorschrift blieb nach dem Eintrag in Kraft, weil der Entscheidungsentwurf,
    sie fuer nichtig zu erklaeren, die erforderliche qualifizierte Mehrheit von acht Stimmen verfehlte.
    Weder Artikelnummer noch Verkuendungsdatum noch der Wortlaut liessen sich an einer amtlichen Quelle
    ermitteln. Ein Engrose ist unter www2.scjn.gob.mx/juridica/engroses/3/2024/19/3_334447_7140_firmado.pdf
    nachgewiesen, war aber nicht lesbar (Redirect-Schleife bei WebFetch, Proxy-Sperre bei curl, keine
    Screenshot-Berechtigung fuer die Domain im Browser).

    '
  kurzbeschreibung: 'Nach der bisherigen Erfassung enthaelt das Strafgesetzbuch von Quintana Roo einen
    allgemeinen Strafschaerfungsgrund fuer den Einsatz kuenstlicher Intelligenz, also eine Qualifikation
    ohne Bezug zu einem bestimmten Schutzgut. Das ist die dogmatisch heikelste Konstruktion der drei mexikanischen
    Landesregelungen: Waehrend Sinaloa KI in einen konkreten Deliktstatbestand einbaut und Zacatecas sie
    als Schutzgrund verwendet, macht Quintana Roo den blossen Technikeinsatz zum Strafschaerfungsgrund.
    Die Mehrheit der SCJN-Richter hielt das fuer verfassungswidrig; die Norm ueberlebte nur, weil die
    Ungueltigerklaerung acht Stimmen erfordert. Strafrahmen und Wortlaut sind nicht belegt.

    '
