- id: mx-ley-olimpia
  jurisdiktion: mx
  kurztitel: Ley Olimpia — digitale Gewalt und Intimsphaere
  offizieller_titel: DECRETO por el que se reforman y adicionan diversas disposiciones de la Ley General
    de Acceso de las Mujeres a una Vida Libre de Violencia y del Código Penal Federal
  fundstelle: Diario Oficial de la Federación, 1 de junio de 2021 (Reforma 150 des CPF)
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Sammelbezeichnung fuer ein Buendel von Reformen, die zwischen 2018 und 2021 zunaechst
    in den Bundesstaaten und 2021 auf Bundesebene erlassen wurden. Auf Bundesebene fuegte sie den Begriff
    der ''violencia digital'' und ''violencia mediática'' in die LGAMVLV ein und schuf den Capítulo II
    ''Violación a la Intimidad Sexual'' im Código Penal Federal. Sie ist die dogmatische Grundlage aller
    mexikanischen Deepfake-Strafnormen; die Landesgesetzgeber haben ihre KI-Tatbestaende durchweg an sie
    angehaengt.

    '
  kurzbeschreibung: 'Die Ley Olimpia definiert digitale Gewalt als jede Handlung, die ueber Informations-
    und Kommunikationstechnologien intime Inhalte verbreitet oder Personen dadurch in ihrer Wuerde verletzt,
    und stellt sie unter Strafe. Ihre Bedeutung fuer das KI-Recht liegt in einer gesetzestechnischen Entscheidung:
    Art. 199 Nonies CPF loest die Strafbarkeit von der Echtheit der Abbildung. Damit hatte Mexiko bereits
    2021 einen Tatbestand, der sexualisierte Deepfakes erfasst, ohne den Begriff der kuenstlichen Intelligenz
    zu verwenden. Die Landesgesetzgeber haben ab 2023 begonnen, diesen Tatbestand um ausdrueckliche KI-Merkmale
    zu ergaenzen — genau diese Ergaenzungen waren Gegenstand der SCJN-Verfahren AI 66/2024 und 104/2024.
    Sanktionen: drei bis sechs Jahre Freiheitsstrafe und fuenfhundert bis tausend UMA, mit Schaerfungen
    nach Art. 199 Decies CPF.

    '
  inkrafttreten:
    datum: 2021-06-02
    verifiziert: true
    quelle: https://www.diputados.gob.mx/LeyesBiblio/ref/cpf/CPF_ref150_01jun21.pdf
  anwendungsdaten:
  - datum: 2021-06-02
    was_gilt: Anwendbarkeit der Straftatbestaende Art. 199 Octies bis Decies CPF und der neuen Gewaltformen
      der LGAMVLV.
    verifiziert: true
    quelle: https://www.diputados.gob.mx/LeyesBiblio/ref/cpf/CPF_ref150_01jun21.pdf
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - Einfuehrung der Begriffe 'violencia digital' und 'violencia mediática' in die Ley General de Acceso
    de las Mujeres a una Vida Libre de Violencia.
  - Einfuegung des Capítulo II 'Violación a la Intimidad Sexual' (Art. 199 Octies bis 199 Decies) in den
    Código Penal Federal.
  - 'Art. 199 Nonies als Anknuepfungspunkt fuer synthetische Inhalte: gleiche Strafe, wenn die Aufnahmen
    ''no correspondan con la persona que es señalada o identificada en los mismos''.'
  - Die Bundesstaaten haben eigene Fassungen erlassen; Sinaloa etwa am 07.03.2023 (Schaffung des Art.
    185 Bis C CP Sinaloa mit Straferhoehung von einem bis drei auf drei bis sechs Jahre), bevor am 12.02.2024
    die KI-Absaetze hinzukamen.
