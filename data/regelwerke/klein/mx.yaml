regelwerke:
- id: mx-cpeum
  jurisdiktion: mx
  kurztitel: Verfassung Mexikos (CPEUM)
  offizieller_titel: Constitución Política de los Estados Unidos Mexicanos
  fundstelle: DOF 05-02-1917; última reforma DOF 2026 (fortlaufend konsolidierte Fassung der Cámara de
    Diputados)
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Die Verfassung enthaelt keine KI-spezifische Vorschrift. Sie ist gleichwohl das tragende
    Regelwerk der gesamten bislang ergangenen mexikanischen KI-Rechtsprechung: Art. 14 (taxatividad, Bestimmtheitsgrundsatz
    im Strafrecht), Art. 16 (Begruendungs- und Rechtssicherheitsmassstab, seit 2009 ausdrueckliches Recht
    auf Datenschutz), Art. 17 (effektiver Rechtsschutz), Art. 6 Apartado A (Transparenz und Datenschutz,
    2024 neu gefasst) und Art. 28 (Schutzrechte des geistigen Eigentums). Eine Zustaendigkeit des Bundeskongresses
    fuer KI besteht nach Art. 73 bislang NICHT — genau darum laufen zwei Verfassungsaenderungsvorhaben.

    '
  kurzbeschreibung: 'Bundesverfassung. Fuer das KI-Recht wirkt sie auf drei Wegen: erstens als Massstab
    der abstrakten Normenkontrolle (acción de inconstitucionalidad), in der die SCJN 2025 dreimal ueber
    landesrechtliche KI-Straftatbestaende entschieden hat; zweitens als Grundlage des richterlichen Begruendungs-
    und Transparenzmassstabs, auf den die Jurisprudencia zum KI-Einsatz in der Justiz gestuetzt ist; drittens
    als Kompetenzordnung: Weil Art. 73 keine KI-Kompetenz des Bundes kennt, regeln bislang die Bundesstaaten,
    und der Bund kann ein allgemeines KI-Gesetz nur ueber eine Verfassungsaenderung oder ueber vorhandene
    Annexkompetenzen stuetzen. Sanktionen enthaelt die Verfassung selbst nicht; Rechtsfolge einer Verletzung
    ist die Ungueltigerklaerung der Norm oder der Amparo.

    '
  inkrafttreten:
    datum: 1917-05-01
    verifiziert: true
    quelle: https://www.ordenjuridico.gob.mx/Documentos/Federal/CPEUM_REFORMA_15-04-2025.doc
    fundstelle_norm: 'Artículo Primero Transitorio CPEUM: ''... con excepción de las disposiciones relativas
      a las elecciones de los Supremos Poderes Federales y de los Estados, que desde luego entran en vigor,
      no comenzará a regir sino desde el día 1o. de Mayo de 1917'' (DOF 05-02-1917)'
  anwendungsdaten:
  - datum: 1917-02-05
    was_gilt: Sofortiges Inkrafttreten der Vorschriften ueber die Wahlen zu den Supremos Poderes Federales
      und der Bundesstaaten (Ausnahme des Artículo Primero Transitorio) mit der Verkuendung im DOF.
    verifiziert: true
    quelle: https://www.ordenjuridico.gob.mx/Documentos/Federal/CPEUM_REFORMA_15-04-2025.doc
  - datum: 2024-12-21
    was_gilt: Inkrafttreten der Verfassungsreform in materia de simplificación orgánica; Art. 6 Apartado
      A wird neu gefasst, das INAI als autonomes Verfassungsorgan entfaellt.
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5745905&fecha=20/12/2024
  themenachsen:
  - grundrechte
  - datenschutz
  - governance
  - sektor-oeffentlich
  - content
  regelungsschwerpunkte:
  - 'Art. 6 Apartado A (Fassung 2024): Transparenz und Schutz personenbezogener Daten werden aus der Hand
    eines autonomen Organs in die Verwaltung zurueckgeholt. Wortlaut: ''Las leyes en la materia determinarán
    las bases, principios generales y procedimientos del ejercicio de estos derechos, así como la competencia
    de las autoridades de control interno y vigilancia u homólogos en el ámbito federal y local para conocer
    de los procedimientos de revisión contra los actos que emitan los sujetos obligados.'' Damit ersetzt
    eine verwaltungsinterne Kontrolle die unabhaengige Aufsicht.'
  - 'Art. 14 (taxatividad): Massstab der SCJN-Entscheidungen AI 66/2024, 80/2024 und 104/2024. Die SCJN
    hat 2025 entschieden, dass eine funktionale, nicht technische Definition von ''inteligencia artificial''
    dem Bestimmtheitsgebot genuegt, weil es ''por las propias características del lenguaje'' unmoeglich
    sei, jeden Begriff eines Straftatbestands eindeutig zu definieren, und weil ''no existe una definición
    única del concepto de Inteligencia Artificial''.'
  - 'Art. 16: Rechtssicherheit und Begruendungspflicht. Tragender Massstab der Tesis II.2o.C. J/1 K (12a.)
    zur Zulaessigkeit des KI-Einsatzes bei der Berechnung von Sicherheitsleistungen im Amparo-Verfahren;
    Abs. 2 enthaelt seit 2009 das Recht auf Schutz personenbezogener Daten, Zugang, Berichtigung und Loeschung
    (derechos ARCO).'
  - 'Art. 17: Recht auf wirksamen und zuegigen Rechtsschutz — von den Kollegialgerichten als Argument
    FUER den KI-Einsatz zur Verfahrensbeschleunigung herangezogen.'
  - 'Art. 28: Zeitlich begrenzte Ausschliesslichkeitsrechte fuer Urheber und Erfinder — verfassungsrechtliche
    Grundlage des Amparo Directo 6/2025 zur Schutzfaehigkeit von KI-Output.'
  - 'Art. 73: Katalog der Bundeskompetenzen. Enthaelt KEINE KI-Kompetenz. Zwei Vorhaben (Sen. Saúl Monreal
    Ávila, 03.02.2026; Dip. Gabriela Jiménez Godoy, 05.08.2026) wollen eine neue Fraktion einfuegen, die
    dem Kongress die Gesetzgebung ueber KI zuweist. Ohne sie ist ein ''ley general'' verfassungsrechtlich
    angreifbar — das ist der eigentliche Grund, warum Mexiko 2026 immer noch kein KI-Gesetz hat.'
