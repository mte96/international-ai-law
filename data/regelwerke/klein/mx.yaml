- id: mx-iniciativa-etica-ia-robotica
  jurisdiktion: mx
  kurztitel: Ley de Regulación Ética de la IA y la Robótica (Entwurf)
  offizieller_titel: Iniciativa con proyecto de decreto por el que se expide la Ley de Regulación Ética
    de la Inteligencia Artificial y la Robótica
  fundstelle: Cámara de Diputados und Senado de la República; wiederholt eingebracht seit 2023
  verfahrensnummer: Zuletzt aus der Comisión de Ciencia y Tecnología des Senats (April 2026)
  status: verfahren
  status_detail: 'Ein aelterer, ethikbasierter Regelungsansatz, der neben dem risikobasierten Senatsentwurf
    fortbesteht. Kernstueck ist die Errichtung eines Consejo Mexicano de Ética para la Inteligencia Artificial
    y la Robótica als dezentralisierte oeffentliche Einrichtung sowie einer Red Nacional de Estadística
    de Uso y Monitoreo de la Inteligencia Artificial y la Robótica mit dem INEGI als datenerzeugender
    Stelle. In den Ausschuessen.

    '
  kurzbeschreibung: 'Der Entwurf verfolgt einen Governance- statt Produktansatz: Statt Marktzugangspflichten
    schafft er ein Ethikgremium und eine statistische Beobachtungsinfrastruktur. Er ist damit das lateinamerikanische
    Gegenmodell zur europaeischen Konformitaetsbewertung und aehnelt eher dem japanischen Softlaw-Weg.
    Sanktionen sind nicht der Schwerpunkt; die Steuerung erfolgt ueber Empfehlungen, Berichtspflichten
    und Monitoring.

    '
  inkrafttreten: null
