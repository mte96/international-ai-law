- id: mx-cpf
  jurisdiktion: mx
  kurztitel: CPF — Código Penal Federal
  offizieller_titel: Código Penal Federal
  fundstelle: Diario Oficial de la Federación, 14 de agosto de 1931; última reforma DOF 13-03-2026
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Das Bundesstrafgesetzbuch enthaelt bislang KEINEN Tatbestand, der kuenstliche Intelligenz
    ausdruecklich benennt. Der Schutz vor sexualisierten Deepfakes laeuft ueber Art. 199 Nonies, der die
    Verbreitung intimer Aufnahmen auch dann erfasst, wenn sie die als dargestellt bezeichnete Person nicht
    wirklich zeigen — eine Vorschrift von 2021, die synthetische Inhalte tatbestandlich miterfasst, ohne
    sie zu nennen. Eine Minuta, die Art. 199 Octies und 199 Nonies ausdruecklich um KI-Erzeugung erweitert,
    liegt seit dem 02.09.2026 im Senat.

    '
  kurzbeschreibung: 'Bundesstrafgesetzbuch. Fuer das KI-Recht sind drei Bereiche von Bedeutung. Erstens
    der 2021 durch die Ley Olimpia eingefuegte Capítulo II ''Violación a la Intimidad Sexual'' (Art. 199
    Octies bis 199 Decies) mit Freiheitsstrafe von drei bis sechs Jahren und Geldstrafe von fuenfhundert
    bis tausend UMA; Art. 199 Nonies erstreckt dieselben Strafen auf Inhalte, die der bezeichneten Person
    nicht entsprechen — der praktisch anwendbare Deepfake-Tatbestand des geltenden Rechts. Zweitens Art.
    202 (Kinderpornografie, sieben bis zwoelf Jahre und achthundert bis zweitausend Tagessaetze), dessen
    Erstreckung auf vollstaendig synthetische Darstellungen in einer Initiative vom 18.02.2026 vorgeschlagen
    wird. Drittens die urheberstrafrechtlichen Tatbestaende der Art. 424 ff. Die Zustaendigkeit des Bundes
    ist begrenzt: Die meisten Sexualdelikte werden auf Landesebene verfolgt, weshalb die praktisch wirksamen
    Deepfake-Tatbestaende bislang in den Landesstrafgesetzbuechern stehen.

    '
  inkrafttreten:
    datum: 1931-09-17
    verifiziert: true
    quelle: https://www.ordenjuridico.gob.mx/Documentos/Federal/wo83048.doc
    fundstelle_norm: ARTICULOS TRANSITORIOS 1.- 'Este Código comenzará a regir el día 17 de septiembre
      de 1931' (Neuer Kodex, DOF vom 14.08.1931)
  anwendungsdaten:
  - datum: 2021-06-02
    was_gilt: Anwendbarkeit des Capítulo II 'Violación a la Intimidad Sexual' (Art. 199 Octies bis 199
      Decies), eingefuegt durch die Ley Olimpia.
    verifiziert: true
    quelle: https://www.diputados.gob.mx/LeyesBiblio/ref/cpf/CPF_ref150_01jun21.pdf
  themenachsen:
  - content
  - grundrechte
  - haftung
  - urheberrecht
  regelungsschwerpunkte:
  - 'Art. 199 Octies (woertlich, Fassung 2021): ''Comete el delito de violación a la intimidad sexual,
    aquella persona que divulgue, comparta, distribuya o publique imágenes, videos o audios de contenido
    íntimo sexual de una persona que tenga la mayoría de edad, sin su consentimiento, su aprobación o
    su autorización.'' Erfasst auch das Aufnehmen, Aufzeichnen, Fotografieren, Drucken oder Herstellen
    solcher Inhalte ohne Einwilligung. Strafe: ''tres a seis años de prisión y una multa de quinientas
    a mil Unidades de Medida y Actualización.'''
  - 'Art. 199 Nonies (woertlich): ''Se impondrán las mismas sanciones previstas en el artículo anterior
    cuando las imágenes, videos o audios de contenido íntimo sexual que se divulguen, compartan, distribuyan
    o publiquen no correspondan con la persona que es señalada o identificada en los mismos.'' Diese Vorschrift
    ist der Schluessel: Sie loest den Tatbestand von der Echtheit der Abbildung und erfasst deshalb den
    sexualisierten Deepfake, obwohl sie drei Jahre vor dem Durchbruch generativer Bildmodelle geschrieben
    wurde.'
  - 'Art. 199 Decies: Strafschaerfung bis zur Haelfte in sechs Fallgruppen — vorangegangene Vertrauens-
    oder Liebesbeziehung, Amtstraeger in Ausuebung des Dienstes, Unfaehigkeit des Opfers zum Verstaendnis,
    unentgeltliche Weitergabe, Gewinnerzielungsabsicht, sowie wenn das Opfer sich daraufhin selbst verletzt
    oder toetet.'
  - 'Art. 202: Kinderpornografie; sieben bis zwoelf Jahre Freiheitsstrafe und achthundert bis zweitausend
    Tagessaetze. Eine Initiative des Dip. Juan Luis Carrillo Soberanis (PVEM) vom 18.02.2026 will Erzeugung,
    Veraenderung und Simulation solcher Inhalte ''mediante inteligencia artificial, técnicas digitales
    para la manipulación'' ausdruecklich einbeziehen.'
  - KEIN allgemeiner KI-Erschwerungsgrund im Bundesrecht. Anders als Italien (Art. 61 Nr. 11-decies c.p.)
    kennt Mexiko auf Bundesebene keine allgemeine KI-Qualifikation. Der Bundesstaat Quintana Roo hat einen
    solchen eingefuehrt; der Entwurf der SCJN, ihn fuer nichtig zu erklaeren, verfehlte 2025 die qualifizierte
    Mehrheit.
