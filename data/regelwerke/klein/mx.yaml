    No. 699, veroeffentlicht im P.O. No. 019 vom 12.02.2024, eingefuegt (bislang im Bestand ohne Dekretnummer
    gefuehrt). Status ''anwendbar'' bleibt richtig — die Vorschrift wurde vom Pleno der SCJN in der Acción
    de Inconstitucionalidad 66/2024 fuer verfassungsgemaess erklaert.'
- id: mx-zacatecas-ldnna-art-9
  jurisdiktion: mx
  bundesstaat: Zacatecas
  kurztitel: Art. 9 Fr. III lit. c) LDNNA Zacatecas — KI-Gewalt gegen Kinder
  offizieller_titel: Ley de los Derechos de Niñas, Niños y Adolescentes del Estado de Zacatecas, artículo
    9, fracción III, inciso c), porción normativa 'uso de inteligencia artificial' (adicionado por Decreto
    número 448)
  fundstelle: Periódico Oficial del Estado de Zacatecas, Decreto número 448, publicado el 28 de febrero
    de 2024
  verfahrensnummer: Decreto número 448 (LXIV Legislatura del Estado de Zacatecas)
  status: anwendbar
  status_detail: 'In Kraft; vom Pleno der SCJN am 22.04.2025 in der Acción de Inconstitucionalidad 80/2024
    fuer verfassungsgemaess erklaert. Die Entscheidung ergaenzt die Linie aus Sinaloa um den Fall einer
    blossen Bezugnahme auf KI ohne jede Definition — und billigt auch diese, weil es um den Schutz besonders
    verletzlicher Personen geht.

    '
  kurzbeschreibung: 'Die Vorschrift erweitert den Schutz von Kindern und Jugendlichen vor Cybergewalt
    auf Gewalt, die ''mediante el uso de inteligencia artificial'' erzeugt wird, ohne den Begriff naeher
    zu bestimmen. Der Poder Ejecutivo Federal griff die Wortfolge ueber die Consejería Jurídica an, weil
    sie den Schutz auf KI-verursachte Gewalt ausdehne ''sin mayor especificación de lo que debe entenderse
    al respecto'', und ruegte einen Verstoss gegen Gesetzmaessigkeit und Rechtssicherheit. Das Pleno wies
    das zurueck: Angesichts der schnellen Entwicklung der KI sei ein Regelungsrahmen erforderlich, der
    das Kindeswohl in den Vordergrund stelle und weit genug gefasst sei. Eine eigene Sanktion enthaelt
    die Vorschrift nicht; sie ist Schutznorm des Kinder- und Jugendrechts, nicht Straftatbestand.

    '
