- id: mx-lsniimsp
  jurisdiktion: mx
  kurztitel: LSNIIMSP — Nachrichtendienstgesetz mit KI-Klausel
  offizieller_titel: Ley del Sistema Nacional de Investigación e Inteligencia en Materia de Seguridad
    Pública
  fundstelle: Diario Oficial de la Federación, 16 de julio de 2025
  verfahrensnummer: Iniciativa del Ejecutivo Federal; im Senat am 02.07.2025 angenommen; oeffentlich als
    'Ley Espía' kritisiert
  status: anwendbar
  status_detail: 'In Kraft seit 17.07.2025. Art. 32 gestattet der Sicherheitsverwaltung ausdruecklich
    den Einsatz von ''programas de automatización y herramientas de inteligencia artificial'' zur Erzeugung
    von Nachrichtenprodukten. Das ist die einzige Vorschrift des geltenden mexikanischen Bundesrechts,
    die den KI-Einsatz durch den Staat ausdruecklich erlaubt — und sie tut es ohne Risikoklassifizierung,
    ohne Folgenabschaetzung und ohne unabhaengige Aufsicht.

    '
  kurzbeschreibung: 'Das Gesetz errichtet ein nationales Ermittlungs- und Nachrichtensystem unter Fuehrung
    des Centro Nacional de Inteligencia (CNI) und schafft mit der Plataforma Central de Inteligencia (Art.
    36) eine Echtzeit-Verbundplattform, die Daten aller oeffentlichen und zahlreicher privater Stellen
    zusammenfuehrt, einschliesslich biometrischer Register (Art. 12 Fr. III, Art. 24, Art. 39 Apartado
    A Ziff. II). Art. 32 erlaubt fuer Verarbeitung und Auswertung ausdruecklich Automatisierungsprogramme
    und KI-Werkzeuge. Die Datenschutzbindung erfolgt nur durch Verweis auf die LGTAIP, die LGPDPPSO und
    die LFPDPPP — also auf Gesetze, deren Aufsicht seit 2025 bei einem Ressort der Bundesverwaltung liegt.
    Sanktionen gegen die einsetzenden Stellen enthaelt das Gesetz nicht; Rechtsschutz laeuft ueber den
    Amparo.

    '
  inkrafttreten:
    datum: 2025-07-17
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5763160&fecha=16/07/2025
  anwendungsdaten:
  - datum: 2025-07-17
    was_gilt: Inkrafttreten; Art. 32 (KI-Einsatz) und Art. 36 (Plataforma Central de Inteligencia) anwendbar.
    verifiziert: true
    quelle: https://www.dof.gob.mx/nota_detalle.php?codigo=5763160&fecha=16/07/2025
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  - sicherheit-export
  - governance
  regelungsschwerpunkte:
  - 'Art. 32 (woertlich): ''Para el procesamiento y análisis de la información, se utilizarán sistemas
    y programas que reciban, transcriban, conviertan, organicen, clasifiquen e interrelacionen información
    y datos de todo tipo, incluidos programas de automatización y herramientas de inteligencia artificial,
    a fin de generar las estrategias, acciones y los productos de inteligencia en seguridad pública.''
    Die Vorschrift enthaelt keinerlei Bindung an Verhaeltnismaessigkeit, menschliche Aufsicht, Protokollierung
    oder Erklaerbarkeit.'
  - 'Art. 12 Fr. III und Art. 24: Biometrische Register gehoeren zu den Informationen, die dem System
    zu liefern sind bzw. als Quelle zur Verfuegung stehen.'
  - 'Art. 36: Plataforma Central de Inteligencia als ''herramienta tecnológica de interconexión del Sistema
    Nacional, operada por el CNI en una unidad central'' zum Identifizieren, Integrieren, Erzeugen, Systematisieren,
    Analysieren und Verwerten von Informationen in Echtzeit.'
  - 'Art. 39 Apartado A Ziff. II: Zu verknuepfende Systeme umfassen ausdruecklich ''datos biométricos''.'
  - 'Datenschutzverweis: Die erhobenen Daten sind ''con apego a lo dispuesto en la Ley General de Transparencia
    y Acceso a la Información Pública, en la Ley General de Protección de Datos Personales en Posesión
    de Sujetos Obligados y en la Ley Federal de Protección de Datos Personales en Posesión de los Particulares''
    zu behandeln. Damit gilt fuer die staatliche KI-gestuetzte Massenauswertung dieselbe Aufsichtsarchitektur
    wie fuer jede Behoerde — die weisungsgebundene Secretaría Anticorrupción y Buen Gobierno.'
  - 'Rechtsvergleichender Befund: Waehrend Art. 5 KI-VO die biometrische Fernidentifizierung in Echtzeit
    zu Strafverfolgungszwecken grundsaetzlich verbietet und Anhang III sie als Hochrisiko einstuft, erlaubt
    Mexiko sie im selben Zeitraum ausdruecklich und ohne Verfahrensgarantien.'
