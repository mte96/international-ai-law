- id: za-ecta-2002
  jurisdiktion: za
  kurztitel: ECTA — Electronic Communications and Transactions Act
  offizieller_titel: Electronic Communications and Transactions Act, 2002 (Act No. 25 of 2002)
  fundstelle: Act No. 25 of 2002; Government Gazette Vol. 446, No. 23708; assented 31.07.2002
  verfahrensnummer: B8-2002
  status: anwendbar
  status_detail: 'In Kraft seit dem 30.08.2002. s. 20 ist die älteste KI-relevante Norm Südafrikas: Sie
    regelt seit 2002, wann ein Vertrag zustande kommt, an dem auf einer oder auf beiden Seiten ein ''electronic
    agent'' beteiligt ist. Die Definition des elektronischen Agenten (''a computer program or an electronic
    or other automated means used independently to initiate an action or respond to data messages'') ist
    technikoffen und erfasst nach ihrem Wortlaut auch autonome Systeme des Jahres 2026. Die Vorschrift
    ist seit 24 Jahren unverändert und wurde, soweit ersichtlich, nie gerichtlich auf ein generatives
    System angewandt.

    '
  kurzbeschreibung: 'Rahmengesetz des elektronischen Rechtsverkehrs. Es regelt die Gleichstellung von
    Datennachricht und Schriftform, die elektronische Signatur, den Verbraucherschutz im Fernabsatz, die
    Haftungsprivilegierung von Diensteanbietern (Kapitel XI), die Domainverwaltung und die Cyberinspektoren.
    Für das KI-Recht ist s. 20 der Kern: Ein Vertrag kommt auch zustande, wenn ein elektronischer Agent
    die zur Vertragsbildung erforderliche Handlung vornimmt; wer einen solchen Agenten einsetzt, ist an
    dessen Erklärungen gebunden, gleichgültig ob er sie geprüft hat. Wer mit dem Agenten eines anderen
    interagiert, ist nur gebunden, wenn die Bedingungen von einer natürlichen Person zur Kenntnis genommen
    werden konnten. Und ein Vertrag kommt nicht zustande, wenn eine natürliche Person einen wesentlichen
    Eingabefehler macht, der Agent keine Korrekturmöglichkeit bot, die Person den Fehler unverzüglich
    anzeigt, das Erlangte zurückgewährt und keinen wesentlichen Vorteil gezogen hat. Damit hat Südafrika
    2002 eine Zurechnungsregel für Maschinenerklärungen geschaffen, die Europa erst mit der Diskussion
    um autonome Agenten entdeckt.

    '
  inkrafttreten:
    datum: 2002-08-30
    verifiziert: true
    quelle: https://www.sagc.org.za/pdf/legislation/Electronic%20Communications%20and%20Transactions%20Act%2025%20of%202002.pdf
    fundstelle_norm: 'Amtlicher Gesetzeskopf: ''[ASSENTED TO 31 JULY 2002] [DATE OF COMMENCEMENT: 30 AUGUST
      2002]''; s. 95 ECTA (Short title and commencement)'
  anwendungsdaten:
  - datum: 2025-11-13
    was_gilt: 'Die Competition Commission empfiehlt im MDPMI-Abschlussbericht dem DCDT, unter dem ECTA
      Vorschriften zur Inhaltemoderation zu erlassen — die erste ernsthafte Reaktivierung des Gesetzes
      im Plattformkontext.

      '
    verifiziert: false
    quelle: https://legalacademy.co.za/news/read/media-digital-platforms-market-inquiry-final-report-released
  themenachsen:
  - vertrag
  - haftung
  - content
  - marktzugang
  regelungsschwerpunkte:
  - 's. 1, Definition ''automated transaction'': ''an electronic transaction conducted or performed, in
    whole or in part, by means of data messages in which the conduct or data messages of one or both parties
    are not reviewed by a natural person in the ordinary course of such natural person''s business or
    employment''.'
  - 's. 1, Definition ''electronic agent'': ''a computer program or an electronic or other automated means
    used independently to initiate an action or respond to data messages or performances in whole or in
    part, in an automated transaction''. Technikoffen; deckt nach dem Wortlaut auch LLM-gestützte Agenten.'
  - 's. 20(a): Ein Vertrag kann zustande kommen, wenn ein elektronischer Agent die zur Vertragsbildung
    erforderliche Handlung vornimmt.'
  - 's. 20(b): Ein Vertrag kann zustande kommen, wenn beide Parteien oder eine von ihnen einen elektronischen
    Agenten einsetzen.'
  - 's. 20(c): Wer einen elektronischen Agenten einsetzt, ist an dessen Bedingungen gebunden, ''irrespective
    of whether that person reviewed the actions of the electronic agent or the terms of the agreement''.
    Das ist die südafrikanische Antwort auf die Zurechnungsfrage bei autonomen Agenten — Risikozurechnung
    an den Verwender, ohne Verschulden.'
  - 's. 20(d): Wer mit dem Agenten eines anderen interagiert, ist nicht gebunden, wenn die Bedingungen
    nicht von einer natürlichen Person zur Kenntnis genommen werden konnten.'
  - 's. 20(e): Kein Vertragsschluss bei wesentlichem Eingabefehler einer natürlichen Person, wenn der
    Agent keine Korrekturmöglichkeit bot, der Fehler unverzüglich angezeigt, das Erlangte zurückgewährt
    und kein wesentlicher Vorteil gezogen wurde.'
  - 'Kapitel XI (ss. 70-79): Haftungsprivilegierung der Diensteanbieter (blosse Durchleitung, Caching,
    Hosting, Informationssuchwerkzeuge) — die südafrikanische Fassung des Notice-and-Takedown, an die
    die Empfehlungen der Competition Commission zur Inhaltemoderation anknüpfen.'
  - 'OFFENE FRAGE: s. 20(c) bindet den Verwender an die Erklärungen seines Agenten. Ob dies auch gilt,
    wenn ein generativer Agent eine Erklärung abgibt, die der Verwender weder vorgesehen noch vorhersehen
    konnte, hat kein südafrikanisches Gericht entschieden. Der Wortlaut spricht dafür.'
