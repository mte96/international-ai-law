- id: za-information-regulator-praxis
  jurisdiktion: za
  kurztitel: Aufsichtspraxis der Information Regulator zu KI
  offizieller_titel: Regulatory practice of the Information Regulator (South Africa) under the Protection
    of Personal Information Act 4 of 2013 and the Promotion of Access to Information Act 2 of 2000, in
    relation to artificial intelligence
  fundstelle: Guidance Notes, Enforcement Notices und Medienmitteilungen der Behörde; keine förmliche
    Rechtsquelle
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'NEGATIVBEFUND. Die Information Regulator hat bis zum 06.09.2026 keine Guidance Note
    zu künstlicher Intelligenz oder zu s. 71 POPIA erlassen, keinen KI-bezogenen Enforcement Notice ausgesprochen
    und keine KI-bezogene Medienmitteilung veröffentlicht. Die Volltextsuche auf inforegulator.org.za
    nach ''artificial intelligence'' liefert null Treffer. Dieser Eintrag hält den Befund fest, damit
    er nicht mit einer Lücke in der Recherche verwechselt wird.

    '
  kurzbeschreibung: 'Die Information Regulator ist die südafrikanische Datenschutz- und Informationsfreiheitsbehörde.
    Sie ist nach ss. 39 ff. POPIA errichtet, seit 2021 voll operativ und zugleich für den Promotion of
    Access to Information Act zuständig. Sie erlässt Guidance Notes, führt Untersuchungen, spricht Enforcement
    Notices nach s. 95 POPIA und s. 77J PAIA aus und kann Verwaltungsgeldbussen bis 10 Mio. ZAR verhängen.
    Ihre bisherigen sechs Guidance Notes betreffen Direktmarketing, Wahlen, besondere Daten, Kinderdaten,
    COVID-19 und Wählerdaten politischer Parteien. Zu automatisierten Entscheidungen, Profilbildung, Training
    von Modellen oder generativer KI schweigt sie. Für die Rechtspraxis bedeutet das: Wer in Südafrika
    ein KI-System betreibt, hat für s. 71 POPIA keinen behördlichen Auslegungsanker — und muss sich an
    europäischen Massstäben orientieren, die dort formal nicht gelten.

    '
  inkrafttreten:
    datum: 2021-07-01
    verifiziert: true
    quelle: https://lawlibrary.org.za/akn/za/act/2013/4
    fundstelle_norm: 's. 114(1) POPIA (Act 4 of 2013) — einjaehrige Uebergangsfrist ab dem Inkrafttreten
