  offene_punkte:
  - Der Volltext der Mitteilung wurde nicht gelesen; die einzelnen Anforderungen sind deshalb nicht abschliessend
    erfasst.
  - Ob die SAHPRA eine Regelung für nach der Zulassung fortlernende Systeme (predetermined change control
    plans nach FDA-Vorbild) vorsieht, ist nicht geprüft.
