- id: za-competition-act-1998
  jurisdiktion: za
  kurztitel: Competition Act 89 of 1998
  offizieller_titel: Competition Act, 1998 (Act No. 89 of 1998), as amended by the Competition Amendment
    Act 18 of 2018
  fundstelle: Act No. 89 of 1998; Änderungsgesetz Act No. 18 of 2018
  verfahrensnummer: B31-2018 (Änderungsgesetz)
  status: anwendbar
  status_detail: 'Geltendes Kartellrecht. Es kennt keine KI-spezifische Vorschrift, ist für das südafrikanische
    KI-Recht aber das wirksamste Instrument, das tatsächlich zu verbindlichen Pflichten für KI-Entwickler
    geführt hat: Über das Instrument der Marktuntersuchung (Kapitel 4A, ss. 43A-43G, eingefügt 2018) hat
    die Competition Commission in der Media and Digital Platforms Market Inquiry Abhilfemassnahmen durchgesetzt,
    die KI-Entwicklern Opt-out-Mechanismen und Schulungspflichten gegenüber südafrikanischen Medien auferlegen.
    Das ist bislang die einzige verbindliche KI-Regulierung Südafrikas — und sie steht im Kartellrecht.

    '
  kurzbeschreibung: 'Das Wettbewerbsgesetz verbietet wettbewerbsbeschränkende Vereinbarungen (s. 4), Preisbindung
    der zweiten Hand (s. 5) und den Missbrauch marktbeherrschender Stellung (s. 8, 9) und regelt die Zusammenschlusskontrolle
    (Kapitel 3). Die Novelle von 2018 hat mit Kapitel 4A ein Marktuntersuchungsverfahren geschaffen, das
    der Competition Commission erlaubt, nach Feststellung eines ''adverse effect on competition'' selbst
    Abhilfemassnahmen anzuordnen (s. 43C) — ein Instrument, das dem britischen Market Investigation Regime
    nachgebildet ist und ohne Nachweis eines individuellen Verstosses auskommt. Adressaten sind alle Unternehmen
    mit Wirkung im Inland, auch ausländische. Sanktionen sind Verwaltungsgeldbussen bis 10 % des Jahresumsatzes
    (25 % bei Wiederholung) und, bei Kartellabsprachen, die persönliche Strafbarkeit von Geschäftsleitern
    (s. 73A). Für KI ist zweierlei relevant: die Erfassung algorithmischer Preisabstimmung unter s. 4(1)(b)
    — bislang ohne südafrikanischen Anwendungsfall — und die Marktuntersuchung nach Kapitel 4A, unter
    der die KI-Abhilfemassnahmen von 2025 ergangen sind.

    '
