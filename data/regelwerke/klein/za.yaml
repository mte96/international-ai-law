- id: za-legal-practice-act-2014
  jurisdiktion: za
  kurztitel: Legal Practice Act 28 of 2014 und LPC Code of Conduct
  offizieller_titel: Legal Practice Act, 2014 (Act No. 28 of 2014), nebst dem Code of Conduct for all
    Legal Practitioners, Candidate Legal Practitioners and Juristic Entities (published under section
    97(1)(b))
  fundstelle: Act No. 28 of 2014; Code of Conduct veröffentlicht im Government Gazette No. 42337 vom 29.
    März 2019 (Board Notice), zuletzt geändert
  verfahrensnummer: B20-2012
  status: anwendbar
  status_detail: 'Das Berufsrecht der südafrikanischen Anwaltschaft. Weder das Gesetz noch der Code of
    Conduct des Legal Practice Council enthalten eine KI-spezifische Vorschrift; bis zum 06.09.2026 hat
    der LPC keine KI-Richtlinie erlassen. Die Sanktionierung erfundener Fundstellen läuft deshalb über
    die allgemeinen Pflichten — Ehrlichkeit gegenüber dem Gericht, Sorgfalt, Aufsicht über Berufsanfänger
    — und über die Kostenentscheidung des Gerichts. Die Gerichte haben seit 2023 in mehreren Verfahren
    Akten an den LPC überwiesen (Northbound Processing 30.06.2025, Mavundla 08.01.2025, F.J.L v T.G.O
    31.07.2026); der Ausgang dieser Verfahren ist nicht veröffentlicht.

    '
  kurzbeschreibung: 'Das Legal Practice Act vereinheitlicht seit 2014 das Berufsrecht von Attorneys und
    Advocates und errichtet den Legal Practice Council als landesweite Aufsichtskammer. Der Council erlässt
    nach s. 97(1)(b) einen Code of Conduct, führt Disziplinarverfahren und kann von der Rolle streichen.
    Adressaten sind alle eingetragenen Rechtsanwältinnen und Rechtsanwälte, Berufsanfänger und juristische
    Personen der Rechtsberatung. Für das KI-Recht ist entscheidend, dass die Berufspflichten technikneutral
    formuliert sind: Die Pflicht, dem Gericht keine unrichtigen Angaben zu machen, und die Pflicht zur
    Beaufsichtigung von Berufsanfängern greifen unabhängig davon, ob die Fehlerquelle ein Modell oder
    ein Mensch war. Der praktisch bedeutsamste Befund für die Zurechnung stammt aus F.J.L v T.G.O: Ein
    Acting Judge bleibt eingetragener Rechtsanwalt und unterliegt deshalb weiter der Disziplinargewalt
    des LPC, während die Judicial Service Commission für ihn nicht zuständig ist, weil sie ihn nicht ernannt
    hat.

    '
  inkrafttreten:
    datum: 2015-02-01
    verifiziert: true
    quelle: https://lawlibrary.org.za/akn/za/act/2014/28
    fundstelle_norm: 's. 121(2) Legal Practice Act 28 of 2014 i. V. m. Proclamation R.2 of 2015 — erste
      Stufe: Chapter 10 Part 1 (ss. 96-108) und Part 2 (s. 109), Uebergangs- und Errichtungsvorschriften'
  anwendungsdaten:
  - datum: 2018-10-31
    was_gilt: Chapter 2 Part 1 (ss. 4-13) und Part 2 (ss. 15-23) — Konstituierung des Legal Practice Council;
      Proclamation R.31 of 2018 v. 29.10.2018
    verifiziert: true
    quelle: https://www.lssa.org.za/wp-content/uploads/2019/12/LSSA-Advisory-Implementation-of-the-Legal-Practice-Act-28-of-2014.pdf
  - datum: 2018-11-01
    was_gilt: die uebrigen Vorschriften (Chapters 1, 3, 4, 6, 7, 8, 9 und Teile von Chapter 10) mit Ausnahmen;
      Proclamation R.31 of 2018 — hierauf beruht die berufsrechtliche Aufsicht des LPC
    verifiziert: true
    quelle: https://www.lssa.org.za/wp-content/uploads/2019/12/LSSA-Advisory-Implementation-of-the-Legal-Practice-Act-28-of-2014.pdf
  - datum: 2022-03-01
    was_gilt: s. 14, s. 42, Chapter 5 (ss. 45-52, Legal Services Ombud); Proclamation No. 53 of 2022
    verifiziert: true
    quelle: https://lawlibrary.org.za/akn/za/act/2014/28
  - datum: 2023-05-26
    was_gilt: ss. 37(5)(e)(ii), 40(1)(b)(ii), 40(7)(b), 41 (Disziplinarverfahren); Proclamation No. 120
      of 2023
    verifiziert: true
    quelle: https://lawlibrary.org.za/akn/za/act/2014/28
  themenachsen:
  - berufsrecht
  - haftung
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 's. 97(1)(b): Ermächtigung des Legal Practice Council zum Erlass eines Code of Conduct.'
  - 'Code of Conduct: Pflicht zur Redlichkeit gegenüber dem Gericht, Sorgfaltspflicht, Pflicht zur Beaufsichtigung
    von Candidate Legal Practitioners. Alle drei greifen bei erfundenen Fundstellen; keine ist auf KI
    zugeschnitten.'
  - Disziplinargewalt des LPC über eingetragene Rechtsanwälte, einschliesslich solcher, die als Acting
    Judge tätig sind — die tragende Feststellung von F.J.L v T.G.O.
  - 'Kostenhaftung de bonis propriis als paralleles Sanktionsinstrument des Gerichts: In Mavundla wurden
    die Kosten zweier zusätzlicher Termine der Kanzlei auf scale A auferlegt.'
  - 'LÜCKE: KEINE KI-RICHTLINIE DES LPC. Trotz vier Überweisungen aus vier Verfahren seit 2023 hat der
    Legal Practice Council bis zum 06.09.2026 keine Leitlinie zum KI-Einsatz veröffentlicht. Die Fachdiskussion
    (De Rebus, golegal) fordert sie seit Oktober 2025.'
  dokumente:
  - datum: 2025-10-29
    typ: stellungnahme
    titel: 'Responsible AI use in South African legal practice: A call for ethical guidelines'
    url: https://www.polity.org.za/article/responsible-ai-use-in-south-african-legal-practice-a-call-for-ethical-guidelines-2025-10-29
    sprache: en
    urheber: Polity (Wiedergabe eines De-Rebus-Beitrags)
    verifiziert: false
    notiz: Belegt, dass die Forderung nach berufsrechtlichen KI-Leitlinien in Südafrika seit Oktober 2025
      offen erhoben wird — und damit, dass es sie nicht gibt.
