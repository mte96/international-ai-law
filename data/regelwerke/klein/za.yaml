    titel: HPCSA Booklet 20 — Ethical Guidelines on the use of Artificial Intelligence (Zweitfassung)
    url: https://ethiqal.co.za/wp-content/uploads/2025/03/HPCSA-Booklet-20-Ethical-Guidelines-on-the-use-of-Artificial-Intelligence.pdf
    sprache: en
    urheber: Health Professions Council of South Africa (Wiedergabe durch Ethiqal)
    verifiziert: false
    notiz: Zweitfassung mit früherem Datum (März 2025) — WIDERSPRUCH zur Datierung November 2025. Möglicherweise
      handelt es sich um eine Entwurfs- und eine Endfassung; nicht aufgelöst.
  - datum: 2026-01-09
    typ: stellungnahme
    titel: 'HPCSA''s new Ethical Rules: AI use and End-Of-Life Decisions'
    url: https://www.thomsonwilks.co.za/news-and-media/hpcsas-new-ethical-rules-ai-use-and-end-of-life-decisions
    sprache: en
    urheber: Thomson Wilks Attorneys
    verifiziert: true
    notiz: Sekundärquelle. Belegt die drei Säulen, die Aufklärungs- und Validierungspflicht und den Verweis
      auf die SAHPRA-Vorgaben. Nennt keine Gazette-Fundstelle für die Ethical Rules.
  offene_punkte:
  - 'DATIERUNGSWIDERSPRUCH: Eine Fassung datiert auf März 2025, eine auf November 2025. Welche gilt, ist
    nicht geklärt.'
  - Die angekündigten Änderungen der Ethical Rules (Gazette-Fundstelle unbekannt) wurden nicht ermittelt.
  - Der Volltext von Booklet 20 wurde nicht gelesen; die Nummerierung der Grundsätze ist deshalb nicht
    erfasst.
  - 'Inkrafttreten nicht belegbar: hpcsa-blogs.co.za (robots-Sperre auf Seite und PDF), hpcsa.co.za, Bowmans,
    ethiqal.co.za. Belegt ist nur, dass die HPCSA die ueberarbeiteten Ethikrichtlinien am 20.11.2025 angekuendigt
    hat (Bowmans). Zugleich zirkuliert ein Booklet-20-PDF bereits seit Maerz 2025 (ethiqal.co.za/wp-content/uploads/2025/03/).
    Damit ist offen, ob der eingetragene 01.11.2025 die Erstfassung oder die Neufassung bezeichnet. Ohne
    das amtliche Deckblatt mit Council-Beschlussdatum kein Beleg; verifiziert bleibt false. Hinweis: die
    flankierenden Ethical Rules wurden Anfang 2026 geaendert.'
  monitoring_quellen:
