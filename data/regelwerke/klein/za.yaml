  - datum: 2026-06-26
    was_gilt: 'Ex parte President, In re Constitutionality of the Copyright Amendment Bill and the Performers''
      Protection Amendment Bill (CCT 306/24) [2026] ZACC 26: s. 12A (fair use) verfassungsgemäss; ss.
      12B, 12C, 19B, 19C verfassungsgemäss; s. 12D(1)-(5) verfassungswidrig; s. 12D(6)-(9) verfassungsgemäss;
      Vorlage zu ss. 6A, 7A, 8A unzulässig.

      '
    verifiziert: true
    quelle: https://www.saflii.org/za/cases/ZACC/2026/26.html
  themenachsen:
  - urheberrecht
  - grundrechte
  - content
  - vertrag
  regelungsschwerpunkte:
  - 's. 12A (fair use): ''In addition to uses specifically authorised, fair use in respect of a work or
    the performance of that work, for the following purposes, does not infringe copyright in that work''
    — Forschung, Privatstudium, Privatgebrauch, Kritik oder Rezension, Berichterstattung über Tagesereignisse,
    Wissenschaft, Lehre und Bildung, vergleichende Werbung, Parodie, Satire, Karikatur, Pastiche, Zitat,
    Vorführung und Ähnliches. Die Aufzählung ist durch ''such as'' geöffnet.'
  - 's. 12A(b): vier Abwägungsfaktoren — (i) ''the nature of the work in question''; (ii) ''the amount
    and substantiality of the part of the work affected by the act in relation to the whole of the work'';
    (iii) ''the purpose and character of the use, including whether such use serves a purpose different
    from that of the work affected'' und ob sie gewerblich oder für gemeinnützige Forschung, Bibliotheken
    oder Bildung erfolgt; (iv) ''the substitution effect of the act upon the potential market for the
    work in question''. Faktor (iii) ist die südafrikanische Fassung des Transformativitätskriteriums,
    Faktor (iv) die des Marktschadens — die beiden Faktoren, an denen sich die US-Trainingsverfahren entscheiden.'
  - 's. 12A(c): Pflicht zur Quellen- und Urhebernennung.'
  - 's. 12B, 12C: weitere allgemeine Schranken (u.a. vorübergehende Vervielfältigung); vom Verfassungsgericht
    gebilligt. s. 12C ist die Norm, die technisch notwendige Zwischenkopien deckt — für Trainingspipelines
    der zweite relevante Anknüpfungspunkt neben s. 12A.'
  - 's. 12D(1)-(5): Bildungsschranke (Vervielfältigung ganzer Werke für den Unterricht) — vom Verfassungsgericht
    als willkürliche Eigentumsentziehung nach s. 25(1) der Verfassung verworfen. s. 12D(6)-(9) bleiben
    bestehen.'
  - 'ss. 6A, 7A, 8A: unabtretbarer Anspruch der Urheber und ausübenden Künstler auf Beteiligung. Die Vorlage
    hierzu hat die Corte als unzulässig behandelt, weil der Präsident dem Parlament nur die Rückwirkungsklauseln
    (6A(7), 7A(7), 8A(5)) zur Prüfung vorgelegt hatte, die das Parlament daraufhin gestrichen hat; der
    neue Einwand gegen s. 6A(2) selbst war dem Parlament nie zur Beratung zugeleitet worden.'
  - 's. 19B: Ausnahmen für Computerprogramme (Dekompilierung, Fehlerbehebung, Sicherungskopie) — verfassungsgemäss.'
  - 's. 19C: Schranken für Bibliotheken, Archive, Museen und Galerien — verfassungsgemäss.'
  - 's. 39B: Unwirksamkeit vertraglicher Abbedingung der Schranken. Für Lizenzverträge über Trainingsdaten
    zentral: Wenn die Schranke greift, kann sie nicht wegverhandelt werden.'
  - 'KEIN KI-BEZUG IM TEXT: Der Entwurf erwähnt weder künstliche Intelligenz noch Text- und Data-Mining
    noch maschinelles Lernen. Seine Bedeutung für KI ist mittelbar — über die Offenheit der Fair-Use-Klausel.'
  dokumente:
  - datum: 2026-06-26
    typ: endfassung
