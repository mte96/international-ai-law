# Gepflegte Datenbasis.
regelwerke:
- id: za-constitution-1996
  jurisdiktion: za
  kurztitel: Verfassung der Republik Südafrika 1996
  offizieller_titel: Constitution of the Republic of South Africa, 1996
  fundstelle: Act 108 of 1996 (heute zitiert ohne Aktennummer); Government Gazette No. 17678 of 18 December
    1996
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'In Kraft seit 04.02.1997. Die Verfassung enthält keine KI-spezifische Vorschrift. Sie
    ist gleichwohl das tragende Regelwerk: Der einzige südafrikanische Verfassungsgerichtsentscheid mit
    KI-Relevanz — Ex parte President, In re Copyright Amendment Bill [2026] ZACC 26 vom 26.06.2026 — misst
    die geplante Fair-Use-Schranke an s. 25(1) (willkürliche Eigentumsentziehung) und hält sie für verfassungsgemäss.
    S. 14 (Privatsphäre) trägt POPIA, s. 33 trägt PAJA, s. 165 trägt die richterliche Unabhängigkeit,
    auf die sich der Entwurf der KI-Richtlinie der Judiciary stützt.

    '
  kurzbeschreibung: 'Verfassung von 1996 mit unmittelbar anwendbarer Grundrechtsbindung (Bill of Rights,
    Kapitel 2). Für das KI-Recht wirkt sie auf fünf Wegen. Erstens als Grundlage des Datenschutzes: s.
    14 (''Everyone has the right to privacy'') ist die Norm, die POPIA ausführt. Zweitens als Eigentumsgarantie:
    s. 25(1) verbietet willkürliche Eigentumsentziehung; an dieser Norm ist in ZACC 26 die Bildungsschranke
    des s. 12D(1)-(5) Copyright Amendment Bill gescheitert, während die Fair-Use-Klausel des s. 12A sie
    passiert hat. Drittens als Meinungsfreiheit (s. 16), die den Gegenpol jeder Deepfake- und Kennzeichnungsregulierung
    bildet. Viertens über s. 33 (Recht auf rechtmässiges, vernünftiges und verfahrensfaires Verwaltungshandeln),
    das die Grenze automatisierter Verwaltungsakte zieht. Fünftens über s. 165 (die richterliche Gewalt
    liegt bei den Gerichten; sie sind allein Verfassung und Gesetz unterworfen) — die eigentliche Sperre
    gegen einen maschinengestützten Spruchkörper. Eigene Sanktionen kennt die Verfassung nicht; Rechtsfolge
    ist die Nichtigerklärung der Norm oder des Verwaltungsakts.

    '
