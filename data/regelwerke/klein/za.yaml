- id: za-draft-ai-policy-2026
  jurisdiktion: za
  kurztitel: Draft National AI Policy 2026 (zurückgezogen)
  offizieller_titel: Draft South Africa National Artificial Intelligence (AI) Policy
  fundstelle: General Notice 3880 of 2026, Government Gazette No. 54477 of 10 April 2026; zurückgenommen
    durch General Notice 3978 of 2026, Government Gazette No. 54840 of 12 June 2026
  verfahrensnummer: GN 3880/2026 (Veröffentlichung); GN 3978/2026 (Rücknahme)
  status: gescheitert
  status_detail: 'Am 10.04.2026 mit sechzigtägiger Kommentarfrist im Government Gazette veröffentlicht,
    am 26.04.2026 vom Minister öffentlich zurückgezogen und am 12.06.2026 förmlich aufgehoben. Grund:
    Das Literaturverzeichnis der Politik enthielt erfundene wissenschaftliche Quellen — nach Einschätzung
    des Ministers ''the most plausible explanation is that AI-generated citations were included without
    proper verification''. Vier Beamte, darunter der zuständige Chief Director, wurden vom Dienst suspendiert.
    Eine überarbeitete Fassung soll im November 2026 dem Kabinett vorgelegt und im Januar 2027 zur Kommentierung
    veröffentlicht werden.

    '
  kurzbeschreibung: 'Erster Entwurf einer umfassenden nationalen KI-Politik Südafrikas, vom Kabinett am
    02.04.2026 zur Veröffentlichung freigegeben und am 10.04.2026 als General Notice 3880 in der Government
    Gazette 54477 verkündet. Er ruhte auf sechs Säulen: Kapazitäts- und Talententwicklung; inklusives
    Wachstum und Beschäftigung; verantwortliche Governance einschliesslich Sicherheit und Datenschutz;
    ethische und inklusive KI; kulturelle Bewahrung und internationale Anschlussfähigkeit; menschenzentrierter
    Einsatz. Institutionell sah er sieben neue Einrichtungen vor, darunter eine National AI Commission,
    ein AI Ethics Board, ein Büro einer AI Ombudsperson und — international ohne Vorbild — einen ''AI
    Insurance Superfund'' zur Deckung KI-verursachter Schäden. Adressaten wären der öffentliche und der
    private Sektor gewesen; eigene Sanktionen enthielt der Entwurf nicht, er war Politik, nicht Gesetz.
    Rechtspolitisch ist er heute vor allem als Präzedenzfall bedeutsam: die erste nationale KI-Politik
    weltweit, die an KI-Halluzinationen in ihrem eigenen Fussnotenapparat gescheitert ist.

    '
