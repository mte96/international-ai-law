  offene_punkte:
  - Keine Rechtsprechung zu s. 20 mit KI-Bezug. Die Norm ist seit 2002 in Kraft und, soweit ersichtlich,
    nie auf ein lernendes System angewandt worden.
  - 'Das Verhältnis von s. 20(c) (unbedingte Bindung des Verwenders) zu s. 20(e) (Fehlerregel zugunsten
    der natürlichen Person) ist asymmetrisch: Der Verwender des Agenten trägt das Risiko, sein Gegenüber
    nicht. Ob das bei autonomen Agenten auf beiden Seiten trägt, ist offen.'
  - Ob die von der Competition Commission empfohlenen Inhaltemoderationsvorschriften unter dem ECTA erlassen
    wurden, ist nicht geprüft.
