    quelle: https://ipwatchdog.com/2021/07/29/dabus-gets-first-patent-south-africa-formalities-examination/
  - datum: 2021-07-28
    was_gilt: 'Veröffentlichung der Annahme im Patent Journal Vol. 54 Nr. 7 vom 28.07.2021. Damit gilt
      das Patent nach s. 42(2)(b) als versiegelt und erteilt — die weltweit erste und bis heute einzige
      Patenterteilung mit einer künstlichen Intelligenz als benannter Erfinderin.

      '
    verifiziert: false
    quelle: https://iponline.cipc.co.za/Publications/PublishedJournals/E_Journal_July%202021%20Part%202.pdf
  - datum: 2026-02-19
    was_gilt: 'Die CIPC weitet ihr Experiential Learning Programme aus: Auch national eingereichte vollständige
      Anmeldungen können nun freiwillig in eine kostenlose Recherche und materielle Prüfung durch Prüferanwärter
      einbezogen werden. Das ist der Vorlauf zur angekündigten Substantive Search and Examination, aber
      keine Rechtsänderung.

      '
