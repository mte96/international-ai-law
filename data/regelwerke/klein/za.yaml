  offene_punkte:
  - 'RECHTSSTAND DES DABUS-PATENTS UNGEKLÄRT. Weder Erlöschen wegen Nichtzahlung der Jahresgebühren noch
    ein Nichtigkeitsantrag nach s. 61 sind belegt. Das Patentregister der CIPC ist ohne Anmeldung nicht
    abfragbar; Espacenet lieferte keinen darstellbaren Treffer. Für die Datenbank gilt: das Patent ist
    erteilt, sein Fortbestand ist nicht verifiziert.'
  - Kein südafrikanisches Gericht hat je über die Erfinderfähigkeit einer Maschine entschieden. Alle bekannten
    Entscheidungen zu DABUS stammen aus Prüfungsstaaten (EPA J 8/20, UK Supreme Court 20.12.2023, Australien
    Full Court 13.04.2022, USA CAFC 2022, Neuseeland, Schweiz BVGer 26.06.2025).
  - Der Titel der DABUS-Erfindung ist in keiner abgerufenen amtlichen Quelle wörtlich belegt; die Sekundärquellen
    sprechen von einem 'food container based on fractal geometry'.
  - Ob die angekündigte Substantive Search and Examination rückwirkend auf bereits erteilte Patente wirken
    könnte, ist ausgeschlossen — sie erfasst nur künftige Anmeldungen. Das DABUS-Patent bliebe also auch
    nach der Reform bestehen, solange niemand s. 61 bemüht.
