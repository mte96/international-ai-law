- id: za-patents-act-1978
  jurisdiktion: za
  kurztitel: Patents Act 57 of 1978
  offizieller_titel: Patents Act, 1978 (Act No. 57 of 1978)
  fundstelle: Act No. 57 of 1978, angenommen am 26.04.1978, in Kraft seit 01.01.1979; zuletzt geändert
    durch den Intellectual Property Laws Amendment Act 58 of 2002
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Geltendes Patentgesetz. Sein entscheidendes Merkmal für das KI-Recht ist das Fehlen
    einer materiellen Prüfung. s. 34 verpflichtet den Registrar, jede Anmeldung ''in the prescribed manner''
    zu prüfen und anzunehmen, wenn sie den Anforderungen des Gesetzes entspricht — das heisst in der Praxis:
    Formalprüfung. Neuheit, erfinderische Tätigkeit und gewerbliche Anwendbarkeit werden erst im Nichtigkeits-
    oder Verletzungsverfahren geprüft. Südafrika ist deshalb ein Registrierungssystem (depository system).
    Genau darauf beruht die weltweit einzige Patenterteilung an eine Maschine als Erfinderin: ZA 2021/03242
    (Stephen L. Thaler, Erfinder ''DABUS''), angenommen am 24.06.2021, erteilt mit der Veröffentlichung
    im Patent Journal vom 28.07.2021. Ein Nichtigkeitsverfahren nach s. 61 ist nicht dokumentiert.

    '
  kurzbeschreibung: 'Das Patentgesetz von 1978 regelt Anmeldung, Erteilung, Aufrechterhaltung, Übertragung,
    Verletzung und Nichtigkeit südafrikanischer Patente. Anmeldeberechtigt ist nach s. 27(1) ''the inventor
    or ... any other person acquiring from him the right to apply''. Der Begriff des Erfinders wird im
    Gesetz nicht definiert. Erteilt wird ohne materielle Prüfung: Nach s. 42(2)(b) gilt das Patent mit
    der Veröffentlichung der Annahme im Patent Journal als versiegelt und erteilt. Sanktionsseitig kennt
    das Gesetz die Nichtigkeitsklage jedermanns nach s. 61 — unter anderem mit dem Grund, der Patentinhaber
    sei nicht nach s. 27 anmeldeberechtigt gewesen — sowie die Unterlassungs-, Auskunfts- und Schadensersatzklage
    des Inhabers nach s. 65. Für das KI-Recht ist das Gesetz aus zwei Gründen weltweit einzigartig: Es
    erlaubt faktisch die Nennung einer Maschine als Erfinderin, weil niemand prüft, ob der Genannte ein
    Mensch ist — und es hält zugleich mit s. 61(1) den Hebel bereit, mit dem dieselbe Erteilung jederzeit
    angegriffen werden könnte.

    '
  inkrafttreten:
    datum: 1979-01-01
    verifiziert: true
    quelle: https://www.wipo.int/wipolex/en/legislation/details/4091
  anwendungsdaten:
  - datum: 2021-06-24
    was_gilt: Die CIPC nimmt die Anmeldung ZA 2021/03242 (nationale Phase aus PCT/IB2019/057809, Anmelder
      Stephen L. Thaler, Erfinder 'DABUS') an.
