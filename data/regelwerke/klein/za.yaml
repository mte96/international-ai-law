  - content
  - grundrechte
  regelungsschwerpunkte:
  - Unabtretbarer Vergütungsanspruch der ausübenden Künstler, parallel zu ss. 6A/7A/8A Copyright Amendment
    Bill.
  - Schriftform und Mindestinhalte für Verträge über Darbietungen.
  - 'Rechtspolitischer KI-Bezug (Literatur, nicht Gesetzestext): Ein Leistungsschutzrecht an der Darbietung
    wäre der praktikabelste Schutz gegen Stimm- und Bild-Deepfakes, weil es an ein bestehendes Ausschliesslichkeitsrecht
    anknüpft statt an ein erst zu begründendes Persönlichkeitsrecht.'
