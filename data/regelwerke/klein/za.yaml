  offene_punkte:
  - KEINE RECHTSPRECHUNG ZU s. 71. Weder ein High-Court-Urteil noch eine Entscheidung des Enforcement
    Committee ist auffindbar. Die Norm gilt seit über sechs Jahren ungetestet.
  - 'KEINE AUFSICHTSPRAXIS ZU KI. Die Enforcement-Notice-Liste der Information Regulator (Stand 06.09.2026:
    Gauteng Department of Health 10.06.2026, Sibanye Stillwater 02.06.2026, Central Johannesburg TVET
    20.05.2026) enthält keinen KI-Fall; die Medienmitteilungen 2026 ebenfalls nicht.'
  - 'Ob s. 71 auf generative Systeme passt, ist ungeklärt: Der Tatbestand verlangt eine Entscheidung ''based
    solely on ... automated processing of personal information intended to provide a profile''. Ein Sprachmodell,
    das keinen Profilzweck verfolgt, fällt nach dem Wortlaut heraus.'
  - Das Verhältnis von s. 71(3)(b) (Anspruch auf Information über die 'underlying logic') zu Geschäftsgeheimnissen
    ist nicht geregelt — POPIA kennt keine dem Erwägungsgrund 63 DSGVO entsprechende Schranke.
  - Ob s. 57 (Vorabprüfung) das Training von Modellen mit besonderen Daten erfasst, ist offen.
