    verifiziert: true
    quelle: https://justice.gov.za/legislation/acts/2000-003.pdf
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 's. 1 (Definitions): ''administrative action'' als Entscheidung eines Staatsorgans in Ausübung öffentlicher
    Gewalt mit unmittelbarer äusserer Rechtswirkung; ausgenommen ist unter anderem die Rechtsprechung.'
  - 's. 3 (Procedurally fair administrative action affecting any person): Anhörung, angemessene Frist,
    Mitteilung der Gründe.'
  - 's. 5 (Reasons for administrative action): Anspruch auf schriftliche Begründung binnen 90 Tagen. Bei
    einem opaken Modell ist die Begründungspflicht die schärfste Waffe des Betroffenen — sie zwingt die
    Behörde, den Entscheidungsgrund in Worten anzugeben, nicht in Gewichten.'
  - 's. 6(2)(e)(iv): Aufhebungsgrund, wenn die Entscheidung ''because of the unauthorised or unwarranted
    dictates of another person or body'' ergangen ist. Die naheliegende dogmatische Anknüpfung für eine
    Entscheidung, die faktisch das Modell getroffen hat.'
  - 's. 6(2)(f)(ii): Aufhebungsgrund der Unvernünftigkeit (''not rationally connected to ... the information
    before the administrator'').'
  - 's. 8: Rechtsfolgen — Aufhebung, Zurückverweisung, in Ausnahmefällen Ersetzung der Entscheidung durch
    das Gericht.'
  - 'LÜCKE: PAJA kennt weder eine Offenlegungspflicht für den Einsatz automatisierter Systeme noch ein
    Verbot vollautomatisierter Entscheidungen. Der einzige gesetzliche Anknüpfungspunkt bleibt s. 71 POPIA,
    der aber nur die Verarbeitung personenbezogener Daten erfasst.'
  dokumente:
  - datum: 2000-02-03
    typ: endfassung
    titel: Promotion of Administrative Justice Act 3 of 2000
    url: https://www.justice.gov.za/legislation/acts/2000-003.pdf
    sprache: en
    urheber: Department of Justice and Constitutional Development
    verifiziert: false
    notiz: Amtliche Fassung auf dem Portal des Justizministeriums. Der Volltext wurde für diese Erfassung
      nicht paragraphenweise nachgeprüft; die Angaben zu s. 3, 5, 6 und 8 beruhen auf der allgemein bekannten
      Systematik des Gesetzes.
  offene_punkte:
  - Kein südafrikanisches Urteil wendet PAJA auf eine algorithmisch gestützte Verwaltungsentscheidung
    an. Die Frage, ob s. 6(2)(e)(iv) auf Modellausgaben passt, ist offen.
  - Das Verhältnis von s. 5 PAJA (Begründungsanspruch) zu s. 71(3)(b) POPIA (Anspruch auf 'sufficient
    information about the underlying logic') ist nicht geklärt; die Massstäbe könnten auseinanderfallen.
