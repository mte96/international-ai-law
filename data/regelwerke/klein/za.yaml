  themenachsen:
  - urheberrecht
  - marktzugang
  - governance
  regelungsschwerpunkte:
  - 's. 2 (Definitions): ''''invention'''' means an invention for which a patent may be granted under
    section 25''. Der Begriff ''''inventor'''' wird NICHT definiert — das ist die Lücke, durch die DABUS
    gegangen ist.'
  - 's. 25 (Patentable inventions): Patentierbar ist ''any new invention which involves an inventive step
    and which is capable of being used or applied in trade or industry or agriculture''. Ausgenommen sind
    unter anderem Entdeckungen, wissenschaftliche Theorien, mathematische Methoden, Schemata für gedankliche
    Tätigkeiten und — ausdrücklich — Computerprogramme ''as such''.'
  - 's. 27(1): ''An application for a patent in respect of an invention may be made by the inventor or
    by any other person acquiring from him the right to apply or by both such inventor and such other
    person.'' Die Norm setzt eine Person voraus, aus deren Recht abgeleitet wird. Genau daran setzt die
    Kritik an der DABUS-Erteilung an: Wenn DABUS keine Person ist, konnte Thaler von ihm nichts erwerben.'
  - 's. 30: Anmeldung in der vorgeschriebenen Form gegen Gebühr, mit vorläufiger oder vollständiger Beschreibung.'
  - 's. 34 (Examination of applications): ''The registrar shall examine in the prescribed manner every
    application for a patent and every complete specification accompanying such application or lodged
    at the patent office in pursuance of such application and if it complies with the requirements of
    this Act, he shall accept it.'' Die Norm ordnet KEINE Neuheitsprüfung an. Das ist die eigentliche
    Ursache der DABUS-Erteilung — kein Wertungsentscheid, sondern eine strukturelle Eigenschaft des Registrierungssystems.'
  - 's. 42 (Acceptance and publication): Der Registrar teilt die Annahme schriftlich mit; die Mitteilung
    enthält das Annahmedatum und den Hinweis, dass das Patent mit der Veröffentlichung der Annahme im
    Journal durch den Anmelder ''shall be deemed to have been sealed and granted as from the date of such
    publication''. Die Erteilung ist also ein Publikationsakt des Anmelders, nicht ein Hoheitsakt des
    Amtes.'
  - 's. 43: Öffentliche Einsicht in Patent, Anmeldung und Begleitunterlagen nach der Veröffentlichung
    gegen Gebühr.'
  - 's. 43F(2): Sonderregeln für Anmeldungen aus dem PCT-Verfahren. Über diese Vorschrift ist die DABUS-Anmeldung
    in die nationale Phase gelangt.'
  - 's. 61(1) (Grounds for application for revocation): Jedermann kann jederzeit die Nichtigerklärung
    beantragen — unter anderem mit der Begründung, der Patentinhaber sei nicht nach s. 27 anmeldeberechtigt
    gewesen, die Erfindung sei nicht patentierbar, die Beschreibung offenbare die Erfindung nicht ausreichend
    oder die Ansprüche gingen über die Offenbarung hinaus. Das ist der Hebel, mit dem das DABUS-Patent
    angegriffen werden könnte; ein solcher Antrag ist bis heute nicht dokumentiert.'
  - 's. 65: Verletzungsklage. Die materielle Schutzfähigkeit wird in Südafrika typischerweise erst hier
    oder im Nichtigkeitsverfahren geprüft — mit der Folge, dass ein ''erteiltes'' südafrikanisches Patent
    eine deutlich schwächere Vermutungswirkung hat als ein geprüftes europäisches.'
  - 'Formalitäten in der Praxis: Die Kritik (Adams & Adams; van der Merwe/Ncube) rügt, dass in der DABUS-Akte
    die Erklärung über den Rechtserwerb aus Formblatt P3 gestrichen war, keine Erklärung nach PCT-Regel
    4.17(ii) vorlag und kein Übertragungsnachweis eingereicht wurde — Anforderungen, die eine Registrar-Direktive
    von April 2009 für PCT-gestützte Anmeldungen aufstellt. Die Erteilung war danach auch nach geltendem
    Formalrecht angreifbar.'
