  offene_punkte:
  - Ob s. 33 einer vollautomatisierten Verwaltungsentscheidung entgegensteht, ist ungeklärt. Es gibt kein
    südafrikanisches Gegenstück zu SyRI oder zur niederländischen Kinderopvangtoeslag-Affäre.
  - Ob s. 34 ('another independent and impartial tribunal or forum') eine maschinelle Vorentscheidung
    zulässt, ist nicht entschieden.
