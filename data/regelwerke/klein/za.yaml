  - datum: 2025-08-01
    typ: stellungnahme
    titel: 'Copyright and Artificial Intelligence in South Africa: Rethinking Authorship and Originality
      in the Digital Age'
    url: https://lexafrica.com/2025/08/copyright-and-artificial-intelligence-in-south-africa/
    sprache: en
    urheber: LEX Africa
    verifiziert: true
    notiz: 'Sekundärquelle. Formuliert den Widerspruch zwischen der Autorendefinition für computererzeugte
      Werke und dem Originalitätserfordernis: Werke ohne bedeutsamen menschlichen Beitrag seien ''unlikely
      to qualify for copyright protection under South African law''.'
  offene_punkte:
  - Kein südafrikanisches Gericht hat s. 1(1)(h) je auf ein KI-erzeugtes Werk angewandt. Es gibt kein
    Gegenstück zu den chinesischen Entscheidungen (Li v Liu) oder zur US-amerikanischen Thaler-Linie.
  - Der Widerspruch zwischen ausdrücklicher Zuweisung (s. 1(1)(h)) und dem Originalitätserfordernis (s.
    2(1)) ist ungelöst. Solange er besteht, ist der südafrikanische Schutz computererzeugter Werke Papier.
  - Die Definition von 'computer-generated' fehlt. Ob der Begriff wie in s. 178 UK CDPA das Fehlen eines
    menschlichen Urhebers voraussetzt, ist offen.
  - Ob Trainingskopien unter s. 12 fallen, ist zu verneinen — was die praktische Bedeutung der geplanten
    Fair-Use-Klausel des s. 12A Copyright Amendment Bill erklärt.
