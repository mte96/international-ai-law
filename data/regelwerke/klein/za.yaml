  offene_punkte:
  - AMTLICHER TEXT NICHT ÖFFENTLICH. Weder judiciary.org.za noch gov.za führen das Dokument; die Portalsuche
    nach 'artificial' liefert null Treffer. Titel, Datum, Verfahrensstand und Adressatenkreis sind deshalb
    nicht amtlich belegt.
  - Ob eine Konsultation stattfindet und wann die Richtlinie in Kraft treten soll, ist unbekannt.
  - Ob die Richtlinie auch für Acting Judges gilt, ist offen — gerade dort liegt nach F.J.L v T.G.O das
    praktische Problem.
  - Keine Division des High Court hat, soweit ersichtlich, eine eigene Practice Directive zum KI-Einsatz
    erlassen. Die Directives-Seite der Gauteng Division wurde geprüft; ein KI-Bezug fehlt.
