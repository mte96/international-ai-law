  - grundrechte
  - sektor-oeffentlich
  - arbeit
  regelungsschwerpunkte:
  - 'Vision: ''AI for inclusive economic growth, job creation, cost reduction, and a developing Africa.'''
  - 'Menschenzentrierung: KI-Anwendungen sollen menschliche Entscheidungen ergänzen, nicht ersetzen —
    die begriffliche Vorlage für den späteren Entwurf der KI-Richtlinie der Judiciary.'
  - 'Sprachenpolitik als eigenständiges KI-Ziel: Digitalisierung und Modellierung der zwölf amtlichen
    Sprachen Südafrikas. Das ist ein Regelungsziel, das kein europäisches Rahmendokument kennt.'
  - 'Fünf Zielsektoren: Gesundheit, Landwirtschaft, Bildung, Finanzdienstleistungen, öffentliche Verwaltung.'
  - Anbindung an die AU Continental AI Strategy, die eine nationale Politikverabschiedung im Zeitraum
    2025/26 vorsah — ein Zeitplan, den Südafrika mit der Rücknahme vom April 2026 gerissen hat.
  - Kein Risikoansatz, keine Verbote, keine Konformitätsbewertung, keine Aufsichtsbehörde. Das Framework
    ist Industriepolitik, nicht Produktregulierung.
