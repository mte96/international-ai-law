- id: za-copyright-amendment-bill
  jurisdiktion: za
  kurztitel: Copyright Amendment Bill [B13B-2017]
  offizieller_titel: Copyright Amendment Bill (as amended; ursprünglich B13-2017, in der Fassung B13B-2017
    beziehungsweise B13D-2017)
  fundstelle: Bill B13-2017 / B13B-2017; Parlamentsakte 2291650; Verfassungsgerichtsverfahren CCT 306/24
  verfahrensnummer: B13-2017; B13B-2017; B13D-2017
  status: verfahren
  status_detail: 'Nach neun Jahren immer noch nicht Gesetz. Am 28.03.2019 von beiden Kammern verabschiedet,
    am 16.06.2020 vom Präsidenten wegen verfassungsrechtlicher Bedenken an die Nationalversammlung zurückverwiesen,
    2021 bis 2024 erneut beraten, im Februar 2024 neuerlich verabschiedet und anschliessend vom Präsidenten
    nach s. 79(4)(b) der Verfassung dem Verfassungsgericht vorgelegt. Am 26.06.2026 hat die Corte in [2026]
    ZACC 26 entschieden: Die Fair-Use-Klausel des s. 12A und die Schranken der ss. 12B, 12C, 19B und 19C
    sind verfassungsgemäss; die Bildungsschranke des s. 12D(1)-(5) ist wegen willkürlicher Eigentumsentziehung
    (s. 25(1) Verfassung) verfassungswidrig; hinsichtlich der ss. 6A, 7A und 8A (Vergütungsanspruch) war
    die Vorlage unzulässig. Damit liegt der Ball wieder beim Parlament: Ein unterschriftsreifer Gesetzestext
    existiert nicht.

    '
  kurzbeschreibung: 'Die grösste Urheberrechtsreform Südafrikas seit 1978. Sie führt eine offene Fair-Use-Schranke
    nach US-amerikanischem Vorbild ein (s. 12A), ergänzt sie um Schranken für Bibliotheken, Archive, Museen
    (s. 19C), Menschen mit Behinderungen (s. 19D) und Bildung (s. 12D), verankert einen unabtretbaren
    Vergütungsanspruch der Urheber und ausübenden Künstler (ss. 6A, 7A, 8A) und verbietet Vertragsklauseln,
    die die Schranken abbedingen (s. 39B). Adressaten sind Rechtsinhaber, Nutzer, Verwertungsgesellschaften
    und Bildungseinrichtungen. Für das KI-Recht ist s. 12A die entscheidende Norm: Eine offene Fair-Use-Klausel
    mit vier Abwägungsfaktoren — Art des Werks, Umfang und Wesentlichkeit des benutzten Teils, Zweck und
    Charakter der Nutzung einschliesslich der Frage, ob sie einem anderen Zweck dient als das Werk, und
    der Substitutionseffekt auf den Markt — ist die Rechtsfigur, unter der sich Trainingskopien in den
    Vereinigten Staaten diskutieren lassen. Südafrika wäre der erste afrikanische Staat mit einer solchen
    Klausel. Das Verfassungsgericht hat sie ausdrücklich gebilligt, ohne KI oder Text- und Data-Mining
    auch nur zu erwähnen.

    '
