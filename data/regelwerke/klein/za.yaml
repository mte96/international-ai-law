  regelungsschwerpunkte:
  - 'Säule 1 — Capacity and Talent Development: Bildung, Ausbildung, digitale Infrastruktur.'
  - 'Säule 2 — AI for Inclusive Growth and Job Creation: Forschung, Entwicklung, Start-ups und Kleinstunternehmen.'
  - 'Säule 3 — Responsible Governance: Sicherheit, Cybersicherheit, Privatsphäre, Datenschutz.'
  - 'Säule 4 — Ethical and Inclusive AI: Leitlinien, Fairness, Verzerrungsminderung.'
  - 'Säule 5 — Cultural Preservation and International Integration: kulturelle Werte, globale Zusammenarbeit;
    Digitalisierung der zwölf Amtssprachen.'
  - 'Säule 6 — Human-Centred Deployment: menschliche Kontrolle, Transparenz, Einsatz im öffentlichen Sektor.'
  - 'Sieben vorgeschlagene Einrichtungen, darunter National AI Commission, AI Ethics Board, Office of
    the AI Ombudsperson und ein ''AI Insurance Superfund''. Der Superfund ist international ohne Vorbild:
    ein staatlich getragener Deckungspool für KI-Schäden statt einer Haftungsregel.'
  - 'Adressat der Stellungnahmen: Director-General des DCDT, z.Hd. Mr M. Mashologu (DDG Digital Society
    and Economy), Block A, iParioli Office Park, 1166 Park Street, Hatfield, Pretoria; Private Bag X860,
    Pretoria 0001; aipolicy@dcdt.gov.za.'
  - 'SELBSTWIDERSPRUCH: Der Entwurf verlangte ''vigilant human oversight'' und wurde ausweislich der Ministererklärung
    ohne Überprüfung der KI-erzeugten Belegstellen ausgeliefert. Das ist der eigentliche Befund — nicht
    ein Politikversagen, sondern ein Beleg dafür, dass die von der Politik geforderte Prüfpflicht in der
    Verwaltung, die sie fordert, nicht eingehalten wurde.'
