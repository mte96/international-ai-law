  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Grundsatz: KI-Systeme ''should be used solely as assistive tools and not as substitutes for judicial
    reasoning, discretion, or decision-making in adjudicative functions''.'
  - 'Richterliche Unabhängigkeit: ''Judicial officers must exercise authority free from external influence
    or reliance on AI systems for interpreting laws, evaluating evidence, or making judicial decisions.'''
  - 'Verbotskatalog: Beweiswürdigung, Glaubwürdigkeitsbeurteilung, Auslegung und Anwendung des Rechts,
    richterliche Entscheidungen, Kaution, Strafzumessung, Risikoprognosen.'
  - 'Erlaubniskatalog: Terminierung, Verfahrenssteuerung, Zusammenfassung von Dokumenten, Übersetzung,
    Grammatik, Stil, Formatierung, Vorbereitung nicht inhaltlicher Unterlagen — unter menschlicher Aufsicht
    und mit Überprüfung.'
  - 'Offenlegungspflicht: ''Judicial officers must disclose any material contribution of generative AI
    in court documents, specifying the AI tool used and its contribution. AI outputs must be independently
    verified against authoritative sources.'' Das geht weiter als die britische Judicial Guidance, die
    keine Offenlegung verlangt.'
  - 'Erklärbarkeit mit Sanktion: ''AI systems must produce outputs that are intelligible, explainable,
    and open to scrutiny. Systems failing to meet this standard will be suspended.'''
  - 'Datenschutz und Sicherheit: Einhaltung der Datenschutzgesetze einschliesslich POPIA, Vertraulichkeit,
    Cybersicherheit, Schutzrechte.'
  - 'Schulungspflicht vor Nutzung: Grenzen und Risiken einschliesslich Verzerrung und Halluzination.'
  - 'Einführungsvoraussetzungen für Systeme: Erklärbarkeit, Datenschutzkonformität, Verzerrungsprüfung,
    Pilotbetrieb, Datenschutz-Folgenabschätzung.'
  - 'Zugang zur Justiz: Effizienzgewinne dürfen keine Barrieren für Menschen ohne digitale Kompetenz oder
    Technikzugang schaffen.'
  - 'Verantwortung und Sanktion: Richterinnen, Richter und Gerichtspersonal haften für die ordnungsgemässe
    Nutzung; Fahrlässigkeit oder Verstoss kann disziplinarische Folgen haben.'
  - 'Überprüfungsklausel: mindestens alle zwei Jahre; Zwischenleitlinien möglich.'
