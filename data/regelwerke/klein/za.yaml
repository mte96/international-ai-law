- id: za-fsca-pa-ai-report-2025
  jurisdiktion: za
  kurztitel: FSCA/PA-Bericht zu KI im Finanzsektor
  offizieller_titel: Artificial Intelligence in the South African Financial Sector
  fundstelle: Gemeinsamer Bericht der Financial Sector Conduct Authority (FSCA) und der Prudential Authority
    (PA), veröffentlicht am 24. November 2025
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Kein Rechtsakt, sondern eine Bestandsaufnahme. Der Bericht ist die erste umfassende
    Übersicht über den KI-Einsatz im südafrikanischen Finanzsektor und stützt sich auf eine Erhebung bei
    beaufsichtigten Instituten. Er begründet keine Pflichten und kündigt keine Regulierung an; er ist
    die Vorstufe, auf der eine spätere Aufsichtsleitlinie aufbauen würde. Eine KI-spezifische Verhaltens-
    oder Aufsichtsvorschrift für den südafrikanischen Finanzsektor gibt es bis zum 06.09.2026 nicht.

    '
  kurzbeschreibung: 'Gemeinsamer Bericht der Marktverhaltensaufsicht (FSCA) und der Bankenaufsicht (Prudential
    Authority, angesiedelt bei der South African Reserve Bank) vom 24.11.2025. Er erfasst Verbreitung
    und Anwendungsfälle von maschinellem Lernen und generativer KI bei Banken, Versicherern, Vermögensverwaltern
    und Finanzdienstleistern und ordnet die damit verbundenen Aufsichtsfragen ein — Modellrisiko, Erklärbarkeit,
    Fairness im Vertrieb, Auslagerung an Modellanbieter, Konzentrationsrisiken bei wenigen Anbietern,
    Datenschutz nach POPIA sowie Geschäftsgeheimnis- und Schutzrechtsfragen an Modellen und Trainingsdaten.
    Adressaten sind die beaufsichtigten Institute; Sanktionen enthält der Bericht nicht. Aufsichtsrechtlich
    bleibt es bei den allgemeinen Instrumenten: Treating Customers Fairly, die Conduct Standards der FSCA,
    die Auslagerungsvorgaben der PA und der Financial Advisory and Intermediary Services Act.

    '
  inkrafttreten:
    datum: 2025-11-24
    verifiziert: true
    quelle: https://www.resbank.co.za/en/home/publications/publication-detail-pages/media-releases/2025/artificial-intelligence-in-the-south-african-financial-sector
  anwendungsdaten: []
