- id: za-performers-protection-amendment-bill
  jurisdiktion: za
  kurztitel: Performers' Protection Amendment Bill [B24-2016]
  offizieller_titel: Performers' Protection Amendment Bill
  fundstelle: Bill B24-2016 (Zwillingsentwurf zum Copyright Amendment Bill); Verfassungsgerichtsverfahren
    CCT 306/24
  verfahrensnummer: B24-2016; B24B-2016
  status: verfahren
  status_detail: 'Zwillingsentwurf des Copyright Amendment Bill, gemeinsam mit ihm dem Verfassungsgericht
    vorgelegt und in [2026] ZACC 26 mitentschieden: Die Feststellungen zu den Vorschriften des Copyright
    Amendment Bill gelten ''equally to corresponding PPAB provisions''. Auch dieser Entwurf ist damit
    nicht unterschriftsreif.

    '
  kurzbeschreibung: 'Novelle des Performers'' Protection Act 11 of 1967. Sie stärkt die Rechte ausübender
    Künstler, führt einen unabtretbaren Vergütungsanspruch ein und verlangt Schriftform und Mindestinhalte
    für Verträge über Darbietungen. Für das KI-Recht ist der Entwurf aus einem Grund interessant, den
    die südafrikanische Literatur ausdrücklich anspricht: Ein gestärktes Leistungsschutzrecht der ausübenden
    Künstler ist der dogmatisch naheliegendste Ansatzpunkt gegen Deepfakes von Stimme und Bild, weil das
    südafrikanische Recht kein allgemeines Persönlichkeitsrecht am eigenen Bild kennt, sondern nur die
    actio iniuriarum des common law. Der Entwurf selbst erwähnt KI nicht.

    '
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.saflii.org/za/cases/ZACC/2026/26.html
    fundstelle_norm: Kein Inkrafttreten — Bill B24-2016 ist bis 06.09.2026 nicht Gesetz. Zusammen mit
      dem Copyright Amendment Bill durch [2026] ZACC 26 v. 26.06.2026 an das Parlament zurueckverwiesen
  anwendungsdaten:
  - datum: 2026-06-26
    was_gilt: 'ZACC 26: Die Feststellungen zur Verfassungsmässigkeit gelten entsprechend für die korrespondierenden
      Vorschriften des PPAB.'
    verifiziert: true
