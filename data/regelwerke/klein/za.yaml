- id: za-ai-policy-framework-2024
  jurisdiktion: za
  kurztitel: National AI Policy Framework 2024
  offizieller_titel: South Africa National Artificial Intelligence Policy Framework
  fundstelle: Herausgegeben vom Department of Communications and Digital Technologies, August 2024 (Datierung
    des Dokuments); auf der Ministeriumsseite veröffentlicht am 14.08.2024
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Nicht bindendes Rahmendokument. Es ist kein Government Notice, wurde nicht in der Government
    Gazette verkündet und begründet keine Pflichten. Es war ausdrücklich als Vorstufe einer ''comprehensive
    National AI Policy'' gedacht. Diese Politik wurde am 10.04.2026 als Entwurf veröffentlicht und am
    26.04.2026 zurückgezogen; das Framework von 2024 bleibt damit bis heute das einzige nationale KI-Politikdokument
    Südafrikas.

    '
  kurzbeschreibung: 'Rahmenpapier des Kommunikations- und Digitalministeriums vom August 2024, hervorgegangen
    aus dem National AI Summit vom 05.04.2024 und einem vorgeschalteten Diskussionspapier. Es formuliert
    einen Zukunftsentwurf (''Futures Triangle'': gegenwärtige Treiber, angestrebte Zukunft, historische
    Hemmnisse einschliesslich der digitalen Kluft) und zerlegt ihn in strategische Handlungsfelder — Talent-
    und Kapazitätsaufbau, digitale Infrastruktur, Forschung und Entwicklung, ethische Leitlinien, Datenschutz,
    Sicherheit und die Bewahrung der Sprachenvielfalt. Zielsektoren sind Gesundheit, Landwirtschaft, Bildung,
    Finanzwesen und öffentliche Verwaltung. Leitbild ist ein menschenzentrierter Einsatz, bei dem KI menschliche
    Entscheidungen ''augment rather than replace''. Adressat ist die Regierung selbst; Sanktionen enthält
    das Dokument nicht.

    '
