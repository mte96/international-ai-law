- id: za-cipc-sse-praxis
  jurisdiktion: za
  kurztitel: CIPC-Prüfungspraxis und Experiential Learning Programme
  offizieller_titel: Practice of the Companies and Intellectual Property Commission (CIPC) as receiving
    and granting office under the Patents Act 57 of 1978, including the Experiential Learning Programme
    (ELP) for voluntary substantive search and examination
  fundstelle: Keine förmliche Rechtsgrundlage; Verwaltungspraxis des Registrar of Patents auf der Grundlage
    von s. 34 Patents Act und der Patent Regulations
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Die CIPC prüft Patentanmeldungen bis heute nur formell. Seit Februar 2026 bietet sie
    im Rahmen des Experiential Learning Programme eine freiwillige, kostenlose Recherche und materielle
    Prüfung durch Prüferanwärter an, die seither auch national eingereichten vollständigen Anmeldungen
    offensteht. Das Ergebnis ist ein Recherche- und Prüfbericht ohne Rechtsfolgen. Eine verbindliche Substantive
    Search and Examination (SSE) ist angekündigt, aber bis zum 06.09.2026 nicht eingeführt; sie setzt
    den Patents Bill voraus.

    '
  kurzbeschreibung: 'Die Companies and Intellectual Property Commission ist das südafrikanische Patentamt.
    Ihre Praxis ist für das KI-Recht deshalb bedeutsam, weil sie erklärt, wie eine Maschine Erfinderin
    werden konnte: Der Registrar prüft Anmeldungen nur auf Vollständigkeit und Formgerechtigkeit; ob der
    als Erfinder Genannte eine natürliche Person ist und ob der Anmelder das Recht zur Anmeldung wirksam
    erworben hat, wird nicht materiell geprüft. Seit 2018 sieht die Intellectual Property Policy Phase
    I den Übergang zu einer materiellen Prüfung vor. Als Vorstufe bildet die CIPC seit Jahren Patentprüfer
    aus und lässt sie im Experiential Learning Programme an echten Anmeldungen üben; die Teilnahme ist
    freiwillig und gebührenfrei, und seit einer Bekanntmachung vom 19.02.2026 können auch national eingereichte
    vollständige Anmeldungen einbezogen werden. Sanktionen knüpfen an dieses Programm nicht an; der Prüfbericht
    dient dem Anmelder als Erkenntnisquelle und dem Amt als Ausbildung.

    '
