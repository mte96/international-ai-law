- id: za-popia
  jurisdiktion: za
  kurztitel: POPIA — Protection of Personal Information Act
  offizieller_titel: Protection of Personal Information Act, 2013 (Act No. 4 of 2013)
  fundstelle: Act No. 4 of 2013; Government Gazette Vol. 581, No. 37067 of 26 November 2013; angenommen
    (assented to) am 19.11.2013
  verfahrensnummer: B9-2009
  status: anwendbar
  status_detail: 'Gestaffelt in Kraft getreten: s. 1 und Kapitel 5 Teil A (ss. 39-54, Information Regulator)
    sowie ss. 112, 113 am 11.04.2014; die materiellen Vorschriften ss. 2-38 und 55-109 am 01.07.2020 mit
    einjähriger Übergangsfrist bis 30.06.2021; ss. 110 und 114(4) am 30.06.2021; s. 58(2) in Bezug auf
    s. 57 am 01.02.2022. s. 71 (automatisierte Entscheidungsfindung) gilt seit dem 01.07.2020 und ist
    seit dem 01.07.2021 durchsetzbar. Bis zum 06.09.2026 hat die Information Regulator zu s. 71 KEINE
    Guidance Note erlassen und KEINEN Enforcement Notice ausgesprochen; es gibt keine veröffentlichte
    Gerichtsentscheidung dazu.

    '
  kurzbeschreibung: 'Allgemeines Datenschutzgesetz Südafrikas, strukturell an der DSGVO-Vorgängergeneration
    orientiert. Es gilt für jede Verarbeitung personenbezogener Daten durch öffentliche und private Verantwortliche
    (''responsible parties'') mit Sitz in Südafrika oder unter Nutzung von Mitteln in Südafrika (s. 3).
    Es schützt auch juristische Personen — eine Besonderheit gegenüber der DSGVO: ''data subject'' ist
    ''the person to whom personal information relates'', und ''person'' erfasst nach s. 1 auch ''a juristic
    person''. Es kennt acht Verarbeitungsbedingungen (Kapitel 3), eine Aufsichtsbehörde mit Ermittlungs-,
    Anordnungs- und Bussgeldbefugnis (Information Regulator, ss. 39 ff., 95, 109) und Sanktionen bis zu
    10 Mio. ZAR beziehungsweise zehn Jahren Freiheitsstrafe (s. 107). Für das KI-Recht ist die zentrale
    Norm s. 71: das südafrikanische Gegenstück zu Art. 22 DSGVO. Sie verbietet Entscheidungen, die allein
    auf automatisierter Verarbeitung zur Profilbildung beruhen und rechtliche Folgen haben oder erheblich
    beeinträchtigen — mit zwei Ausnahmen und der Pflicht, dem Betroffenen ''sufficient information about
    the underlying logic'' zu geben. POPIA kennt keine Regel zum Modelltraining und keine Rechtsgrundlage
    ''berechtigtes Interesse'' im europäischen Zuschnitt; die Verarbeitung stützt sich auf s. 11 (Einwilligung,
    Vertrag, gesetzliche Pflicht, öffentliche Aufgabe, berechtigtes Interesse).

    '
  inkrafttreten:
    datum: 2020-07-01
    verifiziert: true
    quelle: https://www.saflii.org/za/legis/consol_act/popia4o2013399/
  anwendungsdaten:
  - datum: 2014-04-11
    was_gilt: Inkrafttreten von s. 1, Kapitel 5 Teil A (ss. 39-54, Information Regulator), ss. 112 und
      113 (ProcR25 in GG 37544).
    verifiziert: true
    quelle: https://www.saflii.org/za/legis/consol_act/popia4o2013399/
  - datum: 2020-07-01
    was_gilt: Inkrafttreten der materiellen Vorschriften ss. 2-38, 55-109, 111 und 114(1)-(3) — darunter
      s. 71 (ProcR21 in GG 43461).
    verifiziert: true
    quelle: https://www.saflii.org/za/legis/consol_act/popia4o2013399/
  - datum: 2021-06-30
    was_gilt: Ende der einjährigen Übergangsfrist nach s. 114(1); Inkrafttreten von ss. 110 und 114(4).
      Seither ist s. 71 vollständig durchsetzbar.
    verifiziert: true
    quelle: https://www.saflii.org/za/legis/consol_act/popia4o2013399/
  - datum: 2022-02-01
    was_gilt: Inkrafttreten von s. 58(2), soweit auf Verarbeitungen nach s. 57 anwendbar (Vorabprüfung).
    verifiziert: true
    quelle: https://www.saflii.org/za/legis/consol_act/popia4o2013399/
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-finanz
  - arbeit
  - governance
  regelungsschwerpunkte:
  - 's. 1: ''person'' schliesst juristische Personen ein; ''data subject'' ist ''the person to whom personal
    information relates''. POPIA schützt damit auch Unternehmen — für KI-Anwendungen im B2B-Bereich ein
    Unterschied zur DSGVO, der leicht übersehen wird.'
  - 's. 1: ''biometrics'' ist ausdrücklich definiert (''a technique of personal identification that is
    based on physical, physiological or behavioural characterisation including blood typing, fingerprinting,
    DNA analysis, retinal scanning and voice recognition''). Biometrische Daten sind nach s. 26 besondere
    personenbezogene Daten.'
  - 's. 3: räumlicher Anwendungsbereich. Erfasst sind auch nicht in Südafrika ansässige Verantwortliche,
    die ''automated or non-automated means in the Republic'' einsetzen, es sei denn, diese dienen nur
    der Durchleitung. s. 3(4) definiert ''automated means'' als ''any equipment capable of operating automatically
    in response to instructions given for the purpose of processing information''.'
  - 's. 5(g): Betroffenenrecht, ''not to be subject, under certain circumstances, to a decision which
    is based solely on the basis of the automated processing of his, her or its personal information intended
    to provide a profile of such person as provided for in terms of section 71''. Beachte die Formulierung
    ''his, her or its'' — auch hier die juristische Person.'
  - 's. 8-25 (Kapitel 3): die acht Verarbeitungsbedingungen — Rechenschaftspflicht, Rechtmässigkeit, Zweckbindung,
    Weiterverarbeitung, Informationsqualität, Offenheit, Sicherheit, Beteiligung des Betroffenen.'
  - 's. 11: Rechtsgrundlagen der Verarbeitung, einschliesslich s. 11(1)(f) (berechtigtes Interesse des
    Verantwortlichen oder eines Dritten). Die einzige Norm, auf die sich ein Modelltraining mit personenbezogenen
    Daten in Südafrika stützen liesse — eine Auslegungshilfe der Aufsicht dazu fehlt.'
  - 's. 26-27: Verbot der Verarbeitung besonderer personenbezogener Daten (u.a. biometrische Daten) mit
    Ausnahmen und behördlicher Genehmigung.'
  - 's. 57: Vorabprüfung (''prior authorisation'') unter anderem bei der Verarbeitung eindeutiger Kennungen
    zu einem anderen Zweck als dem Erhebungszweck und bei der automatisierten Verarbeitung besonderer
    Daten zur Profilbildung. Das ist der zweite, oft übersehene KI-Anknüpfungspunkt neben s. 71.'
  - 's. 71: automatisierte Entscheidungsfindung — siehe eigene Normeinträge za-popia-s71-abs1 bis -abs3.'
  - 's. 72: Übermittlung ins Ausland nur bei vergleichbarem Schutzniveau, Einwilligung, Vertragserfüllung
    oder Vorteil des Betroffenen. Praktisch die Norm, an der die Nutzung ausländischer Modellanbieter
    hängt.'
  - 's. 95: Enforcement Notice der Information Regulator; s. 103: Straftatbestand der Nichtbefolgung;
    s. 107: Geldstrafe bis 10 Mio. ZAR oder Freiheitsstrafe bis zehn Jahre; s. 109: Verwaltungsgeldbusse
    bis 10 Mio. ZAR.'
  - 's. 99: zivilrechtlicher Schadensersatzanspruch des Betroffenen, verschuldensunabhängig ausgestaltet
    (''whether or not there is intent or negligence on the part of the responsible party'').'
  - 'LÜCKE: POPIA kennt keine Text- und Data-Mining-Schranke, keine Regelung zum Training von Modellen
    und keine Transparenzpflicht für generative Systeme. Alles, was für KI gilt, ist Auslegung der allgemeinen
    Bedingungen.'
