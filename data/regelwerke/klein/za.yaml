- id: za-patents-bill
  jurisdiktion: za
  kurztitel: Patents Bill (angekündigt)
  offizieller_titel: Patents Bill (Arbeitstitel; begleitet vom Designs Amendment Bill)
  fundstelle: Noch nicht im Government Gazette veröffentlicht; keine Bill-Nummer
  verfahrensnummer: ''
  status: idee
  status_detail: 'Angekündigt, aber nicht veröffentlicht. Nach einem Stakeholder-Workshop vom 23.09.2025
    war die Einbringung ins Parlament für Anfang 2026 angekündigt; bis zum 06.09.2026 ist kein Text erschienen.
    Erwartet werden eine gestufte materielle Prüfung, Gebrauchsmuster, eine Neuheitsschonfrist, ein Einspruchsverfahren
    nach Erteilung, gestaffelte Gebühren zugunsten kleiner Anmelder und ein Verwaltungstribunal für Zwangslizenzen.

    '
  kurzbeschreibung: 'Geplante Vollreform des südafrikanischen Patentrechts, die das Registrierungssystem
    von 1978 ablösen soll. Kernstück ist die Substantive Search and Examination: Anmeldungen sollen künftig
    veröffentlicht werden, Dritte sollen Einwendungen erheben können, und in ausgewählten technischen
    Gebieten soll die Behörde Neuheit und erfinderische Tätigkeit vor der Erteilung prüfen. Adressaten
    sind Anmelder, Vertreter und die CIPC. Für das KI-Recht ist der Entwurf aus zwei Gründen wichtig:
    Er würde erstens die strukturelle Ursache der DABUS-Erteilung beseitigen, ohne sie rückwirkend zu
    heilen. Und er ist zweitens die einzige Gelegenheit, bei der der südafrikanische Gesetzgeber sich
    zur Erfinderfähigkeit von Maschinen äussern könnte — bislang ist dazu in keinem verfügbaren Bericht
    ein Vorschlag enthalten.

    '
