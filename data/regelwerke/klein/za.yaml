- id: za-hpcsa-booklet-20
  jurisdiktion: za
  kurztitel: HPCSA Booklet 20 — Ethikrichtlinie KI in der Gesundheitsversorgung
  offizieller_titel: Ethical Guidelines on the Use of Artificial Intelligence in Health Care (Booklet
    20)
  fundstelle: Health Professions Council of South Africa, Booklet 20, veröffentlicht November 2025
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Berufsethische Leitlinie des Health Professions Council of South Africa, im November
    2025 als Booklet 20 der HPCSA-Ethikreihe veröffentlicht. Verstösse werden über das Berufsaufsichtsverfahren
    des Health Professions Act 56 of 1974 geahndet; die Leitlinie selbst ist kein Gesetz. Für 2026 sind
    flankierende Änderungen der Ethical Rules angekündigt.

    '
  kurzbeschreibung: 'Erste berufsrechtliche KI-Regelung Südafrikas. Sie richtet sich an alle beim HPCSA
    registrierten Gesundheitsberufe — Ärztinnen und Ärzte, Psychologen, Radiologen, Ergo- und Physiotherapeuten
    und weitere. Kern ist die Trennung von Werkzeug und Verantwortung: KI darf Dokumentation, Triage,
    Bildauswertung und klinische Entscheidungsunterstützung unterstützen, ersetzt aber nicht das klinische
    Urteil; die Behandlerin bleibt für Befunderhebung und Entscheidung verantwortlich. Hinzu treten eine
    Aufklärungspflicht (Patientinnen und Patienten müssen erfahren, wenn KI in ihre Behandlung einfliesst),
    eine Validierungspflicht (nur Systeme, deren Zuverlässigkeit und kulturelle Angemessenheit für die
    südafrikanische Bevölkerung belegt ist) und die Bindung an das Datenschutzrecht (POPIA). Sanktion
    ist das berufsrechtliche Verfahren vor dem Professional Conduct Committee.

    '
  inkrafttreten:
    datum: 2025-11-01
    verifiziert: false
    quelle: https://www.hpcsa-blogs.co.za/wp-content/uploads/2025/11/ETHICAL-GUIDELINES-USE-OF-AI.pdf
  anwendungsdaten:
  - datum: 2026-01-01
    was_gilt: Flankierende Änderungen der HPCSA Ethical Rules zu KI-Einsatz und Entscheidungen am Lebensende
      werden berichtet; Gazette-Fundstelle nicht ermittelt.
    verifiziert: false
    quelle: https://www.thomsonwilks.co.za/news-and-media/hpcsas-new-ethical-rules-ai-use-and-end-of-life-decisions
  themenachsen:
  - sektor-medizin
  - berufsrecht
  - haftung
  - datenschutz
  regelungsschwerpunkte:
  - 'Verantwortungsprinzip: ''AI systems may assist with documentation, triage, image analysis and clinical
    decision support, but cannot replace clinical judgement.'' Die Behandlerin bleibt für Beurteilung
    und Entscheidung verantwortlich.'
  - 'Aufklärungspflicht: Patientinnen und Patienten sind zu informieren, wenn KI-Systeme in ihre Versorgung
    einfliessen.'
  - 'Validierungspflicht: nur Systeme verwenden, deren Zuverlässigkeit belegt und deren Eignung für die
    südafrikanische Patientenpopulation geprüft ist (''cultural appropriateness'') — eine Anforderung,
    die in europäischen Leitlinien fehlt und auf die Verzerrungsproblematik bei importierten Modellen
    zielt.'
  - 'Drei Säulen: ethische Nutzung, Rechtskonformität (einschliesslich POPIA) und technische Absicherung.'
  - Verweis auf die SAHPRA-Vorgaben für KI/ML-gestützte Medizinprodukte.
  dokumente:
  - datum: 2025-11-01
    typ: leitlinie
    titel: Ethical Guidelines on the Use of Artificial Intelligence (HPCSA Booklet 20)
    url: https://www.hpcsa-blogs.co.za/wp-content/uploads/2025/11/ETHICAL-GUIDELINES-USE-OF-AI.pdf
    sprache: en
    urheber: Health Professions Council of South Africa
    verifiziert: false
    notiz: PDF auf dem Blogserver des HPCSA. Der Abruf scheiterte an der robots.txt-Prüfung; die URL ist
      über die Trefferliste belegt und wird vom HPCSA selbst ausgeliefert. Inhalt aus Sekundärauswertungen.
  - datum: 2025-03-01
