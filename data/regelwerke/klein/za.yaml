  - 'Datierung: August 2024 (Dokument, DCDT, Fasken) gegen Oktober 2024 (OECD.AI). Nicht aufgelöst.'
  - 'Inkrafttreten nicht belegbar: dcdt.gov.za (robots/TLS-Sperre), gov.za, Bowmans-Analyse, PolicyVault,
    Ellipsis. Das Rahmenpapier traegt nur die Datierung ''August 2024'', ist kein Government Notice und
    wurde nie in der Government Gazette verkuendet; ein foermliches Datum der Veroeffentlichung ist nicht
    feststellbar. Bowmans berichtet im August 2024 ausdruecklich, das Papier sei zu dem Zeitpunkt noch
    nicht foermlich auf der Ministeriumsseite veroeffentlicht gewesen. Der eingetragene 14.08.2024 laesst
    sich damit nicht am amtlichen Dokument belegen; er ist aber auch nicht widerlegt. Status softlaw und
    inkrafttreten-Datum unveraendert gelassen, verifiziert bleibt false.'
