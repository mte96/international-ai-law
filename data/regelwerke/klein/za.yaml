  themenachsen:
  - wettbewerb
  - urheberrecht
  - content
  - gpai
  - marktzugang
  regelungsschwerpunkte:
  - 'Kapitel 5 des Berichts (''Generative Artificial Intelligence''): Feststellung, dass Nachrichteninhalte
    substantiell zur Modellqualität beitragen, ohne dass die Urheber daran teilhaben — eingeordnet als
    ''adverse effect on competition''.'
  - 'Abhilfemassnahme: KI-Unternehmen müssen südafrikanischen Medien ''the same content controls and opt-out
    mechanisms available in the EU'' einräumen, einschliesslich der Möglichkeit, Training und Zusammenfassung
    getrennt zu blockieren.'
  - 'Abhilfemassnahme: halbjährliche Schulungen (''bi-annual training to support the development of a
    fair and functioning market for licensed content'') — begründet damit, dass kleinere Verleger die
    technische Expertise für die Ausübung von Opt-outs nicht haben.'
  - 'Abhilfemassnahme: kollektive Vermarktung, damit kleinere Medien Lizenzverträge verhandeln können.'
  - 'Google: EU-äquivalente Transparenz- und Selbstbevorzugungsverbote in Südafrika; Erstreckung künftiger
    EU- oder US-Strukturmassnahmen binnen sechs Monaten nach deren Umsetzung. Das ist eine dynamische
    Verweisung auf fremdes Recht — ein bemerkenswertes Regulierungsinstrument für einen Staat ohne eigene
    Plattformregulierung.'
  - 'Google: Medienpaket von insgesamt 688 Mio. ZAR, darunter 114 Mio. ZAR über drei Jahre und 71 Mio.
    ZAR jährlich für Showcase-Verträge.'
  - Empfehlung an das DCDT, unter dem Electronic Communications and Transactions Act 25 of 2002 Vorschriften
    zur Inhaltemoderation zu erlassen.
  - 'AUSDRÜCKLICHE LÜCKE: Die Massnahmen schaffen kein Lizenz- oder Vergütungsregime für Trainingsdaten.
    Der Bericht verlagert die Last auf das Opt-out — genau die Konstruktion, die in Europa mit Art. 4
    Abs. 3 DSM-Richtlinie als unzureichend kritisiert wird.'
