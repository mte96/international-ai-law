- id: za-sahpra-md08-2025
  jurisdiktion: za
  kurztitel: SAHPRA MD08 — KI/ML-gestützte Medizinprodukte
  offizieller_titel: Regulatory Requirements of Artificial Intelligence and Machine Learning (AI/ML) Enabled
    Medical Devices (MD08-2025/2026, Version 1)
  fundstelle: South African Health Products Regulatory Authority, Dokument MD08-2025/2026 Version 1, wirksam
    ab 19. August 2025
  verfahrensnummer: MD08-2025/2026
  status: softlaw
  status_detail: 'Mitteilung der Arzneimittel- und Medizinproduktebehörde an die Industrie, wirksam seit
    dem 19.08.2025. Sie ist keine Rechtsverordnung, sondern eine Auslegungs- und Verfahrensmitteilung
    zu den bestehenden Anforderungen des Medicines and Related Substances Act 101 of 1965 und der Medical
    Devices Regulations. Faktisch bestimmt sie, was die Behörde von Antragstellern für KI- und ML-gestützte
    Medizinprodukte verlangt.

    '
  kurzbeschreibung: 'Erste produktregulatorische KI-Vorgabe Südafrikas. Sie richtet sich an Hersteller
    und Inverkehrbringer von Medizinprodukten, deren Funktion auf künstlicher Intelligenz oder maschinellem
    Lernen beruht, und legt fest, welche Nachweise die SAHPRA im Zulassungs- und Lizenzverfahren erwartet
    — insbesondere zur Validierung, zur klinischen Leistungsfähigkeit, zum Umgang mit lernenden Systemen
    nach der Zulassung und zur laufenden Überwachung. Sanktion ist die Versagung oder der Widerruf der
    Zulassung beziehungsweise der Herstellungs- und Vertriebslizenz. Zusammen mit dem HPCSA-Booklet 20
    bildet sie die einzige sektorspezifische KI-Regelung Südafrikas mit unmittelbarer Praxiswirkung.

    '
  inkrafttreten:
    datum: 2025-08-19
    verifiziert: true
    quelle: https://www.sahpra.org.za/document/regulatory-requirements-of-artificial-intelligence-and-machine-learning-ai-ml-enabled-medical-devices/
  anwendungsdaten: []
  themenachsen:
  - sektor-medizin
  - marktzugang
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Zweckbestimmung: ''This communication is intended to provide industry stakeholders with the regulatory
    requirements of Artificial Intelligence and Machine Learning (AI/ML)-enabled medical devices in South
    Africa.'''
  - Anforderungen an Validierung und klinische Leistungsfähigkeit KI-gestützter Produkte.
  - Umgang mit lernenden Systemen nach der Zulassung (Änderungskontrolle) und laufende Überwachung.
  - 'Flankierung durch die berufsethische Ebene: Booklet 20 des HPCSA verweist ausdrücklich auf diese
    Vorgaben.'
  dokumente:
