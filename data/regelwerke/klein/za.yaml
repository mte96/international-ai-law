  regelungsschwerpunkte:
  - 's. 4(1)(b): Per-se-Verbot horizontaler Preisabsprachen, Marktaufteilung und Angebotsabsprachen. Die
    Norm, unter die algorithmische Preisabstimmung fiele — ein südafrikanischer Anwendungsfall ist nicht
    bekannt.'
  - 's. 8: Missbrauchsverbot für marktbeherrschende Unternehmen, einschliesslich Kampfpreisen, Verweigerung
    des Zugangs zu wesentlichen Einrichtungen und Kopplung.'
  - 'Kapitel 4A (ss. 43A-43G), eingefügt durch Act 18 of 2018: Marktuntersuchung. s. 43B verpflichtet
    die Commission zur Untersuchung, wenn Grund zur Annahme eines Marktmerkmals besteht, das den Wettbewerb
    beeinträchtigt; s. 43C ermächtigt sie, selbst Abhilfemassnahmen zu treffen. Das ist die Rechtsgrundlage
    der KI-Abhilfemassnahmen von 2025.'
  - 's. 59: Verwaltungsgeldbussen bis 10 % des Jahresumsatzes, bei Wiederholung bis 25 %.'
  - 's. 73A: persönliche Strafbarkeit von Geschäftsleitern bei Kartellabsprachen.'
  - 'BEFUND: Südafrika hat KI-Entwicklern über das Kartellrecht Pflichten auferlegt, bevor es eine KI-Politik
    hatte. Der Grund ist institutionell: Die Competition Commission verfügt über ein Instrument, das ohne
    Gesetzgeber auskommt, während das DCDT einen Kabinettsbeschluss braucht.'
