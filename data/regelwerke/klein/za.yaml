    verifiziert: true
    notiz: Sekundärquelle. Belegt Berichtsdatum 13.11.2025, die Zahlen zum Google-Paket (114 Mio. ZAR
      über drei Jahre plus 71 Mio. ZAR jährlich) und die Feststellung, dass KI-Unternehmen 'scant interest'
      an Verträgen mit südafrikanischen Verlegern zeigen.
  - datum: 2025-12-09
    typ: stellungnahme
    titel: A Pragmatic Win, Not a Structural Fix, in South Africa's Deal with Big Tech
    url: https://www.techpolicy.press/a-pragmatic-win-not-a-structural-fix-in-south-africas-deal-with-big-tech/
    sprache: en
    urheber: Tech Policy Press
    verifiziert: true
    notiz: 'Die schärfste Kritik: Die Massnahmen schaffen kein Lizenz- oder Vergütungsregime für Trainingsdaten
      und lassen damit ''a structural gap''. Belegt ausserdem die dynamische Erstreckungspflicht für Google
      (EU- oder US-Strukturmassnahmen binnen sechs Monaten).'
  offene_punkte:
  - Ob und wie die Opt-out-Pflichten durchgesetzt werden, ist offen; der Bericht nennt keine Fristen für
    die laufende Erfüllung.
  - Welche KI-Unternehmen namentlich gebunden sind, ist aus den öffentlichen Fassungen nicht abschliessend
    zu entnehmen; genannt werden Google (Gemini), OpenAI (ChatGPT) und Meta.
  - Ob die Massnahmen auf s. 43C Competition Act gestützt oder vertraglich vereinbart sind, ist nicht
    eindeutig belegt — davon hängt ab, ob ein Verstoss eine Geldbusse oder nur eine Vertragsverletzung
    auslöst.
  - 'Verhältnis zur geplanten Fair-Use-Klausel des Copyright Amendment Bill ungeklärt: Ein gesetzliches
    Fair Use könnte die kartellrechtlich erzwungenen Opt-outs entwerten.'
