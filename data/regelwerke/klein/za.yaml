- id: za-mdpmi-2025
  jurisdiktion: za
  kurztitel: Media and Digital Platforms Market Inquiry (MDPMI)
  offizieller_titel: 'Media and Digital Platforms Market Inquiry: Final Report'
  fundstelle: Competition Commission South Africa, Abschlussbericht vom 13. November 2025; Verfahren nach
    Kapitel 4A Competition Act 89 of 1998
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Abschlussbericht vom 13.11.2025. Kapitel 5 behandelt generative KI und stellt fest,
    dass KI-Entwickler südafrikanische Nachrichteninhalte ohne Vereinbarung, Vergütung oder Nennung zum
    Training ihrer Modelle genutzt haben und dass Inhalte lizenzierter Anbieter in KI-Zusammenfassungen
    bevorzugt werden. Die Abhilfemassnahmen verpflichten KI-Unternehmen, südafrikanischen Medien dieselben
    Inhaltekontrollen und Opt-out-Mechanismen einzuräumen wie in der Europäischen Union, und halbjährliche
    Schulungen anzubieten. Google zahlt ein Medienpaket im Wert von 688 Mio. ZAR und muss EU-äquivalente
    Transparenz- und Selbstbevorzugungsverbote in Südafrika umsetzen sowie künftige EU- oder US-Strukturmassnahmen
    binnen sechs Monaten erstrecken. Die Beteiligten haben den Massnahmen weitgehend zugestimmt.

    '
  kurzbeschreibung: 'Die erste Marktuntersuchung der Welt, in der eine Wettbewerbsbehörde KI-Entwicklern
    verbindliche Pflichten gegenüber Presseverlegern auferlegt hat. Eingeleitet am 17.10.2023, vorläufiger
    Bericht November 2024, Abschlussbericht 13.11.2025. Untersucht wurden Suchmaschinen, soziale Netzwerke,
    Videoplattformen und generative KI-Dienste in ihrem Verhältnis zu südafrikanischen Nachrichtenmedien.
    Der Befund zur KI: KI-Entwickler zeigen ''scant interest'' an Lizenzverträgen mit südafrikanischen
    Verlegern und schliessen solche nur mit grossen globalen Medienhäusern; die Inhalte der Lizenznehmer
    werden in KI-Antworten bevorzugt, was südafrikanische Verleger doppelt benachteiligt. Abhilfemassnahmen:
    gleichwertige Inhaltekontrollen und Opt-out-Mechanismen wie in der EU (einschliesslich der Möglichkeit,
    Training und Zusammenfassung getrennt zu blockieren), halbjährliche Schulungen zum Aufbau eines funktionierenden
    Lizenzmarktes, kollektive Vermarktung für kleinere Verleger; für Google zusätzlich EU-äquivalente
    Transparenz und Selbstbevorzugungsverbote und ein Medienpaket von 688 Mio. ZAR (davon 114 Mio. ZAR
    über drei Jahre und 71 Mio. ZAR jährlich für Showcase-Verträge). Ausdrücklich NICHT geschaffen wurde
    ein Vergütungs- oder Lizenzregime für Trainingsdaten — die strukturelle Lücke bleibt.

    '
