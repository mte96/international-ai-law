  regelungsschwerpunkte:
  - 'Registrierungssystem: ''South Africa is a non-examining country with regard to the content of a patent
    specification'' (Chambers, Patent Litigation 2026). Erteilt wird, wenn die Formalien stimmen; Neuheit
    und erfinderische Tätigkeit werden erst im Streitfall geprüft.'
  - 'Experiential Learning Programme: freiwillige, gebührenfreie Recherche und materielle Prüfung durch
    Prüferanwärter. Ergebnis ist ein objektiver Prüfbericht des Patentamts, an den keine Rechtsfolge geknüpft
    ist.'
  - 'Ausweitung vom 19.02.2026: bis dahin waren national originierende vollständige Anmeldungen vom Programm
    ausgeschlossen; seither können sie einbezogen werden.'
  - 'Angekündigte SSE nach dem Patents Bill: gestufte materielle Prüfung in ausgewählten technischen Gebieten
    (Chemie, Biochemie, IKT, Physik, Ingenieurwesen), Veröffentlichung der Anmeldung mit der Möglichkeit
    von Einwendungen Dritter, Prüfungsantrag innerhalb einer Frist.'
  - 'PRAKTISCHE FOLGE FÜR KI: Solange die Formalprüfung gilt, kann jede Anmeldung eine Maschine als Erfinderin
    benennen. Umgekehrt gilt: Ein südafrikanisches Patent beweist nichts über die materielle Schutzfähigkeit
    — die DABUS-Erteilung ist deshalb kein Präjudiz für die Erfinderfähigkeit von Maschinen, sondern ein
    Beleg für die Prüfungslücke.'
