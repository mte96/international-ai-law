- id: za-ocj-draft-ai-policy
  jurisdiktion: za
  kurztitel: Entwurf einer KI-Richtlinie für die Judiciary
  offizieller_titel: Draft Policy on Artificial Intelligence for the Judiciary in South Africa (Arbeitstitel;
    amtliche Bezeichnung nicht ermittelt)
  fundstelle: Nicht veröffentlicht; Inhalt bekannt aus der Berichterstattung vom 08.05.2026
  verfahrensnummer: ''
  status: entwurf
  status_detail: 'Entwurf des Office of the Chief Justice, im Mai 2026 aus der Berichterstattung bekannt
    geworden, bis zum 06.09.2026 nicht förmlich veröffentlicht. Die Portalsuche auf judiciary.org.za nach
    ''artificial'' liefert null Treffer. Der Entwurf ist inhaltlich detailliert und geht über die britischen
    Judicial Guidance-Papiere hinaus: Er enthält einen Katalog verbotener Verwendungen, eine Offenlegungspflicht
    für Richterinnen und Richter, eine Aussetzungsklausel für nicht erklärbare Systeme und eine Disziplinardrohung.

    '
  kurzbeschreibung: 'Erste Regelung des KI-Einsatzes durch die südafrikanische Justiz selbst. Sie bindet
    KI-Systeme als blosse Hilfsmittel: Sie dürfen richterliches Denken, Ermessen und Entscheiden nicht
    ersetzen. Ausdrücklich untersagt sind Beweiswürdigung, Beurteilung der Glaubwürdigkeit von Zeugen,
    Auslegung und Anwendung des Rechts, das Treffen richterlicher Entscheidungen sowie Entscheidungen
    über Kaution, Strafzumessung und Risikoprognosen. Zulässig sind Verwaltungsaufgaben — Terminierung,
    Verfahrenssteuerung, Zusammenfassung von Dokumenten, Übersetzung, Sprache, Stil, Formatierung und
    die Vorbereitung nicht inhaltlicher Unterlagen —, jeweils unter menschlicher Aufsicht und mit Überprüfung.
    Hinzu treten eine Offenlegungspflicht (''Judicial officers must disclose any material contribution
    of generative AI in court documents, specifying the AI tool used and its contribution''), eine Verifikationspflicht
    gegen autoritative Quellen, Datenschutz- und Vertraulichkeitsanforderungen einschliesslich POPIA sowie
    ein Erklärbarkeitsgebot mit der Sanktion, dass Systeme, die es nicht erfüllen, ausgesetzt werden.
    Vor der Nutzung ist eine Schulung über Grenzen und Risiken einschliesslich Verzerrung und Halluzination
    Pflicht; Systeme müssen vor der Einführung Erklärbarkeit, Datenschutzkonformität, Verzerrungsprüfung,
    Pilotbetrieb und Datenschutz-Folgenabschätzung durchlaufen. Verstösse können disziplinarische Folgen
    haben. Überprüfung mindestens alle zwei Jahre.

    '
