  - datum: 2026-07-01
    typ: stellungnahme
    titel: 'Long walk to copyright reform #12: The Constitutional Court clarifies the constitutional anatomy
      of South Africa''s copyright exceptions'
    url: https://ipkitten.blogspot.com/2026/07/guest-post-long-walk-to-copyright.html
    sprache: en
    urheber: The IPKat (Gastbeitrag)
    verifiziert: true
    notiz: 'Die genaueste verfügbare Auswertung von ZACC 26. Belegt, dass die Corte die Bezeichnung ''fair
      use'' gegenüber ''fair dealing'' für nachrangig hält, dass die offene Zweckliste über die ejusdem-generis-Regel
      eingehegt bleibt und dass das Parlament nun drei Wege hat: Streichung, Neufassung des s. 12D oder
      Teilreform. Stellt ausdrücklich fest, dass das Urteil selbst KI und TDM nicht behandelt.'
  - datum: 2019-03-01
    typ: stellungnahme
    titel: The proposed fair use exception under South Africa's Copyright Amendment Bill
    url: https://ipkitten.blogspot.com/2019/03/the-proposed-fair-use-exception-under.html
    sprache: en
    urheber: The IPKat
    verifiziert: true
    notiz: Aus diesem Beitrag stammt der Wortlaut der vier Abwägungsfaktoren des s. 12A(b) und der Hinweis
      auf die Quellenangabepflicht in s. 12A(c).
  offene_punkte:
  - Der Entwurf ist nicht Gesetz. Wann und in welcher Fassung das Parlament s. 12D neu fasst, ist offen;
    der Beobachtungspunkt ist das Portfolio Committee on Trade, Industry and Competition.
  - 'Ob die Fair-Use-Klausel Trainingskopien deckt, ist eine Auslegungsfrage, die niemand gestellt hat.
    Weder das Parlament noch das Verfassungsgericht haben KI erwähnt. Genau darin liegt die rechtspolitische
    Sprengkraft: Südafrika bekäme eine Fair-Use-Klausel ohne jede Debatte über ihre wichtigste Anwendung.'
  - 'Verhältnis zu den Empfehlungen der Competition Commission (MDPMI): Die Wettbewerbsbehörde hat 2025
    eine Opt-out-Lösung für KI-Training verordnet, während der Gesetzgeber eine Schranke plant, die Opt-outs
    gerade überspielen könnte. Diese Kollision ist in keiner Quelle angesprochen.'
  - Der Volltext der Fassung B13B-2017 beziehungsweise B13D-2017 wurde nicht abgerufen; der Wortlaut des
    s. 12A stammt aus der Auswertung von 2019 und kann von der zuletzt beschlossenen Fassung abweichen.
