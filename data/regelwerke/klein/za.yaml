  - Erste umfassende Erhebung zum KI-Einsatz im südafrikanischen Finanzsektor, getragen von zwei Aufsichtsbehörden
    gemeinsam.
  - 'Erfasste Techniken: maschinelles Lernen und generative KI.'
  - 'Aufsichtsthemen: Modellrisiko, Erklärbarkeit, faire Kundenbehandlung, Auslagerung, Konzentrationsrisiko,
    Datenschutz nach POPIA, Schutz von Modellen und Trainingsdaten als Geschäftsgeheimnis.'
  - KEINE NEUEN PFLICHTEN. Der Bericht ist Diagnose, nicht Regulierung. Wer in Südafrika ein KI-System
    im Finanzsektor betreibt, unterliegt weiterhin nur dem allgemeinen Aufsichtsrecht.
