- id: za-copyright-act-1978
  jurisdiktion: za
  kurztitel: Copyright Act 98 of 1978
  offizieller_titel: Copyright Act, 1978 (Act No. 98 of 1978)
  fundstelle: Act No. 98 of 1978, angenommen am 20.06.1978; zuletzt geändert durch den Copyright Amendment
    Act 9 of 2002
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Geltendes Urheberrecht. Es enthält seit der Novelle von 1992 eine ausdrückliche Regelung
    computererzeugter Werke: Nach der Definition von ''author'' in s. 1(1) ist Urheber eines literarischen,
    dramatischen, musikalischen oder künstlerischen Werks oder Computerprogramms, das computererzeugt
    ist, ''the person by whom the arrangements necessary for the creation of the work were undertaken''.
    Südafrika gehört damit zu der kleinen Gruppe von Staaten (mit dem Vereinigten Königreich, Irland,
    Neuseeland, Indien und Hongkong), die computererzeugte Werke ausdrücklich schützen. Eine Schranke
    für Text- und Data-Mining kennt das Gesetz nicht; sie soll erst mit dem Copyright Amendment Bill kommen.

    '
  kurzbeschreibung: 'Das Urheberrechtsgesetz von 1978 schützt literarische, musikalische und künstlerische
    Werke, Filme, Tonaufnahmen, Sendungen, programmtragende Signale, veröffentlichte Ausgaben und — seit
    1992 als eigene Werkart — Computerprogramme. Schutzvoraussetzung ist nach s. 2(1) Originalität und
    nach s. 2(2) die Festlegung in materieller Form, wobei der Wortlaut seit 1992 ausdrücklich ''represented
    in digital data or signals'' einschliesst. Urheber ist grundsätzlich, wer das Werk schafft; für computererzeugte
    Werke bestimmt s. 1(1) abweichend denjenigen, der die für die Schaffung notwendigen Vorkehrungen getroffen
    hat. Die Rechtsinhaberschaft regelt s. 21: Grundsätzlich der Urheber (s. 21(1)(a)), abweichend bei
    Zeitungsangestellten (b), bei bestimmten Auftragswerken — Fotografie, Porträt, Film, Tonaufnahme —
    (c) und bei Arbeitnehmerwerken (d). Schranken enthält s. 12 (fair dealing für Forschung, Privatgebrauch,
    Kritik, Rezension und Berichterstattung über Tagesereignisse) — ein geschlossener Katalog, der KI-Training
    nicht deckt. Sanktionen sind zivilrechtlich (Unterlassung, Schadensersatz, Gewinnabschöpfung nach
    s. 24) und strafrechtlich (s. 27).

    '
  inkrafttreten:
    datum: 1979-01-01
    verifiziert: true
    quelle: https://www.wipo.int/wipolex/en/text/130429
    fundstelle_norm: 'Amtlicher Gesetzeskopf: ''COPYRIGHT ACT 98 OF 1978 [ASSENTED TO 20 JUNE 1978] [DATE
      OF COMMENCEMENT: 1 JANUARY 1979]'''
  anwendungsdaten:
  - datum: 1992-01-01
    was_gilt: 'Der Copyright Amendment Act 125 of 1992 fügt Computerprogramme als eigene Werkart ein und
      ergänzt die Definition von ''author'' um die Absätze zu computererzeugten Werken und zu Computerprogrammen.

      '
    verifiziert: false
    quelle: https://www.saflii.org/za/legis/consol_act/ca1978133/
  themenachsen:
  - urheberrecht
  - content
  - vertrag
  regelungsschwerpunkte:
  - 's. 1(1), Definition ''author'', Abs. (h): Urheber eines ''literary, dramatic, musical or artistic
    work or computer program which is computer-generated'' ist ''the person by whom the arrangements necessary
    for the creation of the work were undertaken''. Das ist die südafrikanische Zuweisungsnorm für maschinell
    erzeugte Werke — nicht s. 21(1)(d), wie gelegentlich zitiert wird.'
  - 's. 1(1), Definition ''author'', Abs. (i): Urheber eines Computerprogramms ist ''the person who exercised
    control over the making of the computer program''.'
  - 's. 1(1), Definition ''computer program'': ''a set of instructions fixed or stored in any manner and
    which, when used directly or indirectly in a computer, directs its operation to bring about a result''.'
  - 'BEFUND ZUR BEGRIFFSBILDUNG: Anders als s. 178 UK CDPA 1988 (''computer-generated, in relation to
    a work, means that the work is generated by computer in circumstances such that there is no human
    author of the work'') definiert der südafrikanische Copyright Act den Begriff ''computer-generated''
    NICHT. Er verwendet ihn nur in der Autorendefinition. Ob damit auch Werke ohne jeden menschlichen
    Urheber erfasst sind oder nur solche mit maschineller Ausführung menschlicher Vorgaben, ist offen.'
  - 's. 2(1): Werkarten, einschliesslich Computerprogramme. s. 2(2): ''A work ... shall not be eligible
    for copyright unless the work has been written down, recorded, represented in digital data or signals
    or otherwise reduced to material form.'''
  - 's. 2(2) i.V.m. der Originalitätsanforderung: Nach südafrikanischer Rechtsprechung verlangt Originalität
    eigenes Können und eigene Arbeit (''skill, effort and intellectual judgment''). Die Praxis leitet
    daraus ab, dass eine blosse Prompteingabe mit oberflächlicher Nachbearbeitung die Schwelle nicht erreicht
    — mit der Folge, dass die Autorenzuweisung des s. 1(1)(h) leerläuft, weil bereits kein schutzfähiges
    Werk vorliegt. Dieser innere Widerspruch zwischen ausdrücklichem Schutz und Originalitätserfordernis
    ist die zentrale offene Frage des südafrikanischen KI-Urheberrechts.'
  - 's. 12: fair dealing als geschlossener Katalog (Forschung, Privatstudium, Privatgebrauch, Kritik,
    Rezension, Berichterstattung über Tagesereignisse) mit Quellenangabepflicht. Kein Auffangtatbestand
    — Trainingskopien sind davon nicht gedeckt.'
  - 's. 21(1): (a) Urheber; (b) Werke von Zeitungsangestellten; (c) bestimmte Auftragswerke (Fotografie,
    Porträt, Film, Tonaufnahme) gegen Entgelt; (d) Arbeitnehmerwerke im Rahmen des Arbeitsverhältnisses.
    HINWEIS: s. 21(1)(d) ist die Arbeitnehmerregel, NICHT die Regel für computererzeugte Werke.'
  - 's. 24, s. 27: zivil- und strafrechtliche Sanktionen.'
  - 'LÜCKE: keine TDM-Schranke, keine Regelung zur Transparenz von Trainingsdaten, kein Leistungsschutzrecht
    für Presseverleger. Diese Lücke ist der Grund, aus dem die Competition Commission die KI-Frage 2025
    im Wettbewerbsrecht statt im Urheberrecht behandelt hat.'
