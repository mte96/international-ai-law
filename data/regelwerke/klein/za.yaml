- id: za-films-publications-act
  jurisdiktion: za
  kurztitel: Films and Publications Act 65 of 1996 (i.d.F. des Act 11 of 2019)
  offizieller_titel: Films and Publications Act, 1996 (Act No. 65 of 1996), as amended by the Films and
    Publications Amendment Act, 2019 (Act No. 11 of 2019)
  fundstelle: Act No. 65 of 1996; Änderungsgesetz Act No. 11 of 2019, angenommen am 19.09.2019, Government
    Gazette No. 42743 vom 03.10.2019
  verfahrensnummer: B37B-2015 (Änderungsgesetz)
  status: anwendbar
  status_detail: 'Das Änderungsgesetz 11 of 2019 ist am 01.03.2022 in Kraft getreten. Es hat mit s. 18F
    erstmals einen Straftatbestand für die nicht einvernehmliche Verbreitung privater sexueller Aufnahmen
    geschaffen — im südafrikanischen Sprachgebrauch ''revenge porn''. Der Tatbestand ist technikneutral
    formuliert und erfasst deshalb auch synthetische Aufnahmen, verlangt aber Schädigungsabsicht. Das
    ist die praktisch wichtigste Deepfake-Norm Südafrikas; ein Bezug auf künstliche Intelligenz fehlt
    im Gesetzestext.

    '
  kurzbeschreibung: 'Das Films and Publications Act regelt Klassifizierung und Verbreitung von Filmen,
    Spielen und Publikationen und errichtet das Film and Publication Board. Die Novelle von 2019 hat es
    zu einem Online-Content-Gesetz ausgebaut: Sie unterwirft kommerzielle Onlinediensteanbieter der Klassifizierungspflicht,
    schafft Straftatbestände für die Verbreitung von Filmen und Fotografien, die sexuelle Gewalt oder
    Vergewaltigung zeigen (s. 18C), von Aufnahmen der Bewusstlosigkeit oder Hilflosigkeit (s. 18D) und
    von Hassrede (s. 18E) und verbietet in s. 18F die Verbreitung privater sexueller Aufnahmen ohne Einwilligung
    des Abgebildeten und in Schädigungsabsicht. Adressaten sind alle Personen einschliesslich Diensteanbieter;
    s. 18F(6) verpflichtet Internetdiensteanbieter, dem Board oder der Polizei auf Verlangen die Identität
    des Veröffentlichers mitzuteilen. Sanktion ist nach s. 24E eine Geldstrafe bis 150.000 ZAR oder Freiheitsstrafe
    bis zwei Jahre; wird das Opfer identifizierbar dargestellt, verdoppelt sich der Rahmen.

    '
  inkrafttreten:
    datum: 1998-06-01
    verifiziert: true
    quelle: https://powerlaw.africa/wp-content/uploads/2021/06/4.-Films-and-Publications-Act-65-of-1996.pdf
    fundstelle_norm: 'Amtlicher Gesetzeskopf des Films and Publications Act 65 of 1996: ''[ASSENTED TO
      30 OCTOBER, 1996] [DATE OF COMMENCEMENT: 1 JUNE, 1998]'''
  anwendungsdaten:
  - datum: 2022-03-01
    was_gilt: Films and Publications Amendment Act 11 of 2019 — darunter s. 18F (nicht einvernehmliche
      Verbreitung privater sexueller Aufnahmen), die praktisch wichtigste Deepfake-Norm Suedafrikas; Proclamation
      No. 52 of 2022, GG 45959
    verifiziert: true
    quelle: https://www.gov.za/documents/notices/films-and-publications-amendment-act-commencement-1-march-2022-english-afrikaans
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 's. 18F(1): ''No person may expose, through any medium, including the internet'' eine private sexuelle
    Aufnahme ''without the consent of the individual'' und ''with the intention of causing that individual
    harm''. Der Tatbestand ist technikneutral und deckt deshalb auch synthetische Aufnahmen; er verlangt
    aber Schädigungsabsicht — die zentrale Schwachstelle bei kommerziell motivierten Deepfakes.'
  - 's. 18F(2): Rechtfertigungsgrund, wenn die Offenlegung zur Verhütung oder Aufklärung von Straftaten
    vernünftigerweise erforderlich war.'
  - 's. 18F(4): Eine Aufnahme ist ''privat'', wenn sie nach den Umständen nicht für die Öffentlichkeit
    bestimmt war.'
  - 's. 18F(5): ''sexuell'' ist eine Aufnahme, die entblösste Intimbereiche zeigt oder die eine vernünftige
    Person als sexuell einordnen würde.'
  - 's. 18F(6): Auskunftspflicht der Internetdiensteanbieter über die Identität des Veröffentlichers gegenüber
    Board oder Polizei.'
  - 's. 18C, 18D, 18E: Verbreitung von Darstellungen sexueller Gewalt, von Aufnahmen hilfloser Personen
    und von Hassrede.'
  - 's. 24E: Strafrahmen — bis 150.000 ZAR Geldstrafe oder bis zwei Jahre Freiheitsstrafe; erhöht, wenn
    das Opfer identifizierbar ist.'
  - 'LÜCKE FÜR DEEPFAKES: Erfasst sind nur sexuelle Aufnahmen. Ein Deepfake, der eine Person politische
    Aussagen treffen lässt oder ein gefälschtes Produktversprechen abgibt — die tatsächlich verbreitete
    südafrikanische Fallgruppe (Leanne Manas 2024, Salim Abdool Karim 2025, gefälschte Anlageversprechen)
    — fällt nicht unter s. 18F. Dafür bleiben nur der Cybercrimes Act, POPIA, der Electoral Act, der Protection
    from Harassment Act und die actio iniuriarum des common law.'
  dokumente:
  - datum: 2019-10-03
    typ: endfassung
    titel: Films and Publications Amendment Act 11 of 2019
    url: https://www.ellipsis.co.za/wp-content/uploads/2019/07/Films-and-Publications-Amendment-Act-11-of-2019.pdf
    sprache: en
    urheber: Republic of South Africa (Wiedergabe durch Ellipsis)
    verifiziert: true
    notiz: Abgerufen. Belegt Aktnummer 11 of 2019, Assent 19.09.2019, Gazette 42743 vom 03.10.2019 sowie
      den Wortlaut von s. 18F(1), (2), (4), (5), (6) und den Strafrahmen in s. 24E. Keine amtliche Quelle,
      aber textidentische Wiedergabe der Gazette-Fassung.
  - datum: 2019-06-07
    typ: bericht
    titel: Act will take revenge on porn
    url: https://mg.co.za/news/south-africa/2019-06-07-act-will-take-revenge-on-porn/
    sprache: en
    urheber: Mail & Guardian
    verifiziert: false
    notiz: Zeitgenössische Einordnung der Novelle; nur über die Trefferliste belegt.
  - datum: 2025-09-01
    typ: stellungnahme
    titel: 'Deepfakes and South African law: remedies on paper, gaps in practice'
    url: https://theconversation.com/deepfakes-and-south-african-law-remedies-on-paper-gaps-in-practice-263850
    sprache: en
    urheber: The Conversation (Beitrag südafrikanischer Rechtswissenschaftler)
    verifiziert: false
    notiz: 'Formuliert den Befund, der auch aus der Aktenlage folgt: Südafrika hat Verbote, aber keine
      Durchsetzung. Nur über die Trefferliste belegt.'
  offene_punkte:
  - Kein veröffentlichtes südafrikanisches Urteil zu s. 18F, weder zu echten noch zu synthetischen Aufnahmen.
  - Das Erfordernis der Schädigungsabsicht ('with the intention of causing that individual harm') ist
    in der Literatur als zentrale Schwachstelle kritisiert; für kommerziell motivierte Deepfakes fehlt
    es regelmässig.
  - 'Genaues Inkrafttretensdatum des Änderungsgesetzes nicht am Primärdokument geprüft (Sekundärquelle:
    01.03.2022).'
  monitoring_quellen:
  - https://www.fpb.org.za/
  - https://www.gov.za/documents/acts
  bezug_regelwerke:
  - za-cybercrimes-act-2020
  - za-popia
  - za-performers-protection-amendment-bill
  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - 'DATUM KORRIGIERT/GETRENNT. Eingetragen war 01.03.2022 — das ist das Inkrafttreten des Aenderungsgesetzes
    11 of 2019, nicht des Stammgesetzes. Das Stammgesetz 65 of 1996 ist am 01.06.1998 in Kraft getreten
    (Ausfertigung 30.10.1996). Die KI-relevante Stufe (s. 18F) steht jetzt in anwendungsdaten. Status
    anwendbar bestaetigt. Vorher: 2022-03-01.'
- id: za-cybercrimes-act-2020
  jurisdiktion: za
  kurztitel: Cybercrimes Act 19 of 2020
  offizieller_titel: Cybercrimes Act, 2020 (Act No. 19 of 2020)
  fundstelle: Act No. 19 of 2020; angenommen am 26.05.2021; Government Gazette Vol. 672, No. 44651 vom
    01.06.2021
  verfahrensnummer: B6B-2017
  status: teilanwendbar
  status_detail: 'Der überwiegende Teil des Gesetzes ist am 01.12.2021 in Kraft getreten; einzelne Vorschriften
    (u.a. zur Meldepflicht der Diensteanbieter nach s. 54 und zu Teilen der internationalen Zusammenarbeit)
    sind bis heute nicht in Kraft. Für das KI-Recht sind ss. 14 bis 16 einschlägig: die Straftatbestände
    der schädigenden Datennachricht. s. 16 (Verbreitung einer Datennachricht mit einer intimen Aufnahme
    ohne Einwilligung) ist die zweite Deepfake-Norm neben s. 18F Films and Publications Act und verlangt
    anders als jene keine Schädigungsabsicht.

    '
  kurzbeschreibung: 'Das Cybercrimes Act kodifiziert das südafrikanische Computerstrafrecht. Es stellt
    unbefugten Zugriff, Abfangen von Daten, Bereitstellung von Angriffswerkzeugen, Eingriffe in Daten
    und Systeme, Erlangung von Zugangsdaten, Cyberbetrug, Cyberfälschung, Cybererpressung und den Diebstahl
    unkörperlicher Sachen unter Strafe (ss. 2-11) und ergänzt in ss. 14-16 drei Tatbestände der schädigenden
    Datennachricht. Adressat ist jedermann; Diensteanbieter treffen Melde- und Mitwirkungspflichten. Sanktionen
    reichen bis zu fünfzehn Jahren Freiheitsstrafe (s. 19). Für das KI-Recht ist das Gesetz auf drei Wegen
    relevant: erstens als Deepfake-Norm über s. 16, zweitens als Auffangtatbestand für KI-gestützten Betrug
    (s. 8 Cyberbetrug — der Tatbestand, unter den gefälschte Anlageversprechen mit synthetischen Prominentenvideos
    fallen), drittens als Rahmen für KI-gestützte Angriffswerkzeuge (s. 4).

    '
  inkrafttreten:
    datum: 2021-12-01
    verifiziert: true
    quelle: https://www.justice.gov.za/legislation/notices/2021/20211130-gg45562re11363proc42-CyberCrimes.pdf
    fundstelle_norm: 's. 61(2) Cybercrimes Act 19 of 2020 i. V. m. Proclamation No. R.42 of 2021, GG 45562
      v. 30.11.2021 — in Kraft ab 01.12.2021: Chapter 1; Chapter 2 ohne Part VI; Chapter 3; Chapter 4
      ohne ss. 38(1)(d)-(f), 40(3)-(4), 41-44; Chapter 7; Chapter 8 ohne s. 54; Chapter 9'
  anwendungsdaten:
  - datum: 2021-06-01
    was_gilt: Verkündung in Government Gazette 44651 (Vol. 672); Assent 26.05.2021.
    verifiziert: true
    quelle: https://www.gov.za/sites/default/files/gcis_document/202106/44651gon324.pdf
  - datum: 2021-12-01
    was_gilt: Inkrafttreten des überwiegenden Teils des Gesetzes einschliesslich der Straftatbestände
      ss. 2-16.
    verifiziert: false
    quelle: https://www.ellipsis.co.za/cybercrimes-act-19-of-2020/
  themenachsen:
  - content
  - sicherheit-export
  - haftung
  - grundrechte
  regelungsschwerpunkte:
  - 'ss. 2-11: unbefugter Zugriff (2), unbefugtes Abfangen von Daten (3), unbefugte Handlungen mit Soft-
    oder Hardwarewerkzeugen (4), unbefugter Eingriff in Daten oder Computerprogramme (5), unbefugter Eingriff
    in Speichermedien oder Systeme (6), unbefugte Erlangung von Passwörtern und Zugangscodes (7), Cyberbetrug
    (8), Cyberfälschung und -gebrauch (9), Cybererpressung (10), qualifizierte Fälle (11).'
  - 's. 14: ''Any person who discloses, by means of an electronic communications service, a data message
    to a person, group of persons or the general public with the intention to incite — (a) the causing
    of any damage to property belonging to; or (b) violence against, a person or a group of persons, is
    guilty of an offence.'' Die Norm erfasst KI-erzeugte Aufstachelungsinhalte, ohne sie zu nennen.'
  - 's. 15: rechtswidrige und vorsätzliche Verbreitung einer Datennachricht mit der Drohung von Sachbeschädigung
    oder Gewalt.'
  - 's. 16: ''Any person (''''A'''') who unlawfully and intentionally discloses, by means of an electronic
    communications service, a data message of an intimate image of a person (''''B''''), without the consent
    of B, is guilty of an offence.'' Kein Erfordernis der Schädigungsabsicht — darin liegt der praktische
    Vorteil gegenüber s. 18F Films and Publications Act. Ob eine synthetische Aufnahme ein ''intimate
    image of a person'' ist, wenn die Person die abgebildete Handlung nie vorgenommen hat, ist ungeklärt.'
  - 's. 8 (Cyberbetrug): der Tatbestand, unter den die südafrikanische Deepfake-Praxis tatsächlich fällt
    — gefälschte Videos mit Prominenten zur Bewerbung betrügerischer Anlagen.'
  - 's. 19: Strafrahmen bis fünfzehn Jahre für die schwersten Tatbestände.'
  - 'LÜCKE: Kein Tatbestand der Herstellung oder Verbreitung synthetischer Medien als solcher, keine Kennzeichnungspflicht,
    keine Plattformpflicht zur Entfernung.'
  dokumente:
  - datum: 2021-06-01
    typ: endfassung
    titel: Cybercrimes Act 19 of 2020 (Government Gazette No. 44651, GN 324)
    url: https://www.gov.za/sites/default/files/gcis_document/202106/44651gon324.pdf
    sprache: en
    urheber: Republic of South Africa
    verifiziert: true
    notiz: Amtliche Gazette-Fassung; abgerufen. Belegt Assent 26.05.2021, Gazette 44651 vom 01.06.2021
      sowie den Wortlaut von ss. 14, 15 und 16 und den Katalog der ss. 2-11.
  - datum: 2021-06-01
    typ: uebersicht
    titel: Cybercrimes Act 19 of 2020 — Dokumentenseite der Regierung
    url: https://www.gov.za/documents/acts/cybercrimes-act-19-2020-english-afrikaans-01-jun-2021
    sprache: en
    urheber: Republic of South Africa
    verifiziert: false
    notiz: Amtliche Sammelseite mit englischer und afrikaanser Fassung; nur über die Trefferliste belegt.
  offene_punkte:
  - Ob s. 16 synthetische intime Aufnahmen erfasst, ist ungeklärt. Der Wortlaut spricht von 'an intimate
    image of a person'; ob das Bild echt sein muss, sagt das Gesetz nicht.
  - Kein veröffentlichtes Urteil zu ss. 14-16 mit KI-Bezug.
  - Genaues Inkrafttretensdatum (01.12.2021) nur über Sekundärquelle belegt; die Proklamation wurde nicht
    geprüft.
