- id: za-aoa-ai-guidelines-2025
  jurisdiktion: za
  kurztitel: AoA-Leitlinien zu KI in Schieds- und Adjudikationsverfahren
  offizieller_titel: Guidelines on the Use of Artificial Intelligence (AI) in Arbitrations and Adjudications
  fundstelle: Association of Arbitrators (Southern Africa) NPC, veröffentlicht am 15. Mai 2025
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Verbandsleitlinie ohne Bindungswirkung; sie wirkt, wenn die Parteien sie vereinbaren
    oder das Schiedsgericht sie in einer Verfahrensverfügung übernimmt. Sie ist die erste KI-Regelung
    im südafrikanischen Streitbeilegungsrecht überhaupt — fast ein Jahr vor dem Entwurf der Judiciary.

    '
  kurzbeschreibung: 'Leitlinien des südafrikanischen Schiedsrichterverbandes zum Einsatz künstlicher Intelligenz
    in Schieds- und Adjudikationsverfahren, vom 15.05.2025. Sie verfolgen vier Ziele: den verantwortlichen
    Nutzen von KI zu heben, die Integrität des Verfahrens zu wahren, ethische und rechtliche Risiken zu
    adressieren und internationale wie nationale Anschlussfähigkeit herzustellen. Adressaten sind Parteien
    und Spruchkörper; Sanktionen enthalten sie nicht. Der Verband hat sie mit einer Veranstaltungsreihe
    begleitet (Juli 2025 Technik und KI im Bauwesen, August 2025 Arbeitsabläufe, Oktober 2025 Werkzeuge
    für Adjudikatoren, Dezember 2025 die Leitlinien und KI in der alternativen Streitbeilegung, Mai 2026
    Grenzen bei der Abfassung von Adjudikationsentscheidungen).

    '
