  themenachsen:
  - grundrechte
  - datenschutz
  - urheberrecht
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 's. 9 (Equality): Diskriminierungsverbot, unmittelbar auch gegenüber Privaten (s. 9(4)). Massstab
    jeder algorithmischen Auswahlentscheidung; ausgeführt durch den Promotion of Equality and Prevention
    of Unfair Discrimination Act 4 of 2000.'
  - 's. 14 (Privacy): ''Everyone has the right to privacy, which includes the right not to have — (a)
    their person or home searched; (b) their property searched; (c) their possessions seized; or (d) the
    privacy of their communications infringed.'' Grundlage von POPIA.'
  - 's. 16 (Freedom of expression): Schutzbereich mit ausdrücklichen Ausnahmen für Kriegspropaganda, Gewaltaufstachelung
    und Hassrede (s. 16(2)). Der Gegenpol jeder Deepfake- und Kennzeichnungsregulierung.'
  - 's. 25(1) (Property): ''No one may be deprived of property except in terms of law of general application,
    and no law may permit arbitrary deprivation of property.'' In ZACC 26 der Massstab, an dem die urheberrechtlichen
    Schranken gemessen wurden — mit der ausdrücklichen Feststellung, dass die Entziehung unkörperlichen
    Eigentums geringeren Rechtfertigungsanforderungen unterliegt als die körperlichen Eigentums.'
  - 's. 32 (Access to information): Grundlage des PAIA; für KI relevant als Anspruch auf Offenlegung von
    Entscheidungsgrundlagen der öffentlichen Hand.'
  - 's. 33 (Just administrative action): Anspruch auf rechtmässiges, vernünftiges und verfahrensfaires
    Verwaltungshandeln und auf schriftliche Begründung. Ausgeführt durch PAJA. Die Norm, an der sich vollautomatisierte
    Verwaltungsentscheidungen messen lassen müssen — bislang ohne einschlägige Rechtsprechung.'
  - 's. 34 (Access to courts): Anspruch auf Entscheidung durch ein Gericht ''or, where appropriate, another
    independent and impartial tribunal or forum''. Der Wortlaut lässt offen, ob ein Forum im Sinne dieser
    Norm maschinell gestützt sein darf.'
  - 's. 165 (Judicial authority): ''The judicial authority of the Republic is vested in the courts.''
    s. 165(2): ''The courts are independent and subject only to the Constitution and the law, which they
    must apply impartially and without fear, favour or prejudice.'' Die tragende Norm des Entwurfs der
    KI-Richtlinie der Judiciary.'
  - 's. 79 (Assent to Bills): Das Verfahren, in dem der Präsident einen Gesetzentwurf wegen verfassungsrechtlicher
    Bedenken an das Parlament zurückverweisen und anschliessend nach s. 79(4)(b) dem Verfassungsgericht
    vorlegen kann. Der Weg, auf dem der Copyright Amendment Bill 2024 nach Karlsruher Vorbild zum Verfassungsgericht
    gelangte.'
  - 'LÜCKE: Kein Grundrecht auf Erklärung automatisierter Entscheidungen. Das südafrikanische Gegenstück
    zu Art. 22 DSGVO steht ausschliesslich im einfachen Gesetz (s. 71 POPIA).'
