- id: za-paja-2000
  jurisdiktion: za
  kurztitel: PAJA — Promotion of Administrative Justice Act
  offizieller_titel: Promotion of Administrative Justice Act 3 of 2000
  fundstelle: Act No. 3 of 2000; Government Gazette No. 20853 of 3 February 2000
  verfahrensnummer: B56B-99
  status: anwendbar
  status_detail: 'In Kraft seit 30.11.2000. Das Gesetz führt s. 33 der Verfassung aus. Es kennt den Begriff
    der künstlichen Intelligenz nicht, definiert ''administrative action'' aber als Entscheidung ''by
    an organ of state'' und verlangt in s. 3 und s. 5 Verfahrensfairness und schriftliche Begründung.
    Damit ist PAJA die Norm, an der jede automatisierte Verwaltungsentscheidung in Südafrika zu messen
    wäre. Einschlägige Rechtsprechung zu KI existiert bislang nicht.

    '
  kurzbeschreibung: 'Allgemeines Verwaltungsverfahrens- und Verwaltungsprozessrecht Südafrikas. Es gilt
    für jede ''administrative action'' — jede Entscheidung eines Staatsorgans oder eines Privaten in Ausübung
    hoheitlicher Befugnisse, die unmittelbare rechtliche Wirkung entfaltet. Adressaten sind alle Behörden
    des Bundes, der Provinzen und der Kommunen. PAJA gibt dem Betroffenen Anhörungsrechte (s. 3), einen
    Anspruch auf schriftliche Begründung binnen 90 Tagen (s. 5) und einen Katalog von Aufhebungsgründen
    (s. 6), darunter die Rüge, die Behörde habe ihr Ermessen ''at the behest of another person or body''
    oder unter unzulässiger Bindung ausgeübt (s. 6(2)(e)(iv) und s. 6(2)(f)(ii)). Rechtsfolge eines Verstosses
    ist die gerichtliche Aufhebung (s. 8). Für das KI-Recht ist PAJA deshalb bedeutsam, weil die Delegation
    der Entscheidung an ein Modell dogmatisch als unzulässige Ermessensbindung oder als Entscheidung durch
    einen Unzuständigen einzuordnen wäre — eine Frage, die kein südafrikanisches Gericht bisher entschieden
    hat.

    '
  inkrafttreten:
    datum: 2000-11-30
    verifiziert: true
    quelle: https://justice.gov.za/legislation/acts/2000-003.pdf
    fundstelle_norm: 's. 11 PAJA (Short title and commencement) i. V. m. der Praesidialproklamation; amtlicher
      Kopf des Gesetzes: ''[ASSENTED TO 3 FEBRUARY 2000] [DATE OF COMMENCEMENT: 30 NOVEMBER 2000]'''
  anwendungsdaten:
  - datum: 2002-07-31
    was_gilt: ss. 4 und 10 PAJA (Verwaltungshandeln mit Aussenwirkung gegenueber der Allgemeinheit; Erlass
