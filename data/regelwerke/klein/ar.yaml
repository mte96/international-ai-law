- id: ar-acuerdo-plenario-5435-2025
  jurisdiktion: ar
  provinz: Chubut
  kurztitel: Acuerdo Plenario 5435/2025 — KI-Directivas des STJ Chubut
  offizieller_titel: Acuerdo Plenario N.º 5435/2025 del Superior Tribunal de Justicia de la Provincia
    del Chubut — "Aprueba documento 'Directivas para el Uso Ético y Responsable de Inteligencia Artificial
    Generativa en el Poder Judicial de Chubut'"
  fundstelle: 'Acuerdo STJ Nro./Año 5435/2025, Organismo: Administración General, Fecha de firma 01/04/2025;
    Eureka — Centro de Jurisprudencia y Documentación Jurídica del STJ del Chubut, idDocumento 1D426CB2CE9847A80CEC9C55EC12E2A0
    (5 Seiten). Nicht im Boletín Oficial veröffentlicht ("Publicado en boletín: No").'
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Seit 01.04.2025 in Kraft und geltendes Binnenrecht des Poder Judicial del Chubut. Der
    Superior Tribunal de Justicia hat am 13.03.2026 in "PROV. DEL CHUBUT c/ PAYALEF" ausdrücklich klargestellt,
    dass das Acuerdo zwar Handlungsmassstäbe für Verwaltungs- und Rechtsprechungstätigkeit setzt, aber
    KEINE eigenständigen Nichtigkeitsgründe schafft und das abschliessende Nichtigkeitsregime der Strafprozessordnung
    nicht ändert.
  kurzbeschreibung: 'Erstes und bis heute meistzitiertes argentinisches Justizregelwerk zur generativen
    KI. Es bindet den KI-Einsatz im Poder Judicial del Chubut an wirksame menschliche Kontrolle, kritische
    Überprüfung jedes Ergebnisses, Anonymisierung und Schutz personenbezogener Daten sowie Transparenz
    über den Einsatz dieser Werkzeuge; die Delegation der Entscheidung an ein automatisiertes System ist
    untersagt. Adressat ist das gesamte Personal des Poder Judicial einschliesslich der Richterschaft.
    Sanktion ist keine prozessuale, sondern eine disziplinarische: Der STJ hat die Verletzung des Acuerdo
    am 13.03.2026 ausdrücklich von der Nichtigkeitsfolge entkoppelt. Das Acuerdo ist die Norm, gegen die
    im Verfahren Payalef verstossen wurde — und damit die weltweit erste Justiz-KI-Regel, deren Verletzung
    höchstrichterlich auf ihre prozessualen Folgen hin geprüft worden ist.'
  inkrafttreten:
    datum: 2025-04-01
    verifiziert: true
    quelle: https://apps1cloud.juschubut.gov.ar/Eureka/Acordadas/VistaPublicable?idDocumento=1D426CB2CE9847A80CEC9C55EC12E2A0
  anwendungsdaten:
  - datum: 2025-04-01
    was_gilt: Unterzeichnung ("Fecha de firma") und Genehmigung des Dokuments "Directivas para el Uso
      Ético y Responsable de Inteligencia Artificial Generativa en el Poder Judicial de Chubut" durch
      das Plenum des STJ.
    verifiziert: true
    quelle: https://apps1cloud.juschubut.gov.ar/Eureka/Acordadas/VistaPublicable?idDocumento=1D426CB2CE9847A80CEC9C55EC12E2A0
  - datum: 2025-10-15
    was_gilt: Die Cámara Penal de Esquel stützt die Nichtigerklärung eines Strafurteils erstmals auf einen
      Verstoss gegen die Directivas des Acuerdo 5435/2025.
    verifiziert: true
    quelle: https://www.pensamientopenal.com.ar/fallos/91822-chubut-anulan-fallo-delegacion-jurisdiccional-ia
  - datum: 2026-03-13
    was_gilt: Der STJ Chubut hebt diese Nichtigerklärung auf und stellt fest, das Acuerdo regele "estándares
      de actuación administrativa y jurisdiccional, pero no erige causales autónomas de nulidad ni modifica
      el régimen taxativo y restrictivo previsto en el Código Procesal Penal".
    verifiziert: true
    quelle: https://jusnoticias.juschubut.gov.ar/polemica-por-el-uso-de-ia-el-stj-revirtio-un-fallo-de-camara-y-valido-lo-actuado-por-richeri/
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Gegenstand: generative KI ("inteligencia artificial generativa"), nicht KI schlechthin. Der Zuschnitt
    ist enger als der der späteren Provinzakte (SCBA 2026, MPF 2026), die den gesamten KI-Lebenszyklus
    erfassen.'
  - Wirksame menschliche Kontrolle ("control humano efectivo") als Kernpflicht — vom STJ am 13.03.2026
    als tragender Inhalt des Acuerdo benannt.
  - Kritische Überprüfung jedes KI-Ergebnisses vor Verwendung ("revisión crítica").
  - Anonymisierung und Schutz personenbezogener Daten vor Eingabe in KI-Systeme ("anonimización de datos").
  - Transparenz über den Einsatz der Werkzeuge ("transparencia sobre el empleo de estas herramientas").
  - Verbot der Delegation richterlicher Entscheidungen an automatisierte Systeme. Der STJ hat den Grundsatz
    am 13.03.2026 in die Formel gefasst, KI sei "una herramienta de apoyo y nunca una fuente autónoma
    de decisión".
  - KEINE eigenständige Nichtigkeitsfolge. Das ist die dogmatisch wichtigste Aussage über das Acuerdo
    — sie stammt allerdings nicht aus dem Acuerdo selbst, sondern aus seiner Auslegung durch den STJ am
    13.03.2026.
