- id: ar-proyectos-ia-congreso
  jurisdiktion: ar
  kurztitel: KI-Gesetzentwürfe im argentinischen Kongress (2024-2026)
  offizieller_titel: Proyectos de ley sobre inteligencia artificial en la Honorable Cámara de Diputados
    y el Honorable Senado de la Nación
  fundstelle: 'Cámara de Diputados: Expedientes 4079-D-2024 (Giudici), 3955-D-2024, 3900-D-2024, 3003-D-2024,
    1013-D-2024, Proyecto Gollán ("Marco Normativo y de Desarrollo de los Sistemas de IA", hcdn.gob.ar/proyectos/284321).
    Senado: 1370-S-2024, 1368-S-2024, S-0222/2026. Weitere Entwürfe 2026 (u.a. Brügge, 15.07.2026).'
  verfahrensnummer: Dictamen de mayoría der Comisión de Ciencia, Tecnología e Innovación Productiva vom
    11./12.11.2025 (Vorsitz Daniel Gollán, UxP)
  status: verfahren
  status_detail: Zum 06.09.2026 hat KEIN argentinischer KI-Gesetzentwurf das Plenum erreicht; ein Bundesgesetz
    zur KI existiert nicht. Der weitestgehende Vorgang ist das Mehrheitsgutachten der Comisión de Ciencia,
    Tecnología e Innovación Productiva der Cámara de Diputados vom 11./12.11.2025 zum Entwurf Gollán.
    Die Behandlung im Plenum wurde mehrfach verschoben; die Unternehmerkammer Argencon hat den Entwurf
    öffentlich als "antecedente negativo" bezeichnet, der den KI-Einsatz gefährde. Nach Angaben einer
    Auswertung wurden zwischen 2016 und September 2025 allein 62 Gesetzesinitiativen zu KI und Justiz
    eingebracht, von denen keine Gesetz wurde.
  kurzbeschreibung: 'Argentinien verhandelt seit 2024 über ein horizontales KI-Gesetz. Der Leitentwurf
    (Gollán) folgt strukturell der KI-VO: Risikoklassen mit Verbotskatalog, Betroffenenrechte, eine neue
    Behörde und Sanktionsbefugnisse. Er ist zugleich das Gegenmodell zur Position der Regierung Milei,
    die Regulierung als Standortnachteil ansieht. Die Blockade ist damit nicht technisch, sondern wirtschaftspolitisch.
    Neben dem horizontalen Strang laufen sektorale Vorhaben: Gesichtserkennung (Yeza), Strafrecht und
    Deepfakes (3955-D-2024), ein Observatorium (3900-D-2024) sowie systematische Anpassungen von Zivilrecht,
    Urheberrecht und Datenschutz (1013-D-2024).'
  inkrafttreten: null
  anwendungsdaten:
  - datum: 2025-11-11
    was_gilt: 'Mehrheitsgutachten der Comisión de Ciencia, Tecnología e Innovación Productiva zum Rahmengesetz.
      WIDERSPRUCH: Die amtliche Pressemitteilung der Cámara datiert die Sitzung auf den 11.11.2025, eine
      Fachmeldung auf Dienstag, den 12.11.2025.'
    verifiziert: true
    quelle: https://www.hcdn.gob.ar/prensa/noticia/COMISION-DE-CIENCIA-TECNOLOGIA-E-INNOVACION-PRODUCTIVA-AVANZO-EN-UN-MARCO-REGULATORIO-PARA-LA-IA/
  - datum: 2026-07-15
    was_gilt: Einbringung eines weiteren umfassenden Regulierungsentwurfs (Abgeordneter Brügge) mit Risikoklassifizierung
      und Verbotskatalog.
    verifiziert: false
    quelle: https://www.parlamentario.com/tag/inteligencia-artificial/
  themenachsen:
  - marktzugang
  - governance
  - grundrechte
  - gpai
  - haftung
  - datenschutz
  - content
  regelungsschwerpunkte:
  - 'Entwurf Gollán ("Marco Normativo y de Desarrollo de los Sistemas de IA"), sechs Kapitel: Marco General
    (Art. 1-5), De los Derechos (Art. 6-16), Clasificación de los Sistemas de IA (Art. 17-22), Gobernanza
    (Art. 23-29), Fomento de la Innovación (Art. 30-34), Modificaciones Jurídicas (Art. 35-43).'
  - 'Art. 17 Verbotskatalog: unterschwellige Techniken zur Verhaltensmanipulation; Ausnutzung der Schutzbedürftigkeit
    bestimmter Gruppen; Social Scoring durch staatliche Akteure ohne gesetzliche Grundlage. Struktur und
    Reihenfolge folgen Art. 5 KI-VO.'
  - 'Risikoklassen: inakzeptabel (verboten); hoch (Gesundheit, Justiz, Beschäftigung, Biometrie); begrenzt.'
  - 'Betroffenenrechte: Anspruch auf Erklärung, Anspruch auf menschliche Überprüfung, Auskunfts- und Berichtigungsfristen
    (Höchstfrist 15 Tage).'
  - 'Governance: neue "Agencia de Gestión del Conocimiento" (A.G.C.) als autonome Einrichtung im Innovationsressort,
    mit föderalem Beirat, Direktorium, Exekutivleitung und Fachausschüssen; Zuständigkeiten für Politik,
    technische Standards, Zertifizierung, Audits und Sanktionen.'
  - 'Art. 29 Sanktionen: Geldbussen, Aussetzung, bei schweren Verstössen Untersagung des KI-Einsatzes.'
  - Regulatorisches Sandbox; steuerliche Anreize; Zertifizierungsgebühren.
  - 'Entwurf Giudici (4079-D-2024, verfallen): "Presupuestos mínimos" zur Förderung der KI; Erklärung
    der KI-Entwicklung zum nationalen strategischen Interesse; Verbot diskriminierender biometrischer
    Systeme (Art. 6-7); Kennzeichnungspflicht für KI-generierte Inhalte (Art. 8-9); Förderrat und jährliche
    Evaluierung (Art. 10-12).'
  - 'Gesichtserkennung (Yeza): Rahmen zur Zulassung biometrischer Erkennung für die öffentliche Sicherheit
    mit Folgenabschätzung vor Einsatz, Genehmigungsvorbehalt der AAIP, Verbot der Massenüberwachung und
    der routinemässigen Verfolgung sowie zwingender menschlicher Kontrolle jeder automatisierten Identifizierung.
    Das ist die direkte gesetzgeberische Antwort auf die UIAAS.'
  - 'Weitere Entwürfe: Sapag (Senat) und Gollán mit risikobasierter Klassifizierung und Verbot von Verhaltensmanipulation
    und diskriminierendem Social Scoring; 1013-D-2024 mit systematischen Anpassungen von Zivilrecht, Urheberrecht
    und Datenschutz; 3900-D-2024 Observatorio Federal sobre IA (OFIA); 1370-S-2024 KI in der Bildung;
    1368-S-2024 Rahmen für Forschung und Regulierung.'
