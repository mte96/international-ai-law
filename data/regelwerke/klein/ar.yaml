- id: ar-res-710-2024-uiaas
  jurisdiktion: ar
  kurztitel: Resolución 710/2024 — Unidad de IA Aplicada a la Seguridad (UIAAS)
  offizieller_titel: Resolución N.º 710/2024 del Ministerio de Seguridad — Créase la Unidad de Inteligencia
    Artificial Aplicada a la Seguridad (UIAAS) en el ámbito de la Dirección de Ciberdelito y Asuntos Cibernéticos
  fundstelle: Boletín Oficial de la República Argentina, 29.07.2024, ID 311381; argentina.gob.ar/normativa
    ID 402139; erlassen am 26.07.2024
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Am 26.07.2024 von Ministerin Patricia Bullrich erlassen, am 29.07.2024 verkündet. Der
    einzige KI-Akt der Regierung Milei mit unmittelbarer Grundrechtsrelevanz — und zugleich der einzige,
    der KI nicht begrenzt, sondern für den Staat operativ erschliesst. Zivilgesellschaftliche Organisationen
    halten ihn für unvereinbar mit der Ley de Inteligencia Nacional 25.520 und der Ley 25.326; eine gerichtliche
    Klärung ist im Rahmen dieser Recherche nicht nachweisbar.
  kurzbeschreibung: Die Resolución schafft im Sicherheitsministerium eine KI-Einheit für Prävention, Erkennung,
    Ermittlung und Verfolgung von Straftaten. Zu ihren Aufgaben zählen die Überwachung sozialer Netzwerke
    und des Darknet, Gesichtserkennung und Bildanalyse, Echtzeitauswertung von Überwachungskameras, prädiktive
    Kriminalitätsalgorithmen, Erkennung von Cyberbedrohungen, Identifikation von Finanzbetrug, Drohnenpatrouillen
    und die Koordinierung zwischen den Bundeskräften. Die UIAAS untersteht der Dirección de Ciberdelito
    y Asuntos Cibernéticos und ist mit Vertretern der Bundespolizei und der Sicherheitskräfte besetzt.
    Der Akt zitiert die Ley de Ministerios, die Decisión Administrativa 340/2024 und die Resolución 428/2024,
    NICHT jedoch die Ley 25.326 (Datenschutz), die Ley 25.520 (Nachrichtendienste) oder die Ley 24.059
    (innere Sicherheit) — genau darin liegt der Kern der Kritik.
  inkrafttreten:
    datum: 2024-07-29
    verifiziert: true
    quelle: https://www.boletinoficial.gob.ar/detalleAviso/primera/311381/20240729
  anwendungsdaten:
  - datum: 2024-07-26
    was_gilt: Erlass durch die Ministerin für Sicherheit.
    verifiziert: true
    quelle: https://www.argentina.gob.ar/normativa/nacional/resoluci%C3%B3n-710-2024-402139/texto
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - sicherheit-export
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - 'Aufgabenkatalog des Anexo: Überwachung sozialer Netzwerke und des Darknet; Gesichtserkennung und
    Bildanalyse; Echtzeitauswertung von Überwachungskameras; prädiktive Kriminalitätsalgorithmen; Erkennung
    von Cyberbedrohungen; Aufdeckung von Finanzbetrug; Drohnenpatrouillen; behördenübergreifende Koordinierung.'
  - Der Akt nennt als Rechtsgrundlagen nur die Ley de Ministerios (1992), die Decisión Administrativa
    340/2024 und die Resolución 428/2024 (Ciberpatrullaje-Richtlinien). Weder Ley 25.326 noch Ley 25.520
    noch Ley 24.059 werden zitiert. Für eine Einheit, die biometrische Erkennung und prädiktive Polizeiarbeit
    betreiben soll, ist das die auffälligste Lücke im argentinischen KI-Recht.
  - 'Organisatorisch nachgeordnete Einheit ohne eigene gesetzliche Grundlage: Die UIAAS ist durch Ministerialresolution
    errichtet, nicht durch Gesetz oder Dekret. Das ist der Gegenpol zur europäischen Anforderung einer
    gesetzlichen Grundlage für biometrische Fernidentifizierung (Art. 5 Abs. 1 lit. h, Abs. 2-5 KI-VO).'
  - 'Bemerkenswerter Binnenwiderspruch der argentinischen Bundesorgane: Die Procuración General de la
    Nación stuft in ihren Lineamientos vom 04.09.2026 Echtzeit-Massenüberwachung als "riesgo inaceptable"
    ein und verbietet sie sich selbst, während die Exekutive sie als Aufgabe einer eigenen Einheit definiert.'
