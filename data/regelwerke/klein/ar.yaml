    notiz: Amtliche Wiedergabe der Haftungsvorschriften; Wortlaut der Art. 1757 bis 1759 geprüft. Der
      InfoLEG-Volltext bricht in der abrufbaren Fassung vor Buch III ab.
  offene_punkte:
  - Es gibt bislang keine veröffentlichte argentinische Entscheidung, die Art. 1757 auf einen von einem
    KI-System verursachten Schaden anwendet. Die Anwendung ist Literaturmeinung, nicht Rechtsprechung.
  - Ob ein Softwaresystem "cosa" im Sinne des Art. 1757 ist oder nur über die Alternative "actividad riesgosa"
    erfasst wird, ist in Argentinien ungeklärt und wird unterschiedlich beantwortet.
