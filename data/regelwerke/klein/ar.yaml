    notiz: 'Amtliche Mitteilung des Poder Judicial. Sie nennt die fünf entscheidenden Ministros (Camila
      Banfi Saavedra, Silvia Bustos, Andrés Giacomone, Javier Raidan, Mario Vivas) und referiert die Anforderungen
