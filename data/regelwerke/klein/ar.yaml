      sobre el empleo de estas herramientas".'
  offene_punkte:
  - Volltext und Artikelgliederung des Acuerdo sind nicht erfasst — die Eureka-Oberfläche gibt das PDF
    nicht heraus. Für die Normebene sind die Ziffern deshalb inhaltlich, nicht nach Artikelnummern gebildet.
  - Unklar bleibt, ob das Acuerdo ein förmliches Disziplinarverfahren vorsieht oder nur auf das allgemeine
    Superintendenzrecht verweist. Der gegen Richter Richeri eingeleitete Vorgang lief parallel zum Strafverfahren.
  - Ob der STJ das Acuerdo nach der Entscheidung vom 13.03.2026 nachschärft — etwa um eine ausdrückliche
    Erklärungspflicht im Urteil —, ist offen.
