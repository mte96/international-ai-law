- id: ar-pgn-64-2026
  jurisdiktion: ar
  kurztitel: Resolución PGN 64/2026 — KI-Lineamientos des MPF de la Nación
  offizieller_titel: Resolución PGN N.º 64/2026 — Lineamientos institucionales para el uso e implementación
    de herramientas de inteligencia artificial en el Ministerio Público Fiscal de la Nación
  fundstelle: 'Resolución PGN 64/2026 vom 04.09.2026, Procuración General de la Nación, Buenos Aires;
    Aktenzeichen der Veröffentlichung PGN-0064-2026-001 (32 Seiten). Rechtsgrundlagen: Art. 120 CN, Leyes
    24.946 y 27.148, Resolución PGN 14/2025.'
  verfahrensnummer: PGN-0064-2026-001
  status: anwendbar
  status_detail: Am 04.09.2026 vom interimistischen Procurador General de la Nación Eduardo Casal unterzeichnet
    und für alle Angehörigen des MPF und seiner Kontrollorgane verbindlich gestellt. Zwei Tage vor dem
    Stichtag dieser Erfassung erlassen; der jüngste KI-Rechtsakt Argentiniens.
  kurzbeschreibung: 'Erstes bundesweites KI-Regelwerk einer argentinischen Justizinstitution. Es gilt
    für die gesamte Bundesstaatsanwaltschaft, ordnet den KI-Einsatz einem institutionellen Genehmigungskreislauf
    unter, übernimmt die vierstufige Risikoklassifizierung der KI-VO (inakzeptabel, hoch, begrenzt, minimal)
    und verbietet vorläufig die Eingabe reservierter Informationen, laufender Verfahrensdokumente sowie
    personenbezogener und sensibler Daten in öffentlich zugängliche KI-Modelle. Grundsatz: KI ist ein
    ergänzendes Werkzeug, das die juristische Beurteilung und die Entscheidung über menschliche Konflikte
    nicht ersetzen kann. Sanktionen sind nicht ausdrücklich geregelt; die Bindung erfolgt über die Dienstaufsicht
    und die Unidad de Auditoría Interna.'
  inkrafttreten:
    datum: 2026-09-04
    verifiziert: true
