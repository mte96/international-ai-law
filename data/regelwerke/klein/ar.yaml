  offene_punkte:
  - Ob die Regierung Milei die RIAF fortführt, ist offen. Ein förmlicher Aufhebungsakt ist nicht ersichtlich;
    eine Neufassung ebenfalls nicht.
  - Die Disposición hat keine Aufsichtsbehörde und kein Verfahren — es fehlt jede Durchsetzungsschiene.
