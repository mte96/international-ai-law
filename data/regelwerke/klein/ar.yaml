- id: ar-ley-11723
  jurisdiktion: ar
  kurztitel: Ley 11.723 — Régimen Legal de la Propiedad Intelectual
  offizieller_titel: Ley N.º 11.723 — Régimen Legal de la Propiedad Intelectual
  fundstelle: Ley 11.723, Boletín Oficial 30.09.1933 (Sanktion 26.09.1933); InfoLEG ID 42755. Zahlreiche
    Änderungen, zuletzt u.a. Ley 25.036 (Software), Ley 24.870 (Schutzfrist 70 Jahre), Ley 27.588.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Anwendbar. Kein Text- und Data-Mining-Ausnahmetatbestand, keine Regelung zu KI-generierten
    Erzeugnissen, kein Kennzeichnungsgebot. Argentinien hat damit weder eine TDM-Schranke nach europäischem
    noch eine Fair-Use-Doktrin nach US-amerikanischem Muster.
  kurzbeschreibung: 'Das argentinische Urheberrechtsgesetz von 1933. Es knüpft den Schutz in Art. 1 an
    "producciones científicas, literarias, artísticas o didácticas" und weist das Recht in Art. 4 ausschliesslich
    natürlichen Personen sowie — für Software — dem Arbeitgeber der Programmiererin zu. Ein Werkbegriff
    ohne menschliche Schöpfung ist im Gesetz nicht vorgesehen; die argentinische Lehre leitet daraus ab,
    dass rein KI-generierte Erzeugnisse schutzlos sind. Für das Training fehlt jede Schranke: Es gibt
    keine TDM-Ausnahme, keine Forschungsschranke nach europäischem Zuschnitt und keine Generalklausel.
    Die Strafnorm des Art. 71 verweist auf die Strafdrohung des Art. 172 CP.'
  inkrafttreten:
    datum: 1933-09-30
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/40000-44999/42755/texact.htm
  anwendungsdaten:
  - datum: 1998-11-11
    was_gilt: Ley 25.036 stellt Computerprogramme und Datenbanken ausdrücklich unter den Werkbegriff des
      Art. 1 und weist in Art. 4 lit. d das Recht an im Arbeitsverhältnis geschaffener Software dem Arbeitgeber
      zu.
    verifiziert: false
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/40000-44999/42755/texact.htm
  themenachsen:
  - urheberrecht
  - gpai
  regelungsschwerpunkte:
  - 'Art. 1: offener Werkkatalog ("los escritos de toda naturaleza y extensión ... toda producción científica,
    literaria, artística o didáctica"); seit Ley 25.036 ausdrücklich Computerprogramme und Datenbanken.
    Amtlich geprüft.'
  - 'Art. 2: Verwertungsrechte des Urhebers — verfügen, veröffentlichen, aufführen, darstellen, öffentlich
    ausstellen, veräussern, übersetzen, bearbeiten. Amtlich geprüft.'
  - 'Art. 4: Rechtsinhaberschaft — Urheber, Erben und Rechtsnachfolger, Übersetzer und Bearbeiter, sowie
    für Software der Arbeitgeber. Der Katalog kennt KEINE Zuweisung an einen Systembetreiber oder Auftraggeber;
    genau das ist die argentinische Leerstelle bei KI-Erzeugnissen. Amtlich geprüft.'
  - 'Art. 5: Schutzdauer siebzig Jahre post mortem auctoris. Eine Frist, die an den Tod einer natürlichen
    Person anknüpft, setzt einen menschlichen Urheber voraus — das systematische Argument gegen den Schutz
    KI-generierter Erzeugnisse. Amtlich geprüft.'
  - 'Art. 34: zwanzig Jahre ab Erstveröffentlichung für Fotografien — für KI-generierte Bilder wäre das
    die nächstliegende Analogie, sie ist in Argentinien aber nicht gezogen worden.'
  - 'Art. 71: Verletzungen werden mit der Strafe des Art. 172 Código Penal geahndet. Amtlich geprüft.'
  - KEINE TDM-Schranke, KEINE Fair-Use-Klausel, KEINE Opt-out-Regelung. Wer in Argentinien auf geschützten
    Werken trainiert, kann sich auf keine gesetzliche Ausnahme berufen.
  dokumente:
  - datum: 1933-09-30
    typ: konsolidiert
    titel: Ley 11.723 — Régimen Legal de la Propiedad Intelectual (texto actualizado)
    url: https://servicios.infoleg.gob.ar/infolegInternet/anexos/40000-44999/42755/texact.htm
    sprache: es
