  kurztitel: Resolución AAIP 161/2023 — Programa Nacional Transparencia und KI
  offizieller_titel: Resolución N.º 161/2023 de la Agencia de Acceso a la Información Pública — Créase
    el Programa de Transparencia y Protección de Datos Personales en el uso de la Inteligencia Artificial
  fundstelle: Boletín Oficial N.º 35247 vom 04.09.2023; erlassen am 30.08.2023
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Seit 04.09.2023 in Kraft. Das Programm besteht fort; die AAIP hat es international mehrfach
    präsentiert (zuletzt 2025/2026) und daraus im September 2024 eine Guía für öffentliche und private
    Stellen entwickelt. Vorläufer ist die Resolución AAIP 94/2023 vom 23.05.2023 (Programa de Inteligencia
    Artificial y Gobernanza de Datos).
  kurzbeschreibung: Die argentinische Datenschutz- und Informationsfreiheitsbehörde schafft ein Programm
    zur Analyse, Regulierungsvorbereitung und Stärkung staatlicher Kapazitäten für KI im öffentlichen
    wie im privaten Sektor. Bestandteile sind ein Observatorium der KI-Entwicklungen, eine partizipative
    Governance über multidisziplinäre Beratungsgremien sowie Schulungs- und Best-Practice-Programme zu
    Transparenz und Datenschutz. Grundlage sind die OECD- und UNESCO-Standards. Das Programm ist die einzige
    argentinische KI-Struktur mit einer Behörde dahinter, die auch gegenüber Privaten Befugnisse hat —
    die Durchsetzung läuft aber über die Ley 25.326, nicht über KI-spezifisches Recht.
