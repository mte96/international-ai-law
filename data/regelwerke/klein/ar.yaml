    den Adressatenkreis über die Justiz hinaus auf die Anwaltschaft erstreckt. Die Fassung 2025 ermöglicht
    gerichtliche Ordnungsstrafen und die Abgabe an die Anwaltskammern zur disziplinarischen Behandlung,
    wenn Schriftsätze KI-erfundene Zitate enthalten. Damit ist Río Negro die argentinische Parallele zu
    den US-amerikanischen standing orders und zur mexikanischen Rechtsprechung zum Halluzinationsproblem.
