  fundstelle: 'Politikdokument ohne Verkündung; 2019 vorgestellt, Planungshorizont 2019-2030. Verwandte
    Rechtsakte: Decreto 996/2018 (Agenda Digital Argentina); Resolución 90/2021 der Secretaría de Asuntos
    Estratégicos (Programa de Inteligencia Artificial).'
  verfahrensnummer: ''
  status: softlaw
  status_detail: Nie in eine Rechtsnorm überführt und faktisch aufgegeben. Die Regierung Milei hat keine
    eigene KI-Strategie formuliert; ihre KI-Politik besteht aus Standortpolitik (Rechenzentren, RIGI-Anreize,
    "Argentinien als KI-Pol"), dem Sicherheitsakt Resolución 710/2024 und Personalentscheidungen — im
    August 2026 wurde mit Adriana Baravalle erstmals eine KI-Spezialistin an die Spitze der Secretaría
    de Innovación, Ciencia y Tecnología berufen (Decreto 730/2026, Meldungen vom 13.08.2026). Ein Strategiedokument
    dieser Regierung existiert nicht.
  kurzbeschreibung: 'ArgenIA war der erste lateinamerikanische nationale KI-Plan neben dem kolumbianischen
    und wurde international breit rezipiert (OECD-OPSI, CIPPEC). Er formulierte Ziele zu Talentbildung,
    Daten, Infrastruktur, Anwendung im öffentlichen Sektor und Ethik, blieb aber ein Planungspapier ohne
    Rechtsverbindlichkeit und ohne Umsetzungsinstrument. Für die Rechtsdatenbank ist er vor allem als
    Erklärung dafür wichtig, warum Argentinien 2026 keine Bundes-KI-Politik hat: Die Strategieebene ist
    zwischen zwei Regierungswechseln verlorengegangen, während die Justiz die Regelung an sich gezogen
    hat.'
