    notiz: 'Amtliche Fundstelle in der Eureka-Datenbank des STJ. Der Datensatz weist aus: Tipo de Norma
      "Acuerdo STJ", Organismo "Administración General", Publicable "Sí", Publicado en boletín "No", Fecha
      de firma 01/04/2025, Dokument mit fünf Seiten, Titelzeile "APRUEBA DOCUMENTO ''DIRECTIVAS PARA EL
      USO ÉTICO Y RESPONSABLE DE INTELIGENCIA ARTIFICIAL GENERATIVA EN EL PODER JUDICIAL DE CHUBUT''".
      Der Fliesstext des PDF liess sich mit den verfügbaren Werkzeugen nicht auslesen — die Artikelgliederung
