- id: ar-rionegro-fallos-automatizados
  jurisdiktion: ar
  provinz: Río Negro
  kurztitel: Automatisierte Entscheidungen im Poder Judicial de Río Negro (Prometea-Nachfolge)
  offizieller_titel: Programa de automatización del dictado de sentencias en procesos de apremio fiscal
    del Poder Judicial de la Provincia de Río Negro (Unidades de Procesos Contencioso Administrativos
    de Viedma, General Roca y Cipolletti)
  fundstelle: Kein veröffentlichter Rechtsakt ermittelt. Belegt über die amtliche Nachrichtenstelle des
    Poder Judicial de Río Negro (Comunicación Judicial) und die Berichterstattung von September/ Oktober
    2023.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: In Betrieb seit Dezember 2021 (Viedma), Juni 2022 (General Roca) und September 2022 (Cipolletti).
    Bis September 2023 waren nahezu 6.000 automatisiert erzeugte Entscheidungen gezählt. Eine veröffentlichte
    Rechtsgrundlage — Acordada, Acuerdo oder Resolución — wurde nicht gefunden.
  kurzbeschreibung: 'Das grösste bekannte System automatisierter Entscheidungserzeugung in der argentinischen
    Justiz. In den Unidades de Procesos Contencioso Administrativos prüft das System die Vollständigkeit
    der von der Steuerverwaltung eingereichten Vollstreckungsforderungen, legt die Akte an und erzeugt
    einen Entscheidungsvorschlag; dieser "debe ser verificada y luego firmada" — er ist zu prüfen und
    anschliessend zu unterschreiben. Der Zuschnitt ist bewusst auf standardisierte und repetitive Massenverfahren
    begrenzt. Rechtlich ist das Vorhaben der eigentliche argentinische Testfall für Art. 20 Ley 25.326:
    Die Norm erklärt gerichtliche Entscheidungen, die menschliches Verhalten bewerten und sich allein
    auf automatisierte Datenverarbeitung stützen, für unheilbar nichtig. Der Vorbehalt der Prüfung und
    Unterschrift ist genau die Konstruktion, die diese Folge vermeiden soll — geprüft worden ist sie gerichtlich
    noch nie.'
  inkrafttreten: null
  anwendungsdaten:
  - datum: 2021-12-01
    was_gilt: Beginn in der Unidad de Procesos Contencioso Administrativos de Viedma.
    verifiziert: false
    quelle: https://palabrasdelderecho.com.ar/articulo/4553/Inteligencia-Artificial-El-Poder-Judicial-de-Rio-Negro-dicto-casi-6.000-fallos-con-sistemas-automatizados
  - datum: 2022-06-01
    was_gilt: Ausweitung auf General Roca.
    verifiziert: false
    quelle: https://palabrasdelderecho.com.ar/articulo/4553/Inteligencia-Artificial-El-Poder-Judicial-de-Rio-Negro-dicto-casi-6.000-fallos-con-sistemas-automatizados
  - datum: 2022-09-01
    was_gilt: Ausweitung auf Cipolletti.
    verifiziert: false
    quelle: https://palabrasdelderecho.com.ar/articulo/4553/Inteligencia-Artificial-El-Poder-Judicial-de-Rio-Negro-dicto-casi-6.000-fallos-con-sistemas-automatizados
  themenachsen:
  - sektor-oeffentlich
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Anwendungsbereich: apremios fiscales — Massenverfahren der Steuervollstreckung; ausdrücklich als
    "estandarizadas y repetitivas" beschrieben. Keine Anwendung auf Verfahren mit Beweiswürdigungsbedarf.'
  - 'Kontrollvorbehalt: Das System erzeugt den Entwurf, die Entscheidung ist zu verifizieren und zu unterschreiben.
    Das ist die argentinische Antwort auf Art. 20 Ley 25.326 — ob sie trägt, ist ungeklärt, weil die Vorschrift
    auf die alleinige Stützung auf die automatisierte Verarbeitung abstellt und nicht auf die formale
    Unterschrift.'
  - 'KORREKTUR zum Bestand: Der Eintrag ar-weitere-justizakte-ia bezeichnet die Resolución SC 870/24 der
    Provinz Buenos Aires als "den einzigen argentinischen Justizakt, der eine automatisierte Verfahrenshandlung
    mit Aussenwirkung anordnet". Río Negro betreibt seit Dezember 2021 — also drei Jahre früher — ein
    weitergehendes System, das nicht nur das erste Despacho, sondern den Entscheidungsentwurf selbst erzeugt.
    Der Unterschied liegt in der Form: Buenos Aires hat es normiert, Río Negro hat es eingeführt.'
  dokumente:
  - datum: 2023-09-29
    typ: bericht
    titel: 'Inteligencia Artificial: El Poder Judicial de Río Negro dictó casi 6.000 fallos con sistemas
      automatizados'
    url: https://palabrasdelderecho.com.ar/articulo/4553/Inteligencia-Artificial-El-Poder-Judicial-de-Rio-Negro-dicto-casi-6.000-fallos-con-sistemas-automatizados
    sprache: es
    urheber: Palabras del Derecho (Fachpresse), auf Grundlage von Angaben des Poder Judicial de Río Negro
    verifiziert: true
    notiz: Nennt Einführungsdaten der drei Standorte, Verfahrensart, Umfang und den Kontrollvorbehalt
      ("debe ser verificada y luego firmada"). Die amtliche Mitteilung des Poder Judicial de Río Negro
      war unter der aufgefundenen Adresse nicht mehr abrufbar (404).
  offene_punkte:
  - Es ist kein veröffentlichter Rechtsakt gefunden worden, der das System anordnet oder begrenzt. Das
    ist der auffälligste Befund — das grösste automatisierte Entscheidungssystem der argentinischen Justiz
    läuft ohne veröffentlichte Rechtsgrundlage.
  - Aktuelle Zahlen nach 2023 sind nicht ermittelt.
  - Ob das System jemals am Massstab des Art. 20 Ley 25.326 geprüft worden ist, ist offen; eine einschlägige
    Entscheidung wurde nicht gefunden.
