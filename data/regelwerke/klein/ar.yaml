    was_gilt: Einsetzung des Comité de Estandarización en Inteligencia Artificial des Consejo de la Magistratura
      CABA unter Bezugnahme auf die Res. 206/2025.
    verifiziert: false
    quelle: https://consejo.jusbaires.gob.ar/
  themenachsen:
  - sektor-oeffentlich
  - governance
  - vertrag
  regelungsschwerpunkte:
  - Allgemeine und besondere Leitlinien für den verantwortlichen und nachhaltigen Einsatz von KI und KI-AGENTEN
    — die bislang einzige argentinische Norm, die agentische Systeme ausdrücklich benennt.
  - Ausgangspunkt sind ausweislich des Visto-Teils die internationalen KI-Prinzipien (OECD/UNESCO).
  - Institutionelle Fortführung durch ein Comité de Estandarización (24.09.2025) — Standardisierung statt
    blosser Empfehlung.
