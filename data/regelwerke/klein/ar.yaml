    Buenas Prácticas para el uso de Inteligencia Artificial Generativa
  fundstelle: Acordada 15/2024 vom 01.10.2024; erweiternde Acordada vom 01.10.2025 (Nummer nicht ermittelt).
    Abrufbar über SAIJ (Sistema Argentino de Información Jurídica), Ministerio de Justicia.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Seit 01.10.2024 in Kraft. Am 01.10.2025 hat der STJ Río Negro das Protokoll erweitert
    und für externe Hilfspersonen verbindlich gestellt — damit erstmals in Argentinien mit ausdrücklicher
    Sanktionsandrohung gegenüber der Anwaltschaft für Schriftsätze mit erfundenen Fundstellen oder erfundener
    Rechtsprechung.
