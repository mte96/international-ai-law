- id: ar-scba-reglamento-ia-2026
  jurisdiktion: ar
  provinz: Provincia de Buenos Aires
  kurztitel: SCBA-Reglamento zum verantwortlichen KI-Einsatz (Res. SC 1.719/26)
  offizieller_titel: Reglamento para el Desarrollo y Uso Responsable de la Inteligencia Artificial en
    el Poder Judicial de la Provincia de Buenos Aires, aprobado por Resolución SC 1.719/26 de la Suprema
    Corte de Justicia de la Provincia de Buenos Aires
  fundstelle: 'Resolución SC 1.719/26 (Expte. N.º 3000-21862-2026); Konsultationsverfahren eröffnet durch
    Resolución RP 747/26, ratifiziert durch Resolución SC 2.020/26. Umfang der Vorlage: 45 Seiten.'
  verfahrensnummer: Expte. N.º 3000-21862-2026 (SCBA)
  status: entwurf
  status_detail: Von der Suprema Corte am 23.06.2026 als Projekt beschlossen und zugleich für eine partizipative
    Konsultation vom 24.06. bis 07.08.2026 geöffnet. Bis zur förmlichen Genehmigung hat der Text nach
    eigener Anordnung nur orientierenden, nicht bindenden Charakter. Zum Stichtag 06.09.2026 ist eine
    Endfassung nicht veröffentlicht; das Verfahren ist damit seit Fristablauf einen Monat ohne erkennbaren
    Fortgang.
  kurzbeschreibung: Das mit Abstand ausführlichste argentinische Justizregelwerk zur KI und das einzige,
    das eine ausdrückliche Risikoklassifizierung nach dem Muster der KI-VO in die Justizverwaltung einzieht.
    Es unterscheidet verwaltungsnahe Anwendungen mit geringem Risiko (Dokumentenverwaltung, Terminierung,
    Transkription, Statistik) von rechtsprechungsnahen Hochrisikoanwendungen (Auslegungsunterstützung,
    Beweiswürdigung, Ergebnisprognose), die eine förmliche Genehmigung, eine Algorithmenfolgenabschätzung
    und wiederkehrende Audits verlangen. Verboten sind die vollständige Automatisierung richterlicher
    Entscheidungen, unbeaufsichtigte Systeme, diskriminierende Werkzeuge und die Erzeugung synthetischer
    Beweismittel. Richterinnen und Richter müssen Systemname, Anbieter, Zeitpunkt und Umfang des Einsatzes
    in der Akte dokumentieren. Sanktionen enthält der Text nicht; er wirkt über Genehmigungsvorbehalt,
    Registerpflicht und Audit.
  inkrafttreten: null
