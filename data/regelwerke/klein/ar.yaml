  verfahrensnummer: ''
  status: anwendbar
  status_detail: Anwendbar. Kein KI-spezifischer Straftatbestand. Die Rechtsprechung erfasst KI-generierte
    Missbrauchsdarstellungen über den Begriff der "representación" in Art. 128 (Cámara Penal de Zárate-Campana,
    Juni 2025); für nicht einvernehmliche Deepfake-Pornografie Erwachsener besteht dagegen eine anerkannte
    Strafbarkeitslücke, zu der seit Dezember 2024 mehrere Entwürfe vorliegen.
  kurzbeschreibung: 'Das argentinische Strafgesetzbuch enthält keinen KI-Tatbestand. Für die KI-Praxis
    tragen drei Blöcke: Art. 128 (Darstellungen sexueller Handlungen mit Minderjährigen) in der Fassung
    der Ley 26.388 und der Ley 27.436, den ein argentinisches Berufungsgericht 2025 ausdrücklich auf vollständig
    KI-generierte Bilder erstreckt hat; die durch Ley 26.388 eingefügten Computerdelikte (Art. 153, 153
    bis, 155, 157 bis, 173 Nr. 16, 183, 184, 197, 255); und der Betrugstatbestand des Art. 172 als Auffangnorm
    für KI-gestützte Täuschung. Die nicht einvernehmliche Erstellung sexueller Deepfakes Erwachsener ist
    nicht strafbar.'
  inkrafttreten:
    datum: 1922-04-29
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/15000-19999/16546/norma.htm
    fundstelle_norm: 'DISPOSICIONES COMPLEMENTARIAS, Art. 303: ''El presente código regirá como ley de
      la nación seis meses después de su promulgación.'' Promulgation am 29.10.1921 (Buenos Aires, 29
      de octubre de 1921); sechs Monate spaeter = 29.04.1922'
  anwendungsdaten:
  - datum: 2008-06-25
    was_gilt: Ley 26.388 (Delitos Informáticos) tritt in Kraft und schreibt Art. 128 neu, fügt Art. 153
      bis, 157 bis, 173 Nr. 16 und 183 Abs. 2 ein.
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/140000-144999/141790/norma.htm
  - datum: 2018-04-23
    was_gilt: Ley 27.436 stellt den blossen Besitz von Darstellungen sexueller Handlungen mit Minderjährigen
      unter Strafe (Art. 128 Abs. 5).
    verifiziert: false
    quelle: https://www.argentina.gob.ar/normativa/nacional/ley-11179-16546/actualizacion
  - datum: 2025-06-26
    was_gilt: Die Cámara Penal de Zárate-Campana wendet Art. 128 auf vollständig KI-generierte Missbrauchsdarstellungen
      an; der Einwand, es gebe kein reales Opfer, wird verworfen.
    verifiziert: false
    quelle: https://www.diarioconstitucional.cl/2025/06/27/tribunal-argentino-dictamina-que-pornografia-infantil-generada-con-inteligencia-artificial-tambien-es-delito/
  themenachsen:
  - content
  - grundrechte
  - haftung
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Art. 128: Herstellung, Veröffentlichung, Verbreitung, Beschaffung und Besitz jeder "representación"
    sexueller Handlungen mit oder von Minderjährigen. Der Wortlaut knüpft an die DARSTELLUNG an, nicht
    an ein reales Opfer — genau daran hat die argentinische Rechtsprechung 2025 die Strafbarkeit vollständig
    synthetischer Bilder festgemacht, gestützt zusätzlich auf das Fakultativprotokoll zum Kinderrechtsübereinkommen
    ("reales o simuladas").'
  - 'Art. 153 (Ley 26.388): unbefugtes Öffnen oder Zugreifen auf elektronische Kommunikation.'
  - 'Art. 153 bis (Ley 26.388): unbefugter Zugang zu einem informationstechnischen System.'
  - 'Art. 157 bis (Ley 26.388): unbefugter Zugriff auf eine Datenbank personenbezogener Daten; die strafrechtliche
    Flanke der Ley 25.326.'
  - 'Art. 173 Nr. 16 (Ley 26.388): "defraudación informática" — Vermögensschädigung durch technische Manipulation
    eines Datenverarbeitungssystems. Die einzige argentinische Norm, die Vermögensschäden durch automatisierte
    Vorgänge ohne Täuschung eines Menschen erfasst; für autonome Agentensysteme die dogmatisch interessanteste
    Vorschrift.'
  - 'Art. 183 Abs. 2 (Ley 26.388): Datenveränderung und Einschleusen von Schadprogrammen.'
  - 'LÜCKE: Es fehlt jeder Tatbestand für nicht einvernehmliche sexuelle Deepfakes Erwachsener und für
    Identitätsmissbrauch durch Stimm- oder Bildklonung. Betroffene sind auf den zivilrechtlichen Weg über
    Art. 52 f. CCyC verwiesen. Entwürfe seit Dezember 2024 anhängig.'
