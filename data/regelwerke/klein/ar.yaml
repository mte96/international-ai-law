  regelungsschwerpunkte:
  - 'Art. I: Genehmigung der Lineamientos als Anexo. Art. II: verbindliche Anwendung auf alle Angehörigen.
    Art. III: Verbot der Eingabe reservierter Daten in öffentliche Modelle. Art. IV: dauerhaftes praktisches
    Fortbildungsprogramm. Art. V: Entwicklung eigener, sicherer Werkzeuge. Art. VI: Protokollierung und
    Archivierung.'
  - 'Risikoklassifizierung nach dem Muster der KI-VO: INAKZEPTABLES RISIKO (Massenüberwachung, Verhaltensmanipulation,
    Social Scoring); HOHES RISIKO (biometrische Systeme, Personalauswahl — förmliche Genehmigung erforderlich);
    BEGRENZTES RISIKO (Chatbots, Inhaltsgeneratoren — Transparenzpflicht); MINIMALES RISIKO (Routineanwendungen
    ohne Grundrechtsbezug). Bemerkenswert: eine Staatsanwaltschaft verbietet sich selbst Echtzeit-Massenüberwachung,
    während das Sicherheitsressort der Exekutive mit der UIAAS (Resolución 710/2024) genau darauf hinarbeitet.'
  - Verbot automatisierter Entscheidungen als alleinige Grundlage ("decisiones automatizadas como único
    fundamento").
  - Vorläufiges Verbot, "información reservada o documentos de casos en trámite, datos personales y/o
    sensibles" in öffentlich zugängliche KI-Modelle oder -Werkzeuge wie offene Chatbots einzugeben — bis
    eine künftige Regelung des Einzelgebrauchs ergeht.
  - 'Zehn Leitgrundsätze: Legalität, Gerechtigkeit, öffentlicher Zweck, technologische Governance, bedeutsame
    menschliche Aufsicht ("supervisión humana significativa"), Transparenz, Verhältnismässigkeit, Datenschutz,
    Verlässlichkeit und institutionelle Verantwortlichkeit.'
  - 'Geregelter Lebenszyklus: Bedarfsermittlung — Planung und Risikobewertung — Implementierung — Wartung
    und Aufsicht. Das Programa de IA prüft jede Neuentwicklung und Beschaffung; die Unidad de Auditoría
    Interna übernimmt die nachlaufende Kontrolle.'
  - 'Datenschutz: ausdrückliche Anbindung an die Ley 25.326 für die Verarbeitung sensibler Informationen.'
