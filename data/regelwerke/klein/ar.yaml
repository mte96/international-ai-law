- id: ar-disposicion-2-2023
  jurisdiktion: ar
  kurztitel: Disposición 2/2023 — Recomendaciones para una IA fiable
  offizieller_titel: Disposición N.º 2/2023 de la Subsecretaría de Tecnologías de la Información, Jefatura
    de Gabinete de Ministros — Apruébanse las "Recomendaciones para una Inteligencia Artificial Fiable"
  fundstelle: Boletín Oficial de la República Argentina, 02.06.2023, ID 287679; InfoLEG ID 384656; DI-2023-2-APN-SSTI#JGM
  verfahrensnummer: DI-2023-2-APN-SSTI#JGM
  status: softlaw
  status_detail: Am 01.06.2023 erlassen, am 02.06.2023 im Boletín Oficial veröffentlicht. Nach dem Regierungswechsel
    im Dezember 2023 nicht aufgehoben, aber auch nicht fortentwickelt. Es ist bis heute der einzige KI-spezifische
    Rechtsakt der argentinischen Bundesexekutive mit horizontalem Anspruch — und er bindet nur den öffentlichen
    Sektor.
  kurzbeschreibung: Der Anhang "Recomendaciones para una Inteligencia Artificial Fiable" (RIAF) richtet
    sich ausdrücklich an "quienes forman parte del sector público", gleich ob sie Innovationsprojekte
    leiten, Technologien entwickeln oder extern entwickelte Lösungen einsetzen. Er gliedert den Lebenszyklus
    in vier Phasen — Design und Datenmodellierung, Verifikation und Validierung, Implementierung, Betrieb
    und Wartung — und formuliert für jede Phase Anforderungen an menschliche Aufsicht, Transparenz und
    Erklärbarkeit, Nichtdiskriminierung, Datenschutz, Rechenschaft und Sicherheit. Bezugsrahmen sind die
    UNESCO-Empfehlung zur Ethik der KI (2021) und die OECD-KI-Grundsätze (2019). Sanktionen enthält der
    Akt nicht; er ist reines Verwaltungsinnenrecht ohne Aussenwirkung gegenüber Privaten.
  inkrafttreten:
    datum: 2023-06-02
    verifiziert: true
    quelle: https://www.boletinoficial.gob.ar/detalleAviso/primera/287679/20230602
  anwendungsdaten:
  - datum: 2023-06-01
    was_gilt: Erlass der Disposición durch die Subsecretaría de Tecnologías de la Información.
    verifiziert: true
    quelle: https://www.argentina.gob.ar/normativa/nacional/disposici%C3%B3n-2-2023-384656/texto
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Adressatenkreis ausschliesslich öffentlicher Sektor. Das ist die entscheidende Begrenzung: Argentinien
    hat für private KI-Anbieter bislang keinerlei horizontale Vorgabe.'
  - 'Vierphasiger Lebenszyklus: (1) Diseño y modelado de datos — diverse Teams, ethische Datenpraxis;
    (2) Verificación y validación — Prototypen testen, Bewertungen dokumentieren; (3) Implementación —
    Sicherheit, Auditierbarkeit, Barrierefreiheit; (4) Operación y mantenimiento — laufende Überwachung,
    Vorfallsreaktion.'
  - 'Zurechnungsgrundsatz im Wortlaut sinngemäss: Algorithmen handeln ohne Selbstbestimmung, die Verantwortung
    bleibt bei den Menschen, die sie entwerfen, trainieren und einsetzen. Diese Formel ist der argentinische
    Referenzsatz und taucht in den späteren Justizakten wieder auf.'
  - 'Materielle Grundsätze: menschliche Aufsicht und Entscheidungshoheit, Transparenz und Erklärbarkeit,
    Nichtdiskriminierung und Gleichheit, Datenschutz und Privatheit, Rechenschaftsmechanismen, Sicherheit
    über den gesamten Lebenszyklus.'
  - Anbindung an UNESCO (2021) und OECD (2019) — Argentinien ist beiden Instrumenten beigetreten; die
    Disposición ist ihre nationale Umsetzung im Verwaltungsinnenrecht.
  dokumente:
