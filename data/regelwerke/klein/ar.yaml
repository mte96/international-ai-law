  status_detail: Sammeleintrag für vier weitere Akte, die einzeln nicht die Erfassungstiefe der Hauptregelwerke
    rechtfertigen, für das Bild der Regelungsdichte aber unverzichtbar sind. Zusammen mit Chubut, San
    Luis, Río Negro, San Juan, Neuquén, Santa Fe, CABA, Chaco und der SCBA-Vorlage ergeben sich elf argentinische
    Gerichtsbarkeiten mit eigenen KI-Akten — weltweit die höchste subnationale Regelungsdichte in diesem
    Feld.
  kurzbeschreibung: 'Jujuy: Acordada 31/2025 schafft das Laboratorio de Innovación Judicial (INLAB) und
    genehmigt zugleich das Protocolo para el Uso de la Inteligencia Artificial en el Poder Judicial. La
    Pampa: Acuerdo 3804 übernimmt Empfehlungen der Comisión de Ética des Poder Judicial zum Gebrauch digitaler
    Plattformen (weiter gefasst als KI). Formosa: Acuerdo 3234. Provincia de Buenos Aires: Resolución
    SC 870/24 automatisiert das erste Despacho in Apremios-Verfahren — kein Protokoll, sondern ein Einsatzbeschluss
    und damit der Vorläufer des Reglamento-Entwurfs 2026.'
