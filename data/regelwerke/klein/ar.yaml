- id: ar-cpp-chubut
  jurisdiktion: ar
  provinz: Chubut
  kurztitel: Código Procesal Penal del Chubut (Ley XV N.º 9)
  offizieller_titel: Ley XV N.º 9 — Código Procesal Penal de la Provincia del Chubut
  fundstelle: Ley XV N.º 9 (Digesto Jurídico de la Provincia del Chubut; ursprünglich Ley 5478), einschliesslich
    der Ley de Juicio por Jurados. Amtlicher Text über das Ministerio Público Fiscal del Chubut.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Anwendbar. Massgeblich für das KI-Recht durch die Entscheidung des STJ vom 13.03.2026,
    die das Nichtigkeitsregime der Art. 161 bis 164 gegen die Ableitung von Nichtigkeitsfolgen aus einer
    KI-Richtlinie in Stellung gebracht hat.
  kurzbeschreibung: 'Die Strafprozessordnung der Provinz Chubut. Für das argentinische KI-Recht ist sie
    zur Schlüsselnorm geworden: Der Superior Tribunal de Justicia hat am 13.03.2026 entschieden, dass
    das abschliessende und restriktive Nichtigkeitsregime der Art. 161 bis 164 durch das Acuerdo Plenario
    5435/2025 zum KI-Einsatz nicht erweitert wird. Art. 25 verlangt die Begründung jeder gerichtlichen
    Entscheidung nach den Regeln der sana crítica; Art. 27 stellt die Beratung unter die Sanktion der
    unheilbaren Nichtigkeit und begründet zugleich das Beratungsgeheimnis, aus dem der STJ ableitet, dass
    die verwendeten "insumos" im Urteil nicht anzugeben sind.'
  inkrafttreten:
    datum: 2006-10-31
    verifiziert: false
    quelle: https://www.mpfchubut.gov.ar/images/pdf/Ley_XV_N_9con_31pdf.pdf
  anwendungsdaten: []
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  regelungsschwerpunkte:
  - 'Art. 6: Unparteilichkeit und Unabhängigkeit der Richterschaft in allen Verfahrensabschnitten.'
  - 'Art. 25: Begründungspflicht — jede gerichtliche Entscheidung ist logisch und rechtlich zu begründen,
    unter Angabe des jeder Beweisquelle beigemessenen Werts; Beweiswürdigung nach der sana crítica.'
  - 'Art. 27: Beratungspflicht "bajo sanción de nulidad insanable"; die Beratung ist unmittelbar, fortlaufend
    und unter aktiver Mitwirkung aller Mitglieder zu führen. Aus dem Beratungsgeheimnis leitet der STJ
    ab, dass die verwendeten Hilfsmittel nicht offenzulegen sind.'
  - 'Art. 161 bis 164 (Libro III, Título II — Invalidez de los actos procesales): abschliessendes und
    restriktives Nichtigkeitsregime. Unwirksamkeit nur bei Berührung einer Verfassungsgarantie oder konkretem
    Nachteil (Trascendencia-Grundsatz).'
  dokumente:
  - datum: 2013-09-03
    typ: konsolidiert
    titel: Código Procesal Penal de la Provincia del Chubut y Ley de Juicio por Jurados (Ley XV N.º 9,
      texto actualizado)
    url: https://www.mpfchubut.gov.ar/images/pdf/Ley_XV_N_9con_31pdf.pdf
    sprache: es
    urheber: Ministerio Público Fiscal de la Provincia del Chubut
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung; Art. 6, 25 und 27 im Wortlaut geprüft. Der Wortlaut der Art.
      161 bis 164 war im abrufbaren Teil nicht enthalten — die Zuordnung zu Libro III, Título II "Invalidez
      de los Actos Procesales" ist am Inhaltsverzeichnis geprüft.
  offene_punkte:
  - Der Wortlaut der Art. 161 bis 164 ist nicht am amtlichen Text geprüft.
  - 'Inkrafttreten nicht belegbar: Versucht: mpfchubut.gov.ar (konsolidierter Digesto-Text der Ley XV
    N.º 9 — enthaelt die Uebergangs- und Inkrafttretensbestimmungen der Ursprungsfassung Ley 5478 nicht
    mehr, weil der Digesto sie konsolidiert hat) und juschubut.gov.ar (PDF nicht abrufbar). Das eingetragene
    Datum 2006-10-31 liess sich nicht am amtlichen Text der Ley 5478 verifizieren.'
  monitoring_quellen:
  - https://www.mpfchubut.gov.ar/
  - https://www.juschubut.gov.ar/
  bezug_regelwerke:
  - ar-acuerdo-plenario-5435-2025
  letzte_pruefung: 2026-09-06
- id: ar-const-chubut
  jurisdiktion: ar
  provinz: Chubut
  kurztitel: Constitución de la Provincia del Chubut (Ley V N.º 67)
  offizieller_titel: Constitución de la Provincia del Chubut (Digesto Jurídico, Ley V N.º 67)
  fundstelle: Constitución de la Provincia del Chubut, Fassung 1994; im Digesto Jurídico Provincial als
    Ley V N.º 67 geführt.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Anwendbar. Für das KI-Recht einschlägig über Art. 169 (Begründung gerichtlicher Entscheidungen),
    an dem der STJ die exteriorisierte Begründung misst, und über Art. 178 Nr. 3, auf den der STJ seine
    Befugnis zum Erlass des Acuerdo Plenario 5435/2025 stützt.
  kurzbeschreibung: 'Die Provinzverfassung Chubuts. Zwei Vorschriften tragen das dortige KI-Recht: Art.
    169 ("Resoluciones judiciales. Fundamentación") verlangt die Begründung gerichtlicher Entscheidungen
    und ist der Massstab, an dem der STJ am 13.03.2026 die nach aussen tretende Begründung — und nur sie
    — gemessen hat. Art. 178 Nr. 3 gibt dem Superior Tribunal de Justicia die Befugnis, die Rechtsprechung
    zu organisieren; auf ihn und auf Art. 20 lit. q sowie Art. 22 lit. a, f, g und h der Ley V N.º 174
    stützt sich das Acuerdo Plenario 5435/2025 ausdrücklich.'
