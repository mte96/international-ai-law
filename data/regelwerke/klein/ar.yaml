  - governance
  - grundrechte
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Programm mit drei Säulen: Observatorium, partizipative Governance über multidisziplinäre Beratungsgremien,
    Schulung und Best Practices.'
  - Reichweite ausdrücklich öffentlicher UND privater Sektor — anders als die Disposición 2/2023.
  - Die Guía vom 27.09.2024 adressiert Risiken sowohl bei Systemen zur Personalisierung als auch bei automatisierten
    Entscheidungen und verlangt Sicherheitsmassnahmen für die korrekte Verarbeitung personenbezogener
    Daten.
  - Die AAIP koordiniert seit 2025 die einschlägige Arbeitsgruppe der iberoamerikanischen Datenschutzbehörden
    und leitet das Comité des Übereinkommens 108 (50. Plenarsitzung, 06.07.2026) — der Hebel für die argentinische
    KI-Aufsicht liegt damit datenschutzrechtlich und international, nicht KI-rechtlich und national.
