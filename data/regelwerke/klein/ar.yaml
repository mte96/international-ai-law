- id: ar-ley-25326
  jurisdiktion: ar
  kurztitel: Ley 25.326 — Protección de los Datos Personales
  offizieller_titel: Ley N.º 25.326 de Protección de los Datos Personales (Habeas Data)
  fundstelle: 'Ley 25.326, sancionada 04.10.2000, promulgada parcialmente 30.10.2000 (Decreto 995/2000),
    Boletín Oficial 02.11.2000; Reglamentierung durch Decreto 1558/2001. Aufsichtsbehörde: Agencia de
    Acceso a la Información Pública (AAIP), Ley 27.275.'
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Seit dem Jahr 2000 unverändert in Kraft und damit die älteste noch geltende umfassende
    Datenschutzordnung Lateinamerikas. Sie kennt weder Rechenschaftspflicht noch Privacy by Design, weder
    Datenübertragbarkeit noch ein eigenes Recht gegen automatisierte Einzelentscheidungen nach dem Vorbild
    des Art. 22 DSGVO, und sie verlangt weiterhin die Registrierung von Datenbanken. Argentinien hält
    den Angemessenheitsbeschluss der Kommission von 2003 gleichwohl bis heute. Reformentwürfe liegen seit
    2023 im Kongress.
  kurzbeschreibung: 'Die Ley 25.326 ist der einzige geltende Rechtsrahmen, der KI-Anwendungen in Argentinien
    materiell erfasst — über die Zulässigkeit der Verarbeitung (Art. 5: Rechtmässigkeit nur bei freier,
    ausdrücklicher und informierter Einwilligung), die Zweckbindung, die Betroffenenrechte und die Sanktionsbefugnisse
    der AAIP. Alle argentinischen KI-Akte — die Disposición 2/2023, die AAIP-Programme, das SCBA-Reglamento,
    die Lineamientos PGN 64/2026 — knüpfen ihre Datenschutzanforderungen an dieses Gesetz an. Es ist damit
    die faktische KI-Norm Argentiniens, obwohl es KI nicht erwähnt.'
  inkrafttreten:
    datum: 2000-11-11
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/60000-64999/64790/norma.htm
    fundstelle_norm: 'Die Ley 25.326 enthaelt KEINE Vigencia-Klausel (Art. 44 orden público, Art. 45 Reglamentierungsauftrag,
      Art. 46 disposiciones transitorias, Art. 47 Kreditdatenbanken, Art. 48 ''Comuníquese al Poder Ejecutivo'').
      Es gilt daher Art. 2 des Código Civil (Ley 340 i.d.F. der Ley 16.504): ''Si no designan tiempo,
      serán obligatorias después de los ocho días siguientes al de su publicación oficial.'' Boletín Oficial
      vom 02.11.2000; die acht folgenden Tage laufen vom 03. bis 10.11.2000, verbindlich ab dem 11.11.2000.'
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Art. 5: Verarbeitung nur bei freier, ausdrücklicher und informierter Einwilligung ("consentimiento
    libre, expreso e informado") — der engste Rechtsgrundlagenkatalog der Region und der eigentliche Engpass
    für das Training von Modellen auf argentinischen Daten.'
  - Kein eigenständiges Recht gegen automatisierte Einzelentscheidungen; die argentinische Praxis behilft
    sich mit dem Auskunftsrecht und dem Habeas-Data-Verfahren der Art. 33 ff.
  - Registrierungspflicht für Datenbanken — in den Reformentwürfen gestrichen.
  - Aufsicht durch die AAIP mit Sanktionsbefugnis. Die AAIP ist die einzige argentinische Behörde, die
    gegenüber privaten KI-Anbietern durchgreifen kann; sie tut es bislang nicht KI-spezifisch.
  dokumente:
  - datum: 2000-11-02
    typ: endfassung
    titel: Ley 25.326 — Protección de los Datos Personales
