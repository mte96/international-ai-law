  jurisdiktion: ar
  kurztitel: Ley 26.388 — Delitos Informáticos
  offizieller_titel: Ley N.º 26.388 — Modificación del Código Penal (Delitos Informáticos)
  fundstelle: Ley 26.388, sancionada 04.06.2008, promulgada de hecho 24.06.2008, Boletín Oficial 25.06.2008;
    InfoLEG ID 141790
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Anwendbar; vollständig in den Código Penal eingearbeitet. Ihre Vorschriften sind bis
    heute die einzigen argentinischen Straftatbestände, die technisch vermittelte Vermögens- und Datenschädigungen
    erfassen.
  kurzbeschreibung: 'Vierzehn Artikel, die den Código Penal an die Informationstechnik anpassen. Für die
    KI-Praxis relevant sind vor allem drei: die Neufassung des Art. 128 (Darstellungen sexueller Handlungen
    mit Minderjährigen), an deren Begriff der "representación" die Rechtsprechung 2025 die Strafbarkeit
    KI-generierter Bilder festgemacht hat; der neu eingefügte Art. 173 Nr. 16 (defraudación informática),
    der Vermögensschädigung durch Manipulation eines Datenverarbeitungssystems erfasst, ohne dass ein
    Mensch getäuscht werden müsste; und Art. 157 bis, die strafrechtliche Flanke der Ley 25.326.'
  inkrafttreten:
    datum: 2008-06-25
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/140000-144999/141790/norma.htm
  anwendungsdaten:
  - datum: 2008-06-25
    was_gilt: Inkrafttreten; Neufassung von Art. 77, 128, 153, 155, 157, 157 bis, 184, 197 und 255 CP,
      Einfügung von Art. 153 bis, 173 Nr. 16 und 183 Abs. 2, Aufhebung von Art. 78 bis und 117 bis Nr.
      1.
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/140000-144999/141790/norma.htm
  themenachsen:
  - content
  - haftung
  - sicherheit-export
  regelungsschwerpunkte:
  - 'Art. 1: Erweiterung des Dokumentenbegriffs in Art. 77 CP auf elektronische Dokumente und digitale
    Signaturen — die Grundlage jeder Urkundendelikts-Anwendung auf KI-erzeugte Dateien.'
  - 'Art. 2: Neufassung des Art. 128 CP; Anknüpfung an die "representación", nicht an ein reales Opfer.'
  - 'Art. 9: Einfügung des Art. 173 Nr. 16 CP (defraudación informática).'
  - 'Art. 14: Aufhebung des Art. 117 bis Nr. 1 CP — damit entfiel die Strafbarkeit der wissentlich falschen
    Eintragung in eine Datenbank; die Ley 25.326 verlor ihre schärfste strafrechtliche Flanke.'
  dokumente:
  - datum: 2008-06-25
    typ: endfassung
    titel: Ley 26.388 — Delitos Informáticos
    url: https://servicios.infoleg.gob.ar/infolegInternet/anexos/140000-144999/141790/norma.htm
    sprache: es
    urheber: InfoLEG — Ministerio de Justicia de la Nación
    verifiziert: true
    notiz: Amtlicher Volltext; Änderungsprogramm aller vierzehn Artikel geprüft.
  offene_punkte:
  - Das Boletín-Oficial-Datum (25.06.2008) ist aus der Sekundärliteratur übernommen; die InfoLEG-Seite
    nennt Sanktion (04.06.2008) und faktische Promulgation (24.06.2008).
  monitoring_quellen:
  - https://servicios.infoleg.gob.ar/
  bezug_regelwerke:
  - ar-codigo-penal
  - ar-ley-25326
  letzte_pruefung: 2026-09-06
- id: ar-ley-24240
  jurisdiktion: ar
  kurztitel: Ley 24.240 — Defensa del Consumidor
  offizieller_titel: Ley N.º 24.240 de Defensa del Consumidor
  fundstelle: Ley 24.240, Boletín Oficial 15.10.1993 (Teilpromulgation 13.10.1993 durch Decreto 2089/93);
    InfoLEG ID 638. Wesentliche Änderungen durch Ley 26.361 (2008) und Ley 26.994.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Anwendbar. Kein KI-spezifischer Tatbestand, aber die praktisch wichtigste Haftungsgrundlage
    Argentiniens gegenüber Anbietern digitaler Produkte, weil Art. 40 die gesamte Vertriebskette gesamtschuldnerisch
    und verschuldensunabhängig haften lässt.
  kurzbeschreibung: 'Das argentinische Verbraucherschutzgesetz. Für KI-Produkte tragen vier Vorschriften:
    die Informationspflicht des Art. 4, die Sicherheitsanforderung des Art. 5, die Bindung an Werbeaussagen
    nach Art. 8 — für KI-Marketingversprechen die naheliegendste Norm — und vor allem Art. 40, der bei
    einem Schaden aus dem "vicio o riesgo de la cosa o de la prestación del servicio" Hersteller, Importeur,
    Vertreiber, Anbieter, Verkäufer und Markeninhaber gesamtschuldnerisch haften lässt; entlastet wird
    nur, wer eine fremde Schadensursache nachweist. Art. 52 bis ermöglicht daneben eine zivilrechtliche
    Strafzahlung (daño punitivo).'
  inkrafttreten:
    datum: 1993-10-15
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/0-4999/638/texact.htm
  anwendungsdaten:
  - datum: 2008-04-07
    was_gilt: Ley 26.361 erweitert den Verbraucherbegriff und führt in Art. 52 bis den daño punitivo ein.
    verifiziert: false
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/0-4999/638/texact.htm
  themenachsen:
  - haftung
  - vertrag
  - marktzugang
  regelungsschwerpunkte:
  - 'Art. 4: Informationspflicht — "en forma cierta, clara y detallada" über alle wesentlichen Merkmale.
    Die argentinische Entsprechung der Transparenzpflichten des Art. 50 KI-VO, ohne KI-Bezug.'
  - 'Art. 5: Waren und Dienstleistungen müssen bei bestimmungsgemässer Verwendung sicher sein.'
  - 'Art. 8: Werbeaussagen binden den Anbieter und werden Vertragsinhalt — die praktisch schärfste argentinische
    Norm gegen überzogene KI-Leistungsversprechen.'
  - 'Art. 40: gesamtschuldnerische, verschuldensunabhängige Haftung der gesamten Wertschöpfungskette für
    Schäden aus "vicio o riesgo de la cosa o de la prestación del servicio"; Entlastung nur bei Nachweis
    einer fremden Ursache. Für KI-Systeme ist das der Gegenentwurf zur europäischen Rollenverteilung:
    Argentinien braucht keine Unterscheidung zwischen Anbieter, Betreiber und Einführer, weil alle nebeneinander
    haften.'
  - 'Art. 52 bis: daño punitivo — im Fall M.J.L. c/ Peugeot Citroën (2025) zugesprochen.'
  dokumente:
  - datum: 1993-10-15
    typ: konsolidiert
    titel: Ley 24.240 — Defensa del Consumidor (texto actualizado)
    url: https://servicios.infoleg.gob.ar/infolegInternet/anexos/0-4999/638/texact.htm
    sprache: es
    urheber: InfoLEG — Ministerio de Justicia de la Nación
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung; Art. 1, 4, 5, 8, 17, 40 und 52 bis geprüft.
  offene_punkte:
  - Es ist keine argentinische Entscheidung bekannt, die Art. 40 auf ein KI-System angewendet hätte.
  monitoring_quellen:
  - https://servicios.infoleg.gob.ar/
  - https://www.argentina.gob.ar/produccion/defensadelconsumidor
  bezug_regelwerke:
  - ar-ccyc
  letzte_pruefung: 2026-09-06
- id: ar-ley-27078
  jurisdiktion: ar
  kurztitel: Ley 27.078 — Argentina Digital
  offizieller_titel: Ley N.º 27.078 — Tecnologías de la Información y las Comunicaciones (Argentina Digital)
  fundstelle: Ley 27.078, sancionada 16.12.2014, Boletín Oficial 19.12.2014; InfoLEG ID 239771. Erheblich
    geändert durch Decreto de Necesidad y Urgencia 267/2015 und durch DNU 70/2023 (B.O. 21.12.2023); Art.
    15 aufgehoben durch Decreto 302/2024.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Anwendbar, aber durch die Deregulierungsdekrete der Regierung Milei erheblich entkernt.
    Kein KI-Bezug; einschlägig ist das Gesetz für KI nur mittelbar über das Fernmeldegeheimnis, die Netzneutralität
    und die Datenschutzpflichten der Diensteanbieter.
  kurzbeschreibung: 'Das argentinische Telekommunikations- und IKT-Rahmengesetz. Es erklärt die Entwicklung
    der IKT zum öffentlichen Interesse und garantiert die "completa neutralidad de las redes". Für KI
    ist es aus drei Gründen einschlägig: Art. 5 stellt jede IKT-Kommunikation unter Richtervorbehalt und
    ist damit die Grenze jeder Kommunikationsanalyse durch KI-Systeme; Art. 56 f. verbieten Blockade,
    Diskriminierung und willkürliche Drosselung von Inhalten und Anwendungen — relevant für den Zugang
    zu KI-Diensten; Art. 59 lit. f und Art. 62 lit. f verpflichten die Anbieter zum Schutz personenbezogener
    Daten und zur Wahrung des Kommunikationsgeheimnisses. Ein KI-spezifischer Regelungsgehalt fehlt vollständig.'
  inkrafttreten:
    datum: 2014-12-19
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/235000-239999/239771/texact.htm
  anwendungsdaten:
  - datum: 2023-12-21
    was_gilt: DNU 70/2023 ändert die Ley 27.078 erheblich; die konsolidierte Fassung datiert seither auf
      diesen Tag.
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/235000-239999/239771/texact.htm
  themenachsen:
  - datenschutz
  - wettbewerb
  - grundrechte
  regelungsschwerpunkte:
  - 'Art. 1: öffentliches Interesse an der IKT-Entwicklung; Garantie der vollständigen Netzneutralität.'
  - 'Art. 5: Unverletzlichkeit der Kommunikation; Abfangen nur auf Anordnung eines zuständigen Richters.
    Die Norm, an der jede automatisierte Kommunikationsanalyse — auch die der UIAAS — zu messen wäre.'
  - 'Art. 56 f.: Netzneutralität; Verbot von Blockade, Diskriminierung, willkürlicher Drosselung und preislicher
    Differenzierung nach Inhaltstyp.'
  - 'Art. 59 lit. f und Art. 62 lit. f: Pflicht der Anbieter zum Schutz personenbezogener Daten und zur
    Wahrung des Kommunikationsgeheimnisses.'
  - KEIN KI-Bezug. Das Gesetz kennt weder algorithmische Systeme noch automatisierte Entscheidungen. Die
    argentinischen KI-Gesetzentwürfe knüpfen dementsprechend nicht an es an.
  dokumente:
  - datum: 2014-12-19
    typ: konsolidiert
    titel: Ley 27.078 — Argentina Digital (texto actualizado)
    url: https://servicios.infoleg.gob.ar/infolegInternet/anexos/235000-239999/239771/texact.htm
    sprache: es
    urheber: InfoLEG — Ministerio de Justicia de la Nación
    verifiziert: true
    notiz: Amtliche konsolidierte Fassung; Art. 1, 2, 5, 56, 57, 59, 62, 64 und 68 geprüft. Art. 15 ist
      durch Decreto 302/2024 aufgehoben.
  offene_punkte:
  - Der Umfang der durch DNU 70/2023 und Decreto 302/2024 bewirkten Entkernung ist nicht im Einzelnen
    erfasst.
  monitoring_quellen:
  - https://www.enacom.gob.ar/
  - https://servicios.infoleg.gob.ar/
  bezug_regelwerke:
  - ar-ley-25326
  - ar-res-710-2024-uiaas
  letzte_pruefung: 2026-09-06
- id: ar-caba-ley-5688-srfp
  jurisdiktion: ar
  provinz: Ciudad Autónoma de Buenos Aires
  kurztitel: Ley 5688 CABA i.d.F. der Ley 6339 — Sistema de Reconocimiento Facial de Prófugos
  offizieller_titel: Ley N.º 5688 de la Ciudad Autónoma de Buenos Aires (Sistema Integral de Seguridad
    Pública), modificada por la Ley N.º 6339
  fundstelle: Ley 5688 CABA (2016); Ley 6339, sancionada 22.10.2020, Boletín Oficial de la Ciudad Autónoma
    de Buenos Aires 19.11.2020. Durchführung durch Resolución N.º 398/MJYSGC/2019.
  verfahrensnummer: ''
  status: teilanwendbar
  status_detail: Die Rechtsgrundlage besteht fort; der Betrieb des Sistema de Reconocimiento Facial de
    Prófugos ist seit 2022 gerichtlich ausgesetzt. Die Cámara de Apelaciones CAyTyRC hat am 28.04.2023
    die Wiederinbetriebnahme von drei Bedingungen abhängig gemacht (funktionierende Kontrollorgane, Bias-Prüfung,
    Bürgerbeteiligung). Ob diese erfüllt und das System wieder in Betrieb genommen wurde, ist nicht ermittelt.
  kurzbeschreibung: 'Die Ley 6339 fügte 2020 in das Sicherheitsgesetz der Stadt Buenos Aires die Rechtsgrundlage
    für das Sistema de Reconocimiento Facial de Prófugos (SRFP) ein — biometrische Gesichtserkennung im
    öffentlichen Raum zum Abgleich mit dem nationalen Fahndungsbestand CONARC. Art. 480 bis begrenzt den
    Einsatz auf richterlich angeforderte Aufgaben und auf die Identifizierung der im CONARC registrierten
    Gesuchten; Art. 490 bis errichtet bei der Legislatur eine Comisión Especial de Seguimiento de los
    Sistemas de Video Vigilancia. Der Fall O.D.I.A. hat gezeigt, dass beide Sicherungen leerliefen: Der
    Kontrollausschuss war nicht funktionsfähig, und tatsächlich wurden Daten von mehr als 15.000 Personen
    ausserhalb des CONARC verarbeitet.'
  inkrafttreten:
    datum: 2020-11-19
    verifiziert: true
    quelle: https://boletinoficial.buenosaires.gob.ar/normativaba/norma/533894
  anwendungsdaten:
  - datum: 2019-04-24
    was_gilt: Inbetriebnahme des SRFP auf Grundlage der Resolución N.º 398/MJYSGC/2019 — anderthalb Jahre
      VOR der gesetzlichen Grundlage.
    verifiziert: false
    quelle: https://www.cels.org.ar/web/wp-content/uploads/2022/09/reconocimientofacialsentencia070922.pdf
  - datum: 2020-11-19
    was_gilt: Ley 6339 fügt Art. 480 bis und 490 bis in die Ley 5688 ein und schafft damit nachträglich
      die gesetzliche Grundlage.
    verifiziert: true
    quelle: https://boletinoficial.buenosaires.gob.ar/normativaba/norma/533894
  - datum: 2022-04-12
    was_gilt: Der Juez Andrés Gallardo (Juzgado CAyT N.º 2) setzt den Betrieb des SRFP vorläufig aus.
    verifiziert: false
    quelle: https://ijudicial.gob.ar/2022/suspenden-el-sistema-de-reconocimiento-facial-de-profugos/
  - datum: 2022-09-07
    was_gilt: Die Jueza Elena Liberatori (Juzgado CAyT N.º 4) erklärt das SRFP für verfassungswidrig.
    verifiziert: false
    quelle: https://www.cels.org.ar/web/wp-content/uploads/2022/09/reconocimientofacialsentencia070922.pdf
  - datum: 2023-04-28
    was_gilt: Die Cámara CAyTyRC, Sala I, macht die Wiederinbetriebnahme von funktionierenden Kontrollorganen,
      einer Bias-Prüfung und Bürgerbeteiligung abhängig.
    verifiziert: false
    quelle: https://juristeca.jusbaires.gov.ar/fallos/51869.pdf
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Art. 480 bis Ley 5688: Zweckbindung — das SRFP darf nur für richterlich angeforderte Aufgaben und
    zur Identifizierung der im CONARC registrierten Gesuchten eingesetzt werden.'
  - 'Art. 490 bis Ley 5688: Comisión Especial de Seguimiento de los Sistemas de Video Vigilancia bei der
    Legislatur — die parlamentarische Kontrolle, deren Nichtkonstituierung das Gericht als Legalitätsverstoss
    gewertet hat.'
  - 'Die Reihenfolge ist der eigentliche Befund: Betrieb ab April 2019, gesetzliche Grundlage ab November
    2020, gerichtliche Aussetzung ab April 2022. Argentinien hat die biometrische Fernidentifizierung
    zuerst eingeführt, dann legalisiert und schliesslich gestoppt.'
  dokumente:
  - datum: 2020-11-19
    typ: endfassung
    titel: Ley 6339 — Sistema Integral de Seguridad Pública. Modificación
    url: https://boletinoficial.buenosaires.gob.ar/normativaba/norma/533894
    sprache: es
    urheber: Boletín Oficial del Gobierno de la Ciudad Autónoma de Buenos Aires
    verifiziert: true
    notiz: Amtlicher Volltext; Sanktionsdatum 22.10.2020, Veröffentlichung 19.11.2020, Wortlaut der Art.
      480 bis und 490 bis geprüft.
  - datum: 2020-11-19
    typ: konsolidiert
    titel: Ley 6339 (CEDOM — Dirección General de Información y Archivo Legislativo)
    url: http://www2.cedom.gov.ar/es/legislacion/normas/leyes/ley6339.html
    sprache: es
    urheber: CEDOM — Legislatura de la Ciudad Autónoma de Buenos Aires
    verifiziert: false
    notiz: Amtliche Normensammlung der Legislatur; in dieser Sitzung durch robots.txt nicht abrufbar.
  offene_punkte:
  - Ob das SRFP nach der Entscheidung der Cámara vom 28.04.2023 unter Auflagen wieder in Betrieb genommen
    wurde, ist offen.
  - Ob der Tribunal Superior de Justicia der Stadt in der Sache entschieden hat, ist nicht ermittelt.
  monitoring_quellen:
  - https://boletinoficial.buenosaires.gob.ar/
  - https://juristeca.jusbaires.gob.ar/
