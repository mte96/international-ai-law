  regelungsschwerpunkte:
  - 'Grundsatz: "la función jurisdiccional es indelegable" — die Rechtsprechungsfunktion ist unübertragbar
    und durch kein automatisiertes System ersetzbar. Die Verantwortung für Entscheidung, Beweiswürdigung
    und Begründung bleibt ungeteilt bei der Richterin oder dem Richter, unabhängig vom Einsatz eines Werkzeugs.'
  - 'Risikoklassifizierung in Anlehnung an die KI-VO: Anwendungen mit geringem Risiko in der Justizverwaltung
    (Aktenverwaltung, Terminierung, Transkription, Statistik) gegenüber Hochrisikoanwendungen zur Unterstützung
    der Rechtsprechung (Auslegung, Beweiswürdigung, Ergebnisprognose).'
  - Hochrisikoanwendungen erfordern förmliche Genehmigung, Algorithmenfolgenabschätzung und laufende Audits;
    halbjährliche Auditpflicht für Hochrisiko-, jährliche für Niedrigrisikosysteme.
  - 'Ausdrückliche Verbote: vollständige Automatisierung richterlicher Entscheidungen; unbeaufsichtigte
    KI-Systeme; diskriminierende Werkzeuge; Erzeugung "synthetischer" oder automatisiert generierter Beweismittel;
    Rückfallprognosesysteme mit bindender Wirkung auf Haftentscheidungen; Gutachten ohne aktive Beteiligung
    und kritische Validierung durch eine qualifizierte sachverständige Person.'
  - 'Werkzeugverbot für vertrauliche Justizdaten: Es ist untersagt, vertrauliche Daten in kommerzielle
    KI-Systeme mit weitreichenden Datenverwertungsklauseln einzugeben (adressiert werden ausdrücklich
    frei zugängliche Chatbots).'
  - 'Dokumentationspflicht in der Akte: Name des Systems, verwendetes Modell, Anbieter, Zeitpunkt und
    die konkret KI-gestützt erzeugten Teile des Dokuments. Das ist die weitgehendste Transparenzpflicht
    im argentinischen Justizrecht — sie geht über die blosse Offenlegung des Einsatzes hinaus und verlangt
    eine Zuordnung nach Textteilen.'
  - Öffentliches Register der genehmigten KI-Systeme mit Folgenabschätzungen, Angaben zu Trainingsdaten
    und Auditierbarkeitsmechanismen.
  - 'Datenschutz: Verarbeitung personenbezogener Daten über KI-Systeme unterliegt uneingeschränkt der
    Ley 25.326.'
