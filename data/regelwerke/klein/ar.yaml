- id: ar-ccyc
  jurisdiktion: ar
  kurztitel: Código Civil y Comercial de la Nación
  offizieller_titel: Ley N.º 26.994 — Código Civil y Comercial de la Nación
  fundstelle: Ley 26.994, sancionada 01.10.2014, promulgada 07.10.2014, Boletín Oficial 08.10.2014 (Suplemento);
    in Kraft seit 01.08.2015 (vorgezogen durch Ley 27.077). InfoLEG ID 235975.
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Seit 01.08.2015 anwendbar. Enthält keine KI-spezifische Vorschrift; die argentinische
    Literatur und Rechtsprechung führen KI-Schäden über die Gefährdungshaftung der Art. 1757 f. und die
    Persönlichkeitsrechte der Art. 51 bis 53. Der Entwurf 1013-D-2024 will das Buch ändern.
  kurzbeschreibung: 'Die zivilrechtliche Grundordnung Argentiniens. Für KI sind drei Blöcke einschlägig:
    die Persönlichkeitsrechte der Art. 51 bis 53 (Würde, Bildnis- und Stimmrecht — die Grundlage jedes
    argentinischen Deepfake-Anspruchs, weil das Strafrecht hier eine Lücke lässt), die Präventionspflicht
    der Art. 1710 f. (Unterlassungsanspruch ohne Verschulden) und die verschuldensunabhängige Haftung
    für "riesgo o vicio de las cosas" und für "actividades riesgosas o peligrosas" nach Art. 1757 f. Letztere
    ist die zentrale argentinische Anspruchsgrundlage für KI-Schäden: Sie erfasst ausdrücklich auch Tätigkeiten,
    die "por los medios empleados" gefährlich sind, und schliesst die behördliche Genehmigung wie die
    Einhaltung von Präventionstechniken als Entlastungsgrund aus. Halter und Eigentümer haften nebeneinander
    (Art. 1758).'
  inkrafttreten:
    datum: 2015-08-01
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/235000-239999/235975/texact.htm
  anwendungsdaten:
  - datum: 2015-08-01
    was_gilt: Inkrafttreten des einheitlichen Zivil- und Handelsgesetzbuchs; Ablösung des Código Civil
      (Vélez Sarsfield) und des Código de Comercio.
    verifiziert: true
    quelle: https://servicios.infoleg.gob.ar/infolegInternet/anexos/235000-239999/235975/texact.htm
  themenachsen:
  - haftung
  - grundrechte
  - content
  - datenschutz
  regelungsschwerpunkte:
  - 'Art. 51: "La persona humana es inviolable y en cualquier circunstancia tiene derecho al reconocimiento
    y respeto de su dignidad." Die argentinische Generalklausel des Persönlichkeitsschutzes — Anker für
    Deepfake-Ansprüche, solange das Strafrecht keinen Tatbestand kennt.'
  - 'Art. 52: Wer in seiner persönlichen Intimsphäre, seiner Ehre, seinem Bildnis oder seiner Identität
    beeinträchtigt wird, kann Prävention und Ersatz des Schadens nach den Vorschriften des Buches Drittes
    verlangen.'
  - 'Art. 53: Zustimmungserfordernis für die Aufnahme oder Wiedergabe des Bildnisses oder der Stimme einer
    Person ("captar o reproducir la imagen o la voz de una persona"). Die ausdrückliche Nennung der STIMME
    ist für Voice-Cloning entscheidend — Argentinien braucht dafür kein Sondergesetz nach dänischem Muster.
    Ausnahmen: Teilnahme an öffentlichen Ereignissen, wissenschaftliches/kulturelles/ journalistisches
    Interesse, aktuelles Geschehen. Nach dem Tod Zustimmung der Erben.'
  - 'Art. 1710 f.: Präventionspflicht und "acción preventiva" — Unterlassungsklage ohne Verschulden, bei
    blosser Gefahr eines Schadens. Der praktisch wichtigste Rechtsbehelf gegen laufende KI-Anwendungen.'
  - 'Art. 1757: "Toda persona responde por el daño causado por el riesgo o vicio de las cosas, o de las
    actividades que sean riesgosas o peligrosas por su naturaleza, por los medios empleados o por las
    circunstancias de su realización. La responsabilidad es objetiva. No son eximentes la autorización
    administrativa para el uso de la cosa o la realización de la actividad, ni el cumplimiento de las
    técnicas de prevención." Amtlich geprüft. Die Variante "por los medios empleados" ist die Brücke zur
    Software; die ausdrückliche Absage an die behördliche Genehmigung als Entlastungsgrund ist der Gegenpol
    zur europäischen Konformitätsvermutung des Art. 6 KI-VO.'
  - 'Art. 1758: "El dueño y el guardián son responsables concurrentes del daño causado por las cosas."
    Guardián ist, wer sich der Sache bedient, die Kontrolle über sie ausübt oder aus ihr Nutzen zieht.
    Entlastung nur bei Gebrauch gegen den Willen. Für KI heisst das: Betreiber und Anbieter haften nebeneinander,
    ohne dass es einer Rollenverteilung nach dem Muster der KI-VO bedarf.'
