  provinz: Ciudad Autónoma de Buenos Aires
  kurztitel: Res. Presidencia 206/2025 — KI-Guía des Consejo de la Magistratura CABA
  offizieller_titel: 'Resolución de Presidencia N.º 206/2025 del Consejo de la Magistratura de la Ciudad
    Autónoma de Buenos Aires — Anexo I: Guía de uso responsable y sustentable de la inteligencia artificial
    y de los agentes de IA, ratificada por Resolución CM N.º 95/2025'
  fundstelle: Res. Presidencia N.º 206/2025 vom 26.02.2025 (Buenos Aires), Anexo I; ratifiziert durch
    Resolución CM N.º 95/2025
  verfahrensnummer: ''
  status: anwendbar
  status_detail: Seit 26.02.2025 in Kraft, durch Plenarbeschluss (Res. CM 95/2025) ratifiziert. Am 24.09.2025
    hat der Consejo zusätzlich ein Comité de Estandarización en Inteligencia Artificial eingerichtet.
  kurzbeschreibung: Leitlinie des Consejo de la Magistratura der Stadt Buenos Aires für den verantwortlichen
    und nachhaltigen Einsatz von KI und KI-Agenten in der Stadtjustiz. Sie ist der einzige argentinische
    Justizakt, der ausdrücklich auch "agentes de IA" (agentische Systeme) erfasst, und der einzige, der
    Nachhaltigkeit als Kriterium führt. Die Stadt Buenos Aires ist zugleich die argentinische Jurisdiktion
    mit der längsten KI-Einsatzgeschichte in der Justiz (Prometea, seit 2017; MIA für Vollstreckungsverfahren).
