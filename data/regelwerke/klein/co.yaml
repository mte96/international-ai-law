    verifiziert: true
    quelle: https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=3431
  - datum: 2018-07-12
    was_gilt: Ley 1915 de 2018 (Diario Oficial 50.652) führt in Art. 16 einen neuen Katalog von Schranken
      ein — ohne TDM-Ausnahme.
    verifiziert: true
    quelle: http://www.secretariasenado.gov.co/senado/basedoc/ley_1915_2018.html
  - datum: 2023-05-02
    was_gilt: 'DNDA, Resolución 137: Ablehnung der Eintragung von ''Conversaciones Poéticas con ChatGPT''.'
    verifiziert: false
    quelle: https://www.institutoautor.com/colombia-la-dnda-deniega-el-registro-de-creaciones-desarrolladas-con-inteligencia-artificial/
  - datum: 2023-06-14
    was_gilt: 'DNDA, Resolución 185: Ablehnung der Eintragung mit Midjourney erzeugter Bildwerke.'
    verifiziert: false
    quelle: https://www.institutoautor.com/colombia-la-dnda-deniega-el-registro-de-creaciones-desarrolladas-con-inteligencia-artificial/
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - 'Art. 2 (i.d.F. der Ley 44 de 1993): Werkbegriff — ''todas las creaciones del espíritu en el campo
    científico, literario y artístico, cualquiera que sea el modo o forma de expresión''. Der Begriff
    ''creación del espíritu'' setzt einen menschlichen Schöpfer voraus; anders als Italien mit Art. 25
    lit. a Legge 132/2025 hat Kolumbien das nie ausdrücklich in den Gesetzestext geschrieben.'
  - 'Art. 8 (i.d.F. des Art. 2 Ley 1520 de 2012): Definitionskatalog, unter anderem der Werkarten.'
  - 'SCHRANKEN (Art. 16 Ley 1915 de 2018): lit. a vorübergehende elektronische Vervielfältigung, die ''transitoria
    o accesoria'' ist und einen integralen und wesentlichen Bestandteil eines technischen Verfahrens bildet,
    ohne eigenständige wirtschaftliche Bedeutung; lit. b und c Bibliotheksausleihe und Terminalzugang
    für Forschung und persönliches Studium; lit. d Parodie und Karikatur; lit. e reprografische Vervielfältigung
    für den Unterricht ohne Gewinnerzielungsabsicht.'
  - KEINE TDM-SCHRANKE. Die Schranke der vorübergehenden Vervielfältigung erfasst Zwischenspeicherungen
    im Übertragungsvorgang, nicht die dauerhafte Auswertung eines Korpus zu Trainingszwecken. Wer in Kolumbien
    Modelle auf geschützten Werken trainiert, kann sich auf keine gesetzliche Ausnahme berufen — der Unterschied
    zu Japan (Art. 30-4), zur EU (Art. 3 und 4 DSM-RL) und zu Italien (Art. 70-septies l. 633/1941) ist
    fundamental.
  - Der Gesetzentwurf PL 025/2026C will erstmals eine Forschungs-TDM-Schranke einführen und beruft sich
    dafür auf den Drei-Stufen-Test und Art. 21 Decisión Andina 351 de 1993.
