- id: co-ley-23-1982
  jurisdiktion: co
  kurztitel: Ley 23 de 1982 — kolumbianisches Urheberrechtsgesetz
  offizieller_titel: Ley 23 de 1982, sobre derechos de autor
  fundstelle: Diario Oficial, 1982; konsolidierte Fassung im Gestor Normativo der Función Pública
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Grundgesetz des kolumbianischen Urheberrechts, mehrfach geändert, unter anderem durch
    die Ley 44 de 1993, die Ley 1520 de 2012 (Neufassung des Definitionsartikels 8) und die Ley 1915 de
    2018 (Schranken und Ausnahmen). Ein KI-Bezug fehlt vollständig. Die Frage der Schutzfähigkeit KI-erzeugter
    Erzeugnisse ist in Kolumbien nicht vom Gesetzgeber, sondern von der Registerbehörde DNDA entschieden
    worden.

    '
  kurzbeschreibung: 'Das Gesetz schützt Werke der Wissenschaft, Literatur und Kunst. Art. 2 (i.d.F. der
    Ley 44 de 1993) erfasst ''todas las creaciones del espíritu en el campo científico, literario y artístico,
    cualquiera que sea el modo o forma de expresión''. Der Rückgriff auf die ''creación del espíritu''
    ist der dogmatische Anker, mit dem die Dirección Nacional de Derecho de Autor (DNDA) 2023 dreimal
    die Eintragung KI-erzeugter Erzeugnisse abgelehnt hat: Ohne menschliche Schöpfung kein Werk. Art.
    8 enthält den Definitionskatalog (i.d.F. des Art. 2 Ley 1520 de 2012). Sanktionen ergeben sich aus
    dem Urheberstrafrecht (Art. 270 ff. Código Penal) und dem Zivilrecht. Entscheidend für das KI-Recht
    ist die Lücke: Kolumbien kennt KEINE Schranke für Text- und Data-Mining. Die Ley 1915 de 2018 hat
    einen abschließenden Katalog neuer Ausnahmen eingeführt — vorübergehende technische Vervielfältigung,
    Bibliotheksprivilegien, Parodie und Karikatur, Unterrichtsvervielfältigung —, aber gerade kein TDM.
    Das Training generativer Modelle auf geschützten Werken hat in Kolumbien damit keine gesetzliche Grundlage.

    '
  inkrafttreten:
    datum: 1982-02-19
    verifiziert: true
    quelle: https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=3431
    fundstelle_norm: 'ARTÍCULO 260: ''Esta Ley regirá a partir de su promulgación.'' Promulgation = Veroeffentlichung
      im Diario Oficial No. 35.949 vom 19.02.1982 (amtlicher Schlussvermerk des Gestor Normativo); Sanktion
      am 28.01.1982'
  anwendungsdaten:
  - datum: 1993-02-05
    was_gilt: Ley 44 de 1993 ergänzt Art. 2 (Werkbegriff).
    verifiziert: true
    quelle: https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=3431
  - datum: 2012-04-13
