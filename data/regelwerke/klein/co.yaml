    titel: PL 025/2026C — beruft sich für die TDM-Ausnahme auf Art. 9 Abs. 2 der Berner Übereinkunft und
      Art. 21 Decisión Andina 351 de 1993
    url: https://www.camara.gov.co/wp-content/uploads/2026/07/proyectos-ley/documentos/proyecto-36127/P.L.025-2026SC-INTELIGENCIA-ARTIFICIAL.pdf
    sprache: es
    urheber: Cámara de Representantes
    verifiziert: true
    notiz: Ersatzbeleg für die Bedeutung des Art. 21 Decisión 351 im kolumbianischen KI-Diskurs.
  offene_punkte:
  - Volltext, Gaceta-Oficial-Nummer und der genaue Wortlaut der Art. 3 und 21 sind nachzuholen (comunidadandina.org/normativa-andina/gacetas
    oder WIPO Lex).
  - Ob der Tribunal de Justicia de la Comunidad Andina sich zu KI-erzeugten Erzeugnissen geäußert hat,
    ist nicht ermittelt — das wäre die erste supranationale Entscheidung Lateinamerikas zu dieser Frage.
