  offene_punkte:
  - 'Sentencia C-212 de 2026 ist nicht aus der Primärquelle geprüft: Expediente-Nummer, genaues Entscheidungsdatum
    (15. oder 18.07.2026) und der Wortlaut des Resuelve fehlen. Der Volltext war am 06.09.2026 in der
