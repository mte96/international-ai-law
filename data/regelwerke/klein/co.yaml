    urheber: Comisión del Acuerdo de Cartagena; Nachweis bei der WIPO
    verifiziert: false
    notiz: Der Datensatz existiert in WIPO Lex; der Volltextabruf schlug in dieser Sitzung fehl (404 auf
      der Textseite). Inhaltliche Angaben stammen aus dem Gesetzentwurf PL 025/2026C und aus den DNDA-Bescheiden.
  - datum: 2026-07-21
