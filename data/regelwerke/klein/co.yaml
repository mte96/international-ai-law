  regelungsschwerpunkte:
  - 'Rechtsgrundlage: Art. 257 Nr. 3 CP und Art. 85 Nr. 1a Ley 270 de 1996 i.d.F. der Ley 2430 de 2024;
    ausdrücklich in den Considerandos die Sentencia T-323 vom 02.08.2024.'
  - 'Aufbau: Kapitel I Allgemeine Bestimmungen (Art. 1-3), Kapitel II Nutzungsdirektiven für Justizbedienstete
    (Art. 4-10), Kapitel III Institutionelle Umsetzung (Art. 11-12), Kapitel IV Fortbildung (Art. 13),
    Kapitel V Überwachung und Inkrafttreten (Art. 14-16).'
  - 'Art. 1-2: Legaldefinitionen von KI-System, generativer KI, LLM, Algorithmus, Halluzination und Verzerrung
    — die einzigen verbindlichen KI-Definitionen im kolumbianischen Recht neben Art. 2 Ley 2502 de 2025.'
  - 'Art. 3: fünfzehn Grundsätze, darunter der Vorrang der Grundrechte, Transparenz, menschliche Kontrolle
    und Datenschutz. Art. 3.6 enthält die Zurechnungsregel: ''Toda decisión o actuación judicial en la
    que se haya hecho uso de la IA se atribuye al funcionario judicial.'''
  - 'Art. 4.1 (uneingeschränkt zulässig): Textbearbeitung, Korrektur, Terminverwaltung, Präsentationen,
    Formatkonversion, Übersetzungen — reine Verwaltungsunterstützung.'
  - 'Art. 4.2 (zulässig mit gründlicher Überprüfung): Rechtsprechungsrecherche und -synthese, Fallzusammenfassungen
    ohne personenbezogene Daten, Transkription von Verhandlungen, Dokumentenklassifikation, statistische
    Auswertung, Unterstützung bei Sachverhaltszusammenfassungen und Entscheidungsentwürfen.'
  - 'Art. 4.3 (gesteigerte Transparenzpflicht): Simulation von Entscheidungsszenarien, Unterstützung bei
    mathematischen Operationen und bei Aufgaben, die die Begründungsleistung berühren.'
  - 'Art. 8 (VERBOTE): Verwendung frei zugänglicher kommerzieller Chatbots; Einsatz von KI zur Beweiswürdigung;
    ausschließliche Stützung der Rechtsanwendung oder der Entscheidungsbegründung auf KI-Ausgaben; Eingabe
    personenbezogener oder sensibler Daten in Systeme ohne Datenschutzgarantien; Verschweigen der KI-Nutzung.'
  - 'Art. 10 (OFFENLEGUNG): Bei substanziellen Entscheidungen sind Werkzeugbezeichnung, Modell, Anbieter,
    Nutzungsdatum, die Bestätigung der Kenntnisnahme der Nutzungsbedingungen, der Verwendungszweck, die
    Art der Verwendung und die verwendeten Prompts zu dokumentieren; die von der KI stammenden Textstellen
    sind typografisch kenntlich zu machen. Das ist die weltweit weitestgehende Offenlegungspflicht für
    richterliche KI-Nutzung.'
  - 'Art. 11: Pflichten der Unidad de Transformación Digital — algorithmische Folgenabschätzung, Datensicherheitskontrollen,
    Bereinigung von Trainingsdaten um personenbezogene Informationen, Datenschutz-Folgenabschätzung, Sicherung
    der technologischen Unabhängigkeit.'
  - 'Art. 12: priorisierte Einsatzfelder — Verwaltungs- und Dokumentenmanagement, Rechtsprechungsrecherche
    (nicht fallbezogene Auslegung), Textkorrektur mit menschlicher Nachkontrolle.'
  - 'Art. 13: Fortbildungspflicht über die Escuela Judicial Rodrigo Lara Bonilla. Art. 14: Meldepflichten
    für eingesetzte KI-Initiativen und für Verdachtsfälle von Fehlfunktionen oder Schäden. Art. 15: laufende
    Beobachtung und Wissensmanagement.'
  - 'RECHTSVERGLEICH: Der Katalog geht über die englische Practice Guidance (2023/2025), die brasilianische
    Resolução CNJ 615/2025 und den italienischen Art. 15 Legge 132/2025 hinaus, weil er nicht nur Grundsätze
    aufstellt, sondern Einsatzfelder positiv listet, ein Verbot des Einsatzes frei zugänglicher Chatbots
    ausspricht und die Prompt-Dokumentation verlangt.'
