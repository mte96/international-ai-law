    Comisión Sexta, mit Ponencia (Gaceta 2013/2024) und einer ausdrücklichen Stellungnahme der SIC. Verfahrensstand
    am 06.09.2026: Archivado. Es ist der älteste der sechs horizontalen Entwürfe und der einzige, zu dem
    die Datenschutzaufsicht förmlich Stellung genommen hat.

    '
  kurzbeschreibung: 'Abgeordnetenentwurf für ein ethisches und nachhaltiges KI-Gesetz zum sozialen Wohl.
    Autorinnen und Autoren: Gloria Liliana Rodríguez Valencia, Jaime Raúl Salamanca Torres, María del
    Mar Pizarro García, Olga Lucía Velásquez Nieto und Wilmer Yair Castellanos Hernández; Berichterstatter
    Diego Fernando Caicedo Navas und Haiver Rincón Gutiérrez, Koordinator Alejandro García Ríos. Für die
    Datenbank wertvoll ist weniger der Entwurf selbst als die im Verfahren veröffentlichte Stellungnahme
    der Superintendencia de Industria y Comercio — sie ist die früheste dokumentierte Positionierung der
    kolumbianischen Datenschutzaufsicht zu einem KI-Gesetz und geht der Circular Externa 002 de 2024 voraus.

    '
