  - Die Politik nach Art. 4 ist bis 28.07.2027 zu formulieren; ein Entwurf ist nicht bekannt.
  - Ob die Fiscalía den ersten Jahresbericht nach Art. 5 vorgelegt hat, ist nicht ermittelt.
  - Ley 2573 de 2026 (Ley Estatutaria vom 19.05.2026, Diario Oficial 53.496 vom 20.05.2026, in Kraft ab
    19.11.2026) betrifft den Schutz vor Negativeinträgen bei Identitätsanmaßung. Sie wird in der Literatur
    oft zusammen mit Ley 2502 genannt, erwähnt aber weder KI noch Biometrie noch Deepfakes und wird deshalb
    hier nicht als KI-Regelwerk geführt.
