- id: co-acuerdo-pcsja24-12243
  jurisdiktion: co
  kurztitel: Acuerdo PCSJA24-12243 — KI-Leitlinien der kolumbianischen Justiz
  offizieller_titel: Acuerdo PCSJA24-12243 de 16 de diciembre de 2024, por el cual se adoptan lineamientos
    para el uso y aprovechamiento respetuoso, responsable, seguro y ético de la inteligencia artificial
    en la Rama Judicial
  fundstelle: Consejo Superior de la Judicatura, Acuerdo PCSJA24-12243; veröffentlicht am 18.12.2024
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'In Kraft seit der Veröffentlichung (Art. 16). Es ist die unmittelbare Erfüllung der
    Anordnung QUINTO aus T-323/24, die dem Consejo Superior de la Judicatura eine Viermonatsfrist gesetzt
    hatte. Das Acuerdo ist bislang das einzige verbindliche KI-Regelwerk Kolumbiens für die Justiz und
    international eines der detailliertesten überhaupt. Ein Änderungs- oder Nachfolgeakt ist bis zum 06.09.2026
    nicht ersichtlich.

    '
  kurzbeschreibung: 'Verwaltungsrechtlicher Beschluss des Justizrats mit 16 Artikeln in fünf Kapiteln.
    Er definiert KI, generative KI, große Sprachmodelle, Halluzination und Bias, stellt fünfzehn Grundsätze
    auf, teilt die zulässigen Einsatzfelder in drei Stufen ein (uneingeschränkte Verwaltungsunterstützung,
    fachliche Unterstützung mit Verifikationspflicht, Einsatzfelder mit gesteigerter Transparenzpflicht),
    verbietet bestimmte Praktiken, begründet eine Offenlegungspflicht in der Entscheidung selbst und weist
    der Unidad de Transformación Digital Folgenabschätzungs- und Sicherheitspflichten zu. Adressaten sind
    sämtliche Amtsträger und Bedienstete der Rama Judicial. Eigene Sanktionen enthält das Acuerdo nicht;
    Verstöße wirken über das Disziplinarrecht der Comisión Nacional de Disciplina Judicial und — wie der
    Fall des Juzgado 21 Penal del Circuito de Bogotá 2025 zeigt — über die prozessuale Nichtigkeit der
    Entscheidung.

    '
