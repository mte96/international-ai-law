    notiz: 'Volltext im Browser geprüft. Resuelve: ''INHIBIRSE de emitir pronunciamiento de fondo [...]
      por ineptitud sustantiva de los cargos.'' Damit ist die Verfassungsmäßigkeit der digitalen Verhandlung
      nach Art. 7 bis heute nicht sachlich geklärt.'
  offene_punkte:
  - Ob Art. 2 überhaupt eine taugliche Ermächtigungsgrundlage für generative KI ist, ist ungeklärt. Der
    Wortlaut spricht von 'tecnologías de la información y de las comunicaciones' in der 'gestión y trámite'
    der Verfahren — also von Verfahrensverwaltung, nicht von Entscheidungsfindung. T-323/24 hat die Frage
    offen gelassen.
  - Die Verfassungsklagen gegen Art. 6 (elektronische Klageerhebung) sind nicht abschließend nachverfolgt;
    C-121/23 betraf nur Art. 1 und 7.
  - Der Jahresbericht nach Art. 14 wäre der natürliche Ort für eine KI-Statistik der Rama Judicial; ob
    er sie enthält, ist nicht geprüft.
