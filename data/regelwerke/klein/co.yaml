  regelungsschwerpunkte:
  - 'Art. 1-4: Zweck, Anwendungsbereich, Definitionen (operador, fuente, usuario), Grundsätze der Datenverwaltung.'
  - 'Art. 6: Rechte der Betroffenen — habeas data, Zugang, Berichtigung.'
  - 'Art. 7-9: Pflichten von Betreibern, Quellen und Nutzern.'
  - 'Art. 13: Höchstdauer negativer Einträge (vier Jahre ab Tilgung).'
  - 'SCORING: Die laufende Abfrage darf nicht selbst ''causal de disminución en la calificación de riesgo,
    récord (scorings-score)'' sein; Nutzer dürfen die Bewertung nicht allein auf negative Kredithistorie
    stützen, sondern müssen weitere Risikofaktoren berücksichtigen. Das ist der einzige materielle Maßstab
    algorithmischer Bewertung im kolumbianischen Recht.'
  - 'Art. 16: Reklamationsverfahren. Art. 17 und 18: Aufsicht durch SIC und Superintendencia Financiera;
    Sanktionen.'
