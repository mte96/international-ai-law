  status: softlaw
  status_detail: 'Leitfaden ohne Rechtsform: weder Dekret noch Resolución. Trotz Presseberichten von einem
    ''verbindlichen ethischen Rahmen'' ließ sich kein Rechtsakt nachweisen, der ihn verbindlich macht.
    Er richtet sich an die Stellen der nationalen Verwaltung und ist die operative Umsetzung der Achse
    ''Ética y Gobernanza'' des CONPES 4144.

    '
  kurzbeschreibung: 'Leitfaden der Präsidentschaft mit DNP, MinTIC, MinCiencias und der Comisión de Regulación
    de Comunicaciones. Er formuliert ethische Grundprinzipien, Ermöglicher (habilitadores), Schutzmaßnahmen
    (salvaguardas), gute Praktiken und einen durchgerechneten Anwendungsfall für Behörden, die KI einführen
    wollen. Inhaltlich stehen Transparenz, menschliche Aufsicht, Datenschutz und Nichtdiskriminierung
    im Mittelpunkt. Sanktionen enthält der Leitfaden nicht; disziplinarrechtliche Folgen können sich mittelbar
    über die allgemeinen Amtspflichten ergeben.

    '
