  regelungsschwerpunkte:
  - Ersetzt die Resolución 2654 de 2019; vier Modalitäten der telemedizinischen Versorgung.
  - 'KI als Hilfsmittel: ''La IA se reconoce como una herramienta que asiste, pero no reemplaza el juicio
    clínico: el profesional conserva el control de la decisión.'' Das ist funktional dieselbe Regel wie
    Art. 7 der italienischen Legge 132/2025 und wie das Kriterium der ''no sustitución de la racionalidad
    humana'' aus T-323/24 — dreimal derselbe Gedanke in drei verschiedenen Rechtsgebieten.'
  - 'Anforderungen nach dem Entwurf (Art. 23): menschliche Aufsicht, Rückverfolgbarkeit, dokumentierte
    Funktionsnachweise, Algorithmenvalidierung, Qualität der Trainingsdaten, Mechanismen gegen Verzerrungen.'
  - KI-Systeme mit diagnostischer Funktion sind beim INVIMA als Medizinprodukt zu registrieren — der einzige
    kolumbianische Marktzugangstatbestand für KI.
