  offene_punkte:
  - Die drei DNDA-Resolutionen (137 vom 02.05.2023, 147 vom 18.05.2023, 185 vom 14.06.2023) sind nur über
    eine Sekundärquelle belegt. Der amtliche Weg führt über derechodeautor.gov.co; die dortige Normensammlung
