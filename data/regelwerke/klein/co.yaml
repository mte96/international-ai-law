- id: co-ley-270-1996
  jurisdiktion: co
  kurztitel: Ley Estatutaria 270 de 1996 — Justizverfassungsgesetz
  offizieller_titel: Ley Estatutaria 270 de 1996, Estatutaria de la Administración de Justicia (modificada
    por la Ley 2430 de 2024)
  fundstelle: 'Diario Oficial No. 42.745 de 15 de marzo de 1996; Änderungsgesetz: Ley 2430 de 2024'
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Organgesetz der kolumbianischen Justiz, 2024 durch die Ley 2430 de 2024 umfassend novelliert.
    Für das KI-Recht zählen zwei Stränge: die Verwaltungs- und Regelungsbefugnisse des Consejo Superior
    de la Judicatura (Art. 85), auf die das Acuerdo PCSJA24-12243 gestützt ist, und die Vorschriften über
    den Technologieeinsatz in der Rechtspflege. Ein ausdrücklicher KI-Bezug fehlt.

    '
  kurzbeschreibung: 'Als Ley Estatutaria steht das Gesetz zwischen Verfassung und einfachem Recht und
    unterliegt der vorherigen Verfassungskontrolle. Es organisiert die Rechtspflege, bestimmt die Aufgaben
    des Consejo Superior de la Judicatura und der Escuela Judicial Rodrigo Lara Bonilla und enthält den
    allgemeinen Auftrag zur technologischen Modernisierung der Justiz. Adressaten sind die Organe der
    Rama Judicial. Sanktionen enthält es nicht; seine Bedeutung liegt in der Kompetenzzuweisung: Ohne
    Art. 85 Nr. 1a hätte der Consejo Superior de la Judicatura keine Grundlage, den KI-Einsatz durch Richterinnen
    und Richter verbindlich zu regeln, und die Anordnung aus T-323/24 wäre ins Leere gegangen.

    '
  inkrafttreten:
