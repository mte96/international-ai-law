- id: co-sic-circular-002-2024
  jurisdiktion: co
  kurztitel: SIC Circular Externa 002 de 2024 — KI-Leitlinie der Datenschutzaufsicht
  offizieller_titel: Circular Externa No. 002 del 21 de agosto de 2024 — Lineamientos sobre el Tratamiento
    de Datos Personales en Sistemas de Inteligencia Artificial
  fundstelle: Superintendencia de Industria y Comercio, Circular Externa 002 de 2024, 21 de agosto de
    2024
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Rundverfügung der Aufsichtsbehörde an die von ihr beaufsichtigten Stellen. Sie schafft
    keine neuen Pflichten, sondern legt die Ley 1581 de 2012 und die Ley 1266 de 2008 für KI-Systeme aus.
    Faktisch ist sie der Maßstab jeder Aufsichtsmaßnahme und damit für die Praxis das wichtigste KI-Dokument
    Kolumbiens außerhalb der Justiz. Erlassen ein knappes Jahr vor der ersten kolumbianischen KI-Gesetzgebung
    und knapp drei Wochen nach T-323/24.

    '
  kurzbeschreibung: 'Zehn nummerierte Leitlinien (I-X) für die Verarbeitung personenbezogener Daten in
    KI-Systemen. Adressaten sind alle der SIC unterstehenden Verantwortlichen und Auftragsverarbeiter.
    Rechtsgrundlagen sind die Ley Estatutaria 1581 de 2012, die Ley Estatutaria 1266 de 2008 und das CONPES
    3975; die KI-Definition übernimmt die Behörde von der OECD (Fassung 2023). Die Circular verlangt eine
    Verhältnismäßigkeitsprüfung in vier Schritten, ein Vorsorgeprinzip, Risikomanagement, eine Datenschutz-Folgenabschätzung
    vor der Entwicklung von Hochrisiko-Anwendungen, Datenqualität, technische Schutzmaßnahmen einschließlich
    Differential Privacy, Transparenz, Sicherheits- und Auditpflichten sowie — der praktisch schärfste
    Punkt — die Klarstellung, dass öffentlich zugängliche Daten nicht automatisch ''datos públicos'' im
    Rechtssinne sind und ihre Verwendung für das Training daher der Einwilligung bedarf. Eigene Sanktionen
    enthält die Circular nicht; durchgesetzt wird sie über die Sanktionen des Art. 23 Ley 1581.

    '
  inkrafttreten:
    datum: 2024-08-21
    verifiziert: true
    quelle: https://sedeelectronica.sic.gov.co/sites/default/files/normativa/Circular%20Externa%20No.%20002%20del%2021%20de%20agosto%20de%202024.pdf
  anwendungsdaten: []
  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 'I. Verhältnismäßigkeit: Die Verarbeitung muss geeignet, erforderlich, angemessen und verhältnismäßig
    sein — vier kumulative Anforderungen.'
  - 'II. Vorsorgeprinzip: Bei Unsicherheit über mögliche Schäden ist von der Verarbeitung abzusehen oder
    es sind Schutzmaßnahmen zu ergreifen.'
  - 'III. Risikomanagement: Identifizierung, Klassifizierung und laufende Überwachung der Verarbeitungsrisiken.'
  - IV. Datenschutz-Folgenabschätzung VOR der Entwicklung von KI mit hohem Risiko, mit Beschreibung der
    Verarbeitung, Risikobewertung und Schutzmaßnahmen. Damit führt die SIC ein DSFA-Erfordernis ein, das
    die Ley 1581 selbst nicht kennt.
  - 'V. Datenqualität: Daten müssen wahr, vollständig, genau, aktuell und nachvollziehbar sein — die Übersetzung
    des Grundsatzes der veracidad in die Trainingsdatenfrage.'
  - VI. Technische Schutzmaßnahmen, ausdrücklich Differential Privacy als Umsetzungstechnik.
  - VII. Informationszugang und Transparenz gegenüber den Betroffenen.
  - VIII. Sicherheitsmaßnahmen technischer, administrativer und physischer Art gegen unbefugten Zugriff
    und Missbrauch; Auditpflicht.
  - 'IX. ÖFFENTLICH ZUGÄNGLICHE DATEN: Frei im Netz auffindbare Daten sind nicht ohne Weiteres ''öffentliche
    Daten'' im Sinne des Gesetzes; für ihre Verwendung ist grundsätzlich die Einwilligung des Betroffenen
    erforderlich. Das ist die kolumbianische Antwort auf die Scraping-Frage und steht in scharfem Gegensatz
    zur Praxis der großen Modellanbieter.'
  - X. Nachweisbare Compliance-Strategien zur Wahrung der Rechte aus Ley 1581 und Ley 1266.
