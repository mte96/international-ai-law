- id: co-pl-384-2025
  jurisdiktion: co
  kurztitel: PL 384/2025C — KI-Plattformen und Minderjährige (archiviert)
  offizieller_titel: Proyecto de Ley 384 de 2025 Cámara, por medio de la cual se regula el acceso y uso
    de plataformas digitales de inteligencia artificial en niños, niñas y adolescentes y se dictan otras
    disposiciones
  fundstelle: Gaceta del Congreso No. 2379 de 2025 (ponencia primer debate)
  verfahrensnummer: P.L. 384/2025 Cámara; proyecto-35918
  status: gescheitert
  status_detail: 'Am 01.10.2025 in der Cámara eingebracht, Comisión Sexta, Berichterstatterin Ingrid Marlen
    Sogamoso Alfonso, Ponencia für die erste Lesung in der Gaceta 2379/2025. Verfahrensstand am 06.09.2026:
    Archivado nach Art. 190 Ley 5 de 1992. Von den sechs Entwürfen der einzige mit einem klar umgrenzten
    sektoralen Gegenstand — und damit derjenige, der eine reelle Chance auf Wiedervorlage hat.

    '
  kurzbeschreibung: 'Regelung des Zugangs von Kindern und Jugendlichen zu digitalen KI-Plattformen. Neun
    Abgeordnete und drei Senatorinnen und Senatoren zeichnen als Autoren, darunter Ángela María Vergara
    González, Juana Carolina Londoño Jaramillo, Karina Espinosa Oliver und Marcos Daniel Pineda García.
    Der Regelungsansatz entspricht funktional Art. 4 Abs. 4 der italienischen Legge 132/2025, der den
    Zugang von unter Vierzehnjährigen zu KI-Technologien an die Einwilligung der Sorgeberechtigten bindet.

    '
