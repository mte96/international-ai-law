- id: co-ley-2213-2022
  jurisdiktion: co
  kurztitel: Ley 2213 de 2022 — dauerhafte digitale Justiz
  offizieller_titel: Ley 2213 de 2022, por medio de la cual se establece la vigencia permanente del Decreto
    Legislativo 806 de 2020 y se adoptan medidas para implementar las tecnologías de la información y
    las comunicaciones en las actuaciones judiciales, agilizar los procesos judiciales y flexibilizar
    la atención a los usuarios del servicio de justicia y se dictan otras disposiciones
  fundstelle: Diario Oficial No. 52.064 de 13 de junio de 2022
  verfahrensnummer: Proyecto de Ley 231/2021 Cámara — 424/2021 Senado (nicht abschließend verifiziert)
  status: anwendbar
  status_detail: 'In Kraft seit 13.06.2022 (Art. 15: ''rige a partir de su promulgación''). Das Gesetz
    macht das pandemiebedingte Decreto Legislativo 806 de 2020 zu Dauerrecht. Es gilt für alle Gerichtsbarkeiten.
    Die Corte Constitucional hat sich in C-121/23 zu Art. 1 und 7 nicht in der Sache geäußert (Prozessentscheidung,
    Inhibición); weitere Klagen gegen Art. 6 waren anhängig. Kein einziger Artikel erwähnt künstliche
    Intelligenz.

    '
  kurzbeschreibung: 'Verfahrensrechtliches Rahmengesetz für den Einsatz von Informations- und Kommunikationstechnologie
    in allen kolumbianischen Gerichtsverfahren. Es verpflichtet Gerichte und Parteien zum Gebrauch digitaler
    Kanäle, schafft die elektronische Klageerhebung, die elektronische Zustellung, die virtuelle Verhandlung
    und die digitale Akte, und beseitigt Erfordernisse handschriftlicher Unterschrift und persönlicher
    Vorlage. Adressaten sind Gerichte, Parteien und Verfahrensbevollmächtigte. Eigene Sanktionen enthält
    das Gesetz nicht; Rechtsfolge einer Verletzung sind die allgemeinen prozessualen Folgen (Unzulässigkeit
    der Klage nach Art. 6, Wirksamkeit der Zustellung an die zuletzt angegebene Adresse nach Art. 3, Nichtigkeit
    nach allgemeinem Prozessrecht). Rechtspolitisch ist das Gesetz für das KI-Recht deshalb bedeutsam,
    weil es die einzige Norm ist, auf die kolumbianische Richter ihren KI-Einsatz stützen: Der Berufungsrichter
    im Fall T-323/24 hat ChatGPT ausdrücklich mit dem Argument befragt, ''la Ley 2213 de 2022 tiene por
    objeto la incorporación de las TIC en los procesos judiciales''. Die Corte Constitucional ist dieser
    Auslegung nicht ausdrücklich entgegengetreten, hat den KI-Einsatz aber an zwölf eigene Kriterien gebunden.

    '
  inkrafttreten:
    datum: 2022-06-13
    verifiziert: true
    quelle: http://www.secretariasenado.gov.co/senado/basedoc/ley_2213_2022.html
  anwendungsdaten:
  - datum: 2020-06-04
    was_gilt: Inkrafttreten des Decreto Legislativo 806 de 2020, dessen Regeln die Ley 2213 wörtlich übernimmt
      (befristet auf zwei Jahre).
    verifiziert: false
    quelle: http://www.secretariasenado.gov.co/senado/basedoc/ley_2213_2022.html
  - datum: 2022-06-13
    was_gilt: Verkündung im Diario Oficial 52.064 und Inkrafttreten; das Sonderrecht der Pandemie wird
      Dauerrecht.
    verifiziert: true
    quelle: http://www.secretariasenado.gov.co/senado/basedoc/ley_2213_2022.html
  - datum: 2023-04-26
    was_gilt: 'Sentencia C-121/23: Die Corte Constitucional erklärt sich hinsichtlich der Klage gegen
      Art. 1 und 7 (teilweise) für unzuständig zur Sachentscheidung (Inhibición wegen ineptitud sustantiva
      de la demanda). Die Vorschriften bleiben unangetastet.'
    verifiziert: true
    quelle: https://www.corteconstitucional.gov.co/relatoria/2023/C-121-23.htm
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Art. 1 (Objeto): Übernahme des Decreto Ley 806 de 2020 als Dauerrecht, ''para implementar el uso
    de las tecnologías de la información y las comunicaciones en las actuaciones judiciales'' und zur
    Beschleunigung der Verfahren in allen Gerichtsbarkeiten. Ausdrücklich garantiert bleibt die persönliche
    Vorsprache im Gericht; besondere Vorkehrungen für schutzbedürftige Gruppen und für Gebiete ohne Netzanbindung.'
  - 'Art. 2 (Uso de las tecnologías): ''Se podrán utilizar las tecnologías de la información y de las
    comunicaciones, cuando se disponga de los mismos de manera idónea, en la gestión y trámite de los
    procesos judiciales.'' Erfordernisse handschriftlicher Unterschrift, persönlicher Vorlage und Beglaubigung
    entfallen. Diese Norm ist die einzige, auf die der Berufungsrichter in T-323/24 seinen ChatGPT-Einsatz
    gestützt hat — sie erlaubt ''Technologien'', kennt aber keine generative KI und keine Verifikationspflicht.'
  - 'Art. 3 (Deberes de los sujetos procesales): Pflicht der Parteien, digitale Kanäle anzugeben und Änderungen
    mitzuteilen; andernfalls gelten Zustellungen an die zuletzt genannte Adresse als wirksam.'
  - 'Art. 4 (Expedientes): Zusammenarbeit bei fehlendem Zugang zur Papierakte; ausdrückliche Zulassung
    hybrider digitaler Akten.'
  - 'Art. 5 (Poderes): Vollmachten können durch bloße Datennachricht ohne handschriftliche oder digitale
    Signatur erteilt werden; sie gelten als authentisch.'
  - 'Art. 6 (Demanda): Elektronische Klageerhebung; Angabe digitaler Kanäle bei Vermeidung der Unzulässigkeit;
    Pflicht des Klägers, die Klage gleichzeitig an die Gegenseite zu übersenden. Gegen diese Vorschrift
    richtete sich 2023 eine gesonderte Verfassungsklage.'
  - 'Art. 7 (Audiencias): ''Las audiencias deberán realizarse utilizando los medios tecnológicos a disposición
    de las autoridades judiciales o por cualquier otro medio puesto a disposición por una o por ambas
    partes.'' Beweisaufnahme in Präsenz, wenn Sicherheit, Unmittelbarkeit und Beweiskraft es verlangen;
    im Strafverfahren kann der Richter Virtualität nur ausnahmsweise anordnen.'
  - 'Art. 8 (Notificaciones personales): Zustellung per E-Mail ohne vorherige Ladung; sie gilt zwei Werktage
    nach Absendung als bewirkt. Die Partei muss eidesstattlich versichern, dass die Adresse dem Empfänger
    zuzuordnen ist.'
  - 'Art. 9 (Notificación por estado y traslados): Virtuelle Anschlagliste ohne Ausdruck und ohne Unterschrift
    des Urkundsbeamten.'
  - 'Art. 10 (Emplazamiento): Öffentliche Ladung ausschließlich über das registro nacional de personas
    emplazadas, ohne Presseveröffentlichung.'
  - 'Art. 11 (Comunicaciones, oficios y despachos): Übermittlung durch Datennachricht; Authentizitätsvermutung
    für Nachrichten aus der amtlichen Adresse der Behörde.'
  - 'Art. 12 und 13: Sonderregeln des Berufungsverfahrens in Zivil- und Familiensachen (Art. 12) sowie
    in Arbeitssachen (Art. 13), jeweils mit Fünf-Tage-Fristen für Begründung und Erwiderung.'
  - 'Art. 14 (Informe anual): Die Rama Judicial muss dem Kongress jährlich ein eigenes Kapitel über den
    Stand ihrer digitalen Transformation vorlegen — die einzige Berichtspflicht, an die sich ein KI-Monitoring
    anknüpfen ließe.'
  - 'Art. 15: Inkrafttreten mit der Verkündung; Aufhebung entgegenstehender Vorschriften.'
  - 'LÜCKE: Das Gesetz kennt weder den Begriff der künstlichen Intelligenz noch eine Offenlegungs-, Verifikations-
    oder Dokumentationspflicht. Alles, was in Kolumbien für den KI-Einsatz in der Justiz gilt, ist deshalb
    Richterrecht (T-323/24) oder Verwaltungsrecht der Justizverwaltung (Acuerdo PCSJA24-12243) — nicht
    Gesetzesrecht.'
