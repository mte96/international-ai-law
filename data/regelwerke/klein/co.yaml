- id: co-ley-2502-2025
  jurisdiktion: co
  kurztitel: Ley 2502 de 2025 — KI-Strafschärfung bei Identitätsanmaßung
  offizieller_titel: Ley 2502 de 2025, por medio de la cual se modifica y establece un agravante al artículo
    296 de la Ley 599 de 2000, Código Penal colombiano, y se dictan otras disposiciones
  fundstelle: Diario Oficial No. 53.198 de 31 de julio de 2025; sancionada el 28 de julio de 2025
  verfahrensnummer: nicht ermittelt
  status: anwendbar
  status_detail: 'Sanktioniert am 28.07.2025, verkündet am 31.07.2025. Das Gesetz gilt seit seiner Sanktion;
    die Strafrechtsänderung selbst tritt nach der Übergangsvorschrift erst ein Jahr später in Kraft, also
    am 28.07.2026 — sie ist damit seit gut sechs Wochen anwendbar. Am 15./18.07.2026 hat die Corte Constitucional
    die Vorschrift in der Sentencia C-212 de 2026 für verfassungsgemäß erklärt. Damit ist Ley 2502 de
    2025 die erste und bislang einzige materiell KI-spezifische Norm des kolumbianischen Gesetzesrechts.

    '
  kurzbeschreibung: 'Das Gesetz fügt dem Straftatbestand der falsedad personal (Art. 296 Código Penal)
    einen Erschwerungsgrund für den Einsatz künstlicher Intelligenz hinzu: Wird die Personenfälschung
    unter Verwendung von KI begangen, erhöht sich die Geldstrafe um bis zu ein Drittel. Es definiert in
    Art. 2 erstmals im kolumbianischen Gesetzesrecht die Begriffe DeepFake, Identität und Bild. Art. 4
    verpflichtet die Regierung, binnen zwei Jahren eine öffentliche Politik gegen den täuschenden Einsatz
    von KI mit acht Leitlinien zu formulieren (Ethik, sektorübergreifende Zusammenarbeit, Bildung, Technologie,
    Transparenz, internationale Kooperation, schnelle Reaktion, Außenbeziehungen). Art. 5 verpflichtet
    die Fiscalía General de la Nación zur systematischen Erfassung solcher Fälle und zum jährlichen Bericht
    an den Kongress. Adressaten sind Täter der Personenfälschung, die Exekutive und die Staatsanwaltschaft.

    '
  inkrafttreten:
    datum: 2025-07-31
    verifiziert: true
    quelle: https://normograma.mintic.gov.co/mintic/compilacion/docs/ley_2502_2025.htm
  anwendungsdaten:
  - datum: 2025-07-28
    was_gilt: Sanktion des Gesetzes; Inkrafttreten des allgemeinen Teils (Definitionen, Politikauftrag,
      Berichtspflicht).
    verifiziert: true
    quelle: https://normograma.mintic.gov.co/mintic/compilacion/docs/ley_2502_2025.htm
  - datum: 2025-07-31
    was_gilt: Verkündung im Diario Oficial 53.198.
    verifiziert: true
    quelle: https://www.alcaldiabogota.gov.co/sisjur/normas/Norma1.jsp?dt=S&i=188454
  - datum: 2026-07-28
    was_gilt: 'Inkrafttreten der Strafrechtsänderung (Art. 3): Der KI-Erschwerungsgrund des Art. 296 Código
      Penal ist seither anwendbar.'
    verifiziert: true
    quelle: https://normograma.mintic.gov.co/mintic/compilacion/docs/ley_2502_2025.htm
  - datum: 2026-07-15
    was_gilt: 'Sentencia C-212 de 2026 (Expediente D-17.052, M.P. Jorge Enrique Ibáñez Najar): Die Corte
      Constitucional erklärt den KI-Erschwerungsgrund für exequible. Das Fehlen einer gesetzlichen KI-Definition
      verletzt das Bestimmtheitsgebot nicht, weil objektive und überprüfbare Bezugspunkte (OECD, nationale
      Dekrete, internationale Regelwerke) vorliegen.'
    verifiziert: false
    quelle: https://www.corteconstitucional.gov.co/comunicados/comunicado-23-julio-15-de-2026.pdf
  themenachsen:
  - content
  - grundrechte
  - haftung
  - governance
  regelungsschwerpunkte:
  - 'Art. 1 (Objeto): Änderung des Straftatbestands der falsedad personal um einen Erschwerungsgrund für
    den KI-Einsatz bei Identitätsanmaßung.'
  - 'Art. 2 (Definiciones): erste gesetzliche Legaldefinitionen. DeepFake: ''creación, modificación y
    utilización de un registro audiovisual [...] mediante Inteligencia Artificial [...] de manera que
    parezca auténtico''. Ferner Identität (Gesamtheit der Merkmale, die eine Person als Rechtssubjekt
    kenntlich machen) und Bild (äußere Projektion der Person, geschützt gegen unbefugte Verwendung).'
  - 'Art. 3 (Strafrechtsänderung): Anfügung eines Absatzes an Art. 296 Ley 599 de 2000 — ''Cuando la falsedad
    personal se realizare con la utilización de Inteligencia Artificial la multa se aumentará hasta en
    una tercera parte.'' Bemerkenswert: Verschärft wird nur die GELDSTRAFE, nicht die Freiheitsstrafe.
    Der praktische Effekt ist damit gering; die Bedeutung des Gesetzes liegt in der Definitionsnorm und
    im Politikauftrag.'
  - 'Art. 4 (Política pública): Auftrag an die Regierung, binnen zwei Jahren (Frist: 28.07.2027) Leitlinien
    gegen den täuschenden Einsatz von KI zu formulieren, mit acht inhaltlichen Vorgaben.'
  - 'Art. 5 (Berichtspflicht): Die Fiscalía General de la Nación erfasst die Fälle systematisch und berichtet
    dem Kongress jährlich über die Entwicklung.'
  - 'Vigencia: Das Gesetz gilt ab der Sanktion; die Strafrechtsänderung ein Jahr danach.'
  - 'VERFASSUNGSRECHTLICH: In C-212/26 wurde gerügt, der Erschwerungsgrund knüpfe an einen gesetzlich
    nicht definierten Begriff an und lade zu willkürlicher Auslegung ein. Die Corte hat die Vorschrift
    gehalten — die gleiche Frage, die die mexikanische SCJN 2025 in den acciones de inconstitucionalidad
    66/2024, 80/2024 und 104/2024 zu landesrechtlichen KI-Straftatbeständen ebenso beantwortet hat. Damit
    stehen zwei lateinamerikanische Verfassungsgerichte auf derselben Linie: Ein funktionaler KI-Begriff
    genügt dem Bestimmtheitsgebot.'
