  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - 'FEHLER KORRIGIERT. Eingetragen war das Datum der Beschlussfassung durch die Comisión del Acuerdo
    de Cartagena (17.12.1993). Am amtlichen Text der Comunidad Andina wurde geprueft, dass eine Vigencia-Klausel
    fehlt; WIPO Lex weist als Inkrafttreten den 21.12.1993 aus, das Datum der Gaceta Oficial No. 145.
    Status ''anwendbar'' bleibt richtig; die Decisión gilt unveraendert als vorrangiges Gemeinschaftsrecht
    der Andengemeinschaft. Vorher: 1993-12-17.'
- id: co-resolucion-1644-2026
  jurisdiktion: co
  kurztitel: Resolución 1644 de 2026 — Telemedizin mit KI-Vorgaben
  offizieller_titel: Resolución 1644 de 2026 del Ministerio de Salud y Protección Social, por la cual
    se actualizan las disposiciones sobre telesalud y telemedicina
  fundstelle: Ministerio de Salud y Protección Social, Resolución 1644 de 31 de julio de 2026
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Am 31.07.2026 erlassen; ersetzt die Resolución 2654 de 2019. Sie gilt seit dem Erlass,
    mit einer zwölfmonatigen Übergangsfrist für bereits zugelassene Dienste. Sie ist die einzige sektorale
    kolumbianische Vorschrift mit ausdrücklichen KI-Anforderungen. NICHT AUS DER PRIMÄRQUELLE GEPRÜFT:
    Der amtliche PDF-Volltext auf minsalud.gov.co war unter der aus Sekundärquellen bekannten Adresse
    nicht abrufbar.

    '
  kurzbeschreibung: 'Neuordnung der Telegesundheit und Telemedizin in Kolumbien mit vier Versorgungsformen.
    Für das KI-Recht enthält sie den Grundsatz, dass künstliche Intelligenz assistiert, aber das klinische
    Urteil nicht ersetzt und die Entscheidungshoheit bei der Ärztin oder dem Arzt bleibt. Nach dem zugrunde
    liegenden Entwurf (Art. 23) müssen KI-gestützte Plattformen unter menschlicher Aufsicht arbeiten und
    Nachvollziehbarkeit, dokumentierte Funktionsnachweise, Algorithmenvalidierung, hochwertige Trainingsdaten
    und Vorkehrungen gegen Verzerrungen bieten; KI-Systeme mit diagnostischer Funktion bedürfen der Registrierung
    beim INVIMA als Medizinprodukt. Adressaten sind EPS, IPS und Anbieter digitaler Gesundheitsdienste.

    '
