  regelungsschwerpunkte:
  - Risikobasierter Ansatz nach europäischem Vorbild; Pflichtendichte abhängig vom Grad der Beeinträchtigung
    von Freiheit oder Gesundheit.
  - Autoridad Nacional de Inteligencia Artificial mit Zertifizierungs-, Aufsichts- und Koordinierungsaufgaben,
    federführend MinCiencias.
  - Transparenzvorgaben, regulatorische Sandkästen, Förderung von Forschung und technologischer Souveränität,
    Bürgerbeteiligung.
  - 'Verfahren: mensaje de urgencia des Präsidenten mit der Folge gemeinsamer Beratung in den Comisiones
    Sextas beider Kammern (Art. 163 CP).'
  - 'SCHEITERN: Trotz Regierungsinitiative, Dringlichkeitsbotschaft und positiver Berichterstattung wurde
    die erste Lesung nicht abgeschlossen. Das ist der aussagekräftigste Befund zum kolumbianischen KI-Recht:
    Nicht inhaltlicher Dissens, sondern die Zwei-Legislaturperioden-Regel des Art. 190 Ley 5 de 1992 hat
    sechs Entwürfe hintereinander erledigt.'
