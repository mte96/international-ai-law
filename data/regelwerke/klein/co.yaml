  offene_punkte:
  - Der amtliche Volltext ist nachzuholen. Insbesondere ist zu prüfen, ob der KI-Artikel des Entwurfs
    (Art. 23) in der Endfassung erhalten geblieben ist und welche Nummer er dort trägt.
  - Die INVIMA-Registrierungspflicht für diagnostische KI ist nur aus dem Entwurf belegt; ihre Rechtsgrundlage
    im Medizinprodukterecht (Decreto 4725 de 2005) ist nicht geprüft.
