- id: co-decreto-806-2020
  jurisdiktion: co
  kurztitel: Decreto Legislativo 806 de 2020 — Notstandsrecht der digitalen Justiz
  offizieller_titel: Decreto Legislativo 806 de 2020, por el cual se adoptan medidas para implementar
    las tecnologías de la información y las comunicaciones en las actuaciones judiciales, agilizar los
    procesos judiciales y flexibilizar la atención a los usuarios del servicio de justicia, en el marco
    del Estado de Emergencia Económica, Social y Ecológica
  fundstelle: Diario Oficial, 4 de junio de 2020
  verfahrensnummer: Decreto Legislativo des Präsidenten im Ausnahmezustand (Art. 215 CP)
  status: aufgehoben
  status_detail: 'Auf zwei Jahre befristetes Notstandsdekret der COVID-19-Pandemie, von der Corte Constitucional
    in der automatischen Kontrolle geprüft und im Wesentlichen aufrechterhalten. Mit der Ley 2213 de 2022
    (13.06.2022) in Dauerrecht überführt und dadurch ersetzt. Historisch bedeutsam, weil die gesamte technologische
    Öffnung des kolumbianischen Prozessrechts aus einem Notstandsakt stammt — eine Ermächtigung, die nie
    für generative KI gedacht war.

    '
  kurzbeschreibung: 'Notstandsdekret vom 4. Juni 2020, das die elektronische Klageerhebung, die elektronische
    Zustellung, die virtuelle Verhandlung und die digitale Akte einführte. Sämtliche Vorschriften wurden
    2022 wörtlich in die Ley 2213 übernommen. Für das KI-Recht ist es die Vorgeschichte: Die Norm, auf
    die sich der Richter in T-323/24 berief, ist ihrer Herkunft nach eine Pandemieregel zur Aufrechterhaltung
    des Gerichtsbetriebs, kein Innovationsmandat.

    '
  inkrafttreten:
    datum: 2020-06-04
