    quelle: http://www.secretariasenado.gov.co/senado/basedoc/ley_1581_2012.html
  - datum: 2024-08-21
    was_gilt: Die SIC konkretisiert das Regime für KI-Systeme durch die Circular Externa 002 de 2024.
    verifiziert: true
    quelle: https://sedeelectronica.sic.gov.co/sites/default/files/normativa/Circular%20Externa%20No.%20002%20del%2021%20de%20agosto%20de%202024.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  - marktzugang
  regelungsschwerpunkte:
  - 'Art. 1: Gegenstand — Ausführung der Rechte aus Art. 15 und 20 CP (Kenntnis, Aktualisierung, Berichtigung).'
  - 'Art. 2: Anwendungsbereich mit Ausnahmen für Privat- und Hausarchive, nationale Sicherheit und Verteidigung,
    Geldwäscheprävention, nachrichtendienstliche Daten, journalistische Inhalte sowie die von der Ley
    1266 de 2008 erfassten Finanzdatenbanken.'
  - 'Art. 3: Legaldefinitionen, insbesondere ''autorización'': vorherige, ausdrückliche und informierte
    Einwilligung des Betroffenen.'
  - 'Art. 4: acht Grundsätze — legalidad, finalidad, libertad, veracidad o calidad, transparencia, acceso
    y circulación restringida, seguridad, confidencialidad. Der Grundsatz der finalidad ist die schärfste
    Schranke für die Zweckänderung zu Trainingszwecken.'
  - 'Art. 5 und 6: sensible Daten (u.a. Gesundheit, Sexualleben, biometrische Daten). Ihre Verarbeitung
    ist grundsätzlich untersagt; die Einwilligung muss ausdrücklich sein und der Betroffene ist darauf
    hinzuweisen, dass er sie verweigern darf. Für biometrische KI-Anwendungen ist das die entscheidende
    Norm.'
  - 'Art. 8: Betroffenenrechte — Kenntnis, Aktualisierung, Berichtigung, Nachweis der Einwilligung, Auskunft
    über die Verwendung, Beschwerde bei der SIC, Widerruf und Löschung, kostenfreier Zugang.'
  - 'Art. 9 und 10: Einwilligungserfordernis und seine Ausnahmen (öffentlich zugängliche Daten, gerichtliche
    Anordnung, medizinischer Notfall, historische, statistische oder wissenschaftliche Zwecke).'
  - 'Art. 12: Informationspflicht über Zweck und Rechte. Art. 13: Zulässige Empfänger.'
  - 'Art. 15: Reklamationsverfahren; Antwortfrist 15 Werktage.'
  - 'Art. 17 und 18: Pflichtenkatalog für responsable und encargado del tratamiento, einschließlich Sicherheit,
    Aktualität und Bearbeitung von Beschwerden.'
  - 'Art. 19 und 21: Die Superintendencia de Industria y Comercio ist über die Delegatura para la Protección
    de Datos Personales Aufsichtsbehörde; Ermittlungs-, Anordnungs- und Sperrbefugnisse.'
  - 'Art. 23: Sanktionen bis zu 2.000 gesetzlichen Monatsmindestlöhnen, Aussetzung bis sechs Monate, zeitweiliges
    oder endgültiges Verarbeitungsverbot, Betriebsschließung. Art. 24: Zumessungskriterien.'
  - 'LÜCKE: Kein Art.-22-DSGVO-Äquivalent. Kolumbien kennt weder ein Verbot ausschließlich automatisierter
    Einzelentscheidungen noch ein Recht auf Erläuterung. Die SIC hat diese Lücke 2024 nur teilweise über
    Transparenz- und Folgenabschätzungspflichten geschlossen — ohne gesetzliche Grundlage für ein subjektives
    Abwehrrecht.'
