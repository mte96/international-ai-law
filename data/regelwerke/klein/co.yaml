- id: co-decision-andina-351
  jurisdiktion: co
  kurztitel: Decisión Andina 351 de 1993 — gemeinsames Urheberrecht der Andengemeinschaft
  offizieller_titel: Decisión 351 de la Comisión del Acuerdo de Cartagena — Régimen Común sobre Derecho
    de Autor y Derechos Conexos
  fundstelle: Gaceta Oficial del Acuerdo de Cartagena; Decisión 351 de 17 de diciembre de 1993
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Unmittelbar geltendes und vorrangiges Gemeinschaftsrecht der Comunidad Andina für Bolivien,
    Kolumbien, Ecuador und Peru. Es geht dem nationalen Urheberrecht vor; der Tribunal de Justicia de
    la Comunidad Andina legt es im Vorabentscheidungsverfahren aus. Für das kolumbianische KI-Recht ist
    es die eigentliche Sperre gegen die Schutzfähigkeit maschinell erzeugter Erzeugnisse: Autor ist nach
    der Definition des Art. 3 die natürliche Person, die die geistige Schöpfung erbringt. NICHT AUS DER
    PRIMÄRQUELLE GEPRÜFT: Weder comunidadandina.org noch WIPO Lex lieferten einen abrufbaren Volltext.

    '
  kurzbeschreibung: 'Gemeinsames Urheberrechtsregime der Andengemeinschaft von 1993. Es definiert Werk
    und Autor, bestimmt Umfang und Dauer der Rechte, regelt Schranken und verwandte Schutzrechte. Adressaten
    sind die vier Mitgliedstaaten und ihre Rechtsunterworfenen. Die kolumbianische DNDA hat ihre Ablehnungsbescheide
    zu KI-erzeugten Erzeugnissen ausdrücklich auf die Decisión 351 zusammen mit der Ley 23 de 1982 gestützt.
    Der Gesetzentwurf PL 025/2026C beruft sich für die geplante TDM-Schranke auf Art. 21 der Decisión
    — die Schrankenvorschrift, die den Drei-Stufen-Test umsetzt. Damit steht fest: Eine kolumbianische
    TDM-Ausnahme muss sich am Andengemeinschaftsrecht messen lassen, und eine Ausnahme, die über Art.
    21 hinausgeht, wäre gemeinschaftsrechtswidrig. Das ist die eigentliche Schranke der kolumbianischen
    Gestaltungsfreiheit im Trainingsdatenrecht.

    '
  inkrafttreten:
    datum: 1993-12-21
    verifiziert: true
    quelle: https://www.wipo.int/wipolex/es/legislation/details/9445
    fundstelle_norm: 'Die Decisión 351 enthaelt selbst keine Vigencia-Klausel (Capítulo XIV Disposiciones
      Complementarias, Art. 58-61, sowie eine Disposición Transitoria Única). Massgeblich ist Art. 3 des
      Tratado de Creación del Tribunal de Justicia de la Comunidad Andina: unmittelbare Anwendbarkeit
      ab der Veroeffentlichung in der Gaceta Oficial del Acuerdo de Cartagena. Veroeffentlicht in der
      Gaceta Oficial No. 145 vom 21.12.1993; angenommen in Lima am 17.12.1993.'
  anwendungsdaten: []
  themenachsen:
  - urheberrecht
  - content
  regelungsschwerpunkte:
  - 'Art. 3: Legaldefinitionen. Autor ist die natürliche Person, die die geistige Schöpfung erbringt;
    Werk ist jede originelle geistige Schöpfung, die verbreitet oder vervielfältigt werden kann. Diese
    Definition ist der Grund, aus dem KI-Erzeugnisse in Kolumbien nicht eintragungsfähig sind.'
  - 'Art. 21: Schranken und Ausnahmen; Umsetzung des Drei-Stufen-Tests. Bezugspunkt der im PL 025/2026C
    geplanten TDM-Ausnahme.'
  - 'VORRANG: Als Andengemeinschaftsrecht geht die Decisión dem nationalen Recht vor. Ein kolumbianisches
    KI-Gesetz kann das Urheberrecht deshalb nur innerhalb des von Art. 21 gezogenen Rahmens öffnen — ein
    struktureller Unterschied zur Lage in Japan oder den USA.'
  dokumente:
  - datum: 1993-12-17
    typ: konsolidiert
    titel: Decisión N° 351 de la Comisión de la Comunidad Andina — Régimen Común sobre Derecho de Autor
      y Derechos Conexos (WIPO Lex)
    url: https://www.wipo.int/wipolex/es/legislation/details/18831
