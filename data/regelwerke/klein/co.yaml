- id: co-pl-043-2025
  jurisdiktion: co
  kurztitel: PL 043/2025S – 324/2025C — Regierungsentwurf zur KI (archiviert)
  offizieller_titel: Proyecto de Ley 043 de 2025 Senado — 324 de 2025 Cámara, por medio de la cual se
    regula la Inteligencia Artificial en Colombia para garantizar su desarrollo ético, responsable, competitivo
    e innovador, y se dictan otras disposiciones
  fundstelle: Gaceta del Congreso No. 2349 de 2025 (ponencia primer debate)
  verfahrensnummer: P.L. 043/2025 Senado — 324/2025 Cámara; proyecto-35981
  status: gescheitert
  status_detail: 'Von MinCiencias federführend erarbeiteter Regierungsentwurf, mit Dringlichkeitsbotschaft
    des Präsidenten (mensaje de urgencia) eingebracht und deshalb in gemeinsamer Sitzung der Comisiones
    Sextas beider Kammern zu behandeln. Die positive Berichterstattung für die erste Lesung lag im Dezember
    2025 vor (Gaceta 2349/2025, Berichterstatter Gerson Lisímaco Montaño Arizala); die Regierung drängte
    auf eine Sitzung vor dem 16.12.2025. Die Cámara führt den Entwurf am 06.09.2026 als ''Archivado (artículo
    190 Ley 5 de 1992)''. WIDERSPRUCH: Der Bericht der Zeitschrift Cambio vom August 2026 beschreibt das
    Vorhaben noch als ''im Kongress in Bearbeitung''. Der amtlichen Verfahrensakte ist der Vorrang zu
    geben; die Neueinbringung als PL 025/2026C am 21.07.2026 stützt die Archivierung.

    '
  kurzbeschreibung: 'Der bislang wichtigste Regulierungsversuch Kolumbiens. Erarbeitet vom Ministerio
    de Ciencia, Tecnología e Innovación unter Ministerin Yesenia Olaya Requene in Abstimmung mit DNP,
    MinTIC und Bildungsministerium; nach Angaben von MinCiencias integriert er mehr als dreizehn frühere
    Einzelinitiativen zu einem einheitlichen Rahmen. Inhaltlich: Risikoklassifizierung nach europäischem
    Vorbild mit an das Ausmaß der Beeinträchtigung von Freiheit oder Gesundheit gekoppelten Pflichten,
    eine Autoridad Nacional de Inteligencia Artificial mit Zertifizierungs-, Aufsichts- und Koordinierungsaufgaben
    unter Federführung von MinCiencias, Transparenzvorgaben, regulatorische Sandkästen sowie Förderung
    von Forschung, Talentbildung, technologischer Souveränität und Bürgerbeteiligung. Sein Scheitern erklärt,
    warum Kolumbien 2026 kein KI-Gesetz hat.

    '
  inkrafttreten: null
  anwendungsdaten:
