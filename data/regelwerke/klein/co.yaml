regelwerke:
- id: co-constitucion-1991
  jurisdiktion: co
  kurztitel: Verfassung Kolumbiens (CP)
  offizieller_titel: Constitución Política de Colombia
  fundstelle: Gaceta Constitucional No. 116 de 20 de julio de 1991 (segunda edición corregida)
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Die Verfassung enthält keine KI-spezifische Vorschrift. Sie ist gleichwohl das tragende
    Regelwerk der gesamten kolumbianischen KI-Rechtsprechung: Die Sentencia T-323/24 stützt ihre Kriterien
    für den richterlichen KI-Einsatz ausschließlich auf Art. 29 (debido proceso), Art. 228 (Unabhängigkeit
    der Rechtsprechung), Art. 229 (Zugang zur Justiz) und Art. 230 (Bindung des Richters allein an das
    Gesetz). Art. 15 (habeas data) ist die Grundlage des gesamten Datenschutzrechts, Art. 61 die des Urheberrechts.

    '
  kurzbeschreibung: 'Bundesverfassung von 1991. Für das KI-Recht wirkt sie auf vier Wegen. Erstens als
    Maßstab der Grundrechtsklage (acción de tutela, Art. 86) — in diesem Verfahren ist T-323/24 ergangen.
    Zweitens als Maßstab der abstrakten Normenkontrolle: In C-212/26 hat die Corte Constitucional den
    ersten KI-Straftatbestand Kolumbiens am Bestimmtheitsgebot gemessen. Drittens als Kompetenz- und Organisationsordnung:
    Art. 257 Nr. 3 gibt dem Consejo Superior de la Judicatura die Regelungsbefugnis, auf die das Acuerdo
    PCSJA24-12243 gestützt ist. Viertens als Quelle des habeas data (Art. 15), das die Ley 1581 de 2012
    ausführt. Sanktionen enthält die Verfassung nicht; Rechtsfolge einer Verletzung ist die Nichtigerklärung
    der Norm, der Grundrechtsschutz durch tutela oder — wie beim Tribunal Superior de Bogotá 2025 — die
    Nichtigkeit der gerichtlichen Entscheidung.

    '
  inkrafttreten:
    datum: 1991-07-04
    verifiziert: true
    quelle: https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=4125
    fundstelle_norm: 'ARTÍCULO 380 CP: ''Queda derogada la Constitución hasta ahora vigente con todas
      sus reformas. Esta Constitución rige a partir del día de su promulgación.'' Promulgation am 04.07.1991
      (Gaceta Constitucional No. 114); die zweite, berichtigte Ausgabe erschien als Gaceta Constitucional
      No. 116 vom 20.07.1991'
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  - governance
  - urheberrecht
  regelungsschwerpunkte:
  - 'Art. 15: habeas data. ''Todas las personas tienen derecho a su intimidad personal y familiar y a
    su buen nombre [...] De igual modo, tienen derecho a conocer, actualizar y rectificar las informaciones
    que se hayan recogido sobre ellas en bancos de datos y en archivos de entidades públicas y privadas.''
    Grundlage der Ley 1581 de 2012 und der Ley 1266 de 2008 und damit der KI-Leitlinie der SIC.'
  - 'Art. 20: Meinungs- und Informationsfreiheit; Gegenpol jeder Kennzeichnungs- und Deepfake-Regulierung.'
  - 'Art. 29: debido proceso. ''El debido proceso se aplicará a toda clase de actuaciones judiciales y
    administrativas.'' Der Prüfungsmaßstab von T-323/24 und der Grund, aus dem das Tribunal Superior de
    Bogotá 2025 ein halluziniertes Strafurteil kassiert hat.'
  - 'Art. 61: Schutz des geistigen Eigentums (''El Estado protegerá la propiedad intelectual por el tiempo
    y mediante las formalidades que establezca la ley'').'
  - 'Art. 86: acción de tutela — das Verfahren, in dem T-323/24 und die Entscheidungen der Corte Suprema
    zu halluzinierten Fundstellen ergangen sind.'
  - 'Art. 228: ''Las decisiones de la administración de justicia son independientes.'' In T-323/24 Rn.
    226 ausdrücklich zusammen mit Art. 230 als Schranke des KI-Einsatzes angeführt.'
  - 'Art. 229: Recht auf Zugang zur Rechtspflege. T-323/24 Rn. 78: Die Verletzung der Verfahrensgarantien
    im Justizdienst bedeutet zugleich eine Verletzung ''de los artículos 29, 228 y 229 superiores''.'
  - 'Art. 230: ''Los jueces, en sus providencias, sólo están sometidos al imperio de la ley.'' Von T-323/24
    Rn. 226 wörtlich zitiert. Das ist die eigentliche Sperre gegen einen KI-gestützten Spruchkörper: Ein
    Modell ist keine Rechtsquelle.'
  - 'Art. 241 Nr. 9: Zuständigkeit der Corte Constitucional zur Revision von Tutela-Urteilen — die Kompetenznorm
    von T-323/24.'
  - 'Art. 257 Nr. 3: Regelungsbefugnis des Consejo Superior de la Judicatura (''dictar los reglamentos
    necesarios para el eficaz funcionamiento de la administración de justicia''). Rechtsgrundlage des
    Acuerdo PCSJA24-12243.'
