    ausdruecklich an die Promulgation; diese erfolgte nach dem amtlichen Vermerk im Gestor Normativo erst
    mit dem Diario Oficial No. 35.949 vom 19.02.1982. Status ''anwendbar'' bleibt richtig. Die uebrigen
