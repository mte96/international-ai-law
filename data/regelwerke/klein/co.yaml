  pruefvermerk:
  - 'Am Volltext der unterzeichneten Resolución (31 Seiten, Faksimile der Ausfertigung mit Briefkopf des
    Ministerio de Salud y Protección Social) geprueft; der bisherige Vermerk ''NICHT AUS DER PRIMAERQUELLE
    GEPRUEFT'' ist erledigt. Datum richtig — die Resolución gilt ab Erlass, nicht ab Veroeffentlichung
    im Diario Oficial. Der amtliche Ablageort auf minsalud.gov.co war nicht erreichbar (404); die verwendete
    Fundstelle gibt den unterzeichneten Text vollstaendig wieder. NEUER BEFUND zur KI-Regelung: Art. 23
    verlangt fuer KI mit klinischer Wirkung eine dokumentierte technische und klinische Validierung (Leistung,
    Verzerrungen, Datenqualitaet, Cybersicherheit, menschliche Aufsicht, Aenderungsmanagement) unter Verantwortung
    des Leistungserbringers.'
