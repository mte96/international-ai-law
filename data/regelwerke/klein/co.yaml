- id: co-pl-025-2026
  jurisdiktion: co
  kurztitel: PL 025/2026C — laufender KI-Gesetzentwurf
  offizieller_titel: Proyecto de Ley 025 de 2026 Cámara, por medio de la cual se regula la inteligencia
    artificial en Colombia para garantizar su desarrollo ético y responsable y se dictan otras disposiciones
  fundstelle: Gaceta del Congreso No. 878 de 2026
  verfahrensnummer: 'P.L. 025/2026 Cámara (Senado: noch nicht eingebracht); proyecto-36127'
  status: verfahren
  status_detail: 'Eingebracht am 21.07.2026, veröffentlicht in der Gaceta 878 de 2026, zugewiesen an die
    Comisión Sexta Constitucional Permanente der Cámara de Representantes, Verfahrensstand am 06.09.2026
    ''Trámite en Comisión'' (erste Lesung noch nicht abgeschlossen). Es ist der einzige derzeit lebende
    horizontale KI-Gesetzentwurf Kolumbiens und der Neuanlauf nach der Archivierung des Regierungsentwurfs
    PL 043/2025S.

    '
  kurzbeschreibung: 'Horizontaler KI-Gesetzentwurf nach europäischem Vorbild. 33 Abgeordnete und 11 Senatorinnen
    und Senatoren zeichnen als Autoren, überwiegend aus dem Pacto Histórico; Koordinierender Berichterstatter
    für die erste Lesung ist David Alejandro Toro Ramírez, Berichterstatter sind Laura Isabel Vera Zapata
    und Mauricio Andrés Toro Orjuela. Der Entwurf übernimmt die vierstufige Risikosystematik der KI-Verordnung
    (verbotene Praktiken, Hochrisiko, begrenztes Risiko mit Transparenzpflichten, minimales Risiko), verlangt
    Transparenz und Erklärbarkeit, schützt personenbezogene Daten, verankert Arbeitnehmerschutz bei KI-bedingtem
    Stellenabbau samt Umschulungspflichten und einem Bewertungsausschuss, verschärft die Strafe für Identitätsanmaßung
    mittels KI (Deepfakes, Audiofakes, ''Callfakes'') unter Berufung auf das Recht am eigenen Bild (Sentencia
    T-634 de 2013), schafft eine urheberrechtliche Ausnahme für Text- und Data-Mining zu Forschungszwecken
    im Rahmen des Drei-Stufen-Tests unter ausdrücklicher Bezugnahme auf Art. 9 Abs. 2 der Berner Übereinkunft
    und Art. 21 der Decisión Andina 351 de 1993, sieht kollektive Verwertung vor und richtet regulatorische
    Sandkästen ein. Der Sanktionsrahmen nennt Verwarnung, Geldbuße, Aussetzung der Tätigkeit und Verarbeitungsverbote.
    Eine ausdrücklich bezifferte Aufsichtsbehörde ist im vorliegenden Text nicht benannt; anders als der
    Regierungsentwurf PL 043/2025S, der eine Autoridad Nacional de Inteligencia Artificial unter MinCiencias
    vorsah.

    '
  inkrafttreten: null
  anwendungsdaten:
  - datum: 2026-07-21
    was_gilt: Einbringung in der Cámara de Representantes (Bogotá, 21. Juli 2026), Veröffentlichung in
      der Gaceta 878 de 2026.
    verifiziert: true
    quelle: https://www.camara.gov.co/wp-content/uploads/2026/07/proyectos-ley/documentos/proyecto-36127/P.L.025-2026SC-INTELIGENCIA-ARTIFICIAL.pdf
  themenachsen:
  - marktzugang
  - gpai
  - urheberrecht
  - datenschutz
  - grundrechte
  - arbeit
  - content
  - governance
  - haftung
  regelungsschwerpunkte:
  - 'Risikosystematik nach dem Vorbild der Verordnung (EU) 2024/1689: verbotene Systeme (Sozialkreditbewertung,
    Verhaltensmanipulation), Hochrisiko (kritische Infrastruktur, Bildung, Beschäftigung, öffentliche
    Dienste, Strafverfolgung, Migration), begrenztes Risiko (Chatbots mit Transparenzpflicht), niedriges
    Risiko (Spamfilter, Videospiele).'
  - Transparenz und Erklärbarkeit KI-gestützter Entscheidungen.
  - 'Arbeitsrecht: Schutz der Beschäftigungsstabilität, Umschulungs- und Umsetzungspflichten bei KI-bedingtem
    Stellenabbau, Bewertungsausschuss für Beschäftigungswirkungen. Das geht über Art. 11 der italienischen
    Legge 132/2025 hinaus, die nur auf das bestehende Transparenzregime verweist.'
  - 'Strafrecht: Verschärfung der falsedad personal bei KI-Einsatz, ausdrücklich für Deepfakes, Audiofakes
    und ''Callfakes''; dogmatisch gestützt auf das Recht am eigenen Bild (derecho a la propia imagen)
    nach Sentencia T-634 de 2013. Damit würde das Gesetz die Regelung der Ley 2502 de 2025 fortschreiben,
    die bislang nur die Geldstrafe erhöht.'
  - 'Urheberrecht: Ausnahme für Text- und Data-Mining zu Forschungszwecken im Rahmen des Drei-Stufen-Tests,
    mit Bezug auf Art. 9 Abs. 2 der Berner Übereinkunft und Art. 21 Decisión Andina 351 de 1993; Vorsehung
    kollektiver Verwertung. Das wäre die erste TDM-Schranke des kolumbianischen Rechts überhaupt — bislang
    gibt es keine.'
  - 'Innovationsförderung: regulatorische Sandkästen (sandboxes).'
  - 'Sanktionen: Verwarnung, Geldbußen, Aussetzung der Tätigkeit, Verarbeitungsverbote.'
  - 'Bezugsrahmen der Begründung: OECD, UNESCO und die KI-Verordnung der EU.'
