- id: co-ley-1266-2008
  jurisdiktion: co
  kurztitel: Ley 1266 de 2008 — Habeas Data für Finanz- und Kreditdaten
  offizieller_titel: Ley Estatutaria 1266 de 2008, por la cual se dictan las disposiciones generales del
    hábeas data y se regula el manejo de la información contenida en bases de datos personales, en especial
    la financiera, crediticia, comercial, de servicios y la proveniente de terceros países
  fundstelle: Diario Oficial No. 47.219 de 31 de diciembre de 2008
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Sektorales Sonderregime für Finanz-, Kredit-, Handels- und Dienstleistungsdaten, das
    neben der Ley 1581 de 2012 fortgilt. Für das KI-Recht bedeutsam, weil es die einzige kolumbianische
    Vorschrift enthält, die unmittelbar an ein algorithmisches Bewertungsverfahren anknüpft: die Scoring-Regeln.

    '
  kurzbeschreibung: 'Regelt Betreiber (operadores), Quellen (fuentes) und Nutzer (usuarios) von Finanz-
    und Kreditdatenbanken. Sie kennt Löschfristen für negative Einträge (Art. 13: höchstens vier Jahre),
    ein Beschwerdeverfahren (Art. 16) und eine geteilte Aufsicht zwischen der Superintendencia de Industria
    y Comercio und der Superintendencia Financiera de Colombia (Art. 17). Ihre KI-Relevanz liegt in der
    Scoring-Schranke: Die bloße laufende Abfrage einer Kreditakte darf nicht zur Verschlechterung der
    Risikobewertung führen, und Nutzer dürfen ihre Bewertungsmodelle nicht ausschließlich auf negative
    Historien stützen, sondern müssen weitere Risikofaktoren einbeziehen. Damit besteht in Kolumbien —
    anders als beim allgemeinen Datenschutz — ein punktuelles materielles Recht der algorithmischen Bewertung.

    '
  inkrafttreten:
    datum: 2008-12-31
    verifiziert: true
    quelle: http://www.secretariasenado.gov.co/senado/basedoc/ley_1266_2008.html
  anwendungsdaten: []
  themenachsen:
