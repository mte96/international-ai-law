- id: co-ley-1581-2012
  jurisdiktion: co
  kurztitel: Ley 1581 de 2012 — allgemeines Datenschutzgesetz (Habeas Data)
  offizieller_titel: Ley Estatutaria 1581 de 2012, por la cual se dictan disposiciones generales para
    la protección de datos personales
  fundstelle: Diario Oficial No. 48.587 de 18 de octubre de 2012
  verfahrensnummer: Proyecto de Ley Estatutaria; vorherige Verfassungskontrolle durch Sentencia C-748
    de 2011
  status: anwendbar
  status_detail: 'In Kraft seit Oktober 2012, als Ley Estatutaria vor der Verkündung durch die Corte Constitucional
    geprüft (C-748 de 2011). Sie ist das Auffangregime jeder KI-Datenverarbeitung in Kolumbien. Eine Änderung
    mit KI-Bezug ist bis 06.09.2026 nicht erfolgt; die Anpassung an KI leistet stattdessen die Circular
    Externa 002 de 2024 der SIC auf Auslegungsebene.

    '
  kurzbeschreibung: 'Führt das habeas data des Art. 15 CP aus. Sie gilt für personenbezogene Daten in
    öffentlichen und privaten Datenbanken in Kolumbien, mit Ausnahmen unter anderem für rein persönliche
    Archive, nationale Sicherheit, nachrichtendienstliche Daten und journalistische Inhalte. Sie kennt
    acht Verarbeitungsgrundsätze, ein grundsätzliches Einwilligungserfordernis (autorización previa, expresa
    e informada), ein verschärftes Schriftformerfordernis für sensible Daten einschließlich biometrischer
    Daten, Betroffenenrechte auf Kenntnis, Aktualisierung und Berichtigung, Sicherheits- und Meldepflichten
    sowie ein Register der Datenbanken. Die Aufsicht liegt bei der Superintendencia de Industria y Comercio
    über eine eigene Delegatura (Art. 19). Sanktionen nach Art. 23: Geldbußen bis zum Zweitausendfachen
    des gesetzlichen Monatsmindestlohns, Aussetzung der Verarbeitungstätigkeit bis zu sechs Monaten, zeitweiliges
    oder endgültiges Verbot der Verarbeitung, für Private auch Schließung des Betriebs. Anders als Art.
    22 DSGVO kennt das Gesetz KEIN eigenständiges Recht, einer ausschließlich automatisierten Einzelentscheidung
    nicht unterworfen zu werden — diese Lücke ist der zentrale Befund für das kolumbianische KI-Datenschutzrecht.

    '
  inkrafttreten:
    datum: 2012-10-18
    verifiziert: true
    quelle: http://www.secretariasenado.gov.co/senado/basedoc/ley_1581_2012.html
  anwendungsdaten:
  - datum: 2011-10-06
    was_gilt: 'Sentencia C-748 de 2011: vorherige Verfassungskontrolle des Entwurfs der Ley Estatutaria;
      Datum nicht aus der Primärquelle geprüft.'
