  offizieller_titel: 'Decreto 1074 de 2015, Decreto Único Reglamentario del Sector Comercio, Industria
    y Turismo (Libro 2, Parte 2, Título 2, Capítulo 25: compila el Decreto 1377 de 2013 reglamentario
    de la Ley 1581 de 2012)'
  fundstelle: Diario Oficial, 26 de mayo de 2015 (compila el Decreto 1377 de 2013, Diario Oficial 48.834
    de 27 de junio de 2013)
  verfahrensnummer: ''
  status: anwendbar
  status_detail: 'Ausführungsrecht zur Ley 1581 de 2012. Das Decreto 1377 de 2013 ist in das Einheitsdekret
    des Handelsressorts kompiliert worden und gilt seither in dieser Form fort. Es konkretisiert die Einwilligung,
    die Verarbeitungspolitik (política de tratamiento), die Informationspflichten und das Register der
    Datenbanken (RNBD). NICHT AUS DER PRIMÄRQUELLE GEPRÜFT: Der Gestor Normativo der Función Pública und
    suin-juriscol waren nicht abrufbar.

    '
  kurzbeschreibung: 'Führt die Ley 1581 de 2012 aus: Form und Nachweis der Einwilligung, Pflichtinhalt
    der Datenschutzerklärung, Verfahren zur Ausübung der Betroffenenrechte, Umgang mit Daten von Kindern
    und Jugendlichen sowie das Registro Nacional de Bases de Datos bei der SIC. Für KI-Anwendungen ist
    es einschlägig, weil jede Trainingsdatenbank mit personenbezogenen Daten registrierungspflichtig ist
    und weil der Nachweis der Einwilligung dem Verantwortlichen obliegt.

    '
  inkrafttreten:
