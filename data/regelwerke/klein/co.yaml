- id: co-pl-447-2024-idec
  jurisdiktion: co
  kurztitel: Ley de Datos / IDEC — PL 447/2024C – 248/2024S (archiviert)
  offizieller_titel: Proyecto de Ley 447 de 2024 Cámara — 248 de 2024 Senado, por medio de la cual se
    dictan disposiciones para el suministro, intercambio y aprovechamiento de la infraestructura de datos
    del Estado colombiano (IDEC) y la interoperabilidad de los sistemas de información de las entidades
    públicas
  fundstelle: Gaceta del Congreso No. 654 de 2024 (texto original); Gaceta 1484 de 2024 (texto definitivo
    plenaria Cámara)
  verfahrensnummer: P.L. 447/2024 Cámara — 248/2024 Senado
  status: gescheitert
  status_detail: 'Regierungsentwurf des MinTIC, am 22.05.2024 in der Cámara eingebracht, am 03.09.2024
    im Plenum der Cámara verabschiedet (Acta 171), am 26.11.2024 in dritter Lesung von der Comisión Sexta
    des Senats mit zehn Stimmen gebilligt. Danach im Senatsplenum nicht mehr abgeschlossen. Verfahrensstand
    am 06.09.2026: Archivado. Die ''Ley de Datos'', in der Öffentlichkeit als Grundlage der kolumbianischen
    KI-Entwicklung angekündigt, ist damit ebenfalls gescheitert.

    '
  kurzbeschreibung: 'Vier Kapitel, 35 Artikel. Der Entwurf sollte die Bereitstellung, den Austausch und
    die Nutzung der staatlichen Dateninfrastruktur (IDEC) sowie die Interoperabilität der Informationssysteme
    öffentlicher Stellen regeln. Der Datenschutz sollte über anonymisierte oder pseudonymisierte Daten
    gewahrt werden. Erklärtes Ziel war ausdrücklich, die Datengrundlage für die Entwicklung künstlicher
    Intelligenz in Kolumbien zu schaffen — MinTIC bewarb ihn als Gesetz ''para impulsar la inteligencia
    artificial en el país''. Sein Scheitern bedeutet, dass Kolumbien weder ein KI-Gesetz noch ein Datenzugangsgesetz
    hat.

    '
  inkrafttreten: null
  anwendungsdaten:
