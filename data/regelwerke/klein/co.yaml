- id: co-conpes-3975
  jurisdiktion: co
  kurztitel: CONPES 3975 de 2019 — erste KI-Politik Kolumbiens
  offizieller_titel: Documento CONPES 3975 — Política Nacional para la Transformación Digital e Inteligencia
    Artificial
  fundstelle: Consejo Nacional de Política Económica y Social, Documento CONPES 3975 de 2019
  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Verabschiedet 2019 vom CONPES unter Federführung des DNP. Fünfjähriger Umsetzungshorizont,
    damit 2024 ausgelaufen und 2025 durch das CONPES 4144 abgelöst. Rechtlich unverbindlich, faktisch
    der Bezugspunkt der gesamten kolumbianischen KI-Verwaltungspraxis: Die SIC stützt ihre Circular Externa
    002 de 2024 ausdrücklich auf dieses Dokument.

    '
  kurzbeschreibung: 'Erste nationale KI- und Digitalisierungspolitik Kolumbiens. Sie sollte Wert durch
    den strategischen Einsatz digitaler Technologien im öffentlichen und privaten Sektor schaffen. Vier
    Handlungsachsen: Abbau von Adoptionshindernissen, Schaffung von Innovationsbedingungen, Stärkung des
    Humankapitals, Vorbereitung auf die wirtschaftlichen und sozialen Veränderungen durch KI. Geschätztes
    Investitionsvolumen 121.619 Millionen Pesos über fünf Jahre. Beteiligt waren MinTIC, Finanz-, Arbeits-
    und Handelsministerium sowie das DNP. Das Dokument formuliert 14 Leitprinzipien für die KI-Entwicklung,
    darunter Marktschaffung, experimentelle Regulierung (Sandbox), ethische Rahmenbedingungen und die
    Anwerbung internationalen Talents. Sanktionen enthält es nicht.

    '
