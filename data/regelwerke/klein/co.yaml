  - 'Art. 85 Nr. 1a (i.d.F. der Ley 2430 de 2024): Regelungsbefugnis des Consejo Superior de la Judicatura
    für das wirksame Funktionieren der Rechtspflege. Zusammen mit Art. 257 Nr. 3 CP die ausdrücklich zitierte
    Rechtsgrundlage des Acuerdo PCSJA24-12243.'
  - 'Escuela Judicial Rodrigo Lara Bonilla: Fortbildungsanstalt der Justiz. T-323/24 Ziff. SEXTO hat ihr
    die Verbreitung der Entscheidung und die dauerhafte KI-Fortbildung aller Gerichte aufgegeben; Art.
    13 des Acuerdo PCSJA24-12243 setzt das um.'
  - Kein KI-spezifischer Tatbestand. Anders als die italienische Legge 132/2025 (Art. 15) kennt Kolumbien
    keine gesetzliche Regel, die die Auslegung und Anwendung des Rechts dem Menschen vorbehält — dieser
    Satz steht in Kolumbien nur im Urteil T-323/24 und im Acuerdo des Justizrats.
