  verfahrensnummer: ''
  status: softlaw
  status_detail: 'Am 14.02.2025 vom CONPES verabschiedet. Es ist das geltende Leitdokument der kolumbianischen
    KI-Politik und der Ersatz für das CONPES 3975 de 2019. Rechtlich unverbindlich; seine Maßnahmen sind
    über den Plan de Acción y Seguimiento (Anexo A) den beteiligten Stellen zugewiesen. Der Umstand, dass
    Kolumbien 2026 immer noch kein KI-Gesetz hat, macht dieses Dokument zum faktischen Rahmen: Verwaltung,
    Aufsichtsbehörden und Gerichte orientieren sich an ihm.

    '
  kurzbeschreibung: 'Nationale KI-Politik mit dem Ziel, die Kapazitäten für Forschung, Entwicklung, Einführung
    und den ethischen und nachhaltigen Einsatz von KI-Systemen zu schaffen. Sechs strategische Achsen:
    Ethik und Governance; Daten und Infrastruktur; Forschung, Entwicklung und Innovation; Kompetenzaufbau
    und digitales Talent; Risikominderung; Einsatz und Verbreitung von KI. Beteiligt sind das DNP und
    die Ministerien für Informations- und Kommunikationstechnologien, Verteidigung, Arbeit, Handel, Bildung
    und Wissenschaft sowie die Präsidentschaft. Die Umsetzung koordiniert ein interinstitutioneller KI-Ausschuss.
    Zeithorizont 2025 bis 2030. Adressaten sind ausschließlich staatliche Stellen; Sanktionen gibt es
    nicht.

    '
