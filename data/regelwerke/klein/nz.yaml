    verifiziert: true
    quelle: https://www3.parliament.nz/en/pb/sc/make-a-submission/document/54SCSSC_SCF_41586B19-BECE-4E53-94EB-08DE11D86E7A/deepfake-digital-harm-and-exploitation-bill
  themenachsen:
  - content
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - 'Regelungstechnik: Der Entwurf schafft keinen neuen Straftatbestand, sondern erweitert eine Legaldefinition.
    Damit greifen alle vorhandenen Tatbestände (Herstellung, Besitz, Veröffentlichung) automatisch auch
    für synthetische Darstellungen. Das ist die sparsamste denkbare Umsetzung und zugleich die konsequenteste
    Anwendung des neuseeländischen Grundsatzes, vorhandenes Recht zu nutzen.'
  - 'Wortlaut des neuen s. 216G Abs. 1A: "intimate visual recording includes a visual recording that has
    been created, synthesised, or altered without the knowledge or consent of the person who is the subject
    of the recording, and appears to show the person — (a) naked or with their genitals, pubic area, buttocks,
    or female breasts exposed, partially exposed, or clad solely in undergarments; or (b) engaged in an
    intimate sexual activity; or (c) engaged in showering, toileting, or other personal bodily activity
    that involves dressing or undressing."'
  - Zusätzlich wird in s. 216G ein neuer Abs. 4 eingefügt, der den Begriff "subject" für die ss. 216G
    und 216N definiert.
  - 'Allgemeine Begründung: Die Verbreitung sexuell expliziter Deepfakes verletze Selbsteigentum und persönliche
    Autonomie; die falsche Darstellung einer Person in intimem Zusammenhang sei ebenso ein Rechtsverstoss
    wie das Verbreiten echter intimer Aufnahmen.'
  - 'KRITIK (Technology and Law Committee der Law Association, Juni 2026): Der Entwurf enthält keinen
    Mechanismus, mit dem Angebot, Bereitstellung oder Entwicklung von Bildgenerierungstechnologie überwacht
    oder reguliert werden könnte; die Verantwortung werde vollständig auf die Opfer verlagert. Betreiber
    von "Nudify"-Anwendungen blieben wirtschaftlich unbehelligt. Ausserhalb sexualisierter Deepfakes blieben
    Identitätsbetrug, politische Täuschung und synthetische Beweismittel ungeregelt.'
