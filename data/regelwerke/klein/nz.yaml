- id: nz-algorithm-charter-2020
  jurisdiktion: nz
  kurztitel: Algorithm Charter for Aotearoa New Zealand
  offizieller_titel: Algorithm Charter for Aotearoa New Zealand
  fundstelle: Stats NZ (Tatauranga Aotearoa) für die neuseeländische Regierung, Juli 2020
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Freiwillige Selbstverpflichtung von Behörden, in Kraft seit Juli 2020, unterzeichnet
    von 29 Stellen. Nicht aufgehoben, aber seit 2023 nicht mehr fortgeschrieben; die zugehörige Seite
    ist zuletzt am 15.06.2023 geprüft worden. Das Public Service AI Framework (2025) führt den Charter
    als eine Grundlage, ersetzt ihn aber nicht förmlich. Der Status ist damit ungeklärt.

    '
  kurzbeschreibung: 'Der Charter verpflichtet die unterzeichnenden Behörden freiwillig auf sechs Zusagen
    für den Einsatz von Algorithmen: Transparenz (Erläuterung in einfacher Sprache, Angaben zur Datenverarbeitung),
    Partnerschaft (Einbeziehung von te ao Māori im Lichte der Grundsätze des Vertrags von Waitangi), Menschen
    (Ermittlung und Einbeziehung betroffener Gruppen), Daten (Kenntnis der Grenzen der Daten, Erkennung
    und Steuerung von Verzerrung), Datenschutz, Ethik und Menschenrechte (Peer Review auf unbeabsichtigte
    Folgen) sowie menschliche Aufsicht (benannte Ansprechstelle, Beschwerdemöglichkeit, Erläuterung der
    Rolle des Menschen in der Entscheidung). Anwendbar sind die Zusagen nach einer Risikomatrix, also
    abgestuft nach Auswirkung und Wahrscheinlichkeit. Sanktionen bestehen nicht.

    '
  inkrafttreten:
    datum: 2020-07-28
    verifiziert: true
    quelle: https://www.beehive.govt.nz/release/new-algorithm-charter-world-first
    fundstelle_norm: 'Keine Inkrafttretensvorschrift — freiwillige Selbstverpflichtung ohne Rechtsnormqualitaet.
      Massgeblich ist der Tag der Vorstellung: Ministerielle Mitteilung vom 28.07.2020, ''Minister James
      Shaw today launched the Algorithm Charter'''
  anwendungsdaten:
  - datum: 2021-12-01
    was_gilt: Erste unabhängige Überprüfung (Taylor Fry) mit Befragung von Unterzeichnern, Nichtunterzeichnern
      und Fachleuten.
    verifiziert: true
    quelle: https://data.govt.nz/assets/data-ethics/algorithm/Algorithm-Charter-Year-1-Review-FINAL.pdf
  - datum: 2023-06-15
    was_gilt: Letzter Prüfstand der amtlichen Charter-Seite; danach keine Fortschreibung mehr nachweisbar.
    verifiziert: true
    quelle: https://data.govt.nz/toolkit/data-ethics/government-algorithm-transparency-and-accountability/algorithm-charter
  themenachsen:
  - governance
  - sektor-oeffentlich
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Sechs Zusagen: Transparency, Partnership, People, Data, Privacy ethics and human rights, Human oversight.'
  - Die Zusage "Partnership" verankert te ao Māori und die Grundsätze des Vertrags von Waitangi im Algorithmeneinsatz
    der Verwaltung. Das ist weltweit die früheste ausdrückliche Verknüpfung von indigenen Vertragsrechten
    mit algorithmischer Verwaltung und der eigentliche neuseeländische Beitrag zur internationalen Debatte.
  - 'Risikomatrix statt fester Schwellen: Die Zusagen greifen abgestuft nach Auswirkung und Wahrscheinlichkeit
    — eine Vorwegnahme des risikobasierten Ansatzes vier Jahre vor der KI-VO, aber ohne Rechtsfolge.'
  - 29 unterzeichnende Stellen, darunter Corrections, Health, Police, Stats NZ, Ministry of Education
    und Inland Revenue. Nichtunterzeichner sind nicht gebunden; eine Beitrittspflicht besteht nicht.
  dokumente:
  - datum: 2020-07-28
    typ: norm
    titel: An Algorithm Charter for Aotearoa New Zealand
    url: https://data.govt.nz/assets/data-ethics/algorithm/Algorithm-Charter-2020_Final-English-1.pdf
    sprache: en
    urheber: Stats NZ / New Zealand Government
    verifiziert: true
    notiz: Der Wortlaut der sechs Zusagen.
  - datum: 2020-07-28
    typ: norm
    titel: Algorithm Charter for Aotearoa New Zealand (te reo Māori)
    url: https://data.govt.nz/assets/data-ethics/algorithm/Algorithm-Charter-2020-Final-Te-Reo-Maori.pdf
    sprache: mi
    urheber: Stats NZ
    verifiziert: false
    notiz: Amtliche Māori-Fassung; nicht im Einzelnen geprüft.
  - datum: 2021-12-01
    typ: bericht
    titel: Algorithm Charter for Aotearoa New Zealand — Year 1 Review
    url: https://data.govt.nz/assets/data-ethics/algorithm/Algorithm-Charter-Year-1-Review-FINAL.pdf
    sprache: en
    urheber: Taylor Fry für Stats NZ
    verifiziert: true
    notiz: Die einzige unabhängige Evaluierung; Grundlage jeder Aussage zur tatsächlichen Wirkung des
      Charters.
  - datum: 2020-01-01
    typ: konsultation
    titel: Developing the Charter — Konsultationsunterlagen
    url: https://data.govt.nz/docs/algorithm-charter-draft-sub
    sprache: en
    urheber: Stats NZ
    verifiziert: false
    notiz: Entstehungsgeschichte; nicht im Einzelnen geprüft.
  offene_punkte:
  - 'Der aktuelle Status ist ungeklärt: Der Charter ist nicht aufgehoben, wird aber seit 2023 nicht mehr
    gepflegt, während das Public Service AI Framework (2025) denselben Gegenstand behandelt.'
  - Ob und wie viele Behörden die Zusagen 2025/2026 noch anwenden, ist nicht ermittelbar; ein öffentliches
    Register fehlt.
  monitoring_quellen:
  - https://data.govt.nz/toolkit/data-ethics/government-algorithm-transparency-and-accountability/algorithm-charter
  bezug_regelwerke:
  - nz-public-service-ai-framework-2025
  - nz-privacy-act-2020
  - nz-social-security-act-2018-adm
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der Charter ist das Lehrstück des neuseeländischen Modells. Er war 2020 international
    führend — vor der KI-VO, vor dem NIST-Rahmen, mit einem ausdrücklichen Vertragsbezug, den kein anderer
    Staat kennt. Und er ist genau daran gescheitert, woran freiwillige Instrumente scheitern: Nach der
    ersten Evaluierung 2021 gibt es keine zweite, keine Sanktion, kein Register und seit 2023 keine Pflege.
    Wer den Satz "Neuseeland kommt ohne KI-Gesetz aus" prüfen will, sollte hier ansetzen: Das Instrument,
    das die Lücke schliessen sollte, ist ohne förmliche Aufhebung eingeschlafen.

    '
  pruefvermerk:
  - Bestaetigt. Der Charter gilt fort und ist nicht foermlich aufgehoben; data.govt.nz weist ihn mit Stand
    15.06.2023 als geltend aus und nennt inzwischen 30 unterzeichnende Stellen (der Eintrag nennt 29 —
    pruefen). Eine unabhaengige Ueberpruefung wurde im Dezember 2021 abgeschlossen.
- id: nz-select-committee-ai-briefing-2026
  jurisdiktion: nz
  kurztitel: Ausschuss-Briefing zu KI (2026)
  offizieller_titel: Briefing on artificial intelligence — Report of the Economic Development, Science
    and Innovation Committee
  fundstelle: New Zealand House of Representatives, Economic Development, Science and Innovation Committee,
    vorgelegt im April 2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Bericht eines Fachausschusses des Repräsentantenhauses. Er empfiehlt dem Haus lediglich,
    den Bericht zur Kenntnis zu nehmen ("recommends that the House take note of its report"), enthält
    aber die derzeit klarste amtliche Darstellung des neuseeländischen Regulierungsansatzes.

    '
  kurzbeschreibung: 'Der Ausschuss hat sich mit den Leitlinien für den KI-Einsatz in der Verwaltung, mit
    der Orientierung für die Privatwirtschaft, mit dem Vertrauen der Bevölkerung in KI und mit der Frage
    befasst, ob das geltende Recht die von KI ausgehenden Herausforderungen erfasst. Ergebnis: Neuseeland
    verzichtet auf ein eigenes KI-Gesetz und stützt sich auf Grundgesetze, ausdrücklich genannt werden
    der Privacy Act 2020 und der Commerce Act 1986. Die Regierung will prüfen, ob das vorhandene Recht
    "fit for AI" bleibt, und die internationale Entwicklung beobachten, einschliesslich der urheberrechtlichen
    Verfahren zu generativer KI, um daraus Folgerungen für das Wettbewerbsrecht und weitere Rahmen zu
    ziehen.

    '
  inkrafttreten:
    datum: 2026-04-01
    verifiziert: false
    quelle: https://selectcommittees.parliament.nz/view/SelectCommitteeReport/847a8886-a31a-4af8-6d95-08dea647243b
  anwendungsdaten: []
  themenachsen:
  - governance
  - wettbewerb
  - datenschutz
  - urheberrecht
  regelungsschwerpunkte:
  - 'Amtliche Bestätigung der Linie: Statt eines AI Act stützt sich Neuseeland auf "fundamental legislation,
    such as the Privacy Act 2020 and the Commerce Act 1986".'
  - Erstmals wird das Wettbewerbsrecht (Commerce Act 1986) ausdrücklich als KI-Instrument benannt — bis
    dahin sprachen die Regierungsdokumente nur von Datenschutz, Verbraucherschutz und Menschenrechten.
  - 'Beobachtungsauftrag: Die ausländischen Urheberrechtsverfahren zu generativer KI sollen ausgewertet
    werden. Das ist die parlamentarische Entsprechung zu der auf 2027 vertagten Copyright-Entscheidung.'
  - Gegenstand des Briefings waren auch das geringe Vertrauen der neuseeländischen Bevölkerung in KI und
    die Frage der sozialen Akzeptanz.
  dokumente:
  - datum: 2026-04-01
    typ: ausschussbericht
    titel: Briefing on artificial intelligence — Report of the Economic Development, Science and Innovation
      Committee
    url: https://selectcommittees.parliament.nz/view/SelectCommitteeReport/847a8886-a31a-4af8-6d95-08dea647243b
    sprache: en
    urheber: Economic Development, Science and Innovation Committee, New Zealand House of Representatives
    verifiziert: true
    notiz: Die klarste amtliche Zusammenfassung des neuseeländischen Ansatzes und die einzige parlamentarische
      Befassung mit KI als solcher.
  offene_punkte:
  - Der genaue Vorlagetag im April 2026 wurde nicht ermittelt; das Dokument selbst nennt nur den Monat.
  - Ob die Regierung auf den Bericht geantwortet hat (Government Response), wurde nicht geprüft.
  - 'Inkrafttreten nicht belegbar: selectcommittees.parliament.nz (die im Eintrag hinterlegte URL, JavaScript
    dort gesperrt), parliament.nz, Websuche. Die verlinkte Datei traegt den Titel ''Draft report (Briefing
    on artificial intelligence).docx'' — es handelt sich also um einen ENTWURF des Berichts, nicht um
    den dem Haus vorgelegten Bericht. Ein Datum der Vorlage (presented to the House) liess sich nicht
    ermitteln; der eingetragene 01.04.2026 ist ein Monatsplatzhalter. Verifiziert bleibt false. Empfehlung:
    Vorlagedatum aus dem Journal of the House pruefen und ggf. auf den endgueltigen Bericht statt auf
    den Entwurf verlinken.'
  monitoring_quellen:
  - https://www.parliament.nz/en/pb/sc/scl/economic-development-science-and-innovation/
  bezug_regelwerke:
  - nz-ki-strategie-2025
  - nz-privacy-act-2020
  - nz-copyright-reform-2026
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Für die Zitierfähigkeit ist dieser Bericht wertvoll: Er ist die einzige Aussage eines
    parlamentarischen Organs zur neuseeländischen KI-Politik und bestätigt den Regierungsansatz über Parteigrenzen
    hinweg. Bemerkenswert ist die Nennung des Commerce Act 1986 — sie zeigt, dass die wettbewerbsrechtliche
    Dimension von KI in Neuseeland erst 2026 in den amtlichen Sprachgebrauch gelangt ist, drei Jahre nach
    den entsprechenden Untersuchungen in der EU und im Vereinigten Königreich.

    '
- id: nz-hrc-ai-tiriti-2026
  jurisdiktion: nz
  kurztitel: Diskussionspapier der Menschenrechtskommission zu KI (2026)
  offizieller_titel: 'AI and Digital Technologies: A Human Rights and Te Tiriti o Waitangi Approach'
  fundstelle: Te Kāhui Tika Tangata Human Rights Commission, veröffentlicht am 07.08.2026; Arbeitsprogramm
    "Artificial Intelligence, Emerging Digital Technologies and Human Rights" mit Expert Advisory Group
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Diskussionspapier der nationalen Menschenrechtsinstitution, veröffentlicht am 07.08.2026,
    begleitet von einer Kurzfassung. Die Kommission hat dafür eine Expert Advisory Group eingesetzt. Das
    Papier ist die derzeit gewichtigste institutionelle Gegenposition zum Regierungsansatz.

    '
  kurzbeschreibung: 'Die Kommission behandelt KI und digitale Technologien nicht als Marktprodukte, sondern
    als Infrastruktur, die bewusst gestaltet und öffentlich verantwortet werden muss. Als Risiken benennt
    sie Datenschutzverletzungen, Diskriminierung bei automatisierten Entscheidungen, digitale Ausgrenzung,
    fehlende Transparenz, Verdrängung von Arbeit und den Missbrauch von Māori-Daten; als Chancen den Zugang
    zur Gesundheitsversorgung, die Barrierefreiheit für behinderte Menschen und die Revitalisierung von
    te reo Māori. Empfehlung eins verlangt eine nationale Strategie für digitale Infrastruktur mit ausdrücklicher
    menschenrechtlicher und Tiriti-Grundlage einschliesslich Māori-Datensouveränität; Empfehlung zwei
    einen nationalen menschenrechts- und Tiriti-basierten Risikobewertungsrahmen für den öffentlichen
    wie den privaten Sektor, dessen Entwicklung die Kommission gemeinsam mit Māori führen soll. Weiter
    fordert das Papier ein nationales Algorithmenregister für den öffentlichen Sektor, ein AI Safety Institute
    für technische Evaluierungen, Gesetzgebung gegen nicht einvernehmliche Deepfakes, verschärfte Transparenzpflichten
    für automatisierte Entscheidungen und Anforderungen an die Barrierefreiheit. Rechtsverbindlichkeit
    hat das Papier nicht.

    '
  inkrafttreten:
    datum: 2026-08-07
    verifiziert: true
    quelle: https://tikatangata.org.nz/our-work/artificial-intelligence-emerging-digital-technologies-and-human-rights
  anwendungsdaten:
  - datum: 2026-03-06
    was_gilt: Stand der Projektseite; Einsetzung und Zusammensetzung der Expert Advisory Group zu KI,
      digitalen Technologien und Menschenrechten.
    verifiziert: true
    quelle: https://tikatangata.org.nz/our-work/artificial-intelligence-emerging-digital-technologies-and-human-rights
  - datum: 2026-06-25
    was_gilt: Ankündigung des Diskussionspapiers für Anfang August 2026 im Zusammenhang mit der Beratung
      zum Deepfake-Gesetzentwurf.
    verifiziert: false
    quelle: https://lawnews.nz/criminal/deepfake-bill-wont-hold-nudify-platforms-to-account-says-tlanz-committee/
  - datum: 2026-08-07
    was_gilt: Veröffentlichung des Papiers und der Kurzfassung; öffentlicher Aufruf zu einem menschenrechts-
      und Tiriti-zentrierten Ansatz.
    verifiziert: true
    quelle: https://tikatangata.org.nz/news/commission-calls-for-human-rights-centred-approach-to-ai-and-digital-technologies
  themenachsen:
  - grundrechte
  - governance
  - datenschutz
  - sektor-oeffentlich
  - arbeit
  - content
  regelungsschwerpunkte:
  - 'Grundthese: KI und digitale Technologien sind Infrastruktur, nicht Produkt — und damit Gegenstand
    öffentlicher Verantwortung statt reiner Marktaufsicht.'
  - 'Empfehlung 1: nationale Strategie für digitale Infrastruktur auf menschenrechtlicher und Tiriti-Grundlage,
    einschliesslich Māori-Datensouveränität und Rechenschaftsmechanismen.'
  - 'Empfehlung 2: nationaler menschenrechts- und Tiriti-basierter Risikobewertungsrahmen für öffentlichen
    UND privaten Sektor; die Kommission soll dafür ausgestattet werden und die Entwicklung gemeinsam mit
    Māori führen.'
  - 'Konkrete Einzelforderungen: nationales Algorithmenregister für den öffentlichen Sektor, AI Safety
    Institute für technische Evaluierung, Gesetzgebung gegen nicht einvernehmliche Deepfakes, verschärfte
    Transparenzpflichten bei automatisierten Entscheidungen, Barrierefreiheitsanforderungen.'
  - 'Institutioneller Konflikt: Die Forderung nach einem Risikobewertungsrahmen für den privaten Sektor
    steht in unmittelbarem Widerspruch zu Empfehlung 2 des Kabinettsbeschlusses ECO-24-MIN-0119 und zur
    Vorgabe, nicht restriktiver zu regulieren als OECD-Vergleichsstaaten.'
