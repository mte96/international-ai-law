  verfahrensnummer: SR 2008/214
  status: anwendbar
  status_detail: 'Geltendes Berufsrecht. Die Regeln enthalten keine KI-spezifische Vorschrift; sie werden
    durch den NZLS-Leitfaden von 2024 auf generative KI angewandt. Verstösse führen über die Standards
    Committees und das Lawyers and Conveyancers Disciplinary Tribunal zu Disziplinarmassnahmen.

    '
  kurzbeschreibung: 'Die Regeln binden neuseeländische Anwältinnen und Anwälte an Kompetenz (Rule 3),
    ordnungsgemässe Berufsausübung (Rules 11, 11.1), das Verbot irreführenden und täuschenden Verhaltens
    (Rule 10.9), die vorrangige Treuepflicht gegenüber dem Gericht (Rule 13.1), Vertraulichkeit und Privileg
    (Kapitel 8), Information und Konsultation der Mandantschaft (Rules 3.5, 7.1) sowie an angemessene
    Abrechnung (Kapitel 9). Für den KI-Einsatz sind diese Regeln die eigentliche Sanktionsgrundlage; eine
    eigene KI-Vorschrift existiert nicht.

    '
