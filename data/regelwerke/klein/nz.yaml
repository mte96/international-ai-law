  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die Vertagung auf den 31.03.2027 ist der wichtigste Einzeltermin des neuseeländischen
    KI-Rechts und gehört in jeden Fristenkalender. Sie zeigt zugleich die Grenze des Modells: Ein Staat,
    der auf vorhandenes Recht setzt, kann eine Regelungslücke nicht durch Auslegung schliessen, wenn das
    vorhandene Recht die Frage schlicht nicht kennt. Beim Urheberrecht ist die Lücke offensichtlich —
    kein TDM-Tatbestand, keine Rechtsprechung, keine Lizenzinfrastruktur — und die Regierung hat sie eingeräumt,
    indem sie eine Frist gesetzt hat. Auffällig ist ausserdem, dass das Paket den Schutzumfang zugunsten
    der Rechteinhaber ausbaut, während die Trainingsfrage offen bleibt: Damit verschiebt sich die Verhandlungsposition
    zulasten der Modellanbieter, ohne dass eine Entscheidung getroffen wäre.

    '
- id: nz-courts-genai-guidelines-2023
  jurisdiktion: nz
  kurztitel: Gerichtsleitlinien zu generativer KI (2023)
  offizieller_titel: Guidelines for Use of Generative Artificial Intelligence in Courts and Tribunals
    — drei Fassungen für (1) Judges, Judicial Officers, Tribunal Members and Support Staff, (2) Lawyers,
    (3) Non-Lawyers
  fundstelle: Courts of New Zealand / Ngā Kōti o Aotearoa; erarbeitet von der Artificial Intelligence
    Advisory Group, gebilligt vom Heads of Bench Committee, von Tribunals Aotearoa Executive und den Vorsitzenden
    der Tribunale und Behörden; ausgegeben am 07.12.2023
  verfahrensnummer: null
  status: softlaw
  status_detail: 'KORREKTUR ZUR AUSGANGSANNAHME: Die Leitlinien sind seit ihrer Ausgabe am 07.12.2023
    NICHT aktualisiert worden. Die PDF-Fassungen tragen ausdrücklich "First Issued 7 December 2023" und
    "Last Updated 7 December 2023". Das Office of the Chief Justice hat gegenüber RNZ am 28.07.2026 selbst
    erklärt, die Leitlinien seien 2023 ergangen "and need updating"; eine überarbeitete Fassung werde
    auf Grundlage laufender Erprobungen vorbereitet. Der Supreme Court hat die Leitlinien in Jones v Family
    Court at Whangārei [2026] NZSC 1 ausdrücklich in Bezug genommen.

    '
  kurzbeschreibung: 'Die drei Leitlinien richten sich an unterschiedliche Adressatenkreise und behandeln
    in sieben Abschnitten das Verständnis generativer KI und ihrer Grenzen, Vertraulichkeit, Namensunterdrückung
    und Datenschutz, Rechenschaft und Richtigkeit, ethische Fragen, Sicherheit, die Offenlegung des KI-Einsatzes
    sowie den Umgang mit KI-Nutzung durch andere. Kernpflicht ist die eigenverantwortliche Überprüfung:
    Wer Angaben aus einem GenAI-Chatbot verwendet, muss ihre Richtigkeit vor der Verwendung prüfen. Grundsätzlich
    sollen keine Informationen eingegeben werden, die nicht bereits öffentlich zugänglich sind. Richterinnen
    und Richter müssen den Einsatz nicht offenlegen; Unterstützungspersonal muss ihn mit dem aufsichtsführenden
    Richter besprechen. Die Leitlinien haben keine Rechtsnormqualität, sind aber vom Supreme Court als
    Praxismassstab behandelt worden.

    '
  inkrafttreten:
    datum: 2023-12-07
    verifiziert: true
    quelle: https://www.courtsofnz.govt.nz/going-to-court/practice-directions/practice-guidelines/all-benches/guidelines-for-use-of-generative-artificial-intelligence-in-courts-and-tribunals
  anwendungsdaten:
  - datum: 2023-12-07
