- id: nz-opc-ai-guidance-2023
  jurisdiktion: nz
  kurztitel: OPC-Leitlinien zu generativer KI und den IPPs
  offizieller_titel: Privacy Commissioner's expectations for agencies considering the use of generative
    artificial intelligence; Artificial Intelligence and the Information Privacy Principles
  fundstelle: Office of the Privacy Commissioner / Te Mana Matapono Matatapu; Erwartungen vom 15.06.2023,
    Leitfaden "AI and the Information Privacy Principles" vom September 2023, laufend fortgeschrieben
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Verwaltungsvorschrift ohne Bindungswirkung, aber vom Commissioner als Massstab seiner
    eigenen Beschwerdepraxis verwendet. Die Erwartungen datieren vom 15.06.2023, der Grundsatzleitfaden
    vom September 2023; die Seite trägt den Vorbehalt "The evolving nature of generative AI is such that
    the material on this page is subject to change".

    '
  kurzbeschreibung: 'Der Commissioner formuliert acht Erwartungen an Stellen, die generative KI einsetzen
    wollen: ausdrückliche Genehmigung durch die Leitungsebene nach voller Würdigung von Risiken und Gegenmassnahmen;
    Prüfung von Erforderlichkeit und Verhältnismässigkeit einschliesslich Alternativen; Durchführung einer
    Privacy Impact Assessment und gegebenenfalls einer Algorithmic Impact Assessment vor dem Einsatz;
    Transparenz gegenüber betroffenen Kundinnen und Kunden über Art, Zeitpunkt und Grund des Einsatzes;
    Einbeziehung von Māori zu den Auswirkungen auf ihre Gemeinschaften und auf taonga-Informationen; Verfahren
    für Richtigkeit sowie für Auskunfts- und Berichtigungsbegehren; menschliche Überprüfung der Ausgaben
    vor jeder Massnahme; und das Verbot, personenbezogene oder vertrauliche Informationen einzugeben,
    sofern nicht ausdrücklich bestätigt ist, dass Eingaben nicht gespeichert oder offengelegt werden.
    Der Leitfaden "AI and the Information Privacy Principles" ordnet dieselben Fragen den einzelnen IPPs
    zu.

    '
  inkrafttreten:
    datum: 2023-06-15
    verifiziert: true
    quelle: https://www.privacy.org.nz/resources-and-learning/a-z-topics/ai/generative-artificial-intelligence/
  anwendungsdaten:
  - datum: 2023-09-01
    was_gilt: Veröffentlichung des Leitfadens "Artificial Intelligence and the Information Privacy Principles"
      samt einseitiger Kurzfassung (Monat belegt, Tag nicht).
    verifiziert: true
    quelle: https://www.privacy.org.nz/resources-and-learning/a-z-topics/ai/
  themenachsen:
  - datenschutz
  - governance
  - grundrechte
  regelungsschwerpunkte:
  - 'Acht Erwartungen, darunter wörtlich: "Only use a generative AI tool after conducting a Privacy Impact
    Assessment (and/or Algorithmic Impact Assessment) to help identify and mitigate privacy and wider
    risks."'
  - 'Māori-Bezug wörtlich: "You should engage with Māori about the potential impacts of the generative
    AI tool on their communities and taonga - information." Damit wird die Datensouveränität in eine aufsichtsbehördliche
    Erwartung übersetzt.'
  - 'Eingabeverbot: "Do not input into a generative AI tool personal or confidential information, unless
    it has been explicitly confirmed that inputted information is not retained or disclosed."'
  - 'Zum Training: Der Leitfaden warnt, dass aus dem Internet gesammelte Trainingsdaten Quellen enthalten
    können, die nur nach Anmeldung zugänglich sind (etwa Profile sozialer Netzwerke); solche Daten dürfen
    nicht ohne Weiteres als "publicly available information" im Sinne der IPP-2-Ausnahme behandelt werden.'
  - 'Zu Halluzinationen: "Generative AI tools produce confident errors of fact and logic, so you cannot
    rely on their apparent performance or self-declared capabilities as evidence of accuracy" — unabhängige
    Prüfung und Auditierung seien erforderlich (IPP 8).'
  - 'Zu automatisierten Entscheidungen: Menschliche Überprüfung sei notwendig, aber nicht hinreichend;
    der Leitfaden benennt ausdrücklich das Problem der "automation blindness".'
  - 'Zu IPP 12: Ausländische Technologieanbieter gelten nicht als Empfänger einer Weitergabe, wenn sie
    die Daten nicht eigenständig nutzen — die Verantwortung für den Schutz bleibt jedoch bei der neuseeländischen
    Stelle.'
