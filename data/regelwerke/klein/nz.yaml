  eigene_bewertung: 'Dies ist der wichtigste und am wenigsten beachtete Befund der neuseeländischen Recherche.
    Während die Regierung erklärt, KI brauche kein eigenes Gesetz, hat dasselbe Parlament am 28.05.2026
    in einem einzigen Sitzungstag ohne Ausschussverfahren die gesetzliche Grundlage für automatisierte
    Entscheidungen über Sozialleistungen erweitert — und zwar ausdrücklich auf Programme, die nicht in
    Rechtsvorschriften geregelt sind. Der Vorgang ist in zweifacher Hinsicht lehrreich. Erstens zeigt
    er, dass Neuseeland durchaus KI-bezogen legiferiert, nur eben ermöglichend statt begrenzend. Zweitens
    enthält s. 363A Abs. 4 lit. d und Abs. 6A den einzigen verbindlichen Pflichtenkatalog des Landes für
    ein algorithmisches System — Genauigkeit, Verzerrung und Diskriminierung, Transparenz, menschliche
    Aufsicht — samt Anhörungsrecht von Datenschutz- und Menschenrechtsaufsicht. Wer wissen will, wie ein
    KI-Recht ohne KI-Gesetz aussieht, findet es hier: verstreut in einem Sozialgesetz, für einen einzigen
    Ressortbereich, beschlossen in einem Tag.

    '
