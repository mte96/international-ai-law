  fundstelle: Government Chief Digital Officer (GCDO) / Department of Internal Affairs, Fassung Januar
    2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Rahmenwerk für die neuseeländische Kernverwaltung (Public Service agencies). Ausdrücklich
    nicht bindend: "Agencies are encouraged to align with the direction set by this Framework, however
    it''s not binding." Stand der Seite zuletzt 29.01.2025; im Juli 2025 gemeinsam mit der KI-Strategie
    beworben.

    '
  kurzbeschreibung: 'Das Rahmenwerk gibt der Kernverwaltung fünf Grundsätze vor (inklusive und nachhaltige
    Entwicklung, menschenzentrierte Werte, Transparenz und Erklärbarkeit, Sicherheit, Rechenschaft) und
    ordnet das Arbeitsprogramm in sechs Säulen (Governance, Leitplanken, Fähigkeiten, Innovation, soziale
    Akzeptanz, internationale Stimme). Es stützt sich auf die OECD-KI-Grundsätze und nennt den Algorithm
    Charter for Aotearoa New Zealand als eine der Grundlagen. Rechtspflichten oder Sanktionen begründet
    es nicht; die Verantwortung für den KI-Einsatz bleibt bei der jeweiligen Behörde.

    '
  inkrafttreten:
    datum: 2025-01-29
    verifiziert: true
    quelle: https://www.digital.govt.nz/standards-and-guidance/technology-and-architecture/artificial-intelligence/public-service-artificial-intelligence-framework
    fundstelle_norm: 'Keine Inkrafttretensvorschrift — ausdruecklich nicht bindend: ''Agencies are encouraged
      to align with the direction set by this Framework, however it''s not binding.'' Massgeblich ist
      der Stand der amtlichen Seite des Government Chief Digital Officer: zuletzt aktualisiert am 29.01.2025'
  anwendungsdaten:
  - datum: 2025-02-01
    was_gilt: Öffentliche Einordnung als erstes ressortübergreifendes KI-Rahmenwerk der neuseeländischen
      Verwaltung (Monat belegt, Tag nicht).
    verifiziert: false
    quelle: https://www.beehive.govt.nz/release/guidance-safe-use-ai-public-sector
  themenachsen:
  - governance
  - sektor-oeffentlich
  - grundrechte
  - datenschutz
  regelungsschwerpunkte:
  - 'Fünf Grundsätze nach OECD-Vorbild: inclusive sustainable development, human-centred values, transparency
    and explainability, safety and security, accountability.'
  - 'Sechs Säulen des Arbeitsprogramms: governance, guardrails, capability, innovation, social licence,
    global voice.'
  - Ausdrückliche Unverbindlichkeit — der entscheidende Unterschied zu vergleichbaren Rahmen etwa in Kanada
    (Directive on Automated Decision-Making) oder der EU (Art. 26 KI-VO).
  - 'Verhältnis zum Algorithm Charter: Der Charter wird als eine von mehreren Grundlagen geführt, nicht
    aufgehoben; ein klares Abläuferverhältnis ist nirgends geregelt.'
  dokumente:
  - datum: 2025-01-29
    typ: leitlinie
    titel: Public Service AI Framework
    url: https://www.digital.govt.nz/standards-and-guidance/technology-and-architecture/artificial-intelligence/public-service-artificial-intelligence-framework
    sprache: en
    urheber: Government Chief Digital Officer
    verifiziert: true
    notiz: Enthält den Wortlaut der Unverbindlichkeitsklausel und die A3-Übersicht als PDF.
  - datum: 2025-01-29
    typ: uebersicht
    titel: Artificial intelligence (Übersichtsseite NZ Digital government)
    url: https://www.digital.govt.nz/standards-and-guidance/technology-and-architecture/artificial-intelligence
    sprache: en
    urheber: GCDO
    verifiziert: false
    notiz: Sammelseite der Verwaltungsleitlinien zu KI; nicht im Einzelnen geprüft.
  offene_punkte:
  - Das genaue Veröffentlichungsdatum ist unklar; die Seite weist den 29.01.2025 als Stand aus, die Bewerbung
    erfolgte im Juli 2025.
  - Das Verhältnis zum Algorithm Charter (Fortgeltung, Aufhebung, Aufgehen) ist amtlich nirgends geklärt.
  monitoring_quellen:
  - https://www.digital.govt.nz/standards-and-guidance/technology-and-architecture/artificial-intelligence
  bezug_regelwerke:
  - nz-algorithm-charter-2020
  - nz-genai-guidance-public-service-2023
  - nz-cabinet-going-for-growth-ai-2025
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Das Rahmenwerk ist der Punkt, an dem der neuseeländische Ansatz am deutlichsten an
    Grenzen stösst: Die Verwaltung setzt KI ein, unterwirft sich aber nur unverbindlichen Grundsätzen,
    während die einzige verbindliche Regel zum automatisierten Verwaltungshandeln (s. 363A Social Security
    Act 2018) in einem Fachgesetz steht und nur einen Ressortbereich erfasst. Zwischen beiden klafft eine
    Lücke, die die Human Rights Commission 2026 mit dem Vorschlag eines nationalen Algorithmenregisters
    zu schliessen versucht.

    '
  pruefvermerk:
  - 'Bestaetigt, soweit fuer ein nicht bindendes Rahmenwerk moeglich: Das Dokument selbst (Public Service
    AI Framework A3) traegt kein Datum; belegt ist nur der Seitenstand 29.01.2025. Status softlaw bestaetigt.'
- id: nz-genai-guidance-public-service-2023
  jurisdiktion: nz
