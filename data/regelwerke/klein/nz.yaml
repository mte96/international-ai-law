  themenachsen:
  - urheberrecht
  - content
  - wettbewerb
  regelungsschwerpunkte:
  - Die KI-Frage ist ausdrücklich ausgeklammert und auf den 31.03.2027 vertagt — das ist die einzige amtliche
    neuseeländische Festlegung zu KI und Urheberrecht überhaupt.
  - Keine TDM-Schranke im Paket. Während das Vereinigte Königreich (Konsultation 2024/2025) und die Europäische
    Union (Art. 3, 4 DSM-Richtlinie) den Input regeln, bleibt Neuseeland ohne Regelung.
  - Schutzfristverlängerung um zwanzig Jahre auf 70 Jahre post mortem beziehungsweise ab Veröffentlichung
    — mittelbar KI-relevant, weil dadurch der Bestand gemeinfreier Trainingswerke für zwei Jahrzehnte
    einfriert.
  - 'Umkehr der Auftragswerksregel (s. 21 Abs. 3 Copyright Act 1994): künftig ist der Schaffende Erstinhaber,
    sofern nichts anderes vereinbart ist. Für KI-gestützte Auftragsproduktion ändert das die Ausgangslage
    der Vertragsgestaltung.'
  - Neue fair-dealing-Schranke für Parodie und Satire — die einzige Schrankenerweiterung des Pakets; sie
    berührt Deepfake-Inhalte mittelbar, weil sie Persiflagen erlaubt, während das Deepfake-Gesetzgebungsvorhaben
    intime Darstellungen kriminalisiert.
  - Sperranordnungen gegen ausländische Piraterieseiten; kollektive Rechtsdurchsetzung durch Verwertungsgesellschaften
    — Instrumente, die später auf KI-Trainingsdienste angewandt werden könnten.
