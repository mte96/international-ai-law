  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Wer den neuseeländischen Ansatz rechtsvergleichend darstellt, sollte nicht die Strategie
    von 2025, sondern diesen Beschluss von 2024 zitieren: Er ist das Dokument, in dem die Entscheidung
    tatsächlich getroffen wurde, und er formuliert sie präziser. Bemerkenswert ist die Konstruktion als
    Rangfolge ("in preference to") statt als Verbot: Ein KI-Gesetz ist nicht ausgeschlossen, es muss nur
    begründet werden. Das unterscheidet Neuseeland von Staaten, die sich rhetorisch festlegen, und macht
    den Ansatz reversibel — was die Empfehlungen der Human Rights Commission von 2026 praktisch relevant
    macht.

    '
- id: nz-cabinet-going-for-growth-ai-2025
  jurisdiktion: nz
  kurztitel: Kabinettsbeschluss 2025 — Going for Growth, KI-Verbreitung
  offizieller_titel: Cabinet paper "Going for Growth — Enabling AI uptake across the economy"; Cabinet
    minute CAB-25-MIN-0216
  fundstelle: Cabinet Economic Policy Committee / Cabinet, CAB-25-MIN-0216, Kabinettsminute vom 30.06.2025;
    proaktive Veröffentlichung durch MBIE am 07.08.2025
  verfahrensnummer: CAB-25-MIN-0216
  status: softlaw
  status_detail: 'Der Beschluss, mit dem die KI-Strategie freigegeben wurde. Er bestätigt den "light touch,
    principle-based approach" und legt fest, dass Neuseeland nicht restriktiver regulieren soll als vergleichbare
    OECD-Staaten. Ministerlich verantwortlich Hon Dr Shane Reti (Science, Innovation and Technology).

    '
  kurzbeschreibung: 'Das Kabinett beschliesst, öffentlich zu signalisieren, dass Neuseeland einen "light
    touch, principle-based approach to AI" verfolgt, das Regulierungsumfeld nicht restriktiver zu gestalten
    als bei OECD-Vergleichsstaaten, international an KI-Governance-Standards mitzuarbeiten und KI-Investitionen
    über die vorhandenen Rahmen zu unterstützen. Ausdrücklich wird die Präferenz für bestehende Rahmen
    gegenüber eigenständigen KI-Gesetzen wiederholt. Es werden keine Rechtspflichten begründet und keine
    Haushaltsmittel gebunden; Gesetzesänderungen sind nicht vorgesehen.

    '
