    umgestellt (Rule 1 Purpose of collection of biometric information; Rule 2 Source of biometric sample;
    Rule 3 Collection of biometric information from individual concerned; Rule 3A Collection of biometric
    information other than from individual concerned; Rule 4 Manner of collection; Rule 5 Storage and
    security; Rule 6 Access; Rule 7 Correction; Rule 8 Accuracy; Rule 9 Retention; Rule 10 Limits on use;
    Rule 11 Limits on disclosure; Rule 12 Disclosure outside New Zealand; Rule 13 Unique identifiers).
  - 'Rule 1 — Verhältnismässigkeitsprüfung: rechtmässiger Zweck, Erforderlichkeit, Wirksamkeit, keine
    weniger risikoreiche Alternative, angemessene Schutzvorkehrungen, Abwägung von Nutzen und Eingriff.
    Berücksichtigungspflicht für "cultural impacts and effects of biometric processing on Māori" — weltweit
    die einzige Verhältnismässigkeitsklausel eines Datenschutzkodex mit ausdrücklichem indigenen Bezugspunkt.'
  - Rule 10 Abs. 5 — Verbot der biometrischen Kategorisierung nach Persönlichkeit, Stimmung, Emotion,
    Geisteszustand, Ermüdung, Wachheit, Aufmerksamkeit sowie nach verbotenen Diskriminierungsgründen;
    Ausnahmen für Barrierefreiheit, Gefahrenabwehr, Forschung, Altersschätzung, Ermüdungs- und Wachheitserkennung
    aus Sicherheitsgründen. Sachlich das neuseeländische Gegenstück zu Art. 5 Abs. 1 lit. f und Art. 5
    Abs. 1 lit. g KI-VO — allerdings nur als Datenschutzregel, nicht als Marktverbot.
  - 'Begriffe: "biometric information" (personenbezogene Daten zu einem biometrischen Merkmal einschliesslich
    Proben und Templates, ohne biologisches und genetisches Material, Hirnaktivität und Nervensystemdaten),
    "biometric processing" (Vergleich oder Analyse durch ein technisches System mittels Identifizierung,
    Verifizierung oder Kategorisierung), "biometric sample", "biometric identification", "biometric categorisation".'
  - 'Bereichsausnahmen: Gesundheitsstellen bei der Verarbeitung von Gesundheitsinformationen (Rule 4 Abs.
    2); Nachrichten- und Sicherheitsdienste hinsichtlich der Rules 2, 3, 3A, 4 lit. b und 10 Abs. 5 (Rule
    4 Abs. 3).'
  - Zwei gestaffelte Anwendungszeitpunkte (03.11.2025 und 03.08.2026) mit einer neunmonatigen Übergangsfrist
    für Bestandssysteme.
