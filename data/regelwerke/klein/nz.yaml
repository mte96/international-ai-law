  regelungsschwerpunkte:
  - s. 6 — zehn Kommunikationsgrundsätze; Grundsatz 6 ("A digital communication should not make a false
    allegation") ist der einzige Ansatzpunkt für KI-erzeugte Falschbehauptungen über Personen.
  - s. 22 — Straftatbestand des absichtlichen schädigenden Postens; verlangt Schädigungsabsicht, objektive
    Eignung zur Schädigung und tatsächlich eingetretenen Schaden. Die kumulative Fassung macht die Norm
    für massenhaft erzeugte synthetische Inhalte schwer handhabbar.
  - s. 22A — unbefugtes Posten intimer Bildaufnahmen; Strafrahmen zwei Jahre oder 50.000 NZD (natürliche
    Person), 200.000 NZD (juristische Person). Erfasst nach geltender Fassung nur Aufnahmen realer Vorgänge.
  - ss. 22B und 24 — zivilrechtliche Anordnungen während und nach dem Verfahren sowie Take-down-Anordnungen.
  - 'ZENTRALER NEGATIVBEFUND: kein Begriff und keine Regelung für synthetische, generierte oder veränderte
    Inhalte. Neuseeland hat bis heute keine Deepfake-Vorschrift.'
