    was_gilt: Part 1 in Kraft — IPP 3A gilt für ab diesem Tag erhobene Daten.
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/2025/0053/latest/whole.html
  themenachsen:
  - datenschutz
  - grundrechte
  regelungsschwerpunkte:
  - 'IPP 3A ist für KI unmittelbar einschlägig: Wer Trainings- oder Anreicherungsdaten aus Drittquellen
    (Datenhändler, Web-Scraping, verbundene Unternehmen) erhebt, muss die betroffenen Personen benachrichtigen,
    soweit dies in den Umständen angemessen ist.'
  - 'Zeitpunkt: "as soon as is reasonably practicable after the information has been collected (unless
    taken sooner)" — anders als bei IPP 3 also nachträglich, nicht vorab.'
  - Ausnahme bei bereits erfolgter Kenntnis (IPP 3A Abs. 3) samt gesetzlichem Beispiel.
  - 'Stichtagsregel in s. 25A Privacy Act 2020: keine Rückwirkung auf vor dem 01.05.2026 erhobene Daten
    — praktisch bedeutsam, weil damit bestehende Trainingsdatenbestände ausgenommen bleiben.'
  - 's. 28 Privacy Act 2020 neu gefasst: IPPs 2, 3, 3A und 4 lit. b gelten nicht für die Erhebung durch
    Nachrichten- und Sicherheitsdienste.'
  - 'Ungewöhnlich langes Verfahren: Einbringung 06.09.2023, dritte Lesung 18.09.2025 — mehr als zwei Jahre
    für eine einzige neue Vorschrift.'
