  eigene_bewertung: 'Bemerkenswert ist, dass Neuseelands einzige KI-Rechtsprechung bislang nicht das anwaltliche
    Berufsrecht betrifft, sondern eine nicht vertretene Partei. Während in England (Ayinde, Al-Haroun)
    und Australien die Anwaltschaft im Mittelpunkt steht, hat der neuseeländische Supreme Court den Laien
    adressiert — und dafür nicht das Berufsrecht, sondern das Straf- und Kontemptrecht herangezogen.

    '
