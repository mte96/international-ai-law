    was_gilt: Inkrafttreten von Part 2 des Privacy Amendment Act 2025 (u.a. neuer s. 18 Abs. 3 zu Angemessenheitsfeststellungen
      für Staaten und Staatengruppen).
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/2025/0053/latest/whole.html
  - datum: 2026-05-01
    was_gilt: 'IPP 3A gilt: Informationspflicht bei Erhebung personenbezogener Daten aus anderen Quellen
      als bei der betroffenen Person. Nach s. 25A gilt IPP 3A nicht für vor dem 01.05.2026 erhobene Daten.'
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/2025/0053/latest/whole.html
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  - governance
  regelungsschwerpunkte:
  - 'IPP 1 bis 13 samt IPP 3A stehen vollständig in s. 22. Die amtlichen Überschriften lauten: 1 Purpose
    of collection of personal information; 2 Source of personal information; 3 Collection of personal
    information from individual concerned; 3A Collection of personal information other than from individual
    concerned; 4 Manner of collection of personal information; 5 Storage and security of personal information;
    6 Access to personal information; 7 Correction of personal information; 8 Accuracy, etc, of personal
    information to be checked before use or disclosure; 9 Agency not to keep personal information for
    longer than necessary; 10 Limits on use of personal information; 11 Limits on disclosure of personal
    information; 12 Disclosure of personal information outside New Zealand; 13 Unique identifiers.'
  - 'ZENTRALER BEFUND: Die Wörter "automated", "automated decision" und "profiling" kommen im gesamten
    Privacy Act 2020 NICHT vor (Volltextprüfung am 06.09.2026 an der konsolidierten Fassung). Ein Gegenstück
    zu Art. 22 DSGVO existiert nicht. Automatisierte Einzelentscheidungen werden ausschliesslich mittelbar
    erfasst — über IPP 8 (Richtigkeit vor Nutzung und Weitergabe) und IPP 10 (Zweckbindung).'
  - 'IPP 4 lautet: "An agency may collect personal information only — (a) by a lawful means; and (b) by
    a means that, in the circumstances of the case (particularly in circumstances where personal information
    is being collected from children or young persons), — (i) is fair; and (ii) does not intrude to an
    unreasonable extent upon the personal affairs of the individual concerned." Das ist die Norm, an der
    Web-Scraping für Trainingszwecke in Neuseeland zu messen ist.'
  - 'IPP 8 lautet: "An agency that holds personal information must not use or disclose that information
    without taking any steps that are, in the circumstances, reasonable to ensure that the information
    is accurate, up to date, complete, relevant, and not misleading." Das ist die schärfste Waffe gegen
    Halluzinationen mit Personenbezug — eine Pflicht, die anders als Art. 5 Abs. 1 lit. d DSGVO ausdrücklich
    an Nutzung UND Weitergabe anknüpft.'
  - 's. 24 Abs. 2: Eine Massnahme verstösst nicht gegen die IPPs 1 bis 5, 7 bis 10 oder 13, wenn sie durch
    neuseeländisches Recht erlaubt oder gefordert ist. Diese Klausel erklärt, warum s. 363A Social Security
    Act 2018 den automatisierten Verwaltungsvollzug datenschutzrechtlich absichert.'
  - 's. 31 Abs. 1: "Except as provided in subsection (2), the IPPs do not confer on any person any right
    that is enforceable in a court of law." Abs. 2 nimmt nur IPP 6 Abs. 1 gegenüber dem öffentlichen Sektor
    aus. Der Privatrechtsweg ist damit versperrt; alles läuft über Commissioner und Tribunal.'
  - 's. 32: Ermächtigung des Commissioners, Codes of Practice zu erlassen, die die IPPs strenger oder
    milder fassen, ausnehmen oder ihre Anwendung näher regeln können — die Rechtsgrundlage des Biometric
    Processing Privacy Code 2025 und des Health Information Privacy Code 2020.'
  - 's. 69: Definition der "interference with the privacy of an individual" — Verstoss gegen eine IPP
    plus Schaden, Nachteil, Beeinträchtigung von Rechten oder erhebliche Demütigung. Nur ein so qualifizierter
    Verstoss öffnet den Weg zum Tribunal.'
  - 's. 212: Straftatbestände mit einem Höchstmass von 10.000 NZD. Im internationalen Vergleich ist das
    der niedrigste Sanktionsrahmen einer entwickelten Datenschutzordnung — und der Grund, warum die neuseeländische
    Durchsetzung faktisch auf Kooperation beruht.'
