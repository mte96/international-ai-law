  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die Leitlinien sind der Kern der neuseeländischen KI-Rechtspraxis und zugleich ihr
    deutlichstes Alterungsproblem. Zwei Punkte sind für eine rechtsvergleichende Darstellung wichtig.
    Erstens hat der Supreme Court in Jones ein reines Soft-Law-Dokument zum Massstab strafrechtlich relevanten
    Verhaltens gemacht: Wer die dort formulierte Prüfpflicht verletzt, kann nach ss. 116, 117 lit. e Crimes
    Act 1961 und im Kontempt-Recht belangt werden. Damit erhält eine unverbindliche Leitlinie mittelbar
    Sanktionskraft — ein Mechanismus, den man in dieser Klarheit sonst nirgends findet. Zweitens hat die
    Justiz die Selbstverpflichtung zur Fortschreibung nicht eingelöst; das Office of the Chief Justice
    räumt das ein. Wenn ein Staat ohne KI-Gesetz auskommen will, muss sein Soft Law gepflegt werden —
    hier liegt zweieinhalb Jahre nichts vor.

    '
- id: nz-nzls-genai-guidance-2024
  jurisdiktion: nz
  kurztitel: NZLS-Leitfaden zu generativer KI für Anwältinnen und Anwälte
  offizieller_titel: Generative AI guidance for lawyers (New Zealand Law Society / Te Kāhui Ture o Aotearoa)
  fundstelle: New Zealand Law Society Te Kāhui Ture o Aotearoa, März 2024 (Lawyers and AI Guidance, Mar
    2024), zuletzt aktualisiert am 24.02.2026
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Berufsrechtlicher Leitfaden ohne unmittelbare Bindungswirkung, der die Anwendung der
    Lawyers and Conveyancers Act (Lawyers: Conduct and Client Care) Rules 2008 auf generative KI erläutert.
    Erstfassung März 2024; Stand der Seite 24.02.2026. Er ist damit — anders als die Gerichtsleitlinien
    — fortgeschrieben worden.

    '
  kurzbeschreibung: 'Der Leitfaden gliedert sich in acht Abschnitte: Begriff der generativen KI, regulatorischer
    Rahmen, Chancen, Risiken, Qualitätssicherung und Kompetenz, Datenschutz, Datensicherheit und Cybersicherheit,
    geistiges Eigentum sowie berufliche und ethische Pflichten; abgeschlossen wird er durch eine Umsetzungscheckliste.
    Er ordnet den KI-Einsatz ausdrücklich den geltenden Berufsregeln zu: Rule 3 (Kompetenz), Rule 10.9
    (irreführendes und täuschendes Verhalten), Rule 13.1 (Treuepflicht gegenüber dem Gericht), Rules 11
    und 11.1 (ordnungsgemässe Berufsausübung), Kapitel 8 (Privileg und Vertraulichkeit), Rules 3.5 und
    7.1 (Mandantenbetreuung und Konsultation) sowie Kapitel 9 (Abrechnung). Sanktionen ergeben sich nicht
    aus dem Leitfaden, sondern aus dem Disziplinarrecht nach dem Lawyers and Conveyancers Act 2006.

    '
