  regelungsschwerpunkte:
  - 'Regulatorischer Massstab: Das Regelungsumfeld soll "no more restrictive than OECD comparators" sein.
    Das ist eine Standstill-Klausel eigener Art — sie bindet Neuseeland an den Median der OECD statt an
    ein eigenes Schutzniveau.'
  - 'Präferenzregel wiederholt: Anwendung vorhandener Rahmen (Datenschutz, Verbraucherschutz, Menschenrechte)
    "in preference to developing standalone AI laws".'
  - 'Arbeitsteilung: Die Responsible AI Guidance for Businesses wird gemeinsam mit der Strategie veröffentlicht;
    das Public Service AI Framework verantwortet der Minister for Digitising Government; ein weiteres
    Kabinettspapier zur KI im öffentlichen Sektor wird angekündigt.'
  - 'Keine Haushaltswirkung, kein Gesetzgebungsbedarf: Das Papier stellt ausdrücklich fest, dass keine
    unmittelbaren finanziellen Folgen und keine Gesetzesänderungen erforderlich sind.'
