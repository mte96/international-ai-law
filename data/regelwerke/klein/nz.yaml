  bezug_regelwerke:
  - nz-privacy-act-2020
  - nz-biometric-processing-privacy-code-2025
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Dieser Bericht ist der neuseeländische Gegenpol zur australischen Bunnings-Entscheidung:
    Dieselbe Technologie, derselbe Einzelhandelskontext, dasselbe Jahr — und ein gegenläufiges Ergebnis,
    weil der neuseeländische Betreiber die Verhältnismässigkeit vorab dokumentiert und die Verweildauer
    minimiert hatte. Wer zu Gesichtserkennung im Handel arbeitet, sollte beide Fälle nebeneinanderlegen;
    der Unterschied liegt nicht im Recht, sondern in der Dokumentation. Die Schwellenwert-Auflage (92,5
    Prozent) ist zugleich das erste Beispiel dafür, dass eine Datenschutzaufsicht einen technischen Modellparameter
    regulatorisch festsetzt.

    '
