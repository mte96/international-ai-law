      ausdrücklich als KI-Instrument benennt.
  offene_punkte:
  - Der Volltext wurde nicht geprüft; die Paragrafenangaben sind daher bewusst offen gehalten.
  - Ob KI-gestützte Dienste als "services" im Sinne des Gesetzes gelten, ist nicht entschieden.
  monitoring_quellen:
  - https://comcom.govt.nz/
  bezug_regelwerke:
  - nz-fair-trading-act-1986
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der Consumer Guarantees Act ist die einzige neuseeländische Norm, die einer Produkthaftung
    für KI nahekommt — und sie greift nur im Verbrauchergeschäft und nur gegen den unmittelbaren Anbieter.
    Ein Gegenstück zur neuen EU-Produkthaftungsrichtlinie (EU) 2024/2853, die Software ausdrücklich einbezieht,
    fehlt.

    '
  pruefvermerk:
  - Bestaetigt. Ausfertigung 20.08.1993, Inkrafttreten 01.04.1994.
- id: nz-contract-and-commercial-law-act-2017
  jurisdiktion: nz
  kurztitel: Contract and Commercial Law Act 2017
  offizieller_titel: Contract and Commercial Law Act 2017
  fundstelle: 2017 No 5
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Part 4 ("Electronic transactions") übernimmt die Regeln des früheren
    Electronic Transactions Act 2002. KI-spezifische Vorschriften fehlen vollständig; die Wörter "automated",
    "electronic agent" und "artificial intelligence" kommen im Gesetz NICHT vor (Volltextprüfung am 06.09.2026).

    '
  kurzbeschreibung: 'Das Gesetz fasst das neuseeländische Vertrags- und Handelsrecht zusammen. Part 4
    regelt elektronische Transaktionen: Zweck (s. 207), Übersicht (s. 208), Auslegung (ss. 209, 210),
    Gültigkeit von Informationen (s. 211), Regeln zu Absendung und Zugang elektronischer Mitteilungen
    (ss. 212 bis 216), Zeitpunkt der Übermittlung einer Annahme (s. 217) sowie die Erfüllung gesetzlicher
    Formerfordernisse in elektronischer Form (ss. 218 ff.). Eine Regelung zu automatisiert abgeschlossenen
    Verträgen oder zur Zurechnung von Erklärungen autonomer Systeme fehlt.

    '
  inkrafttreten:
    datum: 2017-09-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/2017/0005/latest/whole.html
    fundstelle_norm: 's. 2 Contract and Commercial Law Act 2017: ''This Act comes into force immediately
      after the expiry of the 6-month period that starts on the date of Royal assent.'' Royal assent 01.03.2017;
      die Sechsmonatsfrist laeuft mit Ablauf des 31.08.2017 ab, das Gesetz tritt am 01.09.2017 in Kraft'
  anwendungsdaten: []
  themenachsen:
  - vertrag
  - haftung
  regelungsschwerpunkte:
  - 'Part 4 Subpart 1 (ss. 207 bis 210): Zweck, Übersicht, Auslegung.'
  - 'Part 4 Subpart 2 (ss. 211 bis 217): Gültigkeit elektronischer Informationen, Standardregeln zu Zeitpunkt
    und Ort von Absendung und Zugang, Zeitpunkt der Annahmeerklärung.'
  - 'Part 4 Subpart 3 (ab s. 218): Erfüllung gesetzlicher Formerfordernisse in elektronischer Form.'
  - 'ZENTRALER NEGATIVBEFUND: Kein Gegenstück zu s. 15C Electronic Transactions Act 1999 (Australien)
    oder zu § 14 UETA (Vereinigte Staaten), die Verträge durch "electronic agents" ausdrücklich anerkennen.
    Wer in Neuseeland einen von einem KI-Agenten geschlossenen Vertrag durchsetzen will, muss auf allgemeine
    Stellvertretungs- und Zurechnungsgrundsätze zurückgreifen; höchstrichterliche Klärung fehlt.'
  dokumente:
  - datum: 2026-09-06
    typ: konsolidiert
    titel: Contract and Commercial Law Act 2017 (konsolidierte Fassung)
    url: https://www.legislation.govt.nz/act/public/2017/0005/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
    verifiziert: true
    notiz: Amtlicher Volltext; Grundlage der Prüfung von Part 4 und der Negativkontrolle zu automatisierten
      Verträgen.
  offene_punkte:
  - Ob die neuseeländische Rechtsprechung Erklärungen autonomer Systeme dem Betreiber zurechnet, ist ungeklärt;
    einschlägige Entscheidungen wurden nicht gefunden.
  - Eine Reform des Part 4 ist nicht angekündigt.
  monitoring_quellen:
  - https://www.legislation.govt.nz/act/public/2017/0005/latest/whole.html
  bezug_regelwerke:
  - nz-fair-trading-act-1986
  - nz-consumer-guarantees-act-1993
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Dies ist die stillste, aber praktisch bedeutsamste Lücke des neuseeländischen Rechts:
    Agentische KI schliesst bereits Verträge, und das Gesetz, das elektronische Transaktionen regelt,
    kennt den Begriff nicht einmal. Australien hat mit s. 15C ETA 1999 eine ausdrückliche Regel, die Vereinigten
    Staaten mit § 14 UETA ebenfalls. Wer die These prüfen will, Neuseeland komme mit vorhandenem Recht
    aus, findet hier den klarsten Gegenbeleg — nicht weil ein Risiko unreguliert wäre, sondern weil eine
    Rechtssicherheitsfrage schlicht offen ist.

    '
  pruefvermerk:
  - 'Bestaetigt, aber berechnet: Das Gesetz nennt kein Datum, sondern eine Frist. Ausfertigung 01.03.2017
    + 6 Monate = Inkrafttreten 01.09.2017. Das eingetragene Datum stimmt.'
- id: nz-human-rights-act-1993
  jurisdiktion: nz
  kurztitel: Human Rights Act 1993
  offizieller_titel: Human Rights Act 1993
  fundstelle: 1993 No 82; verwaltet vom Ministry of Justice; konsolidierte Fassung mit Stand 27.11.2025
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Es ist der dritte der drei von der Regierung benannten Rahmen. KI-spezifische
    Vorschriften fehlen; die Wörter "artificial intelligence", "algorithm" und "automated" kommen im Gesetz
    NICHT vor (Volltextprüfung am 06.09.2026). Die nach dem Gesetz errichtete Human Rights Commission
    hat am 07.08.2026 verbindliche Regeln für KI gefordert.

    '
  kurzbeschreibung: 'Das Gesetz verbietet Diskriminierung wegen der in s. 21 abschliessend aufgezählten
    Gründe — unter anderem Geschlecht (einschliesslich Schwangerschaft und Geburt), Familienstand, religiöse
    Überzeugung, ethische Überzeugung, Hautfarbe, Rasse, ethnische oder nationale Herkunft einschliesslich
    Staatsangehörigkeit sowie Behinderung — in den Bereichen Beschäftigung (s. 22), Zugang zu Orten und
    Verkehrsmitteln, Bildung, Wohnen und Bereitstellung von Waren, Einrichtungen und Dienstleistungen
    (s. 44). s. 65 erfasst mittelbare Diskriminierung: Ein Verhalten, eine Praxis, ein Erfordernis oder
    eine Bedingung, die nicht offensichtlich gegen das Gesetz verstösst, ist gleichwohl rechtswidrig,
    wenn sie Personen oder Gruppen wegen eines verbotenen Grundes unterschiedlich behandelt, es sei denn,
    der Handelnde weist einen guten Grund nach. Durchgesetzt wird das Gesetz über die Human Rights Commission
    und das Human Rights Review Tribunal.

    '
  inkrafttreten:
    datum: 1994-02-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1993/0082/latest/whole.html
    fundstelle_norm: 's. 1(2) Human Rights Act 1993: ''This Act shall come into force on 1 February 1994.''
      Kopfzeile: ''Date of assent 10 August 1993'''
  anwendungsdaten:
  - datum: 2026-08-07
    was_gilt: Die Human Rights Commission veröffentlicht ihr Diskussionspapier zu KI und Te Tiriti o Waitangi
      und fordert einen nationalen Risikobewertungsrahmen.
    verifiziert: true
    quelle: https://tikatangata.org.nz/our-work/artificial-intelligence-emerging-digital-technologies-and-human-rights
  themenachsen:
  - grundrechte
  - arbeit
  - sektor-finanz
  - governance
  regelungsschwerpunkte:
  - 's. 21: abschliessender Katalog der verbotenen Diskriminierungsgründe. Er ist die Bezugsgrösse für
    Rule 10 Abs. 5 des Biometric Processing Privacy Code, der die biometrische Kategorisierung nach eben
    diesen Gründen untersagt.'
  - 's. 22: Diskriminierungsverbot im Beschäftigungsverhältnis — einschlägig für algorithmische Bewerberauswahl
    und Leistungsbewertung.'
  - 's. 44: Diskriminierungsverbot bei der Bereitstellung von Waren, Einrichtungen und Dienstleistungen
    an die Öffentlichkeit; Abs. 2 stellt klar, dass "facilities" auch Bank- und Versicherungsdienstleistungen
    umfasst — die Norm für algorithmisches Scoring.'
  - 's. 65 (mittelbare Diskriminierung): Die entscheidende Norm für algorithmische Benachteiligung. Sie
    verlangt keinen Vorsatz und kehrt die Beweislast für die Rechtfertigung um ("unless the person ...
    establishes good reason"). Damit ist sie das schärfste vorhandene Instrument gegen diskriminierende
    Modelle — es fehlt allerdings jede Auskunftspflicht über die Funktionsweise, sodass der Nachweis der
    unterschiedlichen Wirkung praktisch schwer zu führen ist.'
  - 'NEGATIVBEFUND: keine Vorschrift zu automatisierten Entscheidungen, keine Erklärungspflicht, kein
    Auskunftsanspruch über die Logik.'
  dokumente:
  - datum: 2025-11-27
    typ: konsolidiert
    titel: Human Rights Act 1993 (konsolidierte Fassung mit Stand 27.11.2025)
    url: https://www.legislation.govt.nz/act/public/1993/0082/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
    verifiziert: true
    notiz: Amtlicher Volltext; Grundlage der Prüfung von ss. 21, 22, 44 und 65 sowie der Negativkontrolle.
  offene_punkte:
  - Eine neuseeländische Entscheidung zu algorithmischer Diskriminierung nach s. 65 wurde nicht gefunden.
  - Ob die Human Rights Commission ihre Empfehlungen in ein Gesetzgebungsvorhaben überführen kann, ist
    offen.
  monitoring_quellen:
  - https://tikatangata.org.nz/
  - https://www.justice.govt.nz/tribunals/human-rights/
  bezug_regelwerke:
  - nz-hrc-ai-tiriti-2026
  - nz-biometric-processing-privacy-code-2025
  - nz-privacy-act-2020
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 's. 65 ist die stärkste ungenutzte Norm des neuseeländischen KI-Rechts. Sie erfasst
    mittelbare Diskriminierung ohne Verschulden und legt die Rechtfertigungslast dem Handelnden auf —
    dogmatisch günstiger als Art. 21 Abs. 1 der Charta oder das deutsche AGG. Sie scheitert allein an
    der Beweisebene: Ohne Transparenzpflicht kann eine betroffene Person die unterschiedliche Wirkung
    eines Modells nicht darlegen. Genau hier setzt der Vorschlag der Human Rights Commission für ein nationales
    Algorithmenregister an. Wer den neuseeländischen Fall untersucht, findet hier den präzisesten Beleg
    dafür, dass materielles Recht ohne Verfahrensrecht leerläuft.

    '
  pruefvermerk:
  - Bestaetigt. Ausfertigung 10.08.1993, Inkrafttreten 01.02.1994.
- id: nz-bill-of-rights-act-1990
  jurisdiktion: nz
  kurztitel: New Zealand Bill of Rights Act 1990
  offizieller_titel: New Zealand Bill of Rights Act 1990
  fundstelle: 1990 No 109
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht ohne Verfassungsrang im formellen Sinne: Nach s. 4 dürfen Gerichte andere
    Gesetze nicht wegen Unvereinbarkeit unangewandt lassen. Für KI relevant sind vor allem die Meinungsfreiheit
    (s. 14) und das Diskriminierungsverbot (s. 19). Das Gesetz wurde in dieser Recherche nicht am Volltext
    geprüft.

    '
  kurzbeschreibung: 'Der Bill of Rights Act bindet die drei Staatsgewalten und Stellen, die öffentliche
    Aufgaben wahrnehmen. s. 14 schützt die Freiheit der Meinungsäusserung einschliesslich der Freiheit,
    Informationen jeder Art zu suchen, zu empfangen und weiterzugeben; s. 19 gewährleistet die Freiheit
    von Diskriminierung nach den Gründen des Human Rights Act 1993. s. 5 lässt Einschränkungen zu, die
    durch Recht vorgesehen und in einer freien und demokratischen Gesellschaft nachweislich gerechtfertigt
    sind. Für KI ist das Gesetz vor allem als Massstab für staatliche Überwachung, für Inhaltsregulierung
    und für die geplante Deepfake-Strafnorm bedeutsam.

    '
  inkrafttreten:
    datum: 1990-09-25
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1990/0109/latest/whole.html
    fundstelle_norm: 's. 1(2) New Zealand Bill of Rights Act 1990: ''This Act shall come into force on
      the 28th day after the date on which it receives the Royal assent.'' Royal assent 28.08.1990; 28.
      Tag danach ist der 25.09.1990'
  anwendungsdaten: []
  themenachsen:
  - grundrechte
  - content
  regelungsschwerpunkte:
  - s. 14 Meinungsfreiheit — Massstab für jede Inhaltsregulierung, auch für die geplante Ausweitung der
    Strafbarkeit synthetischer Darstellungen.
  - s. 19 Diskriminierungsverbot mit Verweis auf die Gründe des Human Rights Act 1993.
  - s. 5 Schrankenvorbehalt; s. 4 Vorrang des einfachen Gesetzes.
  - Gesetzentwürfe werden vom Attorney-General auf Vereinbarkeit geprüft (s. 7); eine solche Prüfung ist
    auch für den Deepfake Digital Harm and Exploitation Bill zu erwarten.
  dokumente:
  - datum: 2026-09-06
    typ: konsolidiert
    titel: New Zealand Bill of Rights Act 1990 (konsolidierte Fassung)
    url: https://www.legislation.govt.nz/act/public/1990/0109/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
    verifiziert: false
    notiz: Nicht am Volltext geprüft; als Rahmennorm geführt.
  offene_punkte:
  - Der Volltext wurde nicht geprüft.
  - Eine s.-7-Erklärung des Attorney-General zum Deepfake-Gesetzentwurf wurde nicht aufgefunden.
  monitoring_quellen:
  - https://www.justice.govt.nz/justice-sector-policy/constitutional-issues-and-human-rights/
  bezug_regelwerke:
  - nz-human-rights-act-1993
  - nz-deepfake-bill-2025
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der Bill of Rights Act ist in Neuseeland kein Prüfungsmassstab mit Verwerfungskompetenz.
    Für KI heisst das: Anders als in Mexiko oder Kolumbien kann ein neuseeländisches Gericht ein KI-freundliches
    Gesetz nicht an Grundrechten scheitern lassen. Das erklärt, warum die grundrechtliche Auseinandersetzung
    dort über die Human Rights Commission und nicht über die Gerichte läuft.

    '
  pruefvermerk:
  - 'Bestaetigt, aber berechnet: Das Gesetz nennt kein Datum, sondern eine Frist von 28 Tagen ab Ausfertigung
    (28.08.1990). Das ergibt den 25.09.1990; das eingetragene Datum stimmt.'
- id: nz-harmful-digital-communications-act-2015
  jurisdiktion: nz
  kurztitel: Harmful Digital Communications Act 2015
  offizieller_titel: Harmful Digital Communications Act 2015
  fundstelle: 2015 No 63; verwaltet vom Ministry of Justice; konsolidierte Fassung mit Stand 09.03.2022
  verfahrensnummer: null
  status: teilanwendbar
  status_detail: 'Geltendes Recht. Es ist das einzige neuseeländische Gesetz, das schädigende digitale
    Inhalte allgemein erfasst — enthält aber KEINE Regelung zu synthetischen Inhalten. Die Wörter "artificial
    intelligence", "synthetic", "deepfake" und "digitally altered" kommen darin NICHT vor (Volltextprüfung
    am 06.09.2026). Die Lücke soll durch den Deepfake Digital Harm and Exploitation Bill geschlossen werden.

    '
  kurzbeschreibung: 'Das Gesetz stellt in s. 6 zehn Kommunikationsgrundsätze auf (unter anderem: keine
    Offenlegung sensibler persönlicher Tatsachen, keine Drohung oder Einschüchterung, keine grob beleidigenden,
    unanständigen oder obszönen Mitteilungen, kein Belästigen, keine falschen Behauptungen, keine Verletzung
    von Vertraulichkeit, keine Aufforderung zu Schädigung oder Selbsttötung, kein Blossstellen wegen Hautfarbe,
    Rasse, ethnischer oder nationaler Herkunft, Religion, Geschlecht, sexueller Orientierung oder Behinderung).
    Verfahrensrechtlich gibt es ein niedrigschwelliges Verfahren über die zugelassene Stelle (Netsafe)
    und den District Court. s. 22 stellt das absichtliche schädigende Posten unter Strafe; s. 22A (eingefügt
    am 09.03.2022) erfasst das unbefugte Posten intimer Bildaufnahmen mit einem Strafrahmen von bis zu
    zwei Jahren Freiheitsstrafe oder 50.000 NZD für natürliche und bis zu 200.000 NZD für juristische
    Personen; ss. 22B und 24 sehen zivilrechtliche Anordnungen und Take-down-Anordnungen vor.

    '
