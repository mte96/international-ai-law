  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'IPP 3A ist der einzige neuseeländische Rechtsakt seit 2020, der die Datenlage generativer
    KI unmittelbar berührt — und er tut es unbeabsichtigt. Der Gesetzentwurf stammt aus 2023 und zielt
    auf Datenhandel, nicht auf Modelltraining. Praktisch bedeutsam ist die Stichtagsregel: Wer seinen
    Datenbestand vor dem 01.05.2026 zusammengetragen hat, muss niemanden benachrichtigen. Das ist eine
    Amnestie für die bereits gebauten Korpora.

    '
- id: nz-biometric-processing-privacy-code-2025
  jurisdiktion: nz
  kurztitel: Biometric Processing Privacy Code 2025
  offizieller_titel: Biometric Processing Privacy Code 2025
  fundstelle: New Zealand Gazette, Notice 2025-sl4213, ausgegeben am 21.07.2025, veröffentlicht am 06.08.2025;
    erlassen nach s. 32 Privacy Act 2020; sekundäres Recht im Sinne des Legislation Act 2019
  verfahrensnummer: 2025-sl4213
  status: anwendbar
  status_detail: 'Seit 03.11.2025 in Kraft für neu aufgenommene biometrische Verarbeitung, seit 03.08.2026
    auch für vor dem 03.11.2025 begonnene Verarbeitung. Die Übergangsfrist ist damit abgelaufen; der Kodex
    gilt vollständig. Amendment No 1 vom 25.03.2026 hat Rule 3A eingefügt (Wirkung 01.05.2026 bzw. 03.08.2026).

    '
  kurzbeschreibung: 'Der Kodex des Privacy Commissioner modifiziert die IPPs für die "biometric processing",
    also für den Vergleich oder die Analyse biometrischer Informationen durch ein technisches System zum
    Zweck der Identifizierung, Verifizierung oder Kategorisierung. Erfasst sind Gesichtserkennung, Fingerabdrücke,
    Stimme, Tastaturanschlagsmuster und Gangbild; ausgenommen sind biologisches und genetisches Material,
    Hirnaktivität und Daten des Nervensystems. Kernstück ist Rule 1: Eine Stelle darf biometrische Informationen
    nur erheben, wenn die Verarbeitung einem rechtmässigen Zweck dient, dafür erforderlich ist, wirksam
    ist, keine weniger eingriffsintensive Alternative besteht, angemessene Schutzvorkehrungen bestehen
    und die Verarbeitung "proportionate to the likely impacts on individuals" ist; bei der Abwägung sind
    ausdrücklich die "cultural impacts and effects of biometric processing on Māori" zu berücksichtigen.
    Rule 10 Abs. 5 verbietet die biometrische Kategorisierung zur Ableitung von Persönlichkeit, Stimmung,
    Emotion, Geisteszustand, Ermüdung, Wachheit oder Aufmerksamkeit sowie nach verbotenen Diskriminierungsgründen,
    mit engen Ausnahmen für Barrierefreiheit, Gefahrenabwehr, Forschung, Altersschätzung und Ermüdungserkennung
    aus Sicherheitsgründen. Durchgesetzt wird der Kodex wie die IPPs — Verstösse sind "interference with
    privacy" nach s. 69 Privacy Act 2020.

    '
