  eigene_bewertung: 'Der Kodex ist die einzige Stelle, an der Neuseeland KI verbindlich und materiell
    reguliert — und er zeigt zugleich, was der Verzicht auf ein Gesetz kostet. Inhaltlich reicht Rule
    10 Abs. 5 nahe an die verbotenen Praktiken des Art. 5 KI-VO heran: Emotionserkennung und biometrische
    Kategorisierung nach geschützten Merkmalen sind untersagt. Formal aber ist das kein Marktverbot, sondern
    eine Datenschutzregel: Sie greift nur bei Personenbezug, sie ist nach s. 31 Privacy Act 2020 nicht
    einklagbar, und ihre Verletzung führt allenfalls über s. 69 zu einem Tribunalverfahren. Der Anbieter
    eines Emotionserkennungssystems darf es in Neuseeland weiter verkaufen; nur der Anwender trägt das
    Risiko. Rechtsvergleichend ist das der Unterschied zwischen Produktregulierung und Verhaltensregulierung
    — in einem einzigen Dokument sichtbar.

    '
