  offizieller_titel: 'Responsible AI Guidance for the Public Service: GenAI'
  fundstelle: Government Chief Digital Officer (GCDO), Fassung mit Stand 03.02.2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Leitlinie für Führungskräfte und Entscheidungsträger der neuseeländischen Kernverwaltung
    zum Einsatz generativer KI. Nicht bindend; die Verantwortung bleibt bei der Behörde ("agencies are
    responsible for their use of GenAI systems"). Zuletzt aktualisiert am 03.02.2025.

    '
  kurzbeschreibung: 'Die Leitlinie gliedert sich in "GenAI Foundations" (Governance, Sicherheit, Beschaffung,
    Kompetenzen, Fehlinformation, Rechenschaft) und "GenAI and Customer Experience" (Transparenz, Verzerrung,
