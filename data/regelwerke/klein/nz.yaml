  - 'Rechtsnatur: "a voluntary resource to help businesses ... realise AI''s benefits through using and
    developing AI systems in a trustworthy way". Keine Pflicht, keine Sanktion, keine Aufsicht.'
  - 'Funktion im Gesamtsystem: Die Guidance ersetzt in Neuseeland das, was in der EU der Hochrisiko-Pflichtenkatalog
    leistet — mit dem Unterschied, dass niemand ihre Einhaltung prüfen kann.'
  - Materiell behandelt sie Cybersicherheit, Datenschutz und geistiges Eigentum. Zum Urheberrecht kann
    sie nur auf das ungeklärte geltende Recht verweisen (kein TDM-Ausnahmetatbestand, keine Rechtsprechung).
