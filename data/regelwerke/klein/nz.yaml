  regelungsschwerpunkte:
  - Rechtsgrundlage s. 32 Privacy Act 2020; der Kodex ist sekundäres Recht nach dem Legislation Act 2019
    und damit die einzige verbindliche, KI-nahe Regelungsschicht Neuseelands unterhalb des Gesetzes.
