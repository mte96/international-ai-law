  - datum: 2025-06-03
    typ: bericht
    titel: Inquiry into Foodstuffs North Island trial use of facial recognition technology (A1082856)
    url: https://www.privacy.org.nz/assets/DOCUMENTS/20250603-FRT-Inquiry-Report-A1082856.pdf
    sprache: en
    urheber: Office of the Privacy Commissioner
    verifiziert: true
    notiz: Der einzige ausführlich begründete neuseeländische Massstab für biometrische KI im Privatsektor.
  offene_punkte:
  - Ob Foodstuffs den Betrieb nach Inkrafttreten des Biometrics Code fortgesetzt und die Rule-1-Prüfung
    dokumentiert hat, wurde nicht ermittelt.
  - Der Bericht erging vor dem Biometrics Code; wie sich seine Auflagen zur Verhältnismässigkeitsprüfung
    der Rule 1 verhalten, ist nicht amtlich geklärt.
  monitoring_quellen:
