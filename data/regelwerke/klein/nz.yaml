  jurisdiktion: nz
  kurztitel: Copyright Act 1994
  offizieller_titel: Copyright Act 1994
  fundstelle: 1994 No 143; verwaltet vom Ministry of Business, Innovation and Employment; konsolidierte
    Fassung mit Stand 13.11.2025
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'In Kraft seit 1995, zuletzt konsolidiert mit Stand 13.11.2025. Neuseeland gehört zu
    den wenigen Rechtsordnungen, die computererzeugte Werke ausdrücklich schützen (s. 5 Abs. 2 lit. a).
    Eine Schranke für Text- und Data-Mining besteht NICHT; eine Reform ist beschlossen, die KI-Frage aber
    bis 31.03.2027 vertagt.

    '
  kurzbeschreibung: 'Das Gesetz schützt literarische, dramatische, musikalische und künstlerische Werke,
    Tonaufnahmen, Filme, Kommunikationswerke und typografische Anordnungen. Für KI zentral ist die Zuweisung
    der Urheberschaft bei computererzeugten Werken: Nach s. 2 bedeutet "computer-generated" in Bezug auf
    ein Werk, "that the work is generated by computer in circumstances such that there is no human author
    of the work"; nach s. 5 Abs. 2 lit. a gilt bei einem computererzeugten literarischen, dramatischen,
    musikalischen oder künstlerischen Werk als Urheber "the person by whom the arrangements necessary
    for the creation of the work are undertaken". Die Schutzdauer beträgt nach s. 22 Abs. 2 fünfzig Jahre
    ab dem Ende des Kalenderjahres, in dem das Werk geschaffen wurde. Die Schranken sind als eng gefasste
    fair dealings ausgestaltet (s. 42 Kritik, Besprechung, Nachrichten; s. 43 Forschung oder privates
    Studium; s. 43A vorübergehende Vervielfältigung); eine allgemeine fair-use-Klausel und eine TDM-Schranke
    fehlen. Sanktionen: zivilrechtliche Ansprüchen sowie Straftatbestände bei gewerbsmässiger Verletzung.

    '
  inkrafttreten:
    datum: 1995-01-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1994/0143/latest/whole.html
    fundstelle_norm: 's. 1(2) Copyright Act 1994: ''Except as provided in sections 27(2) and 144(5), this
      Act shall come into force on 1 January 1995.'' Kopfzeile von legislation.govt.nz: ''Date of assent
      15 December 1994 — Commencement see section 1(2)'''
  anwendungsdaten:
  - datum: 2008-10-31
    was_gilt: Copyright (New Technologies) Amendment Act 2008 — Einfügung u.a. der vorübergehenden Vervielfältigung
      (s. 43A) und der Kommunikationswerke.
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1994/0143/latest/whole.html
  - datum: 2025-11-13
    was_gilt: Stand der konsolidierten Fassung, an der die Prüfung erfolgt ist.
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1994/0143/latest/whole.html
  themenachsen:
  - urheberrecht
  - content
  - vertrag
  regelungsschwerpunkte:
  - 's. 2 (Definition, Wortlaut): "computer-generated, in relation to a work, means that the work is generated
    by computer in circumstances such that there is no human author of the work". Neuseeland setzt also
    das Fehlen eines menschlichen Urhebers voraus — die Norm greift gerade dort, wo andere Rechtsordnungen
    den Schutz versagen.'
  - 's. 5 Abs. 2 lit. a (Wortlaut): "in the case of a literary, dramatic, musical, or artistic work that
    is computer-generated, the person by whom the arrangements necessary for the creation of the work
    are undertaken". Entsprechung zu s. 9 Abs. 3 CDPA 1988 (Vereinigtes Königreich), s. 21 Abs. 1 Copyright
    Act (Irland) und s. 11 Copyright Ordinance (Hongkong).'
  - 's. 22 Abs. 2 (Wortlaut): "If the work is computer-generated, copyright expires at the end of the
    period of 50 years from the end of the calendar year in which the work is made." Eigenständige, vom
    Todeszeitpunkt gelöste Schutzfrist.'
  - 'ZENTRALER NEGATIVBEFUND: Die Wortfolgen "text and data" und "data mining" kommen im gesamten Copyright
    Act 1994 NICHT vor (Volltextprüfung am 06.09.2026). Es gibt weder eine TDM-Schranke nach Art. 3 und
    4 DSM-Richtlinie noch ein Gegenstück zu Art. 30-4 des japanischen Urheberrechtsgesetzes. Modelltraining
    mit geschützten Werken ist in Neuseeland folglich nur über die engen fair dealings oder über Lizenz
    zulässig.'
  - 's. 43 Abs. 1: "Fair dealing with a work for the purposes of research or private study does not infringe
    copyright in the work." Abs. 3 nennt als Abwägungskriterien Zweck, Art des Werks, Verfügbarkeit zu
    einem marktüblichen Preis, Auswirkung auf den Markt und Umfang der Entnahme. Kommerzielles Modelltraining
    lässt sich darunter kaum fassen; der Kaufbarkeitstest (lit. c) und der Markttest (lit. d) sprechen
    gerade dagegen.'
  - 's. 21 Abs. 1 bis 3: Erstinhaber ist der Urheber; bei Arbeitnehmerwerken der Arbeitgeber; bei Auftragswerken
    (Fotografie, Computerprogramm, Gemälde, Zeichnung, Diagramm, Karte, Plan, Stich, Modell, Skulptur,
    Film, Tonaufnahme) der Auftraggeber. Die Auftragsregel des Abs. 3 soll durch die Reform 2026 umgekehrt
    werden.'
  - 's. 43A: vorübergehende Vervielfältigung — die einzige technikbezogene Schranke, gedacht für Caching
    und Übertragung, nicht für Trainingskorpora.'
  dokumente:
  - datum: 2025-11-13
    typ: konsolidiert
    titel: Copyright Act 1994 (konsolidierte Fassung mit Stand 13.11.2025)
    url: https://www.legislation.govt.nz/act/public/1994/0143/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
    verifiziert: true
    notiz: Amtlicher Volltext; Grundlage der Prüfung von s. 2, s. 5, s. 21, s. 22, s. 43, s. 43A und der
      Negativkontrolle zu TDM.
  offene_punkte:
  - Es existiert keine neuseeländische Entscheidung zu s. 5 Abs. 2 lit. a im Zusammenhang mit generativer
    KI. Die Norm ist seit 1994 unangewandt geblieben.
  - Ungeklärt ist, wer bei generativer KI "the arrangements necessary" trifft — der Nutzer, der Betreiber
    oder der Modellentwickler. Die neuseeländische Rechtsprechung schweigt; die englische Diskussion zu
    s. 9 Abs. 3 CDPA ist nicht übertragbar, weil das Vereinigte Königreich die Abschaffung der Norm erwägt.
  - Ob die Reform 2026/2027 die s. 5 Abs. 2 lit. a berührt, ist offen; die Kabinettsbeschlüsse vom Mai
    und Juni 2026 erwähnen sie nicht.
  monitoring_quellen:
  - https://www.mbie.govt.nz/business-and-employment/business/intellectual-property/copyright/updates-to-the-copyright-act
  bezug_regelwerke:
  - nz-copyright-reform-2026
  - nz-consumer-guarantees-act-1993
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Neuseeland ist die interessanteste Rechtsordnung des Commonwealth zur Schutzfähigkeit
    von KI-Ausgaben, und zwar aus einem paradoxen Grund: Die Norm, die den Schutz gewährt, ist noch nie
    angewandt worden. s. 5 Abs. 2 lit. a weist computererzeugten Werken einen Urheber zu, während Australien
    (Acohs, Telstra) und die Vereinigten Staaten (Thaler) den Schutz versagen und das Vereinigte Königreich
    die Abschaffung der Parallelnorm konsultiert hat. Der zweite, in der Literatur unterschätzte Punkt
    ist die Kombination aus s. 5 Abs. 2 lit. a und dem Fehlen jeder TDM-Schranke: Neuseeland schützt den
    Output grosszügiger als fast alle Vergleichsordnungen und den Input strenger. Das ist genau die Konstellation,
    in der Rechteinhaber ihre Klagen anstrengen sollten — und der Grund, warum das Fehlen jeder Rechtsprechung
    so auffällig ist.

    '
  pruefvermerk:
  - Bestaetigt. Der 15.12.1994 ist die Ausfertigung (Royal assent), nicht das Inkrafttreten. Das Gesetz
    gilt fort (Fassung mit Stand 13.11.2025).
- id: nz-copyright-reform-2026
  jurisdiktion: nz
  kurztitel: Copyright-Reform 2026 und die vertagte KI-Frage
  offizieller_titel: Policy decisions on copyright including free trade agreement obligations; Cabinet
    invitation to report back by 31 March 2027 on a possible copyright framework for GenAI
  fundstelle: Kabinettsbeschlüsse Mai/Juni 2026; Ankündigungen der Regierung vom 26.05.2026 und 03.06.2026;
    proaktive Veröffentlichung des Kabinettspapiers, zweier Minutes und einer Regulatory Impact Statement
    durch MBIE
  verfahrensnummer: null
  status: idee
  status_detail: 'Politikentscheidungen sind getroffen, ein Gesetzentwurf ist bis 06.09.2026 nicht eingebracht.
    Zeitrahmen ist die Umsetzung der Freihandelsabkommen: Änderungen des Copyright Act 1994 müssen für
    das Abkommen mit der Europäischen Union bis 01.05.2028 und für das Abkommen mit dem Vereinigten Königreich
    bis 31.05.2028 in Kraft sein; die Regierung fasst beide Fristen zum früheren Termin zusammen. Die
    KI-Frage ist ausdrücklich ausgeklammert und dem Minister of Commerce and Consumer Affairs zur Rückberichterstattung
    bis 31.03.2027 aufgegeben.

    '
  kurzbeschreibung: 'Die Regierung hat am 26.05.2026 die Verlängerung der Schutzfristen um zwanzig Jahre
    und am 03.06.2026 ein Paket weiterer Änderungen angekündigt: Erleichterungen für gemeinnützige Galerien,
    Bibliotheken, Archive und Museen einschliesslich verwaister Werke und digitaler Erhaltungskopien;
    eine neue fair-dealing-Schranke für Parodie und Satire; ein gerichtlicher Rahmen für Sperranordnungen
    gegen ausländische Piraterieseiten; die Aufhebung des überholten Filesharing-Regimes; kollektive Rechtsdurchsetzung
    durch Verwertungsgesellschaften; Klarstellung der Erschöpfung des Erstverbreitungsrechts; Umkehr der
    Auftragswerksregel des s. 21 Abs. 3 zugunsten der Urheber; sowie die Verlängerung des Folgerechts
    für bildende Künstler um zwanzig Jahre. Zu generativer KI heisst es amtlich: "GenAI raises complex
    copyright questions. Countries are taking different approaches to address these issues. Cabinet has
    invited the Minister of Commerce and Consumer Affairs to report back by 31 March 2027 on a possible
    copyright framework for GenAI in New Zealand." Eine TDM-Schranke ist nicht Teil des Pakets.

    '
