- id: nz-cabinet-ai-approach-2024
  jurisdiktion: nz
  kurztitel: Kabinettsbeschluss 2024 — kein eigenes KI-Gesetz
  offizieller_titel: Cabinet paper "Approach to work on Artificial Intelligence"; Cabinet Economic Policy
    Committee minute ECO-24-MIN-0119
  fundstelle: Cabinet Economic Policy Committee, ECO-24-MIN-0119, 25.07.2024; proaktive Veröffentlichung
    durch MBIE
  verfahrensnummer: ECO-24-MIN-0119
  status: softlaw
  status_detail: 'Der tragende Grundsatzbeschluss. Er ist nicht aufgehoben und wird durch den Kabinettsbeschluss
    vom 30.06.2025 (Going for Growth) und die KI-Strategie vom Juli 2025 fortgeschrieben. Ministerin war
    Judith Collins KC (Science, Innovation and Technology; zugleich Ministerin für die Digitalisierung
    der Verwaltung).

    '
  kurzbeschreibung: 'Mit diesem Beschluss hat das neuseeländische Kabinett die Grundentscheidung gegen
    ein Horizontalgesetz getroffen. Empfehlung 2 lautet im Wortlaut: "agree that New Zealand will take
    a proportionate and risk-based approach to AI regulation where needed, using agile approaches, and
    leveraging existing mechanisms in preference to developing a standalone AI Act." Regulatorische Eingriffe
    sollen nur "acute risks" adressieren; im Übrigen sollen die vorhandenen Rahmen (Datenschutz, Verbraucherschutz,
    Menschenrechte) fortgeschrieben werden. Der Beschluss enthält keine Sanktionen und keine Rechtspflichten;
    seine Wirkung liegt darin, dass er die Beweislast umkehrt: Wer ein KI-Gesetz will, muss die Lücke
    im geltenden Recht nachweisen.

    '
