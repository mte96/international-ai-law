  regelungsschwerpunkte:
  - 'Zuordnung zu den RCCC 2008: Rule 3 (Kompetenz) trägt die Prüfpflicht bei KI-Recherche; Rule 13.1
    (Treuepflicht gegenüber dem Gericht) trägt die Verantwortung für eingereichte Fundstellen; Rule 10.9
    erfasst irreführende Angaben; Kapitel 8 die Vertraulichkeit bei Eingaben in fremde Systeme; Kapitel
    9 die Abrechnung KI-gestützter Arbeit.'
  - 'Abrechnungsfrage: Der Leitfaden behandelt ausdrücklich, wie Zeit- und Wertabrechnung bei KI-gestützter
    Arbeit zu handhaben ist — ein Punkt, den die Gerichtsleitlinien nicht berühren.'
