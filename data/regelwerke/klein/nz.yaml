  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Das Gesetz gilt international als vorbildlich, weil es 2015 ein niedrigschwelliges
    Verfahren gegen digitale Schädigung geschaffen hat. Für KI zeigt es die Grenze technikneutraler Regelung:
    Der Tatbestand des s. 22 verlangt Schädigungsabsicht gegenüber einem bestimmten Opfer und tatsächlich
    eingetretenen Schaden. Wer mit einer Anwendung tausend synthetische Darstellungen erzeugt, erfüllt
    das nicht ohne Weiteres. Genau deshalb liegt seit 2025 ein Gesetzentwurf vor — der beste Beleg dafür,
    dass "vorhandenes Recht reicht aus" in Neuseeland nicht durchgehalten wird, sobald ein konkreter Schadensfall
    politisch sichtbar wird.

    '
  pruefvermerk:
  - 'Bestaetigt und praezisiert. Der 03.07.2015 ist richtig, betrifft aber nur ss. 22-25 und Part 2 (Straftatbestaende).
    Das Gesetz ist gestuft in Kraft getreten; alle drei weiteren Stufen sind jetzt erfasst. Status auf
    teilanwendbar zu setzen ist nicht zwingend — seit 21.11.2016 ist das Gesetz vollstaendig in Kraft;
    wenn der Bestand ''teilanwendbar'' nur fuer aktuell unvollstaendig geltende Regelwerke verwendet,
    sollte der Status bei ''anwendbar'' bleiben. Empfehlung: anwendbar.'
- id: nz-deepfake-bill-2025
  jurisdiktion: nz
  kurztitel: Deepfake Digital Harm and Exploitation Bill
  offizieller_titel: Deepfake Digital Harm and Exploitation Bill (Member's Bill), Bill 213—1
  fundstelle: New Zealand Parliament, Bill 213—1 (2025); Einbringung am 23.10.2025; erste Lesung am 20.05.2026;
    Überweisung an das Social Services and Community Committee
  verfahrensnummer: 213—1
  status: verfahren
  status_detail: 'Abgeordnetenentwurf (Member''s Bill) von Laura McClure (ACT). Eingebracht am 23.10.2025,
    erste Lesung am 20.05.2026 einstimmig angenommen, Überweisung an das Social Services and Community
    Committee, öffentliche Einreichungen bis 19.06.2026, 23.59 Uhr. Ein Berichtstermin des Ausschusses
    war bis zum 06.09.2026 nicht auffindbar. Der Entwurf ist das einzige KI-bezogene Gesetzgebungsvorhaben
    im neuseeländischen Parlament.

    '
  kurzbeschreibung: 'Der Entwurf erweitert die Definition der "intimate visual recording" im Crimes Act
    1961 und im Harmful Digital Communications Act 2015 auf Darstellungen, die ohne Kenntnis oder Einwilligung
    der abgebildeten Person erzeugt, synthetisiert oder verändert wurden. Klausel 4 fügt in s. 216G Crimes
    Act 1961 einen neuen Abs. 1A ein, wonach für die ss. 216H bis 216N als intime Bildaufnahme auch eine
    Aufnahme gilt, die "created, synthesised, or altered without the knowledge or consent of the person
    who is the subject of the recording" wurde und die Person nackt beziehungsweise mit entblösstem oder
    teilweise entblösstem Genital-, Scham-, Gesäss- oder Brustbereich oder nur in Unterwäsche, bei einer
    intimen sexuellen Handlung oder beim Duschen, bei der Notdurft oder einer anderen persönlichen körperlichen
    Verrichtung mit An- oder Auskleiden zu zeigen scheint. Klausel 6 fügt eine entsprechende Bestimmung
    in s. 4 des Harmful Digital Communications Act 2015 ein. Eigene Strafrahmen schafft der Entwurf nicht;
    er lässt die vorhandenen Strafdrohungen greifen. Inkrafttreten am Tag nach der königlichen Zustimmung.

    '
