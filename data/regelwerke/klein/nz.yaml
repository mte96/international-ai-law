  bezug_regelwerke:
  - nz-crimes-act-1961
  - nz-harmful-digital-communications-act-2015
  - nz-hrc-ai-tiriti-2026
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der Entwurf ist der Testfall des neuseeländischen Modells und fällt zwiespältig aus.
    Positiv: Er zeigt, dass ein Staat ohne KI-Gesetz auf eine konkrete Gefahr sehr sparsam reagieren kann
    — eine erweiterte Definition statt eines neuen Regelungswerks, und alle vorhandenen Tatbestände greifen
    mit. Negativ: Er erfasst ausschliesslich den Verbreiter, nicht den Technologieanbieter. Damit wiederholt
    sich auf der Ebene der Deepfakes genau das Problem, das auf der Ebene der Emotionserkennung schon
    der Biometrics Code hat: Neuseeland reguliert Verhalten, nicht Produkte. Für eine Rechtsordnung ohne
    inländische Modellanbieter mag das folgerichtig sein; wirksam ist es nicht, weil die betreffenden
    Dienste ohnehin im Ausland betrieben werden.

    '
  pruefvermerk:
  - 'Bestaetigt: inkrafttreten null, Status verfahren. Am amtlichen Entwurfstext geprueft, dass der Entwurf
    nach cl. 2 erst am Tag nach der Ausfertigung in Kraft traete. Kein Datum erfunden.'
- id: nz-social-security-act-2018-adm
  jurisdiktion: nz
  kurztitel: Automatisierte Entscheidungen in der Sozialverwaltung (s. 363A Social Security Act 2018)
  offizieller_titel: Social Security Act 2018, s. 363A (Use of automated electronic systems to make decisions,
    exercise powers, comply with obligations, and take related actions), in der Fassung des Social Security
    (Modernisation) Amendment Act 2026
  fundstelle: Social Security Act 2018 (2018 No 32), s. 363A, eingefügt am 01.07.2023 durch s. 34 des
    Child Support (Pass On) Acts Amendment Act 2023 (2023 No 27), geändert am 01.07.2026 durch s. 36 des
    Social Security (Modernisation) Amendment Act 2026 (2026 No 27)
  verfahrensnummer: Social Security (Modernisation) Amendment Bill 313—1
  status: anwendbar
  status_detail: 'Die einzige verbindliche neuseeländische Rechtsvorschrift zum automatisierten Verwaltungsentscheiden.
    Die Änderungen des Jahres 2026 sind am 01.07.2026 in Kraft getreten. Der Änderungsentwurf wurde am
    28.05.2026 eingebracht und am selben Tag in erster, zweiter und dritter Lesung sowie im Ausschuss
    des ganzen Hauses behandelt; die königliche Zustimmung erfolgte am 05.06.2026. Ein Ausschussverfahren
    mit öffentlichen Einreichungen fand nicht statt.

    '
  kurzbeschreibung: 'Nach s. 363A Abs. 1 kann das Ministry of Social Development den Einsatz eines automatisierten
    elektronischen Systems durch eine benannte Person genehmigen, um im Rahmen bestimmter Vorschriften
    Entscheidungen zu treffen, Befugnisse auszuüben, Pflichten zu erfüllen oder damit zusammenhängende
    Handlungen vorzunehmen. Der Social Security (Modernisation) Amendment Act 2026 erweitert den Anwendungsbereich
    auf "administrative programmes", also auf Programme der sozialen Unterstützung, die NICHT in oder
    aufgrund von Rechtsvorschriften bestehen, und hebt den bisherigen Abs. 3 samt Überschrift auf. Die
    Genehmigung setzt nach Abs. 4 voraus, dass das System der Kontrolle des Ressorts unterliegt, mit angemessener
    Zuverlässigkeit arbeitet, dem genehmigten Standard entspricht und dass stets eine oder mehrere Personen
    als Alternative zur Verfügung stehen. Nach Abs. 5 muss jederzeit ein genehmigter Standard für den
    Einsatz automatisierter elektronischer Systeme in Kraft sein; er ist nach Abs. 6 vom Ministerium im
    Benehmen mit dem Privacy Commissioner und der Human Rights Commission zu beschliessen, mindestens
    alle drei Jahre zu überprüfen, im Gazette zu veröffentlichen und kostenfrei im Internet bereitzustellen.
    Abs. 6A verlangt, dass der Standard Regelungen zu Genauigkeit und Zuverlässigkeit, Verzerrung und
    Diskriminierung, rechtlichen und politischen Erwägungen, Betrugsaspekten, Transparenz, menschlicher
    Aufsicht sowie Einhaltung und Sicherung enthält. Nach Abs. 7 gilt eine so getroffene Entscheidung
    für alle Zwecke als von der zuständigen Person getroffen.

    '
