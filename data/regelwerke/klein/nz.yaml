  - datum: 2026-02-11
    was_gilt: Der Supreme Court zitiert die Leitlinien in Jones v Family Court at Whangārei [2026] NZSC
      1 und behandelt sie als Sorgfaltsmassstab auch für nicht vertretene Parteien.
    verifiziert: true
    quelle: https://www.courtsofnz.govt.nz/assets/cases/2026/2026-NZSC-1.pdf
  - datum: 2026-07-28
    was_gilt: Das Office of the Chief Justice bestätigt, dass die Leitlinien seit 2023 unverändert sind
      und überarbeitet werden müssen; eine begrenzte Zahl von Richterinnen und Richtern erprobt unter
      Aufsicht der Judicial AI Advisory Group GenAI-Werkzeuge.
    verifiziert: false
    quelle: https://www.rnz.co.nz/news/science-and-technology/811971/guidelines-for-ai-use-in-courts-need-updating-some-academics-say
  themenachsen:
  - berufsrecht
  - governance
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - Drei getrennte Fassungen — für die Richterschaft (9 Seiten), für die Anwaltschaft (7 Seiten) und für
    nicht vertretene Parteien (6 Seiten). Neuseeland war damit die erste Common-Law-Jurisdiktion mit einer
    eigenen Fassung für Laien; genau dieser Personenkreis hat die späteren Verfahren verursacht.
  - 'Sieben Abschnitte: (1) Understand GenAI and limitations, (2) Uphold confidentiality, suppression
    and privacy, (3) Ensure accountability and accuracy, (4) Be aware of ethical issues, (5) Maintain
    security, (6) Disclosing GenAI use, (7) Be aware of GenAI use by others; dazu Anwendungsbeispiele
    und ein Fragenkatalog.'
  - 'Prüfpflicht (Wortlaut Richterfassung): "must check the accuracy of any information you have been
    provided by a GenAI chatbot before it is relied upon."'
  - 'Vertraulichkeit (Wortlaut): "Generally, you should not enter any information into an AI chatbot that
    is not already in the public domain."'
  - 'Offenlegung: Richterinnen und Richter müssen den Einsatz nicht offenlegen — der Punkt, den die Wissenschaft
    2026 am schärfsten kritisiert.'
  - 'Kultureller Vorbehalt: Die Leitlinien warnen selbst, dass GenAI-Chatbots den neuseeländischen kulturellen
    Kontext sowie die Werte und Praktiken von Māori und Pasifika nicht angemessen abbilden.'
  - 'Selbstverpflichtung zur Fortschreibung: "This information will be updated as further risks or mitigation
    strategies are identified" — bis 06.09.2026 nicht eingelöst.'
