  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - datenschutz
  - governance
  regelungsschwerpunkte:
  - 's. 363A Abs. 1 (Wortlaut): "MSD may approve the use of an automated electronic system by a specified
    person to make any decision, exercise any power, comply with any obligation, or take any other related
    action under any specified provision."'
  - 'AUSWEITUNG 2026: Die neue Begriffsbestimmung "administrative programme" erfasst Programme der sozialen
    Unterstützung, die NICHT in oder aufgrund von Rechtsvorschriften bestehen. Damit wird automatisiertes
    Entscheiden auf untergesetzliche Verwaltungsprogramme erstreckt — der eigentliche Kern der Änderung
    und der Grund der Kritik.'
  - Aufhebung des bisherigen Abs. 3 samt Überschrift (Inhalt der aufgehobenen Beschränkung nicht mehr
    aus der konsolidierten Fassung ersichtlich).
  - 'Abs. 4 lit. d — Vorbehalt der menschlichen Alternative: "1 or more persons are always available,
    as an alternative, to make the decision, exercise the power, comply with the obligation, or take the
    related action." Das ist die einzige gesetzliche Verankerung eines Rechts auf menschliche Bearbeitung
    im neuseeländischen Recht.'
  - Abs. 6 lit. a — der Standard ist im Benehmen mit dem Privacy Commissioner UND der Human Rights Commission
    zu beschliessen (durch die Änderung 2026 eingefügt); Überprüfung mindestens alle drei Jahre; Veröffentlichung
    im Gazette und kostenfrei im Internet.
  - 'Abs. 6A — Pflichtinhalte des Standards: (a) accuracy and reliability, (b) bias and discrimination,
    (c) legal and policy considerations, (d) fraud considerations, (e) transparency, (f) human oversight,
    (g) compliance and assurance. Das ist der einzige verbindliche neuseeländische Pflichtenkatalog für
    ein algorithmisches System und liest sich wie eine Kurzfassung des Art. 9 KI-VO.'
  - 'Abs. 7 — Zurechnungsfiktion: Die automatisiert getroffene Entscheidung gilt für alle Zwecke als von
    der zuständigen Person getroffen. Rechtsschutz richtet sich damit gegen das Ministerium wie bei jeder
    anderen Entscheidung.'
  - 'VERFAHRENSKRITIK: Der Entwurf durchlief alle Stadien an einem Tag (28.05.2026) ohne Ausschussverfahren
    und ohne öffentliche Einreichungen. Die Regulatory Impact Statement war nach Angaben der Opposition
    in wesentlichen Teilen geschwärzt. Nach Angaben des Ministeriums soll ausschliesslich regelbasiert
    entschieden werden, nicht mit generativer KI.'
