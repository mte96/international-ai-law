    verifiziert: true
    quelle: https://www.beehive.govt.nz/release/government-ai-strategy-boost-productivity
  - datum: 2026-04-01
    was_gilt: Der Wirtschaftsausschuss des Parlaments bestätigt in seinem Briefing on artificial intelligence,
      dass Neuseeland auf Grundgesetze wie den Privacy Act 2020 und den Commerce Act 1986 setzt statt
      auf ein KI-Gesetz (Monat belegt, Tag nicht).
    verifiziert: false
    quelle: https://selectcommittees.parliament.nz/view/SelectCommitteeReport/847a8886-a31a-4af8-6d95-08dea647243b
  - datum: 2026-08-05
    was_gilt: Öffentliche Bilanz nach dreizehn Monaten — keine KI-spezifische Regulierung, keine Regeln
      für Rechenzentren, Wasser- oder Stromverbrauch; nur die Grünen und Labour haben eigene KI-Politik
      vorgelegt. NUR SEKUNDÄR BELEGT (Presse).
    verifiziert: false
    quelle: https://thespinoff.co.nz/politics/05-08-2026/if-ai-is-about-to-upend-everything-wheres-all-the-ai-policy
  themenachsen:
  - governance
  - marktzugang
  - datenschutz
  - grundrechte
  - arbeit
  - wettbewerb
  regelungsschwerpunkte:
  - 'Kernsatz zum Regulierungsansatz: "New Zealand is taking a light-touch and principles-based approach
    to AI policy. New Zealand has existing regulatory frameworks (e.g., privacy, consumer protection,
    human rights) which are largely principles-based and technology-neutral."'
  - 'Ausdrückliche Absage an einen Regulierungsaufbau: Die Übernahme der OECD-KI-Grundsätze erfordere
    "no additional regulatory overlay beyond existing law".'
  - 'Positionierung als "smart adopter": Die Strategie betont ausdrücklich die Anwendung und Anpassung
    von KI, nicht die Entwicklung von Basismodellen. Damit entfällt in Neuseeland die gesamte GPAI-Debatte
    — es gibt keine inländischen Anbieter, an die sich Transparenz- oder Evaluierungspflichten richten
    könnten.'
  - 'Begleitprodukt: Responsible AI Guidance for Businesses (MBIE), freiwillig, mit Schwerpunkten Cybersicherheit,
    Datenschutz und geistiges Eigentum.'
  - 'Investitionsseite: Active Investor Plus Visa (Änderungen ab 01.04.2025), Budget 2025 (213 Mio. NZD
    Studiengebühren, 64 Mio. NZD MINT, 111 Mio. NZD Einschreibungen), Vorsitz der Digital Nations 2027,
    gemeinsames Programm mit Singapur zu KI und gesundem Altern (12 Mio. NZD).'
  - 'Selbstauskunft: Die Strategie ist nach eigener Angabe unter menschlicher Aufsicht mit KI-Unterstützung
    erstellt worden.'
