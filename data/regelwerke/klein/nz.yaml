  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die Strategie ist juristisch dünner, als ihr Ruf vermuten lässt: Sie verweist auf
    "privacy, consumer protection, human rights", ohne ein einziges Gesetz namentlich zu nennen. Wer wissen
    will, welches Recht in Neuseeland auf KI angewandt wird, findet es dort nicht — er muss die Kabinettspapiere
    und den Ausschussbericht von 2026 heranziehen. Der interessanteste Befund ist die Selbstbeschränkung
    auf die Anwenderrolle: Weil in Neuseeland keine Basismodelle entwickelt werden, fehlt der Adressat
    für den gesamten Regelungsstoff, um den in der EU gestritten wird. Neuseeland ist damit kein Beleg
    dafür, dass ein Staat ohne KI-Gesetz auskommt, sondern dafür, dass ein reiner Anwenderstaat andere
    Regelungsprobleme hat als ein Entwicklerstaat.

    '
- id: nz-responsible-ai-guidance-business-2025
  jurisdiktion: nz
  kurztitel: Responsible AI Guidance for Businesses (MBIE)
  offizieller_titel: Responsible AI Guidance for Businesses
  fundstelle: Ministry of Business, Innovation and Employment, Juli 2025 (Begleitprodukt der KI-Strategie,
    Teil des Programms "Going for Growth")
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Freiwilliger Leitfaden ohne Bindungswirkung, veröffentlicht gemeinsam mit der KI-Strategie
    am 08.07.2025. Ein Publikationsdatum ist auf der MBIE-Seite selbst nicht ausgewiesen; belegt ist die
    gleichzeitige Veröffentlichung mit der Strategie.

    '
  kurzbeschreibung: 'Der Leitfaden richtet sich an neuseeländische Unternehmen, die KI einsetzen oder
    entwickeln. Er gliedert sich in die Abschnitte "Understanding your why for AI", "Good business foundations
    for responsible AI", "AI system specific considerations" (Daten und Modellierung, Nutzung und Ergebnisse)
    und "Continuing the conversation", ergänzt um ein Glossar. Adressiert werden Governance, Umgang mit
    Beschäftigten und Kundschaft, Cybersicherheit, Datenschutz und geistiges Eigentum. Der Leitfaden ist
    ausdrücklich freiwillig; er begründet keine Pflichten und sieht keine Sanktionen vor. Beigegeben ist
    ein Kurzformat "Quickstart: Businesses using AI tools".

    '
