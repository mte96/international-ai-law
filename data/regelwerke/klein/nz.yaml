  - nz-biometric-processing-privacy-code-2025
  - nz-health-information-privacy-code-2020
  - nz-opc-ai-guidance-2023
  - nz-human-rights-act-1993
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der Privacy Act 2020 trägt in Neuseeland die Last, die anderswo ein KI-Gesetz trägt,
    und man sieht ihm an, dass er dafür nicht gebaut wurde. Zwei Bruchstellen sind entscheidend. Erstens
    fehlt jede Regel zu automatisierten Entscheidungen — kein Verbot, kein Auskunftsanspruch über die
    Logik, kein Recht auf menschliches Eingreifen. Zweitens sind die IPPs nach s. 31 nicht einklagbar,
    und der Strafrahmen liegt bei 10.000 NZD. Wer also in Neuseeland durch ein KI-System geschädigt wird,
    hat weder einen materiellen Anspruch aus dem Datenschutzrecht noch eine abschreckende Sanktion hinter
    sich — er hat eine Beschwerde. Das ist die präzise Antwort auf die Frage, wo der neuseeländische Weg
    an seine Grenze stösst.

    '
- id: nz-privacy-amendment-act-2025
  jurisdiktion: nz
  kurztitel: Privacy Amendment Act 2025 (IPP 3A)
  offizieller_titel: Privacy Amendment Act 2025
  fundstelle: 2025 No 53; Royal assent 23.09.2025; verwaltet vom Ministry of Justice
  verfahrensnummer: Privacy Amendment Bill 292 (Einbringung 06.09.2023; erste Lesung und Überweisung an
    den Justice Committee 02.05.2024; Ausschussbericht 25.10.2024 als 292-2; zweite Lesung 18.02.2025;
    Ausschuss des ganzen Hauses 27.03.2025 als 292-3; dritte Lesung 18.09.2025)
  status: anwendbar
  status_detail: 'Part 2 in Kraft seit 24.09.2025, Part 1 (die materielle Änderung mit IPP 3A) seit 01.05.2026.
    Nach dem neu eingefügten s. 25A Privacy Act 2020 gilt IPP 3A nicht für personenbezogene Daten, die
    vor dem 01.05.2026 erhoben wurden.

    '
  kurzbeschreibung: 'Das Änderungsgesetz fügt in s. 22 Privacy Act 2020 nach IPP 3 den neuen IPP 3A ein:
    Erhebt eine Stelle personenbezogene Daten über eine Person aus anderen Quellen als bei dieser Person
    selbst, muss sie die in den Umständen angemessenen Schritte unternehmen, damit die betroffene Person
    von der Erhebung, ihrem Zweck, den vorgesehenen Empfängern, Namen und Anschrift der erhebenden und
    der speichernden Stelle, der etwaigen gesetzlichen Grundlage und den Rechten auf Zugang und Berichtigung
    Kenntnis erlangt. Die Schritte sind so bald wie vernünftigerweise praktikabel nach der Erhebung zu
    unternehmen. Eine Pflicht entfällt, wenn die Person bereits auf andere Weise über alle Punkte in Kenntnis
    gesetzt worden ist. Weiter passt das Gesetz ss. 25, 27, 28 an und ergänzt s. 18 um eine Befugnis zu
    Feststellungen über Staaten und Staatengruppen mit vergleichbarem Datenschutzniveau.

    '
  inkrafttreten:
    datum: 2026-05-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/2025/0053/latest/whole.html
