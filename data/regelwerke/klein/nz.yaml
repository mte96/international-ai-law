  eigene_bewertung: 'Dies ist der Punkt, an dem der neuseeländische Verzicht auf ein KI-Gesetz institutionell
    angegriffen wird — und zwar nicht von der Zivilgesellschaft, sondern von der nach dem Human Rights
    Act 1993 errichteten Menschenrechtskommission. Rechtsvergleichend besonders interessant ist die Verknüpfung
    von KI-Governance mit Te Tiriti o Waitangi: Wenn die Krone vertragliche Pflichten gegenüber Māori
    hat und Verwaltungsentscheidungen zunehmend algorithmisch fallen, lässt sich der Vertragsbezug nicht
    mit freiwilligen Zusagen erfüllen. Das ist ein Argument, das kein anderer Staat in dieser Form hat,
    und es könnte am Ende der Hebel sein, über den Neuseeland doch noch verbindliche Regeln bekommt.

    '
- id: nz-privacy-act-2020
  jurisdiktion: nz
  kurztitel: Privacy Act 2020
  offizieller_titel: Privacy Act 2020
  fundstelle: 2020 No 31; Royal assent 30.06.2020; verwaltet vom Ministry of Justice (Te Tahu o te Ture);
    konsolidierte Fassung mit Stand 01.05.2026
  verfahrensnummer: Privacy Bill 34 (52. Parlament)
  status: anwendbar
  status_detail: 'Vollständig in Kraft seit 01.12.2020. Seit 01.05.2026 gilt zusätzlich IPP 3A (eingefügt
    durch den Privacy Amendment Act 2025). Das Gesetz ist die tragende Norm des neuseeländischen KI-Rechts:
    Da kein KI-Gesetz besteht, laufen praktisch alle KI-bezogenen Rechtsfragen mit Personenbezug über
    die Information Privacy Principles.

    '
  kurzbeschreibung: 'Der Privacy Act 2020 bindet jede "agency" — Behörden wie Private, mit engen Ausnahmen
    — an dreizehn (seit 01.05.2026 vierzehn) Information Privacy Principles für Erhebung, Speicherung,
    Zugang, Berichtigung, Richtigkeit, Aufbewahrung, Nutzung, Weitergabe, Auslandsübermittlung und eindeutige
    Kennungen. Die IPPs sind nach s. 31 Abs. 1 grundsätzlich NICHT gerichtlich einklagbar; einzige Ausnahme
    ist der Auskunftsanspruch nach IPP 6 Abs. 1 gegenüber Stellen des öffentlichen Sektors. Durchgesetzt
    wird das Gesetz stattdessen über Beschwerde beim Privacy Commissioner (Te Mana Matapono Matatapu),
    Untersuchung, Vergleich, Compliance Notices und Verfahren vor dem Human Rights Review Tribunal, das
    nach s. 102 Feststellungen, Unterlassungsanordnungen, Schadensersatz nach s. 103 und weitere Anordnungen
    aussprechen kann. Meldepflichtig sind Datenschutzverletzungen mit ernsthaftem Schaden (Part 6). Der
    Strafrahmen des Gesetzes ist ausgesprochen niedrig: s. 212 sieht für Behinderung des Commissioners,
    falsche Angaben oder Identitätstäuschung Geldstrafen von höchstens 10.000 NZD vor.

    '
  inkrafttreten:
    datum: 2020-12-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/2020/0031/latest/whole.html
  anwendungsdaten:
  - datum: 2020-12-01
    was_gilt: Vollständiges Inkrafttreten; Ablösung des Privacy Act 1993.
