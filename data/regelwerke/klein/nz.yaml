  eigene_bewertung: 'Die Formel "no more restrictive than OECD comparators" ist die interessanteste Einzelaussage.
    Sie macht das neuseeländische Schutzniveau von fremden Entscheidungen abhängig und enthält zugleich
    einen eingebauten Nachvollzugsmechanismus: Verschärft die Mehrheit der OECD-Staaten, verliert die
    Zurückhaltung ihre Begründung. Für eine rechtsvergleichende Arbeit ist das ein Beleg dafür, dass "kein
    KI-Gesetz" hier keine Grundsatzposition ist, sondern eine Positionierung im Standortwettbewerb.

    '
- id: nz-ki-strategie-2025
  jurisdiktion: nz
  kurztitel: Neuseeländische KI-Strategie 2025
  offizieller_titel: 'New Zealand''s Strategy for Artificial Intelligence: Investing with confidence'
  fundstelle: Ministry of Business, Innovation and Employment (Hikina Whakatutuki), Juli 2025; veröffentlicht
    am 08.07.2025
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Erste nationale KI-Strategie Neuseelands, veröffentlicht am 08.07.2025 durch Hon Dr
    Shane Reti. Sie enthält keine Rechtspflichten. Bis zum 06.09.2026 ist ihr keine Umsetzungsverordnung,
    kein Gesetzentwurf und keine Nachfolgestrategie gefolgt; die Kritik daran ist im August 2026 öffentlich
    geworden.

    '
  kurzbeschreibung: 'Die Strategie ist ein Anwendungs- und Investitionsprogramm, kein Regulierungsprogramm.
    Sie benennt fünf Hemmnisse für die KI-Verbreitung (regulatorische Unsicherheit, wahrgenommene Komplexität
    und Risiken, fehlendes Verständnis des Nutzens, fehlende Kompetenzen, internationale Anbindung) und
    beantwortet sie mit Orientierung, Leitfäden, Bildung und Investitionsförderung. Zur Regulierung heisst
    es, Neuseeland verfolge einen "light-touch and principles-based approach" und verfüge bereits über
    weitgehend prinzipienbasierte und technologieneutrale Rahmen (Datenschutz, Verbraucherschutz, Menschenrechte);
    die Übernahme der OECD-KI-Grundsätze erfordere "no additional regulatory overlay beyond existing law".
    Sanktionen enthält die Strategie keine. Sie beziffert den möglichen Beitrag von KI zum Bruttoinlandsprodukt
    auf 76 Milliarden neuseeländische Dollar bis 2038.

    '
  inkrafttreten:
    datum: 2025-07-08
    verifiziert: true
    quelle: https://www.beehive.govt.nz/release/government-ai-strategy-boost-productivity
  anwendungsdaten:
