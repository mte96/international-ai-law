  status_detail: 'In Kraft seit 01.12.2020, zuletzt geändert durch Amendment No 2 mit Wirkung vom 01.05.2026
    (Einfügung der Rule 3A entsprechend IPP 3A). Amendment No 1 (in Kraft 01.07.2022) hat den Kodex an
    die Reform des Gesundheitssektors angepasst (Wegfall der District Health Boards, Aufnahme von Health
    New Zealand und des Ministeriums für behinderte Menschen).

    '
  kurzbeschreibung: 'Der Kodex ersetzt für Gesundheitsinformationen die IPPs durch dreizehn (seit 01.05.2026
    vierzehn) Rules mit gleichem Aufbau. Gebunden sind Gesundheits- und Behinderten-Dienstleister — Ärztinnen
    und Ärzte, Zahnärzte, Apotheken, Pflegeeinrichtungen, primary health organisations — sowie ACC, das
    Gesundheitsministerium, Krankenversicherer und Berufsdisziplinargremien. Für KI im Gesundheitswesen
    ist der Kodex die massgebliche Norm; er verdrängt insoweit den Biometric Processing Privacy Code,
    der Gesundheitsstellen bei der Verarbeitung von Gesundheitsinformationen ausnimmt.

    '
