  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die Erwartungen des Commissioners sind die praktisch wichtigste KI-Handlungsanleitung
    Neuseelands — und sie stammen aus Juni 2023, also aus einer Zeit vor GPT-4-Turbo, vor Agentensystemen
    und vor dem Biometrics Code. Dass sie seither nur fortgeschrieben, nicht neu gefasst wurden, ist dieselbe
    Schwäche, die auch die Gerichtsleitlinien aufweisen: Soft Law altert schneller als Gesetzesrecht,
    weil niemand eine Novellierungspflicht hat.

    '
- id: nz-opc-frt-inquiry-2025
  jurisdiktion: nz
  kurztitel: OPC-Untersuchung zum Gesichtserkennungsversuch von Foodstuffs
  offizieller_titel: Inquiry into Foodstuffs North Island trial use of facial recognition technology
  fundstelle: Office of the Privacy Commissioner, Bericht A1082856, veröffentlicht am 03./04.06.2025
  verfahrensnummer: A1082856
  status: softlaw
  status_detail: 'Abgeschlossene aufsichtsbehördliche Untersuchung mit Bericht vom Juni 2025. Keine gerichtliche
    Entscheidung und keine Verfügung, aber der einzige ausführlich begründete neuseeländische Massstab
    für die Anwendung der IPPs auf ein biometrisches KI-System. Ergangen vor Inkrafttreten des Biometric
    Processing Privacy Code 2025.

    '
  kurzbeschreibung: 'Der Privacy Commissioner hat den Versuchsbetrieb von Gesichtserkennung in Supermärkten
    der Foodstuffs North Island untersucht und ist zu dem Ergebnis gekommen, dass das eingesetzte Betriebsmodell
    dem Privacy Act 2020 entsprach, vor einem Dauerbetrieb oder einer Ausweitung aber verbessert werden
    muss. Geprüft wurden IPP 1 (rechtmässiger Zweck und Erforderlichkeit), IPP 3 und 4 (Transparenz und
    Art der Erhebung), IPP 5 (Sicherheit), IPP 8 (Richtigkeit) und IPP 9 (Aufbewahrung). Zur Richtigkeit
    verlangte der Commissioner die Anhebung der Alarmschwelle von 90 auf mindestens 92,5 Prozent. Weiter
    forderte er, die Beobachtungsliste auf qualifizierende Delikte (Gewalt, Aggression, Einschüchterung,
    Diebstahl in erheblicher Höhe) zu beschränken, Hausverbote nur dafür auszusprechen, die Datenschutzfolgenabschätzung
    an die tatsächliche Praxis anzupassen und das System fortlaufend zu überprüfen. Zu den Auswirkungen
    auf Māori stellte der Bericht fest, dass eine ethnische Auswertung von Treffern und Fehlern an der
    Datenlage scheiterte; das Māori Reference Panel lehnte den Einsatz ab und verwies auf Überwachungsrisiken,
    Stereotypisierung und die Erfassung von mataora und moko kauae. Ausdrücklich heisst es: "This report
    is not a green light for more general use of FRT."

    '
  inkrafttreten:
    datum: 2025-06-03
    verifiziert: true
    quelle: https://www.privacy.org.nz/assets/DOCUMENTS/20250603-FRT-Inquiry-Report-A1082856.pdf
  anwendungsdaten:
  - datum: 2024-09-01
    was_gilt: Ende des Versuchsbetriebs bei Foodstuffs North Island (Monat belegt, Tag nicht).
    verifiziert: false
    quelle: https://www.scoop.co.nz/stories/SC2409/S00053/foodstuffs-north-islands-facial-recognition-trial-ends-with-early-results-showing-success-in-reducing-harm.htm
  - datum: 2025-06-04
    was_gilt: Bekanntgabe des Untersuchungsergebnisses. Der Bericht selbst trägt das Datum 03.06.2025;
      der Tag der öffentlichen Bekanntgabe ist nur sekundär belegt.
    verifiziert: false
    quelle: https://www.privacy.org.nz/assets/DOCUMENTS/20250603-FRT-Inquiry-Report-A1082856.pdf
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Ergebnis: Das Betriebsmodell entsprach dem Privacy Act 2020, bedarf aber vor Dauerbetrieb oder Ausweitung
    der Nachbesserung.'
  - 'IPP 8: Anhebung der Schwelle des Abgleichsalgorithmus von 90 auf mindestens 92,5 Prozent — soweit
    ersichtlich die erste behördliche Festlegung eines konkreten Schwellenwerts für ein KI-System in Neuseeland.'
  - 'IPP 9: Nicht getroffene Bilder werden sofort gelöscht, Treffer ohne Massnahme am selben Tag.'
  - 'Auflagen: Beschränkung der Beobachtungsliste auf qualifizierende Delikte, Überprüfung der Hausverbote,
    Aktualisierung der Datenschutzfolgenabschätzung, fortlaufende Systemprüfung.'
  - 'Māori: Keine ethnische Auswertung möglich; das Māori Reference Panel lehnte den Einsatz ab. Der Commissioner
    verwies auf die bekannten höheren Fehlerraten bei dunkleren Hauttönen, konnte sie für diese Population
    aber nicht verifizieren. Genau diese Lücke hat später Eingang in Rule 1 des Biometrics Code gefunden.'
  - 'Ausdrücklicher Vorbehalt: "This report is not a green light for more general use of FRT" — jede Einsatzsituation
    ist gesondert auf Erforderlichkeit, Wirksamkeit und Verhältnismässigkeit zu prüfen.'
