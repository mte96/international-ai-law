- id: nz-contempt-of-court-act-2019
  jurisdiktion: nz
  kurztitel: Contempt of Court Act 2019
  offizieller_titel: Contempt of Court Act 2019
  fundstelle: 2019 No 44; verwaltet vom Ministry of Justice
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Der Supreme Court hat in Jones v Family Court at Whangārei [2026] NZSC
    1 ausdrücklich s. 26 Abs. 2 und Abs. 4 herangezogen, um klarzustellen, dass die Vorlage erfundener
    KI-Fundstellen in schweren Fällen als Kontempt geahndet werden kann.

    '
  kurzbeschreibung: 'Das Gesetz kodifiziert Teile des Kontemptrechts (Veröffentlichungsverbote im Strafverfahren,
    störendes Verhalten, Geschworene, Vollstreckung von Anordnungen, falsche Aussagen über Richter und
    Gerichte) und regelt in s. 26 das Verhältnis zur fortbestehenden inhärenten Zuständigkeit. Nach s.
    26 Abs. 2 lässt das Gesetz jede Befugnis eines Gerichts unberührt, einschliesslich der inhärenten
    Zuständigkeit des High Court, eine Person wegen Kontempts in Fällen zu bestrafen, auf die das Gesetz
    nicht anwendbar ist; nach s. 26 Abs. 4 haben Supreme Court und Court of Appeal dieselben Befugnisse.
    s. 27 begrenzt die Strafe bei Kontempt aus inhärenter Zuständigkeit auf sechs Monate Freiheitsstrafe.
    s. 22 stellt die Veröffentlichung falscher Aussagen über Richter oder Gerichte unter Strafe (Einzelperson
    bis sechs Monate Freiheitsstrafe oder 25.000 NZD; juristische Person bis 100.000 NZD).

    '
  inkrafttreten:
    datum: 2020-08-26
    verifiziert: true
    quelle: https://www.justice.govt.nz/about/news-and-media/media-centre/media-information/media-guide-for-reporting-the-courts-and-tribunals-edition-4-1/media-in-court/4-10-reporting-restrictions/
    fundstelle_norm: 's. 2(1) Contempt of Court Act 2019: ''This Act comes into force on the earlier of
      - (a) a date appointed by the Governor-General by Order in Council; and (b) the date that is 1 year
      after the date on which this Act receives the Royal assent.'' Royal assent 26.08.2019; eine Order
      in Council ist nicht ergangen, sodass s. 2(1)(b) greift. Das Justizministerium bestaetigt: ''The
      Contempt of Court Act 2019 came into effect on 26 August 2020.'''
  anwendungsdaten:
  - datum: 2026-02-11
    was_gilt: Der Supreme Court benennt in Jones v Family Court at Whangārei s. 26 Abs. 2 und Abs. 4 als
      Grundlage einer möglichen Kontemptahndung bei erfundenen KI-Fundstellen.
    verifiziert: true
    quelle: https://www.courtsofnz.govt.nz/assets/cases/2026/2026-NZSC-1.pdf
  themenachsen:
  - berufsrecht
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 's. 26 Abs. 2 (Wortlaut): "Nothing in this Act limits or affects any authority or power of a court,
    including the authority of the High Court under its inherent jurisdiction, to punish any person for
    contempt of court in any circumstances to which this Act does not apply." Das ist die Norm, über die
    KI-Halluzinationen überhaupt erst kontemptfähig werden — das Gesetz selbst kennt keinen einschlägigen
    Tatbestand.'
  - 's. 26 Abs. 4: dieselben Befugnisse für Supreme Court und Court of Appeal.'
  - 's. 27 Abs. 1: Höchststrafe bei Kontempt aus inhärenter Zuständigkeit sechs Monate Freiheitsstrafe.'
  - 's. 22: Straftatbestand für die Veröffentlichung falscher Aussagen über Richter oder Gerichte, wenn
    dadurch das Vertrauen in Unabhängigkeit, Integrität, Unparteilichkeit oder Autorität der Justiz real
    gefährdet wird. Praktisch relevant für KI-erzeugte Falschbehauptungen über Gerichte.'
  dokumente:
  - datum: 2019-11-27
    typ: konsolidiert
    titel: Contempt of Court Act 2019 (konsolidierte Fassung)
    url: https://www.legislation.govt.nz/act/public/2019/0044/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
    verifiziert: true
    notiz: Amtlicher Volltext; Grundlage der Prüfung von ss. 22, 26 und 27.
  offene_punkte:
  - Das genaue Inkrafttretensdatum wurde nicht am Primärdokument geprüft.
  - Ein neuseeländisches Kontemptverfahren wegen KI-erzeugter Fundstellen ist bislang nicht durchgeführt
    worden; Jones enthält nur die Warnung.
  monitoring_quellen:
  - https://www.courtsofnz.govt.nz/judgments/
  bezug_regelwerke:
  - nz-crimes-act-1961
  - nz-courts-genai-guidelines-2023
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die neuseeländische Konstruktion ist elegant und zugleich verräterisch: Weil das
    kodifizierte Kontemptrecht die Vorlage erfundener Fundstellen nicht erfasst, greift der Supreme Court
    über s. 26 Abs. 2 auf die inhärente Zuständigkeit zurück. Genau das ist das Muster des gesamten neuseeländischen
    KI-Rechts: Wo die geschriebene Norm fehlt, wird auf die ungeschriebene Reservekompetenz ausgewichen.
    Das funktioniert im Prozessrecht, weil es die inhärente Zuständigkeit gibt — im Verwaltungsrecht und
    im Urheberrecht gibt es sie nicht.

    '
  pruefvermerk:
  - 'DATUM KORRIGIERT. Eingetragen war 27.11.2019 — dieses Datum laesst sich am Gesetz nicht belegen.
    Das Gesetz ist nach s. 2(1)(b) erst ein Jahr nach der Ausfertigung, also am 26.08.2020 in Kraft getreten;
    die Notes von legislation.govt.nz weisen keine Commencement Order aus. Der 26.08.2019 ist die Ausfertigung.
    Vorher: 2019-11-27.'
- id: nz-crimes-act-1961
  jurisdiktion: nz
  kurztitel: Crimes Act 1961 (KI-relevante Tatbestände)
  offizieller_titel: Crimes Act 1961
  fundstelle: 1961 No 43; verwaltet vom Ministry of Justice
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Strafrecht ohne KI-spezifische Tatbestände. Der Supreme Court hat in Jones
    v Family Court at Whangārei [2026] NZSC 1 die ss. 116 und 117 lit. e als mögliche Grundlage bei der
    Vorlage erfundener KI-Fundstellen benannt. s. 216G (Begriff der intimate visual recording) soll durch
    den Deepfake Digital Harm and Exploitation Bill auf synthetische Darstellungen erstreckt werden.

    '
  kurzbeschreibung: 'Für KI einschlägig sind vor allem drei Normkomplexe. s. 116 stellt die Verabredung
    zur Behinderung, Verhinderung, Verkehrung oder Vereitelung des Laufs der Rechtspflege unter Strafe
    (bis sieben Jahre Freiheitsstrafe); s. 117 erfasst die Beeinflussung von Geschworenen und Zeugen sowie
    in lit. e weitere Handlungen zur Vereitelung der Rechtspflege (bis sieben Jahre). ss. 216G bis 216N
    regeln intime Bildaufnahmen; s. 216G definiert die "intimate visual recording", ss. 216H bis 216J
    stellen Herstellung, Besitz und Veröffentlichung unter Strafe. Diese Vorschriften greifen derzeit
    nur bei Aufnahmen realer Vorgänge; synthetische Darstellungen sind nicht erfasst — die Lücke, die
    der Gesetzentwurf 213-1 schliessen soll.

    '
  inkrafttreten:
    datum: 1962-01-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1961/0043/latest/whole.html
    fundstelle_norm: 's. 1(2) Crimes Act 1961: ''This Act shall come into force on 1 January 1962.'' Kopfzeile:
      ''Date of assent 1 November 1961 — Commencement see section 1(2)'''
  anwendungsdaten:
  - datum: 2026-02-11
    was_gilt: Der Supreme Court benennt ss. 116 und 117 lit. e als mögliche Grundlage bei der Vorlage
      erfundener KI-Fundstellen durch eine Partei.
    verifiziert: true
    quelle: https://www.courtsofnz.govt.nz/assets/cases/2026/2026-NZSC-1.pdf
  themenachsen:
  - berufsrecht
  - content
  - grundrechte
  regelungsschwerpunkte:
  - 's. 116 (Wortlaut): "Every one is liable to imprisonment for a term not exceeding 7 years who conspires
    to obstruct, prevent, pervert, or defeat the course of justice in New Zealand or the course of justice
    in an overseas jurisdiction."'
  - 's. 117 (Wortlaut Einleitung): "Every one is liable to imprisonment for a term not exceeding 7 years
    who — ..."; lit. e ist der Auffangtatbestand, auf den sich der Supreme Court in Jones bezieht.'
  - 's. 216G: Begriff der "intimate visual recording" für die ss. 216H bis 216N. Erfasst derzeit nur Aufnahmen
    tatsächlicher Vorgänge; der Gesetzentwurf 213-1 will einen Abs. 1A einfügen, der auch "created, synthesised,
    or altered" Darstellungen erfasst.'
  - 'KEIN KI-spezifischer Tatbestand: Weder Deepfakes noch KI-gestützter Betrug noch die Manipulation
    von Beweismitteln durch generative Systeme sind eigens geregelt.'
  dokumente:
  - datum: 2026-09-06
    typ: konsolidiert
    titel: Crimes Act 1961 (konsolidierte Fassung)
    url: https://www.legislation.govt.nz/act/public/1961/0043/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
    verifiziert: true
    notiz: Amtlicher Volltext; Grundlage der Prüfung von ss. 116, 117 und 216G.
  offene_punkte:
  - Ein Strafverfahren wegen KI-erzeugter Falschangaben gegenüber einem neuseeländischen Gericht ist bislang
    nicht bekannt geworden.
  - Die Reichweite des s. 117 lit. e auf fahrlässig eingereichte Halluzinationen ist ungeklärt; der Supreme
    Court hat sie nur für "schwerwiegende Fälle" angedeutet.
  monitoring_quellen:
  - https://www.legislation.govt.nz/act/public/1961/0043/latest/whole.html
  bezug_regelwerke:
  - nz-contempt-of-court-act-2019
  - nz-harmful-digital-communications-act-2015
  - nz-deepfake-bill-2025
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die Heranziehung der ss. 116 und 117 durch den Supreme Court ist die schärfste Aussage
    eines obersten Gerichts im Commonwealth zu KI-Fundstellen. Sie ist zugleich rechtsdogmatisch heikel:
    Beide Vorschriften setzen Vorsatz voraus — s. 116 sogar eine Verabredung. Wer aus Unkenntnis eine
    halluzinierte Fundstelle einreicht, erfüllt sie nicht. Die praktische Wirkung liegt deshalb weniger
    in der Strafbarkeit als in der Warnung; das sollte man beim Zitieren nicht verwischen.

    '
  pruefvermerk:
  - Bestaetigt. Ausfertigung 01.11.1961, Inkrafttreten 01.01.1962. Das Gesetz gilt fort; die Deepfake-relevanten
    ss. 216G-216N (intimate visual recording) sollen durch den Deepfake Digital Harm and Exploitation
    Bill geaendert werden, der bis 06.09.2026 nicht Gesetz ist.
- id: nz-fair-trading-act-1986
  jurisdiktion: nz
  kurztitel: Fair Trading Act 1986
  offizieller_titel: Fair Trading Act 1986
  fundstelle: 1986 No 121; durchgesetzt von der Commerce Commission (Te Komihana Tauhokohoko)
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Die Regierung nennt den Verbraucherschutz ausdrücklich als einen der
    drei Rahmen, die KI-Risiken abdecken sollen. Das Gesetz enthält keine KI-spezifische Vorschrift; die
    Wörter "artificial intelligence" und "algorithm" kommen darin nicht vor (Volltextprüfung am 06.09.2026).

    '
  kurzbeschreibung: 'Das Gesetz verbietet irreführendes und täuschendes Verhalten im geschäftlichen Verkehr.
    s. 9 lautet: "No person shall, in trade, engage in conduct that is misleading or deceptive or is likely
    to mislead or deceive" — das neuseeländische Gegenstück zu s. 18 des australischen Australian Consumer
    Law und historisch aus s. 52 Trade Practices Act 1974 (Australien) übernommen. ss. 10 und 11 verbieten
    irreführendes Verhalten in Bezug auf Waren und Dienstleistungen; s. 13 verbietet in einem detaillierten
    Katalog falsche oder irreführende Angaben über Art, Standard, Qualität, Güte, Menge, Zusammensetzung,
    Herkunft, Vorgeschichte und Eigenschaften. Anwendungsfälle im KI-Kontext sind übertriebene Leistungsversprechen
    für KI-Produkte ("AI washing"), nicht offengelegte synthetische Werbeinhalte und irreführende Angaben
    über die Genauigkeit von Modellen. Durchgesetzt wird das Gesetz durch die Commerce Commission sowie
    durch Privatklagen.

    '
  inkrafttreten:
    datum: 1987-03-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1986/0121/latest/whole.html
    fundstelle_norm: 's. 1(2) Fair Trading Act 1986: ''Except as provided in section 49(3), this Act shall
      come into force on 1 March 1987.'' Kopfzeile: ''Date of assent 17 December 1986'''
  anwendungsdaten: []
  themenachsen:
  - content
  - wettbewerb
  - haftung
  - vertrag
  regelungsschwerpunkte:
  - 's. 9 (Wortlaut): "No person shall, in trade, engage in conduct that is misleading or deceptive or
    is likely to mislead or deceive." Kein Verschuldenserfordernis, kein Vorsatz — deshalb der praktisch
    wichtigste Hebel gegen übertriebene KI-Werbung.'
  - 's. 10: irreführendes Verhalten in Bezug auf Waren (Art, Herstellungsverfahren, Eigenschaften, Eignung,
    Menge).'
  - 's. 11: irreführendes Verhalten in Bezug auf Dienstleistungen.'
  - 's. 13: Katalog falscher oder irreführender Angaben, u.a. zu Art, Standard, Qualität, Güte, Zusammensetzung,
    Vorgeschichte und zur Person des Erbringers — einschlägig, wenn ein Dienst als menschlich erbracht
    dargestellt wird, obwohl er automatisiert ist.'
  - 'NEGATIVBEFUND: Weder "artificial intelligence" noch "algorithm" kommen im Gesetz vor. Eine Kennzeichnungspflicht
    für KI-erzeugte Inhalte, wie sie Art. 50 KI-VO vorsieht, existiert in Neuseeland nicht. Ob unterlassene
    Kennzeichnung "misleading" im Sinne des s. 9 ist, hat kein neuseeländisches Gericht entschieden.'
  dokumente:
  - datum: 2026-09-06
    typ: konsolidiert
    titel: Fair Trading Act 1986 (konsolidierte Fassung)
    url: https://www.legislation.govt.nz/act/public/1986/0121/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
    verifiziert: true
    notiz: Amtlicher Volltext; Grundlage der Prüfung von ss. 9, 10, 11, 13 und der Negativkontrolle.
  offene_punkte:
  - Eine Verlautbarung der Commerce Commission zu KI-Werbung ("AI washing") wurde nicht aufgefunden.
  - Ob eine unterlassene Kennzeichnung KI-erzeugter Inhalte s. 9 verletzt, ist ungeklärt.
  monitoring_quellen:
  - https://comcom.govt.nz/
  bezug_regelwerke:
  - nz-consumer-guarantees-act-1993
  - nz-ki-strategie-2025
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 's. 9 ist die einzige neuseeländische Norm, die ohne Änderung auf KI-Werbung passt,
    und sie ist scharf: kein Verschulden, weite Auslegung, Klagebefugnis auch für Mitbewerber. Wenn die
    Regierung sagt, der Verbraucherschutz decke KI-Risiken ab, meint sie im Kern diese Vorschrift. Sie
    deckt jedoch nur die Aussage über das Produkt, nicht das Produkt selbst — ein KI-System darf in Neuseeland
    schlecht sein, es darf nur nicht falsch beworben werden.

    '
  pruefvermerk:
  - Bestaetigt. Ausfertigung 17.12.1986, Inkrafttreten 01.03.1987.
- id: nz-consumer-guarantees-act-1993
  jurisdiktion: nz
  kurztitel: Consumer Guarantees Act 1993
  offizieller_titel: Consumer Guarantees Act 1993
  fundstelle: 1993 No 91
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Geltendes Recht. Es begründet gesetzliche Garantien für Waren und Dienstleistungen gegenüber
    Verbrauchern, die vertraglich nicht abbedungen werden können. KI-spezifische Vorschriften enthält
    es nicht. Das Gesetz wurde in dieser Recherche nicht am Volltext geprüft.

    '
  kurzbeschreibung: 'Das Gesetz gewährt Verbrauchern gesetzliche Garantien, unter anderem für annehmbare
    Qualität von Waren und für die Erbringung von Dienstleistungen mit angemessener Sorgfalt und Sachkunde.
    Für KI ist es dort einschlägig, wo ein KI-gestützter Dienst an Verbraucher erbracht wird: Fehlerhafte
    Ausgaben können einen Verstoss gegen die Sorgfaltsgarantie begründen. Rechtsprechung dazu gibt es
    in Neuseeland nicht.

    '
  inkrafttreten:
    datum: 1994-04-01
    verifiziert: true
    quelle: https://www.legislation.govt.nz/act/public/1993/0091/latest/whole.html
    fundstelle_norm: 's. 1(2) Consumer Guarantees Act 1993: ''This Act shall come into force on 1 April
      1994.'' Kopfzeile: ''Date of assent 20 August 1993'''
  anwendungsdaten: []
  themenachsen:
  - haftung
  - vertrag
  regelungsschwerpunkte:
  - Gesetzliche, nicht abdingbare Garantien für Waren und Dienstleistungen gegenüber Verbrauchern.
  - Für KI relevant ist die Garantie der Erbringung mit angemessener Sorgfalt und Sachkunde; sie erfasst
    KI-gestützte Beratungs- und Analysedienste.
  - Keine Regelung zur Zurechnung von Fehlern autonom arbeitender Systeme.
  dokumente:
  - datum: 2026-09-06
    typ: konsolidiert
    titel: Consumer Guarantees Act 1993 (konsolidierte Fassung)
    url: https://www.legislation.govt.nz/act/public/1993/0091/latest/whole.html
    sprache: en
    urheber: Parliamentary Counsel Office
