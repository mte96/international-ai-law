  regelungsschwerpunkte:
  - 'Empfehlung 2 (der Kernsatz): "a proportionate and risk-based approach to AI regulation where needed,
    using agile approaches, and leveraging existing mechanisms in preference to developing a standalone
    AI Act". Das ist die neuseeländische Gegenposition zum Brüsseler Modell — nicht als Ablehnung von
    Regulierung formuliert, sondern als Rangfolge: vorhandene Mechanismen zuerst.'
  - 'Beschränkung auf "acute risks": Neue Regulierung soll nur dort ansetzen, wo ein akutes Risiko festgestellt
    ist. Ein Auffangtatbestand für diffuse oder erst künftige Risiken fehlt bewusst.'
  - 'Ressortübergreifendes Arbeitsprogramm: Zulieferungen der Ressorts an MBIE bis Ende August 2024; Rückberichterstattung
    der Ministerin mit einem integrierten Arbeitsprogramm im September 2024; Fortschrittsprüfung Mitte
    2025.'
  - 'Institutionell: Keine KI-Behörde, keine KI-Aufsicht, kein Register. Zuständig bleiben die Fachressorts
    und die vorhandenen Aufsichten (Privacy Commissioner, Commerce Commission, Human Rights Commission,
    FMA, RBNZ).'
