- id: il-reg-4255-2026
  jurisdiktion: il
  kurztitel: Regierungsbeschluss 4255/2026 — Nationales KI-Programm
  offizieller_titel: האצת בינה מלאכותית בישראל וביסוס מובילות עולמית — עקרונות אסטרטגיים וכיווני פעולה
    ותיקון החלטת ממשלה — Haatzat bina melachutit be-Israel u-vissus movilut olamit (Beschleunigung der
    kuenstlichen Intelligenz in Israel und Begruendung weltweiter Fuehrerschaft — strategische Grundsaetze
    und Handlungsrichtungen sowie Aenderung eines Regierungsbeschlusses)
  fundstelle: החלטת ממשלה מס' 4255 מיום 16.06.2026 (Regierungsbeschluss Nr. 4255 vom 16.06.2026), 37.
    Regierung
  verfahrensnummer: '4255'
  status: anwendbar
  status_detail: 'Am 16.06.2026 von der Regierung auf Vorschlag des Ministerpraesidenten angenommen; erarbeitet
    vom Nationalen KI-Stab im Amt des Ministerpraesidenten. Die Umsetzung hat am 04.08.2026 begonnen:
    Der Sonderausschuss fuer Ausschreibungen bei der Generalrechnungsfuehrerin des Finanzministeriums
    hat die ersten drei Verfahren freigegeben (Ausschreibung "Projekt Nexus" fuer eine nationale Quantenrechenplattform
    sowie zwei Informationsabfragen zu Physical-AI-Infrastruktur und zu Basismodellen).'
  kurzbeschreibung: 'Der Beschluss ist Israels Antwort auf die Frage, wie ein Staat KI regelt, der kein
    KI-Gesetz will: durch Industriepolitik statt durch Marktzugangsrecht. Er setzt acht Handlungsstraenge
    — souveraene Recheninfrastruktur mit dem Ziel von 100.000 Prozessoreinheiten fuer israelische Anwendungen,
    ein nationaler Quantenrechner moeglichst aus israelischer Entwicklung, internationale Allianzen, Humankapital
    und Ausbildung, ein nationaler Mechanismus fuer die Folgen im Arbeitsmarkt, ein Nationales KI-Institut
    samt "Beschleunigungsreaktoren", ein nationaler Schwerpunkt auf Cyber AI, Physical AI und der Abwehr
    von Deepfake-Bedrohungen sowie der Einsatz von KI in der Buergerdienstleistung. Sanktionen und Pflichten
    fuer Private enthaelt der Beschluss nicht; er bindet die Verwaltung. Rechtlich bedeutsam ist er als
    Umschlagpunkt: Der einzige Strang mit unmittelbar rechtlichem Bezug ist die Deepfake-Abwehr — und
    die wurde vier Wochen spaeter tatsaechlich Gesetz, im Wahlrecht.'
