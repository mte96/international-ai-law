  pruefvermerk:
  - 'DATUM KORRIGIERT. Eingetragen war 01.01.1959 — ein Platzhalter (1. Januar des Jahres), kein Inkrafttreten.
    § 21 des Gesetzes stellt auf den Tag der Annahme in der Knesset ab; das ist nach dem amtlichen Schlussvermerk
    der 06.07.1959. Zusaetzlich korrigiert: Die KI-Kennzeichnungspflicht des § 2א2 gilt NICHT seit dem
    16.07.2026 — der 16.07.2026 ist nur der Tag der Annahme des Aenderungsgesetzes in der Knesset (ס"ח
    תשפ"ו, 762) und damit ein Vorakt. § 12 des Aenderungsgesetzes setzt die befristete Vorschrift ausdruecklich
    vom 23.07.2026 bis 26.10.2027 in Kraft; die Ausfuehrungsregeln des Wahlkommissionsvorsitzenden gelten
    ab 26.07.2026. status_detail des Eintrags ist entsprechend zu berichtigen. Vorher: 1959-01-01.'
- id: il-wahl-deepfake-regeln-2026
  jurisdiktion: il
  kurztitel: Deepfake-Kennzeichnungsregeln des Wahlausschussvorsitzenden 2026
  offizieller_titel: כללי הבחירות (דרכי תעמולה)(עמידה בחובת הגילוי לגבי תעמולת בחירות שהיא נחזות עמוקה),
    התשפ"ו-2026 — Klalei ha-bechirot (darchei taamula)(amida be-chovat ha-giluy legabei taamulat bechirot
    she-hi nechzut amuka), ha-tashpav-2026 (Wahlregeln — Erfuellung der Offenlegungspflicht bei Wahlwerbung,
    die eine tiefe Scheinbarkeit ist)
  fundstelle: רשומות, ילקוט הפרסומים Nr. 12484; erlassen am 26.07.2026 (י"ב באב התשפ"ו)
  verfahrensnummer: null
  status: anwendbar
  status_detail: Erlassen am 26.07.2026 von Noam Sohlberg, Vizepraesident des Obersten Gerichtshofs und
    Vorsitzender des Zentralen Wahlausschusses fuer die 26. Knesset, auf Grundlage des § 2א2(b) des Wahlgesetzes
    (Wahlwerbung) 5719-1959. Gilt fuer Inhalte, die ab dem Stichtag erstmals verbreitet werden; auf vor
    dem Stichtag veroeffentlichte Wahlwerbung findet die Pflicht keine Anwendung.
  kurzbeschreibung: 'Die Regeln bestimmen, wie die gesetzliche Offenlegungspflicht bei Deepfake-Wahlwerbung
    praktisch zu erfuellen ist. Zulaessig sind zwei Formen: ein Texthinweis, wonach der Inhalt mit einem
    digitalen Mittel erzeugt und nicht im Original aufgezeichnet beziehungsweise wesentlich digital bearbeitet
    wurde, oder ein KI-Logo mit der Kennzeichnung "AI" nebst dem Satz "התוכן נוצר באמצעי דיגיטלי ולא תועד
    במקור" (der Inhalt wurde mit einem digitalen Mittel erzeugt und nicht im Original aufgezeichnet) oder
    einer entsprechenden Fassung fuer bearbeitete Inhalte. Die Formvorgaben sind ungewoehnlich konkret:
    klarer Hintergrund, kontrastreiche Farbe, auffaellige Platzierung, lesbare und nicht gestauchte Schrift,
    gleiche Sprache wie der Inhalt; bei Bild und Druck mindestens fuenf Prozent der Inhaltshoehe beziehungsweise
    zehn Punkt, je nachdem was groesser ist; bei Video durchgehend waehrend der gesamten Laufzeit und
    mindestens fuenf Prozent der Bildhoehe; bei Ton am Anfang und am Ende der Aufnahme in gleicher Lautstaerke
    und Geschwindigkeit wie der uebrige Inhalt. Damit hat Israel — anders als der Kennzeichnungsartikel
    50 der KI-Verordnung, der die Form offenlaesst — quantitative Formvorgaben fuer die Kennzeichnung
    synthetischer Inhalte in Kraft.'
