  - Die Sanktion ist unklar. Der Verkuendungstext enthaelt in § 2א2 selbst keine Strafdrohung; ob und
    wie § 17 des Wahlwerbegesetzes (Straftatbestaende) oder die Befugnisse des Wahlausschussvorsitzenden
    greifen, ist am Gesetzestext nicht geprueft. Die Presse berichtet lediglich, ein Verstoss koenne als
    Gesetzesverstoss gewertet werden und die Verantwortung treffe den Veroeffentlichenden.
  - 'Widerspruch zum Beginn der Pflicht: Aus dem Gesetzeswortlaut ergibt sich der 23.07.2026 (eine Woche
    nach Verkuendung). Mehrere Medien nennen den 26.07.2026 — den Tag der Ausfuehrungsregeln — als Beginn
    der Kennzeichnungspflicht. Der Widerspruch ist nicht aufgeloest; wahrscheinlich ist die Pflicht am
    23.07. entstanden und ab dem 26.07. in der Form der Regeln zu erfuellen.'
  - Ob die befristete Vorschrift nach Ablauf verlaengert oder in Dauerrecht ueberfuehrt wird, ist offen.
    Vier private Gesetzentwuerfe zu Deepfake-Straftatbestaenden liegen seit 2025 vor, keiner ist verabschiedet.
