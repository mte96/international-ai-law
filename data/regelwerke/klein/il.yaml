  jurisdiktion: il
  kurztitel: Entwurf eines Aussenhandels- und Dual-Use-Kontrollgesetzes 2026
  offizieller_titel: 'תזכיר חוק להסדרת הסחר החוץ: פיקוח על יצוא דו-שימושי אזרחי ויצוא בתחומי כימיה, ביולוגיה,
    רדיולוגיה וגרעין, התשפ"ו-2026 — Gesetzesentwurf (Memorandum) zur Regelung des Aussenhandels: Kontrolle
    des zivilen Dual-Use-Exports und der Ausfuhr im Bereich Chemie, Biologie, Radiologie und Nuklearmaterial'
  fundstelle: תזכיר חוק (Gesetzesmemorandum) des Wirtschafts- und Industrieministeriums, Abteilung Kontrolle
    des Dual-Use-Exports, veroeffentlicht am 26.03.2026 zur oeffentlichen Anhoerung; Frist bis 25.04.2026
  verfahrensnummer: null
  status: entwurf
  status_detail: Gesetzesmemorandum im Anhoerungsverfahren; die Anhoerungsfrist endete am 25.04.2026.
    Ein Regierungsentwurf ist bis September 2026 nicht in der Knesset eingebracht. Wegen der Aufloesung
    der 25. Knesset vor der Wahl vom 27.10.2026 ist mit einer Verabschiedung in dieser Legislaturperiode
    nicht mehr zu rechnen.
  kurzbeschreibung: Der Entwurf ist Israels bislang einziger Anlauf, den Export fortgeschrittener Technologie
    mit Dual-Use-Charakter auf eine eigene gesetzliche Grundlage zu stellen statt auf Anordnungen nach
    der Kontrolle-von-Waren-und-Diensten-Ordnung. Vorgesehen sind Genehmigungspflichten fuer Vermittlung,
    Durchfuhr und technische Unterstuetzung, ein Auffangtatbestand ("catch-all") fuer nicht gelistete
    Gueter bei Verdacht auf Massenvernichtungswaffen, Sanktionsumgehung oder terroristische Verwendung
    sowie verwaltungs- und strafrechtliche Sanktionen einschliesslich persoenlicher Verantwortlichkeit
    von Organen. KI wird im Entwurf nicht ausdruecklich als eigene Kontrollkategorie genannt; ueber den
    Auffangtatbestand und ueber die Wassenaar-Listen koennen fortgeschrittene Rechenleistung, Modelle
    und zugehoerige Software jedoch erfasst werden. Das ist der Punkt, an dem israelisches KI-Recht mit
    der amerikanischen Exportkontrolle fuer Rechenbeschleuniger zusammentrifft.
