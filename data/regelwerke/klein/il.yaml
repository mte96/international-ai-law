- id: il-finanzsektor-taskforce
  jurisdiktion: il
  kurztitel: Ressortuebergreifendes Team KI im Finanzsektor (Zwischen- und Abschlussbericht)
  offizieller_titel: בינה מלאכותית בסקטור הפיננסי — Bina melachutit ba-sector ha-financi / "AI in the
    Financial Sector — Israel's Interagency Taskforce on AI in Finance"
  fundstelle: Zwischenbericht zur oeffentlichen Anhoerung Oktober 2024 (Anhoerungsfrist bis 15.12.2024);
    Abschlussbericht Dezember 2025, englische Fassung Mai 2026
  verfahrensnummer: null
  status: softlaw
  status_detail: Der Abschlussbericht liegt seit Dezember 2025 vor. Er empfiehlt ausdruecklich KEINE bindende
    KI-Regulierung fuer den Finanzsektor, sondern flexible, prinzipienbasierte Instrumente, die bei Bedarf
    schrittweise ergaenzt werden. Bindende Rechtsakte sind nicht angekuendigt; benannt sind Auslegungspapiere,
    Vorabauskuenfte, Frage-und-Antwort-Veroeffentlichungen, Regulierungssandkaesten und Innovationszentren.
  kurzbeschreibung: 'Das Team aus Justizministerium, Finanzministerium, Bankenaufsicht, Kapitalmarkt-,
    Versicherungs- und Sparaufsicht, Wertpapieraufsicht und Wettbewerbsbehoerde ist die genaueste Ausformulierung
    der israelischen Regulierungsphilosophie, die es gibt — genauer als das Grundsatzdokument von 2023.
    Neun Leitgrundsaetze: flexible und anpassungsfaehige Regulierung; Anschluss an internationale Rahmenwerke;
    Innovationsfoerderung; Erprobungsinstrumente; neue Massnahmen nur, wo die Umstaende es rechtfertigen;
    Risikobasierung; Verbraucherschutz und Menschenrechte; Einheitlichkeit fuer gleichartige Dienste und
    Risiken; Technologieneutralitaet. Materiell schlaegt der Bericht eine zweistufige Risikoklassifizierung
    vor (niedrig bis mittel, hoch), bei der die beaufsichtigte Stelle zunaechst selbst einstuft und die
    Aufsicht umstufen kann. Erklaerbarkeit wird nur fuer hochriskante Systeme mit wesentlicher Kundenwirkung
    und nur fuer nachteilige Entscheidungen verlangt; kompensierende Massnahmen koennen sie ersetzen.
    Menschliche Beteiligung in Echtzeit ist nur verlangt, wenn die Entscheidung wesentlich, hochriskant,
    technologiegetragen ist UND keine angemessene Alternative besteht — pauschale Anforderungen werden
    als Marktzutrittsschranke ausdruecklich abgelehnt. Die Haftung gegenueber dem Kunden bleibt bei der
    beaufsichtigten Stelle; der Einsatz eines KI-Systems wird wie Auslagerung behandelt, Haftungsbeschraenkungen
    gegenueber Kunden sind untersagt.'
