regelwerke:
- id: il-ki-politik-2023
  jurisdiktion: il
  kurztitel: Israelische KI-Politik 2023 (Grundsatzdokument)
  offizieller_titel: 'עקרונות מדיניות, רגולציה ואתיקה בתחום הבינה המלאכותית — Ikronot mediniut, regulatsia
    ve-etika be-tchum ha-bina ha-melachutit / "Israel''s Policy on Artificial Intelligence Regulation
    and Ethics" (Untertitel der englischen Fassung: "Responsible Innovation")'
  fundstelle: Regierungsdokument ohne Gesetzblattfundstelle; herausgegeben vom משרד החדשנות, המדע והטכנולוגיה
    (Ministerium fuer Innovation, Wissenschaft und Technologie) gemeinsam mit dem משרד המשפטים, ייעוץ
    וחקיקה (Justizministerium, Abteilung Beratung und Gesetzgebung), Jerusalem, 14.12.2023; veroeffentlicht
    am 18.12.2023
  verfahrensnummer: null
  status: softlaw
  status_detail: 'Nach wie vor das massgebliche Grundsatzdokument der israelischen KI-Regulierung und
    bis heute nicht durch ein Gesetz abgeloest. Seine institutionelle Traegerschaft hat sich jedoch verschoben:
    Mit Regierungsbeschluss 3375 vom 21.09.2025 wurde das Handlungsfeld "Politik und Regulierung der kuenstlichen
    Intelligenz" vom Innovationsministerium in das Amt des Ministerpraesidenten verlagert. Die zentrale
    institutionelle Empfehlung des Dokuments — ein staatliches KI-Wissens- und Koordinierungszentrum —
    wurde in der urspruenglich vorgesehenen Form nie umgesetzt; der Staatskontrolleur hat das im November
    2024 ausdruecklich geruegt.'
  kurzbeschreibung: 'Das Dokument ist Israels bewusste Absage an ein Horizontalgesetz nach europaeischem
    Muster. Es empfiehlt der Regierung, KI nicht durch ein uebergreifendes Gesetz, sondern durch die vorhandenen
    Fachaufsichten sektoral zu regeln, sich dabei an den OECD-KI-Grundsaetzen zu orientieren, risikobasiert
    vorzugehen, Regulierungsexperimente (Sandkaesten) zu nutzen und vorrangig weiche Instrumente einzusetzen
    — nicht bindende ethische Grundsaetze, Standards und Empfehlungen zur freiwilligen Uebernahme. Es
    benennt sieben Problemfelder (Diskriminierung, menschliche Beteiligung, Erklaerbarkeit, Offenlegung
    der KI-Interaktion, Verlaesslichkeit und Sicherheit, Verantwortlichkeit und Haftung, Privatheit) und
    spricht sieben Empfehlungen aus. Sanktionen enthaelt es keine: Es ist kein Rechtsakt, sondern eine
    Regierungsposition. Seine praktische Wirkung liegt darin, dass die israelischen Fachaufsichten — Bankenaufsicht,
    Wertpapieraufsicht, Kapitalmarktaufsicht, Gesundheitsministerium, Datenschutzbehoerde — ihre KI-Arbeit
    ausdruecklich darauf stuetzen.'
