  regelungsschwerpunkte:
  - 'Zwei zulaessige Offenlegungsformen: Texthinweis oder KI-Logo mit der Kennzeichnung "AI" nebst erlaeuterndem
    Satz.'
  - 'Formvorgaben (Regel 3): klarer Hintergrund, kontrastreiche Farbe, auffaellige Platzierung, lesbare
    und klare, nicht gestauchte Schrift in einem der Groesse und dem Hintergrund angemessenen Verhaeltnis,
    in derselben Sprache wie der Inhalt der Wahlwerbung.'
  - 'Bild und Druck: Groesse der Kennzeichnung mindestens fuenf Prozent der Hoehe des Inhalts oder zehn
    Punkt, je nachdem was groesser ist.'
  - 'Video: Offenlegung waehrend der gesamten Laufzeit sichtbar, mindestens fuenf Prozent der Bildhoehe
    beziehungsweise -breite.'
  - 'Ton: Offenlegung am Anfang und am Ende der Aufnahme, in Lautstaerke und Sprechgeschwindigkeit dem
    uebrigen Inhalt entsprechend.'
  - 'Zeitliche Anwendung: nur auf Inhalte, die ab dem Stichtag erstmals verbreitet werden.'
