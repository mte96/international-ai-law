  - datum: 2026-05-17
    was_gilt: 'Die Bankenaufsicht veroeffentlicht Ergebnisse einer Erhebung zur Reife der KI-Governance
      in den Bankinstituten: breite Governance-Rahmen vorhanden, aber Luecken auf uebergreifender Ebene,
      die bei zunehmendem Einsatz zu beruecksichtigen sind.'
    verifiziert: true
    quelle: https://boi.org.il/publications/pressreleases/17-5-26/
  themenachsen:
  - sektor-finanz
  - governance
  - grundrechte
  - haftung
  regelungsschwerpunkte:
  - '§ 5: ausdrueckliche Erstreckung der gesamten Richtlinie auf Modelle, die kuenstliche Intelligenz
    einsetzen oder auf ihr beruhen. Das ist der technisch eleganteste Weg, KI zu regeln, ohne KI zu definieren:
    Wer ein Modell einsetzt, unterliegt dem Modellrisikoregime, gleich ob es sich um eine Regression oder
    um ein neuronales Netz handelt.'
  - 'Anforderungen fuer KI-Modelle: Fairness und Vermeidung unbeabsichtigter Verzerrung und Diskriminierung;
    an die Lernmechanik angepasste Verantwortlichkeit mit menschlicher Aufsicht; Gestaltung von Kontrollen
    fuer KI-gestuetzte Entscheidungsfindung; Transparenz und Erklaerbarkeit der Ergebnisse mit umfassender
    Dokumentation.'
  - Eigener Anhang mit Umsetzungsbeispielen fuer die Governance von KI-Modellen.
  - 'Governance: Verantwortung des Verwaltungsrats fuer den Modellrisikorahmen; unabhaengige Validierung;
    Bestandsverzeichnis aller Modelle.'
  - 'Vergleichspunkt: Waehrend die KI-Verordnung Kreditwuerdigkeitspruefung ueber Anhang III als Hochrisiko
    einstuft und ein eigenes Konformitaetsregime aufsetzt, erreicht Israel dasselbe Ergebnis durch Erweiterung
    einer bestehenden Aufsichtsrichtlinie um einen einzigen Satz.'
