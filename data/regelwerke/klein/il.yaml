- id: il-wahlgesetz-26-2026
  jurisdiktion: il
  kurztitel: Wahlgesetz zur 26. Knesset 2026 (Deepfake-Offenlegungspflicht)
  offizieller_titel: חוק הבחירות לכנסת העשרים ושש (הוראות מיוחדות ותיקוני חקיקה), התשפ"ו-2026 — Chok ha-bechirot
    la-Knesset ha-esrim ve-shesh (horaot meyuchadot ve-tikkunei chakika), ha-tashpav-2026 (Gesetz ueber
    die Wahlen zur sechsundzwanzigsten Knesset — Sondervorschriften und Gesetzesaenderungen)
  fundstelle: 'ספר החוקים (Sefer ha-Chukkim) Nr. 3546 vom 16.07.2026, ב'' באב התשפ"ו, S. 762 ff.; die
    Deepfake-Vorschrift auf S. 768 f. Erste Lesung: הצעות חוק הכנסת Nr. 1209 vom 06.07.2026, S. 302'
  verfahrensnummer: Ausschussentwurf der 25. Knesset, Verfassungs-, Rechts- und Justizausschuss; angenommen
    in dritter Lesung, Wirksamkeitsbeginn 16.07.2026
  status: anwendbar
  status_detail: In Kraft seit dem 16.07.2026. Die Deepfake-Offenlegungspflicht ist als הוראת שעה (befristete
    Vorschrift) ausgestaltet und gilt vom siebten Tag nach Verkuendung — also ab dem 23.07.2026 — bis
    zum Ablauf eines Jahres nach dem Wahltag der 26. Knesset. Die Wahl ist auf den 27.10.2026 terminiert;
    die Vorschrift laeuft danach voraussichtlich am 27.10.2027 aus. Die Ausfuehrungsregeln des Vorsitzenden
    des Zentralen Wahlausschusses datieren vom 26.07.2026.
  kurzbeschreibung: 'Israel hat Deepfakes nicht in einem KI-Gesetz und nicht im Strafgesetzbuch geregelt,
    sondern im Wahlrecht — und dort technologieneutral. Das Sammelgesetz zur Wahl der 26. Knesset fuegt
    in das Wahlgesetz (Wahlwerbung) von 1959 einen neuen § 2א2 ein. Danach hat, wer Wahlwerbung veroeffentlicht,
    die eine נחזות עמוקה ("nechzut amuka", tiefe Scheinbarkeit — die hebraeische Praegung fuer Deepfake)
    ist, ihr eine klare und deutliche Offenlegung beizufuegen, die besagt, dass der Inhalt nicht im Original
    aufgezeichnet wurde. Die Legaldefinition knuepft nicht an KI an, sondern an das digitale Mittel: "אמצעי
    דיגיטלי" ist Software im Sinne des Computergesetzes von 1995, EINSCHLIESSLICH kuenstlicher Intelligenz,
    die Informationen oder Inhalte erzeugen, bearbeiten oder veraendern kann; "נחזות עמוקה" ist visueller
    oder akustischer Inhalt mit einer Person, einem Ort, einem Ereignis, einem Dokument oder einem anderen
    Gegenstand, die als im Original aufgezeichnet erscheinen koennen, tatsaechlich aber mit einem digitalen
    Mittel erzeugt oder damit wesentlich veraendert wurden. Der Gesetzgeber hat damit die Definitionsprobleme
    des KI-Begriffs vollstaendig umgangen. Daneben enthaelt das Gesetz Sondervorschriften fuer die Stimmabgabe
    evakuierter Einwohner, Sonderbefugnisse des Wahlausschussvorsitzenden fuer den Notstand sowie Daueraenderungen,
    darunter die Ausdehnung der Transparenzpflicht ueber die Identitaet des Werbenden auf die Zeit ausserhalb
    des Wahlkampfs.'
  inkrafttreten:
    datum: 2026-07-16
    verifiziert: true
    quelle: https://main.knesset.gov.il/APPS/legislation/main/bills/2244462
  anwendungsdaten:
  - datum: 2026-06-22
    was_gilt: Beginn der Beratungen im Verfassungs-, Rechts- und Justizausschuss zur Vorbereitung der
      ersten Lesung (weitere Sitzungen am 28.06., 29.06., 30.06., 01.07. und 06.07.2026; am 29.06.2026
      lag dem Ausschuss eine eigene Praesentation des Forschungs- und Informationszentrums der Knesset
      zur kuenstlichen Intelligenz vor).
