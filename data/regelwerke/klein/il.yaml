- id: il-boi-nbt-369
  jurisdiktion: il
  kurztitel: Bankenaufsichtsrichtlinie 369 — Modellrisikomanagement
  offizieller_titel: 'הוראת ניהול בנקאי תקין מס'' 369: ניהול סיכוני מודלים — Horaat nihul bankai takin
    mis. 369: nihul sikunei modelim (Richtlinie ueber ordnungsgemaesse Bankfuehrung Nr. 369: Management
    von Modellrisiken)'
  fundstelle: Rundschreiben der Bankenaufsicht der Bank von Israel vom 21.08.2024 (h2792)
  verfahrensnummer: '369'
  status: anwendbar
  status_detail: Erlassen am 21.08.2024, anwendbar ein Jahr nach Veroeffentlichung, also seit dem 21.08.2025.
    Dies ist die einzige BINDENDE israelische Aufsichtsvorschrift, die KI-Systeme ausdruecklich erfasst
    — und sie tut es nicht ueber einen KI-Begriff, sondern ueber den Modellbegriff.
  kurzbeschreibung: 'Die Richtlinie verpflichtet Bankinstitute zu einem Rahmen fuer das Management von
    Modellrisiken ueber den gesamten Lebenszyklus: Bestandsverzeichnis, Entwicklung, unabhaengige Validierung,
    Freigabe, laufende Ueberwachung, Dokumentation und Governance auf Vorstands- und Aufsichtsratsebene.
    Fuer die KI-Regulierung entscheidend ist ihr § 5: "כל האמור בהוראה זו חל גם על מודלים הכוללים שימוש
    או התבססות על בינה מלאכותית" — alles in dieser Richtlinie Bestimmte gilt auch fuer Modelle, die kuenstliche
    Intelligenz einsetzen oder auf ihr beruhen. Ergaenzend verlangt sie fuer KI-Modelle besondere Aufmerksamkeit
    fuer Fairness und die Vermeidung unbeabsichtigter Verzerrung und Diskriminierung, eine an die Lernmechanik
    angepasste Verantwortlichkeit mit menschlicher Aufsicht, die Gestaltung von Kontrollen fuer KI-gestuetzte
    Entscheidungen sowie Transparenz und Erklaerbarkeit der Ergebnisse mit umfassender Dokumentation;
    ein eigener Anhang enthaelt Umsetzungsbeispiele. Sanktion ist die aufsichtsrechtliche Durchsetzung
    durch die Bankenaufsicht bis hin zu Anordnungen und Verwaltungsmassnahmen.'
