  offene_punkte:
  - Die Entscheidung des Patentkommissars vom 15.03.2023 wurde nicht an einer amtlichen Quelle geprueft;
    die Entscheidungssammlung des israelischen Patentamts war nicht erreichbar.
  - Ob gegen das Urteil vom 31.12.2025 ein Rechtsmittel zum Obersten Gerichtshof eingelegt wurde, ist
    nicht ermittelt.
  - Zur Frage, ob eine mit KI-Unterstuetzung gemachte Erfindung mit dem menschlichen Beitragenden als
    Erfinder patentierbar ist (die praktisch weit wichtigere Frage), gibt es in Israel weder eine Entscheidung
    noch eine Amtsrichtlinie.
