      und des Forums der Wachstumsunternehmen)
    verifiziert: true
    notiz: 'Sekundaerquelle. Belegt den innerstaatlichen Konflikt: Das Finanzministerium warnt vor einem
      negativen Signal an den Markt und an internationale Unternehmen mit Regierungsvertraegen; die Industrie
      wirft der Behoerde vor, die Logik alter Datenbankregulierung auf eine neue Technologie zu uebertragen.'
  offene_punkte:
  - 'Seit dem Ende der Anhoerung am 31.07.2025 sind mehr als dreizehn Monate vergangen, ohne dass eine
    Endfassung veroeffentlicht worden waere. Ob die Leitlinie noch kommt, in welcher Fassung und ob die
    Verlagerung der KI-Zustaendigkeit in das Amt des Ministerpraesidenten (Beschluss 3375/2025) daran
    Anteil hat, ist offen. Der Entwurf hat gleichwohl faktische Wirkung: Er ist die einzige veroeffentlichte
    Rechtsauffassung der zustaendigen Behoerde.'
  - 'Der Entwurf verlangt eine Rechtsgrundlage in jeder Lebenszyklusphase, ohne die Systemfrage zu beantworten:
    Das israelische Recht kennt neben der Einwilligung keine praktikable Grundlage. Ein berechtigtes Interesse
    wie in Art. 6 Abs. 1 lit. f DSGVO gibt es nicht. Damit stellt die Leitlinie an das Training aus Daten
    des offenen Netzes eine Anforderung, die kaum je erfuellbar ist.'
  - Das Verhaeltnis zur Rechtsauffassung des Justizministeriums vom 18.12.2022 zum Urheberrecht ist ungeklaert.
    Dort wurde das Trainieren mit fremden Inhalten grosszuegig erlaubt; hier wird dasselbe Training datenschutzrechtlich
    weitgehend untersagt, soweit personenbezogene Daten betroffen sind. Israel hat damit zwei gegenlaeufige
    Verwaltungspositionen zum selben Vorgang.
