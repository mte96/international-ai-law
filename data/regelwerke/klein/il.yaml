  themenachsen:
  - governance
  - marktzugang
  - grundrechte
  - datenschutz
  - haftung
  - sektor-finanz
  - sektor-medizin
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - 'Aufbau des Dokuments: (1) Hintergrund und KI-Begriff, (2) geltende Rechts- und Regulierungslage in
    Israel, (3) internationale Entwicklung (OECD, EU, Vereinigtes Koenigreich, USA, Kanada), (4) Problemfelder,
    (5) Loesungsansaetze, (6) sieben Empfehlungen.'
  - 'Empfehlung 1 (die tragende): Israel soll eine SEKTORALE Regulierungspolitik verfolgen. Der Regulierungsbedarf
    ist von der jeweils zustaendigen Fachaufsicht anhand konkreter Bedarfe zu beurteilen, nicht durch
    ein uebergreifendes Gesetz. Ausdruecklich offen gehalten: Der Bedarf an einer Horizontalgesetzgebung
    ist periodisch neu zu bewerten. Das ist keine Ablehnung fuer alle Zeit, sondern eine Verschiebung
    der Beweislast auf denjenigen, der ein Gesetz will.'
  - 'Empfehlung 2: Uebernahme ethischer Grundsaetze fuer KI auf Grundlage der OECD-Empfehlung — mit den
    Leitprinzipien menschenzentrierter Ansatz, Gleichheit und Nichtdiskriminierung, Transparenz und Erklaerbarkeit,
    Verlaesslichkeit und Sicherheit, Rechenschaft, Schutz der Privatheit.'
  - 'Empfehlung 3: Einrichtung eines staatlichen KI-Wissens- und Koordinierungszentrums (in der englischen
    Fassung "AI Policy Coordination Center") mit Steuerungsausschuss unter Vorsitz des Innovationsministeriums
    und Beteiligung von Justizministerium, Finanzministerium und Datenschutzbehoerde. Aufgaben: Beratung
    der Fachaufsichten, ressortuebergreifende Kohaerenz, internationale Vertretung Israels in KI-Regulierungsfragen.'
  - 'Empfehlung 4 (Sofortmassnahme): Regierungsstellen und Fachaufsichten sollen unverzueglich die konkreten
    KI-Anwendungen und die damit verbundenen Risiken in ihrem Sektor kartieren.'
  - 'Empfehlung 5: Einrichtung eines Regulierungsforums der Aufsichtsbehoerden sowie eines Forums fuer
    die interessierte Oeffentlichkeit (Industrie, Wissenschaft, Zivilgesellschaft).'
  - 'Empfehlung 6: Aktive Beteiligung an der internationalen Regulierungsentwicklung — Interoperabilitaet
    mit den fuehrenden Rechtsordnungen als eigenstaendiges Politikziel (Israel ist OECD-Mitglied und hat
    2018 die Angemessenheitsentscheidung der EU-Kommission zur Datenuebermittlung).'
  - 'Empfehlung 7: Bereitstellung praktischer Werkzeuge — insbesondere eines Risikomanagementrahmens,
    der eine gemeinsame Terminologie fuer die Aufsichtsbehoerden schafft, damit Regulierer und Private
    Risiken einheitlich bewerten und mindern.'
  - 'Die sieben identifizierten Problemfelder: Diskriminierung durch Verzerrungen in Trainingsdaten; Ausmass
    menschlicher Beteiligung an automatisierten Entscheidungen; Erklaerbarkeit (Black-Box-Problem); Offenlegung,
    dass man mit einem KI-System interagiert; Verlaesslichkeit, Robustheit, Sicherheit; Rechenschaft und
    rechtliche Haftung; Schutz der Privatheit.'
  - 'Was das Dokument NICHT tut: Es definiert kein KI-System rechtsverbindlich, kennt keine Risikoklassen
    mit Rechtsfolgen, keine Konformitaetsbewertung, keine Registrierung, keine Marktueberwachungsbehoerde
    und keine Sanktion. Wer in Israel nach dem Aequivalent zu Art. 6 und Anhang III der KI-VO sucht, findet
    nichts — und das ist die Aussage.'
