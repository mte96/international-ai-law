- id: il-reg-3375-2025
  jurisdiktion: il
  kurztitel: Regierungsbeschluss 3375/2025 — Nationaler KI-Stab
  offizieller_titel: הקמת המטה הלאומי לבינה מלאכותית בישראל, תיקון החלטות ממשלה והעברת שטח פעולה ממשרד
    למשרד — Hakamat ha-mate ha-leumi le-bina melachutit be-Israel, tikun hachlatot memshala ve-haavarat
    shetach peula mi-misrad le-misrad (Errichtung des Nationalen Stabes fuer kuenstliche Intelligenz in
    Israel, Aenderung von Regierungsbeschluessen und Uebertragung eines Handlungsfelds von einem Ministerium
    auf ein anderes)
  fundstelle: החלטת ממשלה מס' 3375 מיום 21.09.2025 (Regierungsbeschluss Nr. 3375 vom 21.09.2025), 37.
    Regierung
  verfahrensnummer: '3375'
  status: anwendbar
  status_detail: In Kraft. Der Beschluss aendert die Regierungsbeschluesse 212 (01.08.2021), 173 (24.02.2023),
    1700 (17.04.2024) und 2762 (16.02.2025) und ueberfuehrt das Handlungsfeld "Politik und Regulierung
    im Bereich der kuenstlichen Intelligenz" samt der zugehoerigen leitenden Planstelle vom Ministerium
    fuer Innovation, Wissenschaft und Technologie in das Amt des Ministerpraesidenten. Leiter des Stabes
    ist Brigadegeneral d.R. Erez Askal (ernannt Oktober 2025).
  kurzbeschreibung: Der Beschluss ist der institutionelle Bruch in der israelischen KI-Governance. Er
    nimmt die Zustaendigkeit fuer KI-Politik und KI-Regulierung dem Fachministerium, das 2023 das Grundsatzdokument
    verantwortet hatte, und zieht sie in das Amt des Ministerpraesidenten. Damit wird die KI-Regulierung
    in Israel zur Chefsache und rueckt aus der Ressortlogik in die Logik nationaler Sicherheits- und Infrastrukturpolitik.
    Der Stab soll den nationalen Beschleunigungsplan erarbeiten, die Ressorts in Regulierungsfragen unterstuetzen
    und fortgeschrittene Infrastruktur (Energieanlagen, Hochleistungsrechnen) aufbauen. Sanktionen enthaelt
    der Beschluss nicht; er ist ein Organisationsakt der Exekutive. Ausgestattet wurde er nach Presseberichten
    mit rund 120 Mio. NIS ueberwiegend fuer 2026 und 20 Planstellen, ab 2027 mit rund 13 Mio. NIS jaehrlich.
  inkrafttreten:
    datum: 2025-09-21
    verifiziert: true
    quelle: https://www.gov.il/he/pages/dec3375-2025
    fundstelle_norm: החלטת ממשלה מס' 3375 מיום 21.09.2025 — Regierungsbeschluesse der israelischen Regierung
      wirken mit ihrer Annahme; der Beschluss selbst enthaelt keine abweichende Inkrafttretensklausel,
      sondern nur Umsetzungsfristen (Ernennung des Stabsleiters binnen 14 Tagen, Aufbau des Stabes binnen
      45 Tagen, nationale KI-Strategie binnen 120 Tagen)
  anwendungsdaten:
  - datum: 2025-10-19
    was_gilt: Ernennung von Brigadegeneral d.R. Erez Askal zum Leiter des Nationalen KI-Stabes (ohne Ausschreibung).
    verifiziert: false
    quelle: https://www.calcalistech.com/ctechnews/article/ab6v2b1ra
  - datum: 2026-06-16
    was_gilt: Der Stab legt der Regierung die Nationale KI-Strategie vor; sie wird als Beschluss 4255
      angenommen.
    verifiziert: true
    quelle: https://www.gov.il/he/pages/spoke-ai160626
