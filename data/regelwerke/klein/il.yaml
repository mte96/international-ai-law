    und begruendet keinen Anspruch auf Zulassung; er ist ein Begleitverfahren, aus dem heraus das Ministerium
    seine kuenftige Regulierungspolitik entwickeln will.
  kurzbeschreibung: 'Das israelische Gesundheitsministerium hat den weltweit ersten auf medizinische KI
    zugeschnittenen Regulierungssandkasten aufgesetzt. Bemerkenswert ist die Auswahl der Themen: Der Sandkasten
    richtet sich ausdruecklich NICHT an blosse Entscheidungsunterstuetzungssysteme, sondern an zwei Felder,
    in denen die Rechtslage wirklich unklar ist — die vollstaendige Automatisierung von Aufgaben, die
    heute das Behandlungsteam ausfuehrt, und die Neuverteilung von Aufgaben zwischen den Angehoerigen
    der Gesundheitsberufe einschliesslich der Schaffung neuer Berufsbilder. Als zu bearbeitende regulatorische
    Herausforderungen nennt der Aufruf ausdruecklich: die Notwendigkeit, Verfahrensvorschriften oder Gesetze
    zu aendern, um klinische Behandlungsbefugnisse zu verschieben; Fragen der rechtlichen und beruflichen
    Verantwortung, wenn ein KI-System Handlungen ausfuehrt; das Risikomanagement bei der Verteilung dieser
    Verantwortung; und die Zulassung von Werkzeugen auf Grundlage generativer KI. Ausgenommen sind Vorhaben,
    die nur eine Medizinproduktzulassung (אמ"ר) oder nur eine Genehmigung fuer eine klinische Pruefung
    brauchen, sowie reine Datenschutz- und Datenzugangsfragen.'
