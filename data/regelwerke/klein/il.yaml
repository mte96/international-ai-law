    was_gilt: Verkuendung in Sefer ha-Chukkim 3546, S. 762; Wirksamkeitsbeginn des Gesetzes.
    verifiziert: true
    quelle: https://fs.knesset.gov.il/25/law/25_lsr_14147458.pdf
  - datum: 2026-07-23
    was_gilt: 'Beginn der Offenlegungspflicht fuer Deepfake-Wahlwerbung: eine Woche nach Verkuendung des
      Gesetzes (§ 2א2 als befristete Vorschrift).'
    verifiziert: true
    quelle: https://fs.knesset.gov.il/25/law/25_lsr_14147458.pdf
  - datum: 2026-07-26
    was_gilt: Der Vorsitzende des Zentralen Wahlausschusses erlaesst die Ausfuehrungsregeln zur Form der
      Offenlegung; nach Presseberichten wird die Kennzeichnungspflicht ab diesem Tag praktisch durchgesetzt.
    verifiziert: true
    quelle: https://www.law.co.il/media/computer-law/election_rules_propaganda_deep_fake2026.pdf
  - datum: 2026-10-27
    was_gilt: Wahltag der 26. Knesset; von diesem Tag an laeuft die Jahresfrist, nach deren Ablauf die
      befristete Deepfake-Vorschrift ausser Kraft tritt.
    verifiziert: false
    quelle: https://en.wikipedia.org/wiki/2026_Israeli_legislative_election
  themenachsen:
  - content
  - grundrechte
  - sektor-oeffentlich
  regelungsschwerpunkte:
  - '§ 2א2(a) Wahlgesetz (Wahlwerbung) 1959 in der Fassung dieses Gesetzes: "אדם המפרסם תעמולת בחירות
    שהיא נחזות עמוקה יצרף לה גילוי המציין באופן ברור ובולט כי התוכן שבה לא תועד במקור" — wer Wahlwerbung
    veroeffentlicht, die eine tiefe Scheinbarkeit ist, hat ihr eine Offenlegung beizufuegen, die klar
    und deutlich angibt, dass der darin enthaltene Inhalt nicht im Original aufgezeichnet wurde.'
  - '§ 2א2(d) Legaldefinition "אמצעי דיגיטלי" (digitales Mittel): "תוכנה כהגדרתה בחוק המחשבים, התשנ"ה-1995,
    לרבות בינה מלאכותית, המסוגלת ליצור מידע או תוכן, לעורכו או לשנותו" — Software im Sinne des Computergesetzes
    1995, EINSCHLIESSLICH kuenstlicher Intelligenz, die Informationen oder Inhalte erzeugen, bearbeiten
    oder veraendern kann. Die kuenstliche Intelligenz ist damit nur ein Unterfall; das Gesetz erfasst
    auch klassische Bildbearbeitung.'
  - '§ 2א2(d) Legaldefinition "נחזות עמוקה": "תוכן חזותי או קולי הכולל דמות, מקום, אירוע, מסמך או חפץ
    אחר אשר עשויים להיחזות ככאלה שתועדו במקור, אולם נוצרו באמצעי דיגיטלי, או נערכו באמצעי כאמור באופן
    ששינה אותם שינוי מהותי" — visueller oder akustischer Inhalt mit Person, Ort, Ereignis, Dokument oder
    anderem Gegenstand, die als im Original aufgezeichnet erscheinen koennen, aber mit einem digitalen
    Mittel erzeugt oder damit wesentlich veraendert wurden. Anknuepfungspunkt ist die TAEUSCHUNGSEIGNUNG,
    nicht die Erzeugungstechnik.'
  - '§ 2א2(b): Ermaechtigung des Vorsitzenden des Zentralen Wahlausschusses, Regeln ueber die Erfuellung
    der Offenlegungspflicht zu erlassen. Auf dieser Grundlage ergingen die Regeln vom 26.07.2026.'
  - 'Befristung: Die Vorschrift gilt "בתקופה שתחילתה שבוע מיום פרסומו של חוק זה ועד תום שנה מיום הבחירות
    לכנסת העשרים ושש" — vom siebten Tag nach Verkuendung bis zum Ablauf eines Jahres nach dem Wahltag.
    Israel hat den Deepfake also ausdruecklich befristet geregelt und die Dauerregelung offengelassen.'
  - 'Weitere geaenderte Gesetze (indirekte Aenderungen): חוק הבחירות לכנסת [נוסח משולב], התשכ"ט-1969 (Aenderungen
    79 und 80, S. 763 und 767); חוק הבחירות (דרכי תעמולה), התשי"ט-1959 (Aenderungen 42 und 43, S. 767
    und 768); חוק המפלגות, התשנ"ב-1992 (Aenderung 31); חוק מיסוי תשלומים בתקופת בחירות, התשנ"ו-1996 (Aenderung
    11); חוק המרכז לגביית קנסות, אגרות והוצאות, התשנ"ה-1995 (Aenderung 30).'
  - 'Daueraenderung im Wahlwerberecht: Die Transparenzpflicht ueber die Identitaet des Veroeffentlichenden
    einer Wahlanzeige gilt kuenftig jederzeit und nicht nur im Wahlkampfzeitraum; ferner gilt das blosse
    Fotografieren im Buero eines gewaehlten Amtstraegers nicht mehr als unerlaubte Nutzung oeffentlichen
    Eigentums.'
  - 'Kontext: Der Gesetzentwurf war ein Ausschussentwurf vor dem Hintergrund der besonderen Sicherheitslage.
    Zu den Hintergrundmaterialien des Ausschusses gehoert ein Positionspapier des Schamgar-Zentrums zum
    "Einsatz kuenstlicher Intelligenz und synthetischer Inhalte in der Wahlwerbung".'
