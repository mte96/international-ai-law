- id: il-datensicherheits-vo-2017
  jurisdiktion: il
  kurztitel: Datensicherheitsverordnung 2017
  offizieller_titel: תקנות הגנת הפרטיות (אבטחת מידע), התשע"ז-2017 — Takanot haganat ha-pratiut (avtachat
    meida), ha-tashaz-2017 (Verordnung zum Schutz der Privatheit — Datensicherheit)
  fundstelle: ק"ת (Kovets ha-Takanot, Verordnungsblatt) התשע"ז; in Kraft seit 08.05.2018
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Seit dem 08.05.2018 anwendbar. Die Verordnung stuft Datenbanken in vier Sicherheitsstufen
    ein und knuepft daran gestufte technische und organisatorische Pflichten. Fuer KI ist sie ueber zwei
    Wege bedeutsam: als Massstab fuer die Sicherheit von Trainings- und Modelldaten und als Grundlage
    der Meldepflicht bei schweren Sicherheitsereignissen, zu denen die Datenschutzbehoerde ausdruecklich
    das unerlaubte Abgreifen von Daten aus einer Datenbank (Scraping) zaehlt.'
  kurzbeschreibung: 'Die Verordnung ist Israels technisches Datenschutzrecht. Sie verpflichtet Verantwortliche
    zur Erstellung eines Datenbankverzeichnisses und einer Sicherheitsvorschrift, zur Zugriffskontrolle,
    Protokollierung, Trennung von Systemen, regelmaessigen Risikopruefung und — bei den hoeheren Sicherheitsstufen
    — zu Penetrationstests und Audits. Verstoesse sind seit Tikkun 13 mit Geldbussen bewehrt, deren Hoehe
    sich nach der Sicherheitsstufe richtet (Anlage 3 zum Datenschutzgesetz). Die praktische KI-Relevanz:
    Wer ein Modell auf personenbezogenen Daten trainiert, unterhaelt in aller Regel eine Datenbank im
    Sinne des Gesetzes und unterliegt dieser Verordnung; und wer eine Plattform betreibt, von der Dritte
    Daten fuer Trainingszwecke abgreifen, hat nach Auffassung der Behoerde ein meldepflichtiges schweres
    Sicherheitsereignis.'
