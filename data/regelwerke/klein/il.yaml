- id: il-coe-cets225-zeichnung
  jurisdiktion: il
  kurztitel: Israels Zeichnung der Europarats-Rahmenkonvention ueber KI
  offizieller_titel: Council of Europe Framework Convention on Artificial Intelligence and Human Rights,
    Democracy and the Rule of Law (CETS Nr. 225) — Zeichnung durch den Staat Israel
  fundstelle: 'Vertragsbuero des Europarats, Zeichnungs- und Ratifikationstabelle zu CETS Nr. 225, Stand
    06.09.2026: Israel, Zeichnung am 05.09.2024, keine Ratifikation'
  verfahrensnummer: CETS 225
  status: verabschiedet
  status_detail: Israel hat die Konvention am 05.09.2024 in Vilnius am Tag ihrer Oeffnung zur Zeichnung
    unterzeichnet — als einer von sechs Nichtmitgliedstaaten des Europarats neben den Vereinigten Staaten,
    Kanada, Japan, Uruguay und (spaeter) weiteren. Ratifiziert hat Israel nicht. Die Konvention ist mangels
    der erforderlichen fuenf Ratifikationen (darunter drei Europaratsmitglieder) bis zum 06.09.2026 nicht
    in Kraft; ratifiziert hat bislang allein die Europaeische Union (15.05.2026). Fuer Israel begruendet
    die Zeichnung damit keine Umsetzungspflicht, wohl aber die voelkerrechtliche Pflicht, Handlungen zu
    unterlassen, die Ziel und Zweck des Vertrags vereiteln wuerden.
  kurzbeschreibung: 'Die Zeichnung ist der einzige voelkerrechtliche Anker der israelischen KI-Politik
    und juristisch der interessanteste Widerspruch im israelischen Befund: Ein Staat, der ein nationales
    KI-Gesetz ausdruecklich ablehnt, hat den einzigen voelkerrechtlich verbindlichen KI-Vertrag am Tag
    seiner Oeffnung gezeichnet. Die Konvention verpflichtet die Vertragsparteien, Taetigkeiten im Lebenszyklus
    von KI-Systemen mit Menschenrechten, Demokratie und Rechtsstaatlichkeit in Einklang zu bringen, und
    ueberlaesst ihnen die Wahl der Mittel — Gesetzgebung, Verwaltungsmassnahmen oder andere. Genau diese
    Offenheit macht sie fuer Israel zeichnungsfaehig: Der sektorale Weg ist nach der Konvention zulaessig.
    Ohne Ratifikation entstehen jedoch weder Berichtspflichten noch eine Konferenz der Vertragsparteien
    mit Wirkung fuer Israel.'
  inkrafttreten:
    datum: null
    verifiziert: true
    quelle: https://www.coe.int/en/web/conventions/cets-number-/-abridged-title-known?module=signatures-by-treaty&treatynum=225
  anwendungsdaten:
  - datum: 2024-09-05
    was_gilt: Zeichnung durch Israel in Vilnius am Tag der Oeffnung des Vertrags zur Zeichnung.
    verifiziert: true
    quelle: https://www.coe.int/en/web/conventions/cets-number-/-abridged-title-known?module=signatures-by-treaty&treatynum=225
  - datum: 2026-05-15
    was_gilt: 'Einzige Ratifikation bislang: Europaeische Union (mit Erklaerung). Die Konvention ist damit
      weiterhin nicht in Kraft.'
    verifiziert: true
    quelle: https://www.coe.int/en/web/conventions/cets-number-/-abridged-title-known?module=signatures-by-treaty&treatynum=225
  themenachsen:
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Zeichnung ohne Ratifikation: keine Umsetzungspflicht, aber Bindung an das voelkerrechtliche Vereitelungsverbot.'
  - Die Konvention laesst die Wahl der Umsetzungsmittel offen; der israelische sektorale Ansatz ist mit
    ihr vereinbar. Sie ist damit kein Argument fuer ein israelisches KI-Gesetz.
  - 'Stand der Zeichnungen zum 06.09.2026: 20 Zeichnungen ohne Ratifikation, eine Ratifikation (Europaeische
    Union). Neben Israel haben von den Nichtmitgliedstaaten Kanada (11.02.2025), Japan (11.02.2025), die
    Vereinigten Staaten (05.09.2024) und Uruguay (02.09.2025) gezeichnet.'
  dokumente:
  - datum: 2026-09-06
