  regelungsschwerpunkte:
  - 'Begriffsreform in § 3: מידע אישי ersetzt das alte מידע; neu sind עיבוד, בעל שליטה und מידע בעל רגישות
    מיוחדת. Der Begriff der Datenbank erfasst nur noch digitale Sammlungen und nimmt Kleinstsammlungen
    aus.'
  - 'Registrierung wird zur Ausnahme (§ 8א): Registrierungspflichtig sind nur noch Datenbanken oeffentlicher
    Stellen und solche, deren Hauptzweck die Weitergabe von Daten im geschaeftlichen Verkehr ist (ab 10.000
    Betroffenen). Fuer Datenbanken mit sensiblen Daten ueber mehr als 100.000 Personen tritt eine blosse
    Meldepflicht an die Stelle der Registrierung.'
  - Pflicht zur Bestellung eines Datenschutzbeauftragten (§§ 17ב1 bis 17ב3) fuer oeffentliche Stellen,
    Datenhaendler, Stellen mit systematischer Beobachtung und Stellen mit umfangreicher Verarbeitung sensibler
    Daten. Anders als Art. 38 Abs. 3 DSGVO enthaelt das israelische Recht keinen Abberufungsschutz und
    keine ausdrueckliche Weisungsfreiheit.
  - Gesetzliche Verankerung der Datenschutzbehoerde (§ 17ט1) mit Budgetautonomie im Justizministerium;
    Aufsichts- und Ermittlungsbefugnisse einschliesslich Durchsuchungsanordnungen und Anordnungen zum
    Eindringen in Rechner.
  - Vorabauskunft (§ 17ט2) und jaehrliche Berichtspflicht an den Verfassungsausschuss der Knesset (§ 17ט3).
  - 'Verwaltungssanktionen: achtstufiges System, teils nach Zahl der Betroffenen bemessen; Obergrenze
    bei schweren Verstoessen 5 Prozent des Jahresumsatzes; Verdopplung bei Wiederholung binnen zwei Jahren;
    Ermaessigung bis zu 70 Prozent moeglich; verpflichtende Veroeffentlichung verhaengter Sanktionen.'
  - Pauschalierter Schadensersatz bis 10.000 NIS ohne Schadensnachweis (§ 15א) — unter anderem bei unterlassener
    Registrierung nach schriftlicher Aufforderung, fehlerhafter Hinweiserteilung und Verweigerung von
    Einsicht oder Berichtigung.
  - 'Verjaehrung: Verlaengerung von zwei auf sieben Jahre fuer Verstoesse nach dem 14.08.2025.'
  - 'Straftatbestaende: bis zu drei Jahren Freiheitsstrafe fuer irrefuehrende Hinweise nach § 11 und fuer
    die unbefugte Weitergabe von Daten durch oeffentliche Stellen; Wegfall der verschuldensunabhaengigen
    Strafbarkeit.'
  - 'LEERSTELLE MIT FOLGEN: Der Gesetzgeber hat die Reform bewusst nicht genutzt, um automatisierte Entscheidungen
    zu regeln. Die Datenschutzbehoerde musste die gesamte KI-Aufsicht daher ueber Zweckbindung (§ 8),
    Hinweispflicht (§ 11), Berichtigung (§ 14) und Rechenschaft konstruieren.'
