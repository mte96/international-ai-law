- id: il-ppa-ki-leitlinie-2025
  jurisdiktion: il
  kurztitel: PPA-Leitlinie zur Anwendung des Datenschutzgesetzes auf KI-Systeme (Entwurf)
  offizieller_titel: 'טיוטת הנחיית הרשות להגנת הפרטיות: תחולת הוראות חוק הגנת הפרטיות על מערכות בינה מלאכותית
    — Tiyutat hanchayat ha-rashut le-haganat ha-pratiut: techulat horaot chok haganat ha-pratiut al maarachot
    bina melachutit (Entwurf einer Leitlinie der Datenschutzbehoerde: Anwendung der Vorschriften des Datenschutzgesetzes
    auf Systeme kuenstlicher Intelligenz)'
  fundstelle: Veroeffentlicht am 28.04.2025 (ל' בניסן התשפ"ה) als Entwurf zur oeffentlichen Anhoerung;
    gov.il-Vorgang ai_reg
  verfahrensnummer: null
  status: entwurf
  status_detail: Am 28.04.2025 als Entwurf veroeffentlicht. Die Anhoerungsfrist lief zunaechst bis 05.06.2025
    und wurde bis 31.07.2025, 12:00 Uhr verlaengert (Seitenaktualisierung 29.06.2025). Der Vorgang ist
    auf gov.il als geschlossen ausgewiesen. Eine Endfassung war am 05.09.2026 nicht auffindbar — die Leitlinie
    ist damit seit ueber einem Jahr Entwurf. Im August 2025 haben das Finanzministerium und Verbaende
    der Hochtechnologie oeffentlich gegen den Entwurf Stellung genommen.
  kurzbeschreibung: 'Der Entwurf ist der wichtigste Text des israelischen KI-Rechts, weil er die einzige
    Stelle ist, an der eine israelische Behoerde verbindliche Aussagen zu Training, Scraping und Chatbots
    trifft. Er stellt fest: Das Datenschutzgesetz gilt fuer KI-Systeme und auch fuer die Daten, die ein
    System aus den Eingaben ABLEITET (Schlussfolgerungen, Vorhersagen, Klassifizierungen sind selbst personenbezogene
    Daten); fuer jede Phase des Lebenszyklus — Entwicklung, Training, Einsatz — bedarf es einer Rechtsgrundlage;
    die Einwilligung ist nur wirksam, wenn die Funktionsweise des Systems in der zur Willensbildung noetigen
    Tiefe beschrieben wird; wer mit einem Bot spricht, ist darueber zu unterrichten, wenn das fuer die
    Einwilligung wesentlich ist; das Abgreifen personenbezogener Daten aus dem Netz zum Training bedarf
    der informierten Einwilligung, und die blosse Veroeffentlichung eigener Daten im Netz oder in sozialen
    Netzwerken belegt eine solche Einwilligung gerade nicht; Plattformen muessen unerlaubtes Scraping
    technisch verhindern, und unerlaubtes Scraping ist ein schweres Sicherheitsereignis mit sofortiger
    Meldepflicht nach der Datensicherheitsverordnung. Sanktionsbewehrt ist der Text nicht selbst — er
    legt aus, wovon die Bussgelder des Gesetzes abhaengen.'
