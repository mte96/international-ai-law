  status_detail: 'Berufsrechtliche Auslegungshilfe ohne unmittelbare Gesetzeskraft, aber mit disziplinarrechtlicher
    Wirkung: Der Ethikausschuss legt die Standesregeln aus, an denen sich das Disziplinarverfahren orientiert.
    Sie ist der israelische Hintergrund fuer die inzwischen 57 in Israel erfassten Faelle erfundener Fundstellen
    — nach den USA, Kanada, Australien und dem Vereinigten Koenigreich die fuenftaktivste Jurisdiktion.'
