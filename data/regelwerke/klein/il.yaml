- id: il-moj-tdm-2022
  jurisdiktion: il
  kurztitel: Stellungnahme des Justizministeriums zu Text- und Data-Mining (2022)
  offizieller_titel: 'חוות דעת: שימושים בתכנים מוגנים בזכויות יוצרים לצורך למידת מכונה — Chavat daat:
    shimushim be-tchanim muganim be-zchuyot yotsrim le-tsorech limudat mechona / "Opinion: Uses of Copyrighted
    Materials for Machine Learning"'
  fundstelle: Rechtsgutachten der Verwaltung vom 18.12.2022 (כ"ה כסלו תשפ"ג), משרד המשפטים, ייעוץ וחקיקה
    (משפט אזרחי); Aktualisierung der amtlichen Seite am 11.05.2025
  verfahrensnummer: null
  status: softlaw
  status_detail: Weiterhin die massgebliche Verwaltungsposition. Sie bindet Gerichte nicht und ist bis
    September 2026 durch keine israelische Entscheidung bestaetigt worden. Sie ist die weltweit erste
    behoerdliche Positionierung zur Zulaessigkeit des KI-Trainings und wird international — unter anderem
    in der Untersuchung des US Copyright Office — als Referenz zitiert. Die amtliche Seite wurde zuletzt
    am 11.05.2025 aktualisiert; eine inhaltliche Fortschreibung ist damit nicht verbunden.
  kurzbeschreibung: 'Die von Adv. Dr. Lital Helman verfasste, von Adv. Howard Poliner (Leiter des Bereichs
    geistiges Eigentum) begleitete und unter Anleitung von Adv. Carmit Yulis, stellvertretende Rechtsberaterin
    der Regierung fuer Zivilrecht, ergangene Stellungnahme kommt zu dem Ergebnis, dass das Trainieren
    von Modellen des maschinellen Lernens mit urheberrechtlich geschuetzten Inhalten ausser in Ausnahmefaellen
    von den Schranken des israelischen Urheberrechts gedeckt ist. Drei Wege: erstens in aller Regel die
    Fair-Use-Schranke des § 19; zweitens bei einem Teil der Vorhaben die beilaeufige Nutzung nach § 22,
    weil das einzelne Werk nur Mittel zum Erlernen einer Aufgabe ist; drittens, soweit die Lerndaten am
    Ende geloescht werden, die voruebergehende Vervielfaeltigung nach § 26 — was die Stellungnahme selbst
    als weite Auslegung bezeichnet. Ausdrueckliche Ausnahmen: Datensaetze, die keine breite Vielfalt an
    Inhalten umfassen, sondern aus Werken einzelner Urheber bestehen und die Grundlage eines Systems bilden,
    das mit eben diesen Urhebern in ihren Maerkten konkurriert; ferner nicht transformative und zugleich
    kommerzielle Vorhaben. Die Stellungnahme erstreckt sich ausdruecklich NICHT auf die Ausgabe ("This
    Opinion does not apply to ML-based products, but only to the learning process itself"); ob eine Ausgabe
    verletzt, ist im Einzelfall nach allgemeinem Urheberrecht zu pruefen. Erklaerter Zweck: Beseitigung
    rechtlicher Unsicherheit als Standortpolitik.'
  inkrafttreten:
    datum: 2022-12-18
    verifiziert: true
    quelle: https://www.gov.il/he/pages/machine-learning
  anwendungsdaten:
  - datum: 2022-12-18
    was_gilt: Veroeffentlichung der Stellungnahme.
    verifiziert: true
    quelle: https://www.gov.il/BlobFolder/legalinfo/machine-learning/he/18-12-2022.pdf
  - datum: 2025-05-11
    was_gilt: Aktualisierungsdatum der amtlichen Seite des Justizministeriums (ohne erkennbare inhaltliche
      Aenderung der Stellungnahme).
    verifiziert: true
    quelle: https://www.gov.il/he/pages/machine-learning
  themenachsen:
  - urheberrecht
  - gpai
  regelungsschwerpunkte:
  - 'Grundaussage: "מלבד מקרים חריגים, שימוש בתכנים מוגנים בזכויות יוצרים לצורך אימון מכונה חוסה תחת הסדרי
    השימושים המותרים בדיני זכויות היוצרים ולכן אינו מהווה הפרה" — ausser in Ausnahmefaellen faellt die
    Nutzung geschuetzter Inhalte zum Maschinentraining unter die erlaubten Nutzungen und ist daher keine
    Verletzung.'
  - 'Erster Weg — § 19 Fair Use: Das Training ist in aller Regel faire Nutzung. Die offene Zweckliste
    des § 19(a) traegt die Subsumtion; die vier Faktoren des § 19(b) fallen typischerweise zugunsten des
    Trainings aus, weil das Vorhaben transformativ ist und den Markt des Einzelwerks nicht ersetzt.'
  - 'Zweiter Weg — § 22 beilaeufige Nutzung: Die Werke im Datensatz dienen als Mittel, dem Rechner eine
    Aufgabe beizubringen; Zweck der Nutzung ist die Aufgabe, nicht das Werk. Anwendbar, wenn dem Einzelwerk
    im Gesamtsystem nur ein verschwindendes Gewicht zukommt.'
  - 'Dritter Weg — § 26 voruebergehende Vervielfaeltigung: anwendbar, wenn der Datensatz nach dem Training
    geloescht wird. Die Stellungnahme raeumt ein, dies sei eine weite Auslegung ("admittedly a broad interpretation").'
  - 'Ausnahme 1: Datensaetze, die ausschliesslich aus Werken eines einzelnen Urhebers bestehen, um mit
    diesem Urheber in seinen bestehenden Maerkten zu konkurrieren (Beispiel im Text: ein System, das den
    Stil einer bestimmten Fotografin nachahmt).'
  - 'Ausnahme 2: nicht transformative Vorhaben, insbesondere wenn sie zugleich kommerziell sind.'
  - 'Ausdrueckliche Beschraenkung auf die Eingabeseite: Die Stellungnahme betrifft nur den Lernvorgang,
    nicht die Erzeugnisse. Fuer die Ausgabe schafft sie keinen sicheren Hafen; sie verlangt eine Pruefung
    im Einzelfall.'
  - 'Verfahrensvorgeschichte: Der Stellungnahme ging ein oeffentlicher Aufruf zur Stellungnahme ("קול
    קורא לשימוש בתכנים מוגנים בזכויות יוצרים לצורך למידת מכונה") voraus, der von der amtlichen Seite des
    Ministeriums weiterhin verlinkt ist. Er ist das israelische Gegenstueck zur Konsultation der Rechteinhaber.'
  - 'Erklaerte Zielsetzung: "הסרת החסם של עמימות משפטית ... נועדה לתמרץ פעילות רצויה בשוק למידת המכונה
    ולמקסם את התחרותיות של חברות ישראליות" — die Beseitigung des Hemmnisses rechtlicher Unklarheit soll
    erwuenschte Taetigkeit im Markt des maschinellen Lernens anreizen und die Wettbewerbsfaehigkeit israelischer
    Unternehmen sowohl in der Inhalte- als auch in der KI-Industrie maximieren. Urheberrechtspolitik als
    Industriepolitik, offen ausgesprochen.'
