    datum: 2023-12-18
    verifiziert: true
    quelle: https://www.gov.il/BlobFolder/news/most-news20231218/he/2023%20Artificial%20Intelligence%20Regulation%20and%20Ethics%20Policy%20Principles%20Document.pdf
