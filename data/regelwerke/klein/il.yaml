    zehn Jahre.'
  - 'פ/5600/25: Kennzeichnungspflicht fuer ausgestrahlte Werbung, die mit kuenstlicher Intelligenz erzeugt
    oder bearbeitet wurde — der einzige Entwurf, der ueber den Wahlkampf hinaus in den allgemeinen Werbemarkt
    greift.'
  - 'פ/6651/25: Modernisierung des Wahlwerbegesetzes von 1959 fuer soziale Netzwerke und KI-gestuetzte
    Werbung; Staerkung von Transparenz- und Verantwortlichkeitspflichten der Veroeffentlichenden bei ausdruecklicher
    Schonung der Inhalte politischer Botschaften; Strafschaerfung.'
  - 'Gemeinsames Merkmal: Alle Entwuerfe stammen von einzelnen Abgeordneten, keiner von der Regierung.
    Die Regierung hat in der KI-Frage bis September 2026 keinen einzigen Gesetzentwurf eingebracht.'
