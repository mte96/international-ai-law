    Inhalte vor der Verwendung kritisch zu pruefen und Tatsachen anhand externer Quellen zu verifizieren;
    vor der Eingabe personenbezogener Mandantendaten in offene KI-Systeme die ausdrueckliche schriftliche
    Einwilligung der Mandantschaft einzuholen und dabei Dokumentarten und Sicherheitsmassnahmen zu benennen;
    und auf die Eingabe persoenlicher oder sensibler Mandantendaten in offene Systeme zu verzichten, insbesondere
    identifizierender Angaben wie Namen und Anschriften. Es handelt sich um die erste standesrechtliche
    Positionierung einer israelischen Berufsorganisation zu generativer KI.
