  offizieller_titel: דין וחשבון של הוועדה הלאומית להאצת תחום הבינה המלאכותית — Din ve-cheshbon shel ha-vaada
    ha-leumit le-haatzat tchum ha-bina ha-melachutit (Bericht des Nationalen Ausschusses zur Beschleunigung
    des Bereichs der kuenstlichen Intelligenz)
