    verifiziert: true
    quelle: https://www.gov.il/BlobFolder/reports/report-06-11-24/he/ArtificialIntelligenceReport.pdf
  - datum: 2025-12-01
    was_gilt: Abschlussbericht mit neun Leitgrundsaetzen, zweistufiger Risikoklassifizierung und drei
      vertieften Anwendungsfeldern (Anlageberatung und Portfolioverwaltung, Verbraucherkredit, Versicherungszeichnung).
    verifiziert: true
    quelle: https://www.gov.il/BlobFolder/reports/report_0013/he/AI%20in%20the%20Financial%20Sector%20-%20Final%20Report%20Dec2025.pdf
  themenachsen:
  - sektor-finanz
  - governance
  - haftung
  - grundrechte
  - vertrag
  regelungsschwerpunkte:
  - 'Neun Leitgrundsaetze: Flexibilitaet und Anpassungsfaehigkeit; internationale Anschlussfaehigkeit;
    Innovationsfoerderung; Erprobungsinstrumente (Sandkaesten); neue Massnahmen nur bei Bedarf; Risikobasierung;
    Verbraucherschutz und Menschenrechte; Einheitlichkeit fuer gleichartige Dienste und Risiken; Technologieneutralitaet.'
  - 'Zweistufige Risikoklassifizierung: niedrig bis mittel und hoch. Erstbewertung durch die beaufsichtigte
    Stelle selbst; die Aufsicht kann umstufen oder ein System als hochriskant bestimmen. Die Maßnahmen
    folgen verhaeltnismaessig der Stufe.'
  - 'Erklaerbarkeit: keine allgemeine Pflicht. Verlangt nur bei hochriskanten Systemen mit wesentlicher
    Kundenwirkung und nur bei NACHTEILIGEN Entscheidungen (Kreditablehnung, nicht Kreditgewaehrung). Kompensierende
    Massnahmen (Systemkontrollen, alternative Servicewege) koennen an ihre Stelle treten; eine teilweise
    Einzelfallerklaerung kann genuegen; keine Pflicht, wenn die KI nur unterstuetzt. Die Stelle muss aber
    ihr eigenes System verstehen.'
  - 'Menschliche Beteiligung: nur wenn die Entscheidung den Einzelnen wesentlich betrifft UND hochriskant
    ist UND die Technologie eine wesentliche Rolle spielt UND keine angemessene Alternative besteht. Nicht
    verlangt bei Entscheidungsunterstuetzung, bei geringem Risiko und wenn ein menschlicher Servicekanal
    offensteht. Pauschale Anforderungen werden als Marktzutrittsschranke ausdruecklich abgelehnt.'
  - 'Offenlegung: dreiteilig — Pflichthinweis auf den Einsatz eines KI-Systems (jedenfalls in der Einfuehrungsphase,
    spaeter zu ueberpruefen); Integration von Angaben zu den Systemeigenschaften in die bestehenden Produktinformationen;
    Verbot irrefuehrender KI-Werbung ("AI washing"). Ausnahme, wo der Einsatz offensichtlich ist.'
  - 'Haftung: Die beaufsichtigte Stelle haftet dem Kunden gegenueber unveraendert; der Einsatz eines KI-Systems
    wird wie Auslagerung behandelt; der Verwaltungsrat bleibt fuer Einbindung und Risikomanagement verantwortlich;
    Haftungsbeschraenkungen gegenueber Kunden sind unzulaessig, ausser bei missbraeuchlicher Nutzung oder
    uebernommenem Risiko.'
  - 'Diskriminierung: Die bestehenden Antidiskriminierungsvorschriften gelten unveraendert auch fuer KI-Systeme;
    Ueberwachung ueber den gesamten Lebenszyklus.'
  - 'Drei vertiefte Anwendungsfelder: Anlageberatung und Portfolioverwaltung (aktive Foerderung, Aktualisierung
    der Richtlinie ueber digitale Werkzeuge, Klaerung der Behandlung von Chatbots und Allzwecksystemen);
    Verbraucherkredit (bestehende Rahmen anwenden, Klarstellung der Geltung des Diskriminierungsverbots,
    Erwaegung einer Offenlegungspflicht bei KI-gestuetzter Kreditvermarktung); Versicherungszeichnung
    (technologieneutrale Risikoregulierung anwenden, Anpassung bei Modellrisiko, Erklaerbarkeit und Hinweispflichten).'
  - 'Selbsteinschaetzung des Berichts: "Dieser Bericht ist nur ein Ausgangspunkt fuer die Behandlung des
    Themas." Regelmaessige Aktualisierung angekuendigt.'
