    typ: konsolidiert
    titel: חוק זכות יוצרים, התשס"ח-2007 — laufend gepflegte Textfassung mit Aenderungsnachweisen
    url: https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%96%D7%9B%D7%95%D7%AA_%D7%99%D7%95%D7%A6%D7%A8%D7%99%D7%9D
    sprache: he
    urheber: ויקיטקסט
    verifiziert: true
    notiz: 'NICHT amtlich. Am 05.09.2026 daraus im Wortlaut geprueft: § 19 (mit der offenen Zweckformel
      und der Verordnungsermaechtigung in Absatz c), § 20, § 21, § 22, § 26, §§ 33 bis 36. Die Kopfzeile
      weist Aenderungen bis תשפ"ו (S. 593 und 1030) aus und verweist ausserdem auf ein Verfahren בג"ץ
      49765-07-26, dessen Gegenstand nicht geprueft wurde.'
  offene_punkte:
  - Die Kopfzeile der konsolidierten Fassung verweist neben den Aenderungen von תשפ"ו auf ein Verfahren
    des Obersten Gerichtshofs (בג"ץ 49765-07-26), das offenbar Auswirkungen auf den Gesetzestext hat.
    Gegenstand und Tragweite sind nicht geprueft; ein KI-Bezug ist nicht erkennbar, aber auch nicht ausgeschlossen.
  - Es gibt bis September 2026 keine israelische Gerichtsentscheidung zum Training mit geschuetzten Inhalten.
    Die Rechtsauffassung des Justizministeriums ist unbestaetigt.
  - Die Verordnungsermaechtigung des § 19(c) ist nicht ausgeuebt. Ob die Regierung sie fuer eine Trainingsschranke
    nutzen will, ist offen und waere der einfachste Weg zu Rechtssicherheit ohne Gesetzgebungsverfahren.
  - Zur Schutzfaehigkeit maschinell erzeugter Ausgaben liegt keine israelische Entscheidung und keine
    Verwaltungsposition vor; die Stellungnahme von 2022 nimmt die Ausgabeseite ausdruecklich aus.
