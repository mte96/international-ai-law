      13 wieder und ist fuer die Paragrafenzaehlung nach 2025 unbrauchbar.
  offene_punkte:
  - Es fehlt eine amtliche englische Fassung des Gesetzes nach Tikkun 13. Wer auf Englisch zitiert, zitiert
    derzeit einen ueberholten Stand.
  - Die genaue Fundstelle des Tikkun 13 im Gesetzblatt (ס"ח התשפ"ד, עמ' 1430) stammt aus der Kopfzeile
    einer nicht amtlichen Textsammlung und ist nicht am Gesetzblatt geprueft.
  - Ob das Berichtigungsrecht nach § 14 tatsaechlich einen Anspruch auf Anpassung des Algorithmus traegt,
    ist eine Rechtsauffassung der Behoerde ohne gerichtliche Bestaetigung.
