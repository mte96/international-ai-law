    was_gilt: 'Beginn der Umsetzung: Freigabe der Ausschreibung "פרויקט נקסוס" (Projekt Nexus, nationale
      Quantenrechenplattform) und zweier Informationsabfragen (RFI) zu Physical AI und zu Basismodellen
      durch den Sonderausschuss fuer Ausschreibungen bei der Generalrechnungsfuehrerin.'
    verifiziert: true
    quelle: https://www.gov.il/he/pages/spoke-ai040826
  themenachsen:
  - governance
  - sektor-oeffentlich
  - arbeit
  - content
  - sicherheit-export
  - vertrag
  regelungsschwerpunkte:
  - 'Punkt 1: Souveraene KI-Infrastruktur — Ausbau der nationalen Rechenkapazitaeten, Aufbau souveraener
    Faehigkeiten bei Infrastruktur und Halbleitern; nationales Ziel von 100.000 Prozessoreinheiten fuer
    Anwendungen des Staates Israel.'
  - 'Punkt 2: Errichtung eines nationalen Quantenrechners, soweit moeglich auf israelischem Wissen und
    israelischen Technologien ("כחול-לבן", blau-weiss).'
  - 'Punkt 3: Internationale Buendnisse und Partnerschaften in KI und fortgeschrittener Technologie.'
  - 'Punkt 4: Humankapital — Ausbildung ueber alle Bevoelkerungsschichten hinweg, vom Schulwesen ueber
    die Hochschulen bis in den Arbeitsmarkt.'
  - 'Punkt 5: Nationale Vorbereitung auf die Veraenderungen des Arbeitsmarktes; Einrichtung eines nationalen
    Mechanismus fuer eine langfristige Politik. Der Beschluss enthaelt aber keine Beteiligungsrechte von
    Arbeitnehmer- und Arbeitgeberseite und keine Regeln fuer den KI-Einsatz in der Personalfuehrung —
    ein Kritikpunkt der arbeitsrechtlichen Stellungnahmen.'
  - 'Punkt 6: Nationales KI-Institut als Bindeglied zwischen Regierung, Wissenschaft, Industrie und Investoren,
    daneben "כורי האצה" (Beschleunigungsreaktoren) zur Umsetzung nationaler und globaler Herausforderungen
    in Anwendungen.'
  - 'Punkt 7: Nationaler Schwerpunkt auf Cyber AI und Physical AI sowie auf der Abwehr von Deepfake-Bedrohungen
    — der einzige regulatorisch anschlussfaehige Strang des Beschlusses.'
  - 'Punkt 8: Verbesserung der Buergerdienstleistung durch KI in der oeffentlichen Verwaltung (Verkuerzung
    von Bearbeitungs- und Wartezeiten, Informationszugang).'
  - 'Umsetzungsinstrument ist das Vergaberecht, nicht das Ordnungsrecht: Der Sonderausschuss fuer Ausschreibungen
    bei der Generalrechnungsfuehrerin ist die Stelle, ueber die der Beschluss Wirkung nach aussen entfaltet.'
