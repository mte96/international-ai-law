    url: https://www.law.co.il/media/computer-law/thaler1.pdf
    sprache: he
    urheber: בית המשפט המחוזי תל אביב-יפו, השופטת תמר אברהם — Bezirksgericht Tel Aviv-Jaffa, Richterin
