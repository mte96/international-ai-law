  regelungsschwerpunkte:
  - 'Zwei Schwerpunktfelder: (1) אוטומציה — vollstaendige Automatisierung von Aufgaben, die heute das
    Behandlungsteam ausfuehrt; (2) שינוי משימות — Neuverteilung der Arbeit zwischen den Mitgliedern des
    Behandlungsteams einschliesslich der Entwicklung neuer Berufsbilder.'
  - 'Vier ausdruecklich benannte regulatorische Herausforderungen: Aenderung von Verfahrensvorschriften
    oder Gesetzen zur Verschiebung klinischer Behandlungsbefugnisse; Fragen rechtlicher und beruflicher
    Verantwortung, wenn ein KI-System handelt; Risikomanagement bei der Verteilung dieser Verantwortung;
    Zulassung generativer KI-Werkzeuge.'
  - 'Ausdrueckliche Negativabgrenzung: reine Entscheidungsunterstuetzung ohne Verantwortungsuebernahme
    oder Befugnisverschiebung; Produkte, die nur eine Medizinproduktzulassung oder eine Genehmigung fuer
    eine klinische Pruefung benoetigen; reine Datenschutz-, Datensicherheits- oder Datenzugangsfragen.'
  - 'Reifegrad: ab TRL 6; Umsetzung im israelischen Gesundheitssystem binnen etwa zwei Jahren nach Pilotbeginn;
    verpflichtende Begleitung durch eine Regulierungsberatung mit Erfahrung in internationalen Zulassungsverfahren
    fuer Medizinsoftware.'
  - 'Bewertungskriterien: systemische Wirkung (Behandlungsqualitaet, Entlastung des Personals, Verfuegbarkeit),
    klinische und technische Machbarkeit, vorhandene Regulierungsstrategie und Risikomanagementplan, Bereitschaft
    zur kuenftigen Verbreitung in Israel einschliesslich attraktiver Preise fuer den israelischen Markt.'
  - 'Verfahren: individuelle Begleitplanung, Expertengremium aus Regulierung, Ethik, Klinik und Technologie,
    feste Ansprechperson (SPOC) im Ministerium, zweimonatliche Fortschrittsberichte, vierteljaehrliche
    Sitzungen; systemische Erkenntnisse fliessen in die kuenftige Regulierungspolitik ein.'
  - 'Ausdruecklicher Vorbehalt: Die Teilnahme begruendet keine Zusage einer Zulassung.'
