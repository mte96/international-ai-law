- id: il-moh-ki-sperre-2026
  jurisdiktion: il
  kurztitel: Sperrung offener KI-Werkzeuge in israelischen Krankenhaeusern (2026)
  offizieller_titel: Weisung des Gesundheitsministeriums zur Einstellung der Nutzung oeffentlicher und
    kostenfreier externer KI-Werkzeuge in den Netzen der Gesundheitsorganisationen (Maerz 2026), verschaerft
    durch technische Sperrung in staatlichen Krankenhaeusern (Juni 2026)
  fundstelle: Weisung vom Maerz 2026; Schreiben des Leiters Informationssicherheit und Cyber im Gesundheitsministerium
    (Reuven Eliyahu). Ein Rundschreibenzeichen ist nicht bekannt.
  verfahrensnummer: null
  status: softlaw
  status_detail: Nach Presseberichten seit Maerz 2026 als verbindliche Weisung gegenueber allen Gesundheitsorganisationen
    in Kraft; im Juni 2026 wurde der Zugang zu externen KI-Werkzeugen auf den Rechnern staatlicher Krankenhaeuser
    technisch gesperrt. Eine amtliche Fundstelle konnte nicht ermittelt werden; die Einordnung als softlaw
    ist ein Behelf, weil die Rechtsform der Weisung unbekannt ist.
  kurzbeschreibung: 'Waehrend die Regierung im Juni 2026 den Einsatz von KI in der oeffentlichen Verwaltung
    zum nationalen Ziel erklaerte, hat das Gesundheitsministerium den Beschaeftigten des Gesundheitswesens
    die Nutzung offener KI-Werkzeuge untersagt. Begruendet wird die Weisung mit dem starken Anstieg von
    Cyberbedrohungen: KI-Werkzeuge seien ein zentraler Angriffsvektor fuer komplexe Angriffe, Social Engineering
    und den Abfluss sensibler Daten aus Gesundheitsorganisationen. Verlangt werden die Einstellung der
    Nutzung externer KI-Werkzeuge in den Organisationsnetzen, der Umstieg auf gesicherte Werkzeuge und
    ein angemessenes Risikomanagement. Der Vorgang ist juristisch aufschlussreich, weil er zeigt, wie
    ein Staat ohne KI-Gesetz reguliert: nicht durch Verbotsnormen mit Rechtsschutz, sondern durch verwaltungsinterne
    Weisung und technische Sperre.'
