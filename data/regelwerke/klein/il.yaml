    (Wahlgesetz — Arten der Wahlwerbung)
  fundstelle: ס"ח התשי"ט; zuletzt geaendert durch die Aenderungen Nr. 42 und 43 im Gesetz ueber die Wahlen
    zur 26. Knesset (ס"ח 3546 vom 16.07.2026, S. 767 f.)
  verfahrensnummer: null
  status: anwendbar
  status_detail: Das Stammgesetz des israelischen Wahlwerberechts. Es traegt seit dem 16.07.2026 mit §
    2א2 die einzige Vorschrift des israelischen Rechts, die synthetische Inhalte einer Kennzeichnungspflicht
    unterwirft. Die Vorschrift ist befristet; die uebrigen Aenderungen (unter anderem die zeitlich unbeschraenkte
    Transparenzpflicht ueber die Identitaet des Werbenden) sind Dauerrecht.
  kurzbeschreibung: 'Das Gesetz regelt Zulaessigkeit, Formen und Grenzen der Wahlwerbung und gibt dem
    Vorsitzenden des Zentralen Wahlausschusses — traditionell ein Richter des Obersten Gerichtshofs —
    weitreichende Anordnungs- und Regelungsbefugnisse. Es ist damit in Israel das funktionale Aequivalent
    zu einem Medienaufsichtsrecht fuer Wahlkampfzeiten. Fuer die KI-Regulierung ist es deshalb bedeutsam,
    weil der israelische Gesetzgeber die Deepfake-Frage hier und nicht im allgemeinen Recht angesiedelt
    hat: Der Anwendungsbereich ist auf Wahlwerbung beschraenkt, die Durchsetzung liegt bei einem Einzelrichter
    mit Eilbefugnissen, und die Rechtsfolge ist eine Offenlegung, nicht ein Verbot.'
