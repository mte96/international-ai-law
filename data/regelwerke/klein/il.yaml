  regelungsschwerpunkte:
  - '§ 2א2 (eingefuegt 2026, befristet): Offenlegungspflicht fuer Wahlwerbung, die eine נחזות עמוקה ist;
    Legaldefinitionen von "digitalem Mittel" und "tiefer Scheinbarkeit"; Ermaechtigung des Wahlausschussvorsitzenden
    zum Erlass von Regeln ueber die Erfuellung der Pflicht.'
  - 'Transparenz der Werbenden: Die Pflicht, die Identitaet des Veroeffentlichenden einer Wahlanzeige
    anzugeben, gilt seit 2026 jederzeit und nicht mehr nur waehrend des Wahlkampfzeitraums.'
  - 'Institutionelle Besonderheit: Der Vorsitzende des Zentralen Wahlausschusses ist Richter des Obersten
    Gerichtshofs (fuer die 26. Knesset Vizepraesident Noam Sohlberg) und entscheidet in einem eigenen,
    schnellen Verfahren ueber Verstoesse. Das ist der Grund, weshalb die Kennzeichnungspflicht binnen
    Tagen durchgesetzt werden konnte.'
