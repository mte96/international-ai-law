- id: il-privacy-law-1981
  jurisdiktion: il
  kurztitel: Protection of Privacy Law 5741-1981 (Datenschutzgesetz)
  offizieller_titel: חוק הגנת הפרטיות, התשמ"א-1981 — Chok haganat ha-pratiut, ha-tashma-1981 (Gesetz zum
    Schutz der Privatheit)
  fundstelle: ס"ח (Sefer ha-Chukkim, Gesetzblatt) התשמ"א, עמ' 128 und 174; zahlreiche Aenderungen, zuletzt
    ס"ח התשפ"ד, עמ' 1430 (Tikkun 13, 2024)
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht in der Fassung des Tikkun 13 (Aenderungsgesetz Nr. 13) vom 14.08.2024,
    das am 14.08.2025 in Kraft getreten ist. Das Gesetz ist Israels einziges allgemeines Datenschutzgesetz
    und zugleich die einzige Rechtsgrundlage, aus der die Datenschutzbehoerde ihre KI-Aufsicht ableitet
    — ein KI-Gesetz gibt es nicht. Das Gesetz kennt bis heute KEINE Vorschrift ueber automatisierte Einzelentscheidungen
    oder Profiling; ein Aequivalent zu Art. 22 DSGVO fehlt.
  kurzbeschreibung: 'Das Gesetz schuetzt in Kapitel A die Privatheit als solche (§ 1 Verbot der Verletzung,
    § 2 abschliessender Katalog von elf bzw. inzwischen mehr Verletzungstatbestaenden, § 4 unerlaubte
    Handlung, § 5 Straftat) und regelt in Kapitel B den Umgang mit personenbezogenen Daten in Datenbanken.
    Nach Tikkun 13 lauten die Grundbegriffe מידע אישי (personenbezogene Daten), עיבוד (Verarbeitung),
    בעל שליטה (Verantwortlicher) und מידע בעל רגישות מיוחדת (Daten besonderer Sensibilitaet); sie stehen
    in § 3. Zentral fuer KI sind § 8 (Verarbeitung nur zum ordnungsgemaess festgelegten Zweck der Datenbank),
    § 11 (Hinweispflicht dessen, der Daten erhebt), §§ 13 und 14 (Einsicht und Berichtigung), § 17 (Datensicherheit),
    §§ 17ב1 bis 17ב3 (betrieblicher Datenschutzbeauftragter) und § 15א (pauschalierter Schadensersatz
    bis 10.000 NIS ohne Schadensnachweis). Sanktionen: Geldbussen der Datenschutzbehoerde in einem achtstufigen
    System mit einer Obergrenze von 5 Prozent des Jahresumsatzes bei schweren Verstoessen, dazu Straftatbestaende
    bis zu drei Jahren Freiheitsstrafe. Die praktisch wichtigste Eigenheit: Israel kennt keinen Katalog
    von Rechtsgrundlagen wie Art. 6 DSGVO — die Einwilligung ist im Ergebnis die einzige tragfaehige Grundlage.
    Genau daran haengt die gesamte israelische Diskussion ueber das Trainieren von Modellen mit Daten
    aus dem Netz.'
  inkrafttreten:
    datum: 1981-03-11
    verifiziert: true
    quelle: https://law.tau.ac.il/sites/law.tau.ac.il/files/law_lgbt/%D7%97%D7%95%D7%A7_%D7%94%D7%92%D7%A0%D7%AA_%D7%94%D7%A4%D7%A8%D7%98%D7%99%D7%95%D7%AA_0.pdf
    fundstelle_norm: 'ס"ח תשמ"א מס'' 1011 מיום 11.3.1981 עמ'' 128 — Veroeffentlichung in Reshumot; nach
      der allgemeinen Regel des israelischen Rechts (Auslegungsgesetz) tritt ein Gesetz am Tag der Veroeffentlichung
      in Kraft, soweit nichts anderes bestimmt ist. § 37 des Gesetzes bestimmt abweichend: ''תחילתו של
      פרק ב'' ששה חודשים מיום פרסומו של חוק זה'' (Kapitel B tritt sechs Monate nach der Veroeffentlichung
      in Kraft)'
  anwendungsdaten:
  - datum: 1981-09-11
    was_gilt: Kapitel B (פרק ב') — Datenbankenrecht, Registrierungs- und Sicherungspflichten; sechs Monate
      nach der Veroeffentlichung, § 37 des Gesetzes
    verifiziert: true
    quelle: https://ics.uci.edu/~kobsa/privacy/israel.htm
  - datum: 2025-08-14
    was_gilt: Tikkun 13 (חוק הגנת הפרטיות (תיקון מס' 13), התשפ"ד-2024) — Aufsichts- und Sanktionsbefugnisse
      der Datenschutzbehoerde, Pflicht zur Bestellung eines Datenschutzbeauftragten, verlaengerte Verjaehrung;
      ein Jahr nach der Ausfertigung vom 14.08.2024
    verifiziert: true
    quelle: https://www.loc.gov/item/global-legal-monitor/2025-11-17/israel-amendment-to-privacy-protection-law-goes-into-effect/
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - '§ 1: Verbot der Verletzung der Privatheit eines anderen ohne dessen Einwilligung — die Generalklausel,
    aus der die israelische Rechtsprechung auch dort schoepft, wo das Gesetz keine besondere Vorschrift
    kennt.'
  - '§ 2: abschliessender Katalog der Verletzungstatbestaende (Beschatten, unerlaubtes Abhoeren, Aufnahme
    im privaten Bereich, Veroeffentlichung eines Bildnisses und anderes). Fuer KI von Bedeutung, weil
    das israelische Recht keinen allgemeinen Persoenlichkeitsschutz kennt, der Deepfakes unabhaengig von
    diesen Tatbestaenden erfasste.'
  - '§ 3: Begriffsbestimmungen in der Fassung des Tikkun 13 — מידע אישי (personenbezogene Daten: Daten
    ueber eine bestimmte oder mit vertretbarem Aufwand unmittelbar oder mittelbar bestimmbare Person),
    עיבוד (Verarbeitung: jede Handlung an personenbezogenen Daten), בעל שליטה (Verantwortlicher), מחזיק
    (Auftragsverarbeiter/Besitzer), מידע בעל רגישות מיוחדת (Daten besonderer Sensibilitaet, u.a. Gesundheit,
    Genetik, Biometrie, Vorstrafen, politische und religiose Ueberzeugungen, Standort- und Finanzdaten),
    מזהה ביומטרי (biometrischer Identifikator).'
  - '§ 8: Fuehrung einer Datenbank und rechtmaessige Verarbeitung. § 8(b) enthaelt die Zweckbindung: Personenbezogene
    Daten in einer Datenbank duerfen nicht ausserhalb des ordnungsgemaess bestimmten Zwecks der Datenbank
    verarbeitet werden. Dies ist die Vorschrift, an der die Datenschutzbehoerde das Trainieren von Modellen
    mit fuer andere Zwecke erhobenen Daten misst.'
  - '§ 8א: Registrierungs- oder Meldepflicht in der Fassung des Tikkun 13. Registrierung nur noch fuer
    Datenbanken, deren Hauptzweck die Weitergabe von Daten an Dritte im geschaeftlichen Verkehr ist (ab
    10.000 Betroffenen), sowie fuer Datenbanken oeffentlicher Stellen; Meldepflicht binnen 30 Tagen bei
    Datenbanken mit Daten besonderer Sensibilitaet ueber mehr als 100.000 Personen.'
  - '§ 11: Pflicht dessen, der personenbezogene Daten verlangt — Hinweis darauf, ob eine Rechtspflicht
    zur Auskunft besteht, auf den Zweck, den Verantwortlichen, die Empfaenger und auf die Rechte auf Einsicht
    und Loeschung. Die Datenschutzbehoerde leitet daraus die Pflicht ab, offenzulegen, dass das Gegenueber
    ein KI-System ist.'
  - '§ 13 und § 13א: Einsichtsrecht in die eigenen personenbezogenen Daten, auch gegenueber Stellen, die
    die Daten nicht selbst halten.'
  - '§ 14: Berichtigung unrichtiger, unvollstaendiger, unklarer oder veralteter Daten. Die Datenschutzbehoerde
    vertritt die Auffassung, dieses Recht koenne in KI-Systemen auch die Berichtigung des Algorithmus
    erfassen, der die unrichtige Angabe erzeugt hat — ein bemerkenswert weiter Ansatz ohne Vorbild im
    Gesetzeswortlaut.'
  - '§ 15א: pauschalierter Schadensersatz (פיצויים לדוגמה) bis 10.000 NIS ohne Nachweis eines Schadens,
    eingefuehrt durch Tikkun 13, unter anderem bei Verstoessen gegen die Hinweispflicht und bei Verweigerung
    von Einsicht und Berichtigung.'
  - '§ 17: Verantwortlichkeit fuer die Datensicherheit; naeher ausgestaltet durch die Datensicherheitsverordnung
    von 2017.'
  - '§§ 17ב1 bis 17ב3: Pflicht zur Bestellung eines ממונה על הגנת הפרטיות (Datenschutzbeauftragter), dessen
    Aufgaben und Qualifikation. Erfasst sind oeffentliche Stellen, Datenhaendler, Stellen mit systematischer
    Beobachtung sowie Stellen, deren Haupttaetigkeit die Verarbeitung von Daten besonderer Sensibilitaet
    in grossem Umfang ist. Die Datenschutzbehoerde hat angekuendigt, gerade im KI-Kontext auf die Einhaltung
    dieser Pflicht zu achten.'
  - '§ 17ט1: gesetzliche Verankerung der הרשות להגנת הפרטיות (Datenschutzbehoerde) als eigenstaendige
    Einheit mit Budgetautonomie im Justizministerium — vorher beruhte sie nur auf Regierungsbeschluessen.'
  - '§ 17ט2: verbindliche Vorabauskunft (חוות דעת מקדמית) auf Antrag von Verantwortlichen; die Behoerde
    kann sie anonymisiert veroeffentlichen. Das ist das israelische Gegenstueck zum Konsultationsverfahren
    und der praktisch wichtigste Weg, KI-Vorhaben abzusichern.'
  - '§ 23ב: Verbot der Weitergabe personenbezogener Daten durch oeffentliche Stellen; Ausnahmen in § 23ג.
    Massgeblich fuer die vom Nagel-Ausschuss geforderte Oeffnung staatlicher Datenbestaende fuer KI-Training.'
  - 'Kapitel D3: Verwaltungssanktionen. Achtstufiges Bussgeldsystem, teils pro betroffener Person bemessen;
    Obergrenze bei schweren Verstoessen 5 Prozent des Jahresumsatzes — nominell strenger als Art. 83 DSGVO.
    Verdopplung bei Wiederholung binnen zwei Jahren; Beschwerde zum Amtsgericht binnen 45 Tagen.'
  - 'WAS FEHLT: keine Vorschrift ueber automatisierte Einzelentscheidungen, kein Profilingbegriff, kein
    Katalog von Rechtsgrundlagen. Die Einwilligung ist im Ergebnis die einzige Grundlage der Verarbeitung.
    Fuer KI ist das die zentrale Systemfrage des israelischen Rechts.'
