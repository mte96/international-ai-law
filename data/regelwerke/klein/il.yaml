- id: il-privacy-tikkun-13
  jurisdiktion: il
  kurztitel: Tikkun 13 — Aenderungsgesetz Nr. 13 zum Datenschutzgesetz
  offizieller_titel: חוק הגנת הפרטיות (תיקון מס' 13), התשפ"ד-2024 — Chok haganat ha-pratiut (tikkun mis.
    13), ha-tashpad-2024 (Gesetz zum Schutz der Privatheit, Aenderung Nr. 13)
  fundstelle: ס"ח (Sefer ha-Chukkim) התשפ"ד, עמ' 1430; verkuendet am 14.08.2024
  verfahrensnummer: Regierungsentwurf; Schlussabstimmung in der Knesset am 05.08.2024
  status: anwendbar
  status_detail: Am 05.08.2024 in dritter Lesung angenommen, am 14.08.2024 verkuendet, am 14.08.2025 in
    Kraft getreten (ein Jahr nach Verkuendung). Die groesste Reform des israelischen Datenschutzrechts
    seit 1996. Erste Bussgeldentscheidungen unter dem neuen Regime sind seit August 2025 ergangen.
  kurzbeschreibung: 'Tikkun 13 verwandelt das israelische Datenschutzrecht von einem Registrierungsregime
    in ein Aufsichtsregime nach europaeischem Vorbild — ohne allerdings dessen materielle Kernstuecke
    zu uebernehmen. Neu sind: eine an die Datenschutz-Grundverordnung angelehnte Begrifflichkeit (personenbezogene
    Daten, Verarbeitung, Verantwortlicher, Daten besonderer Sensibilitaet, biometrischer Identifikator);
    die Ablosung der allgemeinen Registrierungspflicht durch eine Meldepflicht; die Pflicht zur Bestellung
    eines Datenschutzbeauftragten fuer oeffentliche Stellen, Datenhaendler, Stellen mit systematischer
    Beobachtung und Stellen mit umfangreicher Verarbeitung sensibler Daten; die gesetzliche Verankerung
    der Datenschutzbehoerde mit Ermittlungs-, Durchsuchungs- und Sanktionsbefugnissen; ein achtstufiges
    Bussgeldsystem mit einer Obergrenze von 5 Prozent des Jahresumsatzes; pauschalierter Schadensersatz
    bis 10.000 NIS ohne Schadensnachweis; Verlaengerung der Verjaehrung zivilrechtlicher Anspruechhe von
    zwei auf sieben Jahre. Was Tikkun 13 NICHT bringt: keine Vorschrift zu automatisierten Entscheidungen,
    kein Profiling, keinen Katalog von Rechtsgrundlagen neben der Einwilligung, keine gesetzlich verankerte
    Datenschutz-Folgenabschaetzung. Fuer die KI-Aufsicht ist das die entscheidende Leerstelle.'
