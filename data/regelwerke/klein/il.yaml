  - datum: 2024-11-01
    was_gilt: Sonderbericht des Staatskontrolleurs stellt fest, dass keine eigene nationale KI-Verwaltungseinheit
      eingerichtet wurde und die Fuehrungsverantwortung ohne klare Zurechnung auf mehrere Stellen verteilt
      bleibt.
    verifiziert: true
    quelle: https://library.mevaker.gov.il/sites/DigitalLibrary/Documents/2024/2024.11-Cyber/2024.11-Cyber-107-AI.pdf
