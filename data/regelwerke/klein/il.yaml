  offizieller_titel: סוגיות לבחינת ניסויים קליניים התערבותיים בכלי בינה מלאכותית עבור ועדות הלסינקי —
    Sugyot le-vchinat nisuyim kliniim hitarvutiim be-klei bina melachutit avur vaadot Helsinki (Fragen
    zur Pruefung interventioneller klinischer Studien mit Werkzeugen kuenstlicher Intelligenz fuer die
    Helsinki-Kommissionen)
  fundstelle: Dokument des Gesundheitsministeriums vom 10.10.2024, veroeffentlicht ueber gov.il
  verfahrensnummer: null
  status: softlaw
  status_detail: Anwendungsleitfaden fuer die institutionellen Ethikkommissionen (Helsinki-Kommissionen).
    Er hat keine Rechtsnormqualitaet, praegt aber die Genehmigungspraxis fuer jede interventionelle klinische
    Pruefung mit KI in Israel.
  kurzbeschreibung: 'Das Dokument ist die erste israelische Vorgabe fuer die ethische Vorpruefung von
    KI in der klinischen Forschung. Es verlangt von den Antragstellern die Offenlegung der Trainingsdatenquellen,
    der algorithmischen Verfahren, der Modellgrenzen und der bisherigen Leistungsgeschichte, die Beschreibung
    der Mensch-System-Interaktion und der erforderlichen Anwenderqualifikation, die Bewertung der Datenqualitaet
    und der Verzerrung ueber Teilpopulationen hinweg, einen Plan zur laufenden Leistungsueberwachung samt
    dokumentierter Fehlererkennung, die Pruefung der Integration in die vorhandene klinische Infrastruktur
    einschliesslich Cybersicherheit sowie eine ausdrueckliche Aufklaerung der Teilnehmenden darueber,
    dass die Intervention kuenstliche Intelligenz einsetzt. Der Ansatz ist ausdruecklich verhaeltnismaessig:
    unterschiedliche Risikoprofile, unterschiedliche Anforderungen.'
