- id: il-patents-law
  jurisdiktion: il
  kurztitel: Patents Law 5727-1967 (Patentgesetz)
  offizieller_titel: חוק הפטנטים, התשכ"ז-1967 — Chok ha-patentim, ha-tashkaz-1967 (Patentgesetz)
  fundstelle: Gesetz vom 08.08.1967, mehrfach geaendert; konsolidierte englische Fassung Stand 2014 von
    der WIPO bereitgestellt
  verfahrensnummer: null
  status: anwendbar
  status_detail: Geltendes Recht. Der Patentkommissar hat am 15.03.2023 in den Anmeldungen 268604 und
    268605 (DABUS) entschieden, dass ein KI-System nicht als Erfinder benannt werden kann; das Bezirksgericht
    Tel Aviv-Jaffa hat diese Entscheidung am 31.12.2025 in עש"א 33353-05-23 bestaetigt. Eine Gesetzesaenderung
    ist nicht in Vorbereitung; beide Instanzen haben die Frage ausdruecklich dem Gesetzgeber zugewiesen.
  kurzbeschreibung: 'Das Patentgesetz enthaelt keine Definition des Erfinders. Genau daran ist das israelische
    DABUS-Verfahren gescheitert — nicht an einer ausdruecklichen Beschraenkung auf Menschen, sondern an
    der Systematik: § 1 definiert den "Inhaber einer Erfindung" als den Erfinder selbst oder denjenigen,
    der von ihm kraft Gesetzes, durch Uebertragung oder durch Vereinbarung ableitet; § 2 gibt nur dem
    Inhaber einer patentfaehigen Erfindung das Recht, ein Patent zu beantragen; § 11(b) verlangt von einem
    Anmelder, der nicht der Erfinder ist, die Darlegung, wie er die Rechte erworben hat; § 39 gibt dem
    Erfinder ODER SEINEN HINTERBLIEBENEN das Recht, die Nennung des Namens zu verlangen; § 42 erklaert
    einen Verzicht darauf fuer nichtig; § 76 vermutet die Inhaberschaft des Anmelders. Aus dieser Kette
    folgerten Kommissar und Gericht, dass nur eine Person Erfinder sein kann: Eine Maschine hat keine
    Hinterbliebenen, kann nichts verlangen und auf nichts verzichten und kann keine Rechte uebertragen.
    Sanktionen im engeren Sinn gibt es hier nicht; Rechtsfolge ist die Zurueckweisung der Anmeldung.'
  inkrafttreten:
    datum: 1967-08-08
    verifiziert: true
    quelle: https://www.jpo.go.jp/e/system/laws/gaikoku/document/index/israel-e_tokkyo.pdf
  anwendungsdaten:
  - datum: 2023-03-15
    was_gilt: 'Entscheidung des Patentkommissars (Ophir Alon) in den Anmeldungen 268604 und 268605: Der
      Begriff des Erfinders erfasst nur Menschen; die Anerkennung eines KI-Systems als Erfinder wirft
      rechtspolitische Fragen auf, die dem Gesetzgeber zustehen.'
    verifiziert: false
    quelle: https://www.law.co.il/computer-law/2023/03/15/thaler-patent-registration-requests-268604-268605/
  - datum: 2025-12-31
    was_gilt: 'Das Bezirksgericht Tel Aviv-Jaffa (Richterin Tamar Avraham) weist die Berufung עש"א 33353-05-23
      zurueck und bestaetigt: Eine Maschine kann nach dem Patentgesetz nicht Erfinderin sein; die Rechtspolitik
      ist Sache des Gesetzgebers.'
    verifiziert: true
    quelle: https://www.law.co.il/media/computer-law/thaler1.pdf
  themenachsen:
  - urheberrecht
  - governance
  regelungsschwerpunkte:
  - '§ 1 (Begriffsbestimmungen): "owner of an invention" — der Erfinder selbst oder derjenige, der von
    ihm kraft Gesetzes, durch Uebertragung oder durch Vereinbarung ableitet. Der Erfinder selbst wird
    NICHT definiert.'
  - '§ 2: Nur der Inhaber einer patentfaehigen Erfindung ist berechtigt, die Erteilung eines Patents zu
    beantragen.'
  - '§ 3: patentfaehige Erfindung — Erzeugnis oder Verfahren auf einem beliebigen Gebiet der Technik,
    neu, nuetzlich, gewerblich anwendbar und auf erfinderischer Taetigkeit beruhend.'
  - '§ 11: Die Anmeldung muss den Namen des Anmelders, eine Zustellanschrift in Israel und eine Beschreibung
    der Erfindung enthalten; nach § 11(b) hat ein Anmelder, der nicht der Erfinder ist, darzulegen, wie
    er die Rechte erworben hat. An dieser Vorschrift scheiterte Thaler: Er konnte keinen Erwerbsvorgang
    von DABUS darlegen, weil eine Maschine nichts uebertragen kann.'
  - '§ 39: Der Erfinder, fuer dessen Erfindung ein Patent beantragt wurde, ODER SEINE HINTERBLIEBENEN
    koennen verlangen, dass der Name des Erfinders in der Beschreibung, im Register und in der Patenturkunde
    genannt wird. Die Erwaehnung der Hinterbliebenen war fuer das Gericht ein tragendes Wortlautargument.'
  - '§ 42: Eine Vereinbarung, mit der der Erfinder auf das Recht auf Namensnennung verzichtet, ist nichtig.
    Auch das setzt Rechtsfaehigkeit voraus.'
  - '§ 76: Vermutung, dass der Anmelder Inhaber der Erfindung ist, solange nichts anderes bewiesen wird.'
  - 'Auslegungsmethode des Bezirksgerichts: Wortlaut im Kontext, sodann subjektiver Zweck aus der Entstehungsgeschichte
    von 1967 (Betonung der Einzigartigkeit des Erfinders und des vorrangigen Schutzes des Erfinders).
    Ergebnis: Der Gesetzgeber hat nur Menschen vor Augen gehabt; die Ausweitung ist rechtspolitisch und
    daher dem Gesetzgeber vorbehalten, auch mit Blick auf internationale Harmonisierung.'
