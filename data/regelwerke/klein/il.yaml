- id: il-copyright-act-2007
  jurisdiktion: il
  kurztitel: Copyright Act 5768-2007 (Urheberrechtsgesetz)
  offizieller_titel: חוק זכות יוצרים, התשס"ח-2007 — Chok zchut yotsrim, ha-tashach-2007 (Urheberrechtsgesetz)
  fundstelle: 'ס"ח (Sefer ha-Chukkim) התשס"ח, עמ'' 38 und 82 (verkuendet 25.11.2007, Heft 2199, S. 34);
    spaetere Aenderungen: תשע"א עמ'' 993; תשע"ד עמ'' 458; תשע"ז עמ'' 504 und 1201; תשע"ט עמ'' 187; תשפ"ו
    עמ'' 593 und 1030'
  verfahrensnummer: null
  status: anwendbar
  status_detail: 'Verabschiedet am 19.11.2007, in Kraft seit 25.05.2008. Mehrfach geaendert, zuletzt 2025/26
    (תשפ"ו) unter anderem bei der oeffentlichen Auffuehrung (§ 13), der Anpassung fuer Menschen mit Behinderungen
    (§ 28א) und der Auffuehrung in Bildungseinrichtungen (§ 29). Eine KI-bezogene Aenderung ist bis September
    2026 nicht ergangen: Es gibt weder eine Text- und Data-Mining-Schranke noch eine Vorschrift ueber
    computererzeugte Werke noch eine Kennzeichnungs- oder Offenlegungspflicht fuer Trainingsdaten.'
  kurzbeschreibung: 'Das israelische Urheberrecht ist der Grund, weshalb Israel im internationalen Streit
    um Trainingsdaten eine Sonderstellung einnimmt. § 19 kennt eine Fair-Use-Schranke nach amerikanischem
    Vorbild mit einer OFFENEN Zweckliste ("למטרות כגון אלה" — fuer Zwecke wie diese) und den vier bekannten
    Abwaegungsfaktoren; anders als die geschlossenen Schrankenkataloge des kontinentaleuropaeischen Rechts
    kann sie neue Nutzungsarten aufnehmen, ohne dass der Gesetzgeber taetig wird. Genau darauf stuetzt
    sich die Rechtsauffassung des Justizministeriums vom 18.12.2022, wonach das Trainieren von Modellen
    mit geschuetzten Inhalten ausser in Ausnahmefaellen keine Rechtsverletzung ist. Daneben stehen § 22
    (beilaeufige Nutzung) und § 26 (voruebergehende Vervielfaeltigung), auf die die Stellungnahme hilfsweise
    abstellt. Nach § 33 Nr. 1 ist der Urheber (היוצר) erster Inhaber des Rechts; eine Vorschrift ueber
    computererzeugte Werke wie s. 9(3) des britischen CDPA fehlt, ebenso eine Legaldefinition des Urhebers.
    Sanktionen: zivilrechtlich Unterlassung, Schadensersatz und pauschalierter Schadensersatz bis 100.000
    NIS je Verletzung ohne Schadensnachweis (§ 56), strafrechtlich Freiheitsstrafe bei gewerbsmaessiger
    Verletzung (§ 61).'
  inkrafttreten:
    datum: 2008-05-25
    verifiziert: true
    quelle: https://www.wipo.int/wipolex/en/legislation/details/11509
  anwendungsdaten:
  - datum: 2007-11-25
    was_gilt: Verkuendung in Reshumot, Sefer ha-Chukkim Heft 2199, S. 34.
    verifiziert: true
    quelle: https://www.wipo.int/wipolex/en/legislation/details/11509
  - datum: 2022-12-18
    was_gilt: Das Justizministerium legt die §§ 19, 22 und 26 fuer das maschinelle Lernen aus und erklaert
      das Training mit geschuetzten Inhalten ausser in Ausnahmefaellen fuer zulaessig.
    verifiziert: true
    quelle: https://www.gov.il/BlobFolder/legalinfo/machine-learning/he/18-12-2022.pdf
  themenachsen:
  - urheberrecht
  - gpai
  - content
  regelungsschwerpunkte:
  - '§ 4: Werke, an denen Urheberrecht besteht (Original-Werke der Literatur, Kunst, Dramatik und Musik
    sowie Tontraeger). Das Erfordernis der Originalitaet ist die Schwelle, an der in Israel — wie anderswo
    — die Schutzfaehigkeit rein maschinell erzeugter Ausgaben scheitert; eine ausdrueckliche gesetzliche
    Regelung fehlt.'
  - '§ 11: Inhalt des Urheberrechts (Vervielfaeltigung, oeffentliche Auffuehrung, Sendung, Zugaenglichmachung,
    Bearbeitung, Vermietung).'
  - '§ 18 und § 19: Erlaubte Nutzungen; § 19(a) — "שימוש הוגן ביצירה מותר למטרות כגון אלה: לימוד עצמי,
    מחקר, ביקורת, סקירה, דיווח עיתונאי, הבאת מובאות, או הוראה ובחינה על ידי מוסד חינוך" (Die faire Nutzung
    eines Werkes ist erlaubt fuer Zwecke WIE DIESE: Selbststudium, Forschung, Kritik, Rezension, journalistische
    Berichterstattung, Zitat oder Unterricht und Pruefung durch eine Bildungseinrichtung). Die Wendung
    "כגון אלה" macht die Liste offen — das ist der entscheidende Unterschied zu Art. 5 InfoSoc-RL und
    zu §§ 44a ff. UrhG.'
  - '§ 19(b): Abwaegungsfaktoren — Zweck und Charakter der Nutzung; Art des genutzten Werkes; Umfang der
    Nutzung qualitativ und quantitativ im Verhaeltnis zum ganzen Werk; Auswirkung der Nutzung auf den
    Wert des Werkes und seinen potentiellen Markt. Wortgleich mit 17 U.S.C. § 107.'
  - '§ 19(c): VERORDNUNGSERMAECHTIGUNG — "השר רשאי לקבוע תנאים שבהתקיימם ייחשב שימוש לשימוש הוגן" (Der
    Minister kann Bedingungen bestimmen, bei deren Vorliegen eine Nutzung als faire Nutzung gilt). Israel
    hat damit seit 2007 ein Instrument, um die Trainingsfrage durch Rechtsverordnung zu klaeren. Es ist
    bis September 2026 nicht benutzt worden. Wer die israelische Lage beurteilt, sollte das wissen: Der
    Verzicht auf eine TDM-Regelung ist eine Entscheidung, kein Versaeumnis des Gesetzgebers.'
  - '§ 22: beilaeufige Nutzung eines Werkes durch Einbeziehung in ein anderes Werk — vom Justizministerium
    fuer solche Trainingsvorhaben herangezogen, in denen das einzelne Werk im Gesamtsystem verschwindet.'
  - '§ 26: voruebergehende Vervielfaeltigung. Sie ist erlaubt, wenn sie untrennbarer Teil eines technischen
    Vorgangs ist, dessen EINZIGER Zweck die Uebermittlung des Werkes zwischen Parteien in einem Kommunikationsnetz
    durch einen Vermittler oder die Ermoeglichung einer anderen rechtmaessigen Nutzung ist, und der Vervielfaeltigung
    kein eigener wirtschaftlicher Wert zukommt. Das Justizministerium raeumt selbst ein, seine Anwendung
    auf geloeschte Trainingsdatensaetze sei eine weite Auslegung.'
  - '§ 33 Nr. 1: Der Urheber eines Werkes ist erster Inhaber des Urheberrechts. Das Gesetz definiert den
    Urheber nicht; §§ 34 (Arbeitnehmerwerk), 35 (Auftragswerk) und 36 (Werke des Staates) setzen durchweg
    eine Person voraus.'
  - '§§ 38 ff.: Schutzdauer, bemessen nach dem Tod des Urhebers — eine weitere Vorschrift, die eine natuerliche
    Person voraussetzt und einer Zuordnung maschinell erzeugter Ausgaben entgegensteht.'
  - '§§ 45 f.: Urheberpersoenlichkeitsrecht als persoenliches Recht.'
  - '§ 56: pauschalierter Schadensersatz bis 100.000 NIS je Verletzung ohne Schadensnachweis — in der
    israelischen Praxis das schaerfste Schwert und der Grund, weshalb die Rechtssicherheit der Ministeriumsauffassung
    fuer Anbieter erheblichen wirtschaftlichen Wert hat.'
