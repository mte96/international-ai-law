  regelungsschwerpunkte:
  - Genehmigungspflichten fuer Vermittlung (brokering), Durchfuhr (transshipment) und technische Unterstuetzung
    — bisher nur unvollstaendig geregelte Taetigkeiten.
  - Auffangtatbestand fuer nicht gelistete Gueter bei Verdacht auf Verwendung fuer Massenvernichtungswaffen,
    Umgehung von Sanktionen oder terroristische Zwecke.
  - Verwaltungs- und Strafsanktionen einschliesslich persoenlicher Verantwortlichkeit von Organen.
