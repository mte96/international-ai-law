    Verantwortlicher) mit gestuften Pflichten.
  - Pflicht zur Fuehrung eines Datenbankverzeichnisses und zur schriftlichen Sicherheitsvorschrift.
  - Meldepflicht bei schweren Sicherheitsereignissen — nach Auffassung der Datenschutzbehoerde erfasst
    das das unerlaubte Abgreifen personenbezogener Daten (Scraping) durch Dritte.
  - Bussgelder nach Tikkun 13, gestaffelt nach Sicherheitsstufe (Anlage 3 zum Datenschutzgesetz), bis
    640.000 NIS.
