  - datum: 2025-08-12
    was_gilt: 'Oeffentlicher Widerstand: Finanzministerium, Verband der Industriellen und ein Forum von
      rund 25 Wachstumsunternehmen wenden sich gegen den Entwurf, insbesondere gegen die Behandlung des
      Scrapings und gegen die Uebertragung der Logik alter Datenbankregulierung auf Modelle.'
    verifiziert: true
    quelle: https://www.law.co.il/news/2025/08/12/industry-and-mof-against-ppa-ai-privacy-guidelines/
  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  - governance
  regelungsschwerpunkte:
  - 'Grundsatz 1 — Reichweite: Das Datenschutzgesetz gilt nicht nur fuer die in ein KI-System eingegebenen
    personenbezogenen Daten, sondern auch fuer personenbezogene Daten, die das System aus den Eingaben
    ableitet. Damit werden Inferenzen, Vorhersagen und Klassifizierungen selbst zu geschuetzten Daten.'
  - 'Grundsatz 2 — Rechtsgrundlage in jeder Phase: Fuer jede Phase des Lebenszyklus (Entwicklung und Training
    der Modelle, tatsaechlicher Einsatz) ist eine Rechtsgrundlage erforderlich. Da das israelische Recht
    keinen Katalog wie Art. 6 DSGVO kennt, laeuft das praktisch auf die Einwilligung hinaus.'
  - 'Grundsatz 3 — Einwilligung und Aufklaerung: Wirksame Einwilligung setzt eine Beschreibung der Arbeitsweise
    des Systems in der zur Willensbildung erforderlichen Detailtiefe voraus (unter Beruecksichtigung technischer
    Grenzen). Wer mit einem automatisierten System ("בוט") und nicht mit einem Menschen spricht, ist darauf
    hinzuweisen, wenn das fuer die Einwilligung wesentlich ist.'
  - 'Grundsatz 4 — Scraping: Das Abgreifen personenbezogener Daten aus dem Netz zum Training bedarf der
    informierten Einwilligung des Betroffenen. Die Behoerde betont ausdruecklich, dass die Veroeffentlichung
    eigener Daten im Netz und in sozialen Netzwerken NICHT ohne Weiteres auf eine Einwilligung zur Nutzung
    fuer die Entwicklung von KI-Systemen schliessen laesst. Beispiel im Text: Name und Bild aus einem
    persoenlichen Profil duerfen nicht zum Training eines Gesichtserkennungsalgorithmus oder zum Aufbau
    einer entsprechenden Datenbank verwendet werden.'
  - 'Grundsatz 5 — Pflichten der Plattformen: Digitale Dienste, die das Teilen personenbezogener Daten
    ermoeglichen, muessen Massnahmen gegen unerlaubtes Scraping ergreifen. Unerlaubtes Scraping aus einer
    Datenbank ist ein "אירוע אבטחה חמור" (schweres Sicherheitsereignis) und daher nach der Datensicherheitsverordnung
    unverzueglich der Datenschutzbehoerde zu melden.'
  - 'Grundsatz 6 — Berichtigung: Das Recht auf Berichtigung unrichtiger Daten nach § 14 kann in KI-Systemen
    auch die Berichtigung des Algorithmus erfassen, der die unrichtige Angabe erzeugt hat.'
  - 'Grundsatz 7 — Rechenschaft: Die Behoerde kuendigt an, die Pflicht zur Bestellung eines Datenschutzbeauftragten
    gerade im KI-Kontext durchzusetzen, und wirbt weiter fuer die Datenschutz-Folgenabschaetzung (תסקיר
    השפעה על הפרטיות) — die im israelischen Recht anders als in Art. 35 DSGVO NICHT gesetzlich vorgeschrieben,
    sondern nur empfohlen ist.'
  - 'Kapitelfolge des Entwurfs: Einleitung; die Leitlinie und der KI-Begriff; informierte Einwilligung
    und Transparenz; Rechenschaft (Datenschutzbeauftragter, Folgenabschaetzung); Datenrichtigkeit und
    Betroffenenrechte; Datensicherheit; Scraping; Registrierungspflichten nach Tikkun 13.'
