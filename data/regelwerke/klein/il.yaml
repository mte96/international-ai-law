- id: il-deepfake-strafentwuerfe
  jurisdiktion: il
  kurztitel: Private Gesetzentwuerfe zu Deepfakes und KI-Werbung (2025/2026)
  offizieller_titel: הצעת חוק העונשין (תיקון — עבירות זיוף עמוק) und weitere private Gesetzentwuerfe —
    Strafgesetzentwuerfe zu Deepfake-Straftatbestaenden sowie Entwuerfe zur Kennzeichnung von Werbung
    und digitaler Wahlwerbung
  fundstelle: 'Private Gesetzentwuerfe der 25. Knesset: פ/5411/25 vom 27.01.2025; פ/5600/25 vom 10.03.2025;
    פ/5677/25 vom 31.03.2025; פ/6312/25 vom 26.11.2025; פ/6651/25 vom 15.05.2026'
  verfahrensnummer: פ/5411/25, פ/5600/25, פ/5677/25, פ/6312/25, פ/6651/25
  status: entwurf
  status_detail: Sämtlich private Gesetzentwuerfe der 25. Knesset; keiner ist verabschiedet worden. Statt
    ihrer hat der Gesetzgeber im Juli 2026 den befristeten wahlrechtlichen Weg gewaehlt. Mit dem Ende
    der 25. Knesset im Vorfeld der Wahl vom 27.10.2026 verfallen sie, soweit die naechste Knesset nicht
    das Kontinuitaetsverfahren beschliesst.
  kurzbeschreibung: 'Israel hat seit Anfang 2025 mehrere Anlaeufe erlebt, Deepfakes strafrechtlich und
    werberechtlich zu erfassen. Der weitestgehende Entwurf, פ/6312/25 des Abgeordneten Yasser Khogairat
    vom 26.11.2025, wuerde das Strafgesetzbuch um Deepfake-Straftatbestaende ergaenzen: Verbreitung zur
    Rufschaedigung oder zur Erregung oeffentlicher Furcht zwei Jahre Freiheitsstrafe; sexuelle Deepfake-Inhalte
    fuenf Jahre; taeuschende Verbreitung zur Erlangung eines Vorteils sieben Jahre; Deepfakes zur Beeinflussung
    von Wahlen zehn Jahre. Daneben stehen ein Entwurf zur Kennzeichnung von mit KI erzeugter oder bearbeiteter
    Werbung (פ/5600/25) und ein Entwurf zur digitalen und KI-gestuetzten Wahlwerbung mit Strafschaerfungen
    (פ/6651/25 des Abgeordneten Ethan Ginzburg). Der Befund ist aussagekraeftig: Israel hat die schaerferen
    Instrumente erwogen und sich fuer die mildeste Variante entschieden — eine befristete Offenlegungspflicht
    ohne ausdrueckliche Strafdrohung, beschraenkt auf Wahlwerbung.'
