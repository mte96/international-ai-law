  - position: Verbot statt Offenlegung — die Emotionsauswertung ist auch aggregiert unzulässig
    gericht: Garante per la protezione dei dati personali, Avvertimento vom 28.05.2026
    begruendung: 'Die Konstellation wirkt zunächst unbedenklich: Die Beschäftigten nehmen freiwillig teil,
      Verantwortlicher ist ein drittes Unternehmen, der Arbeitgeber erhält weder Kommunikationsinhalte
      noch Einzelergebnisse, sondern nur aggregierte Belastungsberichte. Der Garante durchschneidet das
      mit einem Argument, das die ganze Kategorie der Wohlbefindens-KI erfasst: Erlaubt die aggregierte
      Auswertung Rückschlüsse auf Teams oder Einzelne, ist die Zwischenschaltung eines Dritten als Verantwortlichem
      eine Umgehungskonstruktion — es handelt sich um Informationen, die der Arbeitgeber nicht rechtmäßig
      erlangen darf. Verlangt werden Schutzvorkehrungen bereits in der Entwurfsphase. Verfahrensrechtlich
      ist die Entscheidung der eigentliche Befund: Die Verbotstatbestände der KI-Verordnung gelten seit
      dem 02.02.2025, ihre Sanktionsarchitektur greift später — der Garante nutzt deshalb die Warnung
      nach Art. 58 Abs. 2 lit. a DSGVO als Vehikel. Die Datenschutzaufsicht vollzieht die KI-Verordnung,
      bevor die KI-Aufsicht arbeitsfähig ist.

      '
    urteile:
    - it-2026-garante-ia-lavoro-stress
  - position: Die Vorfrage — vorbereitende Verarbeitung ist keine automatisierte Entscheidung
    gericht: Bundesverwaltungsgericht Wien, 18.12.2020 – W256 2235360-1 (AMAS); dagegen Datenschutzbehörde,
      25.09.2025 – 2025-0.355.103
    begruendung: 'Das BVwG hob die Untersagung des Arbeitsmarktchancen-Assistenz-Systems ersatzlos auf:
      Art. 22 DSGVO setze voraus, dass eine Entscheidung ausschließlich auf automatisierter Verarbeitung
      beruht; eine Verarbeitung, die eine menschliche Entscheidung lediglich vorbereitet und unterstützt,
      falle nicht darunter. Das Modell gewichtete Geschlecht, Alter, Staatsangehörigkeit, Betreuungspflichten
      und gesundheitliche Beeinträchtigung und steuerte die Zuteilung von Fördermitteln — die Rechtsgrundlage
      fand das Gericht in § 25 AMSG i.V.m. Art. 9 Abs. 2 lit. g DSGVO. Damit ist der Anspruch nicht abgewogen,
      sondern am Anwendungsbereich gescheitert. Fünf Jahre später kehrt dieselbe Behörde die Wertung um:
      In der RiskScore-Entscheidung genügt bereits die automatisierte Erstellung eines Wahrscheinlichkeitswerts,
      von dem maßgeblich abhängt, ob ein Dritter ein Vertragsverhältnis begründet. Die Zweiteilung ist
      bemerkenswert und für das Beschäftigungsrecht unmittelbar übertragbar: Der Score-Ersteller haftet
      nach Art. 22 DSGVO, der Score-Verwender kann sich auf die Erforderlichkeitsausnahme berufen — das
      ist die europäische Spiegelung der amerikanischen Agentenfrage, nur mit umgekehrtem Vorzeichen.

      '
    urteile:
    - at-2020-bvwg-ams-algorithmus
    - at-2025-dsb-riskscore-verarbeitungsverbot
  - position: Nicht Statistik, sondern Zugänglichkeit — der Weg über die angemessene Vorkehrung
    gericht: Colorado Civil Rights Division und EEOC, Verwaltungsbeschwerde vom 19.03.2025 (D.K. ./. Intuit
      und HireVue); zum Kontrast E.D.N.Y., consent decree vom 09.08.2023 (EEOC ./. iTutorGroup)
    begruendung: 'Der dogmatisch belastbarste Weg, weil er die Schwäche des disparate-impact-Ansatzes
      vermeidet. Der Vorwurf ist nicht statistisch — Bewerber über vierzig würden seltener eingeladen
      —, sondern technisch: Das Erkennungssystem funktioniert bei dieser Person nachweislich schlechter.
      Eine gehörlose indigene Beschäftigte macht geltend, das Videointerviewsystem habe ihre Antworten
      über automatische Spracherkennung transkribiert, deren Fehlerrate bei abweichendem Sprachbild und
      bei nicht-weißen Sprechern erhöht sei; sie habe trotz guter Beurteilungen künstlich niedrige Bewertungen
      erhalten und keine angemessene Vorkehrung bekommen. Damit wird aus der Diskriminierungs- eine Vorkehrungsfrage
      nach dem ADA, und die verlangt keinen statistischen Beweis, sondern nur den Nachweis, dass eine
      zumutbare Alternative bestand. Das ist der Weg, auf dem algorithmische Diskriminierung im US-Recht
      justiziabel bliebe, wenn die disparate-impact-Doktrin weiter zurückgedrängt wird; in der Union liefe
      derselbe Sachverhalt über die Barrierefreiheitsanforderungen und Anhang III Nr. 4 KI-VO. Der Kontrast
      zu iTutorGroup ist lehrreich: Der einzige abgeschlossene EEOC-Fall des Feldes betraf einen fest
      einprogrammierten Altersschwellenwert — eine if-Abfrage, kein Modell — und trägt deshalb für Proxy-Variablen,
      Intransparenz und Beweislast nichts. Seit dem Regierungswechsel 2025 hat die EEOC ihre KI-Leitlinien
      von der Website entfernt und kein weiteres Verfahren eingeleitet; die Durchsetzung liegt bei Privatklägern
      und einzelstaatlichen Behörden.

      '
    urteile:
    - us-2025-aclu-intuit-hirevue
    - us-2023-eeoc-itutorgroup
  - position: Information statt Haftung — der einzelstaatliche und der deutsche Weg
    gericht: Gesetzgeber von Illinois (HB 3773), New York City (Local Law 144), Colorado (SB 24-205, aufgehoben;
      SB 26-189) und Connecticut (CART Act); für Deutschland Arbeitsgericht Hamburg, 16.01.2024 – 24 BVGa
      1/24
    begruendung: 'Die einzelstaatliche Gesetzgebung verzichtet auf die Zurechnungsfrage und antwortet
      mit Informations- und Prüfpflichten des Arbeitgebers: Illinois untersagt die diskriminierende Wirkung
      und ausdrücklich die Postleitzahl als Stellvertretermerkmal, New York City verlangt einen jährlichen
      unabhängigen Bias Audit mit veröffentlichter Zusammenfassung und Vorabinformation zehn Werktage
      vor dem Einsatz, Connecticut die schriftliche Vorabinformation, wenn das System substantial factor
      ist. Colorado hat den EU-nahen Risikoansatz vor der ersten Anwendung wieder aufgegeben und durch
      ein Transparenz- und Auskunftsregime ersetzt. Deutschland hat dazu genau eine veröffentlichte Entscheidung,
      und sie verneint die Mitbestimmung — allerdings nur für eine schmale Konstellation: private Accounts,
      browserbasiert, kein Arbeitgeberzugriff auf Nutzungsdaten. Kehrt der Arbeitgeber eines dieser Merkmale
      um, greift § 87 Abs. 1 Nr. 6 BetrVG wieder. Als Argument gegen jede KI-Mitbestimmung wird die Entscheidung
      regelmäßig überdehnt zitiert; eine Entscheidung des Bundesarbeitsgerichts zu KI existierte am 27.08.2026
      nicht.

      '
