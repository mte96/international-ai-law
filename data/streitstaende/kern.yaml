  - position: Nicht unbegründet, sondern nicht wirksam eingelegt — die Sanktion über die Zulässigkeit
    gericht: Cámara de Apelación en lo Civil y Comercial de Morón, Sala I, 15.09.2025 (Causa N.º 19.435)
    begruendung: 'Die prozessual eleganteste Lösung des gesamten Bestandes und die einzige, die ohne jede
      Verschuldensprüfung auskommt. Eine Berufungsbegründung, die ausschließlich auf Fundstellen gestützt
      ist, die sich in keiner amtlichen Datenbank nachweisen lassen, ist keine „crítica concreta y razonada"
      im Sinne des Art. 260 CPCC der Provinz Buenos Aires; die Berufung ist deshalb nicht unbegründet,
      sondern verlassen („desierto"), und die Kosten trägt der Berufungsführer. Das ist die schärfere
      Folge als jede Ordnungsstrafe, weil sie die Instanz kostet. Eine Sanktion hat die Kammer ausdrücklich
      nicht verhängt, sondern nur angeregt, der örtliche Colegio de Abogados möge seine Mitglieder auf
      die Prüfpflicht hinweisen. Für das deutsche Recht liegen die Parallelen in § 520 Abs. 3 ZPO und
      § 344 StPO; dort ist die Frage, wie mit halluzinierten Fundstellen umzugehen ist, bislang nicht
      gestellt worden. Dass die Kammer Mata v. Avianca ausdrücklich zitiert, ist der deutlichste Beleg
      für die Zirkulation der amerikanischen Halluzinationsrechtsprechung in Lateinamerika.

      '
