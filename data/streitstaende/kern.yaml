  - position: Kein Betrag, sondern Statusverlust — Rüge, Mandatsentbindung und Verweisung an die Aufsicht
    gericht: N.D. Ala. (Manasco J), Johnson v. Dunn, 23.07.2025; Second Circuit, Park v. Kim, 30.01.2024;
      High Court of Justice (Divisional Court), Ayinde und Al-Haroun, 06.06.2025; Upper Tribunal (IAC),
      MS (Bangladesh), 12.08.2025, und [2026] UKUT 81 (IAC); FedCFamC2G (Skaros J), Valu (No 2), 31.01.2025;
      FedCFamC2F, Dayal, 27.08.2024; High Court of Justice (Ch), Choksi, 04.11.2025
    begruendung: 'Die zweite Hauptlinie verzichtet auf Geld und greift zum Status. Johnson v. Dunn sprach
      eine öffentliche Rüge aus, entband die Anwälte der Kanzlei Butler Snow von der Vertretung in diesem
      Verfahren und verwies sie an die Kammer; das Argument, die erfundenen Zitate seien inhaltlich durch
      echte Entscheidungen gedeckt, verwarf das Gericht, weil es "the siren call of unverified AI" verstärke.
      Der Second Circuit hatte den Maßstab formuliert, der seither weltweit zitiert wird — Anwälte müssen
      die Autoritäten "read, and thereby confirm the existence and validity of" — und ohne Betrag an sein
      Grievance Panel verwiesen. Der englische Divisional Court entwickelte in Ayinde den vollständigen
      Sanktionskatalog — öffentliche Rüge, Kostenentscheidung, wasted costs order, Zurückweisung des Vortrags,
      Verweisung an die Aufsicht, Kontemptverfahren, Anzeige bei der Polizei — und stellte fest, die bloße
      Ermahnung sei außer in Ausnahmefällen keine ausreichende Reaktion; die Pflicht trifft ausdrücklich
      auch den, der sich auf fremde Recherche stützt. MS (Bangladesh) fügte mit amtlichem Leitsatz hinzu:
      "taking unprofessional short-cuts which will very likely mislead the Tribunal is never excusable".
      Dieselbe Kammer verschob den Gegenstand ein Jahr später von der Halluzination zur Vertraulichkeit:
      Wer Mandantenunterlagen in ein offenes KI-System hochlädt, verliert das legal professional privilege,
      und die Hamid-Zuständigkeit erfasst auch die Aufsichtspflichten der Kanzlei. Australien folgt der
      Verweisungslinie und betont in Valu die besondere Verletzlichkeit der Mandantschaft im Migrationsrecht,
      in Dayal, dass die Prüfungspflicht auch dann nicht entfällt, wenn das Werkzeug kanzleiintern zugelassen
      ist.

      '
