  - position: Datenschutzstrafrecht schlägt den Deepfake-Sondertatbestand
    gericht: 臺灣新竹地方法院 — Taiwan Hsinchu District Court, 12.06.2026 (115年度訴字第339號); ergänzend 臺灣新北地方法院 —
      Taiwan New Taipei District Court, 22.04.2026 (114年度侵訴字第101號)
    begruendung: 'Der Befund dreht die übliche Erzählung um. Taiwan hat 2023 einen eigenen Deepfake-Straftatbestand
      geschaffen (§ 319-4 Abs. 2 中華民國刑法); in der Praxis verurteilt das Gericht nach dem Datenschutzstrafrecht.
      Der Angeklagte hatte über zwei Jahre unter dem Namen der Geschädigten ein Konto betrieben und dort
      aus deren Gesichtsaufnahmen erzeugte unwahre sexuelle Bilder veröffentlicht. Das Gericht bejaht
      Tateinheit von vier Delikten — § 41 PDPA, § 235 Abs. 1 StGB, § 319-4 Abs. 2 StGB und Gebrauch gefälschter
      quasi-privater Urkunden — und verurteilt nach § 55 StGB aus der schwersten Norm, und das ist § 41
      PDPA, weil dessen Geldstrafrahmen (bis 1 Mio. NTD) den des Deepfake-Tatbestands (bis 500.000 NTD)
      übersteigt. Die dogmatische Brücke liefert die zweite Entscheidung: Gesichtsmerkmale in sexuellen
      Bildern sind besondere personenbezogene Daten nach § 6 Abs. 1 PDPA. Wer die Wirksamkeit von Deepfake-Straftatbeständen
      an Verurteilungszahlen misst, misst deshalb in Taiwan das Falsche — die Verurteilungen stehen in
      den Tenoren des Datenschutzrechts. Für die europäische Diskussion ist das ein Argument dafür, dass
      ein strafbewehrtes Datenschutzregime der wirksamere Hebel sein kann als ein Spezialtatbestand.

      '
