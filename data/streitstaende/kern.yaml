      auszulöschen. Ein pauschaler Takedown-Befehl wurde abgelehnt. Bereits Jackie Shroff hatte entschieden,
      dass die fehlende Einwilligung nicht der alleinige Maßstab sein kann — zugleich aber das Angebot
      einer KI-gestützten Persona-Nachbildung als solches untersagt.

