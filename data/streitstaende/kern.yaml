  - position: Kodifizierter Sanktionsmaßstab statt Richterrecht — Spanien und Italien
    stelle: Consejo General de la Abogacía Española, Circular Interpretativa 3/2026; Consejo General del
      Poder Judicial, Instrucción 2/2026 (BOE-A-2026-2205); Italien, Art. 13 Legge 132/2025 nebst dem
      CNF-Leitfaden zur generativen KI
    begruendung: 'Der einzige Ansatz, der die Sanktion nicht dem Einzelfall überlässt. Die spanische Circular
      3/2026 legt Art. 4 Abs. 1, Art. 10 Abs. 2 lit. e, Art. 12 Buchst. A Nr. 8 und Art. 21 Abs. 2 des
      Código Deontológico aus und zieht drei Linien, die im Fallrecht nirgends so scharf gezogen sind:
      Der unterzeichnende Anwalt trägt die Verantwortung vollständig, und der KI-Fehler entschuldigt nicht,
      sondern belegt die Verletzung der Aufsichtspflicht; der Verstoß ist mit der Einreichung vollendet,
      die rechtzeitige Korrektur davor schließt ihn aus; schwere Fälle erfüllen Art. 125 lit. u EGAE,
      besonders gravierende Art. 124 lit. g EGAE. Für die Richterschaft verlangt Ordinal 7 der Instrucción
      2/2026 die vollständige persönliche Durchsicht und kritische Validierung jedes KI-gestützten Entwurfs,
      Ordinal 8 untersagt die unkritische Übernahme KI-erzeugter Inhalte. Italien macht die Information
      des Mandanten über den KI-Einsatz nach Art. 13 Legge 132/2025 zur gesetzlichen Pflicht. Aus keiner
      der beiden Rechtsordnungen ist eine Entscheidung im Bestand erfasst.

      '
