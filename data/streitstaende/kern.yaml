  - position: Offenlegung als Zulässigkeitsbedingung — das Gericht legt seinen Prompt offen
    gericht: Segundo Tribunal Colegiado en Materia Civil del Segundo Circuito (Mexiko), Tesis II.2o.C.9
      K (11a.) vom 29.07.2025 und Queja 404/2025 vom 24.10.2025
    begruendung: 'Mexiko beantwortet nicht die Frage nach der Rechtsfolge, sondern die davorliegende:
      unter welchen Bedingungen der Einsatz überhaupt zulässig ist. Das Kollegialgericht setzte KI ein,
      um die Höhe einer Sicherheitsleistung zu berechnen, hielt das wegen der Neuartigkeit der Praxis
      für offenlegungsbedürftig und beschrieb in der veröffentlichten Entscheidung das eingesetzte Verfahren
      vollständig — einen standardisierten Prompt ohne feste Werte, in den die Richterin oder der Richter
      die Falldaten selbst eingibt, angewandt nach der Methodik der Jurisprudencia P./J. 71/2014 (10a.).
      Aus der Tesis aislada ist am 09.01.2026 bindende Jurisprudencia geworden (II.2o.C. J/2 K (12a.),
      Registro 2031640). Damit steht die Offenlegung des Werkzeugs als Zulässigkeitsbedingung neben den
      Positionen zur Rechtsfolge — sie setzt früher an und macht die Frage nach der Nichtigkeit im Regelfall
      entbehrlich.'
    urteile:
