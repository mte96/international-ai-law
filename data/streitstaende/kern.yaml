  - position: Würdeschutz — Deepfake als Angriff auf die moralische Integrität
    stelle: Spanien, geplanter Art. 173 bis Código Penal (Proyecto de Ley Orgánica, nicht verabschiedet)
    begruendung: 'Strafbar macht sich, wer ohne Einwilligung Bild- oder Stimmaufnahmen einer Person verbreitet,
      ausstellt oder überlässt, die mittels automatisierter Systeme erzeugt, verändert oder nachgebildet
      wurden, so dass sie echt erscheinen, und dabei Situationen sexuellen Inhalts simulieren. Die Verortung
      im Titel über die Straftaten gegen die moralische Unversehrtheit — nicht bei den Sexualstraftaten
      und nicht bei den Delikten gegen die Privatsphäre — ist eine bewusste Entscheidung: Geschütztes
      Rechtsgut ist die Würde, nicht die sexuelle Selbstbestimmung, weil der Deepfake keinen realen Vorgang
      abbildet. Tathandlung ist die Verbreitung, nicht die Herstellung.

      '
