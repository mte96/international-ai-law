  - position: Die Vorfrage ist noch offen — ist das Training überhaupt eine Vervielfältigung?
    gericht: Gerichtshof der Europäischen Union, Große Kammer, C-250/25 (Like Company ./. Google Ireland)
    begruendung: 'Das ungarische Budapest Környéke Törvényszék hat am 03.04.2025 vier Fragen vorgelegt,
      und die zweite ist die eigentliche: Ist das Training eines Sprachmodells auf Presseinhalten eine
      Vervielfältigung nach Art. 2 InfoSoc-RL? Erst wenn das bejaht ist, stellt sich die Frage nach der
      Schranke (Frage 3). Frage 1 betrifft die Ausgabe als öffentliche Wiedergabe nach Art. 3 Abs. 2 InfoSoc-RL,
      Frage 4 den Fall, dass der Nutzer den Chatbot gezielt auf eine Pressepublikation hin promptet. Mündliche
      Verhandlung am 10.03.2026 — die erste Verhandlung des Gerichtshofs zu generativer KI und Urheberrecht
      überhaupt. Bemerkenswert und in der deutschen Diskussion nicht verarbeitet: Der Generalanwalt hat
      in der Verhandlung erwogen, die Trennung von Eingabe und Ausgabe aufzugeben und die Gesamtheit der
      zur Verletzung führenden Handlungen einheitlich zu prüfen (Hinweis auf Acacia, C-421/20). Folgt
      der Gerichtshof dem, ist die gesamte europäische Dogmatik beider Lager hinfällig — und die Frage,
      welche Rechtsordnung die Eingabe und welche die Ausgabe erfasst, wird zur falschen Frage.

      '
