    nein: 'Russland (Art. 10 Abs. 2 243-FZ knüpft an die Herkunft des Entwicklers), EU (Art. 53 Abs. 1
      lit. c KI-VO knüpft an den Marktzugang), Italien (Art. 171 lit. a-ter l. 633/1941 knüpft eine Strafnorm
      daran), Indien und Brasilien (Abgabe auf den Systemerlös)

      '
  aufloesung: 'Eine Konvergenz ist ausgeschlossen, weil die Rechtsordnungen nicht dieselbe Frage verschieden,
    sondern verschiedene Fragen beantworten. Terminlich steht Folgendes an: In C-250/25 waren die Schlussanträge
    des Generalanwalts Szpunar für den 03.09.2026 angekündigt, am selben Tag hat der BGH in I ZR 281/25
    verhandelt — beide Ausgänge sind mit Stand 05.09.2026 nicht erfasst und vor jeder Verwendung zu prüfen.
    Der Third Circuit entscheidet ROSS voraussichtlich Ende 2026; in Kalifornien sind Anhörungen für den
    21.10.2026 (Concord./. Anthropic) und den 30.10.2026 (Mosaic) terminiert, die Repliken im OpenAI-MDL
    laufen bis zum 06.11.2026, die Anhörung in Google GenAI ist für den 10.03.2027 vorgeschlagen. Die
    englische Berufung in Getty ist zugelassen, aber ohne Termin. Das indische Hauptsacheverfahren läuft,
    mit der ausdrücklich offengelassenen und stärkeren Anspruchsgrundlage der öffentlichen Wiedergabe.
    In Japan und Korea liegt nichts als Klageerhebungen vor. Die russischen Artikel 8 bis 10 werden erst
    am 01.03.2027 anwendbar, die ausfüllenden Regierungsverordnungen fehlen. Wahrscheinlichste Reihenfolge
    der ersten belastbaren Antworten: eine kalifornische Fair-Use-Entscheidung im Herbst 2026, das EuGH-Urteil
    in C-250/25 nicht vor 2027, eine japanische Sachentscheidung nicht vor 2027/28, und aus Kanada, Brasilien
    und Israel auf absehbare Zeit gar nichts. Die praktisch wirksamste Klärung kommt derweil nicht aus
    dem Urheberrecht, sondern aus dem Datenschutzrecht und aus dem Marktzugangsrecht der KI-VO.

    '
  eigene_bewertung: 'Erstens, und das ist der Befund, der die übliche Erzählung umkehrt: Zwischen der
    Weite der Eingabeschranke und dem Ort des Streits besteht ein umgekehrtes Verhältnis. Japan hat die
    weiteste Trainingsschranke der Welt — und dort greift kein einziges Verfahren das Training an; alle
    drei Verlagsklagen gegen Perplexity betreffen den Abruf zur Laufzeit. Indien hat die Trainingsfrage
    im Juli 2026 zugunsten des Anbieters entschieden und den Druck damit binnen derselben Entscheidung
    auf Memorisierung und öffentliche Wiedergabe verschoben, die ausdrücklich der Hauptsache vorbehalten
    bleiben. Die Vereinigten Staaten sind die einzige Rechtsordnung, in der die Eingabe selbst der Kampfplatz
    ist — gerade weil § 107 keine feste Grenze hat und deshalb unbegrenzt bestreitbar bleibt. Die europäische
    Debatte führt die Wahl zwischen offenem und enumeriertem Tatbestand als Wahl zwischen Flexibilität
    und Sicherheit. Das ist der falsche Gegensatz. Die richtige Frage lautet, wo der Streit landet: Eine
    enumerierte Schranke beendet die Eingabefrage und eröffnet die Ausgabefrage; ein offener Maßstab hält
    die Eingabefrage dauerhaft offen. Wer eine weite Schranke fordert, um Rechtsfrieden zu schaffen, bekommt
    keinen Rechtsfrieden, sondern einen anderen Prozess. Zweitens: Die Trainingsschranke ist in zwei Rechtsordnungen
    bereits kein Urheberrecht mehr, sondern Industriepolitik — und beide Male wird es nicht ausgesprochen.
    Russland macht das Privileg offen von der Herkunft des Entwicklers abhängig (Art. 10 Abs. 2 243-FZ).
    Die Europäische Union macht die Pflicht über Art. 53 Abs. 1 lit. c KI-VO vom Marktzugang abhängig.
    Das ist strukturell derselbe Schritt: In beiden Fällen entscheidet nicht mehr, was mit dem Werk geschieht,
    sondern wer es tut und wohin das Modell geht. Der Unterschied ist nur das Vorzeichen — Russland privilegiert
    die Seinen, die Union verpflichtet die Fremden. Wer die russische Norm als völkerrechtswidrig kritisiert,
    sollte die eigene daneben legen. Zur Völkerrechtsfrage im Übrigen eine Präzisierung, die fehlt: Die
    naheliegende Kollision liegt nicht bei Art. 5 Abs. 1 RBÜ. Diese Vorschrift verlangt Inländerbehandlung
    für ausländische Urheber, und die russische Norm unterscheidet nicht nach der Herkunft des Urhebers,
    sondern nach der des Nutzers. Der schärfere Einwand läuft über den Dreistufentest des Art. 9 Abs.
    2 RBÜ und des Art. 13 TRIPS: Ein "bestimmter Sonderfall" muss sich über die Nutzungshandlung definieren
    lassen. Eine Schranke, deren Reichweite von der Staatsangehörigkeit des Nutzers abhängt, ist kein
    Sonderfall der Nutzung, sondern eine Subvention in der Form einer Schranke. Drittens, zu Italien,
    und das ist der praktisch folgenreichste ungehobene Punkt: Der Strafrahmen des Art. 171 Abs. 1 lit.
    a-ter l. 633/1941 beträgt 51 bis 2.065 Euro. Als Sanktion gegen einen Modellanbieter ist das nichts.
    Als Verfahrensinstrument ist es viel. Eine Straftat eröffnet dem Rechteinhaber die Strafanzeige und
    damit staatliche Ermittlungsbefugnisse — Beschlagnahme, Auskunft, Durchsuchung — in genau dem Bereich,
    in dem sein strukturelles Problem liegt: Er kann nicht beweisen, was im Trainingskorpus stand. Italien
    hat, wahrscheinlich ohne es zu wollen, das erste funktionierende Aufklärungsinstrument für Trainingsdaten
    in Europa geschaffen, und es greift auch dort, wo die Transparenzpflicht des Art. 53 Abs. 1 lit. d
    KI-VO nicht greift. Dagegen steht ein Bestimmtheitsproblem, das ebenfalls niemand benennt: Der Tatbestand
    verweist auf Art. 70-ter und 70-quater l. 633/1941, deren zentraler Begriff — der maschinenlesbare
    Nutzungsvorbehalt — Gegenstand eines anhängigen EuGH-Vorabentscheidungsersuchens und zweier einander
    widersprechender deutscher Oberlandesgerichtsentscheidungen ist. Italien hat eine Norm kriminalisiert,
    deren Inhalt der Gerichtshof erst noch bestimmen muss. Gemessen an Art. 25 Abs. 2 Cost. und Art. 7
    EMRK ist das nicht unproblematisch. Viertens, zur Belastbarkeit des ganzen Feldes: Es gibt kein Fallrecht.
    Weltweit existiert genau eine begründete gerichtliche Sachentscheidung über eine Trainingsschranke,
    und sie ist summarisch, nicht rechtskräftig und beruht ausweislich ihrer eigenen Gründe auf einem
    schmalen Beweisfundament. Alles Übrige, was in der rechtsvergleichenden Literatur als "Position" einer
    Rechtsordnung gehandelt wird, ist Gesetzestext, Klageschrift, Ministerialpapier oder eine Entscheidung
    über etwas anderes. Der Rechtsvergleich zum KI-Training vergleicht derzeit Normtexte und Schriftsätze
    und gibt vor, Rechtsprechung zu vergleichen. Das schärfste Beispiel ist Israel: Zitiert wird eine
    nicht bindende Stellungnahme des Justizministeriums vom 18.12.2022 — datiert achtzehn Tage nach der
    Veröffentlichung von ChatGPT, also verfasst in einer Welt, in der generative Modelle noch kein öffentliches
    Phänomen waren. Sie wird international, unter anderem in der Studie des US Copyright Office, als israelische
    Antwort auf das Training generativer Modelle geführt. Wer sie zitiert, sollte beides offenlegen: dass
    kein Gericht sie je bestätigt hat, und wann sie geschrieben wurde. Fünftens, der Ratschlag, der daraus
    folgt und der in keiner Mandantenberatung steht: Für einen Anbieter, der weltweit trainiert, ist die
    günstigste Rechtsordnung ohne Wert. Maßgeblich ist die strengste unter denen, deren Markt er will,
    und zwar aus zwei voneinander unabhängigen Gründen, die zusammen selten gesehen werden. Der aufsichtsrechtliche
    Kanal ist Art. 53 Abs. 1 lit. c KI-VO: Er zieht den europäischen Nutzungsvorbehalt in jedes Trainingsvorhaben
    der Welt, sobald das Modell in der Union in Verkehr gebracht wird. Der zivilrechtliche Kanal ist das
    Münchener Suno-Urteil: Es erfasst ein Training in den Vereinigten Staaten, weil das Modell danach
    in Europa betrieben wird, und es spricht Schadensersatz zu, was die Verordnung nicht tut. Beide Kanäle
    wirken unabhängig voneinander, beide sind vom Trainingsort unabhängig, und der zweite trifft auch,
    wer der Verordnung entgeht. Die Verlagerung des Trainings nach Japan, in die Vereinigten Staaten oder
    nach Russland löst deshalb kein einziges der Probleme, um derentwillen sie erwogen wird.

    '
