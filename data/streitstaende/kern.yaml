  - position: Die zitierte Entscheidung existiert — sie passt nur nicht
    gericht: Environment and Land Court at Thika (Kenia), 21.05.2026 – [2026] KEELC 3088 (KLR), Nyanjui
    begruendung: 'Die schärfste Gegenposition zu der Auffassung, es komme allein auf die Existenz der
      Fundstelle an. Zur Stützung eines Vollstreckungsaufschubs in einer Grundstücksache war eine Entscheidung
      zitiert worden, die die Grundrechte von LGBTQ-Personen und erzwungene medizinische Untersuchungen
      betrifft — sie existiert, sie passt nur nicht. Das Gericht behandelt die kontextblinde, aber echte
      Fundstelle als dasselbe Versagen wie die erfundene und knüpft den Vorwurf nicht an die Unwahrheit,
      sondern an „a total abdication of human legal oversight in favor of automated, context-blind writing";
      die Pflicht des Anwalts ist es, seine Fundstellen persönlich auf Einschlägigkeit, Richtigkeit und
      inhaltliche Tragfähigkeit zu prüfen. Eine förmliche Sanktion unterblieb; die Folge war die Zurückweisung
      und die Kostenlast. Methodisch bemerkenswert ist die Zurückhaltung: Das Gericht unterstellt den
      KI-Einsatz nicht, sondern formuliert im Konjunktiv — ein sauberer Umgang mit einem nicht beweisbaren
      Verdacht, der der israelischen Indizienkonstruktion genau entgegengesetzt ist.

      '
    urteile:
