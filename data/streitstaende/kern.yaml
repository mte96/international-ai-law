  - position: Wer einstuft, darf nicht delegieren — die dezentrale Aufsicht und ihre Grenze
    gericht: 最高行政法院 — Oberster Verwaltungsgerichtshof Taiwans, 07.08.2026 – 114年度上字第193號
    begruendung: 'Die spanische Aufspaltung der Marktüberwachung auf acht Behörden hat ein ostasiatisches
      Gegenstück, und dort ist die Grenze bereits höchstrichterlich gezogen. Das Gericht hob zwei Verfügungen
      einer nachgeordneten Behörde des Digitalministeriums auf: Die Aufsicht über nichtöffentliche Stellen
      ist im taiwanischen Datenschutzgesetz dezentral organisiert und liegt bei den jeweiligen Fachaufsichten;
      § 52 Abs. 1 PDPA erlaubt die Übertragung nur für die Befugnisse aus §§ 22 bis 26, nicht für die
      Eingriffsbefugnisse aus §§ 27 und 48. Für die Einstufungsfrage ist das unmittelbar einschlägig,
      weil Art. 2 Abs. 2 und Art. 5 Abs. 2 des taiwanischen KI-Basisgesetzes dieselbe Architektur wiederholen:
      Die Hochrisikoeinstufung ist Sache der Fachaufsicht selbst, im Benehmen mit dem Digitalministerium,
      und nicht delegierbar. Der Fall zeigt zugleich, was die dezentrale Aufsicht praktisch kostet: Ein
      Datenschutzvorfall aus 2022 ist im August 2026 letztinstanzlich an der Behördenzuständigkeit gescheitert,
      ohne dass über die Sache entschieden worden wäre. Wer die spanische Lösung für ein Detailproblem
      hält, findet hier die Kostenrechnung.

      '
