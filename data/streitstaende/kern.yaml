  - position: Der Verstoß gegen den Nutzungsvorbehalt ist eine Straftat
    stelle: Art. 171 Abs. 1 lit. a-ter legge 633/1941 i.d.F. des Art. 26 Legge 132/2025
    begruendung: 'Italien hat als bislang einziger Staat der Welt den Verstoß gegen das TDM-Opt-out unter
      Strafe gestellt. Strafbar ist, wer "riproduce o estrae testo o dati da opere o altri materiali disponibili
      in rete o in banche di dati in violazione degli articoli 70-ter e 70-quater, anche attraverso sistemi
      di intelligenza artificiale". Der Strafrahmen ist die Geldstrafe des Art. 171 Abs. 1 l. 633/1941
      von 51 bis 2.065 Euro. Die Vorschrift steht neben Art. 70-septies l. 633/1941, der die Schranken
      ausdrücklich auf generative Modelle erstreckt — Italien erweitert also die Schranke und kriminalisiert
      zugleich ihre Überschreitung. Systematisch hat der Gesetzgeber bewusst kein KI-Sonderstrafrecht
      geschaffen, sondern einen allgemeinen Erschwerungsgrund (Art. 61 Nr. 11-decies c.p.), einen einzigen
      neuen Tatbestand (Art. 612-quater c.p.) und punktuelle Qualifikationen — die Opt-out-Norm ist eine
      davon.

      '
