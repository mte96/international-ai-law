- id: rechtsberatung-durch-software
  titel: Erlaubte Hilfe oder unerlaubte Rechtsdienstleistung
  frage: 'Ist ein automatisiertes Werkzeug, das aus den Angaben eines Nutzers eine rechtliche Antwort
    erzeugt, eine erlaubnispflichtige Rechtsdienstleistung — und darf eine Behörde ein solches Werkzeug
    allein wegen seiner Missbrauchseignung untersagen?

    '
