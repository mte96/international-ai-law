  - position: Strafrecht mit Kennzeichnungslogik — wer kennzeichnet, bleibt straflos
    stelle: Frankreich, Art. 226-8 und Art. 226-8-1 code pénal (loi SREN n° 2024-449)
    begruendung: 'Nach Art. 226-8 c. pén. ist strafbar, wer einen algorithmisch erzeugten visuellen oder
      akustischen Inhalt, der Bild oder Stimme einer Person wiedergibt, ohne deren Einwilligung öffentlich
      zugänglich macht — aber nur, wenn nicht offensichtlich ist oder ausdrücklich angegeben wird, dass
      der Inhalt algorithmisch erzeugt wurde. Der Tatbestand knüpft damit an die fehlende Kennzeichnung
      an, nicht an die Nachbildung. Bei Inhalten sexuellen Charakters entfällt diese Logik vollständig:
      Nach Art. 226-8-1 c. pén. ist bereits die Verbreitung ohne Einwilligung strafbar, auch bei offener
      Kennzeichnung.

      '
