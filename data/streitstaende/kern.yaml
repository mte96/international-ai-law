      Kanada, OPC u.a., PIPEDA Findings #2026-002

      '
    begruendung: 'In acht Rechtsordnungen kommt die operative Antwort nicht von einem Gericht. Israel
      ist der Extremfall: Ein nicht bindendes Gutachten des Justizministeriums vom 18.12.2022 bejaht die
      Zulässigkeit des Trainings unter Section 19 Copyright Act 2007, und diese Auffassung zirkuliert
      international als "die israelische Position", ohne dass je ein israelisches Gericht damit befasst
      gewesen wäre. Japan steuert über die Kulturbehörde, Korea über Leitlinien des Kulturministeriums,
      die die Trainingsphase zunächst ausdrücklich ausgespart haben, Kanada über eine Konsultation, die
      2025 ohne Festlegung endete. Der eigentliche Befund liegt daneben: Die einzigen beiden Maßnahmen
      weltweit, die ein laufendes Training tatsächlich gestoppt oder umfassend beanstandet haben, kamen
      nicht aus dem Urheberrecht. Die brasilianische ANPD ordnete am 02.07.2024 die sofortige Aussetzung
      der Verarbeitung für das KI-Training von Meta an (Zwangsgeld 50.000 BRL/Tag), gestützt auf das legítimo
      interesse nach Art. 10 LGPD; vier kanadische Aufsichtsbehörden beanstandeten am 06.05.2026 ein Universalmodell
      in sämtlichen Streitpunkten — und erstreckten die Rechenschaftspflicht auf die Freigabeentscheidung
      selbst.

