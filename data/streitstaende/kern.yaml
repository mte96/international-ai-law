  - position: Nationale Umsetzung gibt am wenigsten — und Griechenland hat zurückgenommen
    stelle: Deutschland, § 35a VwVfG; Griechenland, ν. 4961/2022
    begruendung: '§ 35a VwVfG erlaubt den vollständig automatisierten Verwaltungsakt nur, wenn eine Rechtsvorschrift
      dies zulässt und weder Ermessen noch Beurteilungsspielraum besteht; einen Transparenzanspruch kennt
      die Vorschrift nicht. Die einzige auffindbare deutsche Entscheidung, die § 35a VwVfG und Art. 22
      DSGVO an einem realen automatisierten Verwaltungsakt zusammenführt, ist VG Bremen 2 K 763/23 vom
      14.07.2025; der Berufungszulassungsantrag ist unter 2 LA 227/25 anhängig. Griechenland hatte mit
      Άρθρο 5 und Άρθρο 6 ν. 4961/2022 eine algorithmische Folgenabschätzung, ein öffentliches Register
      und einen individuellen Anspruch auf Kenntnis der Entscheidungsparameter in verständlicher und barrierefreier
      Form; alles drei wurde zum 20.07.2026 ersatzlos aufgehoben.

      '
    urteile:
    - de-2025-vg-bremen-automatisierter-va
