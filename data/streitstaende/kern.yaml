  stand: 'Die Statusfrage ist weltweit beantwortet und im Ergebnis einheitlich. Die eigentlich offene
    Frage ist eine andere und wird derzeit nur in den Vereinigten Staaten überhaupt gestellt — dort allerdings
    binnen 21 Monaten mit zwei entgegengesetzten Antworten. In Europa stellt sie kein Amt, weil die Erfinderbenennung
    nur formal geprüft wird.

    '
  positionen:
  - position: Erfinder kann nur eine natürliche Person sein
    gericht: 'Geschlossene Front: EPA, UK Supreme Court, US Federal Circuit, Full Court of the Federal
      Court of Australia, Japan, Korea, Israel, Indien, Taiwan'
    begruendung: 'Die Juristische Beschwerdekammer des EPA hat am 21.12.2021 in J 8/20 und J 9/20 entschieden,
      der Erfinder müsse nach dem EPÜ eine Person mit Rechtsfähigkeit sein. Der UK Supreme Court hat am
      20.12.2023 einstimmig entschieden, dass „inventor“ im Sinne des s. 7(3) Patents Act 1977 eine natürliche
      Person voraussetzt und dass das Eigentum an einer Maschine kein Recht auf Erteilung vermittelt.
      Der Full Court hat die abweichende erstinstanzliche Entscheidung von Beach J einstimmig aufgehoben;
      der High Court hat die special leave versagt, weil die Frage rechtspolitischer Natur und dem Gesetzgeber
      vorbehalten sei. Japan hat den Instanzenzug am 04.03.2026 höchstrichterlich abgeschlossen.

      '
