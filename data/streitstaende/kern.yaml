  - position: Selbstverwaltung der Judikative — Hilfsmittel ja, Urteilsfindung nein
    stelle: Judiciary of England and Wales; Consejo General del Poder Judicial (Instrucción 2/2026); Consiglio
      Superiore della Magistratura; Conselho Nacional de Justiça (Resolução 615/2025); Courts of New Zealand
    begruendung: 'Die praktisch wirksamste Regelungsform ist überall dieselbe: der Richterrat oder die
      Gerichtsspitze regelt sich selbst, ohne Gesetz und ohne Bußgeld. England und Wales stellen die persönliche
      Verantwortung an den Anfang — der Richter haftet für alles, was in seinem Namen erstellt wird —,
      verbieten die Eingabe nicht öffentlicher Informationen in öffentlich zugängliche Werkzeuge und unterscheiden
      zwischen zulässigen Verwendungen (Zusammenfassungen, Textentwürfe für Verwaltungsaufgaben) und unzulässigen
      (Rechtsrecherche und Rechtsanalyse ohne Verifikation); die Oktoberfassung 2025 ergänzt Meldepflichten
      bei Datenvorfällen. Spanien verlangt in Ordinal 7 die vollständige persönliche Durchsicht und kritische
      Validierung jedes KI-gestützten Entwurfs und verbietet in Ordinal 8 die automatisierte Entscheidungsfindung
      und die unkritische Übernahme; die Instrucción gilt ausdrücklich auch für Werkzeuge, die der CGPJ
      nicht bereitstellt. Italien beschränkt den Einsatz auf vom Justizministerium autorisierte Systeme
      innerhalb der Justizdomäne und hat die zulässigen Tätigkeiten am 22.07.2026 erweitert — zugleich
      die Anonymisierung von einer Pflicht zur bloßen buona pratica herabgestuft. Brasilien ist am detailliertesten:
      Die Resolução 615/2025 verbietet Systeme, die die menschliche Überprüfung beseitigen, Rückfallquoten
      aus Persönlichkeitsmerkmalen vorhersagen oder Personen für richterliche Bewertungen ordnen, stuft
      Beweiswürdigung, Subsumtion, Rechtsanwendung und Schadensbemessung als hochriskant ein und verlangt
      Registrierung in Sinapses, veröffentlichte Folgenabschätzungen und Vorfallmeldung binnen 72 Stunden.

      '
