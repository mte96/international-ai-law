  letzte_pruefung: 2026-09-07
  aufloesung: 'Eine deutsche Klärung ist nicht terminiert und wird nicht von selbst kommen. Sie setzt
    eine Abmahnung oder eine Kammerklage gegen einen Anbieter generativer Rechtsauskunft voraus; zum Recherchestichtag
    ist ein solches Verfahren nicht nachgewiesen. Kommt es, entscheidet es sich an einer einzigen Frage
    — ob die Erzeugung der Antwort im Moment der Anfrage eine Prüfung des Einzelfalls im Sinne des § 2
    Abs. 1 RDG ist. Wahrscheinlicher als die berufsrechtliche ist die lauterkeitsrechtliche Klärung über
    § 5 UWG, weil sie an der Werbeaussage ansetzt und keinen Streit über den Begriff der Rechtsdienstleistung
    erfordert; das ist der Weg, den die FTC in DoNotPay gegangen ist. Auf europäischer Ebene ist nichts
    angekündigt: Die KI-Verordnung kennt keine berufsrechtliche Vorbehaltsregel, und die Rechtsberatung
    ist in Anhang III nicht enthalten — der aufgehobene Colorado AI Act hatte Rechtsdienstleistungen ausdrücklich
    als folgenreichen Bereich geführt und ist nie angewandt worden. Am ehesten wird die Frage deshalb
    dort beantwortet, wo sie gar nicht als Rechtsfrage gestellt wird: in italienischen Gesetzestexten,
    in norwegischen Sandkastenberichten und in amerikanischen Tätigkeitsverboten für einzelne Berufe.

    '
