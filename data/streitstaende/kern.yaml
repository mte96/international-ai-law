  unterfragen:
  - frage: Ist die mit KI begründete Entscheidung nichtig oder durch Korrektur heilbar?
    ja: Nichtigkeit — Bogotá (Urteil) und Esquel (gesamtes Verfahren)
    nein: Heilung — Neals und Wingate nehmen zurück und erlassen neu; Krasnodar sieht schon keinen Fehler
  - frage: Ist der Nichtigkeitsgrund die Fehlerhaftigkeit oder die Ununterscheidbarkeit?
    ja: Fehlerhaftigkeit — Bogotá stellt auf die erfundenen Fundstellen ab
    nein: 'Ununterscheidbarkeit — Esquel: es lässt sich nicht mehr feststellen, welcher Teil vom Richter
      stammt'
  - frage: Muss der Spruchkörper den KI-Einsatz gegenüber den Parteien offenlegen?
    ja: Mexiko (bindend), Corte Constitucional T-323/24 (Offenlegung von Einsatz, Umfang und Fundstelle
      im Urteil)
    nein: Brasilien — die Offenlegung IN der Entscheidung ist nach der Resolução 615/2025 ausdrücklich
      fakultativ, nur die interne Protokollierung ist Pflicht
  - frage: Braucht der KI-Einsatz durch das Gericht eine gesetzliche Grundlage?
    ja: Italien, Art. 15 Legge 132/2025 — der einzige Gesetzesvorbehalt weltweit
    nein: Krasnodar ausdrücklich; im Ergebnis auch überall dort, wo nur Selbstverwaltungsakte gelten
  - frage: Gilt für den Spruchkörper ein strengerer Maßstab als für den Prozessvertreter?
    ja: der Sache nach Bogotá, Esquel und Usha Rani — die Rechtsfolge trifft die Entscheidung, nicht nur
      die Person
    nein: 'in den Vereinigten Staaten ist es umgekehrt: Der Anwalt trägt Rule-11-Sanktionen und Kosten,
      der Richter nimmt formlos zurück'
  - frage: Trägt die Unterscheidung zwischen Verwaltungs- und Justizentscheidung?
    ja: Haghshenas — der Werkzeugeinsatz ist irrelevant, solange ein Beamter entscheidet
    nein: Safarian, Khosravi, Ramat Gan und Gujarat — dieselbe Prüfpflicht wie beim Gericht
  - frage: Ist die Analyse richterlicher Entscheidungen Teil der Öffentlichkeit des Verfahrens?
    ja: die Prämisse des open data derselben loi n° 2019-222
    nein: Art. 33 loi n° 2019-222 und Conseil constitutionnel — Profilbildung gefährdet die Unabhängigkeit
  aufloesung: 'Eine Konvergenz ist nicht in Sicht, und die nächsten Weichen stellen nicht Gerichte. Erstens
    der 02.12.2027: Dann werden die Hochrisiko-Pflichten für Anhang III Nr. 8 KI-VO anwendbar, und damit
    muss geklärt sein, wer bei einem selbst entwickelten Assistenzsystem Anbieter und wer Betreiber ist
    — für FRAUKE und OLGA eine offene Frage. Zweitens die russische Praxisübersicht des Obersten Gerichtshofs,
    angekündigt am 27.05.2026 und ausdrücklich auch für Rechtsmittel, die auf den KI-Einsatz durch den
    Richter gestützt werden; ein Veröffentlichungstermin ist nicht bekannt. Drittens die kolumbianischen
    Leitlinien des Consejo Superior de la Judicatura, die T-323/24 binnen vier Monaten aufgegeben hat
    und die nicht nachgewiesen sind. Viertens die Judicial Conference of the United States, die sich nach
    der Senatsuntersuchung mit Leitlinien für die Bundesgerichte befasst; ein Ergebnis liegt zum 05.09.2026
    nicht vor. In Deutschland ist eine gerichtliche Klärung am ehesten über eine Verfahrensrüge zu erwarten
    — und dafür gibt es bislang keinen veröffentlichten Fall.

    '
  eigene_bewertung: 'Der Gegensatz "Nichtigkeit gegen Korrektur" ist kein dogmatischer, sondern ein zuständigkeitsrechtlicher,
    und wer ihn als Meinungsstreit referiert, vergleicht Unvergleichbares. In Bogotá und Esquel hat ein
    Rechtsmittelgericht über das Urteil eines anderen entschieden; in New Jersey und Mississippi hat der
    Richter, dem der Fehler unterlief, über seine eigene Entscheidung befunden. Ein Rechtsmittelgericht
    hat nur ein Instrument, und das ist die Kassation; ein Gericht, das seinen eigenen Entwurf zurückzieht,
    braucht überhaupt kein Instrument. Die amerikanische "Korrekturlinie" ist deshalb gar keine Position
    — sie ist die Abwesenheit einer Entscheidung. Sie konnte auch nie zu einer werden, weil die berichtigte
    Fassung niemanden beschwert: Wer sie angreifen wollte, hätte keinen Nachteil vorzutragen. Daraus folgt
    der eigentliche Befund: Die Rechtsfolge des richterlichen KI-Einsatzes hängt weltweit nicht davon
    ab, wie schwer der Verstoß wiegt, sondern davon, wer ihn aufgreifen darf. Beide US-Fälle wurden nur
    entdeckt, weil eine Partei nachprüfte — und für die Entscheidung ist beidesmal nichts daraus gefolgt.
    Zweitens zur Offenlegung, und hier liegt die unbequemste Beobachtung. Für den Anwalt ist die Offenlegungspflicht
    harmlos: Sie richtet sich an einen Gegner, der ohnehin nachprüft. Für das Gericht ist sie etwas völlig
    anderes, weil ihre einzigen Adressaten die Parteien sind und diese mit der Auskunft nur zweierlei
    anfangen können — ein Rechtsmittel oder ein Ablehnungsgesuch. Eine echte Offenlegungspflicht des Spruchkörpers
    ist damit eine Obliegenheit zur Selbstbelastung, die einen neuen Angriffspunkt schafft. Genau das
    erklärt die sonst unverständliche Verteilung: Wo Offenlegung verlangt wird, fehlt die Sanktion (Mexiko,
    Kolumbien), und wo eine Sanktion existiert, ist die Offenlegung nach außen abgeschaltet. Brasilien
    sagt es als einzige Rechtsordnung offen — die Offenlegung IN der Entscheidung ist fakultativ, die
    interne Protokollierung obligatorisch. Das ist kein Redaktionsversehen, sondern das einzige stabile
    Gleichgewicht, das dieses Regelungsproblem zulässt: Man kann den Richter zur Rechenschaft ziehen oder
    zur Offenlegung zwingen, aber nicht beides, solange die Offenlegung selbst der Rechtsmittelgrund ist.
    Drittens ein Punkt, der im europäischen Recht bereits geltendes Recht ist und den, soweit ersichtlich,
    niemand ausspricht. Art. 86 KI-VO gibt dem Betroffenen einen Anspruch auf klare und aussagekräftige
    Erläuterung der Rolle des KI-Systems im Entscheidungsverfahren, wenn die Entscheidung überwiegend
    auf den Ausgaben eines Hochrisiko-Systems nach Anhang III beruht und rechtliche Wirkungen entfaltet.
    Ausgenommen ist allein Anhang III Nr. 2 — nicht Nr. 8. Anhang III Nr. 8 lit. a ist die Rechtspflege,
    Betreiber ist das Gericht, und die Vorschrift gilt seit dem 02.08.2026, während die Dokumentationspflichten
    der Art. 11 und 12 KI-VO für Anhang-III-Systeme erst am 02.12.2027 greifen. Wer das zusammenliest,
    kommt zu einem Ergebnis, das die gesamte Offenlegungsdebatte überholt: Der Unionsgesetzgeber hat den
    Anspruch auf Erläuterung des richterlichen KI-Einsatzes bereits geschaffen, er wirkt gegen das Gericht,
    und er ist über die Produktregulierung in das Verfahrensrecht gelangt, ohne dass ihn jemand als Verfahrensrecht
    diskutiert hätte. Diese Einschätzung beruht auf eigener Lesung der Verordnung; ein Literaturbeleg
    dafür liegt nicht vor. Viertens der französische Fall, und er ist schärfer, als die übliche Zusammenfassung
    nahelegt. Man liest, Art. 33 schütze die richterliche Unabhängigkeit vor der Analyse, aber nicht vor
    dem eigenen Werkzeug. Das ist richtig und zu schwach. Der Nachweis, dass ein Spruchkörper seine Begründungspraxis
    verändert hat, seit er ein Assistenzsystem einsetzt, lässt sich nur auf einem Weg führen: durch vergleichende
    Auswertung der Entscheidungen desselben Richters über die Zeit. Genau diese Auswertung verbietet Art.
    33 mit Strafandrohung. Frankreich hat damit — ohne es zu beabsichtigen und Jahre vor dem Problem —
    das einzige Instrument untersagt, mit dem sich der unerklärte KI-Einsatz auf der Richterbank empirisch
    nachweisen ließe. Wer die Norm heute als Schutz der Unabhängigkeit verteidigt, verteidigt zugleich
    die Unüberprüfbarkeit dessen, was auf der Bank tatsächlich geschieht. Und der argentinische Fall zeigt,
    worauf man ohne dieses Instrument angewiesen ist: darauf, dass der Assistent seinen eigenen Satz im
    Urteil stehen lässt.

    '
