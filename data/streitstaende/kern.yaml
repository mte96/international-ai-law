  titel: Regimewahl beim Schutz gegen synthetische Nachbildungen
  frage: 'Über welches Rechtsgebiet wird der Schutz von Bild, Stimme und Persönlichkeit gegen KI-erzeugte
    Nachbildungen organisiert — Urheberrecht, Strafrecht, Würdeschutz, Vermögensrecht oder bloße Kennzeichnung?

