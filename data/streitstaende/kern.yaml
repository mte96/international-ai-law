  - position: Der französische Sonderweg — geschützt wird der Richter vor der Analyse, nicht vor dem Werkzeug
    gericht: Conseil constitutionnel, Décision n° 2019-778 DC vom 21.03.2019 (Rn. 93-95)
    begruendung: 'Art. 33 der loi n° 2019-222 verbietet, die Identitätsdaten von Magistraten und Geschäftsstellenbeamten
      mit dem Ziel oder der Wirkung wiederzuverwenden, ihre beruflichen Praktiken zu bewerten, zu analysieren,
      zu vergleichen oder vorherzusagen — und das, obwohl dasselbe Gesetz alle Entscheidungen als open
      data veröffentlicht. Der Conseil constitutionnel hat das gehalten: Zweck sei die Verhinderung von
      Profilbildungen, die Druck auf die Justiz erzeugen oder Strategien der Gerichtswahl begünstigen
      könnten. Frankreich verbietet damit einen Anwendungsfall, den die KI-VO nur reguliert, und ist die
      einzige westliche Rechtsordnung mit einem strafbewehrten Verbot der Richterprofilierung. Die Begründung
      misst das Verbot nur am Gleichheitssatz und an der Waffengleichheit, nicht an der Informationsfreiheit;
      ob ein Verbot der Auswertung ohnehin veröffentlichter Entscheidungen die Meinungs- und Informationsfreiheit
      verletzt, ist offen geblieben.

      '
