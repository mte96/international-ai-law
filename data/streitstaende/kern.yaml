  unterfragen:
  - frage: Ist die erfundene Fundstelle eine Falschaussage gegenüber dem Gericht oder eine falsche Rechtsansicht?
    ja: 'Falschaussage: Zhang v. Chen — "tantamount to making a false statement to the court"; das russische
      Kassationsgericht — bewusste Übermittlung falscher Angaben unter Fälschung von Quellen; der Sache
      nach auch Ayinde, das daraus den Kontemptrahmen ableitet'
    nein: 'Rechtsausführung: das Kammergericht knüpft an § 43 BRAO an und nicht an die prozessuale Wahrheitspflicht;
      sämtliche amerikanischen Entscheidungen stützen sich auf Rule 11(b)(2), der legal contentions betrifft,
      nicht auf Abs. 3 — ausgesprochen hat das kein Gericht'
  - frage: Entlasten Reue, Offenlegung und Verantwortungsübernahme?
    ja: Lacey — die einzelnen Anwälte blieben wegen offener Einlassung persönlich verschont; Zhang v.
      Chen — special costs versagt; DPP v GR — die Entschuldigung des Senior Counsel wurde entgegengenommen;
      Ko v. Li — Einstellung des Kontemptverfahrens unter Auflagen
    nein: Johnson v. Dunn ausdrücklich — auch wo Anwälte Verantwortung übernehmen, sei "much damage done";
      MS (Bangladesh) — "never excusable"
  - frage: Entschuldigen Krankheit, Überlastung oder Unerfahrenheit?
    ja: Ayinde — die geringe Berufserfahrung der Barristerin trug das Absehen vom Kontemptverfahren, ausdrücklich
      ohne Präzedenzwirkung
    nein: MS (Bangladesh), zehn Wochen später und mit amtlichem Leitsatz — wer nicht arbeitsfähig ist,
      muss das Mandat ablehnen oder das Gericht sofort unterrichten; Mavundla — Arbeitsüberlastung und
      Delegation ändern nichts an der persönlichen Kostenhaftung
  - frage: Ist die mediale Bloßstellung Teil der Sanktion?
    ja: 'nirgends als Presseöffentlichkeit, überall als gerichtete Publizität: Mata ordnete die Übersendung
      an die Mandanten und an die realen Richter an, deren Namen den erfundenen Entscheidungen beigelegt
      worden waren; Park v. Kim verpflichtete zur — erforderlichenfalls ins Koreanische übersetzten —
      Übermittlung an die Mandantin; Gauthier zur Offenlegung gegenüber dem eigenen Mandanten'
    nein: Johnson v. Dunn ausdrücklich — für die berufsrechtliche Ahndung dürften sich Gerichte nicht
      auf die Presse verlassen
  - frage: Trifft die Sanktion den Handelnden oder die Organisation?
    ja: 'Organisation: Lacey — 31.100 USD gegen zwei Kanzleien, die Anwälte verschont; Ayinde verlangt
      Maßnahmen von Heads of Chambers und Managing Partners'
    nein: 'Person: Coomer — beide Unterzeichner je 3.000 USD, die Mitunterzeichnung genügt; Mavundla —
      de bonis propriis gegen die Anwältin, nicht gegen die Berufsanfängerin; Murray — Kosten gegen die
      aufsichtsführende Ebene, nicht gegen die Nutzerin des Werkzeugs'
  - frage: Ist bereits der Werkzeugeinsatz vorwerfbar oder erst die ungeprüfte Verwendung?
    ja: 'Einsatz: Mavundla — "relying on AI technologies when doing legal research is irresponsible"'
    nein: 'Verwendung: Mata — an der Nutzung generativer KI sei "nothing inherently improper"; Dayal —
      die Prüfungspflicht entfällt auch dann nicht, wenn das Werkzeug kanzleiintern zugelassen ist; ebenso
      sämtliche Praxisrichtlinien'
  aufloesung: 'Eine Auflösung durch ein einzelnes Verfahren ist nicht in Sicht und wäre auch nicht zu
    erwarten: Der Streit betrifft nicht die Auslegung einer gemeinsamen Norm, sondern die Wahl zwischen
    vier Anspruchsgrundlagen, die jede Rechtsordnung für sich getroffen hat. Drei Entwicklungen sind gleichwohl
    zu beobachten. Erstens die Aufsichtsebene: Ayinde wurde dem Bar Council, der Law Society und dem Council
    of the Inns of Court mit der Aufforderung übersandt, dringlich weitere Schritte zu erwägen; ob daraus
    verbindliche Regeln geworden sind, ist nicht erfasst, ebenso wenig der Ausgang irgendeiner der zahlreichen
    Verweisungen. Zweitens die Kodifizierung: Spanien hat mit der Circular 3/2026 des CGAE und der Instrucción
    2/2026 des CGPJ als erste Rechtsordnung den Maßstab für Anwaltschaft und Richterschaft gesondert normiert,
    Italien mit Art. 13 Legge 132/2025 die Mandanteninformation; Entscheidungen dazu fehlen. Drittens
    die Verlagerung des Gegenstands — von der erfundenen Entscheidung über die erfundene Norm (Scott)
    und die falsch wiedergegebene echte Entscheidung (Coomer II) zum gefälschten Beweismittel (Mendones,
    Arbuckle) und zur Vertraulichkeit ([2026] UKUT 81). Für den vorletzten Schritt fehlt in den Vereinigten
    Staaten die Beweisregel: Der Vorschlag eines Fed. R. Evid. 707 steht im August 2026 nicht mehr auf
    der Liste der anhängigen Änderungen, stattdessen sind die Rules 104 und 902 neu zur Stellungnahme
    gestellt. In Deutschland ist die prozessuale Seite unbesetzt — das Kammergericht hat § 43 BRAO gewählt
    und damit Kostenfolge, Zurückweisung und Verzögerungssanktion offengelassen; eine zweite veröffentlichte
    deutsche Entscheidung existiert nicht.

    '
  eigene_bewertung: 'Die Sanktionshöhen bilden keine Skala. Der Anstieg von 5.000 USD (Mata 2023) auf
    46.511,35 USD (Kleyman 2026) wird durchweg als Verschärfung des Maßstabs gelesen; er ist keine. Die
    Strafkomponente in Kleyman beträgt 10.000 USD — das Doppelte von Mata, bei 23 statt sechs erfundenen
    Entscheidungen, nach ausdrücklicher Warnung der Gegenseite und nach einer bereits verhängten Sanktion
    desselben Gerichts. Der gesamte Rest ist Kostenerstattung. Geändert hat sich die Bemessungsgrundlage:
    von der gegriffenen Buße zur Rechnung des Gegners. Das kehrt den Maßstab um, denn die Sanktion bemisst
    sich dann nach dem Stundensatz der Gegenseite, nach der Zahl der zu überprüfenden Einreichungen und
    nach der Kanzleigröße auf der anderen Seite — nach Größen also, die mit dem Verschulden nichts zu
    tun haben. Derselbe Fehler kostet gegen einen Einzelanwalt einen Bruchteil dessen, was er gegen eine
    Großkanzlei kostet. Wer die Kurve der Höchstbeträge als Abschreckung präsentiert, misst die Anwaltsstunden
    der Gegenseite und nennt es Missbilligung. Der zweite Befund ist die leere Kontemptdrohung, und der
    Bestand belegt selbst, wie der gegenteilige Eindruck entsteht. Drei Gerichte haben den Vorwurf erhoben
    — Ayinde, Ko v. Li, Jones —, keines hat ihn vollzogen: England sah ab und stellte klar, dies sei kein
    Präzedenzfall; Ontario stellte das durch 2025 ONSC 2766 eingeleitete Verfahren mit 2025 ONSC 2965
    unter Auflagen wieder ein; Neuseeland sprach obiter. Der Eintrag zu Ko v. Li führte den Fall bis zur
    Verifikation als weltweit erste Vollziehung — der Irrtum ist lehrreich, weil er zeigt, woraus die
    Erzählung von der Verschärfung besteht: aus dem Verfahrenseingang, nicht aus dem Ausgang. Die einzige
    Rechtsordnung, die tatsächlich wegen Missachtung des Gerichts geahndet hat, ist Russland, und sie
    tat es mit rund 500 Euro. Drittens ist die scheinbare Divergenz zwischen Lacey und Johnson v. Dunn
    keine Wertungs-, sondern eine Adressatenfrage, und das ist unbequem. In Lacey rettete die offene Einlassung
    die einzelnen Anwälte, weil die Sanktion auf die Kanzleien verschoben werden konnte. In Johnson v.
    Dunn gab es diese Ausweichebene nicht; sanktioniert wurden die handelnden Anwälte, Butler Snow als
    Organisation blieb außen vor. Reue entlastet also nicht als Milderungsgrund, sondern nur dort, wo
    ein zweiter Adressat bereitsteht. Das ist eine Aussage über Kanzleistrukturen und nicht über Haltung:
    Wer in einer Sozietät mit belangbarer Organisation arbeitet, kann sich freireden, der Einzelanwalt
    nicht. Viertens hat das pro-se-Paradox eine dogmatische Ursache, die niemand benennt. Die Spitzenwerte
    der jeweiligen Rechtsordnung fallen gegen Laien — 10.000 USD in Kruse, 20.000 CAD in Arbuckle —, während
    der Regelfall die Verwarnung ist. Beides folgt aus derselben Lücke: Gegen Anwälte steht ein abgestuftes
    Instrumentarium bereit, das nach Vorwerfbarkeit dosiert werden kann — Rüge, Fortbildungsauflage, Mandatsentbindung,
    Kammerverweisung, Aussetzung der Zulassung. Gegen Parteien bleibt allein das Kostenrecht, und das
    kennt keine Abstufung nach Vorwerfbarkeit, sondern nur den Schaden. Die Gerichte stehen deshalb vor
    einer Alternative ohne Mitte: Verwarnung oder Vollentschädigung. Die scheinbare Milde der amerikanischen
    pro-se-Linie ist nicht Nachsicht, sondern Verzicht auf ein unpassendes Instrument, und die Fußnotenauflage
    aus Rako — jede Fundstelle mit dem Vermerk "Located through AI; Checked" — ist der einzige Versuch,
    etwas dazwischen zu schaffen; sie ist die Übertragung der Gauthier-Fortbildungsauflage auf den, der
    keine Berufspflicht hat, und gehört in die Praxisrichtlinien. Fünftens, und daran hängt der ganze
    Streit, ohne dass ein Gericht es ausspricht: Ist die erfundene Fundstelle eine Falschaussage oder
    eine falsche Rechtsansicht? Zhang v. Chen sagt, sie sei "tantamount to making a false statement to
    the court", und aus diesem meistzitierten Satz des Feldes folgt der Zugriff auf Wahrheitspflicht,
    Kontempt und Strafrecht. Bewiesen ist er nicht. Ein Zitat ist Rechtsausführung; die Behauptung, eine
    Entscheidung existiere, ist eine Tatsachenbehauptung über den Rechtsstoff, nicht über den Streitgegenstand.
    Das amerikanische Recht markiert die Naht selbst — Rule 11(b)(2) betrifft legal contentions, Abs.
    3 factual contentions, und sämtliche Halluzinationsfälle stützen sich auf Abs. 2. Wer die Fundstelle
    gleichwohl als Falschaussage behandelt, springt über diese Naht, ohne sie zu erwähnen. Für das deutsche
    Recht ist das die entscheidende offene Frage: § 138 Abs. 1 ZPO verpflichtet zur Wahrheit über Tatsachen,
    nicht über Rechtsansichten — deshalb musste das Kammergericht zu § 43 BRAO greifen und landete bei
    einer folgenlosen Verwarnung. Deutschland ist damit die einzige Tier-1-Rechtsordnung, in der die gerichtliche
    Feststellung der Halluzination keine Rechtsfolge auslöst. Wer das ändern will, muss nicht das Berufsrecht
    verschärfen, sondern diese Vorfrage beantworten. Sechstens ist der Verursacher in keinem einzigen
    Verfahren dieser Welt Beteiligter. In Kruse hatte ein kommerzieller "Consultant" den Schriftsatz erstellt;
    sanktioniert wurde die Partei. In Lacey haben CoCounsel und Westlaw Precision halluziniert; sanktioniert
    wurden die Kanzleien. Die Formel, die Wahrheitspflicht sei nicht an ein Softwareprogramm delegierbar,
    ist als Pflichtenbeschreibung richtig, wird aber stillschweigend zur Haftungsfreistellung des Anbieters
    umgedeutet — und zusammen mit dem Befund aus Lacey, dass gerade die RAG-gestützten Fachprodukte erfinden,
    ergibt das die eigentliche Marktverzerrung: Der Anbieter bewirbt Zuverlässigkeit, das Risiko trägt
    vollständig der Nutzer, und kein Gericht hat bisher gefragt, ob eine Zusicherung im Lizenzvertrag
    daran etwas ändert. Siebtens, und das ist der Zusammenhang, den bislang niemand zieht: Italien und
    die Vereinigten Staaten behandeln die Unterrichtung des eigenen Mandanten spiegelverkehrt. In Mata,
    Park v. Kim und Gauthier ist sie Bestandteil der Sanktion — nachträglich, erzwungen, als Bloßstellung
    im Nahbereich. Art. 13 Legge 132/2025 macht dieselbe Unterrichtung zur gesetzlichen Pflicht ex ante.
    Wer sie vorher erfüllt, dem kann sie hinterher nicht mehr auferlegt werden. Die italienische Vorschrift
    ist damit nicht bloß Transparenzrecht, sondern nimmt dem Gericht sein wirksamstes nichtmonetäres Druckmittel
    aus der Hand.

    '
