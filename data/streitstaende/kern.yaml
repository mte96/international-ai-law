  fehlende_belege:
  - 'ZENTRALE NORMLÜCKE: Art. 5 Abs. 1 lit. h KI-VO — das Verbot der biometrischen Echtzeit-Fernidentifizierung
    in öffentlich zugänglichen Räumen zu Strafverfolgungszwecken samt seinem Ausnahmekatalog — ist im
    Normenverzeichnis NICHT erfasst. Erfasst sind nur Art. 5, Art. 5 Abs. 1 lit. b, lit. e und Abs. 5.
    Damit fehlt genau die Vorschrift, gegen die dieser Streitstand die französische und die griechische
    Linie stellt. Ebenfalls nicht erfasst sind Art. 5 Abs. 1 lit. f (Emotionserkennung am Arbeitsplatz
    und in Bildungseinrichtungen), lit. g (biometrische Kategorisierung) sowie Art. 5 Abs. 2 bis 7 (Verfahren,
    Vorabgenehmigung, nationale Umsetzungsentscheidung, Meldepflichten). Die Inhalte dieser Vorschriften
    sind hier aus eigener Kenntnis wiedergegeben und nicht mit Wortlaut hinterlegt.'
  - Anhang III Nr. 1 KI-VO (Biometrie als Hochrisikobereich) ist nicht als Normeintrag angelegt, obwohl
    der Zeitplan des Streitstands — Pflichten erst ab 02.12.2027 — unmittelbar daran hängt. Dasselbe gilt
    für Anhang II KI-VO, auf den die Ausnahmen des Art. 5 Abs. 1 lit. h verweisen.
  - Art. L. 251-2 code de la sécurité intérieure fehlt im Normenverzeichnis. Das ist die Vorschrift, deren
    Auslegung die tragende Entscheidung dieses Streitstands ausmacht. Erfasst ist nur der vorgeschlagene
    Art. L. 251-1-1 CSI aus der PPL Verzelen. Aufzunehmen mit Wortlaut, damit der Satz „dans leur silence“
    am Normtext nachvollziehbar ist.
  - Art. 45A und Art. 46 ν. 4624/2019 — die griechische Umsetzung der Richtlinie (EU) 2016/680, auf die
    die ΑΠΔΠΧ ihre Entscheidung 45/2025 stützt — sind nicht als Normeinträge erfasst; aus dem griechischen
