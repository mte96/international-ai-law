  - position: Kein Verbot, sondern nachträgliche Sanktion — die Datenschutzaufsicht
    stelle: ΑΠΔΠΧ (GR), Information Commissioner's Office (UK), Office of the Australian Information Commissioner,
      Office of the Privacy Commissioner of Canada mit CAI Québec, OIPC British Columbia und OIPC Alberta;
      ferner Federal Trade Commission
    begruendung: 'Wo kein Verbotstatbestand steht, sanktioniert die Aufsicht im Nachhinein — und dabei
      zeigen sich drei verschiedene dogmatische Wege zu demselben Ergebnis. Griechenland und das Vereinigte
      Königreich argumentieren über die fehlende Rechtsgrundlage: 20 Mio. Euro nebst Verarbeitungs- und
      Löschungsanordnung wegen Verstoßes gegen Art. 5 Abs. 1 lit. a, 6, 9, 12, 14, 15 und 27 DSGVO beziehungsweise
      7.552.800 GBP nebst Enforcement Notice, getragen von der Verhaltensbeobachtung nach Art. 3(2)(b)
      UK GDPR. Kanada geht einen Weg, den die DSGVO nicht kennt: s. 5(3) PIPEDA verlangt, dass der Zweck
      selbst angemessen ist, und die vier Behörden verneinen das, weil die Sammlung Millionen Menschen
      einer dauerhaften polizeilichen Rasterfahndung aussetzt, ohne dass sie einer Straftat verdächtig
      sind. Australien knüpft an die Zuständigkeit an: „carrying on business in Australia“ nach s. 5B
      Privacy Act umfasst die kostenlose Erprobung bei Polizeibehörden zur Kundengewinnung — der Pilot
      begründet die Zuständigkeit. Die Grenze dieses Modells zeigt die griechische Entscheidung zu Κένταυρος
      und Υπερίων: Beanstandet werden Folgenabschätzung, Information, Rechenschaft und Kooperation; ob
      eine Videoanalyse in einer Einrichtung, die Menschen faktisch nicht verlassen können, überhaupt
      auf Art. 6 Abs. 1 lit. e DSGVO gestützt werden kann, bleibt offen, und die Systeme laufen weiter.
      Einen vierten Hebel setzt die FTC an: Sie untersagt IntelliVision nicht den Einsatz, sondern die
      Behauptung, das System habe „zero gender or racial bias“, solange kein belastbarer Test vorliegt.

      '
