  - position: Persönlichkeitsschutz mit Meinungsfreiheitsvorbehalt — Parodie und Kritik bleiben frei
    gericht: High Court of Delhi, Jackie Shroff (15.05.2024) und Alakh Pandey (05.08.2026)
