  - position: Das Trainingsprivileg als Herkunftsprivileg
    stelle: Art. 10 Abs. 2 Föderationsgesetz vom 26.07.2026 Nr. 243-FZ
    begruendung: 'Russland hat die Trainingsschranke nicht an die Handlung geknüpft, sondern an den Handelnden.
      Die Analyse rechtmäßig erlangter oder öffentlich zugänglicher Werke gilt nicht als Verletzung des
      ausschließlichen Rechts, solange keine technischen Zugangsbeschränkungen überwunden werden — aber
      nur zum Zweck der Entwicklung "souveräner" oder "nationaler" Modelle. Souverän ist ein Modell nur
      bei durchgängig russischer Wertschöpfung und Verarbeitung in russischen Rechenzentren, national
      nur bei Steuerung der Kernmerkmale durch einen russischen Entwickler. Ein ausländisches Modell kann
      sich auf die Schranke nicht berufen, auch nicht bei identischer Handlung an identischem Werk. Kein
      Opt-out, keine Vergütung, keine Transparenzpflicht über die Korpora. Nach dem eigenen Bestandseintrag
      gelten die Artikel 8 bis 10 des Gesetzes erst ab dem 01.03.2027; die Schranke ist damit am 05.09.2026
      noch nicht anwendbar, wird aber international bereits als geltendes Recht zitiert. Ihr Verhältnis
      zu den Art. 1229, 1270, 1274 ZGB RF ist ungeklärt — ob Schranke im Sinne des Teils IV oder Sondernorm
      daneben, sagen die Materialien nicht.

      '
