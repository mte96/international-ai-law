  - position: Bloße Verwarnung ohne Verfahren — Deutschland und die britische Fachgerichtsbarkeit
    gericht: Kammergericht Berlin, 17. Zivilsenat, Beschl. v. 20.11.2025 – 17 WF 144/25; First-tier Tribunal
      (Tax Chamber), Harber, [2023] UKFTT 1007 (TC); Upper Tribunal (TCC), Gunnarsson, [2025] UKUT 247
      (TCC); First-tier Tribunal, Elden, [2026] UKFTT 41 (TC)
    begruendung: 'Das Kammergericht stellte fest, dass die zitierten Entscheidungen — darunter ein angeblicher
      Beschluss "BGH, Beschl. v. 14.11.2007 – XII ZB 183/07, FamRZ 2008, 137" — weder in juristischen
      Datenbanken noch auf der Website des BGH existieren, verortete die verletzte Pflicht in § 43 BRAO
      und erteilte eine vorsorgliche Verwarnung; eine Abgabe an die Rechtsanwaltskammer unterblieb, eine
      Kostenfolge ebenfalls. Die britische Fachgerichtsbarkeit verfährt gegenüber nicht vertretenen Parteien
      ebenso: Harber nahm der Klägerin ab, dass sie die Fälschung der neun angeführten Entscheidungen
      nicht erkannt hatte, benannte den Schaden — vergeudete Zeit der Gegenseite, Bindung gerichtlicher
      Ressourcen, Zynismus gegenüber dem Präzedenzsystem als Eckpfeiler der Rechtsordnung — und beließ
      es dabei. Gunnarsson und Elden wiederholen die Warnung, ohne zu sanktionieren.

      '
