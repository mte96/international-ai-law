  stand: 'Fünf gesetzgeberische Regime, fünf Antworten, alle zwischen 2024 und 2026 entstanden, keine
    Konvergenz. Der Streit ist keiner über die Auslegung einer Norm, sondern über die Wahl des Rechtsgebiets
    — und diese Wahl entscheidet über Schutzumfang, Schutzdauer, Rechtsnachfolge, Übertragbarkeit und
    die Reichweite der Meinungs- und Kunstfreiheitsausnahme. Wo die Gesetzgeber zögern, entscheiden die
    Gerichte bereits: Der Delhi High Court hat aus dem allgemeinen Persönlichkeitsrecht binnen drei Jahren
    ein dichtes Verfügungsregime entwickelt und ihm 2026 erstmals eine Meinungsfreiheitsgrenze gezogen;
    das Internetgericht Peking hat entschieden, dass für die Verletzung des Rechts am eigenen Bild Erkennbarkeit
    genügt und Identität nicht erforderlich ist; und in Mexiko hat ein Verfassungsgericht den strafrechtlichen
    Weg gegen den Bestimmtheitseinwand verteidigt.

    '
  positionen:
  - position: Urheberrecht — Leistungsschutz und Persönlichkeitsschutz im Urheberrechtsgesetz
    stelle: Dänemark, §§ 65 a und 73 a ophavsretsloven (Entwurf, nicht in Kraft)
    begruendung: '§ 65 a schützt ausübende Künstler und Artisten vor der öffentlichen Zugänglichmachung
      wirklichkeitsnaher digital erzeugter Nachbildungen ihrer Darbietung; § 73 a jede natürliche Person
      vor der Zugänglichmachung wirklichkeitsnaher Nachbildungen ihrer persönlichen körperlichen Merkmale.
      Beide Rechte sind einwilligungsabhängig und laufen bis zum Ablauf von 50 Jahren nach dem Todesjahr
      des Betroffenen. § 73 a stk. 2 nimmt Karikatur, Satire, Parodie, Pastiche sowie Macht- und Gesellschaftskritik
      aus, nimmt diese Ausnahme aber zurück, soweit die Nachbildung Desinformation darstellt, die konkret
      eine ernsthafte Gefahr für Rechte oder wesentliche Interessen anderer begründen kann. Durchsetzung
      ausschließlich zivilrechtlich; die Presseausnahme ist über die urheberrechtlichen Schranken der
      §§ 23 stk. 2 und 25 konstruiert.

      '
