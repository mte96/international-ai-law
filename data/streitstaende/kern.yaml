  - position: Geregelt wird der Parteivortrag, nicht die Richterbank
    stelle: Federal Court of Australia (GPN-AI); Supreme Court of New South Wales (SC Gen 23); Supreme
      Court of Victoria (SC GEN 25); Supreme Court of South Australia; Supreme Court of Western Australia
      (nur Konsultation); N.D. Tex. (Standing Order Starr)
    begruendung: 'Der zahlenmäßig größte Teil aller gerichtlichen KI-Regelwerke adressiert nicht das Gericht,
      sondern die vor ihm Auftretenden. New South Wales verbietet den Einsatz für den Inhalt eidesstattlicher
      Versicherungen, Zeugenaussagen und Sachverständigengutachten absolut und nicht durch Offenlegung
      heilbar; der Federal Court verlangt Offenlegung und Authentizität statt eines Verbots; Victoria
      verlangt weder Offenlegung noch verbietet es, sondern setzt auf Überprüfung und Kostensanktion;
      Western Australia hat seit der Konsultation vom März 2025 gar nichts erlassen, so dass in Perth
      im selben Gerichtsgebäude für Bundes- und Landesverfahren Verschiedenes gilt. Die USA regeln denselben
      Gegenstand über Hunderte einzelner Kammeranordnungen seit der Anordnung von Judge Starr vom 30.05.2023
      — Offenlegungspflicht, Verbot, Bestätigungspflicht oder bloßer Hinweis auf Rule 11, je nach Kammer.
      Für den Spruchkörper selbst enthält keines dieser Regelwerke eine Vorgabe; New South Wales, Queensland
      und Victoria halten dafür gesonderte, nicht deckungsgleiche Leitlinien für Richterschaft und Gerichtspersonal
      bereit.

      '
