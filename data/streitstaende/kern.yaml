  - position: Ergebniskontrolle statt Werkzeugtransparenz — auf das System kommt es nicht an, auf die
      menschliche Befassung schon
    gericht: Federal Court of Canada (Chinook-Linie 2023) und Oberster Gerichtshof Israels (Ramat Gan,
      2026)
    begruendung: 'Der kanadische Ausgangspunkt ist die Gegenposition zu jedem Transparenzanspruch: Der
      Einsatz des Vorsortierungswerkzeugs Chinook sei "irrelevant", solange ein Beamter die Entscheidung
      trifft; geprüft wird allein deren Angemessenheit nach Vavilov. Die abstrakte Kritik am Werkzeug
      genügt nicht, es bedarf beweisgestützten Vortrags zum Einzelfall. Korrigiert wurde die Linie noch
      im selben Jahr über die Begründung: Textbausteine sind nicht zu beanstanden, das überprüfende Gericht
      muss sich aber davon überzeugen, dass der Entscheider sich tatsächlich mit den Tatsachen befasst
      hat, und ein Werkzeug, das eine verkürzte Sicht auf den Antrag vermittelt, kann die Entscheidung
      unangemessen machen. Der israelische Oberste Gerichtshof formuliert dasselbe als Verbot: Ergebnisse
      KI-gestützter Systeme bedürfen menschlicher Überprüfung, blindes Vertrauen begründet einen Verwaltungsfehler,
      und die Delegation des Ermessens an ein automatisiertes System ist unzulässig, soweit individuelle
      Rechte betroffen sind — hergeleitet allein aus allgemeinem Verwaltungsrecht, ohne jede spezialgesetzliche
      Grundlage.

      '
    urteile:
    - ca-2023-haghshenas
    - ca-2023-raja
    - ca-2023-safarian
    - ca-2023-khosravi
    - il-2026-ramat-gan
  - position: Nicht die Verborgenheit der Methode war rechtswidrig, sondern die Methode
    gericht: Federal Court of Australia (Amato 2019; Prygodicz 2021) und Royal Commission into the Robodebt
      Scheme (Abschlussbericht 07.07.2023)
    begruendung: 'Der australische Fall ist der größte automatisierte Verwaltungsschaden, den eine Rechtsordnung
      aufgearbeitet hat — und er ist ohne streitige Entscheidung geblieben. Der Commonwealth hat im Musterprozess
      anerkannt und in der beigefügten Erklärung selbst festgehalten, dass die Annahme gleichmäßiger Vierzehntageeinkünfte
      aus gemittelten Jahresdaten durch nichts gestützt war und die Schlussfolgerung auf eine Schuld deshalb
      irrational; der Vergleich über rund 1,872 Mrd. AUD enthält die Feststellung, dass allein auf Mittelung
      gestützte Bescheide unwirksam sind. Der Untersuchungsbericht stellt fest, dass entgegenstehender
      Rechtsrat vorlag und ignoriert wurde. Angegriffen wurde nie die Undurchsichtigkeit des Verfahrens,
      sondern seine sachliche Unhaltbarkeit — der Befund, den keine Auskunft über Logik, Parameter oder
      Quellcode zutage gefördert hätte.

      '
    urteile:
    - au-2019-amato
    - au-2021-prygodicz
    - au-2023-robodebt-royal-commission
  - position: Beweisrecht — die Vermutung ordnungsgemäßer Funktion und ihr Zusammenbruch
    gericht: High Court of Justice, Bates ./. Post Office (Horizon Issues, 16.12.2019); Court of Appeal
      (Criminal Division), Hamilton (23.04.2021)
    begruendung: 'Der englische Weg führt nicht über einen Auskunftsanspruch, sondern über die Beweisvermutung.
      Fraser J stellte fest, dass das Horizon-System die ihm zugeschriebene Verlässlichkeit nicht besaß
      und die Post Office über bestrittene Fernzugriffsmöglichkeiten verfügte; damit war gezeigt, dass
      sich die Common-Law-Vermutung, Computer arbeiteten korrekt, empirisch widerlegen lässt — sofern
      die Gegenseite Zugang zu Fehlerprotokollen und Änderungsverzeichnissen erhält. Der Court of Appeal
      hob daraufhin 39 von 42 Verurteilungen als Verfahrensmissbrauch auf, weil die Anklägerin die Zuverlässigkeit
      des Systems nicht überprüft und entlastendes Material nicht offengelegt hatte, obwohl seine Daten
      die einzige Grundlage der Anklagen waren. Der Anspruch richtet sich hier nicht auf die Logik, sondern
      auf die Fehlergeschichte.

      '
    urteile:
    - uk-2019-bates-post-office-horizon
    - uk-2021-hamilton-post-office
  - position: Die Vorfrage — vorbereitende Verarbeitung ist keine ausschließlich automatisierte Entscheidung
    gericht: Bundesverwaltungsgericht Wien, 18.12.2020 – W256 2235360-1 (AMS-Algorithmus / AMAS)
    begruendung: 'Vor jedem Auskunfts- und Erläuterungsanspruch steht die Frage, ob überhaupt eine automatisierte
      Entscheidung im Sinne des Art. 22 DSGVO vorliegt — und an dieser Vorfrage ist der bekannteste europäische
      Streit über ein staatliches Profilingsystem gescheitert. Das BVwG hob die Untersagung des Arbeitsmarktchancen-Assistenz-Systems
      ersatzlos auf: Art. 22 DSGVO setze eine ausschließlich automatisierte Verarbeitung voraus; eine
      Verarbeitung, die eine menschliche Entscheidung lediglich vorbereitet und unterstützt, falle nicht
      darunter. Die Rechtsgrundlage für die Verarbeitung arbeitsmarktbezogener Daten einschließlich Gesundheitsdaten
      fand das Gericht in § 25 AMSG i.V.m. Art. 9 Abs. 2 lit. g DSGVO. Das Modell gewichtete Geschlecht,
      Alter, Staatsangehörigkeit, Betreuungspflichten und gesundheitliche Beeinträchtigung und steuerte
      die Zuteilung von Fördermitteln. Die Abgrenzung steht in erkennbarem Spannungsverhältnis zur späteren
      Linie des Gerichtshofs in C-634/21 (SCHUFA) — und sie ist die Position, an der sämtliche Transparenzansprüche
      scheitern, sobald am Ende formal ein Mensch entscheidet.

      '
    urteile:
    - at-2020-bvwg-ams-algorithmus
  - position: Verarbeitungsverbot statt Auskunft — und die Zweiteilung zwischen Score-Ersteller und Score-Verwender
    gericht: Datenschutzbehörde Wien, 25.09.2025 – 2025-0.355.103 (RiskScore)
    begruendung: 'Die Gegenbewegung zur AMAS-Entscheidung durch dieselbe Rechtsordnung, fünf Jahre später,
      und die erste österreichische Aufsichtsentscheidung, die ein sofort wirksames Verarbeitungsverbot
      gegen ein automatisiertes Scoringsystem ausspricht. Der Beschwerdeführer wurde binnen einer Minute
      nach Antragstellung abgelehnt, ohne dass eine natürliche Person eingriff. Die Behörde wendet die
      Auslegung des Gerichtshofs an, wonach eine automatisierte Entscheidung schon dann vorliegt, wenn
      ein Wahrscheinlichkeitswert automatisiert erstellt wird und maßgeblich davon abhängt, ob ein Dritter
      ein Vertragsverhältnis begründet — festgestellt wurden Verletzungen von Art. 22 Abs. 1, Art. 14
      Abs. 2 lit. g und Art. 15 DSGVO. Praktisch bedeutsam ist die Zweiteilung, und sie ist die eigentliche
      Neuerung: Der Score-Ersteller haftet nach Art. 22 DSGVO, der Score-Verwender kann sich auf die Erforderlichkeitsausnahme
      berufen, weil eine vollautomatisierte Bonitätsprüfung bei 6.000 bis 10.000 Vertragsanträgen anders
      nicht zu bewältigen wäre. Damit verschiebt sich der Adressat des Transparenzanspruchs vom Entscheidenden
      zum Rechnenden — die europäische Spiegelung der amerikanischen Frage nach der Anbieterhaftung, nur
      mit umgekehrtem Vorzeichen.

      '
    urteile:
    - at-2025-dsb-riskscore-verarbeitungsverbot
  - position: Erkennende Systeme sind keine messenden — keine Offenlegung der Trainingsparameter
    gericht: Арбитражный суд Московского округа — Arbitragegericht des Moskauer Bezirks, 26.01.2024 –
      Ф05-33861/23
    begruendung: 'Die schärfste Aussage zur Transparenz automatisierter Verwaltungsentscheidungen im Bestand,
      und sie fällt negativ aus. Gegenstand war ein „automatisierter Komplex mit neuronaler Netzwerk-Videofixierung"
      zur Feststellung mangelhafter Schneeräumung. Die Vorinstanz hatte den Bescheid beanstandet, weil
      die Trainingsparameter des Netzes nicht offengelegt waren; die höheren Instanzen hoben das auf:
      Automatische Erfassung ohne physikalische Messung sei zulässig, anders als bei Geschwindigkeitsmessgeräten,
      die einer Eichung bedürfen. Die Unterscheidung zwischen messenden und erkennenden Systemen ist technisch
      nachvollziehbar und rechtlich fragwürdig — gerade weil ein Klassifikator nicht misst, sondern schätzt,
      wäre die Offenlegung von Trainingsdaten und Fehlerraten wichtiger als bei einem geeichten Messgerät.
      Als Kontrastfall zu Art. 86 KI-VO und Art. 22 DSGVO ist die Entscheidung die klarste Gegenposition
      des Bestandes: Sie verneint jeden Anspruch auf Einsicht in die Funktionsweise, ohne ihn abzuwägen.

      '
    urteile:
    - ru-2024-f05-schneeraeumung
  unterfragen:
  - frage: Wer kann Transparenz verlangen?
    ja: 'jedermann: Informationsfreiheitsrecht (BOSCO); die Öffentlichkeit: Auslegungsvorbehalt des Conseil
      constitutionnel'
    nein: 'nur der Betroffene: Art. 15 Abs. 1 lit. h DSGVO, Art. 86 KI-VO, Conseil d''État im Parcoursup-Verfahren'
  - frage: Ist der Quellcode geschuldet?
    ja: Tribunal Supremo (BOSCO), für regelbasierte Verwaltungsanwendungen
    nein: EuGH C-203/22; nach dem Sitzungsbericht auch der BGH im SCHUFA-Verfahren
  - frage: Ist Erklärbarkeit ein Betroffenenrecht oder eine Zulässigkeitsvoraussetzung?
    ja: 'Betroffenenrecht: DSGVO und Art. 86 KI-VO'
    nein: 'Zulässigkeitsvoraussetzung: Conseil constitutionnel — wer nicht erklären kann, darf nicht einsetzen'
  - frage: Trägt die conoscibilità auch bei lernenden Systemen?
    ja: so wird die italienische Linie regelmäßig zitiert
    nein: ungeklärt — sie ist zu regelbasierten Systemen ergangen; Cons. Stato n. 7891/2021 markiert den
      Unterschied, ohne die Folge zu ziehen
  aufloesung: 'Zwei Termine. Der BGH hat am 18.06.2026 fünf Parallelverfahren gegen die SCHUFA verhandelt
    (I ZR 226/25 bis I ZR 230/25); ein Verkündungstermin am 21.10.2026 ist bislang nur durch die LTO-Berichterstattung
    belegt, nicht durch eine amtliche Terminmitteilung. Nach dem Sitzungsbericht wird der Senat dem weiten
    Ansatz des OLG Dresden voraussichtlich nicht folgen. Und Art. 86 KI-VO ist seit dem 02.08.2026 anwendbar,
    während die Pflichten für Anhang-III-Systeme erst am 02.12.2027 greifen. Eine EuGH-Vorlage zum Verhältnis
    von Art. 86 KI-VO und Art. 15 Abs. 1 lit. h DSGVO steht aus; das als erledigt vermerkte Verfahren
    C-806/24 hätte sie berühren können.

    '
  eigene_bewertung: 'Dass das Datenschutzrecht dem Einzelnen wenig und das Informationsfreiheitsrecht
    jedermann viel gibt, ist kein Zufall und keine Lücke, sondern die Folge der Regimewahl. Art. 15 Abs.
    1 lit. h DSGVO ist ein Recht der betroffenen Person; sein Inhalt bemisst sich deshalb an dem, was
    diese Person braucht — und der EuGH hat diesen Bedarf kontrafaktisch bestimmt. Das Informationsfreiheitsrecht
    ist ein Recht des Bürgers gegen den Staat; sein Inhalt wird nur durch Ausnahmetatbestände begrenzt.
    Daraus folgt eine Arbeitsteilung, die niemand geplant hat: Algorithmentransparenz im öffentlichen
    Sektor wird von Nichtregierungsorganisationen über das Transparenzgesetz durchgesetzt, nicht von Betroffenen
    über die DSGVO. Im privaten Sektor, wo es kein Informationsfreiheitsrecht gibt, führt strukturell
    überhaupt kein Weg zum Code. Wer die Asymmetrie schließen will, muss deshalb nicht die DSGVO ändern,
    sondern ein Register schaffen. Der zweite Befund ist eine Zeitlücke, die, soweit ersichtlich, unbeschrieben
    ist. Die Verordnung (EU) 2026/1744 hat Kapitel III Abschnitte 1 bis 3 verschoben, nicht Kapitel IX
    Abschnitt 4. Art. 86 KI-VO gilt damit seit dem 02.08.2026, während die Aufzeichnungspflicht des Art.
    12 und die technische Dokumentation des Art. 11, die eine Erläuterung überhaupt erst möglich machen,
    für Anhang-III-Systeme erst am 02.12.2027 anwendbar werden. Für sechzehn Monate schuldet der Betreiber
    eine Erläuterung über ein System, das noch nicht dokumentiert werden muss. Entweder läuft der Anspruch
    leer, oder er zwingt den Betreiber, vom Anbieter zu verlangen, was dieser noch nicht schuldet — womit
    Art. 86 KI-VO zunächst kein Grundrechts-, sondern ein Vertragsproblem in der Wertschöpfungskette ist.
    Diese Einschätzung beruht auf eigener Lesung der Verordnung und ist nicht durch Literatur belegt.
    Der dritte Punkt ist der griechische, und er ist der unbequemste: Ein Mitgliedstaat, der 2022 einen
    individuellen Anspruch auf die Entscheidungsparameter und ein öffentliches Register hatte, hat beides
    2026 aufgehoben, weil die Verordnung als abschließend gilt. Die Harmonisierung hat den Betroffenen
    in Griechenland damit schlechter gestellt als vor der KI-VO — und das ausgerechnet in dem Bereich,
    den Art. 86 regeln soll.

    '
