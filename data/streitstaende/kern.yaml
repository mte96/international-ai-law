  - position: Verbot mit Ausnahmekatalog — die Unionslösung
    stelle: Art. 5 KI-VO in der Fassung der VO (EU) 2026/1744, anwendbar seit 02.02.2025
    begruendung: 'Die Verordnung wählt die entgegengesetzte Technik. Sie stellt Verbotstatbestände auf
      und öffnet sie wieder: Art. 5 Abs. 1 lit. e verbietet den ungezielten Aufbau von Gesichtserkennungsdatenbanken
      durch Auslesen aus dem Internet oder aus Videoüberwachung; die biometrische Echtzeit-Fernidentifizierung
      zu Strafverfolgungszwecken ist verboten, aber für gezielte Suche, Abwendung konkreter Gefahren und
      die Lokalisierung Verdächtiger schwerer Straftaten wieder zugelassen, flankiert von Folgenabschätzung,
      Registrierung, vorheriger Genehmigung und dem Erfordernis einer nationalen Umsetzungsentscheidung.
      Art. 26 Abs. 10 unterwirft die nachträgliche Fernidentifizierung einem Genehmigungsvorbehalt, Art.
      14 Abs. 5 verlangt die Bestätigung eines Treffers durch zwei Personen. Biometrie ist zugleich Hochrisikobereich
      des Anhangs III; die zugehörigen Pflichten sind durch VO (EU) 2026/1744 auf den 02.12.2027 verschoben.
      Der Preis dieser Technik ist der, den Hahn beschreibt: Das Verbot wird durch seine Ausnahmen entwertet,
      und über Datenbasis, Trefferschwellen und Fehlerquoten sagt es nichts. Art. 5 Abs. 5 hält strengeres
      mitgliedstaatliches Recht offen — geschrieben für strengere Normen, nicht für den Fall, dass ein
      Mitgliedstaat strenger ist, weil er gar keine Norm hat.

      '
