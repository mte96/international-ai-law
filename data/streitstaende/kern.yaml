  titel: Sanktionsmaßstab bei KI-erfundenen Fundstellen im Schriftsatz
  frage: 'Nach welchem Maßstab, gegen wen und mit welcher Rechtsfolge wird sanktioniert, wer dem Gericht
    von einem Sprachmodell erfundene Entscheidungen, Zitate oder Normen vorlegt?

