    begruendung: 'Die Eingaben an das Programm und die vorgenommenen Anpassungen seien "rein mechanische,
      technische Handlungen"; die KI erbringe keine schöpferische Anstrengung, weil sie kein Bewusstsein
      habe. Der Kläger habe seinen persönlichen schöpferischen Beitrag nach Art. 1228 ZGB nicht nachgewiesen.
      Die Divergenz zur Werkzeugthese ist strukturell und nicht bloß inhaltlich: Vor den Arbitragegerichten
      trägt der Verletzer die Behauptung der Maschinenerzeugung und scheitert an der Urhebervermutung;
      vor den Bezirksgerichten trägt sie der Anspruchsteller und scheitert am Nachweiserfordernis. Über
      die Vereinheitlichung soll die angekündigte Praxisübersicht des Obersten Gerichtshofs entscheiden.

      '
    urteile:
