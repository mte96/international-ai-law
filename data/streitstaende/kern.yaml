  - position: Gesetzesvorbehalt mit Nachbesserungsfrist — die dritte, deutsche Linie
    gericht: Bundesverfassungsgericht, Erster Senat, Urt. v. 16.02.2023 – 1 BvR 1547/19, 1 BvR 2634/20
      (hessenDATA); ferner Urt. v. 01.10.2024 – 1 BvR 1160/19 (BKAG II)
    begruendung: 'Karlsruhe liegt nicht auf der Linie von Nizza und Athen, sondern auf einer eigenen —
      und zwar aus drei Gründen. Erstens ist der Gegenstand ein anderer: hessenDATA betrifft die Analyse
      bereits gespeicherter Daten, nicht die Erhebung im öffentlichen Raum; die deutsche Biometriefrage
      liegt dem Gericht überhaupt nicht vor, sie steht in §§ 98d, 98e StPO-E. Zweitens ist die Denkfigur
      eine andere: Der Senat liest kein Verbot aus dem Schweigen des Gesetzes, sondern misst eine vorhandene
      Ermächtigung an einer Schwelle und findet sie zu niedrig — beide Normen blieben „weit hinter der
      verfassungsrechtlich gebotenen Schwelle einer konkretisierten Gefahr“ zurück. Drittens ist die Rechtsfolge
      eine andere: Nichtig war nur § 49 Abs. 1 Alt. 1 HmbPolDVG; § 25a Abs. 1 Alt. 1 HSOG galt unter Maßgaben
      bis zum 30.09.2023 fort. Wo der Conseil d''État sagt, dass heute nichts erlaubt ist, sagt das Bundesverfassungsgericht,
      dass der Gesetzgeber nachbessern muss und die Software einstweilen weiterläuft. Der fünfte Leitsatz
      ist die eigentliche deutsche Position: Die wesentlichen Begrenzungen muss der Gesetzgeber selbst
      treffen; überlässt er die Ausgestaltung der Verwaltung, muss diese die Kriterien abstrakt formulieren
      und veröffentlichen. Das ist eine Wesentlichkeits-, keine Erlaubnisdogmatik. BKAG II fügt die Vorfrage
      hinzu, die hessenDATA offenlässt: was überhaupt gespeichert bleiben darf. Ob die Länder den fünften
      Leitsatz erfüllt haben, ist seit dem 21.06.2024 (Hessen), dem 23.07.2025 (Bayern) und in Nordrhein-Westfalen
      seit spätestens Anfang 2024 anhängig; Berlin wird seit dem 28.08.2026 im abstrakten Normenkontrollverfahren
      vor dem Landesverfassungs-gerichtshof geprüft. Entschieden ist keines dieser Verfahren.

      '
