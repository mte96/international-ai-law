    ja: Indien — eine begründete, wenn auch nur summarische Sachentscheidung liegt vor
    nein: 'Kanada (Zuständigkeit), Vereinigtes Königreich (Anspruch fallengelassen), Japan und Korea (nur
      Klageerhebungen), USA (kein Berufungsurteil), China (Ausgabenhaftung), Israel (Verwaltungsmeinung),
