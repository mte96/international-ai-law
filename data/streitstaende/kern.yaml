  stand: 'Vollständig ungeklärt. Keine einzige Berufungsentscheidung. Die einzige gerichtliche Äußerung
    ist eine ausdrückliche Nichtfestlegung — und das Verfahren, in dem sie erging, ist am 07.01.2026 verglichen
    worden, zusammen mit vier Parallelverfahren. Die Fragen sind damit nicht erledigt, sondern verlagert:
    in das kalifornische Koordinationsverfahren JCCP 5431, in ein paralleles Bundesverfahren, das nicht
    ausgesetzt wurde, und in ein verfassungsrechtliches Verfahren, in dem der Anbieter selbst die Sprechereigenschaft
    behauptet.

    '
  positionen:
  - position: Nicht entschieden, aber auch nicht verneint
    gericht: M.D. Fla., Garcia v. Character Technologies, Mai 2025
    begruendung: 'Das Gericht ist nicht bereit zu entscheiden, dass der Output Rede ist — es verneint
      es aber auch nicht.

      '
    urteile:
