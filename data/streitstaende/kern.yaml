  - position: Teilaufhebung im abstrakten Normenkontrollverfahren und verfassungskonforme Auslegung —
      die Schweizer Variante
    gericht: Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung, 17.10.2024 – 1C_63/2023
      (BGE 151 I 137)
    begruendung: 'Die Schweiz beantwortet die Frage weder über einen Verbotstatbestand noch über eine
      Einzelerlaubnis, sondern über die abstrakte Normenkontrolle gegen ein kantonales Polizeigesetz —
      ein Instrument, das weder Frankreich noch Griechenland in dieser Form einsetzen. Das Bundesgericht
      hob § 4quinquies (automatische Fahrzeugfahndung) und § 4octies (polizeilicher Informationssystem-Verbund)
      des Luzerner Polizeigesetzes als unverhältnismäßig und ohne hinreichende gesetzliche Grundlage auf,
      entschied zu § 4sexies (Analysesysteme für serielle Kriminalität) aber im Wege verfassungskonformer
      Auslegung statt der Aufhebung. Damit steht neben dem deutschen Modell des Gesetzesvorbehalts mit
      Nachbesserungsfrist eine vierte europäische Variante: Die Norm bleibt bestehen und wird in ihrer
      Reichweite gerichtlich beschnitten. Für die Einordnung ist wichtig, dass die Schweiz weder an die
      KI-Verordnung noch an die DSGVO gebunden ist; geprüft wurde am nationalen Verfassungs- und Datenschutzrecht.

      '
