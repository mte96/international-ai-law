  stand: 'Die Frage stellt sich derzeit in drei Gestalten, die zusammengehören,

    aber getrennt verhandelt werden.


    Erstens die Zulassung: Der Advisory Committee on Evidence Rules hat

    am 14.08.2026 einen Entwurf für eine Federal Rule of Evidence 707

    zur öffentlichen Kommentierung gestellt, der maschinell erzeugten

    Beweis, der nicht durch einen menschlichen Sachverständigen

    vermittelt wird, denselben Anforderungen unterwerfen soll wie

    Sachverständigenbeweis. Das ist der erste Versuch einer

    allgemeinen Regel überhaupt.


    Zweitens die Erzeugung: In Arizona ist am 01.05.2025 im

    Strafzumessungstermin eine mit KI erzeugte Videodarstellung des

    getöteten Opfers als dessen Opferaussage vorgeführt worden. Das

    Verfahren ist in der Rechtsmittelinstanz.


    Drittens der Echtheitseinwand: In Kenia hat eine Partei im

    Arbeitsprozess bestritten, dass eine Tonaufnahme echt sei, weil sie

    mit Sprechern oder mit KI hergestellt sein könne. In Taiwan hat ein

    Gericht die Herausgabe der Tonaufzeichnung einer mündlichen

    Verhandlung mit Deepfake-Gefahr begründet verweigert. Beide Fälle

    zeigen dieselbe Bewegung: Die Möglichkeit der Fälschung wird zum

    Argument, noch bevor eine Fälschung dargetan ist.

    '
  positionen:
  - position: Die Maschine tritt an die Stelle des Sachverständigen
    gericht: Advisory Committee on Evidence Rules, Entwurf FRE 707, zur Kommentierung gestellt am 14.08.2026
    begruendung: 'Wo eine Maschine eine Aussage über Tatsachen erzeugt, ohne dass ein Mensch sie sich
      zu eigen macht, fehlt die Person, an der die Zuverlässigkeitsprüfung nach Daubert ansetzt. Der Entwurf
      schließt die Lücke, indem er die Anforderungen an den Sachverständigenbeweis auf das Verfahren selbst
      überträgt: Nicht der Zeuge, sondern das Verfahren muss zuverlässig sein.'
    urteile:
    - us-2026-fre-707
  - position: Die Fälschungsmöglichkeit rechtfertigt Zurückhaltung, bevor eine Fälschung dargetan ist
    gericht: Taipei High Administrative Court, 24.08.2026; Employment and Labour Relations Court Kenia,
      06.11.2025
    begruendung: Taiwan verweigert die Herausgabe der Tonaufzeichnung einer Verhandlung, weil sie zur
      Grundlage eines Deepfakes werden könnte; Kenia sieht sich mit dem Einwand konfrontiert, eine vorgelegte
      Aufnahme sei möglicherweise mit Sprechern oder KI hergestellt. In beiden Fällen wirkt die abstrakte
      Möglichkeit der Manipulation, ohne dass sie im Einzelfall belegt wäre. Das verschiebt die Beweislast,
      ohne dass eine Norm es anordnet.
    urteile:
    - tw-2026-tpba-deepfake-tonaufzeichnung
    - ke-2025-kagumu-manipulierte-aufnahme
  - position: Auch der erzeugte Beweis ist zulässig, solange die Kammer seinen Charakter kennt
    gericht: Superior Court of Arizona, Maricopa County, 01.05.2025 (in der Rechtsmittelinstanz)
    begruendung: Die Vorführung einer KI-erzeugten Videodarstellung des Opfers im Strafzumessungstermin
      ist zugelassen worden. Getragen wird das von der Erwägung, dass die Strafzumessung nicht den strengen
      Beweisregeln der Hauptverhandlung unterliegt und das Gericht den Charakter der Darstellung kennt.
      Ob das trägt, entscheidet die Rechtsmittelinstanz.
    urteile:
