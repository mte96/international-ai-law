  - position: Was die Aufsicht daraus macht — Zulassungsentzug, Auflage und der Leitlinienverstoß als
      eigener Vorwurf
    gericht: Colorado Supreme Court, Office of the Presiding Disciplinary Judge, People v. Crabill, 22.11.2023;
      Victorian Legal Services Board and Commissioner, Dayal, 19.08.2025; Supreme Court of Victoria (Moore
      J), Re Walker, 24.11.2025
    begruendung: 'Crabill ist die erste Zulassungssanktion der Welt wegen KI-Nutzung, fünf Monate nach
      Mata: 366 Tage Aussetzung, davon 276 zur Bewährung, also 90 Tage tatsächlicher Berufsausübungsverlust.
      Straferschwerend wirkte nicht die KI-Nutzung, sondern die Unehrlichkeit — Crabill hatte die Verantwortung
      zunächst einem Rechtspraktikanten zugeschoben. Australien reagiert milder und präventiver: Die viktorianische
      Aufsichtsbehörde beschränkte das practising certificate auf Tätigkeit unter Aufsicht, verband dies
      mit Fortbildungsauflagen und ließ im November 2025 eine Generalwarnung an die Anwaltschaft folgen.
      Der Unterschied ist keine Wertungs-, sondern eine Instrumentenfrage: Colorado kennt die befristete
      Aussetzung, Victoria die Auflage. Re Walker verschiebt den Anknüpfungspunkt ein weiteres Mal — gerügt
      wurde nicht die Irreführung des Gerichts, sondern der Verstoß gegen SC GEN 25, die gerichtliche
      KI-Leitlinie selbst; damit wird die Practice Note zur haftungsbegründenden Norm. Die australische
      Breite ist beträchtlich, aber uneinheitlich: In In the matter of Bayfoyle Pty Ltd sah Black J ausdrücklich
      von einer Verweisung ab, und für Western Australia ist zum Stichtag weder eine Entscheidung noch
      eine Practice Direction auffindbar — dort existiert nur die Konsultationsnotiz vom März 2025, während
      die Übersicht der Law Society of NSW eine geltende Leitlinie ausweist.

      '
