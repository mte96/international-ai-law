    begruendung: 'Das Ausgangsgericht hatte sich auf vier angebliche Entscheidungen des Supreme Court
      gestützt, die der High Court als KI-generiert erkannte. Der Supreme Court behandelt eine Entscheidung,
      die sich auf nicht existierende, KI-erzeugte Scheinurteile stützt, ausdrücklich als misconduct mit
      rechtlichen Folgen und hat einen Senior Counsel zur Unterstützung bestellt. Damit liegt die dritte
      denkbare Zuständigkeit vor: nicht das erlassende Gericht (USA), nicht die nächste Instanz mit Kassationsbefugnis
      (Kolumbien, Argentinien), sondern das Höchstgericht, das den Vorgang als Verhaltensfrage aufgreift,
      ohne die Entscheidung selbst zum Gegenstand zu machen.

      '
