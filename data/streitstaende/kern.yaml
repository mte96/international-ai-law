    begruendung: 'Beide Leitgesetze verzichten auf eine Altersverifikationspflicht und knüpfen stattdessen
      an den erkannten Minderjährigen an — das ist die zentrale Lücke, die die kalifornischen Nachfolgevorhaben
      SB 1119, AB 2023, SB 300 und SB 867 schließen sollen. Die beiden Regime sind zudem spiegelbildlich
      konstruiert: New York verlangt die Drei-Stunden-Offenlegung für alle Nutzer und sanktioniert mit
      bis zu 15.000 USD je Tag ausschließlich durch den Attorney General; Kalifornien verlangt die Pausenerinnerung
      nur bei erkannten Minderjährigen, gibt dafür aber ein privates Klagerecht mit mindestens 1.000 USD
      je Verstoß nebst Anwaltskosten — der einzige kalifornische KI-Tatbestand mit dieser Sanktionsstruktur
      und praktisch das größte Prozessrisiko. Beide gelten unabhängig vom Sitz des Betreibers. Wer in
      beiden Staaten anbietet, muss kumulativ erfüllen.

