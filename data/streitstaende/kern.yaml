      bei erkannter Suizidplanung, verkürzte Sicherheitsprüfung vor der Freigabe. Damit wird die im US-Recht
      gefestigte Linie, Information sei kein Produkt, nicht aufgehoben, sondern umgangen — und § 230 CDA
      verliert seinen Angriffspunkt, weil nicht der Inhalt, sondern die Gestaltung angegriffen wird. Die
      Grenze dieser Position ist ihre Flüchtigkeit: Garcia ist ein Beschluss über einen Klageabweisungsantrag
      eines einzelnen District Judge, und er ist am 07.01.2026 durch Vergleich der Überprüfung entzogen
      worden, zusammen mit vier Parallelverfahren. Zur Minderjährigenfrage ist damit erstinstanzlich viel
      vorgetragen und berufungsgerichtlich nichts entschieden.

      '
