  - position: Strafrecht mit funktionaler KI-Definition — Bestimmtheit trotz technischer Unschärfe
    gericht: Suprema Corte de Justicia de la Nación (Pleno), Acciones de Inconstitucionalidad 66/2024,
      80/2024 und 104/2024
    begruendung: 'Mexiko ist die einzige Rechtsordnung, in der ein Verfassungsgericht darüber entschieden
      hat, wie präzise der Gesetzgeber "künstliche Intelligenz" definieren muss, um daran Strafbarkeit
      zu knüpfen. Die Antwort ist großzügig: Eine funktionale, kontextbezogene Definition genügt auch
      ohne technische Exaktheit, gerade in einem sich schnell wandelnden Umfeld; Gesetze seien "keine
      Wörterbücher", und unscharfe Terminologie sei hinnehmbar, wenn es um den Schutz besonders verletzlicher
      Gruppen geht. Der Entwurf zur Nichtigerklärung des allgemeinen Strafschärfungsgrundes in Quintana
      Roo verfehlte die erforderliche Mehrheit; die Norm blieb in Kraft. Für die Regime-Wahl folgt daraus,
      dass der strafrechtliche Weg nicht an der Definitionsfrage scheitern muss — jedenfalls nicht dort,
      wo der Bestimmtheitsgrundsatz nicht so streng gehandhabt wird wie unter Art. 103 Abs. 2 GG.

      '
