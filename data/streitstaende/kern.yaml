  stand: 'Die deutsche Ausgangslage besteht aus zwei höchstrichterlichen Entscheidungen, die beide zugunsten
    der Anbieter ausgegangen sind und beide auf Voraussetzungen beruhen, die ein Sprachmodell nicht erfüllt.
    Der VIII. Zivilsenat hat 2019 die Inkassobefugnis weit ausgelegt; das setzt eine registrierte Inkassostelle
    voraus, die es bei einem frei zugänglichen Modell nicht gibt. Der I. Zivilsenat hat 2021 die Rechtsdienstleistungseigenschaft
    eines Vertragsgenerators verneint; das setzt ein vorab vom Anbieter erstelltes Frage- und Antwortschema
    voraus, das ein Modell nicht hat. Beide Begründungen kehren sich bei generativen Systemen um, und
    eine dritte Entscheidung gibt es nicht: Zum Recherchestichtag ist keine deutsche Entscheidung zur
    Erlaubnispflicht generativer Rechtsberatung erfasst. Die amerikanische Gegenprobe ist inzwischen entschieden,
    aber in die andere Richtung: Die Federal Trade Commission hat am 22.12.2025 ihre eigene Rytr-Verfügung
    einstimmig aufgehoben, weil ein Werkzeug nicht wegen seiner Missbrauchseignung untersagt werden dürfe.
    Zugleich entstehen zwei neue Antworten außerhalb des klassischen Berufsrechts: Italien hat die Frage
    2025 gesetzlich beantwortet, und in Norwegen wird sie nicht entschieden, sondern vorab mit der Aufsichtsbehörde
    ausgehandelt.

    '
  positionen:
  - position: Weite Auslegung der Marktzugangsnorm — die Registrierung deckt die Automatisierung
    gericht: Bundesgerichtshof, VIII. Zivilsenat, Urt. v. 27.11.2019 – VIII ZR 285/18 (wenigermiete.de)
    begruendung: 'Die Forderungseinziehung nach § 10 Abs. 1 Satz 1 Nr. 1 RDG umfasst auch die rechtliche
      Prüfung, die zur Durchsetzung erforderlich ist; eine Überschreitung liegt erst vor, wenn die Tätigkeit
      sich vom Inkassozweck löst. Maßstab ist die Schutzrichtung des Rechtsdienstleistungsgesetzes — der
      Schutz der Rechtsuchenden vor unqualifizierter Beratung —, und die ist bei registrierten Inkassodienstleistern
      gewahrt. Die Entscheidung löst das Problem also nicht über den Begriff der Rechtsdienstleistung,
      sondern über die Person des Handelnden: Wer registriert ist, darf automatisieren. Auf ein Sprachmodell,
      das ohne Registrierung und ohne Anknüpfung an eine konkrete Forderung antwortet, ist das nicht übertragbar.

      '
    urteile:
    - de-2019-bgh-wenigermiete
  - position: Keine Rechtsdienstleistung, weil kein Einzelfall — das vorab erstellte Schema entscheidet
    gericht: Bundesgerichtshof, I. Zivilsenat, Urt. v. 09.09.2021 – I ZR 113/20 (smartlaw)
    begruendung: 'Der Generator prüft keinen konkreten Einzelfall, sondern arbeitet ein vorformuliertes
      Frage- und Antwortschema ab; die Zuordnung von Textbausteinen zu Nutzerangaben ist die Anwendung
      eines vom Anbieter vorab erstellten Schemas und keine rechtliche Prüfung. Maßgeblich ist die Perspektive
      des durchschnittlichen Nutzers, der erkennt, dass er ein Werkzeug bedient. Genau diese beiden Prämissen
      fehlen bei einem Sprachmodell: Es erzeugt die Antwort im Moment der Anfrage, also einzelfallbezogen,
      und es ist auf den Eindruck individueller Beratung hin gestaltet. Wer smartlaw auf generative Systeme
      überträgt, kehrt das Ergebnis um — das ist die zentrale ungeklärte Frage des deutschen Rechtsdienstleistungsrechts
      und der Kern dieses Streitstands.

      '
    urteile:
    - de-2021-bgh-smartlaw
  - position: Ein Werkzeug darf nicht wegen seiner Missbrauchseignung untersagt werden
    gericht: Federal Trade Commission, Beschluss vom 22.12.2025 (Aufhebung der Rytr-Verfügung, 2:0); gegen
      die eigene Verfügung vom 18.12.2024
    begruendung: 'Die Verfügung von 2024 war der dogmatisch weitestgehende Zugriff, den eine amerikanische
      Behörde je auf ein generatives Werkzeug genommen hat: Untersagt wurde nicht die Täuschung, sondern
      das Werkzeug — über die Figur der „means and instrumentalities", wonach haftet, wer Dritten das
      Mittel zur Täuschung bereitstellt. Zwei Kommissare hatten schon damals widersprochen. Ein Jahr später
      hebt die Kommission die eigene, rechtskräftige Verfügung auf: Die vorgetragenen Tatsachen trügen
      keinen Verstoß gegen § 5 FTC Act, und die Verfügung belaste die KI-Innovation entgegen dem Programm
      der Regierung. Der zitierte Satz des Direktors des Bureau of Consumer Protection ist der Kern der
      Position: „Condemning a technology simply because it potentially could be used problematically is
      inconsistent with the law." In der Sache trifft das zu — die Doktrin auf ein Allzweckwerkzeug anzuwenden,
      hätte jeden Texteditor erfasst. Bemerkenswert bleibt der Weg: Nicht ein Gericht hat korrigiert,
      sondern die Behörde sich selbst, unter Berufung auf ein politisches Programm.

      '
    urteile:
    - us-2025-ftc-rytr-aufhebung
    - us-2024-ftc-rytr
  - position: Nicht das Werkzeug, sondern das Versprechen
    gericht: Federal Trade Commission, DoNotPay (Operation AI Comply, Verfügung 2024/2025)
    begruendung: 'Die FTC hat nicht gesagt, ein Modell dürfe nicht rechtsberaten, sondern nur, man dürfe
      seine Leistungsfähigkeit nicht unbelegt behaupten: DoNotPay habe den Dienst als „world''s first
      robot lawyer" beworben und behauptet, er könne einen Anwalt ersetzen und rechtssichere Dokumente
      erstellen, ohne die Ausgaben je gegen anwaltliche Arbeit getestet oder Juristen zur Überprüfung
      herangezogen zu haben. Untersagt wurden die unbelegten Leistungsversprechen; hinzu kamen eine Zahlung
      und die Benachrichtigung der zwischen 2021 und 2023 gewonnenen Abonnenten. Die berufsrechtliche
      Frage bleibt damit ausdrücklich offen. Für das deutsche Recht ist das der entscheidende Unterschied:
      § 3 RDG setzt an der Tätigkeit an, § 5 UWG an der Werbeaussage. Wer die amerikanische Praxis als
      Beleg dafür anführt, generative Rechtsberatung sei zulässig, verwechselt beides.

      '
    urteile:
    - us-2024-ftc-donotpay
  - position: Gesetzliche Lösung über den Vorrang der intellektuellen Leistung und eine Informationspflicht
    gericht: Italien, Art. 13 Legge 132/2025 (in Kraft seit 10.10.2025); ergänzend Art. 15 für die Justiz
    begruendung: 'Der Einsatz von KI-Systemen in den intellektuellen Berufen ist auf instrumentelle und
      unterstützende Tätigkeiten beschränkt, mit Vorrang der intellektuellen Leistung, die den Gegenstand
      der Dienstleistung bildet; hinzu tritt eine Informationspflicht gegenüber dem Mandanten. Damit beantwortet
      der Gesetzgeber die Frage nicht über den Begriff der Rechtsdienstleistung, sondern über das Verhältnis
      von Werkzeug und Leistung — und er adressiert den Berufsträger, nicht den Softwareanbieter. Für
      die Justiz zieht Art. 15 die Parallele: Jede Entscheidung über Auslegung und Anwendung des Gesetzes
      bleibt dem Richter vorbehalten. Das ist die klarste positivrechtliche Antwort in Europa, und sie
      lässt genau die Konstellation ungeregelt, um die es hier geht: den Anbieter, der gar kein Berufsträger
      ist.

      '
    urteile: []
  - position: Berufsvorbehalt gegen die Software selbst — das Bezeichnungs- und Tätigkeitsverbot
    gericht: Commonwealth of Pennsylvania, Department of State (Klage vom 05.05.2026); Gesetzgeber von
      Illinois (WOPR Act) und Utah (HB 452)
    begruendung: 'Die einzige Konstruktion, die unmittelbar an der Software ansetzt, stammt nicht aus
      dem Recht der Rechtsberatung, sondern aus dem Heilberufsrecht — und sie ist strukturgleich. Illinois
      untersagt jeder Stelle, ausdrücklich einschließlich internetbasierter künstlicher Intelligenz, die
      Erbringung von Therapieleistungen ohne lizenzierte Fachkraft; KI-Systeme dürfen keine eigenständigen
      klinischen Entscheidungen treffen und nicht unmittelbar mit Klienten über deren psychische Gesundheit
      kommunizieren, während Verwaltungsaufgaben zulässig bleiben. Das ist der Sache nach die Trennung,
      die § 5 RDG zwischen Nebenleistung und Hauptleistung zieht. Pennsylvania greift die zweite Hälfte
      auf: Verboten ist nicht der Rat, sondern die Anmaßung der Berufsbezeichnung — die Personae hätten
      sich als approbierte Psychiater ausgegeben und eine Approbationsnummer erfunden. Übertragen auf
      die Rechtsberatung entspricht das § 132a StGB und § 5 UWG, nicht § 3 RDG. Der Vorteil dieser Position
      ist ihre Justiziabilität: Sie fragt weder nach Schaden noch nach Einzelfallbezug.

      '
    urteile:
    - us-2026-pennsylvania-character
  - position: Das Berufsrecht regelt den Berufsträger, nicht das Werkzeug — und lässt den Anbieter unberührt
    gericht: Deutschland, §§ 43, 43a, 43e BRAO; Consejo General de la Abogacía Española, Circular 3/2026;
      Legal Practice Board of Western Australia (2024); Anwaltskammer Israels (2024); Legal Practice Act
      28 of 2014 (Südafrika); für Dänemark Negativbefund
    begruendung: 'Sämtliche berufsrechtlichen Regelwerke des Bestandes adressieren die Anwältin und den
      Anwalt: Auswahl und Verpflichtung des Dienstleisters, Verschwiegenheit, unabhängiges Urteil, persönliche
      Prüfung jeder Ausgabe. Die spanische Circular 3/2026 zieht die Linie am schärfsten — der unterzeichnende
      Anwalt trägt die Verantwortung vollständig, und der KI-Fehler entschuldigt nicht, sondern belegt
      die Verletzung der Aufsichtspflicht. Diese Position ist im Ergebnis eine Nichtantwort auf die Frage
      dieses Streitstands, und das ist ihr Gehalt: Wer kein Berufsträger ist, wird von keinem dieser Regelwerke
      erfasst. Das Berufsrecht kann den Anwalt zwingen, das Werkzeug zu kontrollieren; es kann dem Werkzeug
      nichts verbieten. Deshalb wandert die Frage in Deutschland zwangsläufig zu § 3 RDG und zum Lauterkeitsrecht
      zurück — und Dänemark zeigt die Alternative: dort existiert zum Recherchestichtag gar kein KI-Berufsrecht.

      '
    urteile: []
  - position: Die Frage wird nicht entschieden, sondern vorab mit der Aufsicht ausgehandelt
    gericht: 'Datatilsynet (Norwegen), regulatorische Sandkasse für künstliche Intelligenz; Projekt „Juridisk
      ABC: Jussboten LawAi", Abschlussbericht vom 11.12.2024; ferner „Samtaleroboter på offentlige virksomheters
      nettsider" vom 27.05.2026'
    begruendung: 'Norwegen behandelt die Zulässigkeit eines Rechtsberatungs-Chatbots nicht als Streitfrage,
      sondern als Beratungsgegenstand: Die Aufsichtsbehörde begleitet ausgewählte Projekte kostenlos und
      veröffentlicht Abschlussberichte, die als Auslegungshilfe zu Art. 22 DSGVO und zur Datenschutz-Folgenabschätzung
      wirken. Das ist dieselbe Verlagerung, die im Kartellrecht die DOJ-Vergleiche vornehmen — die Trennlinie
      wird nicht erstritten, sondern vereinbart. Verstärkt wird das durch die norwegische Sonderlage:
      Die KI-Verordnung gilt in Norwegen am 07.09.2026 noch nicht, weil sie erst über den Gemeinsamen
      EWR-Ausschuss übernommen und durch die KI-loven umgesetzt werden muss; maßgeblich ist bis dahin
      allein das Datenschutzrecht. Die Sandkasse ist ausdrücklich keine Regulierungssandbox im Sinne des
      Art. 57 KI-VO. Der Inhalt des Berichts zu Jussboten LawAi ist im Bestand nicht ausgewertet und in
      dieser Sitzung nicht abrufbar gewesen; belegt ist die Existenz, das Datum und der Gegenstand.

      '
    urteile: []
  unterfragen:
  - frage: Prüft ein Sprachmodell den konkreten Einzelfall?
    ja: der Sache nach zwingend, weil die Antwort erst im Moment der Anfrage erzeugt wird — damit wäre
      § 2 Abs. 1 RDG erfüllt
    nein: 'die Fortschreibung von smartlaw: das Modell wendet ein trainiertes, also vorab festgelegtes
      Verhalten an, und der Nutzer erkennt, dass er ein Werkzeug bedient'
  - frage: Darf ein Werkzeug wegen seiner Missbrauchseignung untersagt werden?
    ja: FTC 2024 über die means-and-instrumentalities-Doktrin; im Ansatz auch der WOPR Act, der die Tätigkeit
      selbst verbietet
    nein: FTC 2025, ausdrücklich und einstimmig
  - frage: Wer ist Adressat der Regelung?
    ja: der Berufsträger — BRAO, Circular 3/2026, Art. 13 Legge 132/2025, sämtliche Praxisrichtlinien
    nein: der Anbieter — nur § 3 RDG, das Lauterkeitsrecht und die amerikanischen Tätigkeitsverbote erreichen
      ihn
  fehlende_belege:
  - 'Der Abschlussbericht „Juridisk ABC: Jussboten LawAi" vom 11.12.2024 ist als Dokument des Regelwerks
    no-datatilsynet-sandkasse erfasst, aber inhaltlich nicht ausgewertet; ein Abruf war nicht möglich
    (robots.txt der Datatilsynet-Seite). Was Datatilsynet zur Abgrenzung zwischen allgemeiner Rechtsinformation
    und individueller Beratung, zu Halluzinationen und zu Art. 22 DSGVO sagt, ist damit unbelegt. Das
    ist die wichtigste Lücke dieses Streitstands.'
  - Keine deutsche Entscheidung zur Erlaubnispflicht generativer Rechtsauskunft nach § 3 RDG. Negativbefund
    aus dem Bestand, keine erschöpfende Prüfung.
  - 'us-2024-ftc-donotpay ist nicht verifiziert: Aktenzeichen und Datum der Endverfügung sind ungeprüft,
    und die FTC-Themenseite führt das Verfahren nach dem Bestandsvermerk nicht mehr auf — was angesichts
    der Rytr-Aufhebung zu klären wäre.'
  - Der Wortlaut des Art. 13 Legge 132/2025 ist hier über den Normeintrag und die Regelungsschwerpunkte
    des Regelwerks wiedergegeben, nicht am amtlichen Text gegengelesen; die Reichweite der Informationspflicht
    gegenüber dem Mandanten ist ungeklärt.
  - § 2 Abs. 1 RDG ist im Verzeichnis nur als rdg-2 ohne Absatzgliederung erfasst; § 132a StGB, an dem
    die Position zum Bezeichnungsverbot hängt, fehlt vollständig.
  - Der Bericht „Samtaleroboter på offentlige virksomheters nettsider" vom 27.05.2026 betrifft Beratungschatbots
    öffentlicher Stellen und ist ebenfalls nicht ausgewertet; er ist die nächstliegende Quelle für die
    Frage, ob anonyme Rechtsauskunft datenschutzrechtlich möglich ist.
