  - position: Bindende Mindeststandards mit Offenlegungspflicht
    gericht: Mexiko, Tribunales Colegiados de Circuito, zwei Jurisprudencia-Thesen, Januar 2026
    begruendung: 'KI-Werkzeuge in gerichtlichen Verfahren müssen den Anforderungen der Verhältnismäßigkeit,
      Sicherheit, des Datenschutzes, der Transparenz, der Erklärbarkeit und der menschlichen Aufsicht
      genügen; Richter müssen den Einsatz offenlegen und dürfen solche Systeme nur als Hilfsmittel, nicht
      als Ersatz der Entscheidungsfindung einsetzen. Der Einsatz für numerische Berechnungen im Amparo-Verfahren
      wurde ausdrücklich gebilligt. Der Rang ist der eigentliche Befund: Jurisprudencia bindet in Mexiko
      die nachgeordneten Gerichte förmlich, anders als kolumbianische Leitkriterien, brasilianische Resolutionen
      oder englische Leitlinien. Die Thesen nehmen ausdrücklich auf die KI-VO und die UNESCO-Empfehlung
      Bezug — der Brüssel-Effekt hier nicht regulatorisch, sondern judikativ.

      '
