streitstaende:
- id: fair-use-training
  titel: Fair Use beim Training generativer Modelle
  frage: 'Ist das Training eines generativen Modells auf urheberrechtlich geschützten Werken fair use
    nach 17 U.S.C. § 107?

    '
  jurisdiktionen:
  - us
  themenachsen:
  - urheberrecht
  - gpai
  stand: 'Ungeklärt. Kein Bundesberufungsgericht hat entschieden. Der Third Circuit hat am 11.06.2026
    in Thomson Reuters v. ROSS verhandelt; Entscheidung Ende 2026 erwartet. Bis dahin tragen drei erstinstanzliche
    Urteile vom Juni 2025 die gesamte Diskussion — und sie widersprechen einander in drei Punkten. Daneben
    hat sich ein zweiter Strang verselbständigt, der die Trainingsfrage gar nicht stellt: Über die Beschaffung
    aus Schattenbibliotheken ist am 20.07.2026 ein Vergleich über 1,5 Mrd. USD endgültig genehmigt worden,
    und zwei Folgeklagen tragen dieselbe Dogmatik in andere Gerichtsbezirke. Vier weitere Summary-Judgment-Verfahren
    zur Fair-Use-Frage werden im Herbst 2026 entscheidungsreif.

    '
  positionen:
  - position: Transformativität verneint
    gericht: Bibas (D. Del.), Thomson Reuters v. Ross
    begruendung: 'Nutzung zur Entwicklung eines konkurrierenden Rechercheprodukts ist nicht transformativ;
      der vierte Faktor schlägt durch.

      '
    urteile:
    - us-2025-thomson-reuters-ross-fairuse
    - us-2023-thomson-reuters-ross-sj1
    - us-2026-ross-3circuit
    - us-2025-ross-1292b-certification
  - position: Transformativität bejaht
    gericht: Alsup und Chhabria (N.D. Cal.)
    begruendung: 'Das Training selbst ist ein transformativer Vorgang; ein Modell ist kein Ersatz für
      das einzelne Werk.

      '
    urteile:
    - us-2025-bartz-anthropic-fairuse
    - us-2025-kadrey-meta-sj
    - us-2026-kadrey-interlocutory-denied
  - position: Die Beschaffung löst sich von der Trainingsfrage ab
    gericht: N.D. Cal., Bartz ./. Anthropic (Alsup; Endgenehmigung Martínez-Olguín, 20.07.2026); Folgeklagen
      Concord II und Elsevier ./. Meta
    begruendung: 'Alsups Trennung zwischen rechtmäßig beschafftem und heruntergeladenem Material hat sich
      verselbständigt. Der endgültig genehmigte Vergleich betrifft 482.460 Werke der Works List zu rund
      3.000 USD je Werk — dem Vierfachen des statutarischen Mindestschadens —, verpflichtet zur Vernichtung
      der Raubkopiendatensätze und erfasst ausdrücklich keine künftigen rechtmäßigen Trainingsnutzungen.
      Die zweite Klagewelle setzt genau hier an: Concord II stützt sich auf die im Bartz-Verfahren zutage
      getretenen Beweise, fordert über 3 Mrd. USD und nimmt erstmals die Gründer persönlich in Anspruch;
      Elsevier trägt dieselbe Beschaffungsdogmatik in den Second Circuit, weg von Chhabria und dem Ninth
      Circuit. Über Fair Use beim Training sagt keines dieser Verfahren etwas — und das ist der Punkt.

      '
    urteile:
    - us-2025-bartz-class-cert
    - us-2025-bartz-vergleich-prelim
    - us-2026-bartz-vergleich-final
    - us-2026-concord-anthropic-ii
    - us-2026-elsevier-meta
  - position: Noch nicht entschieden — vier Summary-Judgment-Verfahren zur Trainingsfrage
    gericht: S.D.N.Y. (Stein, MDL No. 3143) sowie N.D. Cal. (Lee, Breyer)
    begruendung: 'Die drei Urteile vom Juni 2025 werden die Diskussion nicht lange allein tragen. In vier
      Verfahren sind die gegenläufigen Fair-Use-Anträge gestellt: Concord ./. Anthropic (Anhörung 21.10.2026),
      Mosaic zu den MPT-Modellen (30.10.2026), das gebündelte OpenAI-Verfahren vor Judge Stein (Repliken
      06.11.2026) und Google zu Bard/Gemini und Imagen (Anhörung für März 2027 vorgeschlagen). Keines
      dieser Gerichte ist an Alsup oder Chhabria gebunden; drei von vieren sitzen im selben District wie
      sie.

      '
    urteile:
    - us-2026-concord-anthropic-sj
    - us-2026-mosaic-llm-sj
    - us-2026-openai-mdl-sj
    - us-2026-google-genai
  - position: Vor der Fair-Use-Frage steht die Verletzungsfrage — und sie entscheidet sich am Trainingsvorgang,
      nicht am Modell
    gericht: N.D. Cal., Judge William H. Orrick (Andersen ./. Stability AI, 30.10.2023 und 12.08.2024)
    begruendung: 'Die erste Entscheidung überhaupt zu generativer KI und Urheberrecht, und ihre Aussage
      trägt bis heute jede amerikanische Entscheidung, auch die von Alsup und Chhabria: Das Modell ist
      keine Kopie, die Trainingskopie schon. Orrick hielt den Vortrag, Stable Diffusion enthalte „compressed
      copies" der Trainingsbilder, für in sich widersprüchlich — die Kläger beschrieben zugleich rein
      statistisch-mathematische Verfahren — und verlangte plausible Tatsachen dazu, ob das Modell Bilder
      rekonstruieren könne; tragfähig blieb allein, dass beim Training Vervielfältigungsstücke entstanden.
      Genau diese Trennung ist der Grund, weshalb Memorisierung im amerikanischen Recht bislang Beweismittel
      und nicht Haftungsgrund ist, und sie erklärt, warum die deutsche Münchener Linie (das Modell selbst
      als Vervielfältigungsstück) dort keine Entsprechung hat. Die zweite Entscheidung ergänzt zwei Punkte:
      Die induzierte Verletzung überlebte gegen Stability und Runway, weil die Verbreitung des Modells
      Verletzungen bei Endnutzern erzeuge; und die Lanham-Act-Ansprüche überlebten allein gegen Midjourney,
      gestützt auf die Verwendung von rund 4.700 Künstlernamen in einer „Style List" — urheberrechtlich
      ist Stil frei, kennzeichenrechtlich kann seine Bewerbung als Prompt-Parameter eine Herkunftstäuschung
      sein. Dieser Weg verlangt weder Werkvergleich noch Fair-Use-Prüfung.

      '
    urteile:
    - us-2023-andersen-mtd
    - us-2024-andersen-mtd2
  - position: Im Eilverfahren ist das Training nicht zu stoppen — geregelt wird stattdessen die Ausgabe
    gericht: N.D. Cal., Judge Eumi K. Lee (Concord Music u.a. ./. Anthropic, 25.03.2025; vorausgehend
      die gerichtlich bestätigte Stipulation vom 02.01.2025)
    begruendung: 'Die Entscheidung erklärt, warum Rechteinhaber KI-Training praktisch nicht per Unterlassung
      stoppen können: Der Antrag war zu weit gefasst, und ein irreparabler Schaden fehlte — Reputationsschäden
      waren im Wesentlichen aus den Ausgaben abgeleitet, verlorene Lizenzabschlüsse auf bestehenden Märkten
      nicht belegt und der Vortrag zum entstehenden Markt für Trainingslizenzen spekulativ. Der Schaden
      ist stets erst nachträglich bezifferbar; deshalb wandert der gesamte Streit ins Hauptsacheverfahren.
      Der zweite und in der Debatte übersehene Befund ist die vorausgegangene Stipulation über „guardrails":
      Anthropic hat sich verpflichtet, die bereits implementierten Ausgabesperren für Liedtexte in allen
      aktuellen Modellen beizubehalten und auf künftige Modelle zu erstrecken. Das ist die erste gerichtlich
      bindende Zusage von Ausgabefiltern durch einen KI-Anbieter — ein Regulierungsinstrument, das aus
      einem Zivilprozess entsteht und das die Diskussion um Art. 53 Abs. 1 lit. c KI-VO nicht kennt. Praktisch
      heißt das: Der Input-Teil scheitert, der Output-Teil wird vertraglich erledigt.

      '
    urteile:
    - us-2025-concord-anthropic-pi
  - position: Der Angriff verlagert sich von der Eingabe auf die Ausgabe — und dort gilt klassisches Urheberrecht
    gericht: C.D. Cal., Judge John A. Kronstadt (Disney u.a. ./. Midjourney, seit 11.06.2025; verbunden
      mit Warner Bros. Discovery ./. Midjourney; Mediation angeordnet 17.11.2025, Frist 19.08.2026)
    begruendung: 'Der prozesstaktisch sauberste Zuschnitt der Klägerseite und deshalb für die Fair-Use-Dogmatik
      gerade unergiebig: Disney braucht weder Trainingsdaten-Discovery noch eine Marktverwässerungstheorie,
      sondern legt erzeugte Bilder neben Darth Vader, Homer Simpson und die Minions. Die Frage ist nicht,
      ob das Training zulässig ist, sondern ob die Ausgabe verletzt — und das ist klassisches Urheberrecht.
      Der eigentliche Kampf läuft deshalb über die mittelbare Haftung, und dort hat Cox v. Sony vom 25.03.2026
      die Latte erheblich angehoben: Midjourney hat am 22.07.2026 judgment on the pleadings gegen den
      contributory-Anspruch beantragt, Disney versucht ihn seit dem 13.08.2026 über eine Inducement-Theorie
      zu retten. Bemerkenswert ist die Discovery-Entscheidung vom 18.06.2026, mit der Midjourneys Antrag,
      Disneys eigene KI-Nutzung auszuforschen, weitgehend abgewiesen wurde: Sie sei für die Fair-Use-Verteidigung
      irrelevant. Die angeordnete Mediation und der OpenAI-Vertrag Disneys vom 11.12.2025 legen nahe,
      dass die Studios lizenzieren, wo sie nicht klagen.

      '
    urteile:
    - us-2025-disney-midjourney
  unterfragen:
  - frage: Ist die Beschaffung rechtswidriger Kopien gesondert zu bewerten?
    ja: Alsup — die Piraterie-Bibliothek ist eigenständig verletzend
    nein: Chhabria — einheitliche Betrachtung
  - frage: Ist market dilution ein tauglicher vierter Faktor?
    ja: Chhabria, ausdrücklich
    nein: Alsup, ausdrücklich abgelehnt
  aufloesung: 'Third Circuit in ROSS (Ende 2026), danach vermutlich der Ninth Circuit. Chhabria hat die
    Zwischenberufung am 08.07.2026 verweigert, eine Klärung durch den Ninth Circuit ist damit frühestens
    2027/28 zu erwarten. Der Supreme Court hat cert in Thaler abgelehnt (02.03.2026) und sich zur Trainingsfrage
    bislang nicht geäußert.

    '
  eigene_bewertung: 'Der Bartz-Vergleich über 1,5 Mrd. USD hat die Frage nicht beantwortet, sondern umgangen:
    Gezahlt wurde für die Beschaffung, nicht für das Training. Alsups Fair-Use-Feststellung zum Training
    steht unangetastet. Wer den Vergleich als Niederlage der KI-Anbieter liest, verwechselt Beschaffungs-
    mit Nutzungsfrage.

    '
  letzte_pruefung: '2026-09-07'
- id: tdm-schranke-de
  titel: Reichweite der deutschen TDM-Schranke beim KI-Training
  frage: 'Erfasst § 44b UrhG das Training generativer Modelle, und wann ist ein Nutzungsvorbehalt maschinenlesbar
    im Sinne des § 44b Abs. 3 UrhG?

    '
  jurisdiktionen:
  - de
  - eu
  themenachsen:
  - urheberrecht
  stand: 'Offene Divergenz zwischen zwei Oberlandesgerichtsbezirken. Der BGH verhandelt am 03.09.2026
    — allerdings nur den Hamburger Strang, in dem die Memorisierungsfrage gar nicht gestellt war. Die
    Münchener Linie hat sich inzwischen verfestigt: Dieselbe 42. Zivilkammer hat sie am 31.07.2026 in
    GEMA ./. Suno auf Musikkompositionen erstreckt und um zwei Punkte erweitert, die über § 44b UrhG hinausreichen
    — ein in den Vereinigten Staaten durchgeführtes Training wird erfasst, wenn das Modell anschließend
    in Europa betrieben wird, und die Beschaffung über Stream-Ripping trifft § 95a UrhG, der schrankenfest
    ist. Die eigentliche Klärung kommt voraussichtlich weder aus Karlsruhe noch aus München, sondern aus
    Luxemburg: In C-250/25 sind die Schlussanträge von Generalanwalt Szpunar für den 03.09.2026 angekündigt
    — denselben Tag, an dem der BGH verhandelt.

    '
  positionen:
  - position: Schranke greift, weit auszulegen
    gericht: OLG Hamburg, Urt. v. 10.12.2025 – 5 U 104/24
    begruendung: 'Download und automatisierte Prüfung sind TDM, auch als Vorbereitung späteren Trainings.
      Maschinenlesbarkeit verlangt, dass ein Vorbehalt automatisiert nicht nur erfasst, sondern interpretiert
      und befolgt werden kann; der Maßstab ist technikoffen. Die Darlegungslast trägt der Rechtsinhaber.
      Selbständig tragend daneben: § 60d UrhG, ohne Vorbehaltsmöglichkeit.

      '
    urteile:
    - de-2025-laion-olg
    - de-2024-laion-lg
    - de-2026-laion-bgh
  - position: Schranke greift nicht
    gericht: LG München I, Urt. v. 11.11.2025 – 42 O 14139/24
    begruendung: 'Vervielfältigungen im Modell dienen nicht der Informationsgewinnung, sondern der Nachbildung.
      Der Dreistufentest wirkt als Schrankenschranke, weil die Ausgaben mit den Originalen konkurrieren.
      Bei konsistent wiederholbarer Wiedergabe ist das Werk in den Parametern verkörpert — das Modell
      selbst ist Vervielfältigungsstück.

      '
    urteile:
    - de-2025-gema-openai-lg
    - de-2025-gema-openai-olg
    - de-2026-gema-suno-lg
  - position: Die Frage liegt beim Gerichtshof — der die Fragestellung selbst verwerfen könnte
    gericht: Gerichtshof der Europäischen Union (Große Kammer), C-250/25 (Like Company ./. Google), Vorlage
      des Budapest Környéke Törvényszék, Verhandlung 10.03.2026
    begruendung: 'Das ungarische Ersuchen stellt den Hamburger und den Münchener Streit zugleich: ob das
      Training eine Vervielfältigung nach Art. 2 InfoSoc-RL ist, ob Art. 4 DSM-RL sie deckt, und ob die
      Ausgabe eines Chatbots öffentliche Wiedergabe nach Art. 3 Abs. 2 InfoSoc-RL ist. Es ist die erste
      Verhandlung des Gerichtshofs zu generativer KI und Urheberrecht überhaupt. Erwogen wurde dort, die
      Trennung von Eingabe und Ausgabe aufzugeben und die Gesamtheit der zur Verletzung führenden Handlungen
      einheitlich zu prüfen. Folgte der Gerichtshof dem, wäre die deutsche Dogmatik in beiden Lagern hinfällig:
      Hamburg prüft nur den Input, München begründet den Input aus dem Output.

      '
    urteile:
    - eu-2025-like-company-google
  unterfragen:
  - frage: Wo liegt der Verletzungsschwerpunkt?
    ja: OLG Hamburg — beim Trainingsvorgang
    nein: LG München I — beim fertigen Modell
  - frage: Genügt ein Vorbehalt in natürlicher Sprache?
    ja: für heutige Verhältnisse ausdrücklich offengelassen
    nein: für den Stand 2021 verneint
  aufloesung: 'BGH I ZR 281/25, Verhandlung 03.09.2026. Am selben Tag Schlussanträge von GA Szpunar in
    der EuGH-Sache C-250/25 (Like Company ./. Google, Große Kammer). Die Münchener Linie kommt über OLG
    München 6 U 3662/25 e, dort ist noch kein Termin bestimmt.

    '
  eigene_bewertung: 'Die eigentliche Sprengkraft liegt nicht in § 44b, sondern im zweiten Bein des OLG
    Hamburg: § 60d UrhG kennt keinen Nutzungsvorbehalt. Wenn eine Forschungsorganisation Datensätze erstellen
    und an kommerzielle Modellentwickler weitergeben darf, weil deren Arbeit "angewandte Forschung" ist,
    läuft der gesamte Opt-out-Mechanismus des Art. 4 Abs. 3 DSM-RL leer. Die VG Bild-Kunst nennt es eine
    Handlungsanleitung zur Umgehung. Darüber wird der BGH entscheiden müssen, nicht über die Maschinenlesbarkeit.

    '
  letzte_pruefung: '2026-09-07'
- id: schutzfaehigkeit-output
  titel: Schutzfähigkeit KI-generierter Erzeugnisse
  frage: Kann ein von einem generativen Modell erzeugtes Werk Urheberrechtsschutz genießen?
  jurisdiktionen:
  - us
  - cn
  - mx
  - eu
  themenachsen:
  - urheberrecht
  stand: 'International gespalten, und zwar nicht im Ergebnis, sondern im Prüfungsgegenstand — das macht
    die Divergenz so hartnäckig. Die Linien verlaufen inzwischen aber nicht mehr zwischen den Rechtsordnungen,
    sondern quer durch sie. In China haben zwei Mittlere Volksgerichte (Suzhou 2025, Yangzhou 2026) die
    Pekinger Linie faktisch verlassen und verlangen ein dokumentiertes Schöpfungsverfahren, während ein
    Strafgericht in Guangzhou am 08.05.2026 den Werkcharakter KI-erzeugter Kurzdramen bejaht und die Vervielfältigung
    mit Freiheitsstrafe belegt hat. In Russland stehen die Arbitragegerichte, vor denen der Verletzer
    den KI-Einwand erhebt, gegen die Bezirksgerichte, vor denen der Anspruchsteller seinen Beitrag beweisen
    muss. Erst 2025/26 ist zudem eine europäische Linie entstanden: OLG Düsseldorf, AG München und LG
    Frankfurt am Main fragen nicht nach dem Werkzeug, sondern nach dem nachweisbaren Gestaltungsanteil
    — und legen die Darlegungslast dem auf, der sich auf den Schutz beruft.

    '
  positionen:
  - position: Statusfrage — ohne menschlichen Urheber kein Schutz
    gericht: USA, D.C. Circuit und Copyright Office
    begruendung: 'Human authorship ist Schutzvoraussetzung. Fehlt sie, ist das Ergebnis gemeinfrei, unabhängig
      vom Aufwand des Nutzers.

      '
    urteile:
    - us-2025-thaler-dc-circuit
    - us-2023-thaler-district
    - us-2026-thaler-cert-denied
    - us-2024-allen-perlmutter
  - position: Prozessfrage — es kommt auf die Steuerung an
    gericht: China, Beijing Internet Court und Folgerechtsprechung
    begruendung: 'Schöpfung liegt in Promptauswahl, Reihenfolge, Parametrisierung und Nachjustierung.
      Damit wird Schutzfähigkeit zur Beweisfrage im Einzelfall — und deshalb auch in China divergent entschieden.

      '
    urteile:
    - cn-2023-li-liu
    - cn-2024-changshu-ki-bild
    - cn-2026-huangpu-strafurteil
  - position: Kreativität ist untrennbar von menschlicher Subjektivität
    gericht: Mexiko, SCJN Segunda Sala, Amparo Directo 6/2025
    begruendung: Europäisch begründete Gegenposition zur chinesischen Linie.
    urteile:
    - mx-2025-scjn-amparo-6-2025
  - position: Dieselbe Prozessfrage, entgegengesetztes Ergebnis — der Prompt ist die Idee, nicht der Ausdruck
    gericht: China, Mittleres Volksgericht Suzhou (2025) und Mittleres Volksgericht Yangzhou (April 2026)
    begruendung: 'Die chinesische Folgerechtsprechung ist nicht der Pekinger Linie gefolgt, sondern hat
      die Idee-Ausdruck-Dichotomie gegen das Prompting in Stellung gebracht. Suzhou verlangte Aufzeichnungen
      des Schöpfungsvorgangs, aus denen sich konkrete Entscheidungen zu Layout, Komposition, Linienführung
      und Farbgebung ergeben; allgemein gehaltene Prompts seien abstrakte Ideen. Yangzhou ging weiter:
      Stichworte wie "Comic-Schlange" und "Plüschtextur" hätten geringe Steuerungswirkung, bloßes Neugenerieren
      und Auswählen sei keine eigenständige geistige Leistung, und ohne vorgelegtes Schöpfungsprotokoll
      fehle der Nachweis. Damit ist in China eine Dokumentationslast des Rechteinhabers entstanden, die
      es weder im amerikanischen noch im europäischen Recht in dieser Schärfe gibt — und die Erzählung,
      China schütze KI-Ausgaben großzügig, trifft nicht zu.

      '
    urteile:
    - cn-2025-suzhou-berufung
    - cn-2026-yangzhou-spielzeug
  - position: Deutschland — nicht das Werkzeug entscheidet, sondern der nachweisbare Gestaltungsanteil
    gericht: OLG Düsseldorf, Beschl. v. 02.04.2026 – I-20 W 2/26; AG München, Urt. v. 13.02.2026 – 142
      C 9786/25; LG Frankfurt a. M., Urt. v. 17.12.2025 – 2-06 O 401/25
    begruendung: 'Die deutsche Rechtsprechung beantwortet die Frage weder als Status- noch als reine Prozessfrage,
      sondern als Darlegungsfrage — und kehrt dabei die Vermutung um. Nach dem OLG Düsseldorf ist ein
      ausschließlich durch automatisierte Softwareprozesse erzeugtes Bild nicht selbständig schutzfähig;
      wer sich auf Werkqualität beruft, muss die konkreten schöpferischen Entscheidungen darlegen, die
      dem Output die persönliche Prägung geben. Weder zahlreiche allgemein gehaltene Anweisungen noch
      die Auswahl aus mehreren Vorschlägen genügen. Das AG München verlangt, dass der menschliche Einfluss
      den softwaregesteuerten Prozess substantiell beherrscht; Zeit- und Mühewaltung beim Prompten reichen
      nicht. Das LG Frankfurt liefert die Gegenprobe: Ein menschlich verfasster Liedtext bleibt geschützt,
      auch wenn die Musik per KI ergänzt wurde, und im Eilverfahren genügt eine eidesstattliche Versicherung
      über den eigenen Gestaltungsanteil. Nicht der Angreifer muss die Maschinenerzeugung beweisen, sondern
      der Schutzrechtsinhaber die menschliche Schöpfung.

      '
    urteile:
    - de-2026-olg-duesseldorf-ki-bild
    - de-2026-ag-muenchen-ki-logos
    - de-2025-lg-frankfurt-ki-liedtext
  - position: Italien — es kommt auf den Grad der Absorption des schöpferischen Beitrags an
    gericht: Corte suprema di cassazione, Sezione I civile, Ordinanza n. 1107 vom 16.01.2023
    begruendung: 'Der Softwareeinsatz schließt die Schutzfähigkeit nicht von vornherein aus. Zu prüfen
      ist, in welchem Umfang das Werkzeug die schöpferische Leistung ersetzt — nicht, ob eine Maschine
      mitgewirkt hat. Die Entscheidung betraf ein fraktal erzeugtes Bild, nicht generative KI, formuliert
      den Maßstab aber vier Jahre vor dem Kriterium der human contribution des US Copyright Office.

      '
    urteile:
    - it-2023-cass-opera-generata
  - position: Taiwan — Rechenergebnisse sind keine Werke
    gericht: Intellectual Property and Commercial Court; ferner Oberster Verwaltungsgerichtshof zur Erfindereigenschaft
    begruendung: 'Ergebnisse von Softwareberechnungen auf der Grundlage eingegebener Parameter genießen
      keinen Schutz, weil ihnen der menschliche schöpferische Beitrag fehlt. Das ist die strengste Position
      Ostasiens und liegt näher an der amerikanischen als an der festlandchinesischen Linie. Zu generativer
      KI im engeren Sinne fehlt in Taiwan bislang jede Entscheidung.

      '
    urteile:
    - tw-ipcc-computergenerierte-ausgaben
  - position: Werkzeugthese — der KI-Einwand entwertet den menschlichen Beitrag nicht und erschüttert
      die Urhebervermutung nicht
    gericht: Russland, Gericht für geistige Eigentumsrechte (SIP), 22.08.2024, sowie Dreizehntes und Fünfzehntes
      Arbitrage-Berufungsgericht
    begruendung: 'In der russischen Arbitragegerichtsbarkeit steht die Behauptung "das war eine KI" auf
      Seiten des Verletzers — und scheitert. Die Fachkassation hat in der Reface-Sache bestätigt, dass
      Deepfake-Technik "ein zusätzliches Werkzeug der Videobearbeitung und keine Methode der Schöpfung"
      ist; der persönliche Beitrag der Urheber über Drehbuch, Aufnahme und Tongestaltung bleibt tragend.
      Ebenso genügt die bloße Behauptung maschineller Erzeugung nicht, um die Urhebervermutung des Art.
      1257 ZGB zu erschüttern, und die Behauptung eigener Generierung mit Stable Diffusion beseitigt eine
      Verletzung fremder Werke nicht.

      '
    urteile:
    - ru-2023-reface-businessanalytics
    - ru-2024-reface-9aas
    - ru-2024-reface-sip
    - ru-2024-13aas-blend-datei
    - ru-2024-15aas-arbeitsvertrag
    - ru-2025-13aas-stable-diffusion
  - position: Prompten ist eine mechanische, keine schöpferische Handlung
