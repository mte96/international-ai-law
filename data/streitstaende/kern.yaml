  - position: Nicht das System, sondern die verfrühte Inbetriebnahme — Wiederinbetriebnahme unter Auflagen
      einschließlich einer Verzerrungsprüfung
    gericht: Cámara de Apelaciones en lo Contencioso Administrativo, Tributario y de Relaciones de Consumo
      de la Ciudad Autónoma de Buenos Aires, Sala I, 28.04.2023 – EXP J-01-00409611-4/2020-0
    begruendung: 'Die Berufungsinstanz hat den Tenor umgestellt und damit die Frage anders beantwortet
      als die erste Instanz: Statt das System selbst für verfassungswidrig zu erklären, macht sie seine
      Wiederinbetriebnahme von drei Bedingungen abhängig — tatsächliche Funktionsfähigkeit der gesetzlich
      vorgesehenen Kontrollorgane, technische Untersuchungen zu differenziellen Trefferwahrscheinlichkeiten
      nach Geschlecht, Hautfarbe oder anderen persönlichen Merkmalen, und vorherige öffentliche Information
      und Bürgerbeteiligung über die Sicherheitsforen. Verfassungswidrig war danach die verfrühte Inbetriebnahme
      vor Funktionsfähigkeit der Aufsicht, nicht notwendig das Werkzeug. Der argentinische Leitfall ist
      damit im Ergebnis eine Auflagen-, keine Verbotsentscheidung — und wird in der Presseberichterstattung
      durchweg falsch zitiert. Die zweite Auflage ist eine gerichtlich angeordnete Verzerrungsprüfung,
      vier Jahre bevor Art. 10 Abs. 5 KI-VO und die harmonisierten Normen dasselbe verlangen.

      '
