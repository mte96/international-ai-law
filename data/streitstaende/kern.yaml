  - position: Verfassungsgerichtliche Freigabe einer offenen Schranke — ohne dass von künstlicher Intelligenz
      die Rede wäre
    gericht: Constitutional Court of South Africa, 26.06.2026 – CCT 306/24, [2026] ZACC 26 (Copyright
      Amendment Bill)
    begruendung: 'Für das Trainingsrecht die folgenreichste südafrikanische Entscheidung — und sie erwähnt
      künstliche Intelligenz mit keinem Wort. Das Verfassungsgericht hat die offene Fair-Use-Klausel des
      s. 12A des Copyright Amendment Bill für verfassungsgemäß erklärt und dabei zwei Sätze formuliert,
      die in einem künftigen Trainingsverfahren tragen werden: Die durch „such as" geöffnete Zweckliste
      bleibt zwar über die ejusdem-generis-Regel eingehegt, soll aber gerade Zwecke erfassen, die der
      Gesetzgeber noch nicht bedacht hat; und die Entziehung unkörperlichen Eigentums verlangt einen geringeren
      Rechtfertigungsaufwand als die körperlichen. Zusammen ergibt das eine verfassungsrechtliche Grundhaltung,
      die Schranken zugunsten neuer Nutzungsformen begünstigt. Verfassungswidrig war allein s. 12D Abs.
      1 bis 5 — die Bildungsschranke, also gerade die Regelung mit dem klarsten Gemeinwohlbezug — wegen
      willkürlicher Eigentumsentziehung nach s. 25(1) der Verfassung. Damit ist Südafrika der einzige
      Staat des Bestandes, in dem ein Verfassungsgericht den Instrumentenstreit vorab entschieden hat:
      Ein offener Abwägungstatbestand nach amerikanischem Vorbild ist zulässig, eine enumerierte Schranke
      kann es an der Eigentumsgarantie scheitern.

      '
