  - position: Die Kanzlei zahlt, der Anwalt nicht — Organisationshaftung
    gericht: United States District Court, C.D. California (Special Master Wilner), Lacey v. State Farm,
      06.05.2025
    begruendung: 'Die einzige Entscheidung des Bestands, die die Verantwortung ausdrücklich von der Person
      auf die Organisation verlagert: 31.100 USD gesamtschuldnerisch gegen zwei Kanzleien, Streichung
      sämtlicher Fassungen des Schriftsatzes und Versagung der beantragten Discovery-Anordnung — die einzelnen
      Anwälte blieben wegen ihrer offenen und vollständigen Einlassung persönlich verschont. Zwei Nebenbefunde
      tragen weit: Eingesetzt waren nicht Verbraucherchatbots, sondern juristische Fachprodukte (CoCounsel,
      Westlaw Precision, Gemini), womit die verbreitete Annahme, RAG-gestützte Fachwerkzeuge halluzinierten
      nicht, gerichtlich widerlegt ist; und auch die nach der ersten Beanstandung überarbeitete Fassung
      enthielt noch sechs KI-erzeugte Fehler, ohne dass der Werkzeugeinsatz offengelegt worden wäre.

      '
