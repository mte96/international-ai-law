  - position: Verzicht auf die Sanktion aus Rücksicht auf die Mandantschaft — und der Indizienbeweis des
      KI-Einsatzes
    gericht: בית המשפט העליון בשבתו כבית משפט גבוה לצדק — Oberster Gerichtshof Israels als Hoher Gerichtshof,
      23.02.2025 – BAGATZ 38379-12-24 (Votum Kanfi-Steinitz)
    begruendung: 'Zwei Elemente heben die Entscheidung aus der internationalen Kasuistik heraus, und beide
      fehlen der amerikanischen und der englischen Linie. Erstens die Sanktionsentscheidung: Der Gerichtshof
      verzichtet bewusst auf eine Sanktion, weil sie nicht die Prozessbevollmächtigte, sondern die Mandantin
      treffen würde — eine Fürsorgeerwägung, die weder unter Rule 11 noch in Ayinde/Al-Haroun eine Rolle
      spielt. Zweitens die Beweisführung: Aus Verweisen auf nicht existierende Entscheidungen, in sich
      widersprüchlichen Fundstellenangaben und erfundenen Zitaten schließt der Gerichtshof mit hoher Wahrscheinlichkeit
      auf die Nutzung eines KI-gestützten Dienstes — der Einsatz wird also nicht eingeräumt, sondern indiziell
      festgestellt. Nach eigenem Eingeständnis hatte die Anwältin die Nachweise ungeprüft von einer von
      Kolleginnen empfohlenen Internetseite übernommen; sie „gab es nicht und sie waren nie geschaffen
      worden". Chronologisch ist das der Beginn der israelischen Linie, mehr als ein Jahr vor der bislang
      als Leitfall geführten Ramat-Gan-Entscheidung.

      '
