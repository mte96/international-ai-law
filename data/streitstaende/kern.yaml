  - position: Beide Seiten halluzinieren — und die Rechtsfolge ist die Versagung des Honorars
    gericht: Cámara de Apelaciones en lo Civil, Comercial, Familia y Minería de General Roca, Sala I,
      18.09.2025 (RO-12819-C-0000)
    begruendung: 'Die wirtschaftlich schärfste und dogmatisch sauberste Sanktion der Sammlung: keine Ordnungsstrafe,
      sondern die Versagung der Anwaltshonorare. Wer erfundene Nachweise einreicht, hat insoweit keine
      anwaltliche Leistung erbracht; die Tätigkeit ist „inoficiosa" und damit nicht vergütungsfähig. Das
      trifft härter als jedes Bußgeld und setzt kein Verschulden voraus. Der zweite, wichtigere Befund
      ist die Symmetrie: In diesem Verfahren haben beide Seiten halluziniert — insgesamt sechsundzwanzig
      nicht existente Entscheidungen, sechs im Schriftsatz der Beklagtenseite und zwanzig in der Erwiderung
      der Klägerseite. Das entkräftet die verbreitete Annahme, das Problem betreffe vor allem nicht vertretene
      Parteien und Einzelkämpfer ohne Datenbankzugang, und zeigt, dass die Verifikationslücke strukturell
      ist. Achtzehn der erfundenen Entscheidungen wurden dem eigenen Obergericht zugeschrieben.

      '
    urteile:
