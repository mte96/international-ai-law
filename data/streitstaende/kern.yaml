  letzte_pruefung: 2026-09-07
  aufloesung: 'Vier Termine, und keiner davon ist ein Grundsatzurteil. Erstens die Fortsetzung von Mobley:
    Die Opt-in-Frist der Kollektivklage lief im März 2026 ab; die erste Sachentscheidung über disparate
    impact bei algorithmischer Auswahl steht aus, und erst ein Berufungsverfahren würde die Agentenfigur
    absichern oder beseitigen. Zweitens die Umsetzungsfrist der Plattformarbeitsrichtlinie am 02.12.2026,
    mit der der spanische Auskunftsanspruch europäisches Muster wird. Drittens der 02.12.2027, an dem
    die Hochrisiko-Pflichten für den Beschäftigungsbereich des Anhangs III anwendbar werden — bis dahin
    gilt von der KI-Verordnung im Arbeitsverhältnis nur der Verbotskatalog des Art. 5, und genau ihn vollzieht
    die Datenschutzaufsicht bereits. Viertens die Frage, ob weitere Aufsichtsbehörden dem italienischen
    Weg folgen und Art. 5 KI-VO über Art. 58 DSGVO durchsetzen; das wäre die praktisch schnellste Entwicklung
    und wird bislang kaum beschrieben. Eine Konvergenz der beiden Stränge ist nicht absehbar, weil sie
    verschiedene Fragen beantworten: Die amerikanische Diskussion sucht einen Beklagten, die europäische
    einen Anspruchsinhalt.

    '
