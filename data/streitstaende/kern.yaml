  stand: 'Der Streit sieht wie ein Streit über Grundrechtsabwägung aus und ist einer über Auslegungsregeln.
    Zwischen dem 31.12.2025 und dem 30.01.2026 haben zwei europäische Rechtsordnungen binnen fünf Wochen
    dasselbe entschieden, ohne voneinander Notiz zu nehmen und ohne dass eine von beiden einen Verbotstatbestand
    hätte: Die griechische Datenschutzbehörde verwarnt die Polizei wegen des Systems «Έξυπνη Αστυνόμευση»,
    der französische Conseil d''État weist die Gemeinde Nizza ab. Beide sagen denselben Satz — aus dem
    Schweigen des Gesetzes folgt keine Erlaubnis. Die KI-Verordnung arbeitet umgekehrt: Sie verbietet
    die biometrische Echtzeit-Fernidentifizierung und lässt sie unter Bedingungen wieder zu; ihre Hochrisiko-Pflichten
    für den Biometriebereich des Anhangs III greifen nach der Verschiebung durch VO (EU) 2026/1744 erst
    am 02.12.2027. Daneben stehen vier weitere Regelungsmodelle: die befristete Einzelerlaubnis (Frankreich),
    der parlamentarische Gesetzesvorbehalt mit Nachbesserungsfrist (Deutschland), die Qualitätskontrolle
    des vorhandenen Rechtsrahmens (Vereinigtes Königreich) und die nachträgliche Sanktion durch die Datenschutzaufsicht
    (Griechenland, Vereinigtes Königreich, Australien, Kanada). Ein Gericht, das über die Zulässigkeit
    biometrischer Erkennung im öffentlichen Raum in der Sache entschieden hätte, gibt es in Europa außerhalb
    Straßburgs nicht.

    '
  positionen:
  - position: Verbot durch Schweigen — ohne ausdrückliche Ermächtigung ist die algorithmische Bildauswertung
      unzulässig
    gericht: Conseil d'État, 10ème et 9ème chambres réunies, 30.01.2026 – n° 506370 (Commune de Nice c/
      CNIL); Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (Ολομέλεια), Απόφαση 45/2025 vom 31.12.2025
      «Έξυπνη Αστυνόμευση»
    begruendung: 'Zwei Instanzen unterschiedlichen Typs, zwei Rechtsordnungen, fünf Wochen Abstand, dasselbe
      Ergebnis. Der Conseil d''État entscheidet in erster und letzter Instanz über die Klage der Gemeinde
      Nizza gegen eine Stellungnahme der CNIL zum System „zone intrusion entrées des écoles“ — der automatischen
      Erkennung unerlaubten Parkens vor Schulen. Tragend ist ein Auslegungssatz und keine Abwägung: „les
      dispositions précitées de l''article L. 251-2 du code de la sécurité intérieure, si elles permettent
      la mise en oeuvre de systèmes de vidéosurveillance des voies publiques, ne sauraient, dans leur
      silence, être interprétées comme autorisant la mise en oeuvre de traitements algorithmiques permettant
      une analyse systématique et automatisée des images collectées.“ Die drei Wörter „dans leur silence“
      tragen die gesamte Entscheidung. Außerhalb der befristeten Experimentierklausel — die am 31.03.2025
      abgelaufen war und erst am 19.08.2026 wieder in Kraft trat — gibt es keine Rechtsgrundlage. Die
      griechische Datenschutzbehörde kommt für die Ελληνική Αστυνομία zum selben Ergebnis: Für ein System,
      das im Streifendienst über Smartphones Gesichtserkennung und Fingerabdruckabgleich einsetzt, fehlt
      die Rechtsgrundlage; die Art. 45A und 46 ν. 4624/2019 in Umsetzung der Richtlinie (EU) 2016/680
      sind nicht erfüllt, herangezogen wurden Vorschriften aus dem ΠΔ 342/1977, und die nach Art. 27 der
      Richtlinie geschuldete Folgenabschätzung unterblieb in der Pilotphase. Beide Entscheidungen verzichten
      auf jede Verhältnismäßigkeitsprüfung; beide erwähnen die KI-Verordnung nicht als Maßstab; keine
      zitiert die andere.

      '
