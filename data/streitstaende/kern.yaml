  - position: Rüge ohne Kassation — Verstoß gegen Transparenz und Verantwortung, aber keine Grundrechtsverletzung
    gericht: Corte Constitucional de Colombia, Sala Segunda de Revisión, Sentencia T-323/24 vom 02.08.2024
    begruendung: 'Das Berufungsgericht hatte ChatGPT 3.5 befragt und die Antworten in die schriftliche
      Entscheidung übernommen. Eine Verletzung des rechtlichen Gehörs verneinte das Verfassungsgericht,
      weil der Richter seine Entscheidung eigenständig mit herkömmlicher juristischer Methodik gebildet
      und die KI erst danach ergänzend herangezogen habe; zugleich stellte es fest, Transparenz und Verantwortlichkeit
      seien nicht vollständig gewahrt worden. Daneben formulierte es zwölf Leitkriterien — Transparenz
      mit Offenlegung von Einsatz, Umfang und Fundstelle im Urteil, Verantwortung mit Verifikationspflicht,
      Datenschutz, Nichtsubstitution des menschlichen Urteilens, Strenge und Verifikation, Risikoprävention,
      Gleichheit, menschliche Aufsicht, ethische Regulierung, kollektive Standards, laufende Beobachtung
      und Eignung der Mittel — und verpflichtete den Consejo Superior de la Judicatura, binnen vier Monaten
      förmliche Leitlinien zu erlassen. Das ist der ausführlichste richterrechtliche Kriterienkatalog
      der Welt, älter als jede europäische Practice Direction, und er ist ohne jede Rechtsfolge geblieben.

      '
