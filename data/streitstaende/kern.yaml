  - position: Ohne Täuschungsabsicht kein Strafzuschlag — die Schwelle zwischen Erstattung und Sanktion
    gericht: Supreme Court of British Columbia (Masuhara J), Zhang v. Chen, 20.02.2024; der Al-Haroun-Strang
      in Ayinde, 06.06.2025; Supreme Court of Victoria (Elliott J), Director of Public Prosecutions v
      GR, 14.08.2025
    begruendung: 'Der erste kanadische Fall liefert die meistzitierte Formel des Feldes — "citing fake
      cases in court filings and other materials handed up to the court is an abuse of process and is
      tantamount to making a false statement to the court" — und zieht daraus dennoch die mildere Folge:
      Der Gegenseite wurden die Kosten der Aufklärungsarbeit zugesprochen, special costs aber versagt,
      weil es an einer Täuschungsabsicht fehlte und die Anwältin die Fehler eingeräumt und sich entschuldigt
      hatte. Dieselbe Schwelle trägt den Al-Haroun-Strang in Ayinde: 45 fehlerhafte Fundstellen, davon
      18 vollständig erfunden, Verweisung an die SRA wegen eines "lamentable failure to comply with the
      basic requirement to check the accuracy of material that is put before the court" — und dennoch
      kein Kontemptverfahren, weil die Täuschungsabsicht nicht nachgewiesen war. In DPP v GR nahm das
      Gericht die Entschuldigung des Senior Counsel entgegen, obwohl ein Mordverfahren unterbrochen werden
      musste und erfundene Zitate bis hin zu angeblichen Äußerungen aus Parlamentsdebatten in die Akte
      gelangt waren. Die Trennlinie verläuft damit nicht auf der Pflichtenebene — dort genügt überall
      Fahrlässigkeit —, sondern auf der Rechtsfolgenebene: Erstattung schon bei Fahrlässigkeit, Strafzuschlag
      erst bei Täuschung.

      '
    urteile:
    - ca-2024-zhang-chen
    - au-2025-dpp-gr
    - za-2023-parker-forsyth
  - position: Missachtung des Gerichts — in Russland vollzogen, im Common Law angedroht und nie eingelöst
    gericht: Arbitragegericht des Westsibirischen Bezirks, А27-7831/2025, 14.05.2026; dagegen Ontario
      Superior Court of Justice (Myers J), Ko v. Li, 2025 ONSC 2965, 20.05.2025; Supreme Court of New
      Zealand, Jones v Family Court at Whangārei, [2026] NZSC 1; ferner Bezirksgericht Tel Aviv-Jaffa,
      23.08.2026, und ein brasilianisches Gericht zu Art. 80, 81 CPC
    begruendung: 'Russland ordnet den Vorgang nicht dem Berufsrecht, sondern der Rechtspflege zu: Das
      Kassationsgericht verhängte nach Art. 119 Abs. 5 APK RF eine Gerichtsgeldbuße von 50.000 RUB — bei
      einem Streitwert von 58.000 RUB — wegen bewusster Übermittlung falscher Angaben unter Fälschung
      von Quellen und des Versuchs, das Gericht durch vorgetäuschte höchstrichterliche Autorität zu beeinflussen;
      der Einwand, den Text habe eine KI erzeugt, wurde ausdrücklich zurückgewiesen. Im Common Law ist
      derselbe Vorwurf dreimal erhoben und keinmal vollzogen worden: Der englische Divisional Court bezeichnete
      die Kontemptschwelle bei Ayinde als erreicht und sah wegen tatsächlicher Unklarheiten und geringer
      Berufserfahrung ab, ausdrücklich ohne Präzedenzwirkung; in Ontario stellt 2025 ONSC 2965 das zuvor
      durch 2025 ONSC 2766 eingeleitete Show-cause-Verfahren unter Auflagen wieder ein — CPD-Kurse zu
      Berufsethik und Technik, Gebührenverbot für Recherche, Schriftsatzentwurf und Termin, 4.000 CAD
      auf partial-indemnity-Basis; und der neuseeländische Supreme Court benennt Kontempt nach dem Contempt
      of Court Act 2019 und Freiheitsstrafe nach ss. 116, 117 Crimes Act 1961 nur als mögliche Folge,
      obiter und gegenüber einer nicht vertretenen Partei. Auch außerhalb der Anglosphäre bleiben die
      Beträge symbolisch: 20.000 ILS in Tel Aviv, 50.000 INR vor dem Bombay High Court, unbezifferte Sanktionen
      wegen litigância de má-fé in Brasilien.

