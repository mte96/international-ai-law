  - position: Kein Rechtsfehler, weil es keine Norm gibt
    gericht: Regionalgericht Krasnodar, Berufungskollegium, 14.10.2025
    begruendung: 'Die Verteidigung hatte ein linguistisches Gutachten vorgelegt, das mehrere Formulierungen
      des angefochtenen Strafurteils als wahrscheinlich KI-generiert einstufte. Das Berufungsgericht wies
      die Rüge mit zwei Sätzen zurück: Die gewählte Stilistik berühre die Rechtmäßigkeit nicht, und es
      bestehe keine Rechtsvorschrift, die den Einsatz von KI bei der Abfassung von Urteilen regele. Das
      ist die genaue Umkehrung der Esquel-Begründung — dort trägt die fehlende Zurechenbarkeit die Nichtigkeit,
      hier trägt die fehlende Regelung die Zulässigkeit. Der Vorsitzende des Obersten Gerichtshofs hat
      für Mai 2026 eine Praxisübersicht angekündigt, die ausdrücklich auch Rechtsmittel erfassen soll,
      die auf die Verwendung von KI durch den Richter gestützt werden; im russischen System binden solche
      Übersichten die Instanzgerichte faktisch.

      '
