  stand: 'Der weltweit dichteste Fallbestand des KI-Rechts — nach Charlotin 2.005 dokumentierte Verfahren
    zum 01.09.2026 — und zugleich derjenige, in dem die Konvergenz am lautesten behauptet und am wenigsten
    belegt ist. Einig sind sich die Gerichte allein im Obersatz: Wer zitiert, muss gelesen haben, und
    die Verantwortung ist nicht an das Werkzeug delegierbar. Von dort an trennen sich die Wege, und die
    Trennlinien verlaufen nicht zwischen Rechtskreisen, sondern zwischen Anspruchsgrundlagen — Kostenrecht,
    Prozessrecht, Berufsrecht und, bislang nur in Russland vollzogen, Missachtung des Gerichts. Die Sanktionshöhen
    streuen um mehr als den Faktor hundert, ohne dass eine Entscheidung ihre Bemessung an einer anderen
    misst. Zwei Bewegungen sind seit 2025 klar erkennbar: der Wechsel von der gegriffenen Buße zur bezifferten
    Kostenerstattung und die Verschiebung des Adressaten vom Anwalt zur Partei — von 31 Zufallseinträgen
    der Datenbank betrafen 22 nicht vertretene Parteien. Deutschland hat seit dem 20.11.2025 genau eine
    veröffentlichte Entscheidung, und sie endet mit einer Verwarnung.

    '
  positionen:
  - position: Vollentschädigung gegen den Prozessvertreter persönlich — Kostenrecht statt Strafe
    gericht: Federal Court of Australia, Murray on behalf of the Wamba Wemba Native Title Claim Group
      v State of Victoria, 22.04.2025; High Court of South Africa (KZP), Mavundla, 08.01.2025; Nova Scotia
      Court of Appeal, Arbuckle v. Tanner, 12.08.2026
    begruendung: 'Die Rechtsfolge ist kein Ordnungsgeld, sondern die volle Erstattung dessen, was die
      Aufdeckung gekostet hat, und sie trifft unmittelbar den, der unterschrieben hat. Der Federal Court
      ordnete Kosten auf Indemnity-Basis gegen den Prozessbevollmächtigten persönlich an, ausdrücklich
      wegen der Aufsichtsverletzung — die falschen Fundstellen stammten aus dem Werkzeug einer unerfahrenen
      jüngeren Anwältin. Bezuidenhout AJ ordnete bei neun erfundenen Entscheidungen, vier unzutreffend
      wiedergegebenen und zwei falsch dargestellten Normen die Kostenhaftung de bonis propriis an, obwohl
      die Anwältin auf Arbeitsüberlastung und die Delegation an eine Berufsanfängerin verwies; den Verdacht
      hatte er zuvor selbst reproduziert, indem er ChatGPT dieselbe Frage stellte und dieselben erfundenen
      Entscheidungen erhielt. In Nova Scotia traf die Vollerstattung von 20.000 CAD eine nicht vertretene
      Partei, die maschinell erzeugte Verhandlungsprotokolle mit der angemaßten Qualifikationsangabe einer
      zertifizierten Protokollführerin eingereicht hatte. Gemeinsam ist den drei Entscheidungen, dass
      die Sanktionshöhe nicht am Verschulden hängt, sondern am Aufwand der Gegenseite.

      '
