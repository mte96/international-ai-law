  - position: Nutzung ohne Genuss des Ausdrucks — die weiteste Schranke der Welt, ohne Vorbehalt
    stelle: 'Art. 30-4 japanisches Urheberrechtsgesetz (著作権法 第三十条の四), seit 01.01.2019; Auslegung durch
      den Rechtsunterausschuss des Kulturrats vom 15.03.2024

      '
    begruendung: 'Japan knüpft nicht an einen Zweckkatalog an, sondern an eine negative Bestimmung: erlaubt
      ist jede Nutzung, die nicht auf den Genuss der im Werk ausgedrückten Gedanken oder Gefühle gerichtet
      ist. Kein Forschungsvorbehalt, keine Vergütung, kein Opt-out, auch kommerziell, auch durch Dritte.
      Die einzige Grenze ist der Vorbehalt am Ende der Vorschrift — Nutzungen, die die Interessen des
      Rechtsinhabers unangemessen beeinträchtigen; die Kulturbehörde nennt dafür drei Fallgruppen: Feinabstimmung
      auf den Stil eines bestimmten Urhebers, Training auf Datenbanken, die selbst dem Genuss dienen,
      und Substitutionswirkung. Dieser Vorbehalt ist nie gerichtlich ausgelegt worden. Die drei japanischen
      Verlagsverfahren gegen Perplexity greifen denn auch nicht das Training an, sondern den Abruf zur
      Laufzeit — der beste Beleg dafür, dass eine ausreichend weite Eingabeschranke den Streit nicht beendet,
      sondern verschiebt.

      '
