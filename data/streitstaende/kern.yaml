  aufloesung: 'Die Weichen stellt der Southern District of New York. Hält er

    robots.txt oder CAPTCHAs für technische Maßnahmen, entsteht ein

    Umgehungsschutz gegen Agenten, den der Ninth Circuit über den

    Zugangstatbestand gerade abgelehnt hat — und der Konflikt zwischen

    den beiden Normsystemen wird sichtbar. Verneint er es, bleibt der

    Vertragsweg das schärfste Instrument, und die Nutzungsbedingungen

    werden zum eigentlichen Regelungsort.


    Für Europa ist die Frage noch nicht gestellt. Sie wird es, sobald

    Art. 4 Abs. 3 DSM-RL auf agentische Zugriffe angewandt wird: Ein

    maschinenlesbarer Nutzungsvorbehalt ist funktional dasselbe wie eine

