  - position: Gar keine Schranke — und die Antwort kommt trotzdem
    gericht: 'China (Internetgericht Guangzhou, (2024) 粤0192民初113号; Volksgericht Jinshan, Shanghai, 03.11.2025);
      Brasilien (Art. 46 LDA, geschlossener Katalog); Kanada (s. 29 Copyright Act, geschlossener Zweckkatalog)

      '
    begruendung: 'Drei große Rechtsordnungen kennen weder eine TDM-Schranke noch eine Generalklausel.
      Nach dem Wortlaut ist das Training dort zustimmungspflichtig. Praktisch führt das zu drei verschiedenen
      Lagen. China hat den Streit auf die Ausgabe verlagert: Im Ultraman-Fall leitete das Gericht die
      Sorgfaltspflichten des Anbieters nicht aus dem Deliktsrecht, sondern unmittelbar aus einer Verwaltungsvorschrift
      ab (Interimsmaßnahmen für generative KI vom 15.08.2023) und lehnte den Antrag auf Löschung der Werke
      aus den Trainingsdaten ausdrücklich ab. Genau diese Trennung hat das Volksgericht Jinshan am 03.11.2025
      wieder eingerissen: Das gezielte Trainieren eines LoRA-Zusatzmodells auf geschützten Figurenbildern
      ist eine eigenständige Verletzungshandlung, weil das trainierte Modell verlässlich substitutive
      Ausgaben erzeugt. Brasilien hat den schärfsten Wortlaut der Welt und keine Rechtsprechung. Kanada
      hat einen geschlossenen fair-dealing-Katalog, eine 2024 abgeschlossene Konsultation ohne Ergebnis
      und ein Verfahren, das über die Zuständigkeit noch nicht hinausgekommen ist.

      '
