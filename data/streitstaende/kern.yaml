  stand: 'Drei Gerichte, drei Antworten, alle 2025/2026 — und alle drei Linien sind seither in Bewegung.
    Die englische Verneinung ist nicht rechtskräftig: Joanna Smith J hat die Berufung zum Punkt der mittelbaren
    Verletzung am 16.12.2025 zugelassen, weil es sich um eine reine Rechtsfrage handele, "on which the
    minds of reasonable lawyers may differ"; die Anschlussberufung von Stability zu den markenrechtlichen
    Feststellungen wurde nicht zugelassen. Die Münchener Memorisierungsvermutung ist am 08.12.2025 mit
    der Berufung angegriffen und zugleich von derselben Kammer am 31.07.2026 auf Musikkompositionen erstreckt
    worden — dort mit dem Argument, Übereinstimmungen in Melodie, Harmonie und Rhythmus seien zu spezifisch,
    um zufällig zu sein. Damit ist die Zufallsverteidigung, die bei kurzen Textfragmenten noch trug, für
    Musik praktisch entwertet.

    '
  positionen:
