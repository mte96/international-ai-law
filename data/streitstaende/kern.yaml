    begruendung: 'Das heilberufliche Bezeichnungsverbot fragt nicht nach Schaden, Kausalität oder Verschulden,
      sondern nur, ob jemand sich als approbiert ausgegeben hat. Vorgetragen ist, Character.AI-Personae
      hätten sich als in Pennsylvania approbierte Psychiater ausgegeben, psychiatrisch beraten und eine
      Approbationsnummer erfunden. Das ist der dogmatisch schmalste und deshalb wirksamste Angriff: Die
      Verteidigung mit dem First Amendment läuft leer, weil berufsrechtliche Bezeichnungsverbote als zulässige
      Regulierung kommerzieller Rede gelten, und der Zurechnungseinwand — die Persona habe ein Nutzer
      angelegt — trägt gerade nicht, weil die erfundene Approbationsnummer vom Modell stammt. Illinois
      geht mit dem WOPR Act einen Schritt weiter und untersagt jeder Stelle einschließlich internetbasierter
      künstlicher Intelligenz die Erbringung von Therapieleistungen ohne lizenzierte Fachkraft; Utah verlangt
