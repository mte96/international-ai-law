  unterfragen:
  - frage: Genügt für die Ausnahme die Selbstbewertung des Anbieters?
    ja: Art. 6 Abs. 3 KI-VO und die Entwurfsleitlinien — Dokumentation und Registrierung, keine Vorprüfung
    nein: EDRi/ECNL und AlgorithmWatch — Selbstfreistellung ohne behördliche Kontrolle
  - frage: Ist der Katalog der vier Ausnahmefälle abschließend?
    ja: Kommission in den Entwurfsleitlinien
    nein: praktisch umgangen über die Definition des KI-Systems (Art. 3 Nr. 1) und den Begriff des Sicherheitsbauteils
  - frage: Sperrt Profiling die Ausnahme ausnahmslos?
    ja: Art. 6 Abs. 3 UAbs. 2 nach der Lesart der Kommission
    nein: ungeklärt, wenn das Profiling nur ein Teilschritt einer im Übrigen vorbereitenden Aufgabe ist
  aufloesung: 'Eine erste verbindliche Klärung ist frühestens mit der Endfassung der Leitlinien zu erwarten,
    angekündigt für Ende 2026 — und diese binden die Kommission, nicht die Gerichte. Materiell justiziabel
    wird der Streit erst ab dem 02.12.2027, wenn die Anhang-III-Pflichten anwendbar werden; die ersten
    Entscheidungen werden Marktüberwachungsverfahren sein, keine Urteile. Eine Vorlage an den EuGH ist
    vor 2029 nicht zu erwarten. Bis dahin entscheidet faktisch, wer die Registrierung vornimmt und wie
    die Aufsicht sie liest.

    '
  eigene_bewertung: 'Der Omnibus hat Art. 6 Abs. 3 nicht angefasst, die Registrierungspflicht für den,
    der sich auf die Ausnahme beruft, aber beibehalten. Das kehrt die Anreizlage um. Wer die Ausnahme
    in Anspruch nimmt, muss das in einer öffentlichen Datenbank kundtun, mit dokumentierter Selbstbewertung,
    und zwar bevor überhaupt eine Pflicht anwendbar wird. Die Ausnahme ist damit kein Ausgang, sondern
    eine Selbstanzeige mit aufgeschobener Pflicht. Kostenfrei bleibt allein, wer stillschweigend annimmt,
    gar nicht erfasst zu sein; wer es ordentlich macht, liefert der Aufsicht eine Zielliste. Diese perverse
    Wirkung ist, soweit ersichtlich, nirgends beschrieben. Der zweite Punkt ist der griechische. Ein Mitgliedstaat,
    der drei Jahre vor der KI-VO eine algorithmische Folgenabschätzung und einen individuellen Parameteranspruch
    für die Verwaltung hatte, hat beides zum 20.07.2026 aufgehoben, weil die Verordnung als abschließend
    gilt. Verbindet man das mit Art. 6 Abs. 3, ergibt sich: Ein System, das sich selbst aus dem Hochrisikobereich
    herausdefiniert, unterliegt in Griechenland heute weniger Transparenz als 2022. Die Harmonisierung
    hat das Schutzniveau hier gesenkt — das Gegenteil der Erzählung vom Brüsseler Effekt, und der eigentliche
    Preis der Ausnahmeklausel. Drittens eine Feststellung zur Rechtsnatur: Leitlinien der Kommission binden
    weder Marktüberwachungsbehörden noch Gerichte. Die praktisch wichtigste Frage der Verordnung wird
    also durch ein Instrument beantwortet, das keine Verbindlichkeit hat, sechzehn Monate vor Beginn der
    Pflichten, gegenüber Adressaten, die bis dahin ihre Produkte längst entworfen haben. Wer den Streit
    verstehen will, sollte nicht die Auslegung studieren, sondern das Datum.

    '
