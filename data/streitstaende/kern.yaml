  - position: KI-Verordnung — ein Erläuterungsanspruch mit engem Anwendungsbereich
    stelle: Art. 86 KI-VO, anwendbar seit 02.08.2026
    begruendung: 'Der Betroffene kann vom Betreiber eine klare und aussagekräftige Erläuterung zur Rolle
      des KI-Systems im Entscheidungsverfahren und zu den wichtigsten Elementen der getroffenen Entscheidung
      verlangen. Voraussetzung ist, dass die Entscheidung überwiegend auf den Ausgaben eines Hochrisiko-Systems
      nach Anhang III (außer Nummer 2) beruht und rechtliche Wirkungen entfaltet oder erheblich beeinträchtigt.
      Der Anspruch ist antragsabhängig und subsidiär gegenüber anderem Unionsrecht. Er ist weiter als
      Art. 22 DSGVO, weil er auch bei menschlicher Überprüfung greift, und enger, weil er nur Anhang-III-Systeme
      erfasst.

      '
    belege:
    - ki-vo-2024-1689
    - Wendehorst/Dorffner, Wissenschaftliches Rechtsgutachten zu Art. 86 KI-VO, im Auftrag eines österreichischen
      Bundesministeriums, Wien 2025 — im Bestand nicht erfasst
