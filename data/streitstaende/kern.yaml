  - position: Nicht die Ermächtigung, sondern ihre Qualität — und eine Pflicht zur Verzerrungsprüfung
      aus dem Gleichbehandlungsrecht
    gericht: Court of Appeal (Civil Division), 11.08.2020 – [2020] EWCA Civ 1058 (Bridges); vorgehend
      Divisional Court, 04.09.2019 – [2019] EWHC 2341 (Admin)
    begruendung: 'Der britische Weg fragt nicht, ob eine Ermächtigung existiert, sondern ob sie hinreichend
      bestimmt ist. Der Divisional Court hatte 2019 die Klage vollständig abgewiesen: Common Law der Polizeibefugnisse,
      Data Protection Act und Surveillance Camera Code genügten. Der Court of Appeal gab der Berufung
      2020 in drei von fünf Punkten statt. Der Rechtsrahmen genüge dem „in accordance with the law“ des
      Art. 8 Abs. 2 EMRK nicht, weil er dem einzelnen Beamten in zwei entscheidenden Fragen zu weites
      Ermessen lasse — wer auf die Fahndungsliste kommt und wo eingesetzt wird. Die Datenschutz-Folgenabschätzung
      sei fehlerhaft. Und die Polizei habe die Public Sector Equality Duty des s. 149 Equality Act 2010
      verletzt, weil sie keine hinreichenden Schritte unternommen habe, sich zu vergewissern, dass die
      Software keine Verzerrung nach Geschlecht oder Hautfarbe aufweist; die bloße Unkenntnis der Herstellerdaten
      entlaste nicht. Das ist in diesem gesamten Vergleich die einzige gerichtlich ausgesprochene Pflicht
      zur aktiven Verzerrungsprüfung — und sie kommt nicht aus dem Datenschutz-, sondern aus dem Gleichbehandlungsrecht.
      Verhältnismäßigkeit und Policy Document wurden dagegen nicht beanstandet; ein Verbot hat das Gericht
      nicht ausgesprochen. Für den privaten Arbeitgeber zieht der ICO 2024 in der Sache Serco dieselbe
      Linie mit umgekehrtem Vorzeichen: Bequemlichkeit rechtfertigt keine biometrische Verarbeitung, solange
      eine unbiometrische Alternative existiert, und eine Einwilligung scheidet im Arbeitsverhältnis wegen
      des Machtgefälles aus.

      '
