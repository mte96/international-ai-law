  fehlende_belege:
  - 'NO FAKES Act of 2026, S. 4591, 119. Kongress: Der Bestand führt unter us-no-fakes-act die Fassung
    S. 1367 (2025). Die Fassung 2026, das Passieren des Senate Judiciary Committee im Juni 2026, das Gegenanzeigeverfahren
    und die neuen Ausnahmen für Bibliotheken, Archive und Bildungseinrichtungen sind nicht erfasst; congress.gov
    ließ sich wegen robots.txt nicht abrufen, die Angaben stammen aus Kanzleiquellen. Schutzdauer, Vererblichkeit
    im Einzelnen und Reichweite der preemption konnten nicht am Gesetzestext verifiziert werden.'
  - 'Art. 612-quater c. p.: Wortlaut, Strafrahmen und Antragserfordernis stammen aus dem Normeintrag it-legge-132-2025-cp-612-quater;
