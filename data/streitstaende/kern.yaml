  - position: Bezifferte Kostenerstattung mit symbolischer Bußkomponente — die amerikanische Höchstmarke
    gericht: Supreme Court of the State of New York, Kings County (Capell J), Kleyman v. Kaloidis, 04.08.2026
      nebst der Vorentscheidung vom 13.04.2026; United States District Court, N.D. Mississippi, Disability
      Rights Mississippi, 19.12.2025
    begruendung: 'Kleyman markiert das obere Ende: 23 erfundene Entscheidungen über 19 Einreichungen,
      47 Bezugnahmen, dazu mindestens 83 unzutreffend wiedergegebene echte Entscheidungen — und die Einreichungen
      gingen weiter, nachdem die Gegenseite die Fälschungen benannt hatte und nachdem dasselbe Gericht
      vier Monate zuvor bereits sanktioniert hatte. Die Sanktion von 46.511,35 USD nach 22 N.Y.C.R.R.
      § 130-1.1 zerfällt in 10.000 USD an den Lawyers Fund for Client Protection und 36.511,35 USD Kostenerstattung
      an die Gegenseite; hinzu kommt die Verweisung an das Grievance Committee. Dieselbe Struktur trägt
      den krummen Betrag von 20.883 USD in Disability Rights Mississippi, verbunden mit Fortbildungsauflage,
      Kammeranzeige und Mandatsniederlegung. Die Bemessungsgrundlage ist damit nicht mehr die Missbilligung,
      sondern die Rechnung des Gegners. Zentral und international zitierfähig: "Counsels duty of candor
      to the Court cannot be delegated to a software program", und der Hinweis, die Prüfung wäre über
      eine kostenlose Suchmaschine möglich gewesen.

      '
