  stand: 'Die Frage ist überall dieselbe, die Antworten sind nicht einmal derselben Art. Sechzehn Rechtsordnungen
    benutzen mindestens sechs verschiedene Instrumente, und in keiner von ihnen liegt eine rechtskräftige
    Sachentscheidung vor. Weltweit hat genau ein Gericht über die Reichweite einer Trainingsschranke in
    einem streitigen Verfahren materiell befunden — der Delhi High Court am 24.07.2026, und auch dort
    nur prima facie im Eilverfahren (in-2026-ani-openai). Alles Übrige ist Gesetzestext, Klageschrift,
    Zuständigkeitsentscheidung, Ausgabenhaftung oder Verwaltungsmeinung. Der 03.09.2026 war der bislang
    dichteste Tag des Streits: Am selben Tag verhandelte der BGH in I ZR 281/25 (de-2026-laion-bgh) und
    kündigte Generalanwalt Szpunar seine Schlussanträge in C-250/25 an (eu-2025-like-company-google) —
    der Ausgang beider Termine ist mit Stand 05.09.2026 nicht erfasst. Gleichzeitig läuft die Gesetzgebung
    in die Gegenrichtung: Italien hat den Verstoß gegen den Nutzungsvorbehalt seit dem 10.10.2025 kriminalisiert,
    Russland knüpft die Trainingsschranke an die Herkunft des Entwicklers, Indien und Brasilien arbeiten
    an einem Vergütungsmodell statt einer Schranke.

    '
  positionen:
  - position: Offener Abwägungstatbestand — die Antwort ist der Prozess
    gericht: 'USA (17 U.S.C. § 107; N.D. Cal., D. Del., Third Circuit anhängig); Republik Korea (Art.
      35-5 Urheberrechtsgesetz, Seoul Central District Court 2025가합5105); Israel (Section 19 Copyright
      Act 2007)

      '
    begruendung: 'Diese Familie stellt keinen Tatbestand auf, sondern einen Maßstab: Zweck und Charakter
      der Nutzung, Art des Werkes, Umfang der Übernahme, Marktwirkung. Sie erlaubt jede Antwort und bindet
      keine. Der praktische Preis ist, dass die Frage vor der Nutzung nicht beantwortbar ist — in den
      Vereinigten Staaten laufen 137 Verfahren, sechs haben das Summary-Judgment-Stadium erreicht, keine
      einzige Berufungsentscheidung liegt vor. Korea hat die Klausel 2011 nach amerikanischem Vorbild
      übernommen und ist damit die einzige asiatische Rechtsordnung, in der die US-Dogmatik unmittelbar
      auf Trainingsdaten anwendbar ist; das Verfahren der drei terrestrischen Rundfunkveranstalter gegen
      NAVER läuft seit dem 13.01.2025 ohne Sachentscheidung. Israel hat die Frage nie einem Gericht vorgelegt.
      Der innere Streit dieser Familie ist Gegenstand des Streitstands `fair-use-training` und wird hier
      nicht wiederholt.

      '
