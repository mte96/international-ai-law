  - position: Der technische Schwellenwert als Auflage — die Aufsicht setzt einen Modellparameter fest
    gericht: Office of the Privacy Commissioner / Te Mana Mātāpono Matatapu (Neuseeland), Bericht A1082856
      vom 03.06.2025 (Foodstuffs North Island)
    begruendung: 'Der Gegenpol zur australischen Bunnings-Entscheidung: dieselbe Technik, derselbe Einzelhandelskontext,
      dasselbe Jahr, gegenläufiges Ergebnis. Der Commissioner hielt das im Versuch eingesetzte Betriebsmodell
      insgesamt für vereinbar mit dem Privacy Act 2020, weil die Technik schwere Wiederholungstaten wirksam
      verringert habe und die Schutzvorkehrungen genügten. Der Unterschied zu Bunnings liegt nicht im
      Recht, sondern in der vorab dokumentierten Verhältnismäßigkeitsprüfung und der minimierten Verweildauer.
      Der eigentliche Präzedenzwert liegt in der Auflage für den Dauerbetrieb: Die Alarmschwelle des Abgleichsalgorithmus
      ist von 90 auf mindestens 92,5 Prozent anzuheben. Eine Datenschutzaufsicht setzt damit einen technischen
      Modellparameter regulatorisch fest — die konkreteste denkbare Ausprägung des Grundsatzes der Datenrichtigkeit
      (IPP 8; in Europa Art. 5 Abs. 1 lit. d DSGVO und Art. 10 KI-VO). Ausdrücklich heißt es, der Bericht
      sei „not a green light for more general use of FRT"; eine ethnische Auswertung von Treffern und
      Fehlern scheiterte an der Datenlage, und das Māori Reference Panel lehnte den Einsatz ab.

      '
    urteile:
