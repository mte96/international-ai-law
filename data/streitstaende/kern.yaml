- id: haftung-fuer-ki-ausgaben
  titel: Haftungsregime für fehlerhafte KI-Ausgaben
  frage: 'Nach welchem Regime haftet, wer eine fehlerhafte KI-Ausgabe verbreitet oder ihr folgt — und
    ist eine Halluzination ein Produktfehler?

    '
  jurisdiktionen:
  - eu
  - de
  - us
  - ca
  themenachsen:
  - haftung
  - content
  - vertrag
  stand: 'Es gibt kein Regime, sondern drei, und sie stehen unverbunden nebeneinander. Nach der förmlichen
    Rücknahme der KI-Haftungsrichtlinie (ABl. C/2025/5423 vom 06.10.2025) existiert kein KI-spezifisches
    Haftungsrecht der Union; eine Nachfolgeinitiative ist nicht angekündigt. Die neue Produkthaftungsrichtlinie
    ist bis zum 09.12.2026 umzusetzen und gilt nur für Produkte, die nach diesem Tag in Verkehr gebracht
    oder in Betrieb genommen werden. Bis dahin und daneben entscheiden nationale Verkehrspflichten, Äußerungsrecht
    und Vertragsrecht. Fast alle vorhandenen Entscheidungen betreffen die Zurechnung, nicht den Fehlerbegriff.
    Der Fehlerbegriff wird derzeit an zwei Stellen ersatzweise entwickelt: im amerikanischen Vertrags-
    und Versicherungsrecht, wo nicht die Ausgabe, sondern die zugesagte und tatsächlich unterbliebene
    menschliche Prüfung angegriffen wird, und in den kalifornischen Produkthaftungsverfahren, die an der
    Architektur des Systems ansetzen statt an der einzelnen Äußerung.

    '
  positionen:
  - position: Zurechnung als eigene Äußerung — Disclaimer entlasten nicht
    gericht: LG Hamburg (Pressekammer), LG München I, OLG Hamm, LG Kiel, Civil Resolution Tribunal British
      Columbia
    begruendung: 'Der Betreiber haftet für die Ausgabe wie für eine eigene Aussage. Das LG Hamburg hat
      die halluzinierte Behauptung eines Sprachmodells dem Betreiber und nicht dem promptenden Nutzer
      zugerechnet und einen Warnhinweis ausdrücklich nicht genügen lassen. Das LG München I hat KI-Suchzusammenfassungen
      als eigene Inhalte der Suchmaschine eingeordnet, weil Fremdinformationen zu eigenen synthetisierten
      Aussagen verdichtet werden. Das OLG Hamm hat den Chatbot auf der Unternehmenswebsite als Teil der
      geschäftlichen Organisation und nicht als Dritten behandelt. Das CRT hat den Vortrag von Air Canada,
      der Chatbot sei eine eigenständige, selbst verantwortliche Einheit, zurückgewiesen.

      '
    urteile:
    - de-2025-lg-hamburg-grok
    - de-2026-lg-muenchen-ai-overviews
    - de-2026-olg-hamm-chatbot-uwg
    - de-2024-lg-kiel-ki-falschinfo
    - ca-2024-moffatt-air-canada
  - position: Keine eigene Benutzung — dasselbe Produkt, entgegengesetzte Zurechnung
    gericht: Landgericht Berlin II, 52. Zivilkammer, Beschl. v. 01.06.2026 – 52 O 62/26 eV
    begruendung: 'In markenrechtlicher Hinsicht verneint dieselbe Konstellation die Zurechnung: Google
      benutze die Marke nicht markenmäßig, sondern schaffe nur die technischen Voraussetzungen dafür,
      dass Inhalte Dritter dargestellt werden; die Verkehrskreise verstünden die KI-Übersicht als aggregiertes
      Suchergebnis und nicht als eigene kommerzielle Aussage. Damit steht neben dem äußerungsrechtlichen
      Befund des LG München I für dasselbe Produkt der gegenteilige kennzeichenrechtliche.

      '
    urteile:
    - de-2026-lg-berlin-ai-overviews-marke
  - position: Kein Ehrschutz ohne Tatsachenbehauptung — der Disclaimer wirkt
    gericht: Superior Court of Gwinnett County, Georgia, Walters v. OpenAI, 19.05.2025
    begruendung: 'Summarisches Urteil zugunsten des Anbieters auf drei selbständig tragenden Gründen:
      Ein verständiger Leser hätte die Ausgabe angesichts der Warnhinweise und des Kontexts nicht als
      Mitteilung tatsächlicher Vorgänge verstanden; es fehle am Verschulden, für eine Person des öffentlichen
      Lebens an actual malice; und es fehle am ersatzfähigen Schaden, weil der einzige Empfänger die Behauptung
      sofort als falsch erkannte.

      '
    urteile:
    - us-2025-walters-openai
  - position: Wiederholung nach Hinweis begründet das Verschulden
    gericht: Delaware Superior Court (Adams J), Starbuck v. Google, Zurückweisung des Abweisungsantrags
      am 24.07.2026; ferner Starbuck v. Meta und Wolf River Electric v. Google
    begruendung: 'Die gegenläufige US-Linie setzt nicht bei der Ausgabe an, sondern beim Verhalten des
      Anbieters nach der Beschwerde. Wer nach einem Hinweis dieselbe falsche Behauptung weiter ausgibt,
      erfüllt den erforderlichen Verschuldensgrad — so bereits Volokh 2023. Starbuck v. Meta endete im
      August 2025 im Vergleich, die Beklagte stellte den Kläger anschließend als Berater für KI-Verzerrungen
      ein; Wolf River Electric v. Google betrifft eine KI-Zusammenfassung, die eine nicht existierende
      Klage des Attorney General behauptete.

      '
    belege:
    - Starbuck v. Google, Delaware Superior Court, Entscheidung über den Abweisungsantrag vom 24.07.2026
      (Richterin Meghan A. Adams) — Aktenzeichen nicht ermittelt
    - Starbuck v. Meta (Klage April 2025, Vergleich August 2025) — Gericht und Aktenzeichen nicht ermittelt
    - Wolf River Electric v. Google (Minnesota; Zurückverweisung Januar 2026) — Aktenzeichen nicht ermittelt
