  titel: Zurechnung und Offenlegung bei algorithmischer Steuerung des Arbeitsverhältnisses
  frage: 'Wer haftet, wenn eine algorithmische Auswahl im Arbeitsverhältnis diskriminiert — und wem gegenüber
    ist die Funktionsweise offenzulegen: dem Bewerber, der Arbeitnehmervertretung, der Aufsicht oder niemandem?

    '
