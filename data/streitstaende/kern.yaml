  - position: Niemand regelt — Verweigerung der Rechtsfortbildung und normatives Vakuum
    stelle: Supreme Court of India (Goswami, 13.08.2026); Deutschland (Länderprojekte ohne Rechtsgrundlage);
      Griechenland (Kommission ohne Regelwerk)
    begruendung: 'Der indische Supreme Court — sonst das aktivistischste Höchstgericht der Welt — hat
      am 13.08.2026 eine Popularklage auf Mindestgarantien für den staatlichen KI-Einsatz nicht zur Entscheidung
      angenommen: "Two reasons it cannot be addressed by us. One is it is a highly technical issue. We
      are not the experts. And this is a policy domain." Auf die eigenen KI-Regeln der Justiz wies das
      Gericht hin, ohne sie zu benennen. In Deutschland fehlt jede Rechtsgrundlage: Es gibt kein dem §
      35a VwVfG entsprechendes Pendant für gerichtliche Entscheidungen und kein Verfahrensrecht zur Offenlegung
      KI-gestützter Vorarbeiten gegenüber den Beteiligten, während FRAUKE am Amtsgericht Frankfurt, OLGA
      in Baden-Württemberg und Bayern und Codefy als Assistenzsysteme in Massenverfahren laufen. Griechenland
      unterhält seit 2021 eine ständige wissenschaftliche Kommission des Justizministeriums, die bis Februar
      2026 tagt und kein Regelwerk veröffentlicht hat — und hat mit Άρθρο 4 ν. 4961/2022 zum 20.07.2026
      zugleich den einzigen Gesetzesvorbehalt für KI-gestützte Entscheidungen öffentlicher Stellen ersatzlos
      aufgehoben.

      '
