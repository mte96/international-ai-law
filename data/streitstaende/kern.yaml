  - position: Die Produktfrage wird jetzt in Kalifornien gestellt — und zwar an der Architektur, nicht
      an der Äußerung
    gericht: 'Superior Court of California, San Francisco, JCCP No. 5431 (In re: ChatGPT Product Liability
      Cases); ferner N.D. Cal. (Lyons) und die Gemini-Klage gegen Google'
    begruendung: 'Zwölf Verfahren gegen OpenAI sind im Februar 2026 koordiniert worden; Case Management
      Order No. 1 datiert vom 04.08.2026. Der Streitpunkt ist ausdrücklich die Einordnung als "product"
      — OpenAI spricht in seinen Schriftsätzen konsequent von einem "software-based service". Die Kläger
      umgehen die Äußerungsfrage, indem sie nicht einzelne Ausgaben angreifen, sondern die Gestaltung:
      entfernte Abbruchmechanismen bei erkannter Suizidplanung, auf Verweildauer optimierte anthropomorphe
      Gesprächsführung, verkürzte Sicherheitsprüfung vor der Freigabe von GPT-4o. Der Bundesrichter in
      Lyons hat es abgelehnt, zugunsten des Koordinationsverfahrens auszusetzen; die Frage wird damit
      in zwei Gerichtssystemen parallel beantwortet. Die Gemini-Klage verschiebt den Vorwurf erstmals
      von der Selbst- zur Fremdgefährdung und wirft damit auf, ob die Brandenburg-Doktrin auf maschinell
      erzeugten Text anwendbar ist — was voraussetzt, dass man das Modell als Sprecher begreift.

      '
    urteile:
    - us-2026-jccp-5431
    - us-2025-raine-openai
    - us-2025-smvlc-sieben-openai
    - us-2026-lyons-openai
