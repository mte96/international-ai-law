  - position: Sicherheitsgeneralklausel statt Ermächtigung — und der EGMR als Untergrenze
    gericht: Moskauer Stadtgericht, 33а-0710/2025; Sawjolowski-Bezirksgericht Moskau, 06.11.2019; dagegen
      Europäischer Gerichtshof für Menschenrechte (Dritte Sektion), 04.07.2023 – Nr. 11519/20 (Glukhin)
    begruendung: 'Russland beweist, dass die dritte Antwort möglich ist: Aus dem Schweigen des Gesetzes
      folgt eine Erlaubnis. Das flächendeckendste biometrische Überwachungssystem Europas beruht auf keiner
      eigenen gesetzlichen Grundlage; die Gerichte tragen es über die Ausnahmetatbestände des Art. 11
      152-FZ, über eine Verkehrssicherheitsverordnung (Regierungsverordnung Nr. 1641 vom 08.10.2020) und
      über eine Auslegung des Obersten Gerichtshofs, wonach es für Maßnahmen zum Schutz der Rechtsordnung
      und der Staatssicherheit keiner Einwilligung bedarf. Die Klagen scheitern zudem an der Beweislast:
      Wer nicht beweisen kann, dass gerade sein Gesicht erkannt wurde, erreicht die materielle Prüfung
      nicht. Der EGMR hat 2023 das Gegenteil entschieden — die Identifizierung eines friedlichen Einzeldemonstranten
      per Gesichtserkennung verletzt Art. 8 und Art. 10 EMRK, die Überwachung sei „höchst eingriffsintensiv“
      und „unvereinbar mit den Idealen und Werten einer demokratischen Gesellschaft“, es fehle an dokumentierten
      Schutzvorkehrungen und an Transparenz. Vollzogen wird das nicht: Russland ist seit dem 16.09.2022
      nicht mehr Vertragspartei; die Metro-Entscheidung von 2025 zitiert die Konvention nicht. Welches
      Schutzniveau das System tatsächlich hat, zeigt ein anderer Fall: Zwei Moskauer Polizisten verkauften
      Daten aus dem System und wurden mit 10.000 und 20.000 RUB belegt — ein Bruchteil der 15 bis 20 Mio.
      RUB, die einem Unternehmen für ein Leck biometrischer Daten drohen.

      '
