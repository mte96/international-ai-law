  - position: Enumerierte Schranke mit Nutzungsvorbehalt — der europäische Weg
    stelle: 'Art. 3 und 4 RL (EU) 2019/790; § 44b UrhG; Άρθρα 21Α und 21Β ν. 2121/1993 (eingefügt durch
      Άρθρα 8 und 9 ν. 4996/2022); Art. 70-ter, 70-quater und 70-septies l. 633/1941; Art. L. 122-5-3
      code de la propriete intellectuelle

      '
    begruendung: 'Das Gegenmodell: ein fester Tatbestand, der ex ante Sicherheit gibt, dafür aber eine
      harte Grenze hat — den Rechtsvorbehalt des Art. 4 Abs. 3 DSM-RL. Wer ihn erklärt, nimmt sein Werk
      aus der Schranke heraus, ohne klagen zu müssen. Italien hat mit Art. 70-septies l. 633/1941 klargestellt,
      dass die Schranken auch für generative Modelle gelten, und damit ausdrücklich, was in Deutschland
      streitig ist. Der Streit um Reichweite und Maschinenlesbarkeit ist Gegenstand des Streitstands `tdm-schranke-de`
      und wird hier nicht wiederholt. International zählt an diesem Modell etwas anderes: Über Art. 53
      Abs. 1 lit. c KI-VO wirkt der Vorbehalt auf jedes Universalmodell durch, das in der Union in Verkehr
      gebracht wird — unabhängig davon, wo trainiert wurde. Die enumerierte Schranke ist damit die einzige
      der sechs Antworten mit extraterritorialer Reichweite kraft Gesetzes.

      '
