  unterfragen:
  - frage: Folgt aus dem Schweigen des Fachgesetzes ein Verbot?
    ja: Conseil d'État n° 506370 („dans leur silence“) und ΑΠΔΠΧ 45/2025 — die Ermächtigung zur Videoüberwachung
      trägt die algorithmische Auswertung nicht
    nein: Moskauer Stadtgericht 33а-0710/2025 — Sicherheitsgeneralklausel und Verkehrssicherheitsverordnung
      genügen; ebenso im Ergebnis der Divisional Court 2019, der das Common Law der Polizeibefugnisse
      ausreichen ließ
  - frage: Ersetzt Art. 6 Abs. 1 lit. e DSGVO die fachgesetzliche Ermächtigung?
    ja: die Prämisse der Gemeinde Nizza und der Ελληνική Αστυνομία; in der Sache Κένταυρος von der Behörde
      nicht beantwortet
    nein: Conseil d'État und ΑΠΔΠΧ — die datenschutzrechtliche Rechtsgrundlage ist keine Befugnisnorm
  - frage: Kann sich ein privates Unternehmen auf die Bereichsausnahme für staatliche Tätigkeit berufen?
    ja: First-tier Tribunal [2023] UKFTT 819 (GRC) — maßgeblich sei die Tätigkeit der Kunden
    nein: Upper Tribunal [2025] UKUT 319 (AAC) — die Ausnahme gilt für Staaten, nicht für ihre Zulieferer;
      beim Court of Appeal seit dem 19.12.2025 erneut offen
  - frage: Ist „biometrisch“ das richtige Anknüpfungsmerkmal?
    ja: Art. 5 KI-VO und Art. 10 loi n° 2023-380, die beide die Trennlinie bei der biometrischen Identifizierung
      ziehen
    nein: Conseil d'État — er knüpft an „traitements algorithmiques permettant une analyse systématique
      et automatisée“ an und erfasst damit auch die Falschparkererkennung; Sußner zeigt die Gegenrichtung
      an der Skelett-Erkennung, die dieselben Verhaltensinferenzen ohne Biometrie erzeugt
  - frage: Rechtfertigt die Abwehr von Diebstahl und Gewalt die Gesichtserkennung im Laden?
    ja: ART [2026] ARTA 130 — s. 16A Privacy Act, „relatively low bar“; der Sache nach auch Art. 19 bis
      LOI n° 2026-798 mit CNIL-Genehmigung
    nein: OAIC [2024] AICmr 230 und, für den bloßen Bequemlichkeitszweck, ICO gegen Serco und OAIC gegen
      7-Eleven
  - frage: Muss die einsetzende Stelle die Verzerrung des Systems aktiv prüfen?
    ja: Court of Appeal in Bridges über s. 149 Equality Act 2010 — Unkenntnis der Herstellerdaten entlastet
      nicht
    nein: keine andere Entscheidung dieses Bestands kennt eine solche Pflicht; die FTC ersetzt sie durch
      eine Nachweispflicht für den, der Diskriminierungsfreiheit behauptet
  - frage: Wirkt eine Sanktion gegen einen Anbieter ohne Vermögen im Sanktionsstaat?
    ja: der Anspruch der vier Aufsichtsentscheidungen gegen Clearview und des Consent Order vor dem Circuit
      Court of Cook County
    nein: 'der Befund: Das AAT-Verfahren endete durch Rückzug, die OAIC verzichtet seit dem 21.08.2024
      auf weitere Vollstreckung, die britische Geldbuße ist bis heute nicht vollstreckt, die französische
      Entscheidung ist auf cnil.fr gelöscht'
  aufloesung: 'Keine einzelne Entscheidung löst das auf; maßgeblich sind sechs Termine, und keiner davon
    ist ein europäisches Grundsatzurteil. Erstens der 02.12.2027: Erst dann werden die Hochrisiko-Pflichten
    für den Biometriebereich des Anhangs III anwendbar; bis dahin gilt von der KI-Verordnung nur der Verbotskatalog
    des Art. 5. Zweitens das britische Doppelverfahren Clearview — Sachentscheidung des First-tier Tribunal
    nach Zurückverweisung und Zuständigkeitsentscheidung des Court of Appeal, für beides kein Termin veröffentlicht.
    Drittens die beim Bundesverfassungsgericht anhängigen Verfahren 1 BvR 1557/24 (Hessen, seit 21.06.2024)
    und 1 BvR 1446/25 (Bayern, seit 23.07.2025) sowie das nordrhein-westfälische Verfahren ohne veröffentlichtes
    Aktenzeichen; hinzu tritt der Normenkontrollantrag vor dem Verfassungsgerichtshof des Landes Berlin
    vom 28.08.2026, mit dem frühestens in ein bis zwei Jahren zu rechnen ist. Viertens die deutschen §§
    98d, 98e StPO-E, dem Bundestag am 01.07.2026 zugeleitet — die erste ausdrückliche deutsche Ermächtigung
    zum biometrischen Internetabgleich, gegen die Lewandowski den technischen Einwand erhebt, dass ein
    Abgleich ohne Datenbankaufbau nicht existiert und die Norm damit unmittelbar auf Art. 5 Abs. 1 lit.
    e KI-VO trifft. Fünftens Frankreich: Das VSA-Experiment läuft bis zum 31.12.2030, das Einzelhandelsexperiment
    bis zum 31.12.2027, und die Proposition de loi Verzelen (Sénat, texte n° 609 vom 12.05.2026) zielt
    auf die dauerhafte Verankerung in einem neuen Art. L. 251-1-1 CSI, die das RIPOST-Gesetz gerade nicht
    vorgenommen hat. Sechstens, und institutionell am folgenreichsten, der 20.07.2026: Seit diesem Tag
    ist die ΑΠΔΠΧ nach Άρθρο 3 ν. 5321/2026 zugleich Marktüberwachungsbehörde für Art. 5 KI-VO. In Australien
    ist der Streit dagegen vorerst beendet, weil die Privacy Commissioner gegen die Bunnings-Entscheidung
    kein Rechtsmittel eingelegt hat und die zweite Tranche der Privacy-Act-Reform kein Datum hat.

    '
  eigene_bewertung: 'Erstens zur Konvergenz selbst. Dass ein oberstes Verwaltungsgericht und eine Datenschutzbehörde
    binnen fünf Wochen dieselbe Auslegungsregel formulieren, ist bemerkenswert; bemerkenswerter ist, woher
    sie kommt. Beide Rechtsordnungen haben keinen Verbotstatbestand für biometrische Überwachung — und
    kommen gerade deshalb zum strengeren Ergebnis. Die KI-Verordnung hat einen, und er erlaubt mehr. Das
    ist keine Paradoxie, sondern eine Folge der Regelungstechnik: Ein Verbot mit Ausnahmen setzt die Ausnahmen
    positiv, und wo eine Ausnahme steht, steht eine Erlaubnis. Art. 5 Abs. 5 KI-VO hält strengeres mitgliedstaatliches
    Recht offen — er ist aber für strengere Normen geschrieben, nicht für den Fall, dass ein Mitgliedstaat
    strenger ist, weil er schweigt — und er ist nach seinem Wortlaut auf Systeme zur biometrischen Fernidentifizierung
    beschränkt, also gerade nicht auf die nicht-biometrische Bildanalyse, um die es in Nizza ging. Ein
    Schweigen ist keine mitgliedstaatliche Regelung im Sinne dieser Vorschrift, und damit ist das französische
    und griechische Ergebnis unionsrechtlich nicht abgesichert, sondern nur solange stabil, wie kein nationales
    Gericht auf die Idee kommt, aus dem Ausnahmekatalog des Art. 5 einen Wertungsgleichlauf abzuleiten.
    Genau dieses Argument wird kommen, und es wird in Athen zuerst kommen: Άρθρο 3 ν. 5321/2026 hat seit
    dem 20.07.2026 dieselbe Behörde, die im Dezember 2025 das Fehlen der Rechtsgrundlage festgestellt
    hat, zur Marktüberwachungsbehörde für Art. 5 KI-VO gemacht. Dieselbe Stelle wendet künftig beide Maßstäbe
    an: den nationalen, nach dem ohne Ermächtigung nichts geht, und den unionsrechtlichen, nach dem vieles
    geht, wenn Verfahren und Genehmigung stimmen. Ob Art. 5 KI-VO Boden oder Decke ist, entscheidet sich
    damit nicht in Luxemburg, sondern an einem Schreibtisch in Athen. Soweit ersichtlich beschreibt das
    niemand.

    Zweitens, und das ist der praktisch wichtigste Punkt: Frankreich und die Union teilen dasselbe Feld
    entlang der entgegengesetzten Linie. Art. 10 der loi n° 2023-380 erlaubt die algorithmische Bildanalyse
    und verbietet die Biometrie. Art. 5 KI-VO verbietet die Biometrie mit Ausnahmen und sagt zur nicht-biometrischen
    Ereigniserkennung nichts — sie ist Hochrisiko nach Anhang III, mit Pflichten ab dem 02.12.2027. Die
    Nizza-Entscheidung betraf gar keine Gesichtserkennung, sondern Falschparker vor Schulen; der Conseil
    d''État knüpft nicht an „biometrisch“, sondern an „analyse systématique et automatisée des images“
    an. Er ist damit in genau der Dimension weiter, in der die KI-Verordnung am engsten ist. Umgekehrt
    zeigt Sußner an der Berliner Skelett-Erkennung, dass ein System ohne biometrische Identifizierung
    dieselben Verhaltensinferenzen erzeugt und trotzdem an Art. 5 vorbeiläuft. Die Konsequenz für die
    Praxis wird nirgends gezogen: Ein System, das von Ereigniserkennung auf Personenerkennung umgestellt
    wird, wechselt in einem einzigen Konfigurationsschritt Rechtsregime, zuständige Behörde und Prüfungsmaßstab.
    Eine Übergangsregel dafür gibt es in keiner der hier verglichenen Rechtsordnungen, und die Genehmigungspraxis
    — präfektoral in Frankreich, gar nicht anderswo — ist auf diesen Wechsel nicht eingerichtet.

    Drittens zur Bereichsausnahme, der dogmatisch reizvollsten Frage des Komplexes. Das Upper Tribunal
    hat sie für Art. 2(2)(a) UK GDPR akteursbezogen beantwortet: Die Ausnahme gilt für Staaten, nicht
    für Unternehmen, die Staaten beliefern. Für die KI-Verordnung ist dieselbe Frage bereits andersherum
    entschieden, und zwar im Wortlaut: Die Bereichsausnahme des Art. 2 Abs. 3 für nationale Sicherheit
    und Verteidigung stellt ausdrücklich auf den Zweck und nicht auf die Art der handelnden Stelle ab.
    Wenn beides zutrifft, ergibt sich für ein und denselben Anbieter, der ausschließlich ausländische
    Sicherheitsbehörden beliefert, dass er dem britischen Datenschutzrecht unterfällt und der KI-Verordnung
    nicht. Zwei aus derselben Wurzel stammende Instrumente, dasselbe Geschäftsmodell, entgegengesetzte
    Antworten — und der Grund ist keine Wertung, sondern ein halber Satz im Anwendungsbereich. Das ist
    die Lücke, durch die der gesamte Export biometrischer Systeme läuft, und sie steht in keiner Kommentierung.

    Viertens zur Durchsetzung. Der Merksatz, Europa reguliere und Amerika prozessiere, ist an diesem Material
    nachweisbar falsch. Fünf Rechtsordnungen haben Clearview belangt — Griechenland, das Vereinigte Königreich,
    Australien, Kanada und die Vereinigten Staaten; gezahlt hat das Unternehmen nirgends. Die britische
    Geldbuße ist bis heute nicht vollstreckt, die OAIC hat den Verzicht am 21.08.2024 ausdrücklich erklärt,
    und die französische Parallelentscheidung ist auf cnil.fr nicht mehr abrufbar. Das einzige Verfahren,
    in dem wirtschaftlich etwas geschah, war eine amerikanische Sammelklage — und ihr Ergebnis wurde vom
    Seventh Circuit aus einem Grund aufgehoben, der mit Biometrie nichts zu tun hat, nämlich der Zusammensetzung
    der Gruppenvertreter nach Fed. R. Civ. P. 23(a)(4). Die Rechtsdurchsetzung gegen den weltweit am häufigsten
    verurteilten Anbieter von Gesichtserkennung hängt damit vollständig am amerikanischen Zivilprozessrecht,
    und der Gesetzgeber von Illinois hat ihr mit dem Public Act 103-0769 rückwirkend die Wucht genommen.
    Wer das BIPA als Vorbild für eine europäische Sanktionierung biometrischer Systeme empfiehlt, empfiehlt
    ein Instrument, das genau in dem Moment entschärft wurde, in dem es zu wirken begann.

    Fünftens, und das ist der Befund, den ich für den belastbarsten halte: In jedem einzelnen Fall dieses
    Bestands, in dem eine Behörde ein System beschafft hat, war das System gekauft, vertraglich gebunden
    und im Pilotbetrieb, bevor die Rechtsgrundlage geprüft wurde. Griechenland — das System war beschafft
    und in der Pilotphase, die Behörde konnte nur noch verwarnen. Bayern — VeRA 2022 über einen Rahmenvertrag
    beschafft, Art. 61a BayPAG erst nach dem hessenDATA-Urteil. Nordrhein-Westfalen — Palantir seit 2019,
    gesetzliche Grundlage seit 2022. Nizza — das System lief, die CNIL äußerte sich danach. Art. 35 DSGVO
    und Art. 27 der Richtlinie (EU) 2016/680 verlangen die Folgenabschätzung „vor“ der Verarbeitung; in
    der Praxis der Sicherheitsbehörden ist sie das letzte Dokument. Daraus folgt eine institutionelle
    und keine dogmatische Einsicht: Die Erlaubnisfrage wird faktisch vom Beschaffungskalender entschieden,
    weil eine Aufsicht, die erst nach der Inbetriebnahme prüft, nur noch zwischen Verwarnung und Eskalation
    wählen kann. Genau ein Instrument in diesem gesamten Vergleich verhindert das, und es steht in Frankreich:
    die präfektorale Einzelgenehmigung nach Art. 10 loi n° 2023-380 und, seit August 2026, die CNIL-Genehmigung
    für den Einzelhandel. Frankreich ist die einzige Rechtsordnung dieses Vergleichs, in der die Erlaubnisfrage
    entschieden werden muss, bevor die Anlage läuft. Das wird regelmäßig als besonders freizügig beschrieben,
    weil Frankreich als einziger Mitgliedstaat den Einsatz positiv gestattet. Der Vorwurf trifft die falsche
    Stelle: Nicht die Erlaubnis ist das Bemerkenswerte, sondern ihr Zeitpunkt.

    '
