  - position: Das System selbst ist verfassungswidrig, weil die gesetzlich vorgesehenen Kontrollorgane
      nie eingerichtet wurden
    gericht: Juzgado de Primera Instancia en lo Contencioso Administrativo y Tributario N.º 4 de la Ciudad
      Autónoma de Buenos Aires (Jueza Elena Amanda Liberatori), 07.09.2022 – EXP 182908/2020-0
    begruendung: 'Die einzige Entscheidung weltweit, die ein laufendes städtisches Gesichtserkennungssystem
      stillgelegt hat, bevor eine KI-Verordnung existierte. Tragend war nicht die Technologie, sondern
      die Art ihrer Einführung: Inbetriebnahme ohne Beteiligung der Legislatur und der Defensoría del
      Pueblo, ohne Datenschutz-Folgenabschätzung und ohne funktionierende gesetzliche Kontrollmechanismen;
      fehlerhafte Datenbestände; und statt der Abfrage allein des Fahndungsbestandes CONARC die Verarbeitung
      von Daten mehr als 15.000 Personen außerhalb dieses Bestandes. Die dogmatische Pointe liegt im Verhältnis
      von Ermächtigung und Vollzug: Die Ley 6339 hatte das System gesetzlich vorgesehen, aber an Kontrollorgane
      gebunden, die nie eingerichtet wurden — das Gericht behandelt eine gesetzliche Ermächtigung, deren
      Sicherungen nicht funktionieren, wie eine fehlende Ermächtigung. Das ist die schärfere Variante
      des Verbots durch Schweigen und der beste Vergleichsmaßstab für das, was Art. 5 KI-VO als Genehmigungsvorbehalt,
      Folgenabschätzung und Registrierungspflicht ausbuchstabiert.

      '
