- id: algorithmische-verwaltung-transparenz
  titel: Transparenz automatisierter Verwaltungsentscheidungen
  frage: 'Worauf hat der Betroffene einer automatisierten Verwaltungs- oder Bewertungsentscheidung Anspruch
    — auf die Logik, auf die Parameter oder auf den Quellcode?

    '
  jurisdiktionen:
