  - position: Die maschinelle Auswertung allein trägt die Feststellung nicht
    gericht: Russische Rechtsprechung, 26.01.2024
    begruendung: Eine Ordnungswidrigkeit darf nicht allein aufgrund der Auswertung durch ein neuronales
      Netz festgestellt werden. Das ist die strengste Position des Feldes und stammt aus einer Rechtsordnung,
      die man dabei nicht zuerst vermutet.
