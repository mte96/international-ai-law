  titel: Die Ausnahme von der Hochrisiko-Einstufung nach Art. 6 Abs. 3 KI-VO
  frage: 'Wann ist ein in Anhang III genanntes System doch kein Hochrisiko-KI-System, weil es kein erhebliches
