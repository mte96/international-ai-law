  aufloesung: 'Eine Klärung durch ein Rechtsmittelgericht ist bis Ende 2027 nicht zu erwarten; der Vergleich
    vom 07.01.2026 hat genau das verhindert. Die nächsten Weichenstellungen sind deshalb keine Urteile.
    Erstens der Abschlussbericht der FTC-6(b)-Untersuchung, der die Tatsachengrundlage aller Verfahren
    liefert. Zweitens die Frage, ob der Garante das gegen Character.AI angeordnete Altersverifikationssystem
    nach Ablauf der 120-Tage-Frist als genügend ansieht — das wäre der erste europäische Maßstab dafür,
    was Altersverifikation technisch heißt. Drittens die kalifornischen Nachfolgevorhaben und der GUARD
    Act, die beide die Verifikationslücke schließen sollen. Viertens, und praktisch am schnellsten wirksam:
    die ersten Vollzugsmaßnahmen nach den chinesischen Maßnahmen, die zum Recherchestichtag noch nicht
    dokumentiert sind. Materiell entschieden wird die Frage voraussichtlich in JCCP 5431 vor dem Superior
    Court in San Francisco, dessen Entscheidungen über den California Court of Appeal Bindungswirkung
    erlangen können, die ein District Court in Florida nie hatte.

