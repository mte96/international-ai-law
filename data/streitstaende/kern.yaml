  - position: Prozessuale Vernichtung statt Sanktion der Person — und das eigene Regime der nicht vertretenen
      Partei
    gericht: D. Minn. (Provinzino J), Kohls v. Ellison, 10.01.2025; Superior Court of California (Alameda
      County), Mendones v. Cushman & Wakefield, 09.09.2025; Missouri Court of Appeals, Kruse v. Karlen,
      13.02.2024; Sammellinie der US-Gerichte zu nicht vertretenen Parteien, Stand 27.08.2026; Family
      Court (England and Wales), [2026] EWFC 22 (B)
    begruendung: 'Wo die Person nicht sanktionierbar oder die Geldsanktion unzureichend erscheint, greifen
      die Gerichte den Vortrag selbst an. Kohls schloss die Erklärung eines Sachverständigen — ausgerechnet
      eines Fachmanns für Fehlinformation, in einem Verfahren über ein Deepfake-Gesetz — insgesamt aus,
      weil drei mit GPT-4o erzeugte, nicht existierende wissenschaftliche Nachweise seine Glaubwürdigkeit
      zerstört hätten. Mendones betrifft nicht Fundstellen, sondern Beweismittel: fünf mit KI erzeugte
      oder wesentlich veränderte Videos, Fotografien und Nachrichtenverläufe samt Metadaten; die Sanktion
      sprang sofort auf die Höchststufe — Streichung der Klage und Abweisung mit Rechtskraftwirkung —,
      von einer Geldsanktion sah das Gericht ausdrücklich ab. Gegenüber nicht vertretenen Parteien wird
      der Maßstab nicht abgesenkt — die Selbstvertretung "does not permit him to submit information blindly"
      —, die Rechtsfolge dagegen schon: Regelfall ist die Verwarnung, City of Dickinson v. Helgeson endete
      bei 500 USD trotz fünfzehn erfundener Entscheidungen, Sebastian Rako v. VMware bei der Auflage,
      jeder Fundstelle die Fußnote "Located through AI; Checked" beizufügen. Die Spitzenwerte fallen gleichwohl
      gegen Laien: Kruse v. Karlen sprach 2024 wegen mutwilliger Berufung 10.000 USD zu, mehr als das
      Doppelte der Anwaltssanktion in Mata, obwohl die Schriftsätze von einem im Internet gefundenen "Consultant"
      erstellt worden waren, der unbelangt blieb. Von 31 Zufallseinträgen der Datenbank betrafen 22 nicht
      vertretene Parteien, 8 Anwälte und 1 einen Sachverständigen.

      '
