    gericht: Volksgericht des Bezirks Jiading, Shanghai, (2024) 沪0114民初1326号
    begruendung: 'Der Betroffene war Darsteller in dreizehn eigenen Kurzvideos, in die ein Mini-Programm
      per Gesichtstausch die Gesichter seiner Nutzer einsetzte. Geschützt wurde er nicht über das Recht
      am eigenen Bild, sondern über das Recht der öffentlichen Zugänglichmachung an den Videos: Ersetzt
      werden nur die Gesichtszüge, Szenen und Bewegungen bleiben im Wesentlichen identisch. Die Einwände
      der Schranken und der Technologieneutralität wurden zurückgewiesen, weil der Anbieter über Werbung
      und Mitgliedschaften Gewinn erzielte; ihn treffe eine angemessene Sorgfaltspflicht. Der Oberste
      Volksgerichtshof hat den Fall in seine typischen Fälle des Jahres 2024 aufgenommen — faktische Leitwirkung
      ohne Bindung.

