  - position: Privates Klagerecht mit beziffertem Schaden — und seine Entkernung
    gericht: N.D. Ill. (MDL No. 2967) und United States Court of Appeals for the Seventh Circuit; W.D.
      Wash. und N.D. Cal. (Vance); Seventh Circuit (Clay v. Union Pacific)
    begruendung: 'Illinois ist der einzige Ort dieses Vergleichs mit einem privaten Klagerecht und pauschaliertem
      Schadensersatz — 1.000 US-Dollar bei Fahrlässigkeit, 5.000 bei Vorsatz, zuzüglich Anwaltskosten.
      Genau deshalb ist es auch der einzige Ort, an dem gegen Clearview wirtschaftlich etwas geschehen
      ist: ein Vergleich mit einem Nennwert von rund 51,75 Mio. US-Dollar, gezahlt nicht in Geld, sondern
      in 23 Prozent Eigenkapital an der Beklagten. Zwei Schranken begrenzen das Modell. Territorial: Das
      BIPA setzt voraus, dass die beanstandeten Handlungen „primarily and substantially in Illinois“ stattfinden;
      der Wohnsitz der Betroffenen genügt nicht. Amazon, Microsoft und Google sind deshalb im Komplex
      um den IBM-Datensatz „Diversity in Faces“ freigekommen — genau umgekehrt zu Art. 3 Abs. 2 DSGVO,
      der auf den Aufenthalt der betroffenen Person abstellt. Quantitativ: Der Seventh Circuit hat am
      01.04.2026 entschieden, dass die Haftungsbegrenzung des Public Act 103-0769 vom 02.08.2024 — eine
      einzige Zuerkennung je Person statt einer je Scan — rückwirkend auch für anhängige Verfahren gilt.
      Der Vergleich selbst wurde am 13.07.2026 aufgehoben, allerdings aus einem prozessualen Grund: Keiner
      der acht Gruppenvertreter gehörte allein der bundesweiten Untergruppe an, die die geringste Zuteilung
      erhielt; an der Eigenkapitalstruktur als solcher nahm das Gericht keinen Anstoß.

      '
