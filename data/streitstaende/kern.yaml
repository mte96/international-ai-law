  - position: Die Halluzination ist kein Fehler, sondern eine Eigenschaft
    stelle: Kalai/Vempala; Lidsky/Daves; Ulfbeck
    begruendung: 'Für Tatsachen, die im Trainingsmaterial nur einmal vorkommen, hat ein kalibriertes Sprachmodell
      eine untere Schranke für die Rate erfundener Aussagen; Halluzination ist insoweit statistisch erzwungen
      und nicht behebbar. Daraus folgt zweierlei: Sie taugt nicht als Indiz für Fahrlässigkeit, und ein
      Produkt, das erwartungsgemäß halluziniert, bietet nicht weniger Sicherheit, als die Allgemeinheit
      zu erwarten berechtigt ist. Ulfbeck fügt hinzu, dass der Fehlerbegriff auf einen Zustand im Zeitpunkt
      des Inverkehrbringens zugeschnitten ist, lernende Systeme ihren Zustand aber danach ändern.

      '
