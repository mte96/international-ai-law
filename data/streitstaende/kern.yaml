  - position: Höchstrichterliche Klarstellung statt Sondergesetz — das Bildnis in jeder Form, auch der
      künstlich erzeugten
    gericht: Пленум Верховного суда Республики Узбекистан — Plenum des Obersten Gerichts der Republik
      Usbekistan, Postановление № 21 vom 24.11.2025 (Schutz persönlicher Nichtvermögensrechte und anderer
      immaterieller Güter)
    begruendung: 'Ein eigenes Instrument, das die übrigen Positionen nicht abbilden: keine Gesetzgebung
      und keine Einzelfallentscheidung, sondern eine für die Instanzgerichte verbindliche Auslegungsanweisung
      des Obersten Gerichts. Sie erstreckt den Schutz des Bildnisses ausdrücklich auf jede Form einschließlich
      des „künstlich erzeugten Bildes" und behandelt die „digitale Bearbeitung des Bildes, die zur Verfälschung
      des ursprünglichen Erscheinungsbildes führt", ausdrücklich als Verletzung des Persönlichkeitsrechts;
      Erstellung, Nutzung, Vervielfältigung und Verbreitung sind nur mit Einwilligung zulässig. Der Vorteil
      gegenüber der Position des allgemeinen Persönlichkeitsrechts liegt in der Geschwindigkeit: Was in
      Dänemark, Spanien und den Vereinigten Staaten seit Jahren als Gesetzgebungsvorhaben feststeckt,
      ist hier durch eine Auslegungsanweisung binnen eines Verfahrensschritts erledigt — ohne Definition
      der künstlichen Intelligenz, ohne Kennzeichnungspflicht und ohne Ausnahme für Satire und Kritik.
      Genau das ist zugleich die Schwäche: Die Meinungsfreiheitsgrenze, die der Delhi High Court 2026
      gezogen hat, fehlt.

      '
