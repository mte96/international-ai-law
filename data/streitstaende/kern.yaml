  unterfragen:
  - frage: Wirkt der Schutz über den Tod hinaus?
    ja: Dänemark, 50 Jahre nach dem Todesjahr; NO FAKES Act als vererbliches Recht
    nein: die Straf- und Würdeschutzmodelle kennen keine postmortale Verlängerung; das deutsche allgemeine
      Persönlichkeitsrecht schützt ideelle Bestandteile nur begrenzt fort
  - frage: Ist das Recht übertragbar und lizenzierbar?
    ja: Dänemark über die Verweisung des § 65 a stk. 3 auf die Vertrags- und Verwertungsgesellschaftsvorschriften;
      NO FAKES Act mit Lizenzgrenzen
    nein: Straf- und Würdeschutzmodelle kennen keine Übertragung, nur Einwilligung
  - frage: Entlastet die Kennzeichnung?
    ja: Frankreich, Art. 226-8 c. pén.
    nein: Frankreich bei sexuellen Inhalten (Art. 226-8-1), Italien (Art. 612-quater c. p.), Spanien (Art.
      173 bis CP-E)
  - frage: Erfasst das Regime die Herstellung oder nur die Verbreitung?
    ja: 'Herstellung: Art. 5 Abs. 1 lit. ba und bb KI-VO ab 02.12.2026, aber nur für NCII und CSAM'
    nein: 'nur Verbreitung: Dänemark, Frankreich, Italien, Spanien — kritisiert von Crone'
  aufloesung: 'Konvergenz ist nicht in Sicht, die Weichen werden aber in den nächsten zwölf Monaten gestellt.
    Der dänische Entwurf stand auf dem lovprogram des Folketingsjahres 2025/26 und sollte Anfang 2026
    eingebracht werden; er ist es nie worden, obwohl die Stillhaltefrist der TRIS-Notifizierung 2025/0654/DK
    am 03.02.2026 ohne Verlängerung ablief. Widerstand kam von VideoGamesEurope, das eine Parallelregelung
    neben DSGVO und DSA und eine zu weite Definition rügt, sowie von der Denkfabrik Justitia, die die
    Rückausnahme für Desinformation als Eingriff in Satire und Machtkritik angreift. Der NO FAKES Act
    (S. 4591) hat im Juni 2026 den Senate Judiciary Committee passiert. Das spanische Vorhaben ruht seit
    Dezember 2025 trotz Dringlichkeitsverfahren. Die Konvergenz wird deshalb nicht von einem Gesetzgeber
    kommen, sondern von der Frage, ob Art. 50 KI-VO die Kennzeichnung abschließend harmonisiert — dann
    steht die französische Konstruktion, die die Kennzeichnung zum Strafbarkeitsmerkmal macht, unter Rechtfertigungsdruck.

    '
  eigene_bewertung: 'Am dänischen Modell wird die Schutzdauer von 50 Jahren post mortem kritisiert. Das
    ist das kleinere Problem. Das größere steht in § 65 a stk. 3: Der Entwurf erklärt einen langen Katalog
    von Vertrags-, Schranken- und Verwertungsgesellschaftsvorschriften der ophavsretslov für entsprechend
    anwendbar. Damit wird das Abbild einer Person zu einem Gegenstand, der kollektiv verwaltet und lizenziert
    werden kann. Ein Recht, das kollektiv verwertbar ist, ist ein Recht, das ohne individuelle Verhandlung
    eingeräumt werden kann — und genau das darf ein Persönlichkeitsrecht nicht sein. Dänemark löst damit
    sein Durchsetzungsproblem, weil eine funktionierende Rechteclearing-Infrastruktur bereitsteht, und
    schafft zugleich einen Markt für das, was es schützen will. Erben könnten lizenzieren, wozu die lebende
    Person nur einwilligen konnte. Der zweite, nirgends gezogene Befund betrifft Frankreich: Art. 226-8
    c. pén. macht die Kennzeichnung zum Rechtfertigungsgrund, Art. 50 Abs. 4 KI-VO macht sie zur Pflicht.
    Dieselbe Handlung ist in Paris die Verteidigung und in Brüssel die Obliegenheit. Wer in Frankreich
    nicht kennzeichnet, begeht damit für dasselbe Verhalten sowohl einen Verstoß gegen die Verordnung
    als auch eine Straftat — und die Strafnorm hat die niedrigere Schwelle, weil sie keine Aufsichtsbehörde
    voraussetzt. Art. 50 Abs. 4 KI-VO, allgemein als weiche Transparenzpflicht beschrieben, wirkt in Frankreich
    faktisch als Blankettstrafnorm. Drittens, gegen die eigene Zunft: Wer dem dänischen Urheberrechtsmodell
    die Kommerzialisierung der Persönlichkeit vorwirft, sollte das Urteil des LG Berlin II lesen. Der
    Schaden wurde dort als fiktive Lizenzgebühr berechnet — 2.000 Euro je Video, also so, als hätte die
    Betroffene ihre Stimme verkaufen können. Das deutsche Schadensrecht behandelt das Persönlichkeitsmerkmal
    längst als Vermögenswert. Der Streit über das richtige Regime ist deshalb weniger ein Streit über
    die Rechtsnatur als darüber, ob man sie offen ausspricht.

    '
