  - position: Wer den Staat beliefert, ist noch nicht der Staat — die Bereichsausnahme
    gericht: Upper Tribunal (Administrative Appeals Chamber), 08.10.2025 – [2025] UKUT 319 (AAC), gegen
      First-tier Tribunal (GRC), 17.10.2023 – [2023] UKFTT 819 (GRC)
    begruendung: 'Die praktisch schärfste Frage des gesamten Komplexes, und sie ist offen. Das First-tier
      Tribunal hatte die Bescheide des ICO 2023 aufgehoben: Die Verarbeitung sei zwar eine Verhaltensbeobachtung
      im Sinne des Art. 3(2)(b) UK GDPR, falle aber nach Art. 2(2)(a) aus dem sachlichen Anwendungsbereich,
      weil sie im Rahmen von Tätigkeiten erfolge, die der nationalen Sicherheit und Strafverfolgung ausländischer
      Staaten dienten; der ICO sei unzuständig. Das Upper Tribunal hat das 2025 als „material error of
      law“ verworfen: Die Bereichsausnahme gelte für staatliche Tätigkeiten, nicht für ein privates Unternehmen,
      das Dienste an Staaten verkauft. Art. 3(2)(b) sei zugleich weit zu lesen — erfasst ist jeder Verantwortliche,
      dessen Verarbeitung mit einer Verhaltensbeobachtung im Vereinigten Königreich in Zusammenhang steht.
      Die Sache liegt seither doppelt: materiell beim First-tier Tribunal zur Sachentscheidung über Bußgeld
      und Enforcement Notice, zugleich ist die Zuständigkeitsfrage beim Court of Appeal, zu dem das Upper
      Tribunal die weitere Berufung Clearviews am 19.12.2025 zugelassen hat. Ein Termin ist nicht veröffentlicht.

      '
