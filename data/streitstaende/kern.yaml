  - position: Weder Schranke noch Verbot, sondern Vergütung
    stelle: 'Indien, DPIIT, "Working Paper on Generative Artificial Intelligence and Copyright, Part I"
      vom 08.12.2025; Brasilien, PL 2338/2023 in der vom Senat beschlossenen Fassung

      '
    begruendung: 'Die einzige Antwort, die weder mit einer Schranke noch mit einem Verbot arbeitet. Das
      indische Handelsministerium verwirft in seinem Arbeitspapier ausdrücklich alle drei üblichen Wege
      — eine TDM-Schranke (sie unterminiere den Schutz), die Direktlizenzierung (praktisch undurchführbar)
      und die kollektive Lizenzierung (unzureichend) — und empfiehlt stattdessen ein "Hybrid Model": eine
      gesetzliche Pauschallizenz mit Vergütungsanspruch, verwaltet durch eine staatlich benannte Verwertungsstelle,
      bemessen als fester Anteil an den Erlösen kommerzialisierter KI-Systeme. Brasilien verfolgt denselben
      Gedanken im Senatstext des PL 2338. Bemerkenswert ist die Richtung: Indiens Exekutive empfiehlt
      die Vergütung in demselben Jahr, in dem Indiens Judikative die Schranke bejaht. Bemessungsgrundlage
      ist in beiden Entwürfen der Erlös des Systems, nicht die Zahl der genutzten Werke — eine Abgabenlogik,
      keine Lizenzlogik.

      '
