  - position: Aussetzung des Verfahrens schon beim Verdacht
    gericht: Labour Court of South Africa, Durban (K Allen-Yaman J), 13.07.2026 — Molawa u.a. gegen Matjhabeng
      Local Municipality
    begruendung: 'Der Verdacht allein, dass der Vorsitzende eines Disziplinarverfahrens seine Feststellungen
      auf KI-erzeugte, nicht existente Fundstellen gestützt hat, rechtfertigt die Aussetzung des laufenden
      Verfahrens bis zur Entscheidung über den Überprüfungsantrag — obwohl Gerichte in unabgeschlossene
      Disziplinarverfahren nur zurückhaltend eingreifen (Ziff. 22). Blindes Vertrauen auf einen KI-Assistenten
      sei von südafrikanischen und anderen Gerichten bereits als unannehmbar bezeichnet worden (Ziff.
      28); das Gericht verweist auf Mavundla und Northbound Processing, in denen jeweils an das Legal
      Practice Council abgegeben wurde (Ziff. 30), sowie auf Ayinde und Al-Haroun [2025] EWHC 1383 (Ziff.
      31). Damit steht neben der Frage, was mit der fertigen Entscheidung geschieht, eine zweite: was
      mit dem Verfahren geschieht, solange der Verdacht im Raum steht.'
