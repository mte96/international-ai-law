- id: biometrische-ueberwachung-erlaubnisgrundlage
  titel: Gesichtserkennung im öffentlichen Raum — Verbot mit Ausnahme oder Verbot durch Schweigen?
  frage: 'Woraus folgt, ob eine Stelle Bilder aus dem öffentlichen Raum algorithmisch auswerten und Personen
    biometrisch erkennen darf — aus einem Verbotstatbestand mit Ausnahmekatalog, aus einer ausdrücklichen
    Erlaubnisnorm, oder daraus, dass das Fachgesetz schweigt?

    '
