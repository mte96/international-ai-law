  aufloesung: 'Aufgelöst wird das nicht — die Antworten folgen aus der Verfassung

    der jeweiligen Rechtsordnung, nicht aus dem Stand der Technik. Für

    die Datenbasis ist gerade das der Ertrag: Hier lässt sich zeigen,

    dass dieselbe Tat in zwei Demokratien entgegengesetzt behandelt wird,

    ohne dass eine von beiden nachlässig wäre.


    Was sich beobachten lässt: ob die kalifornische Entscheidung in der

    Berufung Bestand hat, und ob die Kennzeichnungspflicht des Art. 50

    Abs. 4 KI-VO in Europa denselben Angriff auslöst. Die europäische

    Regelung ist milder — sie verlangt Offenlegung statt Verbot — und

    wäre nach dem Maßstab von Kohls vermutlich haltbar.

