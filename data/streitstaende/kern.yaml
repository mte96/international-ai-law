  - position: Doch Fehler — aber am Herstellerverhalten, nicht am Modellverhalten
    stelle: Geistfeld; Sharkey; Brown
    begruendung: 'Der Konstruktionsfehlerbegriff ist auf die Trainings-, Test- und Absicherungsentscheidungen
      des Herstellers zu beziehen, nicht auf das einzelne Modellverhalten. Produkthaftung ist der richtige
      Rahmen, weil sie anders als das Fahrlässigkeitsrecht die Informationsasymmetrie institutionell berücksichtigt;
      für Chatbots hat sie zusätzlich den Vorzug, die Redefreiheitsfrage zu umgehen und den Anbieter an
      seinen Konstruktions- und Warnentscheidungen zu messen.

      '
