  - position: Vertragsrecht — wer eine Einzelfallprüfung zugesagt hat, haftet für ihre Automatisierung
    gericht: D. Minn. (Lokken ./. UnitedHealth) und E.D. Cal. (Kisting-Leung ./. Cigna); ferner Arbitragegericht
      des Moskauer Gebiets
    begruendung: 'Wo dem amerikanischen Recht die datenschutzrechtliche Kategorie fehlt, übernimmt das
      Vertragsrecht ihre Funktion. In Lokken sind fünf Anspruchsgründe an der bundesrechtlichen Verdrängung
      gescheitert, die vertraglichen Ansprüche und der Anspruch aus Treu und Glauben aber nicht: Wer eine
      Leistungszusage gegeben hat, entzieht sich ihr nicht dadurch, dass er die Prüfung einem Prognosealgorithmus
      überlässt, dessen Ablehnungen im Widerspruchsverfahren zu rund neunzig Prozent aufgehoben werden,
      während nur zwei Promille überhaupt widersprechen. Kisting-Leung greift nicht die Prognosequalität
      an, sondern die Behauptung, es habe eine ärztliche Prüfung stattgefunden — bei über 300.000 Ablehnungen
      und einer durchschnittlichen Prüfzeit von 1,2 Sekunden. Das russische Arbitragegericht formuliert
      denselben Gedanken als Obliegenheit: Redliche Geschäftstätigkeit erfordert eine manuelle Prüfung
      und nicht bloß Automatenentscheidungen. In allen drei Fällen ist der Anknüpfungspunkt nicht die
      fehlerhafte Ausgabe, sondern die als Fassade geführte menschliche Aufsicht.

      '
