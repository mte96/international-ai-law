  - position: Berufsrechtliche statt verfahrensrechtliche Folge
    gericht: High Court of South Africa, Gauteng Division Johannesburg (Opperman J), 31.07.2026 — F.J.L
      v T.G.O
    begruendung: 'Das Rechtsmittelgericht lehnt es ausdrücklich ab, sich auf die KI-Frage einzulassen
      (Ziff. 18), hält die angefochtene Entscheidung im Ergebnis für richtig und zieht die Folge dennoch
      — nur an anderer Stelle. Es misst das Verhalten des erkennenden acting judge am Code of Judicial
      Conduct: Art. 4(a) Integrität und Art. 5(1) ehrenhaftes Verhalten sind berührt, weil die Aufnahme
      ungeprüfter, erfundener Fundstellen in ein Urteil damit unvereinbar ist, auch ohne Vorsatz (Ziff.
      119). Weil die Judicial Service Commission über einen acting judge nach Ablauf der Bestellung keine
      Zuständigkeit hat — nach dem First Certification Judgment bewusste Verfassungsgestaltung, kein Versehen
      (Ziff. 121) —, leitet das Gericht das Urteil dem Legal Practice Council als Beschwerde zu, ausdrücklich
      ohne eigene Feststellungen (Ziff. 122). Das ist ein dritter Weg neben Nichtigkeit und bloßer Rüge,
      und er legt zugleich eine Rechenschaftslücke offen.'
