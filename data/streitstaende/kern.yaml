  stand: 'Zwei Rechtsordnungen, zwei entgegengesetzte Antworten, beide aus dem

    Jahr 2026 und beide getragen von einer ernsthaften Begründung.


    Israel: Der Vorsitzende des Zentralen Wahlausschusses hat binnen

    zwölf Tagen zweimal entschieden — am 26.07.2026 gegen ein

    Wahlwerbevideo, das mit generativer KI eine nie stattgefundene

    Begegnung darstellt, und am 06.08.2026 gegen die digitale Erzeugung

    von Bildern uniformierter Soldaten für Wahlwerbung. Beide

    Entscheidungen sind rechtskräftig.


    Vereinigte Staaten: Der Eastern District of California hat am

    29.08.2025 in Kohls gegen Bonta die kalifornische Regelung über

    "materiell täuschende" KI-Wahlkampfinhalte am First Amendment

    scheitern lassen.


    Der Gegensatz ist kein Zufall, sondern folgt aus der Bauart der

    Rechtsordnungen: Israel entscheidet durch ein Wahlorgan mit

    Vorabkontrolle im laufenden Wahlkampf, die Vereinigten Staaten durch

    ein Gericht in der abstrakten Normenkontrolle gegen ein Gesetz.

    '
  positionen:
  - position: Das Verbot ist zulässig und wird im Wahlkampf durchgesetzt
    gericht: Vorsitzender des Zentralen Wahlausschusses Israels, 26.07.2026 (תב"כ 73/26) und 06.08.2026
      (תב"כ 87/26)
    begruendung: Die Darstellung einer nie stattgefundenen Begegnung durch generative KI ist unzulässige
      Wahlwerbung; ebenso die digitale Erzeugung von Bildern uniformierter Soldaten, weil sie öffentliche
      Autorität für parteiliche Zwecke vereinnahmt. Der Maßstab ist nicht die Täuschung über eine Tatsache
      allein, sondern die Vereinnahmung dessen, was dem Staat gehört.
    urteile:
    - il-2026-tbk-73-26-deepfake-wahlvideo
    - il-2026-tbk-87-26-likud-eisenkot
  - position: Das Verbot verfehlt das First Amendment
    gericht: United States District Court, Eastern District of California, 29.08.2025
    begruendung: 'Eine Regelung, die "materiell täuschende" KI-erzeugte Wahlkampfinhalte verbietet, greift
      in politische Rede ein — den am stärksten geschützten Bereich — und hält der Prüfung nicht stand.
      Der Gegenentwurf ist nicht die Zulassung der Täuschung, sondern die Gegenrede: Wer täuscht, soll
      widerlegt und nicht verboten werden.'
    urteile:
