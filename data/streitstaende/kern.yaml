  - position: Informationsfreiheitsrecht — der Quellcode, und zwar für jedermann
    gericht: Tribunal Supremo, Sala de lo Contencioso-Administrativo, Sentencia 1119/2025 vom 11.09.2025
      (BOSCO)
    begruendung: 'Der Quellcode eines Systems, das automatisiert über Rechte von Bürgern befindet, ist
      Teil der Entscheidungslogik und damit ein Verwaltungsdokument. Art. 157 Abs. 2 Ley 40/2015, der
      die Verwaltungen zur Bereitstellung ihrer Anwendungen an andere Verwaltungen verpflichtet, belegt,
      dass der Code vorhanden, dokumentiert und übertragbar ist. Der Einwand des Urheberrechts an der
      Software kann die Transparenzpflicht nicht ausschalten, soweit es um die Entscheidungslogik geht;
      der Einwand der öffentlichen Sicherheit greift nur nach konkreter Abwägung. Klägerin war eine Stiftung,
      keine Betroffene.

      '
    urteile:
    - es-2025-bosco
  - position: Verwaltungsrecht — der Algorithmus ist Bestandteil des Verwaltungsakts
    gericht: Consiglio di Stato, Sezione VI, n. 2270 vom 08.04.2019 und n. 8472 vom 13.12.2019 (nebst
      nn. 8473, 8474); fortgeführt Sez. VI n. 881 vom 04.02.2020
    begruendung: 'Der Einsatz eines Algorithmus im Massenverfahren ist zulässig und im Grundsatz begrüßenswert,
      entbindet die Verwaltung aber nicht von den Regeln des Verwaltungsverfahrens. Es gelten drei Grundsätze:
      conoscibilità — der Algorithmus muss in allen seinen Bestandteilen erkennbar und verständlich sein,
      auch für den Richter; non esclusività della decisione algoritmica — es muss ein Mensch im Verfahren
      geben, der kontrolliert, validiert oder verwirft; non discriminazione algoritmica — die Verwaltung
      muss zuverlässige Systeme verwenden, Verzerrungen minimieren und regelmäßig überprüfen. Ergänzend
      unterscheidet Cons. Stato Sez. III n. 7891 vom 25.11.2021 zwischen dem algoritmo, der mit vorgegebenen
      Parametern arbeitet, und der intelligenza artificiale, die über Verfahren des maschinellen Lernens
      fortlaufend neue Inferenzkriterien zwischen Daten bildet — ohne aus dieser Unterscheidung die Folge
      für die conoscibilità zu ziehen.

      '
    urteile:
    - it-2019-cds-2270-buonascuola
    - it-2019-cds-8472-buonascuola
    - it-2021-cass-mevaluate
    belege:
    - Consiglio di Stato, Sez. III, sentenza n. 7891 del 25 novembre 2021 — nicht am amtlichen Text verifiziert
  - position: Verfassungsrecht — Architekturverbot statt Auskunftsanspruch
    gericht: Conseil constitutionnel, Décision n° 2018-765 DC vom 12.06.2018; ergänzend n° 2020-834 QPC
      vom 03.04.2020 und Conseil d'État n° 427916 vom 12.06.2019
    begruendung: 'Die vollständig automatisierte Verwaltungsentscheidung ist nur unter drei kumulativen
      Bedingungen verfassungskonform: ausdrücklicher Hinweis auf die algorithmische Grundlage mit Mitteilung
      der wesentlichen Umsetzungsmerkmale auf Verlangen, offenstehender Verwaltungsrechtsbehelf, Ausschluss
      besonderer Datenkategorien. Zentral und wörtlich: Es dürfen keine Algorithmen verwendet werden,
      die „susceptibles de réviser eux-mêmes les règles qu''ils appliquent, sans le contrôle et la validation
      du responsable du traitement“ sind. Die Erklärbarkeit ist damit nicht als Betroffenenrecht formuliert,
      sondern als Zulässigkeitsvoraussetzung: Wer nicht erklären kann, darf nicht einsetzen. Der Conseil
      d''État hat den Zugang Dritter zu den lokalen Algorithmen der Hochschulzulassung verneint; der Conseil
      constitutionnel hat diese Lücke zehn Monate später über einen Auslegungsvorbehalt geschlossen —
      nachträgliche Veröffentlichung der Kriterien unter Angabe des Algorithmuseinsatzes.

      '
    urteile:
    - fr-2018-cc-765dc
    - fr-2020-cc-834qpc
    - fr-2019-ce-unef-parcoursup
  - position: Menschenrechtsschutz — Systemverbot mangels Nachprüfbarkeit
    gericht: Rechtbank Den Haag, Urt. v. 05.02.2020, ECLI:NL:RBDHA:2020:865 (SyRI)
    begruendung: 'Die niederländische Regelung zur Aufdeckung von Sozialbetrug verstößt gegen Art. 8 EMRK,
      weil das Risikomodell nicht transparent und nicht nachprüfbar war und deshalb die Verhältnismäßigkeitsprüfung
      nicht möglich blieb. Der Rechtssatz ist schmal, die Signalwirkung erheblich: Nicht der einzelne
      Betroffene erhält Auskunft, sondern das System wird als solches untersagt.

      '
    belege:
    - 2021-vanbekkum-borgesius-syri
