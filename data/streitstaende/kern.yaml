  stand: 'Der Streit ist keiner über die Auslegung einer Norm, sondern über die Wahl des Rechtsgebiets
    — und diese Wahl entscheidet über Adressat, Beweislast, Sanktionshöhe und darüber, ob überhaupt eine
    Altersverifikation geschuldet ist. Sechs Wege sind zwischen 2024 und 2026 entstanden und keiner verdrängt
    die anderen. Innerhalb von fünfzehn Monaten hat dieselbe Konstellation vier verschiedene Behörden
    und Gerichtszweige beschäftigt: die italienische Datenschutzaufsicht mit zwei Bußgeldern (Replika
    10.04.2025, Character.AI 03.07.2026), zwei amerikanische Generalstaatsanwälte mit Verbraucherschutzklagen
    (Kentucky 15.01.2026, Florida 01.06.2026), das Berufsaufsichtsrecht Pennsylvanias mit einem heilberuflichen
    Bezeichnungsverbot (05.05.2026) und die kalifornische Produkthaftung mit zwölf koordinierten Verfahren
    (JCCP 5431, Koordinationsbeschluss 03.02.2026). Rechtsetzung läuft parallel und schneller als die
    Rechtsprechung: China hat am 15.07.2026 als erste Rechtsordnung ein eigenes Regime für anthropomorphe
    Interaktionsdienste in Kraft gesetzt, Kalifornien und New York haben 2025/26 Offenlegungs- und Krisenprotokollpflichten
    erlassen. Die Europäische Union hat für Companion-Chatbots gegenüber Minderjährigen keine eigene Vorschrift;
    ihre Aufsicht arbeitet mit der Datenschutz-Grundverordnung weiter.

    '
  positionen:
  - position: Datenschutzrecht — die Altersverifikation ist eine technisch-organisatorische Maßnahme,
      und über das Vortraining ist zu unterrichten
    gericht: Garante per la protezione dei dati personali (Replika, 10.04.2025; Character.AI, 03.07.2026);
      Information Commissioner's Office (Snap „My AI", Abschluss Mai 2024); Attorney General of Kentucky
      (15.01.2026)
    begruendung: 'Der Garante behandelt das Fehlen einer funktionierenden Altersverifikation als Verstoß
      gegen Art. 24 und 25 DSGVO — nicht als Jugendschutz-, sondern als Sicherheitsfrage. In der Character-AI-Entscheidung
      tritt ein zweiter, dogmatisch weiterreichender Vorwurf hinzu: Über das Vortraining der zugrunde
      liegenden Modelle sei nach Art. 14 DSGVO zu unterrichten. Damit wird das Pre-Training als eigene
      Verarbeitung behandelt und die schwierige Frage nach der Rechtsgrundlage umgangen, indem bei der
      Information angesetzt wird. Angeordnet wurden ein funktionsfähiges Altersverifikationssystem, ein
      Cooling-off-Mechanismus gegen die Neuanmeldung gesperrter Minderjähriger und die Voreinstellung
      der Profile Minderjähriger auf privat. Der ICO hat dieselbe Frage über Art. 35 UK GDPR gestellt:
      Die Datenschutz-Folgenabschätzung ist vor der Markteinführung einer generativen Funktion zu erfüllen,
      und zwar gerade im Hinblick auf 13- bis 17-jährige Nutzer. Kentucky überträgt das Muster auf ein
      einzelstaatliches Datenschutzgesetz — erste Durchsetzungsmaßnahme unter dem Kentucky Consumer Data
      Protection Act, zwei Wochen nach dessen Inkrafttreten.

      '
