- id: training-schranken-international
  titel: Das Training generativer Modelle im Rechtsvergleich
  frage: 'Darf ein generatives Modell auf urheberrechtlich geschützten Werken trainiert werden — und mit
    welchem Instrument beantwortet die jeweilige Rechtsordnung diese Frage: offener Abwägungstatbestand,
    enumerierte Schranke mit Nutzungsvorbehalt, Vergütungsanspruch, Herkunftsprivileg, Strafnorm oder
    gar nicht?

    '
