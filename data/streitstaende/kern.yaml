  - usc-17-501-a
  stand: 'Ein Circuit Split, der sich seit 2024 gebildet hat und der zum 07.09.2026 noch nicht entschieden
    ist. Beide Berufungsgerichte haben verhandelt und keines hat gesprochen: der Ninth Circuit am 11.02.2026
    in Doe 1 ./. GitHub (No. 24-7700, Thomas, Miller, Blumenfeld), der Second Circuit am 18.03.2026 in
    dem als In re OpenAI Copyright Infringement Litigation geführten Raw-Story-Verfahren (No. 25-1756,
    Wesley, Jacobs, Lee). Der jüngste Sacheintrag beider Register ist jeweils der Verhandlungstermin selbst.
    Erstinstanzlich stehen drei Richter auf der Seite des Identitätserfordernisses (Tigar und Orrick,
    beide N.D. Cal.; der Sache nach auch Stein für § 1202(b)(3)) und einer dagegen (Rakoff, S.D.N.Y.).
    Entscheidend für das Verständnis der Lage ist, dass die beiden Berufungsverfahren nicht dieselbe Frage
    stellen: Der Ninth Circuit prüft das Tatbestandsmerkmal, der Second Circuit die Klagebefugnis nach
    Art. III. Ein Kläger kann deshalb in beiden Circuits aus verschiedenen Gründen scheitern und in beiden
    aus verschiedenen Gründen obsiegen.

    '
  positionen:
  - position: Identität erforderlich — § 1202(b) erfasst nur die Entfernung aus im Übrigen unveränderten
      Kopien
    gericht: N.D. Cal., Tigar (Doe 1 ./. GitHub, 24.06.2024) und Orrick (Andersen ./. Stability, 12.08.2024,
      Abweisung mit Präklusion)
    begruendung: 'Ein generatives Modell gibt typischerweise Varianten aus, keine Vervielfältigungsstücke.
      Wäre § 1202(b) auch auf abgewandelte Ausgaben anwendbar, entstünde ein verschuldensunabhängiger
      Anspruch mit statutarischem Schadensersatz von 2.500 bis 25.000 USD je Verstoß, der ohne Werkvergleich
      und ohne Fair-Use-Prüfung auskäme — also gerade dort greift, wo das Urheberrecht selbst nicht trägt.
      Orrick hat die Ansprüche deshalb nicht nur abgewiesen, sondern mit Präklusion; damit steht ein zweiter
      Richter desselben Districts neben Tigar.

      '
    urteile:
    - us-2024-doe-github-tigar
    - us-2024-andersen-mtd2
  - position: Identität nicht erforderlich — das Gesetz spricht von Werken, nicht von identischen Kopien
    gericht: S.D.N.Y., Senior Judge Rakoff (The Intercept ./. OpenAI, Kurzentscheidung 21.11.2024, Gründe
      20.02.2025)
    begruendung: 'Rakoff hat die Auffassung, das Gesetz verlange eine identische Kopie, ausdrücklich verworfen
      und den Anspruch wegen Entfernung von Autoren- und Titelangaben aus den zum Training genutzten Artikeln
      zugelassen. Der Wortlaut des § 1202(b) knüpft an das Werk an, nicht an die Kopie; die Entfernung
      geschieht beim Aufbereiten der Trainingsdaten und ist damit abgeschlossen, bevor überhaupt eine
      Ausgabe entsteht. Die Trennung ist konsequent: Rakoff hat den Verbreitungstatbestand des § 1202(b)(3)
      gerade abgewiesen und nur § 1202(b)(1) — das Entfernen — durchgelassen.

      '
    urteile:
    - us-2025-intercept-rakoff
  - position: Die Frage stellt sich nicht, weil es schon an einem Art.-III-Schaden fehlt
    gericht: S.D.N.Y., Judge McMahon (Raw Story ./. OpenAI, 07.11.2024; Wiedererwägung durch Judge Stein
      abgelehnt am 18.06.2025)
    begruendung: 'Der bloße Verstoß gegen § 1202(b) ohne konkreten, dem historischen Common Law vergleichbaren
      Schaden genügt nicht für die Klagebefugnis; die Kläger hätten keine Ausgabe benannt, die ihre Inhalte
      ohne Urheberrechtsangaben wiedergegeben habe. McMahon benennt die eigentliche Beschwer ausdrücklich:
      Die Kläger störe nicht die entfernte Angabe, sondern die unvergütete Nutzung ihrer Werke — dafür
      sei § 1202 nicht das Instrument. Das ist keine Auslegung des Tatbestands, sondern seine Umgehung
      über das Prozessrecht, und sie trifft dieselben Kläger härter: Wer keine Ausgabe vorlegen kann,
      kommt gar nicht erst zur materiellen Frage. Dass Rakoff und McMahon in faktisch identischen Fällen
      desselben Districts entgegengesetzt entschieden haben, ist der schärfste Beleg für die Unbestimmtheit
      der Norm.

      '
    urteile:
    - us-2024-rawstory-mcmahon
  - position: Aufspaltung nach Absätzen und nach Beklagten — der differenzierende Mittelweg
    gericht: S.D.N.Y., Judge Stein (The New York Times u.a. ./. Microsoft und OpenAI, 04.04.2025)
    begruendung: 'Stein hat § 1202(b)(1) und § 1202(b)(3) getrennt und zusätzlich nach Beklagten differenziert:
      Der Entfernungstatbestand fiel gegen Microsoft in allen drei Verfahren und gegen OpenAI im Times-Verfahren,
      blieb aber gegen OpenAI in den Verfahren Daily News und CIR bestehen; der Verbreitungstatbestand
      fiel durchgehend, ohne Präklusion. Damit ist ein dritter Richter desselben Districts weder Rakoff
      noch McMahon gefolgt. Der praktische Befund lautet, dass § 1202(b)(3) — Verbreitung — sich in keiner
      Konstellation halten lässt, während § 1202(b)(1) — Entfernung — von der Substantiierung im Einzelfall
      abhängt.

      '
    urteile:
    - us-2025-nyt-openai-mtd
  - position: Wo die Ausgabe die Angabe sichtbar mitführt, löst sich der Streit im Sachverhalt auf
    gericht: N.D. Cal., Judge Thompson (Getty Images ./. Stability AI, anhängig seit 14.08.2025)
    begruendung: 'Getty stützt den CMI-Anspruch darauf, dass Stable Diffusion verzerrte Getty-Wasserzeichen
      reproduziert hat. Das ist der einzige Fall des Bestandes, in dem die Ausgabe selbst den Nachweis
