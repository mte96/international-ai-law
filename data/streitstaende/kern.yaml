  - position: Vom Rechtsvortrag zum Tatsachenvortrag — die KI-erzeugte eigene Aussage und die Glaubwürdigkeit
    gericht: Immigration and Protection Tribunal / Te Taraipiunara Manene me te Whakamarumaru (Member
      S O'Connor), 24.03.2026 – EB (India) v A Refugee and Protection Officer [2026] NZIPT 802868
    begruendung: 'Ein neuer Fragentyp, den die gesamte übrige Kasuistik nicht kennt. Sie betrifft KI-erzeugte
      Rechtsausführungen; hier geht es um KI-erzeugten Tatsachenvortrag — die eigene Lebensgeschichte
      einer Partei in einem Verfahren, in dem die Glaubhaftigkeit der Erzählung das einzige Beweismittel
      ist. Aufgefallen war es, weil die Modellanweisung im eingereichten Dokument stehengeblieben war
      („write a written statement in 500 words in a chronological order ..."). Der tragfähige Schluss
      des Tribunals lautet: Ein Modell, das aus Stichpunkten eine Erzählung formt, füllt Lücken mit Plausiblem
      — wo die Erzählung selbst das Beweismittel ist, verfälscht das den Beweis unabhängig von der Redlichkeit
      der Partei. Der zweite Schluss ist heikel und sollte nicht mitübernommen werden: Das Tribunal wertet
      auch die unbeabsichtigte Offenlegung, also die Ungeschicklichkeit, gegen die Glaubwürdigkeit. Die
      Entscheidung markiert die Grenze dieses Streitstands zur Frage des maschinell erzeugten Beweises.

      '
