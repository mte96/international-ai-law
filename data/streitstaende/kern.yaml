  stand: 'Zwei Stränge, die dieselbe Lücke von verschiedenen Seiten angehen und einander nie berühren.
    In den Vereinigten Staaten wird über die Zurechnung gestritten: Der Anbieter der Auswahlsoftware ist
    nach dem Wortlaut des Antidiskriminierungsrechts Dritter, und nur eine Hilfskonstruktion — er sei
    „agent" seiner Kundenarbeitgeber — macht ihn zum unmittelbaren Anspruchsgegner. Diese Konstruktion
    trägt seit dem 12.07.2024 das Verfahren Mobley ./. Workday, ist am 16.05.2025 zur bundesweiten ADEA-Kollektivklage
    erweitert und am 22.06.2026 gegen den Angriff über Loper Bright verteidigt worden; berufungsgerichtlich
    bestätigt ist sie nicht. In Europa wird nicht über die Zurechnung gestritten, sondern über die Offenlegung
    — und dort ist der wirksamste Anspruch nicht der individuelle, sondern der kollektive: Die Audiencia
    Nacional hat am 04.07.2025 die Verweigerung der Algorithmusparameter gegenüber der Gewerkschaft als
    Verletzung der Koalitionsfreiheit behandelt. Daneben ist 2026 ein dritter Weg sichtbar geworden, der
    weder zurechnet noch offenlegt, sondern verbietet: Der Garante hat am 28.05.2026 das Verbot der Emotionserkennung
    am Arbeitsplatz erstmals angewandt, und zwar über eine Warnung nach der DSGVO, weil die Sanktionsarchitektur
    der KI-Verordnung noch nicht steht. Die Hochrisiko-Pflichten für den Beschäftigungsbereich des Anhangs
    III greifen nach der Verschiebung durch die Verordnung (EU) 2026/1744 erst am 02.12.2027.

    '
  positionen:
  - position: Der Softwareanbieter haftet als Agent des Arbeitgebers — und die Software ist die gemeinsame
      Politik
    gericht: N.D. Cal., Richterin Rita F. Lin (Mobley ./. Workday, 12.07.2024, 16.05.2025, 22.06.2026);
      D. Mass., Richterin Angel Kelley (Louis ./. SafeRent, 26.07.2023, Vergleich endgültig 20.11.2024)
    begruendung: 'Die Zurechnung schließt eine Lücke, die auch das europäische Recht kennt: Verantwortlicher
      nach Art. 22 DSGVO und Betreiber nach der KI-Verordnung ist der Arbeitgeber; der Anbieter ist Dritter
      — obwohl nur er das Modell ändern kann. Lin macht ihn über die Agentenfigur zum unmittelbaren Anspruchsgegner
      und erklärt in einem zweiten Schritt die algorithmische Bewertung selbst zur gemeinsamen, einheitlichen
      Politik einer Vielzahl voneinander unabhängiger Arbeitgeber; das trägt die bundesweite Kollektivklage
      für Bewerber ab 40 Jahren seit dem 24.09.2020 und wurde am 07.07.2025 ausdrücklich auf die HiredScore-Funktionen
      erstreckt. Ohne diese Kollektivierung wäre algorithmische Diskriminierung praktisch nicht justiziabel,
      weil der einzelne Bewerber weder von der Aussortierung erfährt noch sie beweisen kann. Dieselbe
      Denkfigur — der geteilte Algorithmus ersetzt die Koordination — trägt im Kartellrecht die Hub-and-spoke-Rechtsprechung.
      Louis ./. SafeRent zeigt die Reichweite außerhalb des Beschäftigungsrechts: Der Scoring-Anbieter
      fällt in den Anwendungsbereich des Fair Housing Act, und der Vergleich verpflichtet ihn, für Wohngeldempfänger
      überhaupt keine automatisierten Empfehlungen mehr abzugeben, sondern nur Rohdaten — es sei denn,
      unabhängige Sachverständige validieren das Modell. Das ist funktional das, was Art. 22 DSGVO anordnet
      und was die KI-Verordnung als Konformitätsbewertung vorschreibt, nur privat vereinbart.

      '
