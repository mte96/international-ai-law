  stand: 'Zwei Rechtsgebiete geben auf dieselbe Frage unterschiedliche Antworten, und die Antwort des
    Datenschutzrechts ist die schwächere. Seit dem 02.08.2026 tritt mit Art. 86 KI-VO ein dritter Anspruch
    hinzu, dessen Voraussetzungen aber erst ab dem 02.12.2027 dokumentationsrechtlich unterlegt sind —
    und dessen erste Klärungschance vertan ist: Das erste Vorabentscheidungsersuchen zur KI-Verordnung
    überhaupt, C-806/24, hat der Gerichtshof am 03.06.2026 mangels Gegenstands erledigt, drei Wochen vor
    Geltungsbeginn der Norm. Außerhalb Europas wird die Frage zudem gar nicht als Transparenzfrage gestellt:
    Kanada, Israel und Australien kontrollieren nicht das Werkzeug, sondern das Ergebnis und die menschliche
    Befassung, und England kontrolliert über das Beweisrecht.

    '
  positionen:
  - position: Datenschutzrecht — kontrafaktische Nachvollziehbarkeit, kein Code
    gericht: Gerichtshof der Europäischen Union (Erste Kammer), C-203/22 (Dun & Bradstreet Austria), 27.02.2025
    begruendung: 'Der Verantwortliche muss das Verfahren und die angewandten Grundsätze so erläutern,
      dass der Betroffene nachvollziehen kann, welche seiner personenbezogenen Daten wie verwendet wurden
      und wie eine Änderung dieser Daten zu einem anderen Ergebnis geführt hätte. Der Algorithmus selbst,
      seine Formel und der Quellcode sind nicht geschuldet — eine bloße Übermittlung des Algorithmus wäre
      ohnehin nicht aussagekräftig. Bei Kollision mit Geschäftsgeheimnissen darf die Auskunft nicht schlicht
      verweigert werden; die behaupteten geschützten Informationen sind der Aufsichtsbehörde oder dem
      Gericht vorzulegen, die abwägen.

      '
