      Colorado, New York, Texas)
    begruendung: 'Verglichen wurde, bevor irgendein Rechtsmittelgericht über die Produkteigenschaft oder
      das First Amendment entscheiden konnte. Aufschlussreich ist die Risikoallokation: Google war nicht
      Anbieter des Chatbots, sondern Lizenzgeber und Cloud-Dienstleister — und hat mitgezahlt, nachdem
      das Gericht die Zulieferhaftung hatte passieren lassen. Im texanischen Parallelverfahren hatte Google
      zuvor versucht, sich als Nichtpartei auf die Schiedsklausel der Nutzungsbedingungen des Anwendungsanbieters
      zu berufen.

      '
