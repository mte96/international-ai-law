  - position: Korrektur im eigenen Haus — Rücknahme ohne Verfahren, Aufsicht durch die Legislative
    gericht: United States District Court D.N.J. (Neals) und S.D. Miss. (Wingate), Juni bis August 2025;
      Senate Committee on the Judiciary (Grassley), 06.10.2025
    begruendung: 'Beide Bundesrichter erließen Entscheidungen mit erfundenen Zitaten — Neals eine versehentlich
      veröffentlichte Entwurfsfassung über einen Abweisungsantrag mit vier erfundenen Entscheidungen,
      Wingate eine sofort wirksame einstweilige Anordnung, die Parteien benannte, die am Verfahren nicht
      beteiligt waren, den Gesetzestext falsch zitierte und Erklärungen von vier Personen anführte, die
      in der Akte nicht vorkommen. Beide nahmen die Entscheidung zurück und erließen eine neue, ohne auf
      die frühere einzugehen; die Rücknahme geschah durch Minute Order beziehungsweise Text Order, also
      durch einen Dockettext ohne eigenes Dokument und ohne Begründung. Es gibt für diesen Fall kein Verfahren:
      keine Anzeigepflicht, keine Aufsicht, keine Veröffentlichung. Die einzige institutionelle Reaktion
      kam vom Justizausschuss des Senats, der beide Richter anschrieb; beide führten die Fehler auf Mitarbeiter
      zurück, die generative KI ohne Genehmigung eingesetzt hatten. Wingate führte daraufhin eine unabhängige
      Gegenprüfung ein, Neals ein Verbot des KI-Einsatzes beim Entwurf von Entscheidungen.

      '
