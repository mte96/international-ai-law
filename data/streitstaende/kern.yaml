  - position: Strafrecht ohne Kennzeichnungsprivileg — eigener Straftatbestand mit Schadensmerkmal
    stelle: Italien, Art. 612-quater codice penale (eingefügt durch Art. 26 legge 132/2025)
    begruendung: 'Illecita diffusione di contenuti generati o alterati con sistemi di intelligenza artificiale:
