  - position: Vermögensrecht — das Recht am eigenen Bild als handelbares Gut
    stelle: Vereinigte Staaten, ELVIS Act (Tennessee) und NO FAKES Act (Bundesentwurf)
    begruendung: 'Der ELVIS Act erweitert das Persönlichkeitsrecht Tennessees um die Stimme und definiert
      sie als Klang, der einer bestimmten Person erkennbar zuzuordnen ist, unabhängig davon, ob es die
      echte Stimme oder eine Nachbildung ist; international einmalig ist die Haftung dessen, der Werkzeuge
      bereitstellt, deren Hauptzweck die Erzeugung solcher Nachbildungen ist. Der NO FAKES Act schafft
      ein bundesrechtliches, vererbliches Recht an Stimme und Abbild gegenüber digitalen Nachbildungen,
      mit Notice-and-Takedown, pauschaliertem Schadensersatz und teilweiser Verdrängung abweichenden Staatenrechts;
      die Fassung von 2026 ergänzt ein Gegenanzeigeverfahren nach dem Vorbild des DMCA sowie Ausnahmen
      für nichtkommerzielle Bibliotheken, Archive und Bildungseinrichtungen.

      '
