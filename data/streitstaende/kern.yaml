- id: modellgewichte-personenbezug
  titel: Personenbezug von Modellgewichten
  frage: 'Sind die Parameter eines auf personenbezogenen Daten trainierten Modells selbst personenbezogene
    Daten im Sinne des Art. 4 Nr. 1 DSGVO, wann ist ein Modell anonym, und wer muss die Anonymität darlegen?

    '
  jurisdiktionen:
  - eu
  - de
  themenachsen:
  - datenschutz
  - gpai
  - governance
  stand: 'Drei Stellen, drei Antworten — und seit dem 04.09.2025 eine vierte Ebene. Der EuGH hat in C-413/23
    P (EDSB ./. Einheitlicher Abwicklungsausschuss) den relativen Personenbezug bestätigt, ohne KI-Modelle
    auch nur zu erwähnen; der Digital Omnibus will die Relativität in Art. 4 Nr. 1 DSGVO hineinschreiben.
    Eine Gerichtsentscheidung, die Modellgewichte unmittelbar betrifft, ist zum 04.09.2026 nicht auffindbar.
    Die Frage entscheiden deshalb Aufsichtsbehörden und der Gesetzgeber, nicht Gerichte. Aus dem Bestand
    lässt sich immerhin ein Präzedenzfall für die Prüfung selbst gewinnen: Die koreanische Aufsichtsbehörde
    hat 2021 eine Pseudonymisierungsbehauptung daran scheitern lassen, dass das eingesetzte System personenbezogene
    Trainingsdaten ausgab.

    '
  positionen:
  - position: Nicht per se anonym; die Anonymität ist im Einzelfall nachzuweisen
    stelle: Europäischer Datenschutzausschuss, Opinion 28/2024
    begruendung: 'Auf personenbezogenen Daten trainierte Modelle können nicht in allen Fällen als anonym
      gelten. Anonym ist ein Modell nur, wenn sowohl die Wahrscheinlichkeit der Extraktion personenbezogener
      Trainingsdaten als auch die ihrer Erlangung über Abfragen unerheblich ist, gemessen an allen vernünftigerweise
      verfügbaren Mitteln. Der Verantwortliche hat Designentscheidungen, Quellenauswahl, Testergebnisse
      und die Widerstandskraft gegen Extraktionsangriffe zu dokumentieren; die Darlegungslast liegt bei
      ihm. Die vierte Antwort der Stellungnahme ist die wirtschaftlich schärfste: Wer ein fremdes Modell
      einsetzt, muss die Rechtmäßigkeit seiner Entwicklung prüfen.

      '
    urteile:
    - eu-2024-edsa-opinion-28
    belege:
    - 2024-edsa-opinion-28-2024
    - 2025-edsa-leitlinien-01-2025-pseudonymisierung
    - 2026-edsa-leitlinien-03-2026-scraping
  - position: In einem Sprachmodell sind keine personenbezogenen Daten gespeichert
    stelle: Hamburgischer Beauftragter für Datenschutz und Informationsfreiheit, Diskussionspapier Juli
      2024
    begruendung: 'Drei Thesen. Erstens ist die bloße Vorhaltung eines LLM keine Verarbeitung nach Art.
      4 Nr. 2 DSGVO, weil im Modell keine personenbezogenen Daten gespeichert sind: Tokens und Embeddings
      sind hochgradig abstrahierte Wahrscheinlichkeitsbeziehungen zwischen Sprachfragmenten und keine
      Platzhalter für Identität. Zweitens können sich Auskunfts-, Berichtigungs- und Löschungsansprüche
      nicht gegen das Modell richten, sondern nur gegen Eingabe und Ausgabe des Systems. Drittens schlägt
      ein rechtswidriges Training nicht auf die Rechtmäßigkeit des späteren Einsatzes durch.

      '
    belege:
    - 2024-hmbbfdi-llm-personenbezug
  - position: Modelle sind personenbezogene Daten, weil sie sich invertieren lassen
    stelle: Technisch gestützte Literatur (Veale/Binns/Edwards; Carlini u. a.; Nasr u. a.; Lukas u. a.)
    begruendung: 'Aus trainierten Modellen lassen sich über Modellinversion und Mitgliedschaftsangriffe
      Trainingsdaten rekonstruieren; Memorisierung ist keine Anomalie, sondern wächst log-linear mit Modellkapazität,
      Häufigkeit des Beispiels im Korpus und Kontextlänge. Ein einfacher Divergenzangriff extrahiert aus
      produktiv eingesetzten Modellen gigabyteweise wörtliche Trainingsdaten; auch mit differentieller
      Privatheit trainierte Modelle geben noch rund drei Prozent der personenbezogenen Sequenzen preis.
      Wenn die Rekonstruktion mit vernünftigerweise verfügbaren Mitteln gelingt, ist das Modell selbst
      Speicherort im Sinne des Art. 4 Nr. 1 DSGVO.

      '
    belege:
    - 2018-veale-binns-edwards-algorithms-remember
    - 2022-carlini-quantifying-memorization
    - 2023-nasr-scalable-extraction
    - 2023-lukas-pii-leakage
    - 2024-schwarzschild-adversarial-compression
  - position: Die Frage ist falsch gestellt — die Gefahr liegt in der Inferenz, nicht im Speicher
    stelle: Staab/Vero/Balunović/Vechev; der Sache nach auch Purtova
    begruendung: 'Sprachmodelle erschließen aus unauffälligem Text Wohnort, Einkommen und Herkunft mit
      bis zu 85 Prozent Treffergenauigkeit, ohne irgendetwas memorisiert zu haben. Der Personenbezug entsteht
      dann nicht im Modell, sondern in seiner Anwendung. Damit verliert der Streit über die Gewichte seinen
      Gegenstand: Maßgeblich ist nicht, was in den Parametern steht, sondern was mit ihnen erschlossen
      werden kann. Purtova fügt die Gegenrichtung hinzu — ein Personenbezugsbegriff, der alles erfasst,
      reguliert nichts mehr.

      '
    belege:
    - 2023-staab-beyond-memorization
    - 2018-purtova-law-of-everything
  - position: Relativer Personenbezug — es kommt auf den Verantwortlichen an
    gericht: Gerichtshof der Europäischen Union (Erste Kammer), C-413/23 P, 04.09.2025
    begruendung: 'Ob pseudonymisierte Informationen personenbezogen sind, beurteilt sich aus der Perspektive
      der jeweiligen Stelle und nach den Mitteln, die sie vernünftigerweise einsetzen wird. Für den erhebenden
      Verantwortlichen bleiben die Daten personenbezogen; für einen Empfänger ohne Zuordnungsmöglichkeit
      können sie anonym sein. Das Urteil betrifft die Übermittlung pseudonymisierter Stellungnahmen in
      einem Bankenabwicklungsverfahren, nicht KI-Modelle — es liefert aber den Maßstab, an dem die Anonymitätsbehauptung
      eines Modellanbieters zu messen ist.

      '
    belege:
    - EuGH, Urt. v. 04.09.2025 – C-413/23 P (EDSB ./. SRB), Erste Kammer; ECLI in dieser Sitzung NICHT
      verifiziert
  - position: Der einzige Fall, in dem eine Aufsichtsbehörde eine Anonymitätsbehauptung am Verhalten des
      Systems geprüft hat
    stelle: 개인정보보호위원회 — Personal Information Protection Commission (Korea), Beschl. v. 28.04.2021 (ScatterLab
      / Iruda)
    begruendung: 'ScatterLab hatte rund 9,4 Mrd. KakaoTalk-Nachrichten aus zwei anderen Diensten zum Training
      des Chatbots Iruda verwendet und sich auf Pseudonymisierung berufen. Die Kommission hielt die Anonymisierung
      für unzureichend — mit einer rein empirischen Begründung: Der Chatbot gab Namen, Adressen und Kontonummern
      realer Personen aus. Das ist der Maßstab, den der EDSA drei Jahre später formuliert hat, die Erlangung
      personenbezogener Daten über Abfragen, angewandt auf ein produktiv eingesetztes System. Die Entscheidung
      betrifft die Ausgaben, nicht die Parameter, und ersetzt deshalb keine Aussage über den Personenbezug
      der Gewichte; sie zeigt aber, dass die Anonymitätsbehauptung überhaupt überprüfbar ist — und wie.
      Nach dem Bestandseintrag beruhen die Angaben auf Modellwissen und sind vor Zitierung an der Primärquelle
      zu prüfen.

      '
    urteile:
    - kr-2021-pipc-scatterlab
  - position: Die einzige Sanktion zur Rechtsgrundlage des Trainings ist aus Zuständigkeitsgründen aufgehoben
      worden
    gericht: Garante per la protezione dei dati personali, Provvedimento n. 755 vom 02.11.2024; aufgehoben
      durch Tribunale Ordinario di Roma, Sezione diritti della persona e immigrazione, sentenza n. 4153/2026
      vom 18.03.2026 (Gründe 28.05.2026)
    begruendung: 'Bis zur Aufhebung war das italienische Bußgeld von 15 Mio. Euro weltweit die einzige
      behördliche Entscheidung, die die Rechtsgrundlage für das Training generativer Modelle zum Gegenstand
      hatte — festgestellt waren fehlende Rechtsgrundlage, unzureichende Transparenz nach Art. 12, 13
      DSGVO, Verstoß gegen die Meldepflicht nach Art. 33 DSGVO und das Fehlen jeder Altersverifikation.
      Materiell überprüft worden ist davon nichts. Das Tribunale hat die Sanktion allein aus Zuständigkeitsgründen
      vollständig aufgehoben: Nachdem OpenAI Ireland Ltd. am 15.02.2024 als einzige Niederlassung im EWR
      anerkannt worden war, sei nach dem One-Stop-Shop-Mechanismus die irische Aufsichtsbehörde federführend
      gewesen; die federführende Zuständigkeit könne bis zum Erlass einer endgültigen Entscheidung übergehen,
      und die Unterscheidung zwischen fortdauernden und abgeschlossenen Verstößen sei unerheblich. Für
      diesen Streitstand ist das der wichtigste verfahrensrechtliche Befund: Die Frage, ob und auf welcher
      Grundlage personenbezogene Daten in ein Modell eingehen dürfen, ist in Europa nicht offen, weil
      niemand sie stellt, sondern weil die einzige Antwort prozessual kassiert worden ist. Strukturell
      folgt daraus eine Vollzugslücke — ein Anbieter kann ohne Niederlassung in den Markt eintreten, die
      vorläufigen Maßnahmen absorbieren und die anhängigen Sanktionen durch eine spätere Niederlassung
      in ein Forum seiner Wahl verlagern.

      '
    urteile:
    - eu-2024-garante-openai
    - eu-2026-tribunale-roma-openai
  - position: Nicht die Gewichte, die Protokolle — prozessual gehören die Gespräche nicht dem Nutzer
    gericht: S.D.N.Y., Magistrate Judge Ona T. Wang, 07.11.2025, bestätigt durch Judge Sidney H. Stein
      am 05.01.2026 (No. 1:25-md-03143)
    begruendung: 'Der Streit über den Personenbezug der Parameter hat ein praktisches Gegenstück, das
      ihn in der Wirkung überholt: Wang hat die Herausgabe eines de-identifizierten Samples von 20 Millionen
      ChatGPT-Gesprächen angeordnet, auch soweit sie die Klägerwerke nicht erwähnen — erst der Gesamtbestand
      erlaube es, die Häufigkeit verletzender Ausgaben ins Verhältnis zur Gesamtnutzung zu setzen. Eine
      Stichwortfilterung genügte nicht; De-Identifizierung und Schutzanordnung wurden als hinreichender
      Schutz angesehen. Stein bestätigte vollständig und fügte das eigentlich Tragende hinzu: Die Nutzer
      hätten ihre Kommunikation „voluntarily submitted their communications to OpenAI", was den Fall von
      staatlicher Überwachung unterscheide; ein pauschaler Privatsphäreneinwand ersetze keine konkreten
      Schutzmaßnahmen. Das überträgt die verfassungsrechtliche Third-Party-Doktrin unbesehen auf die zivilprozessuale
      Verhältnismäßigkeit. Für die betriebliche KI-Nutzung ist das die praktisch wichtigere Nachricht
      als jede Aussage über Modellgewichte: Wer ein Sprachmodell einsetzt, muss damit rechnen, dass die
      Eingaben Dritter in einem fremden Rechtsstreit landen — und die De-Identifizierung ist dabei ein
      schwächerer Schutz, als sie klingt.

      '
    urteile:
    - us-2025-nyt-chatlogs-wang
    - us-2026-nyt-chatlogs-stein
  - position: Der capability test — wer Kundendaten für eigene Zwecke nutzen könnte, ist nicht mehr verlängerter
      Arm
    gericht: N.D. Cal., 10.02.2025 – 3:23-cv-05437-RFL (In re Google Cloud Contact Center AI Privacy Litigation
      / Ambriz)
    begruendung: 'Die Position betrifft nicht die Parameter, sondern die Stelle, die sie hält — und sie
      ist für die vierte Antwort der EDSA-Stellungnahme 28/2024 einschlägig, wonach prüfen muss, wer ein
      fremdes Modell einsetzt. Das Gericht behandelt Google Cloud Contact Center AI als „Dritten" im Sinne
      des kalifornischen Abhörverbots, weil die Software die Fähigkeit hat, die Anrufdaten zum Training
      eigener Modelle zu verwenden — und zwar unabhängig davon, ob Google sie tatsächlich so genutzt hat.
      Der Einwand, man stelle den Kunden lediglich Software bereit und sei deren verlängerter Arm, wurde
      verworfen. Übertragen auf das europäische Recht ist das die Frage, ob ein KI-Anbieter noch Auftragsverarbeiter
      nach Art. 28 DSGVO ist oder bereits Verantwortlicher nach Art. 4 Nr. 7 — mit dem entscheidenden
      Unterschied, dass das kalifornische Gericht auf die Fähigkeit statt auf die tatsächliche Zweckbestimmung
      abstellt. Das ist deutlich weiter als alles, was die europäische Aufsichtspraxis kennt. Die Zuordnung
      zu diesem Streitstand ist die schwächste der hier vorgenommenen; der Fall gehörte sachlich besser
      in einen eigenen Streitstand zur Rolle des KI-Anbieters in der Wertschöpfungskette.

      '
    urteile:
    - us-2025-ambriz-google
  - position: Die Löschungsanordnung läuft leer — ein Modell hat keine URLs, sondern Gewichte
    gericht: High Court of New Zealand (Mount J), 25.05.2026 – 'A' v R [2026] NZHC 1422
    begruendung: 'Soweit ersichtlich die weltweit erste Gerichtsentscheidung, die das Verhältnis von Löschungsanordnung
      und Modellgedächtnis zum tragenden Grund einer Verfahrensentscheidung macht — und damit die praktische
      Zuspitzung dieses Streitstands: Ob in den Parametern personenbezogene Daten stecken, entscheidet
      sich an der Frage, ob man sie wieder herausbekommt. Das Gericht ordnete die Namensunterdrückung
      bis zum Verdikt an, weil generative Dienste Inhalte weiter ausgeben, deren Entfernung bereits angeordnet
      war. Der Sachverständige stellte fest, KI-Systeme könnten technisch Leitplanken enthalten, die eine
      Löschanordnung befolgbar machen; die Unsicherheit liege nicht in der Technik, sondern in den Regeln,
      die die Entwickler setzen. Zur Zuständigkeit äußerte er Bedenken wegen der notwendigen Extraterritorialität:
      Eine Anordnung ließe sich den größten Anbietern zustellen, andere würden von einer Anordnung, die
      einzelne Unternehmen benennt, verfehlt, und offene Gewichte stehen ohnehin außerhalb der Kontrolle
      der ursprünglichen Entwickler. Für die europäische Diskussion folgt daraus unmittelbar, dass Art.
      17 DSGVO, der presserechtliche Unterlassungsanspruch und die Anordnungen nach §§ 169, 174 Abs. 3
      GVG an einer Stelle ihre Wirkung verlieren, an der man es bisher nicht erwartet hat — und dass die
      Hamburger These, im Modell sei nichts gespeichert, hier ihre praktische Probe hat.

      '
    urteile:
    - nz-2026-a-v-r-namensunterdrueckung-ki
  unterfragen:
  - frage: Trägt der Anbieter die Darlegungslast für die Anonymität?
    ja: EDSA — dokumentierte Designentscheidungen, Testergebnisse und Angriffsresistenz
    nein: HmbBfDI — es gibt nichts darzulegen, weil im Modell nichts gespeichert ist
  - frage: Heilt eine nachträgliche Anonymisierung ein rechtswidriges Training?
    ja: EDSA, vierte Antwort der Opinion 28/2024 — für den Betrieb greift die DSGVO dann nicht mehr
    nein: gegenüber dem Entwickler bleibt die Verarbeitung rechtswidrig, und der Anonymitätsnachweis ist
      nach derselben Stellungnahme hoch
  - frage: Gilt der relative Personenbezug auch für Modellgewichte?
    ja: der Sache nach der Vorschlag zu Art. 4 Nr. 1 DSGVO im Digital Omnibus
    nein: EDSA und EDSB in der Gemeinsamen Stellungnahme — die Neufassung kehre Erwägungsgrund 26 um
  aufloesung: 'Nicht durch ein Gericht, sondern zunächst durch den Gesetzgeber. Der Digital Omnibus (Daten),
    COM(2025) 837 vom 19.11.2025, will Art. 4 Nr. 1 DSGVO um einen subjektiv-relativen Zusatz ergänzen;
    das Verfahren 2025/0360(COD) stand am 04.09.2026 noch im Ausschussstadium, ohne allgemeine Ausrichtung
    des Rates und ohne Trilogergebnis. EDSA und EDSB lehnen die Neufassung ab. Eine gerichtliche Klärung
    ist am ehesten über eine Vorlage aus einem Löschungs- oder Auskunftsverfahren gegen einen Modellanbieter
    zu erwarten; ein solches Verfahren ist nicht nachgewiesen. Bis dahin entscheidet die Aufsichtspraxis,
    und die folgt der EDSA-Linie, nicht der Hamburger.

    '
  eigene_bewertung: 'Das Hamburger Papier und die EDSA-Stellungnahme widersprechen einander weniger, als
    es scheint — sie beantworten verschiedene Fragen. Hamburg fragt, ob die Gewichte Daten speichern;
    der EDSA fragt, ob das Modell eine Person identifizierbar macht. Art. 4 Nr. 1 DSGVO verlangt aber
    keine Speicherung, sondern Identifizierbarkeit. Selbst wenn Hamburgs technische Prämisse zutrifft,
    trägt sie den Schluss nicht: Ein Modell, das nichts memorisiert hat, kann Personen über Inferenz identifizierbar
    machen. Der zweite, in der Debatte fehlende Punkt ist die Halbwertszeit der Anonymitätsbehauptung.
    Memorisierung wächst log-linear mit der Modellkapazität; ein Modell, das mit sieben Milliarden Parametern
    anonym ist, ist es mit siebzig Milliarden auf demselben Korpus nicht notwendig noch. Anonymität ist
    damit keine Eigenschaft, sondern eine Aussage mit Verfallsdatum — und niemand bildet das in Lizenzverträgen
    ab. Der dritte Punkt ist der praktisch folgenreichste und wird, soweit ersichtlich, nirgends gezogen:
    Wenn der Digital Omnibus den relativen Personenbezug kodifiziert, hilft das dem Modellanbieter gerade
    nicht. Für die Stelle, die auf den Daten trainiert hat, sind die Zuordnungsmittel definitionsgemäß
    vorhanden — nach der Logik von C-413/23 P sind die Daten für sie nie anonym. Die Relativierung hilft
    dem Kunden, der die Gewichte erhält. Der Omnibus, als Entlastung der KI-Entwickler verkauft, spaltet
    damit die Wertschöpfungskette: personenbezogen beim Entwickler, möglicherweise anonym beim Erwerber.
    Das ist das Gegenteil dessen, was die Branche für die Lizenzierung braucht.

    '
