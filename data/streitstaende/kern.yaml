  - position: Positive Einzelerlaubnis mit Verfallsdatum — das französische Experiment
    gericht: Conseil constitutionnel, Décision n° 2023-850 DC vom 17.05.2023; ergänzend n° 2019-796 DC
      vom 27.12.2019 und n° 2026-915 DC vom 14.08.2026
    begruendung: 'Frankreich erlaubt, was es erlauben will, und nur das. Art. 10 der loi n° 2023-380 gestattet
      versuchsweise die algorithmische Auswertung rechtmäßig erhobener Bilder auf „événements prédéterminés“,
      nach präfektoraler Einzelgenehmigung, ohne biometrische Identifizierung, ohne Gesichtserkennung,
      ohne Verknüpfung mit anderen Dateien, ohne eigene Entscheidungswirkung und unter ständiger menschlicher
      Kontrolle. Der Conseil constitutionnel hat das 2023 mit einem Auslegungsvorbehalt gebilligt (Rn.
      37-45): Einsatz nur bei besonderer Gefährdung, nicht bei bloßem Sachschadensrisiko, und unverzügliche
      Beendigung, sobald die Voraussetzungen entfallen. Schon 2019 hatte er in der Entscheidung zur automatisierten
      Auswertung sozialer Netzwerke durch die Finanzverwaltung das Verbot der Gesichtserkennung als Bedingung
      der Verfassungskonformität formuliert. Die Experimentierklausel lief am 31.03.2025 aus; die erste
      Verlängerung scheiterte am 24.04.2025 als cavalier législatif, ohne materielle Prüfung. Art. 19
      der LOI n° 2026-798 (RIPOST) hat sie am 18.08.2026 reaktiviert, bis zum 31.12.2030 verlängert und
      auf politische Veranstaltungen, durch Ministerialerlass bezeichnete Orte und den öffentlichen Verkehr
      ausgeweitet; Art. 19 bis schafft daneben erstmals ein Experiment im privaten Einzelhandel bis zum
      31.12.2027, mit Genehmigung durch die CNIL statt durch den Präfekten. Der Conseil constitutionnel
      hat diese Verstetigung nicht materiell geprüft — die Antragsteller hatten die VSA-Artikel nicht
      angegriffen.

      '
