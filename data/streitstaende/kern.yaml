  - position: Guter Glaube entlastet nicht — Rüge und Abgabe an die Kammer statt gerichtlicher Sanktion
    gericht: Cámara de Apelación en lo Civil y Comercial de Rosario, Sala II, 25.08.2025; Superior Tribunal
      de Justicia de Río Negro, 09.04.2026 (IPROSS); Corte Suprema de Justicia de Colombia, Sala de Casación
      Civil, Agraria y Rural, AC739-2026 vom 13.02.2026
    begruendung: 'Der lateinamerikanische Regelfall ist ein zweistufiges Modell ohne Geldfolge: Das Gericht
      stellt fest, dass die Fundstellen nicht existieren, spricht eine Rüge oder eine förmliche Verwarnung
      aus und unterrichtet die Anwaltskammer; die Disziplinarfolge bleibt dem Berufsstand überlassen.
      Der tragende Rechtssatz ist knapp und reicht weit — guter Glaube entlastet nicht, die Verifikationspflicht
      ist unteilbar, und die Delegation der Recherche an ein experimentelles Werkzeug ohne Überprüfung
      ist „sumamente riesgoso y hasta temerario". Das entspricht der amerikanischen Linie seit Mata v.
      Avianca, kommt aber ohne Rule 11 aus: Die Gerichte greifen unmittelbar auf das Standesrecht und
      auf die zivilrechtliche Generalklausel von Treu und Glauben zu. Kolumbien hebt die Position auf
      die höchstrichterliche Ebene und fügt einen gesteigerten Sorgfaltsmaßstab hinzu — die Einführung
      unechter Inhalte kann prozessuale Leichtfertigkeit (temeridad) begründen. Ein wiederkehrender und
      bislang unbeschriebener Befund verbindet die Fälle: Erfunden werden bevorzugt Entscheidungen desjenigen
      Gerichts, bei dem der Schriftsatz eingereicht wird. Das ist kein Zufall, sondern eine Eigenschaft
      des Verfahrens.

      '
