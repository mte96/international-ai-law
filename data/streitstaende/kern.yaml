  - position: Gesetz statt Selbstverwaltung — Richtervorbehalt und Hochrisiko-Regime
    stelle: Italien, Art. 15 Legge 132/2025; Europäische Union, Anhang III Nr. 8 und Art. 74 Abs. 8 KI-VO;
      Dänemark, Lov nr. 467/2025; Deutschland, KI-MIG
    begruendung: 'Italien ist die einzige Rechtsordnung mit einer gesetzlichen Regelung: Nach Art. 15
      Abs. 1 Legge 132/2025 ist beim Einsatz von KI-Systemen in der Justiztätigkeit jede Entscheidung
      über die Auslegung und Anwendung des Rechts stets dem Magistrat vorbehalten; Abs. 2 weist die Regelung
      des Einsatzes für Organisation und Verwaltungstätigkeit dem Justizministerium zu, Abs. 3 macht Erprobungen
      in den ordentlichen Gerichten von dessen Genehmigung abhängig. Auf Unionsebene stuft Anhang III
      Nr. 8 lit. a KI-VO Systeme, die Justizbehörden bei der Ermittlung und Auslegung von Sachverhalten
      und Rechtsvorschriften und bei der Rechtsanwendung unterstützen, als Hochrisiko ein — mit Anwendungsbeginn
      erst am 02.12.2027 nach der Verschiebung durch die Verordnung (EU) 2026/1744. Art. 74 Abs. 8 KI-VO
      verlangt dafür eine unabhängige Marktüberwachungsbehörde, und die Mitgliedstaaten beantworten die
      Frage, wer die Justiz beaufsichtigt, gegensätzlich: Dänemark weist sie der Gerichtsverwaltung selbst
      zu (Domstolsstyrelsen), Spanien dem Richterrat, Deutschland der unabhängigen Marktüberwachungskammer
      bei der Bundesnetzagentur.

      '
