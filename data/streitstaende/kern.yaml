  - position: Die Prüfpflicht ist eine eigenständige Berufspflicht — Fahrlässigkeit genügt, der Ausgang
      der Hauptsache ist unerheblich
    gericht: High Court of South Africa, Gauteng Division, Johannesburg (DJ Smit AJ), 30.06.2025 – [2025]
      ZAGPJHC 661 (Northbound Processing)
    begruendung: 'Die dogmatisch schärfste der südafrikanischen Entscheidungen und die deutlichste Gegenposition
      zur englischen Linie. Sie verortet die verletzte Pflicht nicht in der Wahrheitspflicht gegenüber
      dem Gericht, sondern in der Sorgfalt bei der Werkzeugwahl: Wer trotz der bekannten Risiken KI zur
      Recherche einsetzt, hat „a professional duty to check the accuracy" vor der Verwendung (Rz. 93 lit.
      b). Sie stellt zweitens klar, dass bereits Fahrlässigkeit „grave repercussions particularly to the
      administration of justice" haben und unter Umständen „serious professional misconduct" darstellen
      kann — während Ayinde darauf abstellt, ob das Gericht bewusst getäuscht wurde. Und sie zeigt drittens,
      dass die Sanktion vom Ausgang der Hauptsache unabhängig ist: Die Antragstellerin hat in der Sache
      obsiegt, die sofortige Herausgabe der Raffinierlizenz erstritten — und ihre Vertreter wurden gleichwohl
      an den Legal Practice Council überwiesen. Das ist die Konstruktion, die in Rechtsordnungen ohne
      Kostensanktion die einzige wirksame bleibt.

      '
