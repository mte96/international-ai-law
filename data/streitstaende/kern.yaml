  - position: Dreiteilung nach dem realen Opfer — und die Last der forensischen Herkunftsbestimmung
    gericht: Cámara de Apelación y Garantías en lo Penal del Departamento Judicial Zárate-Campana, Provincia
      de Buenos Aires, 19.06.2025 – Causa N.º 27.969
    begruendung: 'Die differenzierteste Entscheidung des Bestandes zu dieser Frage, und sie widerlegt
      die verbreitete Kurzfassung, ein argentinisches Gericht habe rein synthetische Darstellungen unter
      Art. 128 Código Penal subsumiert. Die Kammer unterscheidet drei Konstellationen: Bei ausschließlich
      KI-generierten Darstellungen ohne reales Opfer sei die Strafbarkeit nach Art. 128 zweifelhaft, in
      Betracht komme eher Art. 213 CP (apología del delito); werden Gesichter realer Minderjähriger mit
      synthetisch erzeugten Körpern kombiniert, greift Art. 128, weil reale Opfer existieren und deren
      sexuelle Integrität verletzt wird; und prozessual folgt daraus eine Beweisanforderung — vor der
      Hauptverhandlung ist forensisch zu klären, ob die Bilder echt, verändert oder vollständig synthetisch
      sind, die bloße Inaugenscheinnahme genügt nicht. Argentinien steht damit an derselben Weggabelung
      wie das deutsche Recht bei § 184b StGB und der amerikanische Streit um Ashcroft v. Free Speech Coalition
      — schützt der Tatbestand das konkrete Kind oder ein überindividuelles Rechtsgut? Die Kammer entscheidet
      sich für das konkrete Kind und verlagert damit die gesamte Last auf die forensische Herkunftsbestimmung.
      Das ist die praktisch folgenreichste Aussage: Wer synthetische Darstellungen nur über das reale
      Opfer erfasst, macht die Strafbarkeit von einem Beweis abhängig, der mit besseren Modellen immer
      schwerer zu führen ist. Die weite Auslegung des Begriffs „representación" stützt die Kammer ergänzend
      auf das Fakultativprotokoll zum Kinderrechtsübereinkommen („reales o simuladas") und auf das Budapester
      Übereinkommen.

      '
    urteile:
    - ar-2025-zarate-campana-paz-art128
  aufloesung: 'Eine Auflösung ist nicht zu erwarten — die Divergenz beruht auf unterschiedlichen Verfassungstraditionen,
    nicht auf einem Auslegungsstreit.

    '
  eigene_bewertung: 'Der Fall zeigt die Grenze rechtsvergleichender Angleichung. Für Anbieter mit globalem
    Angebot bedeutet er, dass Filterarchitekturen nicht nach dem strengsten, sondern nach dem jeweils
    anwendbaren Recht ausgelegt werden müssen — mit der Folge, dass dieselbe Funktion in Chicago erlaubt
    und in Karlsruhe strafbar sein kann.

    '
