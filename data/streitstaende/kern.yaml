  stand: 'Der praktisch wichtigste Auslegungsstreit der Verordnung, und er wird derzeit von niemandem
    entschieden. Die Kommission hat die nach Art. 6 Abs. 5 KI-VO geschuldeten Leitlinien am 19.05.2026
    als Entwurf vorgelegt — mehr als drei Monate nach der ursprünglichen Frist des 02.02.2026; die Konsultation
    lief bis zum 23.07.2026 (verlängert vom 23.06.2026), die Endfassung ist für Ende 2026 angekündigt.
    Zugleich hat der Digital Omnibus on AI die Hochrisiko-Pflichten für Anhang III auf den 02.12.2027
    verschoben. Es gibt damit eine Norm, keine verbindliche Auslegung und keine Anwendungspflicht — aber
    bereits eine Registrierungspflicht für den, der sich auf die Ausnahme beruft.

    '
  positionen:
  - position: Enge Auslegung, abschließender Katalog, Registrierung trotz Ausnahme
    stelle: Europäische Kommission, Entwurfsleitlinien zur Einstufung von Hochrisiko-KI-Systemen vom 19.05.2026
    begruendung: 'Die vier Ausnahmetatbestände — eng gefasste Verfahrensaufgabe, Verbesserung des Ergebnisses
      einer zuvor abgeschlossenen menschlichen Tätigkeit, Erkennung von Entscheidungsmustern oder Abweichungen
      davon, rein vorbereitende Aufgabe — sind abschließend. Entscheidend ist in allen vier Fällen, dass
      das System das Ergebnis der Entscheidungsfindung nicht wesentlich beeinflusst. Der Filter steht
      nicht zur Verfügung, wenn das System ein Profiling natürlicher Personen vornimmt (Art. 6 Abs. 3
      UAbs. 2) — was Bewerberauswahl, Kreditvergabe und Migrationsanwendungen praktisch ausschließt. Auch
      wer sich auf die Ausnahme beruft, muss vor dem Inverkehrbringen eine dokumentierte Selbstbewertung
      vornehmen und das System in der EU-Datenbank registrieren.

      '
    belege:
    - Kommission, Entwurf der Leitlinien zur Einstufung von Hochrisiko-KI-Systemen, 19.05.2026, Konsultation
      bis 23.07.2026 — Dokumentnummer nicht ermittelt
  - position: Der Omnibus entschärft die Nachbarnorm, nicht die Streitnorm
    stelle: Verordnung (EU) 2026/1744 (Digital Omnibus on AI) vom 08.07.2026
    begruendung: 'Die Verordnung ändert Art. 6 Abs. 1 KI-VO: Systeme, die allein der Nutzerunterstützung,
      Leistungsoptimierung, Dienstleistungseffizienz, Automatisierung, Bequemlichkeit oder Qualitätskontrolle
      in nicht sicherheitsbezogener Hinsicht dienen, sind keine Sicherheitsbauteile. Art. 6 Abs. 3 selbst
      bleibt unangetastet. Die Registrierungspflicht bei behaupteter Ausnahme wird nicht abgeschafft,
      sondern über eine Straffung des Anhangs VIII vereinfacht. Wer den Omnibus als Entlastung bei der
      Anhang-III-Ausnahme liest, verwechselt zwei Absätze derselben Vorschrift.

      '
