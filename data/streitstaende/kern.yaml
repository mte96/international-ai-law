  eigene_bewertung: 'Das ist die technisch anspruchsvollste Frage des gesamten Feldes und diejenige, bei
    der juristische Expertise ohne technisches Verständnis am schnellsten an ihre Grenze kommt. Wer erklären
    kann, was ein Parameter tatsächlich speichert und unter welchen Bedingungen Memorisierung auftritt,
