  - position: Die Zurechnung trägt nur als Hilfskonstruktion — und sie steht ohne behördliche Rückendeckung
    gericht: N.D. Cal. selbst, soweit die Ansprüche gescheitert sind (19.01.2024, 12.07.2024, 22.06.2026);
      Schrifttum, Chang (SSRN 6835178)
    begruendung: 'Was in Mobley gescheitert ist, wird selten mitzitiert und ist für die Prognose wichtiger
      als das, was überlebt hat. Ohne Nachbesserungsmöglichkeit abgewiesen sind die Einordnung als „employment
      agency" und sämtliche Ansprüche wegen vorsätzlicher Diskriminierung nach Title VII, ADEA und § 1981;
      am 22.06.2026 fiel zusätzlich die Konstruktion einer unmittelbaren Arbeitgeberstellung. Algorithmische
      Diskriminierung ist im US-Recht damit ausschließlich ein disparate-impact-Problem — und genau diese
      Rechtsfigur steht politisch unter Druck. Chang zeigt die zweite Bruchstelle: Nach dem Wegfall der
      Chevron-Deference müssen die Gerichte die Agenteneigenschaft selbst bestimmen und können sich nicht
      auf die Auslegung der EEOC stützen; Lin hat sie nur über Skidmore gerettet. Hinzu kommt die territoriale
      Begrenzung: Der bloße kalifornische Sitz des Anbieters genügt nicht für die Anwendung des FEHA auf
      Bewerber aus anderen Bundesstaaten. Wer Mobley als geltendes Recht behandelt, überzieht — es ist
      eine erstinstanzliche Auslegung ohne behördliche Rückendeckung und ohne Berufungsentscheidung.

      '
    urteile:
    - us-2026-mobley-workday-sac
  - position: Der Auskunftsanspruch ist kollektiv — und wirksam nur im Grundrechtsverfahren
    gericht: Audiencia Nacional, Sala de lo Social, Sentencia 101/2025 vom 04.07.2025 (Foundever)
    begruendung: 'Nicht der Wortlaut der Auskunftsnorm entscheidet über ihre Wirksamkeit, sondern die
      Verfahrensart. Die Gewerkschaft hat nicht die Arbeitsaufsicht eingeschaltet, sondern das Verfahren
      zum Schutz der Grundrechte gewählt; damit gilt die Beweislastumkehr, es gibt immateriellen Schadensersatz
      — hier 6.250 Euro —, und die Verweigerung der Parameter wird aus dem Ordnungswidrigkeitenrecht in
      das Verfassungsrecht gehoben: Sie verletzt die Koalitionsfreiheit. Dieselbe Norm ist als Ordnungswidrigkeit
      nahezu wirkungslos und als Grundrechtseingriff scharf. Für die Umsetzung der Plattformarbeitsrichtlinie
      bis zum 02.12.2026 ist das die praktisch wichtigste Vorlage in Europa. Der Fall zeigt zugleich die
      strukturelle Schwäche aller algorithmischen Auskunftsrechte: Das Unternehmen bestritt schlicht,
      Algorithmen einzusetzen; ohne die Aussage des eigenen Produktionsleiters wäre der Anspruch an der
      Darlegungslast gescheitert.

      '
    urteile:
    - es-2025-foundever
  - position: Die Wirkung des Systems ist Weisung — die Statusfrage geht der Transparenzfrage vor
    gericht: Tribunal Supremo, Sala de lo Social (Pleno), Sentencia 805/2020 vom 25.09.2020; Audiencia
      Nacional, Sala de lo Contencioso-Administrativo, 16.07.2025; Suprema Corte de Justicia de Buenos
      Aires, 16.04.2026
    begruendung: 'Der Tribunal Supremo hat als erstes Höchstgericht Europas ausgesprochen, dass algorithmische
      Anreizsteuerung rechtlich Weisung ist, auch wenn sie formal nur eine Rangfolge verändert: Die formale
      Freiheit, Aufträge abzulehnen, wird durch die algorithmischen Folgen der Ablehnung entwertet. Maßgeblich
      ist die Wirkung des Systems, nicht seine juristische Selbstbeschreibung — dieselbe Figur, die die
      Foundever-Entscheidung trägt. Die Grenze zeigt der Fall Glovo selbst: Nach einer Modelländerung
      hat ein Verwaltungsgericht 2024 die kodifizierte Vermutung für widerlegt gehalten, bevor die Audiencia
      Nacional sie 2025 wiederhergestellt hat. Argentinien erreicht dasselbe Ergebnis ohne Sondernorm
      über die allgemeine Beschäftigungsvermutung des Art. 23 LCT. Die Lehre lautet, dass die Statusfrage
      der Transparenzfrage vorgelagert ist: Wer nicht Arbeitnehmer ist, hat weder Betriebsrat noch Auskunftsanspruch
      — und die Vermutungsregel verlagert den Streit, statt ihn zu beenden.

      '
