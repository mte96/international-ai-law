  - position: Die Sprechereigenschaft wird vom Anbieter behauptet — zur Abwehr von Regulierung
    gericht: D. Colo., xAI ./. Weiser, Klage vom 09.04.2026; die Vereinigten Staaten am 24.04.2026 auf
      Klägerseite beigetreten
    begruendung: 'xAI hält dem Colorado AI Act entgegen, die Pflicht zur Vermeidung algorithmischer Diskriminierung
      zwinge zur Aufgabe eines an objektiver Wahrheit orientierten Systemverhaltens und verletze damit
      die Meinungsfreiheit. Das verlangt zwei Schritte, die beide ungesichert sind: dass Modellausgaben
      Rede sind, und dass Diskriminierungsvermeidung eine inhaltliche Steuerung dieser Rede ist. Gelänge
      der erste, wäre es die erste gerichtliche Bejahung der Sprechereigenschaft von Modellen überhaupt
      — erstritten von einem Anbieter, der sie im Haftungsprozess gegen sich gelten lassen müsste. Eine
      Entscheidung über die einstweilige Verfügung liegt nicht vor; Colorado hat SB 24-205 inzwischen
      durch das engere SB 26-189 ersetzt.

      '
    urteile:
    - us-2026-xai-weiser
  aufloesung: 'Der Vergleich vom 07.01.2026 hat Garcia der Überprüfung entzogen. Die Fragen wandern in
    JCCP 5431 vor dem Superior Court in San Francisco und in Lyons v. OpenAI. Kurios: Die erste Bejahung
    könnte aus xAI v. Weiser kommen, wo der Anbieter die Sprechereigenschaft selbst behauptet, um Regulierung
    abzuwehren.

    '
  eigene_bewertung: 'Hier liegt die größte offene Frage des US-KI-Rechts, und sie wird voraussichtlich
    von einem Anbieter aufgeworfen, der sich gegen Regulierung wehrt — nicht von einem Kläger. Wer die
    Sprechereigenschaft zur Abwehr behauptet, muss sie im Haftungsprozess gegen sich gelten lassen. Diese
    Wechselwirkung ist bislang unbeschrieben.

    '
