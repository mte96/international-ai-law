  fehlende_belege:
  - Für beide israelischen Entscheidungen fehlt die amtliche Fundstelle. Geführt sind Sekundärquellen
    (law.co.il). Amtlich wäre die Veröffentlichung des Zentralen Wahlausschusses; sie ist zu beschaffen,
    bevor eine der beiden zitiert wird.
  - Der hebräische Wortlaut ist nicht gelesen; die Wiedergabe beruht auf der deutschen Zusammenfassung
    im Eintrag.
  - Ob gegen Kohls Berufung eingelegt wurde, ist nicht geprüft.
