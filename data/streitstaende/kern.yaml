  fehlende_belege:
  - 'Entwurf der Kommissionsleitlinien zur Einstufung von Hochrisiko-KI-Systemen vom 19.05.2026: Nicht
    als Dokument erfasst; eine C(2026)-Dokumentnummer wurde nicht ermittelt. Inhalt hier über Kanzlei-
    und Fachberichterstattung sowie die Konsultationsseite der Kommission belegt, nicht am Entwurfstext
    selbst.'
  - Art. 6 Abs. 4 und Art. 6 Abs. 5 KI-VO sowie Art. 49 Abs. 2 KI-VO (Registrierung bei behaupteter Ausnahme)
    fehlen im Normenverzeichnis. Erfasst ist nur Art. 49 Abs. 3 (Behörden als Betreiber).
  - Anhang III und Anhang VIII KI-VO sind nicht als Normeinträge angelegt, obwohl der Streitstand unmittelbar
    an ihnen hängt.
  - Wortlaut der durch VO (EU) 2026/1744 eingefügten Absätze zu Art. 6 KI-VO ist hier über die englische
    Amtsblattfassung wiedergegeben; die deutsche Fassung wurde nicht gegengelesen. Ob der Omnibus Art.
    6 Abs. 3 mittelbar über Erwägungsgründe berührt, ist ungeprüft.
  - Das Ergebnis der Konsultation (Abschluss 23.07.2026) ist nicht veröffentlicht; die Zahl und Herkunft
    der Stellungnahmen ist unbekannt.
  - Ob und wie einzelne Mitgliedstaaten die Ausnahme in ihren Durchführungsgesetzen sanktionieren, ist
    nur für Spanien (Anteproyecto, Art. 14 bis 22) abgebildet; für Deutschland, Italien und Griechenland
    fehlt die Gegenprüfung.
