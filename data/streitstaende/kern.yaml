- id: zugangsschranken-ki-agenten
  titel: Zugangsschranken gegen KI-Agenten
  frage: Wer greift auf einen fremden Rechner zu, wenn ein KI-Agent im Auftrag eines Nutzers handelt —
    und ist eine robots.txt-Datei oder ein CAPTCHA eine wirksame technische Schutzmaßnahme?
