  - position: Südafrika als einziger Erteilungsstaat — eine Verfahrens-, keine Rechtsposition
    stelle: Companies and Intellectual Property Commission, Patent ZA 2021/03242, Patent Journal Juli
      2021
    begruendung: 'Südafrika wird international als die einzige Rechtsordnung zitiert, die ein Patent mit
      einer KI als Erfinder erteilt hat. Das ist richtig und zugleich irreführend: Die CIPC führt keine
      materielle Prüfung durch, sondern eine reine Formalprüfung. Die Erteilung enthält keine Entscheidung
      über die Erfinderfähigkeit einer Maschine und keine Begründung. Wer Südafrika als abweichende Rechtsauffassung
      anführt, verwechselt das Fehlen einer Prüfung mit dem Ergebnis einer Prüfung.

      '
    belege:
    - Südafrika, ZA 2021/03242, Patent Journal Juli 2021 — nicht am Primärdokument verifiziert
  - position: Deutscher Mittelweg — Mensch benennen, KI-Beteiligung offenlegen
    gericht: Bundesgerichtshof, X. Zivilsenat, Beschl. v. 11.06.2024 – X ZB 5/22 (DABUS)
    begruendung: 'Erfinder im Sinne des § 37 Abs. 1 PatG kann grundsätzlich nur eine natürliche Person
      sein. Zulässig ist aber die Benennung des Menschen mit dem Zusatz, er habe die künstliche Intelligenz
      DABUS veranlasst, die Erfindung zu generieren. Damit muss der Anmelder weder verschweigen, was tatsächlich
      geschehen ist, noch eine unrichtige Angabe machen. Die Vorinstanz, BPatG 11 W (pat) 5/21 vom 11.11.2021,
      hatte den dritten Hilfsantrag gebilligt und an das DPMA zurückverwiesen.

      '
    belege:
    - BGH, Beschl. v. 11.06.2024 – X ZB 5/22; Vorinstanz BPatG, Beschl. v. 11.11.2021 – 11 W (pat) 5/21
      (beide im Bestand nicht erfasst)
  - position: Der Mensch muss zu jedem Anspruch einen erheblichen Beitrag geleistet haben
    stelle: USPTO, Inventorship Guidance for AI-Assisted Inventions, 89 FR 10043, 13.02.2024
    begruendung: 'KI-unterstützte Erfindungen sind patentfähig, aber nur, wenn eine natürliche Person
      zu jedem beanspruchten Gegenstand einen erheblichen Beitrag geleistet hat. Der Maßstab wurde den
      Pannu-Faktoren aus dem Recht der Miterfinderschaft entnommen und auf das Verhältnis Mensch/Maschine
      übertragen. Praktische Folge war eine Prüfung des menschlichen Beitrags bereits im Erteilungsverfahren.

      '
    belege:
    - USPTO, 89 FR 10043 (13.02.2024) — aufgehoben durch 90 FR 54636
  - position: Kehrtwende — KI ist ein Werkzeug, die Pannu-Faktoren gelten nicht
    stelle: USPTO, Revised Inventorship Guidance for AI-Assisted Inventions, 90 FR 54636, 28.11.2025
    begruendung: 'Die Guidance von 2024 wird vollständig aufgehoben. Die Pannu-Faktoren sind ausschließlich
      für die Frage anzuwenden, ob mehrere natürliche Personen Miterfinder sind, nicht für das Verhältnis
      eines Menschen zu einem KI-System. Es gilt der einheitliche Conception-Maßstab für alle Erfindungen,
      unabhängig vom KI-Einsatz; KI-Werkzeuge werden ausdrücklich mit Laborgeräten, Software und Forschungsdatenbanken
      gleichgestellt. Der Mensch muss eine bestimmte, gefestigte Idee haben und die Erfindung mit Bestimmtheit
      beschreiben können.

      '
    belege:
    - us-uspto-erfinderschaft
  - position: In Europa stellt die Frage niemand
    stelle: EPA und nationale Ämter, Praxis zu Art. 81 und Regel 19 EPÜ
    begruendung: 'Die Erfinderbenennung ist eine Erklärung des Anmelders, deren inhaltliche Richtigkeit
      das Amt nicht überprüft. Eine der USPTO-Leitlinie entsprechende Vorgabe zum hinreichenden menschlichen
      Beitrag existiert nicht. Die Frage stellt sich deshalb erst nachträglich im Vindikations- oder Nichtigkeitsverfahren
      — und dann mit umgekehrter Beweislast und ohne Aktenlage. Das ist keine Gegenposition zur amerikanischen,
      sondern eine Verlagerung des Problems aus dem Verwaltungs- in das Streitverfahren.

      '
    belege:
    - Art. 81 und Regel 19 EPÜ — Praxis in dieser Sitzung nicht am Primärtext verifiziert
  - position: Der Wortlaut trägt die Maschine — die Klage scheitert am Zweck und an der Kompetenzordnung
    gericht: High Court of New Zealand / Te Kōti Matua o Aotearoa, Wellington (Palmer J), 17.03.2023 –
      Thaler v Commissioner of Patents [2023] NZHC 554; [2023] 2 NZLR 603
    begruendung: 'Soweit ersichtlich die einzige Rechtsordnung, in der ein Gericht ausdrücklich eingeräumt
      hat, dass der Gesetzeswortlaut eine maschinelle Erfinderbenennung trägt, und die Klage gleichwohl
      abgewiesen hat. Palmer J hält s. 22 Patents Act 2013 — anders als die früheren neuseeländischen
      Patentgesetze — für weit genug; Patentinhaber könne ohnehin eine andere Person als der Erfinder
      sein, und die Vorschriften, die eine Person voraussetzen, verfolgten andere Zwecke. Entscheidend
      sei deshalb der Gesetzeszweck, und die Entstehungsgeschichte von 2013 enthalte nichts, was auf eine
      gewollte Öffnung hindeute; die betreffende Änderung habe verhindern sollen, dass Importeure als
      Erfinder gelten. Eine Erweiterung der Erfinderdefinition sei nach der neuseeländischen Verfassungsordnung
      dem Parlament vorbehalten. Der Unterschied zum britischen Supreme Court und zum australischen Full
      Court, die begrifflich argumentieren, ist für die Reichweite des Präjudizes erheblich: Wo der Wortlaut
      trägt, genügt eine gesetzgeberische Klarstellung; wo er entgegensteht, braucht es eine Gesetzesänderung.

      '
    urteile:
    - nz-2023-thaler-commissioner-patents
  - position: Nicht das Patentrecht entscheidet, sondern die Rechtsfähigkeit — und die Übertragbarkeit
      des Anmelderechts
    gericht: 智慧財產及商業法院 — Intellectual Property and Commercial Court, 19.08.2021 (110年度行專訴字第3號) und 06.10.2021
      (110年度行專訴字第4號); bestätigt durch 最高行政法院 — Oberster Verwaltungsgerichtshof, 21.07.2022 (111年度上字第55號)
    begruendung: 'Taiwan gehört zu den ersten Rechtsordnungen mit einer letztinstanzlichen Entscheidung
      zur KI-Erfinderschaft — der Oberste Verwaltungsgerichtshof hat im Juli 2022 entschieden, anderthalb
      Jahre vor dem UK Supreme Court. Der Weg der Begründung ist ein anderer als überall sonst. Das erste
      Verfahren argumentiert aus dem Zivilrecht: Nach §§ 6, 16 und 18 民法 beginnt die Rechtsfähigkeit mit
      der Geburt; Erfinder könne deshalb nur eine natürliche Person sein, die zu den technischen Merkmalen
      der Ansprüche einen wesentlichen geistigen Beitrag geleistet hat. Das Parallelverfahren ist dogmatisch
      das stärkere und argumentiert aus dem Patentrecht selbst: Weil das Anmelderecht nach §§ 5 Abs. 2,
      6 Abs. 1 und 7 Abs. 4 專利法 übertragbar und vererblich ist, muss sein Inhaber rechtsfähig sein — ein
      Argument, das auch in Rechtsordnungen trägt, deren Zivilrecht die Rechtsfähigkeit anders konstruiert.
      Der Oberste Verwaltungsgerichtshof ergänzt, das Namensnennungsrecht des Erfinders sei ein Persönlichkeitsrecht.
      Verfahrensrechtlich bemerkenswert: Das TIPO hat beide Anmeldungen über § 17 Abs. 1 專利法 als nicht
      angenommen behandelt und damit eine materielle Zurückweisung vermieden — ein Kunstgriff, den weder
      das EPA noch das UKIPO gewählt haben.

      '
