  aufloesung: 'Die Statusfrage ist erledigt; offen ist weltweit nur noch der koreanische Instanzenzug
    (Revision 2024두45177 beim Obersten Gerichtshof, am 04.09.2026 nicht entschieden). Die Beitragsfrage
    entscheiden nicht Gerichte, sondern Ämter und Gesetzgeber: in den Vereinigten Staaten die Guidance-Praxis,
    die sich binnen 21 Monaten umgekehrt hat und mit der nächsten Behördenleitung wieder umkehren kann;
    in Europa niemand, weil kein Amt die Frage stellt. Der erste europäische Fall wird kein Erteilungsverfahren
    sein, sondern ein Vindikationsstreit, in dem ein Arbeitgeber, ein Zulieferer oder ein Modellanbieter
    behauptet, sein System habe den erfinderischen Schritt geliefert. Die WIPO Conversation on IP and
    Frontier Technologies läuft ohne Ergebnis.

    '
  eigene_bewertung: 'DABUS war ein Testfall, der verlieren sollte: Thaler hat ausdrücklich erklärt, kein
    Mensch habe beigetragen. Alle Gerichte haben genau diese Frage beantwortet — und deshalb folgt aus
    keiner dieser Entscheidungen etwas für die Fälle, die es tatsächlich gibt. Die interessante Asymmetrie
    liegt anderswo. Die Vereinigten Staaten prüfen den menschlichen Beitrag im Erteilungsverfahren, Europa
    nie, weil Art. 81 und Regel 19 EPÜ die Erfinderbenennung zu einer ungeprüften Erklärung machen. Dieselbe
    Erfindung hat damit in Washington ein Erfinderproblem und in München keines — aber das europäische
    Problem taucht später und schärfer auf, nämlich im Vindikationsstreit, in dem die Darlegungslast bei
    einer Partei landet, die keine Aufzeichnungen darüber hat, welche Rolle das Modell gespielt hat. Die
    praktische Konsequenz ist deshalb keine patentrechtliche, sondern eine dokumentarische: Wer aus einem
    KI-gestützten Projekt ein belastbares europäisches Patent behalten will, braucht eine zeitnahe Aufzeichnung
    des menschlichen Konzeptionsschritts. Kaum jemand führt sie. Der zweite, übersehene Befund: BGH X
    ZB 5/22 ist die weltweit praktikabelste Lösung und wird außerhalb Deutschlands kaum zitiert. Sie trennt
    die Benennung — die einen Menschen nennen muss — von der Wahrheit über den Vorgang, die offengelegt
    werden darf, und zwingt den Anmelder nicht zur Falschangabe. Die USPTO-Wende von 2025 erreicht dasselbe
    Ergebnis auf dem entgegengesetzten Weg: Indem sie die KI zum Werkzeug erklärt, muss der Anmelder gar
    nicht mehr erklären, was die Maschine getan hat. Beide Systeme machen die Frage nach dem hinreichenden
    Beitrag damit bewusst unbeantwortbar — das eine durch folgenlose Offenlegung, das andere durch Verzicht
    auf Offenlegung. Das ist eine rechtspolitische Entscheidung, die niemand ausspricht.

    '
