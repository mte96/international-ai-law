  aufloesung: 'Die amerikanische Regelsetzung läuft: Die Kommentierungsfrist zu

    FRE 707 endet planmäßig im Februar 2027, danach entscheiden Advisory

    Committee, Standing Committee, Judicial Conference und Supreme Court.

    Ein Inkrafttreten vor Dezember 2028 ist ausgeschlossen. Bis dahin

    entscheidet jedes Gericht für sich.


    Für Europa ist die Frage in der KI-VO nicht geregelt und im

    Prozessrecht der Mitgliedstaaten nicht gestellt. Der erste Fall wird

    wahrscheinlich kein KI-Beweis sein, sondern ein Echtheitseinwand

