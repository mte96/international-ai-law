  stand: 'Zwei Fragen, die zusammengehoeren, und auf beide gibt es weltweit keine gemeinsame Antwort.
    Der zeitweilig schaerfste Pol ist inzwischen kassiert: Die Camara Penal de Esquel hatte ein Strafurteil
    wegen undeklarierten KI-Einsatzes fuer nichtig erklaert, der Superior Tribunal de Justicia del Chubut
    hat diese Nichtigkeitserklaerung am 13.03.2026 aufgehoben und das erstinstanzliche Urteil validiert.
    Damit reicht das Feld von der Nichtigkeit des Urteils (Bogota) ueber die Ruege ohne Kassation (Corte
    Constitucional) und die formlose Ruecknahme durch das erlassende Gericht selbst (New Jersey, Mississippi)
    bis zur ausdruecklichen Unbeachtlichkeit mangels Norm (Krasnodar) — und mit Chubut bis zu der Aussage,
    dass der Massstab die exteriorisierte Begruendung ist und nicht das benutzte geistige Werkzeug. Zur
    Zulaessigkeit steht ein einziger Gesetzesvorbehalt (Art. 15 Legge 132/2025) einer bindenden Rechtsprechung
    (Mexiko), einem Dutzend Selbstverwaltungsakte der Judikative und einem breiten normativen Vakuum gegenueber.'
  positionen:
  - position: Nichtigkeit — die Entscheidung faellt
    gericht: Tribunal Superior de Bogota, Sala Penal
    begruendung: 'Bogota stellt auf die Fehlerhaftigkeit ab: Die mit KI erstellte Begruendung enthielt
      nicht existierende Entscheidungsnummern des Obersten Gerichtshofs, erfundene, realen Wissenschaftlern
      zugeschriebene Werke und Normverweise ohne Bezug zum kolumbianischen Recht. Angeordnet wurde eine
      vollstaendige Neuentscheidung auf ueberpruefbarer Grundlage. Nicht der Einsatz des Werkzeugs traegt
      die Nichtigkeit, sondern das Ergebnis: eine Begruendung, die auf nichts verweist.'
    urteile:
    - co-2025-tribunal-bogota
  - position: Massstab ist die exteriorisierte Begruendung, nicht das Werkzeug
    gericht: Superior Tribunal de Justicia del Chubut, 13.03.2026
    begruendung: Der Superior Tribunal hebt die Nichtigkeitserklaerung der Camara Penal de Esquel auf
      und validiert das erstinstanzliche Urteil. Kontrollgegenstand des Rechtsmittelgerichts sei die nach
      aussen tretende Begruendung, nicht das geistige Werkzeug, mit dem sie zustande kam; ein Verstoss
      gegen das Acuerdo Plenario 5435/2025 fuehre nicht automatisch zur Nichtigkeit. Das ist die schaerfste
      Gegenposition zu Bogota und zugleich die juengste Entscheidung des Feldes.
