  - position: Aufhebung der richterlichen Entscheidung wegen ungeprüfter Erzeugung
    gericht: Cámara de Apelación en lo Civil y Comercial de Azul, Provincia de Buenos Aires, 25.04.2026
    begruendung: 'Die Kammer hebt den erstinstanzlichen Beschluss auf, weil der Richter generative KI
      zur Abfassung benutzt und die erzeugten Inhalte nicht überprüft hatte: Die Begründung enthielt erfundene
      Entscheidungen, erfundene Werke und falsch bezeichnete Spruchkörper. Die Kammer erläutert das Halluzinationsphänomen
      ausdrücklich — Algorithmen ersetzten fehlende Information durch plausible, aber unzutreffende Schlüsse,
      wodurch Falsches wahr erscheine. Das ist die argentinische Gegenposition zu Chubut aus demselben
      Jahr: Dort trägt die exteriorisierte Begründung, hier fällt die Entscheidung gerade weil diese Begründung
      auf nichts verweist. Der Unterschied liegt nicht im Maßstab, sondern im Befund — Chubut fand keinen
      Substanzmangel, Azul fand ihn.'
    urteile:
