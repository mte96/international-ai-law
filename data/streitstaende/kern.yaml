  - position: Der Richter als Adressat — Rücknahme ohne Verfahren, außer in Kolumbien
    gericht: D.N.J. (Neals J), In re CorMedix Securities Litigation, 19.08.2025; S.D. Miss. (Wingate J),
      Jackson Federation of Teachers v. Fitch, 20.07.2025; United States Senate, Committee on the Judiciary,
      Oktober 2025; High Court of Gujarat, Faiz Enterprise, 20.08.2026; Supreme Court of India, SLP(C)
      No. 7575/2026; dagegen Tribunal Superior del Distrito Judicial de Bogotá, Sala Penal, 02.12.2025
    begruendung: 'Für die richterliche Halluzination existiert in den Vereinigten Staaten kein Verfahren.
      Neals J nahm die Entscheidung über den Abweisungsantrag — vier erfundene Entscheidungen, zwei unzutreffend
      wiedergegebene, ein Fehler in der Wiedergabe des Parteivortrags — durch Minute Order ohne Begründung
      zurück und erließ eine überarbeitete Fassung, ohne auf die frühere einzugehen; Wingate J nahm eine
      bereits wirksame einstweilige Anordnung in einem politisch aufgeladenen Verfahren zurück und erließ
      sie neu. Beide führten die Fehler gegenüber dem Justizausschuss des Senats auf Mitarbeiter zurück,
      die ChatGPT beziehungsweise Perplexity ohne Genehmigung eingesetzt hätten; die Untersuchung des
      Ausschusses ist die einzige institutionelle Reaktion weltweit. Der Gujarat High Court ist als bislang
      einziger dokumentierter Fall außerhalb der Vereinigten Staaten ohne jede Sanktion vermerkt, während
      der indische Supreme Court immerhin festgestellt hat, dass sich auf KI-erzeugte Scheinurteile gestützte
      Entscheidungen als Fehlverhalten mit rechtlichen Folgen darstellen. Nur Kolumbien knüpft eine Fehlerfolge
      an: Das Berufungsgericht erklärte ein Strafurteil insgesamt für nichtig, dessen Begründung nicht
      existierende Entscheidungsnummern des Obersten Gerichtshofs, erfundene und realen Wissenschaftlern
      zugeschriebene Werke sowie Normverweise ohne Bezug zum kolumbianischen Recht enthielt, ordnete die
      vollständige Neuentscheidung an und leitete die Sache an die Disziplinarbehörden weiter.

      '
