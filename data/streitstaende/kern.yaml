  stand: 'Die Frage ist 2026 aus zwei Richtungen zugleich aufgebrochen und wird

    in zwei getrennten Normsystemen geführt, die einander nicht kennen.


    Im Zugangsrecht hat der Ninth Circuit am 04.08.2026 die erste

    Berufungsentscheidung überhaupt zu KI-Agenten gefällt und die

    einstweilige Verfügung gegen Perplexity aufgehoben: Zugegriffen habe

    der Nutzer, der Agent sei sein Werkzeug. Das ist eine Weichenstellung

    mit Reichweite weit über den CFAA hinaus, weil sie die Zurechnung

    grundsätzlich beim Menschen belässt.


    Im Umgehungsschutz nach § 1201 DMCA läuft die Gegenbewegung: Der

    Southern District of New York prüft seit Dezember 2025, ob eine

    robots.txt-Datei und ob CAPTCHAs technische Zugangskontrollen sind.

    Wären sie es, ließe sich über den Umgehungstatbestand erreichen, was

    der Ninth Circuit über den Zugangstatbestand gerade versagt hat.


    Daneben steht die vertragsrechtliche Schiene: Reddit gegen Anthropic

    ist am 20.03.2026 an das kalifornische Gericht zurückverwiesen worden,

    weil die Ansprüche aus Nutzungsbedingungen und Delikt nicht

    urheberrechtlich verdrängt sind. Keine der drei Schienen ist

    abschließend geklärt.

    '
  positionen:
  - position: Der Nutzer greift zu, nicht der Anbieter des Agenten
    gericht: United States Court of Appeals for the Ninth Circuit, 04.08.2026 (Milan D. Smith Jr., Eric
      C. Tung, John C. Hinderaker)
    begruendung: Nach dem Sachverhalt hat Perplexity kein Werkzeug benutzt, um auf Amazons Rechner zuzugreifen;
      zugegriffen hat der Nutzer, mit Hilfe des Assistenten, um bestimmte Handlungen auf Amazon.com vorzunehmen.
      Damit fehlt es schon am Tatbestandsmerkmal des Zugriffs durch den Beklagten, und für den kalifornischen
      CDAFA gilt dasselbe aus demselben Grund. Der Agent ist rechtlich Werkzeug, nicht Akteur — eine Zurechnung
      an den Anbieter setzt voraus, dass er selbst zugreift.
    urteile:
    - us-2026-amazon-perplexity-9circuit
  - position: Technische Sperren sind Zugangskontrollen — der Umgehungsschutz greift, wo der Zugangstatbestand
      versagt
    gericht: United States District Court, Southern District of New York (anhängig, Ziff Davis und Reddit
      gegen SerpApi)
    begruendung: 'Wenn robots.txt und CAPTCHA technische Maßnahmen im Sinne von § 1201 DMCA sind, kommt
      es auf die Zurechnung des Zugriffs nicht an: Verboten ist dann bereits die Umgehung der Schranke,
      gleich wer hinter dem Agenten steht. Diese Konstruktion ist der eigentliche Gegenentwurf zum Ninth
      Circuit, weil sie den Rechteinhaber unabhängig davon schützt, ob ein Mensch oder eine Maschine handelt.'
    urteile:
    - us-2025-ziffdavis-openai-mtd
    - us-2026-reddit-serpapi
  - position: Vertrag und Delikt bleiben neben dem Urheberrecht bestehen
    gericht: United States District Court, Northern District of California, 20.03.2026 (Zurückverweisung
      an das Staatsgericht)
    begruendung: Ansprüche aus Nutzungsbedingungen und aus Delikt gegen das Scraping von Nutzerinhalten
      für KI-Training werden vom Bundesurheberrecht nicht verdrängt. Damit steht dem Plattformbetreiber
      ein Weg offen, der weder den CFAA noch § 1201 DMCA braucht — und der vor Staatsgerichten geführt
      wird, also außerhalb der Bundesrechtsprechung, die die beiden anderen Stränge prägt.
    urteile:
    - us-2026-reddit-anthropic-remand
  fehlende_belege:
  - Die amtliche PDF-Fassung des Ninth Circuit (cdn.ca9.uscourts.gov) ist im Browser nicht auslesbar;
    gelesen wurde die veröffentlichte Fassung bei CourtListener. Für ein Zitat in einer Veröffentlichung
    ist die amtliche Fassung heranzuziehen.
  - Zu Reddit gegen SerpApi liegt nur der Docket-Eintrag vor, keine Entscheidung im Volltext. Der Verfahrensstand
    ist nachzuhalten.
  - Ob der Ninth Circuit die Zurechnungsfrage auch dann so beantwortet, wenn der Agent ohne konkreten
    Nutzerauftrag handelt, ist offen — die Entscheidung stellt ausdrücklich auf den Sachverhalt ab.
