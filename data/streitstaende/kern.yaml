  - position: Der Begriff trägt keinen Tenor — die erste gerichtliche Prüfung von außen
    gericht: High Court of Kenya at Kerugoya, Constitutional and Human Rights Division, 30.04.2026 – Petition
      E003 of 2026, [2026] KEHC 5690 (KLR)
    begruendung: 'Die erste Entscheidung außerhalb Europas, die den Begriff des Hochrisiko-KI-Systems
      als Anknüpfungspunkt eines gerichtlichen Verbots prüft — und ihn für zu unbestimmt hält. Der Antrag
      auf eine conservatory order gegen den Einsatz von „high-risk artificial intelligence systems" konnte
      in der beantragten Fassung nicht ergehen; den Petenten wurde aufgegeben, die konkreten Systeme zu
      benennen, die sie für Hochrisikosysteme halten. Das ist dieselbe Frage, die in der Union über Anhang
      III und Art. 6 Abs. 3 KI-VO geführt wird, nur aus der Gegenrichtung gestellt: nicht, ob eine Behörde
      einstufen darf, sondern ob ein Gericht an die Einstufung einen vollstreckbaren Tenor knüpfen kann.
      Die Antwort lautet nein, solange die Einstufung nicht am einzelnen System vorgenommen ist — ein
      Befund, der die Selbstbewertung des Anbieters aufwertet und die gerichtliche Kontrolle entsprechend
      entwertet. Ersatzweise erließ das Gericht einen structural interdict und verpflichtete die Beklagten,
      über Stand und Fortgang der KI-Regulierung zu berichten; das ist ein Durchsetzungsmuster gegen den
      Gesetzgeber, für das es in Europa keine Entsprechung gibt.

      '
    urteile:
