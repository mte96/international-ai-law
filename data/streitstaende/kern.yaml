    GDPR; der Normeintrag ki-vo-art-2-abs-3 nennt nur das Thema. Zweitens Art. 5 Abs. 5 KI-VO — die Aussage,
    der Vorbehalt strengeren mitgliedstaatlichen Rechts sei auf Systeme zur biometrischen Fernidentifizierung
    beschränkt und erfasse die nicht-biometrische Bildanalyse nicht; der Normeintrag ki-vo-art-5-abs-5
    nennt nur „Vorbehalt strengerer mitgliedstaatlicher Regelungen“. Beides beruht auf eigener Kenntnis
    und ist vor jeder Publikation am Verordnungstext gegenzulesen.'
