  - position: Zweckabhängige Erlaubnis im Privatsektor — Australien nach Bunnings
    gericht: Administrative Review Tribunal (Guidance and Appeals Panel), 04.02.2026 – Bunnings Group
      Limited and Privacy Commissioner [2026] ARTA 130; vorgehend OAIC, 29.10.2024 – [2024] AICmr 230
    begruendung: 'Die Privacy Commissioner hatte 2024 festgestellt, dass Bunnings zwischen November 2018
      und November 2021 in 63 Filialen die Gesichtsdaten hunderttausender Kunden ohne die Voraussetzungen
      des APP 3.3 erhoben habe, und „necessary“ streng ausgelegt: Geeignetheit, Alternativenprüfung, Verhältnismäßigkeit.
      Das Tribunal hat diese Feststellung 2026 aufgehoben. Die „permitted general situations“ des s. 16A
      Privacy Act griffen ein: Es habe Grund zur Annahme rechtswidriger Handlungen bestanden — die Schwelle
      bezeichnet das Tribunal ausdrücklich als „relatively low bar“ — und Bunnings habe vernünftigerweise
      annehmen dürfen, die Erhebung sei erforderlich; Wiederholungstäter, Gewalt gegen Personal und als
      Waffen verwendbare Sortimentsware tragen die Abwägung, obwohl das Tribunal den Eingriff selbst als
      „significant intrusion“ bezeichnet. Bestätigt blieben die Verstöße gegen APP 5.1, APP 1.3 und APP
      1.2 — unzureichende Unterrichtung, unvollständige Datenschutzerklärung, „ad hoc and reactive“ statt
      dokumentierte Verfahren. Damit verschiebt sich die Rechtmäßigkeitsfrage vom Ob auf das Wie. Die
      Gegenprobe liefert 7-Eleven: Dieselbe Behörde, dieselbe Technik, aber Marktforschung statt Kriminalitätsabwehr
      — und ein Verstoß. Die Commissioner hat gegen die Bunnings-Entscheidung kein Rechtsmittel eingelegt.

      '
