  - position: Fair dealing für Forschung trägt das Training — die einzige Sachentscheidung der Welt
    gericht: High Court of Delhi, Justice Amit Bansal, Urt. v. 24.07.2026 – CS(COMM) 1028/2024 (ANI Media
      ./. OpenAI)
    begruendung: 'Indien hat keine TDM-Schranke. Section 52(1)(a) Copyright Act 1957 erlaubt fair dealing
      für "private or personal use, including research" — eine Norm, die für menschliche Forschung geschrieben
      wurde. Das Gericht dehnt sie auf industrielle Datenverarbeitung aus: "the training of LLMs by Open
      AI would constitute ''research'' within the meaning of Section 52(1)(a) … The advancement of artificial
      intelligence technology through training of LLMs is research activity of significant public interest"
      (Rn. 115), und weiter: "the storage and use of ANI''s copyrighted literary works by Open AI for
      the purpose of training its LLM underlying ChatGPT would qualify as ''fair dealing''" (Rn. 128 f.).
      Tragend ist eine Tatsachenfeststellung: Alle neun vorgelegten Beispielartikel stammten aus August
      und September 2024, das Training war im April 2024 beendet — die Ausgaben beruhten also auf Retrieval,
      nicht auf Memorisierung (Rn. 78, 82, 102, 106, 111). Der Antrag auf einstweilige Verfügung wurde
      abgewiesen (Rn. 134). Memorisierung und substanzielle Übernahme in den Ausgaben sind ausdrücklich
      der Hauptsache vorbehalten, ebenso der Anspruch aus öffentlicher Wiedergabe durch Live-Abruf.

      '
