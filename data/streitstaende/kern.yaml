- id: dmca-1202-identitaetserfordernis
  titel: Das Identitätserfordernis des § 1202(b) DMCA
  frage: 'Setzt ein Anspruch wegen Entfernung von Urheberrechtsangaben nach 17 U.S.C. § 1202(b) voraus,
    dass die verbreitete Kopie mit dem Werk identisch ist?

    '
