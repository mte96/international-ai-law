      vierzehn Jahren dürfen keine virtuellen Verwandtschafts- oder Liebesbeziehungen angeboten werden;
      im Übrigen bedarf es der Einwilligung der Sorgeberechtigten, eines Kinderschutzmodus mit Zeitbegrenzung
      und Elternaufsicht, eines Hinweises bei ununterbrochener Nutzung über zwei Stunden, der Erkennung
      von Selbstgefährdung und eines menschlichen Eingriffs. Die Registrierung erfasst Alter und Sorgeberechtigte;
      ab einer Million registrierter oder 100.000 monatlich aktiver Nutzer ist eine Sicherheitsbewertung
