  unterfragen:
  - frage: Haftet der Anbieter unmittelbar?
    ja: N.D. Cal. über die Agentenfigur; D. Mass. für den Scoring-Anbieter nach dem Fair Housing Act;
      österreichische DSB für den Score-Ersteller nach Art. 22 DSGVO
    nein: nach dem Wortlaut des Antidiskriminierungsrechts, des Art. 22 DSGVO und der KI-Verordnung ist
      Adressat der Arbeitgeber; die Konstruktionen employment agency und unmittelbare Arbeitgeberstellung
      sind in Mobley mit Präklusion gescheitert
  - frage: Wem gegenüber ist offenzulegen?
    ja: kollektiv — Art. 64.4.d) ET gegenüber der Arbeitnehmervertretung, durchgesetzt im Grundrechtsverfahren
    nein: individuell — Art. 15 Abs. 1 lit. h DSGVO und Art. 86 KI-VO geben dem Einzelnen einen Anspruch,
      der ohne Kollektivierung an der Darlegungslast scheitert
  - frage: Genügt es, dass ein Mensch am Ende entscheidet?
    ja: BVwG Wien zu AMAS — vorbereitende Verarbeitung fällt nicht unter Art. 22 DSGVO
    nein: österreichische DSB zum RiskScore — maßgeblich ist, ob der automatisiert erzeugte Wert die Entscheidung
      determiniert; der Sache nach auch der Tribunal Supremo, der die formale Ablehnungsfreiheit als entwertet
      ansieht
  - frage: Ist der Einsatz eines KI-Werkzeugs mitbestimmungspflichtig?
    ja: sobald Unternehmenslizenz, Anmeldung oder Protokollierung hinzutreten — § 87 Abs. 1 Nr. 6 BetrVG
    nein: ArbG Hamburg für private Accounts ohne Arbeitgeberzugriff; Vorgaben zur Nutzung eines Arbeitsmittels
      betreffen das mitbestimmungsfreie Arbeitsverhalten
  fehlende_belege:
  - Die Plattformarbeitsrichtlinie (EU) 2024/2831 ist Nicht als Regelwerk erfasst; die Entscheidungen
    es-2020-glovo-ts, es-2025-foundever und es-2025-an-glovo-ca verweisen auf eine id plattformarbeit-rl,
    die im Regelwerksbestand fehlt. Sie ist für diesen Streitstand die zentrale Rechtsquelle und im Feld
    regelwerke deshalb nicht gesetzt.
  - Art. 5 Abs. 1 lit. f KI-VO (Verbot der Emotionserkennung am Arbeitsplatz) fehlt im Normenverzeichnis,
    obwohl er die tragende Norm der Garante-Warnung ist. Ebenso fehlen Anhang III Nr. 4 KI-VO (Beschäftigung
    als Hochrisikobereich) und Art. 88 DSGVO (Beschäftigtendatenschutz).
  - 'it-2026-garante-ia-lavoro-stress ist als zweifelhaft geführt: Gelesen wurde nur die Pressemitteilung
    (docweb 10255522), nicht das Provvedimento; die Nummer im Registro dei provvedimenti ist nicht ermittelt,
    und die Anspruchsgrundlagen sind aus dem Sachverhalt erschlossen, nicht belegt.'
  - es-2020-glovo-ts und es-2025-foundever sind nicht am Urteilstext verifiziert (CENDOJ gesperrt beziehungsweise
    CAPTCHA); für Foundever fehlt ein ECLI, für es-2025-an-glovo-ca das Aktenzeichen.
  - Die Zahl der Opt-in-Kläger in Mobley ./. Workday und der Ausgang des Dezertifizierungsstadiums sind
    nicht erfasst. Ohne sie lässt sich die praktische Bedeutung der Kollektivierung nicht beurteilen.
  - Zur Durchsetzung von Local Law 144 (New York City) und HB 3773 (Illinois) ist keine einzige Maßnahme
    erfasst. Die Position „Information statt Haftung" beruht deshalb allein auf Normtexten.
  - Der Vergleich us-2022-louis-saferent betrifft Wohnraum, nicht Beschäftigung; er ist hier wegen der
    strukturgleichen Zurechnung zum Scoring-Anbieter geführt und trägt für das Beschäftigungsrecht nur
    mittelbar.
