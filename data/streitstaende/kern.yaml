  - position: Das Maßstabsgefälle — streng gegen fremde KI, milde gegen die eigene
    gericht: Federal Court of Canada (Haghshenas, Safarian, Khosravi, 2023); Oberster Gerichtshof Israels
      (Ramat Gan, März 2026); Superior Tribunal de Justiça, Quinta Turma, 08.04.2026; High Court of Gujarat,
      20.08.2026
    begruendung: 'Dieselben Gerichte, die den eigenen KI-Einsatz nicht regeln, legen an fremden einen
      scharfen Maßstab an — mit einer Ausnahme, und die betrifft die Verwaltung. Der Federal Court of
      Canada hielt in Haghshenas den Einsatz des Vorsortierungswerkzeugs Chinook für "irrelevant", solange
      ein Beamter die Entscheidung trifft; binnen zehn Wochen entschied dasselbe Gericht in Safarian und
      Khosravi gegenläufig, dass generische Textbausteine die Befassung mit dem Einzelfall nicht erkennen
      lassen und ein Werkzeug, das die Sicht des Entscheiders verengt, die Entscheidung unangemessen macht.
      Diese Divergenz ist bis heute nicht durch den Federal Court of Appeal aufgelöst. Israel formuliert
      für dieselbe Konstellation ohne spezialgesetzliche Grundlage das Verbot der Ermessensdelegation.
      Am schärfsten ist der Maßstab dort, wo die KI als Beweismittel auftritt: Der STJ verwarf einen KI-gestützten
      Analysebericht, der ein amtliches Sachverständigengutachten entkräften sollte, weil generative Systeme
      probabilistisch arbeiten, zur Halluzination neigen und der Strafprozess ein Mindestmaß an epistemischer
      Verlässlichkeit verlangt. Und das Obergericht Gujarat hob sämtliche Steuerbescheide auf, weil sich
      der Beamte ausschließlich auf KI-generierte, nicht existierende Rechtsprechung gestützt hatte.

      '
