    stelle: 'Israel, Justizministerium, Rechtsgutachten vom 18.12.2022; Japan, Kulturbehörde, 15.03.2024;
      Korea, MCST/KCC, 30.06.2025 und 18.05.2026; Indien, DPIIT, 08.12.2025; Kanada, Konsultation und
