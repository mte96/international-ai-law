  - position: Selbstfreistellung ohne Kontrolle ist der eigentliche Konstruktionsfehler
    stelle: EDRi und ECNL; AlgorithmWatch; EDSA und EDSB
    begruendung: 'Über die eigene Hochrisiko-Eigenschaft entscheidet der Anbieter selbst; eine vorherige
      behördliche Prüfung ist nicht vorgesehen. Wer sich freistellt, entzieht sich der Konformitätsbewertung,
      dem Risikomanagement, der Datenqualitätsprüfung und der Grundrechte-Folgenabschätzung nach Art.
      27. Die Registrierung ersetzt keine Kontrolle, weil ihr keine Prüfung folgt. Die Verschiebung der
      Anhang-III-Pflichten auf den 02.12.2027 verlängert diese Lage um sechzehn Monate.

      '
