  - position: Vor der Schranke steht die Zuständigkeit — und dort endet es meist
    gericht: 'Ontario Superior Court of Justice, Kimmel J, 2025 ONSC 6217; High Court of Justice (E&W),
      Joanna Smith J, [2025] EWHC 2863 (Ch); Landgericht München I, 42. Zivilkammer, Urt. v. 31.07.2026
      – 42 O 763/25; High Court of Delhi, Rn. 51, 52, 55

      '
    begruendung: 'Vier Gerichte, vier Wege zu derselben Frage, ob nationales Recht ein Training im Ausland
      erfasst. Ontario bejaht die Zuständigkeit über den Test der "real and substantial connection" (Van
      Breda) für sechs von zehn Beklagten und weist forum non conveniens zurück; die Sache selbst ist
      nicht erreicht. Delhi bejaht sie über Sec. 62(2) Copyright Act und die gezielte Ansprache indischer
      Nutzer: Die Speicherung auf US-Servern sei "der letzte Schritt einer Kette von Ereignissen, die
      mit dem Zugriff auf geschützte Werke aus Indien beginnt". Das Landgericht München I geht den kollisionsrechtlichen
      Weg und erfasst ein in den USA durchgeführtes Training, weil das Modell anschließend in Europa betrieben
      wird; es setzt sich dabei ausdrücklich von Bartz und Kadrey ab. England ist der einzige Ausreißer,
      und zwar aus einem prozessualen Grund: Getty musste den Trainingsanspruch fallenlassen, weil kein
      Trainingsvorgang im Vereinigten Königreich nachweisbar war, und scheiterte mit dem Ersatzweg über
      die mittelbare Verletzung daran, dass Modellgewichte keine "copy" eines geschützten Werkes sind.
      Die Auslegung des Begriffs "article" als möglicherweise unkörperlich gab das Gericht Getty dagegen
      recht; die Berufung dazu ist am 16.12.2025 zugelassen worden.

      '
