  - position: Produkthaftung — Software ist Produkt, der Fehlerbegriff bleibt offen
    stelle: Richtlinie (EU) 2024/2853; deutsches Umsetzungsvorhaben
    begruendung: 'Software einschließlich KI-Systemen ist ausdrücklich Produkt (Art. 4 Nr. 1); der Fehlerbegriff
      erfasst Selbstlernverhalten, Cybersicherheitslücken und unterbliebene Updates. Hinzu treten ein
      gerichtlicher Offenlegungsanspruch (Art. 9) und widerlegbare Fehler- und Kausalitätsvermutungen
      bei technischer oder wissenschaftlicher Komplexität (Art. 10). Ob eine Halluzination ein Fehler
      im Sinne des Art. 7 ist, sagt die Richtlinie nicht. Nicht kommerzielle Open-Source-Software bleibt
      nach Art. 2 Abs. 2 ausgenommen.

      '
