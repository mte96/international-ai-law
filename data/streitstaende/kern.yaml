    ja: 'im Ausgangspunkt überall — Anknüpfungspunkt bleibt das Vervielfältigungsrecht (Art. 2 InfoSoc-RL,
      § 16 UrhG, s. 3 Copyright Act, Art. 29 I LDA, Art. 21 jp UrhG)

