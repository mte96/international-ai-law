  - position: Gegriffene Buße nach Rule 11, gestaffelt nach bad faith
    gericht: S.D.N.Y. (Castel J), Mata v. Avianca, 22.06.2023; E.D. Tex. (Crone J), Gauthier v. Goodyear,
      25.11.2024; D. Colo. (Wang J), Coomer v. Lindell, 07.07.2025 und 07.05.2026; N.D. Miss., Withers,
      08.06.2026; Appellate Court of Illinois, Scott v. Illinois Human Rights Commission, 28.07.2026
    begruendung: 'Die klassische Linie bemisst eine Pauschale nach dem Grad der Vorwerfbarkeit. Mata sanktionierte
      nicht den Werkzeugeinsatz — an der Nutzung generativer KI sei "nothing inherently improper" —, sondern
      das Festhalten an den Zitaten nach Beanstandung; die Bösgläubigkeit wurde über die Figur der conscious
      avoidance begründet und mit 5.000 USD gesamtschuldnerisch gegen beide Anwälte und die Kanzlei geahndet.
      Gauthier steht für den reinen Fahrlässigkeitsfall: 2.000 USD, verpflichtende Fortbildung zu generativer
      KI und Offenlegung gegenüber dem Mandanten — die Fortbildungsauflage ist seither die Standardreaktion
      und inzwischen in Dutzenden Entscheidungen wiederholt. Coomer sanktionierte beide Unterzeichner
      persönlich und in gleicher Höhe, obwohl nur einer den Text erstellt hatte, und musste zehn Monate
      später in derselben Sache erneut sanktionieren, diesmal wegen falscher Wiedergabe einer echten Entscheidung;
      die Summe liegt bei 11.000 USD. Withers verband 8.000 USD mit dem Widerruf der pro-hac-vice-Zulassung
      — der wirksamsten Sanktion des amerikanischen Systems gegen auswärtige Anwälte, für die das deutsche
      Recht kein Äquivalent kennt. Scott betrifft die gefährlichere Untergruppe: erfundene Gesetzesvorschriften
      statt erfundener Rechtsprechung, 15.000 USD nach Ill. S. Ct. R. 375(b).

      '
