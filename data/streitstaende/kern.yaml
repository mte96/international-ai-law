  - position: Die Ausnahme entscheidet, ob überhaupt noch Recht gilt
    stelle: 'Mitgliedstaatliche Praxis: Griechenland, Spanien, Italien'
    begruendung: 'Griechenland kannte mit Άρθρο 5 und Άρθρο 6 ν. 4961/2022 seit 2022 eine algorithmische
      Folgenabschätzung und einen individuellen Anspruch auf Kenntnis der Entscheidungsparameter für die
      öffentliche Verwaltung; beide wurden zum 20.07.2026 ersatzlos aufgehoben. Spanien verteilt die Marktüberwachung
      im Proyecto de Ley Orgánica auf acht Behörden, so dass dieselbe Ausnahmefrage je nach Sektor von
      einer anderen Stelle beantwortet wird. Italien legt mit der Legge 132/2025 ein eigenes materielles
      Stockwerk über die Verordnung, dessen Pflichten aber an die Einstufung anknüpfen. Fällt ein System
      unter die Ausnahme, greift weder das europäische noch das aufgehobene nationale Recht.

      '
