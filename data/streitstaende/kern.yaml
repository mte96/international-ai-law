  - position: Verbraucher- und Lauterkeitsrecht — Anknüpfungspunkt ist die geweckte Erwartung, nicht der
      Fehler
    gericht: Federal Court of Australia (Moshinsky J), 20.01.2020 – [2020] FCA 16 (ACCC ./. Trivago)
    begruendung: 'Das vierte Regime neben Äußerungsrecht, Produkthaftung und Vertragsrecht — und dasjenige,
      das ohne jede Aussage über die Funktionsweise des Systems auskommt. Der Ranking-Algorithmus gewichtete
      in erheblichem Umfang die von den Buchungsportalen gezahlte Klickvergütung; in rund zwei Dritteln
      der Fälle war das hervorgehobene Angebot nicht das günstigste. Moshinsky J stellte Verstöße gegen
      ss. 18, 29 und 34 des Australian Consumer Law fest, und zwar allein anhand der Erwartung, die die
      Präsentation weckt: „bester Preis", Top-Position, Streichpreis. Auf Vorsatz, Erklärbarkeit oder
      Modellzugang kommt es nicht an. Für die Frage dieses Streitstands ist das die Umkehrung des Fehlerbegriffs:
      Nicht die Ausgabe muss unrichtig sein, sondern die Beschreibung dessen, was die Ausgabe leistet.
      Damit trifft dieses Regime genau den Punkt, an dem der Disclaimer im Produkthaftungsrecht entlastet
      — wer die Ausgabe als objektiv, personalisiert oder „bestes Ergebnis" bewirbt, haftet für die Diskrepanz,
      und der Warnhinweis hilft nicht, weil er die Werbeaussage nicht zurücknimmt.

      '
    urteile:
    - au-2020-accc-trivago
  unterfragen:
  - frage: Entlastet ein Warnhinweis auf mögliche Fehler?
    ja: Walters v. OpenAI — tragend für den fehlenden Tatsachencharakter
    nein: LG Hamburg — ausdrücklich; ebenso im Ergebnis OLG Hamm und CRT British Columbia
  - frage: Ist der Betreiber Äußernder oder Vermittler?
    ja: 'Äußernder: LG München I, LG Hamburg, OLG Hamm'
    nein: 'Vermittler: LG Berlin II, markenrechtlich, für dasselbe Produkt'
  - frage: Ist die einzelne Halluzination der Fehler oder ihre Wahrscheinlichkeit?
    ja: 'Einzelfall: die Äußerungsrechtsprechung, die auf die konkrete Aussage abstellt'
    nein: 'Rate: Kalai/Vempala und Geistfeld — maßgeblich sind Trainings- und Absicherungsentscheidungen'
  aufloesung: 'Kein einzelnes Verfahren löst das auf; maßgeblich sind drei Termine. Erstens die Umsetzungsfrist
    der Produkthaftungsrichtlinie am 09.12.2026 — das deutsche Gesetz zur Modernisierung des Produkthaftungsrechts
    (BT-Drs. 21/4297 vom 25.02.2026) war am 04.09.2026 nicht verkündet. Zweitens die deutschen Berufungsinstanzen
    zu den KI-Suchzusammenfassungen, in denen der Widerspruch zwischen äußerungs- und kennzeichenrechtlicher
    Zurechnung aufgelöst werden muss. Drittens die erste Sachentscheidung in Starbuck v. Google, die erstmals
    über das Verschulden nach vorheriger Beschwerde befinden müsste. Auf Unionsebene ist nichts angekündigt;
    der Effektivitätsgrundsatz kann nationale Gerichte gleichwohl zu Beweiserleichterungen zwingen, die
    den zurückgezogenen Vermutungen der AILD nahekommen.

    '
  eigene_bewertung: 'Alle fragen, ob eine Halluzination ein Produktfehler ist. Das ist die falsche Frage.
    Art. 7 der Produkthaftungsrichtlinie fragt nach der Sicherheit, die die Allgemeinheit zu erwarten
    berechtigt ist. Wenn der Anbieter selbst — in der Oberfläche, in den Nutzungsbedingungen, in jeder
    Modellkarte — erklärt, die Ausgabe könne falsch sein, senkt er die berechtigte Erwartung und argumentiert
    damit sein eigenes Produkt fehlerfrei. Genau denselben Hinweis lassen die deutschen Gerichte im Äußerungsrecht
    nicht als Entlastung gelten. Derselbe Satz wirkt also im Produkthaftungs- recht zugunsten und im Persönlichkeitsrecht
    zulasten des Anbieters. Die Disclaimer, die heute geschrieben werden, sind gegen das falsche Regime
    optimiert. Der zweite Punkt betrifft den Stichtag. Verbreitet wird die Lesart, der Altbestand sei
    sicher, weil die Richtlinie nur Produkte erfasst, die nach dem 09.12.2026 in Verkehr gebracht werden.
    Für kontinuierlich aktualisierte Modelle trägt das nicht: Art. 11 Abs. 2 schließt die Entlastung aus,
    soweit der Hersteller die Kontrolle über nachträgliche Änderungen behält, und jede wesentliche Veränderung
    lässt den Stichtag neu laufen. Wer ein Modell weiterentwickelt — und alle tun das —, bringt es damit
    fortlaufend neu in Verkehr. Die praktische Folge ist die umgekehrte der verbreiteten: Ab dem 09.12.2026
    fällt faktisch jedes produktiv gepflegte Modell unter das neue Regime, und die einzige Vermeidungsstrategie
    wäre das Einfrieren der Version — also genau das, was die Aktualisierungspflicht verhindern soll.
    Drittens, zur deutschen Lage: LG München I und LG Berlin II haben binnen vier Tagen für dasselbe Produkt
    entgegengesetzt entschieden. Das ist kein Zufall, sondern folgt aus der Anspruchsgrundlage — das Äußerungsrecht
    fragt nach dem Inhalt, das Kennzeichenrecht nach der Benutzungshandlung. Wer daraus einen Widerspruch
    der Rechtsprechung macht, überliest, dass beide Kammern dieselbe Technik zutreffend, aber unter verschiedenen
    Fragestellungen beurteilt haben. Der eigentliche Befund ist deshalb ein anderer: Die Zurechnung von
    KI-Ausgaben hat keine einheitliche Antwort, sondern hängt davon ab, welches Rechtsgut verletzt sein
    soll.

    '
