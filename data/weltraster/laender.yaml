# Weltraster — die Landkarte, nicht die Tiefe.
#
# Fuer jeden Staat der Bearbeitungsstand: Ist etwas erlassen, ist etwas im
# Verfahren, gibt es nur eine Strategie, oder nichts? Und: haben wir es
# erfasst oder beobachten wir es nur?
#
# Der Zweck ist das Gegenteil von Vollstaendigkeit. Das Raster soll
# verhindern, dass ein Sonderweg uebersehen wird, weil das Land klein ist.
# Albanien hat im September 2025 ein KI-System zum Regierungsmitglied
# gemacht - das stand in keiner der grossen Uebersichten.
#
# `einstufung` steuert den Aufwand:
#   erfasst    - vollstaendig in data/regelwerke/
#   pflicht    - muss erfasst werden, noch offen
#   beobachten - Vorhaben im Gang, Quartalspruefung genuegt
#   nachrangig - nichts in Sicht, Jahrespruefung
