# Ansaetze, die groessere Rechtsordnungen nicht kennen. Fuer die
# rechtsvergleichende Arbeit oft wertvoller als das zehnte Land, das
# den europaeischen Ansatz kopiert.
sonderwege:
- land: Albanien
  was: Einsatz eines KI-Systems (Diella) als foermliches Mitglied der Regierung, zustaendig fuer das oeffentliche
    Auftragswesen, seit dem 11.09.2025.
  warum_bemerkenswert: Kein anderer Staat hat KI in die Staatsorganisation selbst hineingeschrieben statt
    sie nur zu regulieren; damit stellen sich Fragen der Zurechnung von Verwaltungsakten, der ministeriellen
    Verantwortlichkeit und der Gerichtskontrolle voellig neu. Fuer eine Rechtsordnung im EU-Beitrittsprozess
    ist das zugleich ein Testfall dafuer, ob Art. 2 EUV einer nicht zurechenbaren Entscheidungsinstanz
    entgegensteht.
- land: Usbekistan
  was: 'Omnibus-Technik: KI-Regelungen wurden 2026 nicht als eigenes Gesetz erlassen, sondern in bestehende
    Informations- und Ordnungswidrigkeitengesetze eingefuegt, samt Bussgeldtatbestaenden fuer KI-gestuetzte
    rechtswidrige Datenverarbeitung.'
  warum_bemerkenswert: 'Das ist das methodische Gegenmodell zum horizontalen Rechtsakt: statt eines neuen
    Regelungskoerpers wird die Rechtsordnung an den Stellen nachgeschaerft, an denen KI tatsaechlich Schaden
    anrichtet. Fuer die Frage, ob ein KI-Gesetz ueberhaupt noetig ist oder ob Anpassungen des allgemeinen
    Rechts genuegen, ist Usbekistan das aufschlussreichste Anschauungsmaterial.'
- land: Kenia
  was: Neben dem Artificial Intelligence Bill 2026 verfolgt Kenia mit dem Kenya Robotics and Artificial
    Intelligence Society Bill eine berufsrechtliche Verkammerung von KI-Fachleuten mit Registrierung,
    Standesregeln und Disziplinargewalt.
  warum_bemerkenswert: Keine grosse Rechtsordnung reguliert KI-Entwickler als freien Beruf nach dem Vorbild
    der Ingenieur- oder Anwaltskammern; alle setzen am Produkt oder am System an, nicht an der Person.
    Der Ansatz betrifft unmittelbar das anwaltliche Berufsrecht und waere das erste Beispiel einer personenbezogenen
    statt produktbezogenen KI-Regulierung.
- land: Vereinigte Arabische Emirate
  was: Verbindliche Regelung des KI-Einsatzes im Wahlprozess und in der exekutiven Entscheidungsvorbereitung
    (Maerz 2026), flankiert von einer Bundesbehoerde fuer KI und Daten (Juni 2026) — ohne jedes horizontale
    KI-Gesetz fuer die Privatwirtschaft.
  warum_bemerkenswert: Die Emirate regulieren zuerst den Staat und erst spaeter den Markt, waehrend die
    EU genau umgekehrt vorgeht und den staatlichen Eigengebrauch weitgehend ausspart. Der Zugriff auf
    KI in der Willensbildung der Exekutive ist ein Regelungsgegenstand, den bislang keine grosse Rechtsordnung
    normiert hat.
- land: Schweiz
  was: Bewusste Absage an ein horizontales KI-Gesetz zugunsten der Ratifikation der Europarats-Rahmenkonvention
    nebst punktuellen sektoralen Anpassungen.
  warum_bemerkenswert: Die Schweiz ist die einzige hochentwickelte europaeische Rechtsordnung, die den
    Verzicht auf einen eigenen Rechtsakt ausdruecklich begruendet und die Konvention als ausreichende
    Grundlage behandelt. Sie ist damit der praktische Gegenbeweis zur These, die KI-VO sei fuer den europaeischen
    Rechtsraum alternativlos, und liefert den Massstab fuer die Frage nach dem Bruessel-Effekt.
- land: Peru
  was: 'Foerdergesetz statt Risikogesetz: Ley 31814 (2023) regelt die Foerderung der KI-Nutzung; erst
    die Durchfuehrungsverordnung von 2025 fuegt Pflichten hinzu.'
  warum_bemerkenswert: 'Peru hat als erster lateinamerikanischer Staat ein KI-Gesetz erlassen und dabei
    die Reihenfolge umgekehrt: erst Foerderauftrag, dann Pflichten auf Verordnungsebene. Der Ansatz zeigt,
    wie ein Schwellenland Regulierungslasten zeitlich staffelt, und ist ein Gegenmodell zum gleichzeitigen
    Vollzug aller Pflichten.'
- land: Taiwan
  was: 'Grundlagengesetz-Technik: das AI Basic Act bindet primaer die Verwaltung und verpflichtet Fachressorts
    zur sektoralen Ausgestaltung, statt unmittelbar Pflichten fuer Unternehmen zu begruenden.'
  warum_bemerkenswert: Diese aus dem japanischen und taiwanischen Recht bekannte Kategorie des Grundlagengesetzes
    hat im europaeischen Recht kein Gegenstueck; sie erlaubt eine verbindliche Wertentscheidung ohne unmittelbare
    Belastung der Normadressaten. Fuer die Frage nach regulatorischen Zwischenformen zwischen Strategie
    und Vollgesetz ist Taiwan der praezise Referenzfall.
- land: Kasachstan
  was: Umfassendes KI-Gesetz mit ausdruecklicher urheberrechtlicher Regelung zu KI-erzeugten Ergebnissen,
    verabschiedet Dezember 2025.
  warum_bemerkenswert: Kasachstan hat die urheberrechtliche Zuordnung von KI-Output direkt im KI-Gesetz
    geregelt, waehrend EU und USA sie dem allgemeinen Urheberrecht und den Gerichten ueberlassen. Das
    macht das Gesetz zum bislang klarsten positivrechtlichen Testfall fuer die Schutzfaehigkeit maschinell
    erzeugter Ergebnisse.
- land: Ukraine
  was: 'Bewusst zweistufiger Bottom-up-Ansatz: erst Selbstregulierung, Reallabore und Unternehmenshandreichungen,
    ein an die KI-VO angelehntes Gesetz erst danach.'
  warum_bemerkenswert: Die Ukraine kehrt die uebliche Reihenfolge um und nutzt die Vorbereitungsphase
    als eigenstaendiges Regulierungsinstrument. Weil das Land zugleich zur KI-VO-Angleichung verpflichtet
    ist, laesst sich hier beobachten, was von einer freiwilligen Phase uebrigbleibt, wenn die Pflicht
    nachrueckt.
