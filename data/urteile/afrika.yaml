- id: ke-2026-wangai-ki-verfassung
  jurisdiktion: ke
  gericht: High Court of Kenya at Kerugoya (Constitutional and Human Rights Division)
  aktenzeichen: Petition E003 of 2026; [2026] KEHC 5690 (KLR)
  datum: 2026-04-30
  status: anhaengig
  bedeutung: hoch
  volltext_url: https://new.kenyalaw.org/akn/ke/judgment/kehc/2026/5690/eng@2026-04-30
  verifiziert: true
  sprache: en
  parteien:
    klaeger: Wangai u.a. (drei Petenten); Amicus curiae Ideate Tech Policy Africa Limited
    beklagter: Cabinet Secretary, Ministry of Information, Communications and The Digital Economy u.a.;
      National Assembly als Interested Party
  richter: EM Muriithi
  leitsatz: 'Ein Antrag auf einstweilige Untersagung des Einsatzes von "high-risk artificial intelligence
    systems" ist zu unbestimmt und kann nicht in der beantragten Fassung ergehen. Das Gericht lehnt die
    conservatory order deshalb ab, gibt der Verfassungsbeschwerde aber im Uebrigen statt und fasst als
    Ersatz einen structural interdict: die Beklagten haben dem Gericht ueber Stand und Fortgang der Regulierung
    des KI-Einsatzes in Kenia zu berichten.'
  sachverhalt: Die Petenten machen geltend, Kenia setze KI-Systeme in grundrechtsrelevanten Zusammenhaengen
    ein, ohne dass ein KI-spezifischer Rechtsrahmen bestehe, und ruegen Verstoesse gegen das Recht auf
    Privatheit und weitere Grundrechte. Sie berufen sich auf den im Nubian-Rights-Forum-/Huduma-Namba-Verfahren
    entwickelten Grundsatz, dass ein umfassender Rechtsrahmen vor dem Einsatz eingriffsintensiver Systeme
    bestehen muss. Sie beantragen unter anderem eine Feststellung, dass der Einsatz von Hochrisiko-KI-Systemen
    ohne gesetzliche Grundlage verfassungswidrig ist, sowie eine einstweilige Untersagung.
  ergebnis: 'Anwendungsantrag teilweise erfolgreich (outcome: Allowed). Ziff. 50 der Orders: (1) vorrangige
    Verhandlung angeordnet, Termin 16.-18. Juni 2026 taeglich, Urteil vorbehalten fuer Montag, 29. Juni
    2026; (2) der Antrag auf eine conservatory order gegen den Einsatz von "high-risk artificial intelligence
    systems" ist vage und kann in der beantragten Fassung nicht ergehen; (3) den Petenten wird gestattet,
    die Petition zu ergaenzen und die konkreten Systeme zu benennen, die sie fuer Hochrisikosysteme halten;
    (4) die Kenya National Commission on Human Rights wird beigeladen; (5) Ergaenzung binnen 14 Tagen.
    Ziff. 48: Das Gericht haelt die vorgetragenen Tatsachen fuer hinreichend, um einen structural interdict
    zu rechtfertigen - eine Abhilfe, die der Supreme Court in Mitubell anerkannt hat - und verpflichtet
    die Beklagten, ueber bisherige Schritte und Fortschritte hin zu einer Regulierung des Einsatzes von
    KI-Technologien in Kenia zu berichten.'
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - marktzugang
  - governance
  normen: []
  bedeutung_begruendung: 'Die erste Entscheidung ausserhalb Europas, die den Begriff "Hochrisiko-KI-System"
    als Anknuepfungspunkt eines gerichtlichen Verbots prueft - und ihn fuer zu unbestimmt haelt. Das trifft
    genau die Frage, die in der EU ueber Anhang III und Art. 6 Abs. 3 KI-VO gefuehrt wird, hier aber aus
    der Gegenrichtung: nicht ob eine Behoerde einstufen darf, sondern ob ein Gericht daran einen Tenor
    knuepfen kann. Der structural interdict ist zugleich ein Muster fuer die Durchsetzung eines Regulierungsauftrags
    gegen den Gesetzgeber, das in Europa keine Entsprechung hat.'
  offene_punkte:
  - Das fuer den 29.06.2026 vorbehaltene Urteil ist auf kenyalaw noch nicht veroeffentlicht (Stand 07.09.2026).
    Nachverfolgen.
  - Der Bericht der Beklagten nach dem structural interdict ist nicht oeffentlich.
  pruefvermerk:
  - '07.09.2026 am amtlichen Volltext auf new.kenyalaw.org geprueft: Rubrum, Aktenzeichen, Datum, Spruchkoerper
    und der Wortlaut der Orders (Ziff. 48-50) gelesen. Ausgang und Tenor sind belegt.'
  letzte_pruefung: 2026-09-07
  quelle_art: amtlich
- id: ke-2026-nyanjui-ki-schriftsatz
  jurisdiktion: ke
  gericht: Environment and Land Court at Thika
  aktenzeichen: Land Case Appeal E009 of 2025; [2026] KEELC 3088 (KLR)
  datum: 2026-05-21
  status: erstinstanzlich
  bedeutung: hoch
  volltext_url: https://new.kenyalaw.org/akn/ke/judgment/keelc/2026/3088/eng@2026-05-21
  verifiziert: true
  sprache: en
  parteien:
    klaeger: Nyanjui u.a.
    beklagter: Nyanjui
  richter: JA Mogeni
  leitsatz: Wer zur Stuetzung eines Vollstreckungsaufschubs in einer Grundstuecksache eine Entscheidung
    zitiert, die die Grundrechte von LGBTQ-Personen und erzwungene medizinische Untersuchungen betrifft,
    hat die menschliche rechtliche Kontrolle zugunsten automatisierten, kontextblinden Schreibens preisgegeben.
    Der Anwalt bleibt verpflichtet, seine Fundstellen persoenlich auf Einschlaegigkeit, Richtigkeit und
    Tragfaehigkeit zu pruefen.
  sachverhalt: Antrag auf Aussetzung der Vollstreckung. Die Antragsteller stuetzten sich auf eine Entscheidung,
    die mit dem Streitgegenstand nichts zu tun hatte. Das Gericht wies den Antrag zurueck, weil weder
    ein erheblicher Schaden dargelegt noch Sicherheit geleistet war, und befasste sich in Ziff. 26 mit
    der Herkunft des Zitats.
  ergebnis: 'Antrag zurueckgewiesen. Ziff. 26 im Wortlaut: "I hope that this was just a human error which
    did not involve Artificial Intelligence (herein AI). In case it is related to AI then it serves as
    a stark cautionary tale against the uncritical use of Artificial Intelligence in legal drafting. ...
    the Applicants have inadvertently signaled a total abdication of human legal oversight in favor of
    automated, context-blind writing. Where AI simply hallucinates and generates non-existent cases or
    irrelevant authorities. There is all the good in AI but it must be keenly supervised. ... advocates
    must personally verify their authorities to ensure they are relevant, accurate, and substantively
    sound." Eine foermliche Sanktion wurde nicht verhaengt; die Folge blieb der Glaubwuerdigkeitsverlust
    und die Kostenlast.'
  themenachsen:
  - berufsrecht
  - sektor-oeffentlich
  normen: []
  bedeutung_begruendung: 'Erweitert die Halluzinationsrechtsprechung um eine Variante, die in den US-Faellen
    fehlt: Das zitierte Urteil existiert, es passt nur nicht. Das Gericht behandelt die kontextblinde,
    aber echte Fundstelle als dasselbe Versagen wie die erfundene - und knuepft die Sanktion nicht an
    die Unwahrheit, sondern an die Preisgabe menschlicher Kontrolle. Damit ist es fuer den Streitstand
    zur Sanktionierung halluzinierter Fundstellen die schaerfste Gegenposition zu der Ansicht, es komme
    allein auf die Existenz der Fundstelle an. Zugleich auffaellig: Das Gericht unterstellt den KI-Einsatz
    nicht, sondern formuliert im Konjunktiv - ein methodisch sauberer Umgang mit einem nicht beweisbaren
    Verdacht.'
  pruefvermerk:
  - 07.09.2026 am amtlichen Volltext auf new.kenyalaw.org geprueft; Ziff. 25-29 im Wortlaut gelesen.
  letzte_pruefung: 2026-09-07
  quelle_art: amtlich
