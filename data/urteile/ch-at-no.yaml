  datum: 2024-10-17
  volltext_url: https://search.bger.ch/ext/eurospider/live/de/php/clir/http/index.php?lang=de&type=show_document&highlight_docid=atf%3A%2F%2F151-I-137%3Ade
  verifiziert: true
  bedeutung: hoch
  leitsatz: 'Abstrakte Normenkontrolle gegen das Polizeigesetz des Kantons Luzern. Das Bundesgericht hob
    § 4quinquies (automatische Fahrzeugfahndung, AFV) und § 4octies (polizeilicher Informationssystem-Verbund)
    als unverhältnismässig und ohne hinreichende gesetzliche Grundlage auf. Zu § 4sexies (Analysesysteme
    für serielle Kriminalität) entschied es im Wege verfassungskonformer Auslegung: Der Einsatz "intelligenter
    Systeme" mit algorithmischer Entscheidfindung, insbesondere automatisierter Gesichtserkennung, stellt
    einen SCHWERWIEGENDEN GRUNDRECHTSEINGRIFF dar und bedarf einer ausdrücklichen formellgesetzlichen
    Grundlage. Die Norm sei deshalb restriktiv zu verstehen: zulässig seien nur einfache Analysesysteme
    mit manueller Datenauswertung durch Menschen, nicht algorithmengesteuerte Systeme. Damit ist dies
    der Leitentscheid des schweizerischen Bundesgerichts zu algorithmischer Datenanalyse und Gesichtserkennung
    im Polizeirecht und die wichtigste KI-Entscheidung der Schweiz überhaupt.

    '
