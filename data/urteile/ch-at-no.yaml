  verifiziert: true
  bedeutung: mittel
  leitsatz: 'Markenrecht: Das Wortzeichen "AI Brain" ist vom Markenschutz ausgeschlossen. Die massgeblichen
    Abnehmer verstehen "AI" unmittelbar als "artificial intelligence", weil KI "heutzutage in aller Munde
    ist" und die entsprechenden Akronyme "wie selbstverständlich verwendet werden". Das Zeichen ist deshalb
    beschreibend: Es charakterisiert die beanspruchten Waren und Dienstleistungen dadurch, dass sie mit
    künstlicher Intelligenz ausgestattet sind oder diese nutzen. Beschwerde abgewiesen. Praktisch bedeutsam
    für die Markenstrategie von KI-Unternehmen in der Schweiz und als Beleg dafür, dass das Bundesgericht
    die Verkehrsauffassung zu "KI/AI" bereits 2023 als allgemein bekannt behandelte.

    '
