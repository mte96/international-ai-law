  aktenzeichen: '19-сон / Постановление Пленума № 19 vom 23.06.2023 („О некоторых вопросах рассмотрения
    дел, связанных с интеллектуальной собственностью")

    '
  datum: 2023-06-23
  volltext_url: https://lex.uz/ru/docs/6522625
  verifiziert: true
  bedeutung: mittel
  leitsatz: 'Ziff. 26: Autor ist die natürliche Person, die das Werk durch ihre SCHÖPFERISCHE ARBEIT geschaffen
    hat; Personen, die ihr technische Unterstützung geleistet haben (Texterfassung, Korrektur und Ähnliches),
    werden NICHT als Miturheber anerkannt. Ziff. 36: Sammelwerke (Enzyklopädien, Anthologien, Datenbanken)
    sind geschützt, soweit Auswahl oder Anordnung Ergebnis schöpferischer Arbeit sind; dem Zusammensteller
    stehen die Rechte an Auswahl und Anordnung zu, und bei Sammelwerken auf Grundlage anderer Werke ist
    zu prüfen, ob die Rechte an jedem einbezogenen Werk gewahrt sind (schriftliche Zustimmung oder Urhebervertrag).
    Der Beschluss erwähnt künstliche Intelligenz NICHT; er ist gleichwohl die maßgebliche Auslegungsgrundlage,
    an der usbekische Gerichte die Abgrenzung zwischen schöpferischer Leistung des Menschen und technischer
    Erzeugung durch die Maschine vornehmen werden.

    '
