  verifiziert: true
  bedeutung: hoch
  leitsatz: 'Das Bildnis einer Person in JEDER Form — ausdrücklich einschließlich „цифровая модель, графическое
    или ИСКУССТВЕННО СОЗДАННОЕ ИЗОБРАЖЕНИЕ" — ist als persönliches Nichtvermögensrecht geschützt; Erstellung,
    Nutzung, Vervielfältigung und Verbreitung sind nur mit Einwilligung zulässig. Als Verletzung dieses
    Rechts gilt ausdrücklich auch die „цифровая обработка изображения, приводящая к искажению первоначального
    облика лица (ВКЛЮЧАЯ ДИПФЕЙК, внедрение в видеоматериалы, создание поддельных «скриншотов» и т.д.)".
    Die Gerichte haben festzustellen: die Tatsache der Aufzeichnung, Nutzung oder Verbreitung; die Möglichkeit
    der Identifizierung der Person auf Videobildern, die mittels digitaler Verarbeitung und KI-TECHNOLOGIEN
    erzeugt wurden — „в том числе по совокупности внешних, ГОЛОСОВЫХ, БИОМЕТРИЧЕСКИХ признаков"; Umstände
    einer zufälligen Ähnlichkeit; und Beweise für die Unrichtigkeit des Bildes. Rechtsfolgen: Feststellung
    der Rechtswidrigkeit, Löschung oder Sperrung des Bildes im digitalen Raum, Verpflichtung zur Löschung,
    Sperrung oder technischen Zugangsbeschränkung (einschließlich durch Ansprache der Plattformadministratoren),
    Untersagung der weiteren Nutzung, Ersatz des materiellen Schadens und des immateriellen Schadens sowie
    Wiederherstellung des vorigen Zustands. Steht das Bildnis in negativem Kontext (beleidigende Veröffentlichung,
    Parodie, gefälschter Text, verfälschte Information), sind neben dem Recht am eigenen Bild auch Ehre,
    Würde, geschäftliches Ansehen und das Recht auf Unantastbarkeit des Privatlebens geschützt.

    '
