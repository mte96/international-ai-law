  aktenzeichen_original: '"PROV. DEL CHUBUT c/ PAYALEF, Raúl Amelio s/ recurso de queja", Expediente N.º
    101215 – Año 2025 – Carpeta Judicial N.º 6209 – OJ Esquel'
  ecli: ''
  datum: 2026-03-13
  parteien:
    klaeger: Ministerio Público Fiscal de la Provincia del Chubut (Fiscales Rafaella Riccono und María
      Bottini)
    beklagter: Raúl Amelio Payalef
  status: rechtsmittel
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - grundrechte
  - governance
  anspruchsgrundlage: Art. 161 bis 164 Código Procesal Penal del Chubut (abschliessendes und restriktives
    Nichtigkeitsregime); Art. 6, 25, 27, 329 und 369 CPP Chubut; Art. 169 Constitución de la Provincia
    del Chubut (Begründungspflicht); Acuerdo Plenario N.º 5435/2025
  kernfrage: 'Begründet die Verletzung einer justizinternen KI-Richtlinie durch den erkennenden Richter
    die Nichtigkeit des Urteils — und ist die blosse Ununterscheidbarkeit von richterlicher und maschineller
    Urheberschaft der Begründung ein Nichtigkeitsgrund?

    '
  ergebnis: 'NEIN in beiden Punkten. Der Superior Tribunal de Justicia del Chubut gab der Beschwerde der
    Staatsanwaltschaft statt, hob die Nichtigkeitserklärung der Cámara Penal de Esquel vom 16.10.2025
    auf und verwies die Sache an die Cámara Penal in anderer Besetzung zurück, damit sie über die offen
    gebliebenen Rügen der Verteidigung in der Sache entscheidet. Damit ist die erstinstanzliche Verurteilung
    Payalefs (04.06.2025, zwei Jahre sechs Monate Freiheitsstrafe wegen Raubes, Art. 45 und 164 Código
    Penal) wiederhergestellt.

    Die tragenden Sätze: (1) "La sanción reviste carácter excepcional y exige una afectación sustancial."
    — Das Nichtigkeitsregime der Art. 161 ff. CPP Chubut ist abschliessend und restriktiv; unwirksam ist
    eine Handlung nur, wenn eine Verfassungsgarantie berührt oder ein konkreter Nachteil entstanden ist.
    (2) "El principio de trascendencia excluye así las nulidades fundadas en meras irregularidades formales."
    (3) "La inteligencia artificial es una herramienta de apoyo y nunca una fuente autónoma de decisión."
    (4) "El control humano debe ser real, crítico y previo a la emisión del pronunciamiento." (5) Zur
    Beratung: "La misma es secreta y ese carácter torna inexigible que se consignen en una sentencia los
    insumos." — Gegenstand der gerichtlichen Kontrolle ist allein die nach aussen tretende Begründung,
    nicht der innere Herstellungsvorgang und nicht die dabei benutzten Hilfsmittel. (6) Das Acuerdo Plenario
    N.º 5435/2025 setzt Handlungsmassstäbe für Verwaltungs- und Rechtsprechungstätigkeit, erhebt aber
    keine eigenständigen Nichtigkeitsgründe und ändert das abschliessende Regime der Strafprozessordnung
    nicht.

    Das Gericht hat ferner klargestellt, dass die Unmöglichkeit, den Gedankengang nachzuvollziehen, für
    sich genommen weder einen Verzicht auf richterliche Prüfung noch eine Verletzung des Verteidigungsrechts
    belegt.

    '
  bedeutung: hoch
  volltext_url: null
  zusammenfassung_url: https://jusnoticias.juschubut.gov.ar/polemica-por-el-uso-de-ia-el-stj-revirtio-un-fallo-de-camara-y-valido-lo-actuado-por-richeri/
  sekundaerquelle_url: https://www.eldial.com/nuevo/nuevo_diseno/v2/fallo4.asp?base=14&id=65437&t=j&h=u
  bezug_regelwerke:
  - ar-acuerdo-plenario-5435-2025
  - ar-codigo-penal
  instanzenzug:
  - ar-2025-esquel-ki-urteil
  quelle_tracker: 'Amtlich: Jusnoticias (Poder Judicial del Chubut) und Ministerio Público Fiscal del
    Chubut. Volltext über die Sammlung der Revista Pensamiento Penal (PDF) und eldial.com; eine amtliche
    Volltextveröffentlichung in der Eureka-Datenbank des STJ war nicht auffindbar — die anonyme Fallsuche
    der Datenbank war in dieser Sitzung nicht erreichbar.'
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die wichtigste lateinamerikanische Entscheidung zum KI-Einsatz durch den Richter
    — und die Gegenposition zur kolumbianischen Linie. Der STJ Chubut trennt sauber zwischen dem Herstellungsvorgang
    der Entscheidung und ihrem Begründungsergebnis: Kontrollgegenstand ist die exteriorisierte Begründung,
    das Werkzeug ist als solches kein Nichtigkeitsgrund. Das Argument aus dem Beratungsgeheimnis ist dabei
    das juristisch Eleganteste an der Entscheidung — wenn die Beratung geheim ist, kann niemand verlangen,
    dass die dabei verwendeten "insumos" im Urteil offengelegt werden. Genau daran scheitert jede Offenlegungspflicht,
    die man aus dem Verfahrensrecht statt aus dem Berufsrecht ableiten will.

    Für den deutschen Zugriff ist das die entscheidende Weichenstellung: Ein Begründungsmangel muss sich
    am Text zeigen lassen. Die blosse Ununterscheidbarkeit von menschlicher und maschineller Urheberschaft
    genügt nicht — anders als in Kolumbien (co-2025-tribunal-bogota), wo die Nichtigkeit an erfundene
    Fundstellen und damit an einen greifbaren Begründungsmangel anknüpfte. In Esquel war die Begründung
    nicht falsch, nur ihre Urheberschaft unklar.

    Institutionell bemerkenswert ist die zweite Aussage: Die Verletzung des Acuerdo Plenario 5435/2025
    ist Berufsrecht, nicht Verfahrensrecht. Damit hat weltweit erstmals ein Höchstgericht eine Justiz-KI-Richtlinie
    auf ihre prozessualen Folgen hin geprüft — und ihr die prozessuale Wirkung ausdrücklich abgesprochen.
    Wer in Deutschland über Offenlegungspflichten beim KI-Einsatz in der Justiz nachdenkt, muss diesen
    Befund verarbeiten: Eine Richtlinie ohne prozessuale Sanktion ist disziplinarrechtlich wirksam und
    verfahrensrechtlich folgenlos.

    Der Fall ist damit das Gegenteil dessen, wofür er international zitiert wird. Wer Esquel als Beleg
    dafür anführt, dass undeklarierter KI-Einsatz zur Nichtigkeit führt, zitiert eine aufgehobene Entscheidung.

    '
  dokumenttyp: Resolución des Superior Tribunal de Justicia; Volltext-PDF aus der Sammlung Revista Pensamiento
    Penal, amtliche Mitteilungen von Jusnoticias (STJ) und MPF Chubut
  pruefvermerk:
  - 'Am Volltext geprüft (PDF, Revista Pensamiento Penal): zitierte Vorschriften Art. 6, 25, 27, 161 bis
    164, 329 und 369 Código Procesal Penal del Chubut sowie Art. 169 der Provinzverfassung; Acuerdo Plenario
    N.º 5435/2025. Weder Art. 18 der Nationalverfassung noch Art. 22 der Provinzverfassung werden zitiert.'
  - Fünf wörtliche Zitate am Volltext abgenommen; die parte resolutiva umfasst fünf Punkte. Die Unterschriftenzeile
    war aus dem PDF nicht auslesbar — die Besetzung ist über die amtliche Mitteilung Jusnoticias belegt
    (Banfi Saavedra, Bustos, Giacomone, Raidan, Vivas; Napolitani abwesend).
  - 'WIDERSPRUCH in den Sekundärquellen zum Datum: Jusnoticias (amtlich), eldial und Pensamiento Penal
    nennen übereinstimmend den 13.03.2026; palabrasdelderecho.com.ar nennt den 16.03.2026, der MPF Chubut
    den 17.03.2026 als Veröffentlichungsdatum. Massgeblich ist der 13.03.2026.'
  - Der materielle Vorwurf (Raub, Art. 45 und 164 Código Penal) ist nur über palabrasdelderecho belegt,
    nicht am Volltext.
