    artificial" am 06.09.2026 im Browser
  dokumenttyp: Tesis aislada (Leitsatz) mit Angabe des zugrunde liegenden Präzedenzfalls
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Dies ist die fehlende Hälfte des mexikanischen KI-Justiz-Komplexes. Erfasst war bisher
    nur die Ethik-Tesis 2031010 ("Elementos mínimos"). Ohne diese Schwester-Tesis fehlt die Erlaubnisnorm:
    2031009 sagt, DASS KI eingesetzt werden darf, 2031010 sagt, WIE. Beide stammen aus demselben Verfahren
    (Queja 212/2025, entschieden am 29.07.2025) und wurden am 22.08.2025 gemeinsam veröffentlicht.

    Rechtsvergleichend interessant ist die Argumentationsfigur: Statt einer abstrakten Zulässigkeitsprüfung
    zerlegt das Gericht die richterliche Tätigkeit in einen unantastbaren Entscheidungskern und delegierbare
    Hilfstätigkeiten. Das ist genau die Unterscheidung, die Art. 14 KI-VO mit dem Begriff der wirksamen
    menschlichen Aufsicht voraussetzt, ohne sie zu operationalisieren. Der mexikanische Ansatz ist konkreter
    als alles, was der europäische Rechtsraum bisher hat — und zugleich riskanter, weil die Grenze zwischen
    "razonamiento numérico" und "razonamiento jurídico" in der Praxis unscharf ist: Wer die Kautionshöhe
    festsetzt, entscheidet faktisch über den Zugang zum einstweiligen Rechtsschutz.

    '
