- id: nz-2025-odriscoll-rehab-co
  jurisdiktion: nz
  gericht: Employment Relations Authority / Te Ratonga Ahumana Taimahi (Member Sarah Kennedy-Martin)
  instanz: behoerde
  aktenzeichen: O'Driscoll v Rehab Co Mobile Limited [2025] NZERA 746; ERA-Verfahrensnummer 3287259
  ecli: ''
  datum: 2025-11-18
  parteien:
    klaeger: O'Driscoll (nicht vertretene Partei)
    beklagter: Rehab Co Mobile Limited und weitere
  status: erstinstanzlich
  themenachsen:
  - berufsrecht
  - arbeit
  anspruchsgrundlage: Employment Relations Act 2000 (Arbeitnehmereigenschaft); Courts of New Zealand,
    Guidelines for Use of Generative Artificial Intelligence in Courts and Tribunals — Non-lawyers (07.12.2023)
  kernfrage: 'Wie kann eine Spruchstelle KI-gestützte Schriftsätze überprüfen, bevor sie ihnen folgt?

    '
  ergebnis: 'In der Sache stellte die Authority fest, Herr O''Driscoll sei nicht Arbeitnehmer gewesen.
    Für die KI-Frage ist Randnummer 6 massgeblich: Herr O''Driscoll bestätigte, er sei bei der Darstellung
    seines Falles vor der Authority von künstlicher Intelligenz unterstützt worden. Er wurde daran erinnert,
    dass es seine Pflicht sei, die Richtigkeit der herangezogenen Angaben zu prüfen, und er wurde AUFGEFORDERT,
    Kopien der beiden in seinen Schriftsätzen angeführten Entscheidungen VORZULEGEN; auch die Gegenseite
    verlangte sie. Die Entscheidungen wurden vorgelegt. In der Fussnote verweist die Authority auf die
    Gerichtsleitlinien.

    '
  bedeutung: mittel
  volltext_url: null
  zusammenfassung_url: ''
  sekundaerquelle_url: https://www.nzlii.org/nz/cases/NZERA/2025/746.html
  bezug_regelwerke:
  - nz-courts-genai-guidelines-2023
  instanzenzug: []
  normen: []
  quelle_tracker: NZLII, Datenbank New Zealand Employment Relations Authority Decisions
  dokumenttyp: Determination der Employment Relations Authority
  verifiziert: true
  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - Am Entscheidungstext auf NZLII geprüft (06.09.2026); Randnummer 6 und Fussnote 1 sowie Spruchstelle,
    Verfahrensnummer und Ergebnis wurden gelesen.
  - 'Folgeentscheidung nicht ausgewertet: O''Driscoll v Rehab Co Mobile Limited [2026] NZERA 106 vom 26.02.2026
    enthält nach dem NZLII-Trefferbild ebenfalls eine KI-Fundstelle; der Text wurde in dieser Sitzung
    nicht geprüft.'
  eigene_bewertung: 'Verfahrensrechtlich die lehrreichste der neuseeländischen Entscheidungen, obwohl
    sie die geringste Aufmerksamkeit hat. Die Authority sanktioniert nicht im Nachhinein, sondern ordnet
    PRÄVENTIV die Vorlage der zitierten Entscheidungen an, sobald der KI-Einsatz offengelegt wird. Das
    ist der einzige Mechanismus in der gesamten internationalen Kasuistik, der das Problem löst, statt
    es zu bestrafen — und er kostet nichts, weil das Gericht ohnehin die Fundstelle braucht.

    Für die deutsche Praxis ist das unmittelbar übertragbar: § 139 ZPO trägt eine Auflage, die zitierten
    Fundstellen in Kopie beizubringen, ohne dass es einer neuen Vorschrift bedürfte. Bemerkenswert ist
    ausserdem, dass die Partei den KI-Einsatz von sich aus einräumte — die Offenlegung wurde offenbar
    nicht bestraft, was sie für künftige Parteien attraktiv hält. Wer Sanktionsregime entwirft, sollte
    diesen Anreizeffekt mitdenken.

    '
  quelle_art: fehlt
- id: nz-2026-noble-commissioner-police
  jurisdiktion: nz
  gericht: Court of Appeal of New Zealand / Te Kōti Pīra o Aotearoa (Ellis und Collins JJ)
  instanz: berufung
  aktenzeichen: Noble v Commissioner of Police [2026] NZCA 153; CA297/2025 und CA310/2025
  ecli: ''
  datum: 2026-05-04
  parteien:
    klaeger: Mr und Ms Noble (nicht vertretene Parteien)
    beklagter: Commissioner of Police
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - grundrechte
  anspruchsgrundlage: Verfahrensrecht des Court of Appeal (Fristverlängerung für die Einlegung des Rechtsmittels);
    im Hintergrund die Einziehung von Vermögen nach dem Criminal Proceeds (Recovery) Act 2009
  kernfrage: 'Steht es einer Fristverlängerung entgegen, dass die Rechtsmittelbegründung weitgehend auf
    KI-erzeugtem Material mit unzutreffenden oder nicht existierenden Fundstellen beruht?

    '
  ergebnis: 'Nein. Das Gericht stellte in Randnummer 10 fest: Mr und Ms Noble hätten sich offenbar in
    erheblichem Umfang auf von künstlicher Intelligenz erzeugtes Material gestützt und dabei zahlreiche
    Entscheidungen zitiert, von denen die meisten unerheblich seien oder nicht existierten; in der Fussnote
    wird auf die Gerichtsleitlinien für Nichtjuristen verwiesen. Gleichwohl gab das Gericht in Randnummer
    21 den Anträgen auf Fristverlängerung statt und ordnete die Einreichung des Verfahrensstands an. Die
    geltend gemachten Rechtsmittelgründe (unbillige Härte durch die Einziehung des Grundstücks in Tauranga,
    fehlende Beweisgrundlage für die Feststellung zur unterlassenen Zahlung von Kommunalabgaben, unzureichende
    Berücksichtigung der kulturellen und whānau-bezogenen Auswirkungen des Verlusts des Familienheims)
    prüfte das Gericht eigenständig.

    '
  bedeutung: mittel
  volltext_url: null
  zusammenfassung_url: ''
  sekundaerquelle_url: https://www.nzlii.org/nz/cases/NZCA/2026/153.html
  bezug_regelwerke:
  - nz-courts-genai-guidelines-2023
  instanzenzug: []
  normen: []
  quelle_tracker: NZLII, Datenbank New Zealand Cases
  dokumenttyp: Judgment des Court of Appeal über Anträge auf Fristverlängerung
  verifiziert: true
  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - Am Entscheidungstext auf NZLII geprüft (06.09.2026); Randnummern 10 und 21 sowie Spruchkörper, Aktenzeichen
    und Datum wurden gelesen.
  - 'Verwandtes Verfahren nicht ausgewertet: Police v Noble [2026] NZDC 6926 vom 31.03.2026 erscheint
    ebenfalls in der NZLII-Trefferliste zu "artificial intelligence"; der Text wurde in dieser Sitzung
    nicht geprüft.'
  eigene_bewertung: 'Die zeitlich erste neuseeländische Rechtsmittelentscheidung NACH Jones v Family Court
    at Whangārei — und sie zieht die Zügel nicht an, sondern lockert sie. Trotz "multiple cases, most
    of which are irrelevant or do not exist" wird die Fristverlängerung gewährt, keine Kostenfolge, keine
    Kontemptandrohung, kein Verweis auf die in Jones benannten Straftatbestände.

    Das ist die für die Praxis wichtigste Beobachtung: Die scharfe Warnung des höchsten Gerichts hat die
    Instanzpraxis binnen drei Monaten nicht verändert. Wer Jones als Wendepunkt zitiert, sollte Noble
    danebenlegen. Erklärbar ist die Milde durch den Verfahrensgegenstand — Vermögenseinziehung gegen eine
    nicht vertretene Familie, mit ausdrücklich benannten kulturellen und whānau-bezogenen Belangen. Der
    Zugang zum Gericht schlägt die Disziplinierung. Damit steht die Entscheidung in derselben Linie wie
    die israelischen Fälle Plonit (keine Sanktion zulasten der Mandantin) und Badasch (Streichung des
    Schriftsatzes als extremes Mittel abgelehnt) — es bildet sich international eine Gegenbewegung zur
    Sanktionsverschärfung heraus, getragen vom Rechtsschutzgedanken.

    '
  quelle_art: fehlt
- id: nz-2026-bnz-mundy
  jurisdiktion: nz
  gericht: High Court of New Zealand / Te Kōti Matua o Aotearoa (Associate Judge Sussock)
  instanz: erstinstanzlich
  aktenzeichen: Bank of New Zealand v Mundy [2026] NZHC 1127; CIV-2025-419-135 und CIV-2025-419-136
  ecli: ''
  datum: 2026-06-02
  parteien:
    klaeger: Bank of New Zealand
    beklagter: Mr und Ms Mundy (nicht vertretene Parteien), im Zusammenhang mit der Auctus Group
  status: erstinstanzlich
  themenachsen:
  - berufsrecht
  - sektor-finanz
  anspruchsgrundlage: Insolvenzrecht (Anträge auf Insolvenzeröffnung); im Streit stand eine implizite
    Pflicht zu Treu und Glauben im Kreditvertrag
  kernfrage: 'Wie ist ein Vortrag zu behandeln, der sich auf eine nicht existierende Entscheidung stützt
    und dessen KI-Ursprung nur vermutet werden kann?

    '
  ergebnis: 'Das Gericht wies den Antrag der Mundys auf Aussetzung zurück und gab dem Antrag der Bank
    auf Insolvenzeröffnung statt. Für die KI-Frage ist Randnummer 93 mit Fussnote 12 massgeblich: Das
    Gericht hielt fest, es sei sich bewusst, dass die Mundys in eigener Sache aufträten, aber eine der
    zur Stützung der behaupteten Einwendung herangezogenen Entscheidungen existiere nicht. In der Fussnote
    heisst es, das könne auf den Einsatz von KI bei der Erstellung der Schriftsätze zurückzuführen sein;
    wie in den Guidelines for Use of Generative Artificial Intelligence in Courts and Tribunals for Non-Lawyers
    ausgeführt, seien Entscheidungen darauf zu prüfen, dass es sich nicht um Halluzinationen handele,
    bevor man sie vor Gericht anführe. Die zweite herangezogene Entscheidung (Livingstone v Roskilly [1992]
    3 NZLR 230) existierte, trug den behaupteten Rechtssatz aber nicht in der beanspruchten Reichweite.

    '
  bedeutung: niedrig
  volltext_url: null
  zusammenfassung_url: ''
  sekundaerquelle_url: https://www.nzlii.org/nz/cases/NZHC/2026/1127.html
  bezug_regelwerke:
  - nz-courts-genai-guidelines-2023
  instanzenzug: []
  normen: []
  quelle_tracker: NZLII, Datenbank New Zealand Cases
  dokumenttyp: Judgment eines Associate Judge des High Court
  verifiziert: true
  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - Am Entscheidungstext auf NZLII geprüft (06.09.2026); Randnummern 93 und 94 sowie Fussnoten 12 und
    13, Spruchkörper, Aktenzeichen und Tenor wurden gelesen.
  eigene_bewertung: 'Aufgenommen wegen einer feinen, aber wichtigen Unterscheidung, die sonst nirgends
    so klar auftritt: Das Gericht behandelt in derselben Randnummer zwei Fehlertypen nebeneinander — eine
    Entscheidung, die es nicht gibt, und eine, die es gibt, deren Aussage aber überdehnt wird. Nur der
    erste ist eine Halluzination im engeren Sinn; der zweite ist die weit häufigere und schwerer zu entdeckende
    Fehlleistung generativer Systeme. Die Rechtsprechung und die Zähldatenbanken konzentrieren sich fast
    ausschliesslich auf den ersten Typ. Wer Prüfpflichten formuliert, sollte beide erfassen; eine Vorlagepflicht
    wie in O''Driscoll erfasst nur den ersten.

    '
  quelle_art: fehlt
- id: nz-2026-eb-india-ipt
  jurisdiktion: nz
  gericht: Immigration and Protection Tribunal / Te Taraipiunara Manene me te Whakamarumaru (Member S
    O'Connor)
  instanz: berufung
  aktenzeichen: EB (India) v A Refugee and Protection Officer [2026] NZIPT 802868
  ecli: ''
  datum: 2026-03-24
  parteien:
    klaeger: EB, indischer Staatsangehöriger (Appellant, anonymisiert)
    beklagter: A Refugee and Protection Officer (Refugee Status Unit)
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  anspruchsgrundlage: Immigration Act 2009 (NZ), Verfahren über die Anerkennung als Flüchtling und als
    geschützte Person; freie Beweiswürdigung, insbesondere Glaubhaftigkeitsprüfung
  kernfrage: 'Darf der Einsatz generativer KI bei der Abfassung der eigenen schriftlichen Aussage einer
    Partei gegen ihre Glaubwürdigkeit gewertet werden?

    '
  ergebnis: 'Ja. Unter der eigenen Zwischenüberschrift "Use of generative artificial intelligence" (Randnummern
    75 bis 79) stellte das Tribunal fest: Die schriftliche Aussage des Beschwerdeführers vom 09.02.2024
    bestand aus zwei Seiten, die denselben Sachverhalt in unterschiedlicher Sprache wiedergaben, wobei
    die Briefversion die Angaben der zweiten Seite ausschmückte; entscheidend war, dass die zweite Seite
    mit dem Satz endete: "write a written statement in 500 words in a chronological order from the above
    information and keep all the details written above by keeping the guidline (sic) in mind of INZ1362"
    — also mit einer stehengebliebenen Modellanweisung. Der Beschwerdeführer erklärte, ein Verwandter
    habe bei der Übersetzung geholfen und es müsse etwas hineinkopiert worden sein; auf die Frage, ob
    und in welchem Umfang generative KI eingesetzt worden sei, ging er nicht ein. Die Prozessbevollmächtigte
    räumte den möglichen Einsatz ein, machte aber geltend, er untergrabe die Angaben nicht. Das Tribunal
    war in Randnummer 79 davon überzeugt, dass generative künstliche Intelligenz bei der Erstellung eines
    Teils der schriftlichen Aussage eingesetzt worden sei und dies zu einer übertriebenen Darstellung
    des Vorbringens geführt habe; die UNBEABSICHTIGTE statt offene Offenlegung des Einsatzes untergrabe
    die allgemeine Glaubwürdigkeit des Beschwerdeführers zusätzlich. Das Rechtsmittel wurde in Randnummer
    106 zurückgewiesen.

    '
