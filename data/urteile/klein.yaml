  sachverhalt: 'Die Polizei wies die 數位產業署 (Administration for Digital Industries) darauf hin, dass über
    die Handelsplattform der 旋轉拍賣有限公司 (Carousell Co., Ltd.) mutmaßlich personenbezogene Daten abgeflossen
    seien. Die 數位產業署 — eine dem Digitalministerium 數位發展部 nachgeordnete Behörde — erließ daraufhin im Januar
    und Februar 2023 zwei Verfügungen: Carousell sollte binnen zwei Monaten die Benachrichtigung der Betroffenen
    nach § 12 個人資料保護法 nachholen und angemessene Sicherheitsmaßnahmen nach § 27 Abs. 1 PDPA einrichten.
    Carousell wandte sich gegen beide Verfügungen und machte unter anderem geltend, die erlassende Behörde
    sei dafür nicht zuständig gewesen. Das 臺北高等行政法院 wies die Klage am 9. Januar 2025 ab (112年度訴字第889號);
    das Unternehmen legte, vertreten durch Rechtsanwalt 吳志光 sowie die Rechtsanwältinnen 蕭秀玲 und 陳毓芬, Revision
    zum 最高行政法院 ein.'
