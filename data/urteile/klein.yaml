  anspruchsgrundlage: Art. 29 und Art. 86 der Verfassung Kolumbiens; Rechtsprechung zur vía de hecho
  kernfrage: 'Verletzt ein Berufungsgericht das Recht auf ein faires Verfahren, wenn es seine Entscheidung
    auf Urteile stützt, deren zitierte Passagen nicht existieren?

    '
  ergebnis: 'Berichterstatterin Adriana López Martínez. Das Tribunal Superior de Sincelejo hatte eine
    erstinstanzliche Entscheidung aufgehoben und sich dabei auf zwei angebliche Entscheidungen der Corte
    Suprema gestützt (STC13560-2023 und STC4734-2025). Bei der Überprüfung stellte die Sala fest, dass
    die zitierten Passagen nicht existieren. Sie hob die Entscheidung des Tribunals auf und qualifizierte
    den Fehler als vía de hecho, die das Recht auf ein faires Verfahren verletzt. Die Berichterstattung
    stellt den Bezug zur Halluzinationsproblematik generativer Systeme her; ob das Tribunal tatsächlich
    KI eingesetzt hat, ist der Entscheidung nach den vorliegenden Berichten nicht zu entnehmen.

    '
  bedeutung: mittel
  volltext_url: null
  zusammenfassung_url: https://www.infobae.com/colombia/2025/11/12/historico-fallo-de-la-corte-suprema-sobre-el-uso-de-la-ia-en-colombia-por-primera-vez-anulo-una-decision-judicial-apoyada-en-citas-falsas/
  bezug_regelwerke:
