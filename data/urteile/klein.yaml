  anspruchsgrundlage: 'Gesucht wurde nach Entscheidungen zu: Copyright Act 1994 (Training, computererzeugte
    Werke), Privacy Act 2020 und Biometric Processing Privacy Code 2025, Fair Trading Act 1986 (irreführende
    KI-Werbung), Human Rights Act 1993 (algorithmische Diskriminierung), s. 363A Social Security Act 2018
    (automatisierte Verwaltungsentscheidungen), Harmful Digital Communications Act 2015 (Deepfakes)'
  kernfrage: 'Gibt es neuseeländische Rechtsprechung zu KI-Training, computererzeugten Werken, Gesichtserkennung,
    automatisierten Verwaltungsentscheidungen, algorithmischer Diskriminierung und irreführender KI-Werbung?

    '
  ergebnis: 'Recherchestand 06.09.2026, Grundlage ist die NZLII-Volltextsuche in der Datenbank New Zealand
    Cases sowie die Publikationsverzeichnisse des Office of the Privacy Commissioner.

    TREFFERBILD NZLII: "generative artificial intelligence" = 21 Dokumente in allen Datenbanken, davon
    zwölf Entscheidungen. "artificial intelligence" = 83 Dokumente in New Zealand Cases; der überwiegende
    Teil sind Zufallstreffer (Marken- und Patentverfahren zu KI-bezogenen Waren, Immigrationsverfahren
    mit KI im Berufsbild, Werbeselbstkontrolle zu KI-Funktionen von Geräten). "deepfake" = 16 Dokumente,
    davon zwei Entscheidungen.

    KEIN BEFUND zum Urheberrecht: Es gibt keine neuseeländische Entscheidung zu s. 5 Abs. 2 lit. a Copyright
    Act 1994 (Urheber eines computererzeugten Werks ist, wer die erforderlichen Vorkehrungen trifft) und
    keine zum Training mit geschützten Werken. Die Schlüsselnorm des neuseeländischen KI-Urheberrechts
    ist nach über dreissig Jahren unangewandt.

    KEIN BEFUND zum Datenschutz vor Gerichten: Weder die Case Notes des Privacy Commissioner (370 Einträge,
    zuletzt Case Note 329928 [2026] NZ Priv CMR 1 vom 21.08.2026) noch die auf privacy.org.nz nachgewiesenen
    Entscheidungen des Human Rights Review Tribunal (zuletzt Holmes v Housing New Zealand, 11.09.2025)
    betreffen KI, Algorithmen, Biometrie oder automatisierte Entscheidungen. Der einzige substantielle
    Befund ist die Untersuchung des Privacy Commissioner zum Gesichtserkennungsversuch von Foodstuffs
    North Island, die hier gesondert erfasst ist.

    KEIN BEFUND zu automatisierten Verwaltungsentscheidungen: Zu s. 363A Social Security Act 2018 — der
    einzigen verbindlichen neuseeländischen Vorschrift über automatisiertes Verwaltungsentscheiden — existiert
    keine Rechtsprechung.

    KEIN BEFUND zu algorithmischer Diskriminierung: Zu ss. 22, 44 und 65 Human Rights Act 1993 gibt es
    keine Entscheidung mit KI-Bezug.

    KEIN BEFUND zu irreführender KI-Werbung vor Gericht: Zu ss. 9 bis 13 Fair Trading Act 1986 gibt es
    keine gerichtliche Entscheidung zu KI-Werbeaussagen. In der Werbeselbstkontrolle (Advertising Standards
    Authority) erscheinen KI-bezogene Beschwerden (u.a. Samsung 2019, Nvidia 2023, Inception Nutrition
    2026), ohne dass eine KI-spezifische Rechtsfrage entschieden würde.

    RANDBEFUND Deepfake: In Urquhart v Herald on Sunday [2025] NZMediaC 3707 vom 03.02.2025 entschied
    der Media Council über eine Beschwerde gegen die Schlagzeile "Luxon tangled in $220k AI deepfake scam".
    Hintergrund war ein KI-erzeugtes Video des Premierministers, mit dem Betrüger eine Frau um mehr als
    220.000 NZD gebracht hatten. Entschieden wurde allein über die Richtigkeit der Schlagzeile (Beschwerde
    nicht begründet, mit Sondervotum von Raynor Asher und Jo Cribb); eine KI-spezifische Rechtsfrage lag
    nicht vor. Deshalb nicht als Eintrag aufgenommen — es ist aber die einzige neuseeländische Entscheidung,
    die einen Deepfake einer öffentlichen Person zum Gegenstand hat.

    NICHT AUSGEWERTETE SPUREN: LI (China) v A Refugee and Protection Officer [2025] NZIPT 802758 (15.10.2025),
    O''Driscoll v Rehab Co Mobile Limited [2026] NZERA 106 (26.02.2026), Police v Noble [2026] NZDC 6926
    (31.03.2026), MW v Spiga Limited [2024] NZEmpC 147 (08.08.2024), Singh v Sharan Solutions Limited
    [2025] NZERA 724 (11.11.2025), Broadleaf Co., Ltd. [2024] NZIPOPAT 7 (20.05.2024) und Angel Playing
    Cards Co., Ltd. [2025] NZIPOPAT 6 (25.06.2025) sowie die Serie Fidelity National Information Services,
    Inc v Montoux Limited (in liq) (mehrere NZHC-Entscheidungen 2025/2026). Sie erscheinen in den Trefferlisten,
    wurden aber nicht gelesen. Für Broadleaf und Angel Playing Cards liegt die Vermutung nahe, dass es
    um die Patentierbarkeit KI-gestützter Erfindungen geht; das wäre ein eigenständiger, hier noch nicht
    erschlossener Fragenkreis.

    '
