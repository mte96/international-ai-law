  eigene_bewertung: 'Der Sachverhalt selbst betrifft echte, heimlich angefertigte Aufnahmen — die KI-Passage
    steht in der Auslegung. Genau deshalb ist sie interessant: Ein taiwanisches Gericht bestimmt den Anwendungsbereich
    des Jugendschutzstrafrechts fuer KI-generierte Darstellungen im Wege der Rechtsvergleichung mit Japan,
    und es stellt fest, dass die Regelungsstruktur des Jugendschutzgesetzes von der des Deepfake-Kapitels
    abweicht. Zweitens liefert die Entscheidung die dogmatische Bruecke, die den gesamten taiwanischen
    Befund zusammenhaelt: Gesichtsmerkmale in sexuellen Bildern sind besondere personenbezogene Daten
    nach § 6 Abs. 1 PDPA. Damit ist erklaert, warum in Taiwan das Datenschutzstrafrecht und nicht das
    Deepfake-Strafrecht der praktische Hebel ist.

    '
