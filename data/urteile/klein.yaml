  anspruchsgrundlage: 'Gesucht wurde nach Entscheidungen zu: Ley Federal del Derecho de Autor (Training
    und Schutzfähigkeit), LFPDPPP und LGPDPPSO (automatisierte Entscheidungen), Ley Olimpia und CPF (Deepfakes),
    LFPC (irreführende KI-Werbung), Berufsrecht der Prozessvertreter'
  kernfrage: 'Gibt es in Mexiko über die erfassten Entscheidungen hinaus Rechtsprechung mit KI-Bezug —
    insbesondere zu Deepfakes, Gesichtserkennung, algorithmischen Entscheidungen, Urheberrecht und erfundenen
    Fundstellen?

    '
  ergebnis: 'Die Volltextsuche im Semanario Judicial de la Federación (sjf2.scjn.gob.mx) ergab am 06.09.2026
    folgenden Stand.

    TESIS-Datenbank (Localización, Rubro und Texto, alle abrufbaren Epochen): "inteligencia artificial"
    = 4 Treffer, sämtlich vom Segundo Tribunal Colegiado en Materia Civil del Segundo Circuito (Registros
    2031009, 2031010, 2031639, 2031640). "algoritmo" = 0 Treffer. "deepfake" = 0 Treffer. "reconocimiento
    facial" = 0 Treffer.

    PRECEDENTES/SENTENCIAS-Datenbank: "inteligencia artificial" = 7 Treffer. Davon drei bereits erfasste
    Acciones de Inconstitucionalidad (66/2024, 80/2024, 104/2024), die Queja 404/2025 und der Amparo en
    Revisión 499/2024 (beide hier neu erfasst) sowie zwei Fundstellen ohne KI-spezifische Rechtsfrage:
    (1) Acción de Inconstitucionalidad 212/2023 (Partido Político MORENA, Wahlrecht Coahuila, Registro
    33783) — "inteligencia artificial" erscheint allein im wiedergegebenen Wortlaut einer Zuständigkeitsnorm
    des Landeswahlgesetzes ("Reglamentar el uso de Inteligencia Artificial y tecnologías que permitan
    mejorar la impartición de justicia"), ohne dass darüber entschieden wurde; (2) Amparo en Revisión
    245/2022 (Joaquín Rivera Espinosa, Primera Sala, Registro 32096) — KI wird nur als Beispiel für nicht
    schutzwürdige Massenanfragen im Petitionsrecht erwähnt ("usuarios conocidos como bots u operados a
    partir de la inteligencia artificial").

    Damit gilt: In der amtlichen mexikanischen Rechtsprechungssammlung existiert bis zum 06.09.2026 KEINE
    Entscheidung zu KI und Urheberrecht ausser dem bereits erfassten Amparo Directo 6/2025, KEINE Entscheidung
    zu Deepfake-Straftatbeständen ausser den drei Normenkontrollen, KEINE Entscheidung zu Gesichtserkennung,
    KEINE Entscheidung zu automatisierten Verwaltungsentscheidungen und KEINE Entscheidung zu erfundenen
    Fundstellen in Schriftsätzen.

    Ergänzend geprüft: PROFECO (Verbraucherschutzbehörde) — keine veröffentlichte Sanktionsentscheidung
    zu irreführender KI-Werbung auffindbar; die Behörde arbeitet mit allgemeinen Warnungen zu publicidad
    engañosa. Die Nachfolge des aufgelösten INAI (Secretaría Anticorrupción y Buen Gobierno) hat bis zum
    Recherchestand keine KI-bezogene Aufsichtsentscheidung veröffentlicht.

    '
