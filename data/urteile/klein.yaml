  ergebnis: 'Der STJ wies das Rechtsmittel zurück und sprach gegen die Prozessbevollmächtigte eine förmliche
    Verwarnung ("llamado de atención") aus. Der Schriftsatz zitierte angebliche Entscheidungen des STJ
    selbst mit unstimmigen Aktenzeichen und nicht existenten Rubren; das Gericht sprach von "uso inadecuado
    o falta de supervisión adecuada de herramientas de inteligencia artificial generativa". Jeder KI-erzeugte
    Inhalt sei kritisch zu prüfen und mit verlässlichen Quellen abzugleichen; KI sei blosse administrative
    Unterstützung, die anwaltliche Pflicht zu Analyse, Verifikation und fachlicher Beurteilung sei unübertragbar.
