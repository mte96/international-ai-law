  eigene_bewertung: 'Diese Entscheidung ist fuer das taiwanische KI-Recht wichtiger, als ihr Rubrum vermuten
    laesst. Das hoechste Verwaltungsgericht bestaetigt genau die Architektur, die Art. 2 Abs. 2 KI-Basisgesetz
    fuer KI wiederholt: dezentrale Aufsicht durch die Fachaufsichten, keine zentrale Behoerde. Und es
    zieht daraus eine harte Konsequenz — Eingriffsbefugnisse duerfen nicht nach unten delegiert werden.
    Fuer die Anwendung des Art. 5 Abs. 2 KI-Basisgesetz (Hochrisikoeinstufung durch die Fachaufsicht im
    Benehmen mit MODA) heisst das: Die Einstufung ist Sache der Fachaufsicht selbst, nicht einer nachgeordneten
    Fachbehoerde. Zugleich zeigt der Fall, wie schwerfaellig das taiwanische Modell in der Praxis ist:
    Ein Datenschutzvorfall aus 2022 ist im August 2026 letztinstanzlich an der Behoerdenzustaendigkeit
    gescheitert, ohne dass ueber die Sache entschieden worden waere.

    '
