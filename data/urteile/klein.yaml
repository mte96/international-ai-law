  anspruchsgrundlage: Art. 43 Constitución Nacional (amparo); Art. 14, 14 bis, 18, 19, 33 und 75 Nr. 22
    CN; Art. 11, 12, 13, 14, 16, 18, 34 und 36 Constitución de la CABA; Ley 25.326; Ley 1845 CABA; Übereinkommen
    108 des Europarats; Ley 5688 CABA (Art. 478, 480, 480 bis, 484, 490, 490 bis) i.d.F. der Ley 6339;
