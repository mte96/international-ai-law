    erfundene Fundstellen: angebliche Entscheidungen des Tribunal Superior de Justicia del Neuquén, Entscheidungen
    einer in der Provinzgerichtsbarkeit nicht existierenden Kammer und ein falsch wiedergegebenes Präjudiz
    der Corte Suprema. Die Kammer gab die Sache an den Colegio de Abogados de Cutral Có zur Disziplinarprüfung
    ab und bezeichnete das Verhalten als Angriff auf die geordnete Rechtspflege.

