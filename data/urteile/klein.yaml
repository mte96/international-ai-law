  sachverhalt: 'In einem indirekten Amparo-Verfahren vor dem Juzgado Decimoprimero de Distrito en el Estado
    de México mit Sitz in Naucalpan de Juárez war eine Sicherheitsleistung festzusetzen: Die Hauptforderung
    belief sich auf 3.263.040,50 Pesos, die vorläufige Suspension galt elf Tage. Gegen die Entscheidung
    des Distriktrichters legte der Betroffene — sein Name ist im amtlichen Text geschwärzt — Queja beim
    Segundo Tribunal Colegiado en Materia Civil del Segundo Circuito ein. Derselbe Spruchkörper hatte
    drei Monate zuvor, in der Queja 212/2025 vom 29. Juli 2025, erstmals ein Sprachmodell zur Berechnung
    einer Sicherheitsleistung eingesetzt und dafür Maßstäbe formuliert. Am 24. Oktober 2025 entschied
    er erneut über eine solche Berechnung.'
