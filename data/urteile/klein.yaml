  kernfrage: 'Kann eine Sanktion nach dem KI-Protokoll verhängt werden, wenn das beanstandete Verhalten
    vor dessen Inkrafttreten lag?

    '
  ergebnis: 'Nein — aber mit ausdrücklicher Warnung für die Zukunft. Das Gericht stellte fest, dass die
    zitierten Entscheidungen in den amtlichen Sammlungen nicht auffindbar waren und dass Zitierweise und
    Nichtauffindbarkeit auf einen unsachgemässen KI-Einsatz schliessen liessen. Von einer Sanktion sah
    es ab, weil das Verhalten vor Erlass der Acordada 22/25 lag; es sprach eine förmliche Verwarnung aus
    und kündigte an, künftig strikt nach dem Protokoll zu verfahren. Der Einsatz technischer Werkzeuge
    entbinde nicht von der Pflicht, jeden Inhalt zu überprüfen.

    '
