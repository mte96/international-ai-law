  anspruchsgrundlage: Art. 260 CPCC de la Provincia de Buenos Aires (Anforderungen an die Berufungsbegründung
    — konkrete und begründete Kritik); Art. 68 CPCC (Kosten)
  kernfrage: 'Genügt eine Berufungsbegründung den Anforderungen an eine konkrete und begründete Kritik,
    wenn sie ausschliesslich auf Fundstellen gestützt ist, die sich in keiner Rechtsprechungsdatenbank
    nachweisen lassen?

    '
  ergebnis: 'Nein. Die Sala I erklärte die Berufung für verlassen ("desierto") und legte die Kosten dem
    Berufungsführer auf. Die angeführten Entscheidungen — darunter ein nicht existenter Fall "Barrios"
    — liessen sich in den amtlichen Datenbanken nicht auffinden; weitere Nachweise waren ohne Datum oder
    klare Fundstelle. Die Kammer nahm generative KI als Ursache an, verzichtete aber auf eine Sanktion
    und regte stattdessen an, der örtliche Colegio de Abogados möge seine Mitglieder auf die Pflicht hinweisen,
    "verificar cuidadosamente las citas empleadas, en caso de utilizar herramientas de inteligencia artificial
    generativa para la confección de las presentaciones". Ausdrücklich herangezogen wurde der US-amerikanische
    Fall Mata v. Avianca.

    '
  bedeutung: hoch
