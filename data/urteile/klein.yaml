    auf der Website), die Fallseite den 17.08.2026 (Entscheidungsdatum). Übernommen ist das Entscheidungsdatum.'
  eigene_bewertung: 'Die erste israelische Entscheidung zu erfundenen Fundstellen aus der Arbeitsgerichtsbarkeit
    und damit der Beleg, dass die Sanktionspraxis nicht auf die Zivilgerichte beschränkt bleibt. Bemerkenswert
    ist die Kostenspaltung: Neben den Kosten der Gegenseite werden Kosten zugunsten der STAATSKASSE auferlegt.
    Das ist funktional das, was in Deutschland § 38 GKG oder eine Verzögerungsgebühr nach § 38 GKG leisten
    müsste — die Sanktion adressiert nicht den Schaden der Gegenpartei, sondern die Inanspruchnahme der
    Justizressource. Für die deutsche Diskussion um die richtige Sanktionsform bei KI-Halluzinationen
    im Schriftsatz ist das die interessantere Konstruktion als die anglo-amerikanische Kostenerstattung.

    '
  quelle_art: fehlt
