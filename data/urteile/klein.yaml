  ergebnis: 'Das Plenum änderte das Urteil des Amparo-Gerichts und gewährte der Beschwerdeführerin Rechtsschutz
    (Mehrheit von acht Stimmen; Ministra Batres Guadarrama stimmte dagegen und kündigte ein Sondervotum
    an, die Minister Guerrero García und Aguilar Ortiz behielten sich zustimmende Sondervoten vor). Für
    die KI-Frage ist Randnummer 208 massgeblich: Das Gericht stellte fest, der ICAO-Standard lasse religiös
    motivierte Kopfbedeckungen zu, "siempre que dichas prendas no obstruyan los rasgos faciales, ni generen
    sombras que afecten la uniformidad del retrato", und fügte an: "A continuación, se muestran dos ejemplos
    ilustrativos elaborados mediante inteligencia artificial, basados en los criterios técnicos contenidos
    en los documentos de la OACI". Die beiden Abbildungen sind als Anlage der veröffentlichten Entscheidung
