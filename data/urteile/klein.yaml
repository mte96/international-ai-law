  eigene_bewertung: 'Die erste argentinische Entscheidung, die den anwaltlichen KI-Einsatz zum Gegenstand
    hat, und der Ausgangspunkt einer Fallreihe, die binnen zwölf Monaten mindestens acht argentinische
    Gerichte erfasst hat. Der Rechtssatz ist knapp und trägt weit: Guter Glaube entlastet nicht; die Verifikationspflicht
    ist unteilbar. Das entspricht der US-amerikanischen Linie seit Mata v. Avianca, kommt aber ohne eine
    Rule-11-Sanktionsnorm aus — die argentinischen Gerichte greifen unmittelbar auf das Standesrecht und
    auf die zivilrechtliche Generalklausel von Treu und Glauben zu.

    Bemerkenswert ist die Sanktionsarchitektur: Die Kammer verhängt keine Ordnungsstrafe, sondern informiert
    die Anwaltskammer. Genau dieses zweistufige Modell — gerichtliche Feststellung plus berufsständische
    Disziplinarfolge — hat Río Negro ein Jahr später mit der Acordada 22/25 normiert. '
