  pruefvermerk:
  - 'Nur teilweise geprüft: Zitierweise ([2022] NZIPOPAT 2) und Datum (31.01.2022) sind über den NZLII-Datenbankeintrag
    bestätigt. Der Entscheidungstext liegt dort ausschliesslich als PDF vor und war in dieser Sitzung
    nicht auswertbar. Sachverhalt und Ergebnis sind der Darstellung des High Court in Thaler v Commissioner
    of Patents [2023] NZHC 554 in den Randnummern 1 und 3 entnommen — also einem Primärdokument, aber
    nicht dem Dokument selbst. Name des Assistant Commissioner und Anmeldenummer sind nicht ermittelt
    und deshalb NICHT eingetragen.'
  - '07.09.2026: NZLII-Fundstelle ueber den Browser des Bearbeiters beschafft. NZLII ist Rechtsdatenbank,
    nicht Urschrift - fuer die Zitierfaehigkeit ausreichend, fuer die Urschrift ist courtsofnz.govt.nz
    zu pruefen. Adresse aus dem Zitat abgeleitet, Muster an A v R bestaetigt; der Einzelabruf steht aus.'
  eigene_bewertung: 'Vorinstanz zur High-Court-Entscheidung; aufgenommen, weil der Instanzenzug die eigentliche
    Information ist. Bemerkenswert ist der Bruch zwischen den Instanzen: Der Assistant Commissioner argumentierte
    begrifflich (nur Menschen können Erfinder sein), der High Court verwarf gerade diese Begründung und
    stützte die Zurückweisung auf den gesetzgeberischen Zweck. Wer nur das Ergebnis referiert, verliert
    diese Divergenz.

