  anspruchsgrundlage: '§ 27 Abs. 2 性騷擾防治法 (Gesetz zur Verhuetung sexueller Belaestigung) i.V.m. dem Bussgeldrahmenwerk
    der Stadt Taipeh; Beweiswuerdigung nach 行政訴訟法

    '
  kernfrage: 'Welche Folgen hat es fuer die Beweiswuerdigung, wenn ein kriminaltechnisches Gutachten nicht
    feststellen kann, ob eine Tonaufnahme deepgefaelscht ist?

    '
  ergebnis: 'Widerspruchsbescheid und Ausgangsverfuegung werden aufgehoben; die Kosten traegt die Behoerde.
    Die Beigeladene hatte am 13.06.2023 bei der Frauen- und Jugendpolizei Taipeh Beschwerde wegen sexueller
    Belaestigung durch den Klaeger erhoben; nach erfolgloser Erstpruefung durch den Berufsverband stellte
    der Belaestigungsausschuss der Stadt Taipeh am 27.06.2024 die Belaestigung fest, und die Stadt setzte
    am 09.08.2024 ein Bussgeld fest. Das Gesundheitsministerium wies den Widerspruch am 26.02.2025 zurueck
    (衛部法字第1130028855號); das Verfahren gelangte ueber eine Verweisung der Bezirkskammer (114年度簡字第179號 vom
    20.10.2025) an die Hoehere Kammer. Das Gericht beanstandet, dass aus kaum unterscheidbaren Geraeuschen
    in einer Audiodatei ohne weiteres auf die behauptete Belaestigungshandlung geschlossen worden sei;
    die vom Gericht veranlasste Begutachtung durch das 調查局 (Investigation Bureau) habe zudem NICHT feststellen
    koennen, ob die Aufnahme deepgefaelscht sei (''亦無法判斷是否具有深度偽造''). Damit steht die Authentizitaet des
    zentralen Beweismittels nicht fest.

    '
  bedeutung: mittel
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPBA,114,%E8%A8%B4,1381,20260824,2
  zusammenfassung_url: ''
  bezug_regelwerke:
  - tw-strafgesetzbuch
  instanzenzug: []
  quelle_tracker: 司法院裁判書系統
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die praktisch wichtigste Erkenntnis dieser Recherche fuer die Beweispraxis: Die taiwanische
    kriminaltechnische Zentralstelle hat in einem gerichtlich veranlassten Gutachten erklaert, sie koenne
    nicht feststellen, ob eine Tonaufnahme deepgefaelscht sei. Das ist die empirische Grundlage der Zurueckhaltung,
    die dieselbe Gerichtsbarkeit in den Beschluessen zur Herausgabe von Gerichtsaufzeichnungen zeigt —
    und zugleich der Beleg dafuer, dass die Detektionsfrage in der Praxis ungeloest ist. Wer in Europa
    argumentiert, Deepfake-Erkennung sei ein technisch geloestes Problem, hat hier ein amtliches Gegenbeispiel.

    '
  normen: []
