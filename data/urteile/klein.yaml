  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der erste taiwanische Fall, in dem eine Partei KI-Ausgaben als Beweismittel in ein
    Gericht traegt — und zwar nicht als erfundene Fundstelle in einem Schriftsatz, sondern als ''medizinisches
    Referenzmaterial'' im Wiederaufnahmeverfahren. Das Gericht weist das ohne dogmatische Ausfuehrungen
    zurueck; es behandelt die KI-Ausgabe schlicht als untaugliches Beweismittel. Bemerkenswert ist, was
    FEHLT: keine Ruege des Prozessbevollmaechtigten, keine berufsrechtliche Folge, keine Belehrung. Taiwan
    hat bis zum 06.09.2026 keinen Fall erfundener Fundstellen in Schriftsaetzen (Mata-v.-Avianca-Konstellation)
    in der amtlichen Entscheidungsdatenbank — anders als die USA, Australien, Grossbritannien und Suedafrika.

    '
