  - governance
  anspruchsgrundlage: s. 22 Patents Act 2013 (NZ); regulation 50 Patents Regulations 2014 (NZ)
  kernfrage: 'Kann ein KI-System nach neuseeländischem Patentrecht als Erfinder benannt werden?

    '
  ergebnis: 'Nein; das Rechtsmittel wurde zurückgewiesen, Kosten wurden im Einvernehmen gegeneinander
    aufgehoben. Der Weg der Begründung ist die eigentliche Besonderheit. Der High Court stellte ausdrücklich
    fest, der WORTLAUT des s. 22 Patents Act 2013 sei — anders als bei den früheren neuseeländischen Patentgesetzen
    — weit genug, um die Benennung einer KI als Erfinder zu erfassen; Patentinhaber könne ohnehin eine
    andere Person als der Erfinder sein, und die Vorschriften, die den Erfinder als Person voraussetzen,
    verfolgten andere Zwecke. Entscheidend sei daher der Zweck des Gesetzgebers. Die Entstehungsgeschichte
    des Gesetzes von 2013 enthalte nichts, was auf eine gewollte Öffnung für maschinelle Erfinder hindeute;
    die betreffende Änderung habe vielmehr verhindern sollen, dass Importeure als Erfinder gelten. Angesichts
    dieses klaren Zwecks sei es nicht Sache der Gerichte, die Definition des Erfinders faktisch zu erweitern
    — ein solcher Schritt sei nach der neuseeländischen Verfassungsordnung dem Parlament vorbehalten.
    Ergänzend verwies das Gericht darauf, dass die britische Regierung nach der erstinstanzlichen Entscheidung
    zu Thaler beschlossen habe, die Definition nicht zu erweitern.

    '
