  ergebnis: 'Die Queja wurde als unbegründet zurückgewiesen. Bedeutsam ist nicht der Tenor, sondern die
    Begründung: Das Gericht legt in der veröffentlichten Entscheidung das eingesetzte Verfahren vollständig
    offen. Es beschreibt eine "herramienta práctica y sencilla basada en inteligencia artificial", nämlich
    einen standardisierten Prompt, der "in Sprachmodellen wie ChatGPT, unter anderen" verwendet werden
    kann, um die Berechnung nach der Methodik der Jurisprudencia P./J. 71/2014 (10a.) durchzuführen. Der
    Prompt enthält ausdrücklich keine festen Werte; die Richterin oder der Richter muss die Falldaten
    selbst eingeben (im entschiedenen Fall die Hauptforderung von 3.263.040,50 Pesos und die elftägige
    Geltungsdauer der vorläufigen Suspension). Die Anweisung verpflichtet das Modell, für Inflationsraten
    und den Interbanken-Gleichgewichtszinssatz (TIIE) auf die amtlichen Quellen INEGI und Banco de México
    in Echtzeit zuzugreifen. Ergebnis ist eine "tabla explicativa y auditable", die Schritt für Schritt
    zeigt, wie die Kaution beziffert wurde. Das Gericht ordnet dies ausdrücklich den Grundsätzen Verhältnismässigkeit,
    Datenschutz, Transparenz und Erklärbarkeit sowie menschliche Aufsicht und Entscheidung zu und verweist
    auf seine eigene Tesis II.2o.C.8 K (11a.).

    '
