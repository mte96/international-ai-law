  eigene_bewertung: 'Hier entscheidet der Oberste Gerichtshof keine KI-Rechtsfrage — aufgenommen ist der
    Fall wegen einer anderen, praktisch wichtigen Beobachtung: Das Plenum erzeugt in den Entscheidungsgründen
    selbst generative Bilder und stellt sie als Anschauungsmaterial in eine Entscheidung ein, die Grundrechte
    betrifft. Damit ist Mexiko das erste Land, in dem sowohl die Fachgerichtsbarkeit (Toluca) als auch
    das Verfassungsgericht KI-Erzeugnisse in den Urteilstext aufnehmen.

    Der Vorgang wirft eine Frage auf, die in der Debatte bisher fehlt: Illustrationen in Urteilsgründen
    sind kein Beweismittel, aber sie prägen das Verständnis des Massstabs. Wenn ein Modell zeigt, welche
    Kopfbedeckung "die Gesichtszüge nicht verdeckt", dann setzt das Modell faktisch den Anwendungsmassstab
    einer Grundrechtsschranke — ohne Verfahrensbeteiligung, ohne Herkunftsangabe des Modells, ohne Prompt-Offenlegung.
    Das steht in auffälligem Gegensatz zum Toluca-Gericht, das seinen Prompt vollständig abdruckt. Zweiter
    Ertrag: Die Entscheidung ist zugleich der bisher beste mexikanische Beleg dafür, dass biometrische
    Gesichtserkennung nach ICAO Doc 9303 als Rechtfertigung für Grundrechtseingriffe herangezogen wird
    und gerichtlich auf ihre tatsächliche Reichweite geprüft werden kann.

    '
