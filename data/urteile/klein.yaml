  pruefvermerk:
  - Am Entscheidungstext selbst geprüft (06.09.2026) — allerdings über den PDF-Spiegel bei law.co.il,
    nicht über die amtliche Sammlung supremedecisions.court.gov.il. Bestätigt sind Aktenzeichen, Gericht,
    Spruchkörper (Kanfi-Steinitz, Mintz, Elron), Datum 23.02.2025 (כ"ה בשבט התשפ"ה) und die zitierte Passage
    in Randnummer 13. volltext_url bleibt leer, weil keine amtliche Adresse ermittelt werden konnte.
  - 'Datumsdifferenz in der Presse: Calcalist nennt den 24.02.2025, die Kanzleimitteilung von S. Horowitz
    und der Entscheidungstext den 23.02.2025. Übernommen ist der 23.02.2025.'
  eigene_bewertung: 'Der wichtigste Fund der israelischen Recherche und eine echte Lücke: Der Oberste
    Gerichtshof hat sich zu KI-Halluzinationen im Schriftsatz bereits am 23.02.2025 geäussert — also mehr
    als ein Jahr vor der bisher als israelischer Leitfall geführten Ramat-Gan-Entscheidung und lange vor
    der Welle der Instanzentscheidungen von 2026. Wer die israelische Linie darstellt, muss hier beginnen.

    Zwei Elemente heben die Entscheidung aus der internationalen Kasuistik heraus. Erstens die Sanktionsentscheidung:
    Der Gerichtshof verzichtet bewusst auf eine Sanktion, weil sie nicht die Anwältin, sondern die Mandantin
    treffen würde — eine Fürsorgeerwägung, die in der US-amerikanischen Praxis (Rule 11) und in der englischen
    (Ayinde/Al-Haroun) keine Rolle spielt und die das israelische Instanzgericht in Badasch v. Ochana
    2026 aufgreift. Zweitens die Beweisführung: Der Gerichtshof schliesst aus einem Indizienbündel — nicht
    existierende Entscheidungen, in sich widersprüchliche Fundstellen, erfundene Zitate — auf den KI-Einsatz,
    ohne dass die Partei ihn eingeräumt hätte. Das ist eine übertragbare Beweisfigur; sie ist für die
    deutsche Praxis (Verletzung der prozessualen Wahrheitspflicht nach § 138 Abs. 1 ZPO) unmittelbar brauchbar,
    weil sie ohne Geständnis auskommt.

    '
