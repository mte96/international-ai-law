  quelle_tracker: Zwei unabhängige Sekundärquellen (eldial.com Novedades, Juli 2025; Diario Constitucional,
    27.06.2025). Ein amtlicher Volltext des Poder Judicial de la Provincia de Buenos Aires wurde nicht
    gefunden.
  verifiziert: false
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die erste argentinische Entscheidung zu KI-generierten Missbrauchsdarstellungen und
    zugleich eine der differenziertesten weltweit. Sie widerlegt die verbreitete Kurzfassung, ein argentinisches
    Gericht habe rein synthetische Darstellungen unter Art. 128 subsumiert — das Gericht hat für diese
    Konstellation gerade Zweifel geäussert und auf Art. 213 CP verwiesen. Tragend war die Deepfake-Variante
    mit realen Gesichtern.

    Damit steht Argentinien an derselben Weggabelung wie das deutsche Recht bei § 184b StGB und wie der
    US-Streit um Ashcroft v. Free Speech Coalition: Schützt der Tatbestand das konkrete Kind oder ein
    überindividuelles Rechtsgut? Die Kammer entscheidet sich für das konkrete Kind — und verlagert damit
    die gesamte Last auf die forensische Herkunftsbestimmung des Bildes. Das ist die praktisch folgenreichste
    Aussage der Entscheidung: Wer synthetisch erzeugte Darstellungen nur über das reale Opfer erfassen
    will, braucht in jedem Verfahren ein Gutachten zur Bildherkunft — und muss damit rechnen, dass es
    mit besseren Generatoren keine belastbare Antwort mehr gibt.

    WIDERSPRUCH in den Quellen: Diario Constitucional referiert die Entscheidung so, als habe die Kammer
    den Einwand des fehlenden realen Opfers verworfen und Art. 128 auf rein KI-generierte Bilder erstreckt.
    Die ausführlichere Aufbereitung bei eldial gibt die differenzierende Lesart wieder. Der Widerspruch
    ist ohne den Volltext nicht auflösbar. '
