  letzte_pruefung: '2026-09-07'
  eigene_bewertung: 'Der erste südafrikanische Fall, in dem nicht ein Schriftsatz, sondern eine ENTSCHEIDUNG
    halluzinierte Fundstellen enthielt — und zwar die eines Disziplinarvorsitzenden, also eines Entscheidungsträgers
    ausserhalb der Justiz. Methodisch bemerkenswert ist die Weigerung des Gerichts, die Urheberschaft
    zu klären: ''whether the citations were AI-generated or self-created by the chairperson, the result
    remained identical''. Damit wird die Halluzination als Beweisanzeichen für Sorgfaltswidrigkeit behandelt,
    nicht als eigenständiger Vorwurf — eine Konstruktion, die dem Beweisproblem des Nichtdeterminismus
    ausweicht, das in Mavundla noch durch das ChatGPT-Gegenexperiment des Richters angegangen worden war.
    Praktisch wichtig ist ausserdem, dass die Halluzination die Schwelle für einen Eingriff in ein laufendes
    Disziplinarverfahren senkt: Sie begründet die ''exceptional circumstances'', die das südafrikanische
    Arbeitsrecht dafür verlangt.

    '
