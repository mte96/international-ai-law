  anspruchsgrundlage: Mandamus auf Herausgabe einer Raffinierlizenz; berufsrechtliche Sorgfaltspflicht
    der Prozessvertreter
  kernfrage: 'Trifft Rechtsanwälte, die KI-Werkzeuge zur juristischen Recherche einsetzen, eine eigenständige
    Pflicht zur Überprüfung der gefundenen Fundstellen, und ist deren Verletzung berufsrechtlich relevant?

    '
  ergebnis: 'Ja. In den Schriftsätzen der Antragstellerin waren zwei nicht existente Entscheidungen zu
    tragenden Fragen des Mandamus zitiert; sie erwiesen sich als KI-erzeugte Halluzinationen. Das Gericht
    gab dem Eilantrag in der Sache statt und ordnete die sofortige Herausgabe der Raffinierlizenz AP21847
    an, verbunden mit der Auflage, binnen 30 Tagen ein Hauptverfahren einzuleiten; die Widerklage wurde
    mangels Dringlichkeit mit Kosten gestrichen, die Kosten der Hauptsache blieben vorbehalten. Zur KI-Nutzung
    stellte das Gericht in Rz. 93(b) fest, wer trotz der bekannten Risiken KI zur juristischen Recherche
    einsetze, habe ''a professional duty to check the accuracy'' vor der Verwendung bei Gericht; in Rz.
    95 heisst es, selbst Fahrlässigkeit könne in diesem Zusammenhang ''grave repercussions particularly
    to the administration of justice'' haben und unter Umständen ''serious professional misconduct'' darstellen.
    Die Sache wurde an den Legal Practice Council zur Untersuchung überwiesen.

    '
  bedeutung: hoch
  volltext_url: https://www.saflii.org/za/cases/ZAGPJHC/2025/661.html
  zusammenfassung_url: https://iol.co.za/news/crime-and-courts/2025-07-02-when-using-artificial-intelligence-goes-wrong-judge-slams-lawyers-for-legal-bungle/
