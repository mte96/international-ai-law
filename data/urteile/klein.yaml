  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die erste argentinische Obergerichtsentscheidung zum anwaltlichen KI-Einsatz — und
    die erste, die die Acordada 22/25 als Sanktionsgrundlage tatsächlich anwendet statt sie nur zu erwähnen.
    Río Negro hat damit als einzige argentinische Provinz einen geschlossenen Regelkreis: Protokoll (Acordada
    15/24), Erstreckung auf die Anwaltschaft (Acordada 22/25), Anwendung durch die Instanzgerichte (Viedma,
    General Roca) und Bestätigung durch das Obergericht (IPROSS).

    Das wiederkehrende Muster bleibt bemerkenswert: erfunden werden bevorzugt Entscheidungen desjenigen
    Gerichts, bei dem der Schriftsatz eingereicht wird. Das ist kein Zufall, sondern eine Eigenschaft
    des Verfahrens — das Modell erzeugt, was im Kontext am plausibelsten wirkt. '
