  kernfrage: 'Wie ist mit einer Klage- und Berufungsbegründung umzugehen, die sowohl im Tatsächlichen
    (nicht existente Strassen am Unfallort) als auch im Rechtlichen (nicht existente Entscheidungen von
    Corte Suprema und STJ) auf offenbar KI-erzeugten Angaben beruht?

    '
  ergebnis: 'Die Kammer bestätigte die Abweisung der Schadensersatzklage. Der Unfallhergang liess sich
    nach den Gutachten nicht wie behauptet feststellen; die Schriftsätze enthielten Verweise auf Strassen,
    die es am Unfallort nicht gibt, und in der Berufung angeführte Entscheidungen von Corte Suprema und
    Superior Tribunal de Justicia fanden sich nicht in den amtlichen Registern. Die Kammer ordnete den
    Befund den "alucinaciones" generativer KI zu und wies die Prozessbevollmächtigten auf ihre berufliche
    Verantwortung beim Einsatz solcher Werkzeuge hin, unter Hinweis auf die Acordada 22/2025.

    '
