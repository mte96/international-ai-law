  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der lateinamerikanische Leitfall zur biometrischen Fernidentifizierung — und der
    einzige Fall weltweit, in dem ein Gericht ein laufendes städtisches Gesichtserkennungssystem stillgelegt
    hat, bevor eine KI-Verordnung existierte. Er ist deshalb der beste Vergleichsmassstab für Art. 5 Abs.
    1 lit. h und Abs. 2 bis 5 KI-VO: Was die europäische Verordnung als Genehmigungsvorbehalt, Folgenabschätzung
    und Registrierungspflicht ausbuchstabiert, hat das Gericht hier aus dem allgemeinen Datenschutz- und
    Verfassungsrecht abgeleitet.

    Die dogmatische Pointe liegt im Verhältnis von Ermächtigung und Vollzug: Die Ley 6339 hatte den SRFP
    gesetzlich vorgesehen, aber an Kontrollorgane gebunden, die nie eingerichtet wurden. Das Gericht behandelt
    eine gesetzliche Ermächtigung, deren Sicherungen nicht funktionieren, wie eine fehlende Ermächtigung.
    Das ist genau der Konflikt, der in Europa mit der ungarischen Gesichtserkennung ansteht.

    Für Argentinien selbst ist der Befund unbequem: Dieselbe Rechtsordnung, die 2022 die städtische Gesichtserkennung
    stoppte, hat 2024 mit der Resolución 710/2024 eine Bundeseinheit für Gesichtserkennung und prädiktive
    Polizeiarbeit durch blosse Ministerialresolution errichtet — ohne Kontrollorgane, ohne Folgenabschätzung
    und ohne dass die Ley 25.326 im Erwägungsteil überhaupt vorkommt.

    VORBEHALT: Der Volltext lag nur in den Kopien der Verfahrensbeteiligten vor; die amtliche Veröffentlichung
    des Poder Judicial de la CABA war nicht abrufbar. Das genaue Verzeichnis der für verfassungswidrig
    erklärten Vorschriften stammt aus der Aufbereitung im Repositorio des MPD, nicht aus dem Tenor selbst. '
  dokumenttyp: Sentencia definitiva im amparo colectivo, PDF (Kopien der Verfahrensbeteiligten CELS und
    ODIA)
