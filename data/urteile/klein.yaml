  - co-acuerdo-pcsja24-12243
  instanzenzug: []
  quelle_tracker: Infobae Colombia vom 12.11.2025; amtliche Fundstelle der Corte Suprema nicht ermittelt
  verifiziert: false
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Wichtig für die saubere Abgrenzung: Diese Entscheidung vom 05.11.2025 wird in der
    Presse häufig mit der Nichtigkeitsentscheidung des Tribunal Superior de Bogotá vom 02.12.2025 verwechselt.
    Es sind zwei verschiedene Fälle mit verschiedenen Gerichten, Instanzen und Sachverhalten: hier eine
    Tutela-Entscheidung der Corte Suprema gegen das Tribunal Superior de Sincelejo in Zivilsachen, dort
    eine strafrechtliche Berufungsentscheidung des Tribunal Superior de Bogotá gegen ein Urteil des Juzgado
    21 Penal del Circuito. Der juristisch interessante Punkt liegt darin, dass die Corte Suprema hier
    NICHT auf den KI-Einsatz abstellt, sondern auf die Nichtexistenz der zitierten Passagen: Der Rechtsfehler
    ist die falsche Fundstelle, nicht das Werkzeug. Genau diese Trennung fehlt in der deutschen Debatte
    häufig.

    '
