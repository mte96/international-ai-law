  anspruchsgrundlage: Israelisches Zivilverfahrensrecht (Streichung von Schriftsätzen, מחיקת כתב הגנה)
  kernfrage: 'Rechtfertigt es die Streichung der gesamten Klageerwiderung, wenn diese von einem KI-System
    erfundene Gerichtsentscheidungen enthält?

    '
  ergebnis: 'Nein. Das Gericht wies den Antrag des Klägers auf Streichung der Klageerwiderung zurück.
    Die Streichung eines Schriftsatzes wegen des Einsatzes künstlicher Intelligenz sei ein "סעד קיצוני"
    — ein extremes Mittel, das dem Beklagten die Tür des Gerichts verschliessen würde. Stattdessen ordnete
    das Gericht an, die Verweise auf nicht existierende Entscheidungen aus der Klageerwiderung zu entfernen;
    die Kosten des Antrags trägt der Antragsteller, also der Kläger.

    '
