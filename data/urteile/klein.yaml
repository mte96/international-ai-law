  sachverhalt: In einer Queja gegen eine Entscheidung eines Juzgado de Distrito in einem indirekten Amparo-Verfahren
    hatte der Segundo Tribunal Colegiado en Materia Civil del Segundo Circuito die Höhe einer Sicherheitsleistung
    zu bestimmen, die mit der Eintragung der Klage in die Grundbuchblätter der streitgegenständlichen
    Grundstücke zusammenhing. Der Spruchkörper setzte dafür KI-Werkzeuge ein. Er hielt das für eine „práctica
    innovadora en procesos jurisdiccionales" und sah sich deshalb veranlasst, „bajo un ejercicio de autocontención"
    selbst die Parameter eines ethischen und verantwortlichen KI-Einsatzes zu bestimmen. Die Entscheidung
    erging am 29. Juli 2025 in der Queja 212/2025, Berichterstatter Juan Jaime González Varas; die daraus
    gebildete These wurde im August 2025 im Semanario Judicial de la Federación veröffentlicht.
