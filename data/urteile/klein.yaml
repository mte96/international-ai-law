  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die argentinische Gegenentscheidung zu Chubut — und der Beleg dafür, dass die Chubuter
    Formel nicht so weit trägt, wie sie klingt. Der STJ Chubut hatte gesagt: Kontrolliert wird die exteriorisierte
    Begründung, nicht das Werkzeug. Genau das tut die Kammer in Azul — und kommt zur Aufhebung, weil die
    exteriorisierte Begründung nachweislich falsch ist. Beide Entscheidungen sind miteinander vereinbar
    und ergeben zusammen den argentinischen Massstab: Der KI-Einsatz des Richters ist als solcher folgenlos;
    erfundene Fundstellen in der Begründung sind es nicht.

    Das ist derselbe Massstab, den die kolumbianische Rechtsprechung anlegt (co-2025-tribunal-bogota)
    — und damit ist der scheinbare lateinamerikanische Dissens aufgelöst. Er bestand nur, solange man
    Esquel (Ununterscheidbarkeit der Urheberschaft) und Bogotá (erfundene Fundstellen) für Fälle desselben
    Typs hielt.

    VORBEHALT: Aktenzeichen und Besetzung sind nicht ermittelt; die Entscheidung ist in dieser Form nicht
    zitierfähig. Sie ist von der Entscheidung derselben Kammer vom 06.06.2026 zu unterscheiden. '
