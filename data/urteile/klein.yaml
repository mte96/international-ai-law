  eigene_bewertung: 'Der bemerkenswerteste mexikanische Fund. Dies ist, soweit ersichtlich, die weltweit
    erste veröffentlichte Gerichtsentscheidung, die einen konkreten, zur Nachahmung bestimmten Prompt
    als richterliche Berechnungsmethode in den Entscheidungsgründen abdruckt und ihn ausdrücklich für
    den Gebrauch "in Sprachmodellen wie ChatGPT" freigibt. Das ist etwas anderes als die bekannten Leitlinien
    zum KI-Einsatz in der Justiz: Hier wird nicht abstrakt erlaubt, sondern konkret vorgeschrieben, wie
    das Werkzeug zu bedienen ist.

    Zwei Punkte verdienen kritische Aufmerksamkeit. Erstens die Quellenanweisung: Der Prompt weist das
    Modell an, Inflationsraten und TIIE "in Echtzeit" bei INEGI und Banco de México abzurufen. Ob ein
    Sprachmodell das tatsächlich tut oder die Werte konfabuliert, hängt vollständig davon ab, ob im konkreten
    Modell ein Werkzeugzugriff besteht — das Gericht behandelt eine Modelleigenschaft als gegeben, die
    es nicht kontrolliert. Genau hier liegt das Halluzinationsrisiko, das die begleitende Ethik-Tesis
    nicht auffängt. Zweitens die Auditierbarkeit: Eine vom Modell erzeugte Tabelle ist nur dann auditierbar,
    wenn die Eingabedaten und die Formel unabhängig nachgerechnet werden können; dann aber braucht es
    das Modell nicht. Der Ertrag der Entscheidung liegt weniger im Effizienzgewinn als in der Offenlegungsdisziplin,
    die sie erzwingt — und die ist für die Diskussion um Art. 14 KI-VO und um § 39 VwVfG unmittelbar anschlussfähig.

    '
