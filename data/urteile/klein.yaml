  kernfrage: 'Welche Folgen hat es, wenn eine Partei dem Gericht Entscheidungen zitiert, die eine Chatbot-Recherche
    erfunden hat?

    '
  ergebnis: 'Die erste südafrikanische Entscheidung zu KI-Halluzinationen im Gerichtsverfahren, ergangen
    anderthalb Jahre vor Mavundla. Die Prozessvertreter der Klägerseite hatten mit ChatGPT nach Rechtsprechung
    gesucht und die Treffer ungeprüft übernommen; die zitierten Entscheidungen waren vollständig erfunden
    — ''fictional names, citations, facts, and decisions'' —, und die Gegenseite hatte Arbeitszeit darauf
    verwendet, sie zu suchen. Das Gericht ordnete die Verhaltensweise als ''overzealousness and carelessness
    rather than an intentional attempt to deceive'' ein, lehnte deshalb eine Straffunktion der Kosten
    ab und beschränkte die Kostenfolge auf den Ausgleich des tatsächlich entstandenen Aufwands. Eine Überweisung
    an den Legal Practice Council erfolgte nicht — anders als in allen späteren südafrikanischen Fällen.
    Die Entscheidung wird in Mavundla ausdrücklich zitiert und ist der Ausgangspunkt der südafrikanischen
    Rechtsprechungslinie.

    '
