  ergebnis: 'Ja. Die Kammer hob den erstinstanzlichen Beschluss auf, mit dem die Honorarfestsetzung zugunsten
    eines curador oficial abgelehnt worden war. Sie stellte fest, dass der Richter der ersten Instanz
    generative KI zur Abfassung benutzt und die erzeugten Inhalte nicht überprüft hatte; die Begründung
    enthielt erfundene Entscheidungen, erfundene Werke und falsch bezeichnete Spruchkörper. Die Kammer
    erläuterte das Halluzinationsphänomen ausdrücklich — Algorithmen ersetzten fehlende Information durch
    plausible, aber unzutreffende Schlüsse, wodurch Falsches wahr erscheine — und hielt fest, generative
    KI sei im Justizbereich nicht verboten, ihr Einsatz verlange aber eine "äusserst rigorose Handhabung"
    mit eindeutigen und überprüfbaren Quellenangaben.

    '
