  anspruchsgrundlage: Art. 16 CPEUM; Art. 79 Ley de Amparo (suplencia de la queja deficiente); Jurisprudencia
    P./J. 71/2014 (10a.) der SCJN zur Berechnung von Schäden und Nachteilen bei der Sicherheitsleistung
  kernfrage: 'Wie muss ein Gericht den Einsatz eines Sprachmodells zur Berechnung der Sicherheitsleistung
    offenlegen, damit die Berechnung für die Parteien und die Rechtsmittelinstanz überprüfbar bleibt?

