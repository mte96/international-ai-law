  anspruchsgrundlage: 'Gesucht wurde nach Entscheidungen zu: Copyright Act 5768-2007 (Training und Schutzfähigkeit),
    Protection of Privacy Law 5741-1981 einschliesslich Tikkun 13 (automatisierte Entscheidungen, Gesichtserkennung),
    Wahlgesetz (Wahlwerbung) 5719-1959 (Deepfakes), Arbeitsrecht (algorithmisches Management)'
  kernfrage: 'Gibt es israelische Rechtsprechung oder Aufsichtspraxis zu KI-Training, Urheberrecht, Datenschutz,
    Gesichtserkennung und algorithmischem Management?

    '
  ergebnis: 'Recherchestand 06.09.2026.

    KEIN BEFUND zum Urheberrecht: Es existiert bis heute keine israelische Gerichtsentscheidung zur Zulässigkeit
    des Trainings mit geschützten Werken. Die Stellungnahme des Justizministeriums von 2022 ist unbestätigt
    geblieben. Die in israelischen Medien als "Sammelklage gegen OpenAI und Microsoft" besprochene Entscheidung
    ist die US-amerikanische (Authors Guild, S.D.N.Y., Richter Stein, 28.10.2025), nicht ein israelisches
    Verfahren — eine Verwechslung, vor der zu warnen ist.

    KEIN BEFUND zu algorithmischem Management: Aus der Arbeitsgerichtsbarkeit ist ausser der Kostenentscheidung
    Yunes (Halluzinationen im Schriftsatz) keine Entscheidung zu Bewerberauswahl, Leistungsbewertung oder
    Überwachung durch KI auffindbar.

    KEIN BEFUND zu Sanktionsentscheidungen der Datenschutzbehörde wegen KI: Die הרשות להגנת הפרטיות (Privacy
    Protection Authority) hat 2025 einen Leitlinienentwurf zur Anwendung des Datenschutzgesetzes auf KI-Systeme
    veröffentlicht (bereits als Regelwerk il-ppa-ki-leitlinie-2025 erfasst), aber keine veröffentlichte
    Bussgeld- oder Anordnungsentscheidung mit KI-Bezug. Die 2026 bekannt gewordenen Vollzugsverfahren
    der Behörde (u.a. gegen die Partei Schas wegen Verstössen gegen das Datenschutzgesetz und die Datensicherheitsverordnung)
    betreffen keine KI-Systeme.

    RANDBEFUND automatisierte Erfassung: Die Datenschutzbehörde hat nach einer Entscheidung eines Bezirksgerichts
    vom Dezember 2025 klargestellt, dass Kommunen Kameras mit Kennzeichenerkennung nicht ohne ausdrückliche
    gesetzliche Ermächtigung zur Verfolgung von Parkverstössen einsetzen dürfen. Das ist die einzige israelische
    Aussage zur automatisierten Bilderfassung im öffentlichen Raum; Aktenzeichen und Volltext der zugrunde
    liegenden Bezirksgerichtsentscheidung liessen sich nicht ermitteln. Als eigenständiger Eintrag deshalb
    nicht aufgenommen.

    RANDBEFUND Halluzination im Gerichtsbeschluss: Israelische Medien berichteten im Januar 2026, ein
    Beschluss des Kleinforderungsgerichts Tel Aviv-Jaffa (Ranghoher Rechtspfleger Michael Schampal) in
    einem Spam-Verfahren habe erfundene oder verfälschte Zitate aus israelischen Gesetzen enthalten; die
    Gerichtsverwaltung räumte "Ungenauigkeiten bei der Zitierung der Paragraphen" ein, hielt sie aber
    für nicht entscheidungserheblich. Ein Aktenzeichen wurde in keiner Quelle genannt. Nach der Regel,
    lieber eine Lücke als eine erfundene Fundstelle hinzunehmen, ist der Fall NICHT als eigener Eintrag
    aufgenommen; er ist aber der einzige bekannte israelische Fall, in dem die Halluzination vom SPRUCHKÖRPER
    und nicht von einer Partei ausging, und deshalb weiter zu verfolgen.

    RANDBEFUND KI im Urteilstext: In ת"א 33406-02-24 ברוק נ'' דהן (Amtsgericht Bat Jam, Richter Jair Chassidiel,
    Urteil vom 07.07.2026, Ehrschutzklage, abgewiesen) bemerkt der Richter, das Urteil selbst werde von
    künstlicher Intelligenz durchgesehen, unter der Software "צ''אט המשפט" (Chat HaMischpat), die den
    israelischen Richterinnen und Richtern zur Verfügung gestellt worden sei. Eine KI-spezifische Rechtsfrage
    entscheidet das Urteil nicht; es ist deshalb nicht als Eintrag aufgenommen, belegt aber, dass die
    israelische Justiz ein eigenes generatives Werkzeug im Regelbetrieb einsetzt.

    '
