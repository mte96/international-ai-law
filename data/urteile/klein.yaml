  pruefvermerk:
  - Nicht am amtlichen Primärdokument geprüft (Net HaMishpat ohne freien Zugang).
  - 'Gerichtszuordnung mit Restunsicherheit: Die Übersichtsseite von law.co.il ordnet den Fall dem Bezirksgericht
    Tel Aviv zu, die Fallseite dem Amtsgericht ("שלום ת"א"). Das Aktenzeichenpräfix ת"א und der Streitgegenstand
    sprechen für das Amtsgericht; so ist der Eintrag geführt. Vor Verwendung zu klären.'
  - 'Datumsdifferenz: Übersichtsseite 22.07.2026 (Veröffentlichung), Fallseite 16.07.2026 (Entscheidung).
    Übernommen ist das Entscheidungsdatum.'
  eigene_bewertung: 'Die inhaltlich wichtigste der neuen israelischen Entscheidungen, weil sie in die
    Gegenrichtung weist. Die weltweite Kasuistik seit Mata v. Avianca schärft die Sanktionen fortlaufend
    nach; hier zieht ein Gericht eine Untergrenze und verweigert die schärfste prozessuale Folge, weil
    sie den Zugang zum Gericht abschneidet. Der Gedanke ist derselbe, den der neuseeländische Supreme
    Court in Jones nur andeutet: Sanktion und Rechtsschutzgarantie stehen in einem Spannungsverhältnis,
    und die Verhältnismässigkeit begrenzt die Sanktion.

    Die gewählte Zwischenlösung — Streichung der erfundenen Fundstellen statt des Schriftsatzes — ist
    die dogmatisch sauberste Antwort, die bislang zu sehen war, und sie ist in das deutsche Recht ohne
    Weiteres übersetzbar (Nichtberücksichtigung des unschlüssigen Vortrags statt Zurückweisung nach §
    296 ZPO). Divergenz zu Adiby (dort 20.000 NIS Kosten) und zu Yunes (dort Kosten zugunsten der Staatskasse)
    ist nicht zu glätten: Die israelischen Instanzgerichte antworten uneinheitlich.

    '
  quelle_art: fehlt
