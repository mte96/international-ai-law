  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die schärfste wirtschaftliche Sanktion der argentinischen Reihe — und die eleganteste.
    Die Kammer verhängt keine Ordnungsstrafe, sondern verweigert das Honorar: Wer erfundene Nachweise
    einreicht, hat insoweit keine anwaltliche Leistung erbracht. Das ist dogmatisch sauber (die Tätigkeit
    ist "inoficiosa", also nicht vergütungsfähig) und trifft härter als jedes Bussgeld, weil es ohne Schuldvorwurf
    auskommt.

    Der zweite bemerkenswerte Befund ist die Symmetrie: In diesem Verfahren haben BEIDE Seiten halluziniert.
    Das entkräftet die verbreitete Annahme, das Problem betreffe vor allem Einzelkämpferinnen und Einzelkämpfer
    ohne Datenbankzugang, und zeigt, dass die Verifikationslücke strukturell ist.

    Drittens: Die erfundenen Fundstellen wurden dem eigenen Obergericht zugeschrieben — achtzehn angebliche
    Entscheidungen des STJ Río Negro. Chatbots erfinden bevorzugt im lokal plausibelsten Register. Für
    die Praxis heisst das, dass gerade die naheliegendsten Zitate zu prüfen sind. '
  dokumenttyp: Sentencia definitiva; amtliche Protokolldatenbank des Poder Judicial de Río Negro
  pruefvermerk:
  - 'WIDERSPRUCH im Datum: Die amtliche Protokolldatenbank des Poder Judicial de Río Negro weist den 18.09.2025
    aus, die amtliche Mitteilung desselben Poder Judicial (Comunicación Judicial) und diariojudicial.com
    nennen den 19.09.2025 — vermutlich das Veröffentlichungsdatum. Angesetzt ist die Angabe der Protokolldatenbank.'
  - 'Zweiter amtlicher Beleg: Mitteilung des Poder Judicial de Río Negro, "Vinculan fallos inexistentes
    al uso de inteligencia artificial: un tribunal dejó sin honorarios a los abogados y notificó al tribunal
    de ética". Sie bestätigt Honorarversagung, Verweis und Abgabe an das Tribunal de Ética und hält ausdrücklich
    fest, dass es für Anwältinnen und Anwälte in Río Negro zum Entscheidungszeitpunkt an spezifischen
    Vorgaben fehlte — die Acordada 22/25 kam erst danach.'
