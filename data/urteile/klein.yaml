  ergebnis: 'Der Commissioner kam zu dem Ergebnis, dass das im Versuch eingesetzte Betriebsmodell insgesamt
    dem Privacy Act 2020 entsprach: Die Technik habe schwere Wiederholungstaten wirksam verringert, und
    die Schutzvorkehrungen hätten die Betroffenen hinreichend geschützt. Für einen Dauerbetrieb oder eine
    Ausweitung machte er Auflagen. Zentral ist die Anhebung der Alarmschwelle des Abgleichsalgorithmus
    von 90 auf mindestens 92,5 Prozent. Weiter verlangte er, die Beobachtungsliste auf qualifizierende
    Delikte zu beschränken, die Datenschutz-Folgenabschätzung an die tatsächliche Praxis anzupassen, nicht
    getroffene Gesichtsbilder sofort zu löschen und das System fortlaufend zu überprüfen. Zu den Auswirkungen
    auf Māori stellte der Bericht fest, dass eine ethnische Auswertung von Treffern und Fehlern an der
    Datenlage scheiterte; das Māori Reference Panel lehnte den Einsatz ab. Ausdrücklich heisst es: "This
