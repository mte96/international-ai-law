  sachverhalt: 'M.J.L. kaufte ein Neufahrzeug und brachte es zwischen 2019 und 2023 neunzehnmal in die
    Vertragswerkstatt DMX2 S.A.; die Mängel stammten nach seinem Vortrag aus der Herstellung. Er klagte
    gegen die Peugeot Citroën Argentina S.A. und die Werkstatt nach dem Verbraucherschutzgesetz Ley 24.240.
    Im Berufungsverfahren vor der Cámara de Apelaciones in General Roca (Provinz Río Negro) reichten beide
    Seiten Schriftsätze mit Rechtsprechungszitaten ein: sechs Entscheidungen im Schriftsatz der Werkstatt,
    davon drei angeblich vom Superior Tribunal de Justicia de Río Negro, und zwanzig in der Erwiderung
    der Klägerseite, davon achtzehn angeblich vom selben Obergericht. Keine dieser sechsundzwanzig Entscheidungen
    existiert. Verbindliche Vorgaben zum Einsatz generativer KI gab es für Anwältinnen und Anwälte in
    Río Negro damals noch nicht; die Acordada 22/25 erging erst danach.'
