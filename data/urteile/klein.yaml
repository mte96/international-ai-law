  - governance
  anspruchsgrundlage: s. 22 Patents Act 2013 (NZ); regulation 50 Patents Regulations 2014 (NZ)
  kernfrage: 'Darf das Patentamt eine Anmeldung zurückweisen, in der ein KI-System als Erfinder benannt
    ist?

    '
  ergebnis: 'Ja. Die im Mai 2021 eingereichte neuseeländische Anmeldung betraf einen verbesserten Flüssigkeitsbehälter
    mit fraktalen Wänden; als Erfinder war "DABUS" benannt, mit dem Zusatz, die Erfindung sei "autonomously
    generated by an artificial intelligence" erzeugt worden, und der Anmelder leite sein Recht aus dem
    Grundsatz der Akzession, des Erstbesitzes beziehungsweise des Besitztitels ab. Der Assistant Commissioner
    of Patents wies die Anmeldung mit der Begründung zurück, Erfinder könnten nur Menschen sein.

    '
  bedeutung: mittel
