  anspruchsgrundlage: Ley 24.240 (Defensa del Consumidor), insbesondere Art. 17 und 40; Art. 1741 und
    1748 CCyC; Art. 32, 62, 145 und 242 CPCC Río Negro; Art. 42 Ley 5731 (Río Negro); Art. 18, 19 und
    28 Constitución Nacional
  kernfrage: 'Welche Folgen hat es, wenn BEIDE Parteien eines Verfahrens erfundene Fundstellen einreichen
    — und rechtfertigt das die Versagung der Anwaltshonorare?

    '
  ergebnis: 'Ja. Die Kammer entschied in der Sache zugunsten des Verbrauchers (Herstellungsmängel eines
    Neufahrzeugs, neunzehn Werkstattaufenthalte zwischen 2019 und 2023; Anwendung von Art. 17 und 40 Ley
    24.240, Zurückweisung des Nutzungsabzugs nach Decreto 1798/1994, Anerkennung des immateriellen Schadens
    in re ipsa, Strafschadensersatz). Zugleich stellte sie fest, dass in den Schriftsätzen beider Seiten
    insgesamt sechsundzwanzig nicht existente Entscheidungen zitiert waren — sechs im Schriftsatz der
    Werkstatt (drei angeblich vom STJ Río Negro, drei von Kammern) und zwanzig in der Erwiderung der Klägerseite
    (achtzehn angeblich vom STJ Río Negro, zwei von einer Kammer). Die Kammer nahm den Einsatz generativer
    Chatbots ohne Ergebnisprüfung an, erklärte die anwaltliche Tätigkeit insoweit für "inoficiosa" und
    setzte dafür KEINE Honorare fest; ausserdem sprach sie einen scharfen Verweis aus und unterrichtete
    den Colegio de Abogados de General Roca.

    '
