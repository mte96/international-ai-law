    '
  ergebnis: 'Die Berufung gegen die Verurteilung wegen Fahrens unter Drogeneinfluss wurde zurückgewiesen.
    Das Gericht stellte fest, der Verteidiger habe drei nicht existierende Entscheidungen zitiert, und
    formulierte den Verdacht, es handele sich um von einem KI-System gelieferte fiktive Fundstellen, deren
    Einsatz "ohne auch nur minimale Überprüfung" erfolgt sei. Das Gericht bezeichnete die ausschliessliche
    Stützung auf KI ohne Verifikation als verbreitete und bedauerliche Erscheinung und mahnte, KI-Ausgaben
    künftig kritisch zu prüfen und "mit Klugheit und Umsicht" einzusetzen.

