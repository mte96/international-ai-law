  anspruchsgrundlage: Verfahrensrecht des Employment Court; Courts of New Zealand, Guidelines for Use
    of Generative Artificial Intelligence in Courts and Tribunals — Non-lawyers (07.12.2023)
  kernfrage: 'Welche Folgen hat es, wenn eine nicht vertretene Partei Entscheidungen zitiert, die nicht
    existieren und mutmasslich von generativer KI stammen?

    '
  ergebnis: 'Das Gericht stellte in Randnummer 35 fest, der Antragsteller habe sich auf zwei Entscheidungen
    berufen — "Shanmuganathan v Commissioner of Police [2022] NZHC 1094" für den Satz, das Gebot des fairen
    Verfahrens umfasse das Recht auf wirksame Beteiligung, und "Goodricke v Maritime Union of New Zealand
    Inc [2015] NZEmpC 55" für den Satz, das Gericht müsse aussetzen, wenn sonst Rechtsschutz und Rechtsmittelrechte
    unterlaufen würden. In Randnummer 36 heisst es, keine dieser Entscheidungen existiere; die Angaben
    könnten daher von generativer künstlicher Intelligenz stammen, und der Antragsteller werde daran erinnert,
    dass solche Angaben zu prüfen seien, bevor man sich in bei Gericht eingereichten Dokumenten auf sie
    stütze; in der Fussnote wird auf die Gerichtsleitlinien verwiesen. Der Antrag auf Abtrennung wurde
    zurückgewiesen, die Beklagte ist kostenerstattungsberechtigt.

    '
