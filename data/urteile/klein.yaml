  - 'Wörtlich bestätigt: die Passage zur plausibelsten Erklärung (''The most plausible explanation, certainly
    for the fictitious Lubbe reference, ...''), die Feststellung ''it is clear that the Acting Judge did
    not properly consider the judgments cited by him'' und die Ankündigung der Überweisung an den Legal
    Practice Council.'
  - 'Tenor bestätigt: Zurückweisung der Berufung mit Kosten auf scale C einschliesslich Anwaltsgebühren;
    Bestätigung der s.-18(3)-Anordnung; die elf Ziffern des erstinstanzlichen Tenors (Einschulung an der
    Privatschule bis 10.12.2025, Gebührentragung 2026, Ratenzahlung der Rückstände, Fortgeltung der Scheidungsanordnung
    vom 25.06.2019, Vertagung von Teil B und der Missachtungsfrage sine die, Kosten auf scale C).'
  - 'ZAHL DER ABWEICHUNGEN: Die Auswertung des Volltextes ergibt zwölf; GroundUp und die CDH-Auswertung
    sprechen von ''mindestens elf''. Das Urteil zählt sie nicht durch.'
  - 'NAME DES ACTING JUDGE: Der Volltext nennt ihn nur ''the learned Acting Judge below''. GroundUp nennt
    Themba Khaba; dies ist im Urteil selbst nicht belegt und wird deshalb hier nicht als Feststellung
    geführt.'
  - s. 175(2) der Verfassung als Grundlage der Bestellung von Acting Judges ist im Sondervotum ausdrücklich
    genannt.
  - 07.09.2026 am Volltext auf SAFLII geprueft (77 KB, Opperman J, REPORTABLE). Ziff. 18, 33, 119-123
    im Wortlaut gelesen.
  quelle_art: datenbank
  leitsatz: Enthaelt nicht der Schriftsatz, sondern das angefochtene Urteil erfundene oder verfaelschte
    Fundstellen, ist das Verhalten des erkennenden Richters am Code of Judicial Conduct zu messen. Weil
    die Judicial Service Commission ueber einen acting judge nach Ablauf seiner Bestellung keine Zustaendigkeit
    hat, ist das Legal Practice Council das wirksamste verfuegbare Forum; seine Zustaendigkeit laeuft
    neben der der JSC.
- id: za-2026-zacc-copyright-bill
  jurisdiktion: za
  gericht: Constitutional Court of South Africa
  instanz: verfassungsgericht
  aktenzeichen: CCT 306/24; Neutralzitat [2026] ZACC 26
  ecli: ''
  datum: 2026-06-26
  parteien:
    klaeger: Ex parte President of the Republic of South Africa (Vorlage nach s. 79(4)(b) der Verfassung)
    beklagter: — (Verfahren ohne Beklagte; Beteiligte u.a. Nationalversammlung, National Council of Provinces,
      Minister of Trade, Industry and Competition sowie zahlreiche amici)
  status: rechtskraeftig
  themenachsen:
  - urheberrecht
  - grundrechte
  - content
  anspruchsgrundlage: s. 79(4)(b) Constitution (Vorlage eines Gesetzentwurfs durch den Präsidenten); s.
    25(1) Constitution (Eigentumsgarantie); s. 16 Constitution
  kernfrage: 'Sind die Schranken des Copyright Amendment Bill — insbesondere die offene Fair-Use-Klausel
    des s. 12A — mit der Verfassung, namentlich mit dem Verbot willkürlicher Eigentumsentziehung, vereinbar?

    '
  ergebnis: 'Überwiegend ja. Der Tenor unterscheidet sieben Punkte: (1) die Vorlage hinsichtlich der ss.
    6A, 7A und 8A insgesamt ist unzulässig, weil der Präsident dem Parlament nur die Rückwirkungsklauseln
    der Absätze 6A(7), 7A(7) und 8A(5) zur Prüfung vorgelegt hatte, die das Parlament daraufhin gestrichen
    hat, während der neue Einwand gegen s. 6A(2) selbst dem Parlament nie zur Beratung zugeleitet worden
    war; (2) s. 12A (fair use) ist verfassungsgemäss; (3) ss. 12B und 12C sind verfassungsgemäss; (4)
    s. 12D(1)-(5) ist verfassungswidrig, weil er eine willkürliche Eigentumsentziehung im Sinne von s.
    25(1) der Verfassung bewirkt; (5) s. 12D(6)-(9) ist verfassungsgemäss; (6) s. 19B ist verfassungsgemäss;
    (7) s. 19C ist verfassungsgemäss. Dieselben Feststellungen gelten für die entsprechenden Vorschriften
    des Performers'' Protection Amendment Bill. Zur Fair-Use-Klausel führt die Mehrheit aus, die Unterscheidung
    zwischen ''fair use'' und ''fair dealing'' liege nicht in der Bezeichnung, sondern in der Handhabung;
    die durch ''such as'' geöffnete Zweckliste bleibe über die ejusdem-generis-Regel eingehegt und erlaube
    zugleich Zwecke, die der Gesetzgeber noch nicht bedacht habe; die vier Fairnessfaktoren gäben hinreichende
    Führung; die Klausel sei nicht unbestimmt, weil Gerichte auf jahrzehntelange vergleichende Rechtsprechung
    zurückgreifen könnten; und die Entziehung unkörperlichen Eigentums unterliege geringeren Rechtfertigungsanforderungen
    als die körperlichen Eigentums. Mehrheit: Mhlantla J, mit Madlanga ADCJ, Dambuza J, Goosen AJ, Kollapen
    J, Opperman AJ, Rogers J und Tshiqi J; abweichend Majiedt J.

    '
  bedeutung: hoch
  volltext_url: https://www.saflii.org/za/cases/ZACC/2026/26.html
  zusammenfassung_url: https://ipkitten.blogspot.com/2026/07/guest-post-long-walk-to-copyright.html
  bezug_regelwerke:
  - za-copyright-amendment-bill
  - za-performers-protection-amendment-bill
  - za-constitution-1996
  - za-copyright-act-1978
