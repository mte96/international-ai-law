  kernfrage: 'Welche Sorgfaltspflichten treffen einen Rechtsanwalt, der einen Schriftsatz mit Hilfe generativer
    KI erstellt, und welche prozessualen Folgen hat die Einreichung erfundener Norm- und Rechtsprechungszitate?

    '
  ergebnis: 'Berichterstatterin Martha Patricia Guzmán Álvarez. Ein Anwalt hatte einen außerordentlichen
    Revisionsantrag eingereicht, der unzutreffende Zitate aus dem Código General del Proceso und nicht
    existierende Präzedenzfälle enthielt; auch der Berichtigungsschriftsatz enthielt erfundene Nachweise.
    Der Anwalt räumte ein, die Ungenauigkeiten stammten aus dem Einsatz eines generativen KI-Programms.
    Die Sala stellte einen gesteigerten Sorgfaltsmaßstab für den anwaltlichen KI-Einsatz auf: Die Pflicht
    zur Überprüfung der Quellen bleibt unverzichtbar, und die Einführung unechter Inhalte in ein Verfahren
    kann prozessuale Leichtfertigkeit (temeridad) begründen.

    '
