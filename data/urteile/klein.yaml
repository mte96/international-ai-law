  kernfrage: 'Welche Sorgfaltspflicht trifft eine Rechtsanwältin, die Rechtsprechungszitate aus einem
    KI-gestützten Internetdienst in eine Verfassungsbeschwerde übernimmt, und welche Folge hat es, wenn
    die zitierten Entscheidungen nicht existieren?

    '
  ergebnis: 'Die Verfassungsbeschwerde gegen eine Entscheidung des Scharia-Berufungsgerichts über einen
    Scheidungsvergleich wurde bereits in limine zurückgewiesen; für ein Eingreifen in die Entscheidungen
    der Religionsgerichte fehlte die Grundlage, und die Antragstellerin konnte nicht belegen, dass sie
    die Verzichtsklausel des Vergleichs missverstanden hatte. Für die KI-Frage tragend ist Randnummer
    13: Nach eigenem Eingeständnis stützte sich die Prozessbevollmächtigte auf "dieselben Verweise und
    Zitate, nach Angaben, die ihr von jener Internetseite geliefert wurden, die ihr von Kolleginnen und
    Kollegen empfohlen worden war, ohne ihre Richtigkeit zu prüfen" — die erhaltenen Fundstellen "gab
    es nicht und sie waren nie geschaffen worden" (לא היו ולא נבראו). Der Gerichtshof folgerte aus Verweisen
    auf nicht existierende Entscheidungen, in sich widersprüchlichen Fundstellenangaben und erfundenen
    Zitaten mit hoher Wahrscheinlichkeit die Nutzung eines KI-gestützten Dienstes und stellte fest, dass
    Rechtsanwältinnen und Rechtsanwälte ihre berufliche Verantwortung und ihr eigenes Urteil durch den
    Einsatz solcher Werkzeuge nicht abstreifen können. Von einer Sanktion sah der Gerichtshof ab, um die
    Mandantin nicht zu belasten, kündigte aber an, dass gleichartige Fälle künftig gerichtliche Sanktionen
    rechtfertigen.

    '
