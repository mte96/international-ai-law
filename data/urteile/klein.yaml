- id: tw-2021-ipcc-dabus-aufmerksamkeit
  jurisdiktion: tw
  gericht: 智慧財產及商業法院 — Intellectual Property and Commercial Court
  instanz: erstinstanzlich
  aktenzeichen: 110年度行專訴字第3號行政判決 (民國110年8月19日)
  ecli: ''
  datum: 2021-08-19
  parteien:
    klaeger: 泰勒 史蒂芬 L. (THALER, Stephen L.), vertreten durch RA 翁林瑋, Patentanwaeltin 吳珮琪 und Patentanwalt
      洪澄文
    beklagter: 經濟部智慧財產局 (Intellectual Property Office, TIPO)
  status: rechtskraeftig
  themenachsen:
  - urheberrecht
  - governance
  - grundrechte
  anspruchsgrundlage: '§§ 1, 5 Abs. 2, 6 Abs. 1, 7 Abs. 4, 17 Abs. 1 專利法; §§ 16, 31, 83 專利法施行細則; §§ 6,
    16, 18 民法 (Zivilgesetzbuch)

    '
  kernfrage: 'Kann ein KI-System in einer taiwanischen Patentanmeldung als Erfinder benannt werden, und
    darf das Patentamt die Anmeldung wegen unterbliebener Benennung einer natuerlichen Person als nicht
    angenommen behandeln?

    '
  ergebnis: 'Klage abgewiesen. Das Gericht bestaetigt die Nichtannahme der Anmeldung Nr. 108140133 (''吸引增強注意力的裝置和方法''
    — Vorrichtungen und Verfahren zur Erregung erhoehter Aufmerksamkeit, angemeldet am 05.11.2019) durch
    das TIPO nach § 17 Abs. 1 專利法. Zwei tragende Erwaegungen. ERSTENS: Der Erfinder muss eine natuerliche
    Person sein. Aus § 1 專利法 (Foerderung der Entwicklung durch Schutz menschlicher Schoepfung), § 5 Abs.
    2 (Anmeldeberechtigung des Erfinders und seiner Rechtsnachfolger) und den §§ 16, 31 und 83 der Durchfuehrungsverordnung
    (Angabe von Name und Staatsangehoerigkeit des Erfinders in Anmeldung und Veroeffentlichungsblatt)
    folge, dass Erfinder nur sein koenne, wer zu den technischen Merkmalen der Anspruechen einen wesentlichen
    geistigen Beitrag geleistet habe — und dass dies eine natuerliche Person voraussetze. Das Gericht
    zitiert dafuer die amtliche Kommentierung des TIPO (''由於法人之研發工作，係透過自然人進行，所以本法 所稱之發明人、新型創作人及設計人，均僅限於自然人'')
    und das Pruefungsrichtlinienwerk 專利審查基準 Teil 1 Kap. 1-2-1 (''發明人必為自然人''). ZWEITENS: KI ist keine Person
    im Rechtssinne. Nach §§ 6, 16 und 18 民法 beginnt die Rechtsfaehigkeit mit der Geburt und endet mit
    dem Tod, sind Rechts- und Geschaeftsfaehigkeit unverzichtbar und ist das Persoenlichkeitsrecht geschuetzt;
    die Ausuebung von Rechten setze eine Willenserklaerung voraus, die aus einem inneren Willen und dessen
    aeusserer Kundgabe bestehe. Beides koenne ein KI-System nicht leisten.

    '
  bedeutung: hoch
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=IPCA,110,%E8%A1%8C%E5%B0%88%E8%A8%B4,3,20210819,1
  zusammenfassung_url: ''
  bezug_regelwerke:
