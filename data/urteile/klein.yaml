  instanzenzug: []
  quelle_tracker: CDH Employment Law Alert 04.07.2025; SAFLII
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die dogmatisch schärfste der südafrikanischen Halluzinationsentscheidungen. Sie formuliert
    erstens eine eigenständige Prüfpflicht als Berufspflicht — nicht als Ausfluss der Wahrheitspflicht
    gegenüber dem Gericht, sondern als Sorgfaltspflicht bei der Werkzeugwahl. Sie stellt zweitens klar,
    dass bereits Fahrlässigkeit genügt, während die englische Linie (Ayinde) auf die Frage abstellt, ob
    das Gericht bewusst getäuscht wurde. Und sie zeigt drittens, dass die Sanktion vom Ausgang der Hauptsache
    unabhängig ist: Die Antragstellerin hat gewonnen und ihre Vertreter wurden gleichwohl dem Legal Practice
    Council gemeldet. Das ist die Konstruktion, die in Jurisdiktionen ohne Kostensanktion die einzige
    wirksame bleibt.

    '
