  quelle_tracker: Amtlicher Nachweis über Juristeca, die Rechtsprechungsdatenbank des Poder Judicial de
    la CABA (Fallo-ID 51869, Sala I, 28.04.2023, Causa 182908-2020-0). Der amtliche Volltext-PDF war in
