  instanzenzug:
  - tw-2022-tpaa-dabus-aufmerksamkeit
  quelle_tracker: 司法院裁判書系統 (judgment.judicial.gov.tw)
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Dies ist die taiwanische DABUS-Entscheidung, die bisher nur als Platzhalter ohne
    Aktenzeichen und mit dem erfundenen Datum 2024-01-01 gefuehrt wurde. Sie ist aus zwei Gruenden interessanter
    als ihre auslaendischen Geschwister. Erstens argumentiert das Gericht nicht ueber die Patentierbarkeit,
    sondern ueber die Rechtsfaehigkeit des Zivilrechts — die §§ 6, 16 und 18 民法 tragen die Entscheidung,
    nicht das Patentrecht. Das ist dieselbe Konstruktion, die das 最高行政法院 spaeter zum Namensnennungsrecht
    als Persoenlichkeitsrecht fortfuehrt. Zweitens hat das TIPO den Fall verfahrensrechtlich ueber § 17
    Abs. 1 (Nichtannahme wegen Fristversaeumnis) erledigt und damit eine materielle Zurueckweisung vermieden
    — ein Kunstgriff, den weder das EPA noch das UKIPO gewaehlt haben. Die praktische Folge ist dieselbe,
    die dogmatische Angriffsflaeche aber kleiner.

    '
  normen:
  - tw-patentgesetz-sec-21
  - tw-patentgesetz-sec-5
  dokumenttyp: 行政判決 (Verwaltungsurteil), Volltext in der amtlichen Entscheidungsdatenbank
  aktenzeichen_original: 智慧財產及商業法院 110 年度行專訴字第 3 號行政判決
  quelle_art: amtlich
  sachverhalt: Der amerikanische Erfinder Stephen L. Thaler (泰勒 史蒂芬 L.) meldete am 5. November 2019 beim
    taiwanischen Patentamt (經濟部智慧財產局, TIPO) eine Erfindung mit dem Titel 「吸引增強注意力的裝置和方法」 — Vorrichtungen
    und Verfahren zur Erregung erhöhter Aufmerksamkeit — unter der Nummer 108140133 an. Als Erfinder benannte
    er nicht sich selbst, sondern das von ihm entwickelte KI-System DABUS. Das TIPO forderte ihn auf,
    eine natürliche Person als Erfinder zu benennen; da er dem nicht nachkam, behandelte es die Anmeldung
    nach § 17 Abs. 1 專利法 als nicht angenommen. Der Widerspruch beim Wirtschaftsministerium blieb erfolglos.
    Thaler klagte daraufhin, vertreten durch Rechtsanwalt 翁林瑋 sowie die Patentanwälte 吳珮琪 und 洪澄文, vor
    dem 智慧財產及商業法院.
  sachverhalt_quelle: eintrag
