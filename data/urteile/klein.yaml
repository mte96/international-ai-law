  anspruchsgrundlage: '§§ 20 Abs. 1, 41 個人資料保護法; § 104 Abs. 1 公職人員選舉罷免法; § 113 Abs. 3 公職人員選舉罷免法; §§ 74
    Abs. 1 Nr. 1, 74 Abs. 2 Nr. 4 刑法

    '
  kernfrage: 'Ist die Montage des Bildes eines Politikers in ein Abberufungskampagnenmotiv eine unbefugte
    Nutzung personenbezogener Daten und zugleich ein Wahlstrafdelikt?

    '
  ergebnis: 'Verurteilung wegen unbefugter zweckueberschreitender Nutzung personenbezogener Daten (§§
    20 Abs. 1, 41 PDPA) zu drei Monaten Freiheitsstrafe, umwandelbar in Geldstrafe, ausgesetzt auf zwei
    Jahre mit der Auflage, binnen eines Jahres 50.000 NTD an die Staatskasse zu zahlen; zusaetzlich Aberkennung
    der buergerlichen Ehrenrechte fuer ein Jahr nach § 113 Abs. 3 選罷法. Der Angeklagte hatte vor dem Abberufungsverfahren
    gegen den Abgeordneten 賴士葆 (Abstimmung 26.07.2025) ein aus dem Netz beschafftes Foto des Stadtrats
    李柏毅 (Daumen-hoch-Geste) mit einer Abberufungswerbetafel zu einem Bild zusammengesetzt und mit einem
    Text veroeffentlicht, der den Eindruck erweckte, 李柏毅 unterstuetze die Abberufung seines Parteikollegen.
    Das Gericht wertet das als Verbreiten unwahrer Tatsachen nach § 104 Abs. 1 選罷法 und zugleich als unbefugte
    Datennutzung; verurteilt wird aus § 41 PDPA.

    '
  bedeutung: mittel
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPDM,115,%E8%A8%B4,41,20260615,1
  zusammenfassung_url: ''
