  eigene_bewertung: 'Dies ist die hoechstrichterliche taiwanische Entscheidung zur KI-Erfindereigenschaft
    und damit die Fundstelle, die man zitiert. Sie datiert vom Juli 2022 — vor dem britischen Supreme
    Court (Thaler v. Comptroller-General, Dezember 2023) und vor der Grossen Beschwerdekammer des EPA.
    Taiwan gehoert damit zu den ersten Rechtsordnungen mit einer letztinstanzlichen Entscheidung, und
    der Bestand hat das bisher nicht abgebildet.

    '
  normen:
  - tw-patentgesetz-sec-21
  - tw-patentgesetz-sec-5
  dokumenttyp: 判決 (Urteil des hoechsten Verwaltungsgerichts)
