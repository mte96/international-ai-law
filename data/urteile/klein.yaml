  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Diese Tesis aislada fehlte und ist der fehlende erste Schritt der mexikanischen Entwicklung.
    Sie zeigt zweierlei. Erstens: Die vier Mindestelemente standen bereits im August 2025 fest, also fuenf
    Monate bevor sie durch Wiederholung in fuenf Entscheidungen zur bindenden Jurisprudencia wurden. Wer
    die mexikanische Linie datieren will, muss auf August 2025 abstellen, nicht auf Januar 2026. Zweitens
    macht sie den Anlassfall greifbar: Es ging um die Berechnung einer Sicherheitsleistung im Zusammenhang
    mit der Eintragung der Klage in die Grundbuchblaetter der streitgegenstaendlichen Grundstuecke — eine
    reine Rechenoperation. Der Begriff ''autocontención'' (richterliche Selbstbeschraenkung) ist hier
    bereits ausdruecklich verwendet und traegt die gesamte Konstruktion: Das Gericht regelt nicht das
    Verhalten Dritter, sondern das eigene, weil der Gesetzgeber schweigt. Fuer die europaeische Diskussion
    um Art. 14 KI-VO ist das die interessantere Figur als die Jurisprudencia selbst, weil sie zeigt, wie
    ein Gericht ohne Rechtsgrundlage zu einem Pruefmassstab kommt.

    '
