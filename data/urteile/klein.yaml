  jurisdiktion: tw
  gericht: 臺灣新竹地方法院 — Taiwan Hsinchu District Court
  instanz: erstinstanzlich
  aktenzeichen: 115年度訴字第339號刑事判決 (民國115年6月12日)
  ecli: ''
  datum: 2026-06-12
  parteien:
    klaeger: 臺灣新竹地方檢察署檢察官 (Staatsanwaltschaft Hsinchu, Anklage 114年度偵字第11204、17377號)
    beklagter: 謝承豫 (Beamter), verteidigt durch RAe 謝明訓 und 林育瑄
  status: erstinstanzlich
  themenachsen:
  - content
  - datenschutz
  - grundrechte
  anspruchsgrundlage: '§§ 20 Abs. 1, 41 個人資料保護法; § 235 Abs. 1, § 319-4 Abs. 2, §§ 216, 210, 220 Abs. 2
    中華民國刑法; §§ 55, 74 中華民國刑法

    '
  kernfrage: 'Nach welcher Vorschrift ist zu bestrafen, wer mit KI-Gesichtstausch unwahre sexuelle Bilder
    einer bestimmten Person erzeugt und sie unter deren Namen auf einem sozialen Netzwerk zugaenglich
    macht?

    '
  ergebnis: 'Verurteilung wegen unbefugter Nutzung personenbezogener Daten durch eine nichtoeffentliche
    Stelle (§§ 20 Abs. 1, 41 PDPA) zu sechs Monaten Freiheitsstrafe, umwandelbar in Geldstrafe zu 1.000
    NTD je Tag, ausgesetzt zur Bewaehrung auf zwei Jahre unter der Auflage, den im Adhaesionsverfahren
    geschlossenen Vergleich (115年度附民字第 559號; 500.000 NTD) zu erfuellen. Einziehung zweier iPhones. Der
    Angeklagte hatte ueber mehr als zwei Jahre unter dem Namen der Geschaedigten ein Instagram-Konto betrieben,
    dort aus deren Gesichtsaufnahmen erzeugte unwahre sexuelle Bilder mit sexuell anspielenden Texten
    veroeffentlicht und sie damit einem unbestimmten Personenkreis zugaenglich gemacht. DOGMATISCH ENTSCHEIDEND:
    Das Gericht bejaht tateinheitlich VIER Delikte — § 41 PDPA, § 235 Abs. 1 StGB (Zugaenglichmachen obszoener
    Darstellungen), § 319-4 Abs. 2 StGB (Zugaenglichmachen computersynthetisierter unwahrer sexueller
    Bilder) und Gebrauch gefaelschter quasi-privater Urkunden (§§ 216, 210, 220 Abs. 2 StGB) — und verurteilt
    nach § 55 StGB aus der SCHWERSTEN Norm: § 41 PDPA. Das Herstellen des Deepfake (§ 319-4 Abs. 1) wird
    als mitbestrafte Vortat vom Zugaenglichmachen aufgezehrt; die Einzelakte werden als fortgesetzte Handlung
    (接續犯) zusammengefasst. Eine Strafmilderung nach § 59 StGB lehnt das Gericht ab: Die Tat verletze Wuerde
    und soziale Geltung der Geschaedigten schwer und habe ueber zwei Jahre angedauert.

    '
  bedeutung: hoch
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=SCDM,115,%E8%A8%B4,339,20260612,1
  zusammenfassung_url: ''
  bezug_regelwerke:
  - tw-strafgesetzbuch
  - tw-pdpa
  instanzenzug: []
  quelle_tracker: 司法院裁判書系統
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der wichtigste taiwanische Deepfake-Fall — und ein Befund, der die uebliche Erzaehlung
    umdreht. Taiwan hat 2023 einen eigenen Deepfake-Straftatbestand geschaffen; in der Praxis verurteilt
    das Gericht aber nach dem Datenschutzstrafrecht, weil dessen Geldstrafrahmen (bis 1 Mio. NTD) den
    des § 319-4 Abs. 2 (bis 500.000 NTD) uebersteigt und die Norm damit die schwerere ist. Wer die Wirksamkeit
    von Deepfake-Straftatbestaenden an Verurteilungszahlen misst, misst in Taiwan das Falsche: Die Deepfake-Verurteilungen
    stehen in den Tenoren des Datenschutzrechts. Fuer die europaeische Diskussion ist das ein Argument
    dafuer, dass ein Datenschutzregime mit Strafbewehrung ein wirksamerer Hebel gegen Deepfakes sein kann
    als ein Spezialtatbestand. Zweitens zeigt der Fall die Reichweite des taiwanischen Urkundenstrafrechts:
    Ein unter fremdem Namen angelegtes Social-Media-Konto ist nach § 220 Abs. 2 StGB eine gefaelschte
    quasi-private Urkunde — nicht Veraenderung, sondern Faelschung, weil das Konto von Grund auf neu geschaffen
    wurde.

    '
  normen:
