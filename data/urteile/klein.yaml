  kernfrage: 'Was ist zu tun, wenn nicht ein Schriftsatz, sondern das angefochtene URTEIL erfundene Fundstellen
    enthält, und wer ist für einen Acting Judge disziplinarisch zuständig?

    '
  ergebnis: 'Ziff. 18: Das Gericht haelt die Entscheidung der Vorinstanz im Ergebnis fuer richtig und
    lehnt es ausdruecklich ab, sich auf die KI-Frage einzulassen. Ziff. 33: Es listet in einer Tabelle
    auf, was tatsaechlich schiefging - teils richtiger Fallname bei falscher Fundstelle, teils richtige
    Fundstelle bei verfaelschtem Zitat, an das eine Passage aus einer anderen, nicht genannten Entscheidung
    angehaengt ist. Ziff. 119: Art. 4(a) (Integritaet) und Art. 5(1) (ehrenhaftes Verhalten) des Code
    of Judicial Conduct sind beruehrt; die Aufnahme ungeprueffter, erfundener Fundstellen in ein Urteil
    ist damit unvereinbar, auch ohne Vorsatz. Ziff. 121: Das Fehlen einer JSC-Zustaendigkeit fuer acting
    judges ist nach dem First Certification Judgment bewusste Verfassungsgestaltung, kein Versehen. Ziff.
    122: Das Urteil wird dem Vorsitzenden des Legal Practice Council als Beschwerde zugeleitet; es enthaelt
    ausdruecklich keine Feststellungen des Gerichts, sondern zu untersuchende Beobachtungen.'
  bedeutung: hoch
  volltext_url: https://www.saflii.org/za/cases/ZAGPJHC/2026/875.html
  zusammenfassung_url: https://groundup.org.za/article/acting-judge-referred-to-legal-practice-council-over-possible-ai-hallucinations-in-judgment/
  bezug_regelwerke:
  - za-legal-practice-act-2014
  - za-ocj-draft-ai-policy
  - za-constitution-1996
  instanzenzug: []
  quelle_tracker: AI Hallucination Cases Database (Charlotin), Stand 05.09.2026; naturalandartificiallaw.com;
    GroundUp 04.08.2026
  verifiziert: true
  letzte_pruefung: '2026-09-07'
  eigene_bewertung: 'Die weltweit interessanteste Entscheidung zur Zurechnung richterlicher KI-Halluzinationen
    und der wichtigste südafrikanische Fall überhaupt. Drei Gründe. Erstens die Konstellation: Nicht die
    Anwälte, sondern der Richter hat halluziniert — und der Spruchkörper bestätigt gleichwohl das Ergebnis
    in der Sache. Damit trennt er sauber zwischen der Richtigkeit der Entscheidung und der Redlichkeit
    ihrer Begründung; das ist der Gegenpol zur kolumbianischen Linie, in der halluzinierte Begründungen
    zur Nichtigkeit führen. Zweitens die Zuständigkeitsfrage: Der südafrikanische Acting Judge ist disziplinarrechtlich
    niemandem unterstellt — die Judicial Service Commission ernennt ihn nicht, das Judicial Service Commission
    Act erfasst ihn nicht, und die einzige Handhabe ist seine fortbestehende Eintragung als Rechtsanwalt.
    Diese Lücke gibt es in ähnlicher Form in jeder Rechtsordnung, die auf Aushilfsrichter zurückgreift;
    Südafrika ist die erste, die sie an einem KI-Fall benennt. Drittens die Beweisführung: Der Spruchkörper
    stellt keine Feststellung zur tatsächlichen KI-Nutzung, sondern nur zur plausibelsten Erklärung —
    eine Zurückhaltung, die der Nichtdeterminismus der Modelle erzwingt und die man in europäischen Entscheidungen
    bislang vermisst.

    '
  normen:
