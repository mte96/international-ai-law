  eigene_bewertung: 'Das kolumbianische Gegenstück zu Mata v. Avianca — mit dem Unterschied, dass hier
    das höchste Zivilgericht des Landes selbst spricht und nicht ein erstinstanzliches Bundesgericht.
    Damit hat Kolumbien innerhalb von achtzehn Monaten die vollständige Achse abgedeckt: T-323/24 zum
    Richter, Tribunal Superior de Bogotá 12/2025 zur Kassationsfolge, AC739-2026 zum Anwalt. Keine andere
