  - '07.09.2026: NZLII-Fundstelle ueber den Browser des Bearbeiters beschafft. NZLII ist Rechtsdatenbank,
    nicht Urschrift - fuer die Zitierfaehigkeit ausreichend, fuer die Urschrift ist courtsofnz.govt.nz
    zu pruefen. Adresse aus dem Zitat abgeleitet, Muster an A v R bestaetigt; der Einzelabruf steht aus.'
  eigene_bewertung: 'Eine gravierende Lücke: Die neuseeländische DABUS-Linie fehlte vollständig, obwohl
    der Bestand die israelische, die australische und die britische führt. Und sie ist nicht bloss eine
    weitere Wiederholung des immergleichen Ergebnisses.

    Neuseeland ist, soweit ersichtlich, die einzige Rechtsordnung, in der ein Gericht ausdrücklich eingeräumt
    hat, dass der GESETZESWORTLAUT eine maschinelle Erfinderschaft trägt, und die Klage gleichwohl abgewiesen
    hat — allein aus teleologischen und kompetenziellen Gründen. Der britische Supreme Court in Thaler
    v Comptroller-General und der australische Full Court in Commissioner of Patents v Thaler argumentieren
    demgegenüber textbezogen: Erfinder sei begrifflich eine natürliche Person. Der Unterschied ist erheblich,
    weil er die Reichweite des Präjudizes bestimmt: Wo der Wortlaut trägt, genügt eine gesetzgeberische
    Klarstellung; wo er entgegensteht, bedarf es einer Systemänderung. Für die europäische Diskussion
    um Art. 81 EPÜ und die Entscheidungen J 8/20 und J 9/20 der Juristischen Beschwerdekammer ist die
    neuseeländische Begründung die interessantere Gegenposition, weil sie zeigt, dass das Ergebnis auch
    ohne begriffliche Sperre erreichbar ist.

    '
