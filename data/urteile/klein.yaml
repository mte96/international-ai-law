  verifiziert: false
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die einzige argentinische Entscheidung, die das intertemporale Problem ausdrücklich
    behandelt — und sie beantwortet es wie eine Strafnorm: keine Sanktion für Verhalten vor Inkrafttreten
    des Protokolls. Damit behandelt das Gericht die Acordada 22/25 der Sache nach als Sanktionsnorm mit
    Rückwirkungsverbot, obwohl es sich formal um eine Verwaltungsanordnung des Obergerichts handelt.

    Das ist die notwendige Ergänzung zur Chubuter Entscheidung: Dort ging es um die prozessuale Wirkung
    einer KI-Richtlinie (keine), hier um ihre disziplinarische (ja, aber nur ex nunc). Zusammen ergeben
    beide Entscheidungen das argentinische Bild — Justiz-KI-Richtlinien wirken berufsrechtlich und ab
    Erlass, nicht verfahrensrechtlich und nicht rückwirkend. '
