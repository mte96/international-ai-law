    '
  ergebnis: 'Im Wesentlichen ja. Die Arbeitsverwaltung hatte bei Kontrollen 71 Zustellerinnen und Zusteller
    erfasst; das Unternehmen erkannte nur einen als Beschäftigten an, behandelte die übrigen als selbständig
    und bestritt zu acht Personen jede Verbindung. Der Gerichtshof bestätigte die Anwendung der Vermutung
    des Art. 23 LCT für 62 Personen und damit ein Bussgeld von 16.426.800 ARS; hinsichtlich der acht bestrittenen
    Personen hob er die Entscheidung auf und verwies zurück. Tragend war, dass das Unternehmen die Kontrollprotokolle
    nicht angefochten und den Aussagen der Zusteller nichts entgegengesetzt hatte.

    '
