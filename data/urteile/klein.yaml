  anspruchsgrundlage: § 17b, § 2a (Verbot der Nutzung öffentlicher Vermögensgegenstände im Wahlkampf)
    und § 2b lit. b (Streitkräfte im Wahlkampf) Wahlgesetz (Wahlwerbung) 5719-1959
  kernfrage: 'Ist die digitale Erzeugung von Bildern uniformierter Soldaten für Wahlwerbung eine unzulässige
    Nutzung öffentlicher Vermögensgegenstände, obwohl keine echten Aufnahmen verwendet wurden?

    '
  ergebnis: 'Ja. Dem Antrag wurde stattgegeben. Uniformen und militärische Bildsprache seien immaterielle
    Vermögensgegenstände der Streitkräfte; sie durch KI oder andere digitale Mittel zugunsten einer Kandidatur
    nachzubilden, verletze die Vorschriften, die das Militär aus der politischen Arena heraushalten sollen.
    Angeordnet wurde die Entfernung des Videos von sämtlichen Konten in sozialen Netzwerken sowie die
    Zahlung von 5.000 NIS Kosten an die Antragstellerin.

    '
