    (unlautere Beeinträchtigung der Wahlwerbung)
  kernfrage: 'Ist ein Wahlwerbevideo, das mit generativer KI eine niemals stattgefundene Begegnung darstellt,
    eine unzulässige Irreführung der Wählerschaft?

    '
  ergebnis: 'Die Anträge hatten Erfolg. Der Ausschussvorsitzende ordnete an, das KI-erzeugte Video von
    sämtlichen Konten in sozialen Netzwerken zu entfernen, und erlegte den Antragsgegnern je 5.000 NIS
    Kosten an jeden Antragsteller auf. Tragend war, dass die KI-erzeugte Darstellung einer fiktiven Begegnung
    eine erhebliche Gefahr der Täuschung der Wählerschaft über Tatsachen begründe und damit die Schwelle
    der unlauteren Beeinträchtigung erreiche. Ein nachträglich hinzugefügter Hinweis auf die künstliche
    Erzeugung sei für den durchschnittlichen Betrachter nicht hinreichend erkennbar gewesen.

    '
