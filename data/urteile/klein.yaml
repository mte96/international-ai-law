  anspruchsgrundlage: §§ 420 ff. 刑事訴訟法 (Wiederaufnahme); Sachverhalt 傷害致重傷
  kernfrage: 'Kann von generativer KI erzeugtes ''medizinisches Referenzmaterial'' ein neues Beweismittel
    im Sinne des Wiederaufnahmerechts sein?

    '
  ergebnis: 'Wiederaufnahmeantrag zurueckgewiesen. Der Antragsteller hatte sich unter anderem auf im Internet
    gefundene Video- und Audioausschnitte sowie auf ''von generativer kuenstlicher Intelligenz erzeugte
    medizinische Referenzunterlagen'' (生成式人工智慧所生成之醫療參考資料) gestuetzt. Das Gericht haelt fest, die Feststellungen
    des rechtskraeftigen Urteils beruhten auf den in den Akten belegten Beweismitteln und seien nicht
    aus der Luft gegriffen; weder allein noch zusammen mit den bisherigen Beweisen liessen die vorgelegten
    Materialien den Schluss zu, die Geschaedigte habe die Verletzungen nicht durch den Streit und die
    koerperliche Auseinandersetzung mit dem Antragsteller erlitten.

    '
  bedeutung: mittel
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPHM,114,%E8%81%B2%E5%86%8D,80,20260525,2
  zusammenfassung_url: ''
