  instanzenzug:
  - tw-2022-tpaa-dabus-behaelter
  quelle_tracker: 司法院裁判書系統
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Das Parallelverfahren ist dogmatisch das staerkere. Waehrend die Entscheidung im
    Verfahren Nr. 3 mit dem Zivilrecht argumentiert, argumentiert diese aus dem Patentrecht selbst: Weil
    das Anmelderecht uebertragbar und vererblich ist, muss sein Inhaber rechtsfaehig sein. Das ist ein
    Argument, das auch in Rechtsordnungen traegt, deren Zivilrecht die Rechtsfaehigkeit anders konstruiert.

    '
  normen:
  - tw-patentgesetz-sec-26
  - tw-patentgesetz-sec-5
