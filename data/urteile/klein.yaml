  anspruchsgrundlage: '§ 47 行政法院組織法 i.V.m. § 90-1 Abs. 1 und § 90-3 法院組織法; § 8 Abs. 1 法庭錄音錄影及其利用保存辦法

    '
  kernfrage: 'Darf ein Gericht die Herausgabe der Tonaufzeichnung einer muendlichen Verhandlung mit der
    Begruendung verweigern, es bestehe kein verlaesslicher Mechanismus gegen eine spaetere Deepfake- Manipulation
    der Aufzeichnung durch Dritte?

    '
  ergebnis: 'Antrag zurueckgewiesen. Die Prozessbevollmaechtigten hatten die Tonaufzeichnung der Verhandlung
    vom 09.07.2026 verlangt, um zu pruefen, ob das Sitzungsprotokoll vollstaendig sei; der Vorsitzende
    habe zahlreiche, teils in der Vorbereitung nicht angesprochene Fragen gestellt, die Antworten seien
    umfangreich gewesen, und das Protokoll koenne unvollstaendig sein. Das Gericht haelt dem entgegen,
    es bestehe derzeit kein verlaesslicher Mechanismus, der verhindere, dass eine Tonaufzeichnungs-CD
    nach dem Verlassen des ausschliesslichen gerichtlichen Verwaltungsbereichs von Dritten mit KI-Technik
    deepgefaelscht werde (''現行並無任何可靠機制可防堵法庭錄音 光碟逸脫法院專屬管理範圍之後任由他人以AI科技技術進行深度偽造之風險''); da das Gericht von
    Amts wegen andere Wege zur Wahrung des rechtlichen Interesses an der Protokollrichtigkeit eroeffnet
    habe, sei der Antragsteller auf den Besitz der CD nicht angewiesen.

    '
  bedeutung: hoch
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=TPBA,115,%E8%81%B2,84,20260824,1
  zusammenfassung_url: ''
  bezug_regelwerke:
  - tw-gerichtsverfassungsgesetz
  - tw-judicial-yuan-ki-leitlinie
  instanzenzug: []
  quelle_tracker: 司法院裁判書系統
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der originellste taiwanische Befund dieser Recherche und, soweit ersichtlich, weltweit
    ohne Parallele: Ein Gericht beschraenkt Verfahrensrechte der Partei nicht wegen deren eigenen KI-Einsatzes,
    sondern wegen des abstrakten Risikos, dass DRITTE das herausgegebene Beweismittel spaeter faelschen
    koennten. Die Erwaegung ist keine Einzelmeinung: Sie findet sich zwischen dem 30.09.2025 (114年度聲字第21號)
    und dem 24.08.2026 in mindestens acht Entscheidungen des 臺北高等行政法院 in beiden Kammern sowie in einer
    Familiensache des 臺灣臺北地方法院 (115年度家聲字第23號 vom 24.02.2026). Rechtspolitisch ist sie angreifbar: Wer
    die Richtigkeit des Protokolls bestreiten will, braucht die Aufzeichnung; wird sie ihm wegen eines
    Risikos verweigert, das er nicht gesetzt hat, traegt er eine Beweislast, die er nicht erfuellen kann.
    Fuer die europaeische Debatte um Art. 14 KI-VO und um die Integritaet digitaler Beweismittel ist das
    die konkreteste Anschauung, die es derzeit gibt.

    '
  normen:
  - tw-gvg-sec-90-1
  - tw-gvg-sec-90-3
  dokumenttyp: 裁定 (Beschluss im Zwischenverfahren)
  aktenzeichen_original: 臺北高等行政法院 高等庭 115 年度聲字第 84 號裁定
  pruefvermerk:
  - 'Die Parallelentscheidungen sind ueber die Volltextsuche 深度偽造 in der amtlichen Entscheidungsdatenbank
    nachweisbar: 臺北高等行政法院 114年度聲字第21號 (30.09.2025), 第154號 (23.10.2025), 第172號 und 第179號 (23.12.2025),
    第177號 (31.12.2025), 地方庭 114年度地聲字第45號 (31.12.2025), 115年度聲字第31號 (06.05.2026) sowie 臺灣臺北地方法院 115年度家聲字第23號
    (24.02.2026). Sie wurden nicht einzeln geoeffnet.

    '
  quelle_art: amtlich
  sachverhalt: In einem Verfahren nach dem 促進轉型正義條例 vor dem 臺北高等行政法院 (113年度訴字第825號) fand am 9. Juli 2026
    eine mündliche Verhandlung statt. Der Vorsitzende stellte dabei zahlreiche Fragen, die in der Vorbereitung
    teils nicht angesprochen worden waren; die Antworten fielen umfangreich aus. Die Prozessbevollmächtigten
    — die Rechtsanwälte 薛欽峰, 劉又禎 und 許渝澤 — hielten das Sitzungsprotokoll für möglicherweise unvollständig
    und beantragten die Herausgabe der Tonaufzeichnung der Verhandlung auf CD, um es überprüfen zu können.
    Über diesen Antrag hatte die Erste Kammer des Gerichts in einem Zwischenverfahren zu befinden (115年度聲字第84號).
  sachverhalt_quelle: eintrag
