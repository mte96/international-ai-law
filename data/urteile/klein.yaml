  pruefvermerk:
  - Am Entscheidungstext auf NZLII geprüft (06.09.2026); Randnummern 35 und 36 sowie Fussnote 13 wurden
    gelesen.
  - '07.09.2026: NZLII-Fundstelle ueber den Browser des Bearbeiters beschafft. NZLII ist Rechtsdatenbank,
    nicht Urschrift - fuer die Zitierfaehigkeit ausreichend, fuer die Urschrift ist courtsofnz.govt.nz
    zu pruefen. Adresse aus dem Zitat abgeleitet, Muster an A v R bestaetigt; der Einzelabruf steht aus.'
  eigene_bewertung: 'Für sich genommen unspektakulär, im Zusammenhang aber aufschlussreich: Es ist derselbe
    Richter wie in LMN v STC, und er benutzt fünf Monate später fast denselben Wortlaut. Damit entsteht
    in Neuseeland eine Standardformel unterhalb der Sanktionsschwelle — Feststellung, Erinnerung an die
    Prüfpflicht, Verweis auf die Leitlinien, keine Folge. Genau diese Formel bricht der Supreme Court
    in Jones auf, indem er Kontempt und Straftatbestände ins Spiel bringt. Wer die neuseeländische Entwicklung
    darstellt, braucht beide Pole.

    '
