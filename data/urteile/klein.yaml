  eigene_bewertung: 'Für sich genommen unspektakulär — eine Prozessentscheidung. Ihr Wert liegt im Negativbefund:
    Die zentrale Norm der digitalen kolumbianischen Justiz ist bis heute nicht in der Sache verfassungsgerichtlich
    überprüft. Wer Art. 2 Ley 2213 de 2022 als Ermächtigungsgrundlage für richterlichen KI-Einsatz heranzieht,
    kann sich auf keine Auslegung der Corte Constitucional zu dieser Vorschrift stützen. T-323/24 hat
    die Frage ihrerseits offen gelassen und stattdessen unmittelbar aus Art. 29, 228, 229 und 230 CP argumentiert.
    Das ist die eigentliche Schwäche der kolumbianischen Konstruktion: Es fehlt eine gesetzliche Grundlage,
    und der einzige Kandidat dafür ist gerichtlich ungeprüft.

    '
