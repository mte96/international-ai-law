  quelle_tracker: SAFLII; IPKat 07/2026; Centre on Knowledge Governance
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Für das KI-Recht die folgenreichste südafrikanische Entscheidung — und zwar, ohne
    KI mit einem Wort zu erwähnen. Das Verfassungsgericht hat eine offene Fair-Use-Klausel mit Transformativitäts-
    und Marktschadensfaktor verfassungsrechtlich freigegeben. Es hat dabei zwei Sätze formuliert, die
    in einem künftigen Trainingsverfahren tragen werden: erstens, dass die offene Zweckliste gerade Zwecke
    erfassen soll, ''not yet contemplated by the Legislature'' — das ist die Öffnung, die Text- und Data-Mining
    aufnehmen könnte; zweitens, dass die Entziehung unkörperlichen Eigentums einen geringeren Rechtfertigungsaufwand
    verlangt als die körperlichen. Zusammen ergibt das eine verfassungsrechtliche Grundhaltung, die Schranken
    zugunsten neuer Nutzungsformen begünstigt. Bemerkenswert ist auch, was scheiterte: die Bildungsschranke,
    also gerade die Regelung mit dem klarsten Gemeinwohlbezug. Der Grund ist die fehlende Vergütung, nicht
    die fehlende Rechtfertigung — was für eine künftige KI-Schranke bedeutet, dass sie eine Vergütungskomponente
    braucht, wenn sie ganze Werke erfasst. Rechtspolitisch entsteht damit ein Widerspruch zur Competition
    Commission, die im selben Jahr KI-Entwicklern Opt-out-Pflichten auferlegt hat: Eine gesetzliche Schranke
    würde diese Opt-outs entwerten. Niemand in Südafrika hat diese Kollision bisher benannt.

    '
  normen:
