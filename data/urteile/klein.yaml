  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die zweite lateinamerikanische Verfassungsgerichtsentscheidung zur Frage, ob ein
    KI-Straftatbestand ohne gesetzliche KI-Definition dem Bestimmtheitsgebot genügt — nach den mexikanischen
    acciones de inconstitucionalidad 66/2024, 80/2024 und 104/2024 aus 2025. Beide Gerichte kommen zum
    selben Ergebnis und mit derselben Begründungsfigur: Der KI-Begriff sei zwar unscharf, aber durch außerrechtliche
    Referenzwerke (in Kolumbien ausdrücklich die OECD) hinreichend bestimmbar. Für die europäische Diskussion
    ist das bemerkenswert, weil die KI-Verordnung dieselbe OECD-Definition übernommen hat: Die Verfassungsgerichte
    des globalen Südens behandeln den Begriff des Art. 3 Nr. 1 KI-VO faktisch als strafrechtlich verwertbaren
    Maßstab. Zugleich ist der geprüfte Tatbestand schmal: Ley 2502 de 2025 erhöht nur die GELDSTRAFE,
    nicht die Freiheitsstrafe. Wer die Entscheidung zitiert, sollte das mitzitieren. VORBEHALT: Der Volltext
    ist nicht geprüft; die PDFs der Corte Constitucional waren durch die Egress-Politik gesperrt und die
    Relatoría hatte C-212/26 am 06.09.2026 noch nicht unter /relatoria/2026/C-212-26.htm veröffentlicht.
    Expediente D-17.052, Datum, Berichterstatter und Tenor sind durch zwei voneinander unabhängige Sekundärquellen
    übereinstimmend belegt.

    '
