  anspruchsgrundlage: Art. 16 CPEUM (Begründungspflicht, motivación reforzada); Ley de Amparo (Kaution
    bei Eintragung der Amparo-Klage in das Grundbuch); Jurisprudencia P./J. 71/2014 (10a.) der SCJN zu
    den Parametern der Kautionsberechnung
  kernfrage: 'Darf ein Gericht ein KI-Werkzeug einsetzen, um die Höhe der im Amparo-Verfahren festzusetzenden
    Sicherheitsleistung zu berechnen?

    '
  ergebnis: 'Der Tribunal Colegiado bejaht dies. Tragend ist eine Trennung zwischen dem "núcleo decisorio
    jurisdiccional" und blossen Hilfstätigkeiten: Wertfortschreibung, Zinsanwendung und Gewichtung von
    Verfahrenszeiträumen seien zwar für die Begründung nötig, gehörten aber nicht zum Entscheidungskern
    und seien deshalb technischer Unterstützung zugänglich. Der KI-Einsatz sei gerechtfertigt, weil er
    (a) menschliche Rechenfehler verringere, (b) Transparenz und Nachvollziehbarkeit schaffe, indem der
    Rechenweg Schritt für Schritt offengelegt werde, (c) Konsistenz und Standardisierung der Kautionshöhen
    herstelle und (d) die Verfahrenseffizienz erhöhe. Die Nutzung ersetze die Richterinnen und Richter
    nicht, sondern erleichtere die Rechtspflege. Der Beschluss verweist auf Art. 16 CPEUM als Massstab
    der verstärkten Begründung.

    '
