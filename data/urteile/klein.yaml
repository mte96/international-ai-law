  quelle_art: amtlich
  sachverhalt: Das 智慧財產及商業法院 wies die Klage Stephen L. Thalers gegen die Nichtannahme der Anmeldung Nr.
    108140133 (「吸引增強注意力的裝置和方法」) am 19. August 2021 ab. Thaler legte Revision zum 最高行政法院 ein. Er hielt
    daran fest, dass das von ihm entwickelte KI-System DABUS in der Anmeldung als Erfinder zu führen sei,
    und wandte sich gegen die Auffassung, Erfinder könne nur eine natürliche Person sein. Über die Revision
    wurde am 21. Juli 2022 entschieden.
