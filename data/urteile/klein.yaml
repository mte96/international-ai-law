  ecli: ''
  datum: 2026-08-24
  parteien:
    klaeger: RAe 薛欽峰, 劉又禎 und 許渝澤 als Antragsteller (Prozessbevollmaechtigte im Verfahren 113年度訴字第825號,
      促進轉型正義條例)
