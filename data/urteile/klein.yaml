  dokumenttyp: Negativbefund mit Randbefunden
  verifiziert: false
  letzte_pruefung: 2026-09-06
  pruefvermerk:
  - 'Strukturelle Grenze der Recherche: Israelische Instanzgerichte veröffentlichen ausschliesslich über
    נט המשפט (Net HaMishpat), das keinen freien und keinen automatisierten Zugang gewährt. Ein Negativbefund
    kann deshalb nie den Rang haben, den er in Mexiko (SJF-Volltextsuche) oder Neuseeland (NZLII) hat.
    Er beruht auf der kuratierten Sammlung law.co.il, auf gov.il und auf Presserecherche.'
  - Die Datenbank von Damien Charlotin weist für Israel 57 Fälle mit KI-Halluzinationen aus (Stand 05.09.2026).
    Nur ein Bruchteil davon ist über law.co.il mit Aktenzeichen dokumentiert; die übrigen sind hier nicht
    erfasst. Für Israel besteht damit eine quantifizierte, aber nicht aufgelöste Lücke.
  eigene_bewertung: 'Der israelische Befund ist bemerkenswert asymmetrisch. Zur Frage der erfundenen Fundstellen
    gibt es eine dichte, bis zum Obersten Gerichtshof reichende Kasuistik; zu allen materiellen KI-Rechtsfragen
    — Training, Datenschutz, Diskriminierung, algorithmisches Management — gibt es nichts. Israel ist
    damit das Spiegelbild Mexikos: dort Strafnormen ohne Anwendung, hier Verfahrensrecht ohne materielles
    Recht.

    Der praktisch wichtigste Punkt ist die Warnung zur Sammelklage gegen OpenAI: In der hebräischsprachigen
    Fachpresse wird das amerikanische Authors-Guild-Verfahren so besprochen, dass es leicht für ein israelisches
    gehalten wird. Wer israelische Quellen zweiter Hand auswertet, sollte darauf achten.

    '
