  kernfrage: 'Parallelverfahren zur zweiten DABUS-Anmeldung: Muss der in der Anmeldung benannte Erfinder
    rechtsfaehig sein?

    '
  ergebnis: 'Klage abgewiesen. Gegenstand ist die Anmeldung Nr. 108137438 (''食物或飲料用容器'', urspruenglich
    ''食品用容器'' — Behaelter fuer Lebensmittel oder Getraenke, angemeldet am 17.10.2019), die das TIPO mit
    Bescheid vom 29.06.2020 ((109)智專一（二）15173字第10940948300號) nach § 17 Abs. 1 專利法 nicht angenommen hat,
    nachdem der Anmelder der Aufforderung vom 05.05.2020 zur Benennung einer natuerlichen Person als Erfinder
    nicht nachgekommen war (Widerspruchsbescheid des Wirtschaftsministeriums vom 03.12.2020, 經訴字第10906311370號;
    Nachbesserungsaufforderung des TIPO vom 05.05.2020, (109)智專一（二）15173字第10940656670號). Das Gericht ergaenzt
    die Begruendung des Parallelverfahrens um ein systematisches Argument: § 16 Abs. 1 Nr. 2 專利法施行細則 verlange
    zwar nur Name und Staatsangehoerigkeit des Erfinders, ohne ausdruecklich eine natuerliche Person zu
    fordern; aus § 5 Abs. 2, § 6 Abs. 1 und § 7 Abs. 4 專利法 folge aber, dass der Erfinder selbst Anmelder
    sein, das Anmelderecht rechtsgeschaeftlich uebertragen und es vererben koenne — saemtlich Vorgaenge,
    die Rechtsfaehigkeit voraussetzen. Steht das Anmelderecht dem Arbeitgeber oder Auftraggeber zu, verbleibe
    dem Erfinder das Namensnennungsrecht.

    '
  bedeutung: hoch
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=IPCA,110,%E8%A1%8C%E5%B0%88%E8%A8%B4,4,20211006,1
  zusammenfassung_url: ''
  bezug_regelwerke:
