  - Nicht am amtlichen Primärdokument geprüft. Entscheidungen des Zentralen Wahlausschusses werden auf
    bechirot.gov.il veröffentlicht; ein abrufbarer Volltext war in dieser Sitzung nicht auffindbar.
  - 'Datumsdifferenz: Übersichtsseite 27.07.2026, Fallseite 26.07.2026. Übernommen ist das Entscheidungsdatum
    26.07.2026.'
  - Die genaue Kennzeichnung der herangezogenen Vorschriften (§ 17b, § 13 Wahlgesetz Wahlwerbung) beruht
    auf der Sekundärquelle und ist am Volltext zu verifizieren; insbesondere ist offen, ob die 2026 eingefügte
    Offenlegungspflicht des § 2א2 tragend war oder nur mittelbar.
  eigene_bewertung: 'Die erste israelische Anwendungsentscheidung zum Deepfake im Wahlkampf — und damit
    der Praxistest der 2026 eingeführten Kennzeichnungspflicht. Der Ertrag liegt in der Behandlung des
    Hinweises: Ein Disclaimer heilt die Irreführung nicht, wenn er für den durchschnittlichen Betrachter
    nicht wahrnehmbar ist. Das ist die präziseste Aussage zur Wirksamkeit von KI-Kennzeichnungen, die
    derzeit aus einer Anwendungsentscheidung zu gewinnen ist, und sie ist unmittelbar auf Art. 50 Abs.
    4 KI-VO übertragbar, dessen Kennzeichnungspflicht dieselbe Schwachstelle hat.

    Wichtig ist die institutionelle Konstruktion: Entschieden hat nicht ein Gericht, sondern der Vorsitzende
    des Zentralen Wahlausschusses — ein amtierender Richter des Obersten Gerichtshofs in einer Sonderzuständigkeit.
    Israel erreicht damit eine Reaktionsgeschwindigkeit im Wahlkampf, die ein ordentliches Gerichtsverfahren
    nicht leisten kann.

    '
