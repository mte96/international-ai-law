  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Diese Entscheidung wird durchweg falsch zitiert. Die argentinische und internationale
    Presse meldete 2023, die Cámara habe "die Verfassungswidrigkeit bestätigt". Der Sache nach hat sie
    das Gegenteil getan: Sie hat den Weg zurück in den Betrieb geöffnet und ihn an Bedingungen geknüpft.
    Damit ist der argentinische Leitfall zur Gesichtserkennung im Ergebnis eine Auflagenentscheidung,
    keine Verbotsentscheidung — und in dieser Gestalt ein sehr genaues Vorbild für das, was Art. 5 Abs.
    2 bis 5 KI-VO als Genehmigungsverfahren organisiert.

    Bemerkenswert und für den europäischen Zugriff wichtig ist die zweite Bedingung: Ein Gesichtserkennungssystem
    darf erst wieder laufen, wenn technisch geprüft ist, ob es differenzielle Fehlerraten nach persönlichen
    Merkmalen aufweist. Das ist eine gerichtlich angeordnete Bias-Prüfung — vier Jahre bevor Art. 10 Abs.
    5 KI-VO und die harmonisierten Normen dasselbe verlangen.

    Offen ist der weitere Weg: Ob der Tribunal Superior de Justicia der Stadt in der Sache entschieden
    hat und ob das SRFP unter den Auflagen wieder in Betrieb genommen wurde, war nicht zu ermitteln. '
  dokumenttyp: Sentencia der Berufungsinstanz; amtliche Fundstelle in Juristeca (Poder Judicial de la
    CABA), Fallo-ID 51869
