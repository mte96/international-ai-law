  kernfrage: 'Haelt die Rechtsauffassung, dass ein KI-System nicht Erfinder sein kann, der revisionsrechtlichen
    Ueberpruefung stand?

    '
  ergebnis: 'Revision zurueckgewiesen. Damit ist die Nichtannahme der Anmeldung Nr. 108140133 rechtskraeftig.
    Das hoechste Verwaltungsgericht uebernimmt die Begruendung der Vorinstanz: Schoepfung sei der Sammelbegriff
    fuer Ergebnisse menschlicher Geistestaetigkeit; das Namensnennungsrecht des Erfinders sei ein Persoenlichkeitsrecht;
    Erfinder koenne daher nur sein, wer zu den technischen Merkmalen der Anspruechen einen wesentlichen
    geistigen Beitrag geleistet habe und zugleich natuerliche Person sei.

    '
  bedeutung: hoch
