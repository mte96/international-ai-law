    Sitzung nicht auffindbar.
  - 'Datumsdifferenz: Übersichtsseite 11.08.2026, Fallseite 06.08.2026. Übernommen ist das Entscheidungsdatum.'
  eigene_bewertung: 'Der dogmatisch originellste Fund der israelischen Recherche. Die Entscheidung löst
    das Deepfake-Problem nicht über Täuschung, Persönlichkeitsrecht oder Kennzeichnung, sondern über das
    VERMÖGENSRECHT des Staates: Die Uniform ist ein immaterieller Vermögensgegenstand der Streitkräfte,
    und ihre synthetische Nachbildung ist eine Nutzung dieses Gegenstandes. Damit wird die Frage, ob die
    Darstellung echt oder erzeugt ist, gerade unerheblich — ein Weg, der die notorische Beweisschwierigkeit
    bei Deepfakes umgeht.

    Für den europäischen Rechtsraum ist das anschlussfähig, wo staatliche Kennzeichen geschützt sind (in
    Deutschland § 132a StGB, § 124 OWiG, das Bundeswappengesetz). Bemerkenswert ist zudem, dass die Entscheidung
    KI-erzeugte und sonstige digitale Erzeugung gleich behandelt — die Vorschrift knüpft an das Ergebnis
    an, nicht an die Technik. Genau darin unterscheidet sie sich von der mexikanischen Landesgesetzgebung,
    die an den KI-Begriff anknüpft und deshalb an der Bestimmtheit scheitert.

    '
