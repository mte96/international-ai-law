  quelle_tracker: Amtliche Mitteilung der Suprema Corte de Justicia de la Provincia de Buenos Aires (scba.gov.ar,
    Meldung 57443) mit Causa-Nummer und Tenor; Rubrum, Datum und Besetzung über diariojudicial.com und
    Microjuris.
  verifiziert: false
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Prozessual die interessanteste Entscheidung der argentinischen Reihe, weil sie den
    Fall nicht über das Berufsrecht, sondern über das Rechtsmittelrecht löst: Eine Begründung, die nur
    aus erfundenen Nachweisen besteht, ist keine "crítica concreta y razonada" im Sinne des Art. 260 CPCC
    — die Berufung ist deshalb nicht unbegründet, sondern gar nicht wirksam eingelegt. Das ist die schärfere
    Sanktion als jede Ordnungsstrafe, weil sie die Instanz kostet, und sie kommt ohne Verschuldensprüfung
    aus.

    Für das deutsche Recht ist die Parallele § 520 Abs. 3 ZPO beziehungsweise § 344 StPO. Wer dort fragt,
    wie mit halluzinierten Fundstellen umzugehen ist, findet in Morón die erste ausformulierte Antwort:
    über die Zulässigkeit, nicht über die Begründetheit.

    Dass die Kammer ausdrücklich Mata v. Avianca zitiert, ist der bislang deutlichste Beleg für die Zirkulation
    der US-amerikanischen Halluzinationsrechtsprechung in Lateinamerika. '
  dokumenttyp: Interlocutoria der Berufungsinstanz; amtliche Mitteilung der SCBA
