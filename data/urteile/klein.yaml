  kernfrage: 'Ist der Einsatz eines biometrischen Gesichtserkennungssystems zur Fahndung nach Flüchtigen
    im öffentlichen Raum einer Grossstadt verfassungsgemäss, wenn die gesetzlich vorgesehenen Kontrollorgane
    nicht eingerichtet sind, keine Datenschutz-Folgenabschätzung durchgeführt wurde und das System tatsächlich
    weit über den Fahndungsbestand hinaus abgefragt wird?

    '
  ergebnis: 'Nein. Die Jueza Elena Liberatori erklärte das Sistema de Reconocimiento Facial de Prófugos
    (SRFP) der Stadt Buenos Aires für verfassungswidrig — nach den Feststellungen des Verfahrens Art.
    1 der Resolución N.º 398/MJYSGC/2019 sowie Vorschriften der Ley 5688 in der damaligen Fassung. Tragend
    war nicht die Technologie als solche, sondern die Art ihrer Einführung und ihres Betriebs: Das System
    wurde ohne Beteiligung der Legislatur und der Defensoría del Pueblo, ohne Datenschutz-Folgenabschätzung
    und ohne funktionierende gesetzliche Kontrollmechanismen in Betrieb genommen; die zugrunde liegenden
    Datenbestände waren fehlerhaft; und statt allein den Fahndungsbestand CONARC abzufragen, wurden Daten
    von mehr als 15.000 Personen ausserhalb dieses Bestandes verarbeitet. Vor einer Wiederinbetriebnahme
    verlangte das Urteil Bürgerbeteiligung, eine Datenschutz-Folgenabschätzung und die Behebung der von
    der Defensoría del Pueblo festgestellten Betriebsmängel.

    Vorgeschichte: Bereits am 12.04.2022 hatte der Juez Andrés Gallardo (Juzgado CAyT N.º 2) den Betrieb
    des SRFP vorläufig ausgesetzt, weil biometrische Daten aus dem RENAPER in einem Umfang abgerufen worden
    seien, der über gerichtlich angeordnete Fahndungen hinausgehe. Auf Betreiben des GCBA nahm der Tribunal
    Superior de Justicia der Stadt ihm im Juli 2022 die Sache ab.

    '
