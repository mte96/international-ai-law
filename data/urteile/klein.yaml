  kernfrage: 'Ist ein biometrisches Gesichtserkennungssystem als solches verfassungswidrig — oder nur
    seine Inbetriebnahme vor Einrichtung der gesetzlich vorgesehenen Kontrollmechanismen?

    '
  ergebnis: 'Die Sala I bestätigte die Aussetzung des SRFP nur teilweise und stellte den Tenor um: Statt
    das System selbst für verfassungswidrig zu erklären, machte sie seine WIEDERINBETRIEBNAHME ("rehabilitación
    del funcionamiento del SRFP") von drei Bedingungen abhängig — (1) die tatsächliche Funktionsfähigkeit
    der gesetzlich vorgesehenen Kontrollorgane, (2) technische Untersuchungen zu der Frage, ob die Software
    eine unterschiedliche Trefferwahrscheinlichkeit nach Geschlecht, Hautfarbe oder anderen persönlichen
    Merkmalen erzeugt, und (3) vorherige öffentliche Information und Bürgerbeteiligung über die Sicherheitsforen
    (FOSEP).

    Tragend sind drei Rechtssätze: Erstens reicht der Schutz der Privatsphäre über die Wohnung hinaus
    in den öffentlichen Raum hinein, den die Bürgerinnen und Bürger durchqueren. Zweitens war es die verfrühte
    Inbetriebnahme — vor Funktionsfähigkeit der Aufsicht —, die gegen das Legalitätsprinzip verstiess,
    nicht notwendig das Werkzeug als solches. Drittens ist die Prüfung, ob der Mechanismus "un impacto
    diferencial según características personales" erzeugt, Voraussetzung seiner Verfassungsmässigkeit.

    '
