  - ar-ley-25326
  - ar-aaip-res-161-2023
  instanzenzug: []
  quelle_tracker: Amtliche Mitteilungen der Provinzregierung von Buenos Aires (gba.gob.ar) und der argentinischen
    Bundesregierung (argentina.gob.ar). Der Bescheid selbst ist nicht veröffentlicht; Aktenzeichen nicht
    ermittelt.
  verifiziert: false
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der aufschlussreichste argentinische Befund zur biometrischen Datenverarbeitung —
    weil er zeigt, welcher Hebel in Argentinien tatsächlich greift. Nicht die Datenschutzbehörde des Bundes
    hat sanktioniert, sondern eine PROVINZIALE VERBRAUCHERSCHUTZBEHÖRDE, und nicht nach der Ley 25.326,
    sondern nach Art. 4 und 37 Ley 24.240. Die AAIP ermittelt seit Januar 2024 und hat bis September 2026
    nichts entschieden.

    Das ist der argentinische Strukturbefund in einem Satz: Wo das Datenschutzrecht von 2000 an seine
    Grenzen stösst — kein Verbot der Entgeltlichkeit, keine Regelung zur Einwilligung in biometrische
    Erfassung, keine wirksame Aufsichtspraxis —, tritt das Verbraucherschutzrecht an seine Stelle. Dieselbe
    Verschiebung ist bei den KI-Halluzinationsfällen zu beobachten, wo Standesrecht und Prozessrecht die
    fehlende KI-Norm ersetzen. Argentinien reguliert KI nicht, es subsumiert sie.

    Für den europäischen Vergleich: In Spanien und Portugal wurde derselbe Sachverhalt über die DSGVO
    gestoppt (AEPD-Untersagung, CNPD-Anordnung), in Kenia über die Datenschutzbehörde. Argentinien ist
    der einzige Fall, in dem der Zugriff über das Vertragsrecht erfolgte. '
