  eigene_bewertung: 'Neuseeland hat die dichteste KI-Kasuistik der drei untersuchten Rechtsordnungen —
    und sie besteht fast vollständig aus Verfahrensrecht. Zwölf Entscheidungen zu KI in Gerichtsverfahren,
    quer durch alle Instanzen und Spruchkörper vom Employment Relations Authority bis zum Supreme Court,
    und daneben eine einzige materielle Linie (DABUS) sowie eine einzige Aufsichtsentscheidung (Foodstuffs).

    Das ist kein Zufall, sondern die Folge der bewussten Entscheidung, kein KI-Gesetz zu erlassen. Wo
    materielle Anspruchsgrundlagen fehlen, entsteht keine materielle Rechtsprechung; die Gerichte begegnen
    KI nur dort, wo sie ihnen im eigenen Verfahren begegnet. Der neuseeländische Fall ist damit das beste
    verfügbare Anschauungsmaterial für das, was ein reiner Soft-Law-Ansatz produziert — und die Antwort
    lautet: viel Verfahrensdisziplin, keine Rechtsentwicklung.

    Die einzige Ausnahme ist bezeichnend: Die substantiellste neuseeländische Aussage zu KI (die Schwellenwert-Auflage
    von 92,5 Prozent im Foodstuffs-Bericht) stammt nicht von einem Gericht, sondern von einer Datenschutzaufsicht,
    und sie stützt sich auf ein Gesetz von 2020, das KI nicht erwähnt.

    '
