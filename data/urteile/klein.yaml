    (mx-2026-jurisprudencia-ki-justiz).. Beleg: Beide Tesis stammen aus derselben Queja 212/2025 und wurden
    am 22.08.2025 gemeinsam veroeffentlicht; die amtliche Nota weist die Integration in die Jurisprudencia
    II.2o.C. J/2 K (12a.) aus.'
