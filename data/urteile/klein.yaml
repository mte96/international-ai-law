  anspruchsgrundlage: Art. 128 Código Penal (Darstellungen sexueller Handlungen mit Minderjährigen); Art.
    213 Código Penal (apología del delito); Budapester Übereinkommen über Computerkriminalität (2001),
    von Argentinien durch Ley 27.411 ratifiziert; Fakultativprotokoll zum Kinderrechtsübereinkommen ("reales
    o simuladas")
  kernfrage: 'Erfasst der Tatbestand des Art. 128 Código Penal auch Darstellungen, die vollständig durch
    generative KI erzeugt wurden und denen kein reales Opfer zugrunde liegt?

    '
  ergebnis: 'Differenzierend. Die Kammer verwarf die Beschwerde und liess das Verfahren nach Art. 128
    Código Penal fortlaufen, unterschied dabei aber drei Konstellationen: (1) Bei ausschliesslich KI-generierten
    Darstellungen ohne reales Opfer sei eine Strafbarkeit nach Art. 128 zweifelhaft; in Betracht komme
    dann eher Art. 213 CP (apología del delito). (2) Werden Gesichter realer Minderjähriger mit synthetisch
    erzeugten Körpern kombiniert — der eigentliche Deepfake-Fall —, greift Art. 128, weil es reale Opfer
    gibt und deren sexuelle Integrität verletzt wird. (3) Prozessual folgt daraus eine Beweisanforderung:
    Vor der Hauptverhandlung ist forensisch zu klären, ob die Bilder echt, verändert oder vollständig
    synthetisch sind; die blosse Inaugenscheinnahme genügt nicht.

    Die Kammer stützte die weite Auslegung des Begriffs "representación" ergänzend auf das Fakultativprotokoll
    zum Kinderrechtsübereinkommen, das ausdrücklich Darstellungen "reales o simuladas" erfasst, und auf
    das Budapester Übereinkommen.

    '
  bedeutung: hoch
