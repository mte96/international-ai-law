  anspruchsgrundlage: '§§ 12, 22 Abs. 1, 27 Abs. 1, 48 Nr. 2 und Nr. 4, 52 Abs. 1 個人資料保護法; § 2 數位發展部組織法

    '
  kernfrage: 'Darf das Digitalministerium seine datenschutzrechtlichen Anordnungsbefugnisse nach §§ 27
    und 48 PDPA auf eine nachgeordnete Behoerde uebertragen?

    '
  ergebnis: 'Das Urteil der Vorinstanz (臺北高等行政法院 112年度訴字第889號 vom 09.01.2025) wird aufgehoben und die
    Rechtswidrigkeit der Ausgangsverfuegungen festgestellt; die Kosten beider Instanzen traegt die Behoerde.
    Sachverhalt: Nach Hinweisen der Polizei auf einen mutmasslichen Datenabfluss ueber die Handelsplattform
    der Klaegerin hatte die 數位產業署 im Januar und Februar 2023 zwei Verfuegungen erlassen, mit denen sie
    der Klaegerin binnen zwei Monaten die Nachholung der Benachrichtigung der Betroffenen (§ 12 PDPA)
    und die Einrichtung angemessener Sicherheitsmassnahmen (§ 27 Abs. 1 PDPA) aufgab. Das Gericht entscheidet:
    Die Aufsicht ueber nichtoeffentliche Stellen ist im PDPA DEZENTRAL organisiert (分散式管理) und liegt bei
    den jeweiligen zentralen Fachaufsichten; § 52 Abs. 1 erlaubt die Uebertragung nur fuer die Befugnisse
    aus §§ 22 bis 26, nicht fuer die aus §§ 27 und 48. Zustaendig war daher das Digitalministerium selbst,
    nicht seine nachgeordnete Behoerde. Das Gericht referiert zugleich den Stand der Novellierung: § 1-1
    PDPA (Zustaendigkeit der 個人資料保護委員會) wurde am 31.05.2023 eingefuegt, sein Absatz 2 am 11.11.2025 wieder
    gestrichen und durch §§ 51-1, 52 und 53-1 ersetzt, deren Inkrafttreten der Exekutiv-Yuan zu bestimmen
    hat.

    '
  bedeutung: hoch
