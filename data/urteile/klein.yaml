  kernfrage: 'Verstößt die verpflichtende Durchführung von Gerichtsverhandlungen mit technischen Mitteln
    nach Art. 7 Ley 2213 de 2022 gegen den Gleichheitssatz und gegen das Recht auf ein faires Verfahren?

    '
  ergebnis: 'Berichterstatter Antonio José Lizarazo Ocampo. Die Sala Plena erklärte sich für unzuständig
    zur Sachentscheidung: ''INHIBIRSE de emitir pronunciamiento de fondo respecto de la demanda de inconstitucionalidad
    formulada contra los artículos 1º y 7º (parciales) de la Ley 2213 de 2022, por ineptitud sustantiva
    de los cargos.'' Die Klage genügte den Anforderungen an Bestimmtheit, Sachbezug und Vollständigkeit
    der Rügen nicht; eine cosa juzgada wurde verneint. Sondervotum (aclaración de voto) der Magistrada
    Paola Andrea Meneses Mosquera.

    '
