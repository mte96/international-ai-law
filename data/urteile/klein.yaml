  quelle_art: amtlich
  sachverhalt: 'Neben der Anmeldung zur Aufmerksamkeitsvorrichtung hatte Stephen L. Thaler beim taiwanischen
    Patentamt am 17. Oktober 2019 eine zweite Erfindung angemeldet: 「食物或飲料用容器」 — Behälter für Lebensmittel
    oder Getränke, ursprünglich 「食品用容器」 — unter der Nummer 108137438. Auch hier benannte er als Erfinder
    das KI-System DABUS. Mit Schreiben vom 5. Mai 2020 ((109)智專一（二）15173字第10940656670號) forderte das TIPO
    ihn auf, eine natürliche Person als Erfinder zu benennen; weil er das nicht tat, erklärte es die Anmeldung
    mit Bescheid vom 29. Juni 2020 ((109)智專一（二）15173字第10940948300號) nach § 17 Abs. 1 專利法 für nicht angenommen.
    Das Wirtschaftsministerium wies den Widerspruch am 3. Dezember 2020 zurück (經訴字第10906311370號). Dagegen
    erhob Thaler Klage vor dem 智慧財產及商業法院.'
