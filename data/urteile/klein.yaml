  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Der Fall zeigt die untere Schwelle: Es geht nicht um ein KI-generiertes Video, sondern
    um eine einfache Bildmontage. Die taiwanischen Gerichte behandeln synthetische und montierte Bilder
    dogmatisch gleich — beides ist unbefugte Nutzung personenbezogener Daten, und beides ist Verbreiten
    unwahrer Tatsachen. Fuer die Frage, ob Deepfake-Sondertatbestaende ueberhaupt gebraucht werden, ist
    das ein starkes Gegenargument: Das allgemeine Recht traegt bereits. Ausserdem belegt der Fall die
    Haerte der Nebenfolge: Drei Monate Freiheitsstrafe auf Bewaehrung ziehen zwingend ein Jahr Verlust
    der buergerlichen Ehrenrechte nach sich.

    '
