  sachverhalt: Die Stadt Buenos Aires nahm auf der Grundlage der Ley 5688 in der Fassung der Ley 6339
    ein System zur biometrischen Gesichtserkennung gesuchter Personen (Sistema de Reconocimiento Facial
    de Prófugos, SRFP) in Betrieb, das die Kameras des öffentlichen Raums auswertet. Die im Gesetz vorgesehenen
    Kontrollorgane waren zu diesem Zeitpunkt noch nicht arbeitsfähig; ob die eingesetzte Software je nach
    Geschlecht, Hautfarbe oder anderen persönlichen Merkmalen unterschiedlich zuverlässig arbeitet, war
    nicht untersucht worden; über die Sicherheitsforen (FOSEP) war die Öffentlichkeit nicht beteiligt
    worden. Das Observatorio de Derecho Informático Argentino (O.D.I.A.), das Centro de Estudios Legales
    y Sociales und zwei Einzelkläger erhoben Amparo gegen die Stadtregierung. Die erste Instanz setzte
    den Betrieb des Systems aus; dagegen wurde Berufung zur Cámara de Apelaciones en lo Contencioso Administrativo,
    Tributario y de Relaciones de Consumo eingelegt.
