  anspruchsgrundlage: §§ 339 ff. 刑法 (Betrug); Beweiswuerdigung nach 刑事訴訟法
  kernfrage: 'Entwertet die Verbreitung generativer KI den Beweiswert von Screenshots aus Messenger-Diensten?

    '
  ergebnis: 'Berufung der Staatsanwaltschaft ohne Erfolg in diesem Punkt. Die Staatsanwaltschaft hatte
    geruegt, der Angeklagte habe nur Screenshots des LINE-Verlaufs vorgelegt und nicht den Originalinhalt;
    angesichts der Verbreitung generativer KI-Anwendungen koenne jedermann Screenshot-Inhalte ohne weiteres
    bearbeiten, weshalb deren Wahrheitsgehalt nicht feststellbar sei und die darauf gestuetzten Schluesse
    des Erstgerichts zweifelhaft seien. Das Gericht folgt dem nicht und stellt fest, die vorgelegten Inhalte
    stimmten mit den Angaben des Angeklagten ueberein.

