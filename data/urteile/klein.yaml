- id: nz-2026-a-v-r-namensunterdrueckung-ki
  jurisdiktion: nz
  gericht: High Court of New Zealand (Mount J)
  instanz: berufung
  aktenzeichen: '''A'' v R [2026] NZHC 1422; CRI-2025-404-000723'
  ecli: ''
  datum: 2026-05-25
  parteien:
    klaeger: '"A" (Angeklagter, Name gerichtlich unterdrückt), angeklagt wegen Sexualstraftaten 1989 bis
      2007'
    beklagter: The King; beteiligt NZME Publishing Ltd als Medienunternehmen
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - content
  - sektor-oeffentlich
  - gpai
  anspruchsgrundlage: s. 200 Abs. 2 lit. d Criminal Procedure Act 2011 (Namensunterdrückung bei realem
    Risiko der Beeinträchtigung eines fairen Verfahrens); ss. 199C und 199D Criminal Procedure Act 2011
    (take-down orders); s. 13 Contempt of Court Act 2019 (Verbot eigener Recherche durch Geschworene)
  kernfrage: 'Rechtfertigt es die Namensunterdrückung, dass generative KI-Dienste Inhalte weiter ausgeben,
    deren Entfernung ein Gericht bereits angeordnet hat?

    '
  ergebnis: 'Berufung erfolgreich (Ziff. 52). Ziff. 53: Anordnung, den Namen des Berufungsfuehrers im
    Zusammenhang mit den Vorwuerfen des Strafverfahrens nicht zu veroeffentlichen, bis die Jury ihr Verdikt
    gesprochen oder das Verfahren sich anderweitig erledigt hat.

    Ziff. 25: Der Sachverstaendige Dr Chen kam zu dem Schluss, KI-Systeme koennten Leitplanken und Filter
    enthalten, die es technisch moeglich machen, eine Loeschanordnung zu befolgen; die Unsicherheit liege
    nicht in der Technik, sondern in den Regeln, die die Entwickler setzen.

    Ziff. 26: Zur Zustaendigkeit aeusserte er Bedenken wegen notwendiger Extraterritorialitaet - eine
    Anordnung liesse sich den groessten Anbietern zustellen (OpenAI ChatGPT, Google Gemini, Anthropic
    Claude, xAI Grok, Perplexity), andere aber (Deepseek, Alibaba Qwen, Mistral AI) wuerden von einer
    Anordnung, die einzelne Unternehmen benennt, verfehlt oder wuerden nicht befolgen; hinzu kommen offene
    Gewichte ausserhalb der Kontrolle der urspruenglichen Entwickler.

    Ziff. 46: Die Krone raeumte teilweise ein, die Unterdrueckung bis zum Verdikt koenne den Umfang der
    ueber KI erzeugten Informationen begrenzen und das Risiko weiterer nachteiliger Informationen im Vorfeld
    der Hauptverhandlung theoretisch verringern. Das Gericht spricht von einem ''AI reinforcement cycle''.

    Ziff. 47: Zugleich Zurueckhaltung - ein allgemein weiterer Gebrauch der Namensunterdrueckung sei nicht
    schon deshalb gerechtfertigt, weil KI-Werkzeuge nachteilige Informationen offenbaren koennten.

    Ziff. 50: Wo ein erhebliches Risiko fuer das faire Verfahren besteht, bleibt fuer Ermessen wenig Raum;
    das Recht auf ein faires Verfahren ueberwiegt die Meinungsfreiheit.

    Ziff. 51 im Wortlaut: ''It is, to say the least, concerning that major artificial intelligence platforms
    appear to have had the practical effect of undermining court orders in a way that could potentially
    affect fair trial rights.'' Das rechtfertige es, dass das Tatgericht weitere Loeschanordnungen ernsthaft
    erwaegt und der Solicitor-General Optionen nach dem Contempt of Court Act prueft; Extraterritorialitaet,
    Zustellung und Vollstreckbarkeit stuenden Anordnungen nicht entgegen.'
