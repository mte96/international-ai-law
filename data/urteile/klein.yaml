  anspruchsgrundlage: '§ 104 Abs. 1 und Abs. 2, § 113 Abs. 3 公職人員選舉罷免法; § 28 刑法 (Mittaeterschaft); § 310
    Abs. 2 刑法 (Verleumdung, verneint)

    '
  kernfrage: 'Reicht die Deepfake-Qualifikation des § 104 Abs. 2 選罷法 ueber synthetische Medien hinaus,
    oder greift bei einer gezeichneten ''Stimmenkaufkarte'' nur der Grundtatbestand?

    '
  ergebnis: 'Verurteilung beider Angeklagter wegen mittaeterschaftlicher Verbreitung unwahrer Tatsachen
    in Wahlbeeinflussungsabsicht nach § 104 ABS. 1 選罷法 zu sechs bzw. fuenf Monaten Freiheitsstrafe, umwandelbar
    in Geldstrafe, jeweils mit zweijaehriger Aberkennung der buergerlichen Ehrenrechte. Sachverhalt: Vor
    der Wahl zum Legislativ-Yuan am 13.01.2024 hatte der Medienbeauftragte eines Kandidaten eine ''Stimmenkaufkarte''
    (買票地圖) angefertigt, die dem Gegenkandidaten Stimmenkauf in 29 Ortsteilen des Wahlkreises unterstellte;
    der amtierende Bezirksvorsitzende praesentierte sie auf einer Pressekonferenz. Das Gericht zitiert
    § 104 Abs. 2 im Wortlaut, wendet die Deepfake-Qualifikation aber NICHT an: Tatmittel waren eine Zeichnung
    und eine Rede, keine deepgefaelschte Stimme, kein Bild und keine elektromagnetische Aufzeichnung der
    Person selbst. Zur Nebenfolge stellt das Gericht ausdruecklich fest, dass § 113 Abs. 3 選罷法 als Spezialvorschrift
    zu § 37 Abs. 2 StGB die dortige Mindestschwelle von einem Jahr Freiheitsstrafe verdraengt.

    '
  bedeutung: mittel
  volltext_url: https://judgment.judicial.gov.tw/FJUD/data.aspx?ty=JD&id=NTDM,115,%E9%81%B8%E8%A8%B4,1,20260819,1
  zusammenfassung_url: ''
  bezug_regelwerke:
  - tw-wahlgesetz
  instanzenzug: []
  quelle_tracker: 司法院裁判書系統
  verifiziert: true
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Die Entscheidung ist gerade deshalb aufschlussreich, weil sie die Deepfake-Qualifikation
    NICHT anwendet. Sie markiert die Grenze: § 104 Abs. 2 選罷法 setzt voraus, dass Stimme, Bild oder elektromagnetische
    Aufzeichnung DER BETROFFENEN PERSON SELBST gefaelscht werden. Eine erfundene Grafik ueber sie faellt
    darunter nicht. Damit ist die taiwanische Deepfake-Vorschrift enger als die politische Debatte suggeriert
    — und die Frage, ob sie bisher ueberhaupt angewandt worden ist, bleibt offen.

    '
