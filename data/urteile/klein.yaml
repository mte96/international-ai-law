    06.09.2026 (Browser)
  dokumenttyp: Judgment des High Court über ein Rechtsmittel gegen die Ablehnung der Namensunterdrückung
  verifiziert: true
  letzte_pruefung: '2026-09-07'
  pruefvermerk:
  - Vollständiger Entscheidungstext am 06.09.2026 über NZLII gelesen und ausgewertet; Aktenzeichen, Spruchkörper,
    Daten, Sachverständige und Tenor sind dem Text entnommen. NZLII ist die massgebliche freie Volltextdatenbank
    Neuseelands, aber nicht die amtliche Seite des Gerichts; volltext_url bleibt deshalb leer.
  - Die Entscheidung ist stark anonymisiert (Name des Beschwerdeführers, Artikelüberschriften und URLs
    geschwärzt). Die zitierten Randnummern sind gleichwohl eindeutig.
  - '07.09.2026: NZLII-Fundstelle ueber den Browser des Bearbeiters beschafft. NZLII ist Rechtsdatenbank,
    nicht Urschrift - fuer die Zitierfaehigkeit ausreichend, fuer die Urschrift ist courtsofnz.govt.nz
    zu pruefen. Aufgerufen und am Rubrum abgeglichen.'
  eigene_bewertung: 'Der bedeutendste Fund der gesamten Recherche und, soweit ersichtlich, die weltweit
    erste Gerichtsentscheidung, die das Verhältnis von Löschungsanordnung und Modellgedächtnis zum tragenden
    Grund einer Verfahrensentscheidung macht. Die Frage ist neu und sie ist die richtige: Eine Take-down-Anordnung
    wirkt gegen URLs; ein Sprachmodell hat keine URLs, sondern Gewichte. Damit verliert das gesamte Instrumentarium
    des Persönlichkeits- und Verfahrensschutzes — Löschungsanspruch nach Art. 17 DSGVO, presserechtlicher
    Unterlassungsanspruch, § 169 GVG, Anordnungen nach § 174 Abs. 3 GVG — an einer Stelle seine Wirkung,
    an der man es bisher nicht erwartet hat.

    Drei Punkte sind für die deutsche und europäische Diskussion unmittelbar verwertbar. Erstens der Verstärkungskreislauf:
    Das Gericht erkennt, dass ein Berichterstattungsverbot nicht nur den aktuellen Zugriff, sondern auch
    die künftige Anreicherung der Modelle verhindert; Namensunterdrückung wird damit zu einem Instrument
    der Trainingsdatenhygiene. Zweitens der Befund der Sachverständigen, dass Filterung technisch möglich,
    aber von den Entwicklerregeln abhängig ist — genau die Konstellation, für die Art. 50 KI-VO und die
    Verhaltenskodizes des GPAI-Regimes gedacht sind, ohne dass sie einen Vollstreckungsweg für gerichtliche
    Einzelanordnungen eröffnen. Drittens der Nebeneffekt: Die Entfernung seriöser Medienberichte hat unmoderiertes
    Reddit-Material nach oben gespült, das seinerseits Trainingsdaten liefert. Take-down-Anordnungen können
    die Informationslage also verschlechtern. Das ist ein empirisches Argument gegen die Löschung als
    Standardlösung, und es steht in keinem europäischen Urteil.

    Zurückhaltung des Gerichts ist mitzunehmen: Randnummer 47 verweigert ausdrücklich die Verallgemeinerung.
    Wer die Entscheidung als Beleg für ein Mehr an Anonymisierung zitiert, zitiert sie falsch.

    '
  quelle_art: datenbank
  leitsatz: Dass grosse KI-Plattformen Informationen weiter ausgeben, die bereits Gegenstand von Loeschanordnungen
    waren, begruendet ein Risiko fuer das faire Verfahren und rechtfertigt eine Namensunterdrueckung bis
    zum Urteilsspruch der Jury. Loeschanordnungen gegen KI-Systeme sind im Grundsatz moeglich; Extraterritorialitaet,
    Zustellung und Vollstreckbarkeit stehen ihnen nicht von vornherein entgegen.
  bedeutung_begruendung: 'Die erste Entscheidung, die das Verhaeltnis von gerichtlich angeordneter Anonymitaet
    und dem Gedaechtnis generativer Modelle durchdekliniert - mit Sachverstaendigenbeweis, mit namentlich
    benannten Anbietern und mit einer Aussage zur Vollstreckbarkeit. Sie beantwortet die Frage, die hinter
    dem europaeischen Loeschungsanspruch steht, aus der Prozessrechtsperspektive: Nicht ob ein Betroffener
    Loeschung verlangen kann, sondern ob ein Gericht sie anordnen kann und gegen wen. Dass das Gericht
    offene Gewichte als Grenze der Vollstreckbarkeit benennt, ist der praezise Punkt, an dem der europaeische
    Regelungsansatz ueber Anbieterpflichten leerlaeuft. Fuer den Streitstand zum Personenbezug von Modellparametern
    ist das die bislang beste gerichtliche Tatsachenfeststellung.'
  offene_punkte:
  - Ob das Tatgericht die angeregten weiteren Loeschanordnungen erlassen hat, ist offen.
  - Ob der Solicitor-General nach dem Contempt of Court Act taetig geworden ist, ist offen.
  - Das Gutachten Dr Chen ist nicht veroeffentlicht.
