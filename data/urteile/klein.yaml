  datum: 2024-07-24
  parteien:
    klaeger: Provincia de Buenos Aires (Verbraucherschutzbehörde, Verfahren von Amts wegen)
    beklagter: Worldcoin Foundation / Tools for Humanity
  status: erledigt
  themenachsen:
  - datenschutz
  - grundrechte
  - vertrag
  anspruchsgrundlage: Art. 4 und 37 Ley 24.240 (Defensa del Consumidor); Resolución 53/2003 der ehemaligen
    Secretaría de la Competencia; Resolución 994/2021 der ehemaligen SCI; Código Civil y Comercial de
    la Nación
  kernfrage: 'Mit welchen Mitteln greift die argentinische Rechtsordnung gegen die entgeltliche Erhebung
    biometrischer Daten (Iris- und Gesichtsscan) durch — wenn die Datenschutzaufsicht des Bundes nicht
    entscheidet?

    '
  ergebnis: 'Die Verbraucherschutzbehörde der Provinz Buenos Aires verhängte gegen die Worldcoin Foundation
    eine Geldbusse von 194 Millionen Pesos. Beanstandet wurden die Erhebung von Iris- und Gesichtsdaten
    über das Gerät "Orb" ohne Altersprüfung und ohne sichtbaren Hinweis auf die Mindestaltersgrenze von
    achtzehn Jahren sowie ein Bündel missbräuchlicher Vertragsklauseln. Das Unternehmen wurde verpflichtet,
    mehrere Klauseln zu streichen — darunter die Möglichkeit, den Dienst entschädigungslos einzustellen,
    den Verzicht auf Sammelklagen und die Vereinbarung eines Gerichtsstands auf den Kaimaninseln mit Schiedsverfahren
    in Kalifornien für argentinische Nutzerinnen und Nutzer.

    Parallel dazu prüft die Agencia de Acceso a la Información Pública (AAIP) seit Januar 2024 die Verarbeitung
    personenbezogener Daten durch Worldcoin am Massstab der Ley 25.326 und koordiniert sich darüber in
    der Red Iberoamericana de Protección de Datos mit fünf weiteren Aufsichtsbehörden. Eine abschliessende
    Entscheidung der AAIP war am 06.09.2026 nicht auffindbar.

    '
  bedeutung: mittel
  volltext_url: https://www.argentina.gob.ar/noticias/avanza-la-investigacion-de-la-aaip-sobre-worldcoin-y-el-uso-de-datos-personales
  zusammenfassung_url: https://www.gba.gob.ar/produccion/noticias/la_provincia_sancion%C3%B3_worldcoin_con_una_multa_de_194_millones
  bezug_regelwerke:
