  anspruchsgrundlage: '§§ 2 Abs. 1 Nr. 3, 36 兒童及少年性剝削防制條例; §§ 2 Nr. 1, 3 und 4, 6 Abs. 1, 41 個人資料保護法;
    § 10 Abs. 8 中華民國刑法

    '
  kernfrage: 'Erfasst der Begriff der sexuellen Darstellung im Jugendschutzstrafrecht auch generativ erzeugte
    Bilder, und unterscheidet sich seine Struktur von der des Kapitels 28-1 StGB?

    '
  ergebnis: 'Verurteilung wegen sexueller Ausbeutung von Kindern und Jugendlichen und unbefugter Erhebung
    und Verarbeitung besonderer personenbezogener Daten; gegen den Hauptangeklagten Gesamtstrafe von neun
    Jahren. In der Begruendung setzt sich das Gericht ausdruecklich mit generativer KI auseinander: Der
    Begriff der ''mit Sexualitaet in Zusammenhang stehenden und objektiv sexuell erregenden oder schamverletzenden
    Darstellung'' in § 2 Abs. 1 Nr. 3 des Jugendschutzgesetzes sei — unter Verweis auf das japanische
    Kinderschutzgesetz — auf Darstellungen beschraenkt, die mit generativer kuenstlicher Intelligenz hergestellt,
    realistisch gezeichnet oder mit real existierenden Kindern oder Jugendlichen als Vorlage geschaffen
    wurden. Daraus folgert das Gericht eine Strukturverschiedenheit gegenueber dem Kapitel 28-1 StGB (妨害性隱私及不實性影像罪).
    Ausserdem stellt es fest, dass Aufnahmen mit deutlichen Gesichtsmerkmalen oder intimen Koerperpartien
    besondere personenbezogene Daten im Sinne des § 6 Abs. 1 PDPA sind, deren Erhebung, Verarbeitung und
    Nutzung verboten ist; wer sie herstellt oder weitergibt, verwirklicht § 41 PDPA.

    '
  bedeutung: mittel
