  kernfrage: 'Welche Folgen hat es, wenn eine Anwältin oder ein Anwalt gutgläubig Rechtsprechung zitiert,
    die ein KI-Chatbot erfunden hat?

    '
  ergebnis: 'Die Kammer wies die Rechtsmittel zurück und rügte den Prozessbevollmächtigten. Nach erfolgloser
    eigener Recherche stellte sie fest, dass die zitierten Entscheidungen nicht existieren; der Anwalt
    räumte ein, ein KI-System ohne Quellenprüfung benutzt zu haben. Guter Glaube entlaste nicht von der
    Pflicht, die Fundstellen abzugleichen. Chatbots erzeugten "alucinaciones" — erfundene Nachweise —,
    um die anfragende Person zufriedenzustellen; es sei "sumamente riesgoso y hasta temerario", die Recherche
    ohne Überprüfung an ein experimentelles Werkzeug zu delegieren. Die Kammer unterrichtete den Colegio
    de Abogados de Rosario zur Warnung der Mitglieder.

    '
