  eigene_bewertung: 'Der Befund ist aussagekräftiger als er wirkt. Mexiko hat seit 2024 eine dichte Landesgesetzgebung
    zu KI-Deepfakes (Sinaloa, Zacatecas, Quintana Roo, Jalisco, Ciudad de México) und seit 2026 mit der
    Artistenreform ein KI-Stimmklonverbot im Urheberrecht — aber keine einzige veröffentlichte Anwendungsentscheidung.
    Die einzigen Berührungen mit dem KI-Begriff auf Bundesebene sind Normenkontrollen, in denen die SCJN
    dem Landesgesetzgeber Bestimmtheitsmängel vorhält, ohne selbst eine Definition zu liefern. Das ist
    die Umkehrung des europäischen Bildes: dort ein Regelwerk und wachsende Aufsichtspraxis, hier Strafnormen
    ohne Kasuistik.

    Für die Bewertung mexikanischer Rechtsquellen folgt daraus eine Warnung: Wer die mexikanische Deepfake-Gesetzgebung
    zitiert, zitiert totes Recht, solange keine Verurteilung veröffentlicht ist. Umgekehrt ist die einzige
    lebendige Linie — KI in der Justiz — vollständig von einem einzigen Spruchkörper in Toluca getragen.

    '
