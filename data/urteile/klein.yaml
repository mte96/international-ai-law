  anspruchsgrundlage: Art. 14, 16 und 17 der Verfassung Mexikos; Ley de Amparo
  kernfrage: 'Welche Mindestanforderungen gelten fuer den ethischen und verantwortlichen Einsatz kuenstlicher
    Intelligenz durch Gerichte?

    '
  ergebnis: 'Tesis aislada, Undécima Época, veroeffentlicht im August 2025 — die unmittelbare Vorstufe
    der bindenden Jurisprudencia II.2o.C. J/2 K (12a.) vom 09.01.2026 (Registro 2031640). Sachverhalt:
    Im Rahmen einer Queja gegen eine Entscheidung eines Juzgado de Distrito in einem indirekten Amparo-Verfahren
    setzte das Kollegialgericht KI-Werkzeuge ein, ''para calcular el monto de una garantía vinculada con
    la inscripción de la demanda en los folios reales de los inmuebles reclamados''. Weil es sich um eine
    ''práctica innovadora en procesos jurisdiccionales'' handelte, hielt das Gericht es ''bajo un ejercicio
    de autocontención'' fuer geboten, die Parameter des ethischen und verantwortlichen KI-Einsatzes selbst
    zu bestimmen. Criterio jurídico: Der Einsatz von KI-Werkzeugen in gerichtlichen Verfahren mit menschenrechtlicher,
    ethischer und verantwortlicher Ausrichtung verlangt von den Richterinnen und Richtern die Beachtung
    von vier Mindestelementen: a) proporcionalidad e inocuidad; b) protección de datos personales; c)
    transparencia y explicabilidad; d) supervisión y decisión humanas. Begruendung: Angesichts des Fehlens
    einer besonderen Regelung fuer den Einsatz von KI-Werkzeugen muessen die Richterinnen und Richter
    sich selbst binden.

    '
  bedeutung: hoch
  volltext_url: https://sjf2.scjn.gob.mx/detalle/tesis/2031010
  zusammenfassung_url: ''
