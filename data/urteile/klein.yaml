  verifiziert: false
  letzte_pruefung: 2026-09-06
  eigene_bewertung: 'Streng genommen kein KI-Fall — der Gerichtshof entscheidet über die Arbeitnehmereigenschaft,
    nicht über ein KI-System. Aufgenommen ist er, weil er die einzige argentinische Höchstgerichtsrechtsprechung
    zur algorithmischen Steuerung von Arbeit ist und weil die argentinische Literatur ihn genau so liest
    ("subordinación en tiempos del algoritmo"). Der dogmatische Kunstgriff ist bemerkenswert konservativ:
    Die SCBA löst den Fall über die Beweislastvermutung des Art. 23 LCT und die Nichtanfechtung der Kontrollprotokolle
    — sie musste über algorithmische Weisungsbindung gar nicht entscheiden. Das ist der Unterschied zur
    spanischen Ley Rider und zur EU-Plattformarbeitsrichtlinie, die genau dort ansetzen.

    Für das Projekt ist der Fall vor allem als Negativbefund wichtig: Argentinien hat kein einziges Urteil,
    das algorithmisches Management als solches am Massstab von Transparenz- oder Erklärungspflichten prüft.
    Art. 20 Ley 25.326 wäre die Norm dafür — er ist in diesem Zusammenhang noch nie angewendet worden. '
  dokumenttyp: Sentencia der Suprema Corte; nur Sekundärquellen
  pruefvermerk:
  - 'WIDERSPRUCH in den Quellen zur Unternehmenszuordnung: diariojudicial.com ordnet "Repartos Ya S.A."
    Rappi Argentina zu, InfoGremiales berichtet über dieselbe Entscheidung als Fall gegen PedidosYa. Die
    Fachliteratur (Microjuris, 08.05.2026) spricht von ZWEI Entscheidungen der SCBA, "Rappi" und "Repartos
    Ya". Ohne amtlichen Volltext ist nicht aufzulösen, ob eine oder zwei Entscheidungen vorliegen und
    welchem Konzern Repartos Ya S.A. zuzuordnen ist.'
