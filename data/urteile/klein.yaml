- id: nz-2024-wikeley-kea
  jurisdiktion: nz
  gericht: Court of Appeal of New Zealand / Te Kōti Pīra o Aotearoa (Courtney, Muir und Cull JJ)
  instanz: berufung
  aktenzeichen: Wikeley v Kea Investments Limited [2024] NZCA 609; CA757/2023
  ecli: ''
  datum: 2024-11-21
  parteien:
    klaeger: Kenneth David Wikeley (Rechtsmittelführer, in eigener Sache mit McKenzie friend)
    beklagter: Kea Investments Limited, Wikeley Family Trustee Limited (in interim liquidation), Eric
      John Watson und weitere
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - governance
  anspruchsgrundlage: Inhärente Verfahrensregelungsbefugnis des Gerichts; Courts of New Zealand, Guidelines
    for use of generative artificial intelligence in Courts and Tribunals — Non-lawyers (Artificial Intelligence
    Advisory Group, 07.12.2023)
  kernfrage: 'Wie ist damit umzugehen, wenn eine nicht vertretene Partei einen Schriftsatz zurücknimmt,
    nachdem der Gegenseite aufgefallen ist, dass er mit generativer KI erstellte, nicht existierende Fundstellen
    enthält?

    '
  ergebnis: 'Die KI-Frage entschied das Gericht nicht; sie wird in Fussnote 187 des Urteils festgehalten.
    Danach hatte Herr Wikeley seine ursprüngliche Stellungnahme vom 10.09.2024 zurückgenommen, nachdem
    die Prozessbevollmächtigten der Gegenseite das Gericht auf den erkennbaren Einsatz generativer künstlicher
    Intelligenz bei ihrer Abfassung aufmerksam gemacht hatten. Das Gericht hielt fest, der KI-Einsatz
    sei von Herrn Wikeley zunächst NICHT offengelegt worden, sei aber an den Verweisen auf offensichtlich
    nicht existierende Entscheidungen erkennbar gewesen; weitere Bemerkungen seien nicht veranlasst ausser
    dem Hinweis auf die kürzlich von der Justiz herausgegebenen Leitlinien. In der Sache selbst wies das
    Gericht die Anträge auf Änderung der Rechtsmittelschrift und auf Zulassung weiteren Beweises zurück,
    gab dem Rechtsmittel teilweise statt und hob bestimmte Verfügungen auf.

    '
  bedeutung: mittel
  volltext_url: https://www.nzlii.org/nz/cases/NZCA/2024/609.html
  zusammenfassung_url: ''
  sekundaerquelle_url: https://www.nzlii.org/nz/cases/NZCA/2024/609.html
  bezug_regelwerke:
  - nz-courts-genai-guidelines-2023
  instanzenzug: []
  normen: []
  quelle_tracker: NZLII, Datenbank New Zealand Cases; Hinweis aus Kanzleiveröffentlichungen (Wilson Harle)
  dokumenttyp: Judgment des Court of Appeal; die KI-Passage steht in Fussnote 187
  verifiziert: true
  letzte_pruefung: '2026-09-07'
  pruefvermerk:
  - Am Entscheidungstext auf NZLII geprüft (06.09.2026); die Passage steht in Fussnote 187 und wurde im
    Wortlaut gelesen.
  - 'WARNUNG zu Sekundärquellen: Die von der New Zealand Law Society als Case Note verbreitete PDF-Fassung
    des Urteils enthält die KI-Passage nach eigener Prüfung nicht auffindbar; wer nur diese Fassung auswertet,
    übersieht den Befund. Massgeblich ist die vollständige Fassung mit Fussnotenapparat.'
  - '07.09.2026: NZLII-Fundstelle ueber den Browser des Bearbeiters beschafft. NZLII ist Rechtsdatenbank,
    nicht Urschrift - fuer die Zitierfaehigkeit ausreichend, fuer die Urschrift ist courtsofnz.govt.nz
    zu pruefen. Adresse aus dem Zitat abgeleitet, Muster an A v R bestaetigt; der Einzelabruf steht aus.'
  eigene_bewertung: 'Die früheste neuseeländische Rechtsmittelentscheidung, die einen KI-Fall benennt
    — elf Monate vor LMN v STC und mehr als ein Jahr vor Jones. Sie ist zugleich der beste Beleg für die
    Entdeckungsmechanik: Nicht das Gericht, sondern die GEGENSEITE bemerkte den KI-Einsatz, und die Partei
    zog daraufhin den Schriftsatz zurück, bevor das Gericht entscheiden musste. Die Dunkelziffer der Fälle,
    die so enden, dürfte die Zahl der veröffentlichten Entscheidungen deutlich übersteigen — ein methodischer
    Vorbehalt gegen jede Statistik zu KI-Halluzinationen vor Gericht, einschliesslich der Zählungen der
    Charlotin-Datenbank.

    Zweiter Ertrag: Das Gericht macht die unterbliebene Offenlegung eigens zum Thema. Damit ist in Neuseeland
    bereits 2024 der Gedanke angelegt, den die Leitlinien nur empfehlen und den der Supreme Court 2026
    in Jones zur Sanktionsandrohung verdichtet.

    '
  quelle_art: datenbank
