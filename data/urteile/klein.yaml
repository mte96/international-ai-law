  - 'Verwandter Fall nicht ausgewertet: LI (China) v A Refugee and Protection Officer [2025] NZIPT 802758
    vom 15.10.2025 erscheint ebenfalls in der NZLII-Trefferliste zu "generative artificial intelligence";
    der Text wurde in dieser Sitzung nicht geprüft.'
  - '07.09.2026: NZLII-Fundstelle ueber den Browser des Bearbeiters beschafft. NZLII ist Rechtsdatenbank,
    nicht Urschrift - fuer die Zitierfaehigkeit ausreichend, fuer die Urschrift ist courtsofnz.govt.nz
    zu pruefen. Adresse aus dem Zitat abgeleitet, Muster an A v R bestaetigt; der Einzelabruf steht aus.'
  eigene_bewertung: 'Der zweitwichtigste Fund der Recherche und ein neuer Fragentyp. Die gesamte bisherige
    Kasuistik betrifft KI-erzeugte RECHTSAUSFÜHRUNGEN — erfundene Fundstellen im Schriftsatz. Hier geht
    es um KI-erzeugten TATSACHENVORTRAG: die eigene Lebensgeschichte einer Partei, in einem Verfahren,
    in dem die Glaubhaftigkeit der Erzählung der einzige Beweis ist.

    Die Entscheidung zieht zwei Schlüsse, die getrennt zu bewerten sind. Der erste ist tragfähig: Ein
    Modell, das aus Stichpunkten eine Erzählung formt, "schmückt aus" — es füllt Lücken mit Plausiblem.
    Wo die Erzählung selbst das Beweismittel ist, verfälscht das den Beweis, und zwar unabhängig von der
    Redlichkeit der Partei. Der zweite Schluss ist heikel: Das Tribunal wertet die UNBEABSICHTIGTE Offenlegung
    zusätzlich gegen die Glaubwürdigkeit. Damit wird der Umstand, dass die Modellanweisung stehengeblieben
    ist, also gerade die Ungeschicklichkeit, zum Belastungsindiz. Wer sorgfältiger kopiert, steht besser
    da. Das ist ein perverser Anreiz, und er trifft strukturell die sprachlich und rechtlich schwächsten
    Beteiligten — Asylsuchende, die ihre Aussage nicht in ihrer eigenen Sprache abgeben können und für
    die ein Sprachmodell die einzige verfügbare Übersetzungs- und Formulierungshilfe ist.

    Für Deutschland ist das der derzeit relevanteste ausländische Vergleichsfall zu § 25 AsylG und zur
    Glaubhaftigkeitsprüfung im Asylverfahren. Die Frage, ob und wie Antragstellende den Einsatz von Sprachmodellen
    bei der Abfassung ihrer Anhörungsvorbereitung offenlegen müssen, ist in Europa noch nicht gestellt
    worden. Sie wird kommen.

    '
