  eigene_bewertung: 'Der eigentliche Beginn der weltweiten Halluzinationsrechtsprechung ausserhalb der
    Vereinigten Staaten: Parker v Forsyth erging am 29.06.2023, fünf Tage nach der Sanktionsentscheidung
    in Mata v Avianca (22.06.2023), aber unabhängig davon und in einer Rechtsordnung ohne Rule 11. Das
    ist bemerkenswert, weil Südafrika damit zeigt, dass die Sanktionierung erfundener Fundstellen keiner
    Spezialnorm bedarf — die allgemeinen Sorgfalts- und Wahrheitspflichten des Prozessrechts genügen.
    Der Fall fehlte vollständig, obwohl er die Grundlage der Linie ist, in der Mavundla steht.

    '
