  anspruchsgrundlage: Art. 29 der Verfassung Kolumbiens (Bestimmtheitsgebot im Strafrecht); Art. 241 Nr.
    4 CP; Art. 296 Ley 599 de 2000 i.d.F. der Ley 2502 de 2025
  kernfrage: 'Verletzt ein strafrechtlicher Erschwerungsgrund, der an die ''utilización de Inteligencia
    Artificial'' anknüpft, das Bestimmtheitsgebot, wenn der Gesetzgeber den Begriff der künstlichen Intelligenz
    nicht definiert hat?

    '
  ergebnis: 'Berichterstatter Jorge Enrique Ibáñez Najar. Die Corte Constitucional erklärte den durch
    Art. 3 Ley 2502 de 2025 in Art. 296 des Código Penal eingefügten Absatz für exequible. Nach den vorliegenden
    Berichten stützte sie sich darauf, dass objektive und überprüfbare Bezugspunkte für die Feststellung
    eines KI-Einsatzes vorhanden seien — Dokumente der OECD, nationale Dekrete und internationale Regelwerke
    —, sodass eine förmliche Legaldefinition durch den Kongress nicht erforderlich sei. Damit ist der
    erste KI-spezifische Straftatbestand Kolumbiens verfassungsrechtlich bestätigt. Er trat dreizehn Tage
    später, am 28.07.2026, in Kraft.

    '
