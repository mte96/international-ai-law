  quelle_tracker: Kentucky AG; Hunton; Troutman Pepper; Kilpatrick
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Das Muster, das sich 2026 durchsetzt: Die neuen einzelstaatlichen Datenschutzgesetze
    — inzwischen rund zwanzig — werden nicht gegen Datenhändler, sondern gegen KI-Anbieter zuerst scharf
    gestellt, weil dort die politische Aufmerksamkeit liegt. Für Anbieter heißt das: Der Compliance-Aufwand
    ergibt sich nicht aus einem KI-Gesetz, sondern aus zwanzig Datenschutzgesetzen mit unterschiedlichen
    Einwilligungs- und Altersprüfungsanforderungen. Genau dieser Flickenteppich ist das Argument, mit
    dem die Bundesregierung ihre Preemption-Strategie begründet — und genau er ist der Grund, warum sie
    scheitern dürfte, denn Datenschutz ist traditionell einzelstaatliche Polizeigewalt.

    '
