  anspruchsgrundlage: 'Investment Advisers Act of 1940, § 206(4) und Rule 206(4)-1 (Marketing Rule); §
    207.

    '
  kernfrage: 'Sind unzutreffende Angaben zum Einsatz künstlicher Intelligenz in der Anlageberatung eine
    wesentliche Falschangabe im Sinne des Aufsichtsrechts?

    '
  ergebnis: 'Beide Gesellschaften akzeptierten Rügen und Unterlassungsanordnungen ohne Anerkennung der
    Vorwürfe. Delphia habe behauptet, mit KI und maschinellem Lernen unter Verwendung von Kundendaten
    Marktentwicklungen vorherzusagen — die entsprechenden Systeme existierten so nicht; Zahlung 225.000
    US-Dollar. Global Predictions habe sich als "first regulated AI financial advisor" bezeichnet und
    seine Prognosedienste sowie Angaben zur Steueroptimierung irreführend dargestellt und unzulässige
    Haftungsklauseln verwendet; Zahlung 175.000 US-Dollar. Es sind die ersten "AI washing"-Verfahren der
    SEC.

    '
  bedeutung: mittel
  volltext_url: https://www.sec.gov/newsroom/press-releases/2024-36
  zusammenfassung_url: https://corpgov.law.harvard.edu/2024/04/09/sec-fines-two-investment-advisers-for-ai-washing/
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: sec.gov; Harvard Law School Forum on Corporate Governance
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Aufsichtsrechtlich unspektakulär, methodisch aufschlussreich: Die SEC braucht kein
    KI-Recht, sondern wendet die Marketing Rule an. Genau das ist das Muster der gesamten US-Durchsetzung
    — jede Behörde subsumiert KI unter ihr eigenes Sektorrecht. Für die Praxis heißt das, dass die Beschreibung
    des eigenen Systems in Prospekten, Datenblättern und technischer Dokumentation das größte einzelne
    Rechtsrisiko darstellt, und zwar unabhängig davon, ob das System funktioniert. Die Fortsetzungen (Presto
    Automation, Jan. 2025, ohne Geldbusse wegen Kooperation; SEC v. Rimar Capital, Okt. 2024, 310.000
    US-Dollar; SEC v. Kubient, Endurteil gegen Weiß vom 08.07.2026) bestätigen die Linie ohne sie fortzüntwickeln.

    '
  quelle_art: amtlich
