  eigene_bewertung: 'Wird regelmäßig als "erster KI-Diskriminierungsfall der EEOC" zitiert und ist genau
    das nicht. Der Schwellenwert war fest einprogrammiert; es ging um eine if-Abfrage, nicht um ein Modell.
    Der Fall taugt deshalb nicht als Präzedenz für die schwierigen Fragen — Proxy-Variablen, Intransparenz,
    Beweislast —, sondern nur für die banale Aussage, dass Automatisierung nicht entlastet. Aufgenommen,
    weil er in der Literatur durchgehend falsch eingeordnet wird und weil er die einzige abgeschlossene
    EEOC-Maßnahme in diesem Feld ist: Seit dem Regierungswechsel 2025 hat die EEOC ihre KI-Leitlinien
    von der Website entfernt und keine weiteren Verfahren eingeleitet. Die Durchsetzung liegt seither
    bei Privatklägern und einzelstaatlichen Behörden.

