  eigene_bewertung: 'Die Entscheidung, die den BIPA-Weg gegen Trainingsdaten versperrt hat. Sie beantwortet
    die Frage, wo eine Datenverarbeitung "stattfindet", technisch-territorial statt betroffenenbezogen
    — genau umgekehrt zu Art. 3 Abs. 2 DSGVO, der auf den Aufenthalt der betroffenen Person abstellt.
    Das ist der eigentliche rechtsvergleichende Ertrag: Dasselbe Sachverhaltsmuster (Gesichtsbilder aus
    dem Netz, Datensatz zu Forschungszwecken, Weitergabe an Konzerne) führt in der EU zu Zuständigkeit
    und Anwendbarkeit, in Illinois nicht. Wer die USA für den strengeren Standort bei Biometrie hält,
    weil dort die Schadenssätze höher sind, übersieht, dass die Reichweite dramatisch enger ist.

    '
