  kernfrage: 'Muss ein Bundesgericht ein Chatbot-Haftungsverfahren zugunsten des parallel geführten einzelstaatlichen
    Koordinationsverfahrens aussetzen?

    '
  ergebnis: 'Chief Judge Richard Seeborg wies am 14.04.2026 den Antrag von OpenAI zurück, das Bundesverfahren
    auszusetzen oder von der Gerichtsbarkeit abzusehen. Es bestehe "substantial doubt", dass das einzelstaatliche
    Verfahren die bundesgerichtlichen Ansprüche erledige; die Verfahren seien nicht hinreichend parallel.
    Der Fall betrifft einen Mann, der nach Interaktionen mit ChatGPT seine Mutter und anschließend sich
    selbst getötet haben soll. OpenAI muss sich damit gleichzeitig in JCCP 5431 und vor dem Bundesgericht
    verteidigen.

    '
  bedeutung: mittel
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-cand-3_25-cv-11037/pdf/USCOURTS-cand-3_25-cv-11037-0.pdf
