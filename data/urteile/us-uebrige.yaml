  kernfrage: 'Kann eine erfundene Tatsachenbehauptung eines Sprachmodells ("Halluzination") eine Ehrverletzung
    begründen?

    '
  ergebnis: 'Summary judgment vollständig zugunsten von OpenAI ("summary judgment in full"), gestützt
    auf drei selbständig tragende Gründe. Erstens fehle es an einer ehrenrührigen Tatsachenbehauptung:
    Ein verständiger Leser hätte die Ausgabe angesichts der Warnhinweise und des Kontexts nicht als Mitteilung
    tatsächlicher Vorgänge verstanden. Zweitens fehle das Verschulden — weder Fahrlässigkeit noch, für
    den Kläger als Person des öffentlichen Lebens, "actual malice" nach New York Times v. Sullivan. Drittens
    sei kein ersatzfähiger Schaden dargetan; der einzige Empfänger, der Journalist Fred Riehl, habe die
    Behauptung sofort als falsch erkannt und nicht weiterverbreitet. Ein Rechtsmittel ist bis zum 05.09.2026
    nicht bekannt geworden.

    '
  bedeutung: hoch
  volltext_url: null
  zusammenfassung_url: https://www.clearygottlieb.com/news-and-insights/publication-listing/georgia-court-dismisses-defamation-lawsuit-against-openai-over-chatgpt-output
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: Kopie des e-eingereichten Beschlusses mit Eingangsstempel des Clerk of Superior Court,
