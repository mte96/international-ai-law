  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Die meistzitierte KI-Haftungsentscheidung der USA — und zugleich die fragilste. Sie
    ist ein Beschluss über einen Klageabweisungsantrag eines einzelnen District Judge, kein Urteil, und
    sie ist durch Vergleich der Überprüfung entzogen worden. Wer sie als "US-Gerichte verneinen den Grundrechtsschutz
    von KI-Output" referiert, liest sie falsch: Das Gericht hat sich ausdrücklich nicht festgelegt und
    die Darlegungslast bei den Beklagten verortet. Rechtsdogmatisch interessanter ist die Produktdefinition,
    weil sie die im US-Recht seit Winter v. G.P. Putnam''s Sons gefestigte Linie (Information ist kein
    Produkt) nicht aufhebt, sondern umgeht: Angriffspunkt ist die Architektur (anthropomorphe Gestaltung,
    fehlende Altersverifikation, fehlende Krisenintervention), nicht der Satz. Genau diese Verschiebung
    vom Inhalt zur Gestaltung ist das dogmatische Muster, das inzwischen alle Nachfolgeverfahren übernehmen
    — und es ist auch der Grund, warum § 230 in diesen Verfahren kaum noch verteidigt wird. Für europäische
    Leser: Das entspricht funktional der Erstreckung des Produktbegriffs auf Software in Art. 4 Nr. 1
    der neuen EU-Produkthaftungsrichtlinie (EU) 2024/2853 — die USA erreichen über Richterrecht, was die
    EU kodifiziert hat.

    '
