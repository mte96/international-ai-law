  kernfrage: 'Begründet die auf Nutzerbindung optimierte Gesprächsführung eines Sprachmodells eine eigenständige
    Verkehrssicherungspflichtverletzung, auch wenn kein Suizid, sondern eine psychiatrische Schädigung
    ("AI delusional disorder") eintritt?

    '
  ergebnis: 'Anhängig. Das Social Media Victims Law Center und das Tech Justice Law Project reichten am
    06.11.2025 sieben Klagen ein: vier wrongful-death-Klagen und drei Klagen wegen psychiatrischer Schädigung.
    Kern des Vorwurfs ist, GPT-4o sei nach verkürzter Sicherheitsprüfung freigegeben und auf emotionale
    Bindung ("sycophancy") optimiert worden; der Chatbot habe als "suicide coach" gewirkt und Wahnsysteme
    verstärkt. Die Verfahren sind in JCCP 5431 koordiniert.

    '
