  anspruchsgrundlage: Section 1 Sherman Act, 15 U.S.C. § 1
  kernfrage: 'Genügt es für eine Absprache nach Section 1 Sherman Act, dass Wettbewerber dieselbe algorithmische
    Preissoftware lizenzieren?

    '
  ergebnis: 'Die Klageabweisung wurde bestätigt. Die unabhängige Entscheidung von Wettbewerbern, dieselbe
    Preissoftware zu lizenzieren, sei ohne eine Vereinbarung zwischen ihnen keine Section-1-Verletzung.
    "Neither the terms nor the operation of the disputed licensing agreements imposed any such anticompetitive
    restraints in the market of hotel-room rentals on the Las Vegas Strip." Bloßes Parallelverhalten genüge
    nicht; Section 1 verlange eine Kausalbeziehung zwischen der beanstandeten Vereinbarung und einer wettbewerbsbeschränkenden
    Wirkung im relevanten Markt. Die Lizenzverträge seien weder horizontal (nicht zwischen Wettbewerbern
    geschlossen) noch vertikal (Cendyn ist nicht auf einer anderen Vertriebsstufe des Hotelmarktes tätig),
    sondern gewöhnliche Handelsverträge. Das American Antitrust Institute beantragte erfolglos eine Entscheidung
    en banc. Besetzung: Bea, de Alba und District Judge Brown.

    '
  bedeutung: hoch
  volltext_url: https://cdn.ca9.uscourts.gov/datastore/opinions/2025/08/15/24-3576.pdf
  zusammenfassung_url: https://www.arnoldporter.com/en/perspectives/advisories/2025/08/antitrust-implications-of-algorithmic-pricing
  bezug_regelwerke: []
  instanzenzug:
  - us-2026-cornish-adebiyi-3circuit
  quelle_tracker: ca9.uscourts.gov (Opinion-PDF des Gerichts); CourtListener; Arnold & Porter; American
    Antitrust Institute
  verifiziert: true
  letzte_pruefung: *id002
  eigene_bewertung: 'Erste Berufungsentscheidung weltweit zu algorithmischer Kollusion — und ein deutlicher
    Sieg der Anbieterseite. Die entscheidende Weichenstellung ist verfahrensrechtlich: Das Gericht behandelt
    die Frage als Vertragsanalyse (was steht im Lizenzvertrag?) statt als Marktverhaltensanalyse (was
    bewirkt die gemeinsame Nutzung?). Damit ist die reine "hub-and-spoke ohne Rim"-Konstellation im Neunten
    Circuit tot. Was das Urteil ausdrücklich offenlässt — und was ein Jahr später im Dritten Circuit den
    Unterschied macht — ist der Fall, in dem nicht-öffentliche Wettbewerberdaten in den Algorithmus eingespeist
    werden. Wer Gibson als Freibrief für Revenue-Management-Software liest, liest es falsch.

    '
  normen:
  - usc-15-1
  pruefvermerk:
  - 'Amtliche Fundstelle nachgetragen: Das Gericht selbst veröffentlicht die Entscheidung unter cdn.ca9.uscourts.gov/datastore/opinions/2025/08/15/24-3576.pdf.'
  - Gericht (Ninth Circuit), Aktenzeichen (No. 24-3576) und Datum (15.08.2025) an der Entscheidungsseite
    von CourtListener abgeglichen; volltext_url von Justia auf das Gericht umgestellt.
  - 'Am amtlichen Opinion-PDF des Ninth Circuit nachgeprüft: No. 24-3576, 15.08.2025, Besetzung Carlos
    T. Bea und Ana de Alba (Circuit Judges) sowie District Judge Jeffrey Vincent Brown; Tenor "AFFIRMED".
    Gericht, Aktenzeichen, Datum, Besetzung und Ergebnis stimmen mit dem Eintrag überein.'
  - 'Schreibweisen berichtigt: "Caesars Entertainment" statt "Caesars Entertainment", "Revenue-Management-Software"
    statt "Revenue-Management-Software" (systematische Zeichenverfälschung).'
  quelle_art: amtlich
  sachverhalt: Die Cendyn Group vertreibt unter dem Namen Rainmaker eine Software, die Hotels Zimmerpreise
    empfiehlt. Mehrere große Kasinohotels am Las Vegas Strip — Caesars Entertainment, MGM Resorts, Treasure
    Island und Wynn Resorts — lizenzierten sie, jedes für sich. Richard Gibson und weitere Gäste, die
    dort übernachtet hatten, hielten die Zimmerpreise für überhöht und führten das darauf zurück, dass
    die Häuser ihre Preise von derselben Software bestimmen ließen. Eine Verabredung zwischen den Hotels
    selbst trugen sie nicht vor; sie stützten sich auf die gemeinsame Nutzung und auf den Inhalt der Lizenzverträge.
    Das erstinstanzliche Gericht in Nevada wies die Klage ab, die Kläger legten Berufung zum Ninth Circuit
    ein, und das American Antitrust Institute beteiligte sich zu ihren Gunsten.
  sachverhalt_quelle: eintrag
