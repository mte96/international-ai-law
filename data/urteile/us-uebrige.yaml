    Central Transport LLC, N.D. Ill. 1:24-cv-01925, Richterin Bucklo). Alle drei sind Zwischenberufungen
    nach 28 U.S.C. § 1292(b).'
  - 'ARGUED FEBRUARY 12, 2026 - DECIDED APRIL 1, 2026; Besetzung: BRENNAN, Chief Judge, HAMILTON und JACKSON-AKIWUMI,
    Circuit Judges; Verfasser Brennan. Datum des Eintrags bestätigt.'
  - 'KORREKTUR STATUS: Der Tenor lautet "REVERSED AND REMANDED" - die drei Ausgangsverfahren gehen an
    die District Courts zurück. Der Eintrag führte "rechtskraeftig"; richtig ist "rechtsmittel".'
  - 'KORREKTUR PARTEIEN: Nur Clay ist Lkw-Fahrer mit Fingerabdruckscans an Terminals der Bahn (nach seinem
    Vortrag rund 1.500 Scans); Gregg und Willis wurden über biometrische Stempeluhren ihrer Arbeitgeber
    erfasst. Der Eintrag hatte die Beschreibung auf alle Kläger erstreckt.'
  - Der amtliche Link wurde am 05.09.2026 abgerufen und liefert den Volltext mit dem Tenor "REVERSED AND
