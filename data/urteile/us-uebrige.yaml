  quelle_art: amtlich
  sachverhalt: 'Nachdem das Gericht im Juli 2024 die Klage gegen Workday wegen mittelbarer Diskriminierung
    hatte passieren lassen, traten vier weitere Bewerber dem Verfahren bei. Auch sie waren über vierzig,
    hatten nach eigenem Vortrag Hunderte von Bewerbungen über Systeme von Workday eingereicht und jedes
    Mal — oder nahezu jedes Mal — eine Absage erhalten, darunter mindestens eine automatisch erzeugte
    Absage für eine Stelle, deren Anforderungen sie erfüllten. Mobley beantragte daraufhin, das Verfahren
    als bundesweite Kollektivklage nach dem Altersdiskriminierungsgesetz zu führen: Nicht ein einzelner
    Arbeitgeber, sondern die von Tausenden Arbeitgebern gemeinsam genutzte Software sollte die verbindende
    Praxis sein. Workday hielt dem entgegen, seine Kunden träfen ihre Auswahlentscheidungen selbst und
    die 2024 hinzuerworbene Anwendung HiredScore sei ein eigenständiges Produkt mit anderen Algorithmen.'
