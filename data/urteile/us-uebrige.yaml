  kernfrage: 'Bindet die gemeinnützige Gründungszwecksetzung eines KI-Entwicklers dessen Organe rechtlich,
    wenn das Unternehmen in eine gewinnorientierte Struktur überführt wird?

    '
  ergebnis: 'Nach einem Geschworenenverfahren (Auswahl ab 27.04.2026, Aussage Musks am 28.-30.04.2026,
    Schlussvorträge 14.05.2026) wies eine neunköpfige beratende Jury am 18.05.2026 sämtliche Ansprüche
    Musks einstimmig ab: Die Klage sei verspätet erhoben, die Verjährungsfrist abgelaufen. Richterin Gonzalez
    Rogers folgte dem und wies die Klage ab. Über die Begründetheit der Ansprüche — Bruch der gemeinnützigen
    Zwecksetzung, ungerechtfertigte Bereicherung — wurde damit nicht entschieden. Vorausgegangen waren
    die Zurückweisung des Antrags auf einstweilige Verfügung gegen die Umwandlung (Februar/März 2025,
    "claim of irreparable harm was a stretch") und die teilweise Klageabweisung vom 01.05.2025. Musks
    Anwalt Marc Toberoff kündigte Berufung an; OpenAI hatte im April 2025 Widerklage wegen Behinderungshandlungen
    erhoben.

    '
  bedeutung: mittel
