  eigene_bewertung: 'Aufgenommen, obwohl Agri Stats keine KI einsetzt — gerade deshalb. Der Vergleich
    zeigt, dass das DOJ das Problem nicht bei der Technologie, sondern beim Datenfluss verortet: dieselben
    Kernauflagen wie bei RealPage (Anonymisierung, Aggregation, Zeitverzögerung, Symmetrie des Zugangs).
    Damit ist klargestellt, dass die Rechtsfrage nicht "ist der Algorithmus schuld" lautet, sondern "wer
    sieht wessen Daten wie schnell". Das ist die dogmatisch richtige Verortung und zugleich diejenige,
    die Anbietern die konkreteste Handlungsanleitung gibt. Die sechs beteiligten Bundesstaaten sind in
    den abgerufenen Quellen nicht namentlich benannt.

    '
