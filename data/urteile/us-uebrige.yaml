  ergebnis: 'Die einstweilige Verfuegung des District Court wird aufgehoben, die Sache zurueckverwiesen.
    Der Senat (Milan D. Smith Jr., Eric C. Tung, John C. Hinderaker) haelt Amazon fuer unwahrscheinlich
    erfolgreich in der Sache: Nach dem Sachverhalt hat Perplexity kein Werkzeug benutzt, um auf Amazons
    Rechner zuzugreifen - zugegriffen hat der Nutzer, mit Hilfe des Assistenten, um bestimmte Handlungen
    auf Amazon.com vorzunehmen. Fuer den kalifornischen CDAFA gilt dasselbe aus demselben Grund. Auch
    die uebrigen Billigkeitsgesichtspunkte traegt die Vorinstanz nicht.'
