  kernfrage: 'Darf eine Behörde ein generatives Werkzeug allein wegen seiner Missbrauchseignung untersagen?

    '
  ergebnis: 'Die FTC nahm das Verfahren wieder auf und hob die eigene Verfügung einstimmig (2:0) auf.
    Die im Beschwerdeschriftsatz vorgetragenen Tatsachen trugen keinen Verstoß gegen § 5 FTC Act; die
    Verfügung belaste zudem "artificial intelligence innovation" entgegen der Executive Order des Präsidenten
    zur KI und dem "America''s AI Action Plan". Der Direktor des Bureau of Consumer Protection, Christopher
    Mufarrige, fasste es zusammen: "Condemning a technology simply because it potentially could be used
    problematically is inconsistent with the law."

    '
  bedeutung: hoch
