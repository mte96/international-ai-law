  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Kein KI-Gesetz, aber die derzeit belastbarste Aussage dazu, welche Regulierung algorithmischer
    Dienste in den USA verfassungsrechtlich tragfähig ist — und damit die Blaupause für die Bewertung
    der KI-Gesetze, die derzeit angegriffen werden. Zwei Befunde sind übertragbar. Erstens: Standardbasierte
    Pflichten ("Kindeswohl", "erheblich nachteilig") scheitern an der Unbestimmtheit; regelbasierte Pflichten
    (Alterschätzung, Voreinstellungen) halten. Das begründet eine strukturelle Präferenz des US-Verfassungsrechts
    für kleinteilige Regeln — genau umgekehrt zur europäischen Risikoregulierung, die mit Generalklauseln
    arbeitet. Zweitens: Nach Moody muss ein Verband, der ein Gesetz insgesamt angreift, dessen gesamten
    Anwendungsbereich kartieren; das schützt Gesetze mit breitem Adressatenkreis, wie es die einzelstaatlichen
    KI-Gesetze sind. Für die anhängigen Angriffe auf SB 243 und SB 53 ist das die wichtigste Hürde.

    '
