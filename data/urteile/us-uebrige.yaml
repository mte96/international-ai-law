  anspruchsgrundlage: 'First Amendment; Fourteenth Amendment; angegriffen: Cal. Elec. Code § 20012 (AB
    2839) und § 20515 ff. (AB 2655, "Defending Democracy from Deepfake Deception Act of 2024"); ferner
    47 U.S.C. § 230.

    '
  kernfrage: 'Darf ein Bundesstaat die Verbreitung "materiell täuschender" KI-erzeugter Wahlkampfinhalte
    verbieten?

    '
  ergebnis: 'AB 2839 wurde am 29.08.2025 dauerhaft außer Vollzug gesetzt: Das Gesetz diskriminiere nach
    Inhalt, Standpunkt und Sprecher und erfasse verfassungsrechtlich geschützte Rede. Es weiche vom Ehrschutzrecht
    ab, weil es Inhalte erfasse, die lediglich "reasonably likely" seien, Schaden zu verursachen — das
    sei spekulativ und vorbeugend statt konkret abhelfend. Gegenrede und Faktenprüfung seien mildere Mittel;
    "The First Amendment does not ''permit speech-restrictive measures when the state may remedy the problem
    by implementing or enforcing laws that do not infringe on speech.''" Bereits am 02.10.2024 hatte das
    Gericht AB 2839 im einstweiligen Rechtsschutz gestoppt, am 03.01.2025 auch AB 2655 vollständig außer
    Vollzug gesetzt. Section 230 wurde in der Entscheidung vom 29.08.2025 nicht behandelt.

    '
