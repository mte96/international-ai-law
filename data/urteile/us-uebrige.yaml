  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Wichtig weniger wegen der Entscheidung — die es nicht gibt — als wegen der Verteidigungsstrategie.
    Die Schiedsklausel in den Nutzungsbedingungen eines Companion-Chatbots gegenüber Vierzehnjährigen
    ist die wirksamste Waffe der Anbieter, weil sie Kollektivierung und Öffentlichkeit gleichzeitig verhindert.
    Dass Google, das nie Vertragspartner war, sich über equitable estoppel darauf zu stützen versuchte,
    spiegelt genau das Argument, das ihm in Garcia zum Nachteil gereichte: Einmal ist die wirtschaftliche
    Einheit Haftungsgrund, einmal Schiedseinrede. Ob US-Gerichte Schiedsklauseln gegenüber Minderjährigen
    in Suizidfällen durchhalten, ist die praktisch entscheidende Vorfrage der gesamten Chatbot-Haftung
    — und sie ist ungeklärt geblieben. Nicht verifiziert: Der Ausgang des Schiedsantrags.

    '
