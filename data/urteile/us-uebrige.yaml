  letzte_pruefung: &id001 2026-09-05
  eigene_bewertung: 'Der Vergleich ist die eigentliche Nachricht des Jahres, und zwar genau wegen dessen,
    was er verhindert hat. Google war nicht Anbieter des Chatbots, sondern Lizenzgeber und Cloud-Dienstleister
    — und hat trotzdem mitgezahlt, nachdem das Gericht die Beihilfe- und Zulieferhaftung hatte passieren
    lassen. Damit ist der praktisch wichtigste Befund nicht die Rechtsfrage, sondern die Risikoallokation:
    Wer einem Anwendungsanbieter maßgeschneiderte Modell- und Infrastrukturleistungen erbringt, kauft
    dessen Produkthaftungsrisiko mit ein. Für die deutsche Diskussion um die Rolle von "GPAI-Anbietern"
    gegenüber "Anbietern von KI-Systemen" nach Art. 3 KI-VO ist das der interessanteste Punkt: Die vertragliche
    Wertschöpfungskette wird haftungsrechtlich nicht respektiert. Zugleich zeigt die Vertraulichkeit,
    dass beide Seiten keinen Präzedenzfall wollten — die Klägervertreter ebenso wenig wie die Beklagten,
    denn ein Eleventh Circuit hätte auch anders entscheiden können.

    '
