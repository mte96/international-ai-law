  ergebnis: 'Verwaltungsbeschwerde, anhängig. Die Beschwerdeführerin, eine gehörlose indigene Mitarbeiterin
    von Intuit, macht geltend, das Videointerviewsystem von HireVü habe ihre Antworten über automatische
