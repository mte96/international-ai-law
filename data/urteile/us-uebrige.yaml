  kernfrage: 'Kann ein neu in Kraft getretenes einzelstaatliches Datenschutzgesetz unmittelbar auf die
    Datenverarbeitung minderjähriger Nutzer durch einen Companion-Chatbot angewandt werden?

    '
  ergebnis: 'Anhängig. Erste Durchsetzungsmaßnahme überhaupt unter dem Kentucky Consumer Data Protection
    Act — und zwar zwei Wochen nach dessen Inkrafttreten. Vorgeworfen wird, Character.AI ziele auf Kinder,
    verarbeite deren Daten ohne zulässige Rechtsgrundlage und ohne hinreichende Altersprüfung und setze
    manipulative Gestaltung ein.

    '
