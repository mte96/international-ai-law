  sachverhalt: Derek Mobley ist Afroamerikaner, über vierzig Jahre alt, leidet an Angst und Depression
    und hat einen Finanzabschluss des Morehouse College sowie Zertifikate des ITT Technical Institute;
    seit 2010 arbeitete er im Finanzwesen, im IT-Helpdesk und im Kundendienst, unter anderem bei Hewlett
    Packard Enterprise, der Bundessteuerbehörde und AT&T. Seit 2017 bewarb er sich auf über hundert Stellen
    bei Unternehmen, die die Bewerbermanagement-Software von Workday einsetzen — und wurde auf jede einzelne
    dieser Bewerbungen abgelehnt. Die Software sortiert Bewerber nach eigener Beschreibung automatisch
    aus oder weiter, um die Zeit bis zur Einstellung zu verkürzen; sie arbeitet mit maschinellem Lernen
    und bindet neurowissenschaftlich gestützte Eignungstests ein, und wer diese Filter nicht passiert,
    kommt im Verfahren nicht weiter. Mobley verklagte nicht die Arbeitgeber, sondern Workday selbst. Seine
    erste Klage war abgewiesen worden, mit der Möglichkeit zur Nachbesserung; über die geänderte Klage
    war nun zu entscheiden, wobei die Gleichbehandlungsbehörde EEOC sich zu seinen Gunsten äußerte.
  sachverhalt_quelle: volltext
