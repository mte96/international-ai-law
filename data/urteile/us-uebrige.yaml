- id: us-2025-ambriz-google
  jurisdiktion: us
  gericht: United States District Court, Northern District of California
  instanz: erstinstanzlich
  aktenzeichen: 3:23-cv-05437-RFL (Dkt. 56) - In re Google Cloud Contact Center AI Privacy Litigation
    (zit. 2025 WL 830450)
  ecli: ''
  datum: 2025-02-10
  parteien:
    klaeger: Misael Ambriz u.a. (Anrufer bei Verizon, Hulu, GoDaddy, Home Depot)
    beklagter: Google LLC
  status: anhaengig
  themenachsen:
  - datenschutz
  - haftung
  - governance
  anspruchsgrundlage: California Invasion of Privacy Act, Cal. Penal Code § 631(a)
  kernfrage: 'Ist der Anbieter eines KI-Dienstes zur Gesprächsanalyse ein "Dritter" im Sinne des Abhörverbots,
    wenn er die Gesprächsdaten technisch für eigene Zwecke nutzen könnte?

    '
  ergebnis: 'Der Klageabweisungsantrag wurde zurückgewiesen. Google Cloud Contact Center AI sei als "Dritter"
    anzusehen, weil die Software die Fähigkeit habe, die Anrufdaten für das Training eigener Modelle zu
    verwenden — und zwar unabhängig davon, ob Google diese Daten tatsächlich so genutzt habe. Damit etablierte
    das Gericht den sogenannten "capability test". Der Einwand, Google stelle den Kunden lediglich Software
    bereit und sei deren verlängerter Arm, wurde verworfen. Der Fall befindet sich Stand Mai 2026 in der
    Beweisaufnahme.

    '
  bedeutung: hoch
  volltext_url: https://storage.courtlistener.com/recap/gov.uscourts.cand.419848/gov.uscourts.cand.419848.56.0.pdf
  zusammenfassung_url: https://ailawsuittracker.com/cases/ambriz-v-google-llc-3-23-cv-05437/
  bezug_regelwerke:
  - us-ca-cipa
  instanzenzug:
  - us-2025-popa-microsoft
  - us-2025-taylor-conversenow
  quelle_tracker: CourtListener/RECAP Docket 3:23-cv-05437 (N.D. Cal.), Dkt. 56 mit ECF-Kopfstempel; Goodwin;
    Zwillgen
  verifiziert: true
  letzte_pruefung: *id002
  eigene_bewertung: 'Die folgenreichste Datenschutzentscheidung für KI-Dienstleister, weil sie das gesamte
    Auftragsverarbeitungsmodell in Frage stellt: Wer die technische Fähigkeit hat, Kundendaten für eigene
    Zwecke zu nutzen, ist nicht mehr verlängerter Arm, sondern Dritter — und ein Dritter, der mithört,
    verletzt das Abhörverbot. Übertragen auf das europäische Recht ist das die Frage, ob ein KI-Anbieter
    noch Auftragsverarbeiter nach Art. 28 DSGVO ist oder bereits Verantwortlicher nach Art. 4 Nr. 7 —
    mit dem entscheidenden Unterschied, dass das kalifornische Gericht auf die Fähigkeit statt auf die
    tatsächliche Zweckbestimmung abstellt. Das ist deutlich weiter als alles, was die europäische Aufsichtspraxis
    kennt, und genau deshalb umstritten.

    '
  normen:
  - dsgvo-art-28
  - dsgvo-art-4-nr-7
  - cal-pen-631-a
  sekundaerquelle_url: https://www.goodwinlaw.com/en/insights/publications/2025/02/alerts-practices-dpc-ftec-ai-voice-products-subject-to-california-invasion-of-privacy-claims
  pruefvermerk:
  - 'Amtliche Fundstelle nicht auffindbar: Gesucht wurde der Beschluss vom 10.02.2025 über den Motion
    to Dismiss in Ambriz v. Google LLC / In re Google Cloud Contact Center AI Privacy Litigation, N.D.
    Cal., 3:23-cv-05437-RFL. Das govinfo-Pack'
  - 'Am eingereichten Dokument mit ECF-Kopfstempel geprüft: "Case 3:23-cv-05437-RFL Document 56 Filed
    02/10/25 Page 1 of 11", Order on Motion to Dismiss, N.D. Cal.'
  - 'Tenor am Docket-Text bestätigt: "ORDER by Judge Rita F. Lin denying 47 Motion to Dismiss" - der Klageabweisungsantrag
    wurde also vollständig zurückgewiesen, wie im Eintrag beschrieben.'
  - Datum (10.02.2025) bestätigt; volltext_url erstmals auf ein amtliches Dokument gesetzt (bisher keine).
  - 'KORREKTUR NAME: Das Rubrum des Beschlusses lautet "Misael Ambriz, et al. v. Google, LLC"; der Eintrag
    führte "Misael Ambriz" (systematische Zeichenverfälschung "ae" zu "ä").'
  - 'Kernaussage am Dokument bestätigt: "The capability test considers only whether the software company
    is ''capable of creating, recording, and retaining data for purposes other than sending the data back
    to its business client'' — not whether it actually does so." Tenor: "Based on the foregoing analysis,
    Google, LLC''s motion to dismiss (Dkt. No. 47) is DENIED."'
  quelle_art: amtlich
  sachverhalt: Verizon, Hulu, GoDaddy und Home Depot betreiben ihre telefonischen Kundenzentren mit Google
    Cloud Contact Center AI. Der Dienst hört bei jedem Anruf mit, wandelt das Gespräch in Text um, wertet
    Anliegen und Stimmung des Anrufers in Echtzeit aus und schlägt den Mitarbeitern Antworten vor. Misael
    Ambriz und weitere Anrufer, die bei diesen Unternehmen angerufen hatten, erfuhren davon nichts und
    wurden nicht um Einwilligung gebeten. Sie klagten nicht gegen die Unternehmen, bei denen sie angerufen
    hatten, sondern gegen Google — und trugen vor, Google könne die mitgehörten Gespräche technisch für
    das Training eigener Modelle verwenden.
  sachverhalt_quelle: eintrag
