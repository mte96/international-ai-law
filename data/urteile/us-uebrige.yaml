  kernfrage: 'Unter welchen Bedingungen darf eine Preisempfehlungssoftware Daten von Wettbewerbern verarbeiten,
    ohne eine Wettbewerbsbeschränkung zu bewirken?

    '
  ergebnis: 'Das DOJ legte am 24.11.2025 einen Vergleichsvorschlag vor. RealPage wird untersagt: die Verwendung
    nicht-öffentlicher, wettbewerblich sensibler Wettbewerberdaten zur Bestimmung von Mieten; die Nutzung
    laufender Mietvertragsdaten zum Training der Modelle (zulässig nur Daten, die mindestens zwölf Monate
    alt sind); geografische Modelle unterhalb der Ebene eines Bundesstaats; Funktionen, die Preissenkungen
    erschweren oder die Preissetzung verschiedener Nutzer angleichen; Marktbefragungen zur Erhebung sensibler
    Informationen; sowie die Erörterung von auf nicht-öffentlichen Daten beruhenden Marktanalysen in Nutzerbesprechungen.
    Ein gerichtlich bestellter Monitor überwacht die Einhaltung; RealPage muss eine Compliance-Richtlinie
    zur Genehmigung vorlegen. Zuvor hatte das DOJ bereits einen Vergleich mit dem Vermieter Greystar geschlossen.

    '
  bedeutung: hoch
  volltext_url: https://www.justice.gov/atr/media/1419451/dl
  zusammenfassung_url: https://www.paulweiss.com/insights/client-memos/practical-takeaways-from-the-doj-s-algorithmic-pricing-settlement
  bezug_regelwerke: []
