  eigene_bewertung: 'Der dogmatisch interessanteste Diskriminierungsfall, weil er die Schwäche des disparate-impact-Ansatzes
    vermeidet. Der Vorwurf ist nicht statistisch ("Menschen über 40 werden seltener eingeladen"), sondern
    technisch: Das Erkennungssystem funktioniert bei dieser Person nachweislich schlechter. Damit wird
    aus der Diskriminierungsfrage eine Frage der angemessenen Vorkehrung nach dem ADA — und die verlangt
    keinen statistischen Beweis, sondern nur den Nachweis, dass eine zumutbare Alternative bestand. Das
    ist der Weg, auf dem KI-Diskriminierung im US-Recht auch dann justiziabel bliebe, wenn die disparate-impact-Doktrin
    politisch weiter zurückgedrängt wird. In der EU liefe derselbe Sachverhalt über Art. 5 der Barrierefreiheitsrichtlinie
    und Anhang III Nr. 4 KI-VO (Beschäftigung als Hochrisikobereich).

    '
