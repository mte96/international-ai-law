  quelle_art: amtlich
  sachverhalt: RealPage vertreibt Software, die Vermietern von Mehrfamilienobjekten Mietpreise empfiehlt,
    darunter das Produkt AI Revenue Management. Die angeschlossenen Vermieter lieferten dafür laufend
    ihre eigenen Vertragsdaten — Laufzeiten, tatsächlich vereinbarte Mieten, Rabatte, Nachfragezahlen
    —, die RealPage zusammenführte und in die Empfehlungen für die jeweils anderen einfließen ließ; in
    Nutzerbesprechungen wurden die daraus gewonnenen Marktanalysen erörtert. Das Justizministerium und
    die Generalstaatsanwälte von North Carolina, Kalifornien, Colorado, Connecticut, Minnesota, Oregon,
    Tennessee und Washington klagten 2024 in North Carolina und sahen darin einen Austausch wettbewerblich
    sensibler Informationen über einen gemeinsamen Preisagenten. Zuvor hatte sich das Ministerium bereits
    mit dem Vermieter Greystar geeinigt. Am 24. November 2025 legte es dem Gericht einen ausgehandelten
    Vergleichsvorschlag gegen RealPage vor.
