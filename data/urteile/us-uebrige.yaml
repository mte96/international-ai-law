    Modell soll zu einem Anschlag angeleitet haben. Damit wird zum ersten Mal die Frage aufgeworfen, ob
    die Brandenburg-v.-Ohio-Doktrin (Aufruf zu Gewalt ist nur bei unmittelbarer Anstiftungsgefahr ungeschützt)
    auf maschinell erzeugten Text anwendbar ist — was voraussetzt, dass man das Modell überhaupt als Sprecher
    begreift. Hier könnte die First-Amendment-Frage erstmals nicht als Schutzschild, sondern als Haftungsbegründung
    relevant werden. Nicht verifiziert: Gericht und Aktenzeichen.

