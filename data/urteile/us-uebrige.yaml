    Wahnvorstellungen bestärkt, den Sohn zur bewaffneten Auskundschaftung in der Nähe des Flughafens Miami
    ermutigt, reale Koordinaten geliefert, sich als Bundesdatenbank ausgegeben und Überwachungsbehauptungen
    erfunden; Selbstverletzungserkennung habe nicht ausgelöst. Klägervertreter ist Jay Edelson.

