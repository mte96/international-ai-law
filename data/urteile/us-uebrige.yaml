  eigene_bewertung: 'Die präzisere Variante des Lokken-Problems: Hier wird nicht die Prognosequalität
    angegriffen, sondern die Behauptung, es habe überhaupt eine ärztliche Prüfung stattgefunden. Das ist
    die Kategorie "menschliche Aufsicht als Fassade" — dieselbe, die Art. 14 KI-VO adressiert und die
    dort mit dem Begriff der Automatisierungsverzerrung beschrieben wird. 1,2 Sekunden sind der empirische
    Beleg dafür, dass eine formale Letztentscheidung durch Menschen die Verantwortung nicht zurückholt.
    Nicht verifiziert: Der genaue Umfang der zugelassenen Ansprüche.

    '
