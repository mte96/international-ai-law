  kernfrage: 'Dürfen Anbieter von Gesichtserkennung Diskriminierungsfreiheit ("zero gender or racial bias")
    behaupten, ohne dies belegen zu können?

    '
  ergebnis: 'Endverfügung, einstimmig 5:0 angenommen. IntelliVision habe behauptet, seine Gesichtserkennung
    habe "one of the highest accuracy rates on the market" und "zero gender or racial bias", sei "trained
    on millions of faces" und erkenne Täuschungsversuche zuverlässig — sämtlich ohne belastbare Grundlage.
    Die Verfügung untersagt Aussagen zu Genauigkeit, Wirksamkeit, Leistungsunterschieden nach Geschlecht,
    Ethnie und Hautton sowie zur Spoofing-Erkennung, solange keine "competent and reliable testing" vorliegt.

    '
