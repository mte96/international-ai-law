  eigene_bewertung: 'Der Vergleich war der Versuch, ein Strukturproblem der BIPA-Rechtsdurchsetzung zu
    lösen: Die gesetzlichen Schadenssätze (1.000 bzw. 5.000 US-Dollar je Verstoß) übersteigen bei Massendatenbanken
    jedes Unternehmensvermögen, sodass eine durchsetzbare Kompensation gar nicht möglich ist. Die Beteiligung
    am Unternehmen macht die Geschädigten zu Gesellschaftern derjenigen Gesellschaft, deren Geschäftsmodell
    sie angreift — das ist ökonomisch findig und rechtsethisch heikel, weil es das Interesse der Gruppe
    an einer Unterlassung in ein Interesse an deren Fortsetzung verkehrt. Genau daran ist der Vergleich
    in der Berufung gescheitert, wenn auch aus einem formalen Grund.

