  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Das dogmatisch schwierigere Verfahren als Garcia, weil ChatGPT kein Companion-Produkt
    ist, sondern ein Allzweckwerkzeug. Der Produktbegriff aus Garcia lässt sich darauf nicht ohne Weiteres
    übertragen: Ein Modell, das keine Rollenbeziehung anbietet, hat keine "Gestaltung", die sich vom Inhalt
    trennen ließe — außer man stellt, wie die Kläger es tun, auf Guardrails, Krisenintervention und Sitzungsabbruch
    ab. Genau das ist der Grund, warum OpenAI in seinen Schriftsätzen konsequent von "software-based service"
    statt "product" spricht. Der zweite Punkt ist die Kausalität: Die Verteidigung, das Modell habe hundertmal
    auf Hilfe verwiesen, ist zugleich ein Eingeständnis, dass die Gefahr erkannt und der Dialog dennoch
    fortgesetzt wurde — ein Argumentationsmuster, das im US-Produkthaftungsrecht (failure to warn vs.
    design defect) regelmäßig gegen den Hersteller ausschlägt.

    '
