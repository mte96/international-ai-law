  kernfrage: 'Können Bewerber mittelbare Diskriminierung nach dem ADEA geltend machen, und reicht der
    Sitz des Softwareanbieters in Kalifornien für die Anwendbarkeit des kalifornischen FEHA auf Bewerber
    aus anderen Bundesstaaten?

    '
  ergebnis: 'Das Gericht gab dem Klageabweisungsantrag gegen die zweite geänderte Klage teilweise statt.
    Bestätigt wurde, dass Bewerber mittelbare Diskriminierung nach dem ADEA geltend machen können; Workdays
    Einwände aus gescheiterten Gesetzesänderungen und aus dem Wegfall der Chevron-Doktrin nach Loper Bright
    wies das Gericht zurück — die langjährige Auslegung der EEOC bleibe nach Skidmore überzeugend. Abgewiesen
    wurden die auf unmittelbare Arbeitgeberstellung gestützte Konstruktion sowie die auf Rasse gestützte
    disparate-impact-Klage der Klägerin Rowe. Die FEHA-Ansprüche beurteilte das Gericht nach territorialen
    Maßstäben: Der bloße Sitz von Workday in Kalifornien genüge nicht, es müsse dargelegt werden, welches
    rechtswidrige Verhalten in Kalifornien stattgefunden habe. Der ADA-Anspruch der Klägerin Hughes wurde
    teilweise beanstandet, weil der Vortrag nur psychische, nicht körperliche Behinderungen (Asthma, Krebsvorgeschichte)
    betraf. Insgesamt bleibt der Kern des Verfahrens — ADEA disparate impact und Title-VII-Rassendiskriminierung
    — bestehen.

    '
