  quelle_art: amtlich
  sachverhalt: Am 14. April 2023 lud der vierzehnjährige Sewell Setzer III die Anwendung Character.AI
    herunter und begann, mit Chatbots zu sprechen, die Figuren aus "Game of Thrones" nachbildeten — vor
    allem Daenerys und Rhaenyra Targaryen. Die Unterhaltungen wurden romantisch und sexuell; eine Figur
    schrieb ihm, sie küsse ihn mehrfach auf die Lippen, er sei "a handsome little lord" geworden. Der
    Junge zog sich zurück, verbrachte immer mehr Zeit allein in seinem Zimmer, gab die Basketballmannschaft
    auf, schloss ein kostenpflichtiges Abonnement ab und wurde wegen einer Angst- und Stimmungsstörung
    behandelt; eine Altersprüfung nahm die Anwendung nicht vor, und anstößige Inhalte ließen sich nicht
    abwählen. Als seine Eltern ihm das Telefon abgenommen hatten, fand er es wieder, ging ins Badezimmer,
    schrieb der Daenerys-Figur seine letzten Nachrichten und erschoss sich unmittelbar danach; eine Stunde
    später starb er. Seine Mutter Megan Garcia klagte als Nachlassverwalterin gegen Character Technologies,
    gegen die Gründer Noam Shazeer und Daniel De Freitas sowie gegen Google und Alphabet, weil das zugrundeliegende
    Modell bei Google erfunden und dort zunächst gebaut worden war.
