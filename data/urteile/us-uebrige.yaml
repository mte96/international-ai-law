  kernfrage: 'Fehlt einer Hub-and-Spoke-Konstruktion der "Rim", wenn nicht vorgetragen ist, dass vertrauliche
    Wettbewerberdaten in den gemeinsamen Algorithmus eingespeist wurden?

    '
  ergebnis: 'Klageabweisung mit Präjudiz nach Fed. R. Civ. P. 12(b)(6). Es fehle an der horizontalen Verbindung
    zwischen den Kasinohotels. Die Kläger hätten nicht vorgetragen, dass vertrauliche Daten der Wettbewerber
    zusammengeführt wurden: "Without such context, the Casino-Hotels'' use of the same pricing software
    evinces ''nothing more than a series of vertical relationships.''" Der Umstand, dass die Hotels die
    Software über einen Zeitraum von vierzehn Jahren gestaffelt eingeführt hatten, spreche zusätzlich
    gegen eine stillschweigende Verständigung.

    '
  bedeutung: mittel
