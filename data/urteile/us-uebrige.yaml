  anspruchsgrundlage: Produkthaftung, negligence, wrongful death (einzelstaatliches Recht)
  kernfrage: 'Welchen Preis messen Anbieter und Investoren dem Risiko bei, dass die Produkteigenschaft
    eines Chatbots und die Nichtanwendbarkeit des First Amendment obergerichtlich bestätigt werden?

    '
  ergebnis: 'Character Technologies und Google haben sich am 07.01.2026 mit fünf klagenden Familien verglichen
    — dem Leitverfahren Garcia (M.D. Fla.) sowie Parallelverfahren in Colorado, New York und Texas. Die
    Bedingungen sind vertraulich, Beträge wurden nicht offengelegt; die Vereinbarungen bedurften noch
    gerichtlicher Umsetzung. Das Garcia-Docket weist die Beendigung zum 07.01.2026 aus. Der Vergleich
    erfolgte, bevor irgendein Rechtsmittelgericht die Frage der Produkteigenschaft oder des First Amendment
    entscheiden konnte. Am Dokument: Das Leitverfahren wurde durch Beschluss der Vorsitzenden Richterin
    Anne C. Conway vom 07.01.2026 (Dkt. 244) OHNE Rechtskraftwirkung abgewiesen, verbunden mit einer Frist
    von neunzig Tagen, binnen deren die Parteien einen abgestimmten Endbeschluss vorlegen oder die Wiederaufnahme
    beantragen können; nach Ablauf dieser Frist wirkt die Abweisung mit Rechtskraft. Alle noch anhängigen
    Anträge wurden als erledigt zurückgewiesen — darunter der Antrag auf Zulassung der Zwischenbeschwerde.
    Vorausgegangen war am selben Tag die "NOTICE ... of Resolution" der Beklagten (Dkt. 242).

    '
