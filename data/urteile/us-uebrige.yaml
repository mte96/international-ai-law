  jurisdiktion: us
  gericht: United States District Court, Middle District of Florida, Orlando Division
  instanz: erstinstanzlich
  aktenzeichen: 6:24-cv-01903-ACC-DCI (zit. 785 F. Supp. 3d 1157)
  ecli: ''
  datum: 2025-05-21
  parteien:
    klaeger: Megan Garcia, als Nachlassverwalterin für Sewell Setzer III
    beklagter: Character Technologies, Inc.; Google LLC; Alphabet Inc.; Noam Shazeer; Daniel De Freitas
  status: vergleich
  themenachsen:
  - haftung
  - grundrechte
  - content
  - governance
  anspruchsgrundlage: 'Florida strict product liability (design defect, failure to warn); negligence und
    negligence per se; Fla. Stat. § 501.201 ff. (FDUTPA); unjust enrichment; Restatement (Third) of Torts
    § 5 (component part manufacturer); aiding and abetting. Einreden: First Amendment, 47 U.S.C. § 230.

    '
  kernfrage: 'Ist der Output eines Companion-Chatbots geschützte Rede im Sinne des First Amendment, und
    ist die Anwendung selbst ein "product" im Sinne der verschuldensunabhängigen Produkthaftung?

    '
  ergebnis: 'Der Antrag auf Klageabweisung wurde weitgehend zurückgewiesen. Zum First Amendment: Das Gericht
    lehnte es ab, sich festzulegen — "The Court is not prepared to hold that Character A.I.''s output
    is speech." Die Beklagten hätten sich auf Analogien zu Videospielen und sozialen Medien beschränkt,
    ohne die eigentliche Frage zu beantworten, ob der Output "expressive" sei. Prozessstandschaftlich
    ließ das Gericht die Beklagten allerdings die Rechte ihrer Nutzer auf Empfang von Information geltend
    machen. Zur Produkteigenschaft: "Character A.I. is a product for the purposes of Plaintiff''s product
    liability claims so far as Plaintiff''s claims arise from defects in the Character A.I. app rather
    than ideas or expressions within the app." Damit trennt das Gericht zwischen der Gestaltung der Anwendung
    (Produkt) und dem generierten Inhalt (kein Produkt). Abgewiesen wurde nur der Anspruch aus intentional
    infliction of emotional distress; Alphabet wurde ohne Präjudiz entlassen. Gegen Google blieben Ansprüchen
    als component part manufacturer und wegen Beihilfe bestehen: die Klägerin habe hinreichend vorgetragen,
    dass Google LaMDA-Technologie beigesteuert, deren Gefährlichkeit aus eigener Forschung gekannt und
    maßgeschneiderte, nicht allgemein verfügbare Cloud-Leistungen erbracht habe. Eine Auseinandersetzung
    mit 47 U.S.C. § 230 enthält der Beschluss nicht. Am 07.01.2026 wurde das Verfahren durch Vergleich
    beendet (Docket "Date Terminated: Jan. 7, 2026"); der von FIRE unterstützte Antrag auf Zulassung der
    Zwischenbeschwerde zum Eleventh Circuit nach 28 U.S.C. § 1292(b) erledigte sich damit.

    '
  bedeutung: hoch
  volltext_url: https://storage.courtlistener.com/recap/gov.uscourts.flmd.433581/gov.uscourts.flmd.433581.115.0.pdf
  zusammenfassung_url: https://www.courthousenews.com/florida-judge-rules-ai-chatbots-not-protected-by-first-amendment/
