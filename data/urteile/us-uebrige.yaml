  eigene_bewertung: 'Die erste Berufungsentscheidung weltweit zur Rechtsstellung agentischer KI — und
    sie beantwortet die Zurechnungsfrage genau umgekehrt zu allem, was im Haftungsrecht geschieht. Während
    in der Produkthaftung der Anbieter für das Verhalten seines Modells einstehen soll, ist er im CFAA
    nicht einmal Handelnder: Handelnder ist der Nutzer, das Modell ist Werkzeug. Diese Spaltung ist nicht
    zufällig, sondern folgt der jeweiligen Schutzrichtung — im Deliktsrecht sucht man den Zahlungsfähigen,
    im Strafrecht den Vorsatz. Für Anbieter agentischer Systeme ist die Entscheidung dennoch die praktisch
    wichtigste des Jahres: Sie entzieht der Verhinderung von Agentenzugriffen die strafrechtliche Grundlage
    und verweist Websitebetreiber auf das Vertragsrecht und auf technische Maßnahmen. Die europäische
    Entsprechung — Art. 6 der NIS2-Umsetzung, § 202a StGB, das Datenbankherstellerrecht — steht vor derselben
    Frage und hat sie noch nicht beantwortet.

    '
