    13.07.2026, Richterbank Hamilton, Maldonado und Taibleson (Hamilton als Berichterstatter) — Gericht
    und Datum stimmen mit dem Eintrag überein.'
  - 'Rubrum der Entscheidung: ''In re: Clearview AI, Inc. Consumer Privacy Litigation; Rodell Sanders,
    et al. v. Clearview AI, Inc., et al.'' — die vom Eintrag verwendete Bezeichnung ''In re Clearview
    AI, Inc., Consumer Privacy Litigation'' ist zutreffend; das Berufungsaktenzeichen fehlte bisher.'
  - 'Ergebnis: Aufhebung der Vergleichsgenehmigung und Zurückverweisung. Tragender Grund ist das Fehlen
    eines eigenen Klassenvertreters für die bundesweite Klasse, deren Mitglieder deutlich geringere Anteile
    erhielten als die Mitglieder der bevorzugten Untergruppen; an der Equity-Struktur als solcher und
    am Fehlen von Unterlassungsansprüchen nahm das Gericht keinen Anstoß.'
  - Der bisherige Link war ein Fachzeitschriftenbeitrag.
  quelle_art: amtlich
  sachverhalt: 'Clearview AI betrieb eine Suchmaschine für Gesichter: Es sammelte Fotos von öffentlich
    zugänglichen Websites einschließlich sozialer Netzwerke, errechnete daraus Gesichtsvektoren und lieferte
    auf ein hochgeladenes Bild hin die Fundstellen der Treffer im Netz — mit den Beziehungen, politischen
    Bindungen und sonstigen Angaben, die sich daraus ergaben. Zunächst verkaufte das Unternehmen den Zugang
    auch an private Kunden; nach einem Vergleich mit der ACLU blieben nur noch Behörden und deren Auftragnehmer.
    Nach einem Bericht der New York Times im Januar 2020 wurden elf Sammelklagen zur gemeinsamen Vorbereitung
    an das Bundesgericht in Chicago verwiesen; sie umfassten eine bundesweite Gruppe und Untergruppen
    aus Illinois, Kalifornien, New York und Virginia. Weil Clearview zahlungsunfähig war, sah der ausgehandelte
    Vergleich kein Geld vor, sondern eine Beteiligung von 23 Prozent am Unternehmen, verteilt in Anteilen
    — zehn je Person aus Illinois, je fünf aus Kalifornien, New York und Virginia, einer für die nur bundesweit
    Betroffenen. Alle acht ursprünglichen Gruppenvertreter verweigerten die Zustimmung und wurden durch
    vier neue ersetzt, die sämtlich den bevorzugten einzelstaatlichen Untergruppen angehörten; sechzehn
    Gruppenmitglieder widersprachen, zwei von ihnen legten gegen die Genehmigung Rechtsmittel ein.'
  sachverhalt_quelle: volltext
