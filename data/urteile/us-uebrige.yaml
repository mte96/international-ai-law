  eigene_bewertung: 'Die praktisch folgenreichste Datenschutzentscheidung des Jahres, obwohl sie mit KI
    im engeren Sinne nichts zu tun hat. Das BIPA war das einzige US-Gesetz, das biometrische Verarbeitung
    mit einer abschreckenden Sanktion belegte, weil die Multiplikation je Scan Haftungssummen erzeugte,
    die Vergleiche erzwangen. Clay nimmt diesem Mechanismus die Wucht — rückwirkend. Wer die BIPA-Rechtsprechung
    als Modell für eine europäische Regulierung biometrischer KI heranzieht, muss das mitlesen: Das Gesetz
    hat funktioniert, solange die Sanktion unkalkulierbar war, und der Gesetzgeber hat genau das nach
    fünf Jahren zurückgenommen. Die praktische Konsequenz ist eine Verlagerung: Neue Klagen (etwa Kogon
    v. Google, N.D. Ill. 2026) testen, welche Ansprüche unter dem neuen Rahmen noch tragen.

    '
