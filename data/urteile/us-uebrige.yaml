  eigene_bewertung: 'Die einzige US-Maßnahme, die Fairness-Behauptungen selbst zum Gegenstand macht. Das
    ist ein bemerkenswerter Umkehrschluss: Wer Diskriminierungsfreiheit behauptet, unterwirft sich damit
    einer Nachweispflicht, die das Antidiskriminierungsrecht selbst nicht kennt. Für Anbieter heißt das,
    dass Fairness-Marketing ein eigenständiges Haftungsrisiko erzeugt — ein Effekt, der bei den Transparenzpflichten
    der KI-VO ebenfalls eintreten wird: Jede Angabe in der technischen Dokumentation nach Anhang IV ist
    zugleich eine wettbewerbsrechtlich angreifbare Aussage.

    '
