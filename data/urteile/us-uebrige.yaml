    geliefert; OpenAI habe das Produkt ohne hinreichende Sicherheitsprüfung auf den Markt gebracht. Zentraler
    Streitpunkt ist die Einordnung als "product" — OpenAI bezeichnet ChatGPT in seinen Schriftsätzen als
    "software-based service". Case Management Order No. 1 vom 04.08.2026. Eine Sachentscheidung zu § 230
    oder First Amendment liegt nicht vor.

    '
