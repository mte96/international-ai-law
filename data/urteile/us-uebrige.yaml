  - wettbewerb
  - governance
  - haftung
  anspruchsgrundlage: Section 1 Sherman Act, 15 U.S.C. § 1
  kernfrage: 'Kann die wissentliche Einspeisung vertraulicher eigener Preisdaten in einen von Wettbewerbern
    gemeinsam genutzten Algorithmus die Vereinbarung im Sinne von Section 1 Sherman Act ersetzen?

    '
  ergebnis: 'Der Third Circuit hob die Klageabweisung auf — die erste Berufungsentscheidung zugunsten
    von Klägern in einem Verfahren wegen algorithmischer Preisabsprache. Das Gericht bejahte eine hinreichend
    dargelegte Hub-and-Spoke-Verschwörung anhand dreier "plus factors": (1) Motiv zur Absprache angesichts
    der wirtschaftlichen Lage in Atlantic City und einer kollusionsanfälligen Marktstruktur (hohe Marktzutrittsschranken,
    wenige Substitute, Konzentration); (2) Verhalten entgegen dem Einzelinteresse — das Halten hoher Zimmerpreise
    bei sinkender Auslastung widerspreche dem Interesse an Auslastung, die Spiel- und Nebenumsätze trägt;
    (3) Informationsaustausch und Verhaltensänderung — Einspeisung nicht-öffentlicher Daten über Cendyn,
    Kontakte auf Branchenveranstaltungen, Kenntnis der Softwarebeziehungen der Wettbewerber und Abweichen
    von bisherigen Geschäftspraktiken. Zur Kernfrage: "Prices are fixed when they are agreed upon", unabhängig
    davon, ob die Empfehlungen tatsächlich befolgt werden; die Vereinbarung liege im wissentlichen Bereitstellen
    vertraulicher Daten an einen gemeinsamen Preisagenten, im Empfang wettbewerbergespeister Empfehlungen
    und deren Befolgung in rund 90 Prozent der Fälle. Das Gericht verwendete den "guy named Bob"-Test:
    "Is it ok for a guy named Bob to collect confidential price strategy information from all the participants
    in a market, and then tell everybody how they should price?"

    '
  bedeutung: hoch
  volltext_url: https://www2.ca3.uscourts.gov/opinarch/243006p.pdf
  zusammenfassung_url: https://www.alston.com/en/insights/publications/2026/08/cornish-adebiyi-caesars-entertainment-price-fixing
  bezug_regelwerke: []
  instanzenzug:
  - us-2024-cornish-adebiyi-dnj
  - us-2025-gibson-cendyn
  quelle_tracker: Third Circuit (Volltext); Alston & Bird; Mayer Brown; Baker McKenzie; Sheppard Mullin
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die wichtigste kartellrechtliche KI-Entscheidung bislang, und ein echter Circuit
    Split zu derselben Software. Alston & Bird spricht ausdrücklich von einem "split with the Ninth Circuit
    in a nearly identical case involving the same software". Damit ist die Frage reif für den Supreme
    Court. Dogmatisch bemerkenswert ist die Trennung von Vereinbarung und Befolgung: Wenn die Absprache
    bereits im Bereitstellen der Daten liegt, entfällt die klassische Verteidigung, man habe die Empfehlung
    ja frei übersteuern können. Genau diese Verteidigung — "human in the loop" — wird in der KI-Regulierung
    überall als Schutzmechanismus geführt; hier wird sie entwertet. Das ist auch für Art. 14 KI-VO ein
    Warnsignal: menschliche Aufsicht heilt keine strukturelle Koordination. Der "guy named Bob"-Test ist
    die klarste Formulierung des Funktionsäquivalenzgedankens, die ein Gericht bislang gefunden hat: Was
    für einen Menschen verboten wäre, wird durch Automatisierung nicht erlaubt.

    '
  normen:
  - ki-vo-art-14
  - usc-15-1
  quelle_art: amtlich
  sachverhalt: 'Die Kasinohotels von Atlantic City — Häuser von Caesars, Harrah''s, Tropicana, MGM und
    Hard Rock — nutzten die Preisempfehlungssoftware der Cendyn Group, eingeführt über einen Zeitraum
    von vierzehn Jahren nacheinander. Karen Cornish-Adebiyi und weitere Gäste trugen vor, die Häuser hätten
    dafür ihre eigenen, nicht öffentlichen Preis- und Belegungsdaten an Cendyn geliefert, von dort auf
    den Daten der Wettbewerber beruhende Empfehlungen zurückerhalten und diese in rund neun von zehn Fällen
    befolgt; man habe sich zudem auf Branchenveranstaltungen getroffen und voneinander gewusst, wer die
    Software einsetze. Die Zimmerpreise seien hoch geblieben, obwohl die Auslastung sank — ein Verhalten
    gegen das eigene Interesse für Häuser, die ihr Geld mit Spiel- und Nebenumsätzen verdienen. Das Bundesgericht
    in New Jersey wies die Klage am 30. September 2024 endgültig ab, weil die waagerechte Verbindung zwischen
    den Hotels fehle: dieselbe Software zu nutzen sei nur eine Reihe senkrechter Beziehungen. Die Kläger
    legten Berufung zum Third Circuit ein.'
  sachverhalt_quelle: eintrag
