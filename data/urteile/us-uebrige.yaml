  anspruchsgrundlage: ADEA, 29 U.S.C. § 626(b) i.V.m. 29 U.S.C. § 216(b) (collective action)
  kernfrage: 'Kann die Nutzung derselben algorithmischen Auswahlsoftware durch eine Vielzahl unterschiedlicher
    Arbeitgeber eine "common policy" darstellen, die eine bundesweite Kollektivklage trägt?

    '
  ergebnis: 'Das Gericht ließ die bundesweite ADEA-Kollektivklage vorläufig zu. Erfasst sind Bewerber
    ab 40 Jahren, die seit dem 24.09.2020 über die Bewerbungsplattform von Workday abgelehnt wurden. Der
    Kläger habe plausibel dargelegt, dass alle Mitglieder einer gemeinsamen, einheitlichen Politik unterworfen
    gewesen seien, die eine mittelbare Diskriminierung bewirkt habe — die algorithmische Bewertung selbst
    ist damit die "policy", nicht die Entscheidung des einzelnen Arbeitgebers. Mit Beschluss vom 07.07.2025
    (2025 WL 3458887) erstreckte das Gericht die vorläufige Gruppe ausdrücklich auf Bewerbungen, die mit
    den HiredScore-Funktionen bewertet wurden, und verpflichtete Workday, die betreffenden Kunden für
    die Benachrichtigung zu benennen; Einwände, HiredScore sei ein eigenständiges Produkt mit anderen
    Algorithmen, verwies das Gericht in das Dezertifizierungsstadium. Der Benachrichtigungsplan wurde
    am 02.12.2025 genehmigt, die Opt-in-Frist lief im März 2026 ab.

    '
