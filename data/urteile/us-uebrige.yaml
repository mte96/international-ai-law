  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Aufgenommen als Vorinstanz, weil die Divergenz erst im Vergleich sichtbar wird: Dasselbe
    Gericht, dieselbe Software, derselbe Vortrag — und zwei Jahre später ein gegenteiliges Ergebnis in
    der Berufung. Die Trennlinie ist ausschließlich der Vortrag zur Dateneinspeisung. Das ist für die
    Praxis die wichtigste Erkenntnis: Ob algorithmische Preissetzung kartellrechtswidrig ist, entscheidet
    sich nicht an der Technik, sondern an der Frage, welche Daten in das Modell fließen — und diese Frage
    lässt sich vertraglich und technisch steuern.

    '
  normen:
