  eigene_bewertung: 'Bestätigt die Extraterritorialitätsschranke für einen dritten Großkonzern und damit
    die Linie: Der IBM-"Diversity in Faces"-Komplex, aus dem alle drei Verfahren stammen, ist juristisch
    folgenlos geblieben. Bemerkenswert ist die Ironie: Der Datensatz war ausdrücklich zur Verringerung
    von Verzerrungen in Gesichtserkennungssystemen erstellt worden. Das erste ernsthafte Bemühen der Branche
    um Fairness der Trainingsdaten hat die einzige ernsthafte Klagewelle wegen Trainingsdaten ausgelöst
    — und diese ist an einer Zuständigkeitsfrage gescheitert, nicht an der Sache. Ob das Ergebnis richtig
    ist, lässt sich bezweifeln: Ohne betroffenenbezogene Anknüpfung läuft jedes einzelstaatliche Datenschutzrecht
    in einer verteilten Rechenlandschaft leer.

    '
