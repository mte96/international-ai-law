  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Der schärfste Beleg für den Kurswechsel der US-Bundesebene — und zwar auf einer Ebene,
    die selten beachtet wird: Eine Behörde hebt eine rechtskräftige eigene Verfügung auf, weil sie mit
    dem politischen Programm der Regierung nicht mehr vereinbar ist. Das ist keine Rechtsprechungsänderung,
    sondern eine Verwaltungsentscheidung, und sie hat unmittelbare Präzedenzwirkung für die Frage, ob
    die FTC gegen Basismodellanbieter wegen der Missbrauchseignung ihrer Modelle vorgehen wird: Sie wird
    nicht. Für europäische Anbieter heißt das, dass der Erwartungsdruck aus den USA nicht mehr von der
    FTC kommt, sondern aus zwei anderen Richtungen — den Generalstaatsanwälten der Bundesstaaten und der
    Zivilprozessführung. In der Sache hat die FTC allerdings recht: Die "means and instrumentalities"-Doktrin
    auf ein Allzweckwerkzeug anzuwenden, hätte jeden Texteditor erfasst.

    '
  normen:
  - usc-15-45-a
  - usc-15-45-n
  quelle_art: amtlich
  sachverhalt: Rytr LLC bot einen KI-gestützten Schreibassistenten an. Eine seiner Vorlagen, "Testimonial
    & Review", erzeugte aus wenigen Stichworten fertige Kundenbewertungen; die Federal Trade Commission
    sah darin ein Werkzeug zur massenhaften Herstellung falscher Rezensionen und nahm Rytr im September
    2024 in ihren Sweep "Operation AI Comply" auf. Die im Dezember 2024 bestandskräftig gewordene Verfügung
    untersagte dem Unternehmen, überhaupt noch einen KI-gestützten Dienst zur Erzeugung von Bewertungen
    oder Testimonials anzubieten; zwei Kommissare hatten dagegen gestimmt, weil ein Werkzeug nicht wegen
    seiner bloßen Missbrauchseignung verboten werden dürfe. Im Januar 2025 wechselte die Regierung. Die
    Executive Order des Präsidenten zur künstlichen Intelligenz und der "America's AI Action Plan" machten
    die Förderung der KI-Entwicklung zum Regierungsprogramm; ein Jahr nach ihrem Erlass wurde die Verfügung
    wieder aufgegriffen.
