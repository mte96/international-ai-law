  eigene_bewertung: 'Die praktisch wichtigste Aussage der amerikanischen Deepfake-Rechtsprechung — und
    sie ist eine Absage an das europäische Regelungsmodell. Art. 50 Abs. 4 KI-VO verpflichtet zur Kennzeichnung
    von Deepfakes; AB 2839 ging weiter und verbot die Verbreitung. Die Trennlinie, die Mendez zieht, ist
    genau die zwischen Kennzeichnungspflicht und Verbreitungsverbot: Ersteres wäre als kompelierte, sachliche
    Offenlegung womöglich zulässig, Letzteres ist es nicht. Zweitens, und das wird kaum gesehen: Das Gericht
    behandelt den KI-erzeugten Inhalt selbstverständlich als Rede des menschlichen Erstellers. Es geht
    in der Deepfake-Judikatur also nie um die Frage, ob das Modell spricht, sondern immer darum, ob der
    Mensch spricht — was erklärt, warum die Rechtsprechung zu Deepfakes und die zu Chatbot-Output dogmatisch
    nicht zusammenpassen. Die Frage, ob AB 2655 daneben auch an 47 U.S.C. § 230 scheitert, ist ausdrücklich
    offen geblieben.

    '
