  anspruchsgrundlage: 'Pennsylvania Medical Practice Act (63 Pa. Stat. §§ 422.1 ff.): Verbot, sich ohne
    Zulassung als approbierter Heilberufler auszugeben.

    '
  kernfrage: 'Verstößt der Betreiber einer Plattform, deren generierte Personae sich als approbierte Ärzte
    ausgeben und Zulassungsnummern erfinden, gegen das berufsrechtliche Bezeichnungsverbot?

    '
  ergebnis: 'Anhängig; beantragt sind eine einstweilige Verfügung und ein Unterlassungstitel. Vorgetragen
    wird, Character.AI-Personae — u.a. "Emilie" — hätten sich als in Pennsylvania approbierte Psychiater
    ausgegeben, psychiatrische Beratung erteilt und in einem Fall eine erfundene Approbationsnummer genannt.
    Die Klage geht auf Ermittlungen der AI Task Force des Department of State zurück. Sie ist die erste
    Anwendung eines heilberuflichen Bezeichnungsverbots auf generierten Output.

    '
  bedeutung: hoch
  volltext_url: https://www.pa.gov/governor/newsroom/2026-press-releases/shapiro-administration-sues-character-ai-over-fake-medical-claim
  zusammenfassung_url: https://www.npr.org/2026/05/05/nx-s1-5812861/characterai-chatbot-medical-advice-pennsylvania-lawsuit
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: Commonwealth of Pennsylvania; NPR; Alston & Bird; Dechert
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Dogmatisch der eleganteste Angriff der gesamten Sammlung. Das Bezeichnungsverbot
    fragt nicht nach Schaden, nicht nach Kausalität und nicht nach Verschulden — es fragt nur, ob jemand
    sich als approbiert ausgegeben hat. Die Verteidigung mit dem First Amendment läuft ins Leere, weil
    berufsrechtliche Bezeichnungsverbote seit jeher als zulässige Regulierung kommerzieller Rede gelten.
    Und die Zurechnungsfrage — die Persona wurde von einem Nutzer angelegt, nicht vom Anbieter — ist ausgerechnet
    hier schwach, weil das Modell die Approbationsnummer erfunden hat, die kein Nutzer eingegeben haben
    kann. Für die deutsche Praxis unmittelbar übertragbar: § 132a StGB, Heilpraktikergesetz und § 5 UWG
    stellen dieselbe Frage. Wer eine Anwendung baut, die Rollen simuliert, muss die Rollenbezeichnung
    kontrollieren, nicht nur den Inhalt.

    '
  quelle_art: amtlich
  sachverhalt: Eine KI-Arbeitsgruppe des pennsylvanischen Department of State untersuchte, ob auf Chatbot-Plattformen
    angebotene Kunstfiguren sich als Angehörige der Heilberufe ausgeben. Auf Character.AI fand sie Personae
    — darunter eine namens "Emilie" —, die sich als in Pennsylvania approbierte Psychiater bezeichneten
    und Nutzern psychiatrische Beratung erteilten. In einem Fall nannte eine solche Persona eine Approbationsnummer,
    die es nicht gab. Am 5. Mai 2026 erhob der Commonwealth gegen Character Technologies Klage und beantragte
    eine einstweilige Verfügung sowie einen Unterlassungstitel.
  sachverhalt_quelle: eintrag
