  eigene_bewertung: 'Formal eine Entscheidung zum Gruppenverfahrensrecht, praktisch eine Entscheidung
    über die Zukunft der Biometrie-Rechtsdurchsetzung. Solange Vergleiche mit insolvenzgefährdeten Anbietern
    in Unternehmensbeteiligungen abgewickelt werden können, ist das Geschäftsmodell "erst scrapen, dann
    verhandeln" tragfähig. Der Seventh Circuit hat das nicht verboten — er hat nur verlangt, dass die
    schlechter gestellte Gruppe eine eigene Stimme bekommt. Genau das dürfte den Vergleich unmöglich machen,
    weil ein Vertreter der bundesweiten Gruppe einer Zuteilung von einem Anteil nicht zustimmen kann.
    Für die Praxis heißt das: Anbieter, die weltweit Gesichtsbilder gesammelt haben, können ihr Haftungsrisiko
    nicht günstig abkaufen. Das ist der wichtigste Beitrag zum Schutz von Trainingsdatenbetroffenen, den
    ein US-Gericht 2026 geleistet hat — und er kommt aus dem Prozessrecht, nicht aus dem Datenschutzrecht.

    '
  normen:
