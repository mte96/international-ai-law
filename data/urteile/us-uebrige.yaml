  anspruchsgrundlage: 'N.Y. Civil Rights Law §§ 50, 51 (Right of Publicity); N.Y. Gen. Bus. Law §§ 349,
    350; Vertragsrecht; ferner (abgewiesen) Lanham Act, 15 U.S.C. § 1125(a), und 17 U.S.C. §§ 106, 501.

    '
  kernfrage: 'Verletzt die Erzeugung synthetischer Stimmen durch ein auf der Stimme einer Person trainiertes
    Modell deren Persönlichkeitsrecht, und schützt das Urheberrecht die Stimme als solche?

    '
  ergebnis: 'Teilweise Klageabweisung. Abgewiesen wurden die Lanham-Act-Ansprüche (false association und
    false advertising) sowie sämtliche urheberrechtlichen Ansprüche — hinsichtlich des Modelltrainings
    mit Nachbesserungsmöglichkeit, hinsichtlich der erzeugten Stimmklone endgültig; das Urheberrecht schütze
    nur die konkreten Tonaufnahmen als fixierte Ausdrucksform, nicht die abstrakten Eigenschaften einer
    Stimme. Bestehen blieben die vertraglichen Ansprüche, die Ansprüche aus dem New Yorker Persönlichkeitsrecht
    und die verbraucherschutzrechtlichen Ansprüche. Zur Verjährung führte das Gericht aus, das auf den
    Stimmen der Kläger trainierte Modell repliziere diese wohl bei jeder neuen Ausgabe erneut. Zur Auslegung:
    Bei neuen Technologien wie KI sei es wichtig, "to encompass future developments and technological
    advancements".

    '
  bedeutung: hoch
  volltext_url: https://nysd.uscourts.gov/sites/default/files/2025-07/Lovo%20v%20Lehrman.pdf
  zusammenfassung_url: https://www.loeb.com/en/insights/publications/2025/07/lehrman-v-lovo-inc
  bezug_regelwerke:
  - us-tn-elvis-act
  - us-no-fakes-act
  instanzenzug: []
  quelle_tracker: Skadden; Loeb & Loeb; Fredrikson & Byron
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die dogmatisch präzise Entscheidung, die man hätte erwarten müssen und die dennoch
    überrascht, weil sie das Urheberrecht so klar aus dem Spiel nimmt. Das Ergebnis ist eine saubere Arbeitsteilung:
    Trainingsdaten sind eine urheberrechtliche Frage, die Identität der Person ist es nicht — sie gehört
    in das Persönlichkeitsrecht. Das ist genau die Aufteilung, die das deutsche Recht mit § 22 KUG und
    dem allgemeinen Persönlichkeitsrecht seit jeher trifft und die den USA wegen des Fehlens eines bundesweiten
    Right of Publicity fehlt: Es gilt New Yorker Recht, weil die Kläger dort ansässig sind — in einem
    anderen Bundesstaat wäre das Ergebnis ein anderes. Die Verjährungserwägung ist die weitreichendste
    Aussage der Entscheidung: Wenn ein trainiertes Modell die Stimme bei jeder Ausgabe erneut repliziert,
    ist die Verletzung ein Dauerzustand, solange das Modell existiert. Konsequent zu Ende gedacht, begründet
    das einen Löschungsanspruch gegen das Modell selbst.

    '
  normen:
  - usc-15-1125-a
  - usc-17-106
  - usc-17-501-a
  sekundaerquelle_url: https://www.skadden.com/insights/publications/2025/07/new-york-court-tackles-the-legality-of-ai-voice-cloning
  dokumenttyp: Opinion and Order
  pruefvermerk:
  - Amtliche Veröffentlichung des Gerichts selbst (Opinion-Repository der S.D.N.Y.).
  - 'Volltext geöffnet: S.D.N.Y., Richter J. Paul Oetken, Lehrman und Sage ./. Lovo, Inc.'
  - 'ABWEICHUNG: Die Entscheidung datiert vom 10.07.2025, nicht vom 17.07.2025 wie im Eintrag.'
  - 'Inhalt: Lanham-Act- und Copyright-Ansprüche abgewiesen; Vertrags-, Verbraucherschutz- und die Ansprüche
    nach N.Y. Civil Rights Law §§ 50–51 (Stimme) bleiben bestehen.'
  quelle_art: amtlich
  sachverhalt: Am 29. Oktober 2019 sprach auf der Auftragsplattform Fiverr ein Nutzer namens "tomlsg"
    — nach dem Vortrag der Kläger der Lovo-Mitgründer Tom Lee — die Sprecherin Linnea Sage an. Auf ihre
    Frage nach der Verwendung hieß es, es handele sich um Testskripte für Radiowerbung, sie würden nicht
    nach außen gegeben und erforderten daher keinerlei Rechteeinräumung; sie erhielt 400 US-Dollar. Im
    Mai 2020 wurde der Sprecher Paul Lehrman auf demselben Weg von einem Lovo-Mitarbeiter angesprochen,
    dem er die Zusicherung abverlangte, die Aufnahmen dienten allein internen, akademischen Forschungszwecken
    — "the scripts will not be used for anything else"; er erhielt 1.200 US-Dollar. Im Juli 2023 hörten
    beide in einer Folge des Podcasts "Deadline Strike Talk" eine Sprecherstimme, die sie als Lehrmans
    erkannten; die Produktion arbeitete mit einem bezahlten Lovo-Zugang. Lovo bot die geklonten Stimmen
    auf seiner Plattform unter den Namen "Kyle Snow" und "Sally Coleman" an und bewarb sie auf der eigenen
    Website, auf YouTube und in Präsentationen für Investoren.
