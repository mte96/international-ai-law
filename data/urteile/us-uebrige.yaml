  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Eine reine Verfahrensentscheidung, die materiell durchschlägt: Sie garantiert, dass
    die Frage "product or service" von mindestens zwei Gerichten unterschiedlicher Systeme parallel beantwortet
    wird. Für OpenAI ist das der ungünstigste Zustand — doppelte Discovery, doppelte Vergleichsverhandlung,
    und die Aussicht, dass ein Gericht eine Zwischenfrage anders beantwortet als das andere. Genau dieser
    Zustand hat bei Character.AI zum Vergleich geführt. Bemerkenswert ist auch, dass der Fall einen Dritten
    schädigt: Die getötete Mutter war nicht Nutzerin. Damit ist die gesamte Nutzungsbedingungs-Verteidigung
    — Schiedsklausel, Haftungsausschluss, Verstoß gegen Terms of Service — gegenstandslos.

    '
