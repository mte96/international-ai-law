  anspruchsgrundlage: 'Texas product liability und negligence; ferner Federal Arbitration Act 9 U.S.C.
    §§ 3, 4 (Antrag der Beklagten auf Verweisung in das Schiedsverfahren), gestützt auf equitable estoppel.

    '
  kernfrage: 'Kann ein Modellzulieferer, der die Nutzungsbedingungen des Anwendungsanbieters nicht selbst
    geschlossen hat, sich auf die dort enthaltene Schiedsklausel gegenüber minderjährigen Nutzern berufen?

    '
  ergebnis: 'Google, Alphabet, Shazeer und De Freitas beantragten am 10.03.2025 die Verweisung in das
    Schiedsverfahren und die Aussetzung des Verfahrens. Sie stützten sich darauf, dass die minderjährigen
    Nutzer die Character-AI-Nutzungsbedingungen mit Schiedsklausel akzeptiert hätten und die Kläger sich
    nach equitable estoppel nicht darauf berufen könnten, die Beklagten seien Nichtparteien, während sie
    zugleich alle Beklagten als wirtschaftliche Einheit behandelten; die Reichweite der Klausel sei ohnehin
    dem Schiedsgericht zugewiesen. Eine Sachentscheidung des Gerichts über diesen Antrag ist nicht auffindbar;
    das Verfahren gehört zu den im Januar 2026 verglichenen fünf Verfahren.

    '
