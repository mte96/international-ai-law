  kernfrage: 'Haftet der Anbieter eines algorithmischen Mieter-Scorings nach dem Fair Housing Act, wenn
    das Modell Wohngeldempfänger mittelbar benachteiligt, weil es die Zahlungsgarantie des Gutscheins
    nicht berücksichtigt?

    '
  ergebnis: 'Der Klageabweisungsantrag wurde im Juli 2023 im Wesentlichen zurückgewiesen: SafeRent falle
    als Scoring-Anbieter in den Anwendungsbereich des Fair Housing Act, und die Kläger hätten hinreichend
    dargelegt, dass die Gewichtung von Kredit- und Räumungshistorie ohne Berücksichtigung der Wohngeldgarantie
    schwarze und hispanische Antragsteller mittelbar benachteilige; der Anspruch nach ch. 93A wurde abgewiesen.
    Das Justizministerium und die US-Staatsanwaltschaft hatten eine Statement of Interest zugunsten der
    Kläger eingereicht. Am 20.11.2024 wurde ein Vergleich endgültig genehmigt: 2,275 Mio. US-Dollar (bis
    zu 1,175 Mio. an die Gruppe, 1,1 Mio. Anwaltskosten, je 10.000 Sonderzahlung an die benannten Kläger)
    sowie fünf Jahre Unterlassungspflichten — SafeRent gibt für Wohngeldempfänger keine automatisierten
    Annahme- oder Ablehnungsempfehlungen mehr ab, sondern nur noch Rohdaten, es sei denn, das Modell wird
    durch unabhängige Bürgerrechtssachverständige validiert.

    '
  bedeutung: hoch
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-mad-1_22-cv-10800/pdf/USCOURTS-mad-1_22-cv-10800-0.pdf
  zusammenfassung_url: https://www.cohenmilstein.com/rental-applicants-reach-2-28m-settlement-agreement-for-discriminatory-ai-powered-screening-tool/
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: Civil Rights Litigation Clearinghouse Case 45888; Cohen Milstein; NCLC; DOJ Civil Rights
    Division
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Der bislang wirksamste algorithmische Rechtsstreit der USA, gemessen nicht am Geldbetrag,
    sondern am Unterlassungstitel. Die Verpflichtung, keine Empfehlung mehr auszusprechen, sondern nur
    noch Daten zu liefern, verlagert die Entscheidung zurück auf den Menschen und ist damit funktional
    das, was Art. 22 DSGVO anordnet — nur erreicht über einen Vergleich statt über ein Gesetz. Die zweite
    Neuerung ist der Validierungsvorbehalt: Ein Modell darf erst wieder Empfehlungen ausgeben, wenn Dritte
    seine Diskriminierungsfreiheit bestätigt haben. Das ist eine private, vertraglich vereinbarte Konformitätsbewertung
    — der Sache nach dasselbe Instrument, das die KI-VO für Hochrisikosysteme vorschreibt. Wer wissen
    will, wie KI-Regulierung ohne KI-Gesetz aussieht, sollte diesen Vergleich lesen. Zu beachten ist allerdings
    der Reibungsverlust: Die disparate-impact-Regel des HUD, auf der die Klage aufbaut, ist seit 2025
    politisch angegriffen.

    '
