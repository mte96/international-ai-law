  sachverhalt: 'Nachdem das Gericht in Orlando im Mai 2025 den Klageabweisungsantrag weitgehend zurückgewiesen
    hatte, versuchten Character Technologies und Google, die Sache vor das Rechtsmittelgericht zu bringen:
    Sie beantragten die Zulassung einer Zwischenbeschwerde zum Eleventh Circuit nach 28 U.S.C. § 1292(b),
    unterstützt von der Bürgerrechtsorganisation FIRE. Inzwischen waren gegen dieselben Beklagten weitere
    Verfahren anhängig — für zwei minderjährige Nutzer in Texas sowie in Colorado und New York; insgesamt
    klagten fünf Familien. Am 7. Januar 2026 zeigten die Beklagten dem Gericht in einer "Notice of Resolution"
    an, dass man sich mit allen fünf Familien geeinigt habe. Die Bedingungen und Beträge wurden nicht
    offengelegt.'
