  anspruchsgrundlage: '18 U.S.C. § 1466A(a) (Herstellung und Verbreitung obszöner Darstellungen des sexuellen
    Missbrauchs von Kindern), § 1466A(b)(1) (Besitz), § 1470 (Übermittlung an einen Minderjährigen); First
    Amendment.

    '
  kernfrage: 'Darf der private, häusliche Besitz vollständig KI-generierten, keine reale Person abbildenden
    Materials sexualisierter Kinderdarstellung bestraft werden?

    '
  ergebnis: 'Das Berufungsgericht bestätigte die Abweisung des Besitzvorwurfs. Anderegg hatte mit Stable
    Diffusion nach dem Vorbringen der Anklage hunderte Bilder erzeugt; das Bezirksgericht hatte § 1466A(b)(1)
    in seiner Anwendung auf ihn für verfassungswidrig erklärt und sich auf Stanley v. Georgia (394 U.S.
    557) und Ashcroft v. Free Speech Coalition (535 U.S. 234) gestützt. Der Seventh Circuit folgte dem:
    Beide Präzedenzfälle beherrschten den Fall; "the government may not prohibit speech because it increases
    the chance an unlawful act will be committed", und das Argument, obszöne virtuelle Kindesmissbrauchsdarstellungen
    seien anders zu behandeln, sei durch Free Speech Coalition "squarely rejected". Die Vorwürfe der Herstellung,
    der Verbreitung und der Übermittlung an einen Minderjährigen unter sechzehn Jahren bleiben bestehen.
    Verfasser: Richter Lee; Besetzung Lee, Pryor, Kolar.

    '
  bedeutung: hoch
  volltext_url: https://media.ca7.uscourts.gov/cgi-bin/OpinionsWeb/processWebInputExternal.pl?Submit=Display&Path=Y2026/D08-25/C:25-1354:J:Lee:con:T:fnOp:N:3597567:S:0
  zusammenfassung_url: https://reason.com/volokh/2026/08/27/home-possession-of-ai-generated-porn-depicting-fake-children-remains-constitutionally-protected-seventh-circuit-rules/
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: ca7.uscourts.gov (Opinion des Gerichts, Volltext gelesen); Volokh Conspiracy; TechPolicy.Press
