  eigene_bewertung: 'Zwei Punkte sind wichtiger, als die Rezeption erkennen lässt. Erstens: Das Gericht
    rettet die disparate-impact-Klage von Bewerbern nach dem ADEA gegen den Angriff über Loper Bright
    — hätte Workday hier obsiegt, wäre der gesamten US-Rechtsprechung zu algorithmischer Altersdiskriminierung
    die Grundlage entzogen. Das ist die eigentliche Verteidigungslinie der Branche und sie wird wiederkommen.
    Zweitens die FEHA-Territorialität: Sie macht die Hoffnung zunichte, über den kalifornischen Sitz der
    Anbieter das strengste einzelstaatliche Antidiskriminierungsrecht auf alle US-Bewerber anzuwenden.
    Damit bleibt es beim Bundesrecht mit seiner engen Beweisdogmatik. Nicht auflösbar: Der abgerufene
    Volltext datiert die Entscheidung auf den 06.03.2026, die Sekundärquellen einheitlich auf den 22.06.2026;
    hier wurde das Datum der Sekundärquellen übernommen, das die zweite geänderte Klage betrifft.

    '
