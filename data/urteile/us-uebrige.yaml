  sachverhalt: 'Christopher Kohls veröffentlicht unter dem Namen "Mr Reagan" politische Satire im Netz.
    Im Wahlkampf 2024 stellte er mit generativer KI erfundene Wahlwerbespots über Kamala Harris, Gavin
    Newsom und Elizabeth Warren her, in denen deren Stimmen nachgebildet waren; der Spot über Harris verbreitete
    sich viral. Auch The Babylon Bee brachte in derselben Wahlperiode KI-erzeugte Parodien auf Kandidaten
    heraus. Kalifornien beschloss daraufhin zwei Gesetze: AB 2839 verbot die Verbreitung "materiell täuschender"
    KI-erzeugter Wahlkampfinhalte, AB 2655 nahm die Plattformen in die Pflicht. Kohls klagte gegen den
    Attorney General Rob Bonta und die Secretary of State Shirley Weber; The Babylon Bee, Rumble und X
    Corp schlossen sich an.'
