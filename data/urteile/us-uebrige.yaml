  pruefvermerk:
  - Volltext am amtlichen Text des Seventh Circuit gelesen (media.ca7.uscourts.gov).
  - 'Bestätigt: "No. 25-1354 ... Appeal from the United States District Court for the Western District
    of Wisconsin. No. 3:24-cr-0050 - James D. Peterson, Chief Judge. ARGUED OCTOBER 30, 2025 - DECIDED
    AUGUST 25, 2026. Before LEE, PRYOR, and KOLAR, Circuit Judges." Tenor: "the judgment is AFFIRMED".'
  - 'KORREKTUR Umfang: Der Eintrag sprach von "tausende Bilder". Die Entscheidung spricht von "hundreds
    of images"; korrigiert auf hunderte. Die Regierung räumte ausdrücklich ein, dass die Bilder kein reales
    Kind abbilden und keinem realen Kind zugeordnet werden können.'
  - 'KORREKTUR Vorinstanz: Peterson ist Chief Judge, nicht einfacher Richter; das Aktenzeichen der Vorinstanz
    lautet im Rubrum 3:24-cr-0050.'
  - 'Ergänzung: Richter Lee hat, gemeinsam mit Richter Kolar, ein zusätzliches Sondervotum (concurrence)
    verfasst, das eine Klärung durch den Supreme Court anregt.'
  - 'Zitat im Eintrag vervollständigt: "the government may not prohibit speech because it increases the
    chance an unlawful act will be committed at some indefinite future time".'
  - Der amtliche Link wurde am 05.09.2026 abgerufen und liefert den Volltext der Entscheidung.
  quelle_art: amtlich
  sachverhalt: Steven Anderegg installierte auf seinem Laptop das Bildmodell Stable Diffusion und ergänzte
    es um Komponenten, mit denen sich Geschlechtsteile darstellen ließen. Damit erzeugte er hunderte fotorealistische
    Bilder, die vorpubertäre Kinder nackt oder halb bekleidet und in sexuellen Handlungen zeigten; ein
    reales Kind bildete keines davon ab. Im Oktober 2023 meldete Meta als Muttergesellschaft von Instagram
    der Meldestelle des National Center for Missing and Exploited Children, ein Instagram-Nutzer habe
    solche Bilder per Direktnachricht an das Konto eines Minderjährigen geschickt. Die Bundesanwaltschaft
    klagte Anderegg wegen Herstellung, Verbreitung und Besitzes obszöner Darstellungen sexuellen Kindesmissbrauchs
    sowie wegen Übermittlung an einen Minderjährigen unter sechzehn Jahren an. Das Bundesgericht in Wisconsin
    erklärte die Strafbarkeit des Besitzes in ihrer Anwendung auf ihn für verfassungswidrig; die Anklagebehörde
    legte dagegen Rechtsmittel ein.
  sachverhalt_quelle: volltext
