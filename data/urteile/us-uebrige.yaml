  anspruchsgrundlage: 'Breach of contract; breach of the implied covenant of good faith and fair dealing;
    abgewiesen: Ansprüche, die durch die Medicare Act Preemption (42 U.S.C. § 1395w-26(b)(3)) gesperrt
    sind.

    '
  kernfrage: 'Kann ein Krankenversicherer sich auf die bundesrechtliche Verdrängung berufen, wenn er Leistungsentscheidungen
    einem Prognosealgorithmus überlässt, dessen Ergebnisse im Widerspruchsverfahren regelmäßig aufgehoben
    werden?

    '
  ergebnis: 'Teilweise Klageabweisung: Fünf Anspruchsgründe scheiterten an der bundesrechtlichen Verdrängung;
    die vertraglichen Ansprüche und der Anspruch aus der Verletzung der Pflicht zu Treu und Glauben blieben
    bestehen. Damit steht fest, dass Medicare-Advantage-Anbieter sich der vertraglich übernommenen Leistungszusage
    nicht über die Preemption entziehen können. Vorgeworfen wird der Einsatz des Algorithmus nH Predict
    zur Ablehnung nachstationärer Versorgung; die Ablehnungen wurden in rund 90 Prozent der Widerspruchsverfahren
    aufgehoben, während nur etwa 0,2 Prozent der Betroffenen überhaupt Widerspruch einlegten. Das Verfahren
    ist anhängig; 2026 ordnete das Gericht eine weitreichende Beweisaufnahme gegen UnitedHealth an.

    '
  bedeutung: hoch
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-mnd-0_23-cv-03514/pdf/USCOURTS-mnd-0_23-cv-03514-1.pdf
  zusammenfassung_url: https://www.afslaw.com/perspectives/alerts/federal-court-orders-broad-discovery-against-uhc-ai-coverage-denial-lawsuit
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: Tressler LLP; ArentFox Schiff; Whatley Kallas; Suffolk JHTL
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Der eigentliche Massenfall automatisierter Entscheidungen in den USA — und derjenige,
    der dem europäischen Art. 22 DSGVO am nächsten kommt, ohne dass es eine entsprechende Norm gäbe. Die
    Zahlen sind das Argument: Eine Ablehnungsquote, die im Widerspruchsverfahren zu neunzig Prozent kassiert
    wird, während nur zwei Promille widersprechen, beschreibt exakt das Strukturproblem, das ein Verbot
    rein automatisierter Entscheidungen adressiert — die Rechtsschutzlücke entsteht nicht aus der Fehlerhaftigkeit
    des Systems, sondern aus der Asymmetrie zwischen Fehlerquote und Widerspruchsbereitschaft. Das US-Recht
    löst das über Vertragsrecht, weil ihm die datenschutzrechtliche Kategorie fehlt. Bemerkenswert: Der
    Parallelfall Kisting-Leung v. Cigna (E.D. Cal. 2:23-cv-01477) betrifft das PxDx-System, das Ablehnungen
    mit einer durchschnittlichen ärztlichen Prüfzeit von 1,2 Sekunden erzeugt haben soll; das Gericht
    ließ die Klage am 31.03.2025 passieren, weil die Auslegung von Cigna dem klaren Wortlaut der vertraglichen
    Prüfpflicht widerspreche.

    '
  normen:
  - dsgvo-art-22
  sekundaerquelle_url: https://www.tresslerllp.com/thought-leadership/estate-of-gene-b-lokken-et-al-v-unitedhealth-group-inc-ai-risks-in-medical-insurance-coverage-disputes/
  dokumenttyp: Memorandum Opinion and Order (Motion to Dismiss)
  pruefvermerk:
  - 'Volltext geöffnet: D. Minn., Richter John R. Tunheim, 13.02.2025 — Datum stimmt mit dem Eintrag überein.'
  - 'Beklagte ausweislich Rubrum: UnitedHealth Group, Inc.; UnitedHealthcare, Inc.; naviHealth, Inc. (der
    Eintrag nennt UnitedHealthcare, Inc. nicht).'
  - 'Ergebnis: Vertrags- und Treu-und-Glauben-Ansprüche zulässig; übrige Ansprüche nach dem Medicare Act
    präkludiert.'
  quelle_art: amtlich
  sachverhalt: UnitedHealthcare bietet Tarife nach dem Medicare-Advantage-Programm an; die Tochtergesellschaft
    NaviHealth setzt dabei das Prognosewerkzeug nH Predict ein, das einen Versicherten mit ähnlich gelagerten
    Fällen vergleicht und daraus errechnet, wie viel nachstationäre Versorgung er brauchen werde. Nach
    dem Vortrag der Kläger bestimmte der Versicherer die Leistungsdauer nach dieser Zahl — unabhängig
    davon, was die behandelnden Ärzte für erforderlich hielten — und hielt seine Sachbearbeiter unter
    Androhung der Kündigung dazu an, sich an die starren Vorgaben zu halten. Betroffen waren unter anderen
    Gene B. Lokken und Dale Henry Tetzloff, die beide starben, sowie Glennette Kell, Darlene Buckner,
    Carol Clemens, Frank Chester Perry, Jackie Martin, William Hull und die Familie Williams; alle hatten
    nachstationäre Versorgung beantragt und wurden abgelehnt. Rund neunzig Prozent solcher Ablehnungen
    wurden im Widerspruchsverfahren wieder aufgehoben, doch nur etwa zwei Promille der Betroffenen legten
    überhaupt Widerspruch ein. Im November 2023 klagten die Betroffenen und die Nachlässe der Verstorbenen
    in Minnesota.
  sachverhalt_quelle: volltext
