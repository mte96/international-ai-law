  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Rechtlich ein Nichtergebnis, wirtschaftlich eine Weichenstellung. Die Frage, ob eine
    gemeinnützige Zwecksetzung bei der Entwicklung von KI über Verjährungsfristen hinaus bindet — die
    einzige KI-spezifische Frage des Verfahrens —, ist unbeantwortet geblieben. Aufgenommen wird der Fall
    dennoch, weil er die Governance-Struktur aller führenden US-Labore betrifft: OpenAI, Anthropic und
    xAI sind sämtlich aus gemeinnützigen oder gemeinwohlorientierten Konstruktionen hervorgegangen, und
    die Frage, wer diese Zwecksetzung durchsetzen kann, ist offen. Nach dem Urteil lautet die Antwort
    praktisch: nur der jeweilige Generalstaatsanwalt (Delaware und Kalifornien haben sich 2025 in Absichtserklärungen
    Aufsichtsrechte gesichert), nicht ein Mitgründer. Das ist eine erhebliche Verengung der Kontrolle.

    '
