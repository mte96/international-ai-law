  quelle_tracker: Wilson Sonsini; Paul Weiß; Hogan Lovells; Fenwick; RealPage IR
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Der Vergleich ist faktisch eine Verordnung über zulässige Preisalgorithmen — und
    die einzige verbindliche Regelsetzung zu algorithmischer Preisbildung, die es in den USA gibt. Vier
    Vorgaben sind übertragbar und werden Compliance-Standard werden: Datenalter (mindestens zwölf Monate),
    Aggregationsniveau (mindestens Bundesstaat), keine Asymmetrie zulasten von Preissenkungen, keine Nutzerforen
    zur Besprechung von Marktanalysen. Bemerkenswert ist, dass dieselbe Regierung, die die FTC von der
    KI-Aufsicht zurückzieht, im Kartellrecht die schärfste algorithmische Verhaltensregel der Welt durchsetzt.
    Der Grund ist politisch: Mietpreise sind ein Wahlkampfthema, Chatbot-Werbung nicht.

    '
  normen:
