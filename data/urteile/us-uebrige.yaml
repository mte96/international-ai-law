  anspruchsgrundlage: 'Title VII, 42 U.S.C. § 2000e-2; ADEA, 29 U.S.C. § 623; ADA, 42 U.S.C. § 12112;
    42 U.S.C. § 1981; Cal. Gov''t Code § 12940 (FEHA).

    '
  kernfrage: 'Kann der Anbieter eines algorithmischen Bewerberauswahlsystems selbst als "agent" des Arbeitgebers
    unmittelbar nach dem Antidiskriminierungsrecht in Anspruch genommen werden?

    '
  ergebnis: 'Richterin Rita F. Lin gab dem Klageabweisungsantrag teilweise statt. Abgewiesen wurden ohne
    Nachbesserungsmöglichkeit die Ansprüche, die Workday als "employment agency" einordneten, sowie sämtliche
    Ansprüche wegen vorsätzlicher Diskriminierung nach Title VII, ADEA und § 1981. Bestehen blieben die
    Ansprüche wegen mittelbarer Diskriminierung (disparate impact) auf der Grundlage der Agenten-Theorie:
    Workday könne als Agent seiner Kundenarbeitgeber haften und falle damit in den Anwendungsbereich der
    Arbeitgeberdefinitionen. Zur Substantiierung genüge, dass der Kläger über hundert Absagen erhalten
    habe, dass deren zeitliche Abfolge automatisierte Vorabaussortierung nahelege und dass die Trainingsdaten
    vorbelastet seien; daraus lasse sich plausibel schließen, dass die Algorithmen nach geschützten Merkmalen
    und nicht nach Eignung aussortierten. Vorausgegangen war die vollständige Klageabweisung mit Nachbesserungsmöglichkeit
    am 19.01.2024. Die EEOC hatte als amicus curiae zugunsten des Klägers Stellung genommen.

    '
  bedeutung: hoch
  volltext_url: https://storage.courtlistener.com/recap/gov.uscourts.cand.408645/gov.uscourts.cand.408645.80.0_1.pdf
  zusammenfassung_url: https://www.seyfarth.com/news-insights/mobley-v-workday-court-holds-ai-service-providers-could-be-directly-liable-for-employment-discrimination-under-agent-theory.html
  bezug_regelwerke:
  - us-il-hb3773
  - us-co-sb24-205
  instanzenzug:
  - us-2025-mobley-workday-collective
  - us-2026-mobley-workday-sac
  quelle_tracker: CourtListener/RECAP Docket 3:23-cv-00770 (N.D. Cal.), Dkt. 80 mit ECF-Kopfstempel; Civil
    Rights Litigation Clearinghouse Case 44074
  verifiziert: true
  letzte_pruefung: &id002 2026-09-05
  eigene_bewertung: 'Die wichtigste Entscheidung des US-Rechts zur Zurechnung algorithmischer Entscheidungen
    — und zwar deshalb, weil sie eine Lücke schließt, die im europäischen Recht ebenfalls klafft. Nach
    Art. 22 DSGVO und nach der KI-VO haftet der "Verantwortliche" bzw. der "Betreiber", also der Arbeitgeber;
    der Anbieter des Systems ist Dritter. Die Agenten-Konstruktion macht den Anbieter zum unmittelbaren
    Anspruchsgegner, ohne dass ein Gesetz das anordnen müsste. Das ist praktisch entscheidend, weil nur
    der Anbieter das Modell ändern kann und weil nur über ihn eine Kollektivierung über die Kundenbasis
    hinweg möglich ist. Bemerkenswert und in der Rezeption meist übersehen: Die Ansprüche wegen vorsätzlicher
    Diskriminierung sind endgültig gescheitert. Algorithmische Diskriminierung ist im US-Recht ein disparate-impact-Problem
    — und genau diese Rechtsfigur ist seit Students for Fair Admissions und dem Vorstoß der Regierung
    gegen "disparate impact liability" (Executive Order vom April 2025) politisch unter Druck. Die Angriffsfläche
    des Verfahrens liegt also nicht bei der Technik, sondern bei der Rechtsfigur.

    '
  normen:
  - dsgvo-art-22
  - usc-42-2000e-2-a
  - usc-42-2000e-b
  - usc-29-623-a
  - usc-42-12112-a
