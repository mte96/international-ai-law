  anspruchsgrundlage: California Invasion of Privacy Act, Cal. Penal Code § 631(a)
  kernfrage: 'Haftet ein Websitebetreiber wegen Beihilfe zum Abhören, wenn der Chatbot-Dienstleister die
    Gespräche zwar technisch einsehen könnte, ein tatsächliches Mitlesen aber nicht nachgewiesen ist?

    '
  ergebnis: 'Bestätigung des summarischen Urteils zugunsten von Converse aus Beweisgründen: Es sei nicht
    nachgewiesen, dass Salesforce die Nachrichten während der Übermittlung gelesen oder zu lesen versucht
    habe; ohne Haupttat keine Beihilfehaftung des Betreibers. In einer zustimmenden Sondervotum-artigen
    Stellungnahme führte Richter Bybee weiter aus, das kalifornische Abhörverbot erfasse Internetkommunikation
    überhaupt nicht, weil der Wortlaut auf "telegraph or telephone wire" abstelle und den Gesetzgeber
    von 1967 binde; für Internetdatenschutz sei der CCPA das passendere Instrument.

    '
  bedeutung: mittel
  volltext_url: https://cdn.ca9.uscourts.gov/datastore/memoranda/2025/07/09/24-4797.pdf
  zusammenfassung_url: https://www.fisherphillips.com/en/news-insights/federal-appeals-court-hands-out-win-in-website-chat-wiretap-case.html
  bezug_regelwerke:
  - us-ca-cipa
  instanzenzug:
  - us-2025-ambriz-google
  quelle_tracker: National Law Review; Fisher Phillips; Crowell & Moring
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Praktisch die wirksamste Verteidigung gegen die Welle der Chatbot-Abhörklagen — und
    sie liegt nicht im Recht, sondern im Beweis: Die Fähigkeit zum Zugriff ist nachweisbar, der Zugriff
    selbst nicht. Damit ist die Auseinandersetzung zwischen der Ambriz-Linie und der Popa-Linie faktisch
    in die Beweisaufnahme verlagert: Klagen überstehen die Klageabweisung, scheitern aber im summarischen
    Urteil. Bybees Ausführungen sind darüber hinaus der interessanteste Punkt, weil sie das strukturelle
    Problem benennen: Die gesamte KI-Datenschutzklagewelle in Kalifornien stützt sich auf ein Abhörgesetz
    von 1967. Sollte der Neunte Circuit dieser Linie folgen, bricht die Klagewelle in sich zusammen.

    '
  normen:
  - cal-pen-631-a
  sekundaerquelle_url: https://natlawreview.com/article/no-wire-no-violation-converses-cipa-win-affirmed-ninth-circuit-court-appeals
  dokumenttyp: Memorandum (not for publication)
