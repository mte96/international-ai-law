  anspruchsgrundlage: 'First Amendment; Commerce Clause; Due Process Clause; Equal Protection Clause;
    angegriffen: Colorado SB 24-205 (Colorado AI Act, algorithmische Diskriminierung). Intervention des
    Bundes gestützt auf 42 U.S.C. § 2000h-2.

    '
  kernfrage: 'Verletzt eine einzelstaatliche Pflicht, algorithmische Diskriminierung durch KI-Systeme
    zu vermeiden und zu dokumentieren, die Meinungsfreiheit und die Kompetenzordnung des Bundes?

    '
  ergebnis: 'Anhängig. xAI erhob am 09.04.2026 Klage mit sechs verfassungsrechtlichen Rügen und dem Vorbringen,
    das Gesetz belaste die KI-Entwicklung erheblich und zwinge zur Aufgabe eines an objektiver Wahrheit
    orientierten Systemverhaltens. Die Vereinigten Staaten traten am 24.04.2026 als Kläger bei; der amtierende
    Attorney General bescheinigte allgemeine öffentliche Bedeutung. Die Parteien beantragten gemeinsam
    die Aufhebung der Terminierungskonferenz und die Aussetzung der Fristen bei vorläufigem Vollzugsstopp;
    die Vollstreckung ruht bis vierzehn Tage nach der Entscheidung über den Antrag auf einstweilige Verfügung.
    Parallel hat der Gesetzgeber Colorados SB 24-205 durch das engere SB 26-189 (unterzeichnet am 14.05.2026,
    Geltung ab 01.01.2027) ersetzt. Eine Entscheidung über die einstweilige Verfügung ist bis 27.08.2026
    nicht ergangen.

    '
