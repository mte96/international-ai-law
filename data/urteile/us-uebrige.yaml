    '
  ergebnis: 'Im Februar 2026 hat der Superior Court San Francisco zwölf Verfahren gegen OpenAI zur Koordinierung
    unter JCCP No. 5431 verbunden (In re: ChatGPT Prod. Liab. Cases). Vorgeworfen wird, ChatGPT sei "unreasonably
