    OpenAIs) und Eric Goldman
  verifiziert: false
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Die erste Sachentscheidung weltweit zur Haftung für Modellhalluzinationen — und sie
    beantwortet die interessante Frage gerade nicht. Das Gericht löst den Fall über Empfängerhorizont,
    Verschulden und Schaden und muss deshalb nie sagen, wer eigentlich "spricht", wenn ein Modell eine
    Behauptung erzeugt. Die Verschuldensdogmatik ist dabei das eigentliche Problem: Die US-Ehrschutzdogmatik
    ist auf einen Sprecher mit Vorstellungsbild zugeschnitten ("knowledge of falsity or reckless disregard").
    Auf ein stochastisches Modell lässt sich das nur übertragen, wenn man auf das Wissen des Betreibers
    um die Halluzinationsrate abstellt — dann aber wäre jede bekannte Fehlerquote "reckless disregard",
    und die Haftung uferte aus. Das Gericht weicht dem aus, indem es den Warnhinweis genügen lässt. Das
    ist elegant, aber nicht dauerhaft tragfähig: Je zuverlässiger Modelle werden, desto weniger plausibel
    wird die Annahme, ein verständiger Leser nehme die Ausgabe nicht für bare Münze. Die Entscheidung
    altert also gegen sich selbst.

    '
