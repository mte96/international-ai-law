  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die drei Überlebendenklagen sind dogmatisch die interessanteren. Ein Suizid liefert
    einen scharfen Kausalitätsanker; eine "KI-induzierte Wahnstörung" nicht. Die Kläger müssen dafür einen
    Schadensbegriff etablieren, den das US-Deliktsrecht bei rein psychischen Schäden ohne körperliche
    Berührung traditionell eng führt (impact rule, zone of danger). Gelingt das, verschiebt sich das Haftungsrisiko
    von seltenen Katastrophenfällen auf die Breite der Nutzerschaft — und damit erst wird die Chatbot-Haftung
    wirtschaftlich existenziell. Der Begriff "AI delusional disorder" ist dabei Prozesstaktik: Er soll
    ein Krankheitsbild etablieren, das ein Sachverständigengutachten tragen kann.

    '
