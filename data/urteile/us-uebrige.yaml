  letzte_pruefung: *id002
  eigene_bewertung: 'Die erste Berufungsentscheidung weltweit zu KI-generiertem CSAM — und zwei Tage alt.
    Sie ist für die europäische Diskussion die wichtigste einzelne Entscheidung dieser Sammlung, weil
    sie zeigt, wie weit die Systeme auseinanderliegen. Das deutsche Recht bestraft in § 184b StGB ausdrücklich
    auch "wirklichkeitsnahe" Darstellungen ohne reales Opfer, und die Neufassung der EU-Richtlinie zur
    Bekämpfung des sexuellen Missbrauchs von Kindern erfasst KI-generiertes Material ausdrücklich. In
    den USA ist genau das nach Free Speech Coalition verfassungsrechtlich versperrt, soweit kein reales
    Kind abgebildet ist und es beim privaten Besitz bleibt. Die Trennlinie, die der Seventh Circuit zieht,
    ist dogmatisch sauber und praktisch schwer haltbar: Herstellung und Verbreitung bleiben strafbar,
    der Besitz nicht — obwohl bei generativen Modellen Herstellung und Besitz technisch derselbe Vorgang
    sind. Genau das wird die Anschlussfrage sein: Wer ein Modell lokal betreibt und ein Bild erzeugt,
    stellt her; wer dasselbe Bild speichert, besitzt. Der Fall wird beim Supreme Court landen.

    '
