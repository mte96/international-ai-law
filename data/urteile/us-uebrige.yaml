  eigene_bewertung: 'Bemerkenswert im Kontrast zu Anderegg: Wo die Darstellung eine reale Person betrifft,
    greift das Strafrecht ohne verfassungsrechtliche Probleme; wo sie niemanden abbildet, ist sie geschützt.
    Damit ist die amerikanische Systematik konsistent, wenn auch für europäische Augen befremdlich: Geschützt
    wird die identifizierbare Person, nicht das Rechtsgut. Der TAKE IT DOWN Act enthält daneben eine Löschungspflicht
    für Plattformen binnen 48 Stunden, die von der FTC durchgesetzt wird — insoweit ist er das erste Bundesgesetz
    der USA, das synthetische Inhalte materiell reguliert. Nicht verifiziert: Aktenzeichen und exaktes
    Datum des Schuldbekenntnisses.

    '
