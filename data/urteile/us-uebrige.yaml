  kernfrage: 'Erfasst das BIPA die Verwendung eines Trainingsdatensatzes mit Gesichtsvermessungen von
    Einwohnern Illinois'' durch Unternehmen, die außerhalb Illinois'' verarbeiten?

    '
  ergebnis: 'Summarisches Urteil zugunsten beider Beklagter wegen fehlender territorialer Anwendbarkeit.
    Das BIPA setze voraus, dass die beanstandeten Handlungen "primarily and substantially in Illinois"
    stattfänden. Herunterladen, Sichten und Auswerten des IBM-Datensatzes "Diversity in Faces" seien dort
    erfolgt, wo die jeweiligen Mitarbeiter oder Auftragnehmer tätig waren — in Washington und Georgia
    (Amazon) beziehungsweise in Washington und New York (Microsoft). Der Wohnsitz der Betroffenen in Illinois
    genüge nicht. Die Kläger hatten ihre Fotos zwischen 2004 und 2014 bei Flickr eingestellt; IBM hatte
    daraus einen frei für nichtkommerzielle Forschung verfügbaren Datensatz mit Gesichtsvermessungen erstellt.

    '
