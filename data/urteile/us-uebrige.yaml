  quelle_art: amtlich
  sachverhalt: 'Reginald Clay ist Lastwagenfahrer und musste sich beim Befahren und Verlassen der Anlagen
    von Union Pacific jedes Mal per Fingerabdruck ausweisen; nach seinem Vortrag wurden seine Fingerabdrücke
    etwa 1.500 Mal erfasst. John Gregg und Brandon Willis stempelten bei ihren Arbeitgebern über biometrische
    Zeiterfassungsgeräte ein, die Fingerabdruck oder Handgeometrie aufnahmen; Willis klagte zugleich für
    eine Gruppe. Alle drei stützten sich auf das Biometriegesetz von Illinois, das je Verstoß einen gesetzlich
    festgelegten Betrag von 1.000 beziehungsweise 5.000 US-Dollar zuspricht und diesen bislang für jeden
    einzelnen Scan gewährte. Während ihre Verfahren liefen, änderte der Gesetzgeber von Illinois das Gesetz:
    Der am 2. August 2024 unterzeichnete und am selben Tag in Kraft getretene Public Act 103-0769 stellte
    klar, dass die wiederholte Erhebung desselben Merkmals derselben Person auf demselben Weg nur einen
    einzigen Verstoß darstellt und nur einmal Ersatz auslöst. Die Beklagten beriefen sich sofort darauf;
    die Kläger hielten die Änderung für nicht rückwirkend.'
