  anspruchsgrundlage: 'California strict product liability (design defect, failure to warn); negligence;
    wrongful death (Cal. Code Civ. Proc. § 377.60); Cal. Bus. & Prof. Code § 17200.

    '
  kernfrage: 'Haftet der Anbieter eines Allzweck-Sprachmodells für den Suizid eines Minderjährigen, wenn
    die Sicherheitsmechanismen des Modells zugunsten von Nutzerbindung zurückgenommen wurden?

    '
  ergebnis: 'KEINE ENTSCHEIDUNG IN DER SACHE. Klage erhoben am 26.08.2025. Sie stützt sich nicht auf einzelne
    Äußerungen, sondern auf die Architektur: OpenAI habe bei GPT-4o Abbruchmechanismen entfernt, die Gespräche
    bei erkannter Suizidplanung beendet hätten, und anthropomorphe Gestaltung sowie simulierte Empathie
    zugunsten von Verweildauer eingesetzt. OpenAI hält dem entgegen, das Modell habe über hundertmal auf
    Hilfsangebote verwiesen, der Nutzer habe die Schutzmechanismen bewusst umgangen und gegen die Nutzungsbedingungen
    verstoßen, und es habe eine vorbestehende Suizidalität gegeben.

    VERFAHRENSSTAND: Mit Beschluss vom 03.02.2026 (Hon. Stephen M. Murphy, Dept. 606) wurde dem Antrag
    auf Koordination stattgegeben; Raine v. OpenAI, Inc., CGC-25-628528, ist eines von acht koordinierten
    Verfahren der "ChatGPT Product Liability Cases", JCCP 5431 (ferner Fox 25STCV32379, Shamblin 25STCV32382,
    Madden 25STCV32383, Brooks 25STCV32386, Lacey CGC-25-630808, Enneking CGC-25-630809, Irwin CGC-25-630811).
    Erste Case Management Conference am 24.07.2026, Case Management Order No. 1 vom 04.08.2026, nächste
    Konferenz 23.09.2026; zuständig Richter Ethan P. Schulman, Department 304. Ein Verhandlungstermin
    ist nicht bestimmt.

    '
