    wenn ein Dienstleister Preis-, Mengen- und Kostendaten der größten Wettbewerber aufbereitet?

    '
  ergebnis: 'Vergleichsvorschlag kurz vor dem für Anfang Mai 2026 angesetzten Verfahrensbeginn; ein Antrag
    von Agri Stats auf summarisches Urteil war im Februar 2026 zurückgewiesen worden. Die Verfügung verpflichtet
    Agri Stats: Preisberichtsdienste einzustellen; Daten nur anonymisiert und aggregiert auf Quartilsebene
    auszuweisen; Informationen erst nach mindestens 45 Tagen (bei Produktionsentscheidungen 90 Tagen)
    verfügbar zu machen; und sämtliche Berichte auch konkurrierenden Abnehmern zugänglich zu machen, nicht
    nur den Fleischverarbeitern. Klage war am 28.09.2023 erhoben worden.

