    nicht-weißen Sprechern erhöht sei; sie habe trotz guter Leistungsbeurteilungen künstlich niedrige
    Bewertungen erhalten, eine Beförderung sei ihr verweigert und eine angemessene Vorkehrung nicht gewährt
    worden. Ein Ausgang ist bis 27.08.2026 nicht bekannt geworden.

