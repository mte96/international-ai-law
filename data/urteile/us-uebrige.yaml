    über den California Court of Appeal und ggf. den California Supreme Court eine Bindungswirkung erlangen
    können, die ein District Court in Florida nie hatte. Wer die US-Chatbot-Haftung verfolgen will, sollte
    ab Herbst 2026 dieses Aktenzeichen beobachten, nicht mehr Garcia. Bemerkenswert ist die Parallelstruktur:
    JCCP im einzelstaatlichen System, kein MDL im Bundessystem — das Judicial Panel on Multidistrict Litigation
    hat bis August 2026 keine Konsolidierung angeordnet. Das erhöht die Wahrscheinlichkeit divergierender
    Entscheidungen erheblich.

    '
