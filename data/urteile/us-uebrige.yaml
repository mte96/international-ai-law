  eigene_bewertung: 'Das verfassungsrechtlich wichtigste anhängige KI-Verfahren der USA — und dogmatisch
    das kühnste. Die Behauptung, eine Pflicht zur Vermeidung algorithmischer Diskriminierung zwinge den
    Anbieter zu unwahren Ausgaben und verletze damit dessen Meinungsfreiheit, verlangt zwei Schritte,
    die beide nicht gesichert sind: dass Modellausgaben Rede sind, und dass Diskriminierungsvermeidung
    eine inhaltliche Steuerung dieser Rede ist. Wäre der erste Schritt erfolgreich, wäre er die erste
    gerichtliche Bejahung der Sprechereigenschaft von Modellen überhaupt — und sie käme, ironischerweise,
    aus einem Verfahren, in dem der Anbieter sie zur Abwehr von Regulierung geltend macht, während dieselbe
    Branche sie in Haftungsverfahren zur Abwehr von Ansprüchen benötigt. Der zweite Punkt ist die Beteiligung
    des Bundes: Das DOJ interveniert auf Seiten eines privaten Unternehmens gegen ein einzelstaatliches
    Antidiskriminierungsgesetz — gestützt auf eine Norm des Civil Rights Act von 1964. Praktisch entschieden
    hat den Streit allerdings nicht das Gericht, sondern der Gesetzgeber Colorados, der das Gesetz vor
    einer Entscheidung entschärft hat. Das ist die eigentliche Lehre: Der Drohwert der Klage war größer
    als ihr Erfolgsaussicht.

    '
