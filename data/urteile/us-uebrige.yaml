  kernfrage: 'Gilt die 2024 eingeführte Begrenzung des BIPA-Schadensersatzes auf eine einzige Zuerkennung
    je Person auch für bereits anhängige Verfahren?

    '
  ergebnis: 'Der Seventh Circuit entschied, die Änderung wirke zurück und erfasse alle bei ihrem Inkrafttreten
    anhängigen Verfahren. Nach illinoisischem Recht seien Änderungen der Rechtsfolgenseite "remedial"
    und damit verfahrensrechtlich; der Gesetzgeber habe § 20 (Rechtsfolgen), nicht § 15 (Verhaltenspflichten)
    geändert und das Klagerecht unberührt gelassen. Verfassungsrechtliche Bedenken bestünden nicht. Folge:
    Wer tausendfach gescannt wurde, erhält den gesetzlichen Betrag einmal, nicht je Scan — die zuvor drohenden
    Milliardenhaftungen entfallen. Tenor: "REVERSED AND REMANDED" — die drei Ausgangsverfahren gehen an
    die District Courts des Northern District of Illinois zurück; über die Auswirkungen auf die sachliche
    Zuständigkeit haben diese neu zu befinden.

    '
