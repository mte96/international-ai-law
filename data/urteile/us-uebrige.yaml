  kernfrage: 'Ist eine Gruppe angemessen vertreten, wenn kein einziger Gruppenvertreter ausschließlich
    der benachteiligten bundesweiten Untergruppe angehört?

    '
  ergebnis: 'Der Seventh Circuit hob die Genehmigung des Vergleichs am 13.07.2026 auf. Dem Verfahren fehlten
    die von Fed. R. Civ. P. 23 verlangten strukturellen Schutzvorkehrungen: Alle acht ursprünglichen Gruppenvertreter
    gehörten den bevorzugten einzelstaatlichen Untergruppen an; kein Vertreter stand allein für die bundesweite
    Gruppe, die die geringste Zuteilung erhielt. Damit bestand ein unauflösbarer Interessenkonflikt bei
    der Verteilung. Die Sache wurde zurückverwiesen; das Berufungsgericht wies den District Judge an,
    bei einem neuen Vergleichsvorschlag den Austausch sämtlicher ursprünglicher Gruppenvertreter zu erwägen,
    weil bereits die früheren Auswechslungen auf unzureichenden Interessenschutz hindeuteten.

    '
  bedeutung: hoch
