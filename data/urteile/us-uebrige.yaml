  eigene_bewertung: 'Der eigentliche Hebel. Ohne Kollektivierung wäre algorithmische Diskriminierung praktisch
    nicht justiziabel, weil der einzelne Bewerber weder von der Aussortierung erfährt noch sie beweisen
    kann. Die dogmatische Neuerung ist die Umdeutung der Software zur "gemeinsamen Politik" verschiedener,
    voneinander unabhängiger Arbeitgeber — das ist im Kern dieselbe Denkfigur, die im Kartellrecht bei
    Cornish-Adebiyi zur Bejahung einer Absprache führt: Der geteilte Algorithmus ersetzt die Koordination.
    Rechtsvergleichend ist das der Punkt, an dem das US-Recht dem europäischen voraus ist: Die KI-VO kennt
    keine kollektive Rechtsdurchsetzung, und Art. 22 DSGVO wird individuell geltend gemacht. Die Zahl
    der Opt-in-Kläger ist nicht zu ermitteln gewesen.

    '
