  ergebnis: 'Vergleich durch consent decree über 365.000 US-Dollar. Vorgeworfen war, die Bewerbungssoftware
    sei so eingestellt gewesen, dass Bewerberinnen ab 55 und Bewerber ab 60 Jahren automatisch abgelehnt
