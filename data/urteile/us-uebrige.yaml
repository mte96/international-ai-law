  anspruchsgrundlage: 'ECPA, 18 U.S.C. § 2510 ff.; CFAA, 18 U.S.C. § 1030; CIPA, Cal. Penal Code § 631(a);
    Cal. Penal Code § 502 (CDAFA); Cal. Bus. & Prof. Code § 17200; Persönlichkeitsdelikte des common law;
    in einem Einzelverfahren 740 ILCS 14 (BIPA, Stimmabdruck).

    '
  kernfrage: 'Verletzt ein KI-Protokolldienst, der über die Kalendereinbindung automatisch an Videokonferenzen
    teilnimmt, das Allparteien-Einwilligungserfordernis gegenüber Teilnehmern, die ihn nicht beauftragt
    haben?

    '
  ergebnis: 'Anhängig. Die Verfahren wurden am 22.10.2025 verbunden, die konsolidierte Klage am 05.12.2025
    eingereicht. Die Anhörung über den Klageabweisungsantrag fand am 20.05.2026 statt; die Entscheidung
    stand am 27.08.2026 noch aus. Vorgeworfen wird, der OtterPilot-Bot trete über Kalendereinbindungen
    automatisch Konferenzen auf Zoom, Microsoft Teams und Google Meet bei und zeichne, transkribiere und
    speichere die Gespräche ohne Kenntnis und Einwilligung aller Teilnehmer.

    '
