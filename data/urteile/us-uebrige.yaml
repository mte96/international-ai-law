  anspruchsgrundlage: 'TAKE IT DOWN Act (Public Law 119-12 vom 19.05.2025), Strafnorm zur Verbreitung
    nicht einvernehmlicher intimer Abbildungen einschließlich "digital forgeries"; ferner Cyberstalking,
    18 U.S.C. § 2261A, und 18 U.S.C. § 1466A.

    '
  kernfrage: 'Ist die Verbreitung KI-erzeugter intimer Abbildungen realer Personen ohne deren Einwilligung
    nach dem neuen Bundesstrafrecht strafbar?

    '
  ergebnis: 'Erste Verurteilung überhaupt nach dem TAKE IT DOWN Act; Schuldbekenntnis im April 2026. Der
    Angeklagte hatte Deepfakes erstellt, die Frauen in sexuellen Situationen zeigten, sowie Kindergesichter
    in pornografisches Material montiert. Die Strafzumessung stand zum Zeitpunkt der ausgewerteten Berichterstattung
    (28.04.2026) noch aus; der Strafrahmen beträgt bis zu zwei Jahre für die Verbreitung intimer Abbildungen
    Erwachsener und bis zu drei Jahre bei Minderjährigen.

    '
  bedeutung: mittel
  volltext_url: null
  zusammenfassung_url: https://www.nbcnews.com/tech/security/first-person-convicted-law-criminalizing-intimate-deepfakes-rcna267236
