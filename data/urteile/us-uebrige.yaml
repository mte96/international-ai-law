    '
  kernfrage: 'Sind Pflichten zur Risikoabschätzung und zur Berücksichtigung des Kindeswohls bei der Gestaltung
    algorithmischer Dienste zu unbestimmt, um vor dem First Amendment Bestand zu haben?

    '
  ergebnis: 'Bestätigung teilweise, Aufhebung teilweise. Bestätigt wurde die einstweilige Untersagung
    der Vorschriften zur Datennutzung (§ 1798.99.31(b)(1)-(4)) und zu "dark patterns" (§ 1798.99.31(b)(7))
    wegen Unbestimmtheit: Begriffe wie "materially detrimental" und "best interests of children" ließen
    sich nicht prospektiv auf eine weltweite Nutzerschaft anwenden. Aufgehoben wurde die Untersagung hinsichtlich
    der Anwendungsbereichsdefinition ("likely to be accessed by children") und der Altersschätzungspflicht
    (§ 1798.99.31(a)(5)): NetChoice habe den nach Moody v. NetChoice erforderlichen Nachweis nicht geführt,
    dass die verfassungswidrigen Anwendungen die zulässigen erheblich überwögen. Besetzung: M. Smith,
    Bennett, Johnstone; Verfasser M. Smith.

    '
  bedeutung: mittel
  volltext_url: https://cdn.ca9.uscourts.gov/datastore/opinions/2026/03/12/25-2366.pdf
  zusammenfassung_url: https://netchoice.org/netchoice-v-bonta/
