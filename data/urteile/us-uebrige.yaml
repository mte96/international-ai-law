  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die Gegenentscheidung zu Ambriz — und die Divergenz ist real: Wo Ambriz die Fähigkeit
    genügen lässt, verlangt Popa den Nachweis tatsächlicher Erhebung sensibler Daten. Formal lässt sich
    beides unterscheiden (Telefonanruf gegen Websiteverfolgung, materielle Anspruchsvoraussetzung gegen
    Klagebefugnis), praktisch stehen sich zwei Grundhaltungen gegenüber: Ist die Verarbeitungsmöglichkeit
    schon die Verletzung, oder erst die Verarbeitung? Genau diese Frage entscheidet, ob KI-Dienstleistungsketten
    überhaupt datenschutzrechtlich angreifbar sind. Nicht verifiziert: Aktenzeichen und exakte Fundstelle
    der Entscheidung.

