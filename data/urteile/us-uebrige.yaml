    Unternehmen zuweist, den Anforderungen an eine angemessene Gruppenvertretung genügen?

    '
  ergebnis: 'Das Gericht genehmigte am 20.03.2025 einen Vergleich mit einem Nennwert von rund 51,75 Mio.
    US-Dollar, der nicht in Geld, sondern in Eigenkapital an Clearview AI bestand: Gruppenmitglieder aus
    Illinois erhielten 10 Anteile, aus Kalifornien, New York und Virginia je 5, Mitglieder allein der
    bundesweiten Gruppe je 1. Die Werthaltigkeit hängt von einem künftigen Börsengang, einer Verschmelzung
    oder einem Verkauf ab. Hintergrund war, dass Clearview zahlungsunfähig war und parallel Behördenverfahren
    geführt wurden. Vorausgegangen war der Consent Order vor dem Circuit Court of Cook County (ACLU v.
    Clearview AI, Mai 2022), der Clearview den Verkauf der Datenbank an Private bundesweit untersagt.

    '
