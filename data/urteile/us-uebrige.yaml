  sachverhalt: Mary Louis, 54 Jahre alt und schwarz, bezog einen Wohngutschein, der rund 69 Prozent ihrer
    Miete deckte, und bewarb sich um eine Wohnung in der Anlage Granada Highlands der Metropolitan Management
    Group. Ihre Bewerbung wurde abgelehnt, weil der SafeRent-Score — eine Zahl zwischen 200 und 800, errechnet
    aus Kredithistorie, Insolvenzen, offenen Forderungen, Zahlungsverhalten und Räumungsvorgeschichte
    — unter der Schwelle des Vermieters lag; die Zahlungsgarantie des Gutscheins fließt in diesen Wert
    nicht ein. Auf ihren Widerspruch teilte die Verwaltung mit, man nehme Widersprüche nicht entgegen
    und könne das Ergebnis der Prüfung nicht übersteuern; Louis musste in eine teurere Wohnung mit weniger
    Ausstattung in einem Viertel mit hoher Kriminalität ziehen. Monica Douglas, 65 Jahre alt und ebenfalls
    schwarz, deren Gutschein rund 57 Prozent ihrer Miete deckte, wurde zunächst wegen "unbefriedigender
    Kredithistorie" und eines Eintrags aus einem Mietgerichtsverfahren abgelehnt und erst nach einem mit
    Hilfe einer Wohnungsinitiative eingelegten Widerspruch angenommen. Gemeinsam mit der Community Action
    Agency of Somerville klagten sie gegen SafeRent Solutions und Metropolitan.
