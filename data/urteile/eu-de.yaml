    Il Sole 24 Ore NT+ Diritto; Iusletter; European Law Blog
  verifiziert: true
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Die wichtigste europäische Aufsichtsentscheidung des Jahres, und sie stammt nicht
    von einer Aufsichtsbehörde. Das Gericht hat eine Vollzugslücke aufgezeigt, die strukturell ist: Ein
    Anbieter kann ohne Niederlassung in den Markt eintreten, die während dieser Phase verhängten vorläufigen
    Maßnahmen absorbieren und sich dann, wenn er sich niederlässt, die anhängigen Sanktionen in ein Forum
    seiner Wahl verlagern, bevor eine von ihnen abgeschlossen ist. Für die deutsche Praxis heißt das:
    Verfahren deutscher Aufsichtsbehörden gegen KI-Anbieter ohne EWR-Niederlassung sind mit dem Risiko
    behaftet, durch eine spätere Niederlassungsentscheidung entwertet zu werden. Ob die Entscheidung Bestand
    hat, ist offen; eine Rechtsmitteleinlegung war nicht feststellbar. Materiell ist zur Rechtsgrundlage
    des KI-Trainings weiterhin nichts entschieden.

    '
  normen:
  - dsgvo-art-56-abs-1
  sekundaerquelle_url: https://www.europeanlawblog.eu/pub/92oig1ws
  pruefvermerk:
  - 'Amtliche Fundstelle nicht auffindbar: Gesucht wurde das Urteil des Tribunale Ordinario di Roma, Sezione
    diritti della persona e immigrazione, R.G. 4785/2025 (OpenAI gegen den Garante per la protezione dei
    dati personali; Aufhebung der Gel'
  - 'AN AMTLICHER QUELLE GEPRÜFT (05.09.2026): Der Garante per la protezione dei dati personali hat den
    docweb-Eintrag 10085455 mit folgendem Vermerk versehen: ''Il provvedimento n. 755 del 2 novembre 2024
    è stato temporaneamente rimosso dal sito web del Garante per la protezione dei dati personali a seguito
    della sentenza del Tribunale di Roma n. 4153/2026, pubbl. il 18/03/2026, con la quale è stata accolta
    l''opposizione proposta avverso il provvedimento del Garante.'''
  - Damit sind Gericht, Sentenza-Nummer (4153/2026), Veröffentlichungsdatum (18.03.2026) und Ergebnis
    (Stattgabe der opposizione, Aufhebung) an einer amtlichen Quelle belegt. Die R.G.-Nummer 4785/2025
    ist durch die ausgewertete Fachberichterstattung gedeckt.
  - 'Bezeichnung des Spruchkörpers: Der Eintrag führt ''Sezione diritti della persona e immigrazione'';
    die Fachberichterstattung schreibt ''Sezione Diritti Umani e Immigrazione''. Beide Bezeichnungen kursieren;
    der amtliche Vermerk nennt keinen Spruchkörper. Nicht geändert.'
