  ecli: null
  datum: 2024-12-17
  parteien:
    klaeger: Irische Datenschutzkommission (antragstellende Aufsichtsbehörde)
    beklagter: — (Stellungnahme nach Art. 64 Abs. 2 DSGVO)
  status: rechtskraeftig
  themenachsen:
