  quelle_tracker: justiz.bayern.de PM 16/2026; JUVE Patent; LTO; beck-aktuell; GEMA; MusikWoche
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die international folgenreichste deutsche Aussage steckt nicht im Urheberrecht, sondern
    im Kollisionsrecht: Ein in den USA durchgeführtes Training wird erfasst, wenn das Modell anschließend
    in Europa betrieben wird. Damit lässt sich die US-Fair-Use-Doktrin nicht mehr als Standortvorteil
    nutzen — genau der Punkt, an dem die Kammer sich ausdrücklich von Bartz und Kadrey absetzt. Zweitens
    verschiebt das Urteil den Gegenstand von Text auf Komposition; die Zufallsverteidigung, die bei kurzen
    Textfragmenten noch trug, wird bei Melodie, Harmonie und Rhythmus statistisch unhaltbar. Drittens
    ist der § 95a-Vorwurf der eigentliche Hebel: Er trifft die Beschaffung, nicht das Training, und ist
    schrankenfest.

    '
