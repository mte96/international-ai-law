  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Aufgenommen, weil der Auftrag deutsche Aufsichtsentscheidungen verlangt — der Befund
    ist aber ein Negativbefund und als solcher wichtig: Bis zum 27.08.2026 hat KEINE deutsche Datenschutzaufsichtsbehörde
    eine veröffentlichte Abhilfe- oder Bußgeldentscheidung gegen einen Anbieter generativer KI-Modelle
    erlassen. Die deutsche Aufsicht arbeitet ausschließlich mit Orientierungshilfen, während Italien Verfahren
    führt und Irland verhandelt. Für die Mandatsberatung heißt das: Die deutschen Papiere sind der praktische
    Prüfmaßstab, aber sie sind nicht justitiabel, und sie sind gegenüber EDSA 28/2024 in Teilen überholt.

    '
