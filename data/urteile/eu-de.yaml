  anspruchsgrundlage: Art. 56 Abs. 1 DSGVO (One-Stop-Shop, federführende Aufsichtsbehörde); EDSA-Stellungnahme
    8/2019
  kernfrage: Bleibt eine nationale Aufsichtsbehörde für ein bereits eingeleitetes Verfahren zuständig,
    wenn der Verantwortliche während des laufenden Verfahrens eine Hauptniederlassung in einem anderen
    Mitgliedstaat begründet?
  ergebnis: 'Nein; die Sanktionsentscheidung des Garante — Provvedimento n. 755 vom 02.11.2024 mit einer
    Geldbuße von 15 Mio. Euro — wurde vollständig aufgehoben, allein aus Zuständigkeitsgründen und ohne
    materielle Prüfung der DSGVO-Verstöße. Nachdem OpenAI Ireland Ltd. am 15.02.2024 als einzige Niederlassung
    im EWR anerkannt worden war, sei nach dem One-Stop-Shop-Mechanismus (Art. 55, 56, 60 DSGVO) die irische
    Aufsichtsbehörde federführend und der Garante nicht mehr zuständig gewesen. Die federführende Zuständigkeit
    könne bis zum Erlass einer endgültigen Entscheidung auf eine neu zuständige Behörde übergehen; maßgeblich
    sei das Kriterium der endgültigen Entscheidung, nicht die Art des Verstoßes. Die Unterscheidung des
    Garante zwischen fortdauernden und abgeschlossenen Verstößen wies das Gericht zurück. Tenor am 18.03.2026
    veröffentlicht, vollständige Gründe am 28.05.2026. Die materiellen Fragen — Rechtsgrundlage des KI-Trainings,
    Transparenz, Altersprüfung — blieben unentschieden. Der Garante hat das aufgehobene Provvedimento
    daraufhin von seiner Website entfernt.

    '
  bedeutung: hoch
  volltext_url: https://www.garanteprivacy.it/web/guest/home/docweb/-/docweb-display/docweb/10085455
  zusammenfassung_url: https://www.freevacy.com/news/reuters/italian-court-overturns-eur15m-gdpr-fine-against-openai/7241
  bezug_regelwerke:
