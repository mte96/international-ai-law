  eigene_bewertung: 'Die meistzitierte deutsche KI-Haftungsentscheidung des Jahres — und zugleich diejenige,
    deren prozessualer Wert am gründlichsten überschätzt wird. Sie erging im einstweiligen Verfügungsverfahren,
    wurde mit der Berufung angegriffen und ist durch den Vergleich vor dem OLG München gegenstandslos
    geworden. Wer sie als "Urteil des LG München I" zitiert, muss diesen Zusatz mitführen; eine obergerichtliche
    Bestätigung gibt es gerade nicht, und der Vergleich hat die Klärung verhindert.

    Inhaltlich bleibt die Formel wertvoll: Verdichtung fremder Information zu eigener Aussage begründet
    Eigeninhalt. Sie ist auf jedes RAG-System übertragbar und entzieht generativen Suchfunktionen die
    Berufung auf Art. 6 DSA. Sie steht in offenem Widerspruch zur vier Tage späteren Berliner Formel,
    Google schaffe nur die technischen Voraussetzungen. Dass beide Kammern denselben Dienst gegensätzlich
    einordnen, ist kein Zufall der Anspruchsgrundlage, sondern eine echte Zurechnungsdivergenz — und sie
    bleibt nach dem Vergleich ungeklärt. Die nächste Kammer, die damit befasst wird, entscheidet auf unverändert
    offenem Feld.

    '
