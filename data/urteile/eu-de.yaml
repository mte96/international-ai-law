  kernfrage: Schützt das allgemeine Persönlichkeitsrecht die Stimme auch gegen eine KI-generierte Nachahmung,
    und wie bemisst sich der Schadensersatz?
  ergebnis: 'Das allgemeine Persönlichkeitsrecht schützt die Stimme als Merkmal der Persönlichkeit. Es
    macht keinen Unterschied, ob eine wiedererkennbare Stimme imitiert oder mithilfe von KI nachgeahmt
    wird. Der Beklagte hatte zwei Videos mit einer KI-Nachahmung der bekannten Synchronstimme vertont,
    ohne Einwilligung und ohne Kennzeichnung als KI-generiert. Auch bei analoger Anwendung des § 23 Abs.
    1 KUG bleibt die Nutzung rechtswidrig; weder zeitgeschichtliche Relevanz noch legitime künstlerische
    Zwecke lagen vor. Fiktive Lizenzgebühr nach § 287 Abs. 2 ZPO: mindestens 2.000 Euro je Video, insgesamt
    4.000 Euro, bemessen nach Bekanntheit des Klägers, Reichweite des Kanals (rund 190.000 Abonnenten)
    und vergleichbaren Mindesthonoraren.

    '
