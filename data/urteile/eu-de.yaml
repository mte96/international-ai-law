    oder Ähnliches" untersagte, sowie um die automatisierte Prüfung von Bild-Text-Paaren zum Aufbau eines
    Datensatzes von 5,85 Mrd. Bild-Text-Paaren; gespeichert wurden nur URLs und Metadaten, nicht die Bilder.
    Beide Vorinstanzen haben die Nutzung sowohl nach § 44b als auch nach § 60d UrhG und unter Berücksichtigung
    des Dreistufentests für zulässig gehalten. Hinweisbeschlüsse sind nicht veröffentlicht. Stand 07.09.2026:
    Die Verhandlung hat am 03.09.2026 stattgefunden. Nach der amtlichen Terminübersicht des BGH ist Verkündungstermin
    am 17.12.2026, 8:45 Uhr. Eine Entscheidung ist noch nicht ergangen.

