  anspruchsgrundlage: § 87 Abs. 1 Nr. 1 und Nr. 6 BetrVG; § 85 Abs. 2 ArbGG (einstweilige Verfügung)
  kernfrage: Ist die Erlaubnis, ChatGPT und vergleichbare KI-Anwendungen über private Accounts im Browser
    zu nutzen, samt zugehöriger Nutzungsrichtlinie mitbestimmungspflichtig?
  ergebnis: 'Nein; sämtliche Anträge des Konzernbetriebsrats zurückgewiesen. Zu § 87 Abs. 1 Nr. 1 BetrVG:
    Die Arbeitgeberin hatte den Beschäftigten lediglich ein neues Arbeitsmittel unter bestimmten Bedingungen
    zur Verfügung gestellt; das betrifft das mitbestimmungsfreie Arbeitsverhalten, nicht das Ordnungsverhalten.
    Vorgaben und Hinweise zur Nutzung eines neuen Arbeitsmittels unterfallen damit nicht der Mitbestimmung.
    Zu § 87 Abs. 1 Nr. 6 BetrVG: Kein Mitbestimmungsrecht, weil die Beschäftigten private Accounts nutzten,
    die Anwendungen browserbasiert ohne Installation auf Firmenhardware liefen und der Arbeitgeber keinen
    Zugriff auf Nutzungsdaten hatte — es fehlt an einer zur Überwachung bestimmten technischen Einrichtung.

    '
