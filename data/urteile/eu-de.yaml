  anspruchsgrundlage: § 14 MarkenG; Art. 9 UMV — markenmäßige Benutzung
  kernfrage: Benutzt eine Suchmaschine eine Marke markenmäßig, wenn ihre KI-Übersicht auf Anbieter von
    Duftzwillingen verweist und dabei die Marke nennt?
  ergebnis: 'Nein. Google benutzt die Marken nicht markenmäßig; es schaffe lediglich die technischen Voraussetzungen
    dafür, dass die Inhalte Dritter im jeweiligen Text dargestellt werden. Markenmäßige Benutzung erfordere
    ein aktives Verhalten; die Verkehrskreise verstünden die Übersichten als aggregierte Suchergebnisse,
    nicht als eigene kommerzielle Aussage der Suchmaschine. Antrag auf einstweilige Verfügung zurückgewiesen.

    '
