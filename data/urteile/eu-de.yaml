  kernfrage: Haftet der Betreiber eines Sprachmodells auf Unterlassung für eine halluzinierte unwahre
    Tatsachenbehauptung, und entlastet ihn ein Disclaimer über die Fehleranfälligkeit der KI?
  ergebnis: 'Der Betreiber haftet. Grok hatte behauptet, Campact e.V. erhalte erhebliche Mittel aus dem
    Bundeshaushalt — eine frei erfundene Tatsachenbehauptung. Die Kammer rechnete die Äußerung dem Betreiber
    als eigene zu, nicht dem Nutzer, der den Prompt eingab. Ein Warnhinweis auf mögliche Fehler der KI
    genügt nicht, um die Haftung auszuschließen; Unterlassung zugesprochen.

    '
