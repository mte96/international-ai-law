    Vertragspartner eine verbotene automatisierte Entscheidung nach Art. 22 Abs. 1 DSGVO?
  ergebnis: 'Ja. Der Kammer folgend ist der Begriff der automatisierten Entscheidung nach C-634/21 so
    weit auszulegen, dass er das Ergebnis der Berechnung der Fähigkeit einer Person zur Erfüllung künftiger
    Zahlungsverpflichtungen in Form eines Wahrscheinlichkeitswerts erfasst. Die Mitteilung automatisiert
    berechneter Scores an potentielle Vertragspartner stelle einen erheblich größeren Eingriff dar als
    die vom BGH in VI ZR 10/24 behandelte Konstellation. Unterlassungsanspruch bejaht.

    '
