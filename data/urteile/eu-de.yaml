  anspruchsgrundlage: §§ 823 Abs. 1, 1004 BGB analog (Unternehmenspersönlichkeitsrecht, eingerichteter
    und ausgeübter Gewerbebetrieb)
  kernfrage: Haftet der Betreiber eines Portals, das amtliche Registerdaten per Software automatisiert
    auswertet und verknüpft, als unmittelbarer Täter für eine dadurch erzeugte Falschinformation über
    ein Unternehmen?
  ergebnis: 'Ja. Der Beklagte hatte bewusst eine Software für die Beantwortung von Suchanfragen eingesetzt,
    die unzureichend programmiert war, um Zuordnungsfehler zu erkennen; dem Kläger wurde fälschlich die
    Löschungsmitteilung eines anderen Unternehmens zugeordnet. Der Einwand vollautomatisierter Prozesse
    entlastet nicht. Durch die Bündelung und Verknüpfung amtlicher Bekanntmachungen habe der Betreiber
    erkennbar Verantwortung für den Inhalt übernommen. Die Wiederholungsgefahr entfiel trotz Löschung
    nicht, weil das fehleranfällige System unverändert weiterbetrieben wurde.

    '
