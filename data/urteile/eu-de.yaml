  hinweis_widerspruch: 'Der Status "rechtsmittel" ist am 07.09.2026 nicht belegt. Amtlich belegt ist allein,
    dass der Senat die Revision zugelassen hat (Pressemitteilung des OLG Hamm vom 12.05.2026 über justiz.nrw.de)
    — nicht, dass sie eingelegt wurde. Die Verbraucherzentrale NRW als Klägerin schreibt dagegen auf ihrer
    Urteilsseite mit Stand 01.06.2026, das Urteil sei rechtskräftig. Das ist fristrechtlich zweifelhaft:
    Die Revisionsfrist beträgt nach § 548 ZPO einen Monat ab Zustellung des vollständigen Urteils, war
    am 01.06.2026 also auch bei sofortiger Zustellung nicht abgelaufen; "rechtskräftig" setzt daher einen
    Rechtsmittelverzicht voraus oder ist ungenau. Ein BGH-Aktenzeichen ist über dejure, justiz.nrw.de,
    LTO und medien-internet-und-recht.de nicht auffindbar.'
  sachverhalt: Die Aesthetify GmbH bietet ästhetisch-medizinische Behandlungen an und ließ auf ihrer Website
    einen KI-Chatbot Auskunft über das Unternehmen geben. Der Chatbot bezeichnete die beiden Geschäftsführer
    als „Facharzt für plastische und ästhetische Chirurgie" und als „Facharzt für ästhetische Medizin"
    — Bezeichnungen, die es so nicht gibt und die die beiden auch nicht führen. Die Verbraucherzentrale
    Nordrhein-Westfalen e.V., ein nach § 4 UKlaG eingetragener Verband, mahnte das Unternehmen ab. Sie
    erhob anschließend Unterlassungsklage und verlangte daneben 260 Euro Abmahnkosten; für eine solche
    Klage ist nach § 6 Abs. 1 Satz 1 UKlaG das Oberlandesgericht Hamm in erster Instanz ausschließlich
    zuständig.
