  ergebnis: 'Die DSK hat drei aufeinander aufbauende Dokumente veröffentlicht: die Orientierungshilfe
    "Künstliche Intelligenz und Datenschutz" vom 06.05.2024 (Grundanforderungen an den Einsatz von KI-Systemen
    unter der DSGVO), die Orientierungshilfe zu empfohlenen technischen und organisatorischen Maßnahmen
    bei Entwicklung und Betrieb von KI-Systemen (Juni 2025) sowie das Papier zu den datenschutzrechtlichen
    Besonderheiten generativer KI-Systeme mit RAG-Methode (Oktober 2025). Fassungen aus 2026 sind nicht
    veröffentlicht.

    '
  bedeutung: mittel
  volltext_url: https://www.datenschutzkonferenz-online.de/orientierungshilfen.html
