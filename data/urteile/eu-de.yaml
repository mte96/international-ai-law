  kernfrage: Bleibt ein menschlich verfasster Liedtext geschützt, wenn die Musik mit KI ergänzt wird,
    und wie ist der menschliche Schöpfungsanteil im Eilverfahren glaubhaft zu machen?
  ergebnis: 'Der menschlich verfasste Text bleibt geschützt, auch wenn die Musik per KI hinzugefügt wurde.
    Bestreitet der Gegner die menschliche Urheberschaft, muss der Anspruchsteller darlegen, welche Gestaltungselemente
    auf menschlicher Tätigkeit beruhen. Im Eilverfahren genügt hierfür eine eidesstattliche Versicherung.
    Abgegrenzt wird zwischen menschlich geschaffenem Text mit KI-Unterstützung (schutzfähig) und reinem
    Prompt-Output (nicht schutzfähig).

    '
