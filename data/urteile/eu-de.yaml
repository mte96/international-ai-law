  - urhg-44b
  - urhg-95a
  - urhg-97
  sachverhalt: Die GEMA stellte fest, dass der Musikdienst Suno auf einfache Eingaben hin Tonaufnahmen
    ausgab, in denen Melodie, Harmonie und Rhythmus geschützter Kompositionen ihres Repertoires wiederzuerkennen
    waren — darunter „Forever Young", „Atemlos durch die Nacht", „Mambo No. 5", „Cheri Cheri Lady" und
    „Daddy Cool". Das Training des Modells hatte Suno Inc. in den Vereinigten Staaten durchgeführt; angeboten
    wird der Dienst auch in Europa. Nach dem Vortrag der GEMA hatte Suno zum Aufbau der Trainingsdaten
    außerdem Tonspuren von YouTube mitgeschnitten und dabei technische Schutzmaßnahmen umgangen. Die GEMA
    klagte vor der 42. Zivilkammer des Landgerichts München I; Streitgegenstand waren sechs Kompositionen.
  sachverhalt_quelle: eintrag
