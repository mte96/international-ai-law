  anspruchsgrundlage: Art. 64 Abs. 2 DSGVO; Art. 4 Nr. 1, Art. 6 Abs. 1 lit. f DSGVO
  kernfrage: Wann ist ein auf personenbezogenen Daten trainiertes KI-Modell anonym, unter welchen Voraussetzungen
    trägt das berechtigte Interesse Entwicklung und Betrieb, und welche Folgen hat eine rechtswidrige
    Verarbeitung in der Entwicklungsphase für den späteren Betrieb?
  ergebnis: 'Vier Antworten. Erstens Anonymität: Auf personenbezogenen Daten trainierte Modelle können
    nicht in allen Fällen als anonym gelten; die Bewertung ist einzelfallbezogen. Anonym ist ein Modell
    nur, wenn sowohl die Wahrscheinlichkeit der Extraktion personenbezogener Daten als auch die ihrer
    Erlangung über Abfragen unerheblich ist, gemessen an allen vernünftigerweise verfügbaren Mitteln;
    der Verantwortliche muss Designentscheidungen, Testergebnisse und die Widerstandskraft gegen Extraktionsangriffe
    dokumentieren. Zweitens und drittens berechtigtes Interesse: dreistufige kumulative Prüfung — Identifikation
    eines rechtmäßigen, klar formulierten, tatsächlichen Interesses; Erforderlichkeitsprüfung unter Wahrung
    der Datenminimierung; Abwägung gegen Grundrechte, vernünftige Erwartungen und Auswirkungen, wobei
    mildernde Maßnahmen berücksichtigt werden. Viertens Folgen rechtswidriger Entwicklung: drei Szenarien
    — Weiterverwendung durch denselben Verantwortlichen (Einzelfallprüfung), Einsatz durch einen anderen
    Verantwortlichen (Sorgfaltspflicht zur Prüfung der rechtmäßigen Entwicklung) und tatsächlich anonymisiertes
    Modell (DSGVO unanwendbar unabhängig von der vorangegangenen Rechtswidrigkeit).

    '
  bedeutung: hoch
  volltext_url: https://www.edpb.europa.eu/system/files/2024-12/edpb_opinion_202428_ai-models_en.pdf
  zusammenfassung_url: https://www.europeanlawblog.eu/pub/zh4uxsfq
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  - gpai-code-of-practice
  instanzenzug:
  - eu-2024-garante-openai
  - eu-2025-garante-replika
  quelle_tracker: edpb.europa.eu; European Law Blog; IAPP; Hunton; William Fry
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Formal eine Stellungnahme nach Art. 64 Abs. 2 DSGVO ohne Bindungswirkung gegenüber
    Verantwortlichen, faktisch der Maßstab jeder europäischen Aufsichtspraxis zu KI-Modellen. Die dritte
    Antwort ist die wirtschaftlich schärfste: Wer ein fremdes Modell einsetzt, muss die Rechtmäßigkeit
    seiner Entwicklung prüfen — eine Sorgfaltspflicht, die in Lizenzverträgen über Zusicherungen und Freistellungen
    abgebildet werden muss und in der Praxis meist nicht ist. Die vierte Variante — Anonymisierung heilt
    die vorangegangene Rechtswidrigkeit — ist der Fluchtweg, den die Anbieter suchen; die Beweislast dafür
    trägt nach der ersten Antwort aber der Anbieter, und sie ist hoch.

    '
  normen:
  - dsgvo-art-6-abs-1-lit-f
  - dsgvo-art-4-nr-1
  - dsgvo-art-64-abs-2
  sachverhalt: Die irische Datenschutzaufsicht legte dem Europäischen Datenschutzausschuss nach Art. 64
    Abs. 2 DSGVO Fragen zu KI-Modellen zur Stellungnahme von allgemeiner Geltung vor. Sie wollte geklärt
    wissen, wann ein auf personenbezogenen Daten trainiertes Modell als anonym angesehen werden kann,
    unter welchen Voraussetzungen sich Entwicklung und Betrieb eines solchen Modells auf das berechtigte
    Interesse stützen lassen und welche Folgen es für den späteren Betrieb hat, wenn die Daten in der
    Entwicklungsphase rechtswidrig verarbeitet wurden. Weil dieselben Modelle grenzüberschreitend angeboten
    werden, stellten sich diese Fragen in mehreren Mitgliedstaaten gleichermaßen. Der Ausschuss nahm die
    Stellungnahme 28/2024 am 17. Dezember 2024 an.
  sachverhalt_quelle: eintrag
