  eigene_bewertung: 'Die erste deutsche Entscheidung, die einen Modellanbieter — nicht einen Plattformbetreiber,
    nicht den Nutzer — für die Ausgabe eines Sprachmodells äußerungsrechtlich haften lässt. Die Absage
    an den Disclaimer ist der praktisch wichtigste Satz: Die gesamte Nutzungsbedingungsarchitektur der
    Anbieter beruht darauf, dass der Hinweis auf Halluzinationen die Zurechnung unterbricht. Er tut es
    nicht. Bemerkenswert ist die Klägerseite — eine juristische Person, die sich auf das Unternehmenspersönlichkeitsrecht
    stützt; für natürliche Personen ist die Schwelle noch niedriger.

    '
