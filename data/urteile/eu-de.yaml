  eigene_bewertung: 'Nach wie vor die einzige veröffentlichte deutsche Gerichtsentscheidung zur Mitbestimmung
    beim KI-Einsatz — und sie ist schmal. Sie trägt genau eine Konstellation: private Accounts, browserbasiert,
    kein Arbeitgeberzugriff auf Nutzungsdaten. Kehrt der Arbeitgeber auch nur eines dieser Merkmale um
    — Unternehmenslizenz, SSO, Protokollierung — greift § 87 Abs. 1 Nr. 6 BetrVG wieder. Als Argument
    gegen jede KI-Mitbestimmung wird die Entscheidung regelmäßig überdehnt zitiert. Eine BAG-Entscheidung
    zu KI existiert am 27.08.2026 nicht, auch wenn mehrere Sekundärquellen das behaupten; die arbeitsrechtliche
    Fachliteratur vom 17.04.2026 nennt ausdrücklich keine.

    '
