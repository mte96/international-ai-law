  letzte_pruefung: *id001
  eigene_bewertung: 'Der wichtigste Satz steht nicht bei § 44b, sondern bei § 60d UrhG. Wenn die kommerzielle
    Weiterentwicklung von KI-Modellen durch Unternehmen als angewandte Forschung gilt und die Weitergabe
    des Datensatzes an genau diese Unternehmen dem Open-Source-Ansatz immanent ist, dann lässt sich jeder
    kommerzielle Trainingsdatensatz über einen vorgeschalteten gemeinnützigen Verein beschaffen — und
    § 60d UrhG kennt keinen Nutzungsvorbehalt. Die VG Bild-Kunst nennt das eine Handlungsanleitung zur
    Umgehung, und sie hat recht. Der zweite unterschätzte Punkt ist die Beweislastverteilung: Der Rechtsinhaber
    muss beweisen, dass sein Vorbehalt zum Nutzungszeitpunkt — nicht heute — maschinenlesbar war. Das
    ist bei Crawls, die Jahre zurückliegen, praktisch kaum zu führen. Beide Punkte liegen dem BGH vor.

    '
