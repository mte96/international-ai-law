  anspruchsgrundlage: Art. 263 AEUV (Nichtigkeitsklage); angefochtener Rechtsakt nicht ermittelt
  kernfrage: Nicht ermittelbar — der angefochtene Rechtsakt und die Klagegründe gehen aus dem veröffentlichten
    Klagehinweis nicht hervor.
  ergebnis: 'Anhängig. Klageerhebung am 16.02.2026, veröffentlicht im Amtsblatt (ABl. C/2026/2391). Ob
    der Rechtsstreit die KI-Verordnung, den Digital Services Act, das Wettbewerbsrecht oder eine Beihilfeentscheidung
    betrifft, war nicht feststellbar. Ein Bezug zur Verordnung (EU) 2024/1689 ist NICHT belegt.

    '
  bedeutung: niedrig
  volltext_url: https://eur-lex.europa.eu/eli/C/2026/2391/oj/eng
  zusammenfassung_url: null
  bezug_regelwerke:
  - dsa-2022-2065
  instanzenzug: []
  quelle_tracker: EUR-Lex CELEX 62026TN0120
  verifiziert: false
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Als Spur aufgenommen, nicht als Befund. Der Auftrag verlangte die Suche nach Nichtigkeitsklagen
    gegen die KI-VO; dies ist das einzige EuG-Verfahren eines KI-Unternehmens gegen die Kommission, das
    auffindbar war. Der Klagegegenstand muss über den ABl-Volltext nachgeholt werden, bevor der Eintrag
    belastbar ist. Der belastbare Befund lautet: Eine Nichtigkeitsklage gegen die KI-Verordnung SELBST
    existiert am 27.08.2026 nicht.

    '
  pruefvermerk:
  - 'Verweis auf ki-vo-2024-1689 am 2026-09-03 entfernt: im Eintrag nicht belegt.'
