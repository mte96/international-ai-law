  anspruchsgrundlage: §§ 97, 16 UrhG; Schranken §§ 44b, 60d UrhG; Art. 3, 4 RL (EU) 2019/790; Dreistufentest
  kernfrage: Welche Anforderungen stellt § 44b Abs. 3 Satz 2 UrhG an die Maschinenlesbarkeit eines Nutzungsvorbehalts,
    und privilegiert § 60d UrhG einen Verein, dessen Datensätze anschließend kommerziell genutzt werden?
  ergebnis: 'Berufung zurückgewiesen, auf zwei selbständig tragenden Begründungen. Erstens § 44b UrhG:
    Das Herunterladen und die automatisierte Prüfung der Bild-Text-Übereinstimmung ist Text und Data Mining,
    ebenso Vorbereitungshandlungen für ein späteres Training. Der Vorbehalt der Stockfoto-Agentur war
    unwirksam: Maschinenlesbar ist ein Vorbehalt nur, wenn er automatisiert nicht nur erfasst, sondern
    auch so interpretiert werden kann, dass die erfassten Inhalte bei automatisiertem Vorgehen nicht ausgewertet
    werden. Der Maßstab ist technikoffen, natürliche Sprache nicht generell ausgeschlossen — für das Jahr
    2021 hat der Senat sie aber verneint und ausdrücklich offengelassen, ob heute anders zu entscheiden
    wäre. Hinzu kam, dass der Vorbehalt nur die "automatische Auswertung" untersagte, nicht Text und Data
    Mining. Die Darlegungs- und Beweislast für die Maschinenlesbarkeit zum konkreten Nutzungszeitpunkt
    trägt der Rechtsinhaber. Zweitens § 60d UrhG: LAION e.V. ist Forschungsorganisation ohne kommerziellen
    Zweck; die Open-Source-Weitergabe an kommerzielle Unternehmen schadet nicht, weil auch die Weiterentwicklung
    von KI-Modellen durch Unternehmen angewandte Forschung sei. Revision wegen grundsätzlicher Bedeutung
    zugelassen.

    '
