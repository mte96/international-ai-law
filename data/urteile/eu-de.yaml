  ergebnis: 'Noch nicht entschieden. Verhandlungstermin am 03.09.2026, 9:00 Uhr; Akkreditierungsschluss
    02.09.2026, 10:00 Uhr, Kameras zugelassen. Nach der amtlichen Terminvorschau geht es um den Download
