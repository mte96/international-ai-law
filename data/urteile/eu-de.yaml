  anspruchsgrundlage: § 43 BRAO (allgemeine Berufspflicht, Organ der Rechtspflege); Wahrheitspflicht im
    Verfahren
  kernfrage: Verletzt eine Rechtsanwältin ihre Berufspflichten, wenn sie einen mit KI erstellten Schriftsatz
    einreicht, ohne die darin enthaltenen Rechtsprechungszitate zu überprüfen?
  ergebnis: 'Ja. Im Beschwerdeverfahren gegen die Ablehnung von Verfahrenskostenhilfe hatte die Verfahrensbevollmächtigte
    mehrere Entscheidungen zitiert, darunter einen angeblichen Beschluss "BGH, Beschl. v. 14.11.2007 –
    XII ZB 183/07, FamRZ 2008, 137". Der Senat stellte fest, dass beide zitierten Entscheidungen weder
    in juristischen Datenbanken noch auf der Website des BGH existieren — Ergebnis einer fantasierenden
    KI. Die Schriftsätze seien offensichtlich mithilfe von KI verfasst und die eingefügten Zitate nicht
    überprüft worden; das verstoße gegen die Pflicht aus § 43 BRAO, die sowohl aus dem Mandatsverhältnis
    als auch aus der Stellung als Organ der Rechtspflege folge. Der Senat erteilte eine vorsorgliche Verwarnung
    mit der Aufforderung, künftig KI-generierte Schriftsätze und insbesondere Zitate gewissenhaft zu prüfen.
    Die Beschwerde blieb in der Sache erfolglos.

    '
  bedeutung: mittel
