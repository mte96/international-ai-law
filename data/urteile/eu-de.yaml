- id: de-2026-bgh-schufa-auskunft
  jurisdiktion: de
  gericht: Bundesgerichtshof, I. Zivilsenat
  instanz: revision
  aktenzeichen: I ZR 227/25, I ZR 228/25, I ZR 229/25, I ZR 230/25 (zuvor auch I ZR 226/25 — dort Klage
    zurückgenommen)
  ecli: null
  datum: 2026-06-18
  parteien:
    klaeger: Vier betroffene Verbraucher
    beklagter: SCHUFA Holding AG
  status: anhaengig
  themenachsen:
  - datenschutz
  - sektor-finanz
  - grundrechte
  - governance
  anspruchsgrundlage: Art. 15 Abs. 1 lit. h DSGVO; Art. 22 DSGVO; Art. 4 Nr. 4 DSGVO (Profiling)
  kernfrage: Ob und in welchem Umfang muss eine Wirtschaftsauskunftei den von automatisierter Datenverarbeitung
    Betroffenen Auskunft über die ihren Scorewerten zugrunde liegenden Verfahren erteilen?
  ergebnis: 'Noch nicht entschieden. Verhandlung am 18.06.2026, 9:00 Uhr. Verkündungstermin amtlich bestimmt
    auf den 21.10.2026, 8.45 Uhr, in Sachen I ZR 227/25 bis I ZR 230/25; im fünften Verfahren ist die
    Klage zurückgenommen worden. Nach dem Sitzungsbericht signalisierte der Vorsitzende Jörn Feddersen,
    der Senat werde dem weiten Ansatz des OLG Dresden voraussichtlich nicht folgen: Art. 15 Abs. 1 lit.
    h DSGVO setze eine automatisierte Entscheidungsfindung voraus, und das sei mehr als die bloße Berechnung
    eines Scores. Zur Zurechnung verwies er auf C-634/21: Wenn der Score die Ablehnung durch die Bank
    maßgeblich verursacht, ist die Entscheidung der Auskunftei zuzurechnen — das Dreipersonenverhältnis
    habe das OLG Dresden ausgeblendet. Eine Offenlegung des Algorithmus hält der Senat nicht für geschuldet.
    Die SCHUFA hat am 17.03.2026 ein neues Scoreverfahren mit zwölf gewichteten Kriterien eingeführt.

    '
  bedeutung: hoch
  volltext_url: https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2026/2026052.html
  zusammenfassung_url: https://www.lto.de/recht/hintergruende/h/bgh-izr22725-izr23025-schufa-score-auskunftsanspruch
  bezug_regelwerke:
  - de-bdsg-scoring
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  instanzenzug:
  - eu-2023-schufa-scoring
  - eu-2025-dun-bradstreet
  - de-2025-olg-dresden-scoring
  - de-2026-olg-stuttgart-scoring
  - de-2026-olg-bamberg-scoring
  quelle_tracker: bundesgerichtshof.de PM 52/2026; LTO; beck-aktuell
  verifiziert: true
  letzte_pruefung: 2026-09-07
  eigene_bewertung: 'Das ist die deutsche Umsetzungsentscheidung zu C-203/22 und damit die praktisch wichtigste
    Transparenzentscheidung für jedes KI-gestützte Bewertungsverfahren — nicht nur für Bonität. Wenn der
    Senat wie angedeutet entscheidet, gilt: Auskunft nur über Verfahren und Grundsätze, keine Gewichtungsangaben,
    und Art. 15 Abs. 1 lit. h DSGVO greift erst, wenn eine Entscheidung ergangen ist. Der zweite Halbsatz
    ist der gefährlichere: Er würde die präventive Funktion der Auskunft — Fehler finden, bevor sie schaden
    — entwerten und steht in Spannung zu C-634/21, das die Auskunftei gerade deshalb einbezog, weil die
    Bank die Logik nicht kennt. Hinzu tritt ein Zeitproblem: Ab November 2026 gelten neue bundesrechtliche
    Transparenzvorgaben zum Scoring, die die Entscheidung teilweise überholen können.

    '
  hinweis_widerspruch: 'Der Widerspruch zwischen beck-aktuell (vier Verfahren) und der BGH-Pressemitteilung
    52/2026 (fünf Verfahren, I ZR 226/25 bis I ZR 230/25) ist am 07.09.2026 aufgelöst: Die amtliche Terminhinweis-Volltextübersicht
    führt für den Verkündungstermin nur noch I ZR 227/25 bis I ZR 230/25 und vermerkt, in einem Verfahren
    sei die Klage zurückgenommen worden. Verbleibende Unschärfen zweiter Ordnung: (1) Das abgerufene Textstück
    bezeichnet das weggefallene Verfahren als "I ZR 226/26"; da die Reihe I ZR 226/25 bis I ZR 230/25
    lautet, kann nur I ZR 226/25 gemeint sein — "/26" ist mit hoher Wahrscheinlichkeit ein Schreibfehler
    und vor einer Zitierung am Dokument nachzuprüfen. (2) In einem Revisionsverfahren wäre die Rücknahme
    der Revision zu erwarten, nicht der Klage; der amtliche Text spricht von Klagerücknahme. Beides bleibt
    so stehen.'
  normen:
