    Grundsätze, oder muss die Gewichtung der Kriterien offengelegt werden?
  ergebnis: 'Der Bonitätsscore ist nicht rechtswidrig. Die Datenverarbeitung der Auskunftei ist nach Art.
    6 Abs. 1 UAbs. 1 lit. f DSGVO gerechtfertigt; berechtigte Interessen überwiegen. Zur Auskunft genügen
    Angaben über das konkret angewandte Verfahren und die zugrunde liegenden Grundsätze; eine vollständige
    Offenlegung des Algorithmus ist nicht geschuldet. Der Senat setzt sich ausdrücklich von OLG Dresden
    und VG Wiesbaden ab: Die Forderung nach klareren Gewichtungsangaben laufe im Ergebnis auf die verbotene
    Algorithmusoffenlegung hinaus. Gestützt auf EuGH C-203/22, wonach der Betroffene Verfahren und Grundsätze
    kennen muss, um Richtigkeit und Rechtmäßigkeit zu prüfen.

    '
