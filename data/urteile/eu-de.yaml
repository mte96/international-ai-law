  anspruchsgrundlage: Art. 15 Abs. 1 lit. h DSGVO; Art. 22 DSGVO; Art. 4 Nr. 4 DSGVO
  kernfrage: Muss eine Auskunftei die Gewichtung der wichtigsten Scorekriterien offenlegen, damit der
    Betroffene die Plausibilität seines Scores prüfen kann?
  ergebnis: 'Teilweise zugunsten der Kläger. Der Senat bejahte eine automatisierte Entscheidungsfindung
    einschließlich Profiling nach Art. 4 Nr. 4 DSGVO und verurteilte die Beklagte zu ergänzenden Angaben
    über die Gewichtung der wichtigsten Scorekriterien. Der Auskunftsanspruch reicht so weit, wie er die
    Prüfung von Richtigkeit und Plausibilität des Scores ermöglicht; die Informationen müssen für Laien
    verständlich sein. Eine mathematische Erläuterung der statistischen Berechnung oder die Offenlegung
    des Algorithmus ist nicht geschuldet. Zwischen dem angewandten Verfahren und den verwendeten Kriterien
    einerseits und dem automatisierten Ergebnis andererseits muss aber eine objektiv nachprüfbare Entsprechung
    und Kausalität bestehen. Revision zum BGH (I ZR 226/25 bis I ZR 230/25).

    '
