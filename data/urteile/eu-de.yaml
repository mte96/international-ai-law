  eigene_bewertung: 'Die bislang klarste obergerichtliche Aussage zur Schutzfähigkeit von KI-Output in
    Deutschland, und sie fällt in einem Nebensatz eines Verfügungsverfahrens. Wichtiger als das Ergebnis
    ist die Beweislastregel: Nicht der Angreifer muss die Maschinenerzeugung beweisen, sondern der Schutzrechtsinhaber
    die menschliche Schöpfung — und zwar konkret, prompt- und entscheidungsbezogen. Das kehrt die übliche
    Vermutung zugunsten des Urhebers um und ist für Bild- und Stockagenturen praktisch einschneidender
    als jede Trainingsdatenfrage.

