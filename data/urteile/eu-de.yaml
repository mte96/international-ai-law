  - de-2025-gema-openai-olg
  - de-2026-gema-suno-lg
  - eu-2025-like-company-google
  quelle_tracker: justiz.bayern.de; Verfassungsblog; Preu Bohlig; GEMA-Pressemitteilung; MediaLaws
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die erste europäische Grundsatzentscheidung zu generativer KI und Urheberrecht, und
    die dogmatisch angreifbarste. Die Memorisierungsvermutung ist abduktiv gebaut: Weil das Werk herauskommt,
    muss es drin sein. Das ist als Beweisfigur nachvollziehbar und als Rechtsfolge binär — es kennt keine
    Abstufung zwischen einem Werk, das auf "gib mir den Text von X" erscheint, und einem, das nur über
    einen konstruierten Extraktionsangriff rekonstruierbar ist. Die Literatur schlägt eine teleologische
    Reduktion auf mit vertretbarem Aufwand extrahierbare Memorisierungen vor; die Kammer hat diese Frage
    nicht gestellt. Bemerkenswert ist auch die Ablehnung der Vorlage gegen den übereinstimmenden Willen
    beider Parteien — der EuGH entscheidet die Frage nun ohnehin, nur ohne den deutschen Sachverhalt.

    '
  normen:
  - urhg-16
  - urhg-19a
  - urhg-44b
  - urhg-44b-abs-2
  - urhg-44b-abs-3
  - urhg-97
  sachverhalt: Nach dem Vortrag der GEMA gab der Chatbot ChatGPT auf einfache Anfragen hin die Texte bekannter
    deutscher Lieder in weiten Teilen originalgetreu aus — darunter „Atemlos" von Kristina Bach und „Wie
    schön, dass du geboren bist" von Rolf Zuckowski; in anderen Fällen gab er veränderte Fassungen aus
    und schrieb sie den Urhebern gleichwohl zu. Neun solcher Liedtexte machte die GEMA als Verwertungsgesellschaft
    zum Gegenstand einer Klage gegen zwei Unternehmen der OpenAI-Gruppe vor der 42. Zivilkammer des Landgerichts
    München I und verlangte Unterlassung, Auskunft und Schadensersatz sowie Ersatz wegen der fehlerhaften
    Zuschreibung veränderter Texte. Sie stützte sich darauf, die Texte seien in den Sprachmodellen memorisiert.
    Die Beklagten hielten dem entgegen, ihre Modelle speicherten oder kopierten keine spezifischen Trainingsdaten,
    sondern spiegelten in ihren Parametern nur wider, was sie aus dem Gesamtdatensatz gelernt hätten;
    für die Ausgaben sei der promptende Nutzer verantwortlich, und im Übrigen greife die Schranke für
    Text und Data Mining.
  sachverhalt_quelle: volltext
