  anspruchsgrundlage: §§ 23, 97 UrhG; § 2 Abs. 2 UrhG
  kernfrage: Verletzt die KI-gestützte Umgestaltung eines Fotos in einen Comic das Urheberrecht am Original,
    und genießt das KI-Erzeugnis selbst Schutz?
  ergebnis: 'Keine Verletzung. Die schutzbegründenden Merkmale des Originalfotos wurden nicht wiedererkennbar
    übernommen; Maßstab ist nach EuGH (verb. Rs. C-580/23 und C-795/23 vom 04.12.2025) die wiedererkennbare
    Übernahme konkreter schöpferischer Elemente, nicht der abstrakte Gesamteindruck. Zur Schutzfähigkeit
    des KI-Erzeugnisses: Ein ausschließlich durch automatisierte Softwareprozesse erzeugtes Bild ist nicht
    selbständig schutzfähig. Wer sich auf Werkqualität beruft, muss die konkreten schöpferischen Entscheidungen
    darlegen, die dem Output die persönliche Prägung des Prompters geben; auch zahlreiche allgemein gehaltene
    Anweisungen genügen nicht, und die bloße Auswahl aus mehreren KI-Vorschlägen ebenfalls nicht. Verfahren
    des einstweiligen Rechtsschutzes.

    '
