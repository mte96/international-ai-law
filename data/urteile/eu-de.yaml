  anspruchsgrundlage: §§ 97, 16, 15 Abs. 2, 19a UrhG; § 44b UrhG; § 95a UrhG (Umgehung technischer Schutzmaßnahmen)
  kernfrage: Erstreckt sich deutsches Urheberrecht auf ein in den USA durchgeführtes Training, wenn das
    Modell in Europa betrieben wird, und ist die Memorisierung von Musikkompositionen eine Vervielfältigung?
  ergebnis: 'Der Klage wurde weitgehend stattgegeben: Unterlassung der unberechtigten Vervielfältigung
    und der Nutzung der Werke zum Training, Auskunft über Umsätze, Schadensersatz. Gegenstand waren sechs
    Kompositionen, darunter "Forever Young", "Atemlos durch die Nacht", "Mambo No. 5", "Cheri Cheri Lady"
    und "Daddy Cool". Die Kammer bejahte Memorisierung: Übereinstimmungen in Melodie, Harmonie und Rhythmus
    seien wegen Komplexität und Länge der Werke zu umfangreich und zu spezifisch, um zufällig zu sein.
    § 44b UrhG greift nicht, weil die Memorisierung über den Analysezweck hinausgeht; US-amerikanisches
    Fair Use ist unanwendbar, wo die Werke im Output wiedererkennbar erscheinen. Zurechnung: Nutzer, die
    einfache offene Prompts eingeben, kontrollieren das System nicht — Suno tut es über Architektur und
    Betrieb. Hinzu kam der Vorwurf des Stream-Ripping von YouTube unter Umgehung technischer Schutzmaßnahmen.
    Nicht rechtskräftig; Suno hat erklärt, alle Optionen einschließlich einer Berufung zu prüfen.

    '
  bedeutung: hoch
  volltext_url: https://www.justiz.bayern.de/gerichte-und-behoerden/landgericht/muenchen-1/presse/2026/16.php
  zusammenfassung_url: https://www.juve-patent.com/cases/munich-regional-court-stops-suno-using-gema-protected-music/
