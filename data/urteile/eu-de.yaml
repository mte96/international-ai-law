  anspruchsgrundlage: §§ 3, 5 Abs. 1, Abs. 2 Nr. 3, 8 UWG; § 2 UWG
  kernfrage: Sind unwahre Angaben eines KI-Chatbots auf der Unternehmenswebsite dem Unternehmen als irreführende
    geschäftliche Handlung zuzurechnen, oder ist der Chatbot ein nicht beherrschbarer Dritter?
  ergebnis: 'Zurechnung bejaht. Der Chatbot der Beklagten hatte zwei Ärzte als "Facharzt für plastische
    und ästhetische Chirurgie" und "Facharzt für ästhetische Medizin" bezeichnet — Bezeichnungen, die
    es so nicht gibt und die die Ärzte nicht führen. Der Senat wertete das als unwahre Angabe über die
    berufliche Qualifikation nach § 5 Abs. 1, Abs. 2 Nr. 3 UWG. Der Chatbot ist kein Dritter im Sinne
    des Gesetzes, sondern Teil der geschäftlichen Organisation des Unternehmens; die Verantwortung besteht
    unabhängig davon, ob das System ursprünglich mit zutreffenden Daten bespielt wurde. Unterlassung zugesprochen.
    Revision zum BGH wegen der grundsätzlichen Frage der Zurechnung von KI-Aussagen zugelassen.

    '
