  anspruchsgrundlage: §§ 823 Abs. 1, 1004 BGB analog i.V.m. Art. 2 Abs. 1, 19 Abs. 3 GG; Art. 6 VO (EU)
    2022/2065 (DSA)
  kernfrage: Sind KI-generierte Suchzusammenfassungen eigene Inhalte der Suchmaschine mit der Folge unmittelbarer
    Täterhaftung, oder greifen die Haftungsprivilegien für die Vermittlung fremder Inhalte?
  ergebnis: 'KI-Zusammenfassungen sind eigene Inhalte der Suchmaschine. Weil Google Fremdinformationen
    zu eigenen synthetisierten Aussagen verdichtet, haftet es als unmittelbarer Täter und nicht als neutraler
    Vermittler. Die herkömmlichen Haftungsprivilegien für Suchergebnisse und Art. 6 DSA greifen nicht,
    weil es sich um originären redaktionellen Inhalt und nicht um das bloße Hosten fremden Materials handelt.
    Die Zusammenfassungen hatten die Klägerinnen mit Betrugsmaschen, "Abo-Fallen" und unseriösen Geschäftspraktiken
    in Verbindung gebracht. Teilweise stattgebendes Endurteil im Verfahren der einstweiligen Verfügung:
    Google wurde untersagt, die durch Nutzerbewertungen oder prüfbare Quellen nicht gedeckten Behauptungen
    zu verbreiten.

    RECHTSMITTELSTAND: Die Verfügungsbeklagte hat Berufung eingelegt (OLG München, Az. 18 U 1744/26 Pre
    e). Die Parteien haben den Rechtsstreit sodann durch VERGLEICH beendet; das Urteil des LG München
    I ist damit nach dem amtlichen Hinweis in BAYERN.RECHT GEGENSTANDSLOS. Es entfaltet keine Bindungswirkung
    mehr und ist nur noch als Argumentationsmaterial verwertbar.

    '
