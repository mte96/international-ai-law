  anspruchsgrundlage: §§ 97, 16, 19a UrhG; § 44b UrhG; Dreistufentest (Art. 5 Abs. 5 RL 2001/29/EG)
  kernfrage: Ist ein Sprachmodell, das geschützte Liedtexte auf einfache Prompts hin wiedergibt, selbst
    ein Vervielfältigungsstück, und deckt § 44b UrhG das Training generativer Modelle?
  ergebnis: 'Der Klage wurde weitgehend stattgegeben: Unterlassung, Auskunft, Schadensersatz wegen neun
    Liedtexten aus dem GEMA-Repertoire. Die Kammer nimmt eine Memorisierungsvermutung an — gibt ein Modell
    komplexe geschützte Inhalte auf sehr einfach gehaltene Prompts hin konsistent und wiederholbar wieder,
    ohne plausible Zufallserklärung, sind die Werke in den Modellparametern verkörpert; das Modell selbst
    ist Vervielfältigungsstück nach § 16 UrhG. Die Unterscheidung zwischen "1:1 gespeichert" und "nur
    reflektiert" ist unerheblich. Die Ausgabe ist zusätzlich öffentliche Wiedergabe nach § 19a UrhG. §
    44b UrhG greift nicht: Die Vervielfältigungen im Modell dienen nicht der Gewinnung weiterer Informationen,
    und der Dreistufentest steht entgegen, weil die Ausgaben mit den Originalwerken konkurrieren. OpenAI
    ist keine privilegierte Forschungsorganisation. Die Verantwortung liegt beim Betreiber, der Trainingsdaten,
    Architektur und Filter kontrolliert, nicht beim promptenden Nutzer. Eine EuGH-Vorlage lehnte die Kammer
    ab, obwohl beide Parteien sie gemeinsam angeregt hatten.

    '
  bedeutung: hoch
  volltext_url: https://www.justiz.bayern.de/gerichte-und-behoerden/landgericht/muenchen-1/presse/2025/11.php
  zusammenfassung_url: https://verfassungsblog.de/lg-munchen-gema-open-ai/
