  quelle_tracker: dejure.org (Entscheidungsnachweis; Verfahrensgang AG Berlin-Kreuzberg, 19.09.2025 –
    130 F 12281/25); BRAK-Newsroom
  verifiziert: false
  letzte_pruefung: *id001
  eigene_bewertung: 'Die erste veröffentlichte deutsche Gerichtsentscheidung zu halluzinierten Fundstellen
    im anwaltlichen Schriftsatz. Anders als in den USA, wo Gerichte Ordnungsgelder und Zulassungsverfahren
    verhängen, bleibt es hier bei einer Verwarnung ohne berufsrechtliches Verfahren — das Kammergericht
    hat die Sache nicht an die Rechtsanwaltskammer abgegeben. Dogmatisch bemerkenswert ist die Verankerung:
    nicht § 138 ZPO, sondern § 43 BRAO, also Berufsrecht statt Prozessrecht. Damit ist die Frage der prozessualen
    Sanktion — Zurückweisung, Kostentragung, Verzögerung — weiter offen. Für Kanzleien folgt daraus eine
    Organisationspflicht: Zitatprüfung ist nicht delegierbar an das Werkzeug, das die Zitate erzeugt hat.

    '
  pruefvermerk:
  - '05.09.2026: Amtliche Fundstelle gesucht, aber nicht sicher zuzuordnen. Die Berliner Rechtsprechungsdatenbank
    führt unter gesetze.berlin.de/bsbe/document/NJRE001640995 einen Beschluss des KG, 17. Senat für Familiensachen,
    vom 20.11.2025; das Aktenzeichen ist im Trefferdatensatz nicht ausgewiesen und das Portal per robots.txt
    gesperrt, sodass die Zuordnung zu 17 WF 144/25 nicht belegbar war. Es wurde deshalb keine amtliche
    Adresse eingetragen, quelle_art bleibt ''datenbank''.'
  - '05.09.2026: Datenbankfundstelle am Dokument geprüft. Der dejure-Entscheidungsnachweis weist KG, 20.11.2025
    – 17 WF 144/25 aus, Gegenstand KI-generierte, erfundene Rechtsprechungszitate im anwaltlichen Schriftsatz,
    Verfahrensgang AG Berlin-Kreuzberg, 19.09.2025 – 130 F 12281/25. Datum, Aktenzeichen und Gegenstand
    stimmen; die Vorinstanz war bisher nicht erfasst.'
  - '05.09.2026: Spruchkörper präzisiert. Der Eintrag nannte den ''17. Zivilsenat (Familiensenat)''; das
    Kammergericht führt ihn als 17. Senat für Familiensachen. Die Entscheidung ist ein Beschluss, kein
    Urteil.'
