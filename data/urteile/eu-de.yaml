    Bonitätsbeurteilung nach Art. 15 DSGVO. Gericht, Senat, Datum und Aktenzeichen stimmen.'
  - '05.09.2026: Verfahrensgang ergänzt — nach dejure ist Vorinstanz das LG Leipzig, Urteil vom 29.05.2024
    – 7 O 2658/23, und ein Revisionsverfahren beim BGH ist anhängig (dort als I ZR 226/25 geführt). Das
