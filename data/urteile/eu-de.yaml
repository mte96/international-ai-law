  eigene_bewertung: 'Die älteste deutsche Entscheidung dieser Linie und dogmatisch die saubere Wurzel:
    Wer ein automatisiertes System bewusst einsetzt, haftet als Täter für dessen Ausgaben, nicht als Störer.
    Der entscheidende Satz betrifft die Wiederholungsgefahr — Löschen des Einzelfalls genügt nicht, solange
    das System unverändert weiterläuft. Übertragen auf Sprachmodelle heißt das: Ein Unterlassungstitel
    gegen eine halluzinierte Aussage ist praktisch nur durch Filter oder Unlearning erfüllbar. Genau daran
    hängt die Vollstreckung aller späteren Entscheidungen.

    '
