    hat, und genau die, die C-634/21 vermeiden wollte: Wenn nur die äußere Anwendung zählt, läuft der
    Auskunftsanspruch gegen die Auskunftei wieder leer, weil sie nicht entscheidet. Für KI-Bewertungssysteme
    jenseits der Bonität — Bewerberauswahl, Versicherungstarifierung, Betrugserkennung — ist diese Weichenstellung
    folgenreicher als der Bonitätsfall selbst.

    '
