  anspruchsgrundlage: Art. 15 Abs. 1 lit. h, Art. 22 Abs. 1 DSGVO; Art. 82 DSGVO
  kernfrage: Setzt Art. 22 Abs. 1 DSGVO voraus, dass der automatisiert erzeugte Wert die Entscheidung
    eines Dritten maßgeblich bestimmt, oder genügt die interne Scoreerstellung?
  ergebnis: 'Hinweisbeschluss nach § 522 Abs. 2 ZPO, kein Endurteil: Der Senat beabsichtigt einstimmig,
    die Berufung zurückzuweisen, weil sie offensichtlich keine Aussicht auf Erfolg hat und weder grundsätzliche
    Bedeutung noch Fortbildungsbedarf besteht. In der Sache: keine Ansprüche gegen die Auskunftei aus
    der automatischen Scoreerstellung. Art. 22 Abs. 1 DSGVO schützt nur vor automatisierten Entscheidungen
    mit unmittelbarer rechtlicher Wirkung ohne Einschaltung eines Dritten; die bloße Scoreerstellung genügt
    nicht. Art. 15 Abs. 1 lit. h DSGVO verlangt keine vollständige Offenlegung des Algorithmus.

    '
  bedeutung: mittel
