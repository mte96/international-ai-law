  pruefvermerk:
  - '07.09.2026: Amtliche Terminhinweis-Volltextübersicht des BGH (Zeitraum September bis Oktober 2026)
    abgerufen. Überschrift: "Verkündungstermin am 21. Oktober 2026, 8.45 Uhr in Sachen I ZR 227/25 bis
    I ZR 230/25 (Auskunftsanspruch gegen Wirtschaftsauskunftei)". Der bislang nur nach LTO geführte Verkündungstermin
    ist damit amtlich belegt; volltext_url zeigt jetzt auf diese Übersicht statt auf die Pressemitteilung
    052/2026 vom 20.03.2026, die nur den Verhandlungstermin betrifft und nicht fortgeschrieben wurde.
    Eine Entscheidung ist nicht ergangen.'
  - '07.09.2026 nachgezogen: Die Terminuebersicht des BGH ist eine rollierende Seite - sie fuehrt den
    Fall nur, solange der Termin aussteht. Als volltext_url steht daher wieder die stabile Pressemitteilung
    052/2026; die Uebersicht ist unter terminuebersicht_url als Beleg fuer den Verkuendungstermin 21.10.2026
    gefuehrt und vor dem 21.10.2026 zu sichern.'
  terminuebersicht_url: https://www.bundesgerichtshof.de/DE/Presse/Terminhinweise/TerminhinweiseVolltextuebersicht/terminhinweise_volltextuebersicht_node.html
  sachverhalt: 'Die SCHUFA Holding AG betreibt ein Bonitätsinformationssystem: Aus den über eine Person
    gespeicherten Wirtschaftsdaten errechnet sie mit einem mathematisch-statistischen Verfahren Wahrscheinlichkeitswerte
    (Scorewerte), die ihren Kunden — vor allem Kreditgebern — eine Einschätzung des zu erwartenden Zahlungsverhaltens
    erlauben sollen. Vier Privatpersonen erhielten von ihr im Jahr 2023 Auskunft über die zu ihnen gespeicherten
    Daten und über die in den vorangegangenen zwölf Monaten auf Bonitätsanfragen hin übermittelten Scorewerte:
    Tabellen mit Scorewerten, Ratingstufen, Erfüllungswahrscheinlichkeiten und den nach Darstellung der
    SCHUFA verwendeten Datenarten, ergänzt um Erläuterungen am Tabellenende und einen Verweis auf weitere
    Informationen im Internet. Die vier hielten das Scoring-Verfahren für intransparent und die Auskunft
    für unzureichend und verlangten Auskunft darüber, wie die Scorewerte berechnet werden. Die Landgerichte
    wiesen die Auskunftsanträge ab; das Berufungsgericht gab ihnen teilweise recht und verurteilte die
    SCHUFA zur Auskunft über die Gewichtung der am stärksten wirkenden Kriterien, über die Aussagekraft
    des konkret ermittelten Scorewerts und über die für den Basisscore genutzten Daten und Kriterien.
    Am 17. März 2026 führte die SCHUFA ein neues Scoreverfahren mit zwölf gewichteten Kriterien ein; über
    die Revisionen verhandelte der I. Zivilsenat des Bundesgerichtshofs am 18. Juni 2026.'
  sachverhalt_quelle: volltext
