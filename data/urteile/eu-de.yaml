  eigene_bewertung: 'Der Dresdner Senat hat als einziges Oberlandesgericht die kontrafaktische Logik aus
    C-203/22 ernst genommen: Ohne Kenntnis der Gewichtung kann der Betroffene nicht nachvollziehen, wie
    eine Änderung seiner Daten das Ergebnis verschoben hätte. Vorinstanzen waren LG Leipzig (07 O 2658/23
    und 07 O 2599/23), LG Chemnitz (1 O 1454/23) und LG Görlitz (1 O 100/24, 1 O 261/24). Dass ausgerechnet
    dieser Senat vom BGH kassiert zu werden droht, wäre die dogmatisch schwächere Lösung — aber die praktisch
    erwartete.

    '
