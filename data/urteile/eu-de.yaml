  anspruchsgrundlage: § 2 Abs. 1 Nr. 4, Abs. 2 UrhG (persönliche geistige Schöpfung); § 97 UrhG
  kernfrage: Sind mit generativer KI erzeugte Logos persönliche geistige Schöpfungen, wenn sich der menschliche
    Beitrag auf die Auswahl und Formulierung von Prompts beschränkt?
  ergebnis: 'Nein. Einfache KI-generierte Logos genießen keinen Urheberrechtsschutz. Der menschliche Einfluss
    muss den softwaregesteürten Prozess substantiell beherrschen; rein beschreibende Prompts wie "Briefumschlag
    vor Gebäude" tragen keine individuelle schöpferische Aussage. Die Persönlichkeit des Schöpfers muss
    sich objektiv und deutlich im Ergebnis wiederfinden. Zeit- und Mühewaltung beim Prompten genügen nicht.

    '
