    noch keine Entscheidung ergangen ist. quelle_art bleibt ''datenbank''.'
  - '05.09.2026: Datenbankfundstelle am Dokument geprüft. dejure.org führt 6 U 3662/25 als anhängiges
    Verfahren des OLG München mit Vorinstanz LG München I, Urteil vom 11.11.2025 – 42 O 14139/24. Aktenzeichen,
    Gericht und Verfahrensstand des Eintrags stimmen.'
  - '07.09.2026: Sauberer Negativbefund. Die amtliche Pressemitteilungsübersicht des OLG München (justiz.bayern.de)
    weist als jüngste Einträge den 03.09., 02.09., 26.08. und 24.08.2026 aus, sämtlich Strafverfahren;
    nichts zum 6. Zivilsenat, zu GEMA, OpenAI oder Urheberrecht. Das OLG München unterhält keine öffentliche
    Terminübersicht mit Aktenzeichen. Ein Verhandlungs- oder Verkündungstermin in 6 U 3662/25 e ist damit
    auch am 07.09.2026 nicht veröffentlicht; eine Entscheidung ist nicht ergangen.'
