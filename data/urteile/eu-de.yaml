- id: eu-2023-schufa-scoring
  jurisdiktion: eu
  gericht: Gerichtshof der Europäischen Union (Erste Kammer)
  instanz: berufung
  aktenzeichen: C-634/21
  ecli: ECLI:EU:C:2023:957
  datum: 2023-12-07
  parteien:
    klaeger: OQ
    beklagter: 'Land Hessen, Streithelferin: SCHUFA Holding AG'
  status: rechtskraeftig
  themenachsen:
  - datenschutz
  - sektor-finanz
  - grundrechte
  - governance
  anspruchsgrundlage: Art. 22 Abs. 1 DSGVO (Verordnung (EU) 2016/679); Vorlage des VG Wiesbaden
  kernfrage: Ist die automatisierte Erstellung eines Wahrscheinlichkeitswerts über die künftige Zahlungsfähigkeit
    durch eine Auskunftei bereits selbst eine automatisierte Entscheidung im Einzelfall nach Art. 22 Abs.
    1 DSGVO, wenn ein Dritter diesen Wert seiner Vertragsentscheidung maßgeblich zugrunde legt?
  ergebnis: 'Ja. Die Erstellung des Scorewerts durch die Auskunftei ist selbst eine automatisierte Entscheidung
    im Sinne des Art. 22 Abs. 1 DSGVO, sofern der Score dem Dritten gegenüber eine maßgebliche Rolle spielt.
    Der Gerichtshof begründet das mit einer Schutzlücke: Würde man erst die Entscheidung der Bank erfassen,
    könnte sich der Betroffene die Auskunfts- und Erläuterungsrechte aus Art. 15 Abs. 1 lit. h DSGVO gegenüber
    der Auskunftei nicht verschaffen, weil diese die Entscheidung nicht trifft, und gegenüber der Bank
    nicht, weil diese die Logik nicht kennt. Der Gerichtshof stellte zugleich fest, dass § 31 BDSG als
    nationale Ausnahmeregelung an Art. 22 Abs. 2 lit. b DSGVO zu messen ist.

    '
  bedeutung: hoch
  volltext_url: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:62021CJ0634
  sekundaerquelle_url: https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=EuGH&Datum=07.12.2023&Aktenzeichen=C-634%2F21
  zusammenfassung_url: https://cms.law/de/deu/legal-updates/das-schufa-urteil-des-eugh-und-dessen-auswirkungen
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - de-bdsg-scoring
  - ki-vo-2024-1689
  instanzenzug:
  - eu-2025-dun-bradstreet
  - de-2026-bgh-schufa-auskunft
  - de-2025-lg-bamberg-scoring
  quelle_tracker: EUR-Lex, CELEX 62021CJ0634 (amtliche Fassung des Gerichtshofs); dejure.org als Sekundärnachweis
  verifiziert: true
  letzte_pruefung: &id001 2026-09-05
  eigene_bewertung: 'Die eigentliche Leistung des Urteils ist nicht das Ergebnis, sondern die Zurechnungsfigur:
    Der Gerichtshof verlagert die Verantwortung an die Stelle, an der das Modell steht, nicht an die,
    an der der Mensch unterschreibt. Genau diese Figur taucht seit 2025 in der deutschen KI-Haftungsrechtsprechung
    wieder auf — LG Hamburg zu Grok und LG München I zu AI Overviews argumentieren strukturgleich, ohne
    SCHUFA zu zitieren. Übersehen wird, dass der Gerichtshof das Verhältnis von Art. 22 DSGVO zu Art.
    86 KI-VO nicht berührt hat; die KI-VO-Erläuterung tritt daneben, nicht an die Stelle.

    '
  normen:
  - dsgvo-art-22-abs-1
  - dsgvo-art-15-abs-1-lit-h
  - dsgvo-art-22-abs-2-lit-b
  - ki-vo-art-86
  pruefvermerk:
  - '05.09.2026: Amtliche Fundstelle nachgetragen. Die Entscheidung liegt bei EUR-Lex unter CELEX 62021CJ0634
    vor; die dortigen Angaben bestätigen Rechtssache C-634/21, Urteil des Gerichtshofs (Erste Kammer)
    vom 07.12.2023, Parteien OQ gegen Land Hessen, vorlegendes Gericht Verwaltungsgericht Wiesbaden. Gericht,
    Spruchkörper, Datum, Aktenzeichen und Parteien des Eintrags sind richtig. Die dejure-Adresse steht
    jetzt als sekundaerquelle_url.'
  - '05.09.2026: Die InfoCuria-Oberfläche von curia.europa.eu liefert ohne JavaScript keinen Inhalt; deshalb
    wurde die amtliche EUR-Lex-Fassung als volltext_url gewählt.'
  - '05.09.2026: Nicht geändert — instanz steht auf ''berufung''. Es handelt sich um ein Vorabentscheidungsverfahren;
    die Taxonomie kennt dafür keinen eigenen Wert.'
  sachverhalt: Die SCHUFA Holding AG versorgt ihre Vertragspartner mit Informationen über die Kreditwürdigkeit
    Dritter; dazu errechnet sie mit mathematisch-statistischen Verfahren für eine Person die Wahrscheinlichkeit
    eines künftigen Verhaltens, etwa der Rückzahlung eines Kredits. Nachdem die SCHUFA eine negative Auskunft
    über OQ erteilt hatte, verweigerte ein Dritter ihr den Kredit. OQ verlangte von der SCHUFA Auskunft
    über die gespeicherten personenbezogenen Daten und Löschung der aus ihrer Sicht unrichtigen; die SCHUFA
    nannte die Höhe des Scorewerts und erläuterte die Berechnung in groben Zügen, verweigerte aber unter
    Berufung auf das Betriebs- und Geschäftsgeheimnis die Angabe der einzelnen berücksichtigten Informationen
    und ihrer Gewichtung — im Übrigen beschränke sie sich darauf, ihre Vertragspartner zu informieren,
    die eigentlichen Vertragsentscheidungen träfen diese. Am 18. Oktober 2018 beschwerte sich OQ beim
    Hessischen Beauftragten für Datenschutz und Informationsfreiheit; dieser lehnte den Antrag mit Bescheid
    vom 3. Juni 2020 ab. Dagegen klagte OQ vor dem Verwaltungsgericht Wiesbaden, das die Sache dem Gerichtshof
    der Europäischen Union vorlegte.
  sachverhalt_quelle: volltext
- id: eu-2025-dun-bradstreet
  jurisdiktion: eu
  gericht: Gerichtshof der Europäischen Union (Erste Kammer)
  instanz: berufung
  aktenzeichen: C-203/22
  ecli: ECLI:EU:C:2025:117
  datum: 2025-02-27
  parteien:
    klaeger: CK
    beklagter: Dun & Bradstreet Austria GmbH; Magistrat der Stadt Wien
  status: rechtskraeftig
  themenachsen:
  - datenschutz
  - sektor-finanz
  - grundrechte
  - governance
  anspruchsgrundlage: Art. 15 Abs. 1 lit. h DSGVO; Art. 22 DSGVO; Art. 47 GRCh; § 4 Abs. 6 österr. DSG
  kernfrage: Was schuldet der Verantwortliche, wenn der Betroffene aussagekräftige Informationen über
    die involvierte Logik einer automatisierten Entscheidung verlangt, und wie ist der Konflikt mit Geschäftsgeheimnissen
    aufzulösen?
  ergebnis: 'Der Verantwortliche muss das Verfahren und die angewandten Grundsätze so erläutern, dass
    der Betroffene nachvollziehen kann, welche seiner personenbezogenen Daten wie verwendet wurden und
    wie eine Änderung dieser Daten zu einem anderen Ergebnis geführt hätte. Der Algorithmus selbst, seine
    Formel oder der Quellcode müssen nicht offengelegt werden; eine bloße Übermittlung des Algorithmus
    wäre ohnehin nicht "aussagekräftig". Bei Kollision mit Geschäftsgeheimnissen darf der Verantwortliche
    die Auskunft nicht schlicht verweigern: Er hat die behaupteten geschützten Informationen der Aufsichtsbehörde
    oder dem Gericht vorzulegen, die dann abwägen. § 4 Abs. 6 österr. DSG, der das Auskunftsrecht bei
    Geschäftsgeheimnissen pauschal ausschloss, ist unionsrechtswidrig.

    '
  bedeutung: hoch
  volltext_url: https://eur-lex.europa.eu/legal-content/DE/TXT/PDF/?uri=CELEX%3A62022CJ0203
  zusammenfassung_url: https://curia.europa.eu/site/upload/docs/application/pdf/2025-02/cp250022en.pdf
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  - de-bdsg-scoring
  instanzenzug:
  - eu-2023-schufa-scoring
  - de-2026-bgh-schufa-auskunft
  - de-2026-olg-stuttgart-scoring
  quelle_tracker: EUR-Lex CELEX 62022CJ0203; curia Pressemitteilung 22/25
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Das ist die praktisch wichtigste Transparenzentscheidung für KI in Europa, und sie
    wird regelmäßig falsch zitiert. Der Gerichtshof hat KEIN Recht auf Erklärung der Modelllogik geschaffen,
    sondern ein Recht auf kontrafaktische Nachvollziehbarkeit der eigenen Daten — "hätte ich X geändert,
    wäre Y herausgekommen". Das ist deutlich weniger, als die Explainable-AI-Literatur hineinliest, und
    deutlich mehr, als die Auskunfteien anbieten. Die deutschen Oberlandesgerichte haben daraus gegensätzliche
    Schlüsse gezogen; der BGH entscheidet am 21.10.2026. Der zweite, unterschätzte Satz ist der verfahrensrechtliche:
    Geschäftsgeheimnis ist kein Verweigerungsgrund, sondern ein Grund für ein In-camera-Verfahren.

    '
  normen:
  - dsgvo-art-15-abs-1-lit-h
  - dsgvo-art-22
  sachverhalt: Einer Kundin, im Verfahren CK genannt, verweigerte ein österreichischer Mobilfunkbetreiber
    Abschluss und Verlängerung eines Mobilfunkvertrags über zehn Euro im Monat, weil eine von der Dun
    & Bradstreet Austria GmbH automatisiert durchgeführte Bonitätsbeurteilung ihr keine ausreichende finanzielle
    Bonität bescheinigte. CK wandte sich an die österreichische Datenschutzbehörde; diese trug D & B auf,
    ihr aussagekräftige Informationen über die involvierte Logik dieser automatisierten Entscheidungsfindung
    zu übermitteln. D & B berief sich auf ein Geschäftsgeheimnis und focht das an, unterlag aber vor dem
    Bundesverwaltungsgericht, das mit Erkenntnis vom 23. Oktober 2019 einen Verstoß gegen Art. 15 Abs.
    1 lit. h DSGVO feststellte. Weitere Auskünfte erteilte D & B danach nicht; den Antrag auf Vollstreckung
    des Erkenntnisses wies der Magistrat der Stadt Wien gleichwohl mit der Begründung ab, D & B sei ihrer
    Informationspflicht bereits ausreichend nachgekommen. Dagegen erhob CK Beschwerde an das Verwaltungsgericht
    Wien, das zur Bestimmung der geschuldeten Handlungen einen Sachverständigen bestellte und die Sache
    dem Gerichtshof der Europäischen Union vorlegte.
  sachverhalt_quelle: volltext
- id: eu-2025-like-company-google
  jurisdiktion: eu
  gericht: Gerichtshof der Europäischen Union (Große Kammer)
  instanz: berufung
  aktenzeichen: C-250/25
  ecli: null
  datum: 2025-04-03
  parteien:
    klaeger: Like Company
    beklagter: Google Ireland Limited
  status: anhaengig
  themenachsen:
  - urheberrecht
  - gpai
  - content
  - haftung
  anspruchsgrundlage: Art. 2 und Art. 3 Abs. 2 RL 2001/29/EG (InfoSoc); Art. 4 und Art. 15 RL (EU) 2019/790
    (DSM)
  kernfrage: Ist das Training eines Sprachmodells auf Presseinhalten eine Vervielfältigung nach Art. 2
    InfoSoc-RL, greift dafür die TDM-Schranke des Art. 4 DSM-RL, und ist die Ausgabe eines Chatbots, die
    geschützte Presseinhalte teilweise wiedergibt, öffentliche Wiedergabe nach Art. 3 Abs. 2 InfoSoc-RL?
  ergebnis: 'Noch nicht entschieden. Vorlage des Budapest Környéke Törvényszék (Ungarn), eingegangen am
    03.04.2025. Vier Vorlagefragen: (1) Ausgabe des Chatbots als öffentliche Wiedergabe, auch angesichts
    des prädiktiven Erzeugungsverfahrens; (2) Training des Sprachmodells als Vervielfältigung; (3) falls
    ja, Anwendbarkeit der TDM-Schranke des Art. 4 DSM-RL; (4) Einordnung, wenn der Nutzer den Chatbot
    mit passendem Text zu einer Pressepublikation promptet und der Chatbot deren Inhalt anzeigt. Mündliche
    Verhandlung am 10.03.2026 — die erste Verhandlung des Gerichtshofs zu generativer KI und Urheberrecht
    überhaupt. Schlussanträge des Generalanwalts Maciej Szpunar angekündigt für den 03.09.2026. Stand
    07.09.2026: Schlussanträge sind weiterhin nicht nachweisbar (zweite Prüfung vier Tage nach dem angekündigten
    Termin). Bei EUR-Lex existiert kein Dokument zu CELEX 62025CC0250, und der Gerichtshof hat für den
    03.09.2026 nur die Pressemitteilungen 117/26 (Rs. C-661/24, Schlussanträge Szpunar) und 118/26 (Rs.
    C-320/25) veröffentlicht — keine zu C-250/25. Ob die Schlussanträge verschoben wurden oder ohne Pressemitteilung
    ergangen sind, ist offen. Ein Urteil liegt nicht vor.

    '
  bedeutung: hoch
  volltext_url: https://eur-lex.europa.eu/eli/C/2025/3039/oj
  zusammenfassung_url: https://www.odipi.si/en/like-company-v-google-ireland-ltd-c-250-25/
  bezug_regelwerke:
  - dsm-richtlinie-tdm-urheberrecht-ki
  - ki-vo-2024-1689
  instanzenzug:
  - de-2026-laion-bgh
  - de-2025-gema-openai-lg
  quelle_tracker: EUR-Lex CELEX 62025CN0250; curia.europa.eu (Pressemitteilungen September 2026); EU IP
    Helpdesk; ODIPI
  verifiziert: true
  letzte_pruefung: 2026-09-07
  eigene_bewertung: 'Dies ist das Verfahren, das die deutschen Divergenzen erledigen wird — nicht der
    BGH. Die Fragen 2 und 3 sind exakt der Münchner Streit, die Frage 1 exakt die Output-Frage. Bemerkenswert
    und in der deutschen Diskussion noch nicht verarbeitet ist die Wendung in der Verhandlung: Generalanwalt
    Szpunar hat erwogen, die Trennung von Input und Output aufzugeben und die Gesamtheit der zur Verletzung
    führenden Handlungen einheitlich zu prüfen, unter Hinweis auf Acacia (C-421/20). Würde der Gerichtshof
    dem folgen, wäre die deutsche Dogmatik in beiden Lagern hinfällig: Hamburg prüfte nur den Input, München
    begründete den Input aus dem Output. Die Terminkollision ist bemerkenswert — am 03.09.2026 verhandelt
    der BGH in Karlsruhe und legt Szpunar in Luxemburg vor, am selben Tag zur selben Frage.

    '
  hinweis_widerspruch: 'Der EU IP Helpdesk bezeichnet das vorlegende Gericht als slowakisch und die Spruchkörperbesetzung
    als Plenum. EUR-Lex und die Fachliteratur nennen übereinstimmend das ungarische Budapest Környéke
    Törvényszék; die European Copyright Society und CREATe sprechen von der Großen Kammer. Der Eintrag
    folgt EUR-Lex.

    '
  normen:
  - dsm-rl-art-4
  - dsm-rl-art-15
  pruefvermerk:
  - 'Verweis auf de-urhg-tdm am 2026-09-03 entfernt: im Eintrag nicht belegt.'
  - '05.09.2026: Amtliche Fundstelle geprüft. Die im Eintrag geführte Adresse eur-lex.europa.eu/eli/C/2025/3039/oj
    ist abrufbar und weist Rechtssache C-250/25, Like Company gegen Google Ireland Limited, vorlegendes
    Gericht Budapest Környéki Törvényszék, Eingang 03.04.2025 aus. Aktenzeichen, Parteien und Eingangsdatum
    stimmen.'
  - '05.09.2026: Verfahrensstand geprüft. Der EU IP Helpdesk der Kommission bestätigt die mündliche Verhandlung
    am 10.03.2026 und die Ankündigung der Schlussanträge für den 03.09.2026. Für diesen Tag hat der Gerichtshof
    die Pressemitteilungen 117/26 und 118/26 veröffentlicht, die andere Rechtssachen betreffen; cp260116
    und cp260119 existieren nicht. EUR-Lex kennt zu CELEX 62025CC0250 kein Dokument. Die Schlussanträge
    sind damit am 05.09.2026 nicht veröffentlicht; der Eintrag wurde entsprechend fortgeschrieben.'
  - '05.09.2026: Große Kammer als Spruchkörper an zweiter Quelle bestätigt (Bird & Bird, CREATe / European
    Copyright Society). Am amtlichen Dokument war das nicht nachprüfbar, weil InfoCuria ohne JavaScript
    leer bleibt.'
  - '07.09.2026: Zweite Prüfung des Schlussantragstermins. Weder EUR-Lex (kein Dokument zu CELEX 62025CC0250)
    noch eine Fachquelle weist Schlussanträge des Generalanwalts Szpunar in C-250/25 aus; InfoCuria bleibt
    ohne JavaScript inhaltsleer, die Trefferseite liefert nur "RPEX". Vier Tage nach dem angekündigten
    Termin 03.09.2026 ist damit weder eine Verlesung noch eine förmliche Verlegung belegt. Das ist der
    auffälligste offene Punkt im Bestand: Der BGH hat am selben Tag verhandelt und verkündet am 17.12.2026
    — ob er dabei die Schlussanträge kennt, ist offen.'
  - '07.09.2026: Der Eintrag schreibt im Ergebnis ''Budapest Koernyeke Toervenyszek'', der eigene Pruefvermerk
    und EUR-Lex dagegen ''Budapest Koernyeki Toervenyszek''. Die EUR-Lex-Schreibung ist massgeblich.'
  sachverhalt: Die Google Ireland Limited betreibt einen auf einem großen Sprachmodell beruhenden Chatbot.
    Die ungarische Like Company, die sich auf das Leistungsschutzrecht der Presseverleger beruft, beanstandete,
    dass der Chatbot in seinen Antworten Text sichtbar macht, der mit dem Inhalt von Websites von Presseverlagen
    übereinstimmt — auch dann, wenn ein Nutzer eine Eingabe macht, die dem Text einer Presseveröffentlichung
    entspricht oder auf ihn Bezug nimmt. Zum Training war das Modell mit rechtmäßig zugänglichen Inhalten
    gespeist worden, damit es linguistische Muster erkennen lernt. Like Company klagte gegen Google Ireland
    vor dem Budapest Környéki Törvényszék; dieses setzte das Verfahren aus und legte dem Gerichtshof der
    Europäischen Union am 3. April 2025 vier Fragen vor.
  sachverhalt_quelle: volltext
- id: eu-2026-yettel-bulgaria
  jurisdiktion: eu
  gericht: Gerichtshof der Europäischen Union (Neunte Kammer)
  instanz: berufung
  aktenzeichen: C-806/24
  ecli: null
  datum: 2026-06-03
  parteien:
    klaeger: YETTEL BULGARIA EAD
    beklagter: FB
  status: erledigt
  themenachsen:
  - governance
  - datenschutz
  - haftung
  - marktzugang
  anspruchsgrundlage: Art. 86 Abs. 1 Verordnung (EU) 2024/1689 (KI-VO); RL 93/13/EWG; RL 2011/83/EU; Art.
    38, 47 GRCh
  kernfrage: Kann ein Verbraucher nach Art. 86 Abs. 1 KI-VO verlangen, dass ihm der konkrete Algorithmus
    und die Parameter offengelegt werden, mit denen eine automatisierte Rechnung erzeugt wurde, und darf
    ein Gericht die Offenlegung von Quellcode und Black Box anordnen?
  ergebnis: 'Keine Sachentscheidung. Der Gerichtshof hat mit Beschluss vom 03.06.2026 festgestellt, dass
    der Ausgangsrechtsstreit gegenstandslos geworden ist, und die Erledigung ausgesprochen (Renvoi prejudiciel
    — Litige au principal devenu sans objet — Non-lieu a statür). Das Vorabentscheidungsersuchen des Sofiyski
    rayonen sad vom 25.11.2024 umfasste siebzehn Fragen: Transparenz und Überprüfbarkeit automatisierter
    Entscheidungen, gerichtliche Anordnung der Offenlegung von Quellcode und Algorithmus, Recht auf menschliche
    Überprüfung, Missbräuchlichkeit von Entschädigungsklauseln und Kostentragung.

    '
  bedeutung: mittel
  volltext_url: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:62024CO0806
  zusammenfassung_url: https://www.julia-project.eu/database/case-law/294
  bezug_regelwerke:
  - ki-vo-2024-1689
  - dsgvo-schnittstelle
  instanzenzug:
  - eu-2023-schufa-scoring
  quelle_tracker: EUR-Lex CELEX 62024CO0806; dejure.org; JuLIA-Projekt; ECER (NL)
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Das erste Vorabentscheidungsersuchen zur KI-Verordnung überhaupt ist ohne Sachentscheidung
    geendet — das ist die Nachricht. Das Erläuterungsrecht des Art. 86 KI-VO gilt seit dem 02.08.2026
    und bleibt damit ungeklärt; insbesondere die praktisch entscheidende Frage, ob es einen prozessualen
    Offenlegungsanspruch auf Quellcode trägt oder nur einen materiellen Erläuterungsanspruch nach dem
    Muster von C-203/22. Die Vorlage war überdehnt — siebzehn Fragen, davon der größere Teil zu Verbrauchervertragsrecht
    ohne KI-Bezug — und beruhte auf der zweifelhaften Prämisse, eine Rechnungsberechnungssoftware sei
    ein Hochrisiko-KI-System. Dass die Erledigung ausgerechnet drei Wochen vor Geltungsbeginn des Art.
    86 KI-VO erging, ist ein Zufall mit Wirkung: Der nächste Vorlagefall wird Jahre brauchen.

    '
  normen:
  - ki-vo-art-86-abs-1
