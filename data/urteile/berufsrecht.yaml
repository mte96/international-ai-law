  anspruchsgrundlage: Art. 97 GG (richterliche Unabhängigkeit); § 1 GVG; Landesjustizverwaltungsrecht;
    Art. 6 EMRK
  kernfrage: 'Unter welchen Voraussetzungen darf die deutsche Justiz KI-Systeme zur Vorbereitung und Strukturierung
    von Entscheidungen einsetzen, ohne die richterliche Unabhängigkeit und den gesetzlichen Richter zu
    berühren?

    '
  ergebnis: 'Anders als in den Common-Law-Staaten verläuft die deutsche Entwicklung nicht über Sanktionsentscheidungen,
    sondern über Verwaltungsprojekte. Drei Vorhaben prägen den Stand: FRAUKE (Frankfurter Urteils-Konfigurator
    Elektronisch) am Amtsgericht Frankfurt am Main für Fluggastrechtsverfahren; OLGA (Oberlandesgericht-Assistent)
    in Baden-Württemberg und Bayern zur Strukturierung von Massenverfahren, entwickelt aus dem Dieselkomplex;
    sowie Codefy zur Dokumentenanalyse in Großverfahren. Alle drei sind als Assistenzsysteme ausgestaltet:
    Sie bereiten vor und schlagen vor, entscheiden aber nicht. Eine bundesweit verbindliche Regelung fehlt;
    die Justizministerkonferenz behandelt das Thema fortlaufend. Berufsrechtlich für die Anwaltschaft
    gilt bislang allein die allgemeine Pflicht aus § 43 BRAO, wie sie das Kammergericht in 17 WF 144/25
    konkretisiert hat.

    '
  bedeutung: mittel
  volltext_url: https://www.bmj.de/DE/themen/digitales/digitalisierung_justiz/digitalisierung_justiz_node.html
  zusammenfassung_url: https://www.brak.de/newsroom/
