- id: us-2026-fre-707
  jurisdiktion: us
  gericht: Judicial Conference of the United States, Advisory Committee on Evidence Rules
  instanz: behoerde
  aktenzeichen: Proposed Fed. R. Evid. 707 (machine-generated evidence); Proposed Amendments to Fed. R.
    Evid. 104 und 902
  ecli: null
  datum: 2026-08-14
  parteien:
    klaeger: —
    beklagter: —
  status: anhaengig
  themenachsen:
  - content
  - governance
  - berufsrecht
  anspruchsgrundlage: Rules Enabling Act, 28 U.S.C. §§ 2071-2077; Fed. R. Evid. 702, 901, 902
  kernfrage: 'Soll maschinell erzeugter Beweis, der nicht durch einen menschlichen Sachverständigen vermittelt
    wird, denselben Zuverlässigkeitsanforderungen unterliegen wie das Sachverständigengutachten, und wie
    ist auf Deepfake-Einwände gegen echte Beweismittel zu reagieren?

    '
  ergebnis: 'Der vorgeschlagene Rule 707 will maschinell erzeugte Ergebnisse, die ohne Sachverständigen
    eingeführt werden, den Maßstäben des Rule 702 (Daubert) unterwerfen. Er wurde am 15.08.2025 zur öffentlichen
    Stellungnahme veröffentlicht; die Frist lief bis 16.02.2026. STAND 27.08.2026: Rule 707 ist auf der
    Liste der anhängigen Rechtsänderungen von uscourts.gov NICHT ausgewiesen. Ausgewiesen sind als anhängige
    Beweisregeln allein: Rule 801 mit Inkrafttreten zum 01.12.2026 sowie die Rules 104 und 902 mit voraussichtlichem
    Inkrafttreten zum 01.12.2028. Letztere wurden am 14.08.2026 zur öffentlichen Stellungnahme bis zum
    15.02.2027 veröffentlicht und betreffen die Authentifizierung — also den Regelungsgegenstand, den
    zuvor der Vorschlag eines Rule 901(c) (Einwand der Fälschung durch KI) abdecken sollte.

    '
  bedeutung: hoch
  volltext_url: https://www.uscourts.gov/rules-policies/proposed-amendments-published-public-comment
  zusammenfassung_url: https://www.uscourts.gov/rules-policies/proposed-amendments-published-public-comment
  bezug_regelwerke: []
  instanzenzug:
  - us-2025-mendones-cushman
  - us-2025-kohls-ellison
  quelle_tracker: uscourts.gov (beide Seiten abgerufen); Agenda Book des Advisory Committee May 2026 nicht
    auswertbar (PDF, 13 MB)
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'WIDERSPRUCH, DER NICHT AUFGELÖST WERDEN KONNTE und deshalb so stehen bleibt: Rule
    707 durchlief das Stellungnahmeverfahren, erscheint aber im August 2026 nicht auf der Liste der anhängigen
    Änderungen, während stattdessen die Rules 104 und 902 neu zur Stellungnahme gestellt wurden. Drei
    Deutungen sind möglich — Rule 707 wurde zurückgestellt, er wurde in die Änderungen zu 104 und 902
    überführt, oder die Liste ist unvollständig. Die zweite Deutung ist die wahrscheinlichste, weil 104
    (Vorfragen der Zulässigkeit) und 902 (Selbstauthentifizierung) genau die Stellschrauben sind, an denen
    der Deepfake-Einwand ansetzt: Wer die Echtheit eines Videos bestreitet, streitet über eine Vorfrage
    nach Rule 104, nicht über Sachverständigenbeweis nach Rule 702. Vor Verwendung zwingend am Agenda
    Book des Advisory Committee vom Mai 2026 und am Bericht des Standing Committee vom Juni 2026 zu prüfen.
    Rechtspolitisch ist der eigentliche Streit ohnehin nicht Rule 707, sondern der "liar''s dividend":
    Sobald jedes Video gefälscht sein kann, wird die Behauptung der Fälschung zur Standardverteidigung,
    und die Beweislastverteilung entscheidet den Prozess. Genau dazu schweigen die Vorschläge bislang.

    '
  pruefvermerk:
  - 'An der amtlichen Quelle geprüft (uscourts.gov, ''Proposed Amendments Published for Public Comment''
    und ''Pending Rules and Forms Amendments''): Rule 707 ist dort nicht ausgewiesen. Zur Stellungnahme
    veröffentlicht sind allein die Evidence Rules 104 und 902, Stellungnahmefrist 14.08.2026 bis 15.02.2027,
    Anhörungsanträge bis 08.12.2026; Standing-Committee-Beschlüsse vom 06.01.2026 und vom 03./04.06.2026;
    voraussichtliches Inkrafttreten 01.12.2028. Die Feststellung des Eintrags trifft zu.'
  - 'ERGÄNZT — der fehlende Grund: Der Standing Committee hat am 03./04.06.2026 beschlossen, ''not to
    recommend action on Rule 707 at this time'' und den Entwurf zur Überarbeitung zurückgegeben, nachdem
    das Advisory Committee am 07.05.2026 grundsätzliche Bedenken festgehalten hatte. Rule 707 ist also
    nicht übersehen, sondern angehalten worden.'
  - 'Verfahrensgang bestätigt: Advisory Committee 02.05.2025 (8:1, Widerspruch des DOJ); Freigabe zur
    Veröffentlichung durch den Standing Committee am 10.06.2025; Stellungnahmefrist 15.08.2025 bis 16.02.2026
    — deckt sich mit dem Eintrag.'
  normen:
  - fre-707
  - fre-702
  - fre-901
  - fre-902
  - usc-28-2072
  quelle_art: amtlich
  sachverhalt: 'Vor US-Gerichten treten zunehmend Ergebnisse maschineller Verfahren als Beweismittel auf,
    ohne dass ein menschlicher Sachverständiger sie vermittelt und für sie einsteht. Zugleich lassen sich
    Videos, Fotografien und Nachrichtenverläufe mit generativer KI so herstellen oder verändern, dass
    die Fälschung nicht ohne weiteres erkennbar ist: Im September 2025 stellte ein kalifornisches Staatsgericht
    in Mendones gegen Cushman & Wakefield fest, dass eine Partei mehrere vorgelegte Beweisstücke samt
    Metadaten auf diesem Weg erzeugt oder wesentlich verändert hatte. Für beides kannten die Bundesbeweisregeln
    keine eigene Vorschrift. Der Beweisregelausschuss der Judicial Conference entwarf daraufhin eine Rule
    707, die maschinell erzeugte Ergebnisse denselben Zuverlässigkeitsanforderungen unterwerfen sollte
    wie das Sachverständigengutachten, und stellte sie am 15. August 2025 bis zum 16. Februar 2026 zur
    öffentlichen Stellungnahme; ein Entwurf einer Rule 901(c) sollte den Einwand der KI-Fälschung gegen
    echte Beweismittel regeln. Am 14. August 2026 stellte der Ausschuss stattdessen Änderungen der Rules
    104 und 902 — Vorfragen der Zulässigkeit und Selbstauthentifizierung — bis zum 15. Februar 2027 zur
    Stellungnahme.'
  sachverhalt_quelle: eintrag
- id: de-2021-bgh-smartlaw
  jurisdiktion: de
  gericht: Bundesgerichtshof, I. Zivilsenat
  instanz: revision
  aktenzeichen: I ZR 113/20
  ecli: ECLI:DE:BGH:2021:090921UIZR113.20.0
  datum: 2021-09-09
  parteien:
    klaeger: Hanseatische Rechtsanwaltskammer Hamburg
    beklagter: Wolters Kluwer Deutschland GmbH (smartlaw)
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - marktzugang
  - vertrag
  anspruchsgrundlage: § 2 Abs. 1, § 3 RDG; § 3a UWG
  kernfrage: 'Ist ein digitaler Vertragsgenerator, der auf Grundlage von Nutzereingaben aus einem Entscheidungsbaum
    Vertragstexte zusammensetzt, eine erlaubnispflichtige Rechtsdienstleistung?

    '
  ergebnis: 'Nein. Der BGH verneinte eine Rechtsdienstleistung im Sinne des § 2 Abs. 1 RDG. Der Generator
    prüfe keinen konkreten Einzelfall, sondern arbeite ein vorformuliertes Frage- und Antwortschema ab;
    die Zuordnung von Textbausteinen zu Nutzerangaben sei keine rechtliche Prüfung des Einzelfalls, sondern
    die Anwendung eines vom Anbieter vorab erstellten Schemas. Maßgeblich sei die Perspektive des durchschnittlichen
    Nutzers, der erkenne, dass er ein Werkzeug bedient und keine individuelle Beratung erhält.

    '
  bedeutung: hoch
  volltext_url: https://www.bundesgerichtshof.de/SharedDocs/Entscheidungen/DE/Zivilsenate/I_ZS/2020/I_ZR_113-20.pdf?__blob=publicationFile&v=2
  sekundaerquelle_url: https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=09.09.2021&Aktenzeichen=I+ZR+113%2F20
  zusammenfassung_url: https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2021/2021171.html
  bezug_regelwerke: []
  instanzenzug:
  - de-2019-bgh-wenigermiete
  quelle_tracker: bundesgerichtshof.de (Entscheidungsdatenbank, Volltext-PDF; Pressemitteilung 171/2021);
    dejure.org als Sekundärnachweis
  verifiziert: true
  letzte_pruefung: &id004 2026-09-05
  eigene_bewertung: 'Inhaltlich der entscheidende Vorläufer für die Frage, ob generative Rechtsberatung
    erlaubnispflichtig ist, und zugleich derjenige, der am schlechtesten auf sie passt. Die Begründung
    stützt sich tragend auf das *vorab* vom Anbieter erstellte Schema — genau das, was ein Sprachmodell
    nicht hat. Ein Modell erzeugt die Antwort im Moment der Anfrage und damit einzelfallbezogen. Wer smartlaw
    auf generative Systeme überträgt, kehrt das Ergebnis um. Das ist die zentrale ungeklärte Frage des
    deutschen Rechtsdienstleistungsrechts und der interessanteste deutsche Beitrag zu diesem Feld, weil
    er ohne Halluzinationen auskommt.

    '
  pruefvermerk:
  - 'Am amtlichen Entscheidungsnachweis geprüft: BGH, Urteil vom 09.09.2021 – I ZR 113/20; NJW 2021, 3125;
    GRUR 2021, 1425; MMR 2021, 961. Vorinstanzen LG Köln (08.10.2019) und OLG Köln (19.06.2020).'
  - 'Parteien an zweiter Quelle bestätigt (LTO): Klägerin ist die Hanseatische Rechtsanwaltskammer Hamburg,
    Beklagte die Anbieterin von Smartlaw (Wolters Kluwer). Die Revision der Rechtsanwaltskammer wurde
    zurückgewiesen. Der Eintrag ist insoweit richtig; ein erster Abruf, der ''Rechtsanwaltskammer Hamm''
    auswarf, hat sich als Lesefehler der Zusammenfassung erwiesen.'
  - 'Ergebnis bestätigt: keine unerlaubte Rechtsdienstleistung; der Anbieter werde nicht in einer konkreten
    Angelegenheit des Nutzers tätig, sondern habe den Generator auf denkbare typische Sachverhaltskonstellationen
    hin programmiert.'
  - 'Zum Weg: juris.bundesgerichtshof.de antwortete mit einem Serverfehler; die im Eintrag hinterlegte
    juris-Adresse bleibt als Volltextadresse richtig.'
  - 'verifiziert am 05.09.2026 auf false gesetzt: das Feld stand im Widerspruch zum eigenen Pruefvermerk.'
  - '05.09.2026: Amtliche Fundstelle nachgetragen. Der Volltext liegt in der Entscheidungsdatenbank des
    BGH unter bundesgerichtshof.de/SharedDocs/Entscheidungen/DE/Zivilsenate/I_ZS/2020/I_ZR_113-20.pdf.
    Die dortige Dokumentseite weist Aktenzeichen I ZR 113/20 und Verkündungsdatum 09.09.2021 aus; das
    PDF trägt im Kopf ECLI:DE:BGH:2021:090921UIZR113.20.0 und bestätigt damit die im Eintrag geführte
    ECLI. Die bisherige dejure-Adresse steht jetzt als sekundaerquelle_url.'
  - '05.09.2026: Amtliche Pressemitteilung Nr. 171/2021 vom 09.09.2021 gelesen. Bestätigt I. Zivilsenat,
    Urteil vom 09.09.2021, I ZR 113/20; Klägerin eine Rechtsanwaltskammer, Beklagte ein juristischer Fachverlag;
    die Revision der Klägerin wurde zurückgewiesen, weil der Dokumentengenerator keine rechtliche Prüfung
    des Einzelfalls vornimmt. Gericht, Senat, Datum, Aktenzeichen, Parteirollen und Ergebnis des Eintrags
    sind damit richtig.'
  - '05.09.2026: Vorinstanzen aus der amtlichen Pressemitteilung ergänzt — LG Köln, Urteil vom 08.10.2019
    – 31 O 35/19, und OLG Köln, Urteil vom 19.06.2020 – 6 U 263/19. Die Aktenzeichen der Vorinstanzen
    waren bisher nicht erfasst.'
  - '05.09.2026: Offen geblieben — instanzenzug führt de-2019-bgh-wenigermiete. Nach der amtlichen Pressemitteilung
    ist der Instanzenzug LG Köln / OLG Köln / BGH; wenigermiete.de ist ein eigenes Verfahren. Das Feld
    wurde nicht geändert, weil unklar ist, ob das Projekt es hier bewusst als Sachzusammenhang nutzt.'
  - '05.09.2026: juris.bundesgerichtshof.de ist aus dieser Umgebung nicht abrufbar (robots.txt bzw. Serverfehler).
    Die dortige Dokumentnummer lautet nr=122560.'
  - 'verifiziert am 05.09.2026 auf true gesetzt: Gericht, Senat, Datum, Aktenzeichen, ECLI, Parteirollen,
    Ergebnis und Vorinstanzen sind am amtlichen BGH-Dokument und an der amtlichen Pressemitteilung geprüft.'
