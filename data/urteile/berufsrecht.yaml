  kernfrage: 'Ist ein von Amts wegen eingeleitetes Show-cause-Verfahren wegen Kontempt fortzuführen, wenn
    die Anwältin KI-erfundene Fundstellen eingereicht, den Fehler aber eingeräumt und Abhilfe zugesagt
    hat?

    '
  ergebnis: 'Rechtsanwältin Hanna Lee hatte mit ChatGPT Schriftsätze erstellt und Entscheidungen zitiert,
    die es nicht gibt. Myers J hatte deshalb mit Anordnung vom 06.05.2025 (Ko v. Li, 2025 ONSC 2766) ein
    Show-cause-Verfahren wegen Kontempt eingeleitet. Die hier erfasste Entscheidung vom 20.05.2025 BEENDET
    dieses Verfahren: "I dismiss the show cause proceeding on condition that Ms. Lee fulfill her commitment
    to take Continuing Professional Development courses as described in her written undertaking dated
    May 13, 2025 and that she not bill Ms. Ko for the research, factum writing, and attendance at the
    motion held May 1, 2025." Die Auflagen sind damit mindestens sechs Stunden Fortbildung zu Berufsethik
    und Technik sowie das Verbot, der Mandantin Recherche, Schriftsatzentwurf und Terminwahrnehmung vom
    01.05.2025 in Rechnung zu stellen. Kosten: Ms. Ko erhält je 2.000 CAD auf partial-indemnity-Basis
    von Hai Chun Li und von Mingjie Cheng, zusammen 4.000 CAD.

    '
