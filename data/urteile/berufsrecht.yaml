    in der Wiedergabe der Einreichungen und zwei unzutreffend wiedergegebene Entscheidungen. Richter Julien
    Xavier Neals nahm die Entscheidung durch Minute Order ohne Begründung zurück und erließ später eine
    überarbeitete Fassung, ohne auf die frühere einzugehen. Gegenüber dem Justizausschuss des Senats erklärte
    er, die Fehler gingen auf die Arbeit eines Praktikanten zurück, der ChatGPT eingesetzt habe.

