  sachverhalt: 'Frankie Johnson ist Gefangener in Alabama und führt gegen den früheren Leiter der Gefängnisverwaltung
    Jefferson Dunn ein Verfahren wegen der Gewalt in den Anstalten des Staates. Die Beklagtenseite vertrat
    die Kanzlei Butler Snow. Am 7. und am 12. Mai 2025 reichte sie zwei Anträge ein: Den Entwurf hatte
    William J. Cranford gefertigt, die Fundstellen fügte Matthew B. Reeves hinzu, ohne sie zu überprüfen
    — erzeugt hatte sie ChatGPT. Vier der zitierten Entscheidungen gab es nicht, eine war unzutreffend
    wiedergegeben. Johnson selbst wies in seiner Erwiderung vom 15. Mai 2025 darauf hin, das Gericht prüfte
    nach und erließ am 16. Mai 2025 eine Aufforderung zur Stellungnahme; die betroffenen Anwälte räumten
