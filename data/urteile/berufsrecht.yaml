  anspruchsgrundlage: Ariz. Const. art. II § 2.1 (Victims' Bill of Rights); A.R.S. § 13-4426 (Recht des
    Opfers auf Äußerung); Due Process
  kernfrage: 'Darf im Strafzumessungstermin eine mit KI erzeugte Videodarstellung des getöteten Opfers
    als dessen Opferaussage vorgeführt werden?

    '
  ergebnis: 'Im Verfahren wegen der Tötung von Christopher Pelkey bei einem Verkehrsstreit 2021 führte
    dessen Schwester Stacey Wales im Strafzumessungstermin ein KI-erzeugtes Video vor, in dem ein Abbild
    des Getöteten mit synthetisierter Stimme eine eigene Erklärung abgab und dem Angeklagten vergab. Das
    Gericht ließ die Vorführung zu; Richter Todd F. Lang verhängte wegen "Manslaughter-Reckless, Class
    2" eine Freiheitsstrafe von 10,5 Jahren, die über dem Antrag der Staatsanwaltschaft lag. Die Verteidigung
    griff dies mit dem Rechtsmittel an: Das Video sei kein Beweismittel und keine Äußerung des Opfers,
    sondern eine Konstruktion der Hinterbliebenen, und habe die Strafzumessung unzulässig beeinflusst.
    Verfahrensstand am amtlichen Berufungsregister (Arizona Court of Appeals, Division One, 1 CA-CR 25-0191):
    Rechtsmittel eingelegt am 01.05.2025, Eingang beim Berufungsgericht am 07.05.2025, Schriftsatzwechsel
    abgeschlossen am 20.07.2026, Sache seit dem 05.08.2026 "Under Advisement" vor Department C (Richter
    D. Steven Williams, Anni Hill Foster und David D. Weinzweig). Eine Entscheidung liegt nicht vor.

    '
