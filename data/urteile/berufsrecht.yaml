  eigene_bewertung: 'Die Ironie trägt den Fall: Ein Sachverständiger für Fehlinformation reicht in einem
    Verfahren über ein Deepfake-Gesetz eine Erklärung mit KI-erfundenen Quellen ein, und zwar zur Verteidigung
    des Gesetzes. Juristisch ist der Fall wichtiger, als die Anekdote vermuten lässt: Er dehnt die Prüfungspflicht
    auf den Sachverständigenbeweis aus, wo sie schärfer wirkt als bei Anwälten, weil das Gericht nicht
    sanktioniert, sondern das Beweismittel vollständig verwirft. Ein Anwalt zahlt und macht weiter; ein
    Sachverständiger verliert den Prozessvortrag seiner Partei. Für eine anschauliche Darstellung ist
    das nach Mata der stärkste Stoff.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (CourtListener/RECAP, Originalbeschluss): ''UNITED STATES DISTRICT COURT,
    DISTRICT OF MINNESOTA — Case No. 24-cv-3754 (LMP/DLM) — Christopher Kohls and Mary Franson v. Keith
    Ellison and Chad Larson'', eingereicht am 10.01.2025.'
  - 'Ergänzt: Die vollständige Aktenzeichenangabe lautet 24-cv-3754 (LMP/DLM); LMP steht für die entscheidende
    Richterin Laura M. Provinzino, die der Eintrag zutreffend nennt. Vollständige Parteien: Christopher
    Kohls und Mary Franson gegen Keith Ellison und Chad Larson.'
  - 'Tenor bestätigt: Der Antrag auf Ausschluss der Sachverständigenerklärung wurde hinsichtlich Prof.
    Hancock stattgegeben, hinsichtlich Prof. West zurückgewiesen; der Antrag auf Einreichung einer geänderten
    Erklärung wurde als erledigt zurückgewiesen. Der Eintrag gibt nur den Hancock-Teil wieder, was für
    die Sache trägt.'
