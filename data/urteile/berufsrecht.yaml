- id: us-2024-kruse-karlen
  jurisdiktion: us
  gericht: Missouri Court of Appeals, Eastern District
  instanz: berufung
  aktenzeichen: ED111172 (Kruse v. Karlen)
  ecli: null
  datum: 2024-02-13
  parteien:
    klaeger: Molly Kruse
    beklagter: Jonathan R. Karlen u.a.
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - haftung
  anspruchsgrundlage: Mo. R. Civ. P. 84.19 (damages for frivolous appeal)
  kernfrage: 'Kann eine nicht anwaltlich vertretene Partei zu Schadensersatz wegen mutwilliger Berufung
    verurteilt werden, wenn ihre Berufungsschrift von einem beauftragten Dritten mit generativer KI erstellt
    wurde und fast ausschließlich erfundene Zitate enthält?

    '
  ergebnis: 'Ja. Von 24 zitierten Entscheidungen existierten 22 nicht; die beiden echten waren falsch
    angewendet. Der Berufungsführer hatte einen im Internet gefundenen "Consultant" mit der Erstellung
    der Schriftsätze beauftragt, der generative KI einsetzte. Das Gericht verwarf die Berufung und sprach
    der Gegenseite 10.000 USD Schadensersatz wegen mutwilliger Berufung zu. Kern der Begründung: Die Einreichung
    erfundener Autoritäten ist ein Missbrauch des Justizsystems unabhängig davon, ob die Partei anwaltlich
    vertreten ist; die Selbstvertretung mildert die Pflicht nicht.

    '
  bedeutung: hoch
  volltext_url: https://www.courts.mo.gov/file.jsp?id=205455
  zusammenfassung_url: https://www.courts.mo.gov/page.jsp?id=12086
  bezug_regelwerke: []
  instanzenzug:
  - us-2026-pro-se-linie-halluzination
  quelle_tracker: courts.mo.gov (Volltext der Entscheidung des Missouri Court of Appeals); AI Hallucination
    Cases Database
  verifiziert: true
  letzte_pruefung: *id001
  eigene_bewertung: 'Der Fall ist die Wurzel der eigenen Dogmatik für nicht vertretene Parteien: Weil
    Rule 11 und das Berufsrecht nicht greifen, weichen die Gerichte auf das Institut der mutwilligen Rechtsverfolgung
    aus. Bemerkenswert ist die Sanktionshöhe — 10.000 USD gegen einen Privatmann waren 2024 mehr als das
    Doppelte dessen, was gegen die Anwälte in Mata verhängt wurde. Der eigentliche Verursacher, der kommerzielle
    "Consultant", wurde nicht belangt; das ist die Regelungslücke, die auch die DoNotPay-Verfügung offenlässt.

    '
  pruefvermerk:
  - 'Am Entscheidungstext geprüft: Missouri Court of Appeals, Eastern District, Division Two, Docket ED
    111172, Datum 13.02.2024, Presiding Judge Kurt S. Odenwald (mit Gardner und Hardin-Tammons).'
  - 'KORREKTUR PARTEIEN: Respondent ist Molly Kruse, Appellant ist Jonathan R. Karlen u.a. Der Eintrag
    hatte den Vornamen des Berufungsführers auf die Gegenseite übertragen und führte ''Jonathan R. Kruse''
    als Kläger.'
  - 'Tenor bestätigt: Berufung wegen Verstößen gegen die Berufungsregeln verworfen; ''Appellant is hereby
    ordered to pay Respondent damages towards appellate attorneys'' fees in the amount of $10,000.'' Von
    24 Zitaten waren 22 erfunden — wie im Eintrag.'
  - Die bisherige volltext_url war eine Suchabfrage der 'AI Hallucination Cases Database', kein Dokument.
  - 'Amtliche Fundstelle nachgetragen und am Volltext geprüft: Missouri Court of Appeals, Eastern District,
    Division Two, No. ED111172, 13.02.2024, veröffentlicht auf courts.mo.gov.'
  - 'Am Dokument bestätigt: Rubrum "Molly Kruse v. Jonathan R. Karlen, et al." (die frühere Korrektur
    der Parteirollen ist damit amtlich belegt); Besetzung Kurt S. Odenwald (Presiding Judge), Michael
    E. Gardner und Renée D. Hardin-Tammons; 22 von 24 Fundstellen erfunden oder für unzutreffende Sätze
    zitiert; Tenor "Appellant is hereby ordered to pay Respondent damages towards appellate attorneys''
    fees in the amount of $10,000" bei Verwerfung der Berufung.'
  quelle_art: amtlich
  sachverhalt: Jonathan R. Karlen hatte einen Zivilprozess in Missouri gegen Molly Kruse verloren und
    wollte Berufung einlegen; einen Anwalt nahm er dafür nicht. Stattdessen beauftragte er einen im Internet
    gefundenen "Consultant" mit der Abfassung der Schriftsätze, der dazu generative KI einsetzte. Von
    den vierundzwanzig in der Berufungsschrift zitierten Entscheidungen existierten zweiundzwanzig nicht;
    die beiden echten waren auf den Fall nicht anwendbar. Die Gegenseite beantragte Schadensersatz wegen
    mutwilliger Berufung.
  sachverhalt_quelle: eintrag
- id: us-2024-gauthier-goodyear
  jurisdiktion: us
  gericht: United States District Court, E.D. Texas (Crone, District Judge)
  instanz: erstinstanzlich
  aktenzeichen: No. 1:23-CV-281
  ecli: null
  datum: 2024-11-25
  parteien:
    klaeger: James Gauthier
    beklagter: Goodyear Tire & Rubber Co.
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - haftung
  anspruchsgrundlage: Fed. R. Civ. P. 11(b); Local Rule AT-3; inherent authority
  kernfrage: 'Welche Sanktion ist angemessen, wenn ein Anwalt fahrlässig, aber ohne Verschleierungsabsicht
    KI-erzeugte Scheinzitate einreicht?

    '
  ergebnis: 'Rechtsanwalt Brandon Monk hatte mit Claude einen Schriftsatz zur Abwehr eines summary-judgment-Antrags
    erstellt und weder Zitate noch Belegstellen geprüft. Es fanden sich vollständig erfundene Entscheidungen
    sowie erfundene Zitate, die realen Entscheidungen (u.a. Morales v. SimuFlite, White v. FCI USA) zugeschrieben
    waren. Das Gericht hielt fest, dass Anwälte für die Prüfung aller Einreichungen nach Rule 11 persönlich
    verantwortlich bleiben, unabhängig von der eingesetzten Technik. Sanktionstrias: 2.000 USD Geldbuße,
    verpflichtende Fortbildung (CLE) speziell zu generativer KI in der anwaltlichen Praxis und Pflicht,
    den Beschluss dem eigenen Mandanten offenzulegen.

    '
  bedeutung: mittel
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-txed-1_23-cv-00281/pdf/USCOURTS-txed-1_23-cv-00281-0.pdf
  zusammenfassung_url: https://www.damiencharlotin.com/hallucinations/
  bezug_regelwerke: []
  instanzenzug:
  - us-2023-mata-avianca
  - us-2024-park-kim
  quelle_tracker: AI Hallucination Cases Database
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Wichtiger als der Betrag ist die Sanktionsform. Gauthier etabliert die Fortbildungsauflage
    als Standardreaktion auf den Fahrlässigkeitsfall — sie ist inzwischen in Dutzenden US-Entscheidungen
    wiederholt worden (zuletzt etwa Pauliah, S.D. Miss. 2025, und McCormick, E.D. Tex. 2026). Das ist
    die eigentliche Rechtsfortbildung: Die Gerichte behandeln Halluzinationsfälle nicht als Strafsache,
    sondern als Kompetenzdefizit, und reagieren mit Nachschulung statt mit Geldstrafe. Bemerkenswert ist
    auch, dass hier erstmals ein Anthropic-Modell und nicht ChatGPT der Auslöser war.

    '
