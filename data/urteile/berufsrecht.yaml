    enthalten und die Verantwortlichkeit im Verhältnis Anwältin/Berufsanfängerin ungeklärt bleibt?

    '
  ergebnis: 'Ja. In der ergänzenden Berufungsschrift waren neun Entscheidungen zitiert; nur zwei davon
    existierten, und bei einer der beiden war die Fundstelle falsch — sieben Zitate waren frei erfunden.
    Der Richter prüfte den Verdacht selbst nach: "By way of a brief experiment, the ChatGPT application
    was used and the citation of the Pieterse was entered" — das Modell bestätigte die nicht existierende
    Entscheidung und ihre angebliche Einschlägigkeit. Zu den Erfindungen zählten "Pieterse v The Public
    Protector", "Burgers v The Executive Committee", "Dube v Schleich", "Hassan v Coetzee", "Jordaan v
    Pienaar", "Standard Bank of South Africa Ltd v Lethole" und "Municipality of City of Cape Town v Aon
    South Africa". Die Anwältin verwies auf Arbeitsüberlastung und die Delegation an eine Berufsanfängerin,
    die eine KI-Nutzung bestritt, aber "vague and evasive answers" gab. Das Gericht wies den Antrag auf
    Zulassung der Berufung mit Kosten auf scale C zurück, legte die Kosten der beiden zusätzlichen Termine
    vom 22. und 25.09.2024 auf scale A der Kanzlei Surendra Singh and Associates auf und ersuchte den
    Registrar, das Urteil dem Legal Practice Council (KwaZulu-Natal Provincial Office) zuzuleiten. Kernsatz:
    "In my view, relying on AI technologies when doing legal research is irresponsible and downright unprofessional."

    '
