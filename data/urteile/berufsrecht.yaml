urteile:
- id: us-2023-mata-avianca
  jurisdiktion: us
  gericht: United States District Court, S.D.N.Y. (Castel, District Judge)
  instanz: erstinstanzlich
  aktenzeichen: No. 22-cv-1461 (PKC)
  ecli: null
  datum: 2023-06-22
  parteien:
    klaeger: Roberto Mata
    beklagter: Avianca, Inc.
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - haftung
  - governance
  anspruchsgrundlage: Fed. R. Civ. P. 11(b)(2) und 11(c); hilfsweise inherent authority des Gerichts
  kernfrage: 'Verletzt ein Anwalt Rule 11, wenn er von ChatGPT erzeugte, nicht existierende Entscheidungen
    einreicht, und liegt bösgläubiges Handeln vor, wenn er nach Beanstandung an ihnen festhält?

    '
  ergebnis: 'Ja. Der Ursprungsfall der weltweiten Fallreihe. Steven A. Schwartz hatte ChatGPT zur Recherche
    eingesetzt und sechs erfundene Entscheidungen zitiert, darunter "Varghese v. China Southern Airlines".
    Peter LoDuca unterzeichnete die Schriftsätze, ohne die Fundstellen zu lesen. Castel J verhängte gegen
    Schwartz, LoDuca und die Kanzlei Levidow, Levidow & Oberman gesamtschuldnerisch 5.000 USD zur Zahlung
    in die Gerichtskasse und ordnete an, den Beschluss den Mandanten und den Richtern zu übersenden, deren
    Namen den erfundenen Entscheidungen beigelegt worden waren. Entscheidend war nicht der Einsatz des
    Werkzeugs — das Gericht hielt fest, an der Nutzung generativer KI sei "nothing inherently improper"
    —, sondern das Festhalten an den Zitaten nach Beanstandung durch Gegenseite und Gericht. Das Gericht
    bejahte subjektive Bösgläubigkeit über die Figur der "conscious avoidance": Schwartz hatte "Varghese"
    erfolglos gesucht und dennoch zitiert; LoDuca hatte eidesstattlich versichert, im Urlaub gewesen zu
    sein, während tatsächlich Schwartz abwesend war.

    '
  bedeutung: hoch
  volltext_url: https://storage.courtlistener.com/recap/gov.uscourts.nysd.575368/gov.uscourts.nysd.575368.54.0_8.pdf
  zusammenfassung_url: https://www.damiencharlotin.com/hallucinations/?q=Mata
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: CourtListener/RECAP Docket 1:22-cv-01461 (S.D.N.Y.), Dkt. 54 mit ECF-Kopfstempel
  verifiziert: true
  letzte_pruefung: &id002 2026-09-05
  eigene_bewertung: 'Wird durchweg falsch erinnert. Sanktioniert wurde nicht die KI-Nutzung, sondern die
    Lüge danach — die 5.000 USD sind eine Sanktion für bad faith, nicht für Fahrlässigkeit. Das erklärt,
    warum die Beträge in der Folgezeit stark streuen: Gerichte, die ehrliche Einlassung honorieren, sanktionieren
    niedrig oder gar nicht (Lacey: die einzelnen Anwälte blieben verschont), Gerichte, die Vertuschung
    feststellen, sanktionieren hoch. Für die Darstellung ist der Fall der Einstieg schlechthin: es gibt
    ein Transkript der Anhörung vom 08.06.2023, in der Schwartz erklärt, er habe ChatGPT gefragt, ob die
    Fälle echt seien, und ChatGPT habe "ja" geantwortet.

    '
  normen:
  - frcp-11-b
  - frcp-11-c
  pruefvermerk:
  - 'Am eingereichten Dokument mit ECF-Kopfstempel geprüft: "Case 1:22-cv-01461-PKC Document 54 Filed
    06/22/23 Page 1 of 43", Memorandum & Opinion, S.D.N.Y.'
  - Gericht, Aktenzeichen (1:22-cv-01461-PKC) und Datum (22.06.2023) stimmen mit dem Eintrag überein.
  - volltext_url von der Datenbank Justia auf das tatsächlich eingereichte Dokument in RECAP umgestellt;
    quelle_art damit amtlich.
  quelle_art: amtlich
  sachverhalt: Auf einem Flug von El Salvador nach New York-JFK stieß ein metallener Servierwagen gegen
    das linke Knie von Roberto Mata. Am 2. Februar 2022 klagte er vor dem New Yorker Staatsgericht gegen
    die Fluggesellschaft Avianca; diese ließ die Sache am 22. Februar 2022 an das Bundesgericht verweisen
    und beantragte am 13. Januar 2023 die Abweisung wegen Ablaufs der zweijährigen Frist des Montrealer
    Übereinkommens. Für die Erwiderung setzte Matas Anwalt Steven A. Schwartz ChatGPT ein und übernahm
    sechs Entscheidungen, die es nicht gibt, darunter "Varghese v. China Southern Airlines"; sein Kanzleikollege
    Peter LoDuca unterzeichnete den am 1. März 2023 eingereichten Schriftsatz, ohne die Fundstellen zu
    lesen. Am 15. März 2023 teilte Avianca mit, die zitierten Entscheidungen ließen sich überwiegend nicht
    auffinden; das Gericht forderte am 11. und 12. April 2023 ihre Vorlage. Am 25. April 2023 reichte
    LoDuca eine eidesstattliche Versicherung ein, der er die angeblichen Entscheidungstexte beifügte.
    In der Anhörung am 8. Juni 2023 erklärte Schwartz, er habe ChatGPT gefragt, ob die Fälle echt seien,
    und ChatGPT habe das bejaht.
  sachverhalt_quelle: volltext
- id: us-2024-park-kim
  jurisdiktion: us
  gericht: United States Court of Appeals for the Second Circuit (Parker, Nathan, Merriam, Circuit Judges)
  instanz: berufung
  aktenzeichen: No. 22-2057
  ecli: null
  datum: 2024-01-30
  parteien:
    klaeger: Minhye Park (Plaintiff-Appellant)
    beklagter: David Dennis Kim (Defendant-Appellee)
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - haftung
  anspruchsgrundlage: Fed. R. App. P. 46(c); Fed. R. Civ. P. 11; Local Rule 46.2 (Grievance Panel)
  kernfrage: 'Genügt eine Anwältin ihrer Prüfungspflicht, wenn sie eine von ChatGPT gelieferte Fundstelle
    in die Berufungsbegründung übernimmt, ohne die Entscheidung selbst gelesen zu haben?

    '
  ergebnis: 'Nein. Rechtsanwältin Jae S. Lee hatte in der Reply Brief eine nicht existierende Entscheidung
    ("Matter of Bourguignon v. Coordinated Behavioral Health Servs.") zitiert, die ChatGPT erzeugt hatte.
    Auf Aufforderung konnte sie die Entscheidung nicht vorlegen. Der Second Circuit stellte den Maßstab
    in einem Satz auf, der seither international zitiert wird: Anwälte müssen die Autoritäten, auf die
    sie sich stützen, "read, and thereby confirm the existence and validity of". Nur so lasse sich sicherstellen,
    dass die Argumente "warranted by existing law" und "legally tenable" seien. Das Gericht verwies Lee
    an sein Grievance Panel zur weiteren Untersuchung und zur Prüfung einer Verweisung an das Committee
    on Admissions and Grievances und verpflichtete sie, ihrer Mandantin eine — erforderlichenfalls ins
    Koreanische übersetzte — Abschrift der Entscheidung binnen 21 Tagen zu übermitteln.

    '
  bedeutung: hoch
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-ca2-22-02057/pdf/USCOURTS-ca2-22-02057-0.pdf
  zusammenfassung_url: https://www.damiencharlotin.com/hallucinations/?q=Park
  bezug_regelwerke: []
  instanzenzug:
  - us-2023-mata-avianca
  quelle_tracker: govinfo.gov, GPO-authentifizierte Sammlung United States Courts Opinions (USCOURTS-ca2-22-02057);
    Justia
  verifiziert: true
  letzte_pruefung: &id001 2026-09-05
  eigene_bewertung: 'Die erste US-Bundesberufungsentscheidung zur Sache und deshalb die dogmatisch wichtigste
    der frühen Reihe. Sie formuliert die Pflicht nicht als KI-Sonderrecht, sondern als Anwendung des bestehenden
    Rule 11: die Pflicht, das Zitierte gelesen zu haben, gilt seit je, KI macht ihre Verletzung nur sichtbar.
    Genau diese Konstruktion — kein neues Recht, sondern Offenlegung eines alten Versäumnisses — hat der
    englische Divisional Court in Ayinde übernommen. Wer die internationale Konvergenz erklären will,
    beginnt hier und nicht bei Mata.

    '
  normen:
  - frcp-11-b
  pruefvermerk:
  - 'Amtliche Fundstelle nachgetragen und am Volltext geprüft: govinfo.gov, Sammlung United States Courts
    Opinions, Package USCOURTS-ca2-22-02057. Second Circuit, No. 22-2057, 30.01.2024, Besetzung PARKER,
    NATHAN und MERRIAM, Circuit Judges.'
  - 'KORREKTUR NAME: Die sanktionierte Anwältin heißt Jae S. Lee; der Eintrag führte "Jae S. Lee" (Folge
    einer systematischen Zeichenverfälschung im Bestand, bei der englisches "ae" zu "ä" geworden ist).'
  - 'PARTEIEN ergänzt: Das Rubrum lautet Minhye Park (Plaintiff-Appellant) gegen David Dennis Kim (Defendant-Appellee);
    der Eintrag führte nur die Nachnamen.'
  - 'Am Dokument bestätigt: die erfundene Entscheidung "Matter of Bourguignon v. Coordinated Behavioral
    Health Servs., Inc., 114 A.D.3d 947 (3d Dep''t 2014)"; die Verweisung "REFER[RED] Attorney Lee to
    the Court''s Grievance Panel pursuant to Local Rule 46.2 for further investigation, and for consideration
    of a referral to the Committee on Admissions and Grievances"; und der Leitsatz "At the very least,
    the duties imposed by Rule 11 require that attorneys read, and thereby confirm the existence and validity,
    of the legal authorities on which they rely."'
  quelle_art: amtlich
  sachverhalt: Minhye Park klagte vor dem Bundesgericht in Brooklyn gegen den Arzt David Dennis Kim. Sie
    befolgte über Monate hinweg die Anordnungen zur Beweismittelvorlage nicht, obwohl die zuständige Magistratsrichterin
    sie mehrfach ausdrücklich warnte, dies sei ihre letzte Gelegenheit; nach mehr als sieben Monaten wies
    das Gericht die Klage wegen anhaltender und vorsätzlicher Widersetzlichkeit ab. Ihre Anwältin Jae
    S. Lee legte Berufung zum Second Circuit ein. Für die Replik suchte sie eine Entscheidung, die ihre
    Argumentation zur Bemessung des Verdienstausfalls stützte, fand keine und fragte ChatGPT; das Programm
    lieferte "Matter of Bourguignon v. Coordinated Behavioral Health Servs., Inc., 114 A.D.3d 947 (3d
    Dep't 2014)". Diese Entscheidung gibt es nicht. Als das Berufungsgericht sie zur Vorlage aufforderte,
    konnte Lee sie nicht beibringen und räumte ein, sie weder gelesen noch auf ihre Gültigkeit überprüft
    zu haben.
  sachverhalt_quelle: volltext
- id: us-2023-crabill-colorado
  jurisdiktion: us
  gericht: Colorado Supreme Court, Office of the Presiding Disciplinary Judge
  instanz: behoerde
  aktenzeichen: Case No. 23PDJ067 (People v. Crabill)
  ecli: null
  datum: 2023-11-22
  parteien:
    klaeger: The People of the State of Colorado
    beklagter: Zachariah C. Crabill
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  anspruchsgrundlage: Colo. RPC 1.1 (competence), 1.3 (diligence), 3.3 (candor toward the tribunal), 8.4(c)
  kernfrage: 'Rechtfertigt die Einreichung ChatGPT-erzeugter Scheinzitate in Verbindung mit der anschließenden
    Falschbezichtigung eines Referendars die Aussetzung der Zulassung?

    '
  ergebnis: 'Ja. Crabill hatte in einem Antrag auf Aufhebung eines Versäumnisurteils mit ChatGPT recherchierte,
    nicht existierende Entscheidungen zitiert. Auf Nachfrage des Richters schob er die Verantwortung zunächst
    einem Rechtspraktikanten zu und räumte erst später die ChatGPT-Nutzung ein. Er unterwarf sich der
    Feststellung von Verstößen gegen Kompetenz-, Sorgfalts- und Wahrheitspflichten. Die Sanktion: Aussetzung
    der Zulassung für 366 Tage, davon 276 Tage zur Bewährung ausgesetzt bei zweijähriger Bewährungszeit
    — also 90 Tage tatsächliche Aussetzung. Ausdrücklich straferschwerend wirkte nicht die KI-Nutzung,
    sondern die Unehrlichkeit gegenüber dem Gericht.

    '
  bedeutung: hoch
  volltext_url: null
  zusammenfassung_url: https://coloradosupremecourt.com/PDJ/PDJ_Decisions.asp
  bezug_regelwerke: []
