  sachverhalt: Generative Chatbots sind kostenlos oder für wenige Dollar im Monat zugänglich; einen Anwalt
    können sich viele Prozessparteien in den Vereinigten Staaten nicht leisten. Seit 2023 reichen deshalb
    immer mehr Menschen, die sich selbst vertreten, Schriftsätze bei Gericht ein, die sie mit ChatGPT
    und ähnlichen Werkzeugen erstellt haben — und darin stehen Entscheidungen, die es nicht gibt. In einer
    Auswertung der Datenbasis vom 27. August 2026 entfielen von 31 erfassten Fällen 22 auf nicht vertretene
    Parteien, acht auf Anwälte und einer auf einen Sachverständigen. Die Bandbreite reicht von einem Berufungsführer
    in Missouri, dessen Schriftsätze ein im Internet angeworbener "Consultant" erstellt hatte, über mehrere
    Verfahren vor dem Supreme Court von North Dakota bis zu Klagen vor Bundesgerichten in Mississippi
    und Kalifornien.
