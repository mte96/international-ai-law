    Der Eintrag führte nur ''Ko'' und ''Li''.'
  - 'SCHWERWIEGENDE ABWEICHUNG IM ERGEBNIS: Der Eintrag behauptet, das Gericht habe ''von Amts wegen ein
    Verfahren zur Prüfung von Kontempt eingeleitet — der erste Fall weltweit, in dem ein Gericht diesen
    Schritt tatsächlich vollzog''. Tatsächlich ist 2025 ONSC 2965 die Entscheidung ÜBER das zuvor eingeleitete
    Show-cause-Verfahren, und sie stellt es EIN: Die Einleitung erfolgte durch die frühere Anordnung vom
    06.05.2025 (2025 ONSC 2766); in 2025 ONSC 2965 wird das Kontemptverfahren unter Auflagen abgewiesen
    — Ms. Lee hat CPD-Kurse zu Berufsethik und Technik zu absolvieren und darf Recherche, Schriftsatzentwurf
