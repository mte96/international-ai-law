  eigene_bewertung: 'Die derzeit höchste dokumentierte Sanktion weltweit und damit der neue Referenzpunkt
    — sie löst Lacey ab, das 15 Monate lang als Höchstmarke galt. Der Fall ist die Eskalationsstufe, die
    der englische Divisional Court in Ayinde angekündigt hatte: Es geht nicht mehr um Fahrlässigkeit,
    sondern um beharrliches Festhalten nach Aufdeckung. Bemerkenswert ist die Struktur der Sanktion —
    nur 10.000 USD sind Strafe, der weit größere Teil ist Kostenerstattung. Das ist der eigentliche Hebel:
    Der ökonomische Schaden entsteht nicht durch die Buße, sondern dadurch, dass die Gegenseite die Fälschungen
    aufdecken musste und diese Arbeit bezahlt bekommt. Wer die Entwicklung der Sanktionshöhen erklären
    will, muss diesen Wechsel von der Strafe zur Kostenerstattung herausstellen — er erklärt den Sprung
    von 5.000 auf 46.511 USD besser als jede Verschärfung der Maßstäbe.

