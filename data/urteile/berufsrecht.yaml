  sachverhalt: Ende Mai 2023 wurde bekannt, dass zwei New Yorker Anwälte in dem Verfahren Mata gegen Avianca
    sechs von ChatGPT erfundene Entscheidungen bei Gericht eingereicht und auch nach der Beanstandung
    an ihnen festgehalten hatten; der Vorgang ging binnen Tagen durch die amerikanische Presse. Eine gerichtliche
    Regelung zum Einsatz generativer KI gab es zu diesem Zeitpunkt nirgends. Richter Brantley Starr vom
    Bundesgericht für den Northern District of Texas reagierte am 30. Mai 2023 mit einer Verfahrensanordnung
    für seine eigene Kammer und verlangte von jedem dort auftretenden Prozessvertreter eine Bescheinigung;
    zur Begründung führte er an, die Systeme neigten zu Halluzinationen und Voreingenommenheit und hätten
    keinen Eid auf die Verfassung geleistet. In den folgenden Monaten erließen Dutzende weitere Bundesrichter
    eigene Anordnungen mit teils erheblich abweichendem Inhalt.
