  kernfrage: 'Ist die Erklärung eines Sachverständigen zu verwerten, wenn sie von KI erzeugte, nicht existierende
    wissenschaftliche Fundstellen enthält?

    '
  ergebnis: 'Nein. In einem Verfahren gegen das Deepfake-Gesetz von Minnesota legte der Attorney General
    eine Erklärung von Prof. Jeff Hancock (Stanford, Direktor des Social Media Lab und ausgewiesener Fachmann
    für Fehlinformation) vor. Sie enthielt drei nicht existierende wissenschaftliche Nachweise, erzeugt
    mit GPT-4o. Das Gericht schloss die Erklärung insgesamt aus: Die Halluzinationen hätten die Glaubwürdigkeit
    des Sachverständigen zerstört.

    '
