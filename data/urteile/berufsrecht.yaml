  eigene_bewertung: 'Wichtig für die Frage, wie weit Gerichte tatsächlich gehen — und ein Beispiel dafür,
    wie leicht die Sekundärliteratur zwei Entscheidungen desselben Verfahrens verwechselt. Die Einleitung
    des Kontemptverfahrens steht in 2025 ONSC 2766 (06.05.2025), die Einstellung unter Auflagen in 2025
    ONSC 2965 (20.05.2025). Wer nur die zweite Entscheidung zitiert, um zu belegen, ein Gericht habe Kontempt
    verfolgt, zitiert die Entscheidung, die genau das nicht mehr tut. Die Sanktion liegt materiell im
    Honorarverbot und in der Fortbildungsauflage, nicht in einer Strafe. Der Vergleich mit Ayinde (Divisional
    Court sieht von Kontempt ab) ist damit weniger ein Gegensatz als eine Parallele. UNBELEGT: Die früher
    hier behauptete sechsmonatige Aussetzung der Zulassung durch die Law Society of Ontario im Juli 2026
    nebst 10.000 CAD ließ sich an keiner Quelle bestätigen und ist aus dem Eintrag entfernt; vor jeder
    Verwendung im LSO-Tribunal-Register nachschlagen.

    '
  pruefvermerk:
