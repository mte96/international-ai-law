  letzte_pruefung: *id001
  eigene_bewertung: 'NICHT VERIFIZIERT — Datum, Strafmaß, Name des Richters und insbesondere der Ausgang
    des Rechtsmittelverfahrens konnten nicht belegt werden; der Eintrag beruht auf Modellwissen und ist
    vor jeder Verwendung, erst recht vor einer Veröffentlichung, gegen azcourts.gov zu prüfen. Inhaltlich
    ist es der weltweit erste Fall, in dem eine synthetische Darstellung eines Verstorbenen im Gerichtssaal
    Wirkung entfaltet hat, und er liegt außerhalb aller bisherigen Kategorien: Es geht nicht um Beweis,
    sondern um die Opferaussage, für die die Beweisregeln gerade nicht gelten. Genau darin liegt die Lücke
    — die vorgeschlagene Rule 707 erfasst maschinell erzeugte *Beweismittel*, nicht maschinell erzeugte
    Äußerungen im Strafzumessungsverfahren. Für die Darstellung ist das der eindringlichste Fall des gesamten
    Feldes, weil er ohne Vorkenntnisse verständlich ist und die eigentliche Frage stellt: Was darf ein
    Gericht sehen und hören, wenn beides herstellbar ist?

    '
  pruefvermerk:
  - 'Vorgang an Presseberichten bestätigt (AP/CBS/NBC, 08.-10.05.2025): Superior Court of Arizona, Maricopa
    County; im Strafzumessungstermin für die Tötung von Christopher Pelkey führte die Schwester des Getöteten,
    Stacey Wales, ein KI-erzeugtes Video mit synthetisierter Stimme vor; die Verteidigung legte gegen
    die Strafzumessung Rechtsmittel ein.'
  - 'NICHT AM PRIMÄRDOKUMENT GEPRÜFT: Ein Aktenzeichen (CR-Nummer des Maricopa County Superior Court)
    ließ sich nicht ermitteln; azcourts.gov/opinions führt keine erstinstanzlichen Strafzumessungsprotokolle.
    Damit blieben Datum (Eintrag: 01.05.2025) und Aktenzeichen ungeprüft.'
  - 'Für die Prüfung im Browser: Fallregister des Maricopa County Superior Court (superiorcourt.maricopa.gov)
    nach ''Horcasitas''.'
  - AMTLICHE FUNDSTELLE GEFUNDEN — die frühere Feststellung "nicht am Primärdokument geprüft" ist überholt.
    Am amtlichen Berufungsregister der arizonischen Gerichte geprüft (apps.azcourts.gov, Arizona Appellate
    Case Information für 1 CA-CR 25-0191).
  - 'AKTENZEICHEN ERGÄNZT: Das erstinstanzliche Aktenzeichen lautet Maricopa County Superior Court CR2021-142720-001;
    das Berufungsverfahren trägt die Nummer 1 CA-CR 25-0191. Der Eintrag führte als Aktenzeichen bislang
    nur den Parteinamen.'
  - 'ERGÄNZT: Strafzumessungsrichter Todd F. Lang; Schuldspruch der Jury wegen "Manslaughter-Reckless,
    Class 2"; Strafe 10,5 Jahre ADCRR.'
  - 'DATUM bestätigt: Das Register weist den 01.05.2025 als Tag der Einlegung des Rechtsmittels aus —
    denselben Tag, an dem das KI-Video im Strafzumessungstermin vorgeführt wurde.'
  - 'Verfahrensstand: seit 05.08.2026 "Under Advisement" vor Division One, Department C; eine Rechtsmittelentscheidung
    ist bis heute (05.09.2026) nicht ergangen.'
  normen:
  - us-const-amend-14
  quelle_art: amtlich
  sachverhalt: 'Bei einem Verkehrsstreit in Arizona tötete Gabriel Paul Horcasitas im Jahr 2021 Christopher
    Pelkey durch Schüsse. Er wurde wegen Totschlags in leichtfertiger Begehungsform verurteilt. Für den
    Strafzumessungstermin ließ Pelkeys Schwester Stacey Wales ein Video herstellen, in dem ein KI-erzeugtes
    Abbild ihres Bruders mit synthetischer Stimme selbst zu Wort kam und dem Angeklagten vergab. Sie führte
    es im Termin als Äußerung des Opfers vor; das Gericht ließ die Vorführung zu. Richter Todd F. Lang
    verhängte eine Freiheitsstrafe von zehneinhalb Jahren und ging damit über den Antrag der Staatsanwaltschaft
    hinaus. Am 1. Mai 2025 legte die Verteidigung Rechtsmittel ein: Das Video sei kein Beweismittel und
    keine Äußerung des Opfers, sondern eine Konstruktion der Hinterbliebenen, und habe die Strafzumessung
    unzulässig beeinflusst.'
