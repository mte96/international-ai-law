  kernfrage: 'Ist die Einreichung KI-erfundener Entscheidungen ein Verfahrensmissbrauch, und rechtfertigt
    sie besondere Kosten gegen die Anwältin persönlich?

    '
  ergebnis: 'Der erste kanadische Fall. Rechtsanwältin Chong Ke hatte in einen familienrechtlichen Antrag
    zwei nicht existierende Entscheidungen aufgenommen, die sich als von ChatGPT erfunden herausstellten.
    Der Kernsatz (Rn. 29): "Citing fake cases in court filings and other materials handed up to the court
    is an abuse of process and is tantamount to making a false statement to the court. Unchecked, it can
    lead to a miscarriage of justice." Zur Kostenentscheidung: Ms. Zhang war im Wesentlichen erfolgreich
    und erhielt die Kosten des Antrags nach R. 16-1 Supreme Court Family Rules (Rn. 23). Den Antrag auf
    special costs persönlich gegen Ms. Ke wies Masuhara J ab (Rn. 32): Er verneinte eine Täuschungsabsicht,
    nahm ihr die Naivität gegenüber den Risiken von ChatGPT ab und berücksichtigte die erhebliche negative
    Publizität, der sie bereits ausgesetzt war. Stattdessen machte er sie nach R. 16-1(30)(c) und (d)
    persönlich für den Mehraufwand haftbar, den die erfundenen Fundstellen verursacht hatten: Kosten für
    vier halbe Verhandlungstage (15., 23. und 31.01. sowie 02.02.2024), festzusetzen durch den Registrar
    nach Appendix B der Rules. Zusätzlich ordnete er an, dass Ms. Ke sämtliche bei diesem Gericht anhängigen
    Akten durchsieht, Gegenseite und Gericht unverzüglich unterrichtet, falls weitere von ChatGPT oder
    anderen generativen Werkzeugen stammende Fundstellen auftauchen, und andernfalls binnen 30 Tagen einen
    Bericht über die Durchsicht vorlegt.

    '
