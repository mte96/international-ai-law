  quelle_art: amtlich
  sachverhalt: Ein juristischer Fachverlag bot im Internet unter dem Namen smartlaw einen digitalen Generator
    für Verträge und andere Rechtsdokumente an, die Kunden im Abonnement oder einzeln erwerben konnten.
    Der Generator stellt dem Kunden verschiedene, überwiegend im Multiple-Choice-Verfahren zu beantwortende
    Fragen; aus den Antworten setzt eine Software aus einer Sammlung von Textbausteinen Vertragsklauseln
    zusammen und fügt sie zu einem Vertragsentwurf. Die Hanseatische Rechtsanwaltskammer Hamburg sah in
    der digitalen Erstellung eines individuellen Vertragsdokuments eine wettbewerbswidrige Rechtsdienstleistung
    und nahm den Verlag auf Unterlassung in Anspruch. Das Landgericht Köln gab der Klage am 8. Oktober
    2019 statt (31 O 35/19); auf die Berufung des Verlags wies das Oberlandesgericht Köln den Unterlassungsantrag
    am 19. Juni 2020 ab (6 U 263/19). Dagegen legte die Kammer Revision zum Bundesgerichtshof ein.
