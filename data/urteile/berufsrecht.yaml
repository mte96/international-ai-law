  eigene_bewertung: 'Der bislang wichtigste Fall zu KI-erzeugten Beweismitteln und zugleich der am wenigsten
    beachtete. Er markiert den Übergang von der erfundenen Fundstelle zum gefälschten Beweismittel — und
    die Sanktion springt sofort auf die Höchststufe: nicht Geld, sondern Klageabweisung mit Rechtskraftwirkung.
    Das ist folgerichtig, weil eine erfundene Fundstelle auffällt, sobald jemand nachschlägt, ein manipuliertes
    Video dagegen nicht. Bemerkenswert ist die Einbeziehung der Metadaten: Das Gericht prüfte nicht nur
    den Inhalt, sondern die Erzeugungsspur. Für Prozessvertreter ist das die praktisch wichtigste Lehre
    des gesamten Feldes — und der Übergang zum "liar''s dividend", weil jede Partei nun jedes echte Beweismittel
    als KI-erzeugt bestreiten kann.

    '
