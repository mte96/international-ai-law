  kernfrage: 'Bedarf der Einsatz generativer KI durch Bundesrichter und ihre Mitarbeiter verbindlicher
    Regeln, und wie ist mit fehlerhaften, KI-gestützten Entscheidungen umzugehen?

    '
  ergebnis: 'Der Justizausschuss des Senats richtete am 06.10.2025 Schreiben an beide Richter und verlangte
    Auskunft, ob sie, ihre Rechtsreferendare oder Mitarbeiter generative KI eingesetzt oder nicht öffentliche
    Verfahrensdaten in KI-Werkzeuge eingegeben hatten; zugleich forderte er, die zurückgezogenen Beschlüsse
    wieder in das Register aufzunehmen, um die Vorgänge nachvollziehbar zu halten. Beanstandet waren bei
    Wingate die Benennung von Parteien, die am Verfahren nicht beteiligt waren, falsch wiedergegebenes
    Landesrecht, aktenwidrige Feststellungen und die Erwähnung von vier im Verfahren nicht vorkommenden
    Personen; bei Neals unzutreffend zugeschriebene Zitate, Zitate aus Entscheidungen, die sie nicht enthielten,
    und falsch wiedergegebene Verfahrensausgänge. Am 23.10.2025 veröffentlichte der Vorsitzende die Antworten:
    Beide Richter räumten ein, dass ihre Mitarbeiter generative KI zum Entwurf der fehlerhaften Beschlüsse
    eingesetzt hatten. Wingate verlangt seither eine zweite unabhängige Durchsicht aller Entwürfe von
    Entscheidungen, Beschlüssen und Vermerken und die Beifügung aller zitierten Entscheidungen in Papierform;
    Neals erließ eine schriftliche Weisung, die allen Rechtsreferendaren und Praktikanten den KI-Einsatz
    beim Entwurf von Entscheidungen untersagt, verbunden mit einer mehrstufigen Kontrolle. Das Administrative
    Office of the U.S. Courts beschrieb in seiner eigenen Antwort eine beratende KI-Arbeitsgruppe; deren
    vorläufige Leitlinien vom 31.07.2025 enthalten nach eigener Beschreibung "general, non-technical suggestions",
    die "the use of and experimentation with AI tools" zulassen und unter anderem anregen zu erwägen,
    "whether the use of AI should be disclosed".

    '
