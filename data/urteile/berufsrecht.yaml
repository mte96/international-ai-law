  anspruchsgrundlage: Befugnis zum Erlass richterlicher Verfahrensanordnungen (standing orders); Fed.
    R. Civ. P. 83(b)
  kernfrage: 'Kann ein einzelner Bundesrichter den Prozessvertretern durch Verfahrensanordnung eine Offenlegungs-
    und Bestätigungspflicht für den KI-Einsatz auferlegen?

    '
  ergebnis: 'Die weltweit erste gerichtliche Regelung zum KI-Einsatz, erlassen drei Tage nach Bekanntwerden
    von Mata v. Avianca. Sie verlangt von allen vor der Kammer auftretenden Prozessvertretern eine Bescheinigung,
    dass entweder kein Teil der Einreichung durch generative KI erstellt wurde oder jeder so erstellte
    Teil durch einen Menschen anhand herkömmlicher Quellen überprüft wurde. In der Begründung heißt es,
    die Systeme seien "prone to hallucinations and bias" und leisteten keinen Eid auf die Verfassung.
    Dutzende US-Bundesrichter erließen in der Folge ähnliche Anordnungen; sie unterscheiden sich erheblich
    — Offenlegungspflicht, Verbot, Bestätigungspflicht oder bloßer Hinweis auf die fortbestehende Rule-11-Verantwortung.
    Nachtrag zum Fortbestand: Die Einzelanordnung ist im Northern District of Texas durch eine gerichtsweite
    Regel abgelöst worden. Die Local Civil Rules des Bezirks enthalten in L.R. 7.2(f) eine Offenlegungspflicht:
    "A brief prepared using generative artificial intelligence must disclose this fact on the first page
    under the heading ''Use of Generative Artificial Intelligence.''" Generative KI ist dort definiert
    als Werkzeug, das "is capable of generating new content (such as images and text) in response to a
    submitted prompt ... by learning from a large reference database of examples". Wer ohne diese Angabe
    einreicht, versichert damit zugleich, dass kein Teil des Schriftsatzes mit generativer KI erstellt
    wurde. Aus der Bescheinigungspflicht eines einzelnen Richters ist damit eine Offenlegungspflicht des
    ganzen Bezirks geworden.

    '
