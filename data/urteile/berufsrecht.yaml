  sachverhalt: Die Lexfox GmbH mit Sitz in Berlin ist beim Kammergericht als Rechtsdienstleisterin für
    Inkassodienstleistungen registriert. Auf ihrer Internetseite wenigermiete.de stellt sie einen kostenlos
    nutzbaren „Mietpreisrechner" bereit und wirbt damit, Rechte von Wohnraummietern aus der Mietpreisbremse
    „ohne Kostenrisiko" durchzusetzen; ein Drittel der „ersparten Jahresmiete" verlangt sie nur im Erfolgsfall.
    Ein Berliner Wohnungsmieter beauftragte sie mit der Geltendmachung seiner Ansprüche aus der Mietpreisbremse
    (§ 556d BGB) und trat ihr die Forderungen ab. Nach Auskunftsverlangen und Rüge nach § 556g Abs. 2
    BGB verlangte Lexfox von der Wohnungsgesellschaft Rückzahlung überhöhter Miete und Erstattung der
    Rechtsverfolgungskosten. Die Klage blieb vor dem Landgericht Berlin als Berufungsgericht ohne Erfolg;
    das Landgericht ließ die Revision zum Bundesgerichtshof zu, mit der Lexfox ihr Begehren in vollem
    Umfang weiterverfolgte.
  sachverhalt_quelle: volltext
