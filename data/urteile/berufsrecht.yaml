  quelle_tracker: judiciary.uk (Übersichtsseite abgerufen)
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Das internationale Vorbild — Australien, Neuseeland und Kanada haben sich daran orientiert.
    Der oft übersehene Punkt: Diese Leitlinie richtet sich an Richter, nicht an Anwälte, und ist damit
    das Gegenstück zu Ayinde. England reguliert beide Seiten des Richtertischs, die USA bislang nur eine.
    Die Ergänzung um Meldepflichten bei Datenvorfällen in der Oktoberfassung zeigt, wohin sich der Schwerpunkt
    verlagert: von der Halluzination zur Vertraulichkeit. Das ist die realistischere Gefahr im richterlichen
    Alltag, weil ein in ein Consumer-Modell eingegebener Entscheidungsentwurf nicht zurückzuholen ist.
    Das genaue Erlassdatum innerhalb des Oktober 2025 ist nicht belegt; der 31.10.2025 ist ein Platzhalter.

    '
  quelle_art: amtlich
  sachverhalt: Im Dezember 2023 gaben die Lady Chief Justice, der Master of the Rolls und der Senior President
    of Tribunals erstmals eine Handreichung zum Einsatz künstlicher Intelligenz für Richterinnen und Richter
    in England und Wales heraus. In den folgenden zwei Jahren hatten die englischen Gerichte wiederholt
    über Schriftsätze mit erfundenen, von generativen Systemen erzeugten Fundstellen zu befinden; zugleich
    zeigte sich, dass die Eingabe nicht öffentlicher Informationen in frei zugängliche Anwendungen ein
    eigenes Risiko darstellt. Im April 2025 wurde die Handreichung überarbeitet. Im Oktober 2025 folgte
    eine weitere Fassung, in der Verzerrungen der Trainingsdaten und Halluzinationen ausführlicher behandelt
    und erstmals Vorgaben zur Meldung versehentlicher Offenlegungen (data incidents) aufgenommen wurden.
  sachverhalt_quelle: eintrag
