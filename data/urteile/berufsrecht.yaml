- id: de-2019-bgh-wenigermiete
  jurisdiktion: de
  gericht: Bundesgerichtshof, VIII. Zivilsenat
  instanz: revision
  aktenzeichen: VIII ZR 285/18
  ecli: ECLI:DE:BGH:2019:271119UVIIIZR285.18.0
  datum: 2019-11-27
  parteien:
    klaeger: Lexfox GmbH (wenigermiete.de)
    beklagter: Vermieterin
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - marktzugang
  - vertrag
  anspruchsgrundlage: § 10 Abs. 1 Satz 1 Nr. 1 RDG (Inkassodienstleistung); § 3 RDG; § 134 BGB
  kernfrage: 'Deckt die Registrierung als Inkassodienstleister die automatisierte Durchsetzung mietrechtlicher
    Ansprüche über ein Legal-Tech-Portal?

    '
  ergebnis: 'Ja. Der BGH legte den Begriff der Inkassodienstleistung weit aus und hielt die Tätigkeit
    von wenigermiete.de von der Inkassoregistrierung für gedeckt. Die Forderungseinziehung umfasse auch
    die rechtliche Prüfung, die zur Durchsetzung erforderlich ist; eine Überschreitung liege erst vor,
    wenn die Tätigkeit sich vom Inkassozweck löst. Maßstab sei die Schutzrichtung des RDG — Schutz der
    Rechtsuchenden vor unqualifizierter Beratung —, die bei registrierten Inkassodienstleistern gewahrt
    sei. Prozessual hat der Senat das Berufungsurteil aufgehoben und die Sache an das Landgericht Berlin
    zurückverwiesen; das ergibt sich aus der amtlichen Pressemitteilung 153/2019 und stand bisher nicht
    im Eintrag.

    '
  bedeutung: hoch
  volltext_url: https://www.bundesgerichtshof.de/SharedDocs/Entscheidungen/DE/Zivilsenate/VIII_ZS/2018/VIII_ZR_285-18.pdf?__blob=publicationFile&v=2
  sekundaerquelle_url: https://dejure.org/dienste/vernetzung/rechtsprechung?Gericht=BGH&Datum=27.11.2019&Aktenzeichen=VIII+ZR+285%2F18
  zusammenfassung_url: https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2019/2019153.html
  bezug_regelwerke: []
  instanzenzug:
  - de-2021-bgh-smartlaw
  quelle_tracker: bundesgerichtshof.de (Entscheidungsdatenbank, Volltext-PDF; Pressemitteilung 153/2019);
    dejure.org als Sekundärnachweis
  verifiziert: true
  letzte_pruefung: *id004
  eigene_bewertung: 'Die beiden BGH-Entscheidungen bilden zusammen die deutsche Ausgangslage, und sie
    zeigen in dieselbe Richtung: Der BGH hat Legal Tech zweimal durchgelassen, einmal über die weite Auslegung
    der Inkassobefugnis, einmal über die Verneinung der Rechtsdienstleistung. Beide Begründungen tragen
    bei generativen Systemen nicht. wenigermiete.de setzt eine registrierte Inkassostelle voraus, die
    es bei einem frei zugänglichen Modell nicht gibt; smartlaw setzt ein vorab definiertes Schema voraus,
    das ein Modell nicht hat. Der deutsche Gesetzgeber hat damit zwei Präzedenzfälle, die für die eigentliche
    Frage nichts hergeben — und anders als die FTC in der DoNotPay-Sache keinen Weg über das Irreführungsrecht,
    weil § 3 RDG unmittelbar an der Tätigkeit ansetzt und nicht an der Werbeaussage.

    '
  pruefvermerk:
  - 'Am amtlichen Entscheidungsnachweis geprüft: BGH, Urteil vom 27.11.2019 – VIII ZR 285/18; Vorinstanzen
    AG Berlin-Lichtenberg (07.11.2017 und 12.12.2017 – 6 C 194/17) und LG Berlin (28.08.2018 – 63 S 1/18);
    amtliche Sammlung BGHZ 224, 89; NJW 2020, 208.'
  - 'Ergebnis bestätigt: Der Senat legt den Begriff der Inkassodienstleistung weit aus und hält die Tätigkeit
    von wenigermiete.de von der Registrierung als Inkassodienstleister für gedeckt.'
  - 'Zum Weg: juris.bundesgerichtshof.de antwortete bei mehreren Versuchen mit einem Serverfehler (HTTP
    5xx); geprüft wurde deshalb am Entscheidungsnachweis von dejure.org, der die amtlichen Leitsätze und
    den Instanzenzug führt. Die im Eintrag hinterlegte juris-Adresse bleibt als Volltextadresse richtig.'
  - quelle_tracker sollte von 'Eigenes Modellwissen; nicht am Primärdokument geprüft' auf den geprüften
