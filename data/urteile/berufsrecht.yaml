    zwar nicht, der Rechtssatz stimmt aber." Manasco J erkennt darin zutreffend die Aufforderung, das
    Ergebnis über den Beleg zu stellen. Der zweite Punkt — mediale Bloßstellung ist keine Sanktion — ist
    rechtspolitisch bedeutsam, weil er dem verbreiteten Gedanken widerspricht, die Fallreihe reguliere
    sich über Reputationsschäden selbst. Nicht die Höhe (keine Geldsanktion), sondern die Kombination
