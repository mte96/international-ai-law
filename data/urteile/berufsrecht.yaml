  kernfrage: 'Welche Sanktion ist angemessen, wenn ein Anwalt über 19 Einreichungen hinweg 23 erfundene
    Entscheidungen zitiert und damit fortfährt, nachdem die Gegenseite die Fälschungen aufgedeckt hat?

    '
  ergebnis: 'Rechtsanwalt Alex I. Kleyman reichte in eigener Sache 19 Schriftsätze ein, die 23 erfundene
    Entscheidungen enthielten, auf die 47-mal Bezug genommen wurde; hinzu kamen mindestens 83 real existierende
    Entscheidungen, deren Inhalt unzutreffend wiedergegeben wurde. Er setzte die Einreichungen fort, nachdem
    die Gegenseite die Fälschungen benannt hatte. Das Gericht verhängte auf Grundlage der New Yorker Frivolitätsregel
    insgesamt 46.511,35 USD: 10.000 USD Sanktion an den Lawyers'' Fund for Client Protection und 36.511,35
    USD Anwaltskosten- und Auslagenerstattung an die Gegenseite. Zudem Verweisung an das Grievance Committee
    for the Second, Eleventh & Thirteenth Judicial Districts. Zentrale Sätze: Kleyman "could have attempted
    to verify the cited decisions through a free Internet search engine", und: "Counsel''s duty of candor
    to the Court cannot be delegated to a software program."

    '
