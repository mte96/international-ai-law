  kernfrage: 'Welche Sanktion ist angemessen, wenn eine Partei nicht Fundstellen, sondern Beweismittel
    mit KI erzeugt oder verändert?

    '
  ergebnis: 'Das Gericht stellte fest, dass vorgelegte Videos, Fotografien, Screenshots von Nachrichtenverläufen
    und die zugehörigen Metadaten mit KI erzeugt oder wesentlich verändert worden waren. Beanstandet waren
    neun Beweisstücke (Ex. 3, 6A, 6B, 6C, 7, 21, 27, 35, 40); bei fünf von ihnen stellte das Gericht die
    KI-Erzeugung oder wesentliche Veränderung fest (6A und 6C als Deepfake-Videos, 7 als wesentlich verändert,
    35 und 40 als KI-erzeugt oder wesentlich verändert), bei den übrigen vier blieb der Verdacht bestehen.
    Die Erklärungsversuche der Partei hielt es für unglaubwürdig. Es verhängte die schärfste prozessuale
    Sanktion: Streichung der zweiten geänderten Klage und Abweisung der gesamten Klage mit Rechtskraftwirkung.
    Von einer Geldsanktion sah es ausdrücklich ab.

    '
  bedeutung: hoch
