  anspruchsgrundlage: Fed. R. Civ. P. 11(b); einzelstaatliche Regeln zur mutwilligen Rechtsverfolgung;
    inherent authority
  kernfrage: 'Nach welchem Maßstab und mit welchen Mitteln sanktionieren US-Gerichte nicht anwaltlich
    vertretene Parteien, die KI-erzeugte Scheinzitate einreichen?

    '
  ergebnis: 'Es hat sich eine eigenständige, deutlich mildere Linie herausgebildet. Regelfall ist die
    Verwarnung, nicht die Geldsanktion. Der Maßstab selbst wird aber nicht abgesenkt: In Pop Top Corp.
    v. Rakuten Kobo Inc. (N.D. Cal., No. 20-cv-04482-YGR, Dkt. 170, 25.07.2025, Chief Magistrate Judge
    Donna M. Ryu) heißt es: "Chandra''s self-represented status does not permit him to submit information
    blindly. Like every other person who appears before the court, he has an obligation to confirm that
    arguments and case law submitted to the court are supported by existing law, and a failure to do so
    is sanctionable." Die Pflicht folgt aus Rule 11(b)(2) und trifft Selbstvertreter wie Anwälte. Beispiele
    aus der Datenbank: Kruse v. Karlen (Mo. App. 2024) 10.000 USD wegen mutwilliger Berufung — der Höchstwert
    dieser Gruppe; Mohamed Ali v. Saed Osman (N.D. Supreme Court, 06.08.2026) 1.000 USD; Stokka v. Stokka
    (N.D. Supreme Court, 07.05.2026) doppelte Kosten, 1.000 USD; City of Dickinson v. Helgeson (N.D. Supreme
    Court, 12.02.2026) 500 USD trotz 15 erfundener Entscheidungen; University Mall v. Okorie (S.D. Miss.,
    22.10.2025) Zivilhaft wegen Ungehorsams bei symbolischen 1 USD; Volker v. Nygaard (N.D. 2026) und
    Joshua Harris v. Pinnacle Bank (N.D. Miss., 07.05.2026) Klageabweisung mit Rechtskraftwirkung als
    Sanktion. Eigene Sanktionsform: In Sebastian Rako v. VMware (N.D. Cal., 25.11.2025) verpflichtete
    das Gericht die Partei, jeder Fundstelle die Fußnote "Located through AI; Checked" beizufügen. Zahlenverhältnis:
    In der Datenbankabfrage vom 27.08.2026 entfielen von 31 zufällig erfassten Einträgen 22 auf nicht
    vertretene Parteien, 8 auf Anwälte, 1 auf einen Sachverständigen.

    '
