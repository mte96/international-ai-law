    über einen Klageabweisungsantrag in einem Anlegerverfahren. Beide zogen ihre Beschlüsse zurück und
    erließen bereinigte Fassungen — ohne Begründung, im Fall Neals durch bloße Minute Order. Aufgefallen
    waren die Fehler jeweils nur deshalb, weil eine Partei die Fundstellen nachgeprüft hatte. Verbindliche
    Regeln für den Einsatz generativer KI in Richterbüros gab es nicht; das Administrative Office of the
    U.S. Courts hatte am 31. Juli 2025 lediglich allgemeine, nicht technische Anregungen herausgegeben,
    die das Ausprobieren solcher Werkzeuge ausdrücklich zuließen. Am 6. Oktober 2025 schrieb der Vorsitzende
