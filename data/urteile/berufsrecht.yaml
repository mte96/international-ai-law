  anspruchsgrundlage: Selbstverwaltungsbefugnis der Judikative; Richterliche Verhaltensrichtlinien
  kernfrage: 'Unter welchen Voraussetzungen dürfen Richterinnen und Richter in England und Wales generative
    KI bei der eigenen Arbeit einsetzen?

    '
  ergebnis: 'Fassung vom Oktober 2025, die die Fassung vom April 2025 ersetzt (Erstfassung Dezember 2023).
    Leitgedanke: Der KI-Einsatz durch die Judikative muss mit der übergreifenden Pflicht vereinbar sein,
    die Integrität der Rechtspflege und die Rechtsstaatlichkeit zu wahren. Kernpunkte: (1) Persönliche
    Verantwortung — Richter haften für alles, was in ihrem Namen erstellt wird. (2) Vertraulichkeit —
    keine Eingabe nicht öffentlicher Informationen in öffentlich zugängliche KI-Werkzeuge. (3) Erweiterte
    Ausführungen zu Verzerrungen in Trainingsdaten und zu Halluzinationen. (4) Neu in der Oktoberfassung:
    Vorgaben zur Meldung versehentlicher Offenlegungen (data incidents). Die Leitlinie unterscheidet zwischen
    zulässigen Verwendungen (Zusammenfassungen, Textentwürfe für Verwaltungsaufgaben) und unzulässigen
    (Rechtsrecherche und Rechtsanalyse ohne Verifikation).

    '
  bedeutung: hoch
  volltext_url: https://www.judiciary.uk/wp-content/uploads/2025/10/Artificial-Intelligence-AI-Guidance-for-Judicial-Office-Holders-2.pdf
  zusammenfassung_url: https://www.judiciary.uk/guidance-and-resources/artificial-intelligence-ai-judicial-guidance/
  bezug_regelwerke: []
