  kernfrage: 'Reichen Reue und Verantwortungsübernahme aus, um von Sanktionen abzusehen, und ist mediale
    Bloßstellung ein strafmildernder Umstand?

    '
  ergebnis: 'Nein zu beidem. Anwälte der Kanzlei Butler Snow hatten in einem Verfahren um Gewalt in alabamischen
    Gefängnissen ChatGPT eingesetzt und vier erfundene sowie eine unzutreffend wiedergegebene Entscheidung
    eingereicht; sie räumten dies in der Antwort auf die Aufforderung zur Stellungnahme ein. Das Gericht
    sprach eine öffentliche Rüge aus, entband die betroffenen Anwälte von der Vertretung in diesem Verfahren
    und verwies sie an die Rechtsanwaltskammer. Begründung: Auch wo Anwälte Verantwortung übernehmen und
    sich entschuldigen, sei "much damage done" durch vergeudete Ressourcen und Verfahrensverzögerung.
    Das Argument, die erfundenen Zitate seien inhaltlich durch echte Entscheidungen gedeckt, verwarf das
    Gericht — das würde "amplify the siren call of unverified AI". Die mediale Bloßstellung erkannte es
    ausdrücklich nicht als mildernden Umstand an: Für die berufsrechtliche Ahndung dürften sich Gerichte
    nicht auf die Presse verlassen.

    '
