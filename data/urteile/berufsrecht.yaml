  kernfrage: 'Wie ist zu sanktionieren, wenn eine nicht vertretene Partei KI-erzeugte Verhandlungsprotokolle
    einreicht und ihnen die Berufsbezeichnung einer amtlich bestellten Protokollführerin beifügt?

    '
  ergebnis: 'Der selbst vertretene Berufungsführer hatte das Berufungsbuch einschließlich der Transkripte
    der erstinstanzlichen Verhandlung mit einer KI-Plattform erstellt, statt wie nach Rule 90.29(5) vorgeschrieben
    eine zertifizierte Protokollführerin zu beauftragen. Die eingereichten Transkripte trugen gleichwohl
    einen Beglaubigungsvermerk und wirkten äußerlich regelkonform; der Verstoß kam erst heraus, als die
    Gegenseite Abweichungen bemerkte. Gogan J.A. wertete dies als "non-compliance well disguised as compliance",
    die die Integrität des Berufungsverfahrens berühre; ohne die Sorgfalt der Gegenanwältin hätte die
    Berufung auf unrichtiger Aktengrundlage verhandelt werden können. Tenor (Rn. 41 f.): dem Antrag der
    Gegenseite wird stattgegeben und die Berufung abgewiesen; Kosten auf Freistellungsbasis nach Rule
    90.40(4) in Höhe von 20.000 CAD.

    '
