    eingesetzt — CoCounsel, Westlaw Precision und Google Gemini — und dabei vollständig erfundene Entscheidungen
    sowie erfundene Zitate zu echten Entscheidungen erzeugt. Nach der ersten Beanstandung reichten sie
    eine überarbeitete Fassung ein, die immer noch sechs KI-erzeugte Fehler enthielt, ohne den Werkzeugeinsatz
    offenzulegen. Der Special Master strich sämtliche Fassungen des Schriftsatzes, versagte die beantragte
    Discovery-Anordnung und verhängte gegen die beiden beteiligten Kanzleien gesamtschuldnerisch Kosten
    und Sanktionen von insgesamt 31.100 USD. Die einzelnen Anwälte blieben wegen ihrer offenen Einlassung
    persönlich verschont; die Verantwortung wurde auf der Kanzleiebene verortet.

    '
