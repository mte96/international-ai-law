    Volltext der Stipulation to Discipline
  verifiziert: true
  letzte_pruefung: &id003 2026-09-05
  eigene_bewertung: 'ACHTUNG — HÄUFIGE VERWECHSLUNG. Der im Auftrag als "Kruse (Colorado)" bezeichnete
    Fall existiert so nicht. Colorado ist People v. Crabill (Disziplinarverfahren, Zulassungsaussetzung);
    Kruse v. Karlen ist Missouri (Berufungsgericht, 10.000 USD gegen eine nicht anwaltlich vertretene
    Partei). Beide sind hier getrennt erfasst, weil sie die zwei Sanktionsschienen markieren, die sich
    seither auseinanderentwickelt haben: Berufsrecht gegen Anwälte, Prozessrecht gegen Parteien. Crabill
    ist die erste Zulassungssanktion der Welt wegen KI-Nutzung und damit der Beleg dafür, dass die Aufsicht
    schon 2023 zugriff — fünf Monate nach Mata. Volltext der PDJ-Entscheidung nicht abrufbar; Sachverhalt
    und Sanktionshöhe aus der Datenbank, deshalb `verifiziert: false`.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (Office of the Presiding Disciplinary Judge, coloradolegalregulation.com):
    ''People v. Zachariah C. Crabill. 23PDJ067. November 22, 2023.'''
