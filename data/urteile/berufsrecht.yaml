  quelle_art: amtlich
  sachverhalt: Minnesota hatte ein Gesetz erlassen, das den Einsatz von Deepfakes zur Beeinflussung von
    Wahlen unter Strafe stellt. Christopher Kohls und weitere Kläger griffen es vor dem Bundesgericht
    in Minnesota an; der Attorney General Keith Ellison verteidigte es. Zur Stützung legte Ellison eine
    unter Strafandrohung abgegebene Erklärung von Jeff Hancock vor — Professor in Stanford, Leiter des
    dortigen Social Media Lab und ein ausgewiesener Fachmann für Fehlinformation. In der Erklärung waren
    drei wissenschaftliche Nachweise angeführt, die es nicht gibt; erzeugt hatte sie GPT-4o. Die Klägerseite
    bemerkte das und beantragte, die Erklärung nicht zu verwerten.
