  eigene_bewertung: 'Der Fall, der die gesamte Diskussion umdreht. Solange nur Anwälte betroffen waren,
    ließ sich das Problem als Berufspflichtverletzung behandeln. Ein Gericht, das erfundene Entscheidungen
    erlässt, trifft den Kern der Legitimation: Gegen eine anwaltliche Halluzination hilft die Gegenseite,
    gegen eine richterliche hilft niemand — sie wird zum Präzedenzfall, wenn sie nicht auffällt. Beide
    US-Fälle wurden nur entdeckt, weil eine Partei nachprüfte. Bemerkenswert und wenig beachtet ist die
    Reaktionsform: Rücknahme ohne Begründung durch Minute Order. Es gibt kein Verfahren für diesen Fall
    — keine Anzeigepflicht, keine Aufsicht, keine Veröffentlichung. Genau das ist der Anlass der Senatsuntersuchung.
    Nicht verifiziert: Aktenzeichen (aus eigenem Wissen ergänzt) und der Wortlaut der Erklärung an den
    Kongress.

    '
