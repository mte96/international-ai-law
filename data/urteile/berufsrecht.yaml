  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'NICHT VERIFIZIERT — der gesamte Eintrag beruht auf Modellwissen; Projektstände, Bezeichnungen
    und die beteiligten Länder sind vor Verwendung über die Landesjustizverwaltungen und die Justizministerkonferenz
    zu prüfen. Der strukturelle Befund ist dennoch belastbar und für eine vergleichende Darstellung der
    wertvollste: Während die Common-Law-Staaten über den Einsatz durch Anwälte streiten und ihn über Sanktionen
    steuern, baut Deutschland KI in die Justiz selbst ein und regelt den Einsatz durch Anwälte gar nicht.
    Die deutsche Diskussion dreht sich um Art. 97 GG und den gesetzlichen Richter, die angelsächsische
    um Rule 11 und Kontempt. Das ist keine Nuance, sondern ein anderer Gegenstand — und die deutsche Zahl
    in der Datenbank (11 Fälle gegenüber 62 im Vereinigten Königreich bei vergleichbarer Anwaltszahl)
    legt nahe, dass hier vor allem weniger veröffentlicht, nicht weniger halluziniert wird.

    '
