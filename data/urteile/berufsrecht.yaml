    Möglicherweise wurde die Anordnung zurückgenommen oder in die allgemeinen Kammervorgaben überführt
    — das wäre selbst ein Befund, weil sich die Praxis von der Offenlegungspflicht wegbewegt. Die rechtspolitisch
    wichtige Beobachtung: Die USA regeln über Hunderte einzelner Kammeranordnungen mit unterschiedlichem
    Inhalt, England und Australien über eine zentrale Praxisanweisung. Für eine vergleichende Darstellung
    ist das der interessanteste Gegensatz — Fragmentierung gegen Zentralisierung — und er erklärt, warum
    in den USA über die Verpflichtung zur Offenlegung, in England dagegen über den Sorgfaltsmaßstab gestritten
    wird.

    '
  pruefvermerk:
  - 'Nicht mehr am Primärdokument nachweisbar: Die Richterseite txnd.uscourts.gov/judge/judge-brantley-starr
    führt die ''Mandatory Certification Regarding Generative Artificial Intelligence'' nicht mehr; die
    dort veröffentlichten Judge-Specific Requirements enthalten keinen KI-Abschnitt mehr.'
  - 'Wortlaut und Datum sind über eine zeitgenössische Wiedergabe belegt (Volokh Conspiracy/Reason, 30.05.2023):
    Zertifikat entweder ''no portion of the filing was drafted by generative artificial intelligence (such
    as ChatGPT, Harvey.AI, or Google Bard)'' oder ''any language drafted by generative artificial intelligence
    was checked for accuracy, using print reporters or traditional legal databases, by a human being'';
    Sanktion ist die Streichung des Schriftsatzes.'
  - 'Hinweis auf mögliche Ablösung: Es gibt Belege dafür, dass der N.D. Tex. inzwischen eine gerichtsweite
    Local Civil Rule 7.2(f) an die Stelle der Einzelanordnung gesetzt hat. Der Volltext der Local Rules
    war nicht abrufbar (404 auf txnd.uscourts.gov/sites/txnd/files/local_rules/).'
  - 'Empfehlung: Vor Zitierung im Browser prüfen, ob die Anordnung noch gilt oder durch L.R. 7.2(f) ersetzt
    ist.'
  - 'AM AMTLICHEN DOKUMENT GEPRÜFT (die frühere Empfehlung, dies im Browser nachzuholen, ist erledigt):
    Die Local Civil Rules des N.D. Tex. auf txnd.uscourts.gov enthalten in L.R. 7.2(f) die Offenlegungspflicht
    im oben zitierten Wortlaut. Die Vermutung, die Einzelanordnung sei durch L.R. 7.2(f) ersetzt worden,
    ist damit bestätigt.'
  - volltext_url zeigt jetzt auf die geltenden Local Civil Rules des Gerichts statt auf die Richterseite,
    auf der die Anordnung nicht mehr geführt wird.
  - Der Wortlaut der ursprünglichen Anordnung vom 30.05.2023 bleibt nur über zeitgenössische Wiedergaben
    belegt; das Gericht hält ihn nicht mehr vor. Wer die Anordnung zitiert, sollte kenntlich machen, dass
    sie in dieser Form nicht mehr gilt.
