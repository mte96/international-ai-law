    Online Safety Act 2023
  kernfrage: 'Gibt es im Vereinigten Königreich gerichtliche Entscheidungen zu KI-generierten Deepfakes
    und digitalen Ebenbildern?

    '
  ergebnis: 'NEGATIVBEFUND. Zum 27.08.2026 war keine veröffentlichte britische Gerichtsentscheidung auffindbar,
    die einen zivilrechtlichen Anspruch wegen eines KI-generierten Deepfakes oder einer geklonten Stimme
    entscheidet. Das Vereinigte Königreich kennt kein allgemeines Recht am eigenen Bild; Betroffene sind
    auf passing off (nur bei kommerzieller Verwechslungsgefahr, Irvine v Talksport), misuse of private
    information, Datenschutzrecht und — bei intimen Darstellungen — auf das Strafrecht verwiesen. Die
    Kanzleiliteratur (Harbottle & Lewis, RPC, CMS, Norton Rose Fulbright, jeweils 2025/2026) beschreibt
    den Zustand übereinstimmend als "Flickenteppich" und erwartet gesetzgeberische Reform.

    '
