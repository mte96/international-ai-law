  sachverhalt: trivago betreibt eine Website, die Hotelpreise verschiedener Buchungsportale vergleicht.
    Von Dezember 2016 bis September 2019 warb das Unternehmen im australischen Fernsehen und auf seiner
    Startseite damit, man finde dort das ideale Hotel zum besten Preis und sehe alle Preise für dasselbe
    Zimmer. Auf jeder Hotelkachel hob trivago ein Angebot in großer grüner Schrift hervor — das "Top Position
    Offer" —, darüber einen rot durchgestrichenen Vergleichspreis. In die Auswahl dieses hervorgehobenen
    Angebots floss maßgeblich ein, wie viel das jeweilige Buchungsportal trivago je Klick zahlte; in rund
    zwei Dritteln der Fälle war es nicht das günstigste verfügbare Angebot. Der durchgestrichene Preis
    bezog sich häufig auf eine andere Zimmerkategorie als das hervorgehobene Angebot. Die ACCC klagte
    2018 vor dem Federal Court.
