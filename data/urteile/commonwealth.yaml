  kernfrage: 'War das automatisierte Einkommensabgleichs- und Schuldeneintreibungs- programm rechtmäßig,
    und welche institutionellen Kontrollen haben versagt?

    '
  ergebnis: 'Der Abschlussbericht mit 57 Empfehlungen stellte fest, dass das Programm ohne Rücksicht auf
    das Sozialrecht entworfen wurde und die Einkommensmittelung von Anfang an rechtswidrig war; sie sei
    grundlegend unbillig, weil sie Menschen so behandelte, als hätten sie Einkommen zu Zeiten bezogen,
    in denen sie es nicht bezogen. Der Bericht stellte fest, dass entgegenstehender Rechtsrat vorlag und
    ignoriert wurde, dass das Kabinett unter Verschweigen der Mittelungsmethode irregeführt wurde und
    dass die früheren Ressortleitungen trotz Kenntnis der Rechtswidrigkeit untätig blieben. Der Bericht
    enthält ein versiegeltes Kapitel mit Empfehlungen zur Verfolgung von Einzelpersonen; 16 Beamte wurden
    in der Folge wegen möglicher Verstöße gegen den Code of Conduct überprüft.

    '
