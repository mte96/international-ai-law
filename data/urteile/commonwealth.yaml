  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Aufgehoben — aber unbedingt zu kennen, weil es die weltweit einzige erstinstanzliche
    Entscheidung ist, die eine KI als Erfinder anerkannt hat, und weil die Begründung von Beach J bis
    heute die substanzreichste Auseinandersetzung eines Gerichts mit der Frage ist. Wer in Australien
    zu KI und geistigem Eigentum arbeitet, wird diese Entscheidung ständig zitiert finden, meist ohne
    den Hinweis, dass sie aufgehoben wurde. Genau das ist die Divergenz, auf die es ankommt: Australien
    und das Vereinigte Königreich sind auf derselben Rechtsfrage kurzzeitig auseinandergelaufen, bevor
    der Full Court die Linie wieder schloss.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (judgments.fedcourt.gov.au): Federal Court of Australia, [2021] FCA 879,
    VID 108 of 2021, Datum 30.07.2021, Beach J, Thaler gegen Commissioner of Patents. Alle Angaben des
    Eintrags bestätigt.'
