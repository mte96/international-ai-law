    OIPC Alberta
  instanz: behoerde
  aktenzeichen: 'PIPEDA Findings #2026-002'
  ecli: ''
  datum: 2026-05-06
  parteien:
    klaeger: Office of the Privacy Commissioner of Canada u.a.
    beklagter: OpenAI OpCo, LLC
  status: erledigt
  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  - haftung
  anspruchsgrundlage: PIPEDA, Schedule 1 Grundsätze 2 (Bestimmung der Zwecke), 3 (Einwilligung), 4 (Beschränkung
    der Erhebung), 6 (Richtigkeit), 8 (Offenheit), 9 (Zugang), 5 (Aufbewahrung), 1 (Rechenschaft)
  kernfrage: 'Erfüllt das Training und der Betrieb eines allgemeinen Sprachmodells die Anforderungen des
    kanadischen Datenschutzrechts an Einwilligung, Richtigkeit, Transparenz, Aufbewahrung und Rechenschaftspflicht?

    '
  ergebnis: 'Die Beschwerden wurden als begründet angesehen. Kernpunkte: (1) Keine wirksame Einwilligung
    für die Erhebung personenbezogener Daten von öffentlich zugänglichen Websites und aus Nutzerinteraktionen;
    die Berufung auf konkludente Einwilligung sei angesichts der Sensibilität und Neuartigkeit der Praxis
    unzureichend. (2) Unzureichende Hinweise auf die mögliche Unrichtigkeit der Ausgaben und fehlende
    Überprüfungsmöglichkeiten für Nutzer, insbesondere bei Angaben über Personen. (3) Verstoß gegen die
    Transparenzanforderungen, weil nicht hinreichend erläutert wurde, welche Datenquellen — Blogs, Foren,
    soziale Medien — in das Training eingeflossen sind. (4) Veröffentlichung der Modelle ohne abgeschlossene
    Aufbewahrungs- und Löschungsrichtlinie. (5) Verletzung der Rechenschaftspflicht, weil ChatGPT trotz
    intern bekannter Probleme mit Faktentreue und Konfabulation freigegeben wurde. OpenAI sagte Filterwerkzeuge
    zur Maskierung personenbezogener Kennungen, Websuchfunktionen zur Verifizierung, verbesserte Transparenz,
    bessere Auskunftsformate, förmliche Aufbewahrungsrichtlinien und vierteljährliche Berichterstattung
    zu.

    '
