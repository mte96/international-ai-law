  anspruchsgrundlage: Copyright Act (R.S.C. 1985, c. C-42); Vertragsverletzung (Verstoß gegen Nutzungsbedingungen);
    ungerechtfertigte Bereicherung; Test des 'real and substantial connection' (Club Resorts v Van Breda)
  kernfrage: 'Ist ein ontarisches Gericht für Urheberrechts-, Vertrags- und Bereicherungsansprüche kanadischer
    Verlage gegen ein US-amerikanisches KI-Unternehmen ohne Niederlassung in Kanada zuständig?

    '
  ergebnis: 'Ja. Justice Kimmel wies die Zuständigkeitsrüge OpenAIs überwiegend zurück. Der Ontario Superior
    Court sei als Gericht allgemeiner Zuständigkeit für Ansprüche aus Urheberrecht, Vertrag und ungerechtfertigter
    Bereicherung zuständig. Für die persönliche Zuständigkeit sei der Test der "real and substantial connection"
    erfüllt — hinsichtlich sechs von zehn Beklagten — wegen der Erhebung von Daten aus kanadischen Quellen,
    des Angebots der Dienste an Nutzerinnen und Nutzer in Ontario und der behaupteten Urheberrechtsverletzung
    in der Provinz. Der Einwand des forum non conveniens wurde zurückgewiesen: kanadisches Recht sei anwendbar
    und der Schaden sei in Kanada eingetreten. Alle drei Anspruchsarten dürfen gegen die sechs Hauptbeklagten
    fortgeführt werden.

    '
  bedeutung: hoch
