  eigene_bewertung: 'Aktenzeichen aus Modellwissen und nicht bestätigt; die Klägerbezeichnungen sind teilweise
    ergänzt. Das Entscheidungs-PDF ist über litigate.com verfügbar und sollte vor Zitierung geprüft werden.
    Die wichtigste kanadische KI-Entscheidung und ein Gegenmodell zu Getty: Während das englische Gericht
    Getty am Territorialitätsproblem scheitern ließ, hat das ontarische Gericht die Zuständigkeit bejaht
    und damit den Weg zu einer Sachentscheidung über KI-Training nach kanadischem Recht geöffnet. Kanada
    könnte damit vor dem Vereinigten Königreich die erste Common-Law-Sachentscheidung zum Trainingsdatenurheberrecht
    hervorbringen — zumal das kanadische Recht mit dem "fair dealing" eine engere Schrankenregelung kennt
    als der US-amerikanische Fair-Use-Test. Ein Berufungsverfahren gegen die Zuständigkeitsentscheidung
