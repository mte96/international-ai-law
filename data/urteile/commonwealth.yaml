- id: uk-2025-ayinde-alharoun
  jurisdiktion: uk
  gericht: High Court of Justice, King's Bench Division (Divisional Court)
  instanz: erstinstanzlich
  aktenzeichen: '[2025] EWHC 1383 (Admin); AC-2024-LON-003062 und CL-2024-000435'
  ecli: ''
  datum: 2025-06-06
  parteien:
    klaeger: R (on the application of Frederick Ayinde) / Hamad Al-Haroun
    beklagter: London Borough of Haringey / Qatar National Bank (QPSC) u.a.
  status: rechtskraeftig
  themenachsen:
  - berufsrecht
  - governance
  - haftung
  anspruchsgrundlage: Hamid-Zuständigkeit (inhärente Zuständigkeit des Gerichts zur Kontrolle der Berufspflichten);
    s. 51 Senior Courts Act 1981 (wasted costs); Contempt of Court
  kernfrage: 'Welche berufsrechtlichen Pflichten treffen Prozessvertreter beim Einsatz generativer KI
    zur Rechtsrecherche, und welche Sanktionen stehen dem Gericht zur Verfügung, wenn erfundene Fundstellen
    eingereicht werden?

    '
  ergebnis: 'Der President of the King''s Bench Division und Johnson J verbanden zwei Hamid-Verfahren.
    Grundsatz (Rn. 6-9): Generative KI erzeugt kohärente und plausible, aber möglicherweise vollständig
    falsche Antworten, kann nicht existierende Quellen zitieren und angebliche Zitate erfinden. Daraus
    folgt eine Berufspflicht, KI-gestützte Recherche vor jeder beruflichen Verwendung anhand autoritativer
    Quellen zu überprüfen — und zwar gleichermaßen für den, der selbst recherchiert, und für den, der
    sich auf die Arbeit anderer stützt. Das Gericht verlangte ausdrücklich, dass Personen mit Leitungsverantwortung
    (Heads of Chambers, Managing Partners) und die Regulierungsstellen wirksame Maßnahmen ergreifen. Zum
    Sanktionsrahmen (Rn. 23 ff.): öffentliche Rüge, Kostenentscheidung, wasted costs order, Abweisung
    des Vortrags, Verweisung an die Aufsicht, Kontemptverfahren und Anzeige bei der Polizei; bloße Ermahnung
    sei außer in Ausnahmefällen keine ausreichende Reaktion. EINZELFÄLLE: Ayinde — die Barristerin hatte
    fünf nicht existierende Entscheidungen zitiert; Ritchie J hatte bereits eine wasted costs order über
    2.000 GBP erlassen und sie an die Bar Standards Board verwiesen, der Divisional Court verwies erneut.
    Al-Haroun — Zeugenaussagen stützten sich auf 45 fehlerhafte Fundstellen, davon 18 vollständig erfunden;
    der Solicitor wurde wegen eines "lamentable failure to comply with the basic requirement to check
    the accuracy of material that is put before the court" an die SRA verwiesen. In BEIDEN Fällen wurde
    von einem Kontemptverfahren abgesehen: bei Ayinde war die Schwelle zwar erreicht, das Gericht sah
    wegen tatsächlicher Unklarheiten und der geringen Berufserfahrung ab und stellte klar, dies sei kein
    Präzedenzfall; bei Al-Haroun war die Schwelle mangels nachgewiesener Täuschungsabsicht nicht erreicht.
    Das Urteil wurde dem Bar Council, der Law Society und dem Council of the Inns of Court mit der Aufforderung
    übersandt, dringlich weitere Schritte zu erwägen.

    '
  bedeutung: hoch
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewhc/admin/2025/1383
  zusammenfassung_url: https://www.judiciary.uk/wp-content/uploads/2025/06/Ayinde-v-London-Borough-of-Haringey-and-Al-Haroun-v-Qatar-National-Bank.pdf
  bezug_regelwerke: []
  instanzenzug:
  - uk-2023-harber-hmrc
  - uk-2025-ms-bangladesh
  quelle_tracker: judiciary.uk (Volltext-PDF abgerufen); Find Case Law
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die international meistzitierte Entscheidung zu KI im Berufsrecht und inzwischen
    in Australien (MS Bangladesh zitiert sie ebenso wie die australischen Gerichte) und Neuseeland rezipiert.
    Zwei Punkte werden regelmäßig übersehen. Erstens: Die Pflicht trifft auch den, der sich auf fremde
    Arbeit stützt — der Senior, der die Recherche des Junior übernimmt, haftet berufsrechtlich selbst.
    Zweitens: Das Gericht hat die Kontempt-Schwelle bei Ayinde ausdrücklich als erreicht bezeichnet und
    nur aus Billigkeitsgründen abgesehen. Der nächste vergleichbare Fall wird anders ausgehen; die Warnung
    ist ausdrücklich als solche formuliert.

    '
  quelle_art: amtlich
  sachverhalt: Zwei Verfahren gaben den Anlass. Im ersten hatte eine Barristerin für Frederick Ayinde
    in einem verwaltungsgerichtlichen Verfahren gegen den London Borough of Haringey fünf Entscheidungen
    zitiert, die es nicht gibt; Ritchie J hatte deswegen bereits eine wasted costs order über 2.000 Pfund
    erlassen und die Barristerin an das Bar Standards Board verwiesen. Im zweiten stützten sich Zeugenaussagen
    für Hamad Al-Haroun in einem Verfahren gegen die Qatar National Bank (QPSC) auf 45 fehlerhafte Fundstellen,
    von denen 18 vollständig erfunden waren; der Solicitor hatte die Richtigkeit des eingereichten Materials
    nicht überprüft. Der President of the King's Bench Division und Johnson J zogen beide Sachen unter
    der Hamid-Zuständigkeit an sich, mit der das Gericht die Berufspflichten der vor ihm auftretenden
    Vertreter kontrolliert, und verbanden sie.
  sachverhalt_quelle: eintrag
