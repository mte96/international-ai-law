- id: uk-2020-bridges-ca
  jurisdiktion: uk
  gericht: Court of Appeal (Civil Division) of England and Wales
  instanz: berufung
  aktenzeichen: '[2020] EWCA Civ 1058, C1/2019/2670'
  ecli: ''
  datum: 2020-08-11
  parteien:
    klaeger: R (on the application of Edward Bridges)
    beklagter: Chief Constable of South Wales Police
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 8 Abs. 2 EMRK; s. 64 Data Protection Act 2018 (DPIA); s. 149 Equality Act 2010
  kernfrage: 'Genügt der Rechtsrahmen für automatisierte Live-Gesichtserkennung dem Erfordernis, dass
    ein Eingriff in Art. 8 EMRK "in accordance with the law" sein muss, und welche Pflichten treffen die
    Polizei bei möglicher demografischer Verzerrung des Algorithmus?

    '
  ergebnis: 'Die Berufung hatte in drei von fünf Punkten Erfolg. Erstens: Der Rechtsrahmen genügt nicht
    dem Gesetzesvorbehalt des Art. 8 Abs. 2 EMRK, weil er den einzelnen Beamten zu weite Ermessensspielräume
    in zwei entscheidenden Fragen belässt — wer auf die Fahndungsliste kommt und wo eingesetzt wird. Drittens:
    Die Datenschutz-Folgenabschätzung war fehlerhaft, weil sie von der unzutreffenden Prämisse ausging,
    Art. 8 sei nicht verletzt. Fünftens: Die Polizei hat die Public Sector Equality Duty des s. 149 Equality
    Act 2010 verletzt, weil sie keine hinreichenden Schritte unternommen hat, sich zu vergewissern, dass
    die Software keine Verzerrung nach Geschlecht oder Hautfarbe aufweist — die bloße Unkenntnis der Herstellerdaten
    entlastet nicht. Die Gründe zur Verhältnismäßigkeit und zum Policy Document nach DPA 2018 wurden zurückgewiesen.

    '
  bedeutung: hoch
  volltext_url: https://www.judiciary.uk/wp-content/uploads/2020/08/R-Bridges-v-CC-South-Wales-ors-Press-Summary.pdf
  zusammenfassung_url: https://www.judiciary.uk/wp-content/uploads/2020/08/R-Bridges-v-CC-South-Wales-ors-Press-Summary.pdf
  bezug_regelwerke:
  - uk-gdpr
  - uk-equality-act-2010
  instanzenzug:
  - uk-2019-bridges-dc
  quelle_tracker: judiciary.uk; Ada Lovelace Institute; INFORRM
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Volltext-PDF nicht geöffnet; Inhalt aus Modellwissen und mehreren übereinstimmenden
    Sekundärquellen. Trotz des Alters die wichtigste britische Entscheidung zu algorithmischer Verwaltung
    überhaupt und die einzige, die eine Pflicht zur aktiven Verzerrungsprüfung begründet — und zwar nicht
    über Datenschutz, sondern über Gleichbehandlungsrecht. Genau dieser Weg wird in der Beratung übersehen.
    Für den Vergleich mit Art. 27 KI-VO (Grundrechte-Folgenabschätzung) ist Bridges das britische Äquivalent,
    das es formell nicht gibt.

    '
  normen:
  - ki-vo-art-27
  - uk-dpa-2018-s-64
  - uk-equality-act-2010-s-149
  pruefvermerk:
  - 'Am Primärdokument geprüft (Urteils-PDF und amtliche Press Summary auf judiciary.uk): Court of Appeal
    (Civil Division), [2020] EWCA Civ 1058, Case No. C1/2019/2670, Datum 11.08.2020, Beschwerdeführer
    R (on the application of Edward Bridges), Beschwerdegegner Chief Constable of South Wales Police und
    Secretary of State for the Home Department.'
  - 'Ergebnis bestätigt: Die Berufung hatte in drei von fünf Punkten Erfolg — Grund 1 (Gesetzesvorbehalt
    Art. 8 Abs. 2 EMRK), Grund 3 (DSFA nach s. 64 DPA 2018) und Grund 5 (Public Sector Equality Duty).
    Gründe 2 (Verhältnismäßigkeit) und 4 (appropriate policy document, s. 42 DPA 2018) wurden zurückgewiesen.
    Der Eintrag gibt dies zutreffend wieder.'
  - 'Ergänzend: Streithelfer waren Information Commissioner, Surveillance Camera Commissioner und Police
    and Crime Commissioner for South Wales.'
  quelle_art: amtlich
  sachverhalt: 'Die South Wales Police erprobte die automatisierte Live-Gesichtserkennung AFR Locate:
    Überwachungskameras nehmen die Gesichter von Passanten auf, das System vergleicht sie mit den Bildern
    der Personen auf einer eigens für den jeweiligen Einsatz zusammengestellten Fahndungsliste. Die Einsätze
    erfolgten offen und nicht verdeckt. Edward Bridges wurde nach seinem Vortrag zweimal erfasst: am 21.
    Dezember 2017 in der Queen Street, einer belebten Einkaufsstraße in Cardiff, wo ein gekennzeichneter
    Kamerawagen von 8 bis 16 Uhr im Einsatz war, und am 27. März 2018 bei der Defence Procurement, Research,
    Technology and Exportability Exhibition in der Motorpoint Arena. Er erhob Klage auf gerichtliche Überprüfung
    gegen den Chief Constable of South Wales Police und wandte sich sowohl gegen die beiden Einsätze als
    auch gegen den fortlaufenden Betrieb; der Divisional Court wies sie mit Beschluss vom 4. September
    2019 ab. Dagegen legte Bridges Berufung ein; als Streithelfer traten der Information Commissioner,
    der Surveillance Camera Commissioner und der Police and Crime Commissioner for South Wales auf.'
  sachverhalt_quelle: volltext
