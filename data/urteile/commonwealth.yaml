  sachverhalt: OpenAI trainierte die ChatGPT zugrunde liegenden Modelle unter anderem mit Inhalten, die
    es von öffentlich zugänglichen Websites eingesammelt hatte — Blogs, Foren, soziale Medien —, und verwendete
    zusätzlich die Eingaben seiner Nutzer. Welche Quellen im Einzelnen eingeflossen waren, legte das Unternehmen
    nicht offen. Das System gibt auch Angaben über namentlich benannte Personen aus; diese Angaben können
    unzutreffend sein, und die Betroffenen hatten keinen praktikablen Weg, sie berichtigen zu lassen.
    Eine abgeschlossene Aufbewahrungs- und Löschungsrichtlinie lag bei der Veröffentlichung der Modelle
    nicht vor, obwohl die Neigung des Systems zu erfundenen Angaben intern bekannt war. Nach Beschwerden
    leiteten der Office of the Privacy Commissioner of Canada, die Commission d'accès à l'information
    du Québec und die Aufsichtsbehörden von British Columbia und Alberta eine gemeinsame Untersuchung
    ein.
