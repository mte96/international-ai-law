  kernfrage: 'Sind Sozialleistungsschulden, die ausschließlich auf gemittelten Einkommensdaten der Steuerbehörde
    beruhen, unwirksam, und ist der Commonwealth zur Rückzahlung verpflichtet?

    '
  ergebnis: 'Murphy J genehmigte den Vergleich über rund 1,872 Mrd. AUD, davon 112 Mio. AUD Zahlung an
    Gruppenmitglieder zusätzlich zu bereits zugesagten Rückzahlungen von rund 751 Mio. AUD und dem Verzicht
    auf rund 1,76 Mrd. AUD nicht durchsetzbarer Forderungen. Er erließ die Feststellung, dass Entscheidungen
    des Commonwealth über das Bestehen einer Sozialleistungsschuld unwirksam sind, soweit sie sich ausschließlich
    auf die Mittelung von Einkommensdaten der Steuerbehörde stützten. Das Urteil enthält eine ungewöhnlich
    scharfe Kritik am Verhalten des Commonwealth und bezeichnet Robodebt als "a shameful chapter" in der
    Verwaltungsgeschichte des Bundes.

    '
