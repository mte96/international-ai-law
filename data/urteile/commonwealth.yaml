  eigene_bewertung: 'Datum geschätzt. Prozessual die wichtigste Aussage der Reihe: Die Beweislast für
    die Fehlerhaftigkeit eines algorithmischen Vorsortierungswerkzeugs liegt beim Betroffenen — der es
    nicht kennt und keinen Zugang hat. Das ist die zentrale strukturelle Schwäche des kanadischen Ansatzes
    und der Punkt, an dem der europäische Auskunftsanspruch (Art. 15 Abs. 1 lit. h DSGVO) den entscheidenden
    Unterschied macht.

