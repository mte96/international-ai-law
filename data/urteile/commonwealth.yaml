  anspruchsgrundlage: s. 5B Privacy Act 1988 (Cth) (extraterritoriale Anwendung); APP 1.2, 3.3, 3.5, 5,
    10.2
  kernfrage: 'Unterliegt ein US-Unternehmen, das Gesichtsbilder aus dem offenen Netz scrapt und australischen
    Polizeibehörden Testzugänge anbietet, dem australischen Privacy Act — und ist das Scraping biometrischer
    Vorlagen zulässig?

    '
  ergebnis: 'Beides zulasten Clearviews. Zur extraterritorialen Anwendung nach s. 5B: Clearview betreibe
    ein Geschäft in Australien, weil es australischen Polizeibehörden von Oktober 2019 bis März 2020 kostenlose
    Testzugänge anbot, die der Kundengewinnung dienten; hinzu komme die systematische und wiederholte
    Erhebung von Gesichtsbildern australischer Personen aus dem Netz ohne Ortsbestimmung sowie die Erreichbarkeit
    der Website über australische IP-Adressen. In der Sache: Gesichtsbilder und biometrische Vorlagen
    sind personenbezogene und sensible Informationen; die Erhebung durch Scraping war weder erforderlich
    noch verhältnismäßig, insbesondere wegen der Gefahr von Fehlidentifizierung und Identitätsmissbrauch.
    Verstöße gegen APP 1.2, 3.3, 3.5, 5 und 10.2. Angeordnet wurden die Einstellung der Erhebung von Bildern
    aus Australien und die Löschung der bereits erhobenen Bilder.

    '
