  kernfrage: 'Kann ein Sozialleistungsschuldner allein auf der Grundlage eines aus Jahresdaten der Steuerbehörde
    rechnerisch gemittelten Vierzehntageeinkommens festgesetzt werden?

    '
  ergebnis: 'Nein — durch Anerkenntnis. Der Commonwealth gab nach und stimmte Konsensentscheidungen zu.
    Der Federal Court erklärte, dass die Zahlungsaufforderung nicht wirksam ergangen sei, weil die dem
    Entscheider vorliegenden Informationen nicht geeignet waren, ihn vom Bestehen einer Schuld zu überzeugen.
    Die dem Beschluss beigefügte Erklärung hält fest, dass die Annahme gleichmäßiger Vierzehntageeinkünfte
    aus gemittelten Jahresdaten durch nichts gestützt war, dem erklärten Einkommen widersprach und die
    Schlussfolgerung auf eine Schuld daher irrational war. Ferner fehlte eine Grundlage für den Zuschlag
    von 10 %, und die Aufrechnung mit der Steuererstattung war unwirksam.

    '
