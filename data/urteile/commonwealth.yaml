  anspruchsgrundlage: ss. 18, 29(1)(i), 34 Australian Consumer Law (Schedule 2 Competition and Consumer
    Act 2010 (Cth))
  kernfrage: 'Ist die Darstellung eines algorithmisch ermittelten Suchergebnisses als "bester Preis" irreführend,
    wenn der Ranking-Algorithmus maßgeblich die an den Betreiber gezahlte Klickverguetung berücksichtigt?

    '
  ergebnis: 'Ja. Moshinsky J stellte fest, dass Trivago irreführend gehandelt hat. Die Cheapest-Price-Darstellung
    verstieß gegen ss. 18 und 34 ACL, die Top-Position-, die Strike-Through- und die Red-Price-Darstellung
    gegen ss. 18 und 29 ACL; bis zum 02.07.2018 verstieß Trivago zudem mit der Behauptung eines unparteiischen
    Preisvergleichs gegen ss. 18 und 34. Der Algorithmus gewichtete in erheblichem Umfang die Höhe der
    von den Buchungsportalen gezahlten Cost-per-Click-Vergütung; in rund zwei Dritteln der Fälle war das
    hervorgehobene Angebot nicht das günstigste. Auch der Streichpreisvergleich war irreführend, weil
    unterschiedliche Zimmerkategorien verglichen wurden.

    '
