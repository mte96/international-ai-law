  anspruchsgrundlage: APP 1.2, 1.3, 3.3, 5.1 Privacy Act 1988 (Cth); s. 16A permitted general situations
  kernfrage: 'Ist der Einsatz von Gesichtserkennung im Einzelhandel zur Abwehr von Ladendiebstahl und
    Gewalt gegen Personal eine nach APP 3.3 zulässige Erhebung sensibler Informationen?

    '
  ergebnis: 'Nein. Die Privacy Commissioner stellte fest, dass Bunnings die Privatsphäre der betroffenen
    Personen verletzt hat, deren personenbezogene und sensible Daten es zwischen dem 06.11.2018 und dem
    30.11.2021 (relevant period) in 62 Filialen (relevant stores) über ein System zur Gesichtserkennung
    ("Live Face Match System" eines Drittanbieters) erhoben hat. Verstöße: APP 3.3 (Erhebung sensibler
    Daten ohne Einwilligung, APP 3.4 nicht einschlägig) und APP 5.1 (keine angemessenen Schritte zur Unterrichtung
    nach APP 5.2(b), (d) und (e)); ferner APP 1.2 (keine angemessenen Verfahren zur Sicherstellung der
    APP-Konformität) und APP 1.3 (Datenschutzerklärung ohne die nach APP 1.4(a) und (b) erforderlichen
    Angaben). Angeordnet wurde nach s. 52(1A) Privacy Act: die beanstandeten Praktiken nicht zu wiederholen
    oder fortzusetzen; binnen 30 Tagen eine Erklärung prominent auf der Startseite zu veröffentlichen
    und dort mindestens 30 Tage vorzuhalten (mit Beschreibung des Einsatzes, der Filialen, der Zeiträume
    und der Funktionsweise); die noch vorhandenen Daten zwölf Monate aufzubewahren und einen Tag nach
    Ablauf dieser zwölf Monate zu vernichten; sowie dem OAIC die Erfüllung schriftlich zu bestätigen.

    '
