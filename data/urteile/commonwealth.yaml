  kernfrage: 'Entlastet der Einsatz eines algorithmischen Werkzeugs den Beamten von der Pflicht, den Antrag
    vollständig zu würdigen?

    '
  ergebnis: 'Der Antrag auf gerichtliche Überprüfung hatte Erfolg. Der Visa Officer hatte den eigentlichen
    Grund des Studienvorhabens verfehlt und nur einige ausgewählte Tatsachen angekreuzt, woraus Textbausteine
    erzeugt wurden; dabei ging der Kern des Antrags verloren. In Rn. 12 hält Grammond J fest, der Antrag
    sei "processed with the assistance of Chinook 3+" worden; er wisse nicht, ob die festgestellten Mängel
    auf dem Werkzeug beruhten, sage aber Folgendes: "the use of assisted decision-making tools does not
    relieve officers from the duty to fully consider an application, most importantly the study plan.
    If the use of such a tool gives the officer a truncated vision of the application, the resulting decision
    may well be unreasonable." Tenor: Antrag stattgegeben, die Entscheidungen aufgehoben, Zurückverweisung
    an einen anderen Visa Officer, keine Rechtsfrage zugelassen.

    '
