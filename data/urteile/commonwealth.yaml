  anspruchsgrundlage: s. 37M Federal Court of Australia Act 1976 (Cth); Central Practice Note
  kernfrage: 'Welche Offenlegungs- und Sorgfaltspflichten gelten für den Einsatz generativer KI vor dem
    Federal Court of Australia?

    '
  ergebnis: 'Erlassen am 15.04.2026, in Kraft seit 16.04.2026. Kernpunkte: Offenlegungspflicht, wenn KI
    genutzt wurde, um Informationen zu zu summarisieren oder zu analysieren, auf die sich ein Zeuge stützt,
    oder um als Beweismittel vorgelegte multimediale Inhalte zu erzeugen (Ziff. 4.10). Zeugenaussagen
    müssen die eigene Erinnerung, Kenntnis oder Erfahrung des Zeugen wiedergeben, Sachverständigengutachten
    die eigene Meinung und den eigenen Gedankengang des Sachverständigen — KI darf die Urheberschaft nicht
    verfälschen. Vertrauliche, privilegierte und mit Veröffentlichungsverbot belegte Informationen dürfen
    nicht in öffentlich zugängliche Systeme eingegeben werden. Verstöße können nachteilige Kostenentscheidungen
    und berufsrechtliche Folgen nach sich ziehen (Ziff. 5.1).

    '
  bedeutung: hoch
  volltext_url: https://www.fedcourt.gov.au/law-and-practice/practice-documents/practice-notes/gpn-ai
  zusammenfassung_url: ''
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: fedcourt.gov.au (abgerufen)
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'NEUER STAND: Der Federal Court hatte bis Anfang 2026 nur eine Konsultationsfassung;
    die verbindliche Practice Note gilt erst seit dem 16.04.2026. Für bundesweite Verfahren — Migrationsrecht,
    Wettbewerbsrecht, geistiges Eigentum, Native Title — ist sie die maßgebliche Regelung und geht dem
    Recht der Staaten vor. Der Ansatz unterscheidet sich von NSW: nicht Verbot, sondern Offenlegungspflicht
    plus Authentizitätsgebot. Wer in beiden Gerichtsbarkeiten tätig ist, muss die strengere NSW-Regel
    als Kanzleistandard fahren.

    '
  quelle_art: amtlich
  sachverhalt: 'Der Federal Court of Australia verhandelt bundesweit Migrations-, Wettbewerbs-, Immaterialgüter-
    und Native-Title-Sachen. In genau diesen Verfahren tauchten seit 2024 wiederholt erfundene Fundstellen
    auf: im Januar 2025 in dem Migrationsverfahren Valu vor dem Federal Circuit and Family Court, im August
    2025 in einem Mordverfahren vor dem Supreme Court of Victoria. Der Supreme Court of New South Wales
    hatte darauf bereits im November 2024 mit einer verbindlichen Praxisanweisung reagiert, der Federal
    Court zunächst nur mit einer Konsultationsfassung. Bis Anfang 2026 blieb es bei dieser Konsultationsfassung,
    während in Verfahren vor dem Federal Court dieselben Werkzeuge längst im Einsatz waren.'
  sachverhalt_quelle: eintrag
