  anspruchsgrundlage: PIPEDA, insbesondere Grundsätze 3 (Einwilligung) und 4.4 (Beschränkung der Erhebung),
    s. 5(3) (angemessene Zwecke); Landesdatenschutzgesetze BC, AB, QC
  kernfrage: 'Ist das Scraping von Gesichtsbildern aus dem offenen Netz zur Erstellung einer biometrischen
    Suchdatenbank ohne Einwilligung nach kanadischem Datenschutzrecht zulässig?

    '
  ergebnis: 'Nein. Die vier Aufsichtsbehörden stellten gemeinsam fest, dass Clearview personenbezogene
    Daten ohne Einwilligung erhoben, verwendet und offengelegt hat und dass die Zwecke im Sinne des s.
    5(3) PIPEDA unangemessen waren: Die Sammlung setze Millionen Menschen einer dauerhaften polizeilichen
    Rasterfahndung aus, ohne dass sie einer Straftat verdächtig seien. Die Ausnahme für öffentlich zugängliche
    Informationen greife nicht. Empfohlen wurden die Einstellung des Angebots in Kanada, die Einstellung
    der Erhebung von Bildern kanadischer Personen und die Löschung der bereits erhobenen Daten. Clearview
    lehnte die Empfehlungen ab; die Behörden von Quebec, British Columbia und Alberta erließen daraufhin
    verbindliche Anordnungen.

    '
  bedeutung: hoch
  volltext_url: https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2021/pipeda-2021-001/
