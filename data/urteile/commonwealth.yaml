  kernfrage: 'Haftet der Betreiber eines Sprachmodells als Verbreiter für ehrverletzende Behauptungen,
    die das Modell über eine reale Person erzeugt?

    '
  ergebnis: 'Nicht entschieden. ChatGPT hatte Hood — der im AWB-Auslandsbestechungsskandal Hinweisgeber
    war — fälschlich als verurteilten Straftäter dargestellt. Hood ließ OpenAI im März 2023 eine Concerns
    Notice nach dem Defamation Act 2005 (Vic) zustellen; das wäre weltweit die erste Verleumdungsklage
    gegen einen KI-Modellbetreiber gewesen. Klage wurde nie erhoben. Im Februar 2024 gab Hood das Vorhaben
    auf, nachdem OpenAI die Ausgabe korrigiert hatte; als weiterer Grund wurden die Prozesskosten genannt.

    '
