  anspruchsgrundlage: APP 3.3, 3.4; s. 16A Items 1 und 2 Privacy Act 1988 (Cth) (permitted general situations);
    APP 1.2, 1.3, 5.1
  kernfrage: 'Greift die Ausnahme der "permitted general situations" nach s. 16A Privacy Act ein, wenn
    ein Einzelhändler Gesichtserkennung zur Abwehr wiederholter Gewalt- und Diebstahlsdelikte einsetzt
    — und welcher Maßstab gilt für "reasonably believes ... necessary"?

    '
  ergebnis: 'Das ART hob die Feststellung eines Verstoßes gegen APP 3.3 AUF. Bunnings habe beide Voraussetzungen
    der permitted general situations erfüllt: es habe erstens Grund zur Annahme rechtswidriger Handlungen
    gehabt — das Tribunal bezeichnete diese Schwelle ausdrücklich als "relatively low bar" — und zweitens
    vernünftiger- weise annehmen dürfen, die Erhebung sei erforderlich, um angemessene Maßnahmen zu ergreifen.
    Das Tribunal hob hervor, dass Bunnings ein ernsthaftes Problem mit Gewalt und Diebstahl durch Wiederholungstäter
    hatte und dass im Sortiment geführte Waren als Waffen verwendbar sind. Gesichtserkennung sei geeignet,
    es habe keine vergleichbare Alternative gegeben, und die Eingriffswirkung stehe nicht außer Verhältnis
    zum Nutzen — obwohl das Tribunal den Eingriff selbst als "significant intrusion" bezeichnete. BESTÄTIGT
    wurden dagegen die Verstöße gegen APP 5.1 (unzureichende Unterrichtung der Kundschaft), APP 1.3 (Datenschutzerklärung
    deckte den Einsatz nicht ab) und APP 1.2 (die Maßnahmen seien "ad hoc and reactive" statt formalisiert
    und dokumentiert gewesen). Bestätigt wurde ferner, dass zur biometrischen Identifikation verwendete
    Gesichtsbilder sensible Informationen sind. Die Privacy Commissioner hat KEINE Berufung eingelegt
    und stattdessen aktualisierte Leitlinien angekündigt.

    '
