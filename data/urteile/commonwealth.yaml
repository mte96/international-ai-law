  volltext_url: https://www.supremecourt.wa.gov.au/_files/AI_practice_direction.pdf
  zusammenfassung_url: https://lawsocietywa.asn.au/wp-content/uploads/2025/04/2025APR11-Submission-to-SCWA-Generative-Artificial-Intelligence.pdf
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: supremecourt.wa.gov.au (PDF abgerufen und geprüft); Law Society of WA
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'FÜR WESTAUSTRALIEN DER ZENTRALE BEFUND, und er widerspricht der verbreiteten Darstellung:
    Die Law Society of NSW führt in ihrer Übersicht der Court Protocols on AI (Stand 2026) für den Supreme
    Court of WA "Guidelines for the Use of Generative Artificial Intelligence — Active". Der Abruf der
    Gerichtswebsite am 27.08.2026 ergab dagegen nur die Consultation Note vom März 2025. Wer sich auf
    die NSW-Übersicht verlässt, arbeitet mit einer Regelung, die es in WA nicht gibt. Praktische Folge
    für die Praxis in Westaustralien: In WA-Landesverfahren gilt derzeit KEINE besondere KI-Regelung,
    sondern nur das allgemeine Berufsrecht (Legal Profession Uniform Law WA) und die allgemeinen Pflichten
    gegenüber dem Gericht — während in Bundesverfahren am selben Ort seit dem 16.04.2026 die GPN-AI des
    Federal Court gilt. Diese Zweiteilung innerhalb desselben Gerichtsgebäudes in Perth ist die praktisch
    wichtigste Falle. Der Zustand kann sich kurzfristig ändern; die Gerichtswebsite ist regelmäßig zu
    prüfen.

    '
  quelle_art: amtlich
  sachverhalt: Während der Supreme Court of New South Wales im November 2024 eine verbindliche Praxisanweisung
    zur generativen KI erließ und andere australische Gerichte nachzogen, überlegte der Supreme Court
    of Western Australia noch. Er stellte auf seine Website ein Papier unter dem Dateinamen "AI_practice_direction.pdf"
    — darin aber keine Regelung, sondern die Mitteilung, man erwäge die Entwicklung einer Praxisanweisung,
    dazu sechs Fragen an die Praxis und eine Stellungnahmefrist bis zum 31. März 2025. Die Law Society
    of Western Australia antwortete am 11. April 2025. Verbote, Offenlegungspflichten oder Vorgaben für
    einzelne Dokumentenarten enthält das Papier nicht. In ihrer Übersicht über die KI-Regeln der australischen
    Gerichte führt die Law Society of New South Wales für den Supreme Court of Western Australia gleichwohl
    aktive "Guidelines for the Use of Generative Artificial Intelligence".
  sachverhalt_quelle: eintrag
