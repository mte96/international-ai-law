  kernfrage: 'Kann ein künstliches neuronales System "inventor" im Sinne der Patents Regulations 1991
    sein?

    '
  ergebnis: 'JA. Beach J hob die Entscheidung des Commissioner auf und entschied, dass ein KI-System ein
    "inventor" sein könne. Der Begriff sei ein Handlungssubstantiv ohne Beschränkung auf natürliche Personen;
    das Patents Act 1990 definiere "inventor" nicht; und der Zweck des Gesetzes — Förderung von Innovation
    — spreche für eine weite Auslegung. Eigentum am Patent könne Thaler nach s. 15(1)(c) als derjenige
    erwerben, der das Recht vom Erfinder ableite (derivation), weil er DABUS besitze und kontrolliere.

    '
  bedeutung: hoch
  volltext_url: https://www.judgments.fedcourt.gov.au/judgments/Judgments/fca/single/2021/2021fca0879
