  quelle_art: amtlich
  sachverhalt: Clearview AI, Inc. sammelte Milliarden von Gesichtsbildern von öffentlich zugänglichen
    Websites und baute daraus eine biometrische Suchdatenbank, in der sich zu einem hochgeladenen Foto
    die abgebildete Person auffinden lässt; die Betroffenen wussten davon nichts und hatten nicht eingewilligt.
    Unter den erfassten Personen waren auch Menschen in Kanada, und kanadische Polizeibehörden nutzten
    den Dienst. Der Office of the Privacy Commissioner of Canada, die Commission d'accès à l'information
    du Québec sowie die Aufsichtsbehörden von British Columbia und Alberta leiteten daraufhin eine gemeinsame
    Untersuchung ein. Clearview stellte sich auf den Standpunkt, es verarbeite ausschließlich öffentlich
    zugängliche Informationen und bedürfe deshalb keiner Einwilligung.
