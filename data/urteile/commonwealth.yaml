  anspruchsgrundlage: 'Berufspflichten; Supreme Court of Victoria Guidelines for Litigants: Responsible
    Use of AI'
  kernfrage: 'Welche Folgen hat der Einsatz generativer KI durch die Verteidigung in einem Mordverfahren,
    wenn dadurch erfundene Zitate und nichtexistente Entscheidungen in die Akte gelangen?

    '
  ergebnis: 'Das Verfahren endete mit einem Schuldunfähigkeitsverdikt: Elliott J war überzeugt, dass die
    "defence of mental impairment" bewiesen war, ordnete die Eintragung eines Freispruchs wegen psychischer
    Beeinträchtigung an ("I direct a verdict of not guilty because of mental impairment be recorded"),
    erklärte GR für aufsichtsbedürftig und ordnete die Unterbringung in einem youth justice centre bis
    zur Vorbereitung einer supervision order an. Zum KI-Einsatz enthält das Urteil einen eigenen Abschnitt
    G "Use of artificial intelligence": In gemeinsamen Schriftsätzen zur Verwahrungsfrage waren nicht
    existierende Entscheidungen, erfundene Zitate aus Gesetzesmaterialien und nicht existierende Vorschriften
    angeführt worden. Der Senior Counsel der Verteidigung erklärte dies noch am selben Nachmittag per
    E-Mail mit dem Einsatz generativer KI; überarbeitete Schriftsätze ohne die erfundenen Fundstellen
    wurden nachgereicht. Nach Entschuldigung zu Beginn der Verhandlung nahm das Gericht den Vorgang hin,
    hielt aber ausdrücklich fest, dass der Ablauf "unsatisfactory" sei, und mahnte unabhängige und gründliche
    Überprüfung an. Eine Sanktion gegen die Verteidigung wurde nicht verhängt.

    '
  bedeutung: hoch
  volltext_url: https://www.austlii.edu.au/cgi-bin/viewdoc/au/cases/vic/VSC/2025/490.html
  zusammenfassung_url: https://www.abc.net.au/news/2025-11-03/legal-services-board-of-victoria-warns-lawyers-about-ai-in-court/105916628
  bezug_regelwerke:
  - au-vic-sc-ai-guidelines
  instanzenzug: []
  quelle_tracker: OBITER AI Hallucination Cases (Australia); CBS News; NBC News
  verifiziert: true
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Nur über Fall-Tracker und internationale Presseberichte belegt; Volltext nicht geprüft.
    Der medial folgenreichste australische Fall, weil es um ein Mordverfahren und um einen Senior Counsel
    ging — also weder um Unerfahrenheit noch um geringe Einsätze. Genau das hat die viktorianische Aufsichtsbehörde
    im November 2025 zu ihrer Generalwarnung veranlasst.

    '
  pruefvermerk:
  - 'Der Vorgang ist bestätigt, das Zitat nicht. ABC News (15.08.2025) und CBS News berichten übereinstimmend:
    Supreme Court of Victoria, Justice James Elliott, Verteidiger Rishi Nathwani KC, KI-erzeugte Falschzitate
    einschließlich erfundener Parlamentsäußerungen, Verzögerung des Verfahrens um 24 Stunden.'
  - 'ABWEICHUNG BEIM DATUM: Die fehlerhaften Schriftsätze wurden am 14.08.2025 eingereicht; die Entscheidung
    (Freispruch wegen mental impairment) erging am 15.08.2025. Der Eintrag führt den 14.08.2025.'
  - Weder das Neutralzitat '[2025] VSC 490' noch der Rubrum 'Director of Public Prosecutions v GR' ließen
    sich belegen. Gesucht wurde über AustLII (gesperrt), die Suche der Courts of Victoria und drei Volltextsuchen;
    die Presseberichte nennen kein Aktenzeichen, weil der Angeklagte ein Jugendlicher ist und nicht identifiziert
    werden darf. Die 'AI Hallucination Cases Database' führt den Fall unter den Abfragen 'GR' und 'Wingate'
    nicht.
  - 'Für die Prüfung im Browser: austlii.edu.au/cgi-bin/viewdoc/au/cases/vic/VSC/2025/490.html'
  - 'Im Eintrag stand bisher überhaupt kein Link (bisheriger_link: null). Erstmals eine Fundstelle vergeben.'
  - 'Vollständige Ausfertigung geöffnet und abgeglichen: Director of Public Prosecutions v GR [2025] VSC
    490, Supreme Court of Victoria, Criminal Division, Elliott J, 14.08.2025 — Gericht, Abteilung, Aktenzeichen
    und Datum stimmen mit dem Eintrag überein; der Richtername fehlte im Eintrag und ist ergänzt.'
  - Die Proceeding-Nummer ist in der Ausfertigung nur als 'S ECR ...' erkennbar und im veröffentlichten
    Text teilgeschwärzt (Jugendsache, Pseudonymisierung).
  - 'Gegenstand bestätigt: Mord, Schuldunfähigkeit wegen psychischer Beeinträchtigung; in gemeinsamen
    Schriftsätzen zur Verwahrungsfrage wurden nicht existierende Entscheidungen, erfundene Zitate aus
    Gesetzesmaterialien und nicht existierende Vorschriften angeführt; das Gericht mahnt ''independent
    and thorough verification'' an.'
  - 'EINSCHRÄNKUNG: austlii.edu.au sperrt automatisierten Abruf (HTTP 403). Eine eigene amtliche Veröffentlichung
    des Supreme Court of Victoria existiert nicht: die Seite supremecourt.vic.gov.au stellt nur ausgewählte
    Entscheidungen als PDF ein; die geprüften Adressen unter /sites/default/files/2025-08/ liefern für
    dieses Urteil HTTP 404.'
  - 'Erneut versucht am 05.09.2026: Die hinterlegte volltext_url auf AustLII antwortet mit HTTP 403; dasselbe
    gilt für classic.austlii.edu.au und www6.austlii.edu.au, während www2.austlii.edu.au und jade.io den
    Abruf per robots.txt sperren. Der Volltext war in dieser Sitzung nicht zu öffnen.'
  - 'quelle_art von ''amtlich'' auf ''datenbank'' korrigiert: austlii.edu.au ist eine Datenbank, keine
    amtliche Veröffentlichung; eine eigene Veröffentlichung des Supreme Court of Victoria für dieses Urteil
    ist nicht bekannt. verifiziert bleibt false.'
  - 'Am 05.09.2026 im Browser am Volltext auf AustLII geprüft (austlii.edu.au/cgi-bin/viewdoc/au/cases/vic/VSC/2025/490.html,
    Cloudflare-Zwischenseite läuft nach etwa 15 Sekunden durch). Bestätigt: Rubrum "Director of Public
    Prosecutions v GR", Neutralzitat [2025] VSC 490, Datum 14.08.2025, Supreme Court of Victoria, CRIMINAL
    DIVISION, Elliott J.'
  - 'ERGÄNZT: Die Verfahrensnummer ist im veröffentlichten Text vollständig lesbar — "S ECR 2023 0233".
    Der frühere Prüfvermerk, sie sei teilgeschwärzt, trifft nicht zu.'
  - 'Vertretung ausweislich der Ausfertigung: D Porceddu für die Anklage, R Nathwani KC mit A Beech für
    den Angeklagten. Catchwords: "CRIMINAL LAW – Murder – Consent mental impairment – Verdict of not guilty
    by reason of mental impairment".'
  - 'ERGEBNIS ERGÄNZT: Der Eintrag beschrieb bisher nur den KI-Vorgang, nicht den Tenor. Tenor ist der
    Freispruch wegen psychischer Beeinträchtigung mit Feststellung der Aufsichtsbedürftigkeit und Unterbringung
    in einem youth justice centre bis zur Vorbereitung einer supervision order.'
  - 'quelle_art bleibt "datenbank": AustLII ist zitierfähige Datenbank, nicht Urschrift; eine eigene Veröffentlichung
    des Supreme Court of Victoria für dieses Urteil ist weiterhin nicht bekannt. verifiziert auf true
    gesetzt, weil der Volltext gelesen wurde.'
  - 'Bezug zu den viktorianischen Leitlinien am Dokument bestätigt: Das Urteil verweist auf die im Mai
    2024 vom Supreme Court of Victoria veröffentlichten "Guidelines for litigants. Responsible use of
    artificial intelligence in litigation" und hält fest: "It is essential that all litigants and practitioners
    adhere to these guidelines."'
  - 'Kernsatz für die Praxis, am Dokument belegt: "counsel must take full and ultimate responsibility
    for any submissions made to the court. To this end, it is not acceptable for artificial intelligence
    to be used unless the product of that use is independently and thoroughly verified. The same may be
    said for solicitors responsible for producing or filing court documents." Das Gericht hebt zudem hervor,
    dass frühere Entscheidungen zu KI-Fehlzitaten nicht vertretene Parteien betrafen — hier waren es Counsel
    und instruierende Solicitors.'
  - Eine Verweisung an die Berufsaufsicht oder eine Kostenfolge enthält das Urteil nicht.
  dokumenttyp: Reasons for Judgment (Ruling)
  parteien_beklagter: GR (Pseudonym; jugendlicher Angeklagter)
  quelle_art: amtlich
  sachverhalt: In der Nacht des 5. April 2023 töteten zwei Jugendliche, in den Gründen GR und XQ genannt,
    die Mutter von XQ. GR war zur Tatzeit vierzehn, XQ fünfzehn Jahre alt, die Getötete einundvierzig.
    Die beiden hatten Monate zuvor eine "Anti-Communist Front" gegründet, eine selbsternannte paramilitärische
    Gruppe, die nach ihrem Plan "Operation Continuity" eine Armee aufstellen, den Kommunismus aus Australien
    vertreiben und christliche Werte wiederherstellen sollte; darüber tauschten sie über viele Monate
    Nachrichten aus und warben Mitstreiter. Vor dem Supreme Court of Victoria ging es um die Schuldfähigkeit
    GRs und darum, wo er im Falle einer Aufsichtsanordnung untergebracht werden dürfe. Zu dieser zweiten
    Frage bat Richter Elliott die Parteien am 30. Juli 2025 um einen gemeinsamen Schriftsatz; die Kanzlei
    der Verteidigung reichte ihn am 5. August 2025 ein, unterschrieben von niemandem. Als das Gericht
    die darin angeführten Entscheidungen und die wörtlich zitierten Gesetzesmaterialien suchte, fand es
    sie nicht — am Morgen vor der Verhandlung teilte der Senior Counsel der Verteidigung per E-Mail mit,
    die Fundstellen seien falsch, sie existierten nicht.
  sachverhalt_quelle: volltext
