  kernfrage: 'Setzt der Begriff "inventor" im australischen Patentrecht eine natürliche Person voraus?

    '
  ergebnis: 'JA, einstimmig durch alle fünf Richter. Der Full Court hob die Entscheidung von Beach J auf.
    Der Begriff "inventor" sei im gesetzlichen Zusammenhang — insbesondere in Verbindung mit s. 15(1)
    Patents Act 1990, der das Recht auf Erteilung an Personen knüpft, die ein Patent "abtreten" oder "vererben"
    können — auf natürliche Personen beschränkt. Der Full Court kritisierte ausdrücklich, dass die Vorinstanz
    von politischen Zweckerwägungen statt vom Gesetzestext ausgegangen sei, und verwies die rechtspolitische
    Frage an den Gesetzgeber.

    '
