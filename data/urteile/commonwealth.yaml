  anspruchsgrundlage: CPR 52.6 (Voraussetzungen für die Zulassung der Berufung)
  kernfrage: 'Ist die Auslegung des Begriffs "infringing copy" bei Modellgewichten eine reine Rechtsfrage
    mit hinreichender Erfolgsaussicht, die die Zulassung der Berufung rechtfertigt?

    '
  ergebnis: 'Joanna Smith J ließ die Berufung Gettys zum Punkt der mittelbaren Urheberrechtsverletzung
    zu: es handele sich um eine reine Rechtsfrage der Gesetzesauslegung, "on which the minds of reasonable
    lawyers may differ". Stability wurde die Zulassung der Anschlussberufung gegen die markenrechtlichen
    Feststellungen versagt; die drei geltend gemachten Gründe hätten keine realistische Erfolgsaussicht.
    Stability muss daher unmittelbar beim Court of Appeal um Zulassung nachsuchen. Fundstelle: Getty Images
    (US) Inc & Ors v Stability AI Ltd (Re Form of Order) [2025] EWHC 3343 (Ch).

    '
  bedeutung: mittel
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewhc/ch/2025/3343
  zusammenfassung_url: https://ipkitten.blogspot.com/2026/01/permission-to-appeal-granted-in-getty.html
  bezug_regelwerke:
  - uk-cdpa-1988
  instanzenzug:
  - uk-2025-getty-stability
  quelle_tracker: IPKat; Wiggin; Chambers and Partners
  verifiziert: false
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Datum nur monatsgenau belegt (Anhörung Dezember 2025, Bekanntgabe Anfang Januar 2026);
    der 19.12.2025 ist eine Schätzung aus den Kanzleiberichten und NICHT verifiziert. Die Fundstelle [2025]
    EWHC 3343 (Ch) stammt aus dem IPKat-Bericht und wurde nicht im Volltext abgerufen. Praktisch wichtig
    ist die Asymmetrie: Getty darf die Kernfrage in die Berufung tragen, Stability seinen einzigen Verlust
    zunächst nicht. Ein Berufungstermin war zum 27.08.2026 nicht veröffentlicht; die Fachpresse erwartet
    die Verhandlung für später im Jahr 2026.

    '
  pruefvermerk:
