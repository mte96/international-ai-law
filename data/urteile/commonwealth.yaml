  - uk-2022-ico-clearview-mpn
  quelle_tracker: OAIC (Volltext-PDF verlinkt); Allens
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die weltweit erste Aufsichtsentscheidung gegen Clearview und die Blaupause für die
    späteren europäischen Verfahren. Die Auslegung des s. 5B ist der Kern: "carrying on business in Australia"
    umfasst die kostenlose Erprobung zur Kundengewinnung. Für jeden ausländischen KI-Anbieter, der australische
    Behörden oder Unternehmen mit Pilotprojekten adressiert, ist das die entscheidende Aussage — der Pilot
    begründet die Zuständigkeit.

    '
