  eigene_bewertung: 'Aufgenommen, weil das Briefing Klagerücknahmen einschließt — und weil diese Rücknahme
    viel erklärt. Australien gilt als das klägerfreundlichste Verleumdungsrecht des Common Law, und dennoch
    ist die erste KI-Verleumdungsklage der Welt nicht erhoben worden. Die Gründe sind strukturell und
    gelten fort: die Ernsthaftigkeitsschwelle des s. 12B (seit 2021), der Nachweis der Veröffentlichung
    an einen Dritten bei einer nur dem Nutzer angezeigten Ausgabe, und das Kostenrisiko gegen einen Weltkonzern.
    Wer heute in Australien wegen KI-Ausgaben äusserungsrechtlich berät, sollte den Fall nicht als Präzedenz,
    sondern als Warnung lesen. Es gibt bis heute KEINE australische Sachentscheidung zur Verleumdung durch
    KI-Ausgaben.

    '
