  anspruchsgrundlage: Tribunal Procedure (First-tier Tribunal) (Tax Chamber) Rules 2009; Verfahrensgrundsätze
  kernfrage: 'Welche Folgen hat es, wenn eine nicht anwaltlich vertretene Partei dem Gericht von einem
    Sprachmodell erfundene Entscheidungen als Präzedenzfälle vorlegt?

    '
  ergebnis: 'Tribunal Judge Anne Redston (mit Ms Helen Myerscough) stellte fest, dass alle neun von Mrs
    Harber angeführten Entscheidungen nicht existierten und mit hoher Wahrscheinlichkeit von einem KI-System
    erzeugt worden waren. Das Gericht nahm der Klägerin ab, dass sie die Fälschung nicht erkannt hatte,
    hielt den Schaden aber für erheblich: die Gegenseite verliere Zeit und Geld mit der Aufdeckung, das
    Gericht werde von anderen Aufgaben abgezogen, und die Praxis fördere Zynismus gegenüber dem Präzedenzsystem,
    das ein Eckpfeiler der Rechtsordnung sei. Die Klage wurde aus davon unabhängigen Gründen abgewiesen.

    '
