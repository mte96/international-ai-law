  eigene_bewertung: 'Datum geschätzt. Der praktisch brauchbare Angriffsweg: nicht das Werkzeug angreifen,
    sondern die Begründung. Wenn die Begründung generisch ist und keinen Bezug zu den Besonderheiten des
    Falles erkennen lässt, ist die Entscheidung unangemessen — unabhängig davon, ob eine KI beteiligt
    war. Diese Umleitung ist der eigentliche kanadische Beitrag zur Dogmatik automatisierter Verwaltung.

    '
