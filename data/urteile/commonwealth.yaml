  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Nur über einen Fall-Tracker belegt. Wenn die Angabe zutrifft, ist dies die wirtschaftlich
    schärfste australische Entscheidung der Reihe: Kosten auf Indemnity-Basis gegen den Anwalt persönlich,
    nicht gegen die Partei — und ausdrücklich wegen der Aufsichtsverletzung, nicht wegen der eigenen Nutzung.
    Das entspricht der Ayinde-Aussage, dass sich auch verantwortet, wer fremde Recherche übernimmt. Vor
    Verwendung unbedingt im Volltext prüfen.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (judgments.fedcourt.gov.au): Rubrum, Neutralzitat [2025] FCA 731, File
    number VID 14 of 2022, Datum 22.04.2025, Murphy J. Das Datum des Eintrags ist richtig.'
  - 'Tenor bestätigt und präzisiert: Angeordnet wurde, dass ''Massar Briggs shall personally pay the costs
    of the respondents, on an indemnity basis, incurred through the firm''s use of artificial intelligence''
    — die Kostenlast trifft die Kanzlei, nicht den einzelnen Anwalt.'
  - 'WARNUNG ZUR QUeLLE: Die ''AI Hallucination Cases Database'' datiert diesen Fall auf den 02.07.2025
    und gibt als Sanktion ''1 AUD monetary penalty'' an. Beides ist am Primärdokument widerlegt. Die Datenbank
    führt den Fall zudem verkürzt als ''Murray v. State of Victoria''.'
