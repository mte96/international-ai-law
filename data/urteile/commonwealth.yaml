  - 'verifiziert am 05.09.2026 auf false gesetzt: das Feld stand im Widerspruch zum eigenen Pruefvermerk.'
  - 'Am Primärdokument geprüft (05.09.2026, Monetary Penalty Notice im Volltext, ico.org.uk): Datum wörtlich
    ''the 18th day of May 2022'', Adressatin ''Clearview AI Inc, 99 Wall Street, #5730 New York, N.Y.
    10005'', Bußgeld 7.552.800 GBP (entspricht 9 Mio. EUR). Behörde, Datum, Adressatin und Betrag des
    Eintrags sind bestätigt.'
  - 'KORREKTUR ANSPRUCHSGRUNDLAGE: Der Eintrag nannte ''Art. 3(2)(b), 5(1)(a), 6, 9, 14, 15, 17 UK GDPR;
    Part 6 DPA 2018''. Der Bescheid stellt Verstöße gegen Art. 5(1)(a), 5(1)(e), 6, 9, 14, 15, 16, 17,
    21, 22 und 35 fest und stützt die Bußgeldbefugnis auf s. 155 i.V.m. s. 149(2)(a)-(c) DPA 2018 und
    Art. 83.'
  - 'Ergänzt: Die Löschungsanordnung steht in der gesondert erlassenen Enforcement Notice (''in addition
    to the service of an Enforcement Notice''), nicht im Bußgeldbescheid selbst; Art. 3(2)(b) UK GDPR
    ist im Bescheid ausdrücklich als Grundlage des räumlichen Anwendungsbereichs zitiert; Datenbankumfang
    ''over 10 billion images''.'
