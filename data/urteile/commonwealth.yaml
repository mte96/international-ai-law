  kernfrage: 'Gibt es neuseeländische Entscheidungen zu KI-Training, KI-Urheberrecht, KI-Haftung oder
    biometrischer Gesichtserkennung?

    '
  ergebnis: 'NEGATIVBEFUND. Zum 27.08.2026 war keine neuseeländische Gerichtsentscheidung zu KI-Trainingsdaten,
    zur Schutzfähigkeit von KI-Ausgaben, zur Haftung für KI-Ausgaben oder zu biometrischer Gesichtserkennung
    auffindbar. Das neuseeländische Recht kennt mit s. 5 Copyright Act 1994 eine Regelung für "computer-generated
    works", die dem Urheber die Person zuweist, die die für die Schaffung erforderlichen Vorkehrungen
    getroffen hat — sie ist von keinem Gericht auf generative KI angewandt worden. Der Privacy Commissioner
    hat 2023 Erwartungen zum KI-Einsatz veröffentlicht und arbeitet an einem Biometrics Processing Privacy
    Code; beides ist keine Entscheidung. Die neuseeländische Praxis orientiert sich derzeit an der australischen
    Bunnings-Entscheidung.

    '
  bedeutung: niedrig
  volltext_url: null
  zusammenfassung_url: https://www.privacy.org.nz/
