  sachverhalt: Vor dem Family Court in Whangārei lief ein langwieriger, streitiger Sorgerechtsstreit um
    ein Kind zwischen John Jones und Sophie Smith. Jones beantragte dort eine „safety hearing" — ein außergesetzliches
    Verfahren, in dem das Gericht vorprüft, ob einem Elternteil unbeaufsichtigter Umgang mit dem Kind
    gestattet werden kann. Der Antrag wurde abgelehnt; die gerichtliche Überprüfung vor dem High Court
    blieb ebenso erfolglos wie die Berufung zum Court of Appeal und der Antrag, dessen Urteil zurückzurufen.
    Vor dem Court of Appeal hatte Jones, der sich selbst vertrat, außerdem vergeblich verlangt, einen
    Helfer („McKenzie friend") zur stillen Unterstützung — Aktenführung und Mitschrift — an den Anwaltstisch
    mitnehmen zu dürfen; gestattet wurde nur, dass dieser von der Zuschauerbank aus mitschreibt. Für seinen
    Antrag auf Zulassung des Rechtsmittels zum Supreme Court reichte Jones Schriftsätze ein, in denen
    er unter anderem „Teddy v Police [2015] NZSC 62", „Baird v R [2013] NZSC 120" und „Awatere Huata v
    Prebble [2002] 3 NZLR 827" anführte — echte Fallnamen, verbunden mit falschen Fundstellen.
