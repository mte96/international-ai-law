  parteien:
    klaeger: Information Commissioner
    beklagter: Clearview AI Inc.
  status: rechtsmittel
  themenachsen:
  - datenschutz
  - grundrechte
  anspruchsgrundlage: Art. 3(2)(b) UK GDPR (räumlicher Anwendungsbereich, Verhaltensbeobachtung); festgestellte
    Verstöße gegen Art. 5(1)(a), 5(1)(e), 6, 9, 14, 15, 16, 17, 21, 22 und 35 GDPR/UK GDPR; Bußgeldbefugnis
    nach s. 155 i.V.m. s. 149(2)(a)-(c) Data Protection Act 2018 und Art. 83 GDPR/UK GDPR
  kernfrage: 'Unterliegt ein US-Anbieter biometrischer Gesichtssuche, der Bilder von im Vereinigten Königreich
    befindlichen Personen aus dem offenen Netz scrapt und ausschließlich ausländische Behörden beliefert,
    der UK GDPR?

    '
  ergebnis: 'Der ICO bejahte dies und verhängte ein Bußgeld von 7.552.800 GBP nebst einer gesondert erlassenen
    Enforcement Notice, die die weitere Verarbeitung von Daten von im Vereinigten Königreich befindlichen
    Personen untersagte und die Löschung der vorhandenen Daten anordnete — die Löschungsanordnung steht
    in der Enforcement Notice, nicht im Bußgeldbescheid. Tragend war Art. 3(2)(b) UK GDPR: das Erstellen
    und fortlaufende Aktualisieren biometrischer Profile aus öffentlich zugänglichen Bildern sei eine
    Beobachtung des Verhaltens betroffener Personen. Der Bescheid beschreibt die Datenbank mit "over 10
    billion images" und den Dienst als Abgleich eines vom Kunden hochgeladenen "Probe Image" gegen diese
    Sammlung.

    '
  bedeutung: hoch
