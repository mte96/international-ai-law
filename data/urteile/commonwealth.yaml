  anspruchsgrundlage: Inhärente Verfahrensregelungsbefugnis des Gerichts; Uniform Civil Procedure Rules
    2005 (NSW)
  kernfrage: 'Unter welchen Voraussetzungen darf generative KI zur Erstellung von Verfahrensdokumenten
    eingesetzt werden?

    '
  ergebnis: 'Die Practice Note (erlassen 21.11.2024, ursprünglich mit Wirkung zum 03.02.2025, geändert
    mit Fassung vom 28.01.2025) verbietet den Einsatz generativer KI bei der Erstellung des Inhalts von
    eidesstattlichen Versicherungen, Zeugenaussagen, Charakterreferenzen und anderen Beweismitteln sowie
    von Sachverständigengutachten. Für Schriftsätze, Zusammenfassungen und Schriftsatzverzeichnisse ist
    der Einsatz unter Überprüfungspflicht zulässig; alle Zitate und Fundstellen sind gegen Primärquellen
    zu prüfen. Vertrauliche und mit Veröffentlichungsverbot belegte Informationen dürfen nicht in öffentlich
    zugängliche Systeme eingegeben werden. Der Chief Justice hat mit Frist bis zum 18.12.2025 zur Überarbeitung
    der Klausel 26 konsultiert; die Practice Note ist zum 27.08.2026 in Kraft.

    '
  bedeutung: hoch
  volltext_url: https://supremecourt.nsw.gov.au/documents/Practice-and-Procedure/Practice-Notes/general/current/PN_SC_Gen_23.pdf
  zusammenfassung_url: https://supremecourt.nsw.gov.au/practice-procedure/generative-artificial-intelligence.html
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: supremecourt.nsw.gov.au (abgerufen)
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die weltweit strengste gerichtliche KI-Regelung. Das Verbot für Zeugenaussagen und
    Sachverständigengutachten ist absolut und nicht durch Offenlegung heilbar — anders als in England,
    wo die Judiciary-Leitlinien nur zur Sorgfalt anhalten. Wer in NSW prozessiert, muss die Kanzleiabläufe
    darauf einstellen: Der Einsatz eines KI-gestützten Diktier- oder Zusammenfassungswerkzeugs bei der
    Erstellung einer Zeugenaussage ist ein Regelverstoß, unabhängig von der Richtigkeit des Ergebnisses.

    '
  quelle_art: amtlich
  sachverhalt: Seit dem Fall Mata gegen Avianca im Sommer 2023 häuften sich weltweit Verfahren, in denen
    Prozessvertreter Gerichten von generativer KI erfundene Entscheidungen vorlegten. In Australien verwies
    der Federal Circuit and Family Court im August 2024 erstmals einen Solicitor deswegen an die Aufsichtsbehörde.
    Zugleich hielten KI-gestützte Werkzeuge zum Recherchieren, Zusammenfassen und Entwerfen in den Kanzleien
    Einzug — auch dort, wo eidesstattliche Versicherungen, Zeugenaussagen, Leumundszeugnisse und Sachverständigengutachten
    entstehen. Eine gerichtliche Regelung, die dafür etwas anderes vorgesehen hätte als die allgemeinen
    Pflichten gegenüber dem Gericht, gab es in Australien nicht; der Supreme Court of New South Wales
    nahm sich der Sache im Herbst 2024 an.
  sachverhalt_quelle: eintrag
