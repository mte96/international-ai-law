  anspruchsgrundlage: CPR Part 16 (Schlüssigkeit und Reichweite des Klagevortrags)
  kernfrage: 'Darf eine Partei im laufenden Verfahren über das Skeleton Argument den Vorwurf einführen,
    ein generatives Modell erzeuge Darstellungen sexuellen Kindesmissbrauchs, wenn der Klagevortrag nur
    allgemein von "pornography" sprach?

    '
  ergebnis: 'Nein. Males LJ und Arnold LJ wiesen die Berufung Gettys zurück. Bei objektiver Lesart der
    Schriftsätze erfassten die erhobenen Vorwürfe keine CSAM-Inhalte; die spätere Konkretisierung nach
    der Case Management Conference habe den Streitgegenstand auf synthetische Bilder prominenter Personen
    verengt. Arnold LJ: "On an objective reading of Getty''s statements of case, the allegations that
    are advanced do not extend to CSAM."

    '
  bedeutung: niedrig
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewca/civ/2025/749
  zusammenfassung_url: ''
  bezug_regelwerke: []
  instanzenzug:
  - uk-2025-getty-stability
  quelle_tracker: Find Case Law (National Archives)
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Aufgenommen allein wegen des Instanzenzugs. Materiell nur ein Pleading-Streit, aber
    er zeigt eine Struktur, die sich wiederholen wird: Sicherheitsvorwürfe gegen ein Modell müssen von
    Anfang an präzise gepleadet werden, sonst sind sie im Verfahren verloren. Für Klägervertreter in KI-Sachen
    die praktisch wichtigste Lehre des gesamten Getty-Komplexes.

    '
  quelle_art: amtlich
- id: uk-2023-thaler-uksc
  jurisdiktion: uk
  gericht: The Supreme Court of the United Kingdom
  instanz: revision
  aktenzeichen: UKSC 2021/0201
  ecli: ''
  datum: 2023-12-20
  parteien:
    klaeger: Dr Stephen Thaler
    beklagter: Comptroller-General of Patents, Designs and Trade Marks
  status: rechtskraeftig
  themenachsen:
  - urheberrecht
  - governance
  anspruchsgrundlage: ss. 7, 13 Patents Act 1977
  kernfrage: 'Kann eine autonome KI-Maschine "inventor" im Sinne des s. 7(3) Patents Act 1977 sein, und
    kann ihr Eigentümer allein kraft Eigentums am Gerät das Recht auf Erteilung des Patents erwerben?

    '
  ergebnis: 'Nein, einstimmig. Ein "inventor" im Sinne des Patents Act 1977 muss eine natürliche Person
    sein; DABUS ist keine und kann daher kein Erfinder sein. Zweitens gibt es keine Rechtsregel, nach
    der das Eigentum an einer Maschine das Eigentum an ihren Erzeugnissen und damit ein Recht auf Erteilung
    des Patents vermittelt. Die Anmeldungen gelten daher nach s. 13(2) Patents Act 1977 als zurückgenommen.
    Das Gericht betonte ausdrücklich, es entscheide NICHT über die Patentfähigkeit KI-generierter Erfindungen
    als solche, sondern nur über die Erfinderbenennung.

    '
  bedeutung: hoch
  volltext_url: https://caselaw.nationalarchives.gov.uk/uksc/2023/49
  zusammenfassung_url: https://caselaw.nationalarchives.gov.uk/uksc/2023/49/press-summary
  bezug_regelwerke:
  - uk-patents-act-1977
  instanzenzug:
  - uk-2025-thaler-divisional-application
  quelle_tracker: Find Case Law; supremecourt.uk
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die Entscheidung wird regelmäßig überdehnt. Sie sagt nichts darüber, ob eine mit
    KI-Hilfe gemachte Erfindung patentierbar ist — das ist sie, sofern ein Mensch benannt wird. Sie sagt
    nur, dass die Maschine nicht in das Formular gehört. Die praktische Folge ist eine Offenlegungsfalle:
    wer den KI-Beitrag ehrlich beschreibt, riskiert die Anmeldung; wer schweigt, kommt durch. Genau das
    hat der High Court 2025 (uk-2025-thaler-divisional-application) offen ausgesprochen. Das ist ein rechtspolitischer
    Missstand, der bislang nicht behoben ist.

    '
  normen:
  - uk-patents-act-1977-s-7
  - uk-patents-act-1977-s-13
  quelle_art: amtlich
  sachverhalt: Im Oktober und November 2018 meldete Dr. Stephen Thaler beim britischen Patentamt zwei
    Patente an (GB18116909.4 und GB1818161.0). In den Anmeldeformularen gab er an, selbst nicht Erfinder
    zu sein. Auf die Aufforderung, binnen sechzehn Monaten nach s. 13(2) Patents Act 1977 eine Erfindererklärung
    und die Herleitung seines Rechts einzureichen, antwortete er, Erfinder sei in beiden Fällen eine Maschine
    namens DABUS, die autonom und mit künstlicher Intelligenz gearbeitet habe; das Recht auf die Patenterteilung
    habe er als Eigentümer dieser Maschine erworben. Am 4. Dezember 2019 entschied der Hearing Officer
    für den Comptroller, DABUS könne kein Erfinder im Sinne des Gesetzes sein und Thaler sei allein aufgrund
    seines Eigentums an der Maschine nicht anmeldeberechtigt; die Anmeldungen gälten mit Ablauf der Sechzehnmonatsfrist
    als zurückgenommen. Der High Court und — mit Mehrheit — der Court of Appeal wiesen Thalers Rechtsmittel
    zurück; er zog vor den Supreme Court.
  sachverhalt_quelle: volltext
- id: uk-2025-thaler-divisional-application
  jurisdiktion: uk
  gericht: High Court of Justice, Chancery Division (Appeals from the Comptroller-General of Patents)
  instanz: berufung
  aktenzeichen: Berufung gegen UKIPO-Entscheidung BL O/0764/24 vom 13.08.2024
  ecli: ''
  datum: 2025-09-01
  parteien:
    klaeger: Dr Stephen Thaler
    beklagter: Comptroller-General of Patents, Designs and Trade Marks
  status: rechtskraeftig
  themenachsen:
  - governance
  - berufsrecht
  anspruchsgrundlage: ss. 13(2), 20 Patents Act 1977; Human Rights Act 1998
  kernfrage: 'Kann ein Anmelder nach der Entscheidung des Supreme Court die Erfinderbenennung nachträglich
    auf sich selbst umstellen, wenn aktenkundig ist, dass er sich selbst nie für den Erfinder hielt —
    und tritt die Rücknahmefiktion des s. 13(2) automatisch mit Fristablauf oder erst mit behördlicher
    Feststellung ein?

    '
  ergebnis: 'Beides gegen Thaler. Michael Tappin KC (Deputy Judge) hielt die zwei Tage nach dem UKSC-Urteil
    eingereichte Form 7, in der Thaler sich selbst als Erfinder benannte, für "obviously defective": aus
    der Akte ergebe sich klar, dass Thaler nie geglaubt habe, Erfinder zu sein; die Erklärung über die
    Erfinderschaft sei daher offenkundig fehlerhaft. Zweitens wirkt die Rücknahmefiktion des s. 13(2)
    automatisch mit Ablauf der vorgeschriebenen Frist (ex tunc), nicht erst mit der Feststellung des Amtes
    (ex nunc) — die Teilanmeldung von 2022 war damit bereits vor der Korrektur erledigt. Argumente aus
    dem Human Rights Act 1998 und ein estoppel-Einwand wurden verworfen. Bemerkenswert: das Gericht räumte
    ausdrücklich ein, dass ein Anmelder, der den KI-Beitrag NICHT offenlegt, keinem Einwand begegnen würde.

    '
  bedeutung: mittel
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewhc/ch/2025/2202
  zusammenfassung_url: https://ipkitten.blogspot.com/2025/09/no-take-backs-for-thaler-on-ai.html
  bezug_regelwerke:
  - uk-patents-act-1977
  instanzenzug:
  - uk-2023-thaler-uksc
  quelle_tracker: Find Case Law (National Archives); IPKat
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Das ist die eigentliche Folgepraxis, nach der gefragt wurde, und sie ist härter als
    erwartet: Das UKIPO darf und muss die Erfindererklärung inhaltlich auf Plausibilität prüfen, wenn
    die Akte ihr widerspricht. Für die Beratungspraxis heißt das: die Erfinderbenennung ist bei KI-gestützten
    Erfindungen kein Formular, sondern eine Tatsachenbehauptung mit Aktenbindung. Die ex-tunc-Wirkung
    des s. 13(2) ist der praktisch gefährlichste Teil — eine versäumte Frist ist nicht heilbar.

    '
  normen:
  - uk-patents-act-1977-s-13
  quelle_art: amtlich
- id: uk-2022-ico-clearview-mpn
  jurisdiktion: uk
  gericht: Information Commissioner's Office
