  anspruchsgrundlage: Art. 5(1)(a), 5(1)(c), 6, 9(2)(b) UK GDPR
  kernfrage: 'Darf ein Arbeitgeber Gesichtserkennung und Fingerabdruckscans zur Arbeitszeiterfassung einsetzen,
    wenn keine weniger eingreifende Alternative angeboten wird?

    '
  ergebnis: 'Nein. Der ICO ordnete an, die Verarbeitung biometrischer Daten von über 2.000 Beschäftigten
    in 38 Freizeiteinrichtungen einzustellen und die vorhandenen Daten binnen drei Monaten zu löschen.
    Serco habe weder eine tragfähige Rechtsgrundlage noch eine Ausnahme nach Art. 9 dargelegt; eine wirksame
    Einwilligung scheide im Arbeitsverhältnis wegen des Machtgefälles aus, und den Beschäftigten sei keine
    praktikable Alternative wie Karte oder Fob angeboten worden. Die Verarbeitung sei damit weder erforderlich
    noch verhältnismäßig.

    '
  bedeutung: mittel
