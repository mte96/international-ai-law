  anspruchsgrundlage: Berufspflichten des Bar Standards Board Handbook; Ayinde-Grundsätze
  kernfrage: 'Rechtfertigen Krankheit, Überlastung oder Unerfahrenheit eine Ausnahme von der Pflicht,
    KI-generierte Fundstellen vor Einreichung zu überprüfen?

    '
  ergebnis: 'Nein. Mr Justice Dove und UT Judge Lindsley stellten in einer Leitentscheidung mit Leitsatz
    drei Grundsätze auf: Sprachmodelle wie ChatGPT können Entscheidungen mit falschen Fundstellen erfinden;
    nach Ayinde ist die Verwendung erfundener Autoritäten regelmäßig ein Fall für die Verweisung an die
    Berufsaufsicht; und "taking unprofessional short-cuts which will very likely mislead the Tribunal
    is never excusable". Der Prozessvertreter hatte eine nicht existierende Entscheidung "Y (China) [2010]
    EWCA Civ 116" zitiert und später eingeräumt, ChatGPT ohne Überprüfung in einer Rechtsdatenbank genutzt
    zu haben. Verweisung an die Bar Standards Board wegen Missbrauchs künstlicher Intelligenz, Verletzung
    von Redlichkeit und Integrität, unterlassener Prüfung und widersprüchlicher Erklärungen. Einwände
    aus Krankheit und Übermüdung wies das Tribunal zurück: wer nicht arbeitsfähig ist, muss das Mandat
    ablehnen oder das Gericht sofort unterrichten.

    '
  bedeutung: hoch
  volltext_url: https://caselaw.nationalarchives.gov.uk/ukut/iac/2025/305
