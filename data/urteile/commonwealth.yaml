  quelle_art: amtlich
  sachverhalt: 'Clearview AI, ein US-Unternehmen, sammelte mit automatischen Crawlern Fotos von öffentlich
    zugänglichen Stellen im Netz einschließlich sozialer Netzwerke und errechnete daraus biometrische
    Vektoren; die Datenbank umfasste über drei Milliarden Bilder, bis Ende 2020 sollten es dreißig Milliarden
    werden. Von Oktober 2019 bis März 2020 stellte das Unternehmen vier australischen Polizeibehörden
    kostenlose Testzugänge zur Verfügung: der Australian Federal Police, der Victoria Police, dem Queensland
    Police Service und der South Australia Police. Deren Beamte luden Vergleichsbilder hoch — von Verdächtigen,
    von Opfern und von sich selbst; in einem Bericht hieß es, unbekannte Zielpersonen habe man mit viel
    Erfolg identifiziert, immer aus dem Instagram-Abzug. Am 21. Januar 2020 nahm das OAIC Vorermittlungen
    auf, am 4. März 2020 eröffnete die Commissioner das Verfahren, und seit dem 7. Juli 2020 ermittelte
    sie gemeinsam mit der britischen Aufsichtsbehörde ICO. Am 21. Mai 2021 teilte sie Clearview ihre vorläufige
    Auffassung mit; das Unternehmen antwortete am 10. Juni 2021.'
