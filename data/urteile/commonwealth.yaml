- id: uk-2025-getty-stability
  jurisdiktion: uk
  gericht: High Court of Justice, Business and Property Courts of England and Wales, Intellectual Property
    List (Chancery Division)
  instanz: erstinstanzlich
  aktenzeichen: IL-2023-000007
  ecli: ''
  datum: 2025-11-04
  parteien:
    klaeger: Getty Images (US), Inc. und weitere
    beklagter: Stability AI Ltd
  status: rechtsmittel
  themenachsen:
  - urheberrecht
  - content
  - gpai
  anspruchsgrundlage: ss. 22, 23, 27(3) Copyright, Designs and Patents Act 1988; ss. 10(1), 10(2), 10(3)
    Trade Marks Act 1994; passing off
  kernfrage: 'Sind die Modellgewichte eines im Ausland trainierten generativen Bildmodells eine "infringing
    copy" im Sinne des s. 27(3) CDPA 1988, deren Einfuhr ins Vereinigte Königreich eine mittelbare Urheberrechtsverletzung
    nach ss. 22, 23 CDPA begründet?

    '
  ergebnis: 'Mrs Justice Joanna Smith wies den Anspruch auf mittelbare Urheberrechtsverletzung ab. Zwei
    Schritte: Erstens legte sie den Begriff "article" in ss. 22, 23, 27(3) CDPA nach dem Grundsatz des
    "always speaking statute" weit aus — ein "article" KANN unkörperlich sein und damit auch Modellgewichte
    erfassen. Insoweit gab sie Getty recht. Zweitens scheiterte der Anspruch dennoch, weil die Modellgewichte
    keine "copy" eines geschützten Werkes sind: sie sind ausschließlich das Produkt der während des Trainings
    gelernten Muster und Merkmale; Stable Diffusion speichert keine Trainingsdaten und benötigt zur Inferenz
    keine. Ohne Vervielfältigungsstück kein "infringing copy". Zum Markenrecht: nur ein historisch und
    außerordentlich begrenzter Erfolg. s. 10(1) und s. 10(2) TMA 1994 wurden für bestimmte synthetische
    Wasserzeichen bei früheren Modellversionen (v1.x) bejaht, ganz überwiegend für iStock-Zeichen; für
    Getty-Images-Zeichen nur, soweit verzerrte oder unscharfe Varianten erzeugt wurden. s. 10(3) TMA scheiterte
    an der fehlenden Darlegung einer Änderung des wirtschaftlichen Verhaltens des Durchschnittsverbrauchers.
    Passing off scheiterte. Für die Versionen v1.1 bis v1.4 verneinte das Gericht außerdem die Verantwortlichkeit
    von Stability überhaupt: veröffentlicht wurden diese über die Repositorien von CompVis, nicht von
    Stability (Rn. 102, 114-122, 130).

    Stand 07.09.2026 zum Rechtsmittel: Das im Eintrag geführte Datum 04.11.2025 ist das Datum des erstinstanzlichen
    Urteils ([2025] EWHC 2863 (Ch), Mrs Justice Joanna Smith DBE), nicht des Rechtsmittelverfahrens. Im
    consequentials hearing vom 16./17.12.2025 wurde die Berufung am 16.12.2025 zugelassen, und zwar auf
    sämtliche Gründe zum secondary copyright infringement — Streitfrage bleibt, ob Modellgewichte eine
    "infringing copy" im Sinne der ss. 22, 23, 27(3) CDPA 1988 sind. Frist zur Einlegung des appellant''s
    notice: 03.02.2026. Ein Aktenzeichen des Court of Appeal, ein Verhandlungstermin und eine Entscheidung
    sind am 07.09.2026 nicht belegt.

    '
  bedeutung: hoch
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewhc/ch/2025/2863
  zusammenfassung_url: https://www.judiciary.uk/wp-content/uploads/2025/11/Getty-Images-v-Stability-AI.pdf
  bezug_regelwerke:
  - uk-cdpa-1988
  - uk-tma-1994
  instanzenzug:
  - uk-2025-getty-stability-csam
  - uk-2025-getty-stability-form-of-order
  quelle_tracker: Find Case Law (National Archives); judiciary.uk; IPKat
  verifiziert: true
  letzte_pruefung: 2026-09-07
  eigene_bewertung: 'Der Fall wird durchgängig falsch berichtet. Er ist KEINE Entscheidung darüber, ob
    KI-Training Urheberrechte verletzt. Getty hat den Trainings- und Entwicklungsanspruch während des
    Verfahrens fallengelassen, weil kein Beweis dafür zu führen war, dass irgendein Trainingsvorgang im
    Vereinigten Königreich stattfand — ein Beweisproblem, kein Rechtsproblem. Die materiell tragende Aussage
    ist schmal, aber scharf: Modellgewichte sind kein Vervielfältigungsstück. Damit ist der gesamte "import
    the model" Ansatz gegen außerhalb des UK trainierte Modelle tot, solange die Berufung nicht anders
    entscheidet. Die weite Auslegung von "article" ist der für die Praxis wertvollere Teil des Urteils
    und wird übersehen: sie hält die Tür für künftige Fälle offen, in denen ein Modell nachweislich memorierte
    Werke enthält. Der markenrechtliche Teil ist praktisch bedeutungslos, aber dogmatisch interessant,
    weil das Gericht die Ausgabe eines Wasserzeichens durch ein Modell dem Modellanbieter zurechnet. Kritik
    in der Literatur (JIPLP 2026, Bd. 21 S. 538) hält die Verneinung der mittelbaren Verletzung für falsch.

    '
  normen:
  - uk-cdpa-1988-s-22
  - uk-cdpa-1988-s-23
  - uk-cdpa-1988-s-27-3
  - uk-tma-1994-s-10-1
  - uk-tma-1994-s-10-2
  - uk-tma-1994-s-10-3
  pruefvermerk:
  - '07.09.2026: Amtliche Press Summary der Judiciary of England and Wales (judiciary.uk/wp-content/uploads/2025/11/Getty-Images-v-Stability-AI.pdf)
    abgerufen: Rubrum, Claim No. IL-2023-000007, Neutral Citation [2025] EWHC 2863 (Ch), Urteilsdatum
    04.11.2025 und Spruchkörper bestätigt. Die Zulassung der Berufung am 16.12.2025 auf alle Gründe zum
    secondary infringement ist neu aufgenommen. Eine Suche auf caselaw.nationalarchives.gov.uk ergab keine
    Berufungsentscheidung. Eine fachanwaltliche Einschätzung vom 08.04.2026 nennt ein Erwartungsfenster
    "before December 2026"; das ist nicht am Gerichtsdokument geprüft und daher nicht als Termin übernommen.
    Nebenbefund: Chambers and Partners datiert das erstinstanzliche Urteil auf November 2024 — unzutreffend.'
  quelle_art: amtlich
  sachverhalt: Getty Images betreibt seit 1995 ein weltweites Bildarchiv; seinen Bestand — Millionen hochwertiger
    Fotografien von Weltereignissen, Sportmomenten, Prominenten, Architektur, Natur und Reisen, über Jahre
    von Hunderttausenden Fotografen aufgenommen — bezeichnet das Unternehmen als „the lifeblood" seines
    Geschäfts. Die Stability AI Ltd entwickelte das generative Bildmodell Stable Diffusion, das aus einer
    Texteingabe oder einem Startbild ein synthetisches Bild erzeugt; trainiert wurde es mit riesigen Mengen
    digitaler Bilder samt Bildunterschriften, die durch Crawling und Scraping aus dem Internet zusammengetragen
    worden waren. Getty warf Stability vor, dafür ohne Erlaubnis Millionen seiner Bilder von den eigenen
    Websites abgezogen und damit mehrere Versionen von Stable Diffusion trainiert zu haben, und erhob
    2023 Klage vor dem High Court. Im Lauf des Verfahrens musste Getty einräumen, dass sich nicht beweisen
    ließ, dass Training und Entwicklung im Vereinigten Königreich stattgefunden hatten; es ließ deshalb
    den Trainings- und Entwicklungsanspruch fallen, ebenso den Anspruch wegen der Ausgaben, nachdem Stability
    die dafür verwendeten Prompts gesperrt hatte, und den datenbankrechtlichen Anspruch. Übrig blieben
    der Vorwurf der mittelbaren Urheberrechtsverletzung durch die Einfuhr der Modellgewichte und markenrechtliche
    Ansprüche wegen synthetisch erzeugter Getty- und iStock-Wasserzeichen in den Bildausgaben.
  sachverhalt_quelle: volltext
