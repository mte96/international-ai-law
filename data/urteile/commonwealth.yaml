  kernfrage: 'Genügt die bloße Behauptung, Chinook mindere die Entscheidungsqualität, um einen Verfahrensfehler
    darzutun?

    '
  ergebnis: 'Nein. Der Antragsteller rügte die Verfahrensfairness in vier Punkten, darunter den Einsatz
    des Chinook-Werkzeugs durch IRCC. Das Gericht verlangte einen konkreten, beweisgestützten Vortrag:
    Der Antragsteller habe keinerlei Beweis für einen Zusammenhang zwischen dem Werkzeug und einem Fairnessmangel
    in seinem Fall vorgelegt. Ergänzend hält das Gericht fest, das Chinook-Werkzeug sei "not intended
    to process, assess evidence, or make decisions on applications", und der Antragsteller habe dem nichts
    entgegengesetzt. Auch die weiteren Rügen (späte Begründungsmitteilung erst auf einen Rule-9-Antrag,
    Verzögerung, Besorgnis der Befangenheit) blieben erfolglos. Tenor: Antrag auf gerichtliche Überprüfung
    abgewiesen, keine Rechtsfrage zugelassen.

    '
