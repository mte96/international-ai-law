  anspruchsgrundlage: APP 3.3, 3.5 Privacy Act 1988 (Cth)
  kernfrage: 'Darf ein Einzelhändler bei einer freiwilligen Kundenbefragung Gesichtsbilder erfassen und
    biometrische Vorlagen erzeugen, um demografische Auswertungen vorzunehmen und Mehrfachteilnahmen zu
    erkennen?

    '
  ergebnis: 'Nein. Vom 15.06.2020 bis 24.08.2021 erfassten Tablets in rund 700 Filialen bei Beginn und
    Abschluss der Befragung Gesichtsbilder und erzeugten daraus biometrische Vorlagen. Die OAIC stellte
    Verstöße gegen APP 3.3 und APP 3.5 fest: Die Erhebung sensibler Informationen sei nicht "reasonably
    necessary" gewesen, weil weniger eingreifende Mittel zur Verfügung standen und Menschen der Erhebung
    biometrischer Daten im Allgemeinen ablehnend gegenüberstehen; die Erhebungshinweise seien unzureichend
    gewesen und die Einwilligung weder ausdrücklich noch gesondert erteilt.

    '
