  sachverhalt: Zwischen Juli 2015 und November 2019 setzte der Commonwealth gegen rund 433.000 Sozialleistungsempfänger
    Rückforderungen fest, die er aus rechnerisch gemittelten Jahreseinkommensdaten der Steuerbehörde ableitete;
    insgesamt ging es um mindestens 1,763 Milliarden australische Dollar, von denen rund 751 Millionen
    tatsächlich eingezogen wurden. Das Verfahren lief unter der Bezeichnung Robodebt. Es endete erst,
    nachdem der Commonwealth im Musterprozess Amato anerkannt hatte und sich in der Gruppenklage Prygodicz
    verglich; über Betroffene, die sich das Leben genommen hatten, war öffentlich berichtet worden. Am
    18. August 2022 setzte die Bundesregierung durch Letters Patent eine Royal Commission ein. Kommissarin
    Catherine Holmes vernahm frühere Minister, Ressortleitungen und Betroffene und ließ sich die internen
    Rechtsgutachten und die Kabinettsvorlagen vorlegen; ihr Abschlussbericht erschien am 7. Juli 2023.
