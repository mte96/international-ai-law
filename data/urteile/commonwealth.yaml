  kernfrage: 'Kann eine Kostenentscheidung auf Vollentschädigungsbasis unmittelbar gegen den Prozessvertreter
    ergehen, wenn dessen KI-Werkzeug falsche Fundstellen erzeugt hat?

    '
  ergebnis: 'Ja. Das Gericht ordnete Kosten auf Indemnity-Basis gegen den Prozessbevollmächtigten der
    Antragsteller persönlich an. Die falschen Fundstellen stammten von einem KI-Werkzeug, das eine unerfahrene
    jüngere Anwältin eingesetzt hatte; die Verantwortlichkeit traf die aufsichtsführende Ebene.

    '
