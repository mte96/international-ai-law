    Relations Authority, des Immigration and Protection Tribunal und des High Court. Der Inhalt dieser
    Entscheidungen wurde nicht gelesen. Die Aussage der eigenen Bewertung, Neuseeland habe KI-Rechtsprechung
    "ausschließlich zum Berufsrecht", ist deshalb als zu weit gefasst zu behandeln, bis diese 13 Entscheidungen
    ausgewertet sind.'
