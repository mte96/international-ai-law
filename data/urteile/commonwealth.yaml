  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Betragsangaben aus Sekundärquellen; die Aufteilung des Gesamtvolumens wird in der
    Literatur unterschiedlich dargestellt (112 Mio. AUD Vergleichssumme gegenüber rund 1,8 Mrd. AUD Gesamtwert).
    Vor Zitierung prüfen. Die Feststellung im Beschluss ist die einzige gerichtliche Aussage mit Bindungswirkung,
    die Australien zur Rechtswidrigkeit automatisierter Massenverwaltungsentscheidungen besitzt — und
    sie ist eine Vergleichsfeststellung. Für die Praxis wichtig: Der tragende Rechtsfehler war nicht die
    Automatisierung, sondern die Unzulänglichkeit der Datengrundlage. Das ist die Denkfigur, die auf jedes
    KI-gestützte Verwaltungshandeln übertragbar ist: ein statistisch plausibler Durchschnittswert ist
    keine Tatsache, die eine Einzelfallentscheidung tragen kann.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (judgments.fedcourt.gov.au): ''Prygodicz v Commonwealth of Australia (No
    2) [2021] FCA 634'', File number VID 1252 of 2019, Datum 11.06.2021, Murphy J.'
  - 'Tenor bestätigt: Genehmigung des Vergleichs; Zahlung des Commonwealth von 112 Mio. AUD einschließlich
    Kosten; Kosten von Gordon Legal mit 8.413.795,71 AUD festgesetzt; verlängerte Opt-out-Frist bis 17.09.2021;
    Feststellung, dass allein auf Einkommensmittelung gestützte Forderungen nicht wirksam begründet wurden.'
