- id: uk-2019-bates-post-office-horizon
  jurisdiktion: uk
  gericht: High Court of Justice, Queen's Bench Division
  instanz: erstinstanzlich
  aktenzeichen: '[2019] EWHC 3408 (QB), HQ16X01238 u.a. (Group Litigation)'
  ecli: ''
  datum: 2019-12-16
  parteien:
    klaeger: Alan Bates und 554 weitere Postmaster
    beklagter: Post Office Ltd
  status: rechtskraeftig
  themenachsen:
  - haftung
  - sektor-oeffentlich
  - governance
  anspruchsgrundlage: 'Beweisrecht: Vermutung der ordnungsgemäßen Funktion technischer Systeme (Common
    Law); Vertragsrecht'
  kernfrage: 'Trägt die Vermutung, dass ein Computersystem ordnungsgemäß funktioniert, wenn das System
    selbst die einzige Grundlage der gegen den Nutzer erhobenen Vorwürfe ist?

    '
  ergebnis: 'Fraser J entschied nach dem "Horizon Issues"-Prozess, dass das Horizon-System nicht die ihm
    zugeschriebene Verlässlichkeit besaß: über den gesamten Zeitraum bestanden Fehler, Bugs und Defekte,
    die geeignet waren, Diskrepanzen in den Filialkonten zu erzeugen, und die Post Office verfügte über
    Fernzugriffsmöglichkeiten, die sie bestritten hatte. Die Behauptung, das System sei robust, wurde
    zurückgewiesen. Das Urteil unterminierte die praktische Wirkung der Common-Law-Vermutung, dass Computer
    korrekt arbeiten, weil es zeigte, dass sie sich empirisch widerlegen lässt, wenn die Gegenseite Zugriff
    auf die Fehlerprotokolle erhält.

    '
  bedeutung: hoch
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewhc/qb/2019/3408
  zusammenfassung_url: ''
  bezug_regelwerke: []
  instanzenzug:
  - uk-2021-hamilton-post-office
  quelle_tracker: Find Case Law (National Archives)
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Fundstelle, Datum und Gericht über Find Case Law bestätigt; der Volltext (4,8 MB
    PDF) wurde nicht ausgewertet, die inhaltliche Wiedergabe stammt aus Modellwissen. Keine KI-Entscheidung,
    aber die entscheidende britische Vorentscheidung für algorithmische Beweisführung: Wer sich gegen
    eine KI-gestützte Feststellung wehren will, braucht Zugang zu Fehlerprotokollen und Änderungsverzeichnissen,
    und Bates zeigt, dass Gerichte diesen Zugang erzwingen. Die Nachwirkung ist rechtspolitisch: Das Justizministerium
    hat 2025 eine Call for Evidence zur Verwendung softwaregenerierter Beweise im Strafverfahren durchgeführt;
    eine Gesetzesänderung an der Computer-Vermutung war am 27.08.2026 noch nicht in Kraft.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (Find Case Law, The National Archives, abgerufen am 03.09.2026): Gericht
    ''High Court (Queen''s Bench Division)'', Neutralzitat ''[2019] EWHC 3408 (QB)'', Handed-down-Datum
    16.12.2019, Rubrum ''Bates & Ors v the Post Office Ltd (No 6: Horizon Issues) (Rev 1)'' stimmen mit
    dem Eintrag überein.'
  - 'Nicht geprüft: die Claim Numbers ''HQ16X01238 u.a.'', die Zahl von 555 Klägern und der Name des Richters
    (Fraser J). Die Landing Page der National Archives führt nur die Metadaten; der Volltext liegt dort
    ausschließlich als PDF (4,8 MB), das der Abruf nicht auswerten konnte, und BAILII (www.bailii.org/ew/cases/EWHC/QB/2019/3408.html)
    antwortet mit ''Access Denied''.'
  - 'Empfehlung: Claim Numbers im Browser des Auftraggebers am PDF-Kopf nachtragen.'
  - '07.09.2026: Die gefuehrte volltext_url auf caselaw.nationalarchives.gov.uk antwortet mit ''Page not
    found''. Ersatzweise heranzuziehen: Bates (No. 3) ''Common Issues'' [2019] EWHC 606 (QB) und Hamilton
    [2021] EWCA Crim 577.'
  quelle_art: amtlich
  sachverhalt: Die staatliche Post Office Ltd unterhält ein Netz von über 11.000 Filialen, die überwiegend
    von selbständigen sub-postmasters geführt werden. Für die Buchführung führte sie das von ICL — später
    Fujitsu — entwickelte System Horizon ein; die Filialleiter mussten es benutzen, eine Wahl gab es nicht.
    Widersprechen konnten sie den Zahlen des Systems darin nicht, sondern nur die Helpline anrufen; wies
    Horizon am Ende einer Abrechnungsperiode einen Fehlbetrag aus, mussten sie ihn aus eigenem Geld ausgleichen
    oder von künftigen Einkünften abziehen lassen. Alan Bates und über 550 weitere Betroffene trugen vor,
    diese Fehlbeträge beruhten auf Programmierfehlern, Bugs und Defekten der Software, auf mangelhafter
    Schulung und auf dem Versagen der Helpline; einige wurden zahlungsunfähig, viele hatte die Post Office
    als Privatanklägerin strafrechtlich verfolgt. Sie erhoben ein Gruppenverfahren gegen die Post Office,
    das in mehreren Teilprozessen verhandelt wurde; einer davon galt allein den „Horizon Issues" — der
    Frage, ob das System zuverlässig arbeitete und ob die Post Office aus der Ferne auf die Filialkonten
    zugreifen konnte.
  sachverhalt_quelle: volltext
- id: uk-2021-hamilton-post-office
  jurisdiktion: uk
  gericht: Court of Appeal (Criminal Division) of England and Wales
  instanz: berufung
  aktenzeichen: '[2021] EWCA Crim 577; Case No. 202001558 B3 und 41 verbundene Verfahren'
  ecli: ''
  datum: 2021-04-23
  parteien:
    klaeger: Josephine Hamilton und 41 weitere
    beklagter: Post Office Ltd
  status: rechtskraeftig
  themenachsen:
  - haftung
  - grundrechte
  - sektor-oeffentlich
  anspruchsgrundlage: Criminal Appeal Act 1968; Grundsatz des fairen Verfahrens (abuse of process)
  kernfrage: 'Sind strafrechtliche Verurteilungen, die allein auf den Daten eines Computersystems beruhen,
    dessen Betreiber bekannte Mängel verschwiegen hat, aufzuheben?

    '
  ergebnis: 'Ja. Der Court of Appeal hob 39 von 42 Verurteilungen auf. Die Verfahren seien ein Missbrauch
    des Verfahrens gewesen, weil die Post Office als Anklägerin die Zuverlässigkeit von Horizon nicht
    überprüft und entlastendes Material nicht offengelegt habe, obwohl die Daten des Systems die einzige
    Grundlage der Anklagen waren.

    '
  bedeutung: hoch
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewca/crim/2021/577
  zusammenfassung_url: ''
  bezug_regelwerke: []
  instanzenzug:
  - uk-2019-bates-post-office-horizon
  quelle_tracker: Find Case Law (National Archives)
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Nicht im Volltext geprüft. Aufgenommen als Endpunkt des Horizon-Instanzenzugs und
    als die schärfste britische Aussage zur Verantwortung dessen, der ein automatisiertes System als Beweismittel
    gegen einen Einzelnen einsetzt: Wer sich auf Systemdaten stützt, schuldet die Offenlegung der bekannten
    Systemfehler. Diese Regel ist auf KI-gestützte Betrugserkennung, automatisierte Bescheide und Scoring-Systeme
    übertragbar und wird dort bislang nicht angewandt.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (Find Case Law): Court of Appeal (Criminal Division), Neutralzitat [2021]
    EWCA Crim 577, Datum 23.04.2021, Rubrum ''Hamilton & Ors v Post Office Ltd'', Spruchkörper Holroyde
    LJ, Picken J, Farbey J — alles wie im Eintrag.'
  - 'Ergänzt: Das Urteil trägt die Verfahrensnummer 202001558 B3 nebst 41 verbundenen Verfahren; der Eintrag
    führte bislang nur das Neutralzitat.'
  - 'Ergebnis ''39 von 42'' bestätigt sich mittelbar aus dem Urteilstext: Post Office Ltd räumte bei 4
    Berufungsführern (Gruppe A) beide Anfechtungsgründe und bei 35 (Gruppe B) den ersten Grund ein und
    trat nur den 3 Berufungen der Gruppe C entgegen; 4+35 = 39. Der Dispositionsteil selbst lag im abgerufenen
    Auszug nicht vor.'
  quelle_art: amtlich
  sachverhalt: Sub-postmasters führen die Filialen der Post Office; ihre Abrechnung lief über das Buchführungssystem
    Horizon, dessen Zahlen sie im System selbst nicht bestreiten konnten. Wies Horizon am Ende einer Abrechnungsperiode
    einen Fehlbetrag aus, mussten sie ihn ausgleichen; die Strafverfahren begannen meist damit, dass Prüfer
    der Post Office einen solchen Fehlbetrag fanden. Zwischen 2003 und 2013 wurden zweiundvierzig von
    ihnen — unter ihnen Josephine Hamilton — wegen Taten aus den Jahren 2000 bis 2012 verurteilt, wegen
    Diebstahls, Betrugs und Falschbuchung; angeklagt hatte sie die Post Office selbst als Privatanklägerin,
    bis zum 1. April 2012 die Royal Mail Group. Viele erhielten Freiheitsstrafen, alle verloren ihre bisherige
    Unbescholtenheit und wurden gesellschaftlich geächtet; drei von ihnen — Julian Wilson, Peter Holmes
    und Dawn O'Connell — erlebten den Ausgang ihrer Rechtsmittel nicht mehr. Die Criminal Cases Review
    Commission verwies die Fälle an den Court of Appeal, weil sie zwei Argumentationslinien zum Verfahrensmissbrauch
    für tragfähig hielt.
  sachverhalt_quelle: volltext
- id: uk-2023-harber-hmrc
