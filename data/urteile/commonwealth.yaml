  quelle_art: amtlich
  sachverhalt: 'Vom 1. Juli 2015 bis November 2019 betrieb der Commonwealth über Services Australia ein
    automatisiertes Abgleichsverfahren: Die von Sozialleistungsempfängern gemeldeten Einkünfte wurden
    mit den Jahresdaten der Steuerbehörde verglichen, das Jahreseinkommen rechnerisch gleichmäßig auf
    die Vierzehntageszeiträume verteilt und aus der Differenz eine Schuld errechnet. Rund 433.000 Menschen
    erhielten auf diesem Weg Forderungen über insgesamt mindestens 1,763 Milliarden australische Dollar;
    von etwa 381.000 Personen zog der Commonwealth rund 751 Millionen ein. Nachdem der Commonwealth im
    November 2019 im Musterprozess Amato anerkannt hatte, dass eine allein auf gemittelten Steuerdaten
    beruhende Festsetzung nicht trägt, erhoben Katherine Prygodicz, Elyane Porter, Steven Fritze, Felicity
    Button, Shannon Thiel und Devon Collins eine Gruppenklage. Sie verlangten Rückzahlung des zu Unrecht
    Eingezogenen aus ungerechtfertigter Bereicherung und Schadensersatz aus Fahrlässigkeit — für Vermögensschäden
    ebenso wie für Stress, Angst und Stigmatisierung. Kurz vor dem Verhandlungstermin einigten sich die
    Parteien; Richter Murphy hatte über die Genehmigung des Vergleichs zu befinden.'
  sachverhalt_quelle: volltext
