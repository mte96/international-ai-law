  ergebnis: 'Das Victorian Legal Services Board änderte am 19.08.2025 das practising certificate des von
    der Federal Circuit and Family Court in Dayal [2024] FedCFamC2F 1166 als "Mr Dayal" bezeichneten viktorianischen
    Rechtsanwalts, der dem Gericht eine mit generativer KI erstellte Liste und Zusammenfassung von Fundstellen
    mit unrichtigen Zitaten und Zusammenfassungen vorgelegt hatte. Folgen der Änderung: keine Berechtigung
    mehr, als principal lawyer zu praktizieren; keine Befugnis mehr zum Umgang mit Anderkonten (trust
    money); kein Betrieb einer eigenen Kanzlei mehr; Tätigkeit nur noch als angestellter Anwalt; beaufsichtigte
    Berufsausübung für zwei Jahre; vierteljährliche Berichte des Anwalts und seines Aufsehers an das Board
    während dieser Zeit. Die Erklärung des Board wurde am 02.09.2025 veröffentlicht.

    '
