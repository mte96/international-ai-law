  eigene_bewertung: 'Bewusst aufgenommener Negativbefund. Er beantwortet die Frage "soweit vorhanden"
    präzise: Neuseeland hat KI-Rechtsprechung ausschließlich zum Berufsrecht. Die s. 5 Copyright Act 1994
    ist dabei die interessanteste ungenutzte Norm des Commonwealth — sie weist KI-Ausgaben ausdrücklich
    einen Urheber zu, während Australien (Acohs, Telstra) und das Vereinigte Königreich (s. 9(3) CDPA
    1988, dessen Abschaffung 2025 konsultiert wurde) in die Gegenrichtung tendieren. Wer zur Schutzfähigkeit
    von KI-Ausgaben im Common Law arbeitet, sollte Neuseeland als Gegenmodell im Blick behalten.

    '
