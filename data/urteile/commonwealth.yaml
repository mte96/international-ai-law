  eigene_bewertung: 'Aktenzeichen und genaues Datum aus Modellwissen (CanLII per robots.txt gesperrt).
    Die am häufigsten zitierte und die am häufigsten kritisierte kanadische Entscheidung zu automatisierten
    Verwaltungsentscheidungen. Ihre Schwäche ist offensichtlich: Wenn die menschliche Unterschrift genügt,
    ist jede Automatisierung gerichtsfest, solange sie formal beratend bleibt — das ist genau die Konstruktion,
    an der Robodebt gescheitert wäre, wenn ein Gericht entschieden hätte. Paul Daly und die kanadische
    Literatur haben das kritisiert. Die späteren Entscheidungen desselben Jahres korrigieren die Linie
    faktisch, ohne Haghshenas ausdrücklich abzulehnen.

    '
