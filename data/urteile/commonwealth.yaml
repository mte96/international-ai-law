  - 'Am 05.09.2026 im Browser an der amtlichen Erklärung des Victorian Legal Services Board and Commissioner
    geprüft (lsbc.vic.gov.au/news-updates/news/statement-mr-dayal-matter). Bestätigt: Entscheidung des
    Board am 19.08.2025, Veröffentlichung der Erklärung am 02.09.2025.'
  - 'ERGÄNZT: Die Erklärung benennt die zugrundeliegende Gerichtsentscheidung — Dayal [2024] FedCFamC2F
    1166 (Federal Circuit and Family Court). Der Eintrag führte keine Fundstelle.'
