  sachverhalt: Bunnings betreibt in Australien Baumärkte. Vom 6. November 2018 an erprobte das Unternehmen
    zwei Monate lang in einer Filiale ein von Hitachi Kokusai Electric entwickeltes Gesichtserkennungssystem
    und setzte es dann von Januar 2019 bis zum 30. November 2021 in 62 Filialen ein — je 31 in New South
    Wales und Victoria. Die Überwachungskameras nahmen von jedem eintretenden Menschen mit sichtbarem
    Gesicht ein Standbild auf; daraus errechnete das System einen Satz von zwanzig oder mehr Merkmalspunkten
    und verglich ihn mit einer Datenbank von Personen, die Bunnings als Gefahr für seinen Betrieb eingestuft
    hatte. Die Bilder dieser Personen stammten meist aus den eigenen Kameras, gelegentlich auch von der
    Polizei; gab es keinen Treffer, wurde der errechnete Merkmalssatz verworfen. Eine förmliche Datenschutzfolgenabschätzung
    nahm Bunnings weder vorher noch währenddessen vor. Die Privacy Commissioner eröffnete am 11. Juli
    2022 ein Verfahren und stellte am 29. Oktober 2024 Verstöße fest; am 25. November 2024 beantragte
    Bunnings die Überprüfung durch das Administrative Review Tribunal.
  sachverhalt_quelle: volltext
