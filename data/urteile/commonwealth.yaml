  anspruchsgrundlage: Contempt of Court Act 2019 (NZ); ss. 116, 117 Crimes Act 1961 (NZ); Courts of New
    Zealand Guidelines for the Use of Generative Artificial Intelligence (Dezember 2023)
  kernfrage: 'Welche Folgen drohen einer Partei, die dem Gericht von generativer KI erzeugte oder verfälschte
    Fundstellen vorlegt?

    '
  ergebnis: 'Der Supreme Court verlängerte die Rechtsmittelfrist, versagte aber die Zulassung des Rechtsmittels
    und stellte fest, dass der nicht vertretene Antragsteller eine Reihe von Fundstellen angeführt hatte,
    die offenbar von einer KI-Anwendung erzeugt worden waren ("hallucinated by an Artificial Intelligence
    (AI) application") — reale Fallnamen mit falschen Fundstellen und falsch zugeordneten Rechtssätzen.
    Das Gericht erklärte, dass sich die Berufung auf falsche KI-Fundstellen in schwerwiegenden Fällen
    als Behinderung der Rechtspflege oder als Missachtung des Gerichts darstellen könne, und benannte
    dafür ausdrücklich ss. 116 und 117(e) Crimes Act 1961 sowie s. 26(2) und (4) Contempt of Court Act
    2019. Es verwies auf die Leitlinien der neuseeländischen Gerichte von Dezember 2023: "You are responsible
    for ensuring that all information you provide to the court/tribunal is accurate. You must check the
    accuracy of any information you get from a [generative AI] chatbot before using that information in
    court/tribunal proceedings." Tenor: "A: Extension of time granted. B: Leave to appeal dismissed. C:
    Applicant pays second respondent $500 costs."

    '
