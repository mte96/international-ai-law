  kernfrage: 'Soll Western Australia eine Praxisrichtlinie zum Einsatz generativer KI erlassen, und mit
    welchem Inhalt?

    '
  ergebnis: 'NEGATIVBEFUND ZUM STICHTAG. Der Supreme Court of Western Australia hat zum 27.08.2026 KEINE
    Practice Direction zur künstlichen Intelligenz erlassen. Auf der Website des Gerichts liegt unter
    "AI_practice_direction.pdf" ausschließlich eine Consultation Note ("The Supreme Court of Western Australia
    is considering the development of a practice direction") mit sechs Konsultationsfragen und Stellungnahmefrist
    31.03.2025. Sie enthält keine Verbote, keine Offenlegungspflichten und gilt für keine Dokumentenart.
    Die Law Society of Western Australia hat am 11.04.2025 Stellung genommen.

    '
