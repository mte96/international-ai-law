  sachverhalt: Am 22. Juli 2020 beantragte ein Migrant, vertreten durch einen Rechtsanwalt, beim Federal
    Circuit and Family Court die gerichtliche Überprüfung einer Entscheidung des Verwaltungstribunals
    vom 18. Juni 2020. Auf Anordnung eines Registrars reichte der Anwalt am 23. Oktober 2024 eine geänderte
    Antragsschrift und am 25. Oktober 2024 einen Schriftsatz nach. Beide Dokumente führten Entscheidungen
    des Federal Court an, die es nicht gibt, und gaben wörtliche Zitate aus der Tribunalentscheidung wieder,
    die dort nicht stehen. Am 11. November 2024 listete der Minister in seinem Schriftsatz siebzehn erfundene
    Fundstellen einzeln auf und wies auf acht Stellen mit erfundenen Zitaten hin. Am 19. November 2024
    schickte der Anwalt dem Gericht — ohne die Gegenseite in Kenntnis zu setzen — eine bereinigte Fassung
    und räumte die Fehler ein; in den veröffentlichten Gründen wird er nur als "the ALR" bezeichnet.
