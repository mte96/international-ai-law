  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Der Musterprozess, der Robodebt zu Fall brachte — und zugleich der Grund, warum Australien
    bis heute KEINE streitige Entscheidung zur Rechtmäßigkeit automatisierter Sozialleistungsbescheide
    besitzt. Der Commonwealth hat anerkannt, bevor ein Richter entscheiden konnte. Wer Amato als Präzedenzfall
    zitiert, zitiert eine Konsensentscheidung ohne Präzedenzwirkung im technischen Sinn. Die Beweiskraft
    liegt woanders: in der beigefügten Erklärung, die die Regierung selbst unterschrieben hat, und im
    Umstand, dass sie unterschrieben hat.

    '
