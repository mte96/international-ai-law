- id: au-2024-nsw-pn-sc-gen-23
  jurisdiktion: au
  gericht: Supreme Court of New South Wales
  instanz: behoerde
  aktenzeichen: Practice Note SC Gen 23 — Use of Generative Artificial Intelligence (GenAI)
  ecli: ''
  datum: 2024-11-21
  parteien:
    klaeger: Supreme Court of New South Wales
    beklagter: —
  status: erledigt
  themenachsen:
  - berufsrecht
