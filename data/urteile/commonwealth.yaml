- id: uk-2023-clearview-ftt
  jurisdiktion: uk
  gericht: First-tier Tribunal (General Regulatory Chamber), Information Rights
  instanz: erstinstanzlich
  aktenzeichen: '[2023] UKFTT 819 (GRC), EA/2022/0232'
  ecli: ''
  datum: 2023-10-17
  parteien:
    klaeger: Clearview AI Inc.
    beklagter: Information Commissioner
  status: erledigt
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 2(2)(a), 3(2)(b) UK GDPR
  kernfrage: 'Fällt die Verarbeitung durch einen privaten Anbieter aus dem sachlichen Anwendungsbereich
    der UK GDPR heraus, wenn seine Kunden ausländische Strafverfolgungs- und Sicherheitsbehörden sind?

    '
  ergebnis: 'Das First-tier Tribunal gab Clearview recht und hob die Bescheide des ICO auf. Die Verarbeitung
    sei zwar eine Beobachtung des Verhaltens im Sinne des Art. 3(2)(b), falle aber außerhalb des sachlichen
    Anwendungsbereichs der Verordnung, weil sie im Rahmen von Tätigkeiten erfolge, die der nationalen
    Sicherheit und Strafverfolgung ausländischer Staaten dienten. Der ICO sei daher unzuständig.

    '
  bedeutung: mittel
  volltext_url: https://assets.caselaw.nationalarchives.gov.uk/ukftt/grc/2023/819/ukftt_grc_2023_819.pdf
  zusammenfassung_url: ''
  bezug_regelwerke:
  - uk-gdpr
  instanzenzug:
  - uk-2022-ico-clearview-mpn
  - uk-2025-clearview-ut
  quelle_tracker: Find Case Law (National Archives); Stephenson Harwood
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Aufgehoben, aber unverzichtbar zu kennen: die Argumentation des FTT ist die Blaupause
    für jede Verteidigung eines KI-Anbieters, der über staatliche Zwischenkunden liefert. Das Upper Tribunal
    hat sie verworfen, der Court of Appeal wird sie erneut prüfen.

    '
  normen:
  - uk-gdpr-art-2-2-a
  - uk-gdpr-art-3-2-b
  quelle_art: amtlich
- id: uk-2025-clearview-ut
  jurisdiktion: uk
  gericht: Upper Tribunal (Administrative Appeals Chamber)
  instanz: berufung
  aktenzeichen: '[2025] UKUT 319 (AAC)'
  ecli: ''
  datum: 2025-10-08
  parteien:
    klaeger: Information Commissioner
    beklagter: Clearview AI Inc.
  status: rechtsmittel
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 2(2)(a), 3(2)(b) UK GDPR
  kernfrage: 'Erfasst die Bereichsausnahme des Art. 2(2)(a) UK GDPR auch ein privates Unternehmen, das
    ausländischen Sicherheitsbehörden zuarbeitet, und wie weit reicht der Begriff der Verhaltensbeobachtung
    in Art. 3(2)(b)?

    '
  ergebnis: 'Das Upper Tribunal gab dem ICO in drei von vier Berufungsgründen recht und stellte einen
    "material error of law" des First-tier Tribunal fest. Die Bereichsausnahme des Art. 2(2)(a) gelte
    nur für staatliche Tätigkeiten, nicht für ein privates Unternehmen, das Dienste an Staaten verkauft.
    Art. 3(2)(b) sei weit zu lesen: erfasst ist jeder Verantwortliche, dessen Verarbeitung mit einer Verhaltensbeobachtung
    im Vereinigten Königreich "in Zusammenhang steht". Die Sache wurde an das First-tier Tribunal zurückverwiesen,
    das nun über die Rechtmäßigkeit des Bußgeldes von 7,55 Mio. GBP und der Enforcement Notice in der
    Sache zu entscheiden hat. Am 19.12.2025 ließ das Upper Tribunal die weitere Berufung Clearviews zum
    Court of Appeal zu.

    '
  bedeutung: hoch
  volltext_url: https://caselaw.nationalarchives.gov.uk/ukut/aac/2025/319
  zusammenfassung_url: https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2025/10/uk-upper-tribunal-hands-down-judgment-on-clearview-ai-inc/
  bezug_regelwerke:
  - uk-gdpr
  instanzenzug:
  - uk-2022-ico-clearview-mpn
  - uk-2023-clearview-ftt
  quelle_tracker: ICO; Stephenson Harwood; Clifford Chance
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Stand der Sache am 27.08.2026: doppelt anhängig. Materiell liegt sie beim First-tier
    Tribunal zur Sachentscheidung, zugleich ist die Zuständigkeitsfrage beim Court of Appeal. Ein Termin
    ist nicht veröffentlicht. Praktische Bedeutung weit über Gesichtserkennung hinaus: die weite Lesart
    des Art. 3(2)(b) trifft jeden ausländischen Anbieter, der Daten britischer Nutzer zu Trainings- oder
    Profilbildungszwecken verarbeitet, auch ohne jede Niederlassung und ohne jedes Angebot an britische
    Verbraucher. Das ist die relevanteste britische Datenschutzentscheidung für KI-Anbieter überhaupt.

    '
  normen:
  - uk-gdpr-art-2-2-a
  - uk-gdpr-art-3-2-b
  quelle_art: amtlich
  sachverhalt: Clearview AI Inc. ist ein in Delaware eingetragenes amerikanisches Technologieunternehmen;
    im Vereinigten Königreich hatte es zur Zeit des Aufsichtsverfahrens keine Niederlassung. Es kopierte
    Bilder aus dem Internet in eine eigene Datenbank und bot seinen Kunden — überwiegend Strafverfolgungs-
    und Sicherheitsbehörden — an, ein eingereichtes Gesichtsbild mit dieser Datenbank abzugleichen; Kunden
    hatte es in den Vereinigten Staaten sowie unter anderem in Panama, Brasilien, Mexiko und der Dominikanischen
    Republik. Zwischen Juni 2019 und März 2020 überließ es den Dienst einer kleinen Zahl britischer Kunden
    zur Erprobung; in dieser Zeit stellten diese 721 Suchanfragen. Der Information Commissioner sah darin
    Verstöße gegen die DSGVO und die UK GDPR sowie eine unterbliebene Datenschutz-Folgenabschätzung, verhängte
    ein Bußgeld von 7.552.800 Pfund und erließ eine Enforcement Notice. Clearview legte am 29. Juni 2022
    Rechtsmittel zum First-tier Tribunal ein und bestritt nicht nur die Verstöße, sondern schon die Zuständigkeit
    des ICO für ein ausländisches Unternehmen; das First-tier Tribunal gab ihm in der Zuständigkeitsfrage
    recht, wogegen der ICO zum Upper Tribunal ging.
  sachverhalt_quelle: volltext
