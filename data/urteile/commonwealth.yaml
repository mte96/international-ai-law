  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Datum 02.02.2021 aus Modellwissen; die Fundstelle PIPEDA Findings #2021-001 ist über
    die OPC-Seite belegt, der Volltext wurde nicht ausgewertet. Die erste der drei großen Clearview-Entscheidungen
    (Kanada, Australien, Vereinigtes Königreich) und die dogmatisch interessanteste, weil sie nicht über
    die Einwilligung, sondern über die Angemessenheit des Zwecks nach s. 5(3) PIPEDA argumentiert — eine
    Norm ohne Entsprechung in der DSGVO. Der Befund ist ernüchternd: Drei Aufsichtsbehörden auf drei Kontinenten
    haben dasselbe Unternehmen verurteilt, und keine hat vollstreckt.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (priv.gc.ca): Titel ''PIPEDA Findings #2021-001: Joint investigation of
    Clearview AI, Inc. by the Office of the Privacy Commissioner of Canada, the Commission d''accès à
    l''information du Québec, the Information and Privacy Commissioner for British Columbia, and the Information
    Privacy Commissioner of Alberta'', Datum 02.02.2021.'
  - 'Ergebnis bestätigt: Beschwerde ''well-founded''; Erhebung ohne Einwilligung und zu unangemessenen
    Zwecken; empfohlen wurden Einstellung des Angebots in Kanada, Einstellung der Erhebung kanadischer
    Bilder und Löschung. Alle Angaben des Eintrags decken sich mit dem Dokument.'
