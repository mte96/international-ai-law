  eigene_bewertung: 'Als Entscheidung mit amtlichem Leitsatz die verbindliche Konkretisierung von Ayinde
    für die Asyl- und Ausländerrechtspraxis — dem Bereich mit der höchsten Dichte solcher Fälle, weil
    dort unter Zeit- und Kostendruck gearbeitet wird. Praktisch die härteste britische Aussage: Es gibt
    keine Entschuldigungsgründe, nur Milderungsgründe bei der Sanktion.

