  letzte_pruefung: *id001
  eigene_bewertung: 'Am 05.09.2026 am Urteil der Federal Court of Australia geprüft. Für die KI-Praxis
    die wichtigste australische Grundentscheidung außerhalb des Datenschutzrechts: Das Verbraucherrecht
    knüpft nicht an die Funktionsweise des Algorithmus an, sondern an die Erwartung, die seine Präsentation
    weckt. Wer ein Ranking, eine Empfehlung oder eine KI-Ausgabe als objektiv, personalisiert oder "bestes
    Ergebnis" bewirbt, haftet nach ss. 18, 29 ACL für die Diskrepanz — ohne dass es auf Vorsatz, Erklärbarkeit
    oder Modellzugang ankommt. Das ist der dogmatisch tragfähigste Hebel gegen intransparente KI-Systeme
    in Australien und wird gegenüber der Datenschutzdebatte unterschätzt.

    '
