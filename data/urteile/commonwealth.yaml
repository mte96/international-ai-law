  eigene_bewertung: 'DIE WICHTIGSTE NEUERUNG DIESER RECHERCHE. Am 06.05.2026 haben vier kanadische Aufsichtsbehörden
    erstmals ein allgemeines Sprachmodell umfassend datenschutzrechtlich geprüft und in sämtlichen Streitpunkten
    beanstandet. Das ist die weltweit dichteste Aufsichtsentscheidung zu einem GPAI-Modell und geht inhaltlich
    deutlich über das italienische Garante-Verfahren von 2023/2024 hinaus, weil sie die Rechenschaftspflicht
    auf die Freigabeentscheidung selbst erstreckt: Das Inverkehrbringen eines Modells trotz bekannter
    Konfabulationsneigung ist der Pflichtverstoß. Diese Denkfigur ist auf Art. 5 Abs. 1 lit. d und Art.
    24 DSGVO übertragbar und wird die europäische Debatte beeinflussen. Zugleich zeigt sie die kanadische
    Schwäche: PIPEDA kennt für die Bundesbehörde keine Anordnungs- und keine Bußgeldbefugnis; das Ergebnis
    ist eine Selbstverpflichtung, kein Bescheid.

    '
