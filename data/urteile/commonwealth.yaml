  kernfrage: 'Genügen standardisierte, aus einem algorithmischen Werkzeug stammende Textbausteine der
    Begründungspflicht?

    '
  ergebnis: 'Der Antrag auf gerichtliche Überprüfung hatte Erfolg. Grammond J hielt in Rn. 3 fest, die
    Notizen des Visa Officer bestünden weitgehend aus Textbausteinen, die offenbar von der Chinook-Software
    erzeugt seien; entscheidend sei nicht der Baustein als solcher — dass ein Satz in einem früheren Fall
    für angemessen gehalten wurde, immunisiere ihn nicht gegen die Überprüfung, und umgekehrt — sondern
    ob das Gericht nachvollziehen kann, warum der Entscheider zu seinem Ergebnis kam. Hinter den Bausteinen
    trug die Ablehnung auf drei Erwägungen zum Studienplan, die das Gericht als "devoid of logic" verwarf.
    Tenor: Antrag stattgegeben, die Ablehnung des Studienvisums aufgehoben, Zurückverweisung an einen
    anderen Visa Officer, keine Rechtsfrage von allgemeiner Bedeutung zugelassen.

    '
