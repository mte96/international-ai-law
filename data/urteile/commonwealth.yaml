  sachverhalt: In einem familienrechtlichen Vollstreckungsverfahren vor dem Federal Circuit and Family
    Court in Melbourne trat am 19. Juli 2024 ein viktorianischer Solicitor als Vertreter für eine andere
    Kanzlei auf. Er reichte dem Gericht eine Liste von Entscheidungen samt Zusammenfassungen ein. Als
    das Gericht die angeführten Entscheidungen nachschlagen wollte, fand es sie nicht — keine von ihnen
    existierte. Der Solicitor räumte ein, die Liste sei mit einem KI-Werkzeug erstellt worden, das in
    der von ihm abonnierten Kanzleisoftware eingebaut ist, und er habe das Ergebnis vor der Einreichung
    nicht überprüft; er entschuldigte sich vorbehaltlos. Das Gericht gab ihm bis zum 19. August 2024 Gelegenheit
    zur schriftlichen Stellungnahme und anonymisierte seinen Namen und den seiner Kanzlei in den veröffentlichten
    Gründen — er erscheint dort nur als "Mr Dayal".
