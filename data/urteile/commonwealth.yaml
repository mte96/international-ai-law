  eigene_bewertung: 'Fundstelle [2026] ARTA 130 aus Gilbert + Tobin, Datum 04.02.2026 aus Clayton Utz;
    die Entscheidung selbst konnte nicht abgerufen werden (AustLII gesperrt, ART-Datenbank nicht durchsuchbar).
    Der Volltext ist vor jeder Verwendung zu beschaffen. DIE WICHTIGSTE AUSSAGE ist nicht das Ergebnis,
    sondern die Zweiteilung: Der Zweck rechtfertigt die Erhebung, aber die Verfahrensverstöße bleiben
    bestehen. Damit hat das ART den Schwerpunkt der Compliance vom "Ob" auf das "Wie" verschoben: Beschilderung,
    Datenschutzerklärung und dokumentierte Risikobewertung entscheiden über die Rechtmäßigkeit, nicht
    die Technologie selbst. Für die Beratung von Einzelhändlern in Australien ist das die praktisch relevanteste
    Entscheidung überhaupt. Kritik (Monash, The Conversation) hält die niedrige Schwelle des "reason to
    suspect" für einen Dammbruch. Die Nichteinlegung der Berufung durch die Commissioner ist eine strategische
    Entscheidung, die den Zustand für absehbare Zeit zementiert.

    '
