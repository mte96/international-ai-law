  quelle_art: amtlich
  sachverhalt: 'Stephen Thaler baute ein System, das er DABUS nennt — "device for the autonomous bootstrapping
    of unified sentience". Es besteht aus mehreren parallel arbeitenden künstlichen neuronalen Netzen:
    Die einen erzeugen durch Selbstanregung neue Begriffe, die anderen bewerten diese auf Neuheit und
    Nutzen. Für eine internationale Patentanmeldung zu Behältern, Vorrichtungen und Verfahren, die mit
    konvexen und konkaven fraktalen Elementen erhöhte Aufmerksamkeit erregen, trug Thaler als Erfinder
    ein: "DABUS, The invention was autonomously generated by an artificial intelligence." Das australische
    Patentamt hielt dem entgegen, ein solches System könne kein Erfinder sein, und behandelte die Anmeldung
    als erloschen, weil Thaler die dazu ergangene Auflage nicht erfüllte; der Deputy Commissioner of Patents
    bestätigte das am 9. Februar 2021. Thaler beantragte die gerichtliche Überprüfung dieser Entscheidung.'
  sachverhalt_quelle: volltext
