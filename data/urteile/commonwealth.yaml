  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Keine KI-Entscheidung im engeren Sinn, aber der maßgebliche britische Maßstab für
    biometrische Systeme am Arbeitsplatz und damit für jede Form automatisierter Beschäftigtenüberwachung.
    Der tragende Satz — Bequemlichkeit des Arbeitgebers rechtfertigt keine biometrische Verarbeitung,
    solange eine unbiometrische Alternative existiert — lässt sich unmittelbar auf Emotionserkennung,
    Aufmerksamkeitsmessung und algorithmisches Produktivitätsmonitoring übertragen.

    '
