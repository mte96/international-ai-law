  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Fundstelle und Ergebnis aus Modellwissen und der Berufungsberichter- stattung; der
    Volltext wurde nicht abgerufen. Erfasst wegen der Divergenz zur Berufungsinstanz, die genau die Punkte
    umkehrt, die hier abgewiesen wurden.

    '
  pruefvermerk:
  - 'Am Primärdokument geprüft (Find Case Law): High Court of Justice, Queen''s Bench Division, Divisional
    Court, Cardiff; [2019] EWHC 2341 (Admin); Case No. CO/4085/2018; Datum 04.09.2019; Haddon-Cave LJ
    und Swift J; Kläger Edward Bridges, Beklagter Chief Constable of South Wales Police. Alle fünf Prüffelder
    stimmen.'
  - 'Ergänzend: Interested Party war der Secretary of State for the Home Department; Streithelfer der
    Information Commissioner und der Surveillance Camera Commissioner.'
  - 'Ergebnis bestätigt: Klage in vollem Umfang abgewiesen; der Rechtsrahmen (Common Law, DPA 2018, Surveillance
    Camera Code) genüge, die Einsätze vom 21.12.2017 und 27.03.2018 seien verhältnismäßig.'
  normen:
