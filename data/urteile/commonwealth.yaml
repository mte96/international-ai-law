    Streichung — ein deutlich milderer Ansatz als die in Ayinde angedrohte Kontemptfolge.

    '
  sekundaerquelle_url: https://www.abc.net.au/news/2025-11-03/legal-services-board-of-victoria-warns-lawyers-about-ai-in-court/105916628
