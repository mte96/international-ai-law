    intelligence" erwähnen, darunter zwei des Supreme Court (Chen v Goodmore Investments (NZ) Ltd [2026]
    NZSC 40 vom 01.05.2026; Jones v Family Court at Whangārei [2026] NZSC 1 vom 11.02.2026), zwei des
    Court of Appeal (Wikeley v Kea Investments Limited [2024] NZCA 609 vom 21.11.2024; Noble v Commissioner
