    Während England in Ayinde vom Kontemptverfahren absah und Australien mit Aufsichtsauflagen sanktioniert,
    benennt der neuseeländische Supreme Court ausdrücklich die strafrechtliche Dimension — und zwar gegenüber
    einer nicht vertretenen Partei, nicht gegenüber einem Anwalt. Das ist eine erhebliche Verschärfung
    gegenüber der Harber-Linie und sollte in jeder rechtsvergleichenden Darstellung stehen.

    '
