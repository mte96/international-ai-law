- id: uk-2019-bridges-dc
  jurisdiktion: uk
  gericht: High Court of Justice, Queen's Bench Division (Divisional Court), Cardiff
  instanz: erstinstanzlich
  aktenzeichen: '[2019] EWHC 2341 (Admin), CO/4085/2018'
  ecli: ''
  datum: 2019-09-04
  parteien:
    klaeger: R (on the application of Edward Bridges)
    beklagter: Chief Constable of South Wales Police
  status: erledigt
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 8 EMRK; Data Protection Act 1998 und 2018; s. 149 Equality Act 2010
  kernfrage: 'Ist der Einsatz automatisierter Live-Gesichtserkennung durch die Polizei mit Art. 8 EMRK,
    dem Datenschutzrecht und der Gleichbehandlungspflicht des öffentlichen Sektors vereinbar?

    '
  ergebnis: 'Der Divisional Court wies die Klage in vollem Umfang ab. Der Eingriff in Art. 8 Abs. 1 EMRK
    sei zwar gegeben, aber gesetzlich vorgesehen (Common Law der Polizeibefugnisse, DPA, Surveillance
    Camera Code) und verhältnismäßig; die Datenschutz-Folgenabschätzung sei ausreichend, ein Verstoß gegen
    die Public Sector Equality Duty nicht dargetan.

    '
  bedeutung: mittel
  volltext_url: https://caselaw.nationalarchives.gov.uk/ewhc/admin/2019/2341
  zusammenfassung_url: ''
