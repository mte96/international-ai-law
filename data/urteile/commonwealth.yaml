  sachverhalt: Deanna Amato hatte im April bis Juni sechs Vierzehntageszahlungen der Studienbeihilfe Austudy
    bezogen; sie war zu Beginn ihres Studiums von einer Vollzeitstelle in eine gelegentliche Beschäftigung
    gewechselt. Centrelink glich ihre Angaben später maschinell mit den Jahreseinkommensdaten der Steuerbehörde
    ab, verteilte das Jahreseinkommen rechnerisch gleichmäßig auf alle Vierzehntageszeiträume und errechnete
    daraus eine Überzahlung. Die Behörde setzte eine Schuld von 3.215,38 australischen Dollar fest, erhöhte
    sie um einen Zuschlag von zehn Prozent und behielt ihre Steuererstattung von über 1.700 Dollar ein
    — davon erfuhr Amato erst fast ein Jahr nach der Festsetzung, als das Geld weg war. Unterstützt von
    Victoria Legal Aid klagte sie vor dem Federal Court gegen den Commonwealth.
