  eigene_bewertung: 'ABRUFPROBLEM: robodebt.royalcommission.gov.au war nicht erreichbar (robots.txt-Timeout);
    die Angaben beruhen auf Sekundärquellen und Modellwissen und sind vor Zitierung am Bericht selbst
    zu prüfen. Keine gerichtliche Entscheidung, aber als `instanz: behoerde` erfasst, weil das Briefing
    Behördenentscheidungen mit Bindungswirkung einschließt und der Bericht die materiellen Feststellungen
    enthält, die kein Gericht getroffen hat. Für die Frage nach dem wichtigsten australischen Präzedenzfall
    zu automatisierten Verwaltungsentscheidungen ist der Befund unangenehm: Der "Präzedenzfall" Robodebt
    besteht aus einem Anerkenntnis, einem Vergleich und einem Untersuchungsbericht — nicht aus einem Urteil.
    Die rechtliche Folge im geltenden Recht ist der 2024 in das Privacy Act eingefügte Transparenzmechanismus
    für automatisierte Entscheidungen (APP 1.7, anwendbar ab 10.12.2026), nicht ein richterrechtlicher
    Maßstab.

    '
