  anspruchsgrundlage: Art. 35 UK GDPR (Datenschutz-Folgenabschätzung)
  kernfrage: 'Genügt die Datenschutz-Folgenabschätzung für einen in einen Massendienst eingebetteten generativen
    Chatbot den Anforderungen des Art. 35 UK GDPR, insbesondere im Hinblick auf minderjährige Nutzer?

    '
  ergebnis: 'Der ICO erließ am 06.10.2023 eine vorläufige Verfügung: Snap habe vor der Einführung von
    "My AI" die Risiken der generativen Funktion — insbesondere für 13- bis 17-jährige Nutzer — nicht
    hinreichend bewertet. Nach Nachbesserung durch Snap schloss der ICO das Verfahren im Mai 2024 ohne
    förmliche Maßnahme und ohne Bußgeld ab; die überarbeitete Folgenabschätzung genüge nunmehr. Der ICO
    betonte, die Entscheidung sei kein Freibrief und Art. 35 sei bei generativen Funktionen vor der Markteinführung
    zu erfüllen.

    '
  bedeutung: mittel
  volltext_url: https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2024/05/ico-warns-organisations-must-not-ignore-data-protection-risks-as-it-concludes-snap-my-ai-chatbot-investigation/
  zusammenfassung_url: ''
  bezug_regelwerke:
  - uk-gdpr
  instanzenzug: []
  quelle_tracker: ICO-Pressemitteilungen (über Sekundärberichte)
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'ACHTUNG: Die ICO-Seiten zu diesem Vorgang waren unter allen versuchten URLs mit HTTP
    404 nicht erreichbar. Datum des Abschlusses (Mai 2024) und Datum der vorläufigen Verfügung (06.10.2023)
    beruhen auf Modellwissen und einer Nachrichtenmeldung, NICHT auf einem Primärquellenabruf. Beides
    ist vor Zitierung zu prüfen. Inhaltlich der bislang einzige britische Aufsichtsfall, der die Datenschutz-Folgenabschätzung
    als das zentrale Instrument der Vorabkontrolle generativer Funktionen behandelt — das UK-Gegenstück
    zur Vorabkontrolle nach der KI-VO, aber ohne deren Sanktionsrahmen.

    '
  pruefvermerk:
