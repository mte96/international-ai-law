- id: ca-2024-moffatt-air-canada
  jurisdiktion: ca
  gericht: Civil Resolution Tribunal of British Columbia
  instanz: erstinstanzlich
  aktenzeichen: 2024 BCCRT 149, SC-2023-005609
  ecli: ''
  datum: 2024-02-14
  parteien:
    klaeger: Jake Moffatt
    beklagter: Air Canada
  status: rechtskraeftig
  themenachsen:
  - haftung
  - vertrag
  - content
  anspruchsgrundlage: Negligent misrepresentation (Hedley Byrne / Queen v Cognos); Vertragsrecht
  kernfrage: 'Haftet ein Unternehmen für eine falsche Auskunft, die sein Chatbot einem Kunden erteilt
    — oder ist der Chatbot eine gesondert zu betrachtende Informationsquelle, für die das Unternehmen
    nicht einsteht?

    '
  ergebnis: 'Das Unternehmen haftet. Air Canadas Chatbot hatte Moffatt erklärt, er könne den Trauerfalltarif
    nachträglich innerhalb von 90 Tagen beantragen; die verlinkte Tarifseite besagte das Gegenteil. Air
    Canada trug vor, der Chatbot sei "a separate legal entity that is responsible for its own actions"
    — das Tribunal bezeichnete diesen Vortrag als bemerkenswert und wies ihn zurück: Der Chatbot sei Teil
    der Website von Air Canada, und es mache keinen Unterschied, ob eine Information von einer statischen
    Seite oder von einem Chatbot komme; Air Canada sei für alle Informationen auf ihrer Website verantwortlich.
    Die Voraussetzungen der negligent misrepresentation lagen vor: Sorgfaltspflicht, unrichtige und irreführende
    Angabe, Verletzung der Sorgfaltspflicht, vernünftiges Vertrauen und Schaden. Zugesprochen wurden rund
    650 CAD Schadensersatz nebst Zinsen und Verfahrensgebühren.

    '
  bedeutung: hoch
  volltext_url: https://www.canlii.org/en/bc/bccrt/doc/2024/2024bccrt149/2024bccrt149.html
  zusammenfassung_url: https://www.mccarthy.ca/en/insights/blogs/techlex/moffatt-v-air-canada-misrepresentation-ai-chatbot
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: McCarthy Tetrault; WeirFoulds; American Bar Association (CanLII per robots.txt gesperrt)
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Datumskonflikt: McCarthy nennt den 19.02.2024, die ABA den 14.02.2024. Der CanLII-Volltext
    war per robots.txt gesperrt; das Aktenzeichen SC-2023-002378 stammt aus Modellwissen und ist zu prüfen.
    Die weltweit meistzitierte Entscheidung zur Chatbot-Haftung, und das bei einem Streitwert von 650
    CAD vor einem Bagatellgericht ohne Präzedenzbindung. Genau darin liegt die Gefahr: Sie wird routinemäßig
    als "Grundsatzentscheidung" zitiert, obwohl das Civil Resolution Tribunal keine bindenden Präzedenzfälle
    setzt. Die Denkfigur ist gleichwohl richtig und international anschlussfähig: Wer eine automatisierte
    Auskunftsschnittstelle betreibt, gibt damit eine eigene Erklärung ab. Für das deutsche Recht ist das
    die Frage nach der Zurechnung nach §§ 133, 157 BGB und der culpa in contrahendo — Moffatt liefert
    dafür das erste Argumentationsmuster aus dem Common Law.

    '
  pruefvermerk:
  - 'Am Entscheidungstext geprüft (Volltext-PDF der Civil Resolution Tribunal-Entscheidung): Citation
    2024 BCCRT 149, Datum 14.02.2024, Antragsteller Jake Moffatt, Antragsgegnerin Air Canada, Tribunal
    Member Christopher C. Rivers.'
  - 'KORREKTUR: Die Dispute-Nummer lautet SC-2023-005609. Der Eintrag führte ''SC-2023-002378''.'
  - 'Tenor bestätigt und beziffert: Air Canada hat binnen 14 Tagen insgesamt 812,02 CAD zu zahlen — 650,88
    CAD Schadensersatz, 36,14 CAD Zinsen vor Urteil, 125 CAD Verfahrensgebühren; Haftung aus negligent
    misrepresentation durch den Chatbot.'
  - CanLII (canlii.org/en/bc/bccrt/doc/2024/2024bccrt149/2024bccrt149.html) ist per robots.txt gesperrt;
    der Text war über eine Volltextkopie erreichbar.
  - CanLII-Fundstelle für Moffatt v. Air Canada, 2024 BCCRT 149.
  - 'EINSCHRÄNKUNG: CanLII sperrt automatisierten Abruf; Zuordnung über den CanLII-Indexeintrag mit exaktem
    Titel und Zitat (''2024 BCCRT 149 (CanLII) | Moffatt v. Air Canada'').'
  - 'Amtliche Alternative geprüft: decisions.civilresolutionbc.ca (Entscheidungsdatenbank des Tribunals)
    antwortet auf automatisierte Abrufe mit HTTP 403; eine direkte Tribunal-URL war nicht ermittelbar.'
  - Der bisherige Link (s3.amazonaws.com/IGG/...) ist eine Seminarunterlage und keine Fundstelle.
  - '07.09.2026: Die eigene_bewertung fuehrt weiter den Vorbehalt, das Aktenzeichen SC-2023-002378 stamme
    aus Modellwissen. Das Feld aktenzeichen ist laengst auf SC-2023-005609 berichtigt; der Vorbehalt ist
    gegenstandslos und zu streichen.'
  sekundaerquelle_url: https://s3.amazonaws.com/IGG/AI+Part+1+-+Materials/Moffatt+v.+Air+Canada.pdf
  dokumenttyp: Decision (Civil Resolution Tribunal)
  quelle_art: amtlich
  sachverhalt: Jake Moffatt wollte bei Air Canada Flüge aus Anlass eines Trauerfalls buchen und fragte
    den Chatbot auf der Website der Fluggesellschaft nach dem Trauerfalltarif. Der Chatbot antwortete,
    er könne zunächst den vollen Preis zahlen und die Ermäßigung binnen neunzig Tagen nachträglich beantragen;
    zugleich verwies er auf die Tarifseite von Air Canada, auf der das Gegenteil stand. Moffatt buchte
    im Vertrauen auf diese Auskunft und verlangte anschließend die Erstattung der Differenz. Air Canada
    lehnte ab und hielt ihm die Tarifbedingungen entgegen; sie machte überdies geltend, der Chatbot sei
    „a separate legal entity that is responsible for its own actions". Moffatt rief daraufhin das Civil
    Resolution Tribunal von British Columbia an (SC-2023-005609).
  sachverhalt_quelle: eintrag
