  eigene_bewertung: 'Aufgenommen, weil das Briefing Klagerücknahmen und Vergleiche ausdrücklich einschließt:
    Die Aufgabe des Systems am Vorabend der Verhandlung ist die deutlichste Aussage darüber, wie die Regierung
    ihre eigenen Erfolgsaussichten einschätzte. Rechtlich ist der Fall wertlos — es existiert kein Präzedenzfall
    zur algorithmischen Risikoeinstufung im britischen Verwaltungsrecht, und genau das ist der Befund:
    Großbritannien hat bis heute keine gerichtliche Entscheidung darüber, wann eine automatisierte Verwaltungsvorprüfung
    rechtswidrig wird.

    '
