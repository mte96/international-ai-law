  eigene_bewertung: 'Geltendes Recht in Australien. Die praktisch wichtigste Folge wird selten benannt:
    Weil die Erfinderbenennung in Australien — anders als in den USA — keine eidesstattliche Erklärung
    erfordert und das Patentamt sie nicht routinemäßig materiell prüft, hat die Entscheidung faktisch
    keine Filterwirkung. Sie verhindert nur die ehrliche Benennung, nicht die KI-gestützte Erfindung.
    Für die Mandatsberatung heißt das: der menschliche Beitrag ist zu dokumentieren, nicht zu verschweigen
    — dieselbe Falle wie in Thaler UK 2025.

    '
