  eigene_bewertung: 'Der erste britische Fall dieser Art und bis heute der maßgebliche Ausgangspunkt für
    den Umgang mit nicht vertretenen Parteien: Bei ihnen liegt der Schwerpunkt auf Belehrung, nicht auf
    Sanktion. Die spätere Linie ab Ayinde unterscheidet scharf zwischen Laien und Berufsträgern; wer das
    übersieht, zitiert Harber falsch.

    '
