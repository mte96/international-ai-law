  eigene_bewertung: 'Der wichtigste Gegenpol zur Reface-Linie und der Grund, warum der Oberste Gerichtshof
    die Praxis vereinheitlichen will. Die Divergenz ist nicht nur inhaltlich, sondern strukturell: In
    den Arbitragegerichten steht die Behauptung "das war eine KI" auf Seiten des Verletzers und scheitert
    an der Urhebervermutung des Art. 1257; vor den Bezirksgerichten steht sie auf Seiten des Anspruchstellers
    und scheitert am Nachweiserfordernis des Art. 1228. Beide Linien sind für sich stimmig und führen
    doch zu gegenläufigen Ergebnissen — die Beweislastverteilung entscheidet. Der Satz, die KI leiste
    nichts Schöpferisches, "weil sie kein Bewusstsein hat", ist dogmatisch überschießend: Es käme auf
    den Beitrag des Menschen an, nicht auf die Verfassung der Maschine. Die Berufungsentscheidung ist
    der wichtigste zu beobachtende Termin im russischen KI-Recht. Zu beachten: Das über die ComNews-Meldung
    greifbare Dokumentkennzeichen ist eine UUID der Datenbank mos-gorsud.ru, nicht das Aktenzeichen.

    '
