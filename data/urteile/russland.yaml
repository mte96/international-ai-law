  eigene_bewertung: 'Die einzige vollständig durchentschiedene KI-Rechtsfrage im russischen Recht und
    deshalb rechtsvergleichend wertvoll, obwohl sie in Europa nicht rezipiert wird. Der dogmatische Zugriff
    ist bemerkenswert unaufgeregt: Der Suд по интеллектуальным правам fragt nicht, ob die KI Urheber sein
    kann, sondern behandelt das Deepfake-Werkzeug wie jedes andere technische Hilfsmittel der Bearbeitung
    — die Schöpfung liegt in der menschlichen Auswahl und Gestaltung, nicht im Werkzeug. Das ist genau
    die Argumentationsfigur, die das US Copyright Office und die deutsche Literatur zu § 2 Abs. 2 UrhG
    für KI-gestützte, nicht KI-erzeugte Werke verwenden. Wer die Grenze zwischen "mit KI geschaffen" und
    "von KI erzeugt" belegen will, findet hier eine höchstrichterliche Bestätigung aus einer Rechtsordnung,
    die niemand als KI-freundlich verdächtigt.

    '
