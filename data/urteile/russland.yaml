  eigene_bewertung: 'Die spiegelbildliche Frage zum Halluzinationsfall: Dort haftet die Partei für den
    KI-Text, hier haftet niemand für den KI-Text des Gerichts. Das Argument — es gebe keine Regelung,
    also sei der Einsatz zulässig — ist in einem Rechtsstaat, der die Begründung als Rechtmäßigkeitsvoraussetzung
    kennt, alles andere als selbstverständlich. Der Vorsitzende des Obersten Gerichtshofs hat im November
    2025 die beschleunigte Einführung von KI in den Gerichtsbetrieb angeordnet; rund ein Drittel der russischen
    Gerichte setzt sie ein. Die Ankündigung vom Mai 2026, auch "Rechtsmittel wegen Verwendung von KI durch
    den Richter" in die Praxisübersicht aufzunehmen, zeigt, dass die Frage als Regelungsproblem erkannt
    ist. Für einen europäischen Rechtswissenschaftler ist das der Fall, an dem die Unterschiede in der
    Begründungsdogmatik am schärfsten hervortreten.

    '
  quelle_art: amtlich
