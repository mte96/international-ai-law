  kernfrage: Verliert ein audiovisuelles Werk den Urheberrechtsschutz, wenn es mit Deepfake-Technologie
    hergestellt wurde?
  ergebnis: 'Nein. Das Gericht sprach der Klägerin 500.000 RUB Kompensation zu. Die Beklagte hatte ein
    Werbevideo verwendet, in dem das Gesicht des Schauspielers Keanu Reeves per Deepfake auf einen Darsteller
    montiert war, ohne Lizenz. Der Einwand, ein maschinell erzeugtes Video sei nicht schutzfähig, wurde
    zurückgewiesen: Der Deepfake sei "ein zusätzliches Werkzeug der Videobearbeitung und keine Methode
    der Schöpfung". Der schöpferische Charakter hänge nicht davon ab, ob ein Werk von Hand oder mit technischen
    Mitteln geschaffen wurde; Drehbuch, Aufnahme und Tongestaltung stammten von den Urhebern.

    '
