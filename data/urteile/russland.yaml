  sachverhalt: Die ООО «Рефейс Технолоджис» (Reface Technologies) stellte ein Werbevideo her, in dem das
    Gesicht des Schauspielers Keanu Reeves per Deepfake auf einen Darsteller montiert war; Drehbuch, Aufnahme
    und Tongestaltung stammten von ihren eigenen Urhebern. Die ООО «Бизнес-аналитика», Betreiberin des
    Dienstes Roistat, verwendete dieses Video ohne Lizenz. Reface Technologies verlangte Kompensation
    und rief das Arbitragegericht der Stadt Moskau an; das Verfahren ging dort am 5. September 2023 ein.
    Die Beklagte hielt dem entgegen, ein maschinell erzeugtes Video sei schon gar nicht schutzfähig.
