  - ru-2023-glukhin-egmr
  quelle_tracker: vc.ru (04.08.2025)
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Der aktuelle Stand: Die Frage ist in Russland entschieden, und zwar zugunsten des
    Systems. Bemerkenswert ist die Begründungskette — sie stützt sich nicht auf eine Ermächtigung zur
    Gesichtserkennung, sondern auf eine Verkehrssicherheitsverordnung und eine Generalklausel. Das genaue
    Entscheidungsdatum ist in der ausgewerteten Quelle nicht genannt; das hier eingetragene Datum ist
    aus dem Aktenzeichenjahrgang und dem Veröffentlichungsdatum der Besprechung (04.08.2025) geschätzt
    und vor Zitation zu prüfen. Für den Vergleich mit Art. 5 Abs. 1 lit. h und Art. 26 Abs. 10 KI-VO ist
    dies der Referenzfall.

    '
  normen:
  - ru-152-fz-art-9
  - ru-152-fz-art-11
  quelle_art: amtlich
  sachverhalt: In der Moskauer Metro sind Kameras mit Gesichtserkennung im Einsatz; die Fahrgäste werden
    dabei nicht um Einwilligung gefragt. Ein Fahrgast, in der Veröffentlichung nur mit dem Anfangsbuchstaben
    B. bezeichnet, hielt das für rechtswidrig und klagte gegen das Verkehrsdepartement der Stadt Moskau
    und die Polizeiverwaltung der Metro. Er machte geltend, die Verarbeitung seiner biometrischen Daten
    bedürfe nach Art. 9 und 11 des Gesetzes Nr. 152-FZ seiner Einwilligung. Die Behörden beriefen sich
    demgegenüber auf die Anforderungen an den Schutz der Verkehrsinfrastruktur nach der Regierungsverordnung
    Nr. 1641 vom 8. Oktober 2020. Nach der Klageabweisung in erster Instanz gelangte die Sache an das
    Moskauer Stadtgericht (Московский городской суд).
  sachverhalt_quelle: eintrag
- id: ru-2022-polizisten-datenhandel
  jurisdiktion: ru
  gericht: Bezirksgericht der Stadt Moskau (Bezeichnung in der Quelle nicht spezifiziert); Moskauer Stadtgericht
  instanz: erstinstanzlich
  aktenzeichen: nicht ermittelt
  datum: 2022-05-01
  parteien:
    klaeger: Staatsanwaltschaft; Nebenklägerin Anna Kusnezowa
    beklagter: Dmitrij Scherschnjow und Konstantin Iwanow, Beamte der Moskauer Polizei
  status: rechtsmittel
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 137 StGB RF (Verletzung der Unverletzlichkeit des Privatlebens unter Ausnutzung
    der Dienststellung)
  kernfrage: Ist der Verkauf biometrischer Daten aus dem städtischen Gesichtserkennungssystem durch Polizeibeamte
    strafbar, und mit welcher Sanktion?
  ergebnis: 'Strafbar, aber nur geringfügig sanktioniert. Die Aktivistin Anna Kusnezowa kaufte für umgerechnet
    rund 270 Euro ihre eigenen Daten aus dem System und machte den Fall öffentlich. Nachdem die Einstellung
    des Verfahrens aufgehoben worden war, sprach das Gericht beide Beamten der Verletzung des Privatlebens
    unter Ausnutzung der Dienststellung schuldig und verhängte Geldstrafen von 10.000 und 20.000 RUB.
    Sowohl die Geschädigte als auch die Staatsanwaltschaft legten Rechtsmittel ein.

    '
  bedeutung: mittel
