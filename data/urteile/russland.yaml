  eigene_bewertung: 'Praktisch die wichtigste Entscheidung des Bestands für die Prozessführung: Sie zeigt,
    dass der KI-Einwand in Russland ein Beweisproblem ist, kein dogmatisches. Wer Projektdateien, Zwischenstände
    und Metadaten vorlegen kann, gewinnt; wer nur das Endergebnis hat, verliert. Das ist derselbe Mechanismus,
    der sich in Deutschland bei § 10 UrhG abzeichnet, und ein Argument dafür, dass die Frage der KI-Urheberschaft
    in der Praxis weniger über den Werkbegriff als über die Dokumentationsobliegenheit entschieden wird.

