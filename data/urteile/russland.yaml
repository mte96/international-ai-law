  kernfrage: Bestätigt die höchste Fachinstanz für Immaterialgüterrecht, dass Deepfake-Videos Urheberrechtsschutz
    genießen können?
  ergebnis: 'Ja. Der Суд по интеллектуальным правам wies am 19.08.2024 die Kassationsbeschwerde der Beklagten
    ООО «Бизнес-аналитика» zurück und ließ Urteil und Berufungsentscheidung unverändert ("Оставить решение
    (определение) суда первой инстанции и постановление суда апелляционной инстанции без изменения, а
    кассационную жалобу — без удовлетворения"). Vorinstanzen: Arbitragegericht der Stadt Moskau, 30.11.2023
    (begründetes Urteil im vereinfachten Verfahren), und Neuntes Arbitrage-Berufungsgericht, 08.04.2024.
    Das mit Deepfake-Technik erzeugte Video mit dem Abbild von Keanu Reeves bleibt damit urheberrechtlich
    geschützt; die Deepfake-Technik wird als Bearbeitungs- und Gestaltungswerkzeug und nicht als Ausschlussgrund
    für den Werkcharakter eingeordnet. Die zugesprochene Kompensation von 500.000 Rubel blieb unverändert.
    Es ist die erste russische Entscheidung, die einen Deepfake als urheberrechtliches Werk anerkennt;
    die Rechtsfrage ist damit auf der Ebene der Fachkassation geklärt.

    '
