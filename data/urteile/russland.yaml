  quelle_tracker: Rechtsprechungsübersicht garant-ufa.ru
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die schärfste Aussage des russischen Rechts zur Transparenz automatisierter Verwaltungsentscheidungen
    — und sie fällt negativ aus. Die Unterscheidung zwischen messenden und erkennenden Systemen ist technisch
    nachvollziehbar und rechtlich fragwürdig: Gerade weil ein Klassifikator nicht misst, sondern schätzt,
    wäre die Offenlegung von Trainingsdaten und Fehlerraten wichtiger als bei einem geeichten Messgerät.
    Die Entscheidung ist der beste Beleg dafür, dass das Anfechtungsrecht gegen KI-gestützte Behördenentscheidungen,
    das der Märzentwurf 2026 vorsah, kein theoretisches Anliegen war — und dass seine Streichung eine
    bewusste Entscheidung gegen gerichtlichen Zugriff ist. Für den Vergleich mit Art. 86 KI-VO (Recht
    auf Erläuterung) und Art. 22 DSGVO ist das der zentrale Kontrastfall.

    '
  quelle_art: amtlich
  sachverhalt: 'Eine Organisation im Moskauer Gebiet erhielt einen Ordnungswidrigkeitenbescheid, weil
    sie die Vorgaben über die Instandhaltung des Geländes verletzt habe: Schnee, Eis und Vereisungen seien
    von Straßen, Hofdurchfahrten und Gehwegen nicht ordnungsgemäß geräumt worden. Festgestellt hatte das
    ein besonderes technisches Mittel mit Foto-, Film- und Videofunktion — ein „automatisierter Komplex
    mit einem intelligenten neuronalen Netz zur Videofixierung von Verstößen samt vorinstallierter Software"
    —, das in seinem Sichtbereich unabhängig vom Ermessen eines Menschen alle Verstöße erfasst, für deren
    Erkennung es bestimmt ist. Die Organisation focht den Bescheid vor dem Arbitragegericht des Moskauer
    Gebiets an. Dieses forderte von den Beteiligten Unterlagen und Erklärungen darüber an, welche Begriffe
    in das neuronale Netz eingelegt worden waren; sie wurden nicht vorgelegt. Mit Urteil vom 18. August
    2023 (А41-17944/2023) gab das Gericht der Organisation recht; dagegen gingen die Behörden in die Berufung
    und anschließend in die Kassation zum Arbitragegericht des Moskauer Bezirks.'
  sachverhalt_quelle: volltext
