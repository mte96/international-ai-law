  gericht: Sawjolowski-Bezirksgericht der Stadt Moskau (Савёловский районный суд города Москвы), anschließend
    Moskauer Stadtgericht
  instanz: erstinstanzlich
  aktenzeichen: nicht ermittelt
  datum: 2019-11-06
  parteien:
    klaeger: Aljona Popowa (unterstützt von RosKomSvoboda), im zweiten Verfahren gemeinsam mit Wladimir
      Milow
    beklagter: Departement für Informationstechnologien der Stadt Moskau, Innenministerium
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 23, 24 Verfassung RF; Art. 9, 11 152-FZ; Art. 8 EMRK
  kernfrage: Verletzt der Einsatz von Gesichtserkennung im städtischen Videoüberwachungssystem ohne Einwilligung
    das Recht auf Privatleben?
  ergebnis: 'Nach Auffassung des Gerichts nicht. Die Klage wurde abgewiesen; die eingereichten Beweise
    seien unzureichend. Die Behörden argumentierten, die Videoüberwachung diene nicht nur der Identifizierung
    von Bürgern, sondern auch der Erkennung von Schnee und Mülltonnen. RosKomSvoboda hatte demgegenüber
    dokumentiert, dass Popowas Gesicht in der Aufzeichnung 32-fach vergrößert worden war. Eine zweite
    Klage — gerichtet auf das Verbot der Gesichtserkennung bei Massenveranstaltungen — wurde am 03.03.2020
    ebenfalls abgewiesen bzw. das Verfahren eingestellt.

    '
  bedeutung: hoch
  volltext_url: https://mos-gorsud.ru/rs/savyolovskij/services/cases/kas
  zusammenfassung_url: https://roskomsvoboda.org/51831/
  bezug_regelwerke:
  - ru-gesichtserkennung-moskau
  - ru-152-fz
  instanzenzug:
  - ru-2023-glukhin-egmr
  quelle_tracker: RosKomSvoboda, Meduza, Zona.media, pravo.ru
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Das Gründungsverfahren der russischen Gesichtserkennungsdebatte und der Ursprung
    der Kampagne "Ban Cam". Es scheiterte nicht an der Rechtsfrage, sondern an der Beweislast: Wer nicht
    beweisen kann, dass gerade sein Gesicht erkannt wurde, hat keinen Zugang zur materiellen Prüfung.
    Das ist dasselbe Problem, das in Deutschland bei der Kontrolle von Überwachungsinfrastruktur auftritt
    (vgl. die Anforderungen an die Beschwerdebefugnis vor dem BVerfG) — mit dem Unterschied, dass das
    russische Recht keine abstrakte Normenkontrolle für Betroffene kennt. Der Instanzenzug führt in der
    Sache zum EGMR, wo dieselbe Frage anders beantwortet wurde.

    '
  normen:
  - ru-152-fz-art-9
  - ru-152-fz-art-11
  quelle_art: amtlich
  sachverhalt: Die Stadt Moskau rüstete ihr Videoüberwachungssystem mit Gesichtserkennung aus. Die Aktivistin
    Aljona Popowa (Алёна Попова) ließ sich, unterstützt von der Bürgerrechtsorganisation RosKomSvoboda,
    Aufzeichnungen aus diesem System vorlegen; darin war ihr Gesicht 32-fach vergrößert worden. Sie hielt
    die Verarbeitung ihrer biometrischen Daten ohne Einwilligung für rechtswidrig und klagte gegen das
    Departement für Informationstechnologien der Stadt Moskau und das Innenministerium vor dem Sawjolowski-Bezirksgericht
    (Савёловский районный суд города Москвы). Die Behörden hielten dem entgegen, die Videoüberwachung
    diene nicht nur der Identifizierung von Bürgern, sondern auch der Erkennung von Schnee und Mülltonnen.
    Eine zweite Klage, gerichtet auf ein Verbot der Gesichtserkennung bei Massenveranstaltungen, erhob
    Popowa gemeinsam mit Wladimir Milow (Владимир Милов).
  sachverhalt_quelle: eintrag
- id: ru-2025-mgs-metro-kameras
  jurisdiktion: ru
  gericht: Moskauer Stadtgericht (Московский городской суд)
  instanz: berufung
  aktenzeichen: 33а-0710/2025
  datum: 2025-07-01
  parteien:
    klaeger: Bürger B. (Name abgekürzt veröffentlicht)
    beklagter: Verkehrsdepartement der Stadt Moskau; Polizeiverwaltung der Metro
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 9, 11 152-FZ; Regierungsverordnung Nr. 1641 vom 08.10.2020 (Schutz von Verkehrsinfrastruktur)
  kernfrage: Bedarf der Einsatz von Gesichtserkennungskameras in der Moskauer Metro der Einwilligung der
    Fahrgäste?
  ergebnis: 'Nein. Die Klage wurde abgewiesen, Berufung und Revision blieben ohne Erfolg. Das Gericht
    stützte sich auf drei Erwägungen: Die Metro unterliege gesetzlichen Anforderungen an den Schutz der
    Verkehrsinfrastruktur nach der Regierungsverordnung Nr. 1641/2020; Art. 11 des 152-FZ erlaube die
    Verarbeitung biometrischer Daten ohne Einwilligung zu Sicherheitszwecken; und nach der Auslegung des
    Obersten Gerichtshofs sei für Maßnahmen zum Schutz der Rechtsordnung und der Staatssicherheit keine
    Einwilligung erforderlich.

    '
  bedeutung: hoch
  volltext_url: https://mos-gorsud.ru/mgs/services/cases/kas
  zusammenfassung_url: https://vc.ru/legal/2136959-sud-priznal-zakonnost-kamer-s-raspoznavaniem-lits-v-metro
