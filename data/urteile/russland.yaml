  sachverhalt: 'Eine Privatperson erzeugte mit einem KI-Bildgenerator zwei Motive: eine Mona Lisa mit
    Weinglas und eine Freiheitsstatue, die statt der Fackel ein Weinglas hält; hinzugekommen waren unter
    anderem Augenringe. Der Ersteller gab dafür Eingabeaufforderungen ein und nahm anschließend Anpassungen
    an den Ergebnissen vor. Ein Einzelunternehmer vertrieb dieselben Motive auf Merchandise-Artikeln.
    Der Ersteller verlangte Kompensation und klagte vor dem Presnenski-Bezirksgericht der Stadt Moskau
    (Пресненский районный суд города Москвы); sein Name wurde nicht veröffentlicht.'
