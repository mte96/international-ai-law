  kernfrage: Begründet die Eingabe von Prompts und die anschließende Auswahl und Anpassung eines KI-Ergebnisses
    einen persönlichen schöpferischen Beitrag im Sinne des Art. 1228 ZGB?
  ergebnis: 'Nein. Die Klage auf Kompensation wurde abgewiesen. Streitgegenstand waren zwei Motive — eine
    Mona Lisa mit Weinglas und eine Freiheitsstatue, die statt der Fackel ein Weinglas hält. Das Gericht
    führte aus, die KI erbringe keine schöpferische Anstrengung, weil sie kein Bewusstsein habe; die Eingaben
    an das Programm und die vorgenommenen Anpassungen seien "rein mechanische, technische Handlungen".
    Die Veränderungen (Fackel gegen Weinglas, hinzugefügte Augenringe) seien nicht neu und in Kunst und
    Medien bereits verbreitet; die Anwendung vorhandener Ideen auf vorhandene Werke sei kein schöpferischer
    Beitrag. Der Kläger habe seinen persönlichen schöpferischen Beitrag nicht nachgewiesen. Tenor 13.11.2025,
    Gründe 19.03.2026; Berufung eingelegt am 17.04.2026, Akten der Berufungsinstanz vorgelegt am 28.05.2026.

    '
