  anspruchsgrundlage: Art. 119 Abs. 5 APK RF (Gerichtsgeldbuße); Art. 41 Abs. 2 APK RF (Redlichkeitsgebot)
  kernfrage: Wer haftet für erfundene Rechtsprechungszitate in einem Schriftsatz, wenn der Text von einem
    Sprachmodell erzeugt wurde?
  ergebnis: 'Der Verfahrensbeteiligte, nicht das Modell. Das Gericht verhängte eine Geldbuße von 50.000
    RUB wegen Missachtung des Gerichts. Die Kassationsbeschwerde in einem Streit über nicht erbrachte
    Buchhaltungsleistungen (Streitwert 58.000 RUB) stützte sich auf zahlreiche Entscheidungen höherer
    Gerichte; bei der Prüfung erwiesen sich die Fundstellen als teils nicht existent, teils auf gänzlich
    andere Streitigkeiten bezogen, die wörtlichen Zitate als frei erfunden. Das Gericht wertete dies als
    bewusste Übermittlung falscher Angaben unter Fälschung von Quellen und als Versuch, das Gericht durch
    vorgetäuschte höchstrichterliche Autorität zu beeinflussen. Der Einwand, den Text habe eine KI erzeugt,
    wurde zurückgewiesen: Wer die Technologie einsetzt, trägt die Verantwortung für die Richtigkeit des
    erzeugten Textes.

    '
  bedeutung: hoch
  volltext_url: https://kad.arbitr.ru/Card?number=%D0%9027-7831%2F2025
  zusammenfassung_url: https://focus.kontur.ru/site/news/87198-sud_vpervye_naznachil_shtraf
  bezug_regelwerke:
  - ru-243-fz-ki
  instanzenzug: []
  quelle_tracker: Kontur.Fokus, Fontanka, Systemny Blok, GARANT.RU
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die erste russische Entscheidung, die Verantwortlichkeit für KI-Halluzinationen ausdrücklich
    zuweist — und sie tut es schärfer als die vergleichbaren US-Entscheidungen (Mata v. Avianca und Nachfolger):
    nicht als Verstoß gegen anwaltliche Sorgfaltspflichten, sondern als Missachtung des Gerichts, also
    als Angriff auf die Rechtspflege. Der zitierte Satz — sinngemäß: verfälscht die KI Tatsachen oder
    Beweise, erfindet sie Rechtsnormen oder Rechtsprechung, so trägt die Verantwortung der Verfahrensbeteiligte
    — dürfte in den Praxisübersichtsbericht des Obersten Gerichtshofs eingehen. Für die deutsche Diskussion
    um § 43 BRAO und die Sorgfaltspflichten beim Einsatz generativer Systeme ist das ein unmittelbar anschlussfähiger
    Vergleichsfall. Zur Datierung siehe den Quellenkonflikt im meta-Block.

    '
  quelle_art: amtlich
  sachverhalt: Ein Auftraggeber und die ООО «Центральный Спец Сервис» aus Kemerowo stritten darüber, ob
    vereinbarte Buchhaltungsleistungen erbracht worden waren; der Streitwert betrug 58.000 Rubel. Nach
    den Entscheidungen der Vorinstanzen legte eine der Parteien Kassationsbeschwerde beim Arbitragegericht
    des Westsibirischen Bezirks ein und stützte sie auf zahlreiche Entscheidungen höherer Gerichte, die
    sie wörtlich zitierte. Bei der Prüfung erwies sich, dass ein Teil der Fundstellen nicht existierte,
    ein anderer Teil gänzlich andere Streitigkeiten betraf und die wörtlichen Zitate frei erfunden waren.
    Auf Vorhalt erklärte der Beteiligte, den Text habe eine KI erzeugt.
  sachverhalt_quelle: eintrag
