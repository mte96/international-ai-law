  anspruchsgrundlage: KoAP RF, Vorschriften über die automatische Feststellung von Ordnungswidrigkeiten
  kernfrage: Darf eine Ordnungswidrigkeit allein aufgrund der Auswertung durch ein neuronales Netz festgestellt
    werden, ohne dass die Trainingsparameter offengelegt werden?
  ergebnis: 'Ja. Die Vorinstanz hatte den Bescheid wegen fehlender Transparenz der Netzwerk-Trainingsparameter
    beanstandet; die höheren Instanzen hoben das auf. Automatische Erfassung ohne physikalische Messung
    — anders als bei Geschwindigkeitsmessgeräten, die einer Eichung bedürfen — sei zulässig. Gegenstand
    war ein "automatisierter Komplex mit neuronaler Netzwerk-Videofixierung" zur Feststellung mangelhafter
    Schneeräumung.

    '
  bedeutung: hoch
  volltext_url: https://kad.arbitr.ru/
  zusammenfassung_url: https://garant-ufa.ru/2025/12/05/spii/
