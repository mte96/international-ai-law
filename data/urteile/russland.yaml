  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die erste veröffentlichte Entscheidung eines russischen Gerichts zur Schutzfähigkeit
    KI-gestützt erzeugter Inhalte — und in der Sache die konservativste denkbare: Das Gericht behandelt
    den Deepfake als Werkzeug und lässt die Werkzeugfrage damit gar nicht erst zur Rechtsfrage werden.
    Das ist mit der deutschen und der europäischen Dogmatik vollständig vereinbar (Bearbeitung mit technischen
    Hilfsmitteln) und sagt über vollautomatisch erzeugte Inhalte nichts. Bemerkenswert ist die Rezeption:
    Die russische Fachöffentlichkeit hat die Entscheidung als "Anerkennung des Deepfake als Urheberrechtsobjekt"
    gelesen und damit weit über ihren Aussagegehalt hinaus verallgemeinert. Wer die russische Position
    rekonstruieren will, sollte diese Überdehnung als Befund mitnehmen: Sie erklärt, warum das 243-FZ
    die Frage der Rechte an KI-Erzeugnissen nicht selbst beantwortet, sondern in Art. 10 Abs. 1 an die
    Nutzungsbedingungen der Anbieter delegiert.

    '
