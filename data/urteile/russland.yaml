  - ru-420-421-fz
  instanzenzug: []
  quelle_tracker: RosKomSvoboda
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Aufgenommen, weil hier die Sicherheitsarchitektur des Systems gerichtlich festgestellt
    wurde: Die Daten des Moskauer Gesichtserkennungssystems waren gegen Bezahlung erhältlich. Das Missverhältnis
    zwischen dem Schutzgut und der Sanktion — 10.000 bzw. 20.000 RUB, also ein Bruchteil der 15 bis 20
    Mio. RUB, die seit 2025 für ein Leck biometrischer Daten in einem Unternehmen drohen — ist der eigentliche
    Befund. Es entkräftet zugleich das Argument der Metro-Entscheidung, der Sicherheitszweck rechtfertige
    die Verarbeitung: Ein System, dessen Daten gehandelt werden, schützt nicht, sondern gefährdet.

    '
  quelle_art: amtlich
- id: ru-2023-glukhin-egmr
  jurisdiktion: ru
  gericht: Europäischer Gerichtshof für Menschenrechte, Dritte Sektion
  instanz: verfassungsgericht
  aktenzeichen: Individualbeschwerde Nr. 11519/20
  ecli: ECLI:CE:ECHR:2023:0704JUD001151920
  datum: 2023-07-04
  parteien:
    klaeger: Nikolaj Sergejewitsch Gluchin
    beklagter: Russische Föderation
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 8 EMRK (Privatleben), Art. 10 EMRK (Meinungsfreiheit)
  kernfrage: Ist der Einsatz von Gesichtserkennungstechnologie zur Identifizierung und Festnahme eines
    Teilnehmers einer friedlichen Einzelkundgebung in einer demokratischen Gesellschaft notwendig?
  ergebnis: 'Nein; Verletzung von Art. 8 und Art. 10 EMRK. Der Beschwerdeführer hatte eine friedliche
    Einzelkundgebung mit einer Pappfigur und einem Transparent durchgeführt und wurde allein wegen unterlassener
    Anmeldung verurteilt. Die Behörden identifizierten ihn mit Gesichtserkennung aus veröffentlichten
    Fotos und Videos und nahmen ihn anschließend in der Moskauer Metro fest. Der Gerichtshof stufte diese
    Überwachung als "höchst eingriffsintensiv" ein und als "unvereinbar mit den Idealen und Werten einer
    demokratischen Gesellschaft"; es fehle an dokumentierten Schutzvorkehrungen und an Transparenz. Zu
    Art. 10: Die Behörden hätten keine Toleranz gegenüber einer friedlichen Kundgebung gezeigt und den
    Verstoß gegen die Anmeldepflicht sanktioniert, ohne zu prüfen, ob es sich um legitime Meinungsäußerung
    handelte und ob eine Gefahr für die öffentliche Ordnung bestand.

    '
  bedeutung: hoch
  volltext_url: https://hudoc.echr.coe.int/eng?i=001-225655
  zusammenfassung_url: https://policehumanrightsresources.org/case-of-glukhin-v-russia-application-no-11519-20
  bezug_regelwerke:
  - ru-gesichtserkennung-moskau
  - ru-152-fz
  - ki-vo-2024-1689
  instanzenzug:
  - ru-2019-popova-gesichtserkennung
  - ru-2025-mgs-metro-kameras
  quelle_tracker: HUDOC; Police and Human Rights Resources; American Journal of International Law
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die einzige gerichtliche Entscheidung, die das russische Gesichtserkennungssystem
    für konventionswidrig erklärt — und die einzige, die nicht vollzogen wird. Russland wurde am 16.03.2022
    aus dem Europarat ausgeschlossen und ist seit dem 16.09.2022 nicht mehr Vertragspartei der EMRK; der
    Gerichtshof blieb für Sachverhalte bis zu diesem Tag zuständig. Für die europäische Rechtsentwicklung
    ist Glukhin gleichwohl zentral: Es ist die tragende Referenzentscheidung für die Bewertung biometrischer
    Fernidentifizierung im politischen Kontext und wurde in der Debatte um Art. 5 Abs. 1 lit. h KI-VO
    durchgängig herangezogen. Wer die russische Position verstehen will, ohne sie zu übernehmen, findet
    hier den Punkt, an dem die Wege sich getrennt haben — und zwar zeitlich vor dem Erlass der KI-VO.
    Die russischen Gerichte haben nach Glukhin unverändert weiterentschieden; die Metro-Entscheidung von
    2025 zitiert die EMRK nicht. Zur Fundstelle: Die HUDOC-Datenbank (Dokument-ID 001-225655) ist eine
    JavaScript-Anwendung und war aus dieser Umgebung nicht auslesbar; als abrufbarer Volltext wird deshalb
    der Abdruck im American Journal of International Law verwendet, der Datum, Sektion und Tenor bestätigt.
    Die Angabe des Obersten Gerichts der Ukraine, das Urteil datiere vom 20.09.2023, betrifft ersichtlich
    nicht das Urteilsdatum.

    '
  sekundaerquelle_url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/AF9C0AAFA6E44CE9F1881B0542177D3C/S0002930023000520a.pdf/glukhin-v-russia-app-no-1151920-judgment.pdf
  dokumenttyp: Urteil (Judgment, Kammer)
  pruefvermerk:
  - HUDOC ist die amtliche Entscheidungsdatenbank des Europäischen Gerichtshofs für Menschenrechte; der
    bisherige Link war ein Zeitschriftenabdruck bei Cambridge University Press.
  - 'Volltext geöffnet über den amtlichen Ausgabekanal https://hudoc.echr.coe.int/app/conversion/docx/pdf?library=ECHR&id=001-225655
    — bestätigt: CASE OF GLUKHIN v. RUSSIA, Application no. 11519/20, Third Section sitting as a Chamber,
    Judgment 4 July 2023, Applicant Nikolay Sergeyevich Glukhin.'
  - Gericht, Sektion, Beschwerdenummer, Datum und Parteien stimmen mit dem Eintrag überein; die ECLI ECLI:CE:ECHR:2023:0704JUD001151920
    ist konsistent mit der Dokument-ID 001-225655.
  - Originalsprache des Urteils ist Englisch (Verfahrenssprache Englisch, Russisch als Sprache des Beschwerdeführers).
  quelle_art: amtlich
  sachverhalt: 'Moskau rüstete seine Überwachungskameras seit 2017 mit Live-Gesichtserkennung aus; bis
    zum 1. September 2020 waren alle rund 175.000 Kameras der Stadt damit ausgestattet, 2022 waren es
    über 220.000. Am 12. August 2019 wurde der politische Aktivist Konstantin Kotow (Константин Котов)
    festgenommen und wegen wiederholten Verstoßes gegen die Regeln über „öffentliche Veranstaltungen"
    nach Art. 212.1 des russischen Strafgesetzbuchs angeklagt; der Fall erregte großes Aufsehen. Am 23.
    August 2019 fuhr Nikolaj Gluchin (Николай Глухин) mit einer lebensgroßen Pappfigur Kotows durch die
    Moskauer Metro; die Figur hielt ein Transparent mit dem Text, er sei Konstantin Kotow und ihm drohten
    für friedliche Proteste bis zu fünf Jahre Haft nach Art. 212.1. Bei der „Beobachtung des Internets"
    stieß die Anti-Extremismus-Einheit der Metro-Polizei auf ein Foto, sicherte Bildschirmabzüge von Fotos
    und einem Video aus einem öffentlichen Telegram-Kanal, holte Aufzeichnungen der Überwachungskameras
    mehrerer Metrostationen ein und identifizierte Gluchin binnen weniger Tage samt Wohnanschrift. Am
    30. August 2019 wurde er in einer Metrostation festgenommen; die Polizei sagte ihm, die Gesichtserkennungskameras
    der Metro hätten ihn erkannt. Vorgeworfen wurde ihm eine Ordnungswidrigkeit nach Art. 20.2 Abs. 5
    des Ordnungswidrigkeitengesetzbuchs: Er habe eine Einzelkundgebung mit einem „schnell auf- und abbaubaren
    Gegenstand" durchgeführt und sie zuvor anmelden müssen.'
  sachverhalt_quelle: volltext
- id: ru-2026-vs-praxisuebersicht
  jurisdiktion: ru
  gericht: Oberster Gerichtshof der Russischen Föderation (Верховный Суд Российской Федерации)
  instanz: revision
  aktenzeichen: Vorhaben einer Praxisübersicht; noch kein Aktenzeichen
  datum: 2026-05-27
  parteien:
    klaeger: null
    beklagter: null
  status: anhaengig
  themenachsen:
  - governance
  - urheberrecht
  - haftung
  - grundrechte
  - content
  - berufsrecht
  anspruchsgrundlage: Art. 126 Verfassung RF; Art. 2 des Föderationsverfassungsgesetzes über den Obersten
    Gerichtshof (Befugnis zur Erläuterung der Rechtsanwendungspraxis)
  kernfrage: Welche einheitlichen Maßstäbe gelten für die gerichtliche Behandlung von Rechtsstreitigkeiten
    mit KI-Bezug?
  ergebnis: 'Noch offen. Der Vorsitzende des Obersten Gerichtshofs Igor Krasnow kündigte am 27.05.2026
    die erste Zusammenfassung der Praxis über alle Verfahrensarten hinweg an. Erfasst werden sollen: Haftung
    und Passivlegitimation bei durch KI verursachten Schäden; Persönlichkeitsrechtsverletzungen durch
    KI-erzeugte Inhalte einschließlich Deepfakes; Schutz geistigen Eigentums; Verwaltungs- und Strafverfahren,
    in denen behördliche Entscheidungen auf KI-Empfehlungen beruhen; Videoanalyse und Gesichtserkennung
    bei der Feststellung von Ordnungswidrigkeiten; Straftaten mit Deepfakes und Chatbot-Betrugsschemata;
    die Zulässigkeit KI-erzeugter Beweismittel; und Rechtsmittel, die auf die Verwendung von KI durch
    den Richter gestützt werden. Als Beispiel nannte die Berichterstattung den Fall A27-7831/2025. Ergebnis
    kann eine Erläuterung zur einheitlichen Rechtsanwendung sein oder eine Empfehlung an den Gesetzgeber.

    '
  bedeutung: hoch
  volltext_url: https://vsrf.ru/documents/practice/
  zusammenfassung_url: https://www.kommersant.ru/doc/8691125
  bezug_regelwerke:
  - ru-243-fz-ki
  - ru-gk-teil-4
  - ru-152-fz
  instanzenzug:
  - ru-2026-a27-ki-halluzinationen
  - ru-2025-presnenskij-ki-bilder
  - ru-2024-f05-schneeraeumung
  quelle_tracker: Kommersant (27.05.2026), Izvestija, dp.ru, Telesputnik
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Kein Urteil, aber im russischen System funktional wichtiger als die meisten Urteile:
    Praxisübersichten des Obersten Gerichtshofs binden die Instanzgerichte faktisch. Der Katalog der erfassten
    Fallgruppen ist zugleich das genaueste verfügbare Verzeichnis dessen, was in Russland tatsächlich
    streitig ist — und er ist breiter als der Regelungsgegenstand des 243-FZ. Die Ankündigung erfolgte
    ausdrücklich mit Blick auf den damals noch nicht eingebrachten Regierungsentwurf; die Gerichtsbarkeit
    hat sich also positioniert, bevor der Gesetzgeber entschieden hat. Das ist der wahrscheinlichste Ort,
    an dem die Divergenz zwischen der Reface-Linie und der Presnenski-Linie aufgelöst wird. Termin für
    die Veröffentlichung ist nicht bekannt.

    '
  quelle_art: amtlich
  sachverhalt: 'Vor den russischen Gerichten häuften sich Verfahren mit KI-Bezug: Schadensfälle durch
    KI-Systeme, Persönlichkeitsrechtsverletzungen durch KI-erzeugte Inhalte und Deepfakes, Streitigkeiten
    über geistiges Eigentum, Verwaltungs- und Strafverfahren, in denen behördliche Entscheidungen auf
    KI-Empfehlungen beruhten, Videoanalyse und Gesichtserkennung bei der Feststellung von Ordnungswidrigkeiten,
    Betrugsschemata mit Chatbots, KI-erzeugte Beweismittel und Rechtsmittel, die auf den KI-Einsatz des
    Richters gestützt wurden. Als Beispiel nannte die Berichterstattung das Verfahren A27-7831/2025, in
    dem ein Gericht eine Geldbuße wegen erfundener Rechtsprechungszitate verhängt hatte. Am 27. Mai 2026
    kündigte der Vorsitzende des Obersten Gerichtshofs der Russischen Föderation, Igor Krasnow (Игорь
    Краснов), an, das Gericht werde diese Praxis erstmals über alle Verfahrensarten hinweg zusammenfassen.
    Die Ankündigung erfolgte, bevor der Regierungsentwurf zum KI-Recht eingebracht war.'
  sachverhalt_quelle: eintrag
