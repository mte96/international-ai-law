  kernfrage: Genügt die Behauptung, ein streitbefangenes Bild sei von einem neuronalen Netz erzeugt worden,
    um die Urhebervermutung des Art. 1257 ZGB zu erschüttern?
  ergebnis: 'Nein. Das Gericht wies den Einwand zurück. Gegenstand waren 3D-Visualisierungen, Fotos und
    Videos aus dem zahnmedizinischen Bereich, die die beklagte Klinik ohne Lizenz auf ihrer Website verwendet
    hatte. Als Nachweis der Urheberschaft ließ das Gericht Screenshots genügen, die belegten, dass nur
    der Kläger über die ursprüngliche 3D-Modelldatei im BLEND-Format verfügte; die Metadaten der daraus
    konvertierten JPG-Datei (7500 x 6000 Pixel) wiesen den Namen des Urhebers aus. Die Urheberschaft sei
    eine Vermutung, die durch Gegenbeweis widerlegt werden könne — der Beklagte habe ihn nicht geführt.
    Die Verletzung wurde festgestellt.

    '
