    Karikatur/Parodie nur bei kommerzieller Ausbeutung) ist am 03.09.2026 weder auf indiankanoon noch
    über das Urteilsportal des Delhi High Court auffindbar; die Seite delhihighcourt.nic.in/web/judgement/fetch-data
