  kernfrage: 'Verletzt die Nutzung von Nachrichtenartikeln zum Training der Sprachmodelle HyperCLOVA und
    HyperCLOVA X ohne Erlaubnis das Urheberrecht, oder ist sie von der koreanischen fair-use-Klausel gedeckt?

    '
  ergebnis: 'KEINE ENTSCHEIDUNG. Klage erhoben am 13.01.2025; jeder der drei Sender verlangt 200 Mio.
    KRW Schadensersatz. Verfahrensstand am 05.09.2026: Beweisaufnahme. Das Gericht hat die Klägerinnen
    aufgefordert, die Verletzungshandlungen werkbezogen zu konkretisieren (Termin vom 10.11.2025); die
    fünfte mündliche Verhandlung fand im Juni 2026 statt, eine Zeugenvernehmung aus der Naver-Leitung
    war für den 18.08.2026 (Ausweichtermin 25.08.2026) angesetzt. Naver verteidigt sich mit dem Argument,
    reine Tatsachenmitteilungen in Nachrichten seien nicht urheberrechtlich geschützt. Ein Urteil ist
    nicht ergangen.

    '
