  eigene_bewertung: 'Keine Entscheidung mit Bindungswirkung, sondern eine ministerielle Rechtsauffassung
    — sie ist hier aufgenommen, weil sie weltweit die erste behördliche Positionierung zur Zulässigkeit
    des KI-Trainings war und in der internationalen Diskussion als Referenz benutzt wird (unter anderem
    von der US Copyright Office Study). Sie ist NICHT verbindlich, und es gibt bis heute keine israelische
    Entscheidung, die sie bestätigt hätte. Wer sie zitiert, sollte das offenlegen.

    '
