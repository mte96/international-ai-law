  - grundrechte
  anspruchsgrundlage: Art. 3 und Art. 12 Ley Federal del Derecho de Autor (LFDA); Art. 28 der Verfassung
    Mexikos
  kernfrage: 'Ist ein mit generativer KI erzeugtes Werk urheberrechtlich schutzfähig, und können Urheberpersönlichkeitsrechte
    einem KI-System zustehen?

    '
  ergebnis: 'Berichterstatterin Ministra Lenia Batres, Vorsitz Ministro Javier Laynez; einstimmig mit
    vier Stimmen. Sachverhalt: Der Kläger hatte einen mit Leonardo AI erzeugten virtuellen Avatar zur
    Eintragung angemeldet. Nachdem INDAUTOR die Eintragung im August 2024 zurückgewiesen hatte, formulierte
    er sein Begehren um und beanspruchte die Verwertungsrechte für sich, während er die Urheberpersönlichkeitsrechte
    dem KI-System zugeschrieben wissen wollte. Das Bundesverwaltungsgericht bestätigte die Zurückweisung.
    Die SCJN verneinte beides: "la inteligencia artificial (IA) no puede ser reconocida como autora ni
    titular de derechos morales de autor". Tragend sind Art. 3 und Art. 12 LFDA, die die Urheberschaft
    ausschließlich natürlichen Personen vorbehalten; Kreativität, Originalität und Individualität seien
    untrennbar mit menschlicher Erfahrung und Subjektivität verbunden — der KI fehlten "individualidad,
    originalidad, creatividad, experiencia, percepción del entorno y sentimientos". Das Gericht stellte
    anschließend ausdrücklich klar, dass die Entscheidung die Eintragung hybrider Werke mit substanziellem
    menschlichem Beitrag NICHT ausschließt.

    '
