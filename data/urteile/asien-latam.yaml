  eigene_bewertung: 'Die weltweit erste BINDENDE Rechtsprechung zum KI-Einsatz in der Justiz — Jurisprudencia
    hat in Mexiko formelle Bindungswirkung für nachgeordnete Gerichte, anders als kolumbianische Leitkriterien,
    brasilianische CNJ-Resolutionen oder englische Practice Directions. Der Ursprung ist dabei bemerkenswert
    unspektakulär: Der Spruchkörper hat selbst KI zur Berechnung von Sicherheitsleistungen im Amparo-Verfahren
    benutzt und daraufhin, ausdrücklich als Akt der Selbstbeschränkung, die Regeln formuliert, nach denen
    er sich künftig binden lassen will. Das ist Richterrecht über die eigene Arbeitsweise, nicht über
    die einer Partei.

    Die dogmatisch entscheidende Linie ist die Trennung zwischen "razonamiento numérico" und "razonamiento
    jurídico": KI darf rechnen, nicht auslegen. Das ist präziser als jede europäische Formulierung, insbesondere
    präziser als Art. 14 KI-VO, und es liefert einen praktikablen Prüfmaßstab dort, wo die europäische
    Diskussion mit dem unbestimmten Begriff der "menschlichen Aufsicht" arbeitet.

    Zweitens: Die ausdrückliche Bezugnahme eines lateinamerikanischen Gerichts auf die Ethik-Leitlinien
    der Hochrangigen Expertengruppe, die KI-VO und die UNESCO-Empfehlung ist der bislang beste empirische
    Beleg für einen judikativen — nicht regulatorischen — Brüssel-Effekt.

    Zu berichtigen ist die verbreitete Zuschreibung an die Suprema Corte de Justicia de la Nación: Urheber
    ist ein Kollegialgericht des Zweiten Kreises, nicht das Höchstgericht. Die Bindungswirkung folgt aus
    dem Charakter als Jurisprudencia, nicht aus dem Rang des Spruchkörpers.

    '
