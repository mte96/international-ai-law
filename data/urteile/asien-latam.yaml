  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die international wichtigste Entscheidung dieser Datei und derzeit die einzige ausführlich
    begründete Common-Law-Entscheidung der Welt, die LLM-Training unter eine gesetzliche Schranke subsumiert.
    Sie ist aber doppelt angreifbar. Erstens methodisch: Indien hat KEINE TDM-Schranke. Section 52(1)(a)
    ist eine enumerative fair-dealing-Norm für "private or personal use, including research" — historisch
    für menschliche Forschung geschrieben. Das Gericht dehnt sie auf industrielle Datenverarbeitung aus
    mit dem Satz, Forschung sei "no longer confined to humans". Das ist rechtspolitisch mutig und dogmatisch
    dünn; ein indisches Berufungsgericht kann das ohne weiteres kassieren. Zweitens strukturell: Die Feststellungen
    zur Memorisierung sind reine Tatsachenfeststellungen im Eilverfahren, getroffen auf einem schmalen
    Beweisfundament — das Gericht sagt das selbst. Der Fall ist NICHT rechtskräftig entschieden; die Hauptsache
    läuft weiter, und die eigentlich starke Anspruchsbasis, die öffentliche Wiedergabe durch Live-Abruf
    (Sec. 2(ff) Copyright Act), hat das Gericht ausdrücklich offen gelassen. Für europäische Mandanten
    ist der praktische Ertrag die Zuständigkeitsaussage: Der Serverstandort schützt nicht. Das ist die
    spiegelbildliche Aussage zu Getty ./. Stability, wo Getty am Territorialitätsnachweis scheiterte.
    Wer beide Entscheidungen nebeneinanderlegt, hat den gesamten Streitstand zur extraterritorialen Trainingshaftung.

    '
