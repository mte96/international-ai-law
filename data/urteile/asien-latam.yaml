  - '06.09.2026, Pruefrunde Rechtsprechung: Feld ''normen'' — bisher [dsgvo-art-22, ki-vo-art-14]; richtig:
    Beide sind zu streichen oder ausdruecklich als Vergleichsnormen zu kennzeichnen. Der israelische Oberste
    Gerichtshof hat weder die DSGVO noch die KI-VO angewandt; die Entscheidung stuetzt sich nach der eigenen
    Beschreibung des Eintrags allein auf allgemeines Verwaltungsrecht.. Beleg: Der Eintrag selbst formuliert
    in eigene_bewertung: die Entscheidung leiste dasselbe wie Art. 22 DSGVO und Art. 14 KI-VO "ohne jede
    spezialgesetzliche Grundlage, allein aus allgemeinem Verwaltungsrecht". Damit widerspricht das Feld
    normen der eigenen Bewertung.'
