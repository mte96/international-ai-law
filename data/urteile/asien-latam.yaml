  kernfrage: 'Deckt die Schranke des Art. 30-4 japanisches UrhG — die Nutzung von Werken ohne Genuss ihres
    Ausdrucksgehalts — auch das Abrufen und Wiedergeben von Nachrichteninhalten durch einen KI-Antwortdienst?

    '
  ergebnis: 'KEINE ENTSCHEIDUNG. Klage erhoben am 26.08.2025 vor dem Bezirksgericht Tokio. Nikkei und
    Asahi Shimbun werfen Perplexity die unerlaubte Vervielfältigung ihrer Artikel, die Verbreitung von
    Falschinformationen und eine Beeinträchtigung ihres Geschäftsbetriebs vor und verlangen Unterlassung
    sowie je 2,2 Mrd. Yen Schadensersatz. Perplexity hat öffentlich um Aufschub bis zur Ausräumung von
    "Missverständnissen" gebeten. Eine Sachentscheidung liegt zum 05.09.2026 nicht vor.

    '
  bedeutung: hoch
