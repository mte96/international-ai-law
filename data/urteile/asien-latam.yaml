  sachverhalt: 'Richter Carlos Rogelio Richeri verurteilte Raúl Amelio Payalef am 4. Juni 2025 am Strafgericht
    Esquel in der Provinz Chubut zu zwei Jahren und sechs Monaten Freiheitsstrafe. Im Text des Urteils
    blieb ein Satz stehen, der nicht vom Gericht stammte, sondern von einem KI-Assistenten: „Aquí tienes
    el punto IV reeditado, sin citas y listo para copiar y pegar." Damit stand fest, dass Teile der Begründung
    von einem generativen System erzeugt worden waren; welche Teile das waren, ließ sich nicht mehr feststellen.
    Die Provinz hatte mit dem Acuerdo Plenario N.º 5435/2025 bereits Regeln für den KI-Einsatz in der
    Justiz erlassen. Gegen das Urteil wurde Rechtsmittel zur Cámara Penal de Esquel eingelegt.'
