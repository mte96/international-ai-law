    32 Verfassung (Popularklage)
  kernfrage: 'Kann der Supreme Court im Wege der Public Interest Litigation Mindestgarantien für den Einsatz
    künstlicher Intelligenz durch Bund und Länder anordnen — Folgenabschätzungen, Bias-Audits, Transparenzpflichten,
    menschliche Aufsicht?

    '
  ergebnis: 'Der Spruchkörper (Chief Justice Surya Kant, Justice Joymalya Bagchi, Justice V. Mohana) lehnte
    die Annahme ab. Chief Justice Kant: "Two reasons it cannot be addressed by us. One is it is a highly
    technical issue. We are not the experts. And this is a policy domain." Die Antragsgegner wurden angewiesen,
    eine bereits eingereichte Eingabe des Antragstellers zu prüfen; dieser darf sie um den Inhalt der
    Petition ergänzen. Das Gericht wies darauf hin, die eigenen KI-Regelungen der Justiz seien bereits
    umfassend.

    '
