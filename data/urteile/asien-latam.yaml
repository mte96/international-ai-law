  anspruchsgrundlage: Art. 3 Abs. 1 Nr. 1, Art. 10 Urheberrechtsgesetz Taiwans (著作權法); Patentgesetz Taiwans
  kernfrage: 'Sind Ergebnisse von Computerberechnungen ohne menschlichen schöpferischen Beitrag urheberrechtlich
    geschützt, und kann eine KI Erfinderin sein?

    '
  ergebnis: 'Das IPCC hat entschieden, dass "Ergebnisse von Softwareberechnungen auf der Grundlage eingegebener
    Parameter" keinen Urheberrechtsschutz genießen, weil ihnen der menschliche schöpferische Beitrag fehle;
    sie beruhten auf mathematischer Berechnung und seien nicht von einem "Menschen" geschaffen. Der Oberste
    Verwaltungsgerichtshof hat zur Erfindereigenschaft entschieden, das Namensnennungsrecht des Erfinders
    sei ein Persönlichkeitsrecht, weshalb der Erfinder eine natürliche Person sein müsse. Zu generativer
    KI im engeren Sinne existiert in Taiwan bis zum 27.08.2026 KEINE Entscheidung; Aktenzeichen und Daten
    dieser beiden Judikate ergeben sich aus der zugänglichen Quelle nicht.

