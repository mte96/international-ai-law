  eigene_bewertung: 'Weltweit die erste verfassungsgerichtliche Entscheidung darüber, wie präzise der
    Gesetzgeber "künstliche Intelligenz" definieren muss, um daran Strafbarkeit zu knüpfen. Das ist die
    Frage, die in Deutschland bei jeder Umsetzung von KI-bezogenen Straftatbeständen und bei § 184k StGB-Erweiterungen
    auftauchen wird und die auch die Definitionsdebatte zu Art. 3 Nr. 1 KI-VO betrifft. Mexikos Antwort
    — funktionale Definition genügt — ist großzügiger, als das Bundesverfassungsgericht sie nach Art.
    103 Abs. 2 GG voraussichtlich geben würde. Die drei mexikanischen Normenkontrollverfahren zusammengelesen
    ergeben die derzeit einzige verfassungsgerichtliche Dogmatik zum KI-Begriff im Strafrecht weltweit.

    '
