  kernfrage: 'Ist der KI-gestützte Austausch des Gesichts in einem fremden Video eine erlaubte Bearbeitung
    oder eine Verletzung des Rechts der öffentlichen Zugänglichmachung, und kann sich der Anbieter auf
    Technologieneutralität berufen?

    '
  ergebnis: 'Der Beklagte betrieb ein Mini-Programm ("X Yan"), das mit KI-Algorithmen das Gesicht des
    Nutzers in fremde Originalvideos einsetzte. Der Kläger hatte 13 Kurzvideos mit Auftritten in historischer
    Kostümierung gedreht. Das Gericht bejahte die Verletzung: Zwar seien nur die Gesichtszüge ersetzt
    worden, Szenen, Bewegungen und übrige Elemente seien aber im Wesentlichen mit dem Original identisch.
    Die Einwände der Schrankenregelung und der Technologieneutralität wurden zurückgewiesen, weil das
    Unternehmen über Werbung und Mitgliedschaften Gewinn erzielte. Es treffe den Diensteanbieter eine
    "angemessene Sorgfaltspflicht". Schadensersatz 7.500 RMB; keine Berufung. Der Oberste Volksgerichtshof
    nahm den Fall im April 2025 in seine typischen IP-Fälle des Jahres 2024 auf.

    '
