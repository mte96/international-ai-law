  kernfrage: 'Genügen Auswahl und Verfeinerung von Prompts sowie die Auswahl aus mehreren Modellausgaben,
    um KI-generierte Bilder als Werke zu schützen?

    '
  ergebnis: 'Das Gericht folgte der Linie des Pekinger Internetgerichts und bejahte den Werkcharakter.
    Die Auswahl und Verfeinerung der Prompts sowie der Auswahlvorgang unter mehreren erzeugten Bildern
    zeigten eine originäre geistige Leistung des Nutzers. Das genaue Entscheidungsdatum ergibt sich aus
    den abgerufenen Quellen nicht; das Aktenzeichen weist das Verfahren als 2024 eingeleitet aus.

    '
