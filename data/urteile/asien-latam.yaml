  - Am 05.09.2026 im Browser erfolglos geprüft. supremedecisions.court.gov.il ließ sich in dieser Sitzung
    nicht aufrufen (Navigation von der Browsererweiterung abgelehnt); www.court.gov.il/NGCS.Web.Site/Search/SearchJudgments
    antwortet mit einer Fehlerseite ("הפעולה אותה ביצעת אינה נתמכת"); die Volltextsuche unter supreme.court.gov.il/Pages/fullsearch.aspx
    lädt, stellt die Suchmaske aber nur über Skripte bereit, die hier nicht bedienbar waren.
  - 'WIDERSPRUCH IM EINTRAG: Das in der suchadresse genannte Aktenzeichen 63194-08-25 folgt dem Format
    des Systems Net HaMishpat für Amts- und Bezirksgerichte (laufende Nummer, Monat, Jahr der Einreichung),
    nicht dem Format des Obersten Gerichtshofs (Verfahrensart plus Nummer/Jahr, etwa בג"ץ 1234/25). Die
    Zuordnung zum Obersten Gerichtshof ist damit zweifelhaft; wahrscheinlicher ist eine Entscheidung eines
    Amts- oder Bezirksgerichts.'
  - zweifelhaft auf true gesetzt. Gericht, Instanz, Datum (01.03.2026 wirkt wie ein Platzhalter), Aktenzeichen
