  anspruchsgrundlage: Art. 15, 18, 22, 39-3 Personal Information Protection Act Koreas (개인정보 보호법)
  kernfrage: 'Darf ein Unternehmen personenbezogene Chatverläufe, die für einen anderen Dienst erhoben
    wurden, ohne gesonderte Einwilligung zum Training eines Chatbots verwenden, und genügt Pseudonymisierung?

    '
  ergebnis: 'Die PIPC verhängte gegen ScatterLab ein Bußgeld (과징금) von 55.500.000 KRW und eine Geldbuße
    (과태료) von 47.800.000 KRW, zusammen 103.300.000 KRW, und erließ Abhilfeanordnungen. Beanstandet wurden
    die unzureichenden Einwilligungsverfahren in den Diensten 텍스트앳 (TextAt), 연애의 과학 (Science of Love)
    und 이루다 (Iruda), die fehlende Einwilligung der Erziehungsberechtigten bei Daten von Kindern, die Verarbeitung
    sensibler Daten ohne gesonderte Einwilligung sowie die zweckwidrige Verwendung der aus den beiden
    erstgenannten Diensten stammenden KakaoTalk-Nachrichten zum Training des Chatbots Iruda. Die Abhilfeanordnungen
    umfassen die Verbesserung der Einwilligungsverfahren, die Einholung der Einwilligung gesetzlicher
    Vertreter, gesonderte Einwilligungswege für sensible Daten, die Löschung der Daten ausgetretener Nutzer
    und ungenutzter Konten, die Vernichtung der abgeflossenen Daten und Mitarbeiterschulungen.

    '
  bedeutung: hoch
  volltext_url: https://www.pipc.go.kr/np/default/agenda.do?op=view&mCode=E030010000&idxId=2021-0257
