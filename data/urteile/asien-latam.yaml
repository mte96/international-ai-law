  sachverhalt: 'Gerald García Báez erzeugte mit dem Programm Leonardo AI einen virtuellen Avatar und meldete
    ihn beim Instituto Nacional del Derecho de Autor (INDAUTOR) zur Eintragung an. INDAUTOR wies die Anmeldung
    im August 2024 zurück. García Báez formulierte sein Begehren daraufhin um: Die Verwertungsrechte beanspruchte
    er für sich, die Urheberpersönlichkeitsrechte sollten dem KI-System zustehen. Das Tribunal Federal
    de Justicia Administrativa bestätigte die Zurückweisung; dagegen erhob er Amparo directo, über den
    die Segunda Sala der Suprema Corte de Justicia de la Nación zu befinden hatte.'
