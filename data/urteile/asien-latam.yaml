  sachverhalt: Der Schauspieler Anil Kapoor stellte fest, dass eine Vielzahl von Anbietern seinen Namen,
    sein Bild, seine Ähnlichkeit, seine Stimme, seine Sprechweise und seine Gestik ohne Erlaubnis verwendete
    — teils zu unmittelbarer kommerzieller Ausbeutung, teils so, dass der Eindruck einer Empfehlung durch
    ihn entstand. Zum Einsatz kamen dabei auch KI-gestützte Face-Morphing- und Deepfake-Werkzeuge, mit
    denen sich sein Abbild in beliebige Darstellungen einsetzen ließ; einzelne dieser Inhalte waren geeignet,
    sein Ansehen zu beschädigen. Verbreitet wurden sie über Plattformen und über eigens registrierte Internetadressen.
    Am 20. September 2023 erhob Kapoor vor dem High Court of Delhi Klage gegen Simply Life India und zwanzig
    weitere namentlich benannte Beklagte und beantragte eine einstweilige Verfügung ohne vorherige Anhörung
    der Gegenseite.
