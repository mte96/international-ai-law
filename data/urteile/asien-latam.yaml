  anspruchsgrundlage: Art. 18 der Verfassung Argentiniens (debido proceso, Begründungspflicht); Prozessordnung
    der Provinz Chubut
  kernfrage: 'Ist ein Strafurteil nichtig, wenn nicht feststellbar ist, welcher Teil der Begründung vom
    Richter und welcher von einem generativen KI-System stammt?

    '
  ergebnis: 'Zweistufig — und im Ergebnis GEGENTEILIG zur bisherigen Darstellung dieses Eintrags.

    (1) Cámara Penal de Esquel, 16.10.2025 (Carina Estefanía, Martín Zacchino, Hernán Dal Verme): Das
    erstinstanzliche Urteil vom 04.06.2025 — zwei Jahre sechs Monate Freiheitsstrafe gegen Raúl Amelio
    Payalef — und das gesamte Verfahren wurden für nichtig erklärt und eine neue Hauptverhandlung vor
    einem anderen Richter angeordnet. Auslöser war der im Urteilstext stehen gebliebene Satz des KI-Assistenten:
    "Aquí tienes el punto IV reeditado, sin citas y listo para copiar y pegar." Tragend war, dass sich
    nicht mehr feststellen ließ, wie viel Text der generativen KI zuzurechnen sei.

    (2) Superior Tribunal de Justicia del Chubut, 13.03.2026 (Ministros Camila Banfi Saavedra, Silvia
    Bustos, Andrés Giacomone, Javier Raidan, Mario Vivas; Napolitani abwesend): Auf das Rechtsmittel der
    Staatsanwaltschaft HOB DER STJ DIE NICHTIGKEITSERKLÄRUNG AUF. Die gerichtliche Kontrolle richte sich
    auf die nach außen tretende Begründung, nicht auf die vom Richter benutzten geistigen Hilfsmittel;
    ein Verstoß gegen die Vorgaben des Acuerdo Plenario N.º 5435/2025 zum KI-Einsatz führe nicht automatisch
    zur Nichtigkeit, sondern nur bei konkret dargelegter Beeinträchtigung von Verfahrensrechten. Die Sache
    wurde an die Cámara Penal in neuer Besetzung zurückverwiesen, damit sie die offen gebliebenen Rügen
    behandelt. Die Verurteilung ist damit wiederhergestellt; der Grundsatz bleibt, dass KI "herramienta
    de apoyo y nunca una fuente autónoma de decisión" ist.

    '
