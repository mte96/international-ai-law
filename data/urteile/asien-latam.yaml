- id: cn-2023-li-liu
  jurisdiktion: cn
  gericht: 北京互联网法院 — Beijing Internet Court (Internetgericht Peking)
  instanz: erstinstanzlich
  aktenzeichen: (2023) 京0491民初11279号 — (2023) Jing 0491 Min Chu No. 11279
  ecli: ''
  datum: 2023-11-27
  parteien:
    klaeger: Li (李某)
    beklagter: Liu (刘某)
  status: rechtskraeftig
  themenachsen:
  - urheberrecht
  - content
  anspruchsgrundlage: 'Im Tenor angewandt: Art. 10 Abs. 1 Nr. 2 (Namensnennungsrecht) und Nr. 12 (Recht
    der öffentlichen Zugänglichmachung über Informationsnetze), Art. 53 und Art. 54 Urheberrechtsgesetz
    der VR China (中华人民共和国著作权法). In den Gründen erörtert: Art. 3 und Art. 11 UrhG-China sowie Art. 2 der
    Durchführungsverordnung.'
  kernfrage: 'Ist ein mit Stable Diffusion erzeugtes Bild ein urheberrechtlich geschütztes Werk, und wenn
    ja, wem steht das Recht zu — dem Nutzer, dem Modellanbieter oder niemandem?

    '
  ergebnis: 'Das Gericht bejahte den Werkcharakter und sprach das Recht dem Nutzer zu. Tragend war ein
    zweistufiger Gedankengang. Erstens: Urheber kann nach Art. 11 UrhG-China nur eine natürliche oder
    juristische Person sein, das Modell selbst also nie. Zweitens: Originalität liegt in den "personalisierten
    Auswahlentscheidungen und ästhetischen Urteilen" des Nutzers über den gesamten Erzeugungsvorgang hinweg.
    Der Kläger hatte über 150 Prompts ausgewählt, ihre Reihenfolge festgelegt, konkrete Parameter gesetzt
    und anschließend Prompts und Parameter fortlaufend nachjustiert, bis das gewünschte Ergebnis vorlag.
    Diese Tätigkeit gehe über bloß "mechanische" Vorgänge hinaus. Der Beklagte hatte das Bild in einem
    Blogbeitrag ohne Urhebernennung verwendet; verurteilt wurde er wegen Verletzung des Namensnennungsrechts
    und des Rechts der öffentlichen Zugänglichmachung über Informationsnetze, zu einer öffentlichen Entschuldigung
    und zu Schadensersatz. Der Tenor lautet: erstens öffentliche Entschuldigung im streitgegenständlichen
    Baijiahao-Konto, zweitens 500 RMB Ersatz des wirtschaftlichen Schadens binnen sieben Tagen nach Rechtskraft,
    drittens Abweisung im Übrigen; gefordert waren 5.000 RMB. Keine Berufung.

    '
  bedeutung: hoch
  volltext_url: null
  zusammenfassung_url: https://legalblogs.wolterskluwer.com/copyright-blog/beijing-internet-court-grants-copyright-to-ai-generated-image-for-the-first-time/
  bezug_regelwerke:
  - cn-urhg
  - cn-genai-interim-measures
  instanzenzug: []
  quelle_tracker: China Justice Observer; Kluwer Copyright Blog (Wang/Zhang, 02.02.2024); Legal 500 Country
    Comparative Guide — China, Artificial Intelligence
  verifiziert: true
  letzte_pruefung: &id001 2026-09-05
  eigene_bewertung: 'Die weltweit meistzitierte und zugleich am häufigsten falsch wiedergegebene KI-Entscheidung.
    Sie ist KEINE Aussage darüber, dass KI-Erzeugnisse generell schutzfähig wären. Sie ist eine Einzelfallentscheidung
    über eine sehr intensiv gesteuerte Erzeugung. Die Zahl "150 Prompts" wird in der Literatur als Schwelle
    behandelt — das gibt das Urteil nicht her; das Gericht nennt sie als Indiz für Intensität, nicht als
    Tatbestandsmerkmal. Dogmatisch ist der interessante Schritt, dass das Gericht die schöpferische Leistung
    nicht im Ergebnis, sondern im Steuerungsprozess verortet. Genau daran setzt die spätere Gegenlinie
    (Suzhou, Yangzhou) an: sie verlangt Beweis dieses Prozesses. Für die europäische Diskussion ist die
    Entscheidung deshalb weniger als Ergebnis interessant denn als Beweislastproblem — wer den "Prozess"
    nicht dokumentiert, verliert. Wer die Entscheidung gegen die EuGH-Rechtsprechung zur eigenen geistigen
    Schöpfung (Painer, Infopaq) hält, wird feststellen, dass die Kriterien fast deckungsgleich sind; unterschiedlich
    ist nur die Bereitschaft, sie auf einen Prompting-Vorgang anzuwenden.

    '
  sekundaerquelle_url: https://www.chinajusticeobserver.com/a/landmark-ruling-china%27s-court-upholds-copyright-for-ai-generated-images
  pruefvermerk:
  - 'Am Urteilstext geprüft (05.09.2026): Gericht 北京互联网法院, Aktenzeichen (2023)京0491民初11279号, Urteilsdatum
    二〇二三年十一月二十七日 = 27.11.2023, Parteien 原告李 / 被告刘 — alle Angaben des Eintrags bestätigt. Spruchkörper:
    审判长朱阁, 审判员颜君, 审判员李婉星.'
  - 'Neu belegt: Der zuvor als unbestätigt vermerkte Schadensersatz von 500 RMB steht so im Tenor (Ziffer
    2); der Kläger hatte 5.000 RMB verlangt. Der Tenor stützt sich auf Art. 10 Abs. 1 Nr. 2 und Nr. 12,
    Art. 53 und Art. 54 UrhG-China.'
  - 'Quelle ist die Volltextabschrift in der chinesischen Wikisource (维基文库), nicht das amtliche Register:
    wenshu.court.gov.cn verlangt seit dem Umbau ein Nutzerkonto mit chinesischer Mobilnummer, ebenso 人民法院案例库
    (rmfyalk.court.gov.cn) und pkulaw.com. Deshalb quelle_art ''datenbank'' und nicht ''amtlich''.'
  - 'Für den amtlichen Beleg von Hand: https://wenshu.court.gov.cn/ nach Anmeldung, Suchfeld 案号, Eingabe
    (2023)京0491民初11279号.'
