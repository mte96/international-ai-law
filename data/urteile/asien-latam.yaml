  quelle_tracker: LiveLaw, 22.08.2026
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die wichtigste indische Entscheidung des Jahres neben ANI. Nach drei Jahren immer
    weiter ausgreifender Verfügungen zieht der Delhi High Court die Bremse und formuliert erstmals die
    Gegenrechte. Die Argumentation ist erkennbar an europäischen Abwägungsmustern orientiert und lässt
    sich unmittelbar auf § 23 Abs. 1 Nr. 4 KUG und die Kunstfreiheit übertragen. Wer die indische Linie
    zitiert, muss diese Entscheidung mitzitieren, sonst zitiert er einen überholten Stand. Zu beachten:
    Das Verfahren betraf auch KI-generierte Identitätsvortäuschung; die zusammenfassende Berichterstattung
    erwähnt KI nicht ausdrücklich in den tragenden Gründen.

    '
  sekundaerquelle_url: https://www.livelaw.in/high-court/delhi-high-court/personality-rights-cant-extinguish-caricature-lampooning-parody-unless-commercial-exploitation-546926
