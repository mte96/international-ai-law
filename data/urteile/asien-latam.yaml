  anspruchsgrundlage: Persönlichkeitsrecht und publicity rights nach indischem Common Law; Art. 19 Abs.
    1 lit. a Verfassung (Meinungsfreiheit)
  kernfrage: 'Wo verläuft die Grenze zwischen dem Schutz der Persönlichkeit vor KI-gestützter Nachahmung
    und der Freiheit von Parodie, Karikatur und kritischer Berichterstattung?

    '
  ergebnis: 'Justice Anup Jairam Bhambhani gewährte einstweiligen Rechtsschutz nur gegen sexualisierte
    Darstellungen, gegen die monetarisierte Nutzung der Persona ohne Erlaubnis und gegen Identitätsvortäuschung.
    Nicht untersagt wurden Parodie, Karikatur und Verspottung ohne kommerzielle Ausbeutung sowie tatsachenbasierte
    Kritik an Fehlverhalten. Tragend ist der Satz, Persönlichkeitsrechte dürften weder eingesetzt werden,
    um die Verbreitung von Informationen über Fehlverhalten zu verhindern, noch um eine ganze Ausdrucksgattung
    auszulöschen. Ein pauschaler Takedown-Befehl wurde abgelehnt. In einem gleichzeitig entschiedenen
    Verfahren (Janhvi Kapoor) lehnte das Gericht ebenfalls einen Blanko-Takedown ab und ordnete nur die
    Entfernung vulgärer Inhalte an.

    '
  bedeutung: hoch
  volltext_url: https://indiankanoon.org/doc/27678781/
  zusammenfassung_url: https://www.livelaw.in/high-court/delhi-high-court/janhvi-kapoor-personality-rights-remove-vulgar-content-no-blanket-takedown-546932
