  verifiziert: false
  letzte_pruefung: *id001
  eigene_bewertung: 'Die wichtigste chinesische Entscheidung, die im Westen praktisch nicht rezipiert
    wird. Sie zerstört die verbreitete Erzählung, China schütze KI-Ausgaben großzügig. Tatsächlich hat
    die zweite Instanz die Idee-Ausdruck-Dichotomie gegen das Prompting in Stellung gebracht: der Prompt
    ist die Idee, das Bild ist der Ausdruck, und dazwischen steht das Modell — nicht der Mensch. Das ist
    exakt das Argument, mit dem das US Copyright Office und der D.C. Circuit in Thaler operieren, nur
    ohne die dortige Human-Authorship-Rhetorik. Praktisch führt es zu einer Dokumentationsobliegenheit:
    wer Schutz will, muss den Erzeugungsvorgang protokollieren. Für Mandanten mit Design-Pipelines in
    China ist das die operativ wichtigste Aussage der gesamten Datei.

    '
  pruefvermerk:
  - Nicht am Primärdokument geprüft — das amtliche Register wenshu.court.gov.cn verlangt ein Nutzerkonto
    mit chinesischer Mobilnummer; ebenso 人民法院案例库 und pkulaw.com.
  - Platzhalterdatum 2025-01-01 entfernt (datum jetzt leer), weil es erfunden war.
  - Zwei voneinander unabhängige chinesischsprachige Sekundärquellen (zhuanli7.com, zhihu.com) sowie ein
    koreanischer Fachbericht (irobotnews.com, 08.05.2025) nennen übereinstimmend den 17.04.2025 als Datum
    von (2025)苏05民终4840号. Dieses Datum ist NICHT übernommen worden, weil es nicht am Dokument geprüft
    ist.
  - 'WICHTIGER BEFUND, unbestätigt am Dokument: Dieselben Quellen bezeichnen (2025)苏05民终4840号 übereinstimmend
    als 民事裁定书, also als Beschluss, nicht als Urteil, und nennen als erstinstanzliche Entscheidung (2024)苏0582民初9015号民事判决书
    des 张家港市人民法院 (Volksgericht Zhangjiagang) vom 17.03.2025 — nicht des von der bisherigen Quelle angenommenen
    Gerichts. Trifft das zu, steht die inhaltliche Begründung im erstinstanzlichen Urteil, und die Berufungsinstanz
    hat nur prozessual entschieden. Das Ergebnisfeld, das dem Berufungsgericht die materielle Begründung
    zuschreibt, wäre dann falsch. Vor einer Veröffentlichung zwingend am Dokument zu klären.'
  - 'Für den Beleg von Hand: https://wenshu.court.gov.cn/ nach Anmeldung, 案号 (2025)苏05民终4840号 und (2024)苏0582民初9015号.'
