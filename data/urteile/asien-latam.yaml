  eigene_bewertung: 'Wichtig nur als Beleg, dass die Pekinger Linie außerhalb Pekings aufgegriffen wurde
    — und als Vorstufe zu der Berufungsentscheidung aus Suzhou, die genau diese Linie korrigiert hat.
    Ob es sich um dasselbe Verfahren handelt, das in (2025) 苏05民终4840号 fortgeführt wurde, ist aus den
    zugänglichen Quellen nicht sicher zu beantworten: Changshu liegt im Bezirk Suzhou, der Instanzenzug
    wäre also stimmig, die Aktenzeichen belegen ihn aber nicht. Vor Zitierung im Original prüfen.

    '
