  datum: 2021-04-28
  parteien:
    klaeger: PIPC (von Amts wegen)
    beklagter: ScatterLab Inc. (스캐터랩), Betreiberin des Chatbots 이루다 (Iruda / "Lee Luda")
  status: rechtskraeftig
  themenachsen:
