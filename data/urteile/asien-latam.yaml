  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Die einzige Aufsichtsmaßnahme weltweit, die das KI-Training eines Großkonzerns tatsächlich
    gestoppt hat — die irische DPC hat gegenüber Meta und X mit Zusagen gearbeitet, die italienische Garante
    gegen OpenAI mit einer Sperre, die aber den Dienst und nicht das Training betraf. Der dogmatische
    Kern ist die Auslegung des "legítimo interesse" nach Art. 10 LGPD, der dem Art. 6 Abs. 1 lit. f DSGVO
    nachgebildet ist. Die ANPD hat dabei zwei Argumente entwickelt, die in Europa erst später auftauchten:
    die besondere Schutzbedürftigkeit von Minderjährigendaten in Trainingskorpora und die Unzulänglichkeit
    eines Opt-out, das über eine mehrstufige Menüführung versteckt ist. Die spätere Aufhebung nach Zusagen
    ist der eigentlich interessante Teil: Sie zeigt, dass die Behörde nicht das Training als solches,
    sondern seine Ausgestaltung angegriffen hat. Verfahrensnummer beschaffen.

    '
