    zu den Therapien; sie erhob dafür Tutela. Über die Berufung entschied ein Juzgado del Circuito. Dieses
    Gericht befragte ChatGPT 3.5 — unter anderem mit der Frage, ob autistische Minderjährige von Zuzahlungen
    befreit seien — und übernahm die Antworten in den schriftlichen Entscheidungstext. Die Sache gelangte
