  kernfrage: 'Begründen geschäftliche Entscheidungen eines KI-Modells beziehungsweise dessen Parameter
    und Präferenzen, die einem Dritten wirtschaftlichen Schaden zufügen, einen Anspruch gegen den Entwickler?

    '
  ergebnis: 'Das Gericht verneinte einen Anspruch dem Grunde nach: Gutgläubige geschäftliche Entscheidungen
    von KI-Plattformen beziehungsweise die Parameter und Präferenzen von KI-Modellen begründen keinen
    Klagegrund gegen den Entwickler, auch wenn sie wirtschaftlichen Schaden verursachen — es sei denn,
    der Betroffene weist die Verletzung erworbener Rechte nach, etwa von Immaterialgüter- oder Vertragsrechten.
    Datum und Aktenzeichen ließen sich nicht ermitteln.

    '
