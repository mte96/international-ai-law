  anspruchsgrundlage: Sections 14, 51 Copyright Act 1957; Section 52(1)(a) Copyright Act 1957 (fair dealing
    für private or personal use, including research); Section 62(2) Copyright Act; Section 20 Code of
    Civil Procedure
  kernfrage: 'Ist die Speicherung und Nutzung urheberrechtlich geschützter Nachrichtentexte zum Training
    eines Large Language Model "fair dealing" im Sinne des Section 52(1)(a) Copyright Act 1957, und erstreckt
    sich die Zuständigkeit indischer Gerichte auf ein Training, das ausschließlich auf US-Servern stattgefunden
    hat?

    '
  ergebnis: 'Justice Amit Bansal wies den Antrag auf einstweilige Verfügung ab (Rn. 134). Vier tragende
    Aussagen. Erstens Zuständigkeit (Rn. 51, 52, 55): Sie ist gegeben, weil ANI ihren Hauptsitz in Delhi
    hat (Sec. 62(2) Copyright Act) und OpenAI indische Nutzer gezielt anspricht. Die Speicherung auf US-Servern
    sei "der letzte Schritt einer Kette von Ereignissen, die mit dem Zugriff auf geschützte Werke aus
    Indien beginnt"; unter Berufung auf Neetu Singh ./. Telegram könne die Wahl des Serverstandorts Rechteinhaber
    nicht rechtlos stellen. Zweitens Training als Forschung (Rn. 115): "the training of LLMs by Open AI
    would constitute ''research'' within the meaning of Section 52(1)(a) … The advancement of artificial
    intelligence technology through training of LLMs is research activity of significant public interest."
    Drittens Schranke (Rn. 128, 129): "the storage and use of ANI''s copyrighted literary works by Open
    AI for the purpose of training its LLM underlying ChatGPT would qualify as ''fair dealing'' under
    Section 52(1)(a)"; die Nutzung sei auf das Training beschränkt, diene dem öffentlichen Interesse und
    führe zu keinem tatsächlichen oder potenziellen Schaden bei ANI. Viertens Ausgaben (Rn. 78, 82, 102,
    106, 111): Alle neun von ANI vorgelegten Beispielartikel stammten aus August und September 2024, das
    Training war im April 2024 beendet — Memorisierung sei damit ausgeschlossen; die Antworten beruhten
    ersichtlich auf Retrieval-Augmented Generation, also auf Live-Abruf. Substanzielle Übernahme sei nicht
    dargetan, ChatGPT füge eigene, "quite dissimilar" Kommentierung hinzu; Memorisierung trete nach der
    technischen Literatur nur in etwa 0,03 % der Fälle und nur bei adversarialem Prompting auf. Der Anspruch
    auf öffentliche Wiedergabe scheiterte mangels substanzieller Vervielfältigung (Rn. 97). Vorbehalten
    für die Hauptsache bleiben Memorisierung und substanzielle Übernahme in den Ausgaben. Urteil vorbehalten
    am 27.03.2026, verkündet am 24.07.2026.

    '
