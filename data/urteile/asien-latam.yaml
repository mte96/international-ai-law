  eigene_bewertung: 'Die Fortschreibung von T-323/24 und ihr praktischer Prüfstein. Das Verfassungsgericht
    hatte 2024 gesagt: KI darf ergänzen, nicht ersetzen, und muss offengelegt und verifiziert werden.
    Sechzehn Monate später hat ein Strafrichter genau dagegen verstoßen, und die Rechtsfolge ist die vollständige
    Nichtigkeit — nicht nur eine Rüge. Damit hat Kolumbien als erste Rechtsordnung der Welt die Verifikationspflicht
    mit einer Kassationsfolge bewehrt. Für die deutsche Diskussion ist das der entscheidende Punkt: Die
    Frage ist nicht, ob Richter KI benutzen dürfen, sondern welche Fehlerfolge die Verletzung der Prüfpflicht
    hat. § 547 Nr. 6 ZPO (fehlende Entscheidungsgründe) und § 338 Nr. 7 StPO bieten dafür in Deutschland
    einen Anknüpfungspunkt, der bislang nicht diskutiert wird.

    '
