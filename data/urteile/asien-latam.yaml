  quelle_tracker: Amtliche Beschlusssammlung der 개인정보보호위원회 (pipc.go.kr), Beschluss 제2021-007-072호
  verifiziert: true
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Weltweit die erste Aufsichtsentscheidung gegen ein KI-Sprachmodell wegen der Herkunft
    seiner Trainingsdaten — zweieinhalb Jahre vor der italienischen Garante-Verfügung gegen OpenAI und
    vier Jahre vor den europäischen Meta-Verfahren. Der dogmatische Kern ist die Zweckbindung: Daten,
    die für einen Chat-Analysedienst erhoben wurden, dürfen nicht ohne weiteres zum Modelltraining verwendet
    werden. Das ist exakt das Argument, mit dem die ANPD in Brasilien 2024 gegen Meta vorgegangen ist
    und mit dem die irische DPC gegen X und Meta operiert hat. Wer die internationale Genealogie der Trainingsdaten-Aufsicht
    darstellt, muss hier beginnen — und wird feststellen, dass die europäische Diskussion ein koreanisches
    Vorbild ignoriert hat. Der Eintrag ist unverifiziert; das ist ärgerlich, weil er wichtig ist.

    '
  pruefvermerk:
  - 'Teilweise an einer Fachquelle bestätigt (Future of Privacy Forum): Die PIPC entschied am 28.04.2021;
    die Sanktion belief sich auf ''KRW 103.3 million (USD 92,900)''. Datum und Betrag des Eintrags treffen
    damit zu.'
  - 'NICHT AM PRIMÄRDOKUMENT GEPRÜFT: Die PIPC-Website (pipc.go.kr) wurde nicht erreicht; eine amtliche
    Beschlussnummer ließ sich nicht ermitteln. Das Feld aktenzeichen bleibt ''nicht ermittelt''.'
  - Ebenfalls ungeprüft blieben die Einzelheiten des Ergebnisfelds (9,4 Mrd. KakaoTalk-Nachrichten, unzureichende
    Anonymisierung, Daten Minderjähriger); der im Eintrag stehende Warnhinweis auf Modellwissen bleibt
    berechtigt.
  - Amtliche Entscheidungssammlung der 개인정보보호위원회 (PIPC), Rubrik 심의·의결 > 위원회 결정문.
  - 'Seite geöffnet: Beschlussnummer 제2021-007-072호, Beschlussdatum 2021.04.28, Adressat 주식회사 스캐터랩 — Behörde,
    Datum und Betroffene stimmen mit dem Eintrag überein.'
  - 'Inhalt bestätigt: Abhilfemaßnahmen, Bußgelder von 55,5 Mio. KRW und Zwangsgeld/Geldbuße von 47,8
    Mio. KRW (zusammen rund 103,3 Mio. KRW).'
  - Der bisherige Link war leer (null).
  - 'AM PRIMÄRDOKUMENT GEPRÜFT (05.09.2026, amtliche Beschlusssammlung der PIPC): 의결번호 제2021-007-072호,
    의결일 2021.04.28, 피심인 주식회사 스캐터랩, 사건번호 2021조이0013. Behörde, Datum und Betroffene stimmen mit dem Eintrag
    überein.'
  - 'Sanktionen am Dokument belegt: 과징금 55.500.000 KRW und 과태료 47.800.000 KRW, zusammen 103.300.000 KRW.
    Die im Eintrag geführte Gesamtsumme trifft zu.'
  - 'KORREKTUR AKTENZEICHEN: Das Feld enthielt den Redaktionsvermerk ''제2021-007-072호 — im Eintrag nicht
    ermittelt.'' Es führt jetzt Beschlussnummer und Verfahrensnummer (사건번호 2021조이0013).'
  - 'ERGEBNISFELD BEREINIGT: Der Warnhinweis, die Angaben beruhten auf Modellwissen, ist gegenstandslos
    geworden und wurde entfernt. Die Zahl von rund 9,4 Mrd. verarbeiteten KakaoTalk-Nachrichten ist im
    Beschluss selbst nicht nachgewiesen und deshalb im Ergebnisfeld nicht mehr behauptet.'
