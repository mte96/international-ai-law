  quelle_tracker: Yuasa & Hara (Aktenzeichen der Vorinstanzen), Zaikei Shimbun (06.07.2026) und Fachanalyse
    yorozuipsc.com zum Nichtannahmebeschluss
  verifiziert: false
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Japan ist damit nach dem Vereinigten Königreich die zweite Rechtsordnung, in der
    die Frage der Erfindereigenschaft von KI letztinstanzlich abgeschlossen ist — aber der Unterschied
    zum britischen Fall ist erheblich und wird regelmäßig eingeebnet: Der UK Supreme Court hat in Thaler
    v Comptroller-General begründet entschieden, der japanische Oberste Gerichtshof hat lediglich die
    Annahme verweigert. Ein 上告不受理決定 trägt keine eigene Begründung; die maßgebliche japanische Entscheidung
    ist deshalb weiterhin das Urteil des IP High Court vom 30.01.2025. Wer Japan zitiert, zitiert richtigerweise
    diese Instanz.

    Für die vergleichende Argumentation ist die weltweite Einstimmigkeit inzwischen das Hauptargument:
    UK, USA, Japan, Australien (Full Court), Korea (Instanz), Taiwan, Israel, Indien, China (CNIPA) und
    das EPA sagen dasselbe. Eine Divergenz existiert nur noch historisch (Südafrika als reines Registrierungssystem,
    Australien für neun Monate 2021/22). Beachtlich ist der zweite, in Europa kaum rezipierte Zug beider
    japanischer Instanzen: Sie verweisen die Frage ausdrücklich an den Gesetzgeber, statt sie über die
    Auslegung des Erfinderbegriffs endgültig zu schließen.

    '
  pruefvermerk:
  - 'Teilweise bestätigt am Legal 500 Country Comparative Guide Japan: Der Oberste Gerichtshof wies das
    Rechtsmittel am 04.03.2026 zurück; Erfinder im Sinne des japanischen Patentgesetzes können nur natürliche
    Personen sein. Das Datum des Eintrags trifft damit zu.'
  - 'Instanzenzug ergänzt und belegbar: Tokyo District Court, Urteil vom 16.05.2024 (''the term "inventor"
    under the Patent Act is limited to natural persons, and that any legal framework of the AI invention
    should be addressed through the legislative process''); Intellectual Property High Court, Urteil vom
    30.01.2025, Berufung zurückgewiesen.'
  - 'NICHT AM PRIMÄRDOKUMENT GEPRÜFT: Ein Aktenzeichen (令和…年（行ヒ）第…号) ließ sich nicht ermitteln; courts.go.jp
    wurde nicht automatisiert erreicht. Ohne Aktenzeichen bleibt der Eintrag nicht zitierfähig.'
  - 'Warnung zur Quelle: Legal 500 ist eine Kanzleiquelle zweiter Hand ohne Aktenzeichen.'
  - 'Amtliche Fundstelle nicht auffindbar: Der Oberste Gerichtshof hat die Revision am 04.03.2026 durch
    上告不受理決定 (Nichtannahmebeschluss) erledigt. Solche Beschlüsse werden in Japan regelmäßig NICHT in die
    amtliche Rechtsprechungsdatenbank (裁判例検'
  - 'KORREKTUR ERGEBNIS (05.09.2026): Der Eintrag beschrieb eine höchstrichterliche Sachentscheidung (''wies
    das Rechtsmittel zurück und bestätigte damit endgültig''). Tatsächlich handelt es sich um einen 上告不受理決定
    — einen Beschluss, das Rechtsmittel nicht anzunehmen. Er ergeht ohne eigene Begründung; die Gründe
    sind nicht veröffentlicht.'
  - 'Ergänzt: Spruchkörper war das 第二小法廷 (Zweiter Kleiner Senat). Das Datum 04.03.2026 wird von zwei unabhängigen
    Fachquellen genannt.'
  - 'AKTENZEICHEN DER VORINSTANZEN ERMITTELT: Tokyo District Court, Urteil vom 16.05.2024, 令和5年(行ウ)第5001号;
    Intellectual Property High Court, Urteil vom 30.01.2025, 令和6年(行コ)第10006号. Ein Aktenzeichen des Obersten
    Gerichtshofs ist nicht veröffentlicht und wird hier nicht erfunden.'
  - 'AMTLICHE FUNDSTELLE NICHT AUFFINDBAR: Der Beschluss ist in der Entscheidungssammlung des Obersten
    Gerichtshofs (courts.go.jp/app/hanrei_jp/search1) nicht nachgewiesen; auch die Fachanalyse hält fest,
    der 決定書本文 sei auf der Gerichtswebsite nicht auffindbar. quelle_art von ''fehlt'' unverändert; verifiziert
    bleibt false.'
