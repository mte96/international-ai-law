  anspruchsgrundlage: Contempt of Courts Act 1971; berufsrechtliche Sorgfaltspflichten der Prozessvertreter
  kernfrage: 'Welche Folgen hat es, wenn sich eine gerichtliche Entscheidung auf nicht existierende, von
    einem KI-System erfundene Urteile stützt?

    '
  ergebnis: 'Der Supreme Court stellte fest, dass Entscheidungen, die sich auf nicht existierende, KI-generierte
    Scheinurteile stützen, ein Fehlverhalten mit rechtlichen Folgen darstellen. In einem Parallelfall
    verhängte der Bombay High Court in Deepak Shivkumar Bahry ./. Heart & Soul Entertainment Ltd. (Writ
    Petition 8390 of 2009) 50.000 INR gegen den Einreicher eines nicht existierenden KI-generierten Urteils
    und missbilligte die Praxis ausdrücklich. Das genaue Entscheidungsdatum ergibt sich aus den zugänglichen
    Quellen nicht.

    '
