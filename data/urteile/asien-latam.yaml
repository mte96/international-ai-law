  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die weltweit erste verfassungsgerichtliche Entscheidung zum KI-Einsatz durch Richter
    und der einzige Fall dieser Datei, dessen Volltext vollständig aus der Primärquelle geprüft werden
    konnte. Ihr Wert liegt nicht im Ergebnis — die Duldung des ChatGPT-Einsatzes ist rechtspolitisch angreifbar
    —, sondern im Kriterienkatalog. Er ist das ausführlichste richterrechtliche Regelwerk zum Justiz-KI-Einsatz
    weltweit und älter als sämtliche europäischen Practice Directions, älter als die CNJ-Resolution 615/2025
    in Brasilien und älter als die Entwürfe des indischen Supreme Court. Wer für deutsche Gerichte oder
    für die Justizverwaltung Leitlinien entwirft, findet hier die vollständige Systematik. Ein Punkt wird
    dabei regelmäßig falsch berichtet: Das Gericht hat den KI-Einsatz NICHT gebilligt, sondern die Grundrechtsverletzung
    verneint und gleichzeitig festgestellt, dass Transparenz und Verantwortung verletzt wurden — eine
    Rüge ohne Kassation. Genau diese Zurückhaltung hat Kolumbien ein Jahr später eingeholt (siehe co-2025-tribunal-bogota).

    '
