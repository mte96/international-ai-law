    ist. Das indische Patentamt wies die DABUS-Anmeldung zurück, weil nur natürliche Personen Erfinder
    sein können. Der Delhi High Court gab dem Copyright Office in einem Verfahren Thalers auf, binnen
    acht Wochen zu entscheiden, und bezeichnete die Frage als komplex und im Fluss.

