  eigene_bewertung: 'Bis heute die einzige veröffentlichte Entscheidung Singapurs mit KI-Bezug und die
    weltweit meistzitierte Entscheidung zum algorithmischen Vertragsschluss. Ihre Grenze benennt sie selbst:
    Sie gilt für DETERMINISTISCHE Algorithmen. Für nichtdeterministische Systeme — also für alles, was
    heute als KI gilt — ist die Zurechnungsfrage weltweit ungelöst. Genau das ist der Grund, weshalb die
    Entscheidung in der Debatte um autonome Agenten permanent zitiert und dabei permanent überdehnt wird.
    Für die deutsche Diskussion um die Willenserklärung bei automatisierten Systemen (§§ 116 ff. BGB analog)
    ist sie der beste vorhandene Vergleichsfall.

    '
