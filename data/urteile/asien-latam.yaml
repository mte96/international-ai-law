  kernfrage: 'Erfassen die Persönlichkeitsrechte einer Person auch ihre Stimme, Sprechweise und Gestik,
    sodass KI-gestütztes Face-Morphing und Deepfake-Werkzeuge untersagt werden können?

    '
  ergebnis: 'Das Gericht dehnte den Schutz über das Lichtbild hinaus auf Name, Bild, Ähnlichkeit, Stimme,
    Sprechweise und Gesten aus und untersagte im Wege der einstweiligen Verfügung die Nutzung KI-gestützter
    Face-Morphing- und Deepfake-Werkzeuge mit der Identität des Klägers. Anerkannt wurde, dass synthetische
    Nachahmung mehrere Verletzungen zugleich bewirkt: kommerzielle Ausbeutung, falsche Empfehlungswirkung
    sowie Würde- und Reputationsschaden. Die Verfügung begründete zugleich praktische Handlungspflichten
    der Plattformen, die die beanstandeten Inhalte vorhielten.

    '
