- id: in-2026-ani-openai
  jurisdiktion: in
  gericht: High Court of Delhi at New Delhi (Original Side)
  instanz: erstinstanzlich
  aktenzeichen: CS(COMM) 1028/2024; I.A. 45300/2024, I.A. 45301/2024 und I.A. 26192/2025 (im Eintrag fehlten
    zwei Anträge)
  ecli: ''
  datum: 2026-07-24
  parteien:
    klaeger: ANI Media Pvt. Ltd.
