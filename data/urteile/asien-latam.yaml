  kernfrage: 'Hat ein KI-gestützt erzeugter digitaler Mensch eigene Urheber- oder Leistungsschutzrechte,
    oder ist er lediglich Werkzeug der dahinterstehenden Schöpfer?

    '
  ergebnis: 'Erste Entscheidung Chinas zur Verletzung von Rechten an einem digitalen Menschen. Die Klägerin
    hatte 2019 Videos mit der hyperrealistischen virtuellen Figur "Ada" veröffentlicht; die Beklagte stellte
    diese 2022 ohne Erlaubnis in ihr TikTok-Konto ein. Das Gericht stellte klar, der digitale Mensch sei
    "nur ein Werkzeug für die Schöpfer" und habe selbst weder Urheber- noch Leistungsschutzrechte. Die
    Videos seien jedoch als audiovisuelle Werke und Kunstwerke geschützt; die Verbreitung verletzte das
    Recht der öffentlichen Zugänglichmachung über Informationsnetze.

    '
