    Inhalte einen Missbrauch der Persönlichkeitsrechte darstellt. In einem am selben Tag entschiedenen
    Parallelverfahren (Abhishek Bachchan ./. The Bollywood Tee Shop, 2025 SCC OnLine Del 5944) stellte
    das Gericht fest, dass unerlaubte KI-generierte Inhalte unter Verwendung von Name und Bildnis den
    Geschäftswert verwässern und Privatheitsrechte verletzen.

    '
