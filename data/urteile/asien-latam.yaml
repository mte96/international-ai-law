  eigene_bewertung: 'Reiht sich in die weltweite Linie zu halluzinierten Fundstellen ein (Ayinde/Al-Haroun
    in England, Mata ./. Avianca in den USA, Dayal in Australien). Bemerkenswert ist allein, dass in Indien
    erstmals nicht ein Anwalt, sondern eine gerichtliche Entscheidung selbst betroffen war — dieselbe
    Konstellation wie in Kolumbien (Tribunal Superior de Bogotá) und Argentinien (Esquel). Das ist der
    eigentliche internationale Trend des Jahres 2026: Nicht die Anwälte, die Gerichte werden zum Problem.

    '
