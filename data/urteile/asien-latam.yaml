    '
  ergebnis: 'Die erste Anmeldung mit dem KI-System RAGHAV als alleinigem Urheber wurde zurückgewiesen.
    Die zweite Anmeldung, die RAGHAV als Miturheber neben Ankit Sahni nannte, wurde im November 2020 zunächst
