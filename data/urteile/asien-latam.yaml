  eigene_bewertung: 'Der Ausgangspunkt der gesamten indischen Linie und international die meistzitierte
    Deepfake-Verfügung außerhalb der USA. Bemerkenswert ist, dass Indien den Schutz ohne gesetzliche Grundlage
    rein richterrechtlich entwickelt hat — es gibt kein indisches Persönlichkeitsrechtsgesetz. Für den
    deutschen Juristen ist die Parallele zum allgemeinen Persönlichkeitsrecht offensichtlich, der Unterschied
    liegt in der Rechtsfolge: Indien arbeitet mit dynamischen John-Doe-Verfügungen gegen unbekannte Beklagte
    und Domain-Sperranordnungen, also mit einem Instrumentarium, das § 1004 BGB in dieser Breite nicht
    kennt.

    '
