  kernfrage: 'Verletzt das gezielte Trainieren eines LoRA-Zusatzmodells auf geschützten Figurenbildern
    und dessen Veröffentlichung auf einer Plattform die Rechte des Rechteinhabers, und haftet die Plattform
    mit?

    '
  ergebnis: 'Erstes Verfahren in Shanghai zur Urheberrechtsverletzung durch ein großes KI-Modell. Der
    Nutzer hatte über zwanzig Bilder der Figur Medusa aus der Serie extrahiert, daraus ein Bildpaket erstellt,
    mit der Funktion "LoRA trainieren" der Plattform zwei Medusa-LoRA-Modelle erzeugt und diese nach Freigabe
    durch die Plattform auf seinem Konto veröffentlicht. Andere Nutzer konnten damit über beliebige Prompts
    Bilder erzeugen, die mit der geschützten Figur identisch oder ihr im Wesentlichen ähnlich waren. Das
    Gericht trennte ausdrücklich zwischen der LoRA-Technik als solcher — deren Bedeutung für die KI-Entwicklung
    es anerkannte — und ihrer konkreten Anwendung auf geschützte Figurenbilder. Der Nutzer wurde zur Unterlassung
    und zu 30.000 RMB Schadensersatz zuzüglich 20.000 RMB Rechtsverfolgungskosten verurteilt. Die Plattform
    haftete nicht: ihr Melde- und Löschverfahren genügte den Anforderungen. Alle weiteren Anträge wurden
    abgewiesen.

    '
