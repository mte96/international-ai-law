  ecli: ''
  datum: 2024-07-02
  parteien:
    klaeger: ANPD (von Amts wegen)
    beklagter: Meta Platforms, Inc. / Meta Plataformas Brasil Ltda.
  status: erledigt
  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  anspruchsgrundlage: Art. 7, 10 (legítimo interesse), Art. 14 (Daten von Kindern und Jugendlichen), Art.
    6 (Zweckbindung, Erforderlichkeit), Art. 52 und 54 Lei Geral de Proteção de Dados Pessoais (LGPD,
    Lei 13.709/2018)
  kernfrage: 'Kann sich ein soziales Netzwerk für die Verwendung der personenbezogenen Daten seiner Nutzer
    zum Training generativer KI-Modelle auf das berechtigte Interesse stützen?

    '
  ergebnis: 'Die ANPD ordnete als vorbeugende Maßnahme (medida preventiva) an, in Brasilien mit sofortiger
    Wirkung sowohl die Anwendung der neuen Datenschutzrichtlinie zur Nutzung personenbezogener Daten für
    das Training generativer KI als auch die Verarbeitung personenbezogener Daten zu diesem Zweck in sämtlichen
    Meta-Produkten auszusetzen — ausdrücklich einschließlich der Daten von Nichtnutzern. Zwangsgeld: 50.000
    BRL je Tag der Zuwiderhandlung. Tragend waren vier Beanstandungen: (1) das berechtigte Interesse nach
    Art. 7 IX LGPD trage die Verarbeitung nicht, erst recht nicht bei sensiblen Daten; (2) die Änderung
    der Datenschutzrichtlinie sei nicht hinreichend transparent gemacht worden; (3) der Widerspruch sei
    durch eine achtstufige Menüführung auf Facebook praktisch entwertet; (4) für Kinder und Jugendliche
    fehlten Schutzvorkehrungen, die Meta in Europa vorgesehen hatte. Die Behörde stützte sich auf die
    Gefahr eines schweren, irreparablen oder schwer wiedergutzumachenden Schadens. Meta beantragte Wiedererwägung;
    die ANPD hielt die Maßnahme aufrecht (Voto nº 19). Nachdem Meta seine Praxis geändert und die Widerspruchsmöglichkeiten
    verstärkt hatte, wurde die Aussetzung wieder aufgehoben.

    '
  bedeutung: hoch
  volltext_url: https://www.gov.br/anpd/pt-br/assuntos/noticias/anpd-determina-suspensao-cautelar-do-tratamento-de-dados-pessoais-para-treinamento-da-ia-da-meta/SEI_0130047_Voto_11.pdf/@@display-file/file
  zusammenfassung_url: ''
