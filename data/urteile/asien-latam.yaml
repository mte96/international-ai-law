  letzte_pruefung: *id001
  eigene_bewertung: 'Der eigentliche Wert dieser Entscheidung liegt nicht im Ergebnis, sondern in der
    Rechtsquelle. Das Gericht hat die Sorgfaltspflichten nicht aus dem Deliktsrecht entwickelt, sondern
    aus einer Verwaltungsvorschrift — den Interimsmaßnahmen für generative KI. Damit wird eine aufsichtsrechtliche
    Regulierung unmittelbar zum Maßstab der zivilrechtlichen Haftung. Genau diese Konstruktion wird in
    Europa mit Blick auf Art. 50 KI-VO diskutiert und dort überwiegend abgelehnt; in China ist sie bereits
    geltendes Richterrecht. Zweiter Punkt: die Ablehnung der Löschung aus den Trainingsdaten ist der stillschweigende
    Kern der Entscheidung. Das Gericht trennt Ausgabenhaftung und Trainingshaftung sauber und lässt Letztere
    ausdrücklich offen. Der niedrige Schadensersatz (10.000 RMB) zeigt, dass die Entscheidung als Verhaltenssteuerung,
    nicht als Sanktion gedacht ist. Das Entscheidungsdatum ist zu prüfen (s. `quellenkonflikte`).

    '
