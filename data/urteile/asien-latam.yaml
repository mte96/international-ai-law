  kernfrage: 'Können mit einem KI-Videowerkzeug erzeugte Kurzfilme urheberrechtlich geschützte Werke sein,
    deren gewerbsmäßige Vervielfältigung eine Straftat darstellt?

    '
  ergebnis: 'Erste strafrechtliche Verurteilung wegen Urheberrechtsverletzung an KI-generierten Inhalten.
    Ein Unternehmen betrieb eine Spielesoftware mit KI-Videowerkzeug, mit der Nutzer durch Eingabe von
    Skripten und Auswahl von Produktionselementen Kurzdramen erzeugen konnten; zwischen Februar und Mai
    2024 entstanden über 1.000 solcher Kurzdramen, die auf Douyin und Kuaishou kostenpflichtig angeboten
    wurden, mit geteilter Rechteinhaberschaft zwischen Nutzern und Unternehmen. Die Angeklagten zeichneten
    die Videos mit Bildschirmaufnahmesoftware ab, speicherten rund 1.716 Dateien in einem Cloudspeicher
    und verkauften Zugangslinks; Erlös rund 2.300 RMB aus etwa 200 Verkäufen. Das Gericht bejahte den
    Werkcharakter: Die von den Nutzern geschaffenen Inhalte zeigten durch "personalisierte Auswahl, Anordnung
    und Gestaltung" — Skripterstellung, Szenenaufbau, Parametereinstellung — eine "substanzielle geistige
    Schöpfungsleistung" und seien trotz Einsatzes des KI-Werkzeugs als audiovisuelle Werke geschützt.
    Strafen: jeweils acht Monate Freiheitsstrafe, ausgesetzt auf ein Jahr und zwei Monate, sowie Geldstrafen
    von 6.000 beziehungsweise 3.000 RMB; Einziehung der Erlöse.

    '
