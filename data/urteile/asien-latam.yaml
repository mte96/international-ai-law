  eigene_bewertung: 'Weltweit der erste dokumentierte Fall, in dem ein Gericht Prompt Injection gegen
    die eigene KI-Infrastruktur festgestellt und sanktioniert hat. Das ist eine neue Fallgruppe — nicht
    der Anwalt, der KI schlecht benutzt, sondern der Anwalt, der die KI des Gerichts angreift. Sobald
    Justizverwaltungen in Europa KI-gestützte Vorprüfungen einsetzen (in Deutschland etwa in den Pilotprojekten
    zur Massenverfahrensbearbeitung), stellt sich dieselbe Frage: Ist das Prozessbetrug, Sabotage oder
    nur unlautere Prozessführung? Brasilien hat als erstes Land eine Antwort. Der Fall ist dringend im
    Original zu beschaffen; die Angaben sind sehr dünn.

    '
