  eigene_bewertung: 'Die international bislang praktisch unbeachtete, aber sachlich wichtigste chinesische
    Entscheidung zum Training. Sie beantwortet genau die Frage, die Getty ./. Stability und die US-Verfahren
    offen lassen: Ist das Feintuning auf geschützten Werken eine eigenständige Verletzungshandlung? Das
    Gericht sagt ja — nicht wegen des Trainings als solchem, sondern weil das trainierte LoRA-Modell verlässlich
    substitutive Ausgaben erzeugt und deshalb funktional wie eine Vervielfältigung wirkt. Das ist die
    Gegenposition zu Mrs Justice Smith in Getty (Modellgewichte sind kein Vervielfältigungsstück). Zwei
    Rechtsordnungen, dieselbe technische Frage, entgegengesetzte Antworten — und die chinesische ist die
    jüngere. Ebenso wichtig ist die Freistellung der Plattform: China wendet auf KI-Plattformen ein Notice-and-Takedown-Regime
    an, obwohl es dafür keine ausdrückliche gesetzliche Grundlage für KI-Dienste gibt.

    '
