  quelle_art: amtlich
  sachverhalt: 'Alakh Pandey ist Gründer der Lernplattform Physics Wallah und als Lehrer im Netz bekannt.
    Im Internet kursierten Inhalte, die seine Persona benutzten: sexualisierte Darstellungen, monetarisierte
    Angebote, die mit seiner Person beworben wurden, und Auftritte, die vorgaben, er selbst zu sein —
    daneben aber auch Parodien, Karikaturen und Verspottungen sowie Kritik an behauptetem Fehlverhalten.
    Anfang August 2026 erhob er vor dem High Court of Delhi Klage gegen unbekannte Beklagte (John Doe)
    und weitere (CS(COMM) 835/2026) und verlangte, sämtliche ihn betreffenden Inhalte pauschal entfernen
    zu lassen. Zur selben Zeit war beim selben Gericht ein gleichgelagertes Verfahren der Schauspielerin
    Janhvi Kapoor anhängig.'
