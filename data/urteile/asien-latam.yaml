  anspruchsgrundlage: Art. 14, 16, 17 der Verfassung Mexikos; Ley de Amparo
  kernfrage: 'Darf ein Gericht KI-Werkzeuge im Verfahren einsetzen, und welche Mindeststandards gelten
    dafür?

    '
  ergebnis: 'Zwei verbindliche Jurisprudencia-Thesen, am 09.01.2026 im Semanario Judicial de la Federación
    veröffentlicht und ab dem 12.01.2026 verbindlich anzuwenden (Punkt 8 des Acuerdo General Plenario
    7/2025 (12a.)).

    (1) Tesis II.2o.C. J/1 K (12a.), Registro 2031639 — "INTELIGENCIA ARTIFICIAL APLICADA EN PROCESOS
    JURISDICCIONALES. CONSTITUYE UNA HERRAMIENTA VÁLIDA PARA CALCULAR EL MONTO DE LAS GARANTÍAS QUE SE
    FIJEN EN LOS JUICIOS DE AMPARO." KI-Werkzeuge dürfen zur Berechnung der im Amparo-Verfahren festzusetzenden
    Sicherheitsleistungen eingesetzt werden; sie ersetzen die richterliche Arbeit nicht, sondern erleichtern
    sie. Tragend: Wertfortschreibung, Zinsanwendung und Fristgewichtung gehören nicht zum Entscheidungskern,
    sondern sind unterstützende Tätigkeiten; der Einsatz verringert Rechenfehler, schafft Nachvollziehbarkeit
    Schritt für Schritt, vereinheitlicht die Beträge und entlastet für die Sachprüfung — im Einklang mit
    dem Begründungsmaßstab des Art. 16 der Verfassung.

    (2) Tesis II.2o.C. J/2 K (12a.), Registro 2031640 — "INTELIGENCIA ARTIFICIAL APLICADA EN PROCESOS
    JURISDICCIONALES. ELEMENTOS MÍNIMOS QUE DEBEN OBSERVARSE PARA SU USO ÉTICO Y RESPONSABLE CON PERSPECTIVA
    DE DERECHOS HUMANOS." Vier Mindestelemente: a) Verhältnismäßigkeit und Unschädlichkeit (proporcionalidad
    e inocuidad) — Einsatz nur im erforderlichen Maß und für einen legitimen Zweck, etwa für numerische
    Überlegungen, ausdrücklich NICHT für die Auslegung oder Anwendung von Normen; b) Schutz der personenbezogenen
    Daten der Gerichtsakte; c) Transparenz und Erklärbarkeit — der Richter muss den Einsatz nicht nur
    offenlegen, sondern Methodik, verwendete Daten und Weg zum Ergebnis darlegen, damit das Verfahren
    von den Parteien und den Rechtsmittelgerichten geprüft werden kann; d) menschliche Aufsicht und Entscheidung
    — die Technik wirkt als Gehilfin, nicht als Ersatz. Begründet wird dies mit einem Gebot richterlicher
    Selbstbeschränkung (autocontención) mangels spezialgesetzlicher Regelung; ausdrücklich herangezogen
    werden die Ethik-Leitlinien der Hochrangigen Expertengruppe der Europäischen Kommission, die KI-Verordnung
    der EU und die UNESCO-Empfehlung zur Ethik der KI.

    Beide Thesen sind Jurisprudencia por reiteración aus fünf einstimmigen Entscheidungen desselben Spruchkörpers:
    Queja 212/2025 (29.07.2025, Ponente Juan Jaime González Varas), Queja 404/2025 (24.10.2025), Incidente
    de suspensión (revisión) 359/2025 (06.11.2025), 189/2025 und 253/2025 (beide 19.11.2025).

    '
