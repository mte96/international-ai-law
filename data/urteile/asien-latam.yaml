  kernfrage: 'Kann ein KI-System Erfinder sein? Höchstrichterliche Klärung.

    '
  ergebnis: 'Der Oberste Gerichtshof (Zweiter Kleiner Senat) beschloss am 04.03.2026, das Rechtsmittel
    NICHT ANZUNEHMEN (上告不受理決定). Es handelt sich damit nicht um eine Sachentscheidung mit eigener Begründung,
    sondern um eine Nichtannahme, die das Urteil des Gerichts für geistiges Eigentum (知的財産高等裁判所) vom 30.01.2025,
    Az. 令和6年(行コ)第10006号, rechtskräftig werden lässt. Die Gründe des Beschlusses sind nicht veröffentlicht.
    In der Sache bleibt es damit bei der Feststellung der Vorinstanzen — Tokyo District Court, 16.05.2024,
    Az. 令和5年(行ウ)第5001号, und IP High Court, 30.01.2025 —, dass nach geltendem japanischem Patentrecht nur
    natürliche Personen Erfinder sein können; beide Instanzen haben die Frage ausdrücklich dem Gesetzgeber
    zugewiesen.

    '
  bedeutung: hoch
  volltext_url: null
  zusammenfassung_url: ''
