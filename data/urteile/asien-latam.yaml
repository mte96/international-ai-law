  kernfrage: 'Erstreckt sich der zivilrechtliche Persönlichkeitsschutz der Stimme auf eine KI-synthetisierte
    Stimme, die aus rechtmäßig erworbenen Aufnahmen erzeugt wurde, und genügt die Übertragung der Rechte
    an den Tonaufnahmen für die Erzeugung eines Stimmmodells?

    '
  ergebnis: 'Erste Entscheidung Chinas zur KI-synthetisierten Stimme. Die Stimme einer Sprecherin war
    ohne ihre Zustimmung zu einem Text-to-Speech-Produkt verarbeitet und vertrieben worden. Das Gericht
    bejahte die Verletzung des Stimmrechts: Maßgeblich ist die Erkennbarkeit — bleibt die synthetisierte
    Stimme in Klangfarbe und Sprechweise mit der Ausgangsstimme hochgradig konsistent, unterfällt sie
    dem Persönlichkeitsschutz. Die Inhaberschaft an den Tonaufnahmen begründet für sich genommen KEINE
    Befugnis, daraus ohne gesonderte Einwilligung ein KI-Stimmmodell zu erzeugen und zu verwerten. Schadensersatz
    nach der zugänglichen Berichterstattung 250.000 RMB nebst Entschuldigung. Der Oberste Volksgerichtshof
    nahm den Fall am 12.06.2025 in eine Sammlung von sechs typischen Fällen zum Persönlichkeitsrechtsschutz
    bei Missbrauch von Internet- und Informationstechnologie auf.

    '
