  instanz: revision
  aktenzeichen: עע"מ 63194-08-25 (Verwaltungsrechtlicher Berufungsfall)
  ecli: ''
  datum: 2026-03-22
  parteien:
    klaeger: Nevo Ben Cohen, ein Schüler der Sonderpädagogik, vertreten durch seinen Vater
    beklagter: Stadtverwaltung Ramat Gan (עיריית רמת גן) und Bildungsministerium Israels
  status: rechtskraeftig
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  anspruchsgrundlage: Verwaltungsrechtliche Grundsätze der Ermessensausübung und des Verbots der Ermessensbindung
    an Dritte; Verhältnismäßigkeit
  kernfrage: 'Darf eine Behörde ihre Entscheidung auf die Ausgabe eines generativen KI-Systems stützen,
    ohne diese eigenständig zu prüfen, und welche Folgen hat es, wenn die Begründung erfundene Rundschreiben
    und erfundene Gerichtszitate enthält?

    '
  ergebnis: 'Der Oberste Gerichtshof gab dem Rechtsmittel statt und erlegte der Stadtverwaltung Ramat
    Gan Kosten von 30.000 NIS auf. Sachverhalt: Die Stadt hatte einem Schüler der Sonderpädagogik die
    Schülerbeförderung von der Adresse des Vaters aus verweigert und sich dabei auf ein Rundschreiben
    des Bildungsministeriums berufen, das es nicht gibt; die Begründung enthielt außerdem Zitate aus Gerichtsentscheidungen,
    die sich als erfunden erwiesen. Das Gericht sah darin mit hoher Wahrscheinlichkeit den Einsatz unbeaufsichtigter
    generativer KI in amtlicher Korrespondenz.

    Tragende Rechtssätze: (1) Die Sorgfalts-, Transparenz- und Redlichkeitspflichten der Verwaltung sind
    gesteigert, wenn sie dem Bürger unmittelbar gegenübertritt; sie steigern sich weiter, wenn die Begründung
    von einem System erzeugt wird, dessen Angaben der Bürger nicht ohne Weiteres überprüfen kann. (2)
    Zu unterscheiden ist zwischen zulässiger KI-Unterstützung mit menschlicher Verifikation und unzulässigem
    ungeprüftem Übernehmen der Ausgabe. (3) Das Machtgefälle ist maßgeblich: Dem Bürger fehlen Mittel
    und Anlass, erfundene Fundstellen in einem Behördenbescheid zu erkennen — gerade deshalb wiegt das
    Verhalten schwer. (4) Behörden, die KI einsetzen, müssen vor jeder den Bürger betreffenden Entscheidung
    eine wirkliche menschliche Prüfung sicherstellen.

    '
  bedeutung: hoch
  volltext_url: https://supremedecisions.court.gov.il/Home/Download?path=NetVerdicts/2026/3/22/2025-8-63194-8-2&fileName=ca9f017678224cff8112b3cc1b864595&type=4
  zusammenfassung_url: ''
  bezug_regelwerke: []
  instanzenzug: []
  quelle_tracker: Amtliche Entscheidungssammlung des Obersten Gerichtshofs (supremedecisions.court.gov.il),
    NetVerdicts 2026/3/22; Volltextspiegel bei law.co.il
  verifiziert: true
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Die für europäische Juristen anschlussfähigste Entscheidung außerhalb Europas — und
    nach der Klärung ihrer Fundstelle auch belastbar zitierfähig. Sie formuliert für das Verwaltungsverfahren
    genau das, was Art. 22 DSGVO und Art. 14 KI-VO für automatisierte Entscheidungen verlangen — Verbot
    der Ermessensdelegation, Pflicht zur eigenständigen Prüfung —, und zwar ohne jede spezialgesetzliche
    Grundlage, allein aus allgemeinem Verwaltungsrecht. Damit steht sie in einer Linie mit dem niederländischen
    SyRI-Urteil, dem österreichischen AMS-Algorithmus-Verfahren und der australischen Robodebt-Aufarbeitung.

    Der eigentliche Ertrag liegt aber woanders und ist neu: Es ist die erste höchstrichterliche Entscheidung,
    die die Halluzination eines Modells nicht im Anwaltsschriftsatz, sondern im BEHÖRDENBESCHEID behandelt.
    Die gesamte bisherige Kasuistik — Mata, Ayinde, Mavundla, die kolumbianischen und argentinischen Fälle
    — betrifft Prozessvertreter und Richter. Hier trifft es die Eingriffsverwaltung gegenüber einem Schüler
    der Sonderpädagogik, und das Gericht macht das Machtgefälle ausdrücklich zum tragenden Grund: Wer
    einen Bescheid erhält, hat weder Anlass noch Mittel zu prüfen, ob das zitierte Rundschreiben existiert.
    Für § 39 VwVfG (Begründungspflicht), § 24 VwVfG (Untersuchungsgrundsatz) und die Diskussion um § 35a
    VwVfG (vollautomatischer Erlass) ist das der derzeit beste ausländische Vergleichsfall — und er zeigt,
    dass die Frage nicht die Vollautomation ist, sondern die unbemerkte Teilautomation.

    '
