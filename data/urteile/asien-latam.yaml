  eigene_bewertung: 'Der Fall ist das Gegenteil dessen, wofür er zitiert wird. Er gilt als weltweit erste
    Aufhebung eines Strafurteils wegen undeklarierten KI-Einsatzes — aber genau diese Aufhebung hat das
    Höchstgericht der Provinz fünf Monate später kassiert. Wer Esquel als Beleg dafür anführt, dass undeklarierter
    KI-Einsatz des Richters zur Nichtigkeit führt, zitiert eine aufgehobene Entscheidung.

    Der dogmatische Ertrag liegt jetzt bei der zweiten Stufe: Der STJ Chubut trennt Herstellungsvorgang
    und Begründungsergebnis. Kontrollgegenstand ist die exteriorisierte Begründung; das Werkzeug, mit
    dem sie entstand, ist als solches kein Nichtigkeitsgrund, solange keine konkrete Rechtsverletzung
    dargelegt ist. Das ist die Gegenposition zur kolumbianischen Linie (co-2025-tribunal-bogota), wo die
    Nichtigkeit gerade an die erfundenen Fundstellen — also an einen greifbaren Begründungsmangel — anknüpft.
    Der Unterschied ist damit sauber zu benennen: In Kolumbien war die Begründung inhaltlich falsch, in
    Esquel nur ihre Urheberschaft unklar. Für §§ 275 ZPO, 267 StPO ist das die entscheidende Weichenstellung
    — ein Begründungsmangel muss sich am Text zeigen lassen, die bloße Ununterscheidbarkeit genügt nicht.
    Der zweite bemerkenswerte Punkt ist institutionell: Chubut hatte mit dem Acuerdo Plenario N.º 5435/2025
    bereits Regeln zum KI-Einsatz, und der STJ entkoppelt deren Verletzung ausdrücklich von der prozessualen
    Nichtigkeitsfolge — Berufsrecht ja, Verfahrensfehler nein.

    '
