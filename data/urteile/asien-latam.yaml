  sachverhalt: Narendra Kumar Goswami wandte sich mit einer Popularklage (Public Interest Litigation)
    nach Art. 32 der Verfassung unmittelbar an den Supreme Court of India. Er machte geltend, Bund und
    Länder setzten künstliche Intelligenz ein, ohne dass dafür Mindestgarantien bestünden, und verlangte,
    das Gericht möge Folgenabschätzungen, Prüfungen auf Verzerrungen, Transparenzpflichten und menschliche
    Aufsicht anordnen. Eine entsprechende Eingabe hatte er zuvor bereits bei der Regierung eingereicht.
