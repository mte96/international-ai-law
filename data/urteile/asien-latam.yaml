  eigene_bewertung: 'Die einzige höchstrichterliche Entscheidung eines Zivilrechtslandes weltweit, die
    die Schutzfähigkeit von KI-Output ausdrücklich verneint — und die einzige, die dies persönlichkeitsrechtlich
    begründet. Damit steht sie näher am kontinentaleuropäischen Werkbegriff (§ 2 Abs. 2 UrhG, "persönliche
    geistige Schöpfung") als jede andere außereuropäische Entscheidung, während die US-Rechtsprechung
    (Thaler ./. Perlmutter) über die Human-Authorship-Anforderung des Copyright Act argumentiert und China
    über den Nachweis des Steuerungsprozesses. Drei Rechtsordnungen, drei Begründungswege, zwei Ergebnisse.
    Für die europäische Diskussion ist Mexiko die brauchbarste Referenz, weil die Argumentation ohne Übersetzungsverlust
    auf § 2 Abs. 2 UrhG übertragbar ist. Zwei Punkte werden in der Berichterstattung verzerrt. Erstens
    wurde NICHT entschieden, dass KI-gestützt erzeugte Werke generell schutzlos sind — die SCJN hat ausdrücklich
    klargestellt, dass hybride Werke mit substanziellem menschlichem Beitrag eintragungsfähig bleiben.
    Zweitens war die eigentliche Provokation des Klägers die Aufspaltung: Verwertungsrechte für sich,
    Urheberpersönlichkeitsrechte für die KI. Genau diese Konstruktion hat das Gericht verworfen, und genau
    sie taucht in der europäischen Literatur als Vorschlag wieder auf. Mexiko hat sie als erstes Höchstgericht
    der Welt abgelehnt.

    '
