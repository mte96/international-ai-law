  instanz: verfassungsgericht
  aktenzeichen: Sentencia T-323/24; Expediente T-9.301.656
  ecli: ''
  datum: 2024-08-02
  parteien:
    klaeger: '"Blanca" (Pseudonym), Mutter eines Kindes mit Autismus-Spektrum-Störung'
    beklagter: 'Salud Total EPS-S; mittelbar überprüft: Juzgado del Circuito als Berufungsgericht'
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - sektor-medizin
  - governance
  anspruchsgrundlage: Art. 29 (rechtliches Gehör, debido proceso) und Art. 44, 49 der Verfassung Kolumbiens;
    Ley 2213 de 2022 (Einsatz von IKT in der Justiz); Ley Estatutaria de Administración de Justicia
  kernfrage: 'Verletzt ein Richter das Recht auf ein faires Verfahren, wenn er zur Begründung seiner Entscheidung
    ChatGPT heranzieht, und welche Anforderungen gelten für den Einsatz künstlicher Intelligenz in der
    Rechtsprechung?

    '
  ergebnis: 'Berichterstatter Juan Carlos Cortés González. Das Berufungsgericht hatte ChatGPT 3.5 befragt
    ("Sind autistische Minderjährige von Zuzahlungen befreit?") und die Antworten in die schriftliche
    Entscheidung übernommen. Das Verfassungsgericht verneinte eine Verletzung des rechtlichen Gehörs,
    weil der Richter seine Entscheidung eigenständig mit herkömmlicher juristischer Methodik gebildet
    und die KI erst danach ergänzend herangezogen habe; die Grundsätze der Transparenz und der Verantwortlichkeit
    seien allerdings nicht vollständig gewahrt worden. Zugleich stellte das Gericht zwölf Leitkriterien
    für den Einsatz von KI in der Justiz auf: Transparenz (Offenlegung von Einsatz, Umfang und Fundstelle
    im Urteil), Verantwortung (Verständnis der Technik und Verifikationspflicht), Datenschutz, Nichtsubstitution
    des menschlichen Urteilens, Strenge und Verifikation, Risikoprävention (Ungenauigkeiten, Halluzinationen,
    Verzerrungen), Gleichheit und Billigkeit, menschliche Aufsicht, ethische Regulierung, kollektive Standards,
    laufende Beobachtung und Eignung der eingesetzten Mittel. Der Consejo Superior de la Judicatura wurde
    verpflichtet, binnen vier Monaten förmliche Leitlinien zu erlassen; zudem wurde eine Schulungspflicht
    angeordnet. In der Hauptsache erweiterte das Gericht die Ansprüche des Kindes (vollständige Beförderungskosten,
    wirksame Mitteilung der Zuzahlungsbefreiung an die Leistungserbringer).

    '
