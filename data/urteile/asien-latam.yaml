    begründe berufliche Fahrlässigkeit beziehungsweise einen Verwaltungsfehler; die Delegation menschlichen
    Ermessens an automatisierte Systeme sei unzulässig, soweit individuelle Rechte betroffen sind. Weder
    Aktenzeichen noch Rubrum noch taggenaues Datum sind angegeben.
