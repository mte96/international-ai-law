  kernfrage: 'Verletzt bereits das Bereitstellen eines Stimmklon-Werkzeugs — nicht erst dessen Nutzung
    — die Persönlichkeitsrechte des Betroffenen?

    '
  ergebnis: 'Das Gericht erstreckte die Haftung über die vollendete Nutzung hinaus auf die ermöglichende
    Technologie selbst: Das Angebot von Stimmklon-Werkzeugen ohne Erlaubnis könne bereits im Eilverfahren
    die Persönlichkeitsrechte verletzen. Damit verschiebt sich der Anknüpfungspunkt vom Endprodukt auf
    die technische Infrastruktur, die die Nachahmung ermöglicht. Kommerzielle Verwertung durch KI-Stimmklonwerkzeuge
    wurde untersagt.

    '
