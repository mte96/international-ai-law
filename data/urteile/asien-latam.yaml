  anspruchsgrundlage: Art. 10 Abs. 1 Nr. 5, 6, 12 Urheberrechtsgesetz der VR China (Vervielfältigung,
    Bearbeitung, öffentliche Zugänglichmachung über Informationsnetze); Interimsmaßnahmen zur Verwaltung
    generativer KI-Dienste vom 15.08.2023 (生成式人工智能服务管理暂行办法)
  kernfrage: 'Haftet der Anbieter eines generativen KI-Dienstes für Ausgaben, die ein urheberrechtlich
    geschütztes Figurenrecht verletzen, und welche Sorgfaltspflichten treffen ihn?

    '
  ergebnis: 'Weltweit erste Entscheidung zur Haftung eines Anbieters generativer KI für verletzende Ausgaben.
    Der Dienst "Tab" erzeugte auf Nutzeranfrage Bilder der Ultraman-Figuren, die den Originalen im Wesentlichen
    entsprachen oder sie bearbeiteten. Das Gericht bejahte die Verletzung des Vervielfältigungs-, des
    Bearbeitungs- und des Rechts der öffentlichen Zugänglichmachung. Es leitete die Sorgfaltspflichten
    ausdrücklich aus den Interimsmaßnahmen für generative KI ab und konkretisierte vier Pflichten: ein
    wirksames Beschwerdeverfahren für Rechteinhaber, Risikohinweise an die Nutzer, Kennzeichnung KI-generierter
    Inhalte und wirksame technische Vorsorgemaßnahmen. Zugleich betonte es, die Branche befinde sich in
    einer frühen Entwicklungsphase; die Pflichten müssten "angemessen und tragbar" sein. Verurteilt wurde
    der Anbieter zur Unterlassung, zur Einrichtung einer Stichwortfilterung (unter anderem für "Ultraman"
    und "Tiga") und zu 10.000 RMB Schadensersatz statt der geforderten 300.000 RMB. Ausdrücklich abgelehnt
    wurde der Antrag, die streitigen Materialien aus den Trainingsdaten zu löschen: der Beklagte hatte
    das Modell nicht selbst trainiert, sondern von einem Dritten bezogen.

    '
  bedeutung: hoch
