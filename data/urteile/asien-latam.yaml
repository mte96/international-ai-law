  anspruchsgrundlage: Art. 3 Urheberrechtsgesetz der VR China; Art. 2 Durchführungsverordnung
  kernfrage: 'Reicht die Eingabe allgemein gehaltener Prompts aus, um Originalität im Sinne des chinesischen
    Urheberrechts zu begründen, oder muss der Nutzer konkrete Ausdrucksentscheidungen nachweisen?

    '
  ergebnis: 'Das Berufungsgericht legte einen deutlich strengeren Maßstab an. Der Nutzer habe keine Aufzeichnungen
    des Schöpfungsvorgangs vorgelegt, aus denen sich konkrete Ausdrucksentscheidungen zu Layout, Komposition,
    Linienführung und Farbgebung ergäben. Allgemein gehaltene Prompts seien eher abstrakte Ideen als urheberrechtlich
    schützbarer Ausdruck. Damit fehlte es an der Originalität.

    '
  bedeutung: hoch
  volltext_url: null
  zusammenfassung_url: ''
  bezug_regelwerke:
