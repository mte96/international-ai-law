  eigene_bewertung: 'Der wichtigste Negativbefund dieser Datei. Der indische Supreme Court — sonst das
    aktivistischste Höchstgericht der Welt, das über PIL Umwelt-, Datenschutz- und Grundrechtsstandards
    gesetzt hat — verweigert ausgerechnet bei KI die Rechtsfortbildung mit dem Argument fehlender Sachkunde.
    Das ist bemerkenswert, weil dasselbe Gericht in K.S. Puttaswamy den Datenschutz zum Grundrecht erhoben
    hat, ohne Techniker zu sein. Die Konsequenz: Indische KI-Regulierung entsteht weiter über einstweiligen
    Rechtsschutz der High Courts und über Verwaltungsverordnungen des MeitY, nicht über Verfassungsrechtsprechung.
    Für die Prognose indischer Entwicklungen ist das die zentrale Weichenstellung.

    '
