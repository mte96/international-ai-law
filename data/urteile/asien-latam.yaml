  quelle_tracker: Pressemitteilung der Nikkei Inc. vom 26.08.2025 (nikkei.co.jp) sowie Berichte von Nikkei,
    Asahi Shimbun und Japan Times
  verifiziert: false
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Das wichtigste anhängige Verfahren Asiens. Art. 30-4 japanisches UrhG gilt als weltweit
    weiteste TDM-Schranke: Er erlaubt die Nutzung fremder Werke, soweit sie nicht auf den Genuss des Ausdrucksgehalts
    gerichtet ist, ohne Opt-out und ohne Vergütung — deutlich weiter als § 44b UrhG und Art. 4 DSM-RL.
    Der Ausnahmevorbehalt ("soweit nicht die Interessen des Rechteinhabers unangemessen beeinträchtigt
    werden") ist nie gerichtlich ausgelegt worden. Genau darüber wird hier entschieden. Zweiter, unterschätzter
    Punkt: Der Angriff richtet sich nicht auf das Training, sondern auf Retrieval — dieselbe Verlagerung,
    die der Delhi High Court in ANI beschrieben und ausdrücklich offengelassen hat. Wer verstehen will,
    wohin sich die Trainingsstreitigkeiten weltweit bewegen, beobachtet dieses Verfahren und das indische
    Hauptsacheverfahren.

    '
