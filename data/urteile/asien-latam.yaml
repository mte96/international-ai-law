  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Das koreanische Gegenstück zu ANI ./. OpenAI und zu den japanischen Perplexity-Verfahren,
    mit einem wesentlichen Unterschied: Korea hat in Art. 35-5 UrhG eine offene fair-use-Generalklausel
    nach US-Vorbild. Der Oberste Gerichtshof hat deren Kriterien am 11.07.2024 (2021다272001) für Fälle
    transformativer Nutzung konkretisiert — Zweck, Werkart, Umfang der Nutzung, Marktwirkung. Damit ist
    Korea die einzige asiatische Rechtsordnung, in der die amerikanische fair-use-Dogmatik unmittelbar
    auf Trainingsdaten angewandt werden kann. Das Ergebnis dieses Verfahrens wird deshalb international
    mehr Vergleichswert haben als jede andere asiatische Entscheidung.

    '
