  eigene_bewertung: 'Die Entscheidung wird gern als "KI-Fall" verkauft, ist aber vor allem eine Abgrenzungsentscheidung:
    sie verweigert dem digitalen Menschen jede eigene Rechtsposition und verlagert alles auf die Werkebene.
    Damit steht sie in derselben Linie wie Li ./. Liu (nur Menschen sind Urheber) und ist die chinesische
    Antwort auf die in Europa und Japan diskutierte Frage nach einem Leistungsschutzrecht für virtuelle
    Darsteller. Für die Praxis relevant, weil sie die Rechtekette bei virtuellen Inflüncern klärt: alles
    hängt an den Videoproduzenten, nichts an der Figur.

    '
