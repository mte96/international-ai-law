  eigene_bewertung: 'Für die europäische Praxis die wohl anschlussfähigste chinesische Entscheidung. Sie
    löst dasselbe Problem, das im deutschen Recht über §§ 22, 23 KUG und das allgemeine Persönlichkeitsrecht
    zu lösen wäre — Erkennbarkeit statt Identität —, und zwar mit demselben Ergebnis. Zwei Punkte gehen
    darüber hinaus. Erstens die Beweislastumkehr in der Sache: Weil die Produzentin den Erzeugungsvorgang
    nicht reproduzieren konnte, ging das zu ihren Lasten. Das ist die spiegelbildliche Anwendung derselben
    Dokumentationsobliegenheit, die Yangzhou dem Rechteinhaber auferlegt. Zweitens die Mithaftung der
    ausstrahlenden Stelle wegen Verletzung der Prüfungspflicht — eine Verkehrspflicht für Plattformen
    bei KI-Inhalten, die in Europa erst über Art. 50 KI-VO und den DSA konstruiert werden müsste.

    '
