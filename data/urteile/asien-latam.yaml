  eigene_bewertung: 'Dogmatisch unspektakulär, statusrechtlich aber bedeutsam: Durch die Aufnahme in die
    typischen Fälle des Obersten Volksgerichtshofs erhält die Entscheidung faktische Leitwirkung, ohne
    ein Leitfall (指导性案例) zu sein. Das ist eine Unterscheidung, die im westlichen Diskurs regelmäßig verwischt
    wird: typische Fälle (典型案例) sind nicht bindend, werden aber von Instanzgerichten praktisch befolgt;
    Leitfälle (指导性案例) sind nach Art. 7 der einschlägigen SPC-Bestimmungen "zu berücksichtigen". Zur KI
    existiert bis heute KEIN Leitfall. Materiell interessant ist die Absage an die Technologieneutralität
    — dieselbe Argumentation, die europäische Gerichte im Rahmen von Art. 17 DSM-RL führen, hier aber
    ohne jede Haftungsprivilegierung.

