  eigene_bewertung: 'Sachlich das indische Gegenstück zur chinesischen Yin-Entscheidung, dogmatisch aber
    radikaler: China verbietet die konkrete Stimmsynthese, Indien verbietet das Werkzeug. Das ist eine
    Vorfeldhaftung, die in Europa an der Störerhaftung und an Art. 6 DSA scheitern dürfte — und die genau
    die Frage aufwirft, die das Guangzhouer Ultraman-Urteil offengelassen hat: Haftet der Anbieter für
    die Möglichkeit oder erst für die Ausgabe? Indien sagt: für die Möglichkeit. Das ist die weitestgehende
    Anbieterhaftung, die derzeit weltweit judiziert wird.

    '
