  - 'Amtliche Suchadresse: https://delhihighcourt.nic.in/web/judgement (Suche nach Case Type CS(COMM),
    Nr. 835, Jahr 2026).'
  - 'datum: Nachgewiesen sind Beschlüsse vom 04.08.2026 und 05.08.2026; das im Eintrag genannte Urteil
    vom 22.08.2026 ist noch nicht in einer Datenbank.'
