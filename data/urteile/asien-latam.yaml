  aktenzeichen_original: CS(COMM) 835/2026; CNR DLHC010350622026
  pruefvermerk:
  - TEILTREFFER. Auf indiankanoon liegen nur die beiden Beschlüsse vom 04.08.2026 (https://indiankanoon.org/doc/125057993/)
    und 05.08.2026 vor; hier verlinkt ist der zweite.
