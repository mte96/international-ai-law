  kernfrage: 'Ist die Nutzung urheberrechtlich geschützter Materialien zum Training von Modellen des maschinellen
    Lernens nach israelischem Recht zulässig?

    '
  ergebnis: 'Das Justizministerium kam zu dem Ergebnis, dass das Training von Modellen des maschinellen
    Lernens mit urheberrechtlich geschützten Inhalten außer in Ausnahmefällen von den Schrankenregelungen
    des israelischen Urheberrechts gedeckt und damit keine Rechtsverletzung ist. Die Stellungnahme stützt
    sich auf drei Wege: erstens in aller Regel auf die fair-use-Schranke; zweitens bei einem Teil der
    Vorhaben auf s. 22 Copyright Act 2007 (beiläufige Nutzung eines Werkes); drittens, soweit die zum
    Lernen verwendeten Daten am Ende des Vorgangs gelöscht werden, auf s. 26 Copyright Act 2007 (flüchtige
    Vervielfältigung). Ausdrücklich ausgenommen sind unter anderem Fälle, in denen der Trainingsdatensatz
    keine breite Vielfalt an Inhalten umfasst, sondern aus den Werken einzelner Urheber besteht.

    '
  bedeutung: mittel
  volltext_url: https://www.gov.il/he/pages/machine-learning
  zusammenfassung_url: ''
