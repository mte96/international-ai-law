  kernfrage: 'Wessen Kenntnis ist maßgeblich, wenn ein Vertrag ausschließlich durch deterministische Algorithmen
    geschlossen wird — und kann ein solcher Vertrag wegen einseitigen Irrtums angefochten werden?

    '
  ergebnis: 'Der Court of Appeal entschied, bei Verträgen, die durch deterministische Algorithmen zustande
    kommen, sei auf den Kenntnisstand der Programmierer im Zeitraum von der Programmierung bis zum Vertragsschluss
    abzustellen. Da die Programmierer weder tatsächliche noch fahrlässige Unkenntnis vom Irrtum der Gegenseite
    hatten, blieb der Vertrag wirksam.

    '
