- id: br-2026-stj-ia-beweis
  jurisdiktion: br
  gericht: Superior Tribunal de Justiça (STJ), Quinta Turma — Oberster Gerichtshof Brasiliens, Fünfte
    Kammer
  instanz: revision
  aktenzeichen: HC 1.059.475/SP
  ecli: ''
  datum: 2026-04-08
  parteien:
    klaeger: Angeklagter (Habeas-Corpus-Antragsteller)
    beklagter: Ministério Público do Estado de São Paulo
  status: rechtskraeftig
  themenachsen:
  - haftung
  - grundrechte
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 5 Abs. LIV und LVI der Verfassung Brasiliens (rechtliches Gehör, Beweisverwertungsverbot);
    Art. 155, 158, 159 Código de Processo Penal
  kernfrage: 'Kann ein mit generativer KI erstellter Bericht als Beweismittel im Strafverfahren dienen
    und ein amtliches Sachverständigengutachten entkräften?

    '
  ergebnis: 'Erste Entscheidung des STJ zur generativen KI als Beweismittel. Berichterstatter Minister
    Reynaldo Soares da Fonseca. Sachverhalt: In einem Verfahren wegen rassistischer Beleidigung (injúria
    racial) in Mirassol (São Paulo) hatte das amtliche kriminaltechnische Institut in der Tonaufnahme
    das behauptete Schimpfwort nicht feststellen können. Ermittler ließen die Aufnahme daraufhin von KI-Werkzeugen
    analysieren; der so erzeugte Bericht behauptete das Gegenteil und wurde Anklagegrundlage. ERGEBNIS:
    Die Quinta Turma schloss den KI-Bericht aus den Akten aus und verwies die Sache zurück, damit der
    Instanzrichter ohne dieses Beweismittel neu über die Annahme der Anklage befindet. Das Verfahren wurde
    NICHT eingestellt. Tragend: Generative KI arbeite probabilistisch und sei anfällig für "alucinação"
    — "Um dos riscos inerentes à utilização da inteligência artificial generativa é a alucinação"; die
    eingesetzten Werkzeuge verarbeiteten Text, nicht Schall, und seien für eine akustische Analyse ungeeignet;
    dem Bericht fehle die "confiabilidade epistêmica mínima". Wörtlich: "revela-se imperativa a exclusão
    de diligências desprovidas de aptidão racional."

    '
  bedeutung: hoch
  volltext_url: https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/2026/08042026-Quinta-Turma-rejeita-relatorio-produzido-por-IA-como-prova-em-acao-penal.aspx
  zusammenfassung_url: https://www.otempo.com.br/politica/judiciario/2026/4/8/stj-rejeita-relatorio-feito-por-ia-como-prova-e-impoe-limites-a-uso-da-tecnologia-em-decisao-inedita
  bezug_regelwerke:
  - br-cpp
  - br-cnj-res-615-2025
  instanzenzug: []
  quelle_tracker: Amtliche Nachrichtenseite des STJ (08.04.2026); Carta Capital und O Tempo (08.04.2026).
    Der Legal 500 Country Guide Brazil datiert abweichend auf den 04.08.2026 — das ist die amerikanische
    Schreibweise desselben Tages.
  verifiziert: true
  letzte_pruefung: 2026-09-05
  eigene_bewertung: 'Die erste höchstrichterliche Entscheidung, die einen Maßstab für KI-erzeugte Beweismittel
    formuliert — und sie tut es mit einem Begriff, der in der europäischen Beweisrechtsdogmatik keine
    Entsprechung hat: "confiabilidade epistêmica mínima", epistemische Mindestverlässlichkeit. Das ist
    mehr als das deutsche Erfordernis der Verwertbarkeit; es ist ein Qualitätsvorbehalt gegen ein Beweismittel,
    dessen Fehlerquelle in der Methode selbst liegt. Für § 244 Abs. 4 StPO und für die Diskussion um forensische
    KI-Werkzeuge (Stimmvergleich, Bildforensik, Predictive Policing) ist das der derzeit beste vorhandene
    Argumentationsbaustein.

    Wichtig ist die Reichweite: Der STJ hat nicht die Strafklage beseitigt, sondern das Beweismittel.
    Das ist dogmatisch die schärfere, praktisch die mildere Rechtsfolge — ein Verwertungsverbot mit Zurückverweisung,
    kein trancamento. Wer die Entscheidung als "Freispruch durch KI-Kritik" referiert, überzeichnet sie.

    Zweiter Punkt, der übersehen wird: Der Fall zeigt, dass die Ermittlungsbehörden KI nicht zur Effizienzsteigerung,
    sondern zur Überwindung eines ungünstigen amtlichen Gutachtens eingesetzt haben. Das ist ein strukturelles
    Risiko und keine Anwenderpanne.

    '
  pruefvermerk:
  - 'Teilweise bestätigt (Carta Capital, Bezug auf die Entscheidung): Superior Tribunal de Justiça, Quinta
    Turma, Entscheidungsdatum 08.04.2026, Berichterstatter Minister Reynaldo Soares da Fonseca. Gegenstand
    ist ein Fall von injúria racial aus Mirassol/SP; ein KI-gestützt erstelltes Gutachten sollte das amtliche
    Sachverständigengutachten widerlegen.'
  - 'Ergebnis bestätigt: Das Gericht hielt generative KI für ungeeignet zur Audioanalyse und nicht geeignet,
    das amtliche Gutachten zu erschüttern; wörtlich zitiert wird ''Um dos riscos inerentes à utilização
    da inteligência artificial generativa é a alucinação''.'
  - 'NICHT GEPRÜFT: Das im Eintrag geführte Aktenzeichen ''HC 1.059.475/SP'' ließ sich an keiner Quelle
    belegen; Carta Capital nennt keine Prozessnummer. Der STJ-Volltext war nicht abrufbar.'
  - 'Für die Prüfung im Browser: processo.stj.jus.br, Suche nach Habeas Corpus mit Relator Reynaldo Soares
    da Fonseca, Quinta Turma, Sitzung vom 08.04.2026.'
  - 'Amtliche Nachrichtenseite des Superior Tribunal de Justiça. Bestätigt: Quinta Turma, Relator Ministro
    Reynaldo Soares da Fonseca, Entscheidung vom 08.04.2026, HC 1.059.475 — Gericht, Kammer, Aktenzeichen
    und Datum stimmen mit dem Eintrag überein.'
  - 'DOKUMENTTYP-VORBEHALT: Die amtliche Rechtsprechungsdatenbank des STJ (scon.stj.jus.br, Basis ACOR)
    liefert zu ''HC 1059475'' den Befund ''Acórdão não encontrado''; der Volltext des Acórdão war am 03.09.2026
    noch nicht freigegeben. Die Pressemitteilung ist damit derzeit die einzige amtliche Fundstelle.'
  - 'Zitat aus der Mitteilung: ''revela-se imperativa a exclusão de diligências desprovidas de aptidão
    racional''.'
  - 'Amtliche Suchadresse für den Volltext, sobald publiziert: https://processo.stj.jus.br/processo/pesquisa/?termo=HC+1059475
    bzw. https://scon.stj.jus.br/SCON/'
  - 'AM AMTLICHEN DOKUMENT GEPRÜFT (05.09.2026, stj.jus.br): Superior Tribunal de Justiça, Quinta Turma,
    HC 1.059.475, Entscheidung vom 08.04.2026, Relator Ministro Reynaldo Soares da Fonseca. Gericht, Kammer,
    Aktenzeichen, Datum und Berichterstatter des Eintrags treffen zu.'
  - 'KORREKTUR ERGEBNIS: Der Eintrag sagte, die Kammer habe ''die Strafklage einstimmig aufgehoben''.
    Das trifft nicht zu. Nach der amtlichen Mitteilung wurde der KI-Bericht aus den Akten AUSGESCHLOSSEN
