    klaeger: Wan (万某), Produktdesigner
    beklagter: drei Unternehmen (Spielzeughersteller)
  status: rechtskraeftig
  themenachsen:
  - urheberrecht
  - content
  anspruchsgrundlage: Art. 3 Urheberrechtsgesetz der VR China; Art. 2 Durchführungsverordnung
  kernfrage: 'Begründet die Eingabe von Stichworten mit anschließendem mehrfachen Neugenerieren und Auswählen
    eine schutzfähige Schöpfung, und ist die Umsetzung eines KI-Bildes in ein dreidimensionales Produkt
    eine Bearbeitung oder eine Vervielfältigung?

    '
  ergebnis: 'Beide Instanzen wiesen die Klage ab. Der Designer hatte 2024 mit Stichworten wie "Comic-Schlange",
    "Plüschtextur" und "3D" ein Spielzeugmotiv erzeugen lassen, nach mehrfachem Klicken auf "Aktualisieren"
    ein Bild ausgewählt, es urheberrechtlich registrieren lassen und daraus ein Plüschtier gefertigt.
    Das Gericht hielt die eingegebenen Stichworte für abstrakte Ideen mit geringer Steuerungswirkung;
    bloßes Neugenerieren und Auswählen sei keine eigenständige geistige Leistung. Behauptete Nachbearbeitungen
    in Photoshop und am physischen Prototyp blieben unbewiesen, ein Schöpfungsprotokoll wurde nicht vorgelegt.
    Wörtlich: der erzeugte Inhalt könne "keine individualisierte Auswahl und keinen originären Beitrag
    widerspiegeln" und sei deshalb kein Werk. Ergänzend: die Umsetzung eines flächigen Bildes in ein körperliches
    Spielzeug unter bloßer Anpassung von Material und Größe überschreite den ursprünglichen Ausdruck nicht
    und sei Vervielfältigung, nicht Neuschöpfung. Streitwert rund 110.000 RMB.

    '
  bedeutung: hoch
  volltext_url: null
  zusammenfassung_url: ''
  bezug_regelwerke:
  - cn-urhg
  instanzenzug:
  - cn-2025-suzhou-berufung
  - cn-2023-li-liu
  quelle_tracker: Guangming Wang (光明网), Rechtsressort, 01.04.2026
  verifiziert: false
  letzte_pruefung: &id002 2026-09-05
  eigene_bewertung: 'Die jüngste und klarste Absage an eine großzügige Schutzgewährung. Bemerkenswert
    ist der Beweisaspekt: das Gericht verlangt ein reproduzierbares Schöpfungsverfahren ("原始底稿", Originalentwürfe,
    und nachvollziehbare Verfahrensschritte). Damit ist in China faktisch eine Dokumentationslast entstanden,
    die es weder im US-Recht noch im europäischen Recht in dieser Schärfe gibt. Zweiter, praktisch unterschätzter
    Punkt: die Aussage zur 2D-3D-Umsetzung. Sie betrifft die gesamte Merchandising- und Spielwarenbranche
    und ist unabhängig von der KI-Frage anwendbar. Wer die Entscheidung nur als "KI-Entscheidung" liest,
    übersieht das.

    '
  sekundaerquelle_url: https://legal.gmw.cn/2026-04/01/content_38684130.htm
  pruefvermerk:
  - 'Nicht am Primärdokument geprüft. Amtliche Fundstelle nicht erreichbar: wenshu.court.gov.cn (中国裁判文书网)
    verlangt seit dem Umbau eine Anmeldung mit chinesischer Mobilnummer; ebenso 人民法院案例库 (rmfyalk.court.gov.cn)
    und pkulaw.com. Ein Schiebe-Rätsel trat nicht auf — die Sperre ist eine Anmeldeschranke, kein CAPTCHA.
    Aktenzeichen weiterhin nicht veröffentlicht.'
  - 'Am Bericht des 法治日报 auf der Website des Mittleren Volksgerichts Yangzhou selbst (fy.yangzhou.gov.cn)
    und an einer Übernahme bei 光明网 (legal.gmw.cn, 01.04.2026) bestätigt: ''江苏省扬州市中级人民法院审结一起涉AI创作著作权权属、侵权纠纷案件，判决驳回上诉人万某全部诉讼请求''
    — die Berufung des Klägers 万某 wurde in vollem Umfang zurückgewiesen. 万某 ist Designer im Plüschtier-Betrieb
    der eigenen Familie; Gegenstand ist ein 2024 für das Jahr der Schlange mit KI-Software erzeugtes Plüschtiermotiv,
    für das eine Urheberrechtsregistrierung erwirkt wurde.'
  - 'DATUM UNSICHER: Das Eintragsdatum 2026-04-01 ist das Datum der Presseberichte, nicht das Urteilsdatum.
    Die Berichte sprechen nur von ''近日'' (kürzlich). zweifelhaft ist deshalb gesetzt.'
  - 'Für den Beleg von Hand: https://fy.yangzhou.gov.cn/mtbb/art/2026/art_3181b53a0995418d960eb1424266d8cf.html
    — von hier aus mit ''403 Forbidden'' gesperrt, aus Europa ggf. erreichbar; ferner https://legal.gmw.cn/2026-04/01/content_38684130.htm
    und wenshu.court.gov.cn nach Anmeldung (Volltextsuche 万某 + 扬州市中级人民法院 bzw. 仪征市人民法院).'
