  kernfrage: 'Reicht die fehlende Einwilligung allein aus, um jede Nutzung der Persona zu untersagen,
    oder ist zwischen kommerzieller Ausbeutung und zulässiger Meinungsäußerung wie Parodie und Meme zu
    unterscheiden?

    '
  ergebnis: 'Das Gericht untersagte kommerzielles Merchandising und KI-Chatbots, die Bild und Persona
    des Klägers nutzten, lehnte aber ein Verbot von Parodie- und Meme-Inhalten ab und behielt sich eine
    nähere Prüfung des beanstandeten "Thug Life"-Materials vor. Tragend ist die Feststellung, dass die
    Einwilligung zwar wichtig, aber nicht der alleinige Maßstab sein kann; abzuwägen ist zwischen kommerzieller
    Ausbeutung und legitimer schöpferischer Meinungsäußerung.

    '
