  eigene_bewertung: 'Das ist der schärfste Kontrast zur amerikanischen Rechtslage, der sich weltweit finden
    lässt. In den USA sind KI-generierte Inhalte ohne hinreichenden menschlichen Beitrag gemeinfrei und
    deshalb nicht einmal zivilrechtlich schützbar; in China begründet ihre Vervielfältigung eine Freiheitsstrafe.
    Dass ein Strafgericht die Schutzfähigkeit bejaht, während zwei Mittlere Volksgerichte sie im Zivilrecht
    verneinen, ist zudem ein innerchinesischer Wertungsbruch, der bislang nirgends aufgearbeitet ist.
    Erklärbar ist er über den Sachverhalt: Hier gab es Skript, Szenenaufbau und Parameterwahl, also genau
    die dokumentierten Ausdrucksentscheidungen, die Suzhou und Yangzhou vermisst haben. Wer die drei Entscheidungen
    zusammenliest, erkennt: China streitet nicht über die Schutzfähigkeit von KI-Output im Grundsatz,
    sondern über das Beweismaß.

    '
