  kernfrage: 'Setzt die Verletzung des Rechts am eigenen Bild durch KI-Deep-Synthesis voraus, dass das
    erzeugte Gesicht mit dem der betroffenen Person identisch ist, oder genügt hohe Ähnlichkeit mit Erkennbarkeit?

    '
  ergebnis: 'Erstmalige ausdrückliche Klärung: Es genügt, dass das erzeugte Gesicht für das allgemeine
    Publikum erkennbar ist; Identität ist nicht erforderlich. In einer 44-teiligen Kurzdrama-Serie war
    mit Deep-Synthesis-Technik das Gesicht einer bekannten Schauspielerin auf eine Rolle gelegt worden;
    Gesichtskonturen und Einzelmerkmale waren "hochgradig ähnlich", in sozialen Netzwerken entstand der
    Eindruck, die Schauspielerin habe mitgewirkt. Die Produktionsgesellschaft konnte den behaupteten Erzeugungsvorgang
    auf gerichtliche Aufforderung nicht reproduzieren. Verurteilt wurden Produzentin und ausstrahlende
    Stelle: Letztere haftete, weil sie ihre zumutbare Prüfungspflicht verletzt hatte. Beide mussten sich
    öffentlich entschuldigen und Schadensersatz leisten. Keine Berufung.

    '
