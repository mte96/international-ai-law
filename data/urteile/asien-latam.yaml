  kernfrage: 'Verstößt eine strafrechtliche Definition künstlicher Intelligenz für deepfake-gestützte
    Sexualdelikte gegen den Bestimmtheitsgrundsatz, wenn sie technisch unpräzise ist?

    '
  ergebnis: 'Die SCJN hielt eine funktionale, kontextbezogene Definition künstlicher Intelligenz für hinreichend
    bestimmt, auch ohne technische Exaktheit — gerade in einem sich schnell wandelnden technologischen
    Umfeld. Die Norm blieb in Kraft.

    '
