    belegbar.
  verifiziert: false
  letzte_pruefung: *id002
  eigene_bewertung: 'Die international meistunterschätzte Entscheidung der gesamten Datei. China hat damit
    vor jeder anderen Rechtsordnung ein eigenständiges Stimmrecht auf KI-Synthese angewendet — und zwar
    über eine Verweisungsnorm (Art. 1023 Abs. 2 ZGB), die die Vorschriften über das Recht am eigenen Bild
    für entsprechend anwendbar erklärt. Der entscheidende Satz ist der zur Rechtekette: Wer die Aufnahmen
    besitzt, besitzt nicht die Stimme. Genau diese Trennung fehlt in den US-Verfahren (Lehrman ./. Lovo)
    und in den ELVIS-Act-Debatten, und genau sie ist der Kern des deutschen Streits um § 22 KUG analog
    und um die Reichweite von Einwilligungen in Synchronverträgen. Wer in Deutschland Sprecherverträge
    gestaltet, sollte diesen Fall kennen. Achtung: Das Aktenzeichen ist unbestätigt und vor Zitierung
    zwingend zu verifizieren. Ein chinesischer Fachbeitrag vom 06.07.2026 berichtet daneben über einen
    Fall des Volksgerichts Binjiang (Hangzhou), in dem eine ehemalige Mitarbeiterin, die als "virtuelle
    Künstlerin" Stimmmaterial für das KI-Training aufgenommen hatte, 2 Mio. RMB zugesprochen bekam — dieser
    Fall ist gesondert zu prüfen.

    '
  pruefvermerk:
  - 'Weiterhin nicht am Primärdokument geprüft. Amtliche Fundstelle nicht erreichbar: wenshu.court.gov.cn
    (中国裁判文书网) verlangt seit dem Umbau eine Anmeldung mit chinesischer Mobilnummer; ebenso 人民法院案例库 (rmfyalk.court.gov.cn)
    und pkulaw.com. Ein Schiebe-Rätsel trat nicht auf — die Sperre ist eine Anmeldeschranke, kein CAPTCHA.'
  - 'Neu gestützt: Ein Bericht der koreanischen Urheberrechtskommission (copyright.or.kr) über die vom
    Pekinger Internetgericht veröffentlichten KI-Leitfälle führt den Fall als ''殷某某诉某智能科技公司等人格权侵权纠纷案,
    (2023)京0491民初12142号''. Das bisher als unbestätigt gekennzeichnete Aktenzeichen ist damit erstmals
    in einer Quelle belegt, die sich ausdrücklich auf eine Veröffentlichung des Gerichts stützt — aber
    immer noch nicht am Urteil selbst.'
  - 'Beklagtenseite: Die Quelle bezeichnet die Erstbeklagte als 某智能科技公司 (Technologieunternehmen), nicht
    als ''Synchronisationsunternehmen''. Das Parteienfeld ist insoweit unscharf und am Urteil zu klären.'
  - 'Datum und Schadensersatz durch mehrere Berichte vom 23./24.04.2024 gestützt (u. a. Beijing Daily,
    CCTV): erstinstanzliche Verkündung am 23.04.2024, 250.000 RMB für die Sprecherin 殷某. Das Eintragsdatum
    2024-04-23 ist damit plausibel, aber nicht am Dokument belegt.'
  - 'Für den Beleg von Hand: https://wenshu.court.gov.cn/ nach Anmeldung, 案号 (2023)京0491民初12142号; ferner
