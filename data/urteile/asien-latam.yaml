- id: br-2024-anpd-meta
  jurisdiktion: br
  gericht: Autoridade Nacional de Proteção de Dados (ANPD) — Nationale Datenschutzbehörde Brasiliens
  instanz: behoerde
  aktenzeichen: Despacho Decisório nº 20/2024/PR/ANPD auf der Grundlage des Voto nº 11/2024/DIR-MW/CD;
