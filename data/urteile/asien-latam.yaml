  sachverhalt: Der Segundo Tribunal Colegiado en Materia Civil del Segundo Circuito in Toluca hatte in
    Amparo-Verfahren wiederholt die Höhe von Sicherheitsleistungen zu bestimmen — eine Rechenaufgabe aus
    Wertfortschreibung, Zinsanwendung und Fristgewichtung. Der Spruchkörper benutzte dafür KI-Werkzeuge
    und legte das in seinen Entscheidungen offen. Weil es für den Einsatz solcher Werkzeuge durch Gerichte
    keine gesetzliche Regelung gibt, formulierte er zugleich die Maßstäbe, an die er sich dabei binden
    wollte. Fünf einstimmige Entscheidungen desselben Spruchkörpers zwischen dem 29. Juli und dem 19.
    November 2025 — Queja 212/2025, Queja 404/2025 sowie die Incidentes de suspensión (revisión) 359/2025,
    189/2025 und 253/2025 — trugen dieselbe Auffassung; damit waren die Voraussetzungen einer Jurisprudencia
    por reiteración erfüllt.
