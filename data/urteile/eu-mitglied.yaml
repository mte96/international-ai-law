    CAPTCHA aus und wurde nicht durchgeführt
  quelle_art: amtlich
  sachverhalt: Die Foundever Spain S.A. betreibt Callcenter in Spanien. Die Zuteilung der dienstfreien
    Tage (libranzas) an die Beschäftigten wird dort über Algorithmen gesteuert. Die Gewerkschaft Confederación
    General del Trabajo verlangte für ihre Delegierten Auskunft über die Parameter, Regeln und Anweisungen
    dieser Algorithmen; das Unternehmen verweigerte die Auskunft und bestritt, überhaupt Algorithmen einzusetzen.
