  - governance
  - grundrechte
  - arbeit
  anspruchsgrundlage: Art. 7 und 23 des seinerzeitigen Codice privacy (d.lgs. 196/2003); Grundsatz der
    informierten Einwilligung
  kernfrage: Ist die Einwilligung in die Verarbeitung personenbezogener Daten durch ein algorithmisches
    Reputationsbewertungssystem wirksam, wenn das Ausführungsschema des Algorithmus dem Betroffenen nicht
    bekannt ist?
  ergebnis: 'Nein. Die Einwilligung ist nur wirksam, wenn dem Betroffenen das "schema esecutivo" des Algorithmus
    und die für die Bewertung verwendeten Elemente bekannt sind. Ohne Kenntnis der Funktionsweise fehlt
    es an der Bestimmtheit und damit an der Wirksamkeit der Einwilligung. Die Corte di cassazione gibt
    den ersten vier Rügen des Garante statt, erklärt die übrigen für absorbiert, hebt das Urteil des Tribunale
    di Roma auf und verweist die Sache an dieses Gericht zurück, auch zur Kostenentscheidung. Sie entscheidet
    also nicht selbst in der Sache und stellt die Untersagung des Garante nicht unmittelbar wieder her.

    '
