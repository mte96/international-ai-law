    zu Nº Recurso 182/2025); ergänzend Faustino Cavas Martínez, Revista de Jurisprudencia Laboral 8/2025
    (amtliche Zeitschrift der Agencia Estatal BOE)
  verifiziert: false
  letzte_pruefung: '2026-09-05'
  eigene_bewertung: 'Die erste veröffentlichte Entscheidung zu Art. 64.4.d) ET — und ihre Bedeutung liegt
    nicht im Ergebnis, sondern im gewählten Verfahrensweg. Die Gewerkschaft hat nicht die Arbeitsaufsicht
    eingeschaltet, sondern das Grundrechtsverfahren (tutela de derechos fundamentales) gewählt. Damit
    gilt die Beweislastumkehr, es gibt Schadensersatz, und der Verstoß wird aus dem Ordnungswidrigkeitenrecht
    in das Verfassungsrecht gehoben. Wer die Wirksamkeit algorithmischer Transparenzpflichten im Arbeitsrecht
    beurteilen will, muss auf die Verfahrensart schauen, nicht auf den Wortlaut der Auskunftsnorm: dieselbe
    Norm ist als Ordnungswidrigkeit fast wirkungslos und als Grundrechtseingriff scharf. Für die Umsetzung
    der Plattformarbeitsrichtlinie (EU) 2024/2831 bis zum 02.12.2026 ist das die praktisch wichtigste
    Vorlage in Europa. Bemerkenswert und in der Besprechung unterschätzt ist die Beweisfrage: Das Unternehmen
    bestritt schlicht, Algorithmen einzusetzen. Ohne die Aussage des eigenen Produktionsleiters wäre der
    Anspruch an der Darlegungslast gescheitert. Das ist die strukturelle Schwäche aller algorithmischen
    Auskunftsrechte.

    '
