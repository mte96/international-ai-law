  kernfrage: Muss der außerhalb der Union ansässige Anbieter eines KI-Dienstes, der seine Leistungen europäischen
    Nutzern anbietet, einen Vertreter in der Union benennen?
  ergebnis: 'Ja. Die Behörde ordnet nach Art. 58 Abs. 2 lit. d DSGVO an, dass Hangzhou DeepSeek Artificial
    Intelligence Co., Ltd. schriftlich einen Vertreter in der Union nach Art. 27 DSGVO benennt und die
    Behörde hiervon unterrichtet. Das Unternehmen unterliege nach Art. 3 Abs. 2 lit. b DSGVO dem räumlichen
    Anwendungsbereich der Verordnung, weil es KI-Dienste für in der Union befindliche betroffene Personen
    erbringe, und sei der Pflicht aus Art. 27 DSGVO nicht nachgekommen. Vorsitz: Κωνσταντίνος Μενουδάκος.

    '
  bedeutung: mittel
