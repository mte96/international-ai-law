  anspruchsgrundlage: Art. 10 der Loi n° 78-17 (informatique et libertés) in der Fassung des angegriffenen
    Gesetzes; Art. 21 der Déclaration von 1789; Art. 22 DSGVO
  kernfrage: Darf die Verwaltung eine Einzelfallentscheidung allein auf eine automatisierte Verarbeitung
    stützen, und unter welchen Bedingungen ist das mit dem Gleichheitssatz und dem Recht auf wirksamen
    Rechtsschutz vereinbar?
  ergebnis: 'Verfassungskonform, aber nur unter drei kumulativen Bedingungen. Erstens muss die Entscheidung
    ausdrücklich auf die algorithmische Grundlage hinweisen, und die "principales caractéristiques de
    mise en oeuvre" des Algorithmus müssen dem Betroffenen auf Verlangen mitgeteilt werden können; kann
    die Verwaltung das nicht, ist die automatisierte Entscheidung unzulässig. Zweitens muss ein Verwaltungsrechtsbehelf
    offenstehen, in dem sich die Verwaltung nicht allein auf den Algorithmus stützen darf. Drittens ist
    die automatisierte Entscheidung bei besonderen Datenkategorien ausgeschlossen. Zentral und wörtlich:
    Es dürfen keine Algorithmen verwendet werden, die "susceptibles de réviser eux-mêmes les règles qu''ils
    appliquent, sans le contrôle et la validation du responsable du traitement" sind. Die Verwaltung muss
    die Funktionsweise jederzeit erklären können.

    '
  bedeutung: hoch
  volltext_url: https://www.conseil-constitutionnel.fr/decision/2018/2018765DC.htm
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-loi-informatique-libertes
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  instanzenzug: []
  quelle_tracker: conseil-constitutionnel.fr — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Das ist, soweit ersichtlich, das erste Verfassungsgerichtsurteil weltweit, das lernende
    Systeme aus der Verwaltungsentscheidung ausschließt — sechs Jahre vor der KI-Verordnung und in einer
    Schärfe, die diese nicht erreicht. Art. 14 KI-VO verlangt menschliche Aufsicht; der Conseil verlangt,
    dass das System seine eigenen Regeln nicht verändern darf. Das ist kein Aufsichtserfordernis, sondern
    ein Architekturverbot, und es macht generative oder kontinuierlich nachtrainierte Systeme als alleinige
    Entscheidungsgrundlage in der französischen Verwaltung unzulässig — unabhängig davon, wie gut ihre
    Aufsicht organisiert ist. Die praktische Bedeutung wird regelmäßig unterschätzt: Die Erklärbarkeitsanforderung
    ist nicht als Betroffenenrecht formuliert, sondern als Zulässigkeitsvoraussetzung. Wer den Code nicht
    erklären kann, darf ihn nicht einsetzen. Genau darin liegt die Verbindung zur spanischen BOSCO-Entscheidung:
    Frankreich verbietet den unerklärbaren Algorithmus, Spanien erzwingt seine Offenlegung.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: 'Frankreich passte mit der Loi relative à la protection des données personnelles sein Datenschutzrecht
    an die Datenschutz-Grundverordnung an. Art. 21 dieses Gesetzes änderte Art. 10 der Loi n° 78-17 vom
    6. Januar 1978 und erweiterte die Fälle, in denen eine Entscheidung mit Rechtswirkung gegenüber einer
    Person allein auf eine automatisierte Datenverarbeitung gestützt werden darf: Bei Verwaltungseinzelentscheidungen
    sollte das künftig zulässig sein, sofern der eingesetzte Algorithmus keine sensiblen Daten verarbeitet,
    Verwaltungsrechtsbehelfe offenstehen und über den Einsatz des Algorithmus informiert wird. Am 16.
    Mai 2018 riefen sechzig Senatoren um Bruno Retailleau den Conseil constitutionnel an. Sie machten
    unter anderem geltend, es gebe „selbstlernende" Algorithmen, die die von ihnen angewandten Regeln
    selbst verändern könnten — die Verwaltung wisse dann nicht mehr, auf welcher Grundlage ihre Entscheidung
    tatsächlich ergangen sei.'
  sachverhalt_quelle: volltext
  pruefvermerk:
  - '07.09.2026: Der Eintrag nennt als Antragsteller ''mehr als sechzig Abgeordnete''. Die amtliche Fassung
    schreibt ''Saisine par 60 senateurs'' und durchgaengig ''Les senateurs requerants''. Zu berichtigen.'
- id: fr-2019-cc-778dc
