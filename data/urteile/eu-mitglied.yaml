    ihn als selbständigen Auftragnehmer; er machte geltend, in Wahrheit Arbeitnehmer zu sein. Nach gegenläufigen
    Entscheidungen der Instanzgerichte gelangte die Frage über ein Rechtsmittel zur Vereinheitlichung
    der Rechtsprechung (recurso de casación para la unificación de doctrina) an das Plenum der Sozialkammer
