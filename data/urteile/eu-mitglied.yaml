  sachverhalt: Über die Berechtigung zum bono social eléctrico — einer Ermäßigung auf die Stromrechnung
    für Haushalte in schwieriger Lage — entscheidet die spanische Verwaltung mit der Anwendung BOSCO.
    Die Fundación Ciudadana Civio verlangte nach dem Transparenzgesetz (Ley 19/2013) Zugang zum Programmcode
    dieser Anwendung, um nachvollziehen zu können, wie sie zu ihren Ergebnissen kommt. Das Ministerio
    para la Transición Ecológica y el Reto Demográfico verweigerte den Zugang und berief sich auf das
    Urheberrecht an der Software und auf die öffentliche Sicherheit. Die Vorinstanzen wiesen die Klage
    der Stiftung ab; sie legte Revision zum Tribunal Supremo ein.
