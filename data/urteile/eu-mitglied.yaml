  quelle_tracker: dpa.gr — Entscheidungsseite und amtliches PDF (18_2025 anonym.pdf), beide abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die unspektakulärste und zugleich lehrreichste der drei europäischen DeepSeek-Reaktionen.
    Italien hat die Verarbeitung gesperrt, Irland und andere haben Auskunft verlangt — Griechenland hat
    schlicht die Vertreterbenennung nach Art. 27 DSGVO angeordnet. Das ist der niedrigschwelligste und
    zugleich wirksamste Hebel gegenüber Anbietern ohne EU-Niederlassung: Er schafft eine Zustellanschrift
    und beendet die Möglichkeit, sich auf fehlende Erreichbarkeit zu berufen. Nach der Aufhebung des italienischen
    OpenAI-Bußgeldes durch das Tribunale di Roma — die genau an der Niederlassungsfrage hing — ist das
    die aufsichtsrechtlich klügere erste Maßnahme.

