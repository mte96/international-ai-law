  anspruchsgrundlage: Art. 3 Legge 241/1990; Art. 97 Verfassung; Art. 22 DSGVO; Erwägungsgründe 71 DSGVO
  kernfrage: Welche allgemeinen Grundsätze gelten für die algorithmische Entscheidung im Verwaltungsverfahren?
  ergebnis: 'Der Senat formuliert die drei Grundsätze, die seither die italienische Linie tragen: conoscibilità
    (der Algorithmus muss in allen seinen Bestandteilen erkennbar und verständlich sein, auch für den
    Richter), non esclusività della decisione algoritmica (es muss ein Mensch im Verfahren geben, der
    die Entscheidung kontrolliert, validiert oder verwirft — "human in the loop"), und non discriminazione
    algoritmica (die Verwaltung muss zuverlässige Systeme verwenden, Verzerrungen minimieren und regelmäßig
    überprüfen). Der Consiglio di Stato leitet die Grundsätze ausdrücklich aus Art. 22 DSGVO und aus dem
    nationalen Verwaltungsverfahrensrecht her. Bestätigt und fortgeführt durch Sez. VI, sentenza n. 881
    vom 04.02.2020.

    '
  bedeutung: hoch
  volltext_url: https://mdp.giustizia-amministrativa.it/visualizza/?nodeRef=&schema=cds&nrg=201902936&nomeFile=201908472_11.html&subDir=Provvedimenti
  zusammenfassung_url: ''
  bezug_regelwerke:
