  kernfrage: Ist die befristete Erlaubnis, Bilder aus Videoüberwachung und Drohnen algorithmisch auf vorbestimmte
    Ereignisse auszuwerten, mit dem Recht auf Achtung des Privatlebens vereinbar?
  ergebnis: 'Verfassungskonform mit einem Auslegungsvorbehalt; nichts wurde für verfassungswidrig erklärt.
    Tragend sind die engen Grenzen: Einsatz nur bei Veranstaltungen mit besonderem Gefährdungsrisiko und
    nicht bei bloßem Sachschadensrisiko (Rn. 37); präfektorale Genehmigung mit Begründung, genauen Parametern
    und einer Höchstdauer von einem Monat (Rn. 38-39); ausdrückliches Verbot biometrischer Identifikation
    und Gesichtserkennung sowie jeder Verknüpfung mit anderen Systemen (Rn. 42); ausschließlich automatisierte
    Hinweismeldungen ohne eigene Entscheidungswirkung und ständige menschliche Kontrolle (Rn. 43-45).
    Der Auslegungsvorbehalt (Rn. 39): Der Präfekt muss die Maßnahme unverzüglich beenden, sobald ihre
    Voraussetzungen entfallen; ein bloßes Ermessen zur Aussetzung genügt nicht.

    '
  bedeutung: hoch
  volltext_url: https://www.conseil-constitutionnel.fr/decision/2023/2023850DC.htm
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-loi-2023-380
  - ki-vo-2024-1689
  instanzenzug:
  - fr-2025-cc-878dc
  - fr-2026-cc-915dc
  - fr-2026-ce-nice-vsa
  quelle_tracker: conseil-constitutionnel.fr — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die Entscheidung ist die europäische Blaupause für die algorithmische Videoüberwachung,
    und sie ist strenger als Art. 5 KI-VO. Die KI-Verordnung verbietet die biometrische Fernidentifikation
    in Echtzeit mit Ausnahmen; der Conseil erlaubt die algorithmische Bildauswertung nur als befristetes
    Experiment, ohne jede Biometrie, ohne Verknüpfung und ohne Entscheidungswirkung. Das ist ein anderes
    Regulierungsmodell: nicht Risikoklassifizierung, sondern gesetzliche Einzelerlaubnis mit Verfallsdatum.
    Der Auslegungsvorbehalt aus Rn. 39 ist der Satz, an dem sich die Praxis entscheidet — und er ist genau
    der Punkt, an dem der Conseil d''État 2026 die Gemeinde Nizza gestoppt hat: Wo das Gesetz schweigt,
    gibt es keine Erlaubnis.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: Art. 10 der Loi relative aux jeux Olympiques et Paralympiques de 2024 erlaubte versuchsweise,
    die Bilder aus Videoüberwachungsanlagen und aus Kameras an Luftfahrzeugen algorithmisch auszuwerten,
    um bestimmte vorher festgelegte Ereignisse zu erkennen und zu melden. Die Erprobung sollte bis zum
    31. März 2025 laufen, obwohl die Spiele im September 2024 enden. Welche Ereignisse die Systeme erkennen
    sollen, in welchen Lagen sie eingesetzt werden dürfen und wie die damit betrauten Bediensteten zu
    ermächtigen und zu schulen sind, ließ das Gesetz weitgehend offen. Am 17. April 2023 riefen Abgeordnete
    um Mathilde Panot den Conseil constitutionnel an und rügten neben dem Recht auf Achtung des Privatlebens
    die Bewegungsfreiheit und das Demonstrationsrecht.
  sachverhalt_quelle: volltext
  pruefvermerk:
  - '07.09.2026: Der Eintrag nennt ''Abgeordnete und Senatoren''. Angerufen haben ausweislich der amtlichen
    Fassung nur Abgeordnete um Mathilde Panot. Zu berichtigen.'
- id: fr-2025-cc-878dc
  jurisdiktion: fr
  gericht: Conseil constitutionnel
  instanz: verfassungsgericht
  aktenzeichen: Décision n° 2025-878 DC
  ecli: ECLI:FR:CC:2025:2025.878.DC
  datum: 2025-04-24
  parteien:
    klaeger: Abgeordnete und Senatoren
    beklagter: Loi relative au renforcement de la sûreté dans les transports
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  anspruchsgrundlage: Art. 45 der Verfassung (Verbot des cavalier législatif); Art. 15 des angegriffenen
    Gesetzes
  kernfrage: Durfte der Gesetzgeber die Verlängerung des Experiments mit algorithmischer Videoüberwachung
    über einen Änderungsantrag in ein Gesetz über die Sicherheit im öffentlichen Verkehr einfügen?
  ergebnis: 'Nein — aus rein verfahrensrechtlichen Gründen. Der Conseil constitutionnel zensiert Art.
    15, der die Experimentierklausel des Art. 10 der Loi JO 2023 verlängert hätte, als cavalier législatif:
    Die Bestimmung war im ursprünglichen Senatsentwurf nicht enthalten und weist zu dessen Vorschriften
    "aucun lien, même indirect" auf (Rn. 134-138). Sie ist deshalb "selon une procédure contraire à la
    Constitution" eingefügt worden. Ebenso zensiert wurden die Art. 5, 12 und 22. Eine materielle Prüfung
    der algorithmischen Videoüberwachung fand nicht statt.

    '
  bedeutung: mittel
  volltext_url: https://www.conseil-constitutionnel.fr/decision/2025/2025878DC.htm
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-loi-2023-380
  - fr-loi-2026-798
  instanzenzug:
  - fr-2023-cc-850dc
  - fr-2026-cc-915dc
  - fr-2026-ce-nice-vsa
  quelle_tracker: conseil-constitutionnel.fr — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Eine der folgenreichsten Entscheidungen dieses Feldes, obwohl sie inhaltlich nichts
    sagt. Mit dem Ablauf des 31.03.2025 endete die Experimentierklausel; neue präfektorale Genehmigungen
    waren bis zum Inkrafttreten des RIPOST-Gesetzes 2026 nicht mehr möglich. Genau diese Lücke hat der
    Conseil d''État in der Sache Nizza als verbindlich behandelt. Der Fall ist ein Lehrstück darüber,
    dass Verfahrensrecht in der Technologieregulierung härter wirkt als Grundrechtsdogmatik: Nicht die
    Verhältnismäßigkeit hat die algorithmische Videoüberwachung ein Jahr lang gestoppt, sondern Art. 45
    der Verfassung. Anmerkung zur Randnummernzählung: Die Prüfung des Art. 15 steht in Rn. 134-138, nicht
    — wie gelegentlich zitiert — bei Rn. 130 ff.; dort geht es um Art. 14 (Kameras im städtischen Verkehr).

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
- id: fr-2026-cc-915dc
  jurisdiktion: fr
  gericht: Conseil constitutionnel
  instanz: verfassungsgericht
  aktenzeichen: Décision n° 2026-915 DC
  ecli: null
  datum: 2026-08-14
  parteien:
    klaeger: Abgeordnete und Senatoren
    beklagter: Loi visant à offrir des réponses immédiates aux phénomènes troublant l'ordre public, la
      sécurité et la tranquillité de nos concitoyens (RIPOST)
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  anspruchsgrundlage: Art. 45 der Verfassung; Art. 8 der Déclaration von 1789 (ne bis in idem, Erforderlichkeit
    der Strafen)
  kernfrage: Halten die Vorschriften des RIPOST-Gesetzes — darunter die Verlängerung und Ausweitung der
    algorithmischen Videoüberwachung bis 2030 — der verfassungsgerichtlichen Prüfung stand?
  ergebnis: 'Teilweise verfassungswidrig, die Bestimmungen zur algorithmischen Videoüberwachung bleiben
    aber unangetastet. Für verfassungswidrig erklärt wurden unter anderem Art. 1 Abs. I und Abs. III Nr.
    3 Unterabs. 2 (Schließung von Geschäften, Ordnungswidrigkeiten), Art. 7 Abs. I Nr. 1 und Nr. 13 (Fahrzeugkontrolle
    und -vernichtung) sowie Art. 14 Abs. II (Doppelbestrafung). Die algorithmische Videoüberwachung erscheint
    nur mittelbar: In den Randnummern 187-189 zieht der Conseil den Art. 19 des ursprünglichen Regierungsentwurfs,
    der das Regime der vidéosurveillance algorithmique änderte, als Anknüpfungspunkt heran, um andere
    Bestimmungen gegen den Vorwurf des cavalier législatif zu verteidigen. Die Antragsteller hatten die
    VSA-Artikel nicht angegriffen; eine materielle Prüfung fand daher erneut nicht statt.

    '
  bedeutung: mittel
  volltext_url: https://www.conseil-constitutionnel.fr/decision/2026/2026915DC.htm
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-loi-2026-798
  - fr-loi-2023-380
  - ki-vo-2024-1689
  instanzenzug:
  - fr-2023-cc-850dc
  - fr-2025-cc-878dc
  - fr-2026-ce-nice-vsa
  quelle_tracker: conseil-constitutionnel.fr — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Der eigentliche Befund ist ein Nichtereignis: Die dauerhafte Ausweitung der algorithmischen
    Videoüberwachung bis 2030 ist ohne materielle Verfassungsprüfung in Kraft getreten, weil niemand sie
    angegriffen hat. Zwischen 2023 und 2026 hat sich die Kontrolldichte damit umgekehrt — 2023 wurde die
    Experimentierklausel mit einem Katalog von Vorbehalten versehen, 2026 wird ihre Verstetigung nicht
    geprüft. Wer die Wirksamkeit verfassungsgerichtlicher Technologiekontrolle beurteilen will, sollte
    diese Kette lesen: Sie hängt vollständig davon ab, was die Antragsteller in ihre saisine schreiben.
    Der Randnummernbefund ist zudem ein Beleg für die Divergenz in den Materialien: Der Senatsbericht
    spricht bei der VSA von Art. 14, der Conseil ausdrücklich vom "article 19 du projet de loi initial".
    Maßgeblich ist der Entscheidungstext.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
- id: fr-2026-ce-nice-vsa
  jurisdiktion: fr
  gericht: Conseil d'État, 10ème et 9ème chambres réunies
  instanz: erstinstanzlich
  aktenzeichen: n° 506370
  ecli: ECLI:FR:CECHR:2026:506370.20260130
  datum: 2026-01-30
  parteien:
    klaeger: Commune de Nice
    beklagter: Commission nationale de l'informatique et des libertés (CNIL)
  status: rechtskraeftig
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  - datenschutz
  anspruchsgrundlage: Art. L. 251-2 code de la sécurité intérieure; DSGVO
  kernfrage: Erlaubt die Ermächtigung zur Videoüberwachung öffentlicher Wege in Art. L. 251-2 code de
    la sécurité intérieure auch die algorithmische, systematische und automatisierte Auswertung der erhobenen
    Bilder?
  ergebnis: 'Nein. Der Conseil d''État weist die Klage der Gemeinde Nizza gegen die Stellungnahme der
    CNIL zum System "zone intrusion entrées des écoles" (automatische Erkennung unerlaubten Parkens vor
    Schulen) ab. Tragend ist der Satz: "les dispositions précitées de l''article L. 251-2 du code de la
    sécurité intérieure, si elles permettent la mise en oeuvre de systèmes de vidéosurveillance des voies
    publiques, ne sauraient, dans leur silence, être interprétées comme autorisant la mise en oeuvre de
    traitements algorithmiques permettant une analyse systématique et automatisée des images collectées."
    Die CNIL habe zu Recht festgestellt, dass ein solches System außerhalb der befristeten Experimentierklausel
    keine Rechtsgrundlage hat. Vorsitz: M. Pierre Collin.

    '
  bedeutung: hoch
  volltext_url: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2026-01-30/506370
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-loi-2023-380
  - fr-loi-2026-798
  - ki-vo-2024-1689
  - dsgvo-schnittstelle
  instanzenzug:
  - fr-2023-cc-850dc
  - fr-2025-cc-878dc
  - fr-2026-cc-915dc
  quelle_tracker: conseil-etat.fr ArianeWeb — Volltext abgerufen; korrigiert die Formationsangabe in 103_frankreich.yaml
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die wichtigste europäische Entscheidung zur algorithmischen Videoüberwachung — und
    ihre Bedeutung liegt in einer Auslegungsregel, nicht in einer Grundrechtsabwägung. Der Conseil d''État
    sagt: Aus dem Schweigen des Gesetzes folgt keine Erlaubnis. Damit steht das französische Modell als
    Gegenfigur zur KI-Verordnung: Diese verbietet bestimmte Praktiken und erlaubt den Rest unter Auflagen;
    Frankreich erlaubt nichts, was das Gesetz nicht ausdrücklich erlaubt. Für Kommunen in der EU, die
    KI-gestützte Kameraanalyse auf Art. 6 Abs. 1 lit. e DSGVO stützen wollen, ist das die schärfste denkbare
    Warnung: Die DSGVO-Rechtsgrundlage ersetzt die fehlende fachgesetzliche Ermächtigung nicht. ABWEICHUNG:
    103_frankreich.yaml führt die Entscheidung unter "4e et 1re chambres réunies". Der amtliche Text nennt
    die 10ème und 9ème chambres réunies. Der ECLI stimmt überein; die Formationsangabe in 103_frankreich.yaml
    ist falsch.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: Die Gemeinde Nizza betreibt eine Videoüberwachung des öffentlichen Raums und wollte deren
    Bilder algorithmisch auswerten lassen — mit den Verarbeitungen „franchissement de ligne" und „zone
    d'intrusion", darunter das Modul „zone intrusion entrées des écoles", das unerlaubtes Parken vor Schulen
    automatisch erkennen soll. Nach einer Kontrolle in den Räumen der Gemeinde am 5. April 2023 forderte
    die Präsidentin der Commission nationale de l'informatique et des libertés die Gemeinde am 13. November
    2024 auf, für diese Verarbeitungen eine Datenschutz-Folgenabschätzung vorzulegen und die Vorhaben
    nach Art. 90 der Loi vom 6. Januar 1978 der CNIL zur Stellungnahme zu unterbreiten. In ihrer Délibération
    Nr. 2025-032 vom 15. Mai 2025 kam die CNIL zu dem Ergebnis, das Modul „zone intrusion entrées des
    écoles" sei nach geltendem Recht nicht zulässig. Am 18. Juli 2025 erhob die Gemeinde Nizza dagegen
    Anfechtungsklage (recours pour excès de pouvoir) zum Conseil d'État.
  sachverhalt_quelle: volltext
- id: it-2026-garante-character-ai
  jurisdiktion: it
  gericht: Garante per la protezione dei dati personali
  instanz: behoerde
  aktenzeichen: Provvedimento del 3 luglio 2026, registro dei provvedimenti n. 487 (docweb 10269571)
  ecli: null
  datum: 2026-07-03
  parteien:
    klaeger: Garante per la protezione dei dati personali
    beklagter: Character Technologies, Inc.
  status: erledigt
  themenachsen:
  - datenschutz
  - gpai
  - grundrechte
  - content
  anspruchsgrundlage: Art. 5 Abs. 2, Art. 12, Art. 13, Art. 14, Art. 21, Art. 24, Art. 25, Art. 27, Art.
    35 DSGVO; d.lgs. 196/2003
  kernfrage: Welche Informations-, Altersverifikations- und Risikobewertungspflichten treffen den Anbieter
    eines Companion-Chatbots, und muss er die betroffenen Personen über das Vortraining der zugrunde liegenden
    Modelle nach Art. 14 DSGVO unterrichten?
  ergebnis: 'Geldbuße von 158.000 Euro nebst Anordnungen. Festgestellt wurden: unklare, unvollständige
    und nicht verständliche Informationen zu den Verarbeitungen (Art. 12, 13, 14 DSGVO); die unterbliebene
    Unterrichtung italienischer Betroffener über das Vortraining der KI-Modelle (Art. 14 DSGVO); unzureichende
    technische Maßnahmen zur Altersverifikation im Zeitraum vom 08.04.2024 bis 08.04.2025 (Art. 24, 25
    DSGVO); die verspätete Datenschutz-Folgenabschätzung (Art. 35 DSGVO, erst November 2024) und die verspätete
    Benennung des EU-Vertreters (Art. 27 DSGVO, erst Mai 2025). Angeordnet wurden ein funktionsfähiges
    Altersverifikationssystem, ein wirksamer "cooling-off"-Mechanismus gegen die Neuanmeldung gesperrter
    Minderjähriger, die Voreinstellung der Profile Minderjähriger auf privat und ein Umsetzungsbericht
    binnen 120 Tagen. Bekanntgabe durch Pressemitteilung am 09.07.2026.

    '
  bedeutung: hoch
  volltext_url: https://www.garanteprivacy.it/garante/doc.jsp?ID=10269571
  zusammenfassung_url: https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10269594
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  - dsa-2022-2065
  instanzenzug: []
  quelle_tracker: garanteprivacy.it — Provvedimento (doc.jsp?ID=10269571) und Pressemitteilung (docweb
    10269594), beide abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Der juristisch bemerkenswerte Teil ist nicht der Minderjährigen- schutz, sondern
    der eigenständige Vorwurf nach Art. 14 DSGVO für das Vortraining. Der Garante behandelt das Pre-Training
    damit als eine Verarbeitung, über die die Betroffenen zu unterrichten sind — und umgeht die viel schwierigere
    Frage nach der Rechtsgrundlage, indem er bei der Information ansetzt. Das ist dogmatisch eleganter
    als die OpenAI-Entscheidung von 2024 und robuster gegen die Zuständigkeitseinwände, die diese zu Fall
    gebracht haben: Der EU-Vertreter war hier erst im Mai 2025 benannt, eine Hauptniederlassung im EWR
    gibt es nicht. Auffällig ist, was fehlt: Die KI-Verordnung wird im Provvedimento nicht zitiert, obwohl
    Companion-Chatbots mit Minderjährigen der Sache nach im Anwendungsbereich von Art. 5 Abs. 1 lit. b
    KI-VO (Ausnutzung altersbedingter Schutzbedürftigkeit) liegen. Die Aufsicht arbeitet weiter mit der
    DSGVO, weil sie sie kennt und weil die Sanktionsarchitektur der KI-VO noch nicht steht.

    '
  quelle_art: amtlich
  sachverhalt: Die Character Technologies, Inc. betreibt unter Character.AI einen Dienst, auf dem Nutzer
    fortlaufend Gespräche mit Begleit-Chatbots führen; er wurde auch von Minderjährigen in Italien genutzt.
    Das Unternehmen hat keine Hauptniederlassung im Europäischen Wirtschaftsraum; einen Vertreter in der
    Union benannte es erst im Mai 2025, eine Datenschutz-Folgenabschätzung erstellte es erst im November
    2024. Zwischen dem 8. April 2024 und dem 8. April 2025 arbeitete der Dienst ohne wirksame technische
    Altersprüfung. Die Personen, deren Daten in das Vortraining der zugrunde liegenden Modelle eingeflossen
    waren, wurden darüber nicht unterrichtet, und die Hinweise zu den Verarbeitungen waren unvollständig.
    Der Garante per la protezione dei dati personali leitete ein Verfahren ein.
  sachverhalt_quelle: eintrag
- id: it-2026-garante-rti-mentana
  jurisdiktion: it
  gericht: Garante per la protezione dei dati personali
  instanz: behoerde
  aktenzeichen: Provvedimento del 23 luglio 2026, registro dei provvedimenti n. 577 (docweb 10281021)
  ecli: null
  datum: 2026-07-23
  parteien:
    klaeger: Enrico Mentana (reclamante)
    beklagter: R.T.I. — Reti Televisive Italiane S.p.A.
  status: erledigt
  themenachsen:
  - datenschutz
  - content
  - grundrechte
  - haftung
  anspruchsgrundlage: Art. 5 Abs. 1 lit. a DSGVO (Rechtmäßigkeit, Verarbeitung nach Treu und Glauben,
    Transparenz); Art. 25 DSGVO; Art. 137 Codice privacy (journalistische Verarbeitung)
  kernfrage: Ist die satirische Verwendung eines mit KI erzeugten Abbilds und einer synthetischen Stimme
    einer realen Person durch das Medienprivileg gedeckt, wenn die Fälschung realistisch wirkt und der
    Hinweis auf ihre Künstlichkeit für das Publikum nicht deutlich erkennbar ist?
  ergebnis: 'Nein. Der Garante verwarnt R.T.I. wegen Verletzung der Grundsätze der Rechtmäßigkeit, der
    Verarbeitung nach Treu und Glauben und der Transparenz und untersagt jede weitere Verarbeitung der
    Daten des Beschwerdeführers in der beanstandeten Form ("divieto di ulteriore trattamento dei dati
    del reclamante con le modalità sopra descritte"). Gegenstand waren Beiträge der Sendung "Striscia
    la Notizia", in denen Stimme und Bild des Journalisten Enrico Mentana mit KI so manipuliert wurden,
    dass er im Studio des TG La7 Nachrichten zu verlesen schien, die er nie gesprochen hat. Tragend: die
    realistische Ausführung, die fehlende Erkennbarkeit der Manipulation und die für Fernsehzuschauer
    wie für Social-Media-Nutzer unzureichend deutlichen Hinweise. Bekanntgabe am 07.08.2026.

    '
  bedeutung: hoch
  volltext_url: https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10281021
  zusammenfassung_url: https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10281135
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  - dsa-2022-2065
  instanzenzug: []
  quelle_tracker: garanteprivacy.it — Provvedimento (docweb 10281021) und Pressemitteilung (docweb 10281135),
    beide abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die erste europäische Aufsichtsentscheidung, die satirische Deepfakes an der Kennzeichnungsfrage
    scheitern lässt — und sie verschiebt den Streit von der Persönlichkeitsrechts- in die Datenschutzdogmatik.
    Der Garante prüft nicht, ob die Satire zulässig ist, sondern ob die Verarbeitung transparent war.
    Damit wird Art. 50 Abs. 4 KI-VO, der die Kennzeichnung von Deepfakes verlangt und für Kunst und Satire
    eine Erleichterung vorsieht, faktisch über Art. 5 Abs. 1 lit. a DSGVO vorweggenommen — und strenger
    gefasst: Nicht das Vorhandensein eines Hinweises zählt, sondern seine Wahrnehmbarkeit für das konkrete
    Publikum, und zwar getrennt für Fernsehen und soziale Netzwerke. Für die deutsche Praxis ist das die
    relevanteste Vorlage zur Frage, wie ein KI-Kennzeichnungshinweis beschaffen sein muss. Die Antwort
    des Garante ist unbequem: Ein Hinweis, den man übersehen kann, ist keiner.

    '
  quelle_art: amtlich
  sachverhalt: Die von R.T.I. — Reti Televisive Italiane S.p.A. verantwortete Sendung „Striscia la Notizia"
    zeigte Beiträge, in denen Stimme und Bild des Journalisten Enrico Mentana mit KI so bearbeitet waren,
    dass er im Studio des TG La7 Nachrichten zu verlesen schien, die er nie gesprochen hat. Die Nachbildung
    war realistisch ausgeführt. Die Beiträge liefen nicht nur im Fernsehen, sondern auch in sozialen Netzwerken
    weiter. Mentana wandte sich mit einer Beschwerde (reclamo) an den Garante per la protezione dei dati
    personali und beanstandete, für das Publikum sei nicht deutlich erkennbar, dass es sich um eine Fälschung
    handle.
  sachverhalt_quelle: eintrag
