  anspruchsgrundlage: Art. 1 und 2 Legge 633/1941 (Legge sul diritto d'autore); Art. 6 LdA
  kernfrage: Schließt der Umstand, dass ein Bild mit Hilfe von Software erzeugt wurde, seine Schutzfähigkeit
    als Werk aus, und wer trägt insoweit die Darlegungslast?
  ergebnis: 'Der Einsatz von Software schließt die Schutzfähigkeit nicht von vornherein aus. Entscheidend
    ist der Grad, in dem das Werkzeug die schöpferische Leistung ersetzt hat; das Berufungsgericht hätte
    prüfen müssen, in welchem Umfang die Software den kreativen Beitrag der Urheberin absorbiert hat,
    statt die Schöpfungshöhe pauschal zu bejahen oder zu verneinen. Die Sache wurde zurückverwiesen. Hintergrund
    war die Verwendung eines digital erzeugten Blumenbildes in der Bühnengestaltung des Sanremo-Festivals.

    '
  bedeutung: mittel
  volltext_url: null
  zusammenfassung_url: ''
  bezug_regelwerke:
  - it-legge-633-1941
  - dsm-rl-2019-790
  instanzenzug: []
  quelle_tracker: Eigenes Fachwissen; in dieser Sitzung NICHT am amtlichen Text gegengeprüft
  verifiziert: false
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die Entscheidung wird häufig als "KI-Urheberrechtsurteil" zitiert, was sie nicht
    ist: Es ging um ein fraktal erzeugtes Bild, nicht um generative KI. Interessant ist sie trotzdem,
    weil die Cassazione die Frage richtig stellt — nicht "hat eine Maschine mitgewirkt", sondern "in welchem
    Umfang hat das Werkzeug die schöpferische Leistung absorbiert". Das ist derselbe Maßstab, den das
    US Copyright Office 2025 mit dem Kriterium der "human contribution" formuliert hat, nur vier Jahre
    früher und ohne den Umweg über eine Registrierungspraxis.

    '
  pruefvermerk:
  - NICHT VERIFIZIERT — italgiure.giustizia.it nicht erreichbar. Nummer, Datum, Sezione und Parteibezeichnung
    sind mit Vorbehalt zu behandeln; insbesondere die Parteibezeichnung ist unsicher. Der Eintrag ist
    aufgenommen, weil er die einzige mir bekannte höchstrichterliche italienische Aussage zur Schutzfähigkeit
    softwaregenerierter Bilder ist, und ist vor einer Veröffentlichung zwingend nachzuverifizieren.
  quelle_art: fehlt
- id: gr-2022-apdpx-clearview
  jurisdiktion: gr
  gericht: Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (Ολομέλεια)
  instanz: behoerde
  aktenzeichen: Απόφαση 35/2022, Αριθ. Πρωτ. 1809
  ecli: null
  datum: 2022-07-13
  parteien:
    klaeger: Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (auf Beschwerde von Homo Digitalis u.a.)
    beklagter: Clearview AI, Inc.
