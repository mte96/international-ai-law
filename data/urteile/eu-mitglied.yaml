- id: it-2021-cass-mevaluate
  jurisdiktion: it
  gericht: Corte suprema di cassazione, Sezione I civile
  instanz: revision
  aktenzeichen: Ordinanza n. 14381 del 25 maggio 2021 (camera di consiglio della prima sezione civile
    del 24 marzo 2021)
  ecli: null
  datum: 2021-05-25
  parteien:
    klaeger: Garante per la protezione dei dati personali (ricorrente)
    beklagter: Associazione Mevaluate Onlus (controricorrente)
  status: rechtskraeftig
