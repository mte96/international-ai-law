  parteien:
    klaeger: Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (Untersuchung von Amts wegen)
    beklagter: Υπουργείο Μετανάστευσης και Ασύλου (Ministerium für Migration und Asyl)
  status: erledigt
  themenachsen:
