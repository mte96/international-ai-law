  quelle_tracker: María Emilia Casas Baamonde, Revista de Jurisprudencia Laboral 8/2024 (amtliche Zeitschrift
    der Agencia Estatal BOE) — abgerufen und ausgewertet
  verifiziert: false
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Der interessante Teil ist die Divergenz, nicht das Ergebnis. In Spanien stehen seit
    2024 zwei Gerichtsbarkeiten nebeneinander: die Sozialgerichtsbarkeit, die seit 2020 die Arbeitnehmereigenschaft
    bejaht, und die Verwaltungsgerichtsbarkeit, die die gesetzliche Vermutung als widerlegbar behandelt
    und im Einzelfall verneint hat. Wer über die Wirksamkeit algorithmischer Beschäftigungsvermutungen
    schreibt, sollte diese Divergenz nicht glätten: Sie zeigt, dass die Vermutungsregel den Streit nicht
    entscheidet, sondern nur verschiebt — von der Frage, ob der Algorithmus steuert, zu der Frage, wer
    beweist, wie er im konkreten Zeitraum gesteuert hat.

    '
