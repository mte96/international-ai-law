  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die italienische Parallele zur deutschen SCHUFA-Linie, und sie fällt strenger aus.
    Der Gerichtshof hat in Dun & Bradstreet (C-203/22) entschieden, dass der Verantwortliche das Verfahren
    so erläutern muss, dass der Betroffene erkennt, wie eine Änderung seiner Daten das Ergebnis verändert
    hätte. Der Garante zieht daraus für den Energiemarkt die Konsequenz und sanktioniert nicht nur den
    Scoring-Anbieter, sondern auch die Versorger, die den Score verwenden — beide Seiten der SCHUFA-Konstellation
    zugleich. Das ist die konsequente Umsetzung der Zurechnungsfigur aus C-634/21 und der praktisch wichtigste
    Hinweis für Unternehmen, die Bonitätsscores einkaufen: Der Einkauf befreit nicht von der Erläuterungspflicht.

    '
