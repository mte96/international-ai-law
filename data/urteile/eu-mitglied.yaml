  kernfrage: Umfasst das Recht auf Zugang zu öffentlichen Informationen den Quellcode einer Verwaltungsanwendung,
    die über die Berechtigung eines Bürgers entscheidet, und kann der Urheberrechtsschutz an dieser Software
    den Zugang ausschließen?
  ergebnis: 'Ja zum Zugang, nein zum Urheberrechtseinwand. Der Tribunal Supremo hebt die abweisenden Vorentscheidungen
    auf und verurteilt die Verwaltung, der Klägerin den Programmcode der Anwendung BOSCO herauszugeben,
    die über die Berechtigung zum bono social eléctrico entscheidet. Tragend ist, dass der Quellcode eines
    Systems, das automatisiert über Rechte von Bürgern befindet, Teil der Entscheidungslogik und damit
    ein Verwaltungsdokument ist; Art. 157 Abs. 2 Ley 40/2015, der die Verwaltungen zur Bereitstellung
    ihrer Anwendungen an andere Verwaltungen verpflichtet, belegt, dass der Code vorhanden, dokumentiert
    und übertragbar ist. Der Einwand des Urheberrechts kann die Transparenzpflicht nicht ausschalten,
    soweit es um die Entscheidungslogik geht; der Einwand der öffentlichen Sicherheit greift nicht pauschal,
    sondern nur nach konkreter Abwägung im Einzelfall.

    '
