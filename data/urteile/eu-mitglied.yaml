  anspruchsgrundlage: Art. 154 Loi de finances pour 2020; Art. 2 der Déclaration von 1789 (Recht auf Achtung
    des Privatlebens); Art. 8 (Erforderlichkeit von Strafen)
  kernfrage: Darf die Finanz- und Zollverwaltung öffentlich zugängliche Inhalte sozialer Netzwerke automatisiert
    und massenhaft erheben und algorithmisch auswerten, um Steuer- und Zollverstöße aufzuspüren?
  ergebnis: 'Im Grundsatz ja, aber mit einem Katalog von Auslegungsvorbehalten und einer Teilzensur. Verfassungskonform
    nur unter der Bedingung, dass ausschließlich frei zugängliche und vom Nutzer bewusst öffentlich gemachte
    Inhalte erhoben werden, dass besondere Datenkategorien nicht verarbeitet werden, dass keine Gesichtserkennung
    eingesetzt wird, dass nur eigens ermächtigte Bedienstete ab einer bestimmten Besoldungsstufe Zugang
    erhalten, dass nicht einschlägige Daten binnen fünf Tagen und die übrigen spätestens nach dreißig
    Tagen gelöscht werden. Teilweise verfassungswidrig ist die Erstreckung auf bloße Verspätungen bei
    der Steuererklärung: Für diesen Verstoß ist die massenhafte automatisierte Erhebung unverhältnismäßig.

    '
  bedeutung: hoch
  volltext_url: https://www.conseil-constitutionnel.fr/decision/2019/2019796DC.htm
  zusammenfassung_url: ''
  bezug_regelwerke:
  - ki-vo-2024-1689
  - dsgvo-schnittstelle
  instanzenzug: []
  quelle_tracker: conseil-constitutionnel.fr — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die unterschätzteste der französischen KI-Entscheidungen. Sie enthält bereits 2019
    die Prüfstruktur, die die KI-Verordnung erst 2024 kodifiziert: Zweckbindung, Verbot der Gesichtserkennung,
    Zugriffsbeschränkung, kurze Löschfristen, Verhältnismäßigkeit zwischen Schwere des Verstoßes und Eingriffstiefe.
    Die Teilzensur ist dabei der eigentlich interessante Satz: Nicht die Technik ist unverhältnismäßig,
    sondern ihr Einsatz für Bagatellen. Das ist eine Verhältnismäßigkeitsprüfung nach Anlasstiefe, keine
    nach Risikoklasse — und damit ein Prüfmaßstab, den die KI-VO gerade nicht hat.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: Art. 154 der Loi de finances pour 2020 ermächtigte Finanz- und Zollverwaltung, mit informatisierten
    und automatisierten Mitteln die zugänglichen Inhalte auf den Websites von Vermittlungsplattformen
    zu erheben und auszuwerten — Plattformen also, über die Waren verkauft, Dienstleistungen erbracht
    oder Inhalte, Güter und Dienste getauscht oder geteilt werden. Die Verwaltung sollte damit undifferenziert
    große Datenmengen über eine Vielzahl von Personen einsammeln, sie zusammenführen und miteinander abgleichen
    dürfen, um Steuer- und Zollverstöße aufzuspüren. Erfasst waren dabei auch bloße Verspätungen bei der
    Abgabe der Steuererklärung. Abgeordnete und Senatoren riefen den Conseil constitutionnel an und machten
    geltend, das greife in das Recht auf Achtung des Privatlebens und in die Meinungs- und Kommunikationsfreiheit
    ein.
  sachverhalt_quelle: volltext
- id: fr-2019-ce-unef-parcoursup
  jurisdiktion: fr
  gericht: Conseil d'État, 4ème et 1ère chambres réunies
  instanz: revision
  aktenzeichen: n° 427916
  ecli: null
  datum: 2019-06-12
  parteien:
    klaeger: Université des Antilles
    beklagter: Union nationale des étudiants de France (UNEF)
  status: rechtskraeftig
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  anspruchsgrundlage: Art. L. 612-3 code de l'éducation (Sonderregelung); Art. L. 311-1 code des relations
    entre le public et l'administration (allgemeines Zugangsrecht)
  kernfrage: Kann ein Dritter, der sich nicht selbst beworben hat, Zugang zu den Bewertungskriterien und
    den lokalen Algorithmen verlangen, mit denen eine Hochschule im Verfahren Parcoursup über Bewerbungen
    entscheidet?
  ergebnis: 'Nein. Der Conseil d''État hebt das Urteil des Verwaltungsgerichts auf und weist den Antrag
    der UNEF ab. Die Sonderregelung des code de l''éducation, die den Zugang zu den Beratungsunterlagen
    der Auswahlkommissionen auf die Bewerber selbst und auf ihre eigene Bewerbung beschränkt, sei als
    Abweichung von Art. L. 311-1 CRPA gewollt: "Les dispositions spéciales doivent ainsi être regardées
    comme ayant entendu déroger, notamment, aux dispositions de l''article L. 311-1 du code des relations
    entre le public et l''administration." Der Gewerkschaft fehle als Nichtbewerberin der Zugangsanspruch.

    '
  bedeutung: hoch
  volltext_url: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2019-06-12/427916
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-parcoursup
  instanzenzug:
  - fr-2020-cc-834qpc
  quelle_tracker: conseil-etat.fr ArianeWeb — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die Entscheidung ist das negative Gegenstück zu BOSCO und zeigt, wie fragil Algorithmentransparenz
    im Verwaltungsrecht ist: Sie scheitert nicht an der Technik, sondern an der Klagebefugnis. Der Conseil
    d''État hat den Zugang nicht inhaltlich verweigert, sondern ihn auf die individuell Betroffenen zugeschnitten
    — mit der praktischen Folge, dass niemand das Gesamtsystem prüfen kann, weil jeder Bewerber nur seinen
    eigenen Ausschnitt sieht. Genau diese Lücke hat der Conseil constitutionnel zehn Monate später mit
    einem Auslegungsvorbehalt geschlossen (fr-2020-cc-834qpc). Der Instanzenzug ist deshalb die eigentliche
    Information: Ein Höchstgericht schließt den kollektiven Zugang aus, das Verfassungsgericht macht ihn
    nachträglich wieder auf.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: Über die Plattform Parcoursup bewerben sich Studieninteressierte in Frankreich um Studienplätze;
    die Hochschulen prüfen die Bewerbungen nach eigenen, lokal festgelegten Verfahren. Die Studierendengewerkschaft
    Union nationale des étudiants de France verlangte von der Université des Antilles, ihr die algorithmischen
    Verfahren offenzulegen, die diese bei der Bearbeitung der Bachelor-Bewerbungen einsetzte, samt den
    zugehörigen Quellcodes. Die Universität schwieg; aus diesem Schweigen entstand am 18. August 2018
    eine stillschweigende Ablehnung. Das Verwaltungsgericht Guadeloupe hob sie mit Urteil Nr. 1801094
    vom 4. Februar 2019 auf und gab der Universität auf, die Unterlagen binnen eines Monats herauszugeben,
    unter Androhung eines Zwangsgelds von 100 Euro je Tag. Die Universität legte am 12. Februar 2019 Kassationsbeschwerde
    zum Conseil d'État ein.
  sachverhalt_quelle: volltext
- id: fr-2020-cc-834qpc
  jurisdiktion: fr
  gericht: Conseil constitutionnel
  instanz: verfassungsgericht
  aktenzeichen: Décision n° 2020-834 QPC
  ecli: ECLI:FR:CC:2020:2020.834.QPC
  datum: 2020-04-03
  parteien:
    klaeger: Union nationale des étudiants de France (UNEF)
    beklagter: Art. L. 612-3 code de l'éducation
  status: rechtskraeftig
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  anspruchsgrundlage: Art. L. 612-3 Abs. 6 code de l'éducation; Art. 15 der Déclaration von 1789 (Rechenschaftspflicht
    der Verwaltung)
  kernfrage: Verstößt der Ausschluss Dritter vom Zugang zu den Bewertungskriterien und Algorithmen der
    Hochschulen im Verfahren Parcoursup gegen das aus Art. 15 der Erklärung von 1789 folgende Recht auf
    Zugang zu Verwaltungsinformationen?
  ergebnis: 'Verfassungskonform, aber nur mit einem Auslegungsvorbehalt (Rn. 17): Die Vorschrift darf
    nicht so gelesen werden, dass die Hochschulen davon befreit wären, nach Abschluss des Zulassungsverfahrens
    die Kriterien zu veröffentlichen, nach denen die Bewerbungen geprüft wurden, und anzugeben, in welchem
    Umfang dabei Algorithmen eingesetzt wurden. Der Schutz der Beratungsvertraulichkeit der Auswahlkommissionen
    rechtfertige die Geheimhaltung während des Verfahrens, nicht aber die vollständige und dauerhafte
    Intransparenz gegenüber der Öffentlichkeit.

    '
  bedeutung: hoch
  volltext_url: https://www.conseil-constitutionnel.fr/decision/2020/2020834QPC.htm
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-parcoursup
  instanzenzug:
  - fr-2019-ce-unef-parcoursup
  quelle_tracker: conseil-constitutionnel.fr — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Der Auslegungsvorbehalt ist juristisch die elegantere Lösung als ein Individualanspruch:
    Er verlagert die Transparenz vom Zugang zur Veröffentlichung und vom Verfahren in die Nachschau. Damit
    entsteht ein Modell, das für algorithmische Verwaltung insgesamt trägt — Vertraulichkeit während der
    laufenden Entscheidung, Rechenschaft nach ihrem Abschluss. Wer über Art. 86 KI-VO und die Erläuterungspflicht
    bei Hochrisikosystemen nachdenkt, findet hier die zeitliche Staffelung, die dort fehlt. Übersehen
    wird meist, dass der Vorbehalt nur die Kriterien und das "in welchem Umfang" erfasst, nicht den Algorithmus
    selbst. Es ist das genaue Gegenteil der spanischen BOSCO-Lösung: Frankreich gibt die Beschreibung,
    Spanien den Code.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: Die Loi n° 2018-166 vom 8. März 2018 richtete in Art. L. 612-3 code de l'éducation ein
    nationales Vorauswahlverfahren für die Studienzulassung ein — Parcoursup. Der letzte Absatz dieser
    Vorschrift bestimmte zum Schutz der Beratungsvertraulichkeit der prüfenden Kommissionen, dass die
    allgemeinen Transparenzpflichten des code des relations entre le public et l'administration bereits
    als erfüllt gelten, sobald die Bewerber darauf hingewiesen werden, dass sie auf Antrag Auskunft über
    die Kriterien und Modalitäten der Prüfung ihrer eigenen Bewerbung erhalten können. Dritte — etwa Verbände
    — bekamen damit weder die Kriterien noch die Angabe, in welchem Umfang Algorithmen eingesetzt worden
    waren. Die Union nationale des étudiants de France warf in ihrem Verfahren gegen die Université des
    Antilles die Frage der Verfassungsmäßigkeit dieser Vorschrift auf; der Conseil d'État legte sie mit
    den Entscheidungen Nr. 433296 und 433297 vom 15. Januar 2020 dem Conseil constitutionnel vor, wo sie
    am 16. Januar 2020 einging.
  sachverhalt_quelle: volltext
