  ergebnis: 'Nein. Die Audiencia Nacional hebt die Entscheidung des Juzgado Central de lo Contencioso-Administrativo
    núm. 10 vom 26.07.2024 auf und bestätigt die Arbeitnehmereigenschaft der Fahrer sowie die Bescheide
    der Sozialversicherung. Damit ist die Divergenz zwischen Sozial- und Verwaltungsgerichtsbarkeit im
    Ergebnis wieder geschlossen.

    '
