  letzte_pruefung: '2026-09-05'
  eigene_bewertung: 'Die erste höchstrichterliche Anerkennung eines Anspruchs auf den Quellcode einer
    automatisiert entscheidenden Verwaltungsanwendung in der EU — und sie kommt nicht aus dem Datenschutzrecht,
    sondern aus dem Informationsfreiheitsrecht. Das ist der eigentliche Punkt: Art. 15 Abs. 1 lit. h DSGVO
    gibt dem einzelnen Betroffenen nach Dun & Bradstreet (C-203/22) nur die kontrafaktische Nachvollziehbarkeit
    seiner eigenen Daten; das Transparenzgesetz gibt jedermann den Code. Wer Algorithmentransparenz durchsetzen
    will, klagt in Spanien seit BOSCO nicht mehr als Betroffener, sondern als Bürger. Zwei Grenzen werden
    regelmäßig übersehen. Erstens ist BOSCO eine regelbasierte Anwendung, kein lernendes System; ob der
    Anspruch auf Modellgewichte und Trainingsdaten durchschlägt, ist offen und mit denselben Argumenten
    kaum zu begründen — Gewichte sind keine lesbare Entscheidungslogik. Zweitens hat der Gerichtshof den
    Urheberrechtseinwand nicht beseitigt, sondern nur überwogen; bei zugekaufter Standardsoftware kann
    die Abwägung anders ausgehen. Für die deutsche Praxis ist die Entscheidung der stärkste Vergleichsmaßstab
    zu § 3 IFG und zur Diskussion um § 35a VwVfG.

    '
  pruefvermerk:
  - 'Nicht am Primärdokument verifiziert. CENDOJ (poderjudicial.es) und die CGPJ-Pressemitteilung werden
    vom Fetch-Proxy mit HTTP 403 beantwortet; ein amtlicher Volltext war auf keinem anderen Weg erreichbar.
