  letzte_pruefung: &id002 2026-09-05
  eigene_bewertung: 'Die erste bekannte Anwendung des Verbots der Emotionserkennung am Arbeitsplatz durch
    eine europäische Datenschutzbehörde — und sie trifft eine Konstellation, die auf den ersten Blick
    unbedenklich wirkt: Der Arbeitgeber sieht nichts, die Beschäftigten nehmen freiwillig teil, die Ergebnisse
    gehen nur an sie selbst. Der Garante durchschneidet das mit einem Argument, das für die ganze Kategorie
    der "Wohlbefindens-KI" gilt: Wenn die aggregierte Auswertung Rückschlüsse auf Teams oder Einzelne
    erlaubt, ist die Zwischenschaltung eines Dritten als Verantwortlichem eine Umgehungskonstruktion.
    Bemerkenswert ist der Zeitpunkt: Die Verbotstatbestände des Art. 5 KI-VO gelten seit dem 02.02.2025,
    die Sanktionsarchitektur greift erst später. Der Garante nutzt die Warnung nach Art. 58 Abs. 2 lit.
    a DSGVO als Vehikel, um das KI-VO-Verbot schon jetzt durchzusetzen. Das ist die praktisch wichtigste
    Beobachtung dieser Datei zum Verhältnis von DSGVO und KI-VO: Die Datenschutzaufsicht vollzieht die
    KI-Verordnung, bevor die KI-Aufsicht arbeitsfähig ist.

    '
  pruefvermerk:
  - 'An der amtlichen Mitteilung geprüft (05.09.2026): garanteprivacy.it, Doc-Web 10255522, Datum 28/05/26,
    Tipologia ''Comunicato stampa''. Titel und Inhalt decken sich mit dem Eintrag: Avvertimento an ein
    italienisches Start-up, das ein KI-Plug-in für Slack und Microsoft Teams anbietet, das über semantische
    Chat-Analyse den psychischen Belastungsgrad freiwillig teilnehmender Beschäftigter ermittelt.'
  - 'Ebenfalls in der Mitteilung belegt: Das Start-up ist Verantwortlicher; der Arbeitgeber erhält weder
    Kommunikationsinhalte noch Einzelergebnisse, wohl aber aggregierte Berichte. Der Garante verlangt
    Vorkehrungen ab der Entwurfsphase gegen auch nur mittelbaren Zugriff auf Informationen zur Gefühlslage
    und stützt sich auf Datenschutzrecht, Statuto dei lavoratori und das Verbot der KI-Verordnung, Emotionen
    im Arbeitskontext abzuleiten. Er warnt vor intransparenten, nicht erklärbaren und potenziell diskriminierenden
    Ergebnissen semantischer Modelle.'
  - 'verifiziert bleibt false und zweifelhaft ist gesetzt: Gelesen wurde nur die Pressemitteilung, nicht
    das Provvedimento selbst. Der Volltext ist nicht veröffentlicht, der Adressat ist anonymisiert, und
    eine Nummer im Registro dei provvedimenti ließ sich nicht ermitteln. Das Feld aktenzeichen bleibt
    deshalb bei ''Nummer nicht veröffentlicht''.'
  - Die Angaben zu den Anspruchsgrundlagen (Art. 58 Abs. 2 lit. a, Art. 5 und 25 DSGVO; Art. 5 Abs. 1
    lit. f KI-VO; Art. 4 und 8 Statuto dei lavoratori) nennt die Mitteilung nicht als Fundstellen; sie
    sind aus dem Sachverhalt erschlossen und bleiben unbelegt.
  - 'Für die weitere Prüfung von Hand: https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10255522
    sowie die Rubrik ''Provvedimenti'' des Garante auf eine spätere Veröffentlichung des Volltextes hin
    beobachten.'
