  sachverhalt: Ein Fahrer (repartidor) lieferte für die Plattform Glovo Bestellungen aus. Über die Anwendung
    meldete er an, wann er verfügbar war, und griff auf die angebotenen Aufträge zu; in welcher Reihenfolge
    er sie zu sehen bekam, richtete sich nach einer Punktzahl, die Glovo aus Verfügbarkeit, Kundenbewertung
