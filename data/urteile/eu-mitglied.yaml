  - ki-vo-2024-1689
  instanzenzug: []
  quelle_tracker: Amtlicher Volltext auf mdp.giustizia-amministrativa.it, gefunden über Decisioni e pareri
    (giustizia-amministrativa.it/web/guest/dcsnprr)
  verifiziert: true
  letzte_pruefung: *id001
  eigene_bewertung: 'Die drei Grundsätze sind die einflussreichste verwaltungsrechtliche Formel zur algorithmischen
    Entscheidung in Europa und ein halbes Jahrzehnt älter als die KI-Verordnung, deren Art. 13 (Transparenz),
    Art. 14 (menschliche Aufsicht) und Art. 10 (Datenqualität und Verzerrungen) dieselben drei Achsen
    abbilden. Wer behauptet, die KI-VO habe Neuland betreten, sollte diese Entscheidung lesen. Ihre Schwäche
    ist die Reichweite: Sie ist zu regelbasierten Systemen ergangen. Die conoscibilità eines neuronalen
    Netzes ist nicht dasselbe wie die Lesbarkeit einer Zuteilungsformel, und die italienische Rechtsprechung
    hat, soweit hier feststellbar, dazu noch nichts entschieden. Genau hier liegt die größte Lücke dieser
    Datei (siehe meta.offene_recherchepunkte).

    '
  pruefvermerk:
  - 'Am amtlichen Volltext geprüft (05.09.2026): Consiglio di Stato in sede giurisdizionale (Sezione Sesta),
    SENTENZA, ''Pubblicato il 13/12/2019'', N. 08472/2019 REG.PROV.COLL., ricorso N. 02936/2019. Nummer,
    Datum und Sezione sind bestätigt; der frühere Vermerk ''NICHT VERIFIZIERT'' ist erledigt.'
  - 'Parteien am Text bestätigt: Berufungsführer ist das MIUR / Ufficio Scolastico Regionale per la Calabria,
    Berufungsgegner sind die Lehrkräfte (Pasqualina Caiazza u. a.); angefochten war T.A.R. Lazio, Sezione
    Terza, n. 9230/2018. Kammersitzung 05.12.2019, Präsident Giancarlo Montedoro, Berichterstattung im
    Senat mit Vincenzo Lopilato und Paolo Carpentieri.'
  - 'Tenor am Text: ''definitivamente pronunciando sull''appello, come in epigrafe proposto, lo respinge.
    Spese compensate.'' Die Berufung des Ministeriums wurde also zurückgewiesen, die erstinstanzliche
    Entscheidung bestätigt; Kosten gegeneinander aufgehoben.'
  - 'Die drei Grundsätze sind wörtlich belegt: Rn. 15 leitet ''tre principi'' aus dem supranationalen
    Recht her; 15.1 ''principio di conoscibilità'' (ergänzt um das ''principio di comprensibilità'' —
    Recht auf ''informazioni significative sulla logica utilizzata'' —, gestützt auf Art. 42 GRCh, Recht
    auf gute Verwaltung); 15.2 ''principio di non esclusività della decisione algoritmica'' (Art. 22 DSGVO,
    ausdrücklich ''human in the loop'', mit Verweis auf Loomis v. Wisconsin); 15.3 ''principio di non
    discriminazione algoritmica'' (Erwägungsgrund 71 der Verordnung 679/2016). Der bisherige Vorbehalt,
    der Wortlaut sei nur sinngemäß wiedergegeben, ist damit ausgeräumt.'
  - 'ECLI ergänzt: ECLI:IT:CDS:2019:8472SENT (aus der amtlichen Trefferliste).'
  - 'NICHT geprüft: die im Aktenzeichenfeld früher mitgeführten Parallelentscheidungen nn. 8473 und 8474/2019
    sowie die Fortführung durch Sez. VI n. 881/2020. Diese Nummern stammen weiter aus Modellwissen und
    sind einzeln zu belegen.'
  - 'instanzenzug geleert: it-2019-cds-2270-buonascuola ist ein anderes Verfahren (dortiger ricorso N.
    04477/2017 gegen T.A.R. Lazio n. 12026/2016).'
  zweifelhaft: false
  quelle_art: amtlich
  sachverhalt: Auch in Kalabrien wurden Lehrkräfte im Rahmen der Schulreform „buona scuola" durch ein
    Computerprogramm neuen Dienstorten zugewiesen. Pasqualina Caiazza und weitere Betroffene beanstandeten,
    weder die Regeln des Programms noch die Gründe ihrer konkreten Zuweisung seien ihnen zugänglich gemacht
    worden, und klagten gegen das Ministero dell'Istruzione, dell'Università e della Ricerca und den Ufficio
    Scolastico Regionale per la Calabria. Das T.A.R. Lazio gab ihnen mit Urteil der Sezione Terza Nr.
