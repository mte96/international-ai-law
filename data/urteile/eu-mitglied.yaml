  anspruchsgrundlage: Art. 64.4.d) Estatuto de los Trabajadores; Art. 28 Abs. 1 spanische Verfassung;
    Art. 10 Abs. 3 Nr. 1 Ley Orgánica de Libertad Sindical; Art. 7 Nr. 7 und Art. 40.1.b) LISOS
  kernfrage: Verletzt die Weigerung des Arbeitgebers, der Gewerkschaft die Parameter, Regeln und Anweisungen
    der Algorithmen zur Zuteilung der dienstfreien Tage (libranzas) offenzulegen, nur das Informationsrecht
    aus Art. 64.4.d) ET oder zugleich die Koalitionsfreiheit aus Art. 28 der Verfassung?
  ergebnis: 'Zugleich die Koalitionsfreiheit. Die Audiencia Nacional stellt eine Verletzung von Art. 28
    Abs. 1 CE fest, erklärt die Verweigerungs- praxis für nichtig, verurteilt das Unternehmen zur unverzüglichen
    Auskunft über die Parameter der eingesetzten Algorithmen gegenüber den Gewerkschaftsdelegierten und
    spricht 6.250 Euro immateriellen Schadensersatz zu. Berichterstatter war Ramón Gallo Llanos. Das Unternehmen
    hatte den Einsatz von Algorithmen bestritten; ein Produktionsleiter hatte ihn in der Verhandlung bestätigt.

    '
