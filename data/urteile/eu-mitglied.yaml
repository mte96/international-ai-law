  verifiziert: true
  letzte_pruefung: *id002
  eigene_bewertung: 'Die früheste höchstrichterliche Entscheidung Europas, die Algorithmentransparenz
    zur Wirksamkeitsvoraussetzung der Einwilligung macht — und damit an einer Stelle ansetzt, die die
    spätere Debatte fast vollständig übersehen hat. Die Diskussion um Art. 15 Abs. 1 lit. h DSGVO fragt,
    was der Verantwortliche im Nachhinein erklären muss; die Cassazione fragt, ob die Einwilligung überhaupt
    zustande gekommen ist. Das ist der schärfere Hebel: Eine unwirksame Einwilligung lässt die gesamte
    Verarbeitung entfallen, während ein verletztes Auskunftsrecht sie unberührt lässt. Für generative
    Systeme, deren Training auf Einwilligung gestützt werden soll, ist das die unbequemste Entscheidung
    im europäischen Bestand — denn ein "schema esecutivo" eines Sprachmodells lässt sich nicht mitteilen.

    '
  pruefvermerk:
  - 'Am Volltext der Ordinanza geprüft (05.09.2026): ''Corte di Cassazione, sez. I Civile, Ordinanza n.
    14381 del 25/05/2021''. Nummer, Datum, Sezione und Entscheidungsform sind damit bestätigt; der frühere
    Vermerk ''NICHT VERIFIZIERT'' ist erledigt. Beratung in der camera di consiglio der ersten Zivilsektion
    am 24.03.2021, Berichterstatter Cons. Terrusi.'
  - 'Die Parteien stehen entgegen der Annahme im Auftrag unpseudonymisiert im Text, weil es sich um juristische
    Personen handelt: ricorrente ''Garante per la Protezione dei Dati Personali'', controricorrente ''Associazione
    Mevaluate Onlus''. Beide Parteifelder sind entsprechend präzisiert.'
  - 'Ergebnisfeld berichtigt: Der Tenor lautet ''La Corte accoglie i primi quattro motivi di ricorso,
    assorbiti gli altri, cassa l''impugnata sentenza e rinvia al tribunale di Roma anche per le spese
    del giudizio di legittimità''. Die Corte verweist zurück; sie stellt die Untersagung des Garante nicht
    selbst wieder her, wie der Eintrag bisher behauptete.'
  - 'Der tragende Satz steht im Text: bei einer Plattform zur Erstellung von Reputationsprofilen auf der
    Grundlage eines Punktwertalgorithmus ist das Bewusstseinserfordernis der Einwilligung nicht erfüllt,
    wenn ''lo schema esecutivo dell''algoritmo e gli elementi di cui si compone restino ignoti o non conoscibili
    da parte degli interessati''.'
  - Der amtliche Volltextdienst der Corte di cassazione (italgiure.giustizia.it/sncass, SentenzeWeb) ist
    erreichbar und funktioniert — die Kontrollsuche '36754/2021' liefert das zugehörige Dokument —, gibt
    für '14381/2021' aber 'la ricerca impostata non ha selezionato nessun documento' aus. Die Ordinanza
    ist dort also nicht abrufbar; deshalb quelle_art 'datenbank' statt 'amtlich'.
  - 'Für den amtlichen Beleg von Hand: https://www.italgiure.giustizia.it/sncass/ , Feld ''Parole o Numero/Anno
    sentenza'' = 14381/2021 (Stand 05.09.2026 ohne Treffer); ersatzweise über den Massimario-Zugang der
    Corte oder eine kostenpflichtige Datenbank.'
  zweifelhaft: false
  sekundaerquelle_url: https://www.misterlex.it/cassazione-civile/2021/14381/
