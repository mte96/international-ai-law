  anspruchsgrundlage: Disposición adicional vigesimotercera Estatuto de los Trabajadores (gesetzliche
    Vermutung der Arbeitnehmereigenschaft bei Lieferplattformen)
  kernfrage: Ist die gesetzliche Vermutung der Arbeitnehmereigenschaft bei Lieferplattformen widerlegbar,
    und schließt algorithmische Vermittlung die tatsächliche Selbständigkeit der Fahrer aus?
  ergebnis: 'Die Vermutung ist widerleglich, und sie wurde hier widerlegt. Das Gericht hebt Nachforderungs-
    und Sanktionsbescheide der Sozialversicherung auf: Nach dem seit dem Urteil des Tribunal Supremo von
    2020 geänderten Betriebsmodell könnten die Fahrer Aufträge ohne Sanktion annehmen oder ablehnen, parallel
    für Konkurrenzplattformen arbeiten und ihre Zeiten frei wählen; die Vergütung entspreche der tatsächlich
    erbrachten Leistung. Die bloße Vermittlung über eine Plattform beseitige die Selbständigkeit nicht,
    wenn die gelebte Praxis erhebliche Freiräume belege.

    '
  bedeutung: mittel
  volltext_url: null
  zusammenfassung_url: https://www.boe.es/biblioteca_juridica/anuarios_derecho/articulo.php?id=ANU-L-2024-00000002734
