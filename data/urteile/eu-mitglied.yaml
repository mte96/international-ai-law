  kernfrage: Darf eine Verwaltungsentscheidung über die Versetzung von Lehrkräften durch einen Algorithmus
    getroffen werden, und welche Anforderungen an Nachvollziehbarkeit und Begründung gelten dann?
  ergebnis: 'Der Einsatz eines Algorithmus im Massenverfahren ist zulässig und im Grundsatz sogar begrüßenswert,
    weil er Neutralität und Effizienz fördert; er entbindet die Verwaltung aber nicht von den Regeln des
    Verwaltungsverfahrens. Der Algorithmus muss als Verwaltungsakt behandelt werden: Er ist ein zugängliches
    Dokument, seine Regeln müssen für die Betroffenen erkennbar sein (conoscibilità), und die Entscheidung
    bleibt der Verwaltung zuzurechnen, die für ihre Rechtmäßigkeit einsteht. Im entschiedenen Fall war
    der Algorithmus weder offengelegt noch nachvollziehbar; die Versetzungsentscheidungen wurden deshalb
    aufgehoben.

    '
  bedeutung: hoch
  volltext_url: https://mdp.giustizia-amministrativa.it/visualizza/?nodeRef=&schema=cds&nrg=201704477&nomeFile=201902270_11.html&subDir=Provvedimenti
  zusammenfassung_url: ''
  bezug_regelwerke:
