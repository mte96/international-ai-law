    f KI-VO (Verbot der Emotionserkennung am Arbeitsplatz); Art. 4 und 8 Statuto dei lavoratori
  kernfrage: Darf ein Dienst die Chat-Kommunikation von Beschäftigten mit KI semantisch auswerten, um
    deren psychische Belastung zu ermitteln, wenn der Arbeitgeber nur aggregierte Ergebnisse erhält?
  ergebnis: 'Warnung (avvertimento) mit der Auflage, bereits in der Entwurfsphase Schutzvorkehrungen einzubauen,
    die einen mittelbaren Zugriff des Arbeitgebers auf die emotionalen Zustände einzelner Beschäftigter
    ausschließen. Das Start-up ist selbst Verantwortlicher; der Arbeitgeber erhält keinen Zugriff auf
    Kommunikationsinhalte oder Einzelergebnisse, sondern nur aggregierte Belastungsberichte. Der Garante
    beanstandet dennoch, dass es sich um Informationen handelt, die der Arbeitgeber nach Datenschutzrecht
    nicht rechtmäßig erlangen und verarbeiten darf; dass das Vorhaben mit dem Verbot der KI-Verordnung
    kollidiert, Systeme zur Emotionsanalyse im Arbeitskontext einzusetzen; und dass semantische Analysemodelle
    intransparente und potenziell diskriminierende Ergebnisse liefern können.

    '
