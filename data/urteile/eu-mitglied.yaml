  anspruchsgrundlage: Art. 1 Abs. 1 Estatuto de los Trabajadores (Merkmale ajenidad und dependencia)
  kernfrage: Begründet die Steuerung von Fahrern über eine Plattform, deren algorithmisches Bewertungs-
    und Zuteilungssystem Verfügbarkeit, Annahmeverhalten und Reihenfolge des Zugriffs auf Aufträge bestimmt,
    ein Arbeitsverhältnis?
  ergebnis: 'Ja. Das Plenum der Sozialkammer stuft die Fahrer als Arbeitnehmer ein. Tragend ist, dass
    die Plattform über das algorithmische Bewertungssystem (Punktzahl aus Verfügbarkeit, Kundenbewertung
    und Annahmequote) die Arbeitsbedingungen bestimmt und damit die für ein Arbeitsverhältnis kennzeichnende
    Leitungsmacht ausübt: Die formale Freiheit, Aufträge abzulehnen, wird durch die algorithmischen Folgen
    der Ablehnung entwertet. Die Entscheidung ist die Grundlage der später kodifizierten Vermutungsregel
    (disposición adicional vigesimotercera ET, "Ley Rider") und des Auskunftsrechts aus Art. 64.4.d) ET.

    '
