  kernfrage: Darf der Gesetzgeber die Wiederverwendung der Identitätsdaten von Richtern zur Analyse ihrer
    Entscheidungspraxis verbieten, wenn zugleich alle Entscheidungen frei zugänglich veröffentlicht werden?
  ergebnis: 'Ja. Der Conseil erklärt den neuen Art. L. 111-13 COJ für verfassungskonform (Rn. 93-95).
    Der Gesetzgeber verfolge ein legitimes Ziel: die Verhinderung von Profilbildungen über einzelne Richter,
    die zu Druck auf die Justiz oder zu Strategien der Gerichtswahl führen könnten und damit die richterliche
    Unabhängigkeit gefährdeten. Ein Verstoß gegen den Gleichheitssatz oder gegen die Waffengleichheit
    liege nicht vor, da das Verbot alle Parteien gleichermaßen treffe.

    '
  bedeutung: hoch
  volltext_url: https://www.conseil-constitutionnel.fr/decision/2019/2019778DC.htm
  zusammenfassung_url: ''
  bezug_regelwerke:
  - fr-open-data-justice
  - ki-vo-2024-1689
  instanzenzug: []
  quelle_tracker: conseil-constitutionnel.fr — Volltext abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Frankreich ist die einzige westliche Rechtsordnung, die die Richterprofilierung durch
    prädiktive Analysesysteme strafbewehrt verbietet (bis zu fünf Jahre Freiheitsstrafe nach Art. 226-18
    code pénal in Verbindung mit Art. L. 111-13 COJ) — und der Conseil constitutionnel hat das gehalten.
    Die Entscheidung ist der schärfste europäische Gegenpol zur amerikanischen Legal-Analytics-Industrie
    und wird in der deutschen Debatte um Legal Tech und § 5 RDG kaum wahrgenommen, obwohl sie die eigentliche
    Grundsatzfrage stellt: Ist die Statistik über den Richter Teil der Öffentlichkeit des Verfahrens oder
    ein Angriff auf seine Unabhängigkeit? Die schwache Stelle der Begründung ist, dass der Conseil das
    Verbot nur am Gleichheitssatz und an der Waffengleichheit misst, nicht an der Informationsfreiheit.
    Die Frage, ob ein Verbot der Auswertung ohnehin veröffentlichter Entscheidungen die Meinungs- und
    Informationsfreiheit verletzt, ist damit offen geblieben.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: 'Art. 33 der Loi de programmation 2018-2022 et de réforme pour la justice änderte die Regeln
    über die Veröffentlichung von Gerichtsentscheidungen: Alle Entscheidungen der Zivil- und der Verwaltungsgerichtsbarkeit
    sollten der Öffentlichkeit kostenlos in elektronischer Form zugänglich sein. Zugleich bestimmte er
    in Art. L. 10 Abs. 4 code de justice administrative und Art. L. 111-13 Abs. 3 code de l''organisation
    judiciaire, dass die Identitätsdaten der Richterinnen und Richter sowie der Geschäftsstellenbediensteten
    nicht wiederverwendet werden dürfen, um deren tatsächliche oder vermeintliche berufliche Praxis zu
    bewerten, zu analysieren, zu vergleichen oder vorherzusagen; Verstöße sind straf- und verwaltungsrechtlich
    bewehrt. Am 21. Februar 2019 riefen Abgeordnete um Christian Jacob den Conseil constitutionnel an;
    Senatoren schlossen sich an. Sie hielten das Wiederverwendungsverbot für unvereinbar mit dem Gleichheitssatz
    und der Waffengleichheit.'
  sachverhalt_quelle: volltext
