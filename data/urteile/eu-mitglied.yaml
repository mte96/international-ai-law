  anspruchsgrundlage: Art. 6 Abs. 1 lit. e, Art. 9 Abs. 2 lit. g, Art. 13, Art. 14, Art. 24, Art. 25 Abs.
    1, Art. 30, Art. 31, Art. 35 DSGVO; Art. 66 ν. 4624/2019
  kernfrage: Welche datenschutzrechtlichen Anforderungen gelten für ein integriertes Überwachungssystem
    in Aufnahme- und Unterbringungseinrichtungen für Drittstaatsangehörige, das Videoanalyse und biometrische
    Zugangskontrolle verbindet?
  ergebnis: 'Feststellung mehrerer Verstöße und Verhängung einer Verwaltungsgeldbuße gegen das Ministerium
    sowie Anordnung, binnen drei Monaten die Pflichten aus der DSGVO zu erfüllen. Beanstandet wurden insbesondere
    die unzureichende Zusammenarbeit mit der Behörde (Art. 31 DSGVO, Art. 66 ν. 4624/2019), erhebliche
    Mängel der Datenschutz-Folgenabschätzungen (Art. 35), Verstöße gegen die Informationspflichten (Art.
    13, 14) sowie Defizite bei Rechenschaftspflicht, Datenschutz durch Technikgestaltung und Verfahrensverzeichnis
    (Art. 24, 25 Abs. 1, 30). Κένταυρος ist ein "ολοκληρωμένο ψηφιακό σύστημα διαχείρισης ηλεκτρονικής
    και φυσικής ασφάλειας"; Υπερίων ein System der Zugangs- und Abgangskontrolle mit biometrischer Fingerabdruckerfassung.
    Speicherdauer bei Κένταυρος 15 Tage.

    '
  bedeutung: hoch
  volltext_url: https://www.dpa.gr/sites/default/files/2024-04/13_2024%20anonym.pdf
  zusammenfassung_url: https://www.dpa.gr/el/enimerwtiko/prakseisArxis/aytepaggelti-ereyna-gia-tin-anaptyxi-kai-egkatastasi-ton-programmaton
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  - gr-n-4624-2019
  instanzenzug: []
  quelle_tracker: dpa.gr — Entscheidungsseite und amtliches PDF (13_2024 anonym.pdf), beide abgerufen;
    Berichterstatter Σπυρίδων Βλαχόπουλος und Χρήστος Καλλονιάτης, Vorsitz Κωνσταντίνος Μενουδάκος
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Die einzige europäische Aufsichtsentscheidung, die ein KI-gestütztes Grenz- und Lagerüberwachungssystem
    zum Gegenstand hat — und sie fällt milder aus, als die politische Debatte erwarten ließ. Die Behörde
    beanstandet vor allem Verfahrenspflichten: fehlende und verspätete Folgenabschätzungen, unzureichende
    Information, mangelnde Kooperation. Zur eigentlich brisanten Frage, ob eine Videoanalyse in einer
    Einrichtung, die Menschen faktisch nicht verlassen können, überhaupt auf Art. 6 Abs. 1 lit. e DSGVO
    gestützt werden kann, verhält sie sich zurückhaltend. Das ist der wiederkehrende Befund dieser Datei:
    Wo Datenschutzbehörden KI im Sicherheitsbereich prüfen, sanktionieren sie Verfahrensfehler und lassen
    die Grundfrage offen. Die griechische Entscheidung ist dafür das reinste Beispiel — die Systeme laufen
    weiter, nur mit besserer Dokumentation.

    '
  pruefvermerk:
  - 'Die HÖHE der Geldbuße konnte nicht ermittelt werden: Das amtliche PDF ist so umfangreich, dass der
    Abruf mitten in Ziffer 6 der Gründe abbricht und das διατακτικό nicht erreicht wird; die amtliche
    Zusammenfassung bestätigt die Verhängung eines Bußgeldes, nennt aber keinen Betrag. Alle übrigen Angaben
    sind am amtlichen Text verifiziert.'
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: 'Das griechische Ministerium für Migration und Asyl (Υπουργείο Μετανάστευσης και Ασύλου)
    richtete in den Aufnahme- und Unterbringungseinrichtungen für Drittstaatsangehörige zwei Systeme ein:
    «Κένταυρος», ein integriertes digitales System zur Verwaltung der elektronischen und physischen Sicherheit
    mit Videoanalyse und einer Speicherdauer von fünfzehn Tagen, und «Υπερίων», ein System der Zugangs-
    und Abgangskontrolle mit biometrischer Fingerabdruckerfassung. Die Untergebrachten können die Einrichtungen
    nicht frei verlassen. Die Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα leitete von Amts wegen eine
    Untersuchung ein und verlangte vom Ministerium Auskünfte und Unterlagen, darunter die Datenschutz-Folgenabschätzungen.
    Das Ministerium arbeitete dabei nur eingeschränkt mit.'
  sachverhalt_quelle: eintrag
- id: gr-2025-apdpx-smart-policing
  jurisdiktion: gr
  gericht: Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (Ολομέλεια)
  instanz: behoerde
  aktenzeichen: Απόφαση 45/2025, Αριθ. Πρωτ. Γ/ΕΙΣ/4648
  ecli: null
  datum: 2025-12-31
  parteien:
    klaeger: Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα
    beklagter: Ελληνική Αστυνομία (ΕΛ.ΑΣ.)
  status: erledigt
  themenachsen:
  - datenschutz
  - grundrechte
  - sektor-oeffentlich
  - governance
  anspruchsgrundlage: Art. 45A und Art. 46 ν. 4624/2019 (Umsetzung der Richtlinie (EU) 2016/680); Art.
    27 der Richtlinie (EU) 2016/680 (Datenschutz-Folgenabschätzung)
  kernfrage: Besteht für ein polizeiliches System, das im Streifendienst über mobile Endgeräte Gesichtserkennung
    und Fingerabdruckabgleich einsetzt, eine hinreichende gesetzliche Grundlage, und wann ist die Datenschutz-Folgenabschätzung
    durchzuführen?
  ergebnis: 'Verwarnung (προειδοποίηση) gegen die Inbetriebnahme des Systems «Έξυπνη Αστυνόμευση». Die
    Behörde stellt fest, dass für die beabsichtigte Verarbeitung über dieses System keine Rechtsgrundlage
    besteht — die einschlägigen Vorschriften der Art. 45A und 46 ν. 4624/2019 sind nicht erfüllt, herangezogen
    wurden lediglich veraltete Regelungen (ΠΔ 342/1977) — und dass die erforderliche Datenschutz-Folgenabschätzung
    in der Pilotphase nicht durchgeführt wurde. Ein produktiver Einsatz ohne Rechtsgrundlage wäre eine
    rechtswidrige Verarbeitung. Gegenstand des Systems sind der Bildabgleich mittels Gesichtserkennungssoftware
    und die Fingerabdruckerfassung über Lesegeräte an Smartphones (Samsung S10e) der Streifenbeamten.

    '
  bedeutung: hoch
  volltext_url: https://www.dpa.gr/sites/default/files/2026-01/45_2025%20anonym.pdf
  zusammenfassung_url: https://www.dpa.gr/el/enimerwtiko/prakseisArxis/exetasi-tis-symbasis-promitheias-leitoyrgias-kai-hrisis-toy-systimatos
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  - gr-n-4624-2019
  - rl-2016-680
  instanzenzug: []
  quelle_tracker: dpa.gr — Entscheidungsseite und amtliches PDF (45_2025 anonym.pdf), beide abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Der wichtigste Fund dieser Sitzung für Griechenland und der strukturell interessanteste
    Parallelfall zur französischen Nizza-Entscheidung: Zwei Aufsichtsinstanzen in zwei Rechtsordnungen
    kommen 2025/2026 unabhängig voneinander zu demselben Ergebnis — algorithmische Gesichtserkennung im
    öffentlichen Raum braucht eine ausdrückliche gesetzliche Ermächtigung, und das Schweigen des Gesetzes
    ist keine Erlaubnis. In Frankreich sagt es das oberste Verwaltungsgericht, in Griechenland die Datenschutzbehörde.
    Die Entscheidung ist zugleich ein Lehrstück über die Reihenfolge: Das System war beschafft, vertraglich
    gebunden und in der Pilotphase, bevor die Rechtsgrundlage geprüft wurde. Die Aufsichtsbehörde konnte
    deshalb nur noch verwarnen. Art. 27 der Richtlinie (EU) 2016/680 und Art. 35 DSGVO verlangen die Folgenabschätzung
    "vor" der Verarbeitung; in der Praxis der Sicherheitsbehörden ist sie regelmäßig das letzte Dokument,
    nicht das erste.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: 'Die griechische Polizei (Ελληνική Αστυνομία) beschaffte das System «Έξυπνη Αστυνόμευση»
    („Smart Policing"): Streifenbeamte sollten mit Smartphones vom Typ Samsung S10e und daran angeschlossenen
    Lesegeräten im Einsatz Gesichtsbilder mit Gesichtserkennungssoftware abgleichen und Fingerabdrücke
    erfassen. Der Beschaffungsvertrag war geschlossen, das System befand sich in der Pilotphase; eine
    Datenschutz-Folgenabschätzung wurde in dieser Phase nicht durchgeführt. Als Rechtsgrundlage zog die
    Polizei unter anderem das Präsidialdekret ΠΔ 342/1977 heran. Die Αρχή Προστασίας Δεδομένων Προσωπικού
    Χαρακτήρα nahm den Vertrag über Beschaffung, Betrieb und Nutzung des Systems zum Gegenstand einer
    Prüfung.'
  sachverhalt_quelle: eintrag
