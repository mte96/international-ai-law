  ergebnis: 'Geldbußen zwischen 120.000 Euro und 5,8 Mio. Euro gegen vier Unternehmen sowie Anordnungen
    zur Herstellung transparenter Verfahren und vollständiger Auskunft über den Score. Betroffene hatten
    keine Energieversorgung erhalten, ohne über die Bewertungskriterien informiert zu werden; der Garante
    stellte schwere Verstöße gegen die Transparenz- und Informationspflichten sowie gegen das Auskunftsrecht
    fest.

    '
