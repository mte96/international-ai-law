  verifiziert: true
  letzte_pruefung: &id001 2026-09-05
  eigene_bewertung: 'Der Ausgangspunkt der gefestigten italienischen Linie, und der europäisch früheste
    Versuch, den Algorithmus verwaltungsrechtlich einzuordnen: nicht als Werkzeug, sondern als Bestandteil
    des Verwaltungsakts. Das ist dogmatisch mutiger als die deutsche Diskussion um § 35a VwVfG, die den
    Algorithmus als bloßes internes Hilfsmittel behandelt. Die praktische Folge ist weitreichend — wenn
    der Algorithmus Teil des Verwaltungsakts ist, unterliegt er der Akteneinsicht und der Begründungspflicht.

    '
  pruefvermerk:
  - 'Am amtlichen Volltext geprüft (05.09.2026): Consiglio di Stato in sede giurisdizionale (Sezione Sesta),
    SENTENZA, ''Pubblicato il 08/04/2019'', N. 02270/2019 REG.PROV.COLL. Nummer, Datum und Sezione des
    Eintrags sind damit bestätigt; der frühere Vermerk ''NICHT VERIFIZIERT'' ist erledigt.'
  - 'Parteien berichtigt: Berufungsführer waren die achtzehn Lehrkräfte (Mariateresa Altomare u. a.),
    Berufungsgegner das MIUR / Ufficio Scolastico Regione Puglia, Ambito Territoriale Bari. Der Eintrag
    hatte die Rollen vertauscht.'
  - 'Gegenstand am Text bestätigt: Zuweisung von Dienstorten an Lehrkräfte, Berufung gegen T.A.R. Lazio,
    Sede di Roma, n. 12026/2016; öffentliche Sitzung 06.12.2018, Berichterstatter Cons. Giordano Lamberti;
    Senat unter Präsident Luigi Carbone.'
  - 'Tenor am Text: ''accoglie l''appello e, per l''effetto, in riforma della sentenza impugnata, accoglie
    il ricorso di primo grado''; Kostenerstattung beider Instanzen von insgesamt 6.000 Euro zulasten der
    Verwaltung. Das Gericht rügt die Zuweisung ''al di là di automatismi informatici'' und verlangt Zuweisungen
    nach Rangfolge und Präferenzen.'
  - 'ECLI ergänzt: ECLI:IT:CDS:2019:2270SENT (aus der amtlichen Trefferliste).'
  - 'instanzenzug geleert: it-2019-cds-8472-buonascuola ist ein anderes Verfahren (dort ricorso N. 02936/2019
    gegen T.A.R. Lazio Sez. III n. 9230/2018, hier ricorso N. 04477/2017 gegen T.A.R. Lazio n. 12026/2016).
    Beide gehören zur selben Rechtsprechungslinie, nicht zum selben Instanzenzug.'
  - 'Nicht gegengeprüft: die im Ergebnisfeld referierten Begründungsstränge im Einzelnen sowie die Angabe
    der Anspruchsgrundlagen (Art. 3 Legge 241/1990, Art. 97 Cost., Legge 107/2015).'
  zweifelhaft: false
  quelle_art: amtlich
  sachverhalt: Nach der Schulreform „buona scuola" (Legge 107/2015) wies das Bildungsministerium Lehrkräfte
    im Massenverfahren neuen Dienstorten zu; die Zuweisung besorgte ein Computerprogramm. Achtzehn Lehrkräfte
    um Mariateresa Altomare beanstandeten, sie seien ohne Rücksicht auf Rangfolge und angegebene Präferenzen
    zugewiesen worden, und die Verwaltung habe ihnen nicht mitgeteilt, wie das Programm zu diesem Ergebnis
    gekommen sei. Sie klagten gegen das Ministero dell'Istruzione, dell'Università e della Ricerca und
    den Ufficio Scolastico der Region Apulien, Ambito Territoriale Bari. Das T.A.R. Lazio in Rom wies
    die Klage mit Urteil Nr. 12026/2016 ab; dagegen legten sie Berufung zum Consiglio di Stato ein.
