  anspruchsgrundlage: Art. 5 Abs. 1 lit. a, Art. 6, Art. 9, Art. 12, Art. 14, Art. 15, Art. 27 DSGVO;
    ν. 4624/2019
  kernfrage: Unterliegt ein außerhalb der EU ansässiges Unternehmen, das Gesichtsbilder aus dem offenen
    Internet ohne Kenntnis der Betroffenen sammelt und biometrisch auswertet, der DSGVO, und mit welchen
    Folgen?
  ergebnis: 'Geldbuße von 20 Mio. Euro. Festgestellt wurden Verstöße gegen die Grundsätze der Rechtmäßigkeit,
    der Verarbeitung nach Treu und Glauben und der Transparenz (Art. 5 Abs. 1 lit. a), das Fehlen jeder
    Rechtsgrundlage (Art. 6), die unzulässige Verarbeitung biometrischer Daten (Art. 9), Verletzungen
    der Informations- und Auskunftspflichten (Art. 12, 14, 15) sowie das Fehlen eines Vertreters in der
    Union (Art. 27). Angeordnet wurden die Erfüllung des Auskunftsverlangens des Beschwerdeführers, das
    Verbot, Daten von Personen in Griechenland mit Gesichtserkennung zu erheben und zu verarbeiten, und
    die Löschung der bereits vorhandenen Daten. Der Beschluss der Ολομέλεια datiert vom 19.04.2022, die
    Entscheidung vom 13.07.2022; Vorsitz: Κωνσταντίνος Μενουδάκος.

    '
  bedeutung: hoch
  volltext_url: https://www.dpa.gr/sites/default/files/2022-07/35_2022%20anonym_0.pdf
  zusammenfassung_url: https://www.dpa.gr/el/enimerwtiko/prakseisArxis/epiboli-prostimoy-stin-etaireia-clearview-ai-inc
  bezug_regelwerke:
  - dsgvo-schnittstelle
  - ki-vo-2024-1689
  - gr-n-4624-2019
  instanzenzug: []
  quelle_tracker: dpa.gr — Entscheidungsseite und amtliches PDF (35_2022 anonym_0.pdf), beide abgerufen
  verifiziert: true
  letzte_pruefung: 2026-09-04
  eigene_bewertung: 'Eine von vier parallelen europäischen Höchstbußen gegen Clearview (Frankreich, Italien,
    Griechenland, Vereinigtes Königreich) und zugleich die am schlechtesten dokumentierte: Die französische
    Entscheidung ist auf cnil.fr inzwischen gelöscht, die griechische liegt weiter im amtlichen PDF vor.
    Für die Rechtsdokumentation ist das der eigentliche Befund — die Aufbewahrungspraxis der Aufsichtsbehörden
    bestimmt, welche Präzedenzfälle in zehn Jahren noch nachweisbar sind. Materiell ist die Entscheidung
    die klarste europäische Aussage dazu, dass Scraping aus dem offenen Internet keine Rechtsgrundlage
    schafft — ein Satz, der für das Training generativer Modelle dieselbe Sprengkraft hat und dort bisher
    weder von einer Behörde noch von einem Gericht in dieser Deutlichkeit ausgesprochen wurde.

    '
  sekundaerquelle_url: null
  quelle_art: amtlich
  sachverhalt: Clearview AI, Inc. sammelte Gesichtsbilder aus dem offenen Internet und wertete sie biometrisch
    aus, um daraus eine Suchdatenbank für Sicherheitsbehörden aufzubauen; die abgebildeten Personen erfuhren
    davon nichts. Das Unternehmen hat weder eine Niederlassung noch einen Vertreter in der Union. Die
    griechische Bürgerrechtsorganisation Homo Digitalis und weitere Beschwerdeführer wandten sich an die
    Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα; einer von ihnen hatte bei Clearview zuvor Auskunft
    über die zu seiner Person gespeicherten Daten verlangt und keine erhalten. Das Plenum (Ολομέλεια)
    der Behörde unter Vorsitz von Κωνσταντίνος Μενουδάκος befasste sich am 19. April 2022 mit der Sache.
  sachverhalt_quelle: eintrag
