  letzte_pruefung: '2026-09-05'
  eigene_bewertung: 'Die Entscheidung wird meist als Plattformarbeitsurteil gelesen; sie ist aber vor
    allem eine Zurechnungsentscheidung über Algorithmen. Der Tribunal Supremo hat als erstes Höchstgericht
    Europas ausgesprochen, dass algorithmische Anreizsteuerung rechtlich Weisung ist, auch wenn sie formal
    nur eine Rangfolge verändert. Genau diese Figur — die Wirkung des Systems zählt, nicht seine juristische
    Selbstbeschreibung — kehrt in der Foundever- Entscheidung wieder und liegt der Plattformarbeitsrichtlinie
    zugrunde. Ihre Grenze zeigt der Fall Glovo selbst: Nach einer Modelländerung hat ein Verwaltungsgericht
    2024 gegenteilig entschieden (es-2024-glovo-jcca-10). Die Frage ist damit nicht die nach der Technik,
    sondern die nach der Beweisführung über die tatsächliche Wirkung der Technik.

    '
