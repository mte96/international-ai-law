  anspruchsgrundlage: Art. 2 Abs. 1 i.V.m. Art. 1 Abs. 1 GG; § 18 Abs. 1 Nr. 2 i.V.m. § 18 Abs. 2 Nr.
    1 BKAG; § 45 Abs. 1 Satz 1 Nr. 4 BKAG
  kernfrage: Welche Schwellen und Fristen verlangt das Grundgesetz für die Vorratsspeicherung personenbezogener
    Daten im polizeilichen Informationsverbund und für die verdeckte Überwachung von Kontaktpersonen?
  ergebnis: 'Der Erste Senat erklärte § 18 Abs. 1 Nr. 2 i.V.m. § 18 Abs. 2 Nr. 1 BKAG (Speicherung durch
    das BKA als Zentralstelle) und § 45 Abs. 1 Satz 1 Nr. 4 BKAG (Datenerhebung bei Kontaktpersonen) für
    verfassungswidrig. Tragende Leitsätze: Die verdeckte Überwachung von Kontaktpersonen mit eingriffsintensiven
    Mitteln setzt voraus, dass auch die Überwachung der verantwortlichen Person polizeirechtlich zulässig
    wäre; zweckgebunden erhobene Daten sind grundsätzlich nach Zweckerreichung zu löschen, sofern nicht
    neue Ermittlungsansätze die Weiterspeicherung rechtfertigen; die vorsorgliche Speicherung personenbezogener
    Daten verlangt eine angemessene Speicherschwelle und angemessene Speicherfristen auf der Grundlage
    hinreichender Tatsachen und einer belastbaren Prognose. Dem Gesetzgeber wurde eine Frist bis zum 31.
    Juli 2025 gesetzt; bis dahin galten die Vorschriften eingeschränkt fort.

    '
