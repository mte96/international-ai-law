- id: de-2025-baypag-61a-bverfg
  jurisdiktion: de
  gericht: Bundesverfassungsgericht
  instanz: verfassungsgericht
  aktenzeichen: 1 BvR 1446/25
  ecli: null
  datum: 2025-07-23
  parteien:
    klaeger: Acht Beschwerdeführende, darunter ein Strafverteidiger, Aktivistinnen und Aktivisten, Mitglieder
      der Fanhilfe der SpVgg Greuther Fürth und der Musiker Johannes König; unterstützt von der Gesellschaft
      für Freiheitsrechte und dem Chaos Computer Club
    beklagter: Freistaat Bayern
  status: anhaengig
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 2 Abs. 1 i.V.m. Art. 1 Abs. 1 GG; Art. 10 GG (Fernmeldegeheimnis); Art. 61a
    BayPAG
  kernfrage: Ist Art. 61a BayPAG, der der bayerischen Polizei die anlassbezogene automatisierte Zusammenführung
    von Daten mit der Palantir-Plattform VeRA erlaubt, mit dem Recht auf informationelle Selbstbestimmung
    und dem Fernmeldegeheimnis vereinbar?
  ergebnis: 'Noch nicht entschieden. Die Verfassungsbeschwerde wurde am 23. Juli 2025 in Karlsruhe erhoben.
    Sie richtet sich gegen den Einsatz der Palantir-Software Gotham (in Bayern unter dem Namen VeRA) für
    Data-Mining, das auch Personen ohne jeden Bezug zu einer Straftat erfasst. Gerügt wird insbesondere
    die Intransparenz der eingesetzten Algorithmen - die Polizei dürfe bei ihren Ermittlungen nicht intransparente
    Algorithmen ans Steuer lassen.

    '
  bedeutung: hoch
  volltext_url: https://www.bundesverfassungsgericht.de/DE/Aktuelles/AusgewaehlteNeueingaenge/vs_2025/ausgewaehlte-Neueingaenge2025_node.html
  zusammenfassung_url: https://freiheitsrechte.org/themen/freiheit-im-digitalen-zeitalter/palantir-bayern
  bezug_regelwerke:
  - de-automatisierte-datenanalyse-polizei
  instanzenzug:
  - de-2023-hessendata-bverfg
  quelle_tracker: Gesellschaft für Freiheitsrechte, Chaos Computer Club
  verifiziert: true
  letzte_pruefung: '2026-09-07'
  eigene_bewertung: 'Bayern hat die Software VeRA schon 2022 über einen Rahmenvertrag beschafft und jahrelang
    Lizenzgebühren gezahlt, bevor die Rechtsgrundlage stand - Art. 61a BayPAG kam erst nach dem hessenDATA-Urteil.
    Die Norm ist handwerklich vorsichtiger gefasst als das hessische Vorbild: Sie verbietet ausdrücklich
    automatisierte Einzelentscheidungen und selbstlernende Systeme und knüpft die Zusammenführung an einen
    Anlass. Ob das reicht, hängt daran, wie das Gericht die vierte Leitsatzstufe anwendet - ob also die
    gesetzlichen Begrenzungen von Daten und Methoden das Eingriffsgewicht wirklich so weit senken, dass
    unterhalb der konkretisierten Gefahr gerechtfertigt werden kann. Prozesstaktisch interessant ist die
    Auswahl der Beschwerdeführenden: Fußballfans und Demonstrationsorganisatoren sind typische Betroffene
    polizeilicher Verbunddateien, ohne Beschuldigte zu sein - genau die Gruppe, für die der erste Leitsatz
    geschrieben wurde.

    '
  sekundaerquelle_url: https://freiheitsrechte.org/themen/freiheit-im-digitalen-zeitalter/palantir-bayern
  dokumenttyp: Amtliche Verfahrensmitteilung des Gerichts (Ausgewählte Neueingänge 2025) — Entscheidung
    noch nicht ergangen
  pruefvermerk:
  - Auch hier liegt keine Entscheidung vor; das Verfahren ist anhängig. Amtlicher Nachweis ist der Eintrag
    in den 'Ausgewählten Neueingängen 2025'.
  - Dort geführt als 1 BvR 1446/25, Gegenstand 'Automatisierte Datenanalyse durch die Bayerischen Polizeibehörden'
    nach Art. 61a BayPAG, Eingang Juli 2025 — deckungsgleich mit dem Eintragsdatum 23.07.2025.
  - Die Angabe 'Aktenzeichen nicht veröffentlicht' ist damit überholt.
  - Der bisherige Link (Themenseite der GFF) ist eine Verbandsseite; die dort abrufbare geschwärzte Beschwerdeschrift
    vom 23.07.2025 ist eine Parteischrift, kein Gerichtsdokument.
  - '07.09.2026: 1 BvR 1446/25 (Art. 61a BayPAG, automatisierte Datenanalyse mit VeRA) ist in der amtlichen
    Liste der geplanten Entscheidungen des Ersten Senats nicht aufgeführt. ABGRENZUNG, wichtig: Die mündliche
    Verhandlung des Ersten Senats am 7. und 8. Juli 2026 "in Sachen Bayerisches Polizeiaufgabengesetz"
    betrifft NICHT Art. 61a BayPAG und nicht dieses Verfahren, sondern 1 BvF 1/18, 1 BvR 2271/18 und 1
    BvR 506/19 gegen die BayPAG-Novelle 2017/2018 (Kernbegriff "drohende Gefahr"). Die dort zu erwartende
    Entscheidung dürfte für 1 BvR 1446/25 präjudiziell wirken und ist als Vorlauf zu beobachten.'
  normen:
  - baypag-61a
  - gg-art-1-abs-1
  - gg-art-10
  - gg-art-2-abs-1
  quelle_art: amtlich
  sachverhalt: Bayern beschaffte 2022 über einen Rahmenvertrag die Analyseplattform Gotham der Firma Palantir
    — dort unter dem Namen VeRA geführt — und zahlte jahrelang Lizenzgebühren, bevor eine Rechtsgrundlage
    für den Einsatz bestand. Erst nach dem hessenDATA-Urteil schuf der Landtag mit Art. 61a BayPAG die
    Ermächtigung zur anlassbezogenen automatisierten Zusammenführung polizeilicher Daten; die Vorschrift
    verbietet ausdrücklich automatisierte Einzelentscheidungen und selbstlernende Systeme. Die Zusammenführung
    erfasst auch Daten von Personen, die mit einer Straftat nichts zu tun haben; welche Algorithmen dabei
    arbeiten, wird nicht offengelegt. Acht Betroffene — darunter ein Strafverteidiger, Aktivistinnen und
    Aktivisten, Mitglieder der Fanhilfe der SpVgg Greuther Fürth und der Musiker Johannes König — erhoben
    am 23. Juli 2025 Verfassungsbeschwerde, unterstützt von der Gesellschaft für Freiheitsrechte und dem
    Chaos Computer Club.
