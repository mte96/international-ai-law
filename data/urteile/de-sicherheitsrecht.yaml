  quelle_art: amtlich
  sachverhalt: Das Gesetz zur Neustrukturierung des Bundeskriminalamtgesetzes vom 1. Juni 2017 trat am
    25. Mai 2018 in Kraft. Es erlaubt dem Bundeskriminalamt, zur Abwehr von Gefahren des internationalen
    Terrorismus auch Kontaktpersonen mit eingriffsintensiven verdeckten Mitteln zu überwachen (§ 45 Abs.
    1 Satz 1 Nr. 4 BKAG), und regelt die Weiterverarbeitung bereits erhobener personenbezogener Daten
    im Informationssystem des Bundeskriminalamts und im polizeilichen Informationsverbund — darunter die
    Speicherung durch das BKA in seiner Funktion als Zentralstelle. Fünf Betroffene, deren Namen in der
    Veröffentlichung geschwärzt sind, erhoben am 22. Mai 2019 Verfassungsbeschwerde; bevollmächtigt waren
    Prof. Dr. Matthias Bäcker und Rechtsanwalt Dr. Bijan Moini, unterstützt wurden sie von der Gesellschaft
    für Freiheitsrechte. Den zunächst ebenfalls angegriffenen Teil zu Online-Durchsuchung und Quellen-Telekommunikationsüberwachung
    nahmen sie mit Schriftsatz vom 27. April 2022 zurück; im Übrigen ergänzten sie die Beschwerde am 29.
    September 2022. Der Erste Senat verhandelte am 20. Dezember 2023 mündlich.
  sachverhalt_quelle: volltext
