  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Der erste der Palantir-Folgefälle, der nicht als Individualverfassungs- beschwerde
    in Karlsruhe, sondern als abstrakte Normenkontrolle vor einem Landesverfassungsgericht geführt wird.
    Das ist prozessual bedeutsam: Die Antragsteller müssen keine eigene Betroffenheit darlegen und können
    die Norm unabhängig von einem konkreten Einsatz angreifen - genau das Argument, das die Berliner Landesregierung
    mit dem Hinweis entkräften will, sie plane Palantir gar nicht einzusetzen. Ob der VerfGH Berlin dem
    Bundesverfassungsgericht folgt oder eigene landesverfassungsrechtliche Maßstäbe entwickelt, ist offen.
    Der Antrag datiert vom 28. August 2026 und liegt damit einen Tag nach dem hier gesetzten Prüfstichtag.

    '
