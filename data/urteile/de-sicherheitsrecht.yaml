  eigene_bewertung: 'Nicht als KI-Entscheidung geschrieben, aber der zweite Baustein, an dem die geplanten
    Bundesregelungen zur automatisierten Datenanalyse scheitern könnten. hessenDATA regelt, was mit gespeicherten
    Daten geschehen darf; BKAG II regelt, was überhaupt gespeichert bleiben darf. Wer beide zusammenliest
    - wie es Jonas Botta im Verfassungsblog tut -, kommt zu dem Ergebnis, dass die dauerhafte Zusammenführung
    eines Grunddatenbestands ohne Speicherschwellen und ohne Speicherfristen bereits für sich genommen
    ein eigenständiger Grundrechtseingriff ist. § 9b BKAG-E setzt an der Analyse an und lässt die Frage
    des Grunddatenbestands offen; das ist die wahrscheinlichste Sollbruchstelle des Bundesvorhabens. Die
    ECLI folgt dem systematischen BVerfG-Schema und wurde auf der amtlichen Seite nicht angezeigt.

    '
  normen:
