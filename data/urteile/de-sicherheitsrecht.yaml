  - datenschutz
  - sektor-oeffentlich
  anspruchsgrundlage: Art. 2 Abs. 1 i.V.m. Art. 1 Abs. 1 GG; § 23 PolG NRW (Rechtsgrundlage für die Plattform
    DAR / Palantir Gotham)
  kernfrage: Ist die nordrhein-westfälische Rechtsgrundlage für die datenbankübergreifende automatisierte
    Analyse mit Palantir-Software (DAR) verfassungsgemäß?
  ergebnis: 'Noch nicht entschieden. Nordrhein-Westfalen setzt Palantir-Software seit 2019 unter dem Namen
    DAR (Datenbankübergreifende Analyse und Recherche) ein, seit 2022 auf gesetzlicher Grundlage. Die
    Verfassungsbeschwerde gegen die nordrhein-westfälische Rechtsgrundlage war bereits Anfang 2024 anhängig,
    ein Verhandlungstermin war nicht angesetzt. 2025 novellierte das Land sein Polizeigesetz; § 23 Abs.
    6, 6a und 7 PolG NRW bilden die geltende Grundlage. Die Landesbeauftragte für Datenschutz und Informationsfreiheit
    Bettina Gayk hält diese Fassung ausweislich ihres Tätigkeitsberichts für nicht verfassungskonform.

    '
