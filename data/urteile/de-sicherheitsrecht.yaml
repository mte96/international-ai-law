  letzte_pruefung: '2026-09-07'
  eigene_bewertung: 'Die eigentliche Bewährungsprobe des hessenDATA-Urteils. Die Beschwerde zielt genau
    auf den fünften Leitsatz: ob der hessische Gesetzgeber die wesentlichen Begrenzungen selbst getroffen
    hat oder ob er sie faktisch der Polizei überlassen hat. Wird die Beschwerde Erfolg haben, ist auch
    die Regelungstechnik der übrigen Länder erschüttert, weil sie derselben Logik folgt. Bemerkenswert:
    Die Beschwerde ist seit über zwei Jahren anhängig, während die betroffene Software in Hessen weiter
    läuft und die Bundesregierung mit § 9b BKAG-E parallel eine Bundesrechtsgrundlage schafft - das Gericht
    entscheidet also möglicherweise über eine Regelungstechnik, die sich zwischenzeitlich bundesweit verfestigt
    hat. Ein Aktenzeichen ist öffentlich nicht auffindbar.

    '
  sekundaerquelle_url: https://freiheitsrechte.org/uploads/documents/Freiheit-im-digitalen-Zeitalter/Polizeigesetz-Hessen/Verfassungsbeschwerdeschrift-HSOG.pdf
  dokumenttyp: Amtliche Verfahrensmitteilung des Gerichts (Ausgewählte Neueingänge 2024) — Entscheidung
    noch nicht ergangen
  pruefvermerk:
  - In der Sache ist bis heute keine Entscheidung ergangen; ein 'Volltext' im Sinne eines Urteils oder
    Beschlusses existiert daher nicht. Amtlich verfügbar ist allein der Nachweis des Verfahrens in der
    vom Gericht selbst geführten Rubrik 'Ausgewählte Neueingänge'.
  - Dort geführt als 1 BvR 1557/24, Gegenstand 'Automatisierte Datenanalyse durch die Hessischen Polizeibehörden'
    (§ 25a HSOG), Eingang Juni 2024 — deckungsgleich mit dem Eintragsdatum 21.06.2024.
  - Damit ist die im Eintrag stehende Angabe 'Aktenzeichen nicht veröffentlicht' überholt; das Aktenzeichen
    ist amtlich bekannt gemacht.
  - Der bisherige Link (Verfassungsbeschwerdeschrift auf freiheitsrechte.org) ist eine Parteischrift,
    kein Gerichtsdokument, und bleibt als Beleg für Beschwerdeführer und Prozessbevollmächtigten brauchbar.
  - Bestätigt durch die Stellungnahme des CCC vom Jahr 2026 zum Verfahren 1 BvR 1557/24 (ccc.de/updates/2026/palantir-hsog).
  - '07.09.2026: 1 BvR 1557/24 (automatisierte Datenanalyse nach § 25a HSOG) ist in der amtlichen Liste
    der geplanten Entscheidungen des Ersten Senats nicht aufgeführt. Die Liste umfasst zwanzig Verfahren,
    darunter mehrere polizeirechtliche (1 BvF 1/18, 1 BvR 2271/18, 1 BvR 506/19 zum BayPAG; 1 BvR 2817/20
    zum SächsPVDG; 1 BvR 2450/24 zur TKÜ eines Journalisten), nicht aber das hessische Verfahren. Keine
    Entscheidung, kein Termin.'
  normen:
  - gg-art-1-abs-1
  - gg-art-2-abs-1
  - hsog-25a
  quelle_art: amtlich
  sachverhalt: Nach dem hessenDATA-Urteil des Bundesverfassungsgerichts vom 16. Februar 2023 musste Hessen
    § 25a HSOG bis zum 30. September 2023 neu fassen. Der Landtag tat das mit dem Gesetz zur Änderung
    sicherheitsrechtlicher Vorschriften und zur Umorganisation der hessischen Bereitschaftspolizei vom
    29. Juni 2023 (GVBl. S. 456); die Polizei setzt die Analysesoftware seither weiter ein. Sechs Personen
    — unter ihnen wieder Franz Josef Hanke und die Rechtsanwältin Seda Başay-Yıldız — erhoben am 21. Juni
    2024 erneut Verfassungsbeschwerde, vertreten von Prof. Dr. Tobias Singelnstein und unterstützt von
    der Gesellschaft für Freiheitsrechte; die Erhebung wurde am 25. Juni 2024 bekannt gegeben. Sie beanstanden,
    dass weiterhin Daten völlig unbeteiligter Personen in die Software eingespeist werden dürften, dass
    die Schwellen für das Hineingeraten in den Fokus zu niedrig seien, dass Kennzeichnungspflichten für
    Daten nach ihrem Erhebungszweck fehlten und dass wesentliche Regelungsbefugnisse an die Polizeibehörden
    abgegeben würden.
