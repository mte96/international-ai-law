  quelle_tracker: Bundesverfassungsgericht (Entscheidungsdatenbank und Pressemitteilung), Gesellschaft
    für Freiheitsrechte, Verfassungsblog
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die Leitentscheidung zur algorithmischen Verarbeitung im Sicherheitsrecht. Fünf Leitsätze
    tragen sie. Erstens: Die automatisierte Verarbeitung gespeicherter Daten durch Datenanalyseanwendungen
    greift in das Recht auf informationelle Selbstbestimmung aller Personen ein, deren Daten einbezogen
    werden - auch der völlig Unbeteiligten. Zweitens: Das Gewicht dieses Eingriffs speist sich aus der
    Belastung durch die vorangegangene Erhebung und aus eigenständigen Wirkungen; die Verhältnismäßigkeit
    verlangt deshalb eine stärkere Rechtfertigung als die Erhebung allein. Drittens: Die Rechtfertigungsanforderungen
    richten sich nach der Eingriffsintensität der gesetzlichen Ausgestaltung; der Gesetzgeber kann das
    Eingriffsgewicht über Regeln zu Art und Umfang der Daten und zu den Analysemethoden steuern. Viertens:
    Eingriffsintensive automatisierte Analyse ist nur zum Schutz gewichtiger Rechtsgüter bei konkretisierter
    Gefahr zulässig, sofern nicht gesetzliche Begrenzungen von Daten und Methoden das Eingriffsgewicht
    deutlich senken. Fünftens - der praktisch folgenreichste Satz: Die wesentlichen Begrenzungen muss
    der Gesetzgeber selbst treffen; wo er die Ausgestaltung der Verwaltung überlässt, muss diese die Kriterien
    abstrakt formulieren und transparent veröffentlichen. Damit ist die Entscheidung nicht nur Polizeirecht,
    sondern eine Wesentlichkeitsentscheidung über algorithmische Verwaltung insgesamt: Die Parameter eines
    Analysesystems sind nicht Verwaltungsinternum, sondern regelungsbedürftiger Grundrechtseingriff. Übersehen
    wird oft, dass das Gericht kein Verbot ausgesprochen hat - es hat eine Skala eingezogen und dem Gesetzgeber
    Stellschrauben benannt. Genau diese Offenheit hat die Länder zu sehr unterschiedlichen Regelungsmodellen
    veranlasst und den Streit in die nächste Runde getragen. Die ECLI konnte auf der amtlichen Seite nicht
    angezeigt werden; die hier eingetragene Kennung folgt dem systematischen BVerfG-Schema und ist insoweit
    nicht primärquellenbelegt.

    '
  normen:
  - gg-art-1-abs-1
  - gg-art-2-abs-1
  - hmbpoldvg-49
  - hsog-25a
  quelle_art: amtlich
  sachverhalt: 'Hessen erwarb bereits 2017 das Programm „Gotham" des Softwareunternehmens Palantir und
    setzte es unter dem Namen „hessenDATA" ein; eine eigene Rechtsgrundlage schuf der Landesgesetzgeber
    erst 2018 mit § 25a HSOG, unter Hinweis auf die Mordserie des „NSU". Die Vorschrift — und die ihr
    weitgehend gleichlautende Regelung in § 49 HmbPolDVG — erlaubt der Polizei, bisher unverbundene automatisierte
    Dateien und Datenquellen in einer Analyseplattform zu vernetzen und die Bestände durch Suchfunktionen
    systematisch zu erschließen: Beziehungen zwischen Personen, Gruppierungen, Institutionen, Organisationen
    und Sachen herzustellen, unbedeutende Informationen auszuschließen und eingehende Erkenntnisse bekannten
    Sachverhalten zuzuordnen. Einbezogen werden dabei auch die Daten von Personen, die mit einer Straftat
    nichts zu tun haben. In Hessen wird von dieser Befugnis jährlich tausendfach Gebrauch gemacht; § 49
    HmbPolDVG war bis dahin nicht angewendet worden. Sechs Betroffene — unter ihnen Franz Josef Hanke
    von der Humanistischen Union und die Rechtsanwältin Seda Başay-Yıldız —, unterstützt von der Gesellschaft
    für Freiheitsrechte, erhoben gegen beide Vorschriften Verfassungsbeschwerde.'
  sachverhalt_quelle: volltext
