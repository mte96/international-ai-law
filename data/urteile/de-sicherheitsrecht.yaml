  anspruchsgrundlage: Verfassung von Berlin i.V.m. Art. 2 Abs. 1, Art. 1 Abs. 1 GG; Allgemeines Sicherheits-
    und Ordnungsgesetz (ASOG) in der Fassung der Novelle vom Dezember 2025
  kernfrage: Sind die durch die ASOG-Novelle vom Dezember 2025 geschaffenen Befugnisse, insbesondere die
    plattformgestützte automatisierte Datenanalyse, mit der Verfassung von Berlin vereinbar?
  ergebnis: 'Noch nicht entschieden. Die Fraktionen von Grünen und Linken haben am 28. August 2026 einen
    Normenkontrollantrag beim Verfassungsgerichtshof des Landes Berlin gestellt. Angegriffen werden fünf
    erweiterte Befugnisse; im Zentrum steht die automatisierte Datenanalyse, die es der Polizei erlaubt,
    Datenbestände auf einer Plattform zusammenzuführen und KI-gestützt auszuwerten. Der Senat erklärt,
    Palantir-Software nicht einsetzen zu wollen; die Antragsteller halten dem entgegen, dass die Befugnis
    besteht und von künftigen Mehrheiten genutzt werden könnte. Mit einer Entscheidung wird frühestens
    in ein bis zwei Jahren gerechnet.

    '
  bedeutung: mittel
  volltext_url: null
