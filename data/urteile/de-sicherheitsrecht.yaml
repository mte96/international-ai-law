  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Der schwächst belegte der vier Länderfälle: Dass eine Verfassungsbeschwerde gegen
    die nordrhein-westfälische Rechtsgrundlage anhängig ist, wird von der GFF und von netzpolitik.org
    übereinstimmend berichtet, ein Aktenzeichen und ein Erhebungsdatum sind aber nicht auffindbar. Das
    hier eingetragene Datum ist ein Platzhalter und ausdrücklich nicht verifiziert; belegt ist nur, dass
    das Verfahren im Januar 2024 bereits lief. Praktisch bedeutsam wird der Fall dadurch, dass die Aufsichtsbehörde
    selbst die Verfassungswidrigkeit feststellt - ein seltener Vorgang - und dass der NRW-Vertrag mit
    Palantir Mitte Oktober 2026 ausläuft. Die Landesregierung könnte die Frage durch Nichtverlängerung
    faktisch erledigen, bevor Karlsruhe entscheidet.

    '
