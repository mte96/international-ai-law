  anspruchsgrundlage: Art. 2 Abs. 1 i.V.m. Art. 1 Abs. 1 GG; § 25a HSOG in der Fassung des Gesetzes zur
    Änderung sicherheitsrechtlicher Vorschriften und zur Umorganisation der hessischen Bereitschaftspolizei
    vom 29.06.2023 (GVBl. S. 456)
  kernfrage: Genügt die hessische Neufassung des § 25a HSOG den Maßstäben, die das BVerfG im hessenDATA-Urteil
    für die automatisierte Datenanalyse aufgestellt hat?
  ergebnis: 'Noch nicht entschieden. Die Beschwerdeschrift datiert vom 21. Juni 2024, die Erhebung wurde
    am 25. Juni 2024 bekannt gegeben. Angegriffen werden § 25a Abs. 2 Satz 1 Nr. 1 bis 3 HSOG jeweils
    in Verbindung mit § 25a Abs. 1 Sätze 2 bis 5, Abs. 2 Sätze 2 bis 4, Abs. 3, Abs. 4 Satz 6 und Abs.
    5 Satz 2 HSOG. Die Beschwerdeführenden rügen, dass weiterhin Daten völlig unbeteiligter Personen in
    die Analysesoftware eingespeist werden dürfen, dass die Schwellen für das Hineingeraten in den Fokus
    absurd niedrig seien, dass klare Kennzeichnungspflichten für Daten nach ihrem Erhebungszweck fehlten
    und dass wesentliche Regelungsbefugnisse an die Polizeibehörden delegiert würden, die sie ohne parlamentarische
    Debatte ändern könnten.

    '
  bedeutung: hoch
  volltext_url: https://www.bundesverfassungsgericht.de/DE/Aktuelles/AusgewaehlteNeueingaenge/vs_2024/ausgewaehlte-Neueingaenge2024_node.html
