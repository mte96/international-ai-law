  anspruchsgrundlage: Art. 2 Abs. 1 i.V.m. Art. 1 Abs. 1 GG (Recht auf informationelle Selbstbestimmung);
    § 25a Abs. 1 Alt. 1 HSOG; § 49 Abs. 1 Alt. 1 HmbPolDVG
  kernfrage: Unter welchen verfassungsrechtlichen Voraussetzungen darf die Polizei bereits gespeicherte
    personenbezogene Daten mit einer automatisierten Anwendung datenbankübergreifend analysieren?
  ergebnis: 'Der Erste Senat erklärte § 49 Abs. 1 Alt. 1 des Hamburgischen PolDVG für mit Art. 2 Abs.
    1 i.V.m. Art. 1 Abs. 1 GG unvereinbar und nichtig und § 25a Abs. 1 Alt. 1 HSOG für mit denselben Normen
    unvereinbar, ließ die hessische Vorschrift aber bis zum 30. September 2023 unter verschärften Maßgaben
    fort gelten. Tragend ist, dass die automatisierte Datenanalyse einen eigenständigen Grundrechtseingriff
    darstellt, dessen Gewicht über das der vorangegangenen Datenerhebung hinausgeht, weil sie durch Mustererkennung
    und Profilbildung neue, persönlichkeitsrelevante Informationen erzeugen kann, die sonst unzugänglich
    blieben. Beide Vorschriften blieben nach den Worten des Gerichts "weit hinter der verfassungsrechtlich
    gebotenen Schwelle einer konkretisierten Gefahr" zurück. Die Verfassungsbeschwerde im Verfahren 1
    BvR 2634/20 wurde im Übrigen zurückgewiesen; Hamburg hat den Beschwerdeführenden zwei Drittel der
    notwendigen Auslagen zu erstatten.

    '
  bedeutung: hoch
  volltext_url: https://www.bundesverfassungsgericht.de/SharedDocs/Entscheidungen/DE/2023/02/rs20230216_1bvr154719.html
  zusammenfassung_url: https://www.bundesverfassungsgericht.de/SharedDocs/Pressemitteilungen/DE/2023/bvg23-018.html
