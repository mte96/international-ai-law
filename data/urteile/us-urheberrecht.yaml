  kernfrage: Begründen 624 iterative Prompts nebst Upscaling und Nachbearbeitung eine hinreichende menschliche
    Urheberschaft an einem mit Midjourney erzeugten Bild?
  ergebnis: 'Noch nicht entschieden. Allen wendet sich gegen die Registrierungsverweigerung für "Théâtre
    D''opéra Spatial", das 2022 den Kunstpreis der Colorado State Fair gewann. Er trägt mindestens 624
    Prompt-Iterationen sowie Nachbearbeitung mit Adobe Photoshop und Gigapixel AI vor. Das Copyright Office
    beantragte im Januar 2026 Summary Judgment: Prompts seien Ideen oder Anweisungen, nicht Ausdruck;
    die expressiven Elemente habe das System erzeugt. Allens Replik folgte im Februar 2026. Ein Amicus
    Curiae von Prof. Edward Lee (02.09.2025) argumentiert, das Office wende einen im Gesetz nicht vorgesehenen
    Maßstab der "traditional elements of authorship" an; nach Feist und Burrow-Giles genügten Auswahl
    und Anordnung, detaillierte Prompts könnten das leisten. Entscheidungsreif seit Februar 2026, keine
    Entscheidung bis 27.08.2026.

    '
  bedeutung: hoch
  volltext_url: https://storage.courtlistener.com/recap/gov.uscourts.cod.237436/gov.uscourts.cod.237436.47.0.pdf
  zusammenfassung_url: https://copyrightlately.com/thaler-is-dead-ai-copyright-questions/
  bezug_regelwerke: []
