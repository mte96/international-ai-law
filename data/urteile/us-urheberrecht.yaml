    Klägerwerken seien relevant, weil erst sie erlauben, die Häufigkeit verletzender Ausgaben ins Verhältnis
    zur Gesamtnutzung zu setzen. Die vorhandene De-Identifizierung plus Schutzanordnung genüge als Schutz.
