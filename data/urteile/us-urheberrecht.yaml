  - Der bisherige Link war eine Universitätskopie.
  quelle_art: amtlich
  sachverhalt: Die Musikverlage Concord Music Group, Universal Music Publishing und ABKCO halten die Rechte
    an den Texten mehrerer hundert Lieder. Sie stellten fest, dass Claude diese Texte auf entsprechende
    Aufforderung ganz oder teilweise ausgab, und führten das darauf zurück, dass Anthropic sie aus den
    Netzabzügen Common Crawl und The Pile in das Training übernommen hatte. Im Oktober 2023 klagten sie
    in Tennessee; das Verfahren wurde später nach Kalifornien verwiesen. Sie beantragten eine einstweilige
    Verfügung, die sowohl die Ausgabe der Texte als auch das Training mit ihnen untersagen sollte. Am
    2. Januar 2025 bestätigte das Gericht eine Vereinbarung, in der Anthropic zusagte, die bereits eingebauten
    Ausgabesperren für Liedtexte in allen Modellen und Produkten beizubehalten und auf künftige Modelle
    zu erstrecken — damit blieb von dem Antrag nur der Trainingsteil übrig.
