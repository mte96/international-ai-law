  quelle_tracker: CourtListener/RECAP Docket 3:23-cv-03417 (N.D. Cal.), Dkt. 598 mit ECF-Kopfstempel;
    Copyright Alliance; Authors Guild
  verifiziert: true
  letzte_pruefung: &id001 2026-09-05
  eigene_bewertung: 'Formal ein Sieg für Meta, inhaltlich eine Anleitung für die nächste Klägergeneration.
    Die Marktverwässerungstheorie ist der einzige ernstzunehmende dogmatische Neuansatz des gesamten Komplexes:
    Sie löst Faktor 4 von der Substitutionsprüfung und macht ihn zu einer Frage der Marktstruktur. Ökonomisch
    überzeugend, methodisch heikel — Campbell und Google v. Oracle prüfen Substitution, nicht Wettbewerbsintensität;
    konsequent zu Ende gedacht würde die Theorie auch menschliche Konkurrenz erfassen. Genau hier setzt
    Alsups Schulkinder-Argument an. Wichtig: Chhabrias Urteil ist nicht rechtskräftig, der Torrent-Anspruch
    ist offen, und ein Endurteil steht noch aus. Wer Kadrey als "Meta hat gewonnen" zusammenfasst, hat
    die Entscheidung nicht gelesen.

    '
  normen:
  - usc-17-106
  - usc-17-107
