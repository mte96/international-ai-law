  kernfrage: Setzt § 1202(b) DMCA voraus, dass die verbreitete Kopie mit dem Original identisch ist ('identicality
    requirement')?
  ergebnis: 'Tigar bejahte das Identitätserfordernis und wies die CMI-Ansprüche gegen GitHub Copilot ab:
    Copilot gebe in aller Regel keine identischen Codeausschnitte aus, sondern Varianten; § 1202(b) erfasse
    nur die Entfernung von CMI aus im Übrigen identischen Kopien. Am 30.09.2024 ließ er die Zwischenberufung
    zu; der Ninth Circuit nahm sie am 20.12.2024 an.

    '
