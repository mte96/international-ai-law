  quelle_art: amtlich
  sachverhalt: 'OpenAI entwickelte das Codemodell Codex; darauf beruht GitHub Copilot, ein Werkzeug, das
    Programmierern unmittelbar im Editor Codezeilen und ganze Funktionen vorschlägt. Trainiert wurde es
    mit öffentlich auf GitHub abgelegtem Code, der überwiegend unter Open-Source-Lizenzen steht — MIT,
    GNU GPL 2.0 und 3.0, GNU AGPL 3.0, BSD mit drei Klauseln und Apache 2.0. Diese Lizenzen erlauben die
    Weiterverwendung nur, wenn Urheberbenennung, Urheberrechtsvermerk und Lizenztext mitgeführt werden.
    Mehrere Entwickler, die unter solchen Lizenzen veröffentlicht hatten, klagten anonym als Doe 1 bis
    Doe 5 gegen GitHub, Microsoft und OpenAI: Copilot gebe lizenzierten Code aus, ohne Benennung, Vermerk
    und Lizenz mitzuliefern. Copilot gibt allerdings in aller Regel keinen wörtlich übereinstimmenden
    Code aus, sondern Varianten; darauf stützten sich die Beklagten, nachdem die Klage bereits mehrfach
    geändert worden war.'
