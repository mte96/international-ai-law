  ergebnis: 'Noch nicht entschieden. Erste Klage großer Hollywood-Studios gegen einen Bildgenerator; die
    Klageschrift stützt sich überwiegend auf Output-Ähnlichkeit und legt Gegenüberstellungen erzeugter
    Bilder mit Darth Vader, Homer Simpson, den Minions u.a. vor. Warner Bros. Discovery klagte am 04.09.2025
    separat (No. 2:25-cv-08376); Judge Kronstadt verband die Verfahren im November 2025 und setzte am
    18.11.2025 den Vorbereitungszeitplan. Am 17.11.2025 ordnete er private Mediation an (Frist 19.08.2026);
    als Mediator wurde am 16.12.2025 Magistrate Judge a.D. Suzanne H. Segal bestimmt. Am 18.06.2026 wies
    Magistrate Judge Richlin Midjourneys Antrag weitgehend ab, Disneys eigene KI-Nutzung auszuforschen
    — sie sei für die Fair-Use-Verteidigung irrelevant. Am 22.07.2026 beantragte Midjourney unter Berufung
    auf Cox v. Sony judgment on the pleadings gegen den contributory-Anspruch; Disney versucht seit dem
    13.08.2026, ihn über eine Inducement-Theorie zu retten.

    '
