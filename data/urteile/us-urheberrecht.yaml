  anspruchsgrundlage: 17 U.S.C. § 1202(b)(1); Art. III U.S. Const.
  kernfrage: Begründet die Entfernung von Copyright Management Information aus Trainingsdaten für sich
    genommen einen Art.-III-Schaden?
  ergebnis: 'Nein. McMahon wies die Klage mangels Klagebefugnis ab. Der bloße Verstoß gegen § 1202(b)
    ohne konkreten, dem historischen Common Law vergleichbaren Schaden genüge nicht; die Kläger hätten
    keine Ausgabe benannt, die ihre Inhalte ohne CMI wiedergegeben habe. Bezeichnend die Passage, in der
    die Richterin die "wahre" Beschwer benennt: Die Kläger störe nicht die entfernte CMI, sondern dass
    ihre Werke ohne Vergütung genutzt wurden — dafür sei § 1202 aber nicht das Instrument. Judge Stein
    lehnte am 18.06.2025 eine Wiedererwägung ab.

    '
