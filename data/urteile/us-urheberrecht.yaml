  status: anhaengig
  themenachsen:
  - urheberrecht
  anspruchsgrundlage: 17 U.S.C. § 106; 17 U.S.C. § 1202(b); Lanham Act § 43(a) (trade dress, false endorsement)
  kernfrage: Genügt der Vortrag, ein Diffusionsmodell sei so trainiert, dass es Werke im Stil bestimmter
    Künstler erzeugt, für Ansprüche wegen induzierter Verletzung, trade dress und CMI-Entfernung?
  ergebnis: 'Gemischtes Ergebnis. Die direkte Verletzung durch die Trainingskopien überlebte gegen alle
    Beklagten. Induzierte Verletzung überlebte gegen Stability AI und Runway AI — plausibel sei, dass
    die Verbreitung von Stable Diffusion in der Anwendung durch Endnutzer Verletzungen erzeuge. Die Lanham-Act-Ansprüche
    (false endorsement und trade dress) überlebten allein gegen Midjourney, gestützt darauf, dass Midjourney
    Künstlernamen in Bewerbung und Betrieb seines Produkts verwendete (rund 4.700 Namen in einer "Style
    List"). Entscheidend und meist übersehen: Orrick wies sämtliche DMCA-§-1202(b)-Ansprüche gegen alle
    vier Beklagten MIT PRÄKLUSION ab und schloss sich dabei ausdrücklich dem Identitätserfordernis an
    — es fehle an Vortrag, dass die Ausgaben mit den Werken der Kläger identisch seien. Bereicherungsansprüche
    wurden als vom Urheberrecht verdrängt abgewiesen, mit Nachbesserungsmöglichkeit.

    '
