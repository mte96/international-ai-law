    volltext_url von Justia auf das eingereichte Dokument umgestellt.
  quelle_art: amtlich
  sachverhalt: Dreizehn Autoren — unter ihnen Richard Kadrey, Sarah Silverman und Ta-Nehisi Coates — schrieben
    Romane, Theaterstücke, Kurzgeschichten, Memoiren, Essays und Sachbücher, darunter mit dem Pulitzer-Preis
    ausgezeichnete Titel. Meta versuchte zunächst, Bücher für das Training seiner Llama-Modelle zu lizenzieren;
    der Leiter des Bereichs generative KI sprach über bis zu 100 Millionen US-Dollar, doch die Verlage
    halten die für KI-Training nötigen Nebenrechte gar nicht — sie liegen bei den Autoren. Im Oktober
    2022 lud Meta erstmals die Schattenbibliothek Library Genesis herunter, um zu prüfen, ob ein Training
    darauf lohne; nach dem Scheitern der Lizenzverhandlungen und einer Vorlage bei Mark Zuckerberg entschied
    das Unternehmen, die Werke aus LibGen einfach zu verwenden. Bezogen wurden LibGen und Anna's Archive
    über BitTorrent, ein Verfahren, bei dem der Herunterladende zugleich Teile an andere weitergibt. Mindestens
    666 Exemplare von Büchern der dreizehn Kläger waren darunter. Die Autoren klagten 2023 in San Francisco;
    die Beweisaufnahme legte diese internen Vorgänge offen, und beide Seiten beantragten Summary Judgment.
  sachverhalt_quelle: volltext
