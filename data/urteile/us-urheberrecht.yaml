  anspruchsgrundlage: 17 U.S.C. § 502; 17 U.S.C. § 106
  kernfrage: Rechtfertigt die Nutzung von Liedtexten als Trainingsmaterial eine einstweilige Verfügung
    gegen das Training selbst?
  ergebnis: 'Antrag abgelehnt. Vorausgegangen war am 02.01.2025 eine gerichtlich bestätigte Stipulation
    über "guardrails": Anthropic verpflichtete sich, die bereits implementierten Ausgabesperren für Liedtexte
    in allen aktuellen Modellen und Produkten beizubehalten und auf künftige Modelle zu erstrecken. Damit
    war der Output-Teil des Verfügungsantrags erledigt; es blieb der Input-Teil (Training). Judge Lee
    hielt den Antrag insoweit für zu weit gefasst und verneinte irreparablen Schaden: Reputationsschäden
    seien im Wesentlichen aus den Claude-Ausgaben abgeleitet, die die Stipulation adressiere; verlorene
    Lizenzabschlüsse oder verschlechterte Konditionen auf bestehenden Märkten seien nicht belegt, und
    der Vortrag zum entstehenden Markt für KI-Trainingslizenzen sei spekulativ.

    '
  bedeutung: hoch
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-cand-5_24-cv-03811/pdf/USCOURTS-cand-5_24-cv-03811-1.pdf
  zusammenfassung_url: https://www.loeb.com/en/insights/publications/2025/04/concord-music-group-inc-v-anthropic-pbc
