  anspruchsgrundlage: 17 U.S.C. § 301 (preemption); 28 U.S.C. § 1447
  kernfrage: Werden vertrags- und deliktsrechtliche Ansprüche gegen das Scraping von Nutzerinhalten für
    KI-Training durch das Bundesurheberrecht verdrängt?
  ergebnis: 'Nein. Judge Thompson verwies das Verfahren an das kalifornische Staatsgericht zurück. Sämtliche
    Ansprüche — Vertragsbruch, ungerechtfertigte Bereicherung, trespass to chattels, Verleitung zum Vertragsbruch,
    unlauterer Wettbewerb — enthielten ein "extra element" und seien qualitativ anders als eine Urheberrechtsverletzung.
    Der Vertragsanspruch beruhe auf der Nutzungsvereinbarung von Reddit, die kommerzielles Scraping untersagt
    und damit eine vom Urheberrecht unabhängige Pflicht begründe; die Deliktsansprüche zielten auf das
    Umgehen technischer Schutzvorkehrungen und die Verletzung von Zugangsbeschränkungen, nicht auf Vervielfältigung
    oder Verbreitung. Ein Case Management Conference im Staatsgericht war für den 22.07.2026 angesetzt.

    '
