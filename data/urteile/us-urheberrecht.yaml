- id: us-2023-andersen-mtd
  jurisdiktion: us
  gericht: United States District Court, Northern District of California (Judge William H. Orrick)
  instanz: erstinstanzlich
  aktenzeichen: No. 3:23-cv-00201-WHO
  ecli: null
  datum: 2023-10-30
  parteien:
    klaeger: Sarah Andersen, Kelly McKernan, Karla Ortiz u.a. (Klasse)
    beklagter: Stability AI Ltd.; Midjourney, Inc.; DeviantArt, Inc.
  status: anhaengig
  themenachsen:
  - urheberrecht
  anspruchsgrundlage: 17 U.S.C. § 106; Lanham Act § 43(a)
  kernfrage: Ist die Vervielfältigung von Bildern beim Training eines Diffusionsmodells verletzend, auch
    wenn das Modell selbst keine Kopien enthält?
  ergebnis: 'Nur ein einziger Anspruch überlebte: die direkte Urheberrechtsverletzung durch Sarah Andersen
    gegen Stability AI, beschränkt auf ihre 16 registrierten Sammelwerke. Die Ansprüche von McKernan und
    Ortiz scheiterten mangels Registrierung (mit Präklusion). Abgewiesen mit Nachbesserungsmöglichkeit
    wurden mittelbare Verletzung gegen DeviantArt und Midjourney, sämtliche DMCA-Ansprüche, Right-of-Publicity-,
    Wettbewerbs- und Feststellungsansprüche sowie der Vertragsanspruch gegen DeviantArt. Zur Kerntheorie:
    Orrick hielt den Vortrag, Stable Diffusion enthalte "compressed copies" der Trainingsbilder, für in
    sich widersprüchlich — die Kläger beschrieben zugleich rein statistisch-mathematische Verfahren —
    und verlangte plausible Tatsachen dazu, ob das Modell Bilder rekonstruieren könne. Tragfähig blieb
    allein, dass beim Training tatsächlich Vervielfältigungsstücke entstanden.

    '
  bedeutung: hoch
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-cand-3_23-cv-00201/pdf/USCOURTS-cand-3_23-cv-00201-0.pdf
  zusammenfassung_url: https://copyrightalliance.org/andersen-v-stability-ai-copyright-case/
  bezug_regelwerke: []
  instanzenzug:
  - us-2024-andersen-mtd2
  - us-2026-andersen-status
  quelle_tracker: Lutzker & Lutzker (Volltext); Copyright Alliance; Cleary Gottlieb
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die erste Entscheidung überhaupt zu generativer KI und Urheberrecht. Ihre bleibende
    Aussage: Das Modell ist keine Kopie, die Trainingskopie schon. Diese Trennung von Modell und Trainingsvorgang
    trägt bis heute jede US-Entscheidung — auch Alsup und Chhabria — und ist der Grund, weshalb "Memorisierung"
    bislang nur Beweismittel und nicht Haftungsgrund ist.

    '
  normen:
  - usc-17-106
  - usc-15-1125-a
  sekundaerquelle_url: https://www.lutzker.com/wp-content/uploads/2023/12/Andersen-v.-Stability-AI-Ltd.pdf
