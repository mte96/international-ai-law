  eigene_bewertung: 'Die strategisch wichtigste Entscheidung des Jahres für Plattformbetreiber — und die,
    die die Fair-Use-Debatte umgeht. Wer eine Nutzungsvereinbarung mit Scraping-Verbot hat, braucht kein
    Urheberrecht: Vertragsrecht kennt kein Fair Use, keine Registrierungserfordernis und keine Werkschwelle.
    Für Betreiber nutzergenerierter Inhalte, die an fremden Werken gar keine Rechte halten, ist das der
    einzige gangbare Weg. Die Kehrseite: Es verlagert die Kontrolle über Trainingsdaten von den Urhebern
    zu den Plattformen.

    '
