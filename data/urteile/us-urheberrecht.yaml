  quelle_tracker: Loeb & Loeb; Quinn Emanuel; Berkeley Law
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Zwei Lehren. Erstens: Die guardrails-Stipulation ist das erste Mal, dass ein KI-Anbieter
    gerichtlich bindende Ausgabefilter zusagt — ein Regulierungsinstrument, das aus einem Zivilprozess
    entsteht und das die KI-VO-Debatte um Art. 53 Abs. 1 lit. c übersieht. Zweitens: Die Ablehnung des
    Input-Teils zeigt, warum Rechteinhaber KI-Training praktisch nicht per Unterlassung stoppen können
    — der Schaden ist stets erst nachträglich bezifferbar. Fundstelle: 772 F. Supp. 3d 1131; 2025 WL 1482734.

    '
  normen:
