  anspruchsgrundlage: 17 U.S.C. § 106, § 107
  kernfrage: Ist das Training von Llama mit Büchern aus Schattenbibliotheken Fair Use, und ist die Verwässerung
    des Marktes durch KI-erzeugte Konkurrenzwerke ein Schaden im Sinne des vierten Faktors?
  ergebnis: 'Summary Judgment für Meta — aber mit einer Begründung, die als Warnung formuliert ist. Chhabria
    hielt das Training für "highly transformative", entschied aber ausdrücklich nur über die 13 Kläger
    dieses Verfahrens: Sie hätten den entscheidenden Marktschaden schlicht nicht vorgetragen. Zentral
    das obiter dictum zur "market dilution": Der potentiell wichtigste Faktor-4-Schaden sei nicht die
    wörtliche Substitution, sondern die Überschwemmung des Marktes mit KI-erzeugten Werken, die die Originale
    nicht kopieren, aber deren Nachfrage verwässern. Wo dies nachgewiesen werde, sei Training "in den
    meisten Fällen" rechtswidrig. Wörtlich: die Entscheidung stehe nicht für den Satz, "that Meta''s use
    of copyrighted materials to train its language models is lawful", sondern nur dafür, dass diese Kläger
    die falschen Argumente vorgetragen hätten. Die Beschaffung über BitTorrent aus LibGen und Anna''s
    Archive blieb als eigener Anspruch anhängig; anders als Alsup behandelte Chhabria Beschaffung und
    Training nicht als trennbare Nutzungen.

    '
  bedeutung: hoch
  volltext_url: https://storage.courtlistener.com/recap/gov.uscourts.cand.415175/gov.uscourts.cand.415175.598.0_2.pdf
  zusammenfassung_url: https://copyrightalliance.org/kadrey-v-meta-decision/
  bezug_regelwerke: []
