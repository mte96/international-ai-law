  quelle_tracker: RECAP/CourtListener; Copyright Lately; Chat GPT Is Eating the World
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Nach dem Thaler-Cert-Denial die wichtigste offene Schutzfähigkeitsfrage in den USA
    — und die einzige mit unmittelbarer Relevanz für jeden, der mit generativer KI arbeitet. Die Burrow-Giles-Analogie
    (Fotografie 1884) ist stark, aber nicht zwingend: Der Fotograf kontrolliert Ausschnitt, Licht und
    Moment unmittelbar; der Prompt-Autor beschreibt ein Ziel und überlässt die Ausführung. Falls Martínez
    das Office bestätigt, entsteht in den USA eine breite Kategorie kommerziell genutzter, aber schutzloser
    Bilder — mit erheblichen Folgen für Lizenzverträge und für die Frage, was Agenturen ihren Kunden überhaupt
    garantieren können. Die Divergenz zu Europa (Schöpfungshöhe, "eigene geistige Schöpfung") wäre dann
    geringer, als die Debatte suggeriert.

    '
  normen:
  - usc-17-102-a
  - usc-5-706
  quelle_art: amtlich
  sachverhalt: Jason M. Allen erzeugte mit Midjourney ein Bild, das er "Théâtre D'opéra Spatial" nannte,
    und gewann damit 2022 den Kunstpreis der Colorado State Fair. Nach eigener Darstellung hatte er dafür
    mindestens 624 Textanweisungen nacheinander eingegeben und das Ergebnis anschließend mit Adobe Photoshop
    und Gigapixel AI nachbearbeitet und hochskaliert. Er meldete das Bild beim US Copyright Office zur
    Eintragung an. Das Amt verweigerte sie, weil die ausdrucksstarken Elemente vom System und nicht von
    ihm stammten und Textanweisungen Ideen oder Anweisungen seien, kein Ausdruck; es blieb auch nach Widerspruch
    dabei. Im September 2024 klagte Allen in Denver gegen das Amt und dessen Leiterin Shira Perlmutter.
  sachverhalt_quelle: eintrag
