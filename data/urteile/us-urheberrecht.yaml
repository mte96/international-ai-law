  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Das Gegenstück zu Ziff Davis und damit die Konturierung der § 1201-Linie: robots.txt
    bittet, CAPTCHA sperrt. Wer sich gegen KI-Scraping wehren will, muss technisch aufrüsten — eine rechtliche
    Erklärung genügt nicht. Praktisch bedeutsam ist die Ausdehnung auf die Zulieferkette: SerpApi, Oxylabs
    und AWMProxy sind reine Infrastrukturanbieter. Wenn der Anspruch trägt, haftet nicht nur, wer trainiert,
    sondern auch, wer die Werkzeuge liefert.

    '
  normen:
  - usc-17-1201-a-1
  - usc-17-1201-a-2
  - usc-17-1201-b
  quelle_art: amtlich
  sachverhalt: Reddit-Beiträge sind über die Google-Suche in großem Umfang erreichbar. Google schützt
    seine Suchergebnisse mit einer Vorrichtung namens SearchGuard, die automatisierte Abrufe durch JavaScript-Prüfungen
    und CAPTCHAs abwehrt. Reddit trug vor, Perplexity AI habe seine Inhalte nicht wie andere Anbieter
    lizenziert, sondern über den Dienstleister SerpApi bezogen, der mit Proxy-Servern und menschliches
    Verhalten nachahmenden Techniken SearchGuard umgehe und die so gewonnenen Suchergebnisse weiterverkaufe;
    die Proxy-Netze stammten von Oxylabs und AWMProxy. Die abgegriffenen Beiträge landeten in der Datenbank,
    aus der Perplexity seine Antworten zusammensetzt. Im Oktober 2025 klagte Reddit in Manhattan gegen
    SerpApi, Perplexity, Oxylabs und AWMProxy.
  sachverhalt_quelle: eintrag
