    Venable
  verifiziert: true
  letzte_pruefung: *id002
  eigene_bewertung: 'Das Identitätserfordernis ist der wirksamste Filter, den die Beklagten im gesamten
    Komplex haben: Es macht § 1202 gerade dort unanwendbar, wo generative Modelle typischerweise arbeiten
    — bei variierender, nicht wörtlicher Ausgabe. Kippt der Ninth Circuit es, entsteht schlagartig ein
    verschuldensunabhängiger Anspruch mit statutarischem Schadensersatz (2.500 bis 25.000 USD je Verstoß)
    ohne Notwendigkeit eines Werkvergleichs. Das wäre wirtschaftlich einschneidender als jede Fair-Use-Entscheidung.

    '
