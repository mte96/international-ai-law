  - us-2025-bartz-vergleich-prelim
  - us-2026-bartz-vergleich-final
  quelle_tracker: Authors Alliance; Benesch; Norton Rose Fulbright
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die eigentliche Waffe. Nicht die Fair-Use-Entscheidung, sondern die Klassenzertifizierung
    hat Anthropic an den Verhandlungstisch gezwungen — sechs Wochen später stand der Vergleich. Genau
    deshalb ist sie nie überprüft worden: Der Vergleich hat die Rule-23(f)- Berufung erledigt. Es gibt
    bis heute keine Appellate-Entscheidung dazu, ob Massenklassen für Trainingsdatensätze zertifizierbar
    sind. Wer daraus ableitet, das sei geklärt, irrt — es ist nur einmal passiert, und niemand konnte
    es überprüfen lassen.

    '
