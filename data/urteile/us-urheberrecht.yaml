  ergebnis: 'Ja, jedenfalls für § 1202(b)(1). Rakoff ließ den Anspruch wegen Entfernung von Autoren- und
    Titelangaben aus den zum Training genutzten Artikeln zu (Kurzentscheidung 21.11.2024, ausführliche
