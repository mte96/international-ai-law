  anspruchsgrundlage: 17 U.S.C. § 102(a), § 201(a), § 203, § 204(a), § 302(a)
  kernfrage: Verlangt der Copyright Act 1976 einen menschlichen Urheber?
  ergebnis: 'Ja. Panel: Circuit Judges Millett und Wilkins sowie Senior Circuit Judge Rogers; Verfasserin
    Millett. "Authors" im Sinne des Copyright Act müssen Menschen sein. Das Gericht stützt sich rein systematisch
    auf eine Kette von Vorschriften, die Rechts- und Lebensfähigkeit voraussetzen: § 102(a) ("original
    works of authorship"), § 201(a) (Erstzuordnung an den Urheber), § 302(a) (Schutzdauer = Lebenszeit
    plus 70 Jahre), § 203 (Rückrufrecht hinterbliebener Angehöriger) und § 204(a) (eigenhändige Unterschrift
    bei der Rechtsübertragung). Maschinen behandele das Gesetz durchgehend als "inert instrument" im Dienst
    eines Urhebers. Ausdrücklich offengelassen wurden drei Punkte: ob bereits die Intellectual Property
    Clause der Verfassung menschliche Urheberschaft verlangt; ob Thaler selbst als Urheber gelten könnte,
    weil er das System geschaffen und betrieben hat (dieses Argument hatte er im Verfahren verwirkt);
    und die Behandlung hypothetisch empfindungsfähiger Maschinen. 1087 F.4th 1 (D.C. Cir. 2025).

    '
  bedeutung: hoch
  volltext_url: https://media.cadc.uscourts.gov/opinions/docs/2025/03/23-5233.pdf
  zusammenfassung_url: https://www.carltonfields.com/insights/publications/2025/no-copyright-protection-for-ai-assisted-creations-thaler-v-perlmutter
  bezug_regelwerke: []
  instanzenzug:
  - us-2023-thaler-district
  - us-2026-thaler-cert-denied
  quelle_tracker: media.cadc.uscourts.gov (Volltext); Carlton Fields; Finnegan
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die einzige berufungsgerichtlich bestätigte Aussage des gesamten US-KI-Urheberrechts.
    Ihre Reichweite ist trotzdem schmal: Sie sagt, dass eine Maschine nicht Urheberin sein kann, nicht,
    wie viel menschlicher Beitrag genügt. Entscheidend und wenig beachtet ist die Verwirkung: Thaler hatte
    im Verwaltungsverfahren jede eigene schöpferische Beteiligung bestritten und konnte deshalb das Argument,
    er selbst sei der Urheber, nicht mehr vorbringen. Genau dieses verwirkte Argument ist die Frage, die
    die Praxis beschäftigt — und sie wird jetzt erstmals in Allen v. Perlmutter entschieden. Bemerkenswert
    ist auch, dass das Gericht die verfassungsrechtliche Ebene ausdrücklich offenliess: Der Kongress könnte
    die Frage anders regeln.

    '
  normen:
  - usc-17-102-a
  - usc-17-201-a
