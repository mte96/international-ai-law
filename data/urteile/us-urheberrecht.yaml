  eigene_bewertung: 'Der prozesstaktisch sauberste Fall der Klägerseite: Disney braucht keine Trainingsdaten-Discovery
    und keine Marktverwässerungstheorie, sondern legt Bilder nebeneinander. Genau deshalb ist er für die
    Fair-Use-Dogmatik weniger ergiebig als Bartz oder Kadrey — die Frage ist nicht, ob Training zulässig
    ist, sondern ob die Ausgabe verletzt, und das ist klassisches Urheberrecht. Der eigentliche Kampf
    läuft über die mittelbare Haftung, und dort hat Cox v. Sony die Latte gerade erheblich angehoben.
    Die angeordnete Mediation mit Frist 19.08.2026 legt nahe, dass das Gericht mit einer Lizenzlösung
    rechnet — Disneys OpenAI-Deal vom 11.12.2025 (1 Mrd. USD Investment, Figurenrechte für Sora) zeigt,
    dass die Studios lizenzieren, wo sie nicht klagen.

    '
