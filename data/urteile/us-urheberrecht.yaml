  - gpai
  anspruchsgrundlage: 17 U.S.C. § 107; 17 U.S.C. § 102(a)
  kernfrage: 'Erstmals vor einem US-Bundesberufungsgericht: Ist das Training eines KI-Systems mit urheberrechtlich
    geschütztem Material Fair Use?'
  ergebnis: 'Noch nicht entschieden. Mündliche Verhandlung am 11.06.2026 im Maris Courtroom, Philadelphia,
    vor Circuit Judges Luis Felipe Restrepo, Tamika Montgomery-Reeves und Emil Bove III. (Bibas ist als
    Entscheider der Vorinstanz nicht beteiligt.) Zwei zertifizierte Fragen: Originalität der West-Headnotes
    und Fair Use. Das Gericht konzentrierte sich auf Faktor 1 (ist ROSS ein bloßer "cheat sheet" zu ohnehin
    öffentlichen Entscheidungen oder eine "materiell andere" Technologie) und Faktor 4 (welcher Markt
    ist der relevante). Schriftsatzwechsel Dez. 2025 abgeschlossen; am 27.04.2026 ordnete das Gericht
    Ergänzungsschriftsätze zu ASTM v. UpCodes an, die am 12.05.2026 eingingen — die Parteien legen die
    Entscheidung gegensätzlich aus. Entscheidung wird für Ende 2026 erwartet.

    '
  bedeutung: hoch
  volltext_url: https://www.courtlistener.com/docket/70622297/thomson-reuters-enterprise-centre-gmbh-v-ross-intelligence-inc/
  zusammenfassung_url: https://www.lawnext.com/2026/06/at-3rd-circuit-judges-press-ross-and-thomson-reuters-on-fair-use-ai-training-and-market-harm.html
  bezug_regelwerke: []
  instanzenzug:
  - us-2025-thomson-reuters-ross-fairuse
  - us-2025-ross-1292b-certification
  quelle_tracker: Chat GPT Is Eating the World; Baker Botts; LawSites; Sterne Kessler
  verifiziert: true
  letzte_pruefung: '2026-09-07'
  eigene_bewertung: 'Das wichtigste anhängige KI-Urheberrechtsverfahren der Welt. Die Reichweite hängt
    an einer Weichenstellung: Entscheidet der Third Circuit eng auf Faktor 1 (ROSS baute ein direktes
    Substitut), bleibt das Urteil für generative Modelle weitgehend folgenlos. Entscheidet er über Faktor
    4 und den Markt für Trainingsdatenlizenzen, wird es die Grundlage jeder künftigen Fair-Use-Prüfung
    — auch im Ninth Circuit, wo Kadrey und Bartz beheimatet sind. Bemerkenswert: Der Third Circuit ist
    urheberrechtlich kein Schwergewicht; dass er zuerst entscheidet, ist Zufall der Prozessführung. Ein
    späterer Ninth- Circuit-Split ist strukturell angelegt.

    '
  normen:
  - usc-17-107
  - usc-17-102-a
  pruefvermerk:
  - '07.09.2026: Unverändert: mündlich verhandelt am 11.06.2026, nicht entschieden. Eine Suche auf ca3.uscourts.gov
    und govinfo.gov nach "25-2153" ergab kein Berufungspaket; govinfo führt zu diesem Verfahren nur das
    erstinstanzliche Paket USCOURTS-ded-1_20-cv-00613 mit letztem Dokument vom 11.02.2025. Die beiden
    zertifizierten Fragen bleiben offen. quelle_art von "amtlich" auf "datenbank" berichtigt — volltext_url
    zeigt auf eine CourtListener-Docketseite.'
  quelle_art: amtlich
  sachverhalt: 'Im Februar 2025 revidierte der in Delaware tätige Berufungsrichter Stephanos Bibas seine
    eigene Entscheidung von 2023 und gab Thomson Reuters recht: Die Headnotes seien schutzfähig, die Nutzung
    durch ROSS Intelligence kein Fair Use. ROSS, dessen Geschäftsbetrieb inzwischen eingestellt war, erwirkte
    die Zulassung der Zwischenberufung, und der Third Circuit nahm die Sache mit zwei zertifizierten Fragen
    an — Originalität der Headnotes und Fair Use. Der Schriftsatzwechsel wurde im Dezember 2025 abgeschlossen.
    Am 27. April 2026 forderte das Gericht Ergänzungsschriftsätze zu der inzwischen ergangenen Entscheidung
    ASTM v. UpCodes an; sie gingen am 12. Mai 2026 ein, und die Parteien legten diese Entscheidung gegensätzlich
    aus. Am 11. Juni 2026 wurde in Philadelphia mündlich verhandelt.'
  sachverhalt_quelle: eintrag
- id: us-2025-bartz-anthropic-fairuse
  jurisdiktion: us
  gericht: United States District Court, Northern District of California (Senior Judge William Alsup)
  instanz: erstinstanzlich
  aktenzeichen: No. 3:24-cv-05417-WHA
  ecli: null
  datum: 2025-06-23
  parteien:
    klaeger: Andrea Bartz, Charles Graeber, Kirk Wallace Johnson (Klasse)
    beklagter: Anthropic PBC
  status: vergleich
  themenachsen:
  - urheberrecht
  - gpai
  anspruchsgrundlage: 17 U.S.C. § 106, § 107
  kernfrage: Ist das Training eines LLM mit Büchern Fair Use, und macht es einen Unterschied, ob die Bücher
    gekauft oder aus Schattenbibliotheken heruntergeladen wurden?
  ergebnis: 'Alsup trennte drei Nutzungen. (1) Training mit rechtmäßig beschafften Büchern: Fair Use.
    Die Nutzung sei "exceedingly transformative", "spectacularly so"; LLMs lernten wie Schriftsteller
    aus Gelesenem. (2) Digitalisierung gekaufter Printbücher zur internen Nutzung nach Vernichtung der
    Papierexemplare: Fair Use als Formatwechsel. (3) Herunterladen und dauerhaftes Vorhalten von über
    sieben Millionen Raubkopien (Books3, LibGen, PiLiMi) zum Aufbau einer permanenten "Zentralbibliothek":
    KEIN Fair Use. Anthropic habe "no entitlement to use pirated copies for a central library"; dass die
    Kopien später auch dem Training dienten, heile die Verletzung nicht. Ausdrücklich zurückgewiesen:
    die Marktverwässerungstheorie — Wettbewerb durch neue, nicht kopierende Werke sei kein urheberrechtlich
    geschützter Schaden ("like teaching schoolchildren to write well").

    '
  bedeutung: hoch
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-cand-3_24-cv-05417/pdf/USCOURTS-cand-3_24-cv-05417-0.pdf
  zusammenfassung_url: https://www.goodwinlaw.com/en/insights/publications/2025/06/alerts-practices-aiml-district-court-issues-ai-fair-use-decision
  bezug_regelwerke: []
  instanzenzug:
  - us-2025-bartz-class-cert
  - us-2025-bartz-vergleich-prelim
  - us-2026-bartz-vergleich-final
  quelle_tracker: Chat GPT Is Eating the World; Goodwin; Ropes & Gray; Akin
  verifiziert: true
  letzte_pruefung: 2026-09-03
  eigene_bewertung: 'Die folgenreichste Entscheidung des ganzen Komplexes — und zwar wegen des Teils,
    den Anthropic verlor, nicht wegen des Teils, den es gewann. Alsups Trennung von Beschaffung und Nutzung
    ist juristisch schlicht (eine Raubkopie bleibt eine Raubkopie, egal wofür man sie später verwendet)
    und wirtschaftlich verheerend: Sie verwandelt eine Fair-Use-Frage in eine Schadensrechnung mit sieben
    Millionen Positionen. Chhabria widersprach zwei Tage später ausdrücklich. Übersehen wird meist, dass
    Alsup die Marktverwässerung mit ungewöhnlicher Schärfe zurückweist — der einzige Punkt, an dem er
    ausdrücklich gegen Chhabria steht, und der eigentliche Dogmatikstreit.

    '
  normen:
  - usc-17-106
  - usc-17-107
  - usc-17-202
  sekundaerquelle_url: https://copyrightalliance.org/wp-content/uploads/2025/06/Bartz-v.-Anthropic-Order.pdf
  dokumenttyp: Order on Fair Use (Summary Judgment)
  pruefvermerk:
  - 'Volltext geöffnet: N.D. Cal., No. C 24-05417 WHA, Richter William Alsup, 23.06.2025 — Gericht, Aktenzeichen,
    Datum und Parteien stimmen überein.'
  - 'Ergebnis bestätigt: Training und Format-Shifting gekaufter Bücher = fair use; Vorhalten raubkopierter
    Werke in der Zentralbibliothek nicht.'
  - Dasselbe Dokument ist auch über RECAP abrufbar (storage.courtlistener.com/recap/gov.uscourts.cand.434709/gov.uscourts.cand.434709.231.0.pdf);
    die govinfo-Fassung wurde als amtliche Quelle vorgezogen.
  quelle_art: amtlich
  sachverhalt: Andrea Bartz schrieb vier Romane, Charles Graeber die Sachbücher "The Good Nurse" und "The
    Breakthrough", Kirk Wallace Johnson drei weitere Sachbücher, darunter "The Feather Thief". Anthropic
    lud im Januar oder Februar 2021 durch seinen Mitgründer Ben Mann den Datensatz Books3 mit 196.640
    Büchern herunter, im Juni 2021 mindestens fünf Millionen Bücher aus Library Genesis und im Juli 2022
    mindestens zwei Millionen weitere aus dem Pirate Library Mirror — über sieben Millionen Raubkopien,
    darunter je mindestens zwei Werke jedes der drei Autoren. Intern hieß es, man wolle sich auf diesem
    Weg den rechtlichen und geschäftlichen Aufwand des Lizenzierens ersparen; gespeichert werden sollte
    alles und für immer, es gebe keinen zwingenden Grund, ein Buch zu löschen. Später kaufte Anthropic
    Millionen gedruckter Bücher, ließ Dienstleister die Bindungen abtrennen, die Seiten beschneiden und
    die Bücher einscannen und warf die Papierexemplare weg. Die drei Autoren klagten 2024 in San Francisco
    für sich und eine Gruppe von Rechteinhabern.
  sachverhalt_quelle: volltext
- id: us-2025-bartz-class-cert
  jurisdiktion: us
  gericht: United States District Court, Northern District of California (Senior Judge William Alsup)
  instanz: erstinstanzlich
  aktenzeichen: No. 3:24-cv-05417-WHA
  ecli: null
  datum: 2025-07-17
  parteien:
    klaeger: Andrea Bartz, Charles Graeber, Kirk Wallace Johnson
    beklagter: Anthropic PBC
  status: vergleich
  themenachsen:
  - urheberrecht
  anspruchsgrundlage: Fed. R. Civ. P. 23(b)(3)
  kernfrage: Kann eine Schadensersatzklasse für Rechteinhaber von Millionen Büchern zertifiziert werden,
    obwohl Rechtsinhaberschaft und Registrierung individuell zu klären sind?
  ergebnis: 'Alsup zertifizierte eine Klasse der Rechteinhaber an Werken, die in den von Anthropic heruntergeladenen
    LibGen- und PiLiMi-Datensätzen enthalten waren (ca. sieben Millionen Bücher), beschränkt auf Werke
    mit ISBN/ASIN und rechtzeitiger US-Registrierung. Gemeinsame Fragen überwögen, weil die Verletzungshandlung
    — der Download der Datensätze — für alle Klassenmitglieder identisch sei; Eigentums- und Registrierungsfragen
    seien administrierbar. Erst diese Entscheidung machte das Verfahren existenzbedrohend: bei 750 USD
    statutarischem Mindestschaden je Werk lag das nominale Risiko im Bereich mehrerer Milliarden, bei
    Vorsatz erheblich darüber.

    '
  bedeutung: hoch
  volltext_url: https://www.govinfo.gov/content/pkg/USCOURTS-cand-3_24-cv-05417/pdf/USCOURTS-cand-3_24-cv-05417-1.pdf
