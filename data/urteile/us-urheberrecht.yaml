    Kopie. Der Anspruch nach § 1202(b)(3) (Verbreitung) wurde abgewiesen. Damit steht Rakoff gegen McMahon
    im selben District — die viel zitierte "SDNY split". Im weiteren Verlauf hielt Rakoff die vorgelegten
    Beweise für hinreichend, um den Anspruch über das Summary-Judgment-Stadium hinauszutragen.

