  anspruchsgrundlage: 17 U.S.C. § 106, § 501; 17 U.S.C. § 1202(b); Common Law
  kernfrage: Sind Trainings- und Ausgabeansprüche gegen ein LLM schlüssig vorgetragen, und lässt sich
    Fair Use bereits im Stadium der Klageabweisung entscheiden?
  ergebnis: 'Stein wies die Abweisungsanträge weitgehend zurück. Bestehen blieben die Ansprüche wegen
    direkter Verletzung (auch für Handlungen, die mehr als drei Jahre vor Klageerhebung lagen — Stein
    ließ die "discovery rule" zu und verwarf die Verjährungseinrede nach 17 U.S.C. § 507(b)), die Ansprüche
    wegen mittelbarer Verletzung sowie die Markenverwässerungsansprüche im Daily-News-Verfahren. Zur mittelbaren
    Verletzung wandte Stein den Second-Circuit-Maßstab "actual or constructive knowledge" an und hielt
    Sony und Grokster im Pleadings-Stadium für unanwendbar — diese Grundlage ist durch Cox v. Sony (25.03.2026)
    entfallen, weshalb die Kläger die Ansprüche im Juni 2026 zurücknahmen. Abgewiesen wurden die misappropriation-Ansprüche
    nach Common Law (mit Präklusion) und die "abridgment"-Ansprüche im CIR-Verfahren. Bei den DMCA-Ansprüchen
    differenzierte Stein: § 1202(b)(1) fiel gegen Microsoft in allen drei Verfahren und gegen OpenAI im
    Times-Verfahren, blieb aber gegen OpenAI in den Verfahren Daily News und CIR bestehen; § 1202(b)(3)
    fiel durchgehend (ohne Präklusion). Fair Use sei eine Tatsachenfrage und im Pleadings-Stadium nicht
    entscheidbar.

    '
  bedeutung: hoch
