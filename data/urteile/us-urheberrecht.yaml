- id: us-2025-thomson-reuters-ross-fairuse
  jurisdiktion: us
  gericht: United States District Court, District of Delaware (Circuit Judge Stephanos Bibas, sitting
    by designation)
  instanz: erstinstanzlich
  aktenzeichen: No. 1:20-cv-00613-SB
  ecli: null
  datum: 2025-02-11
  parteien:
    klaeger: Thomson Reuters Enterprise Centre GmbH; West Publishing Corp.
    beklagter: ROSS Intelligence Inc.
  status: rechtsmittel
  themenachsen:
  - urheberrecht
  - gpai
  anspruchsgrundlage: 17 U.S.C. § 102(a), § 106, § 107
  kernfrage: Ist die Vervielfältigung urheberrechtlich geschützter Headnotes zum Training eines KI-Rechercheprodukts,
    das dem Original Konkurrenz macht, Fair Use?
  ergebnis: 'Bibas hob seine eigene Entscheidung von 2023 weitgehend auf und gewährte Thomson Reuters
    Summary Judgment: 2.243 Headnotes sind hinreichend original (Maßstab: Feist, minimale Schöpfungshöhe;
    Analogie zum Bildhauer, der aus Marmor ein Werk schlägt), und ROSS'' Nutzung ist NICHT durch Fair
    Use gedeckt. Faktor 1: nicht transformativ, weil ROSS ein marktsubstituierendes Konkurrenzprodukt
    zu Westlaw baute; kommerziell. Faktor 4 (nach Bibas "der wichtigste"): Schaden sowohl auf dem Markt
    für Westlaw selbst als auch auf dem Markt für Trainingsdatenlizenzen — dieser Markt müsse nicht bereits
    existieren, um berücksichtigt zu werden. Faktoren 2 und 3 gingen an ROSS. Ausdrücklich ausgenommen:
    generative KI. Bibas betonte, ROSS sei ein nicht-generatives Suchsystem gewesen.

    '
  bedeutung: hoch
  volltext_url: https://www.ded.uscourts.gov/sites/ded/files/opinions/20-613_5.pdf
  zusammenfassung_url: https://www.jenner.com/en/news-insights/client-alerts/court-decides-that-use-of-copyrighted-works-in-ai-training-is-not-fair-use-thomson-reuters-enterprise-centre-gmbh-v-ross-intelligence-inc
  bezug_regelwerke: []
  instanzenzug:
  - us-2023-thomson-reuters-ross-sj1
  - us-2025-ross-1292b-certification
  - us-2026-ross-3circuit
  quelle_tracker: Chat GPT Is Eating the World; Jenner & Block; Kluwer Copyright Blog
  verifiziert: true
  letzte_pruefung: 2026-08-27
  eigene_bewertung: 'Die einzige US-Entscheidung, die Fair Use beim KI-Training verneint — und zugleich
    diejenige, die am leichtesten wegdiskutiert wird, weil Bibas generative Modelle ausdrücklich ausklammerte.
    Diese Selbstbeschränkung ist der Grund, weshalb Alsup und Chhabria sie vier Monate später kaum ernst
    nahmen. Übersehen wird der Faktor-4- Teil: Bibas erkennt einen Markt für Trainingsdatenlizenzen an,
    der zum Entscheidungszeitpunkt gar nicht existierte. Das ist eine Zirkelschluss-Gefahr, die Alsup
    ausdrücklich rügt — und die der Third Circuit klären muss. Der Fall taugt schlecht als Leitfall (nicht-generative
    KI, Konkurrenzprodukt im selben Markt, Beklagte insolvent), ist aber der einzige, der es bis zur Berufung
    geschafft hat.

    '
  normen:
  - usc-17-102-a
  - usc-17-106
  - usc-17-107
  quelle_art: amtlich
  sachverhalt: Thomson Reuters betreibt die Rechercheplattform Westlaw. Zu jeder aufgenommenen Gerichtsentscheidung
    schreibt die Redaktion Headnotes — kurze Zusammenfassungen der tragenden Rechtssätze —, die über eine
    numerische Systematik, das Key Number System, erschlossen sind. ROSS Intelligence baute demgegenüber
    eine Suchmaschine, die auf eine in natürlicher Sprache gestellte Rechtsfrage bereits vorhandene Entscheidungen
    ausgibt, ohne selbst Text zu erzeugen. ROSS bat Thomson Reuters um eine Lizenz an den Westlaw-Inhalten
    und wurde abgewiesen, weil es ein Wettbewerber sei; daraufhin beauftragte es den Dienstleister LegalEase
    mit rund 25.000 "Bulk Memos" — von Anwälten formulierten Rechtsfragen samt guten und schlechten Antworten,
    die nach der Anweisung von LegalEase anhand der Westlaw-Headnotes zu bilden waren, ohne diese wörtlich
    zu übernehmen. Mit diesen Memos trainierte ROSS sein Suchwerkzeug. Nachdem derselbe Richter im September
    2023 beiden Seiten das Summary Judgment versagt und Schutzfähigkeit wie Fair Use der Jury zugewiesen
    hatte, nahm er die Anträge kurz vor dem Verhandlungstermin erneut auf.
  sachverhalt_quelle: volltext
