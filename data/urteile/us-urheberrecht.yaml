  quelle_art: amtlich
  sachverhalt: 'Im April 2025 fasste das Judicial Panel on Multidistrict Litigation sämtliche US-Urheberrechtsverfahren
    gegen OpenAI vor Richter Sidney Stein in Manhattan zusammen — die Klagen der New York Times, der acht
    Daily-News-Zeitungen, des Center for Investigative Reporting und von Ziff Davis ebenso wie die Sammelklagen
    von Buchautoren und Authors Guild. Aus der Beweisaufnahme erwuchs der Streit um die Herausgabe von
    20 Millionen Chatprotokollen, der das Verfahren über ein Jahr lang beschäftigte. Am 25. März 2026
    entschied der Supreme Court in Cox v. Sony über die Voraussetzungen mittelbarer Urheberrechtshaftung;
    daraufhin nahm die New York Times am 25. Juni 2026 ihren darauf gestützten Anspruch zurück, die Daily-News-Kläger
    einen Tag später, und OpenAI beantragte, über die verbliebenen mittelbaren Ansprüche nach Aktenlage
    zu entscheiden. Im Juni 2026 beantragte die Times zugleich, die Klage zu erweitern: Microsoft habe
    OpenAI zur Nutzung ihrer Artikel ermutigt. Über diese Anträge war zu befinden, während der Schriftsatzwechsel
    zum Summary Judgment noch lief.'
