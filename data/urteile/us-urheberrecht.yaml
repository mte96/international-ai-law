  kernfrage: Ist eine robots.txt-Datei eine wirksame technische Zugangskontrolle im Sinne von § 1201 DMCA?
  ergebnis: 'Nein. Stein wies den auf robots.txt gestützten Umgehungsanspruch ab: robots.txt kontrolliere
    den Zugang nicht, sondern äußere lediglich eine Bitte; sie sei keine "technological measure that effectively
    controls access". Ebenfalls abgewiesen: unjust enrichment (durch Bundesurheberrecht verdrängt) sowie
    Markenverwässerung mit Ausnahme der Marke MASHABLE. Bestehen blieben mittelbare Verletzung, die CMI-Entfernung
    nach § 1202(b)(1) und die Verbreitung von Werken mit entfernter CMI. Ansprüche zu neueren Modellen
    (o1, GPT-4.5, o3) wurden ausgesetzt.

    '
