    zur Verhandlung an; das Training selbst und das Einscannen gekaufter Bücher waren vom Tisch. Die drei
    Autoren beantragten daraufhin, für diesen verbliebenen Teil eine Schadensersatzgruppe zuzulassen:
    alle Rechteinhaber an Werken aus den von Anthropic heruntergeladenen LibGen- und PiLiMi-Datensätzen,
