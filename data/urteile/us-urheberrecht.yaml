  sachverhalt: Raw Story Media und AlterNet Media haben mehr als 400.000 Nachrichtenstücke, Recherchen
    und Meinungsbeiträge im Netz veröffentlicht. Sie trugen vor, Tausende ihrer Artikel seien in die Trainingsdatensätze
    WebText, WebText2 und Common Crawl eingegangen, nachdem Autoren-, Titel- und Urheberrechtsangaben
    entfernt worden seien. Deshalb nenne ChatGPT bei Antworten, die auf ihren Texten beruhten, weder Verfasser
    noch Quelle, sondern erscheine als allwissende Instanz. Eine konkrete Ausgabe, die einen ihrer Texte
    ohne diese Angaben wiedergegeben hätte, benannten sie nicht. Im Februar 2024 klagten sie in Manhattan,
