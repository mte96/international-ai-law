    Beklagte Stability AI Ltd., DeviantArt, Inc. und Midjourney, Inc. — deckungsgleich mit dem Eintrag.
  - 'Ergebnis: nur Andersens unmittelbarer Urheberrechtsanspruch gegen Stability AI bleibt bestehen; im
    Übrigen Abweisung mit Änderungsmöglichkeit.'
  - Der bisherige Link war eine Kanzleikopie.
  quelle_art: amtlich
  sachverhalt: Sarah Andersen ist hauptberuflich Cartoonistin und Illustratorin in Oregon und hält Rechte
    an über zweihundert Werken, die in den Trainingsdaten steckten; Kelly McKernan arbeitet als Künstlerin
    in Tennessee und hält Rechte an über dreißig, Karla Ortiz in Kalifornien an mindestens zwölf solcher
    Werke. Stability AI beschaffte sich ohne Erlaubnis Kopien von Milliarden geschützter Bilder, um daraus
    Stable Diffusion zu trainieren; über fünf Milliarden davon stammten aus dem Netzabzug, den die Initiative
    LAION zusammengetragen hatte. Der Vorstandsvorsitzende von Stability erklärte öffentlich, künftige
    Fassungen sollten auf vollständig lizenzierten Bildern beruhen — für die vorhandene Fassung hatte
    er keine Lizenzen eingeholt. DeviantArt brachte im November 2022 das kostenpflichtige Produkt DreamUp
    heraus, das auf Stable Diffusion aufsetzt; Midjourney hatte im Juli 2022 sein eigenes, gleichartig
    arbeitendes Produkt gestartet. Nutzer erzeugen damit Bilder, indem sie Textanweisungen eingeben, die
    ausdrücklich den Stil einer bestimmten Künstlerin verlangen. Im Januar 2023 klagten die drei Künstlerinnen
    in San Francisco für sich und eine Gruppe.
  sachverhalt_quelle: volltext
- id: us-2024-andersen-mtd2
  jurisdiktion: us
  gericht: United States District Court, Northern District of California (Judge William H. Orrick)
