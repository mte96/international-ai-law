  quelle_art: amtlich
  sachverhalt: 'Nachdem das Gericht im April 2025 entschieden hatte, dass die Fair-Use-Frage sich nicht
    ohne Tatsachenfeststellungen beantworten lässt, ging das Verfahren in die Beweisaufnahme. Die Zeitungskläger
    verlangten Zugriff auf Nutzergespräche mit ChatGPT: Erst daran lasse sich messen, wie oft das Modell
    ihre Inhalte ausgibt und in welchem Verhältnis das zur Gesamtnutzung steht. OpenAI bot an, nur nach
    Stichworten gefilterte Gespräche herauszugeben: Was den Filter nicht passiere, habe mit den Werken
    der Kläger nichts zu tun, und die Nutzer hätten ihre Gespräche im Vertrauen auf deren Vertraulichkeit
    geführt. Streitig blieb daraufhin die Herausgabe eines de-identifizierten Samples von 20 Millionen
    ChatGPT-Gesprächen.'
