  - 'ÜBERHOLT durch spätere Entscheidung: Mit Memorandum Order vom 06.08.2026 (MDL 1:25-md-03143, ECF
    No. 1662 = Dkt. 1449 in 1:23-cv-11195) hat Richter Stein die hier noch als fortbestehend beschriebenen
    Markenverwässerungsansprüche von New York Times und Daily News MIT Rechtskraftwirkung abgewiesen und
    ebenso die "material contribution"-Ansprüche wegen mittelbarer Verletzung gegen OpenAI und Microsoft;
    die Anträge auf Klageerweiterung gegen Microsoft (Dkt. 1590, 1598) wurden zurückgewiesen.'
  quelle_art: amtlich
  sachverhalt: Die New York Times hält mehr als zehn Millionen eingetragene Werke, sämtlich mit Urheberrechtsangaben
    versehen. Sie warf OpenAI und Microsoft vor, ihre Artikel über die Trainingsdatensätze WebText, WebText2
    und Common Crawl in erheblichem Umfang übernommen zu haben, und legte auf über hundert Seiten Beispiele
    vor, in denen ChatGPT Passagen ihrer Artikel wörtlich ausgab. Am 27. Dezember 2023 erhob sie in Manhattan
    Klage. Es folgten die Daily-News-Kläger — acht Lokalzeitungen, darunter die New York Daily News, die
    Chicago Tribune, der Denver Post und der Orlando Sentinel, viele von ihnen seit über hundert Jahren
    im Erscheinen — sowie das Center for Investigative Reporting, die älteste gemeinnützige Redaktion
    des Landes mit Mother Jones und Reveal. Im August 2024 reichte die Times eine geänderte Klage ein;
    in allen drei Verfahren beantragten die Beklagten Abweisung.
