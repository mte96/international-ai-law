  eigene_bewertung: 'Zwei Punkte, die in der Rezeption regelmäßig verlorengehen. Erstens die DMCA-Abweisung
    mit Präklusion: Damit steht ein zweiter Richter des Northern District of California neben Tigar auf
    der Seite des Identitätserfordernisses — die Position, die der Ninth Circuit in Doe 1 v. GitHub gerade
    überprüft. Fällt sie, lebt dieser Anspruch in sämtlichen Bildgeneratorverfahren wieder auf. Zweitens
    der trade-dress-Anspruch, der nur gegen Midjourney trägt: Urheberrechtlich ist Stil frei; kennzeichenrechtlich
    kann die Bewerbung eines Künstlernamens als Prompt-Parameter eine Herkunftstäuschung sein. Dieser
    Weg verlangt keinen Werkvergleich und keine Fair-Use-Prüfung und ist deshalb gegen Bildgeneratoren
    potentiell wirksamer als das Urheberrecht selbst.

