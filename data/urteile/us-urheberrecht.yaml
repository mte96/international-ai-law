  sachverhalt: Die Nutzungsvereinbarung von Reddit untersagt das gewerbliche Auslesen der Plattform ohne
    Lizenz; andere KI-Anbieter haben dafür Verträge geschlossen und zahlen. Reddit warf Anthropic vor,
    sich darüber hinweggesetzt und die Beiträge seiner Nutzer für das Training von Claude eingesammelt
    zu haben, obwohl das Unternehmen öffentlich erklärt hatte, seine Crawler seien blockiert. Im Juni
    2025 klagte Reddit vor dem Superior Court von San Francisco — nicht wegen Urheberrechtsverletzung,
    an den Beiträgen seiner Nutzer hält es die Rechte nicht, sondern wegen Vertragsbruchs, ungerechtfertigter
    Bereicherung, Besitzstörung, Verleitung zum Vertragsbruch und unlauteren Wettbewerbs. Anthropic ließ
    die Sache an das Bundesgericht verweisen und machte geltend, all diese Ansprüche seien der Sache nach
    urheberrechtlich und daher vom Bundesrecht verdrängt. Reddit beantragte die Zurückverweisung an das
    Staatsgericht.
