  eigene_bewertung: 'RAG ist der dogmatisch eigenständigste Sachverhalt des ganzen Komplexes: Es wird
    nicht trainiert, sondern zur Laufzeit abgerufen und zusammengefasst. Damit greifen weder die Transformativitätsargumente
