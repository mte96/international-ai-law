  anspruchsgrundlage: 17 U.S.C. § 107
  kernfrage: Ist das Training von GPT-Modellen mit journalistischen und literarischen Werken Fair Use?
  ergebnis: 'Noch nicht entschieden. Alle US-Urheberrechtsverfahren gegen OpenAI wurden im April 2025
    durch das JPML im MDL No. 3143 vor Judge Stein konzentriert. Die Summary-Judgment-Schriftsätze laufen;
    die Repliken wurden am 24.03.2026 von 16.10. auf den 06.11.2026 verschoben. Ein Anhörungstermin ist
    nicht gesetzt, ein Verhandlungstermin ebenfalls nicht. Nach der Cox-Entscheidung des Supreme Court
    ließ die New York Times am 25.06.2026 ihren contributory-infringement-Anspruch fallen, die Daily-News-Kläger
    am 26.06.2026; OpenAI beantragte im Juni 2026 judgment on the pleadings zu den verbliebenen mittelbaren
    Ansprüchen. Im Juni 2026 beantragte die Times, die Klage zu erweitern: Microsoft habe OpenAI zur Nutzung
    ihrer Artikel ermutigt. AM 06.08.2026 HAT RICHTER STEIN ÜBER DIESE ANTRÄGE ENTSCHIEDEN. Memorandum
    Order ECF No. 1662 (zugleich Dkt. 1449 in 1:23-cv-11195): New York Times und Daily News hätten keinen
    "good cause" für die begehrte Klageerweiterung um neue Theorien mittelbarer Haftung gegen Microsoft
    dargelegt; ihre Anträge (Dkt. 1590, 1598) werden zurückgewiesen. Der Rule-12(c)-Antrag von OpenAI
    (Dkt. 1586) wird gegenüber den News-Klägern als erledigt zurückgewiesen, weil diese der begehrten
    Abweisung zugestimmt hatten; das Gericht weist die "material contribution"-Ansprüche wegen mittelbarer
    Verletzung gegen OpenAI UND Microsoft, soweit sie auf unmittelbare Verletzungen durch Endnutzer gestützt
    sind, MIT Rechtskraftwirkung ab. Ebenfalls MIT Rechtskraftwirkung abgewiesen werden die Markenverwässerungsansprüche
    von New York Times und Daily News. Das Center for Investigative Reporting hat eine entsprechend bereinigte
    zweite geänderte Klage eingereicht (Dkt. 1620). Memorandum Order ECF No. 1661 entscheidet gleichlaufend
    für Ziff Davis (1:25-cv-04315): der 12(c)-Antrag ist erledigt; die ausgesetzten contributory- und
    Markenverwässerungsansprüche zu den Modellen o1, o1 mini, o1-pro, GPT-4.1, GPT-4.5, o3, o3-mini, o4-mini
    und GPT-5 werden OHNE, die aktiven Ansprüche MIT Rechtskraftwirkung abgewiesen. Über Summary Judgment
    ist weiterhin nicht entschieden; ein Summary-Judgment-Antrag ist zuletzt am 04.09.2026 eingegangen
    (Dkt. 1759).

    Stand 07.09.2026: Am 04.09.2026 haben beide Seiten ihre Summary-Judgment-Anträge eingereicht — für
    die Nachrichtenkläger die New York Times u.a., für die Sammelkläger Buchautoren und Authors Guild,
    für die Beklagten OpenAI und Microsoft; am selben Tag erging ein stipulated sealing order. Eine Entscheidung
    von Judge Stein ist nicht ergangen, ein Anhörungstermin zu Summary Judgment ist nicht angesetzt. Die
    Replikfrist 06.11.2026 steht.

    '
