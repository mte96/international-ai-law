    seien für jedes einzelne Werk gesondert zu klären und eine Gruppenbildung daher ausgeschlossen. Der
    gesetzliche Mindestschadensersatz beträgt 750 US-Dollar je Werk, bei vorsätzlicher Verletzung ein
    Vielfaches davon.'
