  - usc-17-204-a
  - usc-17-302-a
  quelle_art: amtlich
  sachverhalt: Der Informatiker Stephen Thaler baut Systeme künstlicher Intelligenz; eines davon nannte
    er "Creativity Machine". Es erzeugte ein Bild, dem er den Titel "A Recent Entrance to Paradise" gab.
    In der Anmeldung zur Eintragung beim US Copyright Office trug er die Creativity Machine als alleinige
    Urheberin ein und sich selbst nur als Rechtsinhaber; das Werk sei "2-D artwork, Created autonomously
    by machine". Das Amt lehnte die Eintragung ab, weil kein Mensch das Werk geschaffen habe, und blieb
    in zwei Überprüfungsverfahren dabei. Das Bundesgericht in Washington bestätigte die Ablehnung im August
    2023; Thaler legte Berufung zum D.C. Circuit ein.
  sachverhalt_quelle: volltext
