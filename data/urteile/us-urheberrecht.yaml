  eigene_bewertung: 'Die Entscheidung, die dem gesamten Verlagslager die Tür offen hielt. Ihr wichtigster
    Satz ist der langweiligste: Fair Use braucht Tatsachen. Damit war klar, dass jedes dieser Verfahren
    durch die Discovery muss — und genau daraus ist der Streit um 20 Millionen Chatprotokolle entstanden,
    der das Verfahren seit 2025 dominiert.

    '
