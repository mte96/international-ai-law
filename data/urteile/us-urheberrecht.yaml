  eigene_bewertung: 'Die wichtigste Absage an eine Klägerstrategie seit 2024. Verlage hatten gehofft,
    mit § 1201 DMCA ein Werkzeug gegen Scraping zu haben, das keinen Werkvergleich erfordert. Stein schließt
    den Weg für robots.txt. Bemerkenswert der Kontrast zu Reddit v. SerpApi (31.07.2026): Dort genügten
    CAPTCHAs und JavaScript-Challenges als Zugangskontrolle. Damit ist die Linie gezogen — wer Scraping
    rechtlich verhindern will, muss technisch tatsächlich sperren, nicht bitten. Das ist ein handfester
    Handlungshinweis für Rechteinhaber.

    '
