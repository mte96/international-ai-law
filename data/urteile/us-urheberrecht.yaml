  anspruchsgrundlage: 17 U.S.C. § 1201(a)(1)(A), § 1201(a)(2), § 1201(b); Common Law
  kernfrage: Sind CAPTCHAs und JavaScript-Challenges wirksame Zugangskontrollen im Sinne von § 1201 DMCA,
    auch wenn der geschützte Inhalt für Menschen frei lesbar bleibt?
  ergebnis: 'Ja. Das Gericht ließ die Ansprüche nach § 1201(a)(1)(A) (Umgehung) und § 1201(a)(2) (Handel
    mit Umgehungsmitteln) sowie den Anspruch wegen zivilrechtlicher Verschwörung zu. Googles "SearchGuard"
    mit JavaScript-Challenges und CAPTCHAs sei eine technische Maßnahme im Sinne von § 1201(a)(3)(B);
    dass derselbe Inhalt für menschliche Nutzer zugänglich bleibe, stehe dem nicht entgegen — Bild: eine
    Gesichtserkennung, die Bewohnern die Tür öffnet und Fremden nicht. Es sei plausibel vorgetragen, dass
    Perplexity über SerpApis Proxy-Server und menschliches Verhalten imitierende Techniken SearchGuard
    umging, um Reddit-Inhalte in seine RAG-Datenbank zu holen, statt wie andere KI-Anbieter zu lizenzieren.
    Abgewiesen: § 1201(b) sowie unjust enrichment und unlauterer Wettbewerb (Verdrängung durch das Urheberrecht).

    '
