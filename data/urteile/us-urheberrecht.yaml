  eigene_bewertung: 'Die praktisch folgenreichste Discovery-Entscheidung im KI-Recht. Sie beantwortet
    erstmals, wem die Gespräche mit einem Chatbot prozessual gehören — und die Antwort lautet: nicht dem
    Nutzer. Für die betriebliche KI-Nutzung ist das die wichtigere Nachricht als jede Fair-Use-Frage:
    Wer ein LLM einsetzt, muss damit rechnen, dass die Eingaben Dritter in einem fremden Rechtsstreit
    landen. Die De-Identifizierung ist dabei ein schwächerer Schutz, als sie klingt.

    '
  normen:
