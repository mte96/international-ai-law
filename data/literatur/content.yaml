  kernthese: Ein Wasserzeichen lässt sich durch Bevorzugung einer pseudozufällig bestimmten Tokenmenge
    beim Sampling einbetten, ist für Menschen unsichtbar und ohne Zugriff auf das Modell statistisch nachweisbar.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das technische Referenzverfahren, auf das sich jede Diskussion über Art. 50 Abs.
    2 KI-VO und über die chinesische Kennzeichnungspflicht bezieht, und der Beleg dafür, dass die Pflicht
    technisch grundsätzlich erfüllbar ist. Juristisch wichtig sind drei Eigenschaften, die der Text offenlegt
    und die in der Rechtsliteratur meist untergehen: Das Verfahren funktioniert nur bei hinreichend langem
    Text, es setzt Kontrolle über den Sampling-Vorgang voraus — also geschlossene Modelle — und es ist
    anbieterspezifisch, weil der Schlüssel beim Anbieter liegt. Damit ist die Kennzeichnungspflicht für
    offene Gewichte konstruktiv nicht erfüllbar, was Art. 50 Abs. 2 KI-VO nicht thematisiert. Gegenposition
    ist Zhang u.a. 2023.

    '
