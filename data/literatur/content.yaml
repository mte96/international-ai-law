- id: 2025-navarro-dolmestch-ia-criminogena
  typ: aufsatz
  autoren:
  - Navarro-Dolmestch, Roberto Andrés
  titel: Aproximación a la inteligencia artificial como factor criminógeno
  titel_deutsch: Annäherung an die künstliche Intelligenz als kriminogener Faktor
  fundstelle: Derecho PUCP 95 (2025), 303–339
  jahr: 2025
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/derechopucp/article/view/30551
