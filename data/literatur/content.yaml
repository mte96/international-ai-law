  kernthese: 'Starke Wasserzeichen sind unter natürlichen Annahmen unmöglich: Ein generischer Angriff
    entfernt die Markierung aus drei etablierten Verfahren bei nur geringfügigem Qualitätsverlust, auch
    wenn der Schlüssel geheim bleibt.'
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob Art. 50 Abs. 2 KI-VO — Markierungen, die "wirksam, interoperabel,
    robust und zuverlässig" sind, "soweit dies technisch möglich ist" — eine erfüllbare Pflicht begründet,
    und gegenüber welchem Angreifermodell. PFLICHT, weil dies das dritte Unmöglichkeitsergebnis dieser
    Akte ist und weil es unmittelbar auf einen Normtext trifft, der 2026 in Anwendung geht. Der Beweis
    ist konstruktiv: Die Autoren geben einen universellen Angriff an, der nur zwei Fähigkeiten voraussetzt
    — beurteilen können, ob eine Ausgabe gut ist, und sie leicht verändern können — und führen ihn erfolgreich
    gegen drei veröffentlichte Verfahren. Beides hat ein Angreifer mit Zugang zu irgendeinem hinreichend
    guten Modell, also praktisch jeder. Für die Auslegung folgt: Der Vorbehalt "soweit technisch möglich"
    ist keine Randbemerkung, sondern die tragende Einschränkung der Norm, und er ist nach dem Stand der
    Forschung gegenüber einem vorsätzlichen Entferner erfüllt — die Pflicht läuft dort leer. Umgekehrt
    bleibt sie gegenüber dem unvorsätzlichen Weiterverbreiter wirksam, und das ist der Adressat, den die
    Norm ausweislich Erwägungsgrund 133 eigentlich meint. Wer diese Unterscheidung — Angreifer gegen Zufallsnutzer
    — in die Auslegung einführt, löst den scheinbaren Widerspruch zwischen diesem Text und 2024-dathathri-synthid,
    und das ist der derzeit originellste Zugang zu Art. 50. ANGREIFBAR: Der Satz gilt für "starkes" Wasserzeichnen
    mit den definierten Qualitäts- und Störungsorakeln; die Autoren räumen ein, dass schwächere Garantien
    praktisch wertvoll bleiben. Wer den Text als Beleg dafür zitiert, Kennzeichnung sei sinnlos, missbraucht
    ihn.

    '
  letzte_pruefung: 2026-08-27
