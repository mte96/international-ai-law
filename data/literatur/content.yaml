  kernthese: Der Ruf nach einem Deepfake-Straftatbestand ist berechtigt, aber die Konzentration auf das
    Strafrecht verdeckt die strukturellen Probleme; § 184j StGB zeigt, wohin überhastete Anlassgesetzgebung
    führt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die notwendige Gegenposition zu Beck/Nussbaum und Crone, und die einzige in der freien
    Literatur. Epik warnt vor der symbolischen Strafgesetzgebung und führt § 184j StGB als Mahnmal an
    — ein Tatbestand, der aus einem Einzelereignis entstand, diskriminierende Untertöne trug und praktisch
    bedeutungslos blieb. Das ist der stärkste rechtspolitische Einwand gegen § 201b StGB-E. Schwach ist,
    dass Epik keine Alternative benennt, die über Prävention, Opferhilfe und Plattformverantwortung —
    also über Appelle — hinausgeht. Wer für den Tatbestand argumentiert, muss diesen Text entkräften;
    wer dagegen argumentiert, hat hier seine Grundlage. Ergänzt Beck.

    '
