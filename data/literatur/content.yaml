  kernthese: Der DSA erfasst generative KI-Anbieter nicht unmittelbar, sondern nur die Plattformen, die
    sie einbetten; die Lücke sollte durch eine Zug-um-Zug-Lösung geschlossen werden, die Risikomanagementpflichten
    gegen Haftungsprivilegien tauscht.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Gegenposition zu Schaal/Lenner/Akinyemi und der systematisch sauberere Zugriff:
    Statt GenAI in den vorhandenen VLOSE-Begriff zu pressen, schlagen Bassini und Palumbo eine eigene
    Kategorie mit eigenem Pflichtenprogramm vor. Für die deutsche Haftungsdebatte ist das der interessantere
    Vorschlag, weil er das Haftungsprivileg der §§ 7 ff. TMG beziehungsweise Art. 4 ff. DSA ausdrücklich
    adressiert — die Frage, ob ein Chatbot-Betreiber Diensteanbieter im Sinne des Haftungsprivilegs ist,
    ist in Deutschland ungeklärt und entscheidet über die Reichweite von § 823 BGB bei Halluzinationen.
    Angreifbar: Der Vorschlag ist de lege ferenda und hilft im laufenden Mandat nicht. Beide Autoren sind
    in den Niederlanden und Belgien tätig, der Text ist aber auf dem deutschen Verfassungsblog erschienen
