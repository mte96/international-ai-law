  kernthese: Der Schutz der körperlichen Integrität muss auf den 'digitalen Körper' erstreckt werden,
    weil die synthetische Nachbildung einer Person eine eigenständige Personenverletzung darstellt und
    nicht nur ein Informationsproblem ist.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Der spekulativste Text dieser Akte und deshalb interessant: Maatz überträgt die BGH-Rechtsprechung
    zu abgetrennten Körperteilen (BGHZ 124, 52) und das IT-Grundrecht (BVerfGE 120, 274) auf synthetische
    Abbilder und will daraus einen Anspruch auf körperliche Integrität ohne Körperlichkeit ableiten. Das
    trägt dogmatisch nicht — § 223 StGB setzt eine Substanzverletzung voraus, und das allgemeine Persönlichkeitsrecht
    deckt die Fälle bereits ab. Als Denkfigur für die Schutzgutbestimmung des § 201b StGB-E aber brauchbar:
    Wenn das geschützte Rechtsgut nicht die Information, sondern die Person ist, folgt daraus Crones Herstellungsstrafbarkeit.
    Aufgenommen als Ideengeber, nicht als Autorität.

    '
  letzte_pruefung: 2026-08-27
