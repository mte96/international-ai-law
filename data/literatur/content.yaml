  - Nussbaum, Maximilian
  titel: KI ohne Verantwortung? Grok, sexualisierte Deepfakes und die Verantwortung des Plattformbetreibers
  fundstelle: Verfassungsblog, 16.02.2026
  jahr: 2026
  sprache: de
  url: https://verfassungsblog.de/ki-grok-deepfakes-strafrecht/
