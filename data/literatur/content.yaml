  zugang: open-access
  jurisdiktionen:
  - cl
  - latam
  themenachsen:
  - content
  - grundrechte
  - governance
  kernthese: 'KI wirkt kriminogen auf zwei Ebenen — mikrokriminogen als technisches Mittel der Tatbegehung,
    makrokriminogen dadurch, dass ein "KI-Kapitalismus" soziale Konflikte erzeugt und den Strafrechtsapparat
    zu seinem eigenen Schutz in Anspruch nimmt.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der originellste kriminalpolitische Text der Sammlung. Die mikrokriminogene Ebene
    ist Standard — Deepfakes, automatisierter Betrug, synthetisches Missbrauchsmaterial —, aber die makrokriminogene
    These ist neu und unbequem: Navarro-Dolmestch behauptet, der KI-Kapitalismus erzeuge die Konflikte,
    zu deren Bewältigung er dann selbst das Strafrecht in Anspruch nehme. Das ist eine kriminalsoziologische,
    keine dogmatische Aussage, und sie ist empirisch nicht belegt; als Denkanstoss gegen die reflexhafte
    Forderung nach neuen Straftatbeständen (Deepfake- Delikte, Modellmanipulation) ist sie trotzdem wertvoll.
    Für die deutsche Diskussion um § 184b StGB und synthetisches Material und um die geplanten Deepfake-Tatbestände
    die interessanteste Gegenstimme, die ich in der Region gefunden habe. Chilenischer Autor, peruanische
    Zeitschrift.

    '
  letzte_pruefung: 2026-09-07
