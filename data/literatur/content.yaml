  kernthese: Art. 50 KI-VO staffelt die Transparenzpflichten nach Interaktionssystem, synthetischem Medium,
    Deepfake und Text zu Angelegenheiten öffentlichen Interesses, wobei die Ausnahmen für redaktionelle
    Kontrolle und offenkundig künstlerische Werke die praktisch wichtigsten Weichenstellungen sind.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die sauberste frei zugängliche deutschsprachige Durchdringung des Art. 50 KI-VO Absatz
    für Absatz — das, wofür man sonst einen Beck-Kommentar aufschlägt. Kanzleinah geschrieben, ohne wissenschaftlichen
    Apparat, aber die Normzitate sind korrekt und die Abgrenzungen (Abs. 3 Satz 2 für erkennbar künstlerische
    Werke, Abs. 4 Satz 2 für redaktionell geprüfte Texte) sind genau die, an denen sich die Praxis aufhängt.
    Ersetzt eine Kommentierung nicht — es fehlt jede Auseinandersetzung mit dem Streitstand, etwa der
    Frage, ob "maschinenlesbar" in Abs. 2 eine bestimmte Technik vorschreibt. Als Einstieg und für die
    Mandantenberatung reicht es. Zusammen mit Friedl deckt es Art. 50 frei ab, und das ist bemerkenswert.

    '
