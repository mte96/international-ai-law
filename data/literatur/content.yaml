  kernthese: Die KI-VO adressiert die parteipolitische Nutzung generativer Systeme nicht, weil sie am
    kommerziellen Risiko ansetzt; Parteien, die KI-erzeugte Unwahrheiten über Gegner verbreiten, verletzen
    ihre Mitwirkungspflicht aus Art. 21 GG und können verwaltungsgerichtlich in Anspruch genommen werden.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Die These, aus Art. 21 Abs. 1 GG folge eine Wahrhaftigkeitspflicht der Parteien,
    die verwaltungsgerichtlich durchsetzbar sei, ist gewagt und in der Staatsrechtslehre nicht anerkannt
    — der Parteienstatus begründet Aufgaben, nicht subjektive Abwehrrechte Dritter. Der Text ist trotzdem
    erfasst, weil er die einzige frei zugängliche deutsche Auseinandersetzung mit KI im Wahlkampf ist
    und weil er die Regelungslücke korrekt beschreibt: Art. 50 Abs. 4 KI-VO greift bei politischen Deepfakes
    nur, soweit es um Texte zu Angelegenheiten öffentlichen Interesses geht, und die Kennzeichnung heilt
    die Täuschung nicht. Nach der Trilogeinigung 2026 ist die Lücke geblieben.

    '
  letzte_pruefung: 2026-08-27
