  kernthese: Die Suchfunktion von ChatGPT erfüllt die Definition der Online-Suchmaschine in Art. 3 lit.
    j DSA und ist bei Überschreiten der Schwelle des Art. 33 Abs. 1 DSA als sehr große Online-Suchmaschine
    zu benennen, mit der Folge der Risikobewertungspflichten aus Art. 34 f. DSA.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die praktisch folgenreichste Auslegungsfrage des europäischen Plattformrechts im
    Jahr 2026: Wenn generative Suchdienste VLOSE sind, greifen Systemrisikobewertung, Auditpflichten und
    Bußgelder bis 6 Prozent des Weltumsatzes, und zwar unabhängig von der KI-VO und ohne deren verschobene
    Fristen. Die Autoren argumentieren funktional aus dem Wortlaut "in irgendeinem Format" — das ist überzeugend.
    Angreifbar ist der geopolitische Teil, der die Auslegung mit Souveränitätserwägungen stützt; das ist
    kein Auslegungskriterium. Für die deutsche Praxis wichtig, weil die Presseverlage denselben Weg über
