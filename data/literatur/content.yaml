  kernthese: Sexuelle Privatheit ist ein eigenständiges, dem Persönlichkeitsschutz vorgelagertes Schutzgut,
    das Grundlage sexueller Selbstbestimmung und Menschenwürde ist und eigene straf- und haftungsrechtliche
    Instrumente verlangt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die dogmatische Grundlage der NCII-Gesetzgebung beiderseits des Atlantiks und der
    Text, der erklärt, warum synthetische Darstellungen ein Rechtsgut verletzen, obwohl nichts Reales
    abgebildet ist — das Argument, das die deutsche Debatte um § 201b StGB-E trägt (vgl. Crone in 34_lit_deutsch.yaml)
    und das im amerikanischen Verfassungsrecht gerade NICHT durchdringt, wie Anderegg zeigt. Genau darin
    liegt der Wert für diese Akte: Citron formuliert die europäische Position in amerikanischer Sprache,
    ohne sie in den USA durchsetzen zu können. Angreifbar ist die Weite des Schutzguts; wer sexuelle Privatheit
    als eigenes Recht anerkennt, muss die Kollision mit der Meinungsfreiheit auflösen, und Citron tut
    das über eine Kategorienbildung (low-value speech), die der Supreme Court in dieser Form nicht anerkennt.

    '
  letzte_pruefung: 2026-08-27
