  kernthese: Deepfakes bedrohen Privatheit, Demokratie und nationale Sicherheit zugleich, und der gefährlichste
    Effekt ist nicht die Fälschung selbst, sondern die Lügendividende — die Möglichkeit, echte Aufnahmen
    als Fälschung abzutun.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Gründungstext des gesamten Rechtsgebiets; ohne ihn ist keine Deepfake-Debatte
    der letzten sieben Jahre zu verstehen, weil sowohl das Vokabular (liar''s dividend) als auch die Systematik
    (Privatheit, Demokratie, Sicherheit als drei getrennte Schutzgüter) von hier stammen. Für die europäische
    Arbeit ist die zweite Hälfte die wichtigere: Chesney und Citron gehen die Rechtsbehelfe durch — Delikt,
    Strafrecht, Plattformhaftung, Marktlösungen — und kommen zu dem Ergebnis, dass keiner allein trägt;
    genau diese Einsicht liegt der Kombination aus Art. 50 KI-VO, DSA-Risikomanagement und nationalen
    Strafnormen zugrunde, ohne dass die Union sie zitiert. Pflicht auch deshalb, weil der Text die Gegenposition
    zu den Entwarnungsstudien (Simon/Altay/Mercier, Kapoor/Narayanan) auf dem höchsten Niveau formuliert:
    Die Lügendividende ist ein Effekt, den die Zählung dokumentierter Deepfakes methodisch nicht erfassen
    kann. Angreifbar ist das amerikanische Zuschneiden — First Amendment, § 230 CDA —, das die Übertragung
    auf das deutsche Recht erschwert, und die Prognose, die Technik werde die Erkennung dauerhaft überholen;
    sie hat sich so nicht bestätigt.

    '
  letzte_pruefung: 2026-08-27
