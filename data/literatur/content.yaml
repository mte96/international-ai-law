  kernthese: Die eigentliche Gefahr generativer Sprachmodelle liegt nicht in ihren Faehigkeiten, sondern
    in der Bereitschaft der Nutzer, ihren Ausgaben zu glauben.
  eigene_bewertung: Von einem Informatiker geschrieben, nicht von einem Juristen, und trotzdem fuer die
    juristische Arbeit brauchbar - weil die Frage der Nutzererwartung genau der Anknuepfungspunkt fuer
    Kennzeichnungspflichten (Art. 50 KI-VO) und fuer die Frage der Irrefuehrung im Lauterkeitsrecht ist.
