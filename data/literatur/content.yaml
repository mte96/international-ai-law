  kernthese: Der indische Rechtsrahmen - POCSO Act, Information Technology Act und die IT Rules 2021 -
    erfasst KI-generiertes Missbrauchsmaterial nur unvollstaendig, weil Tatbestaende und Meldepflichten
    an die Existenz eines realen Opfers anknuepfen.
  eigene_bewertung: 'Fuer den Streitstand um den Besitz synthetischer Missbrauchsdarstellungen der wichtigste
    ausserwestliche Text, den ich habe. Indien ist deshalb interessant, weil der Supreme Court 2024 in
    Just Rights for Children Alliance v S Harish entschieden hat, dass schon der Besitz strafbar ist,
    und weil section 15 POCSO anders als Paragraf 184b StGB nicht ausdruecklich auf wirklichkeitsnahe
    Darstellungen abstellt. Die Autoren arbeiten die Bruchstelle sauber heraus: Ohne reales Opfer fehlt
    der Anknuepfungspunkt fuer die Meldepflicht der Intermediaere. Genau diese Frage stellt sich bei uns
    zu Paragraf 184b Abs. 1 Nr. 1 lit. c StGB und zur Reichweite des Wirklichkeitsbezugs. Pflichtlektuere
    fuer die Achse content.'
