  kernthese: Indien begegnet Deepfakes bislang mit einem Flickwerk aus IT Act, IT Rules 2021 und allgemeinen
    Strafnormen; noetig sei ein eigener Rahmen, der zwischen Persoenlichkeitsverletzung, Wahlmanipulation
    und Betrug differenziert.
  eigene_bewertung: 'Nuetzlich als Bestandsaufnahme der indischen Lage vor den Deepfake-Regelungen, die
    das Ministerium fuer Elektronik und IT ab 2024 in Konsultation gab. Der Text ist beschreibend und
    in der Loesungsfrage konventionell (Ruf nach Spezialgesetz), aber er dokumentiert die Rechtslage sauber
    und benennt die indische Besonderheit: Der Rueckgriff auf das Persoenlichkeitsrecht laeuft in Indien
    ueber Article 21 der Verfassung und die Puttaswamy-Rechtsprechung, also verfassungsunmittelbar, waehrend
    wir ueber Paragraf 823 Abs. 1 BGB und Paragraf 22 KUG gehen. Fuer die Deepfake-Achse ein guter Ausgangspunkt,
    aber nicht der letzte Stand.'
