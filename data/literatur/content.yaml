  kernthese: Anbieter müssen KI-erzeugte Inhalte doppelt kennzeichnen — sichtbar für den Nutzer und implizit
    in den Metadaten —, und Plattformen müssen die Metadaten beim Upload prüfen und fehlende Kennzeichnung
    ergänzen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der rechtsvergleichende Bezugspunkt, an dem sich Art. 50 KI-VO messen lassen muss,
    und die einzige Rechtsordnung, die die Kennzeichnungspflicht seit über einem Jahr tatsächlich vollzieht.
    Zwei Unterschiede sind systembildend: Erstens verpflichtet China nicht nur den Modellanbieter, sondern
    die Verbreitungsplattform zur Prüfung und Nachkennzeichnung — damit wird die Lücke geschlossen, die
    Zhang u.a. offenlegen, indem die Durchsetzung an den Verbreitungspunkt verlagert wird. Zweitens ist
    die Kennzeichnung durch einen verbindlichen nationalen Standard technisch spezifiziert, während die
    Union auf harmonisierte Normen wartet, die noch nicht existieren. Wer für die Union argumentiert,
    dass die Pflicht undurchführbar sei, muss erklären, warum sie in China durchgeführt wird. Wer das
    chinesische Modell empfiehlt, muss die Kehrseite benennen: Die Kennzeichnungsinfrastruktur ist zugleich
    eine Zuordnungsinfrastruktur und mit der Klarnamenpflicht verbunden. Aufgenommen als `bericht`, weil
    der Rechtstext selbst in 24_asien_latam.yaml geführt wird und hier nur als Vergleichsmaßstab dient.

    '
