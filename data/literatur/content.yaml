  - ki-vo-2024-1689
  - dsa-2022-2065
  kernthese: Wenn Produktion, Verbreitung und Gestaltungsmacht in einer Plattform gebündelt sind, ist
    die Verantwortung für massenhaft erzeugte sexualisierte Deepfakes keine individuelle, sondern eine
    strukturelle Frage, die das Strafrecht bei den Architekturentscheidungen des Betreibers ansetzen lassen
    muss.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Susanne Beck ist die Autorin, an der in der deutschen Strafrechtswissenschaft zur
    KI kein Weg vorbeiführt, und dieser Beitrag ist ihr aktuellster frei zugänglicher Text. Er ist Pflicht,
    weil er den Streitstand definiert, um den seit 2026 alles kreist: Reicht die Zurechnung an den Nutzer,
    oder muss die Architekturentscheidung des Betreibers selbst strafbewehrt sein? Beck und Nussbaum arbeiten
    die Lücken präzise heraus — § 201a StGB erfasst synthetische Darstellungen nicht, weil er an die Aufnahme
    anknüpft; § 33 KUG greift nur bei Bildnissen; §§ 184b ff. StGB greifen nur bei scheinbar Minderjährigen;
    § 201b StGB-E ist Entwurf. Der Text ist zugleich der Schlüssel zu der Frage, die diese Sammlung durchzieht,
    nämlich der ki-csam-besitz-Kontroverse: Bei Minderjährigen greift das deutsche Recht bereits die Herstellung,
    bei Erwachsenen erst die Verbreitung — eine Wertungsdifferenz, die niemand befriedigend begründet.
    Angreifbar ist die Zuspitzung auf eine Person (Musk); das ist publizistisch wirksam und strafrechtlich
    unbrauchbar, weil Täterschaft konkrete Handlungen braucht. Ersetzt Beck-Online nicht — dort steht
    die dogmatische Ausarbeitung —, aber es ist der Text, der die Debatte eröffnet hat, und er ist frei.

    '
  letzte_pruefung: 2026-08-27
