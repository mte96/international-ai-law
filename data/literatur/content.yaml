  kernthese: KI-erzeugte Bilder schwerkranker Kinder werfen eigenstaendige ethische und rechtliche Fragen
    auf, die weder das Persoenlichkeitsrecht noch das Medizinrecht bislang erfassen.
  eigene_bewertung: 'Ungewoehnlicher Zuschnitt, interdisziplinaer (Juristinnen und Palliativmediziner),
    und gerade deshalb interessant: Der Beitrag zeigt an einem eng umgrenzten Fall, dass synthetische
    Darstellungen realer Personen nicht nur ein Persoenlichkeitsrechts-, sondern auch ein Einwilligungs-
    und Fuersorgeproblem sind - bei Kindern also ein Sorgerechtsproblem. Fuer die Deepfake-Achse eine
    Perspektive, die in der europaeischen Diskussion (Art. 50 Abs. 4 KI-VO, Kennzeichnungspflichten) voellig
    fehlt. Randlage fuer die Hauptachsen, aber als Beleg dafuer brauchbar, dass Kennzeichnung das Problem
    nicht loest.'
