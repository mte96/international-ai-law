  kernthese: Die Hälfte der dokumentierten Wahl-Deepfakes des Jahres 2024 war gar nicht täuschend, und
    billige Fälschungen ohne KI kamen siebenmal häufiger vor — die Kosten der Erzeugung sind nicht der
    begrenzende Faktor.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die empirische Ergänzung zu Simon/Altay/Mercier und die wirksamste Entgegnung auf
    die Wahlbeeinflussungsdebatte, weil sie an Fällen und nicht an Modellen argumentiert. Für die europäische
    Diskussion ist der wichtigste Befund die Verwendungsstruktur: Ein großer Teil der Deepfakes war Satire,
    Kampagnenmaterial mit erkennbarer Urheberschaft oder Selbstdarstellung — also genau das, was Kennzeichnungspflichten
    adressieren und Strafnormen nicht erfassen sollen. Das stützt Art. 50 KI-VO und schwächt zugleich
    die Straftatbestände. Angreifbar ist die Methodik: Erfasst wird, was dokumentiert wurde, also die
    entdeckten Fälle; über die nicht entdeckten sagt die Sammlung nichts, und genau die wären der Beleg
    für die Gegenthese. Die Autoren räumen das ein, die Rezeption nicht.

    '
