  kernthese: Der Konsum von Falschinformation ist nachfrage- und nicht angebotsbeschränkt; eine billigere
    Produktion durch generative Modelle verändert deshalb weder Menge noch Wirkung nennenswert.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die notwendige Gegenposition zur Begründungserwägung der halben KI-VO. Wer Art. 50
    Abs. 4 KI-VO, das DSA-Risikomanagement oder nationale Deepfake-Straftatbestände mit der Gefahr für
    die demokratische Willensbildung begründet, muss diese Arbeit entkräften — sie bestreitet nicht die
    Möglichkeit, sondern die empirische Relevanz. Das stärkste Argument ist das Größenverhältnis: Damit
    KI die Waage kippt, müsste die Anziehungskraft von Falschinformation um das Zwanzig- bis Hundertfache
    steigen. Angreifbar ist die Ausblendung der nicht-politischen Anwendungsfälle — Betrug, Erpressung,
    bildbasierte sexualisierte Gewalt —, bei denen die Angebotsseite sehr wohl bindend ist; genau dort
    liegt der Anwendungsbereich, den die Autoren nicht bestreiten und der die Deepfake-Regulierung tatsächlich
    trägt. Wer den Text gegen NCII-Strafnormen wendet, missbraucht ihn.

    '
