  kernthese: 'Sexuelle Deepfakes sprengen die Kategorien des klassischen Strafrechts; erforderlich sind
    ein qualifizierter digitaler Einwilligungsbegriff mit algorithmischer Rückverfolgbarkeit, ein Begriff
    der digitalen Würde und eine Neufassung der Erheblichkeits- schwelle für symbolische Schäden.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der begrifflich ehrgeizigste der mexikanischen Texte und gleichzeitig der, bei dem
    ich am meisten Vorbehalte habe. "Digitale Würde", "symbolischer Schaden", "epistemischer Bruch" —
    das ist Theoriesprache, die einen deutschen Strafrechtler schnell abschreckt, und die Autoren liefern
    zu wenig positives Recht, um den Aufwand zu rechtfertigen. Trotzdem aufgenommen, weil der Vorschlag
    der "algorithmischen Rückverfolgbarkeit als Verfahrensgarantie" die einzige mir bekannte lateinamerikanische
    Antwort auf die Beweisnot bei synthetischen Bildern ist und weil der Text die jüngere peruanische
    Strafgesetzgebung zu synthetischen Bildaufnahmen mitverarbeitet (Normnummer im Volltext zu prüfen,
    aus dem Abstract nicht belegbar). Für die Ley-Olimpia-Debatte in Mexiko und den Anschluss an unsere
    §§ 184k, 201a StGB der interessanteste Vergleichspunkt.

    '
