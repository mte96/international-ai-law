  - Feizi, Soheil
  titel: Can AI-Generated Text be Reliably Detected?
  fundstelle: Transactions on Machine Learning Research (2025); arXiv:2303.11156 (cs.CL), 17.03.2023,
    zuletzt geändert 17.01.2025
  jahr: 2023
  sprache: en
