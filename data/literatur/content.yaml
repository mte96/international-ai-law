  bezug_regelwerke:
  - ki-vo-2024-1689
  kernthese: SynthID-Text bettet ein Wasserzeichen beim Erzeugen ein, ohne die Ausgabequalität messbar
    zu mindern, ist ohne Modellzugriff erkennbar und wurde über nahezu 20 Millionen Nutzerinteraktionen
    im Produktivbetrieb von Gemini erprobt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob der Vorbehalt "soweit dies technisch möglich ist" in Art.
    50 Abs. 2 KI-VO dem Anbieter zugute kommt — die Antwort lautet für den Normalbetrieb Nein, denn es
    ist möglich, es ist erprobt, und es kostet nichts an Qualität. Die entscheidende GEGENPOSITION zu
    Zhang u.a., und der Grund, warum beide Texte zusammen gelesen werden müssen. Der Nachweis im Produktivbetrieb
    über 20 Millionen Antworten und die Freigabe der Umsetzung nehmen dem Einwand der technischen Unmöglichkeit
    die Grundlage — jedenfalls in der Fassung "es geht nicht". Was bleibt, ist der Einwand "es hält einem
    Angreifer nicht stand", und den beantwortet die Arbeit nicht, weil sie ihn nicht behandelt. Für die
    Rechtsanwendung ergibt sich daraus eine saubere Zweiteilung, die im Schrifttum fehlt: Gegenüber dem
    Anbieter ist die Einbettungspflicht durchsetzbar (es ist möglich), gegenüber dem Verwerter ist die
    Erkennungserwartung unbegründet (es ist entfernbar). Art. 50 verteilt die Pflichten genau umgekehrt,
    wenn man Abs. 2 und Abs. 4 zusammenliest — Anbieter markieren, Betreiber offenlegen — und deshalb
    ist die Norm in ihrer zweiten Hälfte schwächer als in ihrer ersten. In Nature erschienen und frei
    zugänglich, was für die Zitierfähigkeit gegenüber Gerichten erheblich ist. ANGREIFBAR: von DeepMind
    verfasst, also von dem Unternehmen, dessen Pflichterfüllung damit belegt werden soll; die Robustheitsprüfung
    ist entsprechend wohlwollend. Und das Verfahren wirkt nur bei entropiereichen Ausgaben.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-50-abs-2
  - ki-vo-art-50-abs-4
