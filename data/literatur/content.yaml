  kernthese: Empfehlungsalgorithmen von Streamingdiensten beruehren Verbraucherrechte, weil sie das Leistungsversprechen
    des Dienstes faktisch bestimmen, ohne dass Transparenz- oder Wahlrechte bestuenden.
  eigene_bewertung: Solide Studentenarbeit, kein Grundlagentext. Ich fuehre sie, weil sie die Bruecke
    zwischen Empfehlungssystemen und Verbrauchervertragsrecht schlaegt, die in Europa ueber Art. 27 DSA
    und die Omnibus-Richtlinie gezogen wird, in Kanada aber ueber das allgemeine Verbraucherschutzrecht
