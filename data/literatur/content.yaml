  kernthese: Wasserzeichen und Provenienzdaten nach C2PA sind komplementär und beide umgehbar; ein realistisches
    Ziel ist nicht lückenlose Erkennung, sondern die Erhöhung der Umgehungskosten in einem mehrschichtigen,
    kontextabhängigen Ansatz.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die beste juristisch verwertbare Übersetzung des technischen Streitstands und der
    Text, den man einem Gesetzgebungsreferenten in die Hand gibt. Srinivasan trennt sauber, was in der
    Rechtsliteratur regelmäßig vermischt wird: statistische Wasserzeichen (am Modell), Metadaten-Provenienz
    (an der Datei, C2PA), und nachträgliche Detektion (am Artefakt). Für Art. 50 KI-VO ist die Pointe,
    dass die Norm Abs. 2 (maschinenlesbare Markierung durch den Anbieter) und Abs. 4 (Offenlegungspflicht
    des Deployers bei Deepfakes) nebeneinanderstellt, ohne zu regeln, was gilt, wenn die Markierung —
    wie regelmäßig — durch Screenshot oder Re-Encoding verlorengeht. Angreifbar: Der Beitrag ist von Anfang
    2024 und kennt weder die C2PA-Fassung 2.1 noch die chinesische Praxis seit September 2025.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-50-abs-2
  - ki-vo-art-50-abs-4
