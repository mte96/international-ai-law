  kernthese: Der Bundesratsentwurf zu § 201b StGB pönalisiert nur die Verbreitung; die Verletzung der
    sexuellen Selbstbestimmung tritt aber bereits mit der Herstellung ein, wie §§ 184b, 184c StGB für
    Minderjährige längst anerkennen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das schärfste Argument der Debatte, und es ist ein Wertungswiderspruchsargument:
    Der Gesetzgeber bestraft die Herstellung synthetischer Missbrauchsdarstellungen von Kindern, aber
    nicht die synthetischer Darstellungen erwachsener Frauen; die Begründung dafür fehlt. Wer zum Streitstand
    ki-csam-besitz arbeitet, findet hier die deutsche Anschlussstelle. Crone stützt sich zusätzlich auf
    Art. 3 Abs. 2 Satz 2 GG, die Istanbul-Konvention und die Richtlinie (EU) 2024/1385 — das ist die vollständige
    Anspruchsgrundlagenkette. Angreifbar: Die Vorverlagerung auf die Herstellung schafft ein Beweisproblem
    und berührt den Kernbereich privater Lebensgestaltung, was Crone nur streift. Nach der Trilogeinigung
    vom Mai 2026 über das Nudifier-Verbot hat ihre Position auf Unionsebene gewonnen. Ergänzt Beck.

    '
