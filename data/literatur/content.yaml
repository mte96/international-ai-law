  kernthese: Im Jahr 2025 bewertete die IWF 8.029 KI-erzeugte Darstellungen als realistisches Missbrauchsmaterial;
    die Zahl der KI-erzeugten Videos stieg von 13 auf 3.443, davon rund 65 Prozent in der schwersten Kategorie.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die belastbarste verfügbare Mengenangabe und die empirische Grundlage, auf die sich
    die britische Gesetzgebung (Verbot von auf CSAM optimierten Modellen, s. 12_uk.yaml) und die Neufassung
    der EU-Richtlinie zur Bekämpfung des sexuellen Missbrauchs stützen. Die Videozahlen sind die eigentliche
    Nachricht: Der Sprung um drei Größenordnungen in einem Jahr belegt, dass die Zugangsschwelle gefallen
    ist, und entkräftet das Argument, die Technik sei zu aufwendig für Gelegenheitstäter. Angreifbar ist
    die Zählweise — erfasst wird, was der IWF gemeldet oder von ihr gefunden wird, nicht die Grundmenge;
    Steigerungen können Aufmerksamkeitseffekte sein. Die IWF ist außerdem eine Meldestelle mit Eigeninteresse
    an der Dringlichkeit des Problems. Für die deutsche Diskussion ist der Bericht das Gegengewicht zu
    der These, § 184b StGB in seiner Erstreckung auf "wirklichkeitsnahe" Darstellungen sei symbolisches
    Strafrecht.

    '
