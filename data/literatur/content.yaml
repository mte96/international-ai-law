  kernthese: Herstellung, Verbreitung und angedrohte Verbreitung nicht einvernehmlicher intimer Deepfakes
    sind in Neuseeland eigenstaendig zu poenalisieren, weil die vorhandenen Regelungswege - insbesondere
    der Harmful Digital Communications Act 2015 - die Schaeden nicht erfassen.
  eigene_bewertung: 'Aktuellster neuseelaendischer Beitrag der Auswahl und fuer die Achse content unmittelbar
    brauchbar. Der Vergleich mit Deutschland ist ergiebig, weil beide Rechtsordnungen dasselbe Grundproblem
    haben: Wir behelfen uns mit Paragraf 201a Abs. 1 Nr. 2 StGB und Paragraf 33 KunstUrhG und treffen
    den Fall der rein synthetischen Darstellung nur unvollkommen; Neuseeland behilft sich mit dem Harmful
    Digital Communications Act und trifft ihn ebenso wenig. Graham arbeitet die Schadensdimensionen sauber
    heraus und begruendet, warum zivilrechtliche und plattformbezogene Loesungen nicht ausreichen - das
    ist die Argumentation, die man fuer eine Stellungnahme zum deutschen Reformvorhaben braucht. Am Objekt
    geprueft.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
