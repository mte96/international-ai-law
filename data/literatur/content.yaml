  kernthese: Algorithmische Inhaltefilterung durch Plattformen entzieht dem oeffentlichen Interesse die
    Verfahrensform; Elkin-Koren schlaegt vor, dem Filter einen institutionalisierten Gegenspieler entgegenzusetzen,
    der die Nutzerinteressen algorithmisch vertritt.
  eigene_bewertung: 'Niva Elkin-Koren (Tel Aviv) ist die einflussreichste israelische Urheberrechtlerin
    und diese Arbeit ihr meistzitierter Beitrag zum Thema. Der Gedanke des "contesting algorithm" - ein
    Gegenalgorithmus, der systematisch Widerspruch erhebt - ist die interessanteste institutionelle Idee,
    die ich in der Filterdebatte kenne, und sie beantwortet die Frage, an der Art. 17 Abs. 9 DSM-Richtlinie
    und Art. 20 DSA praktisch scheitern: Beschwerdeverfahren nutzen nichts, wenn die Betroffenen die Sperrung
    gar nicht bemerken. Frei verfuegbar. Zwei Einwaende: Die Umsetzung bleibt vage, und die Arbeit stammt
    aus der Zeit vor generativer KI, behandelt also Filterung, nicht Erzeugung.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
