  kernthese: Offene Bildmodelle erlauben die Erzeugung fotorealistischen Missbrauchsmaterials einschließlich
    der Abbildung bestimmter realer Kinder, was die Ermittlungsarbeit überlastet und Erkennungssysteme
    entwertet.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die frühere und breitere der beiden Stanford-Arbeiten und diejenige, die das Vollzugsargument
    liefert, auf das sich die europäische und britische Gesetzgebung stützt: Wenn synthetisches und echtes
    Material ununterscheidbar werden, bindet die Triage Ermittlungsressourcen, die für reale Opfer fehlen.
    Das ist ein Argument, das ohne Rückgriff auf ein Rechtsgut auskommt und deshalb auch im amerikanischen
    Verfassungsrecht tragen könnte — der Seventh Circuit hat es in Anderegg ausdrücklich verworfen ("the
    Government may not suppress lawful speech as the means to suppress unlawful speech"). Wer die transatlantische
    Divergenz erklären will, findet hier die eine Seite in ihrer besten Fassung und im Volokh-Beitrag
    die andere. Angreifbar: Thorn ist kein neutraler Akteur, sondern Anbieter von Erkennungstechnologie;
    der Bericht empfiehlt Maßnahmen, an denen der Mitherausgeber verdient.

    '
  letzte_pruefung: 2026-08-27
