  titel: Scalable watermarking for identifying large language model outputs
  fundstelle: Nature 634 (2024), 818–823
  jahr: 2024
  sprache: en
  doi: 10.1038/s41586-024-08025-4
  url: https://www.nature.com/articles/s41586-024-08025-4
  zugang: open-access
