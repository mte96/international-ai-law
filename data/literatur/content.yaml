  kernthese: Ein pauschales Deepfake-Verbot verletzt die Kunstfreiheit aus Art. 5 Abs. 3 GG; das geltende
    Recht bewältigt die missbräuchlichen Fälle über Persönlichkeitsrecht und Ehrschutz, und die Einzelfallabwägung
    nach Mephisto ist der richtige Maßstab.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die kunstfreiheitliche Gegenposition, ohne die die Deepfake-Debatte einseitig bleibt,
    und der Text, der die Ausnahme in Art. 50 Abs. 4 KI-VO für erkennbar künstlerische, kreative, satirische
    oder fiktionale Werke rechtlich unterfüttert. Lennartz argumentiert, dass die Kunstfreiheit nicht
    am Medium hängt und ein synthetisch erzeugtes Werk keinen geringeren Schutz genießt als ein gemaltes.
    Angreifbar ist die Mephisto-Analogie: Dort ging es um einen erkennbar literarischen Text, hier um
    fotorealistische Erzeugnisse, die gerade nicht als Fiktion erkennbar sind — der Erkennbarkeitsvorbehalt
    trägt die Analogie nicht ohne Weiteres. Zusammen mit Crone und Epik ergibt sich die vollständige Kontroverse;
    das ist in einer beckfreien Akte selten und deshalb hervorzuheben.

    '
  letzte_pruefung: 2026-08-27
