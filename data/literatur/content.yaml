  kernthese: Große generative Modelle passen weder in das Hochrisikoschema der KI-VO noch in das Plattformregime
    des DSA; nötig sind gestufte Pflichten entlang der Wertschöpfungskette und die Übertragung der DSA-Inhaltemoderation
