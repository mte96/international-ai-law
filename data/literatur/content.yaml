  bezug_regelwerke:
  - ki-vo-2024-1689
  kernthese: Rekursives Paraphrasieren umgeht Wasserzeichen, neuronale Detektoren und Nullstichprobenverfahren
    gleichermaßen; theoretisch nähert sich die Erkennungsleistung mit besser werdenden Modellen dem Zufall,
    und Angreifer können umgekehrt menschliche Texte als maschinell erzeugt markieren.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob ein Detektorergebnis als Beweismittel taugt — im Prüfungsrecht,
    im Berufsrecht, bei Plagiatsvorwürfen und im Verfahren nach Art. 50 Abs. 4 KI-VO. Die Antwort ist
    Nein, und der zweite Befund ist der juristisch gefährlichere: Ein Angreifer kann einen ECHTEN menschlichen
    Text so verändern, dass ein Detektor ihn als maschinell erzeugt ausweist. Damit ist die Detektion
    nicht nur unzuverlässig, sondern als Belastungsbeweis manipulierbar — wer eine Prüfungsleistung, einen
    Schriftsatz oder eine journalistische Arbeit anhand eines Detektors beanstandet, stützt sich auf ein
    Beweismittel, das der Beanstandende selbst hätte herstellen können. Für die Hochschul- und Prüfungspraxis,
    in der solche Werkzeuge routinemäßig eingesetzt werden, ist das die zentrale Fundstelle; für das anwaltliche
    Berufsrecht ebenso, weil dieselbe Logik für die Frage gilt, ob ein Gericht einen Schriftsatz als KI-erzeugt
    behandeln darf. In TMLR begutachtet erschienen, also nicht bloß Preprint. ANGREIFBAR: Die theoretische
    Schranke gilt asymptotisch für den Fall, dass maschinelle und menschliche Textverteilung zusammenfallen;
    heute tun sie das nicht vollständig, und Detektion mit hoher Falsch-Positiv-Kontrolle bleibt in engen
    Anwendungsbereichen möglich. Die Autoren widersprechen der Gegenposition (Kirchenbauer u.a., On the
    Reliability of Watermarks) nicht in allen Punkten; der Streit über die praktische Robustheit ist offen.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-50-abs-4
