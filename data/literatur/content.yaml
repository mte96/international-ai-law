  kernthese: Generative KI und organisierte Publikationsfälschung erzeugen neue Formen der Wissenschaftskriminalität,
    die das geltende Strafrecht teilweise erfasst, deren Ursache aber in den Fehlanreizen der Szientometrie
    liegt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Hilgendorf (Würzburg) ist einer der drei oder vier deutschen Strafrechtler, die zum
    KI-Recht kontinuierlich publizieren, und die meisten seiner Arbeiten stehen hinter der Bezahlschranke
    — dieser Text nicht. Das Thema wirkt randständig, ist es aber nicht: Es ist der einzige frei zugängliche
    deutsche Text, der die Frage stellt, wann die Nutzung generativer KI die Schwelle zum Betrug (§ 263
    StGB) oder zur Urkundenfälschung überschreitet, und diese Frage stellt sich in jedem Beruf mit Prüfungs-
    und Begutachtungspflichten. Angreifbar ist die rechtspolitische Schlussfolgerung, das Problem sei
    primär strukturell zu lösen — das entlastet den Strafrechtler von der Dogmatik, die er schuldig bleibt.
    Ordnung der Wissenschaft ist vollständig frei; das ist der Fund, den man sich merken sollte.

    '
