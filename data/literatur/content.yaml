  kernthese: Der Datensatz LAION-5B enthält hunderte bestätigte Fundstellen echten Missbrauchsmaterials,
    weshalb darauf trainierte Modelle nicht als rein synthetisch behandelt werden können und die Datensätze
    zu bereinigen sind.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Befund, der die gesamte Diskussion verschiebt, und deshalb Pflicht: Solange man
    annahm, KI-generiertes Missbrauchsmaterial sei rein synthetisch, war die amerikanische Doktrin aus
    Ashcroft v. Free Speech Coalition in sich stimmig — kein reales Opfer, kein legitimes Verbotsinteresse.
    Thiel zeigt, dass die Prämisse falsch ist: In den Trainingsdaten steckt echtes Material, und die erzeugten
    Bilder tragen dessen Spuren. Damit ist die Kausalkette zum realen Opfer wiederhergestellt, und genau
    diesen Einwand greifen die Richter Lee und Kolar in ihrem Zusatzvotum zu Anderegg auf, ohne ihn zur
    Grundlage der Entscheidung zu machen — dort liegt der Ansatzpunkt für die zu erwartende Supreme-Court-Vorlage.
    Der Bericht ist zugleich der Schnittpunkt zur deutschen LAION-Rechtsprechung: Derselbe Datensatz,
    um dessen urheberrechtliche Behandlung BGH und OLG Hamburg streiten, ist der Gegenstand dieses Befunds
    — dass beide Verfahrensstränge nebeneinander herlaufen, ohne sich zu berühren, ist eine bemerkenswerte
    Lücke und eine Publikationsmöglichkeit. Angreifbar ist die Quantifizierung: Die gefundene Menge ist
    gemessen an fünf Milliarden Paaren winzig, und ob eine derart geringe Kontamination die Ausgaben messbar
    prägt, ist nicht gezeigt, sondern plausibilisiert.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - stgb-184b
