  kernthese: Meinungsregulierung durch KI beseitigt die Reibung, die demokratische Willensbildung braucht;
    die Autorinnen pladieren dafuer, Reibung als Gestaltungsziel in die Governance-Architektur einzubauen.
  eigene_bewertung: 'Die Fortschreibung des Contesting-Algorithms-Gedankens ins Grundsaetzliche. Der Begriff
