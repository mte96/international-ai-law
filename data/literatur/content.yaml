  kernthese: 'Stanley v. Georgia und Ashcroft v. Free Speech Coalition beherrschen den Fall: Ohne reales
    Opfer entfällt das in Ferber und Osborne anerkannte zwingende Interesse, und Vollzugsschwierigkeiten
    rechtfertigen kein Verbot geschützter Rede.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die erste und bislang einzige zeitnahe Besprechung der Entscheidung, die den Streitstand
    `ki-csam-besitz` definiert, und für die europäische Leserschaft die wirtschaftlichste Einführung in
    eine Dogmatik, die von außen unverständlich wirkt. Volokh arbeitet die entscheidende Trennlinie heraus:
    Herstellung, Verbreitung und Übermittlung an Minderjährige bleiben strafbar, nur der häusliche Besitz
    nicht — eine Unterscheidung, die bei lokal betriebenen Modellen technisch zusammenfällt, weil Erzeugen
    und Speichern derselbe Vorgang sind. Ebenso wichtig ist der Hinweis auf das Zusatzvotum: Lee und Kolar
    benennen die Kontamination der Trainingsdaten (vgl. Thiel 2023) als möglichen Anknüpfungspunkt für
    eine künftige Korrektur durch den Supreme Court. Volokh ist Partei — er vertritt seit Jahrzehnten
    eine weite Auslegung des First Amendment —, und die Besprechung referiert mehr, als sie kritisiert.
    Für die deutsche Seite ist der Kontrast in einem Satz zu haben: § 184b Abs. 1 Nr. 3, Abs. 3 StGB erfasst
    wirklichkeitsnahe Darstellungen ohne reales Opfer und stellt den Besitz unter Strafe — dieselbe Handlung,
    die der Seventh Circuit für verfassungsrechtlich geschützt hält.

    '
