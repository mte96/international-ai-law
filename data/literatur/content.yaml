  kernthese: Der am 10.06.2026 angenommene Verhaltenskodex zur Transparenz KI-generierter Inhalte behandelt
    die Erkennbarkeit synthetischer Medien als einheitliches technisches Problem, obwohl sie ein kontextabhängiges
    und politisches Problem ist, das dauerhafte Koordination zwischen mehreren Akteuren verlangt.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der beste frei zugängliche Text zu Art. 50 Abs. 2 KI-VO, und Art. 50 ist die Vorschrift,
    die deutsche Mandanten ab sofort trifft — sie gilt, anders als die Hochrisiko-Pflichten, nach der
    Omnibus-Einigung unverändert. Friedl (Postdoc, HU Berlin) formuliert das Argument, das die Kennzeichnungsdebatte
    strukturiert: Ein breit verfügbares Detektionswerkzeug ist zugleich ein Trainingsziel für den Angreifer,
    das Wettrüsten ist eingebaut. Daraus folgt seine institutionelle These — nicht ein einmaliger Kodex,
    sondern ein ständiges Forum. Der Text ist englisch, aber von einem deutschen Autor an einer deutschen
    Fakultät und in der deutschen Debatte anschlussfähig. Angreifbar ist er dort, wo er die forensische
    Detektion gegen die offene Detektion ausspielt, ohne zu sagen, wer die forensischen Werkzeuge halten
    soll — das ist eine Zuständigkeitsfrage, die er offen lässt. Ergänzt Beck nicht nur, sondern liegt
    dort in dieser Zuspitzung nicht vor.

    '
  letzte_pruefung: 2026-08-27
