  titel_deutsch: 'Sexuelle Deepfakes und algorithmische Gewalt: auf dem Weg zu einem umfassenden Normrahmen
    zum Schutz der digitalen Würde'
  fundstelle: Estudios en Derecho a la Información 11 (2026), Nr. 21, Artikel e20198
  jahr: 2026
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-informacion/article/view/20198
