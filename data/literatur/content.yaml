- id: 2023-kirchenbauer-watermark
  typ: aufsatz
  autoren:
  - Kirchenbauer, John
  - Geiping, Jonas
  - Wen, Yuxin
  - Katz, Jonathan
  - Miers, Ian
  - Goldstein, Tom
  titel: A Watermark for Large Language Models
  fundstelle: 40th International Conference on Machine Learning (ICML 2023), 17061; arXiv:2301.10226 (cs.LG),
    24.01.2023
  jahr: 2023
  sprache: en
  doi: 10.48550/arXiv.2301.10226
  url: https://arxiv.org/abs/2301.10226
  zugang: open-access
  jurisdiktionen:
  - eu
  - us
  themenachsen:
  - content
  - gpai
  - governance
  bezug_regelwerke:
  - ki-vo-2024-1689
  kernthese: Ein Wasserzeichen lässt sich beim Erzeugen einbetten, indem der Wortschatz vor jedem Token
    zufällig in eine bevorzugte und eine gemiedene Hälfte geteilt wird; die Erkennung braucht weder Modellzugriff
    noch Schnittstelle und liefert einen statistischen p-Wert.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was technisch überhaupt gemeint ist, wenn Art. 50 Abs. 2 KI-VO
    von "maschinenlesbarer Markierung" spricht — und warum die Norm zwischen Wasserzeichen, Metadaten
    und Fingerabdrücken nicht unterscheidet, obwohl diese sich in Robustheit und Nachweisbarkeit grundlegend
    unterscheiden. Der Referenztext, an dem sich die gesamte Folgeliteratur abarbeitet, und für den Juristen
    deshalb der richtige Einstieg in den Block. Zwei Eigenschaften sind rechtlich erheblich und werden
    regelmäßig übersehen. ERSTENS liefert das Verfahren einen p-Wert, also ein Wahrscheinlichkeitsurteil,
    keinen Beweis — für die Beweiswürdigung nach § 286 ZPO heißt das, dass die Wasserzeichenerkennung
    ein Indiz mit bezifferbarer Irrtumswahrscheinlichkeit ist, was sie von den meisten technischen Nachweisen
    positiv abhebt. ZWEITENS braucht die Erkennung KEINEN Zugriff auf das Modell — ein Dritter, etwa eine
    Behörde oder ein Gericht, kann sie durchführen, was für die Durchsetzbarkeit des Art. 50 entscheidend
    ist. ANGREIFBAR: Das Verfahren wirkt nur bei hinreichend langen und hinreichend entropiereichen Texten;
    kurze oder stark determinierte Ausgaben (Übersetzungen, Codefragmente, Faktenantworten) lassen sich
    nicht tragfähig markieren. Und es ist gegen einen motivierten Angreifer nicht robust — dazu 2023-zhang-watermarks-in-the-sand
    und 2023-sadasivan-reliable-detection.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-50-abs-2
