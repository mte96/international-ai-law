  kernthese: Herkunftsnachweis wird nicht durch Erkennung am Inhalt geführt, sondern durch kryptographisch
    signierte, an die Datei gebundene Manifeste, die Erzeugung und jede Bearbeitung als Behauptungen eines
    identifizierten Ausstellers festhalten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was der Verordnungsgeber meint, wenn Erwägungsgrund 133 KI-VO
    auf "Provenienz"-Verfahren verweist, und warum Kennzeichnung nach Art. 50 etwas grundlegend anderes
    ist als Detektion — die Verwechslung, die fast die gesamte deutschsprachige Kommentierung durchzieht.
    Der begriffliche Ertrag ist größer als der technische: C2PA behauptet nicht, KI-Inhalte zu erkennen,
    sondern bindet eine SIGNIERTE HERKUNFTSBEHAUPTUNG an die Datei. Das verschiebt die Rechtsfrage vollständig
    — es geht nicht mehr um Beweis durch Analyse, sondern um Zurechnung einer Erklärung zu einem identifizierten
    Aussteller, also um eine Struktur, die dem Signaturrecht (eIDAS) und dem Urkundenbeweis näher steht
    als der Sachverständigenbeweis. Wer Art. 50 Abs. 2 auslegt, sollte diese Unterscheidung führen: Ein
    Wasserzeichen ist eine Spur im Inhalt, ein C2PA-Manifest eine Erklärung über den Inhalt, und nur die
    zweite hat einen Aussteller, den man in Anspruch nehmen kann. Praktisch relevant, weil die Spezifikation
    von Adobe, Microsoft, Google, OpenAI und mehreren Kameraherstellern umgesetzt wird und damit der wahrscheinlichste
    Anknüpfungspunkt der harmonisierten Normung ist. Frei lesbar, gut gegliedert; für Juristen genügen
    die Abschnitte zu Manifesten, Behauptungen und harter/weicher Bindung. ANGREIFBAR, und zwar an der
    entscheidenden Stelle: Die Bindung an die Datei ist nicht überlebensfähig — ein Bildschirmfoto, ein
    Neukodieren oder das Hochladen auf die meisten Plattformen entfernt das Manifest rückstandslos. C2PA
    beweist also die Herkunft eines Inhalts, DER SIE NOCH TRÄGT, und sagt nichts über einen Inhalt, der
    sie verloren hat. Ein fehlendes Manifest ist kein Indiz — genau so wird es aber in der politischen
    Diskussion verwendet.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-50-abs-2
- id: 2026-aguirre-lanegra-deepfakes-sexuales
  typ: aufsatz
