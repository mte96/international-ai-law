  kernthese: Die geltenden Authentizitätsregeln des Beweisrechts sind gegen Deepfakes untauglich; die
    Entscheidung über die Echtheit audiovisueller Beweismittel muss von den Geschworenen auf den Richter
    als Gatekeeper verlagert werden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, aus dem der Vorschlag einer eigenen Beweisregel für maschinell erzeugte
    Beweismittel hervorgegangen ist (FRE 707, s. 25_berufsrecht.yaml), und die beste Analyse des Problems,
    dass ein niedriger Authentizitätsmassstab — prima facie genügt die Aussage eines Zeugen, die Aufnahme
    sehe echt aus — bei synthetischen Medien leerläuft. Für das deutsche Recht ist der Ertrag begrenzt,
    weil § 286 ZPO und der Grundsatz der freien Beweiswürdigung die Gatekeeper-Funktion ohnehin beim Gericht
    bündeln; interessant ist die Umkehrung: Delfinos Vorschlag beschreibt im Kern das, was das deutsche
    Recht schon kennt. Angreifbar ist die Kostenfolge — eine Echtheitsprüfung vor jeder Verwertung ist
    in der Massenjustiz nicht leistbar —, und die Frage, wer die Sachkunde des Richters sicherstellt,
    bleibt offen.

    '
