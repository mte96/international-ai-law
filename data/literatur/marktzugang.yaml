    Expertengruppen entworfen — damit gibt das System genau die Konsenslegitimation preis, die es trug.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der schärfste kurze Text zur Normungskrise und der einzige, der die VERFAHRENSseite
    in den Blick nimmt: Nicht das Ausbleiben der Normen ist das Legitimationsproblem, sondern die Art,
    wie man es zu beheben versuchte. Wenn Ausnahmeverfahren zum Normalfall werden, ist die Vermutungswirkung
    des Art. 40 KI-VO auf ein Verfahren gestützt, das die Normungsverordnung (EU) 1025/2012 so nicht vorsieht.
    Das ist ein anfechtbarkeitsnaher Befund — die naheliegende Anschlussfrage (Nichtigkeitsklage gegen
    eine so zustande gekommene Fundstellenveröffentlichung) stellt die Verfasserin nicht. Erschienen im
    November 2025, also vor dem Omnibus; die Diagnose hat sich seither bestätigt.

    '
