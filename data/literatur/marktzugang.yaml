  kernthese: Grundrechtskonformität kann durch technische Normen nicht zertifiziert werden, weil Rechtsverletzungen
    kontextabhängig sind und richterlicher Feststellung bedürfen; private Normungsorganisationen entscheiden
    hier ohne demokratische Rückbindung.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Referenztext des Feldes und die präziseste Formulierung des Legitimationsproblems:
    Normen können Messverfahren und Best Practices liefern, aber keine Schwellen für hinnehmbare Grundrechtsverletzungen
    festlegen — das wäre eine normative Abwägung, für die CEN-CENELEC weder Mandat noch Verfahren hat.
    Der Begriff "ethics washing" für die Signalwirkung technischer Konformität hat sich durchgesetzt.
    Als Pflichtlektüre erfasst, weil er die Voraussetzung jeder eigenen Arbeit zur Normungsfrage ist.
    Angriffspunkt: Die Verfasser argumentieren normativ und blenden aus, dass der EuGH in James Elliott
    (C-613/14) harmonisierte Normen bereits als Unionsrecht qualifiziert hat — die Delegation ist damit
    weniger privat, als der Text unterstellt, und die Legitimationsfrage verschiebt sich auf die Kontrolldichte.
    Genau dort ist Platz für einen eigenen Beitrag.

    '
  letzte_pruefung: 2026-08-27
