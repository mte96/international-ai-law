  kernthese: Der Risikostufenansatz ist im Grundsatz richtig gewählt, aber die Durchsetzungsarchitektur
    und die Vollharmonisierung machen ihn weitgehend wirkungslos und blockieren zugleich legitime nationale
    KI-Politik.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die meistzitierte kritische Erstanalyse des Kommissionsvorschlags und bis heute der
    beste Nachweis dafür, dass die Schwächen des Regimes von Anfang an benannt waren — Selbstzertifizierung,
    leere Normungsdelegation, Sperrwirkung des Art. 114 AEUV. Wer 2026 argumentiert, die Verschiebung
    sei überraschend gekommen, wird an diesem Text widerlegt. Zu relativieren ist, dass die Verfasser
    den Vorschlag von 2021 kommentieren: GPAI-Kapitel, Grundrechte-Folgenabschätzung und der Code of Practice
    kamen erst später hinzu. Frei über arXiv (CC BY 4.0), auch als typografisch gesetzte Fassung im UvA-Repositorium.

    '
