  bezug_regelwerke:
  - ki-vo-2024-1689
  - digital-omnibus-ai-2026-1744
  kernthese: Die Trilogeinigung vom 07.05.2026 verschiebt die Hochrisiko-Pflichten der KI-VO auf den 02.12.2027
    beziehungsweise 02.08.2028, nimmt Produkte mit sektoraler Sicherheitsregulierung teilweise aus und
    führt im Gegenzug ein Verbot nicht einvernehmlicher Nudifier-Anwendungen ein.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Das ist Journalismus, keine Wissenschaft, und es fällt mir schwer, das als Pflichtlektüre
    zu setzen. Ich tue es trotzdem, und der Grund ist selbst ein Befund: Für die wichtigste rechtliche
    Entwicklung des Jahres 2026 im europäischen KI-Recht — die Verschiebung sämtlicher Hochrisiko-Fristen
    um anderthalb bis zwei Jahre — gibt es in deutscher Sprache keinen frei zugänglichen wissenschaftlichen
    Text. Wer die Einigung nicht kennt, zitiert in jedem Schriftsatz und in jedem Aufsatz falsche Fristen;
    das ist ein Kunstfehler, kein Meinungsunterschied. Netzpolitik arbeitet die Verhandlungsdokumente
    aus, benennt die Daten präzise und zitiert die Gegenstimmen (BEUC). Angreifbar ist der Text in der
    Wertung: Er referiert die Kritik der Verbraucherverbände ausführlicher als die Argumente der Industrie
    und der Ratspräsidentschaft. Für die Rechtsanwendung ist das unerheblich, für die Bewertung des Gesetzgebungsprozesses
    nicht. Ersetzt Beck nicht — ergänzt es, weil Beck-Online zu diesem Zeitpunkt noch keine Kommentierung
    der geänderten Fassung hatte. Sobald eine erscheint, sinkt dieser Eintrag auf `optional`.

    '
  letzte_pruefung: 2026-08-27
- id: 2025-ordelin-cargas-normativas
  typ: aufsatz
  autoren:
  - Ordelin Font, Jorge Luis
  titel: 'Cargas normativas, innovación e inteligencia artificial: dilemas regulatorios'
  titel_deutsch: 'Regulierungslasten, Innovation und künstliche Intelligenz: Regulierungsdilemmata'
  fundstelle: Estudios en Derecho a la Información 10 (2025), Nr. 20, 81–100
  jahr: 2025
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-informacion/article/view/19491
  doi: 10.22201/iij.25940082e.2025.20.19491
  zugang: open-access
  jurisdiktionen:
  - mx
  - eu
  themenachsen:
  - marktzugang
  - governance
  - gpai
  kernthese: 'KI-Regulierung ist eine Regulierungslast im ökonomischen Sinn und wird nur dann innovationsverträglich,
    wenn sie nach Unternehmens- grösse, tatsächlichem Risiko, Anwendungsfeld und berührtem Recht differenziert.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der Text, den man aufschlägt, wenn man wissen will, warum Mexiko bis heute kein KI-Gesetz
    hat. Ordelin Font (kubanischer Herkunft, am IIJ der UNAM) führt die regulatorische Zurückhaltung nicht
    auf Trägheit zurück, sondern auf ein bewusstes Kalkül gegenüber einem Markt, der zu neunzig Prozent
    aus Kleinstunternehmen besteht — das ist die ehrlichste Erklärung, die ich in der Literatur gefunden
    habe. Methodisch ist es Rechtsökonomie mit dünner Empirie: die These, Regulierung sei eine "carga
    normativa", wird nicht gemessen, sondern behauptet. Für einen deutschen Leser vor allem als Gegenposition
    zum europäischen Regelungsoptimismus wertvoll — hier argumentiert jemand aus einer Rechtsordnung,
    die den Brüssel-Effekt nicht mitmachen will.

    '
  letzte_pruefung: 2026-09-07
- id: 2024-itsrio-100-ia-classificacao-risco
  typ: bericht
  autoren:
  - Instituto de Tecnologia e Sociedade do Rio de Janeiro (ITS Rio)
  titel: '100 IA: PL 2.338/2023 e a classificação de risco dos usos de IA sob uma perspectiva prática'
  titel_deutsch: '100 KI: Gesetzentwurf 2.338/2023 und die Risikoklassifizierung von KI-Anwendungen aus
    praktischer Sicht'
  fundstelle: ITS Rio, Rio de Janeiro, 17.10.2024
  jahr: 2024
  sprache: pt
  url: https://itsrio.org/wp-content/uploads/2017/01/Relatorio-100-IA.pdf
  zugang: open-access
  jurisdiktionen:
  - br
  - eu
  themenachsen:
  - marktzugang
  - governance
  - gpai
  bezug_regelwerke:
  - eu-ki-vo
  kernthese: 'Von 110 untersuchten brasilianischen KI-Anwendungen fielen 35 % unter die Hochrisikokategorien
    des PL 2.338/2023 — vor allem in Gesundheit, Landwirtschaft und Bildung; die Klassifizierung ist damit
    zu weit geraten.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Kein wissenschaftlicher Text, sondern ein Thinktank-Bericht — aber der einzige mir
    bekannte Versuch weltweit, eine Hochrisikoklassifizierung nicht zu diskutieren, sondern an einem realen
    Anwendungsbestand durchzurechnen. Das ITS Rio hat 110 brasilianische KI-Anwendungen genommen und den
    Katalog des Gesetzentwurfs auf sie angewendet. Genau diese Rechnung fehlt für Anhang III der KI-VO,
    und sie wäre für die deutsche Umsetzungsdebatte enorm nützlich. Methodisch ist die Anwendungsauswahl
    nicht repräsentativ und die Zuordnung teils grosszügig zugunsten der These; die Autoren wollen erkennbar
    zu dem Ergebnis kommen, dass zu viel erfasst wird, und das ITS Rio finanziert sich unter anderem aus
    Industriemitteln. Trotzdem als Pflicht eingestuft, weil das Verfahren nachahmenswert ist und weil
    der brasilianische Gesetzgeber die Zahl in der Beratung des Substitutivo tatsächlich aufgegriffen
    hat. Man liest ihn wegen der Methode und misstraut der Zahl.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-itsrio-pbia-vs-pl-ia
  typ: bericht
  autoren:
  - Instituto de Tecnologia e Sociedade do Rio de Janeiro (ITS Rio)
  titel: 'Análise da relação entre o PBIA e o PL para Regular a IA: estratégias em conflito'
  titel_deutsch: 'Analyse des Verhältnisses zwischen dem brasilianischen KI-Plan und dem KI-Regulierungsgesetzentwurf:
    Strategien im Konflikt'
  fundstelle: ITS Rio, Rio de Janeiro, 26.06.2025
  jahr: 2025
  sprache: pt
  url: https://itsrio.org/wp-content/uploads/2017/01/Relatorio-PBIA-e-regulacao-IA.pdf
  zugang: open-access
  jurisdiktionen:
  - br
  - eu
  themenachsen:
  - marktzugang
  - governance
  - sektor-oeffentlich
  kernthese: 'Der PL 2.338/2023 enthält 68 Pflichten gegenüber 43 in der europäischen KI-Verordnung und
    würde rund 54 % der Sofortmassnahmen des staatlichen KI-Plans PBIA blockieren, vor allem in Gesundheit,
    Bildung und öffentlicher Sicherheit.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der nützlichste einzelne Befund dieser ganzen Sammlung: 68 Pflichten im brasilianischen
    Entwurf gegen 43 in der KI-VO. Wer bisher annahm, der Brüssel-Effekt bedeute Nachahmung mit Abschlägen,
    sieht hier das Gegenteil — Brasilien hat die europäische Vorlage übernommen und verschärft, und der
    eigene Industrieplan gerät dadurch mit dem eigenen Gesetzentwurf in Konflikt. Das ist ein Argument,
    das man in der deutschen Debatte über die Umsetzung der KI-VO gebrauchen kann, und zwar in beide Richtungen.
    Die Zählung der Pflichten ist naturgemäss angreifbar (was ist eine Pflicht?), die 54-Prozent-Zahl
    noch mehr, und das ITS Rio verfolgt eine erkennbar deregulierungsfreundliche Linie. Als Ausgangspunkt
    für eine eigene Zählung trotzdem sehr brauchbar.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-itsrio-matriz-comparada-pl2338-aiact
  typ: bericht
  autoren:
  - Instituto de Tecnologia e Sociedade do Rio de Janeiro (ITS Rio)
  titel: 'Matriz comparada de obrigações: PL 2338/2023 vs. EU AI Act'
  titel_deutsch: 'Vergleichsmatrix der Pflichten: Gesetzentwurf 2338/2023 gegen die EU-KI-Verordnung'
  fundstelle: ITS Rio, Rio de Janeiro, Fassung vom 23.06.2025 (Erstfassung 2024, Aktualisierungen 08/2024
    und 11/2024)
  jahr: 2025
  sprache: pt
  url: https://itsrio.org/wp-content/uploads/2017/01/2025.06.23-Matriz-comparada-de-obrigacoes_-PL-2338_2023-vs.-EU-AI-act_Relatorio_AI-16-jun-1.pdf
  zugang: open-access
  jurisdiktionen:
  - br
  - eu
  themenachsen:
  - marktzugang
  - governance
  - gpai
  bezug_regelwerke:
  - eu-ki-vo
  kernthese: 'Der brasilianische Entwurf und die KI-VO lassen sich pflichtenweise gegenüberstellen; die
    Matrix macht sichtbar, an welchen Stellen Brasilien bewusst abweicht.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Ein Arbeitsmittel, kein Text. Die Matrix stellt Pflicht für Pflicht gegenüber, orientiert
    sich methodisch am IAPP-Vergleich unter Müge Fazlioglu und wird gepflegt — die Fassung vom Juni 2025
    ist mindestens die vierte. Für jeden, der einen Mandanten mit brasilianischem Geschäft berät oder
    eine rechtsvergleichende Arbeit über die Rezeption der KI-VO schreibt, ist das die Zeitersparnis von
    mehreren Tagen. Die angekündigte Erweiterung auf Chile ist im Auge zu behalten. Als Argumentquelle
    taugt sie nicht, als Fundstelle für die Gegenüberstellung sehr wohl. Bei Zitaten unbedingt die Fassung
    angeben — das Dokument ändert sich.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-itsrio-sandboxes-regulatorios-ia
  typ: bericht
  autoren:
  - Instituto de Tecnologia e Sociedade do Rio de Janeiro (ITS Rio)
  titel: Sandboxes Regulatórios de Inteligência Artificial
  titel_deutsch: Regulatorische Sandkästen für künstliche Intelligenz
  fundstelle: ITS Rio, Rio de Janeiro, 13.03.2026 (portugiesische Fassung; englische Toolkit- und Benchmark-Fassungen
    separat)
  jahr: 2026
  sprache: pt
  url: https://itsrio.org/wp-content/uploads/2017/01/Sandboxes-Regulatorios.pdf
  zugang: open-access
  jurisdiktionen:
  - br
  - eu
  themenachsen:
  - marktzugang
  - governance
  bezug_regelwerke:
  - eu-ki-vo
  kernthese: 'Regulatorische Sandkästen erlauben es, KI-Anwendungen unter Aufsicht zu erproben, bevor
    sie in die Fläche gehen, und vermitteln so zwischen Innovationsförderung und Rechtsschutz.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der aktuellste Bericht der Sammlung (März 2026) und der einzige, der auch auf Englisch
    vorliegt — es gibt eine Toolkit- und eine Benchmark-Fassung. Für die Arbeit an Art. 57 ff. KI-VO (KI-Reallabore)
    nützlich, weil Brasilien den Sandkasten anders denkt als die EU: nicht als Aufsichtsprivileg für einzelne
    Anbieter, sondern als Erkenntnisinstrument für den Regelsetzer. Ob das trägt, ist offen; der Benchmark-Teil
    ist die brauchbarere Hälfte, weil er tatsächlich laufende Sandkästen vergleicht statt ein Ideal zu
    beschreiben. Advocacy-Charakter, wie bei allen ITS-Papieren, ist mitzulesen.

    '
  letzte_pruefung: 2026-09-07
