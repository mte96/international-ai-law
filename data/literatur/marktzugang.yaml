  kernthese: 'Der Aufschub ist weder Industriesieg noch Grundrechtsverrat, sondern folgenlos: Die Mängel
    der KI-VO sind inhaltlicher, nicht zeitlicher Natur, und bleiben nun nur länger bestehen.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der bislang beste Beitrag zur Bewertungsfrage und der einzige, der sich beiden Lagern
    entzieht. Raposo zählt die Verlängerungen exakt (siebzehn Monate für Anhang III, zwölf für Anhang
    I) und zeigt, dass keiner der Konstruktionsfehler — unfertige Normen, unklare Zuständigkeiten, unbrauchbare
    Schwellen — durch Zeit behoben wird. Erschienen am Tag des Rechercheschlusses; noch nicht rezipiert.
    Wer eine eigene Position zum Omnibus formuliert, muss sich zu dieser dritten Lesart verhalten, sonst
    schreibt man am Stand der Debatte vorbei.

    '
