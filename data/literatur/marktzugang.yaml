  kernthese: Der risikobasierte Ansatz ist richtig, die KI-VO setzt ihn aber nicht risikobasiert um —
    acht Konstruktionsfehler lassen sich jedoch auf der Ebene von Leitlinien, delegierten Rechtsakten
    und Normen korrigieren.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der systematischste frei zugängliche Text zur Sache und der einzige, der die Kritik
    nicht in Ablehnung münden lässt: Ebers listet acht Defizite (Unvereinbarkeit mit Grundrechtsschutz,
    fehlende Nutzen-Risiko-Abwägung, fehlende Empirie, starre Kategorien, willkürliche GPAI-Schwellen,
    zu weite KI-Definition, Doppelregulierung, fragmentierte Durchsetzung) und zeigt dann, welche Instrumente
    die Verordnung selbst zu ihrer Reparatur bereithält. Genau diese Reparaturinstrumente hat der Digital
    Omnibus 2026 teilweise ersetzt — der Text ist damit die beste Messlatte für die Frage, ob der Omnibus
    das Richtige geändert hat. Angreifbar ist die Grundannahme, dass Auslegung genügt: Wenn acht der Fehler
    im Primärtext liegen, ist die Ebene der Durchführungsrechtsakte die falsche Reparaturwerkstatt, und
    die Rechtsetzung von 2026 gibt Ebers darin unfreiwillig recht. CC BY.

    '
