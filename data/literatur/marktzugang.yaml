  kernthese: Ein de-facto-Brüsseler-Effekt ist für KI wahrscheinlich, weil Anbieter ihre Systeme aus Kostengründen
    nicht nach Märkten differenzieren; ein de-jure-Effekt ist wegen der Komplexität der KI-VO weniger
    sicher.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die Erwartung geprägt hat, und deshalb die notwendige Ausgangsposition
    für jede Arbeit zur Frage. Die zentrale Annahme — Nichtteilbarkeit der Produkte — ist genau die, die
    Crum und Bologa 2025 bestreiten. Wer die Debatte referiert, sollte sehen, dass sie sich an einer empirischen,
    nicht an einer normativen Frage entzündet: Lassen sich KI-Systeme marktweise differenzieren? Die Antwort
    hat sich mit geografischem Feature-Gating und Modellvarianten seit 2022 verändert.

    '
