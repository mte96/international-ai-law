  kernthese: Amtliche Darstellung des Normungsauftrags an CEN-CENELEC und seines Bearbeitungsstands; prEN
    18286 (Qualitätsmanagementsystem) ging am 30.10.2025 als erste Norm in die öffentliche Umfrage.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Keine Literatur, aber die Quelle, an der jede Aussage über den Normungsstand zu messen
    ist — und der amtliche Beleg für die Tatsache, die die gesamte Argumentation trägt: Stand 03.08.2026
    ist prEN 18286 die erste und einzige Norm, die überhaupt die öffentliche Umfrage erreicht hat; im
    Amtsblatt zitiert ist keine. Die Konformitätsvermutung des Art. 40 Abs. 1 KI-VO läuft damit vollständig
    leer. Wer zur Normungsfrage publiziert, muss diesen Stand am Tag der Einreichung erneut prüfen — und
    sollte dabei sauber zwischen "nicht verabschiedet", "verabschiedet, aber nicht harmonisiert" und "harmonisiert,
    aber nicht im Amtsblatt zitiert" unterscheiden. Nur der dritte Fall vernichtet die Vermutung, und
    genau diese Unterscheidung trifft die Literatur bislang nicht.

    '
  letzte_pruefung: 2026-08-27
