  kernthese: Die unbestimmten Rechtsbegriffe der KI-VO — vernünftigerweise vorhersehbare Fehlanwendung,
    angemessene Maßnahmen, Stand der Technik — bilden ein ALARP-Modell nach dem Vorbild der Sicherheitstechnik
    und sind daher hinreichend bestimmt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die derzeit klarste Verteidigung des Ansatzes und das Gegenstück zu Ebers: Wo Ebers
    Konstruktionsfehler sieht, sieht Teichmann bewusste Dynamisierung. Das ALARP-Argument ist ernstzunehmen,
    hat aber eine offene Flanke, die der Autor nicht adressiert: ALARP funktioniert, weil der Stand der
    Technik durch Normen dokumentiert ist. Ohne zitierte harmonisierte Norm ist der "Stand der Technik"
    im Sinne des Art. 8 KI-VO gerade nicht feststellbar — die Verteidigung setzt voraus, was es am 01.09.2026
    nicht gibt. Genau hier liegt ein Ansatzpunkt für eine eigene Erwiderung. CC BY.

    '
