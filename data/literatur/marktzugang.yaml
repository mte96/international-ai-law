  kernthese: Unternehmen brauchen rund zwölf Monate zur Umsetzung einer einzigen technischen Norm, hatten
    aber nur sechs bis acht Monate zwischen Normveröffentlichung und Anwendungsstichtag — die Frist war
    strukturell nicht einhaltbar.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die einzige empirische Arbeit zum Thema: 23 Interviews mit führenden KI-Unternehmen
    aus Mobilität, Medizin, Finanzwesen und Verteidigung. Sie liefert die Zahlen, die in der gesamten
    Omnibus-Debatte fehlen — zwölf Monate Umsetzungsbedarf pro Norm, 100.000 bis 300.000 EUR jährliche
    Compliance-Kosten für Start-ups und KMU, Dominanz der Großunternehmen in den Normungsgremien. Als
    Pflichtlektüre erfasst, weil sie die Verschiebung entpolitisiert: Der beste Beleg für die These "notwendige
    Korrektur" stammt nicht aus der Industrie, sondern aus einer begutachteten Zeitschrift. Wer die Verschiebung
    als reine Lobbykapitulation liest, muss diese Zahlen widerlegen. Zugleich der beste Beleg für die
    Gegenrichtung: Die Beteiligungsasymmetrie in JTC 21 ist damit nicht mehr Behauptung, sondern erhoben.
    CC BY.

    '
  letzte_pruefung: 2026-08-27
