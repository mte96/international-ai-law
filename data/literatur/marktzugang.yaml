  kernthese: Statt starrer Risikokategorien nach Anwendungsfeldern sollte die KI-VO ein szenarienbasiertes
    Bewertungsmodell nach dem Vorbild der IPCC-Klimarisikomethodik verwenden.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Konstruktiver Gegenentwurf aus dem Floridi-Umfeld: Der Vorwurf der Willkür wird nicht
    bestritten, sondern durch ein methodisches Angebot beantwortet — Risikoszenarien statt Anwendungsfeldlisten,
    mit ausdrücklichem Blick auf Mehrzweckmodelle. Praktisch relevant, weil das Modell dem entspricht,
    was die Normungsgremien in JTC 21 unter Risikomanagement diskutieren. Schwäche: Der Vorschlag setzt
    Daten voraus, die es nicht gibt, und der Text sagt nicht, wer sie erhebt. Volltext (CC BY) frei im
    Oxford University Research Archive.

    '
