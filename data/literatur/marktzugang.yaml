  eigene_bewertung: 'Die deutschsprachige Standardkommentierung; wer in Deutschland zur KI-VO publiziert,
    wird daran zitiert. Auslieferung 17.12.2025, Rechtsstand September 2025 — und genau darin liegt der
    Angriffspunkt: Die 2. Auflage berücksichtigt die Kommissionsleitlinien des ersten Halbjahres 2025,
    aber NICHT die Verordnung (EU) 2026/1744. Sie kommentiert also einen Text, der seit dem 27.07.2026
    in wesentlichen Teilen nicht mehr gilt: Art. 4a, Art. 75a–75d und die NCII/CSAM-Verbote fehlen, die
    Anwendungsdaten sind überholt. Wer mit dem Werk arbeitet, muss jede Fundstelle gegen CELEX 02024R1689-20260727
    gegenprüfen. Als Pflichtlektüre erfasst, weil es die begriffliche Grundlage der deutschen Debatte
    legt — nicht, weil es den geltenden Rechtszustand abbildet. Nur über beck-online oder als Kaufwerk
    (209 EUR) zugänglich.

    '
