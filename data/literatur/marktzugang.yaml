  kernthese: Trotz stochastischen Modellverhaltens und unreifer Evaluationsmethodik bleiben technische
    Normen das einzige Mittel, um die Pflichten der KI-VO in prüfbare Ingenieurpraxis zu übersetzen; nötig
    ist eine geschichtete Architektur aus horizontalen Normen und sektoralen Profilen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die technisch fundierteste Verteidigung der Normungslösung und damit das nötige Gegengewicht
    zu Gornet/Maxwell. Der zentrale Vorschlag — Reproduzierbarkeit als "Stabilität gemessener Eigenschaften"
    statt bitgenaür Ausgabegleichheit — löst ein Problem, an dem JTC 21 seit Jahren hängt. Juristisch
    dünn: Die Verfasser sind Ingenieure und behandeln die Konformitätsvermutung als gegeben, ohne die
    Legitimationsfrage überhaupt zu stellen. Genau deshalb lesenswert — man sieht, welche Voraussetzungen
    die technische Seite stillschweigend macht. Ganz frisch (Februar 2026), noch kaum rezipiert.

    '
  letzte_pruefung: 2026-08-27
