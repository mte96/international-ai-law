  kernthese: Die KI-VO verschmilzt zwei unvereinbare Regelungslogiken — Produktsicherheitsrecht und Grundrechtsschutz
    — unter dem gemeinsamen Etikett der Risikoregulierung, ohne den Konflikt aufzulösen.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, an dem sich die gesamte europäische Debatte abarbeitet; 4.502 Downloads,
    27 nachgewiesene Zitationen auf SSRN, und in praktisch jeder Normungsarbeit als Ausgangspunkt zitiert.
    Die Diagnose — "legal medley" statt kohärentes Regime — erklärt genau das, was seit 2026 praktisch
    wird: Die Konformitätsvermutung des Art. 40 funktioniert für Produktsicherheit, nicht für Grundrechte,
    und deshalb ist die Normung blockiert. Angreifbar ist der Text darin, dass er den Konflikt diagnostiziert,
    aber die Auflösungsvorschläge (Kap. 5) blass bleiben: Sie laufen auf "mehr Grundrechtsverfahren" hinaus,
    ohne zu sagen, wer sie durchführt. Wer das Argument weiterschreiben will, muss dort ansetzen. Volltext
    frei auf SSRN.

    '
  letzte_pruefung: 2026-08-27
