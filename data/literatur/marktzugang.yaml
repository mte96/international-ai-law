  kernthese: 'Gerade der Erfolg des Brüsseler Effekts schadet den Zielen der Union: Wer die KI-VO kopiert,
    kopiert ihr produktsicherheitsrechtliches Gerüst und damit ihre Schutzlücken bei Grundrechten, Demokratie
    und Rechtsstaatlichkeit.'
  prioritaet: wichtig
