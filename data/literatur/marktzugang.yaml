  jahr: 2026
  sprache: de
  url: https://netzpolitik.org/2026/ki-verordnung-eu-parlament-und-rat-einigen-sich-auf-gelockerte-pflichten-fuer-die-industrie/
  zugang: open-access
  jurisdiktionen:
