  kernthese: 'Der dritte Fair-Use-Faktor (amount and substantiality) werde in den Trainingsfällen unterschätzt
    und müsse gegen fair use ausschlagen: Weil das allgemeine Training kein einzelnes bestimmtes Werk
    erfordert, lasse sich die Übernahme des ganzen Werks nicht als reasonably necessary rechtfertigen
    — "if the purpose does not necessitate the use of a particular work at all, the use of any portion
    of a work must be unreasonably large for the purpose".'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Gegenentwurf zu der Lesart, die seit Bartz und Kadrey die Diskussion beherrscht:
    dass Faktor 1 alles entscheidet und die Übernahme des Vollwerks in Faktor 3 folgenlos bleibt. Trimbles
    Umkehrung ist elegant — gerade die Austauschbarkeit des einzelnen Werks fürs Training macht seine
    vollständige Übernahme unverhältnismäßig. Ob sie trägt, ist offen; sie schneidet aber genau die Stelle
    an, an der die Summary-Judgment-Anträge im SDNY-MDL vom 04.09.2026 und die Berufung in ROSS auseinandergehen.
    Für einen deutschen Leser zusätzlich lehrreich, weil § 44b UrhG die Frage nach dem Umfang gar nicht
    erst stellt.

    '
  letzte_pruefung: 2026-09-07
