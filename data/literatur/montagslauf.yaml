  kernthese: 'Der maschinenlesbare Nutzungsvorbehalt nach Art. 4 Abs. 3 DSM-RL scheitert nicht am Recht,
    sondern daran, dass das Signal an die Datei gebunden ist: Metadaten fallen beim Weiterverbreiten ab.
    Inhaltsbasiertes Fingerprinting (ISCC) sei überlegen; vorgeschlagen wird ein Register mit zwei Arbeitsabläufen
    — Erklärung (Signatur berechnen, Eintrag anlegen, Vorbehalt erklären) und Erkennung (Inhalt beziehen,
    Signatur berechnen, Register abfragen) — mit API-Priorität für Entwickler und manueller Eingabe für
    Einzelurheber.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Trifft die Frage, an der das LAION-Verfahren hängt, von der technischen Seite: Woran
    bemisst sich Maschinenlesbarkeit? Hamburg hat sie im Fließtext einer Nutzungsbedingung bejaht, der
    BGH verhandelte am 03.09.2026 über einen Vorbehalt, der Programme, Applets und Bots untersagte. Gentile
    verschiebt den Maßstab vom Dokument-Metadatum auf ein registergestütztes Inhaltsmerkmal — das würde
    die Streitfrage des Einzelfalls in eine Infrastrukturfrage überführen und wäre der erste ernsthafte
    Vorschlag, wie ein Opt-out nach der ersten Weiterverbreitung überhaupt wirken kann. Einschränkung:
    Der Beitrag nennt weder Kneschke ./. LAION noch § 44b UrhG und argumentiert rein auf Ebene des Art.
    4 Abs. 3 DSM-RL; der Verfasser ist Angehöriger der Kommission, der Text aber kein Kommissionsdokument.

    '
  letzte_pruefung: 2026-09-07
