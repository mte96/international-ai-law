  kernthese: Lockert man die Unmöglichkeitsbedingungen um ein praxisübliches Toleranzmaß, findet man auf
    realen Datensätzen zahlreiche Modelle, die mehrere Fairness-Kriterien zugleich näherungsweise erfüllen
    — die Unmöglichkeit ist theoretisch richtig und praktisch überschätzt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Ausdrücklich als Gegenposition aufgenommen und die wichtigste Korrektur des Kapitels:
    Das Unmöglichkeitsresultat gilt exakt, nicht approximativ, und das Recht arbeitet ohnehin nie exakt
    — § 22 AGG verlangt Indizien, keine Beweise, und die Vier-Fünftel-Regel des US-Rechts ist selbst eine
    Toleranzschwelle. Damit verschiebt sich die juristische Frage von "welche Metrik?" zu "welche Abweichung
    ist hinnehmbar?", und das ist eine Frage, die Gerichte beantworten können. Zu prüfen ist die Verallgemeinerbarkeit:
    Die Autoren testen fünf Datensätze mit moderat unterschiedlichen Basisraten; bei stark divergierenden
    Prävalenzen — dem Regelfall bei seltenen Ereignissen — greift der Befund nicht. Stoyanovich leitet
    das NYU Center for Responsible AI und berät den Gesetzgeber von New York City zu LL 144; der Text
    ist deshalb regulatorisch geerdet.

    '
  letzte_pruefung: 2026-08-27
