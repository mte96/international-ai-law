  kernthese: 'Das europäische Gleichbehandlungsrecht weist bei algorithmischer Diskriminierung vier Lücken
    auf: den geschlossenen Merkmalskatalog, die Bindung an begrenzte Lebensbereiche, die Unerfassbarkeit
    intersektionaler und proxybasierter Benachteiligung sowie die Beweisnot.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Bestandsaufnahme, auf die sich die europäische Literatur seither bezieht, und
    in ihrer Lückenliste bis heute nicht überholt — was sie zugleich zu einem Armutszeugnis für die Rechtsentwicklung
    macht: Keine der vier Lücken ist durch die KI-VO geschlossen worden. Besonders wichtig ist die zweite:
    Anders als das US-Recht kennt das Unionsrecht keinen allgemeinen Diskriminierungsschutz, sondern schützt
    je nach Merkmal in unterschiedlichen Bereichen (RL 2000/43 breit, RL 2000/78 nur Beschäftigung). Ein
    diskriminierender Empfehlungsalgorithmus außerhalb von Beschäftigung und Güterversorgung ist damit
    unionsrechtlich schlicht nicht erfasst. Als `url` ist das Repositorium der Universität Utrecht erfasst;
    die amtliche Seite des Amts für Veröffentlichungen (op.europa.eu, Publikationsnummer 082f1dbc-821d-11eb-9ac9-01aa75ed71a1)
    beantwortete den Abruf wiederholt mit 429, der Spiegel bei equineteurope mit 403.

    '
  letzte_pruefung: 2026-08-27
