  kernthese: Ein Prognoseinstrument, das den Gütestandards der Testtheorie genügt, erzeugt bei unterschiedlicher
    Prävalenz zwangsläufig ungleiche Fehlerraten zwischen den Gruppen — testtheoretische Fairness und
    Fairness gleicher Fehlerlast schließen einander aus.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: warum zwei Sachverständige über dasselbe System zu entgegengesetzten
    Ergebnissen kommen können, ohne dass einer von beiden irrt — die häufigste Verständnisfalle in Diskriminierungsverfahren
    mit algorithmischer Grundlage. Doppelt geführt mit 32_lit_haftung.yaml, dort mit der rechtlichen Einbettung.
    Das zweite Unmöglichkeitsresultat, unabhängig von Kleinberg u.a. entwickelt und am konkreten Fall
    (COMPAS, ProPublica gegen Northpointe), was es für Juristen zugänglicher macht als die abstrakte Fassung.
    Die Ableitung ist eine halbe Seite. Der praktische Ertrag für die Beweisaufnahme: Jedes Parteigutachten
    in diesem Feld ist zuerst danach zu befragen, welche Fairnessgrösse es zugrunde legt und ob es diese
    Wahl offenlegt — tut es das nicht, ist es wertlos, gleich wie das Ergebnis lautet. ANGREIFBAR: Die
    Arbeit ist auf binäre Klassifikation mit einem binären geschützten Merkmal zugeschnitten; für mehrdimensionale
    oder intersektionale Merkmale ist die Lage komplizierter, nicht einfacher.

    '
  letzte_pruefung: 2026-08-27
