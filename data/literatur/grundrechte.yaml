  kernthese: Die Landesgesetze zu automatisierten Auswahlsystemen setzen faktisch auf Ergebniskontrolle
    (Bias-Audits, Testpflichten) und offenbaren damit eine normative Präferenz für disparate impact; Ricci
    und SFFA sind eng zu lesen, damit systemische Abhilfe zulässig bleibt.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der den amerikanischen Streitstand definiert, und der einzige, der die
    beiden Bewegungen zusammenbringt, die sonst getrennt behandelt werden: den Aufstieg der Audit-Gesetzgebung
    in den Bundesstaaten und den Rückbau der disparate-impact-Doktrin durch Executive Order 14281 (23.04.2025)
    und die Rücknahme der EEOC-Leitlinien. Die Pointe ist präzise: Wenn der Bund die Wirkungshaftung zurückfährt,
    während die Länder Bias-Tests vorschreiben, entsteht ein Zustand, in dem Arbeitgeber zur Messung verpflichtet
    sind, die gemessene Ungleichheit aber nicht beheben dürfen, ohne Ricci-Risiken einzugehen. Genau dieses
    Paradox ist das eigentliche Thema. Für den europäischen Leser lohnt der Vergleich zu Art. 10 Abs.
    5 KI-VO, der die Verarbeitung besonderer Datenkategorien zur Bias-Erkennung erlaubt und damit dieselbe
    Zwickmühle regelungstechnisch entschärft — ein Vorteil des europäischen Rechts, der in Europa niemandem
    auffällt. Einschränkung: studentisch verfasst und anonym; für die Autoritätskette zitiert man die
    dort nachgewiesenen Primärarbeiten.

    '
  letzte_pruefung: 2026-08-27
