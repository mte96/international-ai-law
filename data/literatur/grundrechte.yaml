  titel: 'Fooling LIME and SHAP: Adversarial Attacks on Post hoc Explanation Methods'
  fundstelle: AAAI/ACM Conference on AI, Ethics, and Society (AIES 2020), 180; arXiv:1911.02508 (cs.LG),
    06.11.2019
  jahr: 2019
  sprache: en
