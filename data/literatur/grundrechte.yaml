  kernthese: Autonom erzeugter Output ist mangels menschlicher Kommunikationsabsicht schon begrifflich
    keine Rede, sondern 'not-speech', und fällt deshalb unabhängig von seiner Menschenähnlichkeit aus
    dem Schutzbereich.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Kommt zum selben Ergebnis wie Salib, aber auf dem kürzeren und angreifbareren Weg:
    über den Redebegriff statt über die Schutzbereichsdogmatik. Der Vorteil für den europäischen Leser
    ist gerade diese Verkürzung — die Intentionalitätsfrage ist in Art. 5 Abs. 1 GG und Art. 11 GRCh die
    gleiche und dort dogmatisch vertrauter als die amerikanische Hörerrechtsjudikatur. Wer die Frage für
    das deutsche Recht aufbereiten will, findet hier die anschlussfähigere Vorlage. Der Preis ist Angreifbarkeit:
    Wenn Intentionalität konstitutiv wäre, entfiele der Schutz auch für automatisierte Übersetzungen,
    Suchergebnisse und algorithmische Kuratierung — eine Folge, die die Autoren nicht ziehen wollen und
    nicht begründen. Frei über das Digitalarchiv der Washburn Law School.

    '
  letzte_pruefung: 2026-08-27
  normen:
