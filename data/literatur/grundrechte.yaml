  kernthese: Die Grundrechte-Folgenabschätzung bleibt wirkungslos, solange sie nicht veröffentlicht wird
    und Betroffene keine Beteiligungsrechte haben; die Verordnung sieht beides nicht vor.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Position eines Bündnisses von 17 Zivilgesellschafts­ organisationen, deshalb interessengeleitet,
    aber an einer Stelle unwiderlegt: Art. 27 Abs. 3 verlangt die Mitteilung an die Marktüberwachungsbehörde,
    nicht die Veröffentlichung — die FRIA ist ein internes Dokument. Damit kann kein Betroffener sie kennen,
    geschweige denn sich auf sie berufen. Wer über die Rechtsfolgenlücke schreibt (s. `forschungslücken`),
    findet hier die praktische Seite des Arguments. Die vier Forderungen (Beteiligung Betroffener, Anfechtbarkeit
    des Ergebnisses, Ressourcen, Anreize) laufen auf eine Umdeutung der FRIA vom Selbstprüfungsinstrument
    zum Verwaltungsverfahren hinaus — dogmatisch heikel, weil Art. 27 keinen Verfahrensbeteiligten kennt,
    aber genau der Punkt, an dem die Rechtsfolgenfrage entschieden würde. Als Beleg für die zivilgesellschaftliche
    Position brauchbar, als Dogmatik nicht.

    '
