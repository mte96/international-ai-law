  kernthese: 'Die Kontrolle der Eingabemerkmale ist der falsche Ansatzpunkt des Kreditdiskriminierungsrechts:
    Der Ausschluss geschützter Merkmale verhindert ungleiche Ergebnisse nicht und kann sie verschärfen;
    zu prüfen sind die Ergebnisse.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die amerikanische Kreditdiskriminierungsdebatte gedreht hat, und derjenige
    mit der unmittelbarsten europäischen Relevanz: Gillis zeigt simulationsgestützt an Hypothekendaten,
    dass das Verbot der Merkmalsverwendung wirkungslos bleibt — und begründet damit genau die Regelungstechnik,
    für die sich der europäische Gesetzgeber mit Art. 10 Abs. 5 KI-VO entschieden hat (Verarbeitung besonderer
    Kategorien zur Bias-Erkennung ERLAUBT statt verboten). Gillis lehrt in Columbia und ist Ökonomin und
    Juristin; das erklärt die methodische Qualität. Wer die Antidiskriminierungsdogmatik gegen die Datenschutzdogmatik
    abwägen muss — der zentrale Konflikt bei Art. 9 DSGVO —, findet hier die belastbarste Grundlage. Frei
    im Repositorium der University of Minnesota.

    '
