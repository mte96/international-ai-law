  - governance
  kernthese: 'Der Staat ist im demokratischen Verfassungsstaat verpflichtet, algorithmische Praktiken
    zu regulieren, sobald sie Grundrechte gefährden; technologische Anwendungen ohne verfassungsrechtliche
    Absicherung sind grundrechtswidrig.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Ich stufe diesen Text nicht wegen seines Inhalts als Pflicht ein — er ist ein programmatischer
    Aufsatz von vierzehn Seiten ohne dogmatische Feinarbeit —, sondern wegen des Autors. César Landa Arroyo
    war Präsident des peruanischen Verfassungsgerichts und später Aussenminister; wenn er 2021 eine staatliche
    Regulierungspflicht aus der Verfassung ableitet, ist das der Satz, auf den sich die peruanische Debatte
    seither beruft, und es ist auch der Satz, der der Ley 31814 von 2023 vorausgeht. Wer wissen will,
    warum Peru als erstes Land der Region ein KI-Gesetz erlassen hat und warum dieses Gesetz so grundrechtlich
    formuliert ist, fängt hier an. Für die Sache selbst gibt der Text wenig her; als Autorität für die
    peruanische Rechtslage ist er unentbehrlich.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-romero-santome-imagen-personal
  typ: aufsatz
  autoren:
  - Romero Herrera, Julia
  - Santome Sánchez, Aldo
  titel: 'La protección de la imagen personal frente a la Inteligencia Artificial: Apuntes desde el derecho
    constitucional y el derecho civil peruano'
  titel_deutsch: 'Der Schutz des eigenen Bildes gegenüber künstlicher Intelligenz: Anmerkungen aus dem
    peruanischen Verfassungs- und Zivilrecht'
  fundstelle: IUS ET VERITAS 71 (2025), 1–19
  jahr: 2025
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/iusetveritas/article/view/33516
  doi: 10.18800/iusetveritas.202502.017
  zugang: open-access
  jurisdiktionen:
  - pe
  themenachsen:
  - grundrechte
  - content
  - haftung
  kernthese: 'Deepfakes zwingen dazu, den Wesensgehalt des Rechts am eigenen Bild neu zu bestimmen; das
    peruanische Recht schützt bisher nur die Verbreitung des tatsächlichen, nicht des synthetisierten
    Abbilds.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Nützlich, weil er die beiden Schutzschichten sauber trennt, die im deutschen Recht
    auch auseinanderfallen: den verfassungsrechtlichen Persönlichkeitsschutz (bei uns Art. 2 Abs. 1 iVm
    Art. 1 Abs. 1 GG) und den zivilrechtlichen Bildnisschutz (bei uns §§ 22 f. KUG). Die peruanische Ausgangslage
    ist strenger als unsere — Art. 15 Código Civil verlangt Einwilligung ohne die Ausnahmen des § 23 KUG
    —, und gerade deshalb ist interessant, dass die Autoren trotzdem eine Schutzlücke bei rein synthetischen
    Abbildungen bejahen: Das Einwilligungserfordernis greift nach ihrer Lesart nicht, weil kein Abbild
    "entnommen" wird. Genau dieser Einwand trifft auch § 22 KUG. Kurz und ohne grosse Theorie, aber der
    Kerngedanke ist übertragbar.

    '
  letzte_pruefung: 2026-09-07
