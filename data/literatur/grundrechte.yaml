  kernthese: Wo ein verbotenes Merkmal selbst prädiktiv ist und sich nicht durch zulässige Daten ersetzen
    lässt, wird jedes hinreichend leistungsfähige Modell Stellvertretermerkmale finden; das Verbot der
    Merkmalsnutzung läuft deshalb systematisch leer.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der schärfste theoretische Beitrag zum Thema und der einzige, der eine überprüfbare
    Bedingung nennt: Stellvertreter­ diskriminierung ist nicht immer zu erwarten, sondern genau dann,
    wenn das verbotene Merkmal "directly predictive" ist. Das ist die Unterscheidung, mit der man Versicherung
    (Geschlecht ist direkt prädiktiv für Lebenserwartung) von Personalauswahl (Geschlecht ist es meist
    nicht) trennt — und sie erklärt, warum das Verbot der Merkmalsverwendung in der Versicherungswirtschaft
    strukturell scheitert, im Arbeitsrecht aber nicht. Für das europäische Recht heißt das: Art. 5 der
    Gender-Richtlinie 2004/113/EG (Test-Achats) ist der Fall, in dem das Argument beißt. Kein europäischer
    Autor hat das aufgegriffen. Frei bei der Iowa Law Review.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - usc-42-2000e-2-k
