  bezug_regelwerke:
  - ki-vo-2024-1689
  kernthese: Kalibrierung, gleiche Falsch-Negativ-Rate und gleiche Falsch-Positiv-Rate lassen sich außer
    in zwei entarteten Sonderfällen — identische Basisraten oder perfekte Vorhersage — nicht gleichzeitig
    erfüllen; jede Fairness-Definition schließt die anderen aus.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was Art. 10 Abs. 2 lit. f, g KI-VO ("mögliche Verzerrungen ...
    die sich negativ auf die Grundrechte auswirken") und § 22 AGG vom Verpflichteten überhaupt verlangen
    können — und dass die Antwort nicht "alles zugleich" lauten kann. PFLICHT. Doppelt geführt: In 32_lit_haftung.yaml
    steht der Text als `wichtig` mit dem ausdrücklichen Vermerk, er sei "faktisch Pflichtlektüre für den
    technischen Teil dieses Feldes", dort aber nicht so markiert, weil die Quote von juristischen Grundlagentexten
    aufgebraucht war. Diese Akte holt es nach — hier ist der Text die technische Primärquelle und gehört
    zu den drei Unmöglichkeitsergebnissen, die den Kern dieser Sammlung bilden. Der Beweis ist zehn Seiten
    lang, elementar und ohne Vorkenntnisse nachvollziehbar; das ist ungewöhnlich und macht ihn für die
    mündliche Verhandlung brauchbar. Die juristische Konsequenz, die im deutschen Schrifttum kaum gezogen
    wird: Solange das Antidiskriminierungsrecht nicht sagt, WELCHE Fairnessgrösse es meint, ist der Nachweis
    der Benachteiligung immer führbar (man wählt die passende Metrik) und der Nachweis der Rechtmäßigkeit
    nie (man kann nicht alle erfüllen). Das ist keine Beweislastfrage, sondern ein Definitionsdefizit
    — und es ist im Zweifel der wirksamste Angriff auf jede algorithmische Compliance-Behauptung. ANGREIFBAR:
    Der Satz gilt für Risikoscores mit Gruppenvergleich; er sagt nichts über Einzelfallgerechtigkeit und
    nichts darüber, welche Metrik normativ vorzugswürdig ist. Wer ihn als Beleg dafür zitiert, Fairness
    sei unmöglich, missbraucht ihn — er zeigt, dass eine WAHL nötig ist, nicht dass jede Wahl gleich gut
    wäre.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-10-abs-2
