  kernthese: Die bayerische Regelung, die es Hochschulen verbietet, KI in unbeaufsichtigten Prüfungen
    zu untersagen, verletzt die Lehrfreiheit aus Art. 5 Abs. 3 GG, kehrt die Darlegungslast um und ist
    Symbolpolitik ohne Wirksamkeitsnachweis.
  prioritaet: wichtig
