  kernthese: Nach dem Wegfall der Chevron-Deference müssen Gerichte die Agenteneigenschaft von KI-Anbietern
    selbst bestimmen, ohne sich auf EEOC-Auslegung stützen zu können; das macht die Mobley-Konstruktion
    angreifbarer, als sie erscheint.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Die Verbindung zweier Entwicklungen, die sonst getrennt behandelt werden — algorithmische
    Diskriminierung und der Abbau behördlicher Auslegungsprärogativen (Loper Bright, 2024) —, und deshalb
    aufgenommen, obwohl es ein unbegutachtetes Working Paper ist. Der Befund ist für die Prognose wichtig:
    Die agent-Theorie ist keine gesicherte Rechtslage, sondern eine erstinstanzliche Auslegung ohne behördliche
    Rückendeckung. Wer Mobley als entschieden behandelt, überzieht. SSRN-Volltext nicht maschinell abrufbar
    (429).

    '
