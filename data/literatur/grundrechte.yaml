  kernthese: Nicht Algorithmen diskriminieren, sondern die Organisationen, die sie ungeprüft einsetzen;
    das Datenschutzrecht muss deshalb schon vor der Entscheidung ansetzen, weil die algorithmische Fremdkonstruktion
    der Persönlichkeit die informationelle Selbstbestimmung bereits verletzt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Gründungstext der deutschen Debatte über algorithmische Diskriminierung, geschrieben
    am AMS-Algorithmus und bis heute der meistzitierte deutsche Blogbeitrag zum Thema. Der dogmatische
    Beitrag ist die Verschiebung vom Antidiskriminierungsrecht zum Datenschutzrecht: Weil das AGG an eine
    Benachteiligung anknüpft, greift es erst nach der Entscheidung; die informationelle Selbstbestimmung
    greift früher. Das ist die Argumentationslinie, die später bei SCHUFA (EuGH C-634/21) und in § 37a
    BDSG-E wieder auftaucht. Angreifbar ist die Gegenüberstellung selbst — Wachter/ Mittelstadt und die
    neuere Literatur zeigen, dass beide Regime an denselben Kausalitätsproblemen scheitern. Acht Jahre
    alt und trotzdem wichtig, weil er den deutschen Zugriff prägt.

    '
