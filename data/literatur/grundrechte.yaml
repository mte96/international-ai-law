  kernthese: Das AGG schützt vor algorithmischer Diskriminierung nur unzureichend, weil die Unterscheidung
    von unmittelbarer und mittelbarer Benachteiligung nicht passt, § 22 AGG keine wirksame Beweiserleichterung
    bietet und Systemhersteller nicht erfasst werden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das maßgebliche deutsche Dokument und die Grundlage aller seither geführten Reformdiskussionen
    — zugleich der Text, an dem sich zeigt, wie weit die deutsche Debatte hinter der amerikanischen liegt:
    Was Mobley v. Workday über die agent-Konstruktion prozessual erreicht, will das Gutachten legislatorisch
    erreichen, weil das AGG dogmatisch keinen Weg zum Hersteller kennt. Die Forderungen (Ausweitung des
    Anwendungsbereichs, echte Beweislastumkehr, Verbandsklagerecht, Auskunftsanspruch) sind seit 2023
    unverändert unerfüllt; die Koalitionsvorhaben zur AGG-Reform betreffen andere Punkte. Wer den deutschen
    Rechtszustand darstellen muss, kommt an diesem Gutachten nicht vorbei — kritisch zu lesen ist die
    Prognose, die KI-VO werde die Lücken schließen: Sie tut es nicht, weil sie Marktzugangs- und kein
    Individualschutzrecht ist.

    '
