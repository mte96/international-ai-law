  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob die Vorgabe einer Fairnesskennzahl ein taugliches Regulierungsinstrument
    ist — die Frage, die hinter jedem Vorschlag steht, Art. 10 KI-VO um messbare Schwellen zu ergänzen.
    Die schärfste GEGENPOSITION im Fairness-Block und der Text, der die naheliegende juristische Reaktion
    auf Kleinberg ("dann schreibt der Gesetzgeber eben eine Metrik vor") erledigt. Die Autoren zeigen
    an Beispielen aus Kreditvergabe und Strafjustiz, dass Gleichheitsauflagen auf der Ebene der Kennzahl
    zu Entscheidungsregeln führen, die Kreditwürdige ablehnen und Ungeeignete annehmen, und dass der Schaden
    bei der geschützten Gruppe anfällt. Ihr Gegenvorschlag — an den Politikzielen und den tatsächlichen
    Folgen ansetzen statt an der Metrik — ist juristisch anschlussfähiger, als er klingt: Er entspricht
    der Struktur der Rechtfertigungsprüfung bei mittelbarer Benachteiligung (§ 3 Abs. 2 AGG, Art. 2 Abs.
    1 lit. b RL 2000/78/EG), die ebenfalls auf Zweck und Erforderlichkeit abstellt und nicht auf Ergebnisgleichheit.
    Wer diese Parallele ausarbeitet, hat ein originelles Argument. ANGREIFBAR: Das Argument setzt voraus,
    dass die Zielgröße korrekt gemessen wird — genau das bestreiten die Kritiker (Verzerrung liegt oft
    schon im Label, nicht erst im Modell). Die JMLR-Fassung von 2023 geht darauf ein, ohne es aufzulösen.
    Und: Die Autoren argumentieren utilitaristisch; wer Diskriminierungsschutz deontologisch begründet,
    wird ihre Prämisse nicht teilen.

    '
  letzte_pruefung: 2026-08-27
