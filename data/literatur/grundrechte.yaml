  kernthese: 'Rückfallprognosesoftware verletzt in der Hauptverhandlung sowohl das Recht auf Privatheit
    als auch das Verteidigungsrecht, solange der Beschuldigte die Prognose nicht angreifen kann; der Einsatz
    ist nur unter benannten Verfahrensbedingungen zulässig.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der lateinamerikanische Gegenpart zur COMPAS-Diskussion, und zwar der prozessual
    sauberste, den ich gefunden habe: Urzúa Urzúa begrenzt die Untersuchung ausdrücklich auf das "juicio
    oral" und fragt dann, wie sich eine nicht angreifbare Prognose zur Waffengleichheit verhält. Das ist
    enger und deshalb ergiebiger als die üblichen Aufsätze, die Ermittlungsverfahren, Haftentscheidung
    und Strafzumessung in einen Topf werfen. Für die deutsche Debatte um Art. 6 Abs. 3 EMRK und das Recht
    auf Akteneinsicht bei algorithmischen Beweismitteln unmittelbar anschlussfähig. Nachteil: Chile setzt
    solche Software real bislang kaum ein, der Text ist also vorsorglich und nicht empirisch.

    '
  letzte_pruefung: 2026-09-07
