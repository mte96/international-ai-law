  kernthese: 'Mobley zeigt die Arbeitsteilung der Doktrin: Der Wirkungstatbestand trägt die Klage, der
    Absichtstatbestand nicht — und die Ausdehnung auf den Systemanbieter über die agent-Konstruktion ist
    die eigentliche Neuerung.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die brauchbarste kompakte Aufarbeitung des Verfahrens, das für die gesamte US-Debatte
    zum Testfall geworden ist — insbesondere weil sie den Schritt sauber herausarbeitet, auf den es ankommt:
    Workday wird nicht als Arbeitgeber, sondern als dessen Agent belangt (42 U.S.C. § 2000e(b)). Damit
    haftet erstmals der Anbieter des Auswahlsystems unmittelbar. Genau diese Konstruktion fehlt dem europäischen
    Recht: § 6 Abs. 2, § 15 AGG adressieren den Arbeitgeber, nicht den Softwareanbieter, und Art. 25 KI-VO
    regelt Pflichten, keine Ansprüche. Wer eine Publikationslücke sucht, findet hier eine. Studentische
    Online-Publikation, deshalb nur als Einstieg zu zitieren; die Verfahrensakte steht in 21_us_übrige.yaml.

    '
