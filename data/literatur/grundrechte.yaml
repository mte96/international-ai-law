  kernthese: Zwischen den unvereinbaren Fairness-Kriterien lässt sich stufenlos interpolieren; das erlaubt
    es, den rechtlich geforderten Ausgleich (Verhältnismäßigkeit statt Entweder-oder) technisch abzubilden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der wichtigste Text dieses Kapitels für Juristen, weil er der einzige ist, der aus
    dem Unmöglichkeitsergebnis eine juristisch brauchbare Konsequenz zieht statt es zu beklagen: Wenn
    die Kriterien einander ausschließen, aber stetig ineinander überführbar sind, dann ist die Wahl des
    Punktes auf dem Kontinuum eine Abwägungsentscheidung — und Abwägungsentscheidungen kann das Recht
    strukturieren. Hacker ist Mitautor, was den Bogen zu seiner Haftungsarbeit (Kap. I) schließt und die
    These stützt, dass Haftung und Fairness bei ihm ein Problem sind. Angreifbar: Das FAIM-Verfahren interpoliert
    zwischen genau drei Kriterien und setzt voraus, dass die geschützte Gruppe bekannt und binär ist —
    beides ist im Anwendungsfall regelmäßig nicht gegeben. Die juristische Anschlussfrage — wer den Punkt
    auf dem Kontinuum bestimmt und nach welchem Maßstab — stellen die Autoren, beantworten sie aber nicht.
    Freie arXiv-Fassung (v4).

    '
  letzte_pruefung: 2026-08-27
