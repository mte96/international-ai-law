  kernthese: KI-Output ist von der Redefreiheit erfasst, weil der Erste Zusatzartikel Rede schützt und
    nicht nur Sprecher; Träger des Schutzes sind die Nutzer und Hörer, nicht die Maschine.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, an dem sich alles Weitere abarbeitet, und zugleich der kürzeste der Pflichtlektüre
    — neun Seiten, die den gesamten Streitstand aufspannen. Entscheidend ist die Verlagerung der Frage:
    Wer nach den Rechten der Maschine fragt, hat schon verloren; die Autoren fragen nach den Rechten der
    Nutzer und stützen sich auf die Hörerrechtsjudikatur (Lamont, Virginia Pharmacy, Citizens United).
    Das ist die Argumentationslinie, mit der Character Technologies und OpenAI in den anhängigen Verfahren
    operieren. Angreifbar an einer Stelle, die Salib genau trifft: Die Hörerrechtsjudikatur setzt voraus,
    dass es am anderen Ende einen Sprecher mit einer Botschaft gibt — bei einem System, das "alles sagen
    kann", fehlt die Botschaft, deren Empfang geschützt würde. Wer den Streitstand referiert, muss diesen
    Text und Salib nebeneinanderlegen; alles andere ist Sekundärliteratur.

    '
  letzte_pruefung: 2026-08-27
