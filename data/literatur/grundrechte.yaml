  eigene_bewertung: 'Würtenberger liefert die Dogmatik, die dem Verfassungsblog-Streit zwischen Rachut
    und Elmentaler/Hof fehlt: die Unterscheidung zwischen tiefen und peripheren Eingriffen in die Lehrfreiheit.
    Sie wendet sich hier zugunsten der Regelungsbefugnis der Hochschule, wäre aber auch gegen die staatliche
    Vorgabe zu wenden — der bayerische Landesgesetzgeber greift in die Hochschulautonomie ein, nicht die
    Hochschule in die Lehrfreiheit. Diese Unterscheidung macht Würtenberger nicht, und darin liegt die
