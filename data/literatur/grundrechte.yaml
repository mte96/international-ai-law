  kernthese: Kalibrierung, gleiche Falsch-Negativ-Rate und gleiche Falsch-Positiv-Rate lassen sich außer
    in eng begrenzten Sonderfällen nicht gleichzeitig erfüllen; jede Fairness-Definition schließt die
    anderen aus.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Faktisch Pflichtlektüre für den technischen Teil dieses Feldes; nicht als solche
    markiert, weil die Quote von sieben Einträgen durch die juristischen Grundlagentexte erschöpft ist.
    Wer die Diskriminierungsdebatte führt, ohne dieses Ergebnis zu kennen, fordert Unmögliches. Der Satz
    ist mathematisch trivial und juristisch verheerend: Wenn die Basisraten zweier Gruppen differieren
    — und das tun sie in jedem realen Datensatz —, kann ein Score nicht zugleich kalibriert und fehlerratengleich
    sein. Für die deutsche Praxis heißt das: Der Nachweis, dass ein System "unfair" ist, gelingt IMMER,
    wenn man die passende Metrik wählt. Damit ist die Vermutungsregel des § 22 AGG entweder trivial erfüllbar
    oder das Recht muss die maßgebliche Metrik benennen. Es tut weder das eine noch das andere. Zehn Seiten,
    formal, ohne juristische Vorkenntnisse lesbar.

    '
  letzte_pruefung: 2026-08-27
