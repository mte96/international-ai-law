  kernthese: Algorithmische Benachteiligung entsteht nicht nur aus verzerrten Daten, sondern aus der ungleich
    verteilten Prognoseunsicherheit selbst; das Diskriminierungsrecht kennt für diese Form der Ungleichbehandlung
    keine Kategorie.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der originellste Beitrag der jüngeren Zeit, weil er eine dritte Kategorie neben unmittelbare
    und mittelbare Benachteiligung setzt: Wenn ein Modell für eine Gruppe systematisch unsicherer prognostiziert
    — weil sie in den Trainingsdaten unterrepräsentiert ist —, werden ihre Mitglieder bei jeder risikoaversen
    Schwellenwahl schlechter behandelt, ohne dass ein Merkmal oder ein Stellvertreter im Spiel wäre. Das
    trifft weder § 3 Abs. 1 noch § 3 Abs. 2 AGG sauber, und Sargeant sagt das auch. Der Text ist zugleich
    die Brücke zu Kapitel VII: Prognoseunsicherheit ist der technische Grund hinter den Unmöglichkeitsresultaten.
    Wiley-Verlagsseite beantwortet automatisierte Abrufe mit 403; MLR ist hybrid, der Zugang deshalb nicht
    gesichert.

    '
  letzte_pruefung: 2026-08-27
