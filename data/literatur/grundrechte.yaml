  kernthese: Sicherheitsauflagen für Basismodelle berühren den Ersten Zusatzartikel nicht, weil Modellgewichte
    von keinem Menschen geschrieben und von keinem gelesen werden können und der Output kein Ausdruck
    einer Absicht des Entwicklers ist.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Übertragung von Salibs Schutzbereichsthese auf die Gesetzgebung — und damit der
    Text, der zeigt, worum es in dem Streit praktisch geht: Wenn Output geschützte Rede ist, steht jedes
    KI-Sicherheitsgesetz von SB 1047 bis SB 53 unter strict scrutiny und fällt. Bemerkenswert ist das
    Modellgewichte-Argument, das den Bogen zu einem anderen Streitstand des Projekts schlägt (`modellgewichte-kopie`):
    Wer Gewichte für unlesbar und damit für nichtexpressiv hält, kann sie schlecht als Vervielfältigungsstück
    eines Werkes behandeln. Diese Verbindung zieht niemand. Kurz, gut argumentiert, klar interessengeleitet
    — Rozenshtein und Salib gehören zum Lager, das KI-Sicherheitsgesetzgebung für möglich hält.

    '
  letzte_pruefung: 2026-08-27
