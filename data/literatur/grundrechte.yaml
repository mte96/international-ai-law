  kernthese: Nachträgliche Erklärungen für undurchschaubare Modelle sind notwendigerweise ungenau — wären
    sie genau, wären sie das Modell —; bei Entscheidungen mit hohem Einsatz ist deshalb nicht die Erklärung
    zu verbessern, sondern von vornherein ein deutbares Modell zu verwenden, das in der Regel nicht schlechter
    abschneidet.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob die Transparenzpflichten der Art. 13, 14 KI-VO und das Auskunftsrecht
    über die "involvierte Logik" (Art. 15 Abs. 1 lit. h DSGVO, dazu EuGH C-203/22 Dun & Bradstreet) durch
    eine post-hoc-Erklärung erfüllbar sind — und wenn nicht, was der Verpflichtete stattdessen schuldet.
    PFLICHT, weil dieser Text die Grundunterscheidung setzt, ohne die die gesamte Transparenzdiskussion
    im Ungefähren bleibt: DEUTBARKEIT (das Modell ist so gebaut, dass man es lesen kann) gegen ERKLÄRUNG
    (ein zweites Verfahren behauptet etwas über das erste). Rudins Argument ist kein empirisches, sondern
    ein logisches, und deshalb im Rechtsstreit belastbar: Eine nachträgliche Erklärung, die dem Modell
    exakt entspräche, wäre mit dem Modell identisch; jede Erklärung, die einfacher ist als das Modell,
    weicht notwendig von ihm ab. Für Art. 86 KI-VO — das Recht auf Erläuterung der Einzelfallentscheidung
    — folgt daraus die unbequeme Frage, was genau erläutert wird: das Modell oder eine Erzählung über
    das Modell. Der zweite, empirische Teil ist juristisch mindestens so wichtig: Rudin bestreitet den
    angeblichen Zielkonflikt zwischen Genauigkeit und Deutbarkeit für strukturierte Daten. Trifft das
    zu, ist der Einsatz eines undurchschaubaren Modells in der Kreditvergabe oder Strafzumessung nicht
    alternativlos, sondern eine Wahl — und Wahlen sind rechtfertigungspflichtig. Das ist der schärfste
    verfügbare Angriff auf die Verhältnismäßigkeit im Hochrisikobereich. ANGREIFBAR: Der empirische Teil
    ist für tabellarische Daten gut belegt und für Sprache und Bild nicht; bei generativen Modellen ist
    "stattdessen ein deutbares Modell" keine Option. Wer Rudin auf große Sprachmodelle anwendet, überträgt
    ein Argument über Rückfallprognosen auf einen Gegenstand, für den es nicht geschrieben wurde. Zehn
    Seiten, polemisch, ohne Formeln.

    '
  letzte_pruefung: 2026-08-27
