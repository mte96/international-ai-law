  - grundrechte
  - content
  - datenschutz
  kernthese: 'Die "digitale Auferstehung" — ein Chatbot mit Bild und Stimme einer verstorbenen Person
    — bricht die Kontinuität zwischen realer und digitaler Identität und verlangt nach einem eigenen Schutzrahmen.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Ungewöhnlich, aktuell (2026) und für das deutsche Recht direkt anschlussfähig: Die
    Frage ist funktional unser postmortales Persönlichkeitsrecht (Mephisto, BVerfGE 30, 173) in einer
    neuen Erscheinungsform. Grosso und Madrid Ramírez argumentieren naturrechtlich-personalistisch — die
    Zeitschrift gehört zur Katholischen Universität Argentiniens, und das merkt man —, was ein deutscher
    Leser als Fremdheit empfinden wird; die Schlussfolgerung, dass der Schutz des Verstorbenen nicht am
    Datenschutz hängen kann, weil dieser mit dem Tod endet, ist trotzdem richtig und für § 22 Satz 3 KUG
    und die Zehnjahresfrist erhellend. Rechtsphilosophie mit dünner Normanbindung; man liest ihn für die
    Fragestellung, nicht für die Subsumtion.

    '
  letzte_pruefung: 2026-09-07
- id: 2021-munoz-discriminacion-sociedad-automatizada
  typ: aufsatz
  autoren:
  - Muñoz Gutiérrez, Catherine
  titel: 'La discriminación en una sociedad automatizada: Contribuciones desde América Latina'
  titel_deutsch: 'Diskriminierung in einer automatisierten Gesellschaft: Beiträge aus Lateinamerika'
  fundstelle: Revista Chilena de Derecho y Tecnología 10 (2021), Nr. 1, 271–307
  jahr: 2021
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/58793
  doi: 10.5354/0719-2584.2021.58793
  zugang: open-access
  jurisdiktionen:
  - latam
  - cl
  themenachsen:
  - grundrechte
  - governance
  kernthese: 'Die lateinamerikanischen Gleichheitssätze erfassen algorithmische Diskriminierung nicht,
    weil sie individuell und merkmalsbezogen gedacht sind; erforderlich ist ein relationales, kollektivbezogenes
    Verständnis von Gleichheit.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der theoretisch ambitionierteste Text der Sammlung und der einzige, der etwas genuin
    Regionales anzubieten hat. Muñoz Gutiérrez sagt: Die Diskriminierungsverbote europäischer Prägung
    — geschlossene Merkmalskataloge, individueller Rechtsschutz — passen nicht auf lateinamerikanische
    Ungleichheitslagen, in denen Zugehörigkeit relational und kollektiv organisiert ist, und algorithmische
    Systeme reproduzieren gerade diese Struktur. Daraus leitet sie ein "relationales Prinzip" ab. Für
    einen deutschen Leser ist das doppelt interessant: erstens, weil dasselbe Problem bei uns unter dem
    Stichwort der statistischen Diskriminierung diskutiert wird und § 3 AGG damit erkennbar überfordert
    ist; zweitens, weil es ein seltenes Beispiel dafür ist, dass lateinamerikanische Rechtswissenschaft
    nicht rezipiert, sondern etwas Eigenes vorschlägt. Ob das relationale Prinzip trägt, halte ich für
    offen — es bleibt unterbestimmt, und die Autorin sagt nicht, wie ein Gericht damit arbeiten soll.
    Als Pflicht eingestuft wegen des Eigenbeitrags, nicht wegen der Durchführung.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-florez-diaz-videovigilancia-reconocimiento-facial
  typ: bericht
  autoren:
  - Flórez Ruiz, José Fernando
  - Díaz Benito, César Orlando
  titel: Videovigilancia con reconocimiento facial, inteligencia artificial y derechos humanos
  titel_deutsch: Videoüberwachung mit Gesichtserkennung, künstliche Intelligenz und Menschenrechte
  fundstelle: Proyecto GuIA (CETyS, Universidad de San Andrés), Ausgabe 2021, veröffentlicht 2022
  jahr: 2022
  sprache: es
  url: https://proyectoguia.lat/wp-content/uploads/2022/08/reconocimiento-facial-V5.pdf
  zugang: open-access
  jurisdiktionen:
  - latam
  - co
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - datenschutz
  kernthese: 'Biometrische Videoüberwachung im öffentlichen Raum Lateinamerikas findet ohne hinreichende
    gesetzliche Grundlage und ohne wirksame Kontrolle statt.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der einzige regionale Beitrag zur biometrischen Fernidentifizierung, den ich in verwertbarer
    Form gefunden habe. Er ist für die europäische Debatte deshalb interessant, weil Art. 5 Abs. 1 lit.
    h KI-VO die biometrische Echtzeit-Fernidentifizierung im öffentlichen Raum grundsätzlich verbietet,
    während mehrere lateinamerikanische Städte — Buenos Aires, Bogotá, São Paulo — sie ohne Ermächtigungsgrundlage
    betreiben. Flórez Ruiz lehrt am Externado und schreibt hier ausserhalb der für mich gesperrten Zeitschriften;
    das macht den Text auch als Zugang zur Externado-Schule wertvoll. Politikpapier, keine Dogmatik, aber
    mit Fallmaterial. Wer die Argumentation der Klägerseite im Verfahren gegen das Buenos-Aires-System
    nachvollziehen will, findet hier den Rahmen.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-lungu-ki-ueberwachung-datensouveraenitaet
  typ: aufsatz
  autoren:
  - Lungu, Maria
  titel: 'Bridging the Legal-technical Gap: AI Surveillance and Data Sovereignty in Africa'
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 29 (2026), Beitrag a23860
  jahr: 2026
  sprache: en
  url: https://perjournal.co.za/article/view/23860
  doi: 10.17159/1727-3781/2026/v29i0a23860
  zugang: open-access
  jurisdiktionen:
  - za
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - datenschutz
  kernthese: Zwischen den Privatheits- und Verfahrensgarantien der suedafrikanischen und nigerianischen
    Verfassung und der Betriebswirklichkeit herstellergesteuerter Ueberwachungssysteme klafft eine "algorithmic
    sovereignty gap"; sie werde nur durch verpflichtende KI-Folgenabschaetzungen, Auditrechte, Quellcode-Hinterlegung,
    Datenlokalisierung und Beschaffungstransparenz geschlossen.
  eigene_bewertung: Der Text mit dem groessten Uebertragungswert. Lungu zeigt an Beschaffungsvorgaengen,
    dass Grundrechtsschutz gegenueber KI-Ueberwachung nicht am materiellen Recht scheitert, sondern an
    der Unzugaenglichkeit des Systems - Betriebsgeheimnis plus Sicherheitsvorbehalt ergeben faktische
    Kontrollfreiheit. Das ist genau die Konstellation, die Art. 6 i.V.m. Anhang III KI-VO und die Ausnahmen
    fuer Strafverfolgung bei uns erzeugen, nur ohne die dortigen Marktueberwachungsstrukturen. Der Vorschlag
    der Quellcode-Hinterlegung ist praktisch kaum durchsetzbar, aber als Argumentationsfigur gegen den
    Betriebsgeheimnis-Einwand brauchbar. Fuer die Achse Biometrie/Predictive Policing im Rechtsvergleich
    Pflichtlektuere.
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2024-lco-human-rights-ai-impact-assessment
  typ: bericht
  autoren:
  - Law Commission of Ontario
  titel: Human Rights AI Impact Assessment (HRIA)
  fundstelle: Law Commission of Ontario, Toronto, 2024 (Guide; Backgrounder 2025)
  jahr: 2024
  sprache: en
  url: https://lco-cdo.org/en/publications/human-rights-ai-impact-assessment-hria/
  zugang: open-access
  jurisdiktionen:
  - ca
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  kernthese: Die LCO legt ein operationalisierbares Instrument vor, mit dem Behoerden und Unternehmen
    die menschenrechtlichen Auswirkungen eines KI-Systems vor und waehrend des Einsatzes strukturiert
    pruefen koennen.
  eigene_bewertung: 'Praktisch das interessanteste Stueck aus Kanada, weil es die Luecke fuellt, die Art.
    27 KI-VO bei uns offenlaesst: Die Grundrechte-Folgenabschaetzung ist dort angeordnet, aber inhaltlich
    nicht ausgestaltet. Die LCO liefert genau die Pruefschritte, die die Verordnung schuldig bleibt, und
    zwar auf Basis des kanadischen Menschenrechtsrechts (Ontario Human Rights Code, Charter). Wer ein
    Muster fuer eine FRIA sucht, das nicht aus dem Beratungsmarkt kommt, nimmt dieses. Grenze: Die materiellen
    Diskriminierungsmassstaebe sind kanadisch und nicht ohne Weiteres auf Art. 3 GG und das AGG uebertragbar.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2024-ramaswamy-evidence-machine
  typ: aufsatz
  autoren:
  - Ramaswamy, Samyukta
  titel: 'The Evidence Machine: Rethinking Admissibility and Privacy in India''s AI Surveillance State'
  fundstelle: Indian Journal of Law and Technology 20 (2024), Heft 2, Beitrag 4
  jahr: 2024
  sprache: en
  url: https://repository.nls.ac.in/ijlt/vol20/iss2/4
  zugang: open-access
  jurisdiktionen:
  - in
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - datenschutz
  kernthese: Erkenntnisse aus KI-gestuetzter Ueberwachung gelangen in indische Strafverfahren, ohne dass
    Beweisrecht oder Verfassungsrecht die Zuverlaessigkeit des erzeugenden Systems pruefen; noetig sei
    ein eigener Zulaessigkeitsmassstab.
  eigene_bewertung: 'Der interessanteste Beitrag zur Frage, die mich am meisten beschaeftigt: Was macht
    das Beweisrecht mit Modellausgaben? Ramaswamy zeigt, dass die indischen Regeln zu elektronischen Beweismitteln
    (frueher section 65B Indian Evidence Act, jetzt section 63 Bharatiya Sakshya Adhiniyam 2023) auf Datentraeger
    zugeschnitten sind und bei probabilistischen Systemen leerlaufen - das Zertifikat bescheinigt die
    korrekte Kopie, nicht die Richtigkeit der Inferenz. Dieselbe Luecke besteht bei uns im Freibeweis
    des Paragraf 261 StPO, nur unbemerkter. Fuer die Achse grundrechte und fuer alles, was mit Gesichtserkennung
    in der Strafverfolgung zu tun hat, ein sehr brauchbarer Text.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2026-dancy-algorithmen-begruendungspflicht
  typ: aufsatz
  autoren:
  - Dancy, Tatiana
  titel: Algorithms and the Duty to Explain
  fundstelle: Indian Journal of Law and Technology 22 (2026), Heft 1, Beitrag 1
  jahr: 2026
  sprache: en
  url: https://repository.nls.ac.in/ijlt/vol22/iss1/1
  zugang: open-access
  jurisdiktionen:
  - in
  - uk
  themenachsen:
  - grundrechte
  - sektor-oeffentlich
  - governance
  kernthese: Die Pflicht, algorithmisch gestuetzte Entscheidungen zu erklaeren, laesst sich nicht aus
    einem technischen Transparenzbegriff ableiten, sondern nur aus dem Grund, aus dem wir ueberhaupt Begruendungen
    verlangen - der Ermoeglichung von Widerspruch.
  eigene_bewertung: 'Der theoretisch sauberste Beitrag zur Erklaerbarkeitsfrage in diesem Konvolut. Dancy
    dreht die uebliche Reihenfolge um: nicht was ein Modell erklaeren kann, sondern wozu Begruendungen
    da sind. Damit trifft sie die Schwaeche von Art. 86 KI-VO und Art. 15 Abs. 1 lit. h DSGVO, die beide
    ein Recht auf Erlaeuterung anordnen, ohne den Massstab zu benennen, an dem sich die Erlaeuterung messen
    lassen muss. Dass der Text in einer indischen Zeitschrift erscheint, aber im Wesentlichen englisches
    Verwaltungsrecht verarbeitet, mindert seinen Wert fuer die Jurisdiktion Indien; ich fuehre ihn dennoch,
    weil er ueber die IJLT rezipiert wird.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2025-packin-paywalling-humans
  typ: aufsatz
  autoren:
  - Packin, Nizan Geslevich
  titel: Paywalling humans
  fundstelle: Theoretical Inquiries in Law 26 (2025), Heft 1, 215-238
  jahr: 2025
  sprache: en
  doi: 10.1515/til-2025-0009
  zugang: bezahlt
  jurisdiktionen:
  - il
  themenachsen:
  - grundrechte
  - vertrag
  - wettbewerb
  kernthese: Wenn Unternehmen den Zugang zu menschlichen Ansprechpartnern hinter eine Bezahlschranke stellen
    und die kostenlose Variante der KI-Bearbeitung vorbehalten, entsteht eine neue Ungleichheitsdimension,
    die weder das Verbraucher- noch das Diskriminierungsrecht bislang erfasst.
  eigene_bewertung: 'Die originellste Beobachtung des Themenhefts und praktisch hochrelevant: Menschliche
    Bearbeitung wird zum Premiumgut. Packin (Bar-Ilan und CUNY) trifft damit eine Luecke, die auch Art.
    22 DSGVO und Art. 86 KI-VO offenlassen - beide gewaehren ein Recht auf menschliches Eingreifen, sagen
    aber nichts darueber, ob dieses Recht bepreist werden darf. Fuer mich ist das die praktisch wichtigste
    offene Frage des Rechts auf menschliche Ueberpruefung, und ich habe zu ihr sonst nichts Brauchbares
    gefunden. Der Aufsatz bleibt bei der Problembeschreibung stehen und liefert keinen ausformulierten
    Anspruch; das mindert den Wert, hebt ihn aber nicht auf.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2026-piao-ki-diskriminierung-erklaerbarkeit-kredit
  typ: aufsatz
  autoren:
  - 朴昱平 (Piao Yuping)
  titel: 人工智慧歧視與可解釋人工智慧——以人工智慧金融信貸為例
  titel_deutsch: KI-Diskriminierung und erklaerbare KI - am Beispiel der KI-gestuetzten Kreditvergabe
  fundstelle: 月旦法學雜誌 (Yuedan Faxue Zazhi, The Taiwan Law Review) 372 (Mai 2026), 32-49
  jahr: 2026
  sprache: zh
  doi: 10.53106/1025593137202
  zugang: bezahlt
  jurisdiktionen:
  - tw
  themenachsen:
  - grundrechte
  - sektor-finanz
  - datenschutz
  kernthese: Erklaerbarkeit ist kein Selbstzweck, sondern das Instrument, mit dem sich algorithmische
    Diskriminierung bei der Kreditvergabe ueberhaupt erst feststellen laesst; das taiwanische Recht stellt
    dafuer bislang kein Verfahren bereit.
  eigene_bewertung: Der einzige mir bekannte taiwanische Aufsatz, der Diskriminierung und Erklaerbarkeit
    zusammen behandelt, und damit fuer die Achse grundrechte der ergiebigste. Kreditvergabe ist in Anhang
    III Nr. 5 lit. b KI-VO als Hochrisikoanwendung eingestuft; hier sieht man denselben Sachverhalt in
    einer Rechtsordnung, die weder eine Hochrisikoklassifikation noch ein allgemeines zivilrechtliches
    Benachteiligungsverbot nach Art des AGG kennt. Aktuell (Mai 2026) und damit auf dem Stand der taiwanischen
    Gesetzgebungsdiskussion zum KI-Grundlagengesetz. Nur ueber den Verlag.
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2020-lynch-gesichtserkennung-nz
  typ: bericht
  autoren:
  - Lynch, Nessa
  - Campbell, Liz
  - Purshouse, Joe
  - Betkier, Marcin
  titel: 'Facial Recognition Technology in New Zealand: Towards a Legal and Ethical Framework'
  fundstelle: Victoria University of Wellington / New Zealand Law Foundation, Wellington, November 2020
  jahr: 2020
  sprache: en
  url: https://www.wgtn.ac.nz/__data/assets/pdf_file/0010/1913248/Facial-Recognition-Technology-in-NZ.pdf
  zugang: open-access
  jurisdiktionen:
  - nz
  themenachsen:
  - grundrechte
  - datenschutz
  - sektor-oeffentlich
  kernthese: Der neuseelaendische Rechtsrahmen erfasst Gesichtserkennung nur unzureichend; die Autoren
    fordern in fuenfzehn Empfehlungen unter anderem eine eigene Kategorie biometrischer Daten, einen Biometrics
    Commissioner, einen verbindlichen Verhaltenskodex und ein Moratorium fuer den Live-Einsatz durch die
    Polizei.
  eigene_bewertung: 'Der beste Bericht zur Gesichtserkennung, den ich ausserhalb Europas und der USA gefunden
    habe, und methodisch vorbildlich: Rechtslage, empirische Erhebung des tatsaechlichen Polizeieinsatzes,
    dann Empfehlungen. Fuer die Achse Biometrie unmittelbar ergiebig, weil er den Vergleich mit Art. 5
    Abs. 1 lit. h KI-VO erlaubt - die Forderung nach einem Moratorium fuer live automated facial recognition
    ist genau das, was die Verordnung mit ihrem Grundsatz-Ausnahme-Verhaeltnis abbildet, hier aber ohne
    Rechtsakt, sondern als Empfehlung. Bemerkenswert ist auch, dass die Empfehlungen tatsaechlich gewirkt
    haben: Der neuseelaendische Privacy Commissioner hat 2024/2025 einen Biometric Processing Privacy
    Code erlassen. Damit ist der Bericht ein seltener Fall belegbaren Einflusses von Rechtswissenschaft
    auf Rechtsetzung. Titelseite und Empfehlungen am Volltext geprueft.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  letzte_pruefung: 2026-09-07
- id: 2019-zerilli-transparenz-doppelter-massstab
  typ: aufsatz
  autoren:
  - Zerilli, John
  - Knott, Alistair
  - Maclaurin, James
  - Gavaghan, Colin
  titel: 'Transparency in Algorithmic and Human Decision-Making: Is There a Double Standard?'
  fundstelle: Philosophy & Technology 32 (2019), Heft 4, 661-683
  jahr: 2019
  sprache: en
  doi: 10.1007/s13347-018-0330-6
  zugang: bezahlt
  jurisdiktionen:
  - nz
  - intl
  themenachsen:
  - grundrechte
  - governance
  - sektor-oeffentlich
  kernthese: An algorithmische Entscheidungen werden Transparenzanforderungen gestellt, die menschliche
    Entscheider nie erfuellen muessten; dieser doppelte Massstab ist nur teilweise gerechtfertigt und
    muss fuer jede Anforderung eigens begruendet werden.
  eigene_bewertung: 'Der am haeufigsten zitierte Aufsatz der neuseelaendischen Gruppe und das beste Gegenargument
    gegen die Selbstverstaendlichkeit, mit der Erklaerbarkeit gefordert wird. Das Argument ist unbequem
    und richtig: Wir verlangen von einem Modell die Offenlegung des Entscheidungswegs, akzeptieren beim
    Menschen aber die nachgeschobene Begruendung, die mit dem tatsaechlichen Entscheidungsvorgang wenig
    zu tun hat. Fuer die Auslegung von Art. 86 KI-VO und Art. 15 Abs. 1 lit. h DSGVO heisst das: Der Massstab
    kann nicht die vollstaendige Nachvollziehbarkeit sein, sondern nur die Erreichung des Zwecks, dem
    die Begruendung dient. Damit trifft sich der Aufsatz mit Dancy 2026 aus der IJLT, von der anderen
    Seite her. Philosophisch, nicht juristisch geschrieben; man muss die Rechtsfolge selbst ziehen.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2020-brownlie-encoding-equality
  typ: aufsatz
  autoren:
  - Brownlie, Ella
  titel: 'Encoding Equality: The Case for Greater Regulation of Artificial Intelligence and Automated
    Decision Making in New Zealand'
  fundstelle: Victoria University of Wellington Law Review 51 (2020), Heft 1, 1-26
  jahr: 2020
  sprache: en
  url: https://ojs.victoria.ac.nz/vuwlr/article/view/6515
  doi: 10.26686/vuwlr.v51i1.6515
  zugang: open-access
  jurisdiktionen:
  - nz
  themenachsen:
  - grundrechte
  - datenschutz
  - governance
  kernthese: Der neuseelaendische Rechtsrahmen schuetzt gegen diskriminierende automatisierte Entscheidungen
    nicht ausreichend; auch Art. 22 DSGVO als naechstliegendes Vorbild weist erhebliche Schwaechen auf,
    weshalb ein eigenes Modell erforderlich sei.
  eigene_bewertung: 'Der einzige Aufsatz in einer neuseelaendischen Rechtszeitschrift, der die Regulierungsfrage
    im Ganzen stellt - das sagt viel ueber den Zustand der dortigen Literatur. Fuer den Rechtsvergleich
    ist die Kritik an Art. 22 DSGVO interessant, weil sie von aussen kommt und deshalb die Punkte trifft,
    die in Europa als gesetzt gelten: die Beschraenkung auf ausschliesslich automatisierte Entscheidungen,
    die Rechtsfolgenschwelle, die Erlaubnistatbestaende. Brownlie schreibt als Studentin (der Beitrag
    geht auf eine Abschlussarbeit zurueck), was man an der Belegdichte merkt; die Analyse ist trotzdem
    sauber. Frei verfuegbar mit DOI, am Objekt geprueft.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  letzte_pruefung: 2026-09-07
