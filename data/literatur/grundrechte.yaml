  kernthese: 'Die Verbotstatbestände des Art. 5 Abs. 1 lit. a und b KI-VO schützen der Sache nach die
    Gewissensfreiheit gegenüber Privaten — eine Schutzrichtung, die das mexikanische Verfassungsrecht
    bisher nur gegenüber der Staatsgewalt kennt.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der intellektuell stärkste mexikanische Text zur KI-VO, den ich gefunden habe, und
    für einen deutschen Leser aus einem unerwarteten Grund lohnend: Hernández Torruco liest Art. 5 Abs.
    1 lit. a und b nicht als Verbraucherschutz, sondern als grundrechtliche Norm mit Drittwirkung, und
    fragt dann, ob eine Rechtsordnung, die Gewissensfreiheit rein abwehrrechtlich denkt, diese Norm überhaupt
    rezipieren kann. Das ist genau die Frage, die man auch an Art. 4 GG und die mittelbare Drittwirkung
    stellen müsste, und ich kenne keinen deutschen Aufsatz, der sie stellt. Erschienen 2026, also nach
    Anwendbarkeit der Verbotstatbestände seit dem 02.02.2025 — sie kann die ersten Anwendungsfragen mitverarbeiten.
    Als "pflicht" eingestuft nicht wegen des mexikanischen Rechts, sondern wegen des dogmatischen Zugriffs.

    '
