  kernthese: Die Unmöglichkeit der Fairness ist ein Artefakt der formalen Betrachtung, die den Entscheidungsvorgang
    isoliert; wer den sozialen Kontext einbezieht, ersetzt die Frage 'welche Metrik?' durch die Frage
    'welche Ungleichheit soll das Verfahren abbauen?'.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die philosophisch anspruchsvollste Gegenposition zum Unmöglichkeitsdiskurs und der
    Text, der dem europäischen Rechtsdenken am nächsten kommt, ohne es zu kennen: Greens "substantive
    fairness" ist der Sache nach das, was der EuGH bei der mittelbaren Benachteiligung tut — er fragt
    nicht nach der Metrik, sondern nach der Rechtfertigung des Unterschieds im Kontext. Wer Wachter/Mittelstadt/Russell
    und Green nebeneinanderlegt, sieht dieselbe These aus zwei Traditionen. Schwäche: Green sagt, was
    NICHT zu tun ist, und bleibt bei der Operationalisierung vage — für ein Gericht, das einen Fall entscheiden
    muss, ist das zu wenig. Springer-Fassung offen (CC BY), arXiv-Fassung geprüft.

    '
  letzte_pruefung: 2026-08-27
