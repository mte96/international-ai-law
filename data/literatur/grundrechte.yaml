  kernthese: Das europäische Diskriminierungsrecht ist bewusst kontextabhängig und unbestimmt und lässt
    sich deshalb nicht in eine Fairness-Metrik übersetzen; als Anknüpfungspunkt für die Prima-facie-Feststellung
    eignet sich allein die 'conditional demographic disparity'.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, an dem die europäische Diskussion hängt, und der einzige, der die Übersetzung
    zwischen Rechtsbegriff und Metrik ernsthaft versucht statt sie zu behaupten. Zwei Leistungen: Erstens
    die Analyse der EuGH-Rechtsprechung zur mittelbaren Benachteiligung mit dem Befund, dass der Gerichtshof
    KEINEN Schwellenwert und KEIN statistisches Verfahren vorgibt — anders als das US-Recht mit seiner
    Vier-Fünftel-Regel. Zweitens der Vorschlag der conditional demographic disparity als "Goldstandard",
    der inzwischen in Fairness-Bibliotheken implementiert ist und damit die seltene Umkehrung darstellt:
    eine Rechtswissenschaftlerin definiert eine Metrik, die Informatiker übernehmen. Angreifbar bleibt
    der Kern: Die conditional demographic disparity setzt voraus, dass die "zulässigen" Kontrollvariablen
    feststehen — und genau darüber wird gestritten. Wachter selbst nennt das offen. Freie arXiv-Fassung
    inhaltsgleich.

    '
  letzte_pruefung: 2026-08-27
