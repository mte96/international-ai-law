  kernthese: Die Grundrechte-Folgenabschätzung nach Art. 27 KI-VO ist keine Datenschutz-Folgenabschätzung
    mit erweitertem Prüfprogramm, sondern ein eigenständiges Instrument mit eigener Methodik.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche Arbeit zu Art. 27 und die Grundlage aller kursierenden FRIA-Vorlagen.
    Durch den Omnibus unmittelbar betroffen: Die neue Verschränkung von Grundrechte- und Datenschutz-Folgenabschätzung
    geht in die Gegenrichtung dessen, wofür Mantelero argumentiert — EDRi nennt das eine "prozedurale
    Abkürzung". Wer zu Art. 27 n.F. schreibt, hat hier den dogmatischen Maßstab und zugleich den Beleg
    dafür, dass die Änderung nicht bloß redaktionell ist. Volltext frei über arXiv.

    '
