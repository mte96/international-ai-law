  kernthese: KI-Output ist keine geschützte Rede, weil weder Entwickler noch Nutzer den konkreten Inhalt
    beabsichtigen oder sich zu eigen machen; Regulierung ist deshalb nicht an strict scrutiny, sondern
    an milderen Maßstäben zu messen.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche Gegenposition und der dogmatisch anspruchsvollste Text des Feldes.
    Salibs Zug ist elegant: Er bestreitet nicht die Hörerrechte, sondern zeigt, dass sie hier nicht das
    leisten, was Volokh/Lemley/Henderson verlangen — geschützt ist der Zugang zu ungeschützter Rede, und
    der Zugang lässt sich regulieren, wo die Rede selbst nicht geschützt ist. Damit gewinnt der Gesetzgeber
    Handlungsspielraum für Sicherheitsauflagen, ohne dass die Nutzer rechtlos gestellt würden. Zwei Schwächen:
    Erstens trägt die Intentionalitätsvoraussetzung nicht, sobald Anbieter ihre Systeme durch RLHF und
    Systemprompts sehr wohl auf bestimmte Botschaften hin ausrichten — Salib unterschätzt, wie stark heutige
    Modelle kuratiert sind. Zweitens ist der Text vor Garcia geschrieben und behandelt die Produktspur
    nicht. Trotzdem: Wer nur einen Text zur Frage liest, liest diesen, weil er beide Seiten referiert.
    Freier Volltext bei der Zeitschrift.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - us-const-amend-1
