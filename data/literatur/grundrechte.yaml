- id: 2016-kleinberg-inherent-tradeoffs
  typ: aufsatz
  autoren:
  - Kleinberg, Jon
  - Mullainathan, Sendhil
  - Raghavan, Manish
  titel: Inherent Trade-Offs in the Fair Determination of Risk Scores
  fundstelle: 8th Innovations in Theoretical Computer Science Conference (ITCS 2017), 43:1; arXiv:1609.05807
    (cs.LG), 19.09.2016
  jahr: 2016
  sprache: en
  doi: 10.48550/arXiv.1609.05807
  url: https://arxiv.org/abs/1609.05807
  zugang: open-access
