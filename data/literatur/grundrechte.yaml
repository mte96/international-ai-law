  - Madrid Ramírez, Raúl
  titel: 'Identidad y resurrección digital: Una aproximación jurídico-filosófica'
  titel_deutsch: 'Identität und digitale Auferstehung: eine rechtsphilosophische Annäherung'
  fundstelle: Prudentia Iuris 101 (2026)
  jahr: 2026
  sprache: es
  url: https://erevistas.uca.edu.ar/index.php/PRUDENTIA/es/article/view/5455
  doi: 10.46553/pi.2026.5455
  zugang: open-access
