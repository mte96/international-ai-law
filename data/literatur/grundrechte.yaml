  - Price, Eric
  - Srebro, Nathan
  titel: Equality of Opportunity in Supervised Learning
  fundstelle: Advances in Neural Information Processing Systems 29 (NIPS 2016), 3315; arXiv:1610.02413
    (cs.LG), 07.10.2016
  jahr: 2016
  sprache: en
