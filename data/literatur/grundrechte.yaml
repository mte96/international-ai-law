  eigene_bewertung: 'Die direkte Gegenposition zu Rachut, zwei Wochen früher erschienen, und die beiden
    Texte zusammen sind das beste Beispiel dieser Akte dafür, dass der Verfassungsblog echte Kontroversen
    austrägt statt Meinungen zu sammeln. Elmentaler und Hof setzen an der Lehrfreiheit an und unterscheiden
    zwischen tiefen und peripheren Eingriffen — dieselbe Unterscheidung, die Würtenberger in Ordnung der
    Wissenschaft entwickelt, dort aber zugunsten der Regelungsbefugnis wendet. Wer die Frage bearbeitet,
    hat mit Rachut, Elmentaler/Hof und Würtenberger drei frei zugängliche Positionen und braucht Beck
    dafür nicht. Angreifbar ist der Wirksamkeitseinwand: Symbolpolitik ist kein verfassungsrechtlicher
    Maßstab, und die Geeignetheitsprüfung ist großzügig.

    '
