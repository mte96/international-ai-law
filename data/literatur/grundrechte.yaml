  kernthese: Datengetriebene Auswahlverfahren diskriminieren, ohne dass jemand diskriminieren will, weil
    Zielvariablendefinition, Labelrauschen, Merkmalsauswahl und Stichprobenverzerrung historische Ungleichheit
    reproduzieren; das US-Diskriminierungsrecht erfasst das nur unvollkommen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Gründungsarbeit des gesamten Feldes; wer sie nicht kennt, zitiert unbemerkt ihre
    Taxonomie. Ihr bleibender Wert ist nicht die rechtliche Analyse — die ist auf Title VII vor Inclusive
    Communities zugeschnitten und teilweise überholt —, sondern die fünffache Ursachengliederung, die
    inzwischen Standard ist und sich unverändert auf § 3 Abs. 2 AGG und Art. 2 Abs. 2 lit. b RL 2000/43/EG
    übertragen lässt. Wer die mittelbare Benachteiligung bei KI dogmatisch bearbeiten will, braucht diese
    Gliederung, um überhaupt sagen zu können, WORAN die Benachteiligung anknüpft. Auf SSRN frei, aber
    nicht maschinell abrufbar (429); die Zeitschriftenfassung ist bei der California Law Review offen,
    die dortige Adresse hat sich geändert und war nicht auffindbar.

    '
