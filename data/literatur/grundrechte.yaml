  kernthese: Verzerrung in maschinellem Lernen ist kein Datenfehler, der sich technisch beheben ließe,
    sondern die Abbildung struktureller Ungleichheit; Fairnesskriterien sind deshalb Entscheidungen darüber,
    welche Ungleichheit man in Kauf nimmt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: praktisch jede Vorfrage des Diskriminierungsrechts, die technisches
    Verständnis voraussetzt — und zwar in einer Form, die für Leser ohne Vorbildung geschrieben ist. Das
    beste Lehrbuch des Feldes, vollständig frei, von den drei Autoren, die es geprägt haben, und mit einem
    eigenen Kapitel zum Antidiskriminierungsrecht (Barocas ist Mitverfasser von "Big Data''s Disparate
    Impact", das in 32_lit_haftung.yaml steht). Für den Auftraggeber ist es der wirtschaftlichste Einstieg
    in den gesamten Fairness-Komplex: Kapitel 3 (Klassifikation) und Kapitel 6 (Antidiskriminierungsrecht)
    ersetzen ein Semester. Es ist hier bewusst nicht `pflicht`, weil ein 300-Seiten-Buch kein Pflichttext
    für eine Akte ist, deren Pflichtquote acht Aufsätze umfasst — aber wer Zeit für genau EINEN längeren
    Text hat, sollte diesen nehmen und die Aufsätze von Kleinberg und Chouldechova hinterher lesen. ANGREIFBAR:
    Das Rechtskapitel ist US-zentriert (Title VII, disparate impact); die europäische Struktur — unmittelbare
    und mittelbare Benachteiligung, Rechtfertigung, Beweislast — ist anders und wird nicht behandelt.
    Die Übertragung muss der Leser selbst leisten.

    '
  letzte_pruefung: 2026-08-27
