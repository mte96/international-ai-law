  - dsgvo-schnittstelle
  kernthese: Ein rassistisch entscheidendes Modell lässt sich so einhüllen, dass LIME und SHAP — die beiden
    meistverwendeten Erklärungsverfahren — harmlose Erklärungen ausgeben, ohne dass sich das Entscheidungsverhalten
    ändert.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: welchen Beweiswert eine vom Verpflichteten vorgelegte Erklärung
    hat — die Frage, die sich in jedem Verfahren stellt, in dem ein Anbieter seine Erklärungsausgaben
    als Compliance-Nachweis anbietet. Die Antwort ist: keinen, solange die Erklärung vom Verpflichteten
    selbst erzeugt wurde und die Gegenseite das Modell nicht prüfen kann. Der Angriff funktioniert, weil
    LIME und SHAP das Modell mit synthetischen, aus der Datenverteilung herausfallenden Punkten abfragen;
    das Modell kann diese Prüfabfragen erkennen und sich in ihnen anders verhalten als im Echtbetrieb.
    Das ist der Abgasskandal in algorithmischer Form, und die Parallele trägt bis in die Rechtsfolgen:
    Es geht um eine Prüfstandserkennung. Praktischer Ertrag: (a) Für Art. 13, 14 und 86 KI-VO folgt, dass
    eine Erklärungsausgabe ohne Prüfmöglichkeit am Modell selbst wertlos ist — die Zugangsrechte der Art.
    92 KI-VO und die Offenlegungsanordnung der Produkthaftungsrichtlinie sind deshalb nicht Nebensache,
    sondern Voraussetzung. (b) Für die Beratung folgt, dass ein Anbieter, der die Manipulierbarkeit kennt
    und trotzdem Erklärungen als Nachweis vorlegt, sich einem Vorwurf der arglistigen Täuschung nähert.
    LIME (Ribeiro u.a. 2016) und SHAP (Lundberg/Lee 2017) sind die beiden Verfahren, die in praktisch
    jedem Gutachten auftauchen; wer sie nicht kennt, kennt diesen Angriff nicht. ANGREIFBAR: Der Angriff
    setzt voraus, dass der Angreifer den Erklärungsmechanismus kennt und das Modell entsprechend baut
    — er zeigt Manipulierbarkeit bei Vorsatz, nicht Unzuverlässigkeit im Normalfall. Für die Unzuverlässigkeit
    im Normalfall siehe 2022-bilodeau-impossibility-attribution.

    '
  letzte_pruefung: 2026-08-27
