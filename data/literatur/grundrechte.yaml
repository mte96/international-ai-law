  typ: aufsatz
  autoren:
  - Landa Arroyo, César
  titel: Constitución, Derechos Fundamentales, Inteligencia Artificial y Algoritmos
  titel_deutsch: Verfassung, Grundrechte, künstliche Intelligenz und Algorithmen
  fundstelle: THEMIS Revista de Derecho 79 (2021), 37–50
  jahr: 2021
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/themis/article/view/24863
