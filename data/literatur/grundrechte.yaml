  kernthese: Wer KI-Output vom Schutzbereich ausnimmt, muss maschinelle von menschlicher Äußerung unterscheiden
    können — das leisten Detektoren nicht, sodass der Ausschluss praktisch nur über Identitätsnachweise
    durchsetzbar wäre und damit menschliche Rede belastet.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der beste Einwand gegen Salib und der aktuellste Text des Feldes (August 2026), und
    er ist bemerkenswert, weil er nicht dogmatisch, sondern vollzugspraktisch argumentiert: Eine Schutzbereichsgrenze,
    die sich nur durch Ausweiskontrolle operationalisieren lässt, kostet mehr Freiheit, als sie schützt.
    Das ist unmittelbar auf die europäische Kennzeichnungspflicht des Art. 50 KI-VO übertragbar und der
    stärkste Grund, dort Zurückhaltung zu üben — eine Verbindung, die Branum nicht zieht, weil sie aus
    dem US-Verfassungsrecht schreibt. Sie ist bei CDT tätig; das erklärt die bürgerrechtliche Stoßrichtung
    und ist mitzulesen.

    '
  letzte_pruefung: 2026-08-27
