  kernthese: Die beiden großen Familien formaler Fairnessdefinitionen führen regelmäßig zu Entscheidungsregeln,
    die schlechter sind als eine unbeschränkte Optimierung — die Durchsetzung formaler Fairness kann gerade
    den Gruppen schaden, die sie schützen soll.
