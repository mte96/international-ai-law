  kernthese: Für eine breite Klasse von Endaufgaben — etwa die Frage, ob ein Merkmal die Entscheidung
    getragen hat — sind die verbreiteten Zuschreibungsverfahren wie Integrated Gradients und SHAP beweisbar
    nicht besser als Raten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob die Aussage "Merkmal X war für diese Entscheidung ausschlaggebend"
    mit den üblichen Verfahren überhaupt begründbar ist — die Kernfrage jeder Kausalitätsbehauptung im
    algorithmischen Diskriminierungsprozess und jeder Auskunft nach Art. 15 Abs. 1 lit. h DSGVO. Das dritte
    Unmöglichkeitsergebnis dieser Akte und das am wenigsten rezipierte. Anders als Slack u.a. zeigt es
    keine Manipulierbarkeit bei Vorsatz, sondern eine strukturelle Grenze: Für vollständig verbundene
    neuronale Netze und Aufgaben wie "hätte das Modell bei geändertem Merkmal anders entschieden?" ist
    die Leistung der Zuschreibungsverfahren nachweislich nicht besser als eine Münze. In PNAS veröffentlicht,
    mitverfasst von Been Kim, die selbst führende Erklärbarkeitsforscherin ist — die Kritik kommt aus
    dem Feld, nicht von außen, was ihr im Streit Gewicht gibt. Für die Praxis: Wenn ein Sachverständiger
    SHAP-Werte vorlegt, um zu zeigen, dass das Geschlecht nicht ausschlaggebend war, ist mit dieser Arbeit
    zu erwidern, dass das Verfahren diese Aussage nicht tragen kann. Der Gegenvorschlag der Autoren ist
    juristisch brauchbar: erst die Endaufgabe präzise benennen, dann prüfen, ob wiederholte Modellabfragen
    (also: Gegenprobe mit geänderten Eingaben) die Frage nicht direkter beantworten. Das ist genau die
    Struktur des Vergleichspersonentests im Diskriminierungsrecht. ANGREIFBAR: Die Unmöglichkeit gilt
    für bestimmte Modellklassen und bestimmte Endaufgaben; für andere Zwecke — etwa Modelldebugging —
    können die Verfahren nützlich sein, und die Autoren sagen das. Wer den Text als pauschale Absage an
    Erklärbarkeit zitiert, überdehnt ihn.

    '
  letzte_pruefung: 2026-08-27
