  kernthese: Art. 19 des Zivilpakts schützt den Empfang von Informationen unabhängig von der Quelle und
    liefert damit einen völkerrechtlichen Prüfungsmaßstab für KI-Regulierung, der weder auf einen Sprecher
    noch auf Intentionalität abstellt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige Text, der die Streitfrage aus dem US-Verfassungsrecht herauslöst, und
    deshalb für den europäischen Leser der Schlüssel: Die Intentionalitätsdebatte (Salib, Manheim/Atik)
    ist ein Spezialproblem des Ersten Zusatzartikels; Art. 19 IPbpR und in seinem Gefolge Art. 10 EMRK
    und Art. 11 GRCh schützen die Informationsfreiheit ausdrücklich quellenunabhängig. Wer die Frage für
    Europa beantworten will, kommt damit zu einem anderen Ergebnis als Salib — der Schutzbereich ist eröffnet,
    der Streit verlagert sich auf die Schranke. Diese Verschiebung auszuformulieren, ist die naheliegendste
    Publikationsmöglichkeit des gesamten Feldes; Aswad selbst führt sie nicht durch.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - us-const-amend-1
