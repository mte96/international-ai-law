  kernthese: Art. 84 Abs. 3 Satz 1 Nr. 9 BayHIG-E, der Hochschulen verpflichtet, die Zulässigkeit von
    KI-Hilfsmitteln in Prüfungsordnungen zu regeln, ist verfassungsgemäß, weil die Undurchsetzbarkeit
    von KI-Verboten in unbeaufsichtigten Prüfungen die Chancengleichheit aus Art. 3 Abs. 1 und Art. 12
    Abs. 1 GG verletzt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das Prüfungsrecht ist die erste Rechtsmaterie, in der sich der KI-Einsatz massenhaft
    und gerichtsfest auswirkt, und Bayern hat 2026 die erste ausdrückliche Landesregelung vorgelegt. Rachuts
    Argument ist ungewöhnlich und stark: Nicht das Verbot ist rechtfertigungsbedürftig, sondern der Zustand,
    in dem ein Verbot besteht, aber nicht durchgesetzt werden kann — dieser Zustand verletzt die Chancengleichheit
    derjenigen, die sich daran halten. Das ist auf jede Verbotsnorm übertragbar, deren Verstoß nicht nachweisbar
    ist, und deshalb über das Hochschulrecht hinaus interessant. Angreifbar ist die Verhältnismäßigkeit:
    Die Undurchsetzbarkeit lässt sich auch durch Änderung des Prüfungsformats beheben, was der mildere
    Eingriff wäre. Genau das trägt die Gegenposition vor.

    '
  letzte_pruefung: 2026-08-27
