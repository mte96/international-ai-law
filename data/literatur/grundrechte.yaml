  kernthese: Die KI-Verordnung ergänzt das Gleichbehandlungsrecht in drei Funktionen — Verbot, Risikosteuerung
    und Ermöglichung von Rechtsschutz — und geht namentlich mit Art. 5 Abs. 1 lit. b über den geschlossenen
    Merkmalskatalog hinaus.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die gründlichste Arbeit zum Verhältnis beider Regime und die wichtigste Gegenstimme
    zu der verbreiteten Annahme, die KI-VO leiste für den Diskriminierungsschutz nichts. Der stärkste
    Punkt ist Art. 5 Abs. 1 lit. b: Das Verbot der Ausnutzung von Schutzbedürftigkeit knüpft an Alter,
    Behinderung UND soziale oder wirtschaftliche Lage an und erfasst damit ein Merkmal, das die Gleichbehandlungs­
    richtlinien nicht kennen — kontextabhängige Verletzlichkeit statt fester Kategorie. Das ist die einzige
    substanzielle Erweiterung des unionsrechtlichen Schutzniveaus seit 2008. Der Aufsatz überzeichnet
    allerdings die "enabling function": Die KI-VO gewährt keine Individualansprüche, und Art. 85 (Beschwerderecht)
    ist ein Aufsichtsanstoß, kein Rechtsbehelf. Frei bei CYELP.

    '
