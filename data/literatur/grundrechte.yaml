  - arbeit
  kernthese: Ein Prädiktor ist fair im Sinne gleicher Chancen, wenn seine Fehlerraten in beiden Gruppen
    für die tatsächlich Geeigneten übereinstimmen; jeder bereits gelernte Prädiktor lässt sich nachträglich
    so anpassen, dass er diese Bedingung erfüllt.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was ein Sachverständiger meint, wenn er von "equalized odds"
    oder "gleicher Chance" spricht, und welche Nachbesserung technisch geschuldet sein kann, wenn ein
    System als benachteiligend erkannt ist. Die Definitionsquelle, ohne die die Unmöglichkeitssätze nicht
    lesbar sind — Kleinberg und Chouldechova zeigen, dass man dieses Kriterium nicht mit Kalibrierung
    verbinden kann; man muss also wissen, was es besagt. Der zweite, praktisch wichtigere Beitrag wird
    im Schrifttum fast übersehen: Die Autoren geben ein Verfahren an, jeden vorhandenen Prädiktor NACHTRÄGLICH
    anzupassen, ohne ihn neu zu trainieren. Das ist für die Frage der Zumutbarkeit von Abhilfe erheblich
    — der Einwand, ein Modell lasse sich nicht ohne Neutraining korrigieren, ist seit 2016 widerlegt.
    Die Autoren formulieren dazu ein Argument, das ein Jurist unmittelbar verwenden kann: Ihr Kriterium
    verlagert die Kosten der Fehlklassifikation vom Betroffenen auf den Entscheider und setzt damit Anreize
    zu besserer Datengrundlage — genau die Logik, die hinter der Verteilung der Darlegungslast in § 22
    AGG steht. ANGREIFBAR: Das Kriterium ist "blind" — es betrachtet nur die gemeinsame Verteilung von
    Vorhersage, Ziel und geschütztem Merkmal, nicht die Merkmale selbst. Damit erfasst es Stellvertretermerkmale
    nur, soweit sie sich in den Fehlerraten niederschlagen. Für die mittelbare Benachteiligung ist das
    zu wenig.

    '
  letzte_pruefung: 2026-08-27
