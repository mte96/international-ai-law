  kernthese: Die Lehrfreiheit schützt den wissenschaftlichen Inhalt, nicht die Methodenwahl; tiefe Eingriffe
    wie die Vorgabe wissenschaftlicher Ergebnisse sind unzulässig, periphere Vorgaben zu digitalen Lehrformaten
    dagegen durch den Ausbildungsauftrag und Art. 3 GG gerechtfertigt.
  prioritaet: optional
