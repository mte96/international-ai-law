  kernthese: 'Die Streitfrage, welche Fairness-Metrik die richtige ist, lässt sich nicht statistisch entscheiden,
    sondern nur moralphilosophisch: Kalibrierung und Fehlerratengleichheit drücken verschiedene Vorstellungen
    davon aus, worin das Unrecht der Diskriminierung besteht.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die technische Debatte in die Gleichheitsdogmatik zurückholt, und der
    beste Beleg dafür, dass die Metrikwahl eine Wertungsfrage ist — was für den Juristen die entscheidende
    Erkenntnis ist, weil Wertungsfragen in seine und nicht in die Zuständigkeit des Sachverständigen fallen.
    Hellman ist die maßgebliche Diskriminierungstheoretikerin der USA ("When Is Discrimination Wrong?"),
    und sie zeigt, dass Fehlerratengleichheit ein anti-subordinatives, Kalibrierung ein anti-klassifikatorisches
    Gleichheitsverständnis voraussetzt. Genau diese Unterscheidung strukturiert auch die europäische Debatte
    um formelle und materielle Gleichheit. Der Aufsatz ist über SSRN und die Virginia Law Review frei;
    SSRN war maschinell nicht abrufbar (429), eine geprüfte Ausweichadresse wurde nicht gefunden.

    '
  letzte_pruefung: 2026-08-27
