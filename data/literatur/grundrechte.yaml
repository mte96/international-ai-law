  kernthese: Die Grundrechte-Folgenabschätzung nach Art. 27 KI-VO ist keine Neuerfindung, sondern die
    Fortschreibung der menschenrechtlichen Folgenabschätzung; sie verlangt eine Bewertung der Eingriffsschwere
    anhand von Wahrscheinlichkeit, Reversibilität und Betroffenenzahl.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Referenztext zu Art. 27 und die Grundlage der meisten in Umlauf befindlichen
    Vorlagen. Mantelero war an den Europaratsarbeiten zur HUDERIA beteiligt, was die methodische Kontinuität
    erklärt und zugleich die Schwäche begründet: Der Text behandelt die FRIA als Governance-Instrument,
    nicht als Rechtsnorm. Was passiert, wenn sie unterbleibt oder erkennbar unzureichend ist — ist sie
    drittschützend, begründet ihr Fehlen ein Beweiserleichterung, ist sie im Verfahren verwertbar? —,
    bleibt offen. Das ist die größte Lücke des Kapitels und in der gesamten Literatur unbesetzt. Zu beachten:
    Art. 27 verpflichtet nur öffentliche Stellen und bestimmte private Anbieter (Kreditwürdigkeitsprüfung,
    Lebens- und Krankenversicherung); die Reichweite ist schmaler, als die Diskussion suggeriert. Freie
    arXiv-Fassung.

    '
  letzte_pruefung: 2026-08-27
