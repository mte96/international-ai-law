  zugang: bezahlt
  jurisdiktionen:
  - tw
  themenachsen:
  - sektor-medizin
  - haftung
  kernthese: Setzt ein Arzt ein KI-System ein, muss er den Patienten darueber und ueber die Grenzen des
    Systems aufklaeren; Umfang und Massstab dieser Pflicht ergeben sich aus der bestehenden Aufklaerungsdogmatik,
    bedduerfen aber der Anpassung.
  eigene_bewertung: Wu Jianchang ist Arzt und Jurist an der National Taiwan University, was dem Text zugute
    kommt. Fuer die Achse sektor-medizin die relevanteste taiwanische Arbeit und fuer den deutschen Leser
    unmittelbar anschlussfaehig, weil das taiwanische Arzthaftungsrecht deutschem Vorbild folgt - die
    Aufklaerungspflicht ist dort ebenso ausgebaut wie bei uns nach Paragraf 630e BGB. Die Frage, ob der
    Einsatz eines Entscheidungsunterstuetzungssystems aufklaerungspflichtig ist, wird bei uns kaum diskutiert;
    hier findet man sie durchgearbeitet. Das macht den Aufsatz fuer mich zum ergiebigsten Fund aus Taiwan
    nach den urheberrechtlichen Arbeiten.
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
