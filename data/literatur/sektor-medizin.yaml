  kernthese: Ob der KI-Einsatz aufklärungspflichtig ist, hängt davon ab, ob man ihn als Wissensquelle
    (nicht aufklärungspflichtig) oder als Mitentscheider (aufklärungspflichtig) einordnet; die Antwort
    sollte nach Validierungsgrad und Autonomiegrad des Systems differenzieren.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die beste Aufbereitung der Aufklärungsfrage und für das deutsche Recht unmittelbar
    anschlussfähig: § 630e Abs. 1 BGB verlangt Aufklärung über "sämtliche für die Einwilligung wesentlichen
    Umstände", und die von Cohen/Slottje gestellte Frage — ist die KI ein Werkzeug oder ein zweiter Entscheider?
    — ist genau die Subsumtionsfrage. Der vorgeschlagene abgestufte Maßstab (validiertes System: keine
    Aufklärung; opakes oder autonom entscheidendes System: Aufklärung) ist übertragbar und besser begründet
    als die pauschalen Forderungen der Ethikliteratur. Nicht behandelt wird die europäische Besonderheit,
    dass Art. 86 KI-VO ein Erläuterungsrecht NACH der Entscheidung gewährt, während die Aufklärung VORHER
    geschuldet wird — beides sind verschiedene Institute, die in der Diskussion vermengt werden. Frei
    über NCBI Bookshelf.

    '
  letzte_pruefung: 2026-08-27
