  kernthese: KI in der Gesundheitsversorgung sprengt den suedafrikanischen Rechtsrahmen an drei Stellen
    - der Zulassung von Software als Medizinprodukt, den auf Telemedizin zugeschnittenen HPCSA-Leitlinien
    und der verschuldensabhaengigen Arzthaftung; Donnelly plaedigt fuer Gefaehrdungshaftung mit Pflichtversicherung
    und reformierte Produkthaftung.
  eigene_bewertung: 'Der methodisch sauberste suedafrikanische KI-Aufsatz, den ich gefunden habe, und
    der einzige, der die drei Ebenen Marktzugang, Berufsrecht und Haftung konsequent durchdekliniert statt
    sie zu vermischen. Fuer den Rechtsvergleich ergiebig, weil Suedafrika die Konstellation zeigt, die
    in der EU durch MDR plus KI-VO plus Produkthaftungsrichtlinie abgedeckt wird, aber eben nur teilweise:
    Der Ruf nach Gefaehrdungshaftung mit Pflichtversicherung ist genau die Loesung, die die EU mit der
    zurueckgezogenen KI-Haftungsrichtlinie nicht erreicht hat. Wer zur Frage arbeitet, ob Verschuldenshaftung
    bei lernenden Systemen traegt, bekommt hier ein vollstaendig ausargumentiertes Gegenmodell aus einem
    Common-Law-Mischsystem. Aeltester der hier erfassten Texte und vor dem Generative-KI-Schub geschrieben
    - die Ausfuehrungen zu Autonomie und Unvorhersehbarkeit gelten trotzdem.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
