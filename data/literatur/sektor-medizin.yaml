  titel: 醫師運用醫療人工智慧時之說明義務
  titel_deutsch: Die Aufklaerungspflicht des Arztes beim Einsatz medizinischer kuenstlicher Intelligenz
  fundstelle: 月旦民商法雜誌 (Yuedan Minshangfa Zazhi, Zeitschrift fuer Zivil- und Handelsrecht) 74 (Dezember
    2021), 49-67
  jahr: 2021
  sprache: zh
