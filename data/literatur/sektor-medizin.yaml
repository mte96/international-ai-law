  kernthese: Suedafrika braucht eine eigene KI-Gesundheitspolitik, die Zulassung, Haftung, Datenschutz
    und Zugangsgerechtigkeit zusammenfuehrt, statt die Regelungslast auf die berufsrechtlichen Leitlinien
    der HPCSA abzuwaelzen.
  eigene_bewertung: Kurz, thesenhaft, politiknah - kein dogmatischer Text, aber die Autorengruppe um Thaldar
    (UKZN) ist die einschlaegige in Suedafrika, und der Beitrag wird als Referenz fuer die Politikforderung
    zitiert. Ich fuehre ihn als Ergaenzung zu Donnelly 2022, die dieselbe Frage juristisch durcharbeitet.
    Wer nur einen der beiden liest, nimmt Donnelly.
