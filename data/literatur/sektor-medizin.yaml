  bezug_regelwerke:
  - ki-vo-2024-1689
  - dsgvo-schnittstelle
  - mdr-ivdr-ki-schnittstelle
  kernthese: 'Die Annahme, der Mensch behalte als letzter Entscheider die Kontrolle, ist unrealistisch:
    Wer von der Empfehlung abweicht, trägt das Begründungs- und Haftungsrisiko allein, weshalb das System
    faktisch autonom entscheidet, ohne verantwortlich zu sein.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der beste frei zugängliche deutsche Text zur menschlichen Aufsicht, und er ist vier
    Jahre alt — was zugleich zeigt, wie wenig seither frei nachgekommen ist. Lehners Argument ist die
    Umkehrung des Automatisierungsbias-Arguments: Nicht die Bequemlichkeit führt zum Abnicken, sondern
    die Haftungsasymmetrie. Wer der Empfehlung folgt und irrt, hat den Standard eingehalten; wer abweicht
    und irrt, haftet. Das trifft Art. 14 KI-VO ins Mark und ist auf jede Aufsichtspflicht übertragbar
    — auf § 15 KI-MIG, auf die Grundrechte-Folgenabschätzung nach Art. 27 KI-VO, auf die Verwaltungsentscheidung
    nach dem KIMVG. Angreifbar: Lehner belegt die Haftungsasymmetrie nicht empirisch, und im Arzthaftungsrecht
    ist der Facharztstandard gerade nicht durch Systemempfehlungen definiert. Bezieht sich auf den KI-VO-Entwurf
    von 2021; die Norm ist heute Art. 14, nicht Art. 14 des Vorschlags. Ersetzt Beck nicht, ist dort aber
    auch nicht besser gesagt worden.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-14
  - ki-vo-art-27
