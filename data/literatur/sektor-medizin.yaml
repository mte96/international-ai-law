  titel: 'Transparencia algorítmica y sistema de decisiones automatizadas en salud: El caso del modelo
    de priorización de listas de espera no GES por el Ministerio de Salud'
  titel_deutsch: 'Algorithmische Transparenz und automatisierte Entscheidungssysteme im Gesundheitswesen:
    der Fall des Priorisierungsmodells für Nicht-GES-Wartelisten im Gesundheitsministerium'
  fundstelle: Revista Chilena de Derecho y Tecnología 14 (2025), Artikel 75123
  jahr: 2025
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/75123
  doi: 10.5354/0719-2584.2025.75123
  zugang: open-access
