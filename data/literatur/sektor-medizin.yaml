  titel: Wenn die KI 'A' sagt und die Ärztin 'B'
  fundstelle: Verfassungsblog, 24.11.2022
  jahr: 2022
  sprache: de
  url: https://verfassungsblog.de/ki-sagt-a/
  zugang: open-access
