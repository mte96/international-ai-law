  bezug_urteile:
  - us-2025-lokken-unitedhealth
  - us-2023-kisting-leung-cigna
  kernthese: 'Die Haftung für medizinische KI verteilt sich auf Arzt, Krankenhaus und Entwickler, und
    das geltende Recht setzt die Anreize verkehrt: Der Arzt haftet gerade dann, wenn er von der Standardbehandlung
    abweicht — auch wenn die KI recht hat.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der maßgebliche Text zur Arzthaftung bei KI-Einsatz und der einzige mit einem echten
    Befund statt einer Problemliste: Weil sich die Fahrlässigkeit am ärztlichen Standard misst, ist der
    Arzt geschützt, solange er der Standardbehandlung folgt — und haftet, wenn er der KI folgt und die
    vom Standard abweicht. Damit belohnt das Haftungsrecht die Nichtbefolgung zutreffender KI-Empfehlungen
    und bestraft die Befolgung. Die Autoren nennen das den "perversen Anreiz", und er gilt für § 630a
    Abs. 2 BGB (anerkannter fachlicher Standard) unverändert. Für die europäische Seite fehlt die Auseinandersetzung
    mit der neuen Produkthaftung: Ab 09.12.2026 haftet der Hersteller der Software verschuldens­ unabhängig,
    was die Lastenverteilung zwischen Arzt und Entwickler verschiebt. Freier Volltext über NCBI Bookshelf.

    '
  letzte_pruefung: 2026-08-27
