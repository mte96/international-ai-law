  kernthese: Ärzte haften für KI-gestützte Fehlentscheidungen nach allgemeinem Behandlungsfehlerrecht;
    der sicherste Weg ist, die KI nur zur Bestätigung der ohnehin getroffenen Entscheidung zu nutzen —
    was ihren Nutzen zunichtemacht.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Zwei Seiten, die den Kern des Problems festhalten, und der meistzitierte Text des
    Feldes — die JAMA-Reichweite hat dafür gesorgt, dass diese Analyse in die medizinische Standardliteratur
    eingegangen ist. Für Juristen ist die Kürze der Nachteil: Die Aussage wird behauptet, nicht hergeleitet.
    Wer sie belegt braucht, nimmt den Handbuch­ beitrag von 2024. Aufgenommen, weil man den Text kennen
    muss, um die medizinische Diskussion zu verstehen, in der er als Autorität gilt. Freier Volltext im
    Repositorium der University of Michigan.

    '
  letzte_pruefung: 2026-08-27
- id: 2022-lehner-ki-sagt-a
  typ: blogbeitrag
