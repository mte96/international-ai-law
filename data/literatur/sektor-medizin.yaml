  - cl
  themenachsen:
  - sektor-medizin
  - sektor-oeffentlich
  - grundrechte
  - datenschutz
  kernthese: 'Das vom chilenischen Gesundheitsministerium eingesetzte Priorisierungsmodell für Wartelisten
    ausserhalb des GES-Katalogs ist ein automatisiertes Entscheidungssystem ohne algorithmische Transparenz
    und ohne tragfähige Rechtsgrundlage.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der methodisch beste Text der ganzen Sammlung und für mich der wichtigste chilenische.
    Contreras und Soto behaupten nicht, sie messen: Sie stellen Anträge nach dem chilenischen Informationsfreiheitsgesetz
    (Ley 20.285), werten die Antworten aus und rekonstruieren daraus, was das Ministerium tatsächlich
    einsetzt — mit dem ernüchternden Befund, dass es sich um einen Pilotversuch mit begrenztem Nutzen
    handelte, dessen Bewertung selbst intransparent blieb. Genau diese Arbeit fehlt in Deutschland für
    jedes einzelne behördliche KI-System. Wer wissen will, wie man eine algorithmische Verwaltungspraxis
    mit den Mitteln des Informationszugangsrechts aufklärt, sollte diesen Aufsatz als Vorlage nehmen;
    das Verfahren ist auf § 1 IFG bzw. Art. 15 DSGVO iVm Art. 22 DSGVO übertragbar. Einschränkung: Der
    Befund ist chilenisch und trägt nicht als Rechtsvergleich. Der Wert liegt in der Methode.

    '
  letzte_pruefung: 2026-09-07
