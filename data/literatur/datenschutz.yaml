  typ: aufsatz
  autoren:
  - Wachter, Sandra
  - Mittelstadt, Brent
  - Russell, Chris
  titel: 'Counterfactual Explanations without Opening the Black Box: Automated Decisions and the GDPR'
  fundstelle: Harvard Journal of Law & Technology 31 (2018), 841; arXiv:1711.00399 (cs.AI), 01.11.2017
  jahr: 2017
  sprache: en
  doi: 10.48550/arXiv.1711.00399
