  - ki-vo-2024-1689
  kernthese: 'Eine Erklärung muss das Modell nicht offenlegen, um dem Betroffenen zu nützen: Die Angabe,
    welche kleinste Änderung der Eingabe das gewünschte Ergebnis herbeigeführt hätte, erfüllt Verstehen,
    Anfechtbarkeit und Handlungsanleitung — ohne Geschäftsgeheimnisse preiszugeben.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wie sich der Konflikt zwischen Auskunftsanspruch und Geschäftsgeheimnisschutz
    auflösen lässt, den der EuGH in C-203/22 (Dun & Bradstreet, Februar 2025) dem nationalen Gericht überantwortet
    hat. Der einzige Text dieser Akte, der von Juristen für Juristen geschrieben und zugleich technisch
    umsetzbar ist — die Verfasser sind Oxforder Rechtswissenschaftler, Russell ist Informatiker, und der
    Vorschlag ist implementiert. Der juristische Kunstgriff: Wachter u.a. lösen die Frage "wie viel Modell
    muss offengelegt werden?" auf, indem sie zeigen, dass die drei Zwecke des Auskunftsrechts — verstehen,
    anfechten, künftig anders handeln — sämtlich ohne Modelloffenlegung erreichbar sind. Für die deutsche
    Praxis ist das der praktikabelste Vorschlag zur Ausfüllung des "aussagekräftige Informationen über
    die involvierte Logik" und zugleich der Maßstab, an dem sich SCHUFA-artige Auskünfte messen lassen
    müssen. ANGREIFBAR, und die Kritik ist gewichtig: (a) Eine kontrafaktische Angabe sagt nichts über
    Diskriminierung — sie kann lauten "mit 20.000 Euro mehr Einkommen hätten Sie den Kredit bekommen"
    und dabei verschweigen, dass die Postleitzahl den Ausschlag gab. Barocas, Selbst und Raghavan haben
    das ausgearbeitet. (b) Es gibt in aller Regel viele kontrafaktische Erklärungen, und die Auswahl trifft
    der Verpflichtete — also derselbe, dessen Verhalten geprüft werden soll. Wer den Vorschlag als Erfüllung
    des Art. 15 DSGVO anbietet, muss diese Auswahl regeln. Der Text ist juristisch, nicht technisch, und
    steht hier, weil er die Brücke bildet.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - dsgvo-art-15-abs-1-lit-h
  - dsgvo-art-22
