  - de-dsk-ki-leitlinien
  kernthese: In einem LLM sind keine personenbezogenen Daten gespeichert; die bloße Vorhaltung des Modells
    ist deshalb keine Verarbeitung, und Betroffenenrechte können sich nicht gegen das Modell, sondern
    nur gegen Input und Output des Systems richten.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die schärfste Gegenposition zum EDSA und der Grund, warum die Frage nach dem Personenbezug
    von Modellgewichten überhaupt streitig ist. Hamburg argumentiert technisch: Tokens und Gewichte seien
    mathematische Relationen, keine Informationen über eine bestimmbare Person; wer aus einem Modell etwas
    extrahiert, erzeuge die Information erst. Der Text ist die dogmatisch mutigste Aufsichtsäußerung Europas
    und zugleich die angreifbarste. Drei Einwände: Erstens ist die Prämisse empirisch überholt — Nasr
    u.a. 2023 extrahieren wörtliche Trainingsdaten aus Produktionsmodellen, Lukas u.a. 2023 messen PII-Leakage
    auch unter differentieller Privatheit. Zweitens verwechselt These 1 Speicherung mit Wiederauffindbarkeit;
    die DSGVO knüpft an Information über eine bestimmbare Person, nicht an ein Dateiformat. Drittens führt
    These 3 (Trainingsverstöße infizieren den späteren Betrieb nicht) zu einem Rechtsfolgenloch, das der
    EDSA wenigstens an die Anonymisierung koppelt. Trotzdem Pflicht: Ohne diesen Text versteht man weder
    die deutsche Aufsichtspraxis noch, warum die Frage rechtspolitisch offen ist. Er ist auch der Steinbruch,
    aus dem die Omnibus-Begründung ihre Argumente nimmt.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - dsgvo-art-4-nr-1
