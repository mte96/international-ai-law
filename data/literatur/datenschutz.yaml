  kernthese: Sprachmodelle erschließen aus unauffälligem Text persönliche Merkmale wie Wohnort und Einkommen
    mit bis zu 85 Prozent Treffergenauigkeit, schneller und um Größenordnungen billiger als Menschen —
    die Datenschutzgefahr liegt in der Inferenz, nicht in der Memorisierung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die Debatte an der richtigen Stelle verschiebt. Die gesamte europäische
    Diskussion — EDSA, Hamburg, Omnibus — dreht sich um die Frage, ob Trainingsdaten im Modell stecken.
    Staab u.a. zeigen, dass das für den Grundrechtsschutz zweitrangig ist: Ein Modell, das gar nichts
    memorisiert hat, kann aus drei Sätzen eines Forenbeitrags die Herkunft, das Geschlecht und das Einkommen
    der schreibenden Person erschließen. Damit ist die Anonymitätsfrage entkoppelt vom eigentlichen Risiko,
    und die Kategorie der besonderen Datenarten nach Art. 9 DSGVO wird prekär — was den Digital-Omnibus-Vorschlag,
    den Schutz auf "unmittelbar offenbarende" Daten zu beschränken, besonders angreifbar macht (so Ruschemeier
    2025). Angreifbar ist die Übertragung ins Recht: Die Autoren messen Trefferquoten gegen Reddit-Profile,
    nicht gegen Ground Truth; Falschinferenzen sind datenschutzrechtlich ein anderes Problem (Richtigkeit,
    Art. 5 Abs. 1 lit. d) als Richtiginferenzen. Beides kommt vor, der Text trennt es nicht sauber.

    '
  letzte_pruefung: 2026-08-27
