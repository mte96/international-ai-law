  kernthese: 'Argentinien, Peru, Kolumbien und Ecuador haben keinen Rechtsrahmen für die Datenverarbeitung
    in blockchain-basierten Verträgen; die "lex cryptographica" der Selbstregulierung tritt an die Stelle
    des Rechts.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Einer der wenigen echten Vier-Länder-Vergleiche, die ich gefunden habe, und deshalb
    hier trotz seines engen Gegenstands. Der Kerngedanke — die Unvereinbarkeit von Unveränderlichkeit
    der Blockchain und Löschungsanspruch — ist in Europa längst durchdiskutiert (Art. 17 DSGVO, CNIL-Leitlinien
    2018), und die Autoren bringen dazu nichts Neues. Der Wert liegt in der Kartierung: Man erfährt, welche
    der vier Rechtsordnungen welche Norm hat und welche gar keine. Der Begriff "lex cryptographica" wird
    ohne Quellenangabe zu De Filippi/Wright benutzt, was ich unschön finde. Als Nachschlagewerk für die
    regionale Rechtslage brauchbar, als Beitrag zur Sache nicht.

    '
  letzte_pruefung: 2026-09-07
