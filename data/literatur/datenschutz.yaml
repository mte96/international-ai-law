  kernthese: 'Die DSGVO steht generativen KI-Diensten nicht grundsätzlich entgegen: Das Training an öffentlich
    zugänglichen Daten lässt sich auf Art. 6 Abs. 1 lit. f DSGVO stützen, die Verwendung von Nutzungsdaten
    zum Training dagegen nicht, und der Richtigkeitsgrundsatz ist bei erkennbar unzuverlässigen Systemen
    anders zu handhaben als bei Suchmaschinen.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die deutsche datenschutzrechtliche Position zu generativer KI formuliert
    hat, und die Begründung, die die DSK-Orientierungshilfe schuldig bleibt. Die Unterscheidung zwischen
    Trainingsdaten und Nutzungsdaten trägt bis heute und hat sich in der Aufsichtspraxis durchgesetzt.
    Das schwächste Argument ist das zum Richtigkeitsgrundsatz: Krönke meint, ein System dürfe unrichtig
    sein, wenn es das dazusagt — das wäre eine Disponibilität des Art. 5 Abs. 1 lit. d DSGVO, die der
    Wortlaut nicht hergibt und die nach den Halluzinationsverfahren (noyb gegen OpenAI) auch nicht mehr
    vertretbar ist. Geschrieben zur italienischen ChatGPT-Sperre und insoweit zeitgebunden. Ergänzt Beck;
    für die Frage nach lit. f ist er die frei zugängliche Referenzstelle.

    '
