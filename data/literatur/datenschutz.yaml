- id: 2018-veale-binns-edwards-algorithms-remember
  typ: aufsatz
  autoren:
  - Veale, Michael
  - Binns, Reuben
  - Edwards, Lilian
  titel: 'Algorithms That Remember: Model Inversion Attacks and Data Protection Law'
  fundstelle: Philosophical Transactions of the Royal Society A 376 (2018), 20180083; arXiv:1807.04644
  jahr: 2018
  sprache: en
  doi: 10.1098/rsta.2018.0083
  url: https://arxiv.org/abs/1807.04644
  zugang: open-access
  jurisdiktionen:
  - eu
  themenachsen:
  - datenschutz
  - sicherheit-export
  - governance
  bezug_streitstaende:
  - modellgewichte-kopie
  bezug_regelwerke:
  - dsgvo-schnittstelle
  kernthese: Weil sich aus trainierten Modellen über Modellinversions- und Mitgliedschaftsangriffe Trainingsdaten
    rekonstruieren lassen, sind die Modelle selbst als personenbezogene Daten zu behandeln — mit der Folge,
    dass Auskunfts- und Löschungsrechte an ihnen ansetzen.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Gründungstext der Frage, die der Auftrag zu Recht die dogmatisch spannendste
    nennt, und der einzige, der sie vollständig durchdenkt: Wenn ein Modell personenbezogene Daten enthält,
    kollidiert das Betroffenenrecht unmittelbar mit dem Geschäftsgeheimnis am Modell — Veale, Binns und
    Edwards sagen als Erste, dass diese Kollision zugunsten des Datenschutzes aufzulösen ist und dass
    Modelle deshalb nicht als reines Immaterialgut behandelt werden dürfen. Acht Jahre später ist genau
    das die Streitfrage zwischen EDSA (Opinion 28/2024, im Ergebnis zustimmend, aber mit Anonymitätsvorbehalt)
    und Hamburg (ablehnend). Der Text ist Pflicht, weil beide Seiten ihn zitieren und beide ihn verkürzen:
    Der EDSA übergeht, dass die Autoren die Frage nicht am Extraktionsrisiko, sondern am Informationsgehalt
    festmachen; Hamburg übergeht, dass der Befund empirisch und nicht spekulativ ist. Angreifbar ist die
    Reichweite: Die untersuchten Angriffe stammen aus der Zeit vor den großen Sprachmodellen und betreffen
    kleine, überwachte Modelle mit wenigen Klassen — die Übertragung auf Modelle mit hunderten Milliarden
    Parametern ist plausibel, aber nicht belegt. Diese Lücke schließen Nasr u.a. 2023 und Lukas u.a. 2023.
    Zweiter Anschlusspunkt: Wenn Modelle personenbezogene Daten enthalten, sind sie zugleich Kopien im
    Sinne des Streitstands `modellgewichte-kopie` — dieselbe technische Prämisse trägt zwei völlig verschiedene
    Rechtsfolgen.

    '
  letzte_pruefung: 2026-08-27
