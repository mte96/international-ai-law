  kernthese: Pseudonymisierte Daten bleiben für den Verantwortlichen und für jeden, der über zusätzliche
    Informationen verfügen kann, personenbezogen; die Pseudonymisierung ist Schutzmaßnahme, nicht Bereichsausnahme.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Für die Modellgewichte-Frage ist das der methodisch einschlägigste Text des EDSA,
    obwohl er von KI kaum spricht: Er legt den absoluten beziehungsweise relativ-weiten Maßstab der Identifizierbarkeit
    fest, an dem sich entscheidet, ob ein Modell anonym sein kann. Wer die Leitlinien und Opinion 28/2024
    nebeneinanderlegt, sieht die Systematik: Modellgewichte sind nach EDSA-Logik der Pseudonymisierung
    strukturell näher als der Anonymisierung, weil der Anbieter die Zusatzinformation — den Trainingskorpus
    — regelmäßig noch hat. Genau dieser Maßstab ist es, den der Digital Omnibus mit der empfängerbezogenen
    Fassung des Art. 4 Nr. 1 DSGVO kippen würde; die Leitlinien sind damit unfreiwillig das Referenzdokument
    der Omnibus-Kritik. Angreifbar: Es ist die Konsultationsfassung; die Endfassung ist gegen sie zu prüfen.

    '
