  kernthese: Die tragenden Prinzipien der DSGVO — Zweckbindung, Datenminimierung, Einwilligung, Transparenz
    — sind mit datengetriebener Analyse strukturell unvereinbar, und dieser Konflikt ist im Text der Verordnung
    nicht aufgelöst, sondern verdeckt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Grundsatzkritik, auf die sich die gesamte Deregulierungsargumentation des Digital
    Omnibus letztlich stützt, neun Jahre bevor die Kommission sie aufgriff — und geschrieben von einem
    Autor, der aus der Unvereinbarkeit keine Deregulierungsforderung ableitet, sondern eine Warnung vor
    der Selbsttäuschung des Gesetzgebers. Wer den Omnibus fachlich einordnen will, sollte diesen Text
    vorher lesen, weil er zeigt, dass die Diagnose alt und richtig, die politische Schlussfolgerung aber
    keineswegs zwingend ist. Angreifbar: Zarsky schreibt vor der Rechtsprechung des EuGH zur Zweckvereinbarkeit
    und vor Art. 89 DSGVO in der Auslegung, die er inzwischen erfahren hat; einige seiner Unvereinbarkeitsbehauptungen
    sind entschärft. Gegenposition ist Finck/Biega 2021.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - dsgvo-art-5-abs-1-lit-b
  - dsgvo-art-89
