    nichts Neues. Der eigenständige Punkt ist verfahrensrechtlich: das Fehlen einer Folgenabschätzung.
    Das ist der einzige Einwand, der vor dem EuGH tragen könnte, und er wird in der akademischen Literatur
    bislang kaum verfolgt — dort liegt eine Publikationsmöglichkeit.

