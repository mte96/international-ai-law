  kernthese: Das Auskunftsrecht ist historisch nicht als individueller Informationsanspruch, sondern als
    Instrument kollektiver Kontrolle über Datenverarbeiter entstanden, und dieser Zweck bestimmt seine
    Auslegung.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Aufgenommen als Fundament für Mahieus Omnibus-Kritik (2025-mahieu-ominous-omnibus):
    Wer das Auskunftsrecht als Kontrollinstrument versteht, kann die geplante Zweckbeschränkung auf datenschutzbezogene
    Anliegen nicht für eine Klarstellung halten. Für KI-Modelle ist der Aufsatz mittelbar einschlägig
    — er liefert das Argument, warum ein Auskunftsanspruch gegen ein Modell auch dann Sinn ergibt, wenn
    die Antwort für den Einzelnen wenig bringt.

    '
