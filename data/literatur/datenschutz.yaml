  kernthese: Auch Sprachmodelle, die mit satzweiser differentieller Privatheit trainiert wurden, geben
    noch rund drei Prozent der personenbezogenen Sequenzen preis; Scrubbing und differentielle Privatheit
    schützen weniger, als sie zu schützen versprechen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die für die Rechtsanwendung wichtigste der technischen Arbeiten dieser Akte, weil
    sie genau die Maßnahmen misst, die Aufsichtsbehörden und Anbieter als Anonymisierung anbieten. Der
    Befund ist unbequem für beide Seiten: Er widerlegt die Behauptung, differentielle Privatheit löse
    das Problem, und er zeigt zugleich, dass die Restleckage quantifizierbar ist — also genau das liefert,
    was der EDSA mit "insignifikant" meint, aber nicht beziffert. Wer die Schwelle operationalisieren
    will, hat hier eine Messlatte. Angreifbar ist der Aufbau: feinabgestimmte GPT-2-Modelle auf drei Korpora,
    nicht Vortraining im heutigen Maßstab; die Übertragung auf Frontier-Modelle ist Extrapolation. Die
    Arbeit ist außerdem älter als die inzwischen üblichen Deduplizierungspipelines.

    '
  letzte_pruefung: 2026-08-27
