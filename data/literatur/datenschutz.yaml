  kernthese: Mit der Gleichsetzung von Score und Entscheidung erweitert der EuGH Art. 22 DSGVO von einer
    selten anwendbaren Sondervorschrift zu einem allgemeinen Verbot automatisierter Bewertung mit erheblicher
    Außenwirkung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die knappste und schärfste frei zugängliche Besprechung von C-634/21 und der Ausgangspunkt
    für alles, was danach kommt: Wenn schon die Erstellung eines Werts eine Entscheidung im Sinne des
    Art. 22 DSGVO ist, sobald ein Dritter ihm maßgeblich folgt, dann erfasst die Norm die halbe Modellwirtschaft
    — Bonitäts-, Betrugs-, Risiko- und Empfehlungsscores. Genicot arbeitet heraus, dass der Gerichtshof
    damit die "Umgehungsgefahr" zum tragenden Auslegungsargument macht, und benennt die offene Anschlussfrage:
    Was gilt, wenn zwischen Score und Entscheidung ein Mensch sitzt, der ihn nur abnickt? Angreifbar ist
    die Prognose einer weitreichenden Wirkung: Die Öffnungsklausel des Art. 22 Abs. 2 lit. b DSGVO und
    § 31 BDSG entschärfen den Befund im deutschen Recht erheblich, und der Gerichtshof hat die Mitgliedstaatenkompetenz
    in derselben Entscheidung bestätigt. Anschlusspunkt ist C-203/22 (Dun & Bradstreet Austria, 27.02.2025)
    zur Reichweite der Auskunft über die Logik — dort ist die Literatur noch dünn, was eine Publikationsmöglichkeit
    ist.

    '
