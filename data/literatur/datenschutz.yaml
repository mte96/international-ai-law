  kernthese: Aus produktiv eingesetzten, ausgerichteten Sprachmodellen lassen sich mit einem einfachen
    Divergenzangriff gigabyteweise wörtliche Trainingsdaten extrahieren, mit einer 150-fach erhöhten Ausgaberate
    gegenüber dem regulären Betrieb.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die empirische Widerlegung der Hamburger These 1 und die Studie, auf die sich der
    EDSA bei der Bestimmung des Extraktionsrisikos stützt. Für Juristen ist der wichtigste Befund nicht
    die Datenmenge, sondern dass der Angriff trivial ist — die Wiederholung eines Wortes — und dass er
    gegen ein ausgerichtetes Produktionsmodell funktioniert. Damit fällt das Argument, Extraktion sei
    nur unter Laborbedingungen möglich. Angreifbar ist die Verallgemeinerung in die Gegenrichtung: Die
    Autoren extrahieren einen winzigen Bruchteil des Trainingskorpus, überwiegend häufig wiederholte Passagen;
    für die Frage, ob ein bestimmter Betroffener im Modell "enthalten" ist, taugt der Befund nicht. Wer
    die Anonymitätsfrage mit dieser Studie erschlagen will, überdehnt sie. Der Angriff ist inzwischen
    gepatcht; die Autoren sagen selbst, dass das die zugrundeliegende Memorisierung nicht beseitigt.

    '
  letzte_pruefung: 2026-08-27
