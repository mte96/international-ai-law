  kernthese: Die Neufassung des Personenbezugsbegriffs, die Verengung des Art. 9 DSGVO auf unmittelbar
    offenbarende Daten und die neue KI-Ausnahme legalisieren bestehende rechtswidrige Geschäftsmodelle,
    statt die Rechtsanwendung zu vereinfachen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche akademische Kritik am Datenschutzteil des Omnibus und der Text, der
    die drei Angriffspunkte sortiert, um die künftig gestritten wird. Der stärkste Punkt ist die Verantwortungsdiffusion:
    Wenn Personenbezug empfängerbezogen bestimmt wird, lässt sich die Anwendbarkeit der Verordnung durch
    Aufspaltung der Verarbeitungskette herbeiführen — ein Ergebnis, das der EuGH in Breyer und die EDSA-Leitlinien
    01/2025 gerade verhindern wollten. Der zweite Punkt betrifft diese Akte unmittelbar: Art. 9 DSGVO
    würde Inferenzen aus dem Schutz entlassen, obwohl Staab u.a. 2023 zeigen, dass die Inferenz das eigentliche
    Risiko ist. Angreifbar ist der Ton — "how to kill data protection fast" ist Polemik, und der Text
    unterschätzt, dass ein Teil der Änderungen Rechtsprechung kodifiziert. Wer eine ausgewogenere Fassung
    derselben Kritik sucht, findet sie bei Ruschemeier selbst (Juli 2025).

    '
