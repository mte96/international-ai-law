  kernthese: 'Die Staaten haben den Datenschutz gegenüber generativer KI faktisch der Selbstregulierung
    der Anbieter überlassen; das unterläuft den menschenrechtlichen Schutzauftrag.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Solide, aber nicht originell — eine menschenrechtlich grundierte Bestandsaufnahme,
    wie man sie so ähnlich auch in europäischen Zeitschriften findet. Ich nehme sie auf, weil sie 2024
    erschien, also vor der mexikanischen Verfassungsreform zur organischen Vereinfachung, in deren Vollzug
    2025 das INAI aufgelöst und der Datenschutz in die Exekutive verlagert wurde. Wer den Aufsatz gegen
    die heutige Rechtslage hält, sieht, wie schnell die mexikanische Datenschutzarchitektur weggebrochen
    ist — als Zeitschnitt also brauchbar, als Darstellung des geltenden Rechts nicht mehr.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-deleon-berrocal-datos-colombia
  typ: aufsatz
  autoren:
  - de León Llanos, Alejandro Abraham
  - Berrocal Durán, Juan Carlos
  titel: La protección de datos personales en Colombia y el constitucionalismo transnacional latinoamericano
  titel_deutsch: Der Schutz personenbezogener Daten in Kolumbien und der transnationale lateinamerikanische
    Konstitutionalismus
  fundstelle: Estudios en Derecho a la Información 11 (2026), Nr. 21, Artikel e19768
  jahr: 2026
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-informacion/article/view/19768
  doi: 10.22201/iij.25940082e.2026.21.19768
  zugang: open-access
  jurisdiktionen:
  - co
  - latam
  themenachsen:
  - datenschutz
  - grundrechte
  - governance
  kernthese: 'Der nationalstaatliche Datenschutz Kolumbiens ist gegenüber grenzüberschreitendem Datenverkehr
    überfordert; die Antwort liegt in einem gemeinsamen lateinamerikanischen Schutzrahmen, nicht in der
    Übernahme fremder Modelle.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der Satz, wegen dessen ich den Text aufnehme, steht im Abstract und ist gegen Europa
    gerichtet: "evitar la simple importación de modelos foráneos" — die einfache Einfuhr fremder Modelle
    sei zu vermeiden. Das ist die kolumbianische Gegenposition zum Brüssel-Effekt, und man sollte sie
    kennen, bevor man annimmt, die DSGVO sei in Lateinamerika unumstritten Vorbild. Kolumbien hat mit
    der Ley 1581/2012 und der Habeas-Data-Rechtsprechung des Verfassungsgerichts eine eigene, ältere Tradition,
    die die Autoren gegen die europäische Vereinnahmung verteidigen. Der Aufsatz ist begrifflich unscharf
    ("transnationaler Konstitutionalismus" bleibt Schlagwort) und liefert keine Normanalyse; als Positionsbestimmung
    und als Beleg für die regionale Debattenlage ist er trotzdem brauchbar. Erschienen in einer mexikanischen
    Zeitschrift — auch hier gilt: der Publikationsort sagt nichts über den Gegenstand.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-azuaje-coddou-contreras-viollier-control-humano
  typ: aufsatz
  autoren:
  - Azuaje Pirela, Michelle Carolina
  - Coddou Mc Manus, Alberto
  - Contreras Vásquez, Pablo
  - Viollier Bonvin, Pablo
  titel: Intervención, supervisión y control humano en las decisiones automatizadas
  titel_deutsch: Eingriff, Aufsicht und menschliche Kontrolle bei automatisierten Entscheidungen
  fundstelle: Derecho PUCP 95 (2025), 189–226
  jahr: 2025
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/derechopucp/article/view/30443
  doi: 10.18800/derechopucp.202502.006
  zugang: open-access
  jurisdiktionen:
  - cl
  - eu
  themenachsen:
  - datenschutz
  - arbeit
  - governance
  - grundrechte
  bezug_regelwerke:
  - eu-ki-vo
  kernthese: 'Menschliche Aufsicht wird in drei Regelungsfeldern — Datenschutz, KI-Regulierung, Plattformarbeit
    — mit jeweils unterschiedlichen Begründungen verlangt; diese Begründungen sind nicht deckungsgleich
    und die Umsetzung stösst überall auf dieselben Grenzen.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Für mich der beste Text zur menschlichen Aufsicht, den ich in der spanischsprachigen
    Literatur gefunden habe, und der einzige, der die drei Regelungsfelder nebeneinanderlegt statt eines
    herauszugreifen. Die Konstellation ist im deutschen Recht dieselbe: Art. 22 DSGVO verlangt menschliche
    Beteiligung als Schutz vor der Automatisierung als solcher, Art. 14 KI-VO verlangt sie als Risikominderung,
    und die Plattformarbeitsrichtlinie (EU) 2024/2831 verlangt sie in Art. 10 als Schutz der Arbeitnehmerautonomie.
    Diese drei Begründungen fallen auseinander, und die Autoren zeigen, dass die Rechtsfolgen deshalb
    nicht austauschbar sind — ein Punkt, den die deutsche Literatur zu Art. 14 KI-VO meines Erachtens
    zu wenig beachtet. Vier Autoren, alle chilenisch, alle mit Praxisbezug (Viollier Bonvin kommt von
    Derechos Digitales). Peer reviewed, 38 Seiten, in Derecho PUCP, der angesehensten Rechtszeitschrift
    der Region. Als Pflicht eingestuft wegen der Systematik, nicht wegen des chilenischen Rechts.

    '
  letzte_pruefung: 2026-09-07
