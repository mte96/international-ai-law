  kernthese: Ein Haftungsausschluss ('ChatGPT kann Fehler machen') beseitigt die Rechtsverletzung nicht;
    wer eine Person fälschlich als Kindermörder ausgibt, verletzt Art. 5 Abs. 1 lit. d DSGVO unabhängig
    von jedem Hinweistext.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Zuspitzung des Richtigkeitsarguments auf einen Sachverhalt, der jede Abwägung
    erübrigt, und deshalb der Fall, an dem sich die Aufsichtspraxis entscheiden wird. Rechtlich interessant
    ist die Kombination aus wahren und falschen Elementen — richtige Heimatstadt, richtige Kinderzahl,
    erfundene Verurteilung —, weil sie den Personenbezug zweifelsfrei macht und zugleich zeigt, dass Halluzination
    und Memorisierung ineinandergreifen. Für die deutsche Diskussion ist das der Anschlusspunkt zum Persönlichkeitsrecht:
    § 823 Abs. 1 BGB und die Verdachtsberichterstattungsgrundsätze führen zu Ergebnissen, die der DSGVO-Anspruch
    nicht braucht. Advocacy-Quelle, entsprechend zu lesen.

    '
