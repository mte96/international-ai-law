  kernthese: OpenAI hat personenbezogene Daten ohne taugliche Rechtsgrundlage zu Trainingszwecken verarbeitet,
    eine Datenpanne nicht gemeldet, Transparenzpflichten verletzt und keine Alterssicherung vorgehalten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die erste und bislang schwerste Sanktion einer europäischen Aufsichtsbehörde gegen
    einen Anbieter generativer Modelle und der Ausgangspunkt der italienischen Verfahrensreihe (Replika,
    DeepSeek, Clothoff). Für die Dogmatik ist der interessanteste Teil die Ablehnung des berechtigten
    Interesses für die Trainingsphase — der Garante geht weiter als der EDSA in Opinion 28/2024, die diese
    Rechtsgrundlage grundsätzlich offenhält. WICHTIGE EINSCHRÄNKUNG: Der Auftrag geht von einer Aufhebung
    dieser Verfügung durch das Tribunale di Roma aus. Diese Entscheidung war aus dieser Sitzung nicht
    verifizierbar (s. Kopfnote und `meta.offene_verifikation`); wer den Garante zitiert, muss den Verfahrensstand
    prüfen, bevor er sich auf ihn stützt. Sollte die Aufhebung bestätigt werden, ist sie die wichtigste
    europäische Entscheidung zur Rechtsgrundlage des Trainings und gehört nach 22_eu_de.yaml.

    '
  letzte_pruefung: 2026-08-27
