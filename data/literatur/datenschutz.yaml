  kernthese: Der weite Personenbezugsbegriff macht die DSGVO zum Recht von allem und damit unanwendbar;
    ihre Reichweite muss über eine risikobasierte Abstufung der Pflichten statt über den Anwendungsbereich
    begrenzt werden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der meistzitierte Text zur Frage, wie weit "personenbezogen" reicht, und die theoretische
    Grundlage beider Lager im Modellgewichte-Streit: Wer Modelle für personenbezogen hält, beruft sich
    auf Purtovas Befund; wer es bestreitet, beruft sich auf ihre Warnung vor den Folgen. Für den Digital
    Omnibus ist er unmittelbar einschlägig, weil die dort vorgeschlagene relative Fassung des Art. 4 Nr.
    1 DSGVO genau die Begrenzung versucht, die Purtova für nötig hält — nur am Anwendungsbereich statt
    an den Pflichten, also auf dem Weg, den sie ausdrücklich verwirft. Diese Pointe hat, soweit ersichtlich,
    noch niemand ausgeschrieben. KEINE `url`: Der Aufsatz ist bei Taylor & Francis frei zugänglich, der
    Verlagsserver verweigert aber automatisierte Abrufe; über den DOI erreichbar.

    '
  letzte_pruefung: 2026-08-27
  normen:
