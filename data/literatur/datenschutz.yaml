  kernthese: Der Vorschlag, Auskunftsersuchen auf datenschutzbezogene Zwecke zu beschränken und dem Betroffenen
    eine Spezifizierungslast aufzuerlegen, widerspricht der ausdrücklich zweckneutralen Rechtsprechung
    des EuGH und beseitigt das wirksamste Aufklärungsinstrument des Datenschutzrechts.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der spezialisierte Gegenpart zu Ruschemeier und für diese Akte der wichtigere Text,
    weil das Auskunftsrecht der einzige praktikable Hebel ist, um überhaupt festzustellen, ob eine Person
    in einem Trainingskorpus vorkommt. Wird die Spezifizierungslast eingeführt, läuft der Anspruch gegen
    Modellanbieter faktisch leer — man kann nicht angeben, was man sucht, wenn man nicht weiß, was verarbeitet
    wurde. Mahieu belegt außerdem, dass die Formulierungen aus Lobbypapieren stammen; das ist für die
    Gesetzgebungsgeschichte verwertbar. Angreifbar: Der Missbrauchseinwand — Auskunftsersuchen als Druckmittel
    in Arbeits- und Mietstreitigkeiten — ist real und wird von Mahieu nur abgetan.

    '
  letzte_pruefung: 2026-08-27
