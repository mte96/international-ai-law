  kernthese: Der Grundsatz der Richtigkeit nach Art. 5 Abs. 1 lit. d DSGVO gilt auch für generative Ausgaben,
    und ein Anbieter, der falsche Angaben über eine Person weder berichtigen noch löschen kann, verletzt
    Art. 16 DSGVO.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Beschwerde, die das Betroffenenrechte-Problem aus der Theorie in die Verfahrenspraxis
    geholt hat, und der präziseste Angriffspunkt der gesamten Debatte: Die Unmöglichkeit der Berichtigung
    ist kein Argument gegen den Anspruch, sondern ein Argument gegen die Verarbeitung. Wer auf Anbieterseite
    argumentiert, muss erklären, warum ein Datum, das nicht berichtigt werden kann, überhaupt verarbeitet
    werden darf. noyb ist Partei, und die Pressemitteilung ist Advocacy — sie benennt aber Normen und
    Sachverhalt sauber, und die Verfahren sind anhängig. Wer dagegenhält, wird auf die Hamburger These
    2 zurückgreifen (Betroffenenrechte richten sich gegen Input und Output, nicht gegen das Modell) —
    womit der Anspruch nicht entfällt, sondern sich nur verlagert. Anschlussentscheidung ist der norwegische
    Fall von 2025.

    '
