  kernthese: Der Einsatz KI-gestuetzter Werkzeuge - im Ausgangsfall automatisierte Pruefungsueberwachung
    an der McMaster University - erhebt regelmaessig biometrische Daten ohne wirksame Einwilligung und
    verstoesst damit gegen die Informationsfreiheits- und Datenschutzgesetze Ontarios (FIPPA/MFIPPA).
  eigene_bewertung: 'Praxisnaher Beitrag mit einem konkreten Aufhaenger - der Beschwerde der Information
    and Privacy Commissioner of Ontario gegen McMaster von Februar 2024 wegen Proctoring-Software. Fuer
    mich vor allem als Fallmaterial wertvoll: Proctoring ist in Anhang III Nr. 3 lit. c KI-VO als Hochrisikoanwendung
    erfasst, und hier sieht man, wie derselbe Sachverhalt in einer Rechtsordnung ohne KI-Gesetz allein
    ueber Datenschutzrecht abgearbeitet wird - mit dem Ergebnis, dass die Einwilligung zur zentralen und
    zugleich schwaechsten Stelle wird. Der Beitrag ist eher Praxishinweis als Wissenschaft; der Abschnitt
    "best practices" liest sich wie eine Kanzleimemo. Trotzdem brauchbar.'
  prioritaet: wichtig
  lesestatus: ungelesen
