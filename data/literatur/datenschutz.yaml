  kernthese: Ein KI-Modell ist nur dann anonym, wenn die Wahrscheinlichkeit sowohl der Extraktion personenbezogener
    Trainingsdaten als auch ihrer Preisgabe über Abfragen 'insignifikant' ist; das ist von der Aufsichtsbehörde
    einzelfallbezogen zu prüfen, nicht zu vermuten.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, ohne den man in diesem Teilgebiet nicht mitreden kann — jede europäische
    Aufsichtsbehörde, jeder Compliance-Vermerk und jede Gegenschrift setzt hier an. Drei Punkte tragen:
    erstens die Absage an eine pauschale Anonymitätsvermutung für Modelle (Rn. 30 ff.), zweitens der dreistufige
    Prüfaufbau zum berechtigten Interesse mit den "vernünftigen Erwartungen" als Schwerpunkt, drittens
    die differenzierte Antwort auf die Frage, ob rechtswidriges Training die spätere Nutzung infiziert
    — sie tut es grundsätzlich nicht, wenn das Modell anonymisiert wurde. Angreifbar ist genau die Mitte:
    Der EDSA definiert "insignifikant" nicht operationalisierbar und schiebt die Beweislast dem Verantwortlichen
    zu, ohne einen Maßstab zu nennen, den ein Gericht nachrechnen könnte. Wer die Gegenposition sucht,
    findet sie im Hamburger Diskussionspapier (2024-hmbbfdi-llm-personenbezug); wer die technische Grundlage
    sucht, bei Nasr u.a. 2023 und Lukas u.a. 2023. Die Stellungnahme ist überdies das Dokument, gegen
    das der Digital Omnibus argumentiert: Die dort vorgeschlagene relative Fassung des Personenbezugsbegriffs
    würde ihr die Grundlage entziehen.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - dsgvo-art-6-abs-1-lit-f
  - dsgvo-art-4-nr-1
