  kernthese: Die DSGVO ist auf KI-Entwicklung anwendbar, aber praktikabel handhabbar, wenn Zweck, Rolle
    und Rechtsgrundlage vorab bestimmt und Datenschutz in die Systemarchitektur und die Datenerhebung
    eingebaut werden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die CNIL ist die einzige große europäische Aufsichtsbehörde, die statt eines Grundsatzpapiers
    eine fortlaufende Handreichungsreihe pflegt, und sie ist deutlich innovationsfreundlicher als der
    EDSA. Für die rechtsvergleichende Arbeit ist das der Kontrapunkt zu Hamburg auf der anderen Seite:
    Hamburg bestreitet den Anwendungsbereich, die CNIL bejaht ihn und macht ihn beherrschbar. Praktisch
    wertvoll sind Blatt 2 (Zweckbestimmung bei Allzweckmodellen — die CNIL lässt eine abstrakte Zweckbeschreibung
    genügen, was mit Art. 5 Abs. 1 lit. b DSGVO in Spannung steht) und Blatt 4 (Rechtsgrundlage). Schwäche:
    Die Blätter sind Verwaltungspraxis ohne Bindungswirkung, und die englische Fassung hinkt der französischen
    nach. Wer die französische Position zitiert, sollte gegen die Originalfassung prüfen.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - dsgvo-art-5-abs-1-lit-b
  - dsgvo-art-6
- id: 2021-finck-biega-zweckbindung-datenminimierung
  typ: aufsatz
  autoren:
  - Finck, Michèle
  - Biega, Asia J.
  titel: Reviving Purpose Limitation and Data Minimisation in Data-Driven Systems
  fundstelle: Technology and Regulation 2021, 44–61
  jahr: 2021
  sprache: en
  url: https://techreg.org/article/view/10986
  zugang: open-access
  jurisdiktionen:
  - eu
  themenachsen:
  - datenschutz
  - governance
  bezug_regelwerke:
  - dsgvo-schnittstelle
  kernthese: 'Zweckbindung und Datenminimierung sind beim maschinellen Lernen nicht undurchführbar, sondern
    unterreguliert: Empirisch kommen Systeme mit deutlich weniger Daten aus, als sie verarbeiten, weshalb
    der Grundsatz technisch operationalisierbar wäre.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der beste verfügbare Text zu der Frage, die in der deutschen Debatte meist mit einem
    Achselzucken abgetan wird ("beim Training geht das nicht"). Finck und Biega zeigen mit Experimenten
    aus dem Empfehlungssystembereich, dass Leistungseinbussen bei drastischer Datenreduktion oft gering
    sind — das verschiebt die Argumentationslast: Nicht der Datenschutz muss beweisen, dass weniger geht,
    sondern der Verantwortliche, dass mehr nötig ist. Für die Erforderlichkeitsprüfung nach Art. 6 Abs.
    1 lit. f DSGVO und für die Verhältnismäßigkeit im Rahmen von Opinion 28/2024 ist das die zentrale
    empirische Referenz. Angreifbar ist die Übertragbarkeit: Die Befunde stammen aus Personalisierungssystemen,
    nicht aus dem Vortraining großer Sprachmodelle, wo Skalengesetze gerade die Datenmenge belohnen. Diese
    Übertragung nehmen die Autorinnen selbst nicht vor; sie ist die offene Anschlussfrage.

    '
  letzte_pruefung: 2026-08-27
