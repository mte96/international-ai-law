  kernthese: Datenbereinigung und differentielle Privatheit können den Schutz der Privatheit bei Sprachmodellen
    grundsätzlich nicht leisten, weil sie kontextuelle Integrität nicht abbilden; zulässig sei nur Training
    auf Text, der ausdrücklich zur Veröffentlichung erzeugt wurde.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der konzeptionell radikalste Text dieser Akte und die eigentliche Herausforderung
    an das europäische Datenschutzrecht: Nicht die Rechtsgrundlage sei falsch gewählt, sondern die Kategorie
    — Privatheit in Sprache sei kontextabhängig und deshalb weder durch Anonymisierung noch durch Einwilligung
    erfassbar. Wer Nissenbaums kontextuelle Integrität als Maßstab akzeptiert, kommt zu dem Ergebnis,
    dass der weitaus größte Teil des heutigen Trainingskorpus unzulässig ist; das ist eine Position, die
    in Europa niemand vertritt und die deshalb die produktivste Provokation liefert. Für die Praxis ist
    der Vorschlag unbrauchbar — ein Korpus aus ausdrücklich zur Veröffentlichung bestimmten Texten gibt
    es nicht, und die Autoren sagen nicht, wer das feststellt. Als Maßstab für die Abwägung nach Art.
    6 Abs. 1 lit. f DSGVO und für die "vernünftigen Erwartungen" der EDSA-Leitlinien 03/2026 ist er dagegen
    unmittelbar brauchbar und deutlich präziser als alles, was die Aufsichtspraxis anbietet.

    '
  letzte_pruefung: 2026-08-27
