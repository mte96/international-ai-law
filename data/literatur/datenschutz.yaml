  kernthese: Solange Suedafrika kein KI-Gesetz hat, ist der Protection of Personal Information Act 4 of
    2013 das faktische KI-Regulierungsinstrument; seine Vorschriften zu automatisierten Einzelfallentscheidungen
    und zur Zweckbindung leisten das aber nur unvollstaendig.
  eigene_bewertung: 'Das suedafrikanische Gegenstueck zu der Frage, die bei uns vor Geltung der KI-VO
    die ganze Debatte trug: Wie weit traegt Art. 22 DSGVO als KI-Regulierung? Section 71 POPIA ist Art.
    22 DSGVO nachgebildet, aber enger gefasst, und die Autorinnen zeigen die Bruchstellen - Profiling
    ohne Entscheidungswirkung, Trainingsdatenverarbeitung, Sekundaernutzung. Fuer den Rechtsvergleich
    der Datenschutz-Achse das nuetzlichste suedafrikanische Stueck, zumal frei verfuegbar (Pretoria University
    Law Press). Schwaeche: Die Information Regulator hatte 2024 noch kaum Praxis, der Text ist deshalb
    norm- und nicht anwendungsbezogen.'
