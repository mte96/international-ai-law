  kernthese: Die DSGVO behandelt Schlussfolgerungen als Daten zweiter Klasse und schützt die Eingabedaten
    statt der Bewertung; nötig wäre ein Recht auf vertretbare Schlussfolgerungen mit Begründungspflicht
    für risikoreiche Inferenzen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die Lücke benennt, die generative Modelle heute zur Hauptbaustelle
    machen: Nicht das Trainingsdatum ist das Problem, sondern die aus ihm erzeugte Aussage über eine Person.
    Wachter und Mittelstadt haben das 2019 an Scoring und Profiling entwickelt; Staab u.a. 2023 zeigen
    empirisch, dass Sprachmodelle genau das mit hoher Genauigkeit und zu vernachlässigbaren Kosten tun.
    Die Verbindung beider Texte ist die stärkste verfügbare Begründung dafür, dass die Halluzinationsbeschwerden
    von noyb keine Randfrage sind, sondern das Zentrum. Angreifbar ist der Vorschlag selbst: Ein "Recht
    auf vertretbare Schlussfolgerungen" braucht einen Vertretbarkeitsmassstab, den die Autoren den Gerichten
    überlassen; die deutsche Diskussion um § 31 BDSG zeigt, wohin das führt. Nach SCHUFA (C-634/21) ist
    der Aufsatz teilweise überholt und teilweise bestätigt — die Auseinandersetzung damit fehlt und wäre
    eine Publikationsmöglichkeit.

    '
  letzte_pruefung: 2026-08-27
