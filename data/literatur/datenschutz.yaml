  - Sánchez Silveyra, Romina M.
  - Rodrigo, Juan Manuel
  - Ravelo-Franco, Gabriel
  titel: La protección de datos a partir de la implementación de IA en smart contracts
  titel_deutsch: Datenschutz beim Einsatz künstlicher Intelligenz in Smart Contracts
  fundstelle: Estudios en Derecho a la Información 11 (2026), Nr. 21, Artikel e20059
  jahr: 2026
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-informacion/article/view/20059
