  titel: Una investigación empírica de la cultura de protección de datos personales y la actuación de
    las autoridades nacionales en Latinoamérica
  titel_deutsch: Eine empirische Untersuchung der Datenschutzkultur und des Handelns der nationalen Aufsichtsbehörden
    in Lateinamerika
  fundstelle: Revista Chilena de Derecho y Tecnología 14 (2025), Artikel 73836
  jahr: 2025
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/73836
