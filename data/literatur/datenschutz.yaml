  kernthese: 'Maschinelles Verlernen leistet nicht, was Gesetzgeber und Aufsicht sich davon versprechen:
    Es kann Wissen im Modell nicht zuverlässig entfernen und taugt deshalb weder als Erfüllung des Löschungsanspruchs
    noch als Sicherheitsmaßnahme.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der wichtigste Dämpfer für die bequemste Antwort auf das Betroffenenrechte-Problem.
    Die Vorstellung, ein Modell könne einzelne Personen "vergessen", trägt einen erheblichen Teil der
    Compliance-Literatur und taucht auch in Aufsichtsäußerungen auf; die Autoren — darunter mehrere, die
    selbst Unlearning-Verfahren entwickelt haben — zeigen, dass Zielsetzung und technische Leistungsfähigkeit
    systematisch auseinanderfallen: Verlernte Inhalte lassen sich rekonstruieren, das Verlernen beschädigt
    benachbartes Wissen, und es gibt keine überprüfbare Erfolgsdefinition. Für die Praxis heißt das: Wer
    den Löschungsanspruch aus Art. 17 DSGVO mit Unlearning erfüllen will, verspricht mehr, als er halten
    kann; das Retraining bleibt die einzige belastbare Erfüllung, und dessen Unzumutbarkeit ist dann offen
    darzulegen statt zu verdecken. Angreifbar ist die Reichweite der Aussage: Der Text ist kein Beweis
    der Unmöglichkeit, sondern eine Bestandsaufnahme der Verfahren von 2024; Fortschritte sind nicht ausgeschlossen.
    Gegenstück und Ausgangspunkt ist Liu u.a. 2024.

    '
  letzte_pruefung: 2026-08-27
