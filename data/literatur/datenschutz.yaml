  kernthese: Die deutschen Aufsichtsbehörden ordnen den KI-Einsatz entlang der drei Phasen Konzeption,
    Implementierung und Nutzung und verlangen dabei geschlossene Systeme statt Cloud-Lösungen, dokumentierte
    Rechtsgrundlagen, Folgenabschätzung und eine menschliche Kontrolle, die über die Ergebnisdurchsicht
    hinausgeht.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige Text dieser Akte, der in Deutschland unmittelbar handlungsleitend ist:
    Wer einen KI-Einsatz datenschutzrechtlich begleitet, wird an dieser Orientierungshilfe gemessen, weil
    die Aufsichtsbehörde nach ihr prüft. Das macht sie wichtiger als jeden Aufsatz, unabhängig von ihrer
    wissenschaftlichen Qualität — und die ist mittelmäßig: Die Orientierungshilfe ordnet, ohne zu begründen;
    sie sagt, was zu tun ist, nicht warum; und sie umgeht die eigentlich streitige Frage, ob und unter
    welchen Voraussetzungen Art. 6 Abs. 1 lit. f DSGVO das Training an öffentlich zugänglichen Daten trägt.
    Die Empfehlung, geschlossene Systeme zu bevorzugen, ist praktisch kaum umsetzbar und wird von der
    Praxis ignoriert. Wer die Begründung sucht, findet sie bei Krönke (2023) und in den EDSA-Stellungnahmen.
    Zu ergänzen um die beiden Nachfolgedokumente zu technischen Maßnahmen (Juni 2025) und zu RAG (Oktober
    2025). Ersetzt Beck vollständig: Diese drei Dokumente sind die deutsche Datenschutzpraxis für KI,
    und sie sind frei.

    '
