  - br
  themenachsen:
  - datenschutz
  - governance
  kernthese: 'Die lateinamerikanischen Datenschutzbehörden unterscheiden sich in Ausstattung, Unabhängigkeit
    und Durchsetzungspraxis so stark, dass von einer gemeinsamen Datenschutzkultur nicht gesprochen werden
    kann.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Zwölf Autorinnen und Autoren aus Brasília und Braga, ein empirisch-vergleichender
    Zuschnitt und die Frage nach der tatsächlichen Behördenpraxis statt der Gesetzeslage — das ist genau
    die Untersuchung, die man braucht, wenn man wissen will, was ein Angemessenheitsbeschluss nach Art.
    45 DSGVO für ein lateinamerikanisches Land bedeuten würde. Argentinien und Uruguay haben einen, Brasilien
    nicht, und diese Arbeit erklärt warum. HINWEIS ZUR PRÜFUNG: Titel, Autorschaft, Fundstelle und DOI
    habe ich am 07.09.2026 auf der Zeitschriftenseite verifiziert; die Abstract-Anzeige der Landing-Page
    lieferte beim Abruf einen offensichtlich fremden Text (über chilenische Desinformationsgesetzentwürfe).
    Die hier formulierte Kernthese ist deshalb aus Titel und Anlage erschlossen, nicht aus dem gelesenen
    Abstract — vor Zitat den Volltext prüfen.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-calderon-marenco-smart-contracts-datos
  typ: aufsatz
  autoren:
