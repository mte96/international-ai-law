  kernthese: RAG-Architekturen entschärfen einzelne Datenschutzrisiken, weil Berichtigung und Löschung
    in Referenzdokumenten und Vektordatenbank durchsetzbar sind, lösen aber weder die Rechtmäßigkeit des
    Modelltrainings noch die Zweckbindung zwischen externer Quelle und eingebettetem Modellwissen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das aktuellste und praktisch wichtigste der drei DSK-Dokumente, weil RAG die Architektur
    ist, mit der Unternehmen und Behörden generative KI tatsächlich einsetzen. Der entscheidende Satz
    ist die Zweckbindungsaussage: Die Betroffenenrechte lassen sich in der Vektordatenbank durchsetzen,
    im Modell nicht — daraus folgt, dass die Rechtmäßigkeit des Trainings eine eigenständige, ungelöste
    Frage bleibt, die RAG nur verdeckt. Wer einem Mandanten RAG als datenschutzfreundliche Lösung verkauft,
    muss diese Einschränkung kennen. Ersetzt insoweit die Beck-Literatur; die Aufsicht prüft danach.

    '
