  kernthese: Scraping öffentlich zugänglicher personenbezogener Daten ist nicht per se verboten, sondern
    über Art. 6 Abs. 1 lit. f DSGVO rechtfertigungsfähig; entscheidend sind die vernünftigen Erwartungen
    der Betroffenen sowie Datenminimierungsmassnahmen vor und nach der Erhebung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die aktuellste unionsrechtliche Positionsbestimmung zum Trainingsdatenerwerb und
    der Text, an dem sich die Praxis ab sofort ausrichtet. Wichtig ist die Verschiebung gegenüber Opinion
    28/2024: Der EDSA arbeitet die Abwägung nicht mehr abstrakt, sondern über Plattformkontext und Anti-Scraping-Vorkehrungen
    — wer auf einer Plattform veröffentlicht, die Dritten das Auslesen ausdrücklich ankündigt, kann mit
    einer Trainingsnutzung rechnen. Das ist eine erhebliche Entlastung der Anbieter und wird von der Zivilgesellschaft
    entsprechend kritisiert. Die zweite Neuerung ist die Ausweitung der GC-u.a.-Rechtsprechung (C-136/17)
    auf inzidentell erfasste besondere Kategorien: Sie greift nur, soweit der Verantwortliche im Rahmen
    seiner Möglichkeiten Maßnahmen trifft — eine Formel, die Filterpflichten begründet, aber ihren Umfang
    offenlässt. Angreifbar ist die Transparenzlösung: Die Befreiung von der Einzelbenachrichtigung nach
    Art. 14 Abs. 5 lit. b DSGVO wird großzügig gehandhabt, obwohl gerade sie das Betroffenenrechte-Problem
    erzeugt, das Kapitel III dieser Akte behandelt.

    '
  letzte_pruefung: 2026-08-27
  normen:
