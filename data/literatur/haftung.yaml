  kernthese: Nicht jeder Schaden durch einen Algorithmus rechtfertigt eine Sonderbehandlung; entscheidend
    sei, ob das System die Merkmale aufweist, die der herkoemmlichen Zurechnung den Boden entziehen -
    Autonomie, Lernfaehigkeit, Undurchsichtigkeit und Unvorhersehbarkeit.
  eigene_bewertung: Die knappste und klarste Fassung ihres Ansatzes. Der Beitrag ist deshalb nuetzlich,
    weil er die in der deutschen Diskussion oft pauschale Rede vom Haftungsproblem bei KI in pruefbare
    Merkmale zerlegt und damit erlaubt zu sagen, welche Systeme wirklich neue Fragen aufwerfen und welche
    nicht. Das ist genau die Unterscheidung, die die zurueckgezogene KI-Haftungsrichtlinie mit ihrer Beweislastvermutung
    nicht getroffen hat. Aus einem Handbuch, also referierend - wer die Argumentation im Detail will,
    nimmt die Aufsaetze.
