  kernthese: Die herrschende Forderung nach Gefährdungshaftung für KI übersieht, dass Haftpflichtdeckung
    die bereits bestehende Erstversicherung der Geschädigten dupliziert; die Gesamtkosten der Schadensdeckung
    steigen dadurch so stark, dass der Sicherheitsgewinn aufgezehrt wird.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die substanziellste Gegenposition im gesamten Feld und der Grund, warum sie hier
    Pflichtlektüre ist: Geistfeld ist Berichterstatter des ALI-Projekts "Civil Liability for Artificial
    Intelligence", also nicht Außenseiter, sondern die Instanz, die das US-Deliktsrecht für KI formulieren
    wird — und er argumentiert gegen die Haftungsverschärfung, ohne die Opazitätsprobleme zu bestreiten.
    Das Argument ist versicherungsökonomisch und damit prüfbar, nicht ideologisch. Zwei Angriffspunkte:
    Erstens setzt es voraus, dass Erstversicherung (Kranken-, Sach-, Berufsunfähigkeits-) den Schaden
    tatsächlich deckt — bei reinen Vermögensschäden und bei Diskriminierungsschäden ist das falsch, und
    genau dort liegen die KI-typischen Fälle. Zweitens ignoriert es die Präventionswirkung fast vollständig.
    Für Europa ist der Text besonders interessant, weil die Sozialversicherung hier deutlich mehr abdeckt
    als in den USA — Geistfelds Argument müsste also STÄRKER greifen. Diese Rechnung hat niemand aufgemacht.
    Freier Volltext im UConn-Repositorium.

    '
