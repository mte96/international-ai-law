  kernthese: Von vier Optionen ist die schlichte Rücknahme der AILD die schlechteste, weil sie Fragmentierung
    und Pfadabhängigkeiten in 27 Deliktsrechten erzeugt; vorzugswürdig ist eine Gefährdungshaftung für
    Hochrisiko-KI-Systeme.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Das Dokument, an dem sich die gesamte Debatte über die Rücknahme ausrichtet, und
    der einzige Text, der die Optionen systematisch durchspielt statt zu lamentieren. Bertolini leitet
    EURA und war schon an den Vorarbeiten zur AILD beteiligt; die Studie ist Auftragsarbeit des JURI-Ausschusses,
    also nicht neutral, aber offen parteiisch und dadurch brauchbar. Ihre Schwachstelle ist die vierte
    Option: Gefährdungshaftung wird ökonomisch begründet (Risikointernalisierung, Skalierbarkeit), ohne
    dass die Versicherungsseite durchgerechnet wird — genau die Lücke, die Geistfeld 2026 aufreißt. Wer
    beide Texte nebeneinanderlegt, hat den Kern des Streits. Nach dieser Studie ist keine Nachfolgeinitiative
    angekündigt worden; Stand 01.09.2026 ist sie damit ein Vorschlag ins Leere, aber der maßgebliche.

    '
