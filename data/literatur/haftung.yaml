- id: 2023-kalai-vempala-must-hallucinate
  typ: aufsatz
  autoren:
  - Kalai, Adam Tauman
  - Vempala, Santosh S.
  titel: Calibrated Language Models Must Hallucinate
  fundstelle: 56th Annual ACM Symposium on Theory of Computing (STOC 2024), 160; arXiv:2311.14648 (cs.CL),
    24.11.2023
  jahr: 2023
  sprache: en
  doi: 10.48550/arXiv.2311.14648
  url: https://arxiv.org/abs/2311.14648
  zugang: open-access
  jurisdiktionen:
  - us
  - eu
  - de
  themenachsen:
  - haftung
  - berufsrecht
  - gpai
  - content
  bezug_streitstaende:
  - chatbot-output-speech
  bezug_regelwerke:
  - produkthaftungsrichtlinie-2024-2853
  - ki-vo-2024-1689
  kernthese: Für Tatsachen, die im Trainingsmaterial nur einmal vorkommen, hat ein kalibriertes Sprachmodell
    eine untere Schranke für die Rate erfundener Aussagen, die sich nach der Good-Turing-Schätzung bemisst
    — Halluzination ist insoweit statistisch erzwungen, nicht behebbar.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob ein Sprachmodell, das falsche Tatsachen ausgibt, deshalb fehlerhaft
    im Sinne des § 3 ProdHaftG beziehungsweise des Art. 7 der Produkthaftungsrichtlinie 2024/2853 ist
    — und ob die Sicherheitserwartung, die der Verkehr berechtigterweise hegen darf, "keine erfundenen
    Angaben" umfassen kann. Der Beweis liefert das stärkste verfügbare Argument gegen einen Fehlerbegriff,
    der an Richtigkeit anknüpft: Ein kalibriertes Modell — also eines, dessen Wahrscheinlichkeitsangaben
    den tatsächlichen Häufigkeiten entsprechen — MUSS bei einmalig belegten Tatsachen mit einer bezifferbaren
    Mindestrate erfinden. Wer das abstellen will, muss die Kalibrierung aufgeben, und ein unkalibriertes
    Modell ist an anderer Stelle schlechter. Für die Haftungsdogmatik heißt das, dass die Sicherheitserwartung
    nicht auf Richtigkeit gerichtet sein kann, sondern nur auf Warnung, Kennzeichnung und Prüfbarkeit
    — also auf Instruktion statt auf Konstruktion. Das ist zugleich der Grund, weshalb die Berufspflichten
    beim KI-Einsatz (Prüfpflicht des Anwalts) nicht durch besseren Einkauf ersetzbar sind. ANGREIFBAR,
    und die Autoren sagen es selbst: Die Schranke gilt für "willkürliche" Tatsachen mit einmaligem Vorkommen.
    Für häufig belegte Angaben — Rechtsprechungszitate, Fundstellen, Rechenoperationen — besteht KEINE
    statistische Notwendigkeit; dort ist Halluzination sehr wohl behebbar und ihr Fortbestehen vorwerfbar.
    Genau diese Unterscheidung fehlt in der juristischen Diskussion, die Halluzination pauschal für unvermeidbar
    oder pauschal für vermeidbar hält. Beides ist falsch. Der Beweis ist formal; Einleitung und Ergebnisdarstellung
    genügen.

    '
  letzte_pruefung: 2026-08-27
