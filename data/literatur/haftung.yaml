  kernthese: 'Die Rücknahme vereinfacht nicht, sondern verkompliziert: An die Stelle eines harmonisierten
    Verfahrens treten 27 nationale Haftungsregime, was europäische KMU stärker belastet als nichteuropäische
    Großanbieter und damit dem Wettbewerbsfähigkeitsziel zuwiderläuft.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das beste Gegenargument zur Vereinfachungsrhetorik, weil es auf deren eigenem Terrain
    spielt: nicht Grundrechtsschutz gegen Wettbewerbsfähigkeit, sondern Wettbewerbsfähigkeit gegen Wettbewerbsfähigkeit.
    Wer den Digital-Omnibus-Streit aus 31_lit_eu.yaml kennt, erkennt hier dieselbe Struktur wie bei Raposo
    ("vertane Gelegenheit"). Schwäche: Die Fragmentierungsthese ist plausibel, aber nicht empirisch belegt
    — Nannini zeigt nicht, dass die Mitgliedstaaten tatsächlich divergierende KI-Haftungsregeln erlassen.
    Stand 01.09.2026 hat kein Mitgliedstaat ein KI-spezifisches Haftungsgesetz; die Divergenz ist bislang
    eine Prognose. Als Konferenzbeitrag knapp, aber sauber belegt und frei zugänglich.

    '
