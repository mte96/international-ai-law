  kernthese: Ein Sprachmodell wird handlungsfähig, indem es abwechselnd Überlegungen und Werkzeugaufrufe
    erzeugt und die Rückmeldungen der Außenwelt in den nächsten Schritt aufnimmt — der Handlungsplan entsteht
    dabei erst zur Laufzeit.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was ein "KI-Agent" technisch ist — die Vorfrage jeder Zurechnungsdiskussion,
    die derzeit überwiegend ohne Kenntnis des Gegenstands geführt wird. Der Text steht hier als Definitionsquelle,
    nicht wegen seines Inhalts. Zwei Beobachtungen sind juristisch unmittelbar erheblich. ERSTENS gibt
    es keinen "Agenten" als Artefakt: Es gibt ein Modell, eine Schleife und eine Menge von Werkzeugen,
    und die Schleife wird typischerweise von einem anderen Akteur gebaut als das Modell. Die Zurechnungsfrage
    ist damit von vornherein mehrpersonal — Modellanbieter, Schleifenbetreiber, Werkzeuganbieter, Einsetzender
    —, und die KI-VO erfasst diese Kette über Art. 25 nur unvollständig. ZWEITENS entsteht der Handlungsplan
    erst zur Laufzeit und ist vorher niemandem bekannt. Das ist der technische Kern des Problems, das
    das Deliktsrecht als Vorhersehbarkeit behandelt: Nicht die Handlung ist unvorhersehbar, sondern die
    HandlungsFOLGE aus einer im Voraus festgelegten Schleife. Wer diese Unterscheidung führt, kommt bei
    der Verkehrspflichtendogmatik weiter als mit der Frage nach "Autonomie". ANGREIFBAR: technischer Aufsatz
    von 2022, inzwischen überholt; heutige Systeme arbeiten anders. Als Begriffsquelle bleibt er brauchbar,
    als Beschreibung des Stands der Technik nicht. Kurz und lesbar.

    '
