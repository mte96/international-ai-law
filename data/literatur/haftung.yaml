- id: 2020-chesterman-grenzen-rechtspersoenlichkeit
  typ: aufsatz
  autoren:
  - Chesterman, Simon
  titel: Artificial Intelligence and the Limits of Legal Personality
  fundstelle: International and Comparative Law Quarterly 69 (2020), Heft 4, 819-844
  jahr: 2020
  sprache: en
  doi: 10.1017/s0020589320000366
  zugang: bezahlt
  jurisdiktionen:
  - sg
  - intl
  themenachsen:
  - haftung
  - governance
  kernthese: Rechtspersoenlichkeit fuer KI-Systeme loest kein bestehendes Problem und schafft zwei neue
    - die Haftungsabschirmung der Hintermaenner und die Entwertung des Personenbegriffs; die praktischen
    Zwecke, die sie erfuellen soll, lassen sich mit vorhandenen Rechtsfiguren erreichen.
  eigene_bewertung: Der Aufsatz, den man zitiert, wenn jemand die elektronische Person wiederbelebt. Chesterman
    unterscheidet sauber zwischen den drei Funktionen, die Rechtspersoenlichkeit erfuellen koennte - Haftungssubjekt,
    Rechtsinhaber, Handlungssubjekt - und zeigt fuer jede, dass Stellvertretung, Gesellschaftsrecht und
    Gefaehrdungshaftung dasselbe leisten. Fuer die deutsche Diskussion um die Teilrechtsfaehigkeit und
    die Rechtsnatur autonomer Systeme ist das die international massgebliche Fundstelle. Ich halte die
    Argumentation fuer durchschlagend; der einzige Punkt, an dem ich zoegere, ist die Behandlung von Systemen,
    die selbst Vermoegen halten - dazu sagt er wenig.
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
