  kernthese: 'Gefährdungshaftung für KI-Entwickler ist ein Bastiat-Fehler: Der sichtbare Schaden eines
    Chatbot-Outputs wird verrechnet, der unsichtbare Nutzen für Millionen anderer Nutzer nicht, und Gerichte
    können ihn auch nicht ermitteln.'
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Ausdrücklich als Gegenposition aufgenommen und ausdrücklich als die schwächere der
    beiden Gegenpositionen. McGinnis argumentiert ordnungspolitisch (Startups gegen Konzerne, Selbstversicherung
    der Großen) und trifft damit einen realen Punkt — Haftungsverschärfung konzentriert Märkte —, geht
    aber der eigentlichen Frage aus dem Weg: Wenn der Geschädigte die Fahrlässigkeit nicht beweisen kann,
    ist die Verschuldenshaftung, die er empfiehlt, keine Haftung. Wer eine substanzielle Gegenposition
    sucht, liest Geistfeld; wer die politische Rhetorik der US-Debatte belegen will, liest McGinnis. Kurz,
    meinungsstark, unbelegt.

    '
