  kernthese: 'Erklärbarkeit ist nicht nur ethische Anforderung, sondern haftungsrechtlich relevant: sie
    entscheidet darüber, ob dem Geschädigten der Beweis des Pflichtverstosses überhaupt gelingen kann,
    und sollte deshalb in die Haftungstatbestände selbst eingebaut werden.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der wichtigste haftungsrechtliche Text aus Chile und derjenige, der einem deutschen
    Zivilrechtler am meisten gibt. Parra Sepúlveda und Concha Machuca machen etwas, das die europäische
    Debatte nach dem Rückzug der KI-Haftungsrichtlinie im Februar 2025 offen liegen liess: Sie behandeln
    Erklärbarkeit nicht als Compliance- Pflicht des Anbieters, sondern als Voraussetzung der Beweisführung,
    und leiten daraus ab, dass die Beweislast dort liegen muss, wo die Erklärbarkeit hergestellt werden
    kann. Das ist funktional die Argumentation, mit der Art. 3 und 4 des zurückgezogenen Richtlinienvorschlags
    begründet wurden — nur dogmatisch sauberer und ohne den Rückgriff auf eine gesetzliche Vermutung.
    Schwach: die chilenische Anbindung. Der Text arbeitet fast ausschliesslich mit EU-Material und sagt
    wenig darüber, wie Art. 2314 ff. Código Civil chileno damit umgehen. Wer eine Gegenposition zur Aufgabe
    der KI-Haftungsrichtlinie sucht, findet sie hier.

    '
  letzte_pruefung: 2026-09-07
