  kernthese: Aus über 1.600 annotierten Ausführungsprotokollen über sieben Rahmenwerke ergibt sich eine
    Taxonomie von 14 Fehlermodi in drei Gruppen — Entwurfsfehler des Systems, Fehlabstimmung zwischen
    den Agenten und mangelhafte Aufgabenprüfung.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was bei einem Agentensystem der "Fehler" im Sinne des Produkthaftungsrechts
    ist — die Frage, an der die Anwendung der Produkthaftungsrichtlinie 2024/2853 auf Agentensysteme steht
    und fällt. Der einzige Text dieser Akte, der Fehlverhalten agentischer Systeme systematisch klassifiziert
    statt zu illustrieren, und dadurch für die Fehlerdogmatik unmittelbar brauchbar. Die Dreiteilung entspricht
    erstaunlich genau der produkthaftungsrechtlichen Unterscheidung: Entwurfsfehler des Systems entsprechen
    dem Konstruktionsfehler, mangelhafte Aufgabenprüfung dem Instruktions- und Überwachungsfehler. Die
    mittlere Gruppe — Fehlabstimmung zwischen den Agenten — hat dagegen KEIN Gegenstück im Produkthaftungsrecht,
    weil sie einen Fehler bezeichnet, der in keinem einzelnen Bestandteil liegt, sondern in ihrem Zusammenwirken.
    Genau dort liegt die Lücke, die nach Rücknahme der KI-Haftungsrichtlinie offen geblieben ist, und
    dieser Text benennt sie erstmals empirisch statt spekulativ. Wer über die Anwendbarkeit des § 3 ProdHaftG
    auf zusammengesetzte Systeme schreibt, hat hier das Material. ANGREIFBAR: Preprint, Fehlerzuordnung
    durch menschliche Annotation mit erheblichem Beurteilungsspielraum, Auswahl der sieben Rahmenwerke
    nicht begründet. Die Taxonomie ist eine Beobachtung, keine Theorie.

    '
  letzte_pruefung: 2026-08-27
