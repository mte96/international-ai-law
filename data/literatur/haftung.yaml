  kernthese: Chatbots sollten produkthaftungsrechtlich behandelt werden, weil damit die Redefreiheitsfrage
    umgangen und der Anbieter an seinen Konstruktions- und Warnentscheidungen gemessen wird.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Zwei Jahre vor Garcia formuliert, was das Gericht dann tatsächlich getan hat — und
    deshalb der prognostisch beste Text des Feldes. Die Pointe liegt im Verhältnis zu Kapitel I und II
    dieser Liste: Die amerikanische Produktspur bei Chatbots und die europäische Erstreckung der Produkthaftung
    auf Software (PLD 2024/2853) sind dieselbe Bewegung, aus entgegengesetzten Richtungen. In den USA
    flieht man in die Produkthaftung, um dem Ersten Zusatzartikel auszuweichen; in Europa erweitert man
    sie, um die Beweisnot zu lindern. Niemand hat diese Konvergenz beschrieben. Angreifbar ist die Prämisse,
    dass Software überhaupt "Produkt" im Sinne des Restatement (Third) ist — genau der Punkt, den die
    Character-Verfahren offen gelassen haben.

    '
