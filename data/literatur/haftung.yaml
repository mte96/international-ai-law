  kernthese: KI-Verordnung und Produkthaftungsrichtlinie bilden ein zweistufiges System aus präventiver
    Marktzugangskontrolle und nachgelagerter Kompensation, dessen Fugen dort liegen, wo die Verordnung
    Pflichten kennt, die kein Produktmerkmal betreffen.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Kommentarbeitrag, deshalb systematisch statt originell — aber die Fugenstelle ist
    richtig benannt: Pflichten zur Datenqualität (Art. 10 KI-VO) oder zur menschlichen Aufsicht (Art.
    14 KI-VO) beschreiben Verfahren, nicht Eigenschaften des Produkts; ob ihre Verletzung "Fehlerhaftigkeit"
    im Sinne des Art. 7 PLD begründet, ist damit offen. Ergänzt Ebers (2026) um die Gegenrichtung. Nur
    im Verlagsband.

    '
