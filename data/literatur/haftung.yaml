  - produkthaftungsrichtlinie-2024-2853
  kernthese: Sichtbarkeit von Agentensystemen lässt sich über drei Maßnahmen herstellen — Agentenkennungen,
    laufende Überwachung und Tätigkeitsprotokolle —, die sich in Eingriffstiefe und Aussagekraft unterscheiden
    und jeweils eigene Datenschutzfolgen haben.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wie Zurechnung bei Agentensystemen praktisch funktionieren kann
    — die Frage, an der jede Haftungsdogmatik scheitert, solange nicht feststellbar ist, WELCHES System
    im Auftrag WESSEN gehandelt hat. Der wichtigste Text des Agentenblocks für die Rechtspraxis, weil
    er die drei Instrumente auseinanderhält, die im juristischen Schrifttum unter "Transparenz" zusammenfallen.
    Die AGENTENKENNUNG ist die juristisch interessanteste: Sie würde jeder Interaktion eine dem System
    und seinem Betreiber zurechenbare Marke geben und damit das Zurechnungsproblem in ein Identifikationsproblem
    verwandeln — strukturell dasselbe, was das Handelsregister für die juristische Person leistet. Für
    die deutsche Diskussion um eine Registrierung autonomer Systeme ist das die technische Grundlage,
    die bislang fehlt. Die PROTOKOLLIERUNG schließt unmittelbar an Art. 12 und 19 KI-VO an und liefert
    die Antwort auf die Frage, was ein Protokoll enthalten muss, damit die Offenlegungsanordnung nach
    Art. 9 der Produkthaftungsrichtlinie 2024/2853 etwas hergibt. Die Verfasser behandeln die datenschutzrechtliche
    Kehrseite ausdrücklich — Sichtbarkeit von Agenten heißt Sichtbarkeit ihrer Nutzer —, was den Text
    von regulierungsfreundlicher Literatur abhebt. ANGREIFBAR: Vorschlag ohne Umsetzung; die technischen
    Voraussetzungen (durchgängige Kennungen über Anbietergrenzen hinweg) sind 2026 nicht gegeben, und
    die Fortsetzung der Verfasser (Infrastructure for AI Agents, TMLR 2025, arXiv:2501.10114) räumt das
    ein.

    '
  letzte_pruefung: 2026-08-27
