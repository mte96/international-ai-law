  kernthese: Halluzinationen sind ein unvermeidbares technisches Artefakt und deshalb kein Indiz für Fahrlässigkeit
    oder Vorsatz; statt Ehrschutzhaftung sollten die Anbieter gesetzlich normierte Sorgfaltspflichten
    treffen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Fortschreibung der Volokh-Debatte auf den Stand der Technik von 2025 — und eine
    Kehrtwende: Wo Volokh (2023) die Haftung über die Kenntnis nach Beschwerde konstruiert, halten Lidsky/Daves
    den Ehrschutz für den falschen Weg, weil Halluzinationen systemimmanent und damit nicht vorwerfbar
    sind; sie plädieren für gesetzliche Sorgfaltspflichten statt Deliktshaftung. Das ist die regulatorische
    statt der deliktischen Antwort und strukturell dieselbe Bewegung wie in Europa, wo die KI-VO Pflichten
    setzt und die Haftung dem nationalen Recht überlässt — nur dass Lidsky/Daves die Pflichten als ERSATZ
    der Haftung denken, während die europäische Diskussion sie als deren Grundlage begreift (vgl. Ebers
    2026). Diese Gegenüberstellung ist der Ertrag des Textes für den europäischen Leser. Lidsky ist Dekanin
    in Florida und in der US-Ehrschutzdogmatik erstrangig; angreifbar ist die Unvermeidbarkeitsprämisse:
    Unvermeidbar ist, DASS halluziniert wird, nicht, dass über eine bestimmte Person halluziniert wird.

    '
