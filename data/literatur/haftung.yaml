  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Keine Literatur im engeren Sinn, sondern die Stelle, an der in den USA das Recht
    gemacht wird, das Gerichte in zehn Jahren zitieren werden — Restatements und Principles des ALI haben
    in der US-Deliktsrechtspraxis eine Wirkung, für die es in Europa keine Entsprechung gibt. Wer die
    transatlantische Divergenz einschätzen will, muss diese Seite beobachten, nicht die Gesetzgebung:
    Während die EU ihre Haftungsrichtlinie zurückzieht, entsteht in den USA das Gegenteil einer Deregulierung,
    nämlich eine Kodifizierung durch die Rechtswissenschaft. Die Seite ist ein laufendes Verzeichnis;
    der Stand ist bei jeder Zitierung neu zu prüfen.

    '
