  kernthese: Die neue Produkthaftungsrichtlinie ermöglicht Folgeklagen nach dem Vorbild des Kartellrechts,
    weil ein Verstoß gegen die Pflichten der KI-Verordnung als Fehlerhaftigkeitsindiz wirkt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die These, auf die es ankommt, und zugleich die folgenreichste: Wenn die Nichteinhaltung
    der KI-VO über Art. 7 Abs. 2 lit. f PLD ("einschlägige Produktsicherheitsanforderungen") in die Fehlerhaftigkeitsprüfung
    durchschlägt, wird die KI-VO zivilrechtlich durchsetzbar, obwohl sie selbst keine Individualansprüche
    gewährt. Das ist die eigentliche Antwort auf die Frage, was die AILD-Lücke füllt — und sie ist dogmatisch
    heikel, weil das Kartellrecht mit Art. 101, 102 AEUV eine unmittelbar anwendbare Verbotsnorm hat,
    die KI-VO aber nicht. Ebers ist einer der wenigen, die beide Materien beherrschen (vgl. seine Arbeiten
    in 31_lit_eu.yaml). Nur im Verlagsband, kein freier Volltext gefunden.

    '
