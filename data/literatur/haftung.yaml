  kernthese: Auch ohne AILD zwingt der unionsrechtliche Effektivitätsgrundsatz die nationalen Gerichte
    über Crehan, Manfredi und Sanofi Pasteur zu Beweiserleichterungen, die im Ergebnis den zurückgezogenen
    Vermutungen nahekommen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der dogmatisch interessanteste Kurztext zur Rücknahme und die einzige Position, die
    die Lücke systematisch kleinredet — nicht politisch, sondern methodisch. Die Kette Effektivitätsgrundsatz
    → res ipsa loquitur → faktische Vermutung ist der praktisch gangbarste Weg für einen Kläger im Jahr
    2026 und für die deutsche Praxis unmittelbar anschlussfähig (§ 286 ZPO, Anscheinsbeweis, Beweisvereitelung).
    Angreifbar an zwei Stellen: Sanofi Pasteur (C-621/15) betraf ein harmonisiertes Regime, hier fehlt
    gerade die Harmonisierung; und die Übertragung kartellrechtlicher Effektivitätsjudikatur auf allgemeines
    Deliktsrecht ist ein Sprung, den die Autorin behauptet statt begründet. Blogbeitrag einer Doktorandin,
    also kein Autoritätsargument — aber der Gedanke trägt.

    '
  letzte_pruefung: 2026-08-27
