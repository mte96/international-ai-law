  kernthese: 'Chile hat keine KI-spezifische Haftungsnorm; der einzige brauchbare Anknüpfungspunkt ist
    das Regime der Produkthaftung für fehlerhafte Erzeugnisse, das aber an Beweis- und Zurechnungsfragen
    scheitert.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Die nützliche Ergänzung zu Parra/Concha: wo jene das Prinzip diskutieren, kartieren
    diese drei Autoren das geltende chilenische Recht und zeigen, an welchen Stellen es reisst. Für einen
    deutschen Leser ist der Text vor allem als Kontrastfall interessant, weil Chile die Produkthaftungsrichtlinie
    nie umgesetzt hat und stattdessen mit einer verbraucherschutzrechtlichen Konstruktion (Ley 19.496)
    arbeitet — man sieht also, wie eine Rechtsordnung ohne verschuldensunabhängige Produkthaftung mit
    Softwareschäden umgeht. Genau das ist die Frage, die sich in der EU erst mit der neuen Produkthaftungsrichtlinie
    (EU) 2024/2853 und ihrer Einbeziehung von Software erledigt hat. Handwerklich solide, theoretisch
    anspruchslos.

    '
  letzte_pruefung: 2026-09-07
