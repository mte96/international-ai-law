  kernthese: Beide Haftungsvorschläge von 2022 bleiben auf halbem Weg stehen, weil Offenlegungsanordnung
    und eng zugeschnittene Vermutungen bei opaken Systemen leerlaufen; nötig wäre ein integrierter Rahmen
    aus Haftung, Erklärbarkeit und Fairness.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der meistzitierte akademische Text zur AILD und der Grund, warum "half-hearted" zum
    Schlagwort geworden ist. Wichtig ist die Richtung der Kritik: Hacker hält die Richtlinie für zu SCHWACH,
    nicht für zu scharf — wer die Rücknahme als Sieg der Deregulierung liest, hat den Ausgangspunkt der
    Debatte verkehrt. Der Text ist zugleich die Brücke zu Kapitel VII dieser Liste, weil Hacker Haftung
    und algorithmische Fairness als ein Problem behandelt (vgl. Zehlike/Hacker u.a. 2025). Angreifbar
    ist der Anhang mit den ausformulierten Änderungsvorschlägen: Er ist an einem Richtlinientext geschrieben,
    den es seit Oktober 2025 nicht mehr gibt, und deshalb nur noch historisch zu lesen. Die Analyse der
    Vermutungswirkungen bleibt gültig und ist auf Art. 10 PLD 2024/2853 übertragbar — diese Übertragung
    nimmt Hacker selbst nicht vor. Freie arXiv-Fassung (v6, Juli 2023) inhaltsgleich mit der CLSR-Fassung.

    '
  letzte_pruefung: 2026-08-27
