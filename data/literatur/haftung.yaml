  kernthese: Die Forderung nach menschlicher Aufsicht ueber algorithmische Entscheidungen laeuft leer,
    weil die aus der Automatisierungsforschung bekannten Effekte - Automatisierungsverzerrung, Aufmerksamkeitsverlust,
    Verantwortungsdiffusion - den Aufseher systematisch entwerten.
  eigene_bewertung: 'Fuer mich der wichtigste Text zur menschlichen Aufsicht ueberhaupt, und er stammt
    aus Neuseeland. Art. 14 KI-VO ordnet menschliche Aufsicht an, ohne die empirische Frage zu stellen,
    ob Menschen diese Aufsicht leisten koennen; Zerilli und Kollegen zeigen mit Belegen aus der Luftfahrt
    und der Medizin, dass sie es regelmaessig nicht koennen. Wer begruenden will, warum der "human in
    the loop" allein keine Rechtfertigung fuer den Einsatz eines Hochrisikosystems ist, findet hier die
    Belege. Ich halte den Aufsatz fuer die staerkste verfuegbare Kritik an der zentralen Schutzvorkehrung
    des europaeischen Modells. Einschraenkung: Die Autoren ziehen daraus keine Rechtsfolge, sondern belassen
    es beim Befund.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
