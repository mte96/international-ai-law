  kernthese: Die klassischen Haftungstatbestände für gefährliche Rede — Anstiftung, Drohung, Falschangabe
    — greifen bei Sprachmodellen überwiegend nicht, weil sie auf Vorsatz oder Adressatenbezug zugeschnitten
    sind, die das Modell nicht hat.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige Text der Gründungsdebatte, der technisch geerdet ist — Hashimoto ist
    Informatiker, und die Autoren führen tatsächlich Modelle vor, statt über sie zu spekulieren. Die Befundlage
    ist ernüchternd und für die Chatbot-Suizidfälle unmittelbar einschlägig: Wo Vorsatz oder ein bestimmter
    Adressat verlangt wird, versagt die Haftung; wo nur Fahrlässigkeit verlangt wird (Produkthaftung,
    Verkehrspflichten), greift sie. Das erklärt, warum die Klägerseite in Garcia und Raine den Produktweg
    gewählt hat und nicht den Redeweg — eine strategische Weichenstellung, die die Literatur selten als
    solche benennt.

