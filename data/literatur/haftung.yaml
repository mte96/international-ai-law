  kernthese: Die Erstreckung der Produkthaftung auf Software zwingt die Produkthaftpflichtversicherung
    zu neuen Deckungskonzepten, weil Software-Serienschäden anders korreliert sind als Sachschäden.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Aufgenommen als einer der wenigen europäischen Texte, die die Versicherungsseite
    überhaupt behandeln — der Punkt, an dem die europäische Debatte gegenüber der amerikanischen (Geistfeld,
    Lior) zurückliegt. Heiß ist Versicherungsrechtler, kein KI-Spezialist; entsprechend dünn ist die technische
    Seite. Der brauchbare Gedanke ist die Korrelation: Ein Softwarefehler tritt bei allen Instanzen gleichzeitig
    auf, was das versicherungstechnische Ausgleichsprinzip (Gesetz der großen Zahl) unterläuft. Das ist
    der versicherungsmathematische Kern des Versicherbarkeitsproblems und in der Haftungsliteratur kaum
    präsent.

    '
