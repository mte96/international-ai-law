  kernthese: 'Eine Fahrlässigkeitshaftung für KI-Rede scheitert weniger am Ersten Zusatzartikel als an
    der Verkehrspflicht: Sprecher schulden dem allgemeinen Publikum traditionell keine Sorgfalt, wohl
    aber Dienstleister ihren Kunden.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text liefert die Unterscheidung, an der die Chatbot-Suizidfälle rechtlich hängen
    und die in der öffentlichen Diskussion regelmäßig verschwimmt: nicht Redeinhalt gegen Redefreiheit,
    sondern Publikum gegen Vertragsverhältnis. Ein Companion-Chatbot ist gerade kein Massenmedium; das
    Verhältnis ist individualisiert, fortlaufend und vom Anbieter gestaltet. Damit steht die Verkehrspflicht
    auf demselben Grund wie bei Beratern und Verwahrern. Für das deutsche Recht ist das die Brücke zu
    § 241 Abs. 2 BGB und zu den Schutzpflichten aus dem Nutzungsvertrag — ein Weg, der die Redefreiheitsfrage
    ebenfalls umgeht und in der deutschen Literatur nicht beschritten wird.

    '
