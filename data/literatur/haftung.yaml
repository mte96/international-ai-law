- id: 2021-chagal-feferkorn-reasonable-algorithm
  typ: aufsatz
  autoren:
  - Chagal-Feferkorn, Karni
  titel: How Can I Tell if My Algorithm Was Reasonable?
  fundstelle: Michigan Technology Law Review 27 (2021), Heft 2, 213
  jahr: 2021
  sprache: en
  doi: 10.36645/mtlr.27.2.how
  zugang: open-access
  jurisdiktionen:
  - il
  - us
  themenachsen:
  - haftung
  kernthese: Der Sorgfaltsmassstab des vernuenftigen Menschen laesst sich auf autonome Systeme nicht schlicht
    uebertragen; Chagal-Feferkorn entwickelt Kriterien, an denen sich messen laesst, ob das Verhalten
    eines Algorithmus im haftungsrechtlichen Sinn vertretbar war.
  eigene_bewertung: 'Karni Chagal-Feferkorn ist die israelische Autorin, an der man beim Thema Haftung
    fuer autonome Systeme nicht vorbeikommt; sie hat die Figur des "reasonable algorithm" gepraegt und
    ueber mehrere Arbeiten durchgefuehrt. Fuer mich ist der Text deshalb wichtig, weil er die Frage stellt,
    die das deutsche Deliktsrecht bei Paragraf 276 Abs. 2 BGB umgeht: Wenn der Verkehr keine Erwartung
    an das System hat, weil es neu ist, woraus speist sich dann die im Verkehr erforderliche Sorgfalt?
    Ihr Vorschlag - Vergleich mit dem menschlichen Entscheider in derselben Rolle, nicht mit dem idealen
    System - ist praktikabel und wird in der US-Diskussion breit aufgenommen. Frei verfuegbar ueber die
    Michigan Technology Law Review. Der israelische Bezug ist mittelbar (Autorin, Perspektive), der Text
    selbst argumentiert im US-Deliktsrecht.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
