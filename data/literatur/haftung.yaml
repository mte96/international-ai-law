  kernthese: Handlungsmächtigkeit ist keine Eigenschaft, die ein System hat oder nicht hat, sondern eine
    Größe mit vier Dimensionen — Unterbestimmtheit des Ziels, Unmittelbarkeit der Wirkung, Zielgerichtetheit
    und langfristige Planung —; die Anerkennung von Handlungsmacht der Maschine verschiebt die Verantwortung
    des Menschen nicht.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wie sich "Autonomie" als Tatbestandsmerkmal operationalisieren
    lässt — Art. 3 Nr. 1 KI-VO definiert KI-Systeme über "unterschiedliche Grade von Autonomie", ohne
    zu sagen, woran man den Grad misst. Die vier Dimensionen liefern genau das, was der Norm fehlt, und
    sie sind einzeln subsumierbar: Wie eng ist das Ziel vorgegeben? Wirkt das System unmittelbar auf die
    Welt oder schlägt es einem Menschen etwas vor? Verfolgt es ein Ziel über Zwischenschritte? Plant es
    über die Einzelhandlung hinaus? Für Art. 14 KI-VO (menschliche Aufsicht) ist die zweite Dimension
    die entscheidende, und sie wird in der Kommentierung nicht gesondert behandelt. Der zweite Satz des
    Textes ist der juristisch wichtigere und wird in der Debatte über elektronische Personen regelmäßig
    übergangen: Die Zuschreibung von Handlungsmacht an das System "entlastet oder verschiebt die menschliche
    Verantwortung nicht" — die Verfasser sagen das ausdrücklich, und sie sind Informatiker, was dem Satz
    im Streit über eine eigene Rechtspersönlichkeit Gewicht gibt. ANGREIFBAR: eine Taxonomie ohne Messvorschrift;
    die vier Dimensionen sind einleuchtend, aber nicht quantifiziert, und der Text ist vor der agentischen
    Praxis von 2024/25 geschrieben.

    '
  letzte_pruefung: 2026-08-27
