  kernthese: Die Erstreckung des Produktbegriffs auf Software löst die KI-spezifischen Probleme nicht,
    weil der Fehlerbegriff auf einen Zustand im Zeitpunkt des Inverkehrbringens zugeschnitten ist, lernende
    Systeme ihren Zustand aber danach ändern.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der sauberste dogmatische Einwand gegen die Grundannahme der Richtlinie, und er ist
    nicht durch Art. 11 Abs. 2 PLD (Herstellerkontrolle über nachträgliche Änderungen) erledigt: Die Norm
    regelt, WANN der Hersteller sich nicht entlasten kann, nicht, WORAN die Fehlerhaftigkeit zu messen
    ist, wenn das Modell heute anders antwortet als gestern. Ulfbeck schreibt aus skandinavischer Perspektive,
    was für den deutschen Leser den Vorteil hat, dass die Argumentation nicht an § 3 ProdHaftG hängt.
    Handbuchbeitrag, also Überblick statt Zuspitzung. Cambridge Core, kostenpflichtig.

    '
