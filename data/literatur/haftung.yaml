  kernthese: Verletzt ein autonom operierendes KI-System ein Patent, laesst sich die Verletzerhaftung
    nach dem Patents Act 57 of 1978 weder dem System noch ohne Weiteres dem Betreiber zuordnen; die Autoren
    ordnen die Haftung ueber Zurechnungsfiguren dem Nutzer beziehungsweise Entwickler zu.
  eigene_bewertung: 'Nischig, aber sauber gearbeitet und in der Sache interessant, weil Suedafrika mit
    dem DABUS-Patent 2021 das weltweit erste Patent mit einer KI als benanntem Erfinder erteilt hat -
    allerdings nur, weil das suedafrikanische Amt keine materielle Pruefung durchfuehrt. Vor diesem Hintergrund
    ist die Frage der Verletzerhaftung die logische Fortsetzung. Fuer meine Zwecke Randlage: Das Patentrecht
    ist nicht die Hauptachse, und die Zurechnungsargumentation ist die uebliche. Aber als Fussnote zum
    DABUS-Komplex brauchbar.'
