  kernthese: 'Es gibt keine einheitliche KI-Haftung: Das Deliktsrecht muss nach Anwendungstyp und Schadensart
    differenzieren, kommt dabei aber mit den vorhandenen Instituten aus, ergänzt allenfalls um Gefährdungshaftung
    für klar umgrenzte Schadensereignisse.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die dritte Position der US-Debatte und die pragmatischste: weder Geistfelds Zurückhaltung
    noch Sharkeys frühere Ausdehnungsthese, sondern Differenzierung — "designated compensable events"
    statt Generalklausel, ein Gedanke, den Abraham aus der Versicherungs- und Entschädigungsfondsdebatte
    mitbringt (Impfschäden, Asbest). Für die europäische Debatte ist das der interessanteste Import, weil
    er die Frage "Verschuldens- oder Gefährdungshaftung?" als falsch gestellt zurückweist: Die Antwort
    hängt am Schadenstyp, nicht an der Technologie. Genau diese Differenzierung fehlt sowohl der zurückgezogenen
    AILD als auch Bertolinis Option 4. Der erfasste Beitrag ist die frei zugängliche Kurzfassung; die
    Langfassung erscheint in einer Law Review und ist bei Zitierung nachzuprüfen.

    '
