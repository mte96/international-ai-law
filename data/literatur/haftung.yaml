  kernthese: 'Die entstehende KI-Regulierung verändert die Konturen der zivilrechtlichen Haftung; sie
    soll Grundrechte schützen, ohne die technologische Entwicklung zu bremsen.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der Text ist 2021 geschrieben und damit vor dem PL 2.338/2023; er bezieht sich auf
    die inzwischen überholten Vorgängerentwürfe (PL 21/2020). Als Darstellung des geltenden Rechts unbrauchbar.
    Ich erfasse ihn, weil die brasilianische Haftungsdiskussion sonst in dieser Sammlung nur über die
    ITS-Berichte abgebildet wäre und weil er die Anknüpfung an Art. 927 Parágrafo único des Código Civil
    (verschuldensunabhängige Haftung für risikobehaftete Tätigkeit) benennt — das ist die Norm, über die
    die brasilianische KI-Haftung tatsächlich laufen wird und deren Reichweite bis heute streitig ist.
    Für die Norm, nicht für die Argumentation.

    '
  letzte_pruefung: 2026-09-07
