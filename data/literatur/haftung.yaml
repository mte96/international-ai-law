  kernthese: Die vorab festgelegten Risikokategorien der KI-VO stehen in Spannung zur einzelfallbezogenen
    Risikobewertung des Deliktsrechts; die Hochrisikoklasse funktioniert faktisch wie eine Gefährdungshaftungskategorie.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die produktivste Verteidigung des Risikoansatzes, weil sie ihn nicht verteidigt,
    sondern übersetzt: Chamberlain zeigt, dass die Kategorienbildung dem deliktsrechtlichen Umgang mit
    gefährlichen Tätigkeiten entspricht und deshalb keine regulatorische Neuerfindung ist. Das entkräftet
    den Vorwurf der Willkür teilweise. Nach Rücknahme der KI-Haftungsrichtlinie (Februar 2025) hat der
    Text zusätzlich Gewicht bekommen: Wenn das Haftungsregime ausfällt, trägt das Marktzugangsrecht die
    Steuerungslast allein. CC BY.

    '
