  bezug_regelwerke:
  - us-cfpb-rueckzug
  kernthese: Das Kreditdiskriminierungsrecht misst nur die Ergebnisgleichheit und übersieht die Validitätsungleichheit
    — die unterschiedliche Prognosegüte des Modells je Gruppe; beide Ziele stehen in Spannung und müssen
    offen abgewogen werden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Fortschreibung von Gillis'' "Input Fallacy" und die Stelle, an der die Fairness-Metrik-Debatte
    (Kap. VII) und das Kreditrecht zusammenkommen: Gleiche Ablehnungsquoten und gleiche Prognosegüte sind
    zwei verschiedene Gerechtigkeitsvorstellungen, und ihre Verbesserung kann sich wechselseitig ausschließen
    — dasselbe Ergebnis wie bei Kleinberg u.a., nur ökonomisch statt informationstheoretisch hergeleitet
    und mit Simulationen belegt. Für die europäische Seite ist der Befund unmittelbar auf die Kreditwürdigkeitsprüfung
    als Hochrisikoanwendung (Anhang III Nr. 5 lit. b KI-VO) und auf Art. 27 KI-VO anzuwenden, der bei
    Kreditinstituten eine Grundrechte-Folgenabschätzung verlangt, ohne den Maßstab zu nennen. Genau diesen
    Maßstab liefert der Aufsatz. Ökonomisches Papier, formal, aber mit lesbarem Rechtsteil.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-27
  - usc-42-3605-a
- id: 2022-bartlett-morse-stanton-wallace-fintech-lending
  typ: aufsatz
  autoren:
  - Bartlett, Robert
  - Morse, Adair
  - Stanton, Richard
  - Wallace, Nancy
  titel: Consumer-Lending Discrimination in the FinTech Era
  fundstelle: Journal of Financial Economics 143 (2022), 30–56
  jahr: 2022
  sprache: en
  doi: 10.1016/j.jfineco.2021.05.047
  zugang: unklar
  jurisdiktionen:
  - us
  themenachsen:
  - sektor-finanz
  - grundrechte
  kernthese: 'Algorithmische Kreditvergabe diskriminiert bei der Bewilligung nicht mehr, bei der Bepreisung
    aber weiterhin: Schwarze und hispanische Kreditnehmer zahlen messbar höhere Zinsen, weil die Modelle
    Preiselastizität statt Bonität abbilden.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die empirische Grundlage der gesamten Debatte und der Grund, warum die These "Algorithmen
    sind fairer als Menschen" differenziert werden muss: Sie stimmt für die Bewilligungsentscheidung und
    stimmt nicht für die Preisbildung. Der Mechanismus ist entscheidend und wird selten mitzitiert — diskriminiert
    wird nicht über die Bonität, sondern über die Zahlungsbereitschaft, was juristisch ein anderer Vorwurf
    ist: keine Stellvertreterdiskriminierung, sondern Ausbeutungsdiskriminierung. Ob § 19 AGG bzw. die
    Gender-Richtlinie das erfassen, ist offen; es fehlt sogar die Begriffsbildung. Elsevier, kein geprüfter
    freier Volltext gefunden; frühere Arbeitspapierfassungen kursieren.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - usc-42-3605-a
- id: 2018-baker-dellaert-regulating-robo-advice
  typ: aufsatz
  autoren:
  - Baker, Tom
  - Dellärt, Benedict
  titel: Regulating Robo Advice Across the Financial Services Landscape
  fundstelle: Iowa Law Review 103 (2018), 713
  jahr: 2018
  sprache: en
  ssrn_id: '3068254'
  zugang: open-access
  jurisdiktionen:
  - us
  themenachsen:
  - sektor-finanz
  - berufsrecht
  - haftung
  kernthese: Automatisierte Finanzberatung ist besser regulierbar als menschliche, weil sie systematisch
    geprüft werden kann; nötig ist eine Aufsicht, die den Beratungsalgorithmus selbst zertifiziert, statt
    Verhaltenspflichten des Beraters zu formulieren.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die Robo-Advice-Regulierung vom Kopf auf die Füße gestellt hat, und
    die interessanteste Gegenthese des Kapitels: Automatisierung ist eine Chance für die Aufsicht, nicht
    nur ein Risiko, weil ein Algorithmus im Unterschied zum Menschen vollständig testbar ist. Das entspricht
    der Logik des europäischen Konformitätsbewertungsansatzes und erklärt, warum die KI-VO für Beratungssysteme
    relativ gut passt — anders als für generative Systeme. Zu prüfen ist, ob die These acht Jahre später
    noch trägt: Baker/Dellärt denken an regelbasierte Empfehlungssysteme, nicht an LLM-gestützte Beratung,
    deren Verhalten gerade nicht vollständig testbar ist. Diese Verschiebung markiert die Grenze der These
    und ist der Ansatzpunkt für eine Fortschreibung. Volltext bei der Iowa Law Review und auf SSRN; die
    dort geprüften Adressen waren nicht erreichbar (404 bzw. 429).

    '
  letzte_pruefung: 2026-08-27
