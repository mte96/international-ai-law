  kernthese: Der Landesbericht Neuseeland ordnet den Einsatz von KI in der Steuerverwaltung und die steuerliche
    Behandlung KI-gestuetzter Geschaeftsmodelle in das neuseelaendische Recht ein.
  eigene_bewertung: 'Landesbericht in einem rechtsvergleichenden Sammelwerk der Wirtschaftsuniversitaet
    Wien - die Gattung, die man fuer den systematischen Vergleich braucht und die es fuer Neuseeland sonst
    kaum gibt. Die neuseelaendische Steuerverwaltung (Inland Revenue) gehoert zu den am staerksten automatisierten
    der OECD, was den Bericht ueber das Steuerrecht hinaus interessant macht: Er dokumentiert den Massenbetrieb
    automatisierter Verwaltungsentscheidungen. Fuer die Achse sektor-oeffentlich als Faktenquelle nuetzlich.
    Nur ueber IBFD zugaenglich; Metadaten geprueft, Text nicht.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
