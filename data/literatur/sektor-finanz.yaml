  kernthese: KI-gestützte Verdachtsgewinnung im Geldwäscherecht verlagert Strafverfolgungsaufgaben auf
    Private und verlangt rechtsstaatliche Sicherungen, die weder das GwG noch die KI-VO bereitstellen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Nach der Rezension von Bernhardt die gründlichste deutsche Arbeit zu KI in der Strafverfolgung;
    interdisziplinär angelegt, mit technischem Teil. Nicht frei. Zugänglich sind die Rezension (Ordnung
    der Wissenschaft 2026, 65 f.) und der Verfassungsblog-Beitrag der Autorin von 2024, die zusammen etwa
    ein Zehntel des Inhalts abdecken. Ein guter Testfall für die Ausgangsfrage dieses Auftrags: Man erfährt,
    dass es die Arbeit gibt und was in ihr steht, aber man kann sie nicht zitieren.

    '
  letzte_pruefung: 2026-08-27
- id: 2025-cedillo-lazcano-cartografia-operacional
  typ: aufsatz
  autoren:
  - Cedillo Lazcano, Israel
  titel: La propiedad intelectual como herramienta de la nueva cartografía operacional
  titel_deutsch: Das Immaterialgüterrecht als Werkzeug der neuen operationellen Kartographie
  fundstelle: Boletín Mexicano de Derecho Comparado 58 (2025), Nr. 174, Artikel e20216
  jahr: 2025
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-comparado/article/view/20216
  doi: 10.22201/iij.24484873e.2025.174.20216
  zugang: open-access
  jurisdiktionen:
  - mx
  - eu
  themenachsen:
  - sektor-finanz
  - urheberrecht
  - governance
  kernthese: 'Immaterialgüterrechte lassen sich als Kartierungsinstrument für die Abhängigkeiten automatisierter
    Finanzinfrastruktur nutzen; der europäische DORA-Rahmen liefert dafür die Struktur.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Eigenwilliger Text, den ich nur wegen der Themenkombination aufnehme: Cedillo Lazcano
    ist einer der ganz wenigen lateinamerikanischen Autoren, die KI-Aufsicht im Finanzsektor und Immaterialgüterrecht
    zusammendenken, und er liest DORA sehr genau. Der Gedanke, IP-Register als Landkarte der Drittanbieter-
    abhängigkeiten zu benutzen, ist originell, aber die Umsetzung ist spekulativ und die mexikanische
    Anbindung dünn. Lesen, wenn man an der Schnittstelle DORA/KI arbeitet; sonst überspringen.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-puentes-amaya-open-banking-colombia
  typ: aufsatz
  autoren:
  - Puentes Trujillo, Laura Victoria
  - Amaya Osorio, Lucidia
  titel: 'Open data y open banking: El derecho en el contexto de los mercados digitales. Un modelo regulatorio
    por definir en el ordenamiento jurídico colombiano'
  titel_deutsch: 'Open Data und Open Banking: Das Recht im Kontext digitaler Märkte. Ein noch zu bestimmendes
    Regulierungsmodell im kolumbianischen Recht'
  fundstelle: Revista Chilena de Derecho y Tecnología 11 (2022), Nr. 2, 211–244
  jahr: 2022
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/65972
  doi: 10.5354/0719-2584.2022.65972
  zugang: open-access
  jurisdiktionen:
  - co
  themenachsen:
  - sektor-finanz
  - datenschutz
  - marktzugang
  kernthese: 'Kolumbien hat Open Banking über die Sandkastenermächtigung der Ley 1955/2019 und das Decreto
    1234/2020 erprobt, ohne den Datenschutz mitzuregeln; das Hauptrisiko liegt bei Privatsphäre, Habeas
    Data und Datenqualität.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der Text ist für mich vor allem wegen des Regulierungssandkastens interessant: Kolumbien
    hat 2019/2020 einen befristeten Sandkasten eingeführt, um vor der Modellwahl das Marktverhalten zu
    beobachten — genau die Konstruktion, die Art. 57 ff. KI-VO nun für KI vorsehen und die der ITS-Rio-Bericht
    für Brasilien empfiehlt. Hier kann man nachlesen, was ein solcher Sandkasten in einer Schwellenökonomie
    tatsächlich produziert hat, nämlich: eine Erprobung ohne begleitende Datenschutzregelung. Das ist
    der Einwand, den man gegen die Sandkastenbegeisterung führen sollte. Eine Autorin lehrt am Externado,
    die andere in Antioquia; da der Externado-Server für mich nicht erreichbar war, ist dies der einzige
    Weg, an Externado-nahe Arbeit zu kommen. KI ist nicht das Thema — Kontextliteratur zur Achse sektor-finanz.

    '
  letzte_pruefung: 2026-09-07
- id: 2024-makore-ki-finanzielle-inklusion
  typ: aufsatz
  autoren:
  - Makore, Shelton Tapiwa Mota
  titel: Regulating Artificial Intelligence to Advance Financial Inclusion in South Africa
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 27 (2024), Beitrag a17488
  jahr: 2024
  sprache: en
  url: https://perjournal.co.za/article/view/17488
  doi: 10.17159/1727-3781/2024/v27i0a17488
  zugang: open-access
  jurisdiktionen:
  - za
  themenachsen:
  - sektor-finanz
  - governance
  - marktzugang
  kernthese: Suedafrika braucht einen eigenen Regulierungsrahmen fuer KI im Finanzsektor, der die Chancen
    fuer finanzielle Inklusion - Kontoeroeffnung, Kreditscoring, Risikomanagement - hebt, ohne die Haftungs-
    und Cybersicherheitsfragen unbeantwortet zu lassen; Vorbild seien in Teilen EU und Vereinigtes Koenigreich.
  eigene_bewertung: 'Nuetzlich als Bestandsaufnahme, dogmatisch duenn. Makore referiert EU- und UK-Modelle
    zutreffend, bleibt aber bei Empfehlungen stehen ("there is a need to develop an effective regulatory
    framework"), ohne den Konflikt zu benennen, der den Fall interessant macht: Kreditscoring per KI ist
    in Suedafrika zugleich das wirksamste Instrument gegen finanzielle Exklusion und das wirksamste Instrument
    zur Reproduktion der Apartheid-Vermoegensverteilung. Wer zu Paragraf 31 POPIA und automatisierten
    Einzelfallentscheidungen arbeitet - dem suedafrikanischen Gegenstueck zu Art. 22 DSGVO -, findet hier
    den Aufhaenger, aber nicht die Analyse.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2024-chitimira-ki-geldwaesche
  typ: aufsatz
  autoren:
  - Chitimira, Howard
  - Torerai, Elfas
  - Jana, Lisa
  titel: Leveraging Artificial Intelligence to Combat Money Laundering and Related Crimes in the South
    African Banking Sector
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 27 (2024), Beitrag a18024
  jahr: 2024
  sprache: en
  url: https://perjournal.co.za/article/view/18024
  doi: 10.17159/1727-3781/2024/v27i0a18024
  zugang: open-access
  jurisdiktionen:
  - za
  themenachsen:
  - sektor-finanz
  - governance
  kernthese: KI-gestuetzte Transaktionsueberwachung, Kundensorgfalt und ergebnisorientierte Risikobewertung
    koennen die Geldwaeschebekaempfung im suedafrikanischen Bankensektor wirksamer machen, setzen aber
    Datenqualitaet, Integration in die bestehende Aufsicht und geklaerte ethische Rahmenbedingungen voraus.
  eigene_bewertung: 'Solide, aber ohne eigenen dogmatischen Ertrag. Der Text ist vor allem deshalb interessant,
    weil Suedafrika 2023 auf die FATF-Grauliste kam und der Einsatz von KI in der Geldwaeschebekaempfung
    dadurch von einer Effizienz- zu einer Compliance-Frage wurde. Fuer die Achse sektor-finanz im Rechtsvergleich
    zu Art. 6 Abs. 2 i.V.m. Anhang III Nr. 5 lit. b KI-VO (Kreditwuerdigkeitspruefung) taugt er nur als
    Kontrast: Chitimira behandelt KI als Aufsichtswerkzeug, nicht als reguliertes Objekt. Lesen, wenn
    man RegTech-Argumente sucht, sonst uebergehen.'
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
