  titel: Modernizing Fair Lending
  fundstelle: Becker Friedman Institute for Economics, University of Chicago, Working Paper 2024-18, August
    2024
  jahr: 2024
  sprache: en
  url: https://bfi.uchicago.edu/wp-content/uploads/2024/02/BFI_WP_2024-18-1.pdf
