  - grundrechte
  - datenschutz
  bezug_regelwerke:
  - ki-vo-2024-1689
  - dsgvo-schnittstelle
  kernthese: Systeme zur Erkennung von Geldwäscheverdacht sind nach der KI-VO nicht als Hochrisiko eingestuft,
    obwohl Banken über § 43 GwG faktisch Strafverfolgungsaufgaben wahrnehmen und ihre Fehlalarme unmittelbar
    in Ermittlungsverfahren münden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die präziseste Lückenanalyse der KI-VO in der frei zugänglichen deutschen Literatur:
    Anhang III erfasst Kreditwürdigkeitsprüfung, aber nicht die Verdachtsmeldepflicht, obwohl deren Folgen
    für den Betroffenen härter sind. Leffer verbindet Aufsichtsrecht, Datenschutz und Strafverfahren,
    was in der Fachliteratur selten geschieht. Angreifbar ist die Gleichsetzung des privaten Meldewesens
    mit Strafverfolgung — die Bank entscheidet nicht, sie meldet. Der Beitrag ist die Kurzfassung ihrer
    Dissertation (Nomos 2025, nicht frei; die Rezension ist frei, s. u.). Ergänzt Beck.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-6-abs-2
- id: 2026-bernhardt-rezension-leffer-suspicion-algorithms
  typ: aufsatz
  autoren:
  - Bernhardt, Wilfried
  titel: Besprechung von Lena Leffer, Automated Suspicion Algorithms — Strafverfolgung durch Künstliche
    Intelligenz am Beispiel der Geldwäsche
  fundstelle: Ordnung der Wissenschaft 2026, 65–66
  jahr: 2026
  sprache: de
  url: https://ordnungderwissenschaft.de/2025/besprechung-von-lena-leffer-automated-suspicion-algorithms-strafverfolgung-durch-kuenstliche-intel-ligenz-am-beispiel-der-geldwaesche-nomos-2025-307-s/
  zugang: open-access
  jurisdiktionen:
  - de
  - eu
  themenachsen:
  - sektor-finanz
  - sektor-oeffentlich
  - grundrechte
  bezug_regelwerke:
  - ki-vo-2024-1689
  kernthese: Leffers interdisziplinäre Dissertation verbindet technische Sachkunde mit dogmatischer Analyse
    und beschreibt die Verschränkung von Technik und menschlicher Bewertung als Weg, rechtsstaatliche
    Grundsätze bei KI-gestützter Strafverfolgung zu sichern.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Rezension, kein eigenständiger Beitrag — erfasst als Vertretungslösung für die Dissertation
    selbst, die bei Nomos erschienen und nicht frei ist. Bernhardt (ehem. Staatssekretär im sächsischen
    Justizministerium) rezensiert uneingeschränkt lobend, was den Erkenntniswert mindert; wer Schwachstellen
    sucht, findet sie hier nicht. Der praktische Wert liegt in der Inhaltsangabe: Man erfährt, was in
    der Dissertation steht, ohne sie zu kaufen. Genau dafür sind Rezensionen in einer Beck-freien Recherche
    wertvoller, als es ihrem wissenschaftlichen Rang entspricht.

    '
  letzte_pruefung: 2026-08-27
