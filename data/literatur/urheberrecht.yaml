  kernthese: Aus einem trainierten Sprachmodell lassen sich einzelne Trainingsbeispiele wörtlich zurückgewinnen,
    allein durch Abfragen des Modells und ohne Zugriff auf die Trainingsdaten — darunter Namen, Anschriften
    und Schlüssel, die nur einmal im Korpus vorkamen.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob ein Modell Trainingsdaten "enthält" — die Tatsachenfrage,
    an der sowohl `modellgewichte-kopie` als auch die Reichweite der §§ 44b, 60d UrhG hängen. PFLICHT,
    weil dies die Arbeit ist, die das Phänomen überhaupt begründet hat und in praktisch jedem Schriftsatz,
    jedem Gutachten und jeder Gesetzesbegründung zum Thema zitiert wird — bei Dornis/Stober, bei Cooper/Grimmelmann,
    im Bericht des US Copyright Office, in der Begründung des LG München I. Wer sie nicht selbst gelesen
    hat, übernimmt Zusammenfassungen, die den entscheidenden Punkt regelmäßig verfehlen: Die Autoren extrahieren
    aus GPT-2 rund 600 Sequenzen, viele davon aus Dokumenten, die NUR EINMAL im Trainingskorpus standen.
    Die verbreitete Entlastungsformel, Memorisierung setze vielfache Wiederholung voraus, ist mit dieser
    Arbeit unvereinbar. ANGREIFBAR — und das ist die Gegenseite des Arguments: Die Extraktion ist ein
    ANGRIFF. Die Autoren generieren hunderttausende Ausgaben und filtern sie mit einem Mitgliedschaftstest;
    die Trefferquote pro Abfrage ist verschwindend. Wer daraus schließt, das Modell gebe Werke wieder,
    verwechselt Zugänglichkeit mit Speicherung. Beide Seiten dieses Befunds stehen in derselben Arbeit
    — deshalb muss man sie selbst lesen. 18 Seiten, technisch, aber Abschnitte 1, 3 und 6 sind ohne Vorkenntnisse
    lesbar.

    '
  letzte_pruefung: 2026-08-27
