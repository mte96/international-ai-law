  kernthese: 'Der mexikanische Werkbegriff verlangt menschliche Urheberschaft und ein Mindestmass an Schöpfungshöhe;
    rein generativ erzeugte Inhalte erfüllen beides nicht und bleiben deshalb schutzlos.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der beste Einstiegstext, den ich für die mexikanische Seite der Schutzfähigkeitsfrage
    gefunden habe, und der einzige, der sie dogmatisch statt essayistisch behandelt. Núñez Rocha arbeitet
    mit dem Begriffspaar "impronta personal" und "umbral mínimo de creatividad" — das ist funktional die
    mexikanische Entsprechung unserer persönlichen geistigen Schöpfung nach § 2 Abs. 2 UrhG, und genau
    deshalb ist der Text für einen deutschen Leser lesbar: man kann die Argumentation eins zu eins gegen
    die eigene Dogmatik halten. Schwach ist die Rechtsvergleichung — er nimmt USA und China als Kontrastfolie,
    lässt die EU und damit die für Mexiko politisch näherliegende Referenzordnung weitgehend aus, und
    die chinesische Rechtsprechung (Li v. Liu) referiert er aus zweiter Hand. Man braucht ihn als Fundstelle
    dafür, dass die mexikanische Lehre den Output nicht schützt; für den Streitstand selbst braucht man
    ihn nicht.

    '
  letzte_pruefung: 2026-09-07
