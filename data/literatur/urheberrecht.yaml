  kernthese: Von vier Politikoptionen — Schranke, Schranke mit Opt-out, Lizenzmarkt, gesetzliche Lizenz
    — maximiert keine unter allen Annahmen die Wohlfahrt; entscheidend sind Transaktionskosten und die
    Verteilung des Datenwerts.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die ökonomische Grundlage der laufenden EU-Debatte und der einzige Text, der die
    vier diskutierten Regelungsmodelle formal gegeneinanderstellt. Für den Auftraggeber die wirtschaftswissenschaftliche
    Pflichtergänzung zur juristischen Literatur — nicht wegen der Modelle, sondern wegen der Fallunterscheidungen:
    Peukert zeigt, unter welchen Annahmen welches Modell überlegen ist, und macht damit sichtbar, dass
    der rechtspolitische Streit in Wahrheit ein Streit über empirische Annahmen ist.

