  kernthese: Die Regierung verwirft die bevorzugte Lösung einer weiten Schranke mit Opt-out, verzichtet
    vorerst auf jede Gesetzesänderung, will Transparenz über Selbstverpflichtungen erreichen und den Schutz
    für rein computergenerierte Werke (s. 9(3) CDPA) abschaffen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die politisch folgenreichste Entscheidung des Jahres 2026 im Feld, und für die deutsche
    Debatte doppelt lehrreich. Erstens: Das Vereinigte Königreich hat den Opt-out, den die DSM-Richtlinie
    der EU vorschreibt, nach breiter Konsultation ausdrücklich verworfen — mit der Begründung, er sei
    technisch nicht umsetzbar. Genau das ist die Kritik, die Keller am OLG Hamburg übt. Zweitens: Die
    geplante Streichung von s. 9(3) CDPA beseitigt das einzige Sui-generis-Recht an computergenerierten
    Werken in einer großen Rechtsordnung und stellt das Vereinigte Königreich auf die amerikanische Seite
    des Streitstands `schutzfähigkeit-output`. Die Konsultationsantworten von 2025 sind über die Regierungsseite
    mitverlinkt; die wissenschaftlich gehaltvollste ist die von CREATe (gesondert erfasst).

    '
