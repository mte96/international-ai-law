  kernthese: Ein Modell heißt nahezu zugriffsfrei bezüglich eines Werks, wenn seine Ausgabeverteilung
    höchstens um k Bit von der eines Modells abweicht, das dieses Werk nie gesehen hat; das lässt sich
    konstruktiv erreichen und liefert eine beweisbare obere Schranke für die Wahrscheinlichkeit substantiell
    ähnlicher Ausgaben.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wie ein technischer Sorgfaltsmaßstab aussehen könnte, der die
    Frage "hat der Anbieter genug getan?" justiziabel macht — die offene Flanke von Art. 53 Abs. 1 lit.
    c KI-VO und des vierten Fair-Use-Faktors. Der Text ist der bislang ernsthafteste Versuch, eine urheberrechtliche
    Kategorie — die Frage, ob eine Ausgabe auf Zugang zum Werk zurückgeht — in eine überprüfbare Modelleigenschaft
    zu übersetzen, und er stammt von Informatikern, die die juristische Struktur verstanden haben: Der
    Begriff ist ausdrücklich der Zugangs-und-Ähnlichkeits-Prüfung des US-Rechts nachgebildet. Wenn sich
    ein Modell so bauen lässt, dass seine Ausgaben nachweisbar kaum von denen eines Modells ohne Zugang
    zum Werk abweichen, dann ist das ein Sicherheitshafen, den ein Gesetzgeber oder ein Verhaltenskodex
    anknüpfen könnte — und der GPAI-Verhaltenskodex hat genau hier nichts anzubieten. ANGREIFBAR, und
    zwar erheblich. Die Autoren schützen gegen wörtliche Wiedergabe eines EINZELNEN Werks, nicht gegen
    Stilübernahme, nicht gegen Marktverwässerung und nicht gegen die Ähnlichkeit zu einer Werkgruppe;
    die Konstruktion setzt voraus, dass man das Korpus in disjunkte Teile zerlegen kann, was bei tatsächlichen
    Trainingskorpora unrealistisch ist. Und der Maßstab misst Verteilungsabstand, nicht Ähnlichkeit im
    Sinne des § 23 UrhG — die Übersetzung zurück ins Recht ist nicht geleistet. Trotzdem: Es ist der einzige
    Vorschlag, über den sich streiten LÄSST.

    '
