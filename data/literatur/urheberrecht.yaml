  kernthese: Trotz unterschiedlicher Dogmatik konvergieren die Rechtsordnungen auf ein internationales
    Gleichgewicht, in dem TDM zu KI-Zwecken grundsätzlich erlaubt und nur in bestimmten Konstellationen
    untersagt ist.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche rechtsvergleichende Arbeit im Feld, frei über das Emory-Repositorium,
    und die einzige, die Japan, Singapur, Israel, die EU, das Vereinigte Königreich und die USA in einem
    dogmatisch belastbaren Raster nebeneinanderstellt statt bloß aufzuzählen. Sie liefert die Begriffe,
    mit denen man den Auftrag "Rechtsvergleich TDM" überhaupt bearbeiten kann: Unterscheidung nach Zweckbindung,
    nach Zugangsvoraussetzung und nach Opt-out-Mechanik. Zwei Einwände. Erstens ist die Konvergenzthese
    durch die Ereignisse seit Fertigstellung unter Druck geraten — LG München I, OLG Hamburg und die britische
    Kehrtwende vom März 2026 zeigen eher Divergenz. Zweitens sind beide Autoren erklärte Befürworter weiter
    Schranken, was die Auswahl der Vergleichspunkte prägt. Als Gegengewicht de la Durantaye lesen, die
    zum Teil dieselben Länder untersucht und zum gegenteiligen Ergebnis über die Wirkung der Regeln kommt.

    '
