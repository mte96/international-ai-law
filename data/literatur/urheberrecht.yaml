  themenachsen:
  - urheberrecht
  - content
  kernthese: Das Urheberrecht ist nicht als Belohnung fuer Schoepfung, sondern als Ermoeglichung menschlicher
    Ausdrucksfaehigkeit zu begruenden; daraus folgt eine andere Behandlung maschinell erzeugter Erzeugnisse
    und ein weiterer Zugangsanspruch.
  eigene_bewertung: Ein theoretischer Gegenentwurf, der fuer den Streitstand schutzfaehigkeit-output brauchbar
    ist, weil er die Schutzfrage nicht ueber den Schoepfungsbegriff, sondern ueber den Zweck des Schutzes
    beantwortet. Wenn das Urheberrecht menschliche Ausdrucksfaehigkeit ermoeglichen soll, spricht das
    gegen Schutz maschineller Erzeugnisse und zugleich fuer weite Schranken beim Training - eine Kombination,
    die in der deutschen Diskussion selten zusammengedacht wird. Agrawal ist Praktiker und schreibt engagiert;
    die Belegdichte ist geringer als bei einer deutschen Habilitation, das Argument dafuer klar. Nuetzlich
    als Gegenposition zu den Verwertungsgesellschaftsargumenten.
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
