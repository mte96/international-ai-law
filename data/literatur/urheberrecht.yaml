  kernthese: Der Bestand an öffentlich verfügbarem, von Menschen erzeugtem Text wird bei fortgesetzten
    Entwicklungstrends zwischen 2026 und 2032 erschöpft sein; danach entscheidet der Zugang zu nicht-öffentlichen
    Beständen, synthetischen Daten und Datensparsamkeit über den Fortschritt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die wirtschaftliche Vorfrage des vierten Fair-Use-Faktors und
    der TDM-Debatte — ob urheberrechtlich geschützte Werke für die Entwickler ein knappes, also handelbares
    Gut sind oder ein beliebig ersetzbares. Sie sind knapp, und das ist die juristisch folgenreichste
    Aussage dieser Akte für das Urheberrecht. Aus der Knappheit folgt dreierlei. (1) Es gibt einen realen
    Markt für Lizenzen an Trainingsdaten — die Voraussetzung dafür, im vierten Fair-Use-Faktor einen Marktschaden
    anzunehmen, und für die deutsche Diskussion die Voraussetzung dafür, dem Nutzungsvorbehalt nach §
    44b Abs. 3 UrhG wirtschaftliche Wirkung zuzusprechen. (2) Der Nutzungsvorbehalt ist deshalb nicht
    symbolisch: Wenn Daten knapp werden, wirkt jeder Opt-out unmittelbar auf die Fähigkeit künftiger Modelle.
    (3) Der Wechsel zu nicht-öffentlichen Beständen — Nutzerdaten, Bücher, Verlagsarchive, Betriebsdaten
    — ist keine Möglichkeit, sondern eine Notwendigkeit; die datenschutz- und vertragsrechtlichen Streitigkeiten
    der kommenden Jahre sind hier vorgezeichnet. ANGREIFBAR: eine Projektion unter Fortschreibung von
    Trends, die sich seit 2024 erkennbar verschoben haben — synthetische Daten, Mehrfachdurchläufe und
    Rechenaufwand zur Inferenzzeit verschieben die Grenze nach hinten, und die revidierte Fassung sagt
    das. Wer die Erschöpfung als feststehendes Datum zitiert, zitiert falsch; wer die Knappheit als Richtung
    zitiert, ist auf sicherem Boden.

    '
