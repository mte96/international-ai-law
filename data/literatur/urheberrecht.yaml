  kernthese: Das Urheberrecht hat sich stillschweigend darauf eingerichtet, maschinelles Lesen anders
    zu behandeln als menschliches Lesen — das ist keine Anomalie, sondern eine tragende Struktur.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die dogmatische Grundlage der Lehre von der nicht-expressiven Nutzung, auf der die
    gesamte amerikanische Verteidigungslinie ruht. Bibas hat sie in Thomson Reuters ./. ROSS im Ergebnis
    verworfen, ohne sie zu widerlegen — er hat schlicht darauf abgestellt, dass ROSS ein Konkurrenzprodukt
    gebaut hat. Angreifbar ist Grimmelmanns Prämisse, dass Maschinen nicht "genießen"; genau daran setzt
    die japanische Regelung des Art. 30-4 an, dort aber gesetzlich statt richterrechtlich.

    '
  letzte_pruefung: 2026-08-27
