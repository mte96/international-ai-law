  kernthese: Der EWHC hat zu Recht angenommen, dass ein Modell ein "article" sein kann, aber zu Unrecht
    verlangt, dass dieser Gegenstand eine Kopie des Werkes enthalten müsse — Bearbeitungen sind seit jeher
    verletzend, ohne Kopien zu enthalten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die schärfste wissenschaftliche Kritik am Getty-Urteil, frei zugänglich unter CC
    BY, und der Text, an dem sich das Berufungsverfahren orientieren wird. Für den Streitstand `modellgewichte-kopie`
    zentral, weil Hall den Fehler nicht in der Technikbewertung sucht, sondern in der Auslegung von s.
    27 CDPA — das Modell muss keine Kopie enthalten, es genügt, dass seine Herstellung eine Verletzung
    gewesen wäre. Für den deutschen Leser wichtig als Warnung: Die englische Diskussion über "infringing
    copy" hat kein deutsches Gegenstück, und die Übertragung des Getty-Ergebnisses auf § 16 UrhG wäre
    ein Kategorienfehler.

    '
  letzte_pruefung: '2026-09-07'
