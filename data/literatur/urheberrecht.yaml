  kernthese: In Like Company gegen Google wird der EuGH erstmals über KI und Urheberrecht entscheiden;
    das Training dürfte von der TDM-Schranke des Art. 4 DSM-RL gedeckt sein, die Wiedergabe von Presseinhalten
    im Chatbot-Output dagegen nicht, weshalb ein Vergütungsmechanismus erforderlich wird.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Philipp Hacker ist der international meistzitierte deutsche KI-Rechtswissenschaftler,
    und dies ist der einzige seiner Texte, der in dieser Akte frei greifbar ist — seine Aufsätze liegen
    auf SSRN, das nicht erreichbar war. Pflicht ist er wegen des Gegenstands: Like Company gegen Google
    (C-250/25) ist die erste Vorlagefrage zum KI-Urheberrecht beim EuGH, und die Entscheidung wird die
    deutschen Verfahren (LG Hamburg/LAION, LG München/GEMA) überlagern. Hackers Trennung zwischen Training
    und Output ist die Struktur, entlang derer die Diskussion seither läuft, und sein Vergütungsargument
    ist der Brückenschlag zu Art. 15 DSM-RL. Angreifbar ist die Zuversicht bei Art. 4 DSM-RL: Die Frage
    des rechtmäßigen Zugangs und die Reichweite des Nutzungsvorbehalts sind offen, und Senftleben und
    Dornis/Stober (beide in 30_lit_urheberrecht.yaml) argumentieren gegenteilig. Wer diese Akte nutzt,
    sollte Hacker gegen Dornis/Stober lesen — das ist die deutsche Kontroverse in ihrer schärfsten Form.
    Ergänzt Beck, wo Beck zur EuGH-Vorlage noch nichts hat. ACHTUNG, Verfallsdatum: Die Schlussanträge
    des Generalanwalts Szpunar in C-250/25 sind für den 03.09.2026 terminiert (s. 22_eu_de.yaml). Der
    Text ist ab diesem Tag an ihnen zu messen; hält Hackers Trennung von Training und Output stand, gewinnt
    er an Gewicht, andernfalls ist der Eintrag herabzustufen.

    '
  letzte_pruefung: 2026-08-27
