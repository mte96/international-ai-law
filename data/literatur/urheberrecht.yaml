  kernthese: Die Fair-Use-Doktrin kann maschinelles Lernen an expressiven Werken nicht mehr bewältigen,
    weil sie zwischen nicht-expressiver Analyse und expressiver Ausgabe nicht trennen kann und Urheber
    unentgolten lässt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die früheste Arbeit, die das Problem zutreffend benennt: Wenn generative Systeme
    aus expressiven Werken expressive Ausgaben erzeugen, trägt die Rechtsprechung zu nicht-expressiver
    Nutzung (Google Books, HathiTrust) nicht mehr. Sobel hat 2017 vorweggenommen, was Chhabria 2025 als
    "market dilution" formuliert. Wer die Genealogie der Marktverwässerungstheorie verstehen will, fängt
    hier an.

    '
  letzte_pruefung: 2026-08-27
