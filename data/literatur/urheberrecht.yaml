  titel_deutsch: Die urheberrechtliche Regulierungsstrategie fuer die Entwicklung generativer KI in Taiwan
  fundstelle: 月旦法學雜誌 (Yuedan Faxue Zazhi, The Taiwan Law Review) 375 (August 2026), 65-88
