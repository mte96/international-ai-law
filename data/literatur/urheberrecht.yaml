  kernthese: Urheberrechtliche Bewertung muss dem Lebenszyklus des Modells folgen — Datensammlung, Vortraining,
    Feinabstimmung, Einsatz —, weil die Rechtslage auf jeder Stufe eine andere ist.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das europäische Gegenstück zu Lee/Cooper/Grimmelmann, mit drei Fallstudien statt
    bloß dogmatischer Analyse. Der zentrale Befund — dass in eingesetzten Modellen die Eingaben regelmäßig
    unbekannt sind, teils aus Rechtsunsicherheit, teils aus Geschäftsgeheimnis — ist die eigentliche Begründung
    für Art. 53 Abs. 1 lit. d KI-VO und für die Transparenzdebatte. Für die Frage der Modellgewichte wichtig,
    weil die Autoren die Stufe "Modell als Artefakt" ausdrücklich getrennt behandeln.

    '
