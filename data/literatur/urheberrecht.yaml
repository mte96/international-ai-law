  kernthese: Die juristische Debatte über generative KI scheitert überwiegend nicht an Rechtsfragen, sondern
    daran, dass Juristen und Informatiker dieselben Wörter — Modell, Kopie, Memorisierung, Datensatz —
    für verschiedene Sachen benutzen.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die Vorfrage jeder anderen Frage dieser Akte — was genau ist
    der Gegenstand, über den gestritten wird, wenn von "dem Modell" die Rede ist. PFLICHT, und zwar als
    ERSTER Text überhaupt. Der Bericht ist das einzige Dokument im Feld, das von Informatikern und Juristen
    gemeinsam mit dem ausdrücklichen Ziel geschrieben wurde, eine gemeinsame Begriffsgrundlage zu schaffen;
    Lee, Cooper und Grimmelmann haben daraus später die Lieferkettenanalyse entwickelt, die in 30_lit_urheberrecht
    erfasst ist. Der praktische Ertrag ist der Abschnitt zur Unterscheidung von Trainingsdatensatz, Trainingslauf,
    Modellgewichten, Modell-als-Dienst und Ausgabe: Fünf Gegenstände, an die das Recht jeweils verschieden
    anknüpft, und die in Schriftsätzen regelmäßig zu einem zusammengezogen werden. ANGREIFBAR: Der Bericht
    referiert Positionen, statt zu entscheiden, und ist an mehreren Stellen bereits überholt — er kennt
    weder die Memorisierungsergebnisse von 2025 noch die KI-VO in Anwendung. Das schadet nicht, weil sein
    Wert im Vokabular liegt, nicht in den Ergebnissen. Etwa 30 Seiten Fließtext, ohne Formeln lesbar.

    '
