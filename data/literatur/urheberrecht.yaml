  kernthese: Das Lernen aus geschützten Werken ist als Pastiche im Sinne des § 51a UrhG und des Art. 5
    Abs. 3 lit. k InfoSoc-RL zu begreifen — technische Reproduktion ist die maschinelle Form künstlerischer
    Nachahmung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der originellste deutsche Beitrag zur Trainingsfrage und der einzige, der die Schrankendiskussion
    aus der TDM-Sackgasse herausführt: Wenn der BGH § 44b UrhG eng auslegt, bleibt § 51a UrhG als Auffangschranke
    — eine Norm, die der EuGH in Pelham II (C-590/23) gerade erst weit ausgelegt hat. Die Autoren argumentieren
    von der Kunstfreiheit her, nicht vom Innovationsinteresse, was die Position gegen den üblichen Vorwurf
    der Technikfreundlichkeit immunisiert. Nur über beck-online oder juris — Nachschlageliste. Frei zugänglich
    ist die englischsprachige Kurzfassung derselben Autoren in IIC 56 (2025), 241 ("Forbidden Fruits?
    Artistic Creation in the AI Copyright War", DOI 10.1007/s40319-024-01551-8, Open Access), die den
    Gedanken auf die Ausgabeseite erweitert. Angreifbar: Die Pastiche-Schranke setzt eine Auseinandersetzung
    mit dem Vorbild voraus; ob ein statistischer Trainingsvorgang das leistet, ist zweifelhaft.

    '
  letzte_pruefung: 2026-08-27
