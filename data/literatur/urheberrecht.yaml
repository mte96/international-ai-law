  kernthese: Fair Use trägt das Training nur, solange technische Maßnahmen (Deduplizierung, Ausgabefilter,
    Differential Privacy) verhindern, dass Modelle geschützten Ausdruck reproduzieren.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die juristische mit der informatischen Debatte verbindet, und der einzige
    mit einer konkreten Liste von Maßnahmen. Er ist der stillschweigende Maßstab hinter Alsups Formel
    von der "quintessentially transformative" Nutzung ebenso wie hinter dem Vorwurf des LG München I,
    OpenAI habe zumutbare Vorkehrungen unterlassen. Für die Frage der Modellgewichte zentral, weil er
    zeigt, dass Memorisierung eine Design-Variable ist und keine Naturkonstante.

    '
