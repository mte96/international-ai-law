  kernthese: Urheberrechtliche Fragen der generativen KI lassen sich nur beantworten, wenn man die Lieferkette
    in ihre acht Stufen zerlegt und für jede Stufe gesondert Handlung, Handelnden und Werkbezug bestimmt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Methodisch die sauberste Arbeit im Feld und das beste Gegenmittel gegen die verbreitete
    Vermengung von Datensatzerstellung, Vortraining, Feinabstimmung und Inferenz. Genau diese Vermengung
    ist der Grund, warum OLG Hamburg (Datensatz) und LG München I (Modell und Ausgabe) scheinbar widersprechen,
    ohne dass sie dasselbe entschieden hätten. Wer die deutsche Divergenz sortieren will, braucht dieses
    Raster.

    '
