  kernthese: Die urheberrechtlichen Fragen der generativen KI zerfallen in drei getrennte Komplexe — Eingabe,
    Modell, Ausgabe —, die nicht einheitlich beantwortet werden können.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Zwei Seiten, die das Feld für Nichtjuristen aufgeschlossen haben und deshalb überproportional
    zitiert werden. Als Einstieg geeignet, dogmatisch dünn. Der Wert liegt in der Dreiteilung, die inzwischen
    Standard ist und der auch das EP-Gutachten Lucchi (Training / Creation / Regulation) folgt.

    '
