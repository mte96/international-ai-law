  titel: Creación y titularidad sobre activos de propiedad intelectual creados autónomamente por la inteligencia
    artificial
  titel_deutsch: Schöpfung und Inhaberschaft an autonom durch künstliche Intelligenz erzeugten Immaterialgütern
