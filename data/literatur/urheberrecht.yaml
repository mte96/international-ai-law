  kernthese: Die §§ 44b und 60d UrhG sind Ausdruck eines Paradigmenwechsels vom Werkgenuss zur Informationsnutzung
    und deshalb weit auszulegen.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Die einzige deutsche Monografie zur TDM-Schranke, die vor der KI-Debatte entstanden
    ist und deshalb unbelastet von ihr argumentiert — wertvoll gerade deswegen, weil sie zeigt, was der
    Gesetzgeber 2021 gemeint haben kann und was nicht. Überholt in allem, was generative Modelle betrifft:
    Die Arbeit kennt Diffusionsmodelle und große Sprachmodelle nicht. Als Beleg für den historischen Willen
    des Gesetzgebers brauchbar, als Antwort auf die heutige Frage nicht. Zugang: Open Access über DOAB,
    SSOAR und FreiDok Freiburg; die automatisierte Prüfung der Repositoriumsseiten scheiterte an Bot-Sperren,
    der Titel ist aber in allen drei Verzeichnissen als frei zugänglich verzeichnet.

    '
