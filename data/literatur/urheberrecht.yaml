  kernthese: Die Empörung über KI-Training speist sich aus Verteilungsgerechtigkeit, nicht aus Urheberrecht;
    Fair Use ist das falsche Werkzeug, um dieses Unbehagen zu bearbeiten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Nützlich, weil Sag die normative von der dogmatischen Frage trennt und damit erklärt,
    warum die deutsche und die amerikanische Debatte aneinander vorbeireden: In Deutschland wird das Verteilungsproblem
    über die Schranke plus Vergütung gelöst, in den USA über Fair Use — mit der Folge, dass die Verteilungsfrage
    im US-Recht keinen Ort hat und deshalb in Faktor vier hineingedrückt wird (Chhabria). Angreifbar:
    Sag unterschätzt, dass Marktverwässerung auch dogmatisch fassbar ist.

    '
  letzte_pruefung: 2026-08-27
