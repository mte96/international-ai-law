  kernthese: Bei langschwänzig verteilten Daten ist die Memorisierung einzelner, seltener Trainingsbeispiele
    nicht Nebenwirkung, sondern notwendige Bedingung annähernd optimaler Generalisierung — wer sie unterbindet,
    verschlechtert das Modell nachweislich, und zwar am stärksten für die kleinsten Untergruppen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob Memorisierung als Sorgfaltsverstoß konstruierbar ist — und
    die Antwort ist ein Nein, das die gesamte Sorgfaltsargumentation zwingt, sich neu zu begründen. Der
    wichtigste einzelne Text dieser Akte für die Frage, wo die juristische Debatte technisch danebenliegt.
    Feldman beweist, dass Memorisierung kein Fehler ist, der sich mit besserer Ingenieurskunst beheben
    ließe, sondern eine Eigenschaft, die aus der Datenverteilung folgt: Reale Sprach- und Bilddaten sind
    langschwänzig, ein großer Teil der Beispielklassen kommt nur ein- oder zweimal vor, und ein Lerner,
    der diese Beispiele nicht memorisiert, kann sie auch nicht generalisieren. Für das Recht folgen zwei
    Sätze in entgegengesetzte Richtungen, und beide sind unbequem. GEGEN DIE RECHTEINHABER: Ein Anspruch,
    der auf "das Modell hätte nicht memorisieren dürfen" gestützt wird, verlangt etwas, das nach dem Stand
    der Theorie mit dem Zweck des Trainings unvereinbar ist — nicht bloß teuer, sondern begrifflich ausgeschlossen.
    GEGEN DIE ANBIETER: Wenn Memorisierung notwendig ist, ist sie in Kauf genommen und nicht unvorhergesehen;
    die Berufung auf ein unbeabsichtigtes Nebenprodukt trägt nicht. Feldman liefert damit genau das, was
    der TDM-Diskussion fehlt — eine Aussage darüber, was technisch NICHT anders geht. ANGREIFBAR: Der
    Beweis betrifft die Memorisierung von LABELS in einem stilisierten Modell, nicht die wörtliche Speicherung
    längerer Textsequenzen; die Übertragung auf generative Modelle ist naheliegend, aber nicht bewiesen.
    Wer den Text als Beleg dafür zitiert, dass wörtliche Wiedergabe von Romanen notwendig sei, überdehnt
    ihn. Formal anspruchsvoll; Einleitung und Abschnitt 1 genügen.

    '
