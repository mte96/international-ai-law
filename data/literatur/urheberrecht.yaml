  kernthese: Statt den Opt-out zu verschärfen, sollte das Unionsrecht die TDM-Schranke mit einem unverzichtbaren
    Vergütungsanspruch verbinden, der über Verwertungsgesellschaften abgewickelt wird.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Ursprungstext der europäischen Vergütungslösung, frei zugänglich über das UvA-Repositorium,
    und die Grundlage praktisch aller späteren Vorschläge — einschließlich der Forderungen der Initiative
    Urheberrecht, des Deutschen Kulturrats und der Empfehlungen des EP-Gutachtens Lucchi. Senftlebens
    Pointe: Der Opt-out nützt nur denen, die technisch und wirtschaftlich in der Lage sind, ihn auszuüben
    — also nicht den einzelnen Urhebern, für die er gedacht war. Zusammen mit seinem Dreistufentest-Papier
    von 2025 zu lesen; dort argumentiert er, warum eine Schranke ohne Vergütung völkerrechtlich unzulässig
    sein könnte.

    '
