    die Rate ist gering, aber sie ist nicht null.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die empirische Grundlage, ohne die die juristische Debatte über Modellgewichte reine
    Spekulation bleibt — und der Befund, den der EWHC in Getty ./. Stability nicht adressiert, weil Getty
