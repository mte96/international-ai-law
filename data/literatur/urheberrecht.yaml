  - tdm-schranke-de
  kernthese: 'Die nationalen TDM-Schranken sind so unterschiedlich zugeschnitten, dass sie ein international
    inkohärentes Forschungsumfeld erzeugen; erforderlich sind neue, forschungsbezogene Schranken.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der einzige spanischsprachige Text zur TDM-Schranke, den ich in der lateinamerikanischen
    Literatur mit ernsthafter rechtsvergleichender Substanz gefunden habe — und der einzige, der das Problem
    aus der Perspektive einer Region beschreibt, die überhaupt keine TDM-Schranke hat. Das ist der entscheidende
    Punkt für einen deutschen Leser: Wir streiten über die Reichweite von § 44b UrhG und den Vorbehalt
    nach Abs. 3; Lateinamerika hat dagegen die Ausgangsnorm nicht, arbeitet mit dem geschlossenen Schrankenkatalog
    der Andengemeinschaftsentscheidung 351 und muss deshalb entweder die Zweckbindung des Vervielfältigungsrechts
    oder das Vertragsrecht bemühen. Izquierdo arbeitet das sauber heraus. Alter des Textes ist der Nachteil:
    2021 geschrieben, also vor allem, was seither geschah — die japanische Art.-30-4-Debatte, Singapur,
    die EU-Praxis, die US-Verfahren. Man liest ihn für die Ausgangslage, nicht für den Stand.

    '
  letzte_pruefung: 2026-09-07
- id: 2023-siniscalchi-dabus-argentina
  typ: aufsatz
  autoren:
  - Siniscalchi, Mariana
  titel: 'Patentes de invención e inteligencia artificial en Argentina: el caso DABUS'
  titel_deutsch: 'Erfindungspatente und künstliche Intelligenz in Argentinien: der Fall DABUS'
  fundstelle: Prudentia Iuris 96 (2023)
  jahr: 2023
  sprache: es
  url: https://erevistas.uca.edu.ar/index.php/PRUDENTIA/es/article/view/6975
