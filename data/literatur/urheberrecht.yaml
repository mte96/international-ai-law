  - governance
  kernthese: Taiwan muss sich urheberrechtlich entscheiden, ob es generative KI als Entwicklungsziel oder
    als Schutzproblem behandelt; der Autor entwirft eine Strategie, die Trainingszugang und Verguetung
    der Rechteinhaber ins Verhaeltnis setzt.
  eigene_bewertung: 'Der aktuellste und fuer meine Fragestellung wichtigste taiwanische Text. Qiu Wencong
    forscht an der Academia Sinica und gehoert zu den Autoren, die die taiwanische Gesetzgebung tatsaechlich
    beeinflussen. Taiwan ist als Vergleichsfall besonders interessant, weil es urheberrechtlich zwischen
    den Bloecken steht: Das Urheberrechtsgesetz (著作權法) kennt in Art. 65 eine offene Faktorenabwaegung
    nach US-Vorbild, aber keine TDM-Schranke nach europaeischem Muster, und die Halbleiterindustrie erzeugt
    einen erheblichen Standortdruck zugunsten des Trainingszugangs. Genau diese Konstellation - Fair-Use-aehnliche
    Generalklausel plus industriepolitisches Interesse - fehlt in der europaeischen Diskussion. Zugang
    nur ueber Airiti beziehungsweise den Verlag; ich habe Titel, Fundstelle und DOI ueber Crossref geprueft,
    den Text nicht gelesen. Die Umschrift folgt Hanyu Pinyin.'
