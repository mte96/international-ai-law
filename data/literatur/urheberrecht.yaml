  kernthese: 'Nach geltendem chilenischem Recht (Ley 17.336) kann eine autonom erzeugte Schöpfung weder
    Werk sein noch einem Rechtsinhaber zugeordnet werden; sie fällt in die Gemeinfreiheit.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der chilenische Standardtext zur Schutzfähigkeitsfrage. Er ist nicht originell —
    die rechtsvergleichende Übersicht (USA, UK, DABUS) kennt man —, aber er beantwortet die Frage für
    das chilenische Recht ausdrücklich und mit Normbezug, und genau das braucht man, wenn man die Rechtslage
    zitieren muss. Bemerkenswert ist, dass Jadresic Simonetti anders als der britische Gesetzgeber (s.
    9 Abs. 3 CDPA) keine Auffanglösung zugunsten des "Veranlassers" konstruiert, sondern die Gemeinfreiheit
    hinnimmt. Wer die Bandbreite der möglichen Antworten auf die Frage nach computer-generated works sortiert,
    hat mit Chile den Pol der strengen Ablehnung.

    '
  letzte_pruefung: 2026-09-07
