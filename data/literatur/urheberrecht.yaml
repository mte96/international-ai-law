  bezug_streitstaende:
  - schutzfaehigkeit-output
  kernthese: 'Nach geltendem argentinischem Patentrecht (Ley 24.481) wäre eine Anmeldung mit einer KI
    als Erfinder zurückzuweisen; die Autorin empfiehlt eine gesetzliche Klarstellung.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der beste argentinische Text zur Schutzfähigkeitsfrage und der einzige, der die DABUS-Serie
    systematisch durchgeht und dann fragt, wie ein argentinisches Amt entscheiden müsste. Der hypothetische
    Zuschnitt ist ehrlich — in Argentinien liegt keine solche Anmeldung vor —, und er zwingt die Autorin
    dazu, die argentinischen Normen tatsächlich anzuwenden statt sich hinter ausländischen Entscheidungen
    zu verstecken. Für einen deutschen Leser ist der Vergleich mit BGH X ZB 5/22 (DABUS, Beschluss vom
    11.06.2024) unmittelbar aufschlussreich: Der BGH hat mit der Benennung des menschlichen Erfinders
    plus Hinweis auf das System eine Zwischenlösung gefunden, Siniscalchi hält eine solche Konstruktion
    für das argentinische Recht nicht für tragfähig und verlangt den Gesetzgeber. Wer die Bandbreite der
    DABUS-Antworten abbilden will, braucht diesen Text als das strengere Ende. Als Pflicht eingestuft,
    weil Argentinien sonst gar keinen belastbaren immaterialgüterrechtlichen Beitrag zu bieten hat.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-ordelin-propiedad-intelectual-transparencia
  typ: bericht
  autoren:
  - Ordelin Font, Jorge Luis
  titel: Derecho de la propiedad intelectual y transparencia de los sistemas de IA
  titel_deutsch: Immaterialgüterrecht und Transparenz von KI-Systemen
  fundstelle: Proyecto GuIA (CETyS, Universidad de San Andrés), Ausgabe 2021, veröffentlicht 2022
  jahr: 2022
  sprache: es
  url: https://proyectoguia.lat/wp-content/uploads/2022/04/Derechos-de-propiedad-intelectual.pdf
  zugang: open-access
  jurisdiktionen:
  - latam
  themenachsen:
  - urheberrecht
  - governance
  - gpai
  kernthese: 'Der Schutz von Geschäftsgeheimnissen und Software durch das Immaterialgüterrecht steht den
    Transparenzanforderungen an KI-Systeme entgegen; der Konflikt ist in Lateinamerika ungelöst.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Derselbe Autor wie bei "Cargas normativas", hier zu einem Konflikt, der in der europäischen
    Diskussion um Art. 11 und Anhang IV KI-VO und um die Reichweite des Auskunftsanspruchs bei automatisierten
    Entscheidungen (EuGH, Rs. C-203/22 Dun & Bradstreet Austria, Urteil vom 27.02.2025) ganz oben steht.
    Ordelin Font arbeitet ihn für Lateinamerika heraus, wo der Schutz des Geschäftsgeheimnisses über die
    TRIPS-Umsetzung und die Andengemeinschaftsentscheidung 486 läuft und die Transparenzseite praktisch
    keine Norm hat — das Kräfteverhältnis ist also eindeutiger als bei uns. Kurz, als Politikpapier geschrieben,
    ohne Rechtsprechung. Man liest es, um zu sehen, wie derselbe Konflikt aussieht, wenn eine der beiden
    Seiten unbewaffnet ist.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-oriakhogba-ip-ki-strategien
  typ: aufsatz
  autoren:
  - Oriakhogba, Desmond
  titel: Centering Intellectual Property in Artificial Intelligence Strategies in Africa Through a Techno-legal
    Analysis
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 29 (2026), 1-43
  jahr: 2026
  sprache: en
  url: https://perjournal.co.za/article/view/23855
  doi: 10.17159/1727-3781/2026/v29i0a23855
  zugang: open-access
  jurisdiktionen:
