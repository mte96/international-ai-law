  kernthese: 'Die urheberrechtliche Behandlung des Modelltrainings ist zugleich eine wettbewerbspolitische
    Weichenstellung: Ein hohes Schutzniveau beguenstigt die Anbieter, die sich Lizenzen leisten koennen,
    und verfestigt damit die Marktkonzentration.'
  eigene_bewertung: 'Das Argument, das in der deutschen Diskussion um Paragraf 44b UrhG und den Nutzungsvorbehalt
    zu selten faellt: Wer die Schranke eng auslegt, entscheidet damit auch ueber die Marktstruktur, weil
    nur die grossen Anbieter Lizenzen in der noetigen Breite erwerben koennen. Colangelo (Basilicata und
    Stanford) fuehrt das mit kartellrechtlichem Instrumentarium durch. Fuer den Streitstand fair-use-training
    und tdm-schranke-de ein zusaetzlicher Argumentationsstrang, der von der Verteilungsfrage wegfuehrt
    und zur Marktzutrittsfrage hinfuehrt. Die Fundstelle habe ich ueber das Inhaltsverzeichnis der Ausgabe
    September 2025 geprueft; die Endseite ist dort nicht ausgewiesen.'
