  kernthese: Das Training von Modellen an geschützten Werken ist regelmäßig Fair Use, weil es die Werke
    nicht wegen ihres Ausdrucks, sondern wegen der in ihnen enthaltenen unschützbaren Information nutzt.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, den jede Partei in jedem der US-Verfahren zitiert und an dem sich das US
    Copyright Office in Teil 3 ausdrücklich abarbeitet. Alsup argumentiert in Bartz faktisch mit Lemley/
    Casey, ohne sie zu nennen. Ohne diesen Aufsatz versteht man die amerikanische Diskussion nicht. Teilweise
    überholt: Der Text stammt aus der Zeit vor generativer KI und behandelt vor allem diskriminative Modelle.
    Zwei tragende Annahmen sind durch die Entwicklung erschüttert — erstens die Annahme, Modelle würden
    keine Ausdrucksformen speichern (Memorisierung; dazu Cooper/Grimmelmann), zweitens die Annahme, es
    gebe keinen Markt für Trainingslizenzen (den gibt es seit 2023). Chhabrias Marktverwässerungstheorie
    ist die direkte Antwort auf die zweite Annahme. Lesen als Ausgangspunkt, nicht als geltenden Stand.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - usc-17-107
