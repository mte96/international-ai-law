  kernthese: Die Anwendung der TDM-Schranken auf das Training generativer Modelle verstößt gegen den Dreistufentest
    der RBÜ, weil sie die normale Verwertung der Werke beeinträchtigt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die völkerrechtliche Gegenposition zur weiten Schranke, und die einzige, die den
    Streit aus dem nationalen Auslegungsrahmen heraushebt. Wenn Senftleben recht hat, ist die Frage nicht,
    ob § 44b UrhG das Training deckt, sondern ob er es überhaupt darf. Für den BGH-Termin am 03.09.2026
    relevant, weil der Dreistufentest über Art. 5 Abs. 5 InfoSoc-RL und Art. 7 Abs. 2 DSM-RL im Unionsrecht
    verankert ist und eine Vorlage an den EuGH rechtfertigen könnte. Angreifbar: Der Dreistufentest richtet
    sich an den Gesetzgeber, nicht an das auslegende Gericht — die Gegenauffassung dazu ist in der deutschen
    Literatur herrschend.

    '
