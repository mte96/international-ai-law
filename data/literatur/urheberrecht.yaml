    das Training kommerzieller Modelle; der Weg führt zwangsläufig zur Lizenzierung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die europäische Gegenposition zu Radeisen und zugleich der europäische Gegenpol zu
    Lee — Rosati argumentiert rechtsordnungsübergreifend, dass die Berufung auf Forschung und Lernen bei
    kommerziellem Training ein Etikettenschwindel ist. Ihre These vom "unentrinnbaren Lizenzhorizont"
    ist inzwischen teilweise Realität: Anthropic hat 1,5 Mrd. USD gezahlt, Suno und Udio haben sich verglichen,
    und die britische Regierung hat im März 2026 auf den Lizenzmarkt statt auf eine Schranke gesetzt.
    Rosati ist Mitherausgeberin des JIPLP und arbeitet auch beratend; die Nähe zur Rechteinhaberseite
    ist bei der Gewichtung zu berücksichtigen.

