  kernthese: Übliche Trainingskorpora enthalten massenhaft Duplikate; wer sie entfernt, erhält Modelle,
    die zehnmal seltener wörtlich aus dem Trainingsmaterial ausgeben — bei gleicher oder besserer Leistung
    und geringerem Rechenaufwand.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob es eine zumutbare, wirksame und kostenlose Maßnahme gegen
    Memorisierung gibt — die Voraussetzung jeder Sorgfaltspflicht und jedes Fahrlässigkeitsvorwurfs. Die
    Antwort ist ungewöhnlich eindeutig und deshalb juristisch scharf: Deduplizierung senkt die wörtliche
    Wiedergabe um etwa eine Größenordnung, verschlechtert das Modell nicht, sondern verbessert es, und
    spart Rechenzeit. Eine Maßnahme, die wirkt, nichts kostet und dem Verpflichteten nützt, ist der Musterfall
    der zumutbaren Vorkehrung — bei § 276 BGB, bei Art. 53 Abs. 1 lit. c KI-VO und bei der Frage, ob eine
    Nutzung "angemessene Schutzmaßnahmen" trifft. Wer heute ein Modell ohne Deduplizierung trainiert und
    dann memorisierungsbedingt in Anspruch genommen wird, hat mit diesem Text ein Problem; der Stand der
    Technik ist seit 2021 dokumentiert. Das berühmte Beispiel — ein 61-Wort-Satz, der über 60.000 Mal
    im Korpus stand — ist in Schriftsätzen unmittelbar verwendbar. ANGREIFBAR: Deduplizierung beseitigt
    die Memorisierung SELTENER Beispiele gerade nicht (dazu Feldman 2019, Carlini 2020); sie senkt die
    Häufigkeit, nicht das Prinzip. Wer sie als vollständige Abhilfe darstellt, überdehnt den Befund —
    und wer sie als wirkungslos abtut, ignoriert ihn.

    '
