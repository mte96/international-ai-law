  kernthese: Das Klonen von Stimmen durch KI trifft ein Schutzgut, fuer das weder Urheberrecht noch Leistungsschutzrecht
    noch das Recht am eigenen Bild einen passenden Tatbestand bereithalten; noetig sei ein eigenstaendiger
    Schutz der stimmlichen Identitaet.
  eigene_bewertung: 'Fuer die Frage nach dem Schutz der Stimme genau der Text, den ich gesucht habe, und
    er trifft sich in der Diagnose mit Jansen 2026 aus Suedafrika: Leistungsschutzrechte setzen eine Darbietung
    voraus, an der es bei rein synthetischer Nachbildung fehlt. In Deutschland wuerde man ueber das allgemeine
    Persoenlichkeitsrecht und Paragraf 823 Abs. 1 BGB gehen und mit der Herrenreiter- und der Marlene-Dietrich-Rechtsprechung
    argumentieren; ob das die kommerzielle Dimension des Stimmklonens erfasst, ist offen. Die Autoren
    arbeiten die verschiedenen Schutzansaetze rechtsvergleichend durch, was den Aufsatz fuer eine deutsche
    Argumentation unmittelbar verwertbar macht. Frei zugaenglich.'
