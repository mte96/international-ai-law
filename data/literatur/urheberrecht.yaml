  kernthese: Generative Systeme stellen das taiwanische Urheberrecht an zwei Stellen in Frage - beim Training
    an geschuetzten Werken und bei der Schutzfaehigkeit der Ausgaben -, und beide lassen sich mit dem
    geltenden Recht nur unvollstaendig beantworten.
  eigene_bewertung: Huang Mingjie ist emeritierter Professor der National Taiwan University und einer
    der meistzitierten Immaterialgueterrechtler Taiwans; sein Wort hat in der dortigen Reformdiskussion
    Gewicht. Der Aufsatz eroeffnet ein Schwerpunktheft der wichtigsten taiwanischen Rechtszeitschrift
    und ist damit die beste Orientierung ueber den Stand der dortigen Diskussion. Fuer den Rechtsvergleich
    interessiert mich vor allem, wie die Fair-Use-Abwaegung des Art. 65 taiwanisches Urheberrechtsgesetz
    auf das Training angewandt wird - eine Frage, die in Taiwan anders als in Deutschland ohne Schrankentatbestand
    auskommt. Nur ueber den Verlag zugaenglich.
