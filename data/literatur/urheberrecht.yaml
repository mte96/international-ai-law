  kernthese: Eine weite Fair-Use-Auslegung ist geboten, weil restriktives Urheberrecht Trainingsdaten
    auf gemeinfreie und altersverzerrte Korpora verengt und dadurch Verzerrungen in Modellen verstärkt.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Das grundrechtliche Argument für die weite Schranke, das in der US-Debatte unterschätzt
    wird und in der europäischen fast vollständig fehlt. Empirisch inzwischen überholt — moderne Korpora
    sind nicht mehr Enron-E-Mails und Public-Domain-Bücher — aber die Argumentationsfigur (Schranke als
    Instrument der Datenvielfalt) taucht 2025/26 in den Stellungnahmen von EFF und Authors Alliance unverändert
    wieder auf.

    '
  letzte_pruefung: 2026-08-27
