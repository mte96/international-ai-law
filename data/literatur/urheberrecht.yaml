  kernthese: 'Die Fair-Use-Verteidigung beruht auf einer technischen Fiktion: Generative Modelle speichern
    Ausdruck in ihren Parametern und erzeugen Konkurrenzware, weshalb weder Faktor eins noch Faktor vier
    für sie streiten.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die stärkste akademische Gegenposition zu Fair Use, geschrieben von der ehemaligen
    General Counsel des Copyright Office — was erklärt, warum Teil 3 des Berichts ihrer Linie folgt. Charlesworth
    argumentiert genau dort, wo die europäischen Gerichte im Herbst 2025 gelandet sind: dass das Modell
    selbst Ausdruck enthält. Ihre Arbeit ist damit die brauchbarste Brücke, um den amerikanischen und
    den deutschen Streitstand aufeinander zu beziehen. Angreifbar ist die technische Prämisse (dazu Cooper/
    Grimmelmann), und der Aufsatz stammt aus der Zeit vor allen drei Urteilen — er kennt weder Alsups
    Zweiteilung noch Chhabrias Ausformung der Marktverwässerung.

    '
