  kernthese: Eine Prüfung von über 1.800 Textdatensätzen ergibt, dass mehr als 70 Prozent keine Lizenzangabe
    führen und die Angaben auf den großen Verteilplattformen zu über 50 Prozent falsch sind.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob ein Anbieter die Lizenzlage seiner Trainingsdaten überhaupt
    kennen KANN — die Vorfrage jeder Sorgfalts-, Verschuldens- und Dokumentationspflicht, insbesondere
    der "hinreichend detaillierten Zusammenfassung" nach Art. 53 Abs. 1 lit. d KI-VO. Der Befund ist für
    beide Seiten verwendbar und deshalb wertvoll. ENTLASTEND: Wer einen Datensatz von einer etablierten
    Plattform bezieht und dessen Lizenzangabe vertraut, handelt nicht ohne weiteres fahrlässig, wenn diese
    Angaben zu über der Hälfte falsch sind — die Fehlerquote ist objektiv und dokumentiert. BELASTEND:
    Wer weiß, dass die Angaben zu über der Hälfte falsch sind, kann sich auf sie gerade nicht verlassen;
    nach Veröffentlichung dieser Prüfung ist blindes Vertrauen selbst der Sorgfaltsverstoß. Der Wendepunkt
    liegt damit auf Oktober 2023, und das ist ein Datum, mit dem sich argumentieren lässt. Zweiter Ertrag:
    Die Prüfung zeigt, dass die attraktivsten Bestände — Sprachen mit wenig Material, synthetische Daten
    — überwiegend proprietär sind, was den Marktzutritt für kleine Anbieter unabhängig vom Urheberrecht
    erschwert. Die Verfasser betreiben ein fortgeschriebenes Verzeichnis, das für Beweiszwecke nutzbar
    ist. ANGREIFBAR: geprüft wurden Datensätze zur Feinabstimmung, nicht die Vortrainingskorpora, um die
    in den Verfahren gestritten wird; die Übertragung auf Common Crawl und Books3 ist naheliegend, aber
    nicht gemessen. Longpre u.a., Consent in Crisis (2024), ist die Fortsetzung und steht in 30_lit_urheberrecht.yaml.

    '
  letzte_pruefung: 2026-08-27
