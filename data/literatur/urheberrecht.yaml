  themenachsen:
  - urheberrecht
  - governance
  - marktzugang
  kernthese: Ob Afrika fuer KI neue Immaterialgueterregeln braucht, laesst sich nicht pauschal beantworten,
    sondern haengt vom jeweiligen Einzelproblem ab; die elf vorliegenden nationalen KI-Strategien und
    die AU-Strategie sollten IP menschenzentriert und entwicklungsorientiert einordnen, statt das Schutzniveau
    pauschal anzuheben oder abzusenken.
  eigene_bewertung: 'Der beste Einstieg in die suedafrikanische und panafrikanische IP-Debatte zu KI,
    den ich gefunden habe. Oriakhogba arbeitet die Strategiepapiere systematisch durch und vergleicht
    mit US, China, Australien und EU - fuer mich als deutschen Juristen ist besonders brauchbar, dass
    er die Frage "neue Regeln oder Anwendung der alten" genau so stellt, wie sie sich bei uns im Streit
    um Paragraf 44b UrhG stellt, aber unter voellig anderen Vorzeichen: Es geht ihm um Zugang zu Trainingsdaten
    als Entwicklungsfrage, nicht um Verguetung als Verteilungsfrage. Schwach ist der Text dort, wo er
    dogmatisch werden muesste: Zum suedafrikanischen Copyright Act 98 of 1978 und zur seit Jahren blockierten
    Copyright Amendment Bill sagt er weniger, als der Titel verspricht. Man braucht ihn fuer den Rahmen,
    nicht fuer die Subsumtion.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  letzte_pruefung: 2026-09-07
- id: 2026-jansen-performers-rights-ki
  typ: aufsatz
  autoren:
  - Jansen, Gretchen
  titel: Demystifying Performers' Rights in the Age of Artificial Intelligence
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 29 (2026), Beitrag a22804
  jahr: 2026
  sprache: en
  url: https://perjournal.co.za/article/view/22804
  doi: 10.17159/1727-3781/2026/v29i0a22804
  zugang: open-access
  jurisdiktionen:
  - za
  themenachsen:
  - urheberrecht
  - content
  - grundrechte
  kernthese: Der Performers' Protection Act 11 of 1967 taugt nicht zur Bewaeltigung von Deepfakes, weil
    Leistungsschutzrechte eine geschuetzte Darbietung voraussetzen, an der es bei rein synthetischer Nachbildung
    gerade fehlt; wer nicht unter den gesetzlichen Begriff des "performer" faellt, steht voellig schutzlos.
  eigene_bewertung: 'Fuer die deutsche Diskussion ueberraschend anschlussfaehig. Jansen fuehrt exakt den
    Nachweis, den man auch fuer Paragraf 73 ff. UrhG fuehren muss: Das Leistungsschutzrecht des ausuebenden
    Kuenstlers knuepft an eine tatsaechliche Darbietung an und laeuft bei rein generierter Stimm- und
    Bildimitation leer. Die Folgerung, dass man deshalb ueber das allgemeine Persoenlichkeitsrecht gehen
    muss, zieht sie fuer Suedafrika ueber die dignitas-Rechtsprechung; das ist die interessanteste Parallele
    zu unserem Recht am eigenen Bild und an der eigenen Stimme. Schwaeche: Sie verarbeitet die suedafrikanische
    Copyright Amendment Bill nur am Rande, obwohl deren Schicksal die Frage praktisch entscheidet. Trotzdem
    der beste Deepfake-Text aus Suedafrika, den ich kenne.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2025-karjiker-rousseau-computergenerierte-werke
  typ: aufsatz
  autoren:
  - Karjiker, Sadulla
  - Rousseau, G.
  titel: Analysing computer-generated works in South African copyright law in the age of artificial intelligence
  fundstelle: Tydskrif vir die Suid-Afrikaanse Reg (TSAR) 2025, Heft 4, 727-759
  jahr: 2025
  sprache: en
  doi: 10.47348/tsar/2025/i4a5
  zugang: bezahlt
  jurisdiktionen:
  - za
  themenachsen:
  - urheberrecht
  - content
  kernthese: Die Regelung ueber computergenerierte Werke im suedafrikanischen Copyright Act 98 of 1978
    - Suedafrika gehoert zu der Handvoll Staaten mit einer solchen Vorschrift - traegt die Zurechnung
    generativ erzeugter Ausgaben nicht, weil der Begriff des "author" als derjenige, der die noetigen
    Vorkehrungen trifft, bei Grundmodellen niemanden mehr eindeutig bezeichnet.
  eigene_bewertung: Der fuer den Streitstand schutzfaehigkeit-output wichtigste suedafrikanische Text.
    Suedafrika hat - wie das Vereinigte Koenigreich mit s 9(3) CDPA, Indien, Irland, Neuseeland und Hongkong
    - eine ausdrueckliche Norm fuer computergenerierte Werke; die Kommentierung dieser Norm im Zeitalter
    generativer Modelle ist genau die Frage, die im deutschen Recht mangels Parallelnorm gar nicht erst
    gestellt werden kann. Wer argumentieren will, dass eine Zurechnungsnorm das Problem nicht loest, sondern
    nur verschiebt, findet hier die Belegstelle aus einer Rechtsordnung, die es versucht hat. Karjiker
    ist Inhaber des Anton-Mostert-Lehrstuhls fuer Immaterialgueterrecht in Stellenbosch, der Text ist
    entsprechend solide. Nur ueber Juta zugaenglich - Metadaten geprueft, Volltext nicht.
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2025-miggels-fair-use-suedafrika
  typ: aufsatz
  autoren:
  - Miggels, Alvizo
  titel: The implementation of the fair use exception into South African copyright law in the age of artificial
    intelligence
  fundstelle: South African Intellectual Property Law Journal 13 (2025), Heft 2, 45-72
  jahr: 2025
  sprache: en
  doi: 10.47348/saipl/v13/i2a3
  zugang: bezahlt
  jurisdiktionen:
  - za
  themenachsen:
  - urheberrecht
  - content
  kernthese: Die in der Copyright Amendment Bill vorgesehene Einfuehrung einer offenen Fair-Use-Schranke
    nach US-Vorbild ist gerade wegen der Trainingsfrage geboten, weil das geltende suedafrikanische Recht
    nur einen geschlossenen Katalog von Schrankentatbestaenden kennt, der Text und Data Mining nicht erfasst.
  eigene_bewertung: 'Genau der Text, den man fuer den Rechtsvergleich beim Streitstand fair-use-training
    braucht: Suedafrika ist die Rechtsordnung, in der die Frage "geschlossener Schrankenkatalog oder offene
    Generalklausel" seit ueber zehn Jahren gesetzgeberisch offen ist - die Copyright Amendment Bill liegt
    seit 2017 zwischen Parlament und Praesident hin und her, zuletzt wegen verfassungsrechtlicher Bedenken.
    Miggels argumentiert fuer Fair Use ausdruecklich mit dem KI-Argument; das ist die Umkehrung der europaeischen
    Debatte, in der Paragraf 44b UrhG und Art. 4 DSM-RL als zu weit kritisiert werden. Ich lese ihn als
    Beleg dafuer, dass die Schrankensystematik selbst zum Standortargument geworden ist. Nur ueber Juta.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2024-vyas-schirru-indisches-urheberrecht-genai
  typ: aufsatz
  autoren:
  - Vyas, Lokesh
  - Schirru, Luca
  titel: 'Indian Copyright Law in the Age of GenAI: Knowledge/Power, Patchwork, and Peril'
  fundstelle: Indian Journal of Law and Technology 20 (2024), Heft 2, Beitrag 2
  jahr: 2024
  sprache: en
  url: https://repository.nls.ac.in/ijlt/vol20/iss2/2
  doi: 10.55496/ZGDS8505
  zugang: open-access
  jurisdiktionen:
  - in
  themenachsen:
  - urheberrecht
  - content
  - governance
  kernthese: Die indische Debatte ueber generative KI und Urheberrecht hat sich vorschnell auf die importierten
    Kategorien fair dealing, Lizenzierung und Schranken verengt; die Autoren fragen mit Foucault nach
    den Machtstrukturen, die diese Verengung erzeugen, und halten die Frage offen, was das Urheberrecht
    heute ueberhaupt leisten soll.
  eigene_bewertung: 'Der theoretisch anspruchsvollste indische Beitrag, den ich gefunden habe, und der
    einzige, der die eigene Diskursbildung zum Gegenstand macht. Der Befund ist auch fuer Europa richtig:
    Wir diskutieren Paragraf 44b UrhG und Art. 53 Abs. 1 lit. c KI-VO in Kategorien, die aus dem US-Fair-Use-Streit
    stammen, ohne zu pruefen, ob sie zu unserem Schrankensystem passen. Indien ist dabei ein besonders
    klarer Fall, weil section 52 des Copyright Act 1957 ein geschlossener fair-dealing-Katalog ist und
    zugleich section 2(d)(vi) den Urheber computergenerierter Werke bestimmt - eine Kombination, die es
    in Europa nicht gibt. Nachteil: Der Text kritisiert den Rahmen, ohne einen eigenen zu liefern. Fuer
    die Subsumtion unbrauchbar, fuer die Reflexion wertvoll.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  letzte_pruefung: 2026-09-07
- id: 2024-agrawal-human-enablement-copyright
  typ: aufsatz
  autoren:
  - Agrawal, Akshat
  titel: A Human Enablement Theory of Copyright
  fundstelle: Indian Journal of Law and Technology 20 (2024), Heft 2, Beitrag 1
  jahr: 2024
  sprache: en
