  kernthese: 'Generative KI kehrt die urheberrechtliche Grundstruktur um: Die schöpferische Leistung liegt
    nicht mehr in der Ausführung, sondern in der Frage — und genau die schützt das Urheberrecht nicht.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die klarste Formulierung des Grundproblems hinter dem Streitstand `schutzfähigkeit-output`.
    Lemleys Befund erklärt, warum die USA (Human Authorship, Prompt genügt nicht), China (Li ./. Liu:
    Steuerungstiefe genügt) und Mexiko (kein Schutz, Gemeinfreiheit) zu drei verschiedenen Ergebnissen
    kommen können, ohne dass eine der drei Positionen dogmatisch zwingend falsch wäre: Sie gewichten dieselbe
    Umkehrung unterschiedlich.

    '
