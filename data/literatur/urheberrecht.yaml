  kernthese: Die urheberrechtlichen Kategorien der Werkverbindung und der Werkarten muessen im KI-Zeitalter
    neu bestimmt werden, weil generierte Bestandteile sich weder als Bearbeitung noch als Miturheberschaft
    einordnen lassen.
  eigene_bewertung: Cai Mingcheng war Richter am taiwanischen Verfassungsgericht und ist einer der Begruender
    der dortigen Immaterialgueterrechtswissenschaft; der Beitrag hat entsprechendes Gewicht, ist aber
    dogmatisch enger als der Titel vermuten laesst. Die Frage, wie sich ein Werk einordnen laesst, das
    zu Teilen generiert und zu Teilen menschlich geschaffen ist, entspricht unserer Diskussion um Paragraf
