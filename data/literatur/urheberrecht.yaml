  kernthese: Wer erfundene, hinreichend lange und hinreichend oft wiederholte Textstücke in sein Werk
    einbettet, kann später nachweisen, dass ein Modell auf diesem Werk trainiert wurde — auch dort, wo
    natürliche Memorisierung nicht auftritt.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wie ein Rechteinhaber sich den Beweis verschafft, den ihm Duan
    u.a. gerade abgesprochen haben — durch Gestaltung des eigenen Werks statt durch Analyse des fremden
    Modells. Der einzige Text dieser Akte, der ein Beweismittel KONSTRUIERT statt es zu bewerten, und
    deshalb für die Beratungspraxis der interessanteste: Verlage, Presseverlage und Datenbankanbieter
    können die Fallen heute einbauen; die Wirkung tritt erst bei künftigen Trainingsläufen ein. Wer Mandanten
    auf der Rechteinhaberseite berät, sollte den Vorschlag kennen, bevor die Gegenseite ihn kennt. Der
    Anschluss an das deutsche Recht ist naheliegend, aber unbearbeitet: Eine Falle ist eine technische
    Maßnahme im weiteren Sinn, aber keine im Sinne des § 95a UrhG, und ihr Verhältnis zum maschinenlesbaren
    Nutzungsvorbehalt nach § 44b Abs. 3 UrhG ist offen. ANGREIFBAR: mehrfach. Erstens brauchen die Fallen
    erhebliche Wiederholungszahlen, was Werke unlesbar macht (die Autoren verstecken sie in nicht angezeigtem
    HTML — was seinerseits an Manipulationsvorwürfe grenzt). Zweitens sind sie durch Deduplizierung entfernbar,
    also gerade durch die Maßnahme, die der Anbieter ohnehin schuldet. Drittens gemessen an einem 1,3-Milliarden-Parameter-Modell;
    die Übertragbarkeit auf Frontier-Modelle ist offen.

    '
