  kernthese: Der Opt-out ist technisch nicht umsetzbar und marktverzerrend; stattdessen sollte vorkommerzielle
    Forschung klar freigestellt und im Übrigen Transparenz mit angemessener Beteiligung der Urheber verbunden
    werden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die wissenschaftliche Grundlage der britischen Kehrtwende, offen zugänglich, und
    die einzige Arbeit im Feld, die 83 tatsächlich geschlossene Lizenzverträge zwischen Inhalteanbietern
    und KI-Entwicklern ausgewertet hat. Das macht sie zur besten empirischen Quelle über den Lizenzmarkt,
    den alle Beteiligten behaupten oder bestreiten. Der zentrale Befund für die deutsche Debatte: Lizenzeinnahmen
    der Verlage und Plattformen erreichen die Urheber nicht — was genau Senftlebens Argument gegen den
    Opt-out empirisch belegt und die Vergütungsdebatte in eine andere Richtung lenkt als die der Verwertungsgesellschaften.

    '
