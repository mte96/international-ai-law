  kernthese: Urheber ist, wer die Ausgabe konzipiert und ihre Ausführung so weit steuert, dass das Ergebnis
    ihm zurechenbar bleibt; Maschinen sind Werkzeuge, nie Urheber.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das dogmatische Fundament des amerikanischen Human-Authorship- Erfordernisses, auf
    das sich das Copyright Office in Teil 2 ausdrücklich stützt. Bemerkenswert für den Rechtsvergleich:
    Der von Ginsburg/Budiardjo entwickelte Maßstab "Konzeption plus Ausführungskontrolle" ist inhaltlich
    fast deckungsgleich mit dem chinesischen Steuerungsansatz in Li ./. Liu — die Divergenz zwischen Washington
    und Peking liegt nicht im Maßstab, sondern in der Schwelle, ab der Prompting als Ausführungskontrolle
    zählt. Wer die Divergenz beschreiben will, sollte das nicht als Prinzipienstreit darstellen.

    '
