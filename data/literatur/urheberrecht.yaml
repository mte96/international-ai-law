  kernthese: Art. 30-4 des japanischen Urheberrechtsgesetzes erlaubt jede Nutzung, die nicht auf den Genuss
    des Werkausdrucks gerichtet ist — die weiteste Trainingsschranke der Welt, aber mit einer Missbrauchsgrenze.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der maßgebliche Text zur japanischen Regelung, geschrieben von dem Wissenschaftler,
    der an ihr mitgewirkt hat. Wichtig für den Rechtsvergleich, weil Japan als "Trainingsparadies" firmiert,
    obwohl Art. 30-4 einen Vorbehalt für Nutzungen enthält, die "die Interessen des Rechteinhabers unbillig
    beeinträchtigen" — eine Klausel, die die Kulturbehörde 2024 in ihren Leitlinien genau in Richtung
    der europäischen Diskussion ausgelegt hat. Wer die Behauptung prüfen will, Japan erlaube alles, muss
    diese Grenze kennen. Bei Oxford Academic nur das Abstract frei; freie Alternative ist Uenos WIPO-Vortragsfassung
    "General Understanding on AI and Copyright in Japan".

    '
