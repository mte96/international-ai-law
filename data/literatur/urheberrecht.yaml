  kernthese: 'Das Copyright Office irrt: Skalierung als Trainingsmethode stammt aus der universitären
    Forschung, ist transformativ im Sinne von Google und Warhol, und Marktverwässerung durch nicht-verletzende
    Erzeugnisse ist kein anerkannter Schaden.'
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die systematischste Widerlegung des Copyright-Office-Berichts und damit der notwendige
    Gegenpol zu ihm — beide zusammen ergeben den Streitstand `fair-use-training` vollständig, keiner allein.
    Lees Beitrag besteht in zwei Punkten: erstens der wissenschaftshistorischen Rekonstruktion, dass die
    Skalierung auf große Korpora eine Erkenntnis universitärer Forschung war und keine kommerzielle Umgehungsstrategie;
    zweitens dem dogmatischen Nachweis, dass die Marktverwässerungstheorie das Urheberrecht zu einem Konkurrenzschutzrecht
    macht. Angreifbar: Lee behandelt die Beschaffungsfrage stiefmütterlich. Genau daran ist Anthropic
    mit 1,5 Mrd. USD gescheitert, und genau dort liegt der Punkt, an dem Alsup und Chhabria sich einig
    waren.

    '
