  kernthese: Der Schutzfaehigkeit KI-erzeugter Inhalte stehen drei voneinander unabhaengige Hindernisse
    entgegen - das Erfordernis menschlicher Urheberschaft, der Nachweis schoepferischer Auswahlentscheidungen
    und die Bestimmbarkeit des geschuetzten Gegenstands.
  eigene_bewertung: 'Der klarste mir bekannte Beitrag zum Streitstand schutzfaehigkeit-output aus asiatischer
    Perspektive. Die Dreiteilung ist analytisch nuetzlich, weil sie zeigt, dass die verbreitete Fokussierung
    auf das Merkmal der menschlichen Schoepfung zu kurz greift: Selbst wenn man dieses Erfordernis aufgibt
    - wie es die chinesische Rechtsprechung in Li v Liu 2023 im Ergebnis getan hat -, bleiben die beiden
    anderen Huerden bestehen. Fuer die Auslegung von Paragraf 2 Abs. 2 UrhG und die Frage, wie viel Promptarbeit
    eine persoenliche geistige Schoepfung begruendet, ist das die praezisere Fragestellung. He lehrt in
    Hongkong, publiziert hier in Singapur; die Perspektive ist ostasiatisch-rechtsvergleichend. Frei zugaenglich.'
