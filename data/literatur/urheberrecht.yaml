  kernthese: Das Training generativer Modelle ist kein Text und Data Mining im Sinne der §§ 44b, 60d UrhG,
    weil es nicht auf Informationsgewinnung, sondern auf Speicherung von Ausdruck in den Modellparametern
    gerichtet ist.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die Arbeit, der das LG München I in GEMA ./. OpenAI in der Sache gefolgt ist und
    an der sich das OLG Hamburg in LAION abarbeitet. Ohne sie versteht man die deutsche Divergenz nicht.
    Die Besonderheit ist die Doppelautorschaft: Stober ist Informatiker, weshalb der technische Teil belastbarer
    ist als in der übrigen deutschen Literatur — und weshalb die Gegenargumentation an ihm ansetzen muss,
    nicht an der juristischen Subsumtion. Angreifbar an drei Stellen. Erstens ist die Studie von der Initiative
    Urheberrecht in Auftrag gegeben, was sie nicht falsch macht, aber bei der Gewichtung zu berücksichtigen
    ist. Zweitens ist die These, die Modellparameter enthielten Vervielfältigungen, in dieser Allgemeinheit
    durch die Memorisierungsforschung nicht gedeckt (Cooper/Grimmelmann; Getty ./. Stability). Drittens
    verengt die Studie den TDM-Begriff auf "Informationsgewinnung" enger als Art. 2 Nr. 2 DSM-RL es hergibt
    — genau hier hat das OLG Hamburg widersprochen. Der BGH verhandelt am 03.09.2026 über eben diese Frage.
    Englische Fassung siehe 2025-dornis-stober-arxiv-en.

    '
