  kernthese: Maschinelles Lernen internalisiert Muster, statt Werke zu speichern; China sollte eine ausdrückliche
    Schranke für maschinelles Lernen einführen, weil der geschlossene Katalog des Art. 24 UrhG-China die
    Frage sonst nicht lösen kann.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die beste frei zugängliche Darstellung der chinesischen Diskussionslage, aus einem
    Sonderheft des German Law Journal zum Rechtsvergleich — für einen deutschen Leser deshalb doppelt
    nützlich, weil die Autoren die chinesische Lage bewusst gegen die europäische halten. Zentral ist
    der Befund, dass China keine Generalklausel wie Fair Use hat und dass die Trainingsfreiheit dort faktisch
    durch Nichtverfolgung entsteht, nicht durch eine Schranke. Die Autoren argumentieren offen für eine
    Trainingsschranke; die Gegenposition (You/Luo) ist erfasst.

    '
