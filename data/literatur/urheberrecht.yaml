  bezug_regelwerke:
  - de-urhg-tdm
  - ki-vo-2024-1689
  kernthese: Memorisierung wächst log-linear mit drei Größen — Modellkapazität, Häufigkeit des Beispiels
    im Trainingskorpus und Länge des vorgegebenen Kontexts —, ist also nicht Zufall, sondern eine vorhersagbare
    Funktion von Entwurfsentscheidungen.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob Memorisierung eine steuerbare Entwurfsvariable ist — die Voraussetzung
    dafür, aus ihr überhaupt eine Sorgfaltspflicht (Art. 53 Abs. 1 lit. c KI-VO, § 44b Abs. 3 UrhG) oder
    ein Verschulden abzuleiten. PFLICHT, weil dieser Text die Brücke von "es passiert" zu "es ist beherrschbar"
    schlägt, und weil beide Skalierungsrichtungen juristisch scharf sind. Nach OBEN: Memorisierung wächst
    mit der Modellgröße — das ist Konertz'' (WRP 2026, 148) Argument, jedes hinreichend große Modell wäre
    bei der Prämisse des LG München I rechtswidrig, in seiner empirischen Grundlage. Nach UNTEN: Memorisierung
    wächst mit der Duplikatzahl — also ist Deduplizierung (dazu 2021-lee-deduplicating) eine zumutbare
    Maßnahme, deren Unterlassen vorwerfbar sein kann. Die dritte Achse, Kontextlänge, ist die praktisch
    wichtigste und die am seltensten zitierte: Je mehr Text man vorgibt, desto eher setzt das Modell wörtlich
    fort. Daraus folgt für die Beweisaufnahme, dass jede Extraktionsdemonstration danach zu befragen ist,
    wie viel Kontext der Prüfer vorgegeben hat — ein Prompt, der 500 Zeichen des Werks enthält, beweist
    nichts über die Speicherung im Modell. ANGREIFBAR: gemessen an GPT-Neo/Pythia-Modellen bis 6 Mrd.
    Parameter; die Extrapolation auf heutige Größenordnungen ist plausibel, aber nicht gemessen — Cooper
    u.a. (2025) zeigen, dass sie nicht einfach linear fortschreibbar ist. 12 Seiten, drei Diagramme, die
    man auch ohne Statistikkenntnisse lesen kann.

    '
  letzte_pruefung: 2026-08-27
