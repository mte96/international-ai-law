  kernthese: Weil Transaktionskosten direkte Lizenzverhandlungen zwischen Rechteinhabern und Modellanbietern
    verhindern, kann ein Ex-post-Mechanismus wie Fair Use eine höhere erwartete Wohlfahrt erzeugen als
    ein Ausschliesslichkeitsrecht.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche ökonomische Arbeit zu den Lizenzmärkten für Trainingsdaten, inzwischen
    im Journal of Law and Economics erschienen, als NBER-Fassung frei. Gans'' Ergebnis ist für die europäische
    Debatte unbequem, weil es die Vergütungslösung nicht stützt: Eine gesetzliche Lizenz senkt Transaktionskosten
    zwar, erzeugt aber Bewertungskosten, die bei heterogenen Werkbeständen prohibitiv werden. Einschränkung:
    Das Modell unterstellt einen einzigen Anbieter und einen homogenen Werkbestand — genau die Annahmen,
    die Samuelson 2026 als unrealistisch verwirft.

    '
