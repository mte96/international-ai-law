  kernthese: Über 13 offene Modelle hinweg memorisieren auch die größten Modelle die meisten Bücher weder
    ganz noch in Teilen — aber einzelne Modell-Werk-Paare, etwa Llama 3.1 70B und Harry Potter, zeigen
    nahezu vollständige Memorisierung; der Befund ist modell- und werkabhängig und stützt keine der beiden
    Prozessparteien.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die Tatsachenfrage, wie sie sich einem Gericht 2026 tatsächlich
    stellt — nicht "memorisieren Sprachmodelle?", sondern "memorisiert DIESES Modell DIESES Werk?". PFLICHT,
    aus drei Gründen. Erstens ist es die aktuellste belastbare Messung, und sie ist ausdrücklich auf Bücher
    und damit auf den Streitgegenstand der anhängigen Verfahren zugeschnitten (Books3 — das Korpus, um
    das es in Kadrey und Bartz geht). Zweitens ist die Autorenschaft bemerkenswert: Lemley und Ho sind
    Juristen, Liang und De Sa Informatiker; die Arbeit ist so gebaut, dass sie vor Gericht verwendbar
    ist, und ihre Verfasser haben die Absicht ausgesprochen. Drittens — und das ist der eigentliche Wert
    — widersteht sie beiden Vereinfachungen ausdrücklich: "die Belege haben urheberrechtliche Folgen,
    aber keine, die eindeutig eine Seite begünstigen". Wer nach einem Text sucht, der die Gegenseite erledigt,
    findet ihn hier nicht; wer prüfen will, wie ein Sachverständigengutachten in diesem Feld auszusehen
    hat, findet die Vorlage. Praktischer Ertrag für die deutsche Diskussion: Die Feststellung, dass Memorisierung
    werkabhängig ist, spricht gegen die pauschalierende Prämisse des LG München I ebenso wie gegen die
    pauschale Entlastung — sie zwingt zur Einzelfallprüfung je Werk, mit den entsprechenden Folgen für
    Streitwert, Klageantrag und Beweisaufnahme. ANGREIFBAR: nur offene Modelle, weil die Methode Zugriff
    auf die Gewichte braucht. Über GPT-4, Claude und Gemini sagt sie nichts — und das sind die Modelle,
    um die in Deutschland gestritten wird.

    '
