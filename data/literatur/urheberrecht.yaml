  kernthese: Training auf geschützten Werken ist nicht pauschal Fair Use; Transformativität nimmt ab,
    je näher die Ausgabe an den Werken der Trainingsmenge liegt, und der vierte Faktor erfasst auch Marktverwässerung
    durch nicht-verletzende Konkurrenzware.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Bericht ist der Ausgangspunkt jeder Diskussion über den Streitstand `fair-use-training`,
    weil er die Marktverwässerung als vierten-Faktor-Argument überhaupt erst in die Debatte eingeführt
    hat — sechs Wochen bevor Chhabria sie in Kadrey aufgriff. Die drei US-Urteile vom Juni 2025 lassen
    sich als drei Antworten auf diesen Bericht lesen: Alsup ignoriert ihn, Chhabria übernimmt seine Kernthese,
    Bibas hatte im Februar 2025 bereits ohne ihn ähnlich entschieden. Politisch belastet: Registerin Perlmutter
    wurde einen Tag nach Veröffentlichung entlassen, der Bericht ist bis heute nur als "pre-publication
    version" verfügbar und seine institutionelle Autorität ist umstritten. Das ist ein Argument gegen
    sein Gewicht vor Gericht, keines gegen seine Lektüre — er ist die bestbelegte Zusammenstellung des
    Streitstands, die es gibt, mit Auswertung von über 10.000 Konsultationsantworten. Gegenposition dazu
    ausdrücklich: Lee (2025) und EFF (2025).

    '
