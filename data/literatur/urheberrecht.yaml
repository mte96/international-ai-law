  kernthese: Der Konflikt zwischen Presseverlegern und KI-Systemen ist kein Eigentums-, sondern ein Lauterkeitsproblem;
    das Presseverlegerrecht ist gescheitert, weil Ausschliesslichkeitsrechte nur wirken, wenn jemand lizenzieren
    will.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die konsequenteste Absage an den urheberrechtlichen Lösungsweg aus deutscher Feder,
    offen zugänglich. Krätzigs Argument trifft die deutsche Debatte an ihrer schwächsten Stelle: Das Leistungsschutzrecht
    für Presseverleger (Art. 15 DSM-RL) war genau der Versuch, ein Marktproblem mit einem Ausschliesslichkeitsrecht
    zu lösen, und er ist gescheitert. Wer eine analoge Konstruktion für KI-Training fordert, muss erklären,
    warum es diesmal anders liefe. Praktisch relevant für die anhängigen Verfahren um KI-Übersichten in
    Suchmaschinen, wo der lauterkeitsrechtliche Ansatz bereits geltend gemacht wird.

    '
