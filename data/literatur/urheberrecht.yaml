  kernthese: Ein Textstück gilt als memorisiert, wenn es sich durch eine Eingabe hervorrufen lässt, die
    KÜRZER ist als das Textstück selbst — das Verhältnis beider Längen (Adversarial Compression Ratio)
    liefert ein prüfbares, einzelfallbezogenes Maß.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wie sich ein Gerichtsurteil oder eine Vertragsklausel operationalisieren
    lässt, die dem Anbieter verbietet, ein bestimmtes Werk "im Modell zu speichern" — bislang die größte
    Lücke zwischen Tenor und Vollstreckung. Der praktisch nützlichste Text des Blocks, weil er die Beweisfrage
    in eine Prüfung übersetzt, die eine Partei durchführen und die Gegenseite nachvollziehen kann: Wenn
    man ein Werk nur dadurch hervorrufen kann, dass man es im Prompt weitgehend selbst vorgibt, ist es
    nicht das Modell, das es speichert — das ist genau der Einwand gegen die Extraktionsdemonstrationen
    der Rechteinhaber, hier erstmals quantifiziert statt behauptet. Umgekehrt: Ein kurzes Prompt, das
    eine lange Passage exakt erzeugt, ist Kompression und damit im informationstheoretischen Sinn Speicherung.
    Die Autoren nennen die Compliance-Überwachung ausdrücklich als Anwendungsfall. ANGREIFBAR: Die Suche
    nach dem kürzesten auslösenden Prompt ist ein Optimierungsproblem ohne Garantie — ein negatives Ergebnis
    beweist nicht die Abwesenheit, nur das Scheitern der Suche. Für eine Beweislastverteilung ist das
    erheblich: Das Maß taugt zum Nachweis, nicht zur Entlastung.

    '
