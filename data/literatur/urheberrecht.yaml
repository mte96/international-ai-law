  kernthese: Der Vergleich zwischen maschinellem Training und dem Lernen menschlicher Autoren trägt nicht,
    weil menschliches Lernen mit Werkgenuss verbunden ist und deshalb den Primärmarkt bedient.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die sorgfältigste Auseinandersetzung mit dem in jedem Verfahren vorgetragenen Analogieargument
    ("Menschen lernen auch aus Büchern"). Brauneis zerlegt es überzeugend. Bemerkenswert ist, dass sein
    Kriterium — Werkgenuss als Abgrenzung — inhaltlich genau das japanische Kriterium des Art. 30-4 ist
    (Nutzung ohne "Genießen"), dort aber mit umgekehrtem Vorzeichen verwendet wird: In Japan begründet
    fehlender Werkgenuss die Freistellung, bei Brauneis begründet er die Nichtvergleichbarkeit.

    '
