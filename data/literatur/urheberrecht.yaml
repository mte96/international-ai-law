- id: 2021-miernicki-ng-ki-urheberpersoenlichkeitsrecht
  typ: aufsatz
  autoren:
  - Miernicki, Martin
  - Ng, Irene
  titel: Artificial intelligence and moral rights
  fundstelle: AI & Society 36 (2021), Heft 1, 319-329
  jahr: 2021
  sprache: en
  doi: 10.1007/s00146-020-01027-6
  zugang: bezahlt
  jurisdiktionen:
  - sg
  - intl
  themenachsen:
  - urheberrecht
  - content
  kernthese: Urheberpersoenlichkeitsrechte lassen sich auf KI-Erzeugnisse nicht uebertragen, weil sie
    an die persoenliche Beziehung des Schoepfers zum Werk anknuepfen; die Autoren pruefen, ob und wie
    die Interessen der Beteiligten anderweitig geschuetzt werden koennen.
  eigene_bewertung: 'Aus dem Centre for AI and Data Governance der Singapore Management University, wo
    Irene Ng geforscht hat. Der Beitrag ist deshalb fuer mich wichtig, weil das Urheberpersoenlichkeitsrecht
    die Stelle ist, an der der kontinentaleuropaeische und der angelsaechsische Zugriff am staerksten
    auseinanderfallen - Paragraf 12 bis 14 UrhG gegen den duennen Schutz des Common Law - und weil generative
    Systeme diese Differenz sichtbar machen: Wer sich gegen Entstellung wehren will, braucht ein Recht,
    das an die Person und nicht an die Verwertung anknuepft. Miernicki und Ng arbeiten das sauber heraus.
    Aeltere Arbeit (vor ChatGPT), aber im Kern nicht ueberholt.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
