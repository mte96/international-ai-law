  kernthese: Acht Rechtsordnungen ordnen dieselben vier Variablen — Kontrolle, Vergütung, Transparenz,
    Rechtssicherheit — unterschiedlich; entscheidend für den Trainingsstandort ist aber nicht das Urheberrecht,
    sondern die Verfügbarkeit von Rechenkapazität.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die beste rechtsvergleichende Arbeit aus deutscher Feder, offen zugänglich, und die
    einzige, die die rechtspolitische Standortbehauptung empirisch prüft — mit einem Ergebnis, das beiden
    Lagern weh tut: Die EU bietet die vergleichsweise klarsten Regeln für KI-Anbieter und wird trotzdem
    kaum als Trainingsstandort genutzt, während in China trotz strengerer und in den USA trotz unsicherer
    Rechtslage massiv trainiert wird. Damit ist das gesamte Argument "strenge Regeln vertreiben die Entwicklung"
    für die deutsche Debatte entwertet. Für den Auftraggeber der zentrale Text, weil er rechtsvergleichende
    Struktur, europäische Perspektive und empirische Kontrolle in einem liefert und weil de la Durantaye
    als Mitglied des wissenschaftlichen Beirats in der deutschen Rechtspolitik gehört wird. Angreifbar:
    Die Standortthese beruht auf einer Momentaufnahme; Rechenkapazität ist beweglicher als Recht.

    '
