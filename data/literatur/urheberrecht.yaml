  kernthese: Mitgliedschaftsangriffe auf große Sprachmodelle schlagen in den meisten Konstellationen kaum
    das Raten; wo sie zu wirken scheinen, beruht der Erfolg auf einer Verschiebung der Datenverteilung
    zwischen Mitglieds- und Nichtmitgliedsmenge, nicht auf tatsächlicher Angreifbarkeit.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob ein Rechteinhaber ohne Zugriff auf die Trainingsdokumentation
    beweisen kann, dass SEIN Werk im Trainingskorpus war — die Beweisfrage, an der die meisten Ansprüche
    praktisch scheitern. Die wichtigste GEGENPOSITION dieser Akte, und diejenige, die im juristischen
    Schrifttum fast vollständig fehlt. Die Memorisierungsliteratur wird regelmäßig so gelesen, als ließe
    sich aus dem Modell rekonstruieren, was hineingeflossen ist. Duan u.a. zeigen, dass das für den Einzelfall
    gerade nicht gilt: Bei einem Korpus in Billionen-Token-Größe und wenigen Trainingsdurchläufen pro
    Beispiel verschwimmt die Grenze zwischen "im Korpus" und "nicht im Korpus" so weit, dass die statistische
    Unterscheidung zusammenbricht. Für die Praxis folgt: (a) Der Nachweis der Aufnahme eines konkreten
    Werks gelingt in aller Regel nur über die Dokumentation des Anbieters, nicht über das Modell — was
    die Transparenzpflichten des Art. 53 Abs. 1 lit. d KI-VO und die Offenlegungsanordnung nach Art. 10
    der Produkthaftungsrichtlinie 2024/2853 zur eigentlichen Anspruchsgrundlage macht. (b) Umgekehrt ist
    Vorsicht geboten gegenüber Privatgutachten, die eine Mitgliedschaft "nachweisen" — die Autoren zeigen,
    dass solche Ergebnisse typischerweise ein Artefakt zeitlich verschobener Vergleichsmengen sind (das
    Nichtmitgliedsmaterial ist jünger und deshalb anders verteilt). Genau dieser Fehler steckt in mehreren
    als Beweis angebotenen Untersuchungen. ANGREIFBAR: gemessen an Pythia-Modellen und dem MIMIR-Maßstab;
    für sehr große, mehrfach durchlaufene oder feinabgestimmte Modelle kann anderes gelten, und die Autoren
    sagen das. Zur Gegenrichtung siehe 2024-meeus-copyright-traps, das den Nachweis durch vorsätzliche
    Markierung führt.

    '
