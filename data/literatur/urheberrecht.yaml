  kernthese: '"Memorisierung" bezeichnet in der Informatik mindestens sechs verschiedene Phänomene; nur
    eines davon — extraktive Memorisierung — ist urheberrechtlich als Speicherung im Modell zu behandeln.'
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Schlüsseltext für den Streitstand `modellgewichte-kopie`, und der einzige, der
    die technische Begriffsverwirrung auflöst, an der EWHC, LG München I und das Bezirksgericht Jinshan
    unabhängig voneinander scheitern. Cooper/Grimmelmann zeigen, dass die Frage "enthält das Modell eine
    Kopie?" falsch gestellt ist: Entscheidend ist, ob ein Werk mit vertretbarem Aufwand aus dem Modell
    rekonstruierbar ist — eine graduelle, werkbezogene und modellversionsabhängige Eigenschaft. Damit
    lässt sich zeigen, dass Getty und GEMA sich nicht widersprechen müssen: Der EWHC hat über Stable Diffusion
    entschieden (Bild, starke Kompression, kaum extraktive Memorisierung), das LG München I über GPT-4
    und neun konkrete Liedtexte (Text, kurze Werke, hohe Duplikation im Korpus). Wer diese Unterscheidung
    nicht macht, hält eine Divergenz für gegeben, die es so nicht gibt. Angreifbar ist der Aufsatz dort,
    wo er die Rekonstruierbarkeit zum alleinigen Kriterium macht: Das deutsche Recht kennt keinen Aufwandsvorbehalt
    bei § 16 UrhG.

    '
  letzte_pruefung: 2026-08-27
