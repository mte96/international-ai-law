  - marktzugang
  - wettbewerb
  kernthese: Datenbanken, die einem begrenzten Kreis zugaenglich sind, sollten nicht als Geschaeftsgeheimnis
    geschuetzt werden, weil der Schutz dann Zugangsschranken verfestigt, ohne einen Geheimhaltungswert
    zu sichern.
  eigene_bewertung: 'Auf den ersten Blick abseitig, fuer die Trainingsdatenfrage aber unmittelbar relevant:
    Wenn Datensammlungen ueber den Geheimnisschutz abgeschottet werden, entfaellt fuer Wettbewerber und
    Forschung die Zugangsmoeglichkeit, die das Urheberrecht ueber Schranken gerade eroeffnet. Genau diese
    Verlagerung vom Urheber- zum Geheimnisschutz beobachtet man auch in Europa seit der Geschaeftsgeheimnis-Richtlinie
    und Paragraf 2 GeschGehG. Chen argumentiert dagegen und liefert die Begruendung, die man fuer eine
    einschraenkende Auslegung braucht. Fuer die Achsen marktzugang und wettbewerb nuetzlich; kein Grundlagentext,
    aber ein Argument, das man sonst schwer findet.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
