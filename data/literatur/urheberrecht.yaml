  kernthese: 'Weder die Originalitätskriterien des Urheberrechts noch das Patentrecht (DABUS) noch die
    Notice-and-Takedown-Mechanik werden den Schöpfungsformen der Plattformökonomie und der generativen
    Systeme gerecht.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Breiter angelegt als Núñez Rocha und deshalb flacher: Memes, Reels, virale Challenges,
    Web Scraping und DABUS in einem Aufsatz ist zu viel. Der Mehrwert liegt im Scraping-Teil — Alba Betancourt
    ist eine der wenigen mexikanischen Stimmen, die überhaupt thematisiert, dass Mexiko keine TDM-Schranke
    kennt und die Trainingsfrage deshalb ohne die europäische Ausweichlösung beantwortet werden muss.
    Das ist der Punkt, wegen dessen ich den Text aufnehme; alles davor ist Referat. Als Beleg dafür zitierbar,
    dass die mexikanische Lehre die Trainingsfrage bislang nicht geklärt hat.

    '
  letzte_pruefung: 2026-09-07
