  kernthese: Das taiwanische Patentrecht sollte KI-gestuetzte Erfindungen nicht ueber die Erfinderbenennung,
    sondern ueber den Massstab des Fachmanns und die erfinderische Taetigkeit erfassen.
  eigene_bewertung: 'Die taiwanische Antwort auf den DABUS-Komplex, und sie ist die dogmatisch sauberere:
    Statt an der Erfindereigenschaft herumzudeuteln, verschiebt Gao die Frage dorthin, wo sie hingehoert
    - zum Massstab des durchschnittlichen Fachmanns nach Art. 22 Abs. 2 taiwanisches Patentgesetz, der
    sich veraendert, wenn Fachleute routinemaessig generative Werkzeuge einsetzen. Das ist derselbe Gedanke,
    der bei uns zu Paragraf 4 PatG diskutiert wird, aber hier fruher und ausfuehrlicher ausgefuehrt. Fuer
    die Patentachse nuetzlich; fuer die Hauptachsen des Projekts Randlage.'
