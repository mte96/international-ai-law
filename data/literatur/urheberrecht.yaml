  bezug_streitstaende:
  - schutzfaehigkeit-output
  kernthese: 'Stimmsynthese wirft drei getrennte Probleme auf — die Brüchigkeit der Einwilligung in Stimmentnahme
    und algorithmische Weiterver- wendung, die Verdrängung der Synchronsprecher und die ungeklärte Rechtsnatur
    des Stimmklons.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der Text hat einen Vorteil, den kein europäischer Aufsatz zum Thema hat: Mexiko-Stadt
    ist das Zentrum der spanischsprachigen Synchronisation, die Branche ist gross, gewerkschaftlich organisiert
    (ANDA) und seit 2023 in offenem Konflikt mit den Studios über Stimmklone. Buendía Romero schreibt
    also nicht über ein hypothetisches, sondern über ein laufendes Arbeitskampf- problem, und er unterscheidet
    sauber vier technische Verfahren der Stimmerzeugung, bevor er sie rechtlich einordnet — das macht
    kaum jemand. Für die deutsche Diskussion um das Leistungsschutzrecht der ausübenden Künstler (§§ 73
    ff. UrhG) und um § 22 KUG bei Stimmen der greifbarste Vergleichsfall. Schwäche: die Regelungsvorschläge
    am Ende bleiben Prinzipienkatalog.

    '
  letzte_pruefung: 2026-09-07
- id: 2024-jadresic-titularidad-ia
  typ: aufsatz
  autoren:
