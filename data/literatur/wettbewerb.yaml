  kernthese: Stillschweigende Kollusion über Preisalgorithmen entzieht sich dem Sherman Act, weil dieser
    den Nachweis einer ausdrücklichen Vereinbarung verlangt; ohne gesetzgeberische Anpassung bleibt die
    Durchsetzungslücke bestehen.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Aufgenommen als knapper, geprüfter Einstieg in den Streitstand `preisalgorithmen-kartell`,
    nicht als Autorität — studentischer Blogbeitrag. Der Befund ist der Standardbefund und wird durch
    die RealPage-Vergleiche bestätigt: Wo eine gemeinsame Datenbasis und ein gemeinsamer Anbieter nachweisbar
    sind (hub and spoke), greift § 1 Sherman Act; wo nur parallele Lernprozesse vorliegen, nicht. Für
    die europäische Seite ist der Vergleichspunkt Art. 101 AEUV und der Begriff der abgestimmten Verhaltensweise,
    der weiter reicht als das US-Recht — dieser Vergleich fehlt dem Text. Die deutsche Diskussion (§ 1
    GWB, 11. GWB-Novelle) ist nicht erfasst.

    '
  letzte_pruefung: 2026-08-27
