  kernthese: 'Die KI-VO wirkt als Wettbewerbsrecht, ohne es zu sein: Befolgungskosten, Schwellenwerte
    und Zertifizierungspflichten verändern die Marktstruktur zugunsten großer Anbieter, ohne dass eine
    wettbewerbliche Folgenabschätzung stattgefunden hätte.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche Arbeit zur wettbewerblichen Dimension und in der Brüsseler Debatte
    einflussreich (3.288 Downloads auf SSRN). Das Argument ist 2026 empirisch unterfüttert worden: Kilian
    u.a. beziffern die Befolgungskosten für KMU auf 100.000 bis 300.000 EUR jährlich, und der Omnibus
    reagiert mit KMU-Ausnahmen bis 750 Beschäftigten. Wer die Verschiebung wettbewerbspolitisch bewerten
    will, braucht beide Texte. Angreifbar: Schrepel argumentiert stark ökonomisch und unterschätzt, dass
    Marktzutrittsschranken durch Zertifizierung im Produktsicherheitsrecht der Normalfall und nicht die
    Ausnahme sind.

    '
  letzte_pruefung: 2026-08-27
