  - ki-vo-art-53-abs-2
- id: 2023-labbe-colusion-algoritmos
  typ: aufsatz
  autoren:
  - Labbé Figueroa, María Francisca
  titel: Remedios para la colusión por algoritmos de fijación de precios
  titel_deutsch: Abhilfen gegen Kollusion durch Preissetzungsalgorithmen
  fundstelle: Revista Chilena de Derecho y Tecnología 12 (2023), 1–17
  jahr: 2023
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/69556
  doi: 10.5354/0719-2584.2023.69556
  zugang: open-access
  jurisdiktionen:
  - cl
  themenachsen:
  - wettbewerb
  bezug_streitstaende:
  - preisalgorithmen-kartell
  kernthese: 'Die im chilenischen Kartellrecht vorgesehenen Sanktionen — Gewinnabschöpfung, Unterlassung,
    Auflösung der beteiligten Gesellschaft, Vergabesperre, Freiheitsstrafe — greifen bei algorithmisch
    erlernter Kollusion ins Leere; erforderlich sind Safe Harbours und strukturelle Abhilfen.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der einzige mir bekannte lateinamerikanische Aufsatz, der die Preisalgorithmus-Kollusion
    nicht auf der Tatbestandsseite, sondern auf der Rechtsfolgenseite behandelt — und darin liegt sein
    Wert. Die europäische und amerikanische Literatur streitet fast ausschliesslich darüber, ob abgestimmtes
    Verhalten vorliegt; Labbé Figueroa setzt das voraus und fragt, was man dann eigentlich anordnen soll,
    wenn der Kartellant ein Modell und kein Mensch ist. Der Vorschlag struktureller Abhilfen (Entflechtung,
    Divestment) ist für das deutsche Recht nicht unmittelbar übertragbar — § 32 Abs. 2 GWB kennt Entflechtung
    nur als äussersten Fall —, aber die Fragestellung ist richtig gestellt. Chile ist hier besonders instruktiv,
    weil das Freiheitsstrafenregime des Art. 62 DL 211 ausgerechnet den Vorsatz verlangt, den ein lernendes
    System nicht hat. Kurz, klar, 17 Seiten.

    '
