  kernthese: Der Wettbewerb um Basismodelle wird durch drei Hebel bedroht — die Kontrolle wesentlicher
    Einsatzgüter (Rechenleistung, Daten, Fachkräfte), Partnerschaften und Beteiligungen entlang der Wertschöpfungskette
    sowie vertikale Integration zwischen Modell- und Anwendungsebene.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die kartellrechtliche Marktabgrenzung im KI-Sektor — welche Stufen
    der Wertschöpfungskette es überhaupt gibt und wo Marktmacht entsteht. Die beste frei zugängliche wettbewerbsökonomische
    Analyse des Feldes, und sie kommt von einer Behörde, die Ermittlungsbefugnisse hat und sie genutzt
    hat: Die CMA hat Marktteilnehmer befragt und Verträge gesehen, die kein Wissenschaftler zu Gesicht
    bekommt. Für die deutsche und europäische Praxis ist das aus zwei Gründen wichtig. ERSTENS liefert
    die Wertschöpfungsanalyse — Chips, Cloud, Daten, Modell, Feinabstimmung, Anwendung, Vertriebskanal
    — die Struktur, an der sich jede Marktabgrenzung nach § 18 GWB und Art. 102 AEUV orientieren kann;
    das Bundeskartellamt und die Kommission arbeiten mit derselben Gliederung. ZWEITENS ist die Analyse
    der Partnerschaften (Microsoft/OpenAI, Amazon/Anthropic, Google/Anthropic) der Ausgangspunkt der Frage,
    ob solche Beteiligungen fusionskontrollpflichtige Zusammenschlüsse sind — eine Frage, die in Deutschland
    über § 37 Abs. 1 Nr. 4 GWB (wettbewerblich erheblicher Einfluss) anders beantwortet werden kann als
    im Vereinigten Königreich. ANGREIFBAR: eine Behördenanalyse mit regulierungspolitischem Interesse
    und ohne förmliche Feststellungen; die spätere Praxis der CMA ist zurückhaltender ausgefallen als
    der Bericht erwarten ließ. Und der Stand ist April 2024 — die Marktstruktur hat sich seither erheblich
    bewegt.

    '
  letzte_pruefung: 2026-08-27
