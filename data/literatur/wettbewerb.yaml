  titel: A general framework for analyzing the effects of algorithms on optimal competition laws
  fundstelle: Theoretical Inquiries in Law 26 (2025), Heft 1, 183-214
  jahr: 2025
  sprache: en
  doi: 10.1515/til-2025-0008
  zugang: bezahlt
