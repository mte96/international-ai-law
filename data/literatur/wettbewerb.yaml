  themenachsen:
  - wettbewerb
  - governance
  kernthese: Algorithmen veraendern nicht nur einzelne Verhaltensweisen, sondern die Kosten- und Nutzenfunktion
    des Wettbewerbsrechts selbst; die Autoren entwickeln einen allgemeinen Rahmen, mit dem sich bestimmen
    laesst, wann algorithmische Faehigkeiten eine Verschaerfung und wann eine Lockerung der Verbotsnormen
    rechtfertigen.
  eigene_bewertung: 'Michal Gal (Haifa) ist die international meistrezipierte israelische Wettbewerbsrechtlerin
    und die Autorin, ohne die man die Debatte um algorithmische Kollusion nicht fuehren kann. Der Aufsatz
    ist der begrifflich anspruchsvollste Teil des Themenhefts von Theoretical Inquiries in Law, das die
    Tel Aviv University 2025 zu KI und Wettbewerbsrecht herausgegeben hat. Fuer den Streitstand preisalgorithmen-kartell
    ist er die theoretische Grundlage: Gal und Padilla zeigen, dass die Frage nicht lautet, ob Algorithmen
    Absprachen erleichtern, sondern wie sich die optimale Verbotsschwelle verschiebt, wenn Beobachtung
    und Reaktion nahezu kostenlos werden. Das ist die praezisere Fassung dessen, was Art. 101 AEUV mit
    dem Begriff der abgestimmten Verhaltensweise zu fassen versucht. Nicht frei verfuegbar; Metadaten
    geprueft.'
