  kernthese: Der Wettbewerb bei Foundation Models funktioniert derzeit besser als befürchtet; Eingriffe
    sollten zielgenau bleiben, weil die eigentlichen Risiken (Lock-in, Datenengpässe, Schließung offener
    Plattformen) erst künftig entstehen.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Die ausdrückliche Gegenposition zu Schrepel und zur Konzentrationsthese: Meyers/Bourreau
