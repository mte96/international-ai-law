  kernthese: Die Kosten für das Training führender Modelle wachsen seit 2016 um das 2,4-fache pro Jahr;
    überschreiten sie wie projiziert bis 2027 die Milliardengrenze, bleibt die Entwicklung auf sehr kapitalstarke
    Akteure beschränkt.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die Marktstrukturfrage in quantifizierter Form — ob die Entwicklung
    von Basismodellen eine wesentliche Einrichtung im Sinne der Zugangsdoktrin darstellt, und ob die Befolgungskosten
    der KI-VO für kleine Anbieter erheblich sind oder im Rauschen verschwinden. Der Text liefert die Zahlen,
    die man in beide Richtungen braucht. FÜR die Marktzutrittsargumentation: Wenn ein Trainingslauf bis
    2027 über eine Milliarde Dollar kostet, ist der Markt für Basismodelle strukturell konzentriert, und
    zwar unabhängig von jedem Verhalten der Beteiligten — das ist ein Argument im Sinne der Marktbeherrschungsanalyse
    und zugleich gegen den Missbrauchsvorwurf, weil die Konzentration nicht verhaltensbedingt ist. GEGEN
    die Klage über Regulierungskosten: Gemessen an Trainingskosten dieser Größenordnung sind die Dokumentations-
    und Bewertungspflichten der Art. 53, 55 KI-VO vernachlässigbar — ein Argument, das in der Verhältnismässigkeitsprüfung
    trägt und in der Digital-Omnibus-Debatte kaum vorkommt. Nützliche Aufschlüsselung: Der größte Posten
    sind Beschleuniger- Chips und Personal, nicht Energie oder Daten. Wer Lizenzkosten für Trainingsdaten
    ins Verhältnis setzen will, hat hier den Nenner. ANGREIFBAR: Kostenmodell auf Grundlage öffentlicher
    Angaben und Schätzungen, mit erheblicher Unsicherheit; die Extrapolation bis 2027 ist eine Fortschreibung,
    keine Beobachtung, und die Trainingskosten sagen nichts über die Gesamtkosten (Inferenz übersteigt
    sie inzwischen).

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-53
  - ki-vo-art-55
