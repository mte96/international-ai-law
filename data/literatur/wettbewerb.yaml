  kernthese: Klassische Preisabsprachen bleiben auch bei algorithmischer Umsetzung von Art. 101 Abs. 1
    AEUV erfasst; autonome algorithmische Kollusion entzieht sich dem Vereinbarungs- und Abstimmungsbegriff,
    weil dieser an menschliche Kommunikation anknüpft, und auch dem Verschuldenserfordernis des Art. 23
    Abs. 2 lit. a VO 1/2003.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige Text dieser Akte zum Streitstand preisalgorithmen-kartell aus deutscher
    Feder — Streitbörger ist wissenschaftliche Mitarbeiterin in Potsdam mit kartellrechtlicher Dissertation
    — und die europäische Ergänzung zu der amerikanischen Debatte, die in 32_lit_haftung.yaml erfasst
    ist. Der wichtige Punkt ist der zweite: Selbst wenn man den Abstimmungsbegriff weit fasst, scheitert
    die Sanktion am Verschulden, weil weder Vorsatz noch Fahrlässigkeit vorliegen, wenn niemand die Kollusion
    vorhergesehen hat. Das ist ein eigenständiges Argument, das in der deutschen Diskussion um § 1 GWB
    fehlt. Angreifbar: Streitbörger prüft die Verantwortlichkeit für die Algorithmenauswahl (Fahrlässigkeit
    bei der Auswahl eines kollusionsanfälligen Systems) zu knapp — genau dort liegt der praktikable Anknüpfungspunkt.
    Englisch, aber deutsche Autorin und deutscher institutioneller Rahmen. Ergänzt Beck.

    '
  letzte_pruefung: 2026-08-27
