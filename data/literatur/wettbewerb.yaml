  kernthese: Die GPAI-Regeln durchbrechen die Technologieneutralität und schreiben zugleich eine lineare
    Wertschöpfungskette Modell–System–Betreiber fest, die es so nicht gibt; statt Rollenzuweisung vor
    Markteintritt braucht es Kooperationspflichten danach.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der originellste Beitrag zur Vertragsdimension, obwohl er als Wettbewerbspapier auftritt:
    Der Begriff der "Wertschöpfungsketten-Neutralität" benennt genau das Problem, an dem Art. 25 KI-VO
    scheitert — die Verordnung unterstellt eine Kettenstruktur, wo tatsächlich Netzwerke aus offenen Gewichten,
    aufeinander aufbauenden Modellen und agentischen Systemen bestehen. Zusammen mit Ebers/Vargas Penagos
    ergibt das die vollständige Problembeschreibung; die vertragsrechtliche Lösung liefert weder der eine
    noch der andere. Von einem industrienahen Institut, was man mitlesen sollte — die Argumente sind davon
    unabhängig tragfähig.

    '
  letzte_pruefung: 2026-08-27
