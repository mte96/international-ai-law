  kernthese: Algorithmische Absprache und algorithmische Preisdiskriminierung sind dasselbe Phänomen aus
    zwei Blickwinkeln und stellen beide die Grundannahme des Kartellrechts in Frage, dass Wettbewerb über
    einen einheitlichen Marktpreis stattfindet.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige gefundene Text, der die beiden Themen dieser Akte — Diskriminierung und
    Preisalgorithmen — nicht nebeneinanderstellt, sondern zusammenführt, und deshalb hier aufgenommen,
    obwohl es ein unbegutachtetes Working Paper ist. Die These ist stark und angreifbar zugleich: Wenn
    personalisierte Preise der Regelfall werden, verliert der Begriff des Marktpreises seine Funktion,
    und damit verlieren sowohl der Absprachetatbestand (Art. 101 AEUV) als auch die Missbrauchskontrolle
    (Art. 102 AEUV lit. c: unterschiedliche Bedingungen bei gleichwertigen Leistungen) ihren Bezugspunkt.
    Die Verbindung zum Diskriminierungsrecht ist der interessante Teil: Preisdiskriminierung nach Zahlungsbereitschaft
    trifft systematisch dieselben Gruppen, die das Gleichbehandlungsrecht schützt (vgl. Bartlett/Morse/Stanton/Wallace
    2022 zur Kreditbepreisung), ohne dass ein geschütztes Merkmal verwendet würde. SSRN-Volltext nicht
    maschinell abrufbar (429).

    '
  letzte_pruefung: 2026-08-27
