  bezug_regelwerke:
  - ki-vo-2024-1689
  kernthese: Offenheit bei KI ist gestuft und endet dort, wo die eigentlichen Engpässe liegen — Rechenleistung,
    Daten, Vertriebskanäle —; sie verringert die Konzentration der Branche deshalb nicht, sondern verschleiert
    sie.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die Reichweite der Ausnahme für freie und quelloffene Modelle
    in Art. 2 Abs. 12 und Art. 53 Abs. 2 KI-VO — die praktisch wichtigste Abgrenzungsfrage des GPAI-Kapitels,
    weil an ihr hängt, ob ein Anbieter Dokumentations- und Urheberrechtspflichten überhaupt unterliegt.
    Der Text zerlegt die Voraussetzung dieser Ausnahme: Der Gesetzgeber unterstellt, dass Offenheit Nachprüfbarkeit,
    Wettbewerb und Teilhabe schafft und deshalb geringere Regulierung rechtfertigt. Widder u.a. zeigen,
    dass die als "offen" bezeichneten Modelle in aller Regel nur die Gewichte freigeben — nicht die Trainingsdaten,
    nicht den Trainingscode, nicht die Rechenleistung, ohne die sich nichts nachvollziehen lässt. Damit
    ist die Rechtfertigungsgrundlage der Ausnahme bei den meisten Adressaten nicht erfüllt, und das ist
    ein auslegungsleitendes Argument für ein enges Verständnis des Art. 53 Abs. 2 (der die Ausnahme ohnehin
    nicht gewährt, wenn das Modell ein systemisches Risiko birgt). In Nature erschienen, frei, sechs Seiten,
    ohne Formeln — und deshalb ein Text, den man einer Kammer oder einem Ministerium vorlegen kann. ANGREIFBAR:
    Die Verfasser leiten das AI Now Institute und vertreten eine ausgesprochen konzentrationskritische
    Position; der Text ist Stellungnahme im Nature-Kommentarteil, nicht begutachtete Forschung. Die Gegenposition
    — offene Gewichte erlauben Sicherheitsforschung und mindern Abhängigkeit — kommt zu kurz und ist ernst
    zu nehmen.

    '
  letzte_pruefung: 2026-08-27
