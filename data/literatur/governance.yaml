  kernthese: KI stellt das Recht nicht vor voellig neue Fragen, sondern an drei Stellen vor Grenzen -
    Geschwindigkeit, Autonomie und Undurchsichtigkeit -, und die Antwort liegt nicht in einer Rechtspersoenlichkeit
    fuer Maschinen, sondern in der Zuordnung von Verantwortung zu Menschen und Organisationen.
  eigene_bewertung: 'Die beste Gesamtdarstellung zum Thema aus Asien und in meiner Einschaetzung eine
    der drei besten weltweit. Simon Chesterman ist Dekan der NUS-Rechtsfakultaet und zugleich Senior Director
    von AI Singapore; er hat die singapurische Politik mitgestaltet und schreibt entsprechend aus der
    Naehe zum Regulierungsgeschehen. Fuer meine Arbeit ist das Buch aus zwei Gruenden wichtig: Erstens
    ist es die belastbarste Widerlegung der Rechtspersoenlichkeitsloesung, die in Europa mit der Entschliessung
    des Parlaments von 2017 kurz Konjunktur hatte. Zweitens beschreibt es das singapurische Modell - Model
    AI Governance Framework, AI Verify, keine bindenden Regeln - aus der Innenperspektive und begruendet,
    warum ein kleiner Staat mit hoher Regulierungskapazitaet sich gegen Gesetzgebung entscheiden kann.
    Das ist die interessanteste Alternative zum europaeischen Ansatz, die ich kenne. Bei CUP erschienen,
    Metadaten geprueft.'
