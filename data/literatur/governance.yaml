    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Aufgenommen, weil die Sammlung sonst keinen Text zur gesellschaftsrechtlichen Seite
    hätte, nicht weil der Aufsatz besonders wäre. Er ist Literaturbericht plus Normreferat und arbeitet
    die eigentlich interessante Frage — ob der Vorstand für den Einsatz eines Modells nach den Sorgfaltsmassstäben
    des Art. 153 der brasilianischen Aktiengesetzes (Lei 6.404/76) haftet — nicht aus. Wer zur Business
    Judgment Rule bei KI-gestützten Vorstandsentscheidungen (§ 93 Abs. 1 Satz 2 AktG) arbeitet, findet
    hier nur einen Anknüpfungspunkt, keine Argumentation.

    '
