  kernthese: Ethik und Regulierung sind keine Gegensätze; die Alternative zur ethischen Deliberation ist
    nicht das Recht, sondern die epistemische Vereinnahmung der Regulierung durch die Forschungsproduktion
    der großen Anbieter.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Begriff der "epistemischen Vereinnahmung" ist der Beitrag, der über den Anlass
    hinausträgt: nicht Regulatory Capture durch Lobbyarbeit, sondern durch die Dominanz der Anbieter in
    der wissenschaftlichen Wissensproduktion, auf die sich die Regulierung stützt. Das trifft die Normung
    nach Art. 40 KI-VO unmittelbar, wo JTC21 auf Vorarbeiten angewiesen ist, die überwiegend von Herstellern
    stammen. Angreifbar: Der Befund bleibt Behauptung, es fehlt die bibliometrische Grundlage, die etwa
    Zehlike/Hacker liefern würden. Als Denkfigur für die Normungskritik einschlägig und in dieser Zuspitzung
    frei nirgends sonst. Ergänzt Beck.

    '
  letzte_pruefung: 2026-08-27
