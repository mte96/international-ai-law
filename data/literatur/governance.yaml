  kernthese: Algorithmische Pruefung sollte nicht allein Aufsichtsbehoerden und beauftragten Pruefstellen
    vorbehalten bleiben, sondern nutzerbasiert organisiert werden, weil nur die Betroffenen ueber die
    Beobachtungen verfuegen, die systematische Abweichungen sichtbar machen.
  eigene_bewertung: Der Gegenentwurf zum institutionalisierten Audit, wie es Art. 43 KI-VO und Art. 37
    DSA vorsehen. Hacohen argumentiert, dass zentralisierte Pruefung an der Skalierung und am Informationszugang
    scheitert und dass verteilte, von Nutzern getragene Pruefung die bessere Erkennungsleistung erbringt.
    Das ist eine ernstzunehmende Kritik am europaeischen Konformitaetsbewertungsmodell, und sie kommt
    aus der Rechtsordnung mit der dichtesten Technologiebranche. Wer zur Frage arbeitet, ob die Marktueberwachung
    nach Kapitel IX KI-VO leistungsfaehig sein kann, sollte diesen Einwand kennen. Fuer die Uebertragung
    fehlt der Datenzugangsanspruch, den Art. 40 DSA nur Forschenden gibt - das schwaecht das Modell in
    Europa.
