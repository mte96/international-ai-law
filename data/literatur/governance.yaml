  kernthese: Der Omnibus baut Schutzmechanismen ab, bevor sie überhaupt gegolten haben, und normalisiert
    das Wiederaufschnüren ausverhandelter Kompromisse.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die einzige Analyse, die den Omnibus norm für norm durchgeht — zehn Kritikpunkte
    von Art. 6 Abs. 3 (Registerpflicht) über die Verschiebung der Maschinen-KI von Anhang I Abschnitt
    A nach B bis zur KMU-Schwelle von 750 Beschäftigten und 150 Mio. EUR Umsatz. Methodisch NGO-Papier,
    sachlich präziser als die meisten Kanzleimemoranden. Bemerkenswert und diskussionswürdig: Auch die
    neuen NCII/CSAM-Verbote werden kritisiert — nicht inhaltlich, sondern wegen des Verfahrensbruchs und
    der Overblocking-Gefahr. Wer diese Verbote als unstreitigen Fortschritt darstellt, sollte das gelesen
    haben.

    '
