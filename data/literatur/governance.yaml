  kernthese: Die Durchsetzungsarchitektur der KI-VO ist funktionsfähig, aber nur, wenn KI-Büro, KI-Gremium,
    wissenschaftliches Gremium und nationale Behörden nach einem normativen Modell koordiniert werden,
    das die Verordnung selbst nicht liefert.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die einzige durchgearbeitete Darstellung der Governance-Ebene vor dem Omnibus und
    deshalb die Referenz, gegen die man die Zentralisierungsschritte von 2026 (Art. 75a–75d, erweiterte
    Zuständigkeit des KI-Büros für in sehr große Online-Plattformen eingebettete Systeme) halten muss.
    Die Verfasser plädierten 2024 für stärkere Zentralisierung — sie haben sie 2026 bekommen, und zwar
    mit kartellrechtlichen Instrumenten, die sie nicht vorgeschlagen hatten. Genau diese Differenz ist
    ein Aufsatzthema. Frei über arXiv; die Druckfassung im EJRR ist ebenfalls Open Access.

    '
  letzte_pruefung: 2026-08-27
