  eigene_bewertung: 'Kein einzelner Text, sondern ein Sammeleintrag, und ausnahmsweise so geführt, weil
    das Ergebnis der Prüfung selbst der Befund ist. Der Auftrag nannte die ZfDR als Open-Access-Kandidatin.
    Sie ist es nicht: Es gibt keine Zeitschrift dieses Namens bei Mohr Siebeck — geprüft am Zeitschriftenverzeichnis
    —, sie erscheint bei C.H.BECK und ist ausschließlich über Beck-Online zugänglich. Dasselbe gilt für
    RDi, MMR, ZD und ZUM einschließlich der als "Aktuell"-Dienste geführten Kurzbeiträge. Damit ist der
    gesamte deutsche zeitschriftengebundene Diskurs zum KI-Vertragsrecht, KI-Haftungsrecht und KI-Datenschutzrecht
    für diese Akte unzugänglich; die Lücken bei Haftung, Vertragsrecht und Berufsrecht sind unmittelbare
    Folge davon.

    '
  letzte_pruefung: 2026-08-27
- id: 2016-lipton-mythos
  typ: aufsatz
  autoren:
  - Lipton, Zachary C.
  titel: The Mythos of Model Interpretability
  fundstelle: ICML Workshop on Human Interpretability in Machine Learning (WHI 2016), New York; später
    Communications of the ACM 61 (2018), Nr. 10, 36; arXiv:1606.03490 (cs.LG), 10.06.2016
  jahr: 2016
  sprache: en
  doi: 10.48550/arXiv.1606.03490
  url: https://arxiv.org/abs/1606.03490
  zugang: open-access
  jurisdiktionen:
  - us
  - eu
  themenachsen:
  - governance
  - grundrechte
  bezug_regelwerke:
  - ki-vo-2024-1689
  - dsgvo-schnittstelle
  kernthese: '"Deutbarkeit" bezeichnet mindestens fünf verschiedene Eigenschaften mit verschiedenen Zwecken
    — Vertrauen, Ursächlichkeit, Übertragbarkeit, Auskunftsfähigkeit, faire Entscheidung —; wer sie nicht
    unterscheidet, führt Scheinstreitigkeiten.'
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: welches der fünf Ziele die jeweilige Norm eigentlich verfolgt
    — Art. 13 KI-VO (Betreiber soll das System bedienen können), Art. 86 KI-VO (Betroffener soll widersprechen
    können) und Art. 15 DSGVO (Betroffener soll prüfen können) meinen erkennbar Verschiedenes, werden
    aber unter demselben Wort "Transparenz" geführt. Der begrifflich sauberste Text des Blocks und die
    beste Vorarbeit für jede Auslegung einer Transparenznorm: Lipton zeigt, dass die Forderung nach Deutbarkeit
    ohne Angabe des Zwecks leer ist, und liefert die Typologie, mit der man einer Norm ansehen kann, was
    sie verlangt. Nebenbei zerlegt er die verbreitete Annahme, lineare Modelle seien deutbar und tiefe
    Netze nicht — ein lineares Modell mit zehntausend konstruierten Merkmalen ist unlesbar, ein kleines
    Netz auf Rohdaten unter Umständen lesbar. Wer diese Unterscheidung in einem Verfahren sauber vorträgt,
    entzieht dem Gegner die Standardformel. ANGREIFBAR: Der Text analysiert, ohne zu entscheiden; wer
    aus ihm eine Handlungsanweisung ziehen will, findet keine. Und er ist zehn Jahre alt — die Debatte
    über mechanistische Interpretierbarkeit gibt es hier noch nicht. Acht Seiten.

    '
  letzte_pruefung: 2026-08-27
