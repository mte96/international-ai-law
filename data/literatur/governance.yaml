  kernthese: 'KI ist eine Technologie mit hohem Potenzial, deren tatsächliche Wirkung von ihrem Gebrauch
    abhängt; das Recht muss ein institutionelles Design finden, das den nützlichen Gebrauch fördert und
    den Missbrauch eindämmt.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der wichtigste brasilianische Text — nicht wegen seiner Originalität, sondern weil
    ihn ein amtierender Richter des Supremo Tribunal Federal geschrieben hat, der 2023 bis 2025 dessen
    Präsident war, gemeinsam mit einer Verfassungsrechtlerin, die zugleich seine Kabinettsleiterin war.
    Wenn in Brasilien über die verfassungsrechtlichen Grenzen der KI-Regulierung gestritten wird, ist
    das der Aufsatz, aus dem beide Seiten zitieren, und er wirkt sichtbar auf die Beratungen zum PL 2.338/2023
    ein. Inhaltlich ist er breit und referierend: vierte industrielle Revolution, Nutzen, Risiken, Prinzipienkatalog
    — nichts, was ein deutscher Leser nicht schon kennt. Der Wert liegt darin, dass diese Allgemeinplätze
    aus dieser Feder stammen. Wer die brasilianische Rechtslage einordnen will, muss ihn gelesen haben;
    wer neue Argumente sucht, nicht. Der volle Untertitel "Algo de novo debaixo do sol" antwortet auf
    Kohelet 1,9 und ist programmatisch gemeint: Barroso hält KI ausdrücklich für einen Bruch und nicht
    für einen weiteren Technikschub.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-cebri-itsrio-ai-safety-institute-brasil
  typ: bericht
