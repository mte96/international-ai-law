- id: 2026-krafzik-corporate-governance-ki
  typ: aufsatz
  autoren:
  - Krafzik, Sebastian
  titel: 'Corporate governance and artificial intelligence: The emerging legal challenges in South Africa''s
    boardrooms'
  fundstelle: South African Law Journal 143 (2026), Heft 2, 251-282
  jahr: 2026
  sprache: en
  doi: 10.47348/salj/v143/i2a3
  zugang: bezahlt
  jurisdiktionen:
  - za
  themenachsen:
  - governance
  - haftung
  kernthese: Der Einsatz von KI in der Vorstands- und Aufsichtsarbeit stellt die Sorgfalts- und Treuepflichten
    des Companies Act 71 of 2008 vor neue Fragen, weil Verantwortungszurechnung, Business Judgment Rule
    und Informationsgrundlage bei algorithmisch vorbereiteten Entscheidungen anders liegen als bei rein
    menschlichen.
  eigene_bewertung: 'Der einzige mir bekannte Beitrag im South African Law Journal - der Leitzeitschrift
    des Landes -, der KI dogmatisch und nicht bloss ueberblicksartig behandelt. Fuer die Achse Organhaftung
    ist er das suedafrikanische Gegenstueck zu unserer Diskussion um Paragraf 93 Abs. 1 Satz 2 AktG und
    die Frage, ob und wann sich ein Vorstand auf KI-gestuetzte Informationen verlassen darf. Section 76(4)
    Companies Act ist der Business Judgment Rule nachgebildet, dadurch ist der Vergleich unmittelbar ergiebig.
    Nachteil: nicht frei verfuegbar, ich konnte nur die Crossref-Metadaten pruefen, nicht den Text. Fuer
    die Bibliothek vormerken.'
