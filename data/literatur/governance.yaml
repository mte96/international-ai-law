  - harmonisierte-normen-jtc21
  kernthese: Zivilgesellschaftliche Beteiligung an der KI-Normung scheitert an Zeitaufwand, Zulassungskriterien
    und Stimmgewichten; ohne institutionalisierte Unterstützung bleibt die Grundrechtsexpertise in den
    Gremien strukturell unterrepräsentiert.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die empirische Grundlage der Beteiligungskritik: zwei bis fünf Jahre Entwicklungsdauer,
    zwei bis zehn Stunden monatlich pro Norm, Zulassung nur bei Vertretung in mehreren Mitgliedstaaten.
    Die drei Vorschläge (Erweiterung des Anhangs III der Normungsverordnung, StandICT-Förderung für Einzelexperten,
    dedizierte Koordinierungsstelle) sind konkret genug, um Gegenstand eines rechtspolitischen Beitrags
    zu sein. Von 2023 und damit vor der Normungskrise — die Prognose hat sich bestätigt, was den Text
    aufwertet.

    '
  letzte_pruefung: 2026-08-27
