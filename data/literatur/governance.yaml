  kernthese: Undurchsichtigkeit von KI-Systemen hat drei verschiedene Ursachen - technische Komplexitaet,
    rechtlichen Geheimnisschutz und bewusste Verschleierung -, und nur die erste rechtfertigt eine Nachsicht
    des Rechts; die beiden anderen sind Regelungsentscheidungen.
  eigene_bewertung: 'Die begrifflich schaerfste Behandlung der Blackbox-Frage, die ich kenne, und fuer
    die Praxis unmittelbar nuetzlich: Chesterman zwingt dazu, bei jeder Berufung auf Undurchsichtigkeit
    zu fragen, welche Art gemeint ist. In der europaeischen Diskussion wird technische und geschaeftsgeheimnisbedingte
    Opazitaet regelmaessig vermengt - etwa bei Art. 78 KI-VO, der den Schutz von Geschaeftsgeheimnissen
    gegenueber Behoerden ausdruecklich anordnet, und in der Auseinandersetzung um Art. 22 DSGVO. Wer den
    Einwand "das laesst sich technisch nicht erklaeren" entkraeften will, findet hier das Werkzeug. Rechtsvergleichend
    angelegt, in der fuehrenden Zeitschrift des Fachs erschienen.'
