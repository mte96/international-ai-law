- id: 2022-juri-soberania-datismo
  typ: aufsatz
  autoren:
  - Juri, Yamila Eliana
  titel: La soberanía en crisis. Del estado de excepción en Carl Schmitt al estado de dataísmo como elemento
    de poder
  titel_deutsch: Die Souveränität in der Krise. Vom Ausnahmezustand bei Carl Schmitt zum Datenstaat als
    Machtelement
  fundstelle: Prudentia Iuris 94 (2022), 225–239
  jahr: 2022
  sprache: es
  url: https://erevistas.uca.edu.ar/index.php/PRUDENTIA/es/article/view/4347
  doi: 10.46553/prudentia.94.2022.pp.225-239
  zugang: open-access
  jurisdiktionen:
  - ar
  themenachsen:
  - governance
  - grundrechte
  - sicherheit-export
  kernthese: 'Die Souveränität verlagert sich vom Schmittschen Ausnahmezustand zur Verfügung über Daten;
    wer die Daten hat, entscheidet.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Für einen deutschen Juristen zunächst reizvoll, weil Schmitt hier von einer argentinischen
    Autorin gelesen wird und die Rezeption Schmitts in Lateinamerika eine eigene, ungebrochenere Geschichte
    hat als bei uns. Der Ertrag ist am Ende gering: Die Gleichsetzung von Datenverfügung und Souveränität
    wird behauptet, nicht entwickelt, und der Bezug zu KI beschränkt sich auf ein paar Absätze über autonome
    Waffensysteme. Ich führe den Text als Randlage, weil er zeigt, in welchem theoretischen Rahmen die
    argentinische Debatte über technologische Souveränität geführt wird — das erklärt einiges an der Tonlage
    der Fundación Vía Libre —, aber wer Zeit sparen will, überspringt ihn.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-delapena-guerrero-rodriguez-algocracia-sur-global
  typ: aufsatz
  autoren:
  - De la Peña, Nicolás
  - Guerrero Sierra, Hugo Fernando
  - Rodríguez Benavidez, Iván Ramón
  titel: 'Algocracia en el sur global: La amenaza de una nueva dependencia'
  titel_deutsch: 'Algokratie im globalen Süden: die Gefahr einer neuen Abhängigkeit'
  fundstelle: Revista Chilena de Derecho y Tecnología 14 (2025), Artikel 74784
  jahr: 2025
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/74784
  doi: 10.5354/0719-2584.2025.74784
  zugang: open-access
  jurisdiktionen:
  - latam
  - co
  themenachsen:
  - governance
  - grundrechte
  - sicherheit-export
  - marktzugang
  kernthese: 'Der Einsatz von KI in staatlichen Funktionen ("Algokratie") importiert im globalen Süden
    die Verzerrungen der Anbieter, schmälert die Souveränität und eröffnet den Herkunftsstaaten der Technologie
    einen Einflusskanal über die Grenze hinaus.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Das ist die Perspektive, die in der europäischen Debatte vollständig fehlt und die
    man kennen muss, wenn man verstehen will, warum lateinamerikanische Regierungen den Brüssel-Effekt
    teils begrüssen und teils fürchten. Die These lautet: Ein Staat, der seine Verwaltung mit Systemen
    betreibt, die er weder baut noch prüfen kann, gibt Hoheitsgewalt ab — nicht rechtlich, aber faktisch.
    Das ist eine Souveränitätsthese, keine grundrechtliche, und sie ist präziser formuliert als die übliche
    Rede vom digitalen Kolonialismus, weil die Autoren die Übertragungskanäle benennen (Anbieterverzerrung,
    Beschaffungsabhängigkeit, extraterritoriale Einflussnahme). Für die deutsche Diskussion um digitale
    Souveränität und um Abhängigkeit von US-Hyperscalern in der Verwaltung ist das die schärfste mir bekannte
    Formulierung. Politikwissenschaftlich mehr als juristisch, ohne Normanalyse; man liest es für die
    Fragestellung.

    '
  letzte_pruefung: 2026-09-07
