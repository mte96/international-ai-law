  - Ferracutti, Delfina
  - Kirschbaum, Iván
  - Levy Daniel, Maia
  - Perini, Antonella
  titel: El papel de la ética en el desarrollo de sistemas de inteligencia artificial en el sector emprendedor
    en América Latina
  titel_deutsch: Die Rolle der Ethik bei der Entwicklung von KI-Systemen im Gründersektor Lateinamerikas
  fundstelle: Proyecto GuIA (CETyS, Universidad de San Andrés), Ausgabe 2021, veröffentlicht 2022
  jahr: 2022
  sprache: es
  url: https://proyectoguia.lat/wp-content/uploads/2022/04/El-papel-de-la-etica-Paper.pdf
  zugang: open-access
  jurisdiktionen:
  - latam
  themenachsen:
  - governance
  - marktzugang
  kernthese: 'Ethische Selbstverpflichtungen spielen bei lateinamerikanischen KI-Startups eine geringe
    und vor allem von Investorenanforderungen getriebene Rolle.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Empirisch angelegt und deshalb aufgenommen, obwohl "Ethik" als Thema für einen Juristen
    wenig hergibt. Der Befund ist der brauchbare Teil: Wenn ethische Selbstregulierung im Gründersektor
    nur greift, soweit Kapitalgeber sie verlangen, dann ist die Selbstregulierung eine Funktion des Kapitalmarkts
    und nicht der Einsicht. Das ist ein Argument gegen den Regulierungsverzicht, den ITS Rio und Ordelin
    Font aus anderen Gründen empfehlen, und es sollte in der Sammlung stehen, damit die Gegenposition
    nicht fehlt. Sonst wenig.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-abdulrauf-au-ki-vertrag
  typ: aufsatz
  autoren:
  - Abdulrauf, Lukman
  titel: 'Towards an African Union Treaty on Artificial Intelligence: Reconciling African Values with
    Global Standards'
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 29 (2026), Beitrag a23877
  jahr: 2026
  sprache: en
  url: https://perjournal.co.za/article/view/23877
  doi: 10.17159/1727-3781/2026/v29i0a23877
  zugang: open-access
  jurisdiktionen:
  - za
  - intl
  themenachsen:
  - governance
  - grundrechte
  kernthese: Der Uebergang der Afrikanischen Union von Soft Law zu einem verbindlichen KI-Vertrag scheitert
    weniger an der Kodifikationstechnik als an der normativen Versoehnung afrikanischer Werte mit global
    gesetzten, eurozentrisch gepraegten Standards; noetig sei ein hybrider Ansatz, der technische Interoperabilitaet
    wahrt und zugleich Ubuntu, Solidaritaet und Fairness in die Rechtsarchitektur einschreibt.
  eigene_bewertung: 'Fuer die rechtsvergleichende Arbeit der interessanteste Text des PER-Sonderhefts,
    weil er die Bruesseler Effekt-These aus der Empfaengerperspektive angreift. Abdulrauf beschreibt praezise,
    was passiert, wenn die KI-VO als Modell exportiert wird: Man uebernimmt die Risikoklassen, nicht aber
    die Aufsichtskapazitaet, und erzeugt Regulierung auf dem Papier. Die Ubuntu-Passagen sind mir zu weich
    - sie liefern ein Vokabular, keinen Tatbestand. Aber wer verstehen will, warum die AU-Strategie 2024
    ausdruecklich nicht die EU kopiert, sollte das hier lesen statt der ueblichen Kommentare aus Bruessel.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2026-okorie-transdisziplinaere-governance
  typ: aufsatz
  autoren:
  - Okorie, Chijioke I.
  titel: Towards a Transdisciplinary Governance of Artificial Intelligence in Africa
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 29 (2026), Beitrag a25147
  jahr: 2026
  sprache: en
  url: https://perjournal.co.za/article/view/25147
  doi: 10.17159/1727-3781/2026/v29i0a25147
  zugang: open-access
  jurisdiktionen:
  - za
  themenachsen:
  - governance
  - datenschutz
  kernthese: KI-Governance in Afrika findet bereits statt, aber verteilt auf Datenschutzgesetze, Fintech-Richtlinien,
    Cybersicherheitsrahmen und die Moderationsregeln globaler Plattformen; noetig sei ein Analyseraster
    "legal-technical governance", das Rechtsnorm und technische Operation (Datenlabeling, Modelltraining,
    algorithmisches Audit) als wechselseitig konstitutiv begreift.
  eigene_bewertung: Der konzeptionelle Grundlagentext des Sonderhefts. Die Beobachtung, dass die eigentliche
    KI-Regulierung Afrikas nicht in KI-Gesetzen steht, sondern in POPIA, in Fintech-Leitlinien und in
    den AGB von Meta, ist richtig und uebertragbar - sie gilt fuer Deutschland vor Geltung der KI-VO genauso.
    Der Rueckgriff auf Dooyeweerds Modalitaetenlehre als philosophische Linse ist eine Eigenwilligkeit,
    die ich fuer entbehrlich halte und die den Text unnoetig schwer zugaenglich macht. Ich wuerde die
    Einleitung und den Abschnitt zur institutionellen Fragmentierung lesen und den philosophischen Mittelteil
    ueberspringen.
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2026-okorie-marivate-editorial-sonderheft
  typ: aufsatz
  autoren:
  - Okorie, Chijioke
  - Marivate, Vukosi
  titel: 'Editorial: Legal-Technical Governance and Regulation of Artificial Intelligence in Africa'
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 29 (2026), Beitrag a27950
  jahr: 2026
  sprache: en
  url: https://perjournal.co.za/article/view/27950
  doi: 10.17159/1727-3781/2026/v29i0a27950
  zugang: open-access
  jurisdiktionen:
  - za
  themenachsen:
  - governance
  kernthese: Das Editorial fuehrt in das Sonderheft des Data Science Law Lab und der Gruppe Data Science
    for Social Impact der University of Pretoria ein und ordnet die fuenf begutachteten Beitraege in einen
    legal-technischen Governance-Ansatz ein.
  eigene_bewertung: 'Als eigenstaendiger Text belanglos, als Wegweiser sehr nuetzlich: Es sagt in zwei
    Seiten, welche fuenf Aufsaetze das Heft traegt und wie sie aufeinander aufbauen - von der Begriffsbildung
    ueber die AU-Vertragsfrage und die IP-Strategien bis zu Ueberwachung und Predictive Policing. Ich
    habe das Heft ueber dieses Editorial erschlossen und wuerde es jedem als erste Seite empfehlen, der
    sich Suedafrika und die AU-Ebene neu erarbeitet. Zitierfaehig ist es allenfalls fuer die Feststellung,
    dass es 2026 erstmals ein begutachtetes Sonderheft zu KI-Governance in Afrika gibt.'
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2024-vandermerwe-ueberblick-ki-recht
  typ: aufsatz
  autoren:
  - Van der Merwe, Daniel
  titel: A Local, Continental (African) and International Overview of the Law as it relates (or tries
    to relate) to Artificial Intelligence (AI)
  fundstelle: Potchefstroom Electronic Law Journal (PER/PELJ) 27 (2024), Beitrag a18498
  jahr: 2024
  sprache: en
  url: https://perjournal.co.za/article/view/18498
  doi: 10.17159/1727-3781/2024/v27i0a18498
  zugang: open-access
  jurisdiktionen:
  - za
  themenachsen:
  - governance
  - grundrechte
  kernthese: Suedafrika sitzt bei der Anpassung an KI zwischen den Stuehlen, weil es materielles roemisch-hollaendisches
    Recht mit englischem Prozess- und Beweisrecht verbindet; deshalb sei die Orientierung an UK und USA
    naeher als die an der AU, deren Arbeiten auf dem franzoesisch-inquisitorischen Modell beruhen.
  eigene_bewertung: Ich fuehre den Text, weil er in der suedafrikanischen Diskussion als Ueberblick zitiert
    wird, halte ihn aber fuer schwach. Der Hinweis auf die Mischrechtsordnung und die daraus folgende
    Orientierung am Common Law ist der einzige eigenstaendige Gedanke und er ist richtig - er erklaert,
    warum suedafrikanische Autoren beim Beweisrecht regelmaessig nach London und nicht nach Bruessel schauen.
    Der lange philosophische Teil ueber Orwells 1984 ist Fuellmaterial. Wer den Ueberblick braucht, nimmt
    besser das PER-Sonderheft 2026.
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: false
