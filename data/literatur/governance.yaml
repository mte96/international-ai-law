  kernthese: Die grossen KI-Unternehmen erlangen Faehigkeiten und Verhandlungsmacht, die sie in die Naehe
    voelkerrechtlicher Akteure ruecken; das Voelkerrecht hat dafuer keine Kategorien und muss sie entwickeln,
    ohne den Staaten die Verantwortung abzunehmen.
  eigene_bewertung: Der aktuellste Chesterman und der ehrgeizigste. Fuer die Achse marktzugang und fuer
    alles, was mit Rechenkapazitaet, Exportkontrolle und der Frage nach der Souveraenitaet ueber Modelle
    zu tun hat, der weiterfuehrende Text - er verbindet die Debatte um Compute Governance mit klassischer
    Voelkerrechtsdogmatik. Erschienen im American Journal of International Law, was fuer die Rezeption
    spricht. Ich habe nur die Metadaten geprueft; es gibt eine SSRN-Fassung von 2025 unter derselben Ueberschrift.
    Der Titel ist griffiger als das Argument; ob die Analogie zu voelkerrechtlichen Akteuren traegt, wuerde
    ich erst nach der Lektuere beurteilen.
