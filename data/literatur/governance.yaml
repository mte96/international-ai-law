  kernthese: Interoperabilität als Leitziel der KI-Regulierung trägt eine verdeckte Politik in sich -
    den Vorrang von Harmonie vor Dissens und von Konsistenz vor Vielfalt - und steht damit im Widerspruch
    zur demokratischen Funktion des Gesetzes, das gerade Meinungsverschiedenheit organisiert und auflöst.
  eigene_bewertung: Der beste kanadische Aufsatz des Jahrgangs und der einzige, der die Interoperabilitaetsrhetorik
