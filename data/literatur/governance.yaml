  kernthese: KI-Einsatz in Gesetzgebung und Rechtsetzung fällt durch das Raster der KI-VO, obwohl er das
    rechtsstaatlich riskanteste Anwendungsfeld ist.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Zeigt eine echte Lücke im Anhang III: Wer mit KI Gesetze entwirft oder Folgenabschätzungen
    erstellt, unterliegt keiner Hochrisikoeinstufung. Die Lösungsvorschläge (freiwillige Verhaltenskodizes,
    nationale Regeln) fallen hinter die Analyse zurück und laufen dem Vollharmonisierungsgedanken zuwider.
    Für die eigene Arbeit vor allem als Beleg brauchbar, dass die Anhang-III-Liste nicht risikologisch,
    sondern politisch zustande kam. CC BY.

    '
