  kernthese: Die Harmonisierung durch die KI-VO ist unumgänglich, ihr risikobasierter Ansatz aber wegen
    des Übermaßes an Selbstregulierung, unklarer Risikoeinstufungen und schwacher Durchsetzung gerade
    im Bereich der Strafverfolgung nachbesserungsbedürftig.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Bezieht sich auf den Kommissionsvorschlag von 2021, nicht auf die verabschiedete
    Verordnung — vieles ist überholt, die Risikoeinstufungen haben sich verschoben, die Strafverfolgungsausnahmen
    sind erweitert worden. Aufgenommen aus zwei Gründen: als Beleg, dass die deutsche Strafrechtswissenschaft
    die KI-VO früh und kritisch begleitet hat, und weil KriPoZ eine der wenigen deutschen Fachzeitschriften
    mit vollständigem freien Volltextzugang ist, was man sich merken sollte. Fachlich heute nur noch dogmengeschichtlich
    interessant.

