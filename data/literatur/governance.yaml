  kernthese: Wenn KI die Anwendung des Rechts nahezu vollstaendig vorhersagbar macht, verschwindet die
    Rechtsunsicherheit als Ressource der Maechtigen, und das Recht kann seine Verteilungsversprechen erstmals
    einloesen.
  eigene_bewertung: 'Die kanadische Gegenposition zur europaeischen Skepsis und deshalb unverzichtbar,
    auch wenn ich sie fuer falsch halte. Alarie ist nicht nur Professor in Toronto, sondern Gruender eines
    Legal-Tech-Unternehmens; das erklaert den Optimismus und schmaelert ihn zugleich. Der starke Teil
    ist die Beobachtung, dass Rechtsunsicherheit systematisch die begueterte Partei beguenstigt - das
    ist zutreffend und in Deutschland unterbelichtet. Der schwache Teil ist die Gleichsetzung von Vorhersagbarkeit
    mit Richtigkeit: Ein Modell, das die bisherige Rechtsprechung perfekt vorhersagt, schreibt deren Fehler
    fort. Wer die Debatte um KI in der Justiz fuehrt, braucht dieses Buch als Zielscheibe. Ich habe nur
    die Verlagsangaben und die Rezension geprueft, nicht das Buch selbst.'
