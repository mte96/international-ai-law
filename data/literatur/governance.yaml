  kernthese: Die Regulierung von KI muss in Israel vom staatlichen Einsatz her gedacht werden - Nachrichtendienste,
    Polizei, Sozialverwaltung -, weil dort die Grundrechtsgefaehrdung am groessten und die demokratische
    Kontrolle am schwaechsten ist.
  eigene_bewertung: 'Das einzige mir bekannte israelische Buch, das die Regulierungsfrage im Ganzen stellt,
    und der Referenztext der dortigen Debatte. Shwartz Altshuler leitet am Israel Democracy Institute
    das Programm Demokratie im digitalen Zeitalter und beraet die Knesset; das Buch hat entsprechend Gewicht.
    Fuer den Rechtsvergleich ist Israel ein Sonderfall: hoch entwickelte KI-Industrie, keine Verfassung
    im foermlichen Sinn, ein Grundgesetz Menschenwuerde und Freiheit ohne ausdruecklichen Datenschutzartikel,
    und ein Sicherheitsapparat mit weiten Befugnissen. Genau diese Kombination macht den Text lehrreich
    fuer die Frage, was Grundrechtsschutz gegen KI ohne dichte Verfassungsdogmatik leisten kann. Die hebraeische
    Originalausgabe erschien ebenfalls beim IDI; ich habe nur die englische Fassung geprueft. Schwaeche:
    politikberatend, nicht dogmatisch; wer Subsumtionsmaterial sucht, findet es hier nicht.'
