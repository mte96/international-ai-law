  kernthese: KI veraendert Unternehmensfuehrung und Unternehmensregulierung an drei Stellen - Entscheidungsvorbereitung
    im Leitungsorgan, Ueberwachung durch Aufsichtsorgane und Aufsichtstechnik der Behoerden - und verlangt
    an jeder eine andere rechtliche Antwort.
  eigene_bewertung: 'Systematischer als Krafzik 2026 aus Suedafrika und breiter angelegt, weil Petrin
    nicht nur die Organpflichten, sondern auch die Aufsichtsseite behandelt. Fuer die Frage, wann ein
    Vorstand sich auf KI-gestuetzte Informationen verlassen darf, ist der Beitrag die international besser
    rezipierte Fundstelle. Frei zugaenglich ueber die SJLS. Der Nachteil ist die Breite: Wer eine Antwort
    auf eine konkrete Pflichtenfrage sucht, findet Systematisierung statt Subsumtion.'
