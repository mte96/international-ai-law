    G7-Hiroshima-Prozesse und um die Frage, ob das kanadische AIDA sich an der KI-VO orientieren sollte
    - eine Frage, die sich mit dem Scheitern von Bill C-27 im Januar 2025 neu stellt. Ihr Argument, das
    Gesetz sei ein Informationssystem, in dem Gemeinschaften ueber komplexe Phaenomene streiten, ist theoretisch
    anspruchsvoll und fuer mich der brauchbarste Einwand gegen die Vorstellung, Regulierungsangleichung
    sei per se ein Wert. Wer zum Verhaeltnis KI-VO/Drittstaaten arbeitet, sollte den Text kennen. Aus
    dem We-Robot-Sonderheft, also mit dem dortigen interdisziplinaeren Zuschnitt.
