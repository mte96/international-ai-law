  kernthese: Die von Aidid und Alarie beschriebene "legal singularity" - ein durch algorithmische Vorhersage
    vollstaendig bestimmter Rechtszustand - erbt die Schwaechen der analytischen Rechtstheorie, auf die
    sie sich stillschweigend stuetzt.
  eigene_bewertung: Die beste Kurzkritik an der einflussreichsten kanadischen KI-Rechtsmonographie. Aidid
    und Alarie (Toronto, Gruender von Blue J Legal) behaupten, vollstaendige Vorhersagbarkeit mache das
    Recht besser; Tse haelt dagegen, dass Unbestimmtheit keine Fehlfunktion, sondern Funktionsbedingung
