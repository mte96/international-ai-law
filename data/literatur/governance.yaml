  kernthese: Der Omnibus vereinfacht nicht, sondern erhöht die Komplexität durch subjektive Kriterien
    und zusätzliche Ermächtigungen — und begünstigt dadurch gerade die großen Anbieter, die er entlasten
    soll.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Von einem der führenden europäischen Verwaltungsrechtler und deshalb der methodisch
    strengste Beitrag der Kritikerseite: Der zentrale Vorwurf ist nicht Deregulierung, sondern die fehlende
    Folgenabschätzung und die Verlagerung von Wertungen in unbestimmte Begriffe und Durchführungsrechtsakte.
    Das ist ein Argument über Rechtsetzungsqualität, nicht über politische Richtung, und deshalb schwerer
    zu entkräften als die NGO-Positionen. Bezieht sich schwerpunktmäßig auf den Datenteil; für die KI-VO
    überträgt sich das Argument auf die neuen Kommissionsermächtigungen.

    '
  letzte_pruefung: 2026-08-27
