  titel_deutsch: 'Ein KI-Sicherheits- und Chanceninstitut für Brasilien: Entwurf von Merkmalen, Funktionen
    und möglichen Schwierigkeiten'
  fundstelle: CEBRI und ITS Rio, Rio de Janeiro 2025
  jahr: 2025
  sprache: pt
  url: https://itsrio.org/wp-content/uploads/2017/01/AISOInstituteparaoBrasil.pdf
  zugang: open-access
  jurisdiktionen:
  - br
  - uk
  - us
  - eu
  - jp
  themenachsen:
  - governance
  - sicherheit-export
  - gpai
  kernthese: 'Brasilien sollte ein technisch-beratendes, unabhängiges und multisektorales KI-Sicherheitsinstitut
    nach dem Vorbild der britischen, amerikanischen, europäischen und japanischen Institute schaffen,
    das ausdrücklich keine Aufsichtsbefugnisse erhält.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Interessant wegen der institutionellen Grundentscheidung: Der Vorschlag trennt die
    Sicherheitsforschung ausdrücklich von der Aufsicht und begründet das damit, dass beides in Brasilien
    sonst in derselben Behörde landen würde. Das ist genau die Frage, die sich in Deutschland bei der
    Benennung der Marktüberwachungs- behörden nach Art. 70 KI-VO und beim Verhältnis zur Bundesnetzagentur
    stellt, und ich habe zu ihr in der deutschen Literatur wenig gefunden. Der rechtsvergleichende Teil
    (Vereinigtes Königreich, USA, EU, Japan) ist knapp, aber korrekt. Schwäche: Der Bericht sagt nichts
    dazu, woher ein solches Institut in Brasilien technisches Personal nehmen soll — das ist in einem
    Land ohne eigene Modellentwicklung die eigentliche Frage.

    '
  letzte_pruefung: 2026-09-07
