  kernthese: Die Entscheidung, KI-Schäden als Risiken zu beschreiben, importiert die Instrumente und die
    Pathologien der Risikoregulierung — vier unterschiedliche Modelle konkurrieren dabei unausgesprochen
    miteinander.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der theoretische Unterbau, den die europäische Debatte meist voraussetzt, ohne ihn
    zu zitieren: Kaminski zeigt, dass "Risiko" keine neutrale Beschreibung ist, sondern eine Vorentscheidung
    über Quantifizierbarkeit, Abwägbarkeit und Beteiligung. 8.029 Downloads, 31 Zitationen auf SSRN. Für
    die europäische Arbeit besonders brauchbar, weil das Vier-Modelle-Raster erklärt, warum Ebers und
    Almada/Petit aneinander vorbeireden: Sie meinen unterschiedliche Risikomodelle. Schwäche aus europäischer
    Sicht: Der Text ist an amerikanischen Verwaltungsrechtsdebatten geschult und behandelt die KI-VO nur
    als eines von mehreren Beispielen.

    '
  letzte_pruefung: 2026-08-27
