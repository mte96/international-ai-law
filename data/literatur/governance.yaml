  kernthese: Algorithmische Systeme sind nach ihrem Schädigungspotenzial in fünf Kritikalitätsstufen einzuteilen,
    an die abgestufte regulatorische Anforderungen von der Kennzeichnungspflicht bis zum vollständigen
    Verbot anknüpfen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die deutsche Vorarbeit zum risikobasierten Ansatz der KI-VO und der Grund, warum
    das europäische Modell so aussieht, wie es aussieht — die Fünfstufigkeit der Datenethikkommission
    ist in der Kommissionsarbeit rezipiert und auf vier Stufen verdichtet worden. Wer die Genese des Art.
    6 KI-VO argumentativ braucht, braucht dieses Gutachten. Sieben Jahre alt und in den Einzelaussagen
    überholt; die Kritikalitätspyramide, das Konzept der Algorithmen-Folgenabschätzung und der Vorschlag
    einer Kennzeichnungspflicht sind es nicht. Angreifbar ist die Kritikalitätsstufung selbst — sie knüpft
    an das Schädigungspotenzial des Systems an, nicht an den Verwendungszusammenhang, und genau diesen
    Fehler hat die KI-VO geerbt. 240 Seiten, frei, und in der aktuellen Debatte unterzitiert.

    '
