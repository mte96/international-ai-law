  kernthese: Der KI-Omnibus ist keine technische Vereinfachung, sondern eine Rücknahme von Grundrechtsschutz
    vor dessen Wirksamwerden, und schafft den Präzedenzfall, dass frisch beschlossenes Digitalrecht in
    der Umsetzungsphase wieder aufgeweicht werden kann.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die einzige frei zugängliche deutschsprachige Analyse, die die vier Änderungsstränge
    des Omnibus (Transparenzregister, Fristen, eingebettete KI in Maschinen, Verarbeitung besonderer Kategorien
    zur Bias-Erkennung) nebeneinander legt. Der letzte Punkt ist der juristisch interessanteste und wird
    auch in der Fachliteratur unterschätzt: eine neue Erlaubnis für Art.-9- DSGVO-Daten zum Zweck der
    Verzerrungserkennung. Zu lesen als Advocacy — der Text ist von einem Bündnis unterzeichnet und argumentiert
    einseitig —, aber die Normzitate stimmen und die Fristangaben decken sich mit der Trilogberichterstattung.
    Ersetzt keine Kommentierung; als Problemaufriss und Fundstellensammlung nützlich.

    '
