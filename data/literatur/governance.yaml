  kernthese: Der Omnibus ist keine Vereinfachung, sondern die Umwidmung des Datenschutzrechts zugunsten
    des KI-Trainings, getrieben von Wettbewerbsangst gegenüber den USA und China.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die pointierteste Formulierung der Kapitulationsthese aus wissenschaftlicher Feder
    (Bieker ist beim ULD). Die vier benannten Punkte — Pseudonymisierung, Zweckbindung, Trainingserlaubnis
    für besondere Datenkategorien, Bestandsschutz für bereits im Verkehr befindliche Hochrisikosysteme
    — sind präzise und nachprüfbar. Schwäche: Der Beitrag erklärt die Motive (FOMO) besser als die Rechtsfolgen;
    die marktzugangsrechtliche Seite bleibt unbearbeitet. Für die eigene Arbeit als Gegenposition zu DIGITALEUROPE
    unentbehrlich.

    '
