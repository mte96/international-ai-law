  kernthese: Ein eigener Rechtsakt zum algorithmischen Management ist entbehrlich, weil KI-VO, DSGVO und
    Plattformarbeitsrichtlinie den Bereich bereits abdecken; neue Regeln erzeugten Doppelungen und Inkohärenz.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Ausdrücklich als Gegenposition aufgenommen und die einzige im deutschen Arbeitsrechtsteil:
    Wo De Stefano, Adams-Prassl und die EPRS-Studie eine Schutzlücke sehen, sieht der Branchenverband
    eine Regelungsdichte, die bereits zu hoch ist. Das Argument ist nicht ohne Substanz — § 87 Abs. 1
    Nr. 6 BetrVG ist von der Rechtsprechung sehr weit ausgelegt worden, und die Kombination aus Mitbestimmung,
    DSGVO und KI-VO erzeugt tatsächlich Mehrfachprüfungen. Als Interessenvertretung zu lesen und nicht
    als Analyse; für die Darstellung des Streitstands notwendig, weil die Gegenseite sonst unwidersprochen
    bleibt. Konkreter Anlass ist der Initiativbericht des Europäischen Parlaments 2025/2080(INL), der
    einen eigenen Rechtsakt zum algorithmischen Management fordert — das ist der laufende Gesetzgebungsvorgang,
    an dem sich diese Auseinandersetzung entscheidet, und er ist im Regelwerksbestand des Projekts noch
    nicht erfasst. Bemerkenswert: Das Papier äußert sich nicht zur betrieblichen Mitbestimmung, also zu
    genau dem Instrument, das im deutschen Recht die schärfste Schranke bildet.

    '
  letzte_pruefung: 2026-08-27
