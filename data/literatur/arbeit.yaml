  kernthese: Obwohl die Personalvertretungsgesetze anders als § 80 Abs. 3 BetrVG keine KI-spezifischen
    Regelungen kennen, bestehen vergleichbare Beteiligungsrechte über die allgemeinen Tatbestände; Unterschiede
    bestehen bei der Hinzuziehung externer Sachverständiger und bei der Wissenschaftsfreiheit.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige frei zugängliche deutschsprachige Zeitschriftenaufsatz dieser Akte zum
    kollektiven Arbeitsrecht des KI-Einsatzes, und die systematische Gegenüberstellung von BetrVG und
    Personalvertretungsrecht ist auch außerhalb des Hochschulkontextes verwertbar — jede Behörde steht
    vor derselben Frage. Der praktisch wichtigste Punkt ist die Sachverständigenhinzuziehung nach § 80
    Abs. 3 BetrVG, die durch das Betriebsrätemodernisierungsgesetz für KI ausdrücklich erleichtert wurde
    und im Personalvertretungsrecht kein Gegenstück hat. Das ist eine echte Rechtsschutzlücke im öffentlichen
    Dienst. Einschränkung: Der Text ist vor der Anwendbarkeit des Art. 26 Abs. 7 KI-VO geschrieben und
    verbindet die Mitbestimmung nicht mit den betreiberbezogenen Pflichten der KI-VO. Dass das ganze deutsche
    Arbeitsrecht der KI in einer frei zugänglichen Akte auf diesen einen Aufsatz zusammenschnurrt, ist
    der ernsteste Befund dieser Recherche.

    '
