  kernthese: Eine breite Verdrängung ist nicht feststellbar, wohl aber ein Einbruch bei den 22- bis 25-Jährigen
    in KI-exponierten Berufen um rund 19 Prozent gegenüber dem erwarteten Niveau — getragen von ausbleibenden
    Einstellungen, nicht von Entlassungen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wo der arbeitsmarktrechtliche Handlungsbedarf tatsächlich liegt
    — und dass er dort liegt, wo das Arbeitsrecht am wenigsten greift. Der Befund ist juristisch unbequem,
    weil er sich der vorhandenen Dogmatik entzieht: Der Schaden entsteht durch NICHT ZUSTANDE GEKOMMENE
    Einstellungen. Es gibt keinen Betroffenen mit Arbeitsverhältnis, keine Kündigung, keine Massenentlassungsanzeige,
    keinen Betriebsrat, keine Sozialauswahl — sämtliche Schutzinstrumente des deutschen Arbeitsrechts
    setzen an einem bestehenden Verhältnis an. Wer aus diesem Befund rechtspolitische Folgerungen zieht,
    landet zwangsläufig bei Ausbildungs-, Berufszugangs- und Bewerbungsrecht, also bei § 611a BGB, dem
    AGG im Einstellungsverfahren und dem Berufsbildungsrecht. Zweiter Anschluss: Wenn Einstiegspositionen
    verschwinden, bricht die Grundlage der beruflichen Qualifikation weg, die Kammern und Berufsordnungen
    voraussetzen — für das anwaltliche Ausbildungswesen ist das eine unmittelbar praktische Frage. Der
    Datensatz stammt aus Gehaltsabrechnungsdaten von ADP und deckt Millionen Beschäftigte ab; das ist
    die belastbarste US-Evidenz. ANGREIFBAR: beschreibende Auswertung, keine kausale Identifikation —
    der Einbruch bei Berufsanfängern fällt in eine Zeit allgemein schwacher Einstellungen in technologienahen
    Branchen, und die Zuordnung zur KI-Exposition beruht auf einem Maßstab, der selbst umstritten ist.
    "Sechs Fakten" ist die richtige Beschreibung des Anspruchs; eine Kausalaussage ist es nicht.

    '
  letzte_pruefung: 2026-08-27
- id: 2024-toyama-ia-relaciones-laborales
  typ: aufsatz
  autoren:
  - Toyama Miyagusuku, Jorge
  titel: La inteligencia artificial y las relaciones laborales
  titel_deutsch: Künstliche Intelligenz und Arbeitsverhältnisse
  fundstelle: IUS ET VERITAS 69 (2024), 55–69
  jahr: 2024
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/iusetveritas/article/view/30767
  doi: 10.18800/iusetveritas.202402.004
  zugang: open-access
  jurisdiktionen:
  - pe
  themenachsen:
  - arbeit
  - grundrechte
  kernthese: 'Weil eine KI-spezifische arbeitsrechtliche Regelung fehlt, muss der Verhältnismässigkeitstest
    die Konflikte zwischen betrieblicher Effizienz und Arbeitnehmergrundrechten auflösen — von der Auswahl
    über die Durchführung bis zur Beendigung des Arbeitsverhältnisses.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Toyama Miyagusuku ist der meistzitierte Arbeitsrechtler Perus, und dieser Aufsatz
    ist der Grund, warum ich ihn hier als Pflicht führe: Er löst das Regelungsdefizit nicht durch Rufe
    nach dem Gesetzgeber, sondern durch den Verhältnismässigkeitstest — also genau durch die Methode,
    mit der ein deutscher Arbeitsrechtler § 26 BDSG und § 75 Abs. 2 BetrVG bei algorithmischer Personalauswahl
    bearbeiten würde. Der Text ist damit der am leichtesten übertragbare der ganzen Sammlung. Er ist knapp
    (fünfzehn Seiten) und ohne Fallmaterial; wer Rechtsprechung sucht, findet keine, weil es in Peru keine
    gibt. Aber die dogmatische Anlage stimmt, und die Dreiteilung nach Auswahl, laufendem Verhältnis und
    Beendigung ist eine brauchbare Prüfungsordnung.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-rodriguez-burbano-gerencia-algoritmica
  typ: aufsatz
