  kernthese: Art. 13 DSGVO verlangt keine ausdrückliche Information über den KI-Einsatz, wohl aber die
    Nennung des KI-Dienstleisters als eigene Empfängerkategorie; die eigenständige Unterrichtungspflicht
    folgt erst aus Art. 26 Abs. 7 KI-VO für Hochrisiko-Systeme im Beschäftigungskontext.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Praxisbeitrag ohne wissenschaftlichen Anspruch, aufgenommen wegen der Arbeitsrechtslücke
