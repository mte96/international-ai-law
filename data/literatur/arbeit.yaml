  titel: 'The Racialized Treadmill of Robotic Agriculture: Colonial Legacies, Legal Exceptionalism, and
    Labour Control'
  fundstelle: Canadian Journal of Law and Technology 23 (2026), Heft 2
  jahr: 2026
  sprache: en
