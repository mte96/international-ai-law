  kernthese: Der Begriff der Gig-Arbeit verstellt den Blick; massgeblich fuer die arbeitsrechtliche Einordnung
    sei nicht die Vertragsform, sondern das Ausmass technologischer Steuerung durch den Algorithmus.
  eigene_bewertung: Fuer die Achse arbeit der ergiebigste indische Text. Chelats Vorschlag, das Merkmal
    der Weisungsgebundenheit durch das Merkmal der algorithmischen Steuerung zu ersetzen, ist genau die
    Bewegung, die der EuGH und der deutsche Gesetzgeber bei Paragraf 611a BGB scheuen und die die Plattformarbeitsrichtlinie
    (EU) 2024/2831 ueber die Vermutungsregel des Art. 5 nur halb vollzieht. Indien ist als Vergleichsfall
    besonders instruktiv, weil der Code on Social Security 2020 den "gig worker" bereits legaldefiniert
    hat, ohne daraus Arbeitnehmerschutz abzuleiten - das Ergebnis ist eine dritte Kategorie ohne Rechte.
    Gut gearbeitet, klar geschrieben.
