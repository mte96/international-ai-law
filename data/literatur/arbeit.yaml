  - wettbewerb
  - governance
  kernthese: Über einen aufgabenbasierten Ansatz ergibt sich für zehn Jahre ein Zuwachs der totalen Faktorproduktivität
    von höchstens 0,66 Prozent, unter realistischeren Annahmen weniger als 0,53 — ein Bruchteil der öffentlich
    behaupteten Größenordnungen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die Prämisse jeder Verhältnismässigkeitsprüfung im KI-Recht —
    wie groß der volkswirtschaftliche Nutzen ist, gegen den Regulierungskosten und Grundrechtseingriffe
    abzuwägen sind. Der wichtigste Gegenpol zur Innovationsrhetorik, und zwar von einem Nobelpreisträger
    (2024), was die Zitierfähigkeit gegenüber Gerichten und Ministerien erhöht. Die Rechenweise ist für
    einen Juristen nachvollziehbar: Anteil der Aufgaben, die KI übernehmen kann, mal durchschnittliche
    Kosteneinsparung, mal Anteil dieser Aufgaben an der Wertschöpfung. Wer eine Gesetzesbegründung oder
    eine Folgenabschätzung prüft, die mit Produktivitätsgewinnen von mehreren Prozentpunkten argumentiert,
    hat hier die belastbare Gegenrechnung — und damit ein Argument gegen die Deregulierungsvorschläge
    des Digital Omnibus, das nicht grundrechtlich, sondern ökonomisch begründet ist. Acemoglus zweite
    These ist juristisch mindestens so interessant: Der Nutzen hängt davon ab, ob KI ergänzend oder ersetzend
    eingesetzt wird, und diese Wahl ist gestaltbar — also auch rechtlich beeinflussbar. ANGREIFBAR, und
    heftig angegriffen: Die Schätzung beruht auf punktuellen Aufgabenstudien, die Acemoglu hochrechnet;
    Kritiker (Aghion, Autor, Brynjolfsson) halten die unterstellte Aufgabenmenge für zu klein und die
    Fortschreibung der heutigen Fähigkeiten für zu statisch. Der Streit ist offen, und beide Seiten sind
    zitierbar. HINWEIS: NBER-Seite frei abrufbar mit Zusammenfassung und Metadaten; das PDF ist außerhalb
    zeichnender Einrichtungen teilweise gesperrt.

    '
  letzte_pruefung: 2026-08-27
