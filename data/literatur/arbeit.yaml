  kernthese: Der gestaffelte Einsatz eines generativen Assistenten bei 5.179 Kundendienstmitarbeitern
    hob die Produktivität um 14 Prozent, bei Berufsanfängern um 34, bei Erfahrenen kaum — das System verbreitet
    das Erfahrungswissen der Besten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: zwei arbeitsrechtliche Fragen, die gewöhnlich getrennt verhandelt
    werden. ERSTENS die mitbestimmungsrechtliche: Wenn das System das Erfahrungswissen erfahrener Mitarbeiter
    erfasst und an Anfänger weitergibt, ist die Einführung nicht bloß eine technische Einrichtung nach
    § 87 Abs. 1 Nr. 6 BetrVG, sondern ein Vorgang der Wissensenteignung mit Auswirkungen auf die Entgeltstruktur
    — ein Argument, das im deutschen Schrifttum fehlt. ZWEITENS die diskriminierungsrechtliche Kehrseite:
    Ein Werkzeug, das Anfängern überproportional nützt, verringert Leistungsunterschiede und entwertet
    damit Senioritäts- und Erfahrungskriterien in Vergütung und Beförderung. Für die Praxis der wichtigste
    Punkt: Dies ist die belastbarste Feldstudie zur Produktivitätswirkung generativer KI überhaupt — gestaffelte
    Einführung, echte Betriebsdaten, große Fallzahl. Wer über Produktivitätsgewinne argumentiert, sollte
    diese Studie und ihre Grenzen kennen, statt Anbieterangaben zu übernehmen. ANGREIFBAR: ein einziges
    Unternehmen, ein eng umgrenzter Aufgabentyp (Kundendienst per Text), eine früh eingesetzte Modellgeneration.
    Die Verallgemeinerung auf wissensintensive Tätigkeiten mit unklarem Erfolgskriterium ist nicht belegt
    — und die Gegenevidenz auf gesamtwirtschaftlicher Ebene steht in 2025-humlum-vestergaard-still-waters.
    HINWEIS: NBER-Seite frei abrufbar; PDF teilweise gesperrt.

    '
  letzte_pruefung: 2026-08-27
