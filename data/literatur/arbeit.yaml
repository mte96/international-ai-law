  kernthese: Algorithmisches Management ist in allen untersuchten Ländern bereits verbreitet; die Führungskräfte
    berichten Qualitätsgewinne, benennen aber unklare Verantwortlichkeit, Unnachvollziehbarkeit der Systemlogik
    und unzureichenden Gesundheitsschutz als Vertrauensprobleme.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die belastbarste Datengrundlage des Kapitels — über 6.000 Betriebe in sechs Ländern,
    darunter Deutschland — und deshalb der Text, mit dem man Behauptungen über die Verbreitung algorithmischen
    Managements belegen kann, statt sie zu wiederholen. Methodische Einschränkung, die man mitzitieren
    muss: Befragt wurden Arbeitgeber, nicht Beschäftigte; die berichteten Zufriedenheitsgewinne sind Fremdeinschätzungen.
    Für die juristische Arbeit ist der erste der drei genannten Vertrauensmängel der wichtigste — "unclear
    accountability" ist die empirische Entsprechung dessen, was das Haftungsrecht in Kapitel I als Zurechnungsproblem
    behandelt. Frei bei der OECD.

    '
  letzte_pruefung: 2026-08-27
