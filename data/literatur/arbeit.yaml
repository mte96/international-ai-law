  - grundrechte
  kernthese: 'Algorithmisches Management auf Lieferplattformen erzeugt unsichtbare Kontrolle bei simulierter
    Autonomie und verschärft die Prekarität der Arbeit; die gewerkschaftlichen Strategien verändern sich
    entsprechend.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Eine systematische Literaturübersicht über 26 Studien aus zwölf Jahren, also kein
    eigener dogmatischer Beitrag — aber genau das brauchte diese Sammlung, weil die kolumbianische Plattformarbeit
    (Rappi) der am besten untersuchte lateinamerikanische Fall ist und man ohne einen Überblick nicht
    weiss, wo man anfangen soll. Die Vierteilung der Befunde ist brauchbar, besonders das Begriffspaar
    "unsichtbare Kontrolle bei simulierter Autonomie": Das ist der Kern der Abgrenzungsfrage, die auch
    bei uns über § 611a BGB entschieden wird, und es ist präziser formuliert als in den meisten deutschen
    Beiträgen. Wer zur Plattformarbeitsrichtlinie (EU) 2024/2831 und ihrer Beschäftigungsvermutung arbeitet,
    findet hier das aussereuropäische Vergleichsmaterial. Die Datenbankauswahl (nur JSTOR und Taylor &
    Francis) ist für eine systematische Übersicht zu eng — die spanischsprachige Rechtsliteratur steht
    dort kaum.

    '
  letzte_pruefung: 2026-09-07
