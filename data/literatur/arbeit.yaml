  - Vestergaard, Emilie
  titel: 'Still Waters, Rapid Currents: Early Labor Market Transformation under Generative AI'
  fundstelle: NBER Working Paper 33777, Mai 2025, revidiert März 2026; frühere Fassung unter dem Titel
    "Large Language Models, Small Labor Market Effects"
  jahr: 2025
  sprache: en
