  - governance
  kernthese: Über dänische Verwaltungsdaten und Betriebsbefragungen zeigen sich zwei Jahre nach Einführung
    generativer Chatbots präzise Nulleffekte auf Verdienst und Arbeitszeit — höchstens zwei Prozent —,
    obwohl die Betriebe selbst Produktivitätsgewinne berichten; die Veränderung liegt in der Umverteilung
    von Aufgaben, nicht im Lohn.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob die arbeitsmarktpolitische Dringlichkeit, auf die sich Regulierungsvorschläge
    und Mitbestimmungsforderungen berufen, empirisch belegt ist. Die wichtigste GEGENPOSITION des Ökonomieblocks,
    und die methodisch stärkste Studie des Feldes überhaupt: dänische Verwaltungsdaten erfassen die Grundgesamtheit,
    nicht eine Stichprobe, und die Autoren berichten präzise geschätzte Nulleffekte statt bloß fehlender
    Signifikanz — das ist ein Unterschied, den juristische Leser regelmäßig übersehen und der hier entscheidend
    ist: Es ist nicht "wir haben nichts gefunden", sondern "wir können einen Effekt über zwei Prozent
    ausschließen". Damit ist die Prämisse breiter Verdrängungswirkung für den Zeitraum bis 2024 widerlegt.
    Zugleich zeigt die revidierte Fassung die eigentliche Bewegung: Aufgaben werden umgeschichtet, Beschäftigte
    wechseln in KI-nahe, besser bezahlte Tätigkeiten. Für die Rechtspolitik folgt daraus, dass Anpassungs-
    und Qualifizierungsrecht die richtige Adresse ist und Beschäftigungsschutz die falsche. ANGREIFBAR:
    Dänemark ist ein kleiner Arbeitsmarkt mit starkem Kündigungsschutzausgleich und hoher Qualifikation;
    die Übertragbarkeit ist begrenzt. Und der Beobachtungszeitraum endet, bevor Agentensysteme in Betrieb
    gingen — 2026-brynjolfsson-canaries misst für Berufsanfänger bereits etwas anderes. HINWEIS: NBER-Seite
    frei abrufbar; PDF teilweise gesperrt.

    '
  letzte_pruefung: 2026-08-27
