  - ca
  themenachsen:
  - arbeit
  - grundrechte
  kernthese: Die Automatisierung der Landwirtschaft setzt koloniale Muster der Arbeitskontrolle fort,
    weil das kanadische Arbeitsrecht Landarbeit seit jeher von den allgemeinen Schutzstandards ausnimmt
    und Robotik diese Ausnahmestellung technisch verfestigt.
  eigene_bewertung: 'Rechtssoziologisch, nicht dogmatisch, und ideologisch deutlich positioniert - man
    muss die Rahmung nicht teilen, um den Befund ernst zu nehmen: Wo das Arbeitsrecht schon vorher Ausnahmebereiche
    kennt, wirkt Automatisierung nicht nivellierend, sondern verstaerkend. Das ist eine These, die sich
    auf die Saisonarbeit in der deutschen Landwirtschaft uebertragen laesst und die in der Diskussion
    um Art. 26 Abs. 7 KI-VO (Unterrichtung der Arbeitnehmervertretung) und die Plattformarbeitsrichtlinie
    ein Gegengewicht bildet. Fuer die Achse arbeit nuetzlich, wenn man ueber Scoring am Arbeitsplatz hinaus
    denken will.'
