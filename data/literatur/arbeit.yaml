    Literatur fast nichts, und dies ist der einzige Text, der Art. 26 Abs. 7 KI-VO und Art. 13 DSGVO nebeneinanderstellt.
    Die Aussage, Art. 13 DSGVO verlange keine KI-Information, ist vertretbar, aber nicht zwingend — der
    Transparenzgrundsatz des Art. 5 Abs. 1 lit. a DSGVO könnte weiter reichen, und der Beitrag räumt das
    selbst ein. Ersetzt nichts; markiert eine Lücke.

    '
