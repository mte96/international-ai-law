  kernthese: 'Die arbeitsrechtliche Antwort auf algorithmisches Management liegt nicht im Datenschutz,
    sondern in der kollektiven Aushandlung: Der Algorithmus ist Gegenstand der Mitbestimmung, weil er
    die Arbeitsorganisation gestaltet.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der den Begriff gesetzt hat, und die Grundlagenarbeit für alles, was seither
    in Brüssel geschrieben wurde — die Plattformarbeitsrichtlinie (EU) 2024/2831 folgt in ihren Kapiteln
    zum algorithmischen Management dieser Linie. Für die deutsche Praxis ist die These unmittelbar umsetzbar:
    §§ 87 Abs. 1 Nr. 6, 90, 95 BetrVG geben dem Betriebsrat die Instrumente, die De Stefano fordert, und
    § 80 Abs. 3 BetrVG seit 2021 ausdrücklich den Sachverständigenanspruch bei KI. Was fehlt, ist die
    Umsetzung: Betriebsvereinbarungen zu Auswahl- und Bewertungssystemen sind selten und meist zu unbestimmt.
    Der Text ist von 2018 und kennt weder generative Systeme noch die KI-VO; die Grundstruktur trägt trotzdem.
    Frei bei der ILO.

    '
  letzte_pruefung: 2026-08-27
