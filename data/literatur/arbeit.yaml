  typ: aufsatz
  autoren:
  - Acemoglu, Daron
  titel: The Simple Macroeconomics of AI
  fundstelle: 'NBER Working Paper 32487, Mai 2024; veröffentlicht als: Economic Policy 40 (2025), Nr.
    121, 13'
  jahr: 2024
  sprache: en
  url: https://www.nber.org/papers/w32487
  zugang: open-access
