  kernthese: Die KI-Verordnung schützt Beschäftigte nur mittelbar über die Hochrisikoeinstufung; die eigentlichen
    Schutzlücken — kontinuierliche Leistungsüberwachung, emotionale Auswertung, Zuweisungsalgorithmen
    — liegen im Arbeits- und nicht im Produktrecht.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Als amtliche europäische Bestandsaufnahme aufgenommen und nützlich für die Frage,
    welche gesetzgeberischen Vorhaben im Arbeitsbereich anstehen — die EPRS-Studien sind der zuverlässigste
    Frühindikator dafür. Der Befund ist der erwartbare und trotzdem wichtige: Die KI-VO ist Produktsicherheitsrecht
    und kann Arbeitsschutz nicht ersetzen; Art. 26 Abs. 7 (Unterrichtung der Arbeitnehmervertretung) ist
    die einzige genuin arbeitsrechtliche Norm der Verordnung, und sie ist eine Informations-, keine Mitbestimmungsregel.
    Der PDF-Pfad auf europarl.europa.eu/RegData beantwortete den Abruf mit einer robots-Sperre; deshalb
    ohne `url`. Über den EPRS-Think-Tank unter der Dokumentnummer PE 774.670 auffindbar.

    '
  letzte_pruefung: 2026-08-27
