  kernthese: Weder die KI-Verordnung noch die Plattformarbeitsrichtlinie geben Beschäftigten Mitgestaltungsrechte
    am System selbst; beide setzen auf Transparenz und Aufsicht und lassen die Machtasymmetrie unberührt.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Die schärfste Kritik aus arbeitnehmernaher Sicht und das Gegenstück zum Bitkom-Papier;
    beide zusammen umreißen den Korridor der Debatte. Der Kern ist ein Befund, den auch die Gegenseite
    nicht bestreitet: Transparenzpflichten geben Auskunft, aber kein Vetorecht — die Entscheidung über
    Einführung und Ausgestaltung des Systems bleibt beim Arbeitgeber. Für die deutsche Diskussion ist
    das der Punkt, an dem das BetrVG mehr leistet als das Unionsrecht, weil § 87 BetrVG eine echte Zustimmungsverweigerung
    kennt. Diese Vergleichsperspektive fehlt dem Text. Sage-Plattform beantwortet automatisierte Abrufe
    mit 403; kein freier Volltext geprüft.

    '
