  kernthese: Algorithmisches Management verschärft die Arbeitgebermacht in allen drei klassischen Dimensionen
    — Auswahl, Weisung, Sanktion — und zugleich löst es die Zurechnung auf, weil der Arbeitgeber sich
    hinter dem System verstecken kann.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche Arbeit des Feldes im angelsächsischen Raum und die Grundlage der
    später von Adams-Prassl mitverfassten Vorschläge zur Plattformarbeitsrichtlinie. Der zentrale Gedanke
    ist für das deutsche Recht anschlussfähiger, als es auf den ersten Blick scheint: Wenn der Algorithmus
    Weisungsrecht ausübt, ist er nicht Werkzeug, sondern Ausübungsform der Direktion — und damit vollständig
    an § 106 GewO und an der Mitbestimmung zu messen. Genau diese Einordnung fehlt der deutschen Literatur,
    die algorithmisches Management überwiegend datenschutzrechtlich behandelt. SSRN-Volltext frei, nicht
    maschinell abrufbar (429).

    '
  letzte_pruefung: 2026-08-27
