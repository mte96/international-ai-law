  kernthese: KI kann Arbeitnehmer ebenso befaehigen wie verdraengen; die vielversprechendste politische
    Antwort auf die Verdraengungswirkung sei die Verkuerzung der Wochenarbeitszeit.
  eigene_bewertung: Phase 2 des Otago-Projekts und der schwaechste der drei Berichte, weil er die juristische
    Ebene weitgehend verlaesst und arbeitsmarktpolitisch argumentiert. Die Empfehlung der Arbeitszeitverkuerzung
    ist eine politische Wertung, keine Rechtsfolge. Ich fuehre den Bericht dennoch, weil er die dritte
    Saeule des einzigen groesseren KI-Rechtsforschungsprojekts Neuseelands bildet und weil die Bestandsaufnahme
    zur algorithmischen Steuerung am Arbeitsplatz brauchbar ist. Wer zur Achse arbeit dogmatisch arbeitet,
    nimmt besser Chelat 2024 aus Indien oder die europaeische Literatur zur Plattformarbeitsrichtlinie.
    Nur ueber die Projektseite verlinkt; ich konnte die Projektseite, nicht aber den Volltext oeffnen.
