  - Burbano Suárez, Amanda Victoria
  titel: 'Gerencia algorítmica: hacia un laberinto de deshumanización laboral. Revisión de literatura
    científica 2013-2024'
  titel_deutsch: 'Algorithmisches Management: auf dem Weg in ein Labyrinth der Entmenschlichung der Arbeit.
    Literaturübersicht 2013–2024'
  fundstelle: Estudios Socio-Jurídicos 28 (2026), Nr. 2, Artikel 15705
  jahr: 2026
  sprache: es
  url: https://revistas.urosario.edu.co/index.php/sociojuridicos/article/view/15705
