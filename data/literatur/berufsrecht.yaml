  kernthese: Generative Systeme erzeugen Beweismittel, die von menschlich erzeugten nicht mehr zu unterscheiden
    sind, weshalb Authentifizierung, Geschworenenverständnis und Prozesskosten neu geregelt werden müssen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der praktisch nützlichste Text der amerikanischen Justiz-KI-Literatur, weil er Handlungsanweisungen
    für Gericht und Anwaltschaft gibt statt Prinzipien zu formulieren, und die Grundlage der Diskussion
    um eine eigene Beweisregel für maschinell erzeugte Beweismittel (FRE 707). Für die deutsche Praxis
    interessant ist die Behandlung der Deepfake-Verteidigung — der Einwand, ein echtes Beweismittel sei
    gefälscht — und der Vorschlag, dafür eine Substantiierungslast einzuführen; im deutschen Zivilprozess
    wäre das eine Frage des Bestreitens mit Nichtwissen nach § 138 Abs. 4 ZPO, was noch niemand ausgearbeitet
    hat. Angreifbar ist die Kostenschätzung, die auf Annahmen beruht, und die Annahme, Sachverständige
    für digitale Forensik stünden in ausreichender Zahl zur Verfügung.

    '
  letzte_pruefung: 2026-08-27
