  kernthese: In einem randomisierten Experiment mit Jurastudierenden verbesserten Reasoning-Modelle die
    Qualität juristischer Arbeitsergebnisse messbar und verringerten zugleich die Halluzinationsrate —
    anders als die frühere Generation von Sprachmodellen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die notwendige Gegenposition zu Magesh u.a. und zur Sanktionsrechtsprechung: Wer
    aus den Halluzinationsfällen auf die Untauglichkeit der Werkzeuge schließt, generalisiert eine Modellgeneration.
    Schwarcz u.a. messen randomisiert und finden Qualitätsgewinne bei sinkender Fehlerrate — das verschiebt
    die berufsrechtliche Frage von "darf man" zu "wie prüft man". Methodisch ist die Arbeit der Magesh-Studie
    überlegen (Randomisierung, Kontrollgruppe), inhaltlich schwächer, weil Studierende keine Anwälte sind
    und Übungsaufgaben keine Mandate. KEINE `url`: SSRN beantwortet automatisierte Abrufe durchgängig
    mit HTTP 429; der Text ist dort frei, nur nicht maschinell abrufbar. Vor Zitat prüfen, ob inzwischen
    eine Zeitschriftenfassung vorliegt.

    '
  letzte_pruefung: 2026-08-27
- id: 2026-bauermeister-gruenberger-pesch-hamburger-protokoll
  typ: blogbeitrag
  autoren:
  - Baürmeister, Tabea
  - Grünberger, Michael
  - Pesch, Paulina Jo
  titel: 'Was und wie lehren wir im Jurastudium in Zeiten von KI? Das Hamburger Protokoll: KI-Edition'
  fundstelle: Verfassungsblog, 25.03.2026
  jahr: 2026
  sprache: de
  url: https://verfassungsblog.de/was-und-wie-lehren-wir-im-jurastudium-in-zeiten-von-ki/
  zugang: open-access
  jurisdiktionen:
  - de
  themenachsen:
  - berufsrecht
  - governance
  bezug_regelwerke:
  - de-berufsrecht-ki
  kernthese: Die juristische Ausbildung muss drei Kompetenzfelder verbinden — juristische Kernfertigkeiten,
    reflektierte Technikkompetenz und Kommunikationsfähigkeit —, und dabei die genuin menschlichen Fähigkeiten
    schärfen, die Juristen von ihren digitalen Werkzeugen unterscheiden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Grünberger (Hamburg) gehört zu den in diesem Auftrag ausdrücklich genannten Autoren,
    und dies ist sein zugänglichster aktueller Text zum Thema. Das Hamburger Protokoll ist aus einem Workshop
    im Dezember 2025 mit Prüfungsämtern, Richtern, Praktikern und Legal-Tech- Unternehmen hervorgegangen;
    es hat den Charakter eines Reformpapiers, nicht eines Aufsatzes. Für die Frage, wie das Berufsbild
    sich verändert, ist es die deutsche Referenzstelle, und es verbindet sich unmittelbar mit "Juristisches
    Prüfen 2030". Angreifbar ist die Kernannahme, es gebe stabil identifizierbare "genuin menschliche"
    juristische Fähigkeiten — das ist eine empirische Behauptung, die das Papier nicht belegt und die
    von der Modellentwicklung laufend widerlegt wird. Bemerkenswert: Der 75. Deutsche Juristentag behandelt
    2026 die Ausbildungsreform, ohne KI zum Schwerpunkt zu machen; dieses Papier füllt die Lücke.

    '
  letzte_pruefung: 2026-08-27
