  - de-berufsrecht-ki
  kernthese: Bis 2030 lösen KI-Systeme juristische Standardfälle selbständig; statt eines Verbots braucht
    es gestufte Prüfungsformate — Präsenzklausur, Hybridklausur mit begrenztem Datenbankzugriff und KI-Klausur
    mit vollem Werkzeugzugang — und Hausarbeiten mit Qüllenverifikationspflicht.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Acht Autorinnen und Autoren aus dem Kreis der deutschen Rechtsdidaktik, darunter
    Wischmeyer, der im Auftrag ausdrücklich genannt ist. Der praktische Wert liegt in der dreistufigen
    Prüfungsarchitektur, die konkret genug ist, um in eine Prüfungsordnung übernommen zu werden — und
    die die bayerische Regelung, um die Rachut und Elmentaler/Hof streiten, überflüssig machen würde,
    weil sie den Durchsetzungskonflikt durch Formatgestaltung auflöst. Das ist der stärkere Weg. Angreifbar
    ist die Prognose selbst ("bis 2030 selbständig"), die weder belegt noch operational ist, und die Annahme,
    Quellenverifikation sei prüfbar. Für jeden, der an Prüfungsordnungen mitwirkt, einschlägig.

    '
  letzte_pruefung: 2026-08-27
- id: 2026-becerril-torres-brain-plasticity
  typ: aufsatz
  autoren:
  - Becerril Torres, Luis
  titel: Human Brain Plasticity as a Limiting Factor in the Use of Artificial Intelligence as a Tool in
    Legal Argumentation
  titel_deutsch: Die Plastizität des menschlichen Gehirns als begrenzender Faktor beim Einsatz künstlicher
    Intelligenz in der juristischen Argumentation
  fundstelle: Mexican Law Review XVIII (2026), Nr. 2, Artikel e20416
  jahr: 2026
  sprache: en
  url: https://revistas.juridicas.unam.mx/index.php/mexican-law-review/article/view/20416
