  themenachsen:
  - berufsrecht
  kernthese: Eine empirische Untersuchung an der National Law School of India University misst die Leistung
    von ChatGPT in juristischen Pruefungen und ordnet sie im Verhaeltnis zu Studierendenleistungen ein.
  eigene_bewertung: Empirisch, nicht dogmatisch - und in dieser Gattung der einzige indische Beitrag,
    den ich gefunden habe. Der Wert liegt darin, dass die Erhebung an einer nicht-westlichen Rechtsfakultaet
    und an indischem Pruefungsstoff durchgefuehrt wurde; die bekannten Studien (Katz u.a. zum US-Bar-Exam,
    Choi zu Minnesota) sind sonst durchweg amerikanisch. Fuer die Frage nach dem Einsatz generativer Systeme
    in Ausbildung und Anwaltschaft brauchbar, fuer die Regulierungsfragen nicht. Autorenliste sehr lang
    (ueber 20 Personen), ich fuehre die zuerst genannten.
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: false
