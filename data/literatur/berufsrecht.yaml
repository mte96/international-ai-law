  bezug_urteile:
  - us-2023-mata-avianca
  kernthese: Auch die auf Retrieval Augmented Generation gestützten juristischen Rechercheprodukte von
    LexisNexis und Thomson Reuters halluzinieren in 17 bis 33 Prozent der Fälle, entgegen der Werbeaussage
    der Anbieter, das Problem sei gelöst.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die Studie, auf die sich die berufsrechtliche Sorgfaltsdiskussion weltweit stützt,
    und der Grund, warum Gerichte und Kammern die Prüfpflicht nicht auf Allzweckchatbots beschränken.
    Ihre Bedeutung liegt in der Adressierung des Gegenarguments: Der Einwand, die Sanktionsfälle beträfen
    nur unbedarfte Anwälte mit ChatGPT, war nach dieser Studie nicht mehr haltbar — auch die juristischen
    Fachprodukte erfinden Fundstellen und geben Rechtssätze falsch wieder. Für das deutsche Berufsrecht
    folgt daraus, dass § 43 BRAO und die Mandantensorgfalt eine Verifikationspflicht begründen, die der
    Anwalt nicht an den Anbieter delegieren kann, unabhängig davon, welches Produkt er einsetzt. Pflicht,
    weil sie die empirische Grundlage jeder Praxisrichtlinie liefert und weil sie methodisch überprüfbar
    ist: Die Autoren legen Aufgabenset und Kodierung offen. Angreifbar ist die Aktualität — gemessen wurde
    2024, die Produkte haben sich verändert — und die Definition von "Halluzination", die falsche Rechtssätze
    und falsche Fundstellen zusammenfasst, obwohl die berufsrechtliche Bewertung auseinanderfällt. Die
    Anbieter haben genau das eingewandt; die Replik der Autoren ist überzeugend, aber die Wiederholung
    der Messung mit den Produkten von 2026 steht aus und wäre eine Publikationsmöglichkeit.

    '
  letzte_pruefung: 2026-08-27
