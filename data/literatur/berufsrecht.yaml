  - Stringhini, Antonella
  titel: Guía de directrices para el uso de ChatGPT e IA generativa de texto en la Justicia
  titel_deutsch: Leitlinien für den Einsatz von ChatGPT und textgenerativer KI in der Justiz
  fundstelle: UBA IALAB (Laboratorio de Innovación e Inteligencia Artificial, Facultad de Derecho, Universidad
    de Buenos Aires) gemeinsam mit Dyntec-Lab, Buenos Aires 2023, 31 Seiten
  jahr: 2023
  sprache: es
  url: https://web.ialab.com.ar/webia/wp-content/uploads/2023/11/Guia-de-directrices-usos-de-ChatGPT-e-IA-generativa-en-la-justicia.pdf
  zugang: open-access
  jurisdiktionen:
  - ar
  themenachsen:
  - berufsrecht
  - sektor-oeffentlich
  - governance
  kernthese: 'Generative Modelle dürfen in der Justiz nur als Assistenz eingesetzt werden: vorherige und
    nachträgliche menschliche Kontrolle sind zwingend, die Delegation der Entscheidung ist verboten, Ausgaben
    gelten stets als Entwurf.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Die früheste ausformulierte Nutzungsleitlinie für generative Modelle in der Justiz,
    die ich weltweit gefunden habe — Ende 2023, also vor den entsprechenden Papieren aus England und Wales
    und lange vor irgendetwas Deutschem. Auf 31 Seiten steht mehr Brauchbares als in manchem Aufsatz:
    fünf Grundsätze, dann operative Anweisungen zu Vertraulichkeit, Bias-Prüfung, Entwurfscharakter, Prompting
    und Verifikation. Der Satz "control humano esencial previo y posterior. Prohibición de delegación
    de toma de decisiones" ist die schärfste Formulierung des Delegationsverbots, die ich kenne, und sie
    ist präziser als Art. 14 KI-VO, weil sie die Kontrolle zeitlich verortet. Für die Arbeit an Nutzungsrichtlinien
    in deutschen Gerichten und Anwaltskanzleien direkt als Vorlage verwendbar. Einschränkung: Es ist eine
    Handreichung, keine Untersuchung — Begründungen stehen nicht darin, und die datenschutzrechtliche
    Analyse fehlt ganz.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-begazo-caceres-razon-practica
  typ: aufsatz
  autoren:
  - Begazo Cáceres, Alonso Ramiro
  titel: 'IA generativa, razón práctica y Derecho: ¿Pueden los modelos generativos de lenguaje realizar
    verdaderos razonamientos prácticos?'
  titel_deutsch: 'Generative KI, praktische Vernunft und Recht: Können generative Sprachmodelle echte
    praktische Schlüsse ziehen?'
  fundstelle: IUS ET VERITAS 71 (2025), 177–200
  jahr: 2025
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/iusetveritas/article/view/33510
  doi: 10.18800/iusetveritas.202502.011
  zugang: open-access
  jurisdiktionen:
  - pe
  themenachsen:
  - berufsrecht
  - grundrechte
  kernthese: 'Generative Sprachmodelle können aus aristotelischer Sicht keine praktischen Schlüsse ziehen,
    weil ihnen die rationalen Eigenschaften fehlen, die das Recht als handlungsleitende Ordnung voraussetzt.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Rechtsphilosophie aus Arequipa, aristotelisch-thomistisch grundiert und deshalb für
    einen deutschen Leser mit Rechtspositivismus im Rücken zunächst befremdlich. Ich nehme den Aufsatz
    trotzdem auf, weil er die Frage präzise stellt, die in der deutschen Debatte um KI-gestützte Rechtsanwendung
    meist umgangen wird: nicht ob das Modell die richtige Antwort produziert, sondern ob es überhaupt
    in dem Sinne schliesst, in dem juristisches Schliessen normative Geltung beansprucht. Die Antwort
    (nein, mangels praktischer Vernunft) ist voraussehbar, die Begründung sorgfältiger als bei den vielen
    Aufsätzen, die dasselbe mit Verweis auf "das Menschliche" behaupten. Wer die Argumentationslinie kennt
    (Finnis, MacIntyre), kann den Text in einer Stunde lesen; wer sie nicht kennt, sollte ihn überspringen,
    weil der praktische Ertrag gering ist.

    '
  letzte_pruefung: 2026-09-07
