  - governance
  kernthese: 'Der mechanische Teil der Rechtsarbeit wird von Maschinen übernommen, der praktische bleibt
    beim Menschen; Richter erster Instanz seien ersetzbar, die Rechtsmittelinstanzen nicht.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Aufgenommen als Beleg für den Ton der frühen peruanischen Debatte, nicht wegen der
    Argumente. Die These, erstinstanzliche Richter seien durch Software ersetzbar, wird nicht begründet,
    sondern behauptet, und sie ist so pauschal, dass sie dem Autor heute vermutlich selbst unangenehm
    wäre. Wer sich fragt, warum die lateinamerikanische Justizdebatte über KI ein anderes Ausgangsniveau
    hat als die europäische, findet hier einen Grund: Der Ersetzungsgedanke war 2021 salonfähig. Für die
    Sache überspringen; als Zeitdokument und als Kontrast zu Becerril Torres (Mexiko) und Sanromán Aranda
    brauchbar.

    '
  letzte_pruefung: 2026-09-07
