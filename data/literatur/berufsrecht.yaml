  kernthese: Der Gebrauch halluzinierter Fundstellen vor Gericht ist kein Einzelfallproblem, sondern ein
    weltweit dokumentiertes Massenphänomen mit über zweitausend gerichtlich festgestellten Fällen in mehr
    als vierzig Jurisdiktionen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die empirische Grundlage der gesamten Sanktionsdiskussion und das einzige Instrument,
    mit dem sich Entwicklung und geografische Verteilung nachvollziehen lassen. Die Zahlen zum Stichtag
    sind der stärkste Einzelbefund dieser Akte: 2.005 Fälle, davon 1.375 in den USA, 214 in Kanada, 110
    in Australien, 62 im Vereinigten Königreich — die Commonwealth-Staaten sind gemessen an ihrer Größe
    massiv überrepräsentiert, was die Erklärung "amerikanisches Prozessrecht" ausschließt und auf die
    Verbreitung englischsprachiger Werkzeuge deutet. Für Deutschland ist die niedrige Zahl kein Entwarnungssignal,
    sondern ein Hinweis auf fehlende Entdeckung: Wo Urteile nicht systematisch veröffentlicht werden,
    fällt die Falschzitierung nicht auf. Methodisch sauber ist die Abgrenzung — erfasst wird nur, wo ein
    Gericht die Verwendung festgestellt hat, nicht die bloße Behauptung. Angreifbar ist die Erhebung:
    Ein Einzelner sammelt, was er findet; Sprachen außerhalb des Englischen sind systematisch unterrepräsentiert.
    Als Zitat immer mit Abrufdatum zu versehen, weil sich die Zahl täglich ändert.

    '
  letzte_pruefung: 2026-08-27
