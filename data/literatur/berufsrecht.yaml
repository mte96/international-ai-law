  kernthese: Der Einsatz algorithmischer Systeme in der Strafjustiz gefährdet Verfahrensgrundrechte durch
    Verzerrung, Undurchsichtigkeit und Erosion des rechtlichen Gehörs und verlangt richterliche Torwächterfunktion,
