- id: 2023-chesterman-roboterrichter
  typ: aufsatz
  autoren:
  - Chesterman, Simon
  - Bennett Moses, Lyria
  - Pagallo, Ugo
  titel: All Rise for the Honourable Robot Judge? Using Artificial Intelligence to Regulate AI
  fundstelle: Technology and Regulation 2023, 45-57
  jahr: 2023
  sprache: en
  doi: 10.71265/0p137y60
  zugang: open-access
  jurisdiktionen:
  - sg
  - intl
  themenachsen:
  - berufsrecht
  - sektor-oeffentlich
  - governance
  kernthese: KI kann als Regulierungswerkzeug fuer KI dienen, aber nicht als Entscheidungstraeger im Gericht;
    die Autoren trennen die Aufgaben, bei denen maschinelle Unterstuetzung die Rechtspflege verbessert,
    von denen, bei denen sie ihre Legitimation zerstoert.
  eigene_bewertung: 'Frei verfuegbar und fuer den Streitstand zum KI-Einsatz im Spruchkoerper direkt einschlaegig.
    Die Dreierbesetzung - Singapur, Australien, Italien - macht den Text rechtsvergleichend breiter als
    uebliche Beitraege. Der brauchbarste Teil ist die Unterscheidung zwischen Aufgaben mit und ohne Wertungsspielraum:
    Terminverwaltung, Aktenerschliessung und Entscheidungsrecherche einerseits, Beweiswuerdigung und Strafzumessung
    andererseits. Das ist genau die Grenzziehung, die Art. 6 i.V.m. Anhang III Nr. 8 lit. a KI-VO mit
    dem Begriff der Unterstuetzung bei der Auslegung und Anwendung des Rechts vornimmt, ohne sie zu praezisieren.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
