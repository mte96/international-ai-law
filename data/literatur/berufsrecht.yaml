  kernthese: Der Einsatz generativer Werkzeuge löst Pflichten aus fünf Regeln zugleich aus — Kompetenz,
    Verschwiegenheit, Mandanteninformation, Aufsicht und Gebühren —, und die Verschwiegenheit verlangt
    vor Eingabe von Mandantsinformationen in selbstlernende Systeme die informierte Einwilligung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die erste umfassende berufsrechtliche Stellungnahme einer großen Anwaltsorganisation
    und die Vorlage, an der sich Kammern weltweit orientieren. Für das deutsche Recht sind zwei Punkte
    unmittelbar übertragbar. Erstens die Verschwiegenheit: Die ABA verlangt informierte Einwilligung vor
    der Eingabe in selbstlernende Systeme — im deutschen Recht führt der Weg über § 43e BRAO (Dienstleister),
    § 203 Abs. 3 StGB und die Vertraulichkeitsvereinbarung, mit dem entscheidenden Unterschied, dass §
    43e BRAO die Einwilligung des Mandanten gerade NICHT verlangt, sondern eine Verpflichtung des Dienstleisters
    genügen lässt. Wer Cloud-KI einsetzt, sollte diesen Unterschied kennen. Zweitens die Gebührenfrage:
    Zeit, die durch KI eingespart wird, darf nicht abgerechnet werden, und die Einarbeitung in das Werkzeug
    ist nicht erstattungsfähig — eine Feststellung, die im deutschen RVG-System anders liegt und deshalb
    selbständig zu entwickeln wäre. Angreifbar ist die Pauschalität der Kategorie "selbstlernend": Ob
    ein Modell aus Eingaben lernt, ist Vertragsfrage, nicht Technikeigenschaft, und die Opinion verwischt
    das.

    '
  letzte_pruefung: 2026-08-27
