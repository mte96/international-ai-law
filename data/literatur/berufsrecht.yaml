  kernthese: Der Einsatz von KI in der taiwanischen Justiz ist praktisch bereits begonnen; noetig seien
    Leitplanken fuer Strafzumessungsempfehlungen und Entscheidungsentwuerfe, nicht ein Verbot.
  eigene_bewertung: Taiwan hat die richterliche Nutzung generativer Systeme frueher und offener diskutiert
    als die meisten europaeischen Rechtsordnungen - der Justizausschuss des Judicial Yuan hat dazu ab
    2023 Leitlinien erarbeitet, und es gab den vielbeachteten Fall eines Urteils mit KI-erzeugten Passagen.
    Der Beitrag ist kurz und praxisnah, dokumentiert aber diese Entwicklung. Fuer den Streitstand zur
    KI im Spruchkoerper eine aussereuropaeische Vergleichsstelle, die man sonst schwer findet. Kein dogmatischer
    Ertrag.
