  kernthese: KI-gestützte Rechtsprechung verschiebt die Justiz von einer auf Einzelfallgerechtigkeit angelegten
    zu einer kodifizierten Justiz, die Standardisierung über moralische Einzelfallabwägung stellt und
    dabei undurchsichtig, datenabhängig und öffentlich unverständlich wird.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der beste theoretische Rahmen für die Frage, wofür ein Richter KI einsetzen darf,
    und der Text, der die Diskussion von der Effizienz auf die Verfassungsfrage verschiebt: Nicht ob die
    Maschine richtig entscheidet, ist das Problem, sondern dass sich der Begriff der richtigen Entscheidung
    verändert, wenn man sie einsetzt. Für die deutsche Debatte ist das der Anschlusspunkt zum gesetzlichen
    Richter (Art. 101 Abs. 1 Satz 2 GG) und zur richterlichen Unabhängigkeit (Art. 97 GG), die beide durch
    eine Entscheidungsunterstützung berührt werden, deren Vorschlägen der Richter faktisch folgt — das
    ist der Automatisierungsbias, den Re und Solow-Niederman als "codified justice" beschreiben, ohne
    die deutschen Normen zu kennen. Angreifbar ist die Prognose: Der Aufsatz ist von 2019 und unterstellt
    spezialisierte Entscheidungssysteme; die tatsächliche Entwicklung geht zu Allzweckassistenten, was
    die Fragestellung eher verschärft.

    '
  letzte_pruefung: 2026-08-27
