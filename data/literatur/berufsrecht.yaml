  zugang: open-access
  jurisdiktionen:
  - mx
  themenachsen:
  - berufsrecht
  - grundrechte
  kernthese: 'Generative Systeme können die "conceptos de violación" des mexikanischen Amparo — den argumentativen
    Kern der Verfassungs- beschwerde — nicht bilden, weil dieser eine wertende Leistung verlangt, die
    algorithmisch nicht abbildbar ist.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Auf Englisch, was den Zugang erleichtert, und mit einer konkreten Fragestellung,
    was ihn von der üblichen "Kann KI Richter ersetzen"-Literatur abhebt: Becerril Torres nimmt eine einzelne,
    formstrenge Schriftsatzgattung des mexikanischen Rechts und fragt, was ein Sprachmodell an ihr scheitern
    lässt. Die neurowissen- schaftliche Rahmung (Hirnplastizität) trägt nichts und ist Beiwerk; man kann
    den Text ohne Verlust ab Abschnitt III lesen. Für die deutsche Debatte um KI-gestützte Schriftsatzerstellung
    und die anwaltliche Sorgfaltspflicht der beste lateinamerikanische Anknüpfungspunkt, weil er die Formstrenge
    als eigenständiges Argument einführt.

    '
  letzte_pruefung: 2026-09-07
