  - ki-vo-art-53
- id: 2025-calderon-marenco-clausula-responsabilidad-smart-contracts
  typ: aufsatz
  autoren:
  - Calderón Marenco, Eduardo Andrés
  - Garzón Solano, Jimmy Enrique
  - Sánchez Silveyra, Romina M.
  - Ravelo-Franco, Gabriel
  - Sal, Guillermo O.
  titel: Retos jurídicos en la codificación de la cláusula de responsabilidad civil en contratos inteligentes
  titel_deutsch: Rechtliche Herausforderungen bei der Kodierung der Haftungsklausel in Smart Contracts
  fundstelle: Revista Chilena de Derecho y Tecnología 14 (2025), Artikel 74870
  jahr: 2025
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/74870
  doi: 10.5354/0719-2584.2025.74870
  zugang: open-access
  jurisdiktionen:
  - latam
  - co
  - pe
  - uy
  themenachsen:
  - vertrag
  - haftung
  - datenschutz
  kernthese: 'Die Haftungsklausel lässt sich in einem Smart Contract nur unvollständig kodieren; das Verbraucherschutzrecht
    Kolumbiens, Perus und Uruguays hält dafür keine Auffanglösung bereit.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Methodisch ehrlich — die Autoren sagen, dass sie eine Literaturauswertung aus Scopus,
    JSTOR, SciELO und Dialnet zwischen 2017 und heute vorgenommen haben, und mehr ist es auch nicht. Der
    juristische Ertrag ist gering: Dass sich eine Haftungsklausel mit unbestimmten Rechtsbegriffen nicht
    in Code übersetzen lässt, ist keine Erkenntnis. Ich führe den Text als Randlage und nehme ihn nur
    auf, weil er zusammen mit dem vorigen die einzige kontinuierlich arbeitende lateinamerikanische Forschergruppe
    zu Smart Contracts dokumentiert und weil die Dreiländerübersicht (Kolumbien, Peru, Uruguay) sonst
    nirgends steht. Wer zu § 305c BGB und algorithmisch vollzogenen Verträgen arbeitet, findet hier keinen
    Gesprächspartner.

    '
  letzte_pruefung: 2026-09-07
