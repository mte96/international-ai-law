  autoren:
  - Szilagyi, Katie
  - Pavlović, Marina
  titel: 'Consensus ad artificialis: Contract Theory Meets the GenAI Mind'
  fundstelle: Canadian Journal of Law and Technology 23 (2026), Heft 2, 303
  jahr: 2026
  sprache: en
  url: https://digitalcommons.schulichlaw.dal.ca/cjlt/vol23/iss2/7
  zugang: open-access
  jurisdiktionen:
  - ca
  themenachsen:
  - vertrag
  - berufsrecht
  kernthese: Generative KI im Vertragsentwurf ist keine blosse Fortsetzung des Boilerplate-Problems, sondern
    verschiebt Marktmacht, Bedeutungszuweisung und Verantwortung entlang des gesamten Vertragslebenszyklus
    - von der Entwurfsphase bis zur Auslegung.
  eigene_bewertung: 'Der Text, den ich fuer die Achse vertrag aus dem Common Law am ehesten brauche, weil
    er die Frage nicht bei der Willenserklaerung des Systems ansetzt (das ist die deutsche Lieblingsfrage
    zu Paragraf 116 ff. BGB und dem Computererklaerungsproblem), sondern bei der Vertragspraxis: Wer ein
    Fremdmodell zur Vertragsgestaltung nutzt, verlagert Auslegungsmacht auf den Modellanbieter. Das ist
    eine kartell- und AGB-rechtliche Beobachtung, keine rechtsgeschaeftslehrliche, und sie ist neu. Schwaeche:
    Die Autorinnen bleiben deskriptiv und formulieren keinen Pruefungsmassstab. Fuer den Rechtsvergleich
    trotzdem sehr ergiebig.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  letzte_pruefung: 2026-09-07
