  - produkthaftungsrichtlinie-2024-2853
  - dsa-2022-2065
  kernthese: Die Verteilung der Pflichten zwischen vor- und nachgelagerten GPAI-Anbietern nach Art. 25
    und 53 ff. KI-VO ignoriert die Machtasymmetrie in der Wertschöpfungskette; Kooperationspflichten laufen
    leer, wo der Downstream-Anbieter keine Verhandlungsmacht hat.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die derzeit einzige wissenschaftliche Arbeit zu Art. 25 KI-VO und damit der Ausgangspunkt
    für alles, was zur vertraglichen Dimension zu sagen ist. Die Verbindung von KI-VO, Produktsicherheits-VO,
    Produkthaftungsrichtlinie und DSA in einer Kette ist neu und überzeugend. Was fehlt und was ein eigenes
    Thema wäre: die AGB-rechtliche Kontrolle der Upstream-Bedingungen (§ 307 BGB, Art. 13 Datenverordnung)
    und die Frage, ob die Kooperationspflicht des Art. 25 Abs. 4 klagbar ist. tandfonline ist bot-gesperrt
    (403); die SSRN-Preprintfassung (5640910) ist frei, wurde wegen SSRN-Ratenbegrenzung aber nicht als
    `url` verifiziert.

    '
  letzte_pruefung: 2026-08-27
