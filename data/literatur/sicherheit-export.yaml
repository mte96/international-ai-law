  kernthese: Große Sprachmodelle und generative Bildsysteme erzeugen spezifische Sicherheitsrisiken —
    Prompt Injection, Datenabfluss, Modellmanipulation —, denen Behörden und Unternehmen mit konkreten
    technischen und organisatorischen Maßnahmen begegnen müssen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Über die BSI-Themenseite belegt; der Volltext des PDF wurde nicht gelesen, die Themenseite
    selbst schon. Der juristische Wert liegt in der Konkretisierung des Art. 15 KI-VO (Genauigkeit, Robustheit,
    Cybersicherheit) und des Standes der Technik nach Art. 32 DSGVO: Wer eine Sorgfaltspflichtverletzung
    darlegen oder abwehren will, braucht einen Maßstab, und in Deutschland ist das faktisch das BSI-Material
    — einschließlich der Kriterienkataloge AIC4, A5 und QUAIDAL. Das ist kein Rechtsdokument, aber es
    wird in Haftungsprozessen wie eines wirken. Die BSI-Publikationen sind vollständig frei und in der
    juristischen Literatur unterzitiert.

    '
  letzte_pruefung: 2026-08-27
