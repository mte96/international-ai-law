  kernthese: Maßgeblich ist nicht das absolute Risiko offener Modelle, sondern ihr Grenzrisiko gegenüber
    bestehenden Technologien; nach diesem Maßstab ist der Nachweis erhöhter Gefahr für Cyberangriffe,
    Desinformation und Biowaffen bislang nicht geführt.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, der die Beweislast in der gesamten Debatte über offene Modellgewichte umgedreht
    hat, und deshalb Pflicht: Vor ihm wurde über die Gefährlichkeit offener Modelle spekuliert, nach ihm
    muss belegt werden, dass sie gefährlicher sind als das, was ohnehin verfügbar ist. Der Rahmen aus
    sechs Schritten — Bedrohungsermittlung, bestehendes Risiko, Grenzrisiko, Verteidigungskosten, Unsicherheit,
    Abwägung — ist die einzige verfügbare Methodik, mit der sich Schwellenwerte begründen ließen, und
    er wird von der NTIA-Untersuchung, vom AI Action Plan und mittelbar von der Systemrisiko-Systematik
    der KI-VO aufgenommen. Für die europäische Arbeit ist er das wichtigste Gegengewicht zur Ausnahmesystematik
    des Art. 53 Abs. 2 und des Art. 54 Abs. 6 KI-VO, die offene Modelle privilegieren, ohne die Privilegierung
    zu begründen — Kapoor u.a. liefern die fehlende Begründung, aber mit einer Einschränkung, die in Brüssel
    gern übersehen wird: Der Befund gilt für die untersuchte Modellgeneration und ist ausdrücklich nicht
    in die Zukunft fortgeschrieben. Angreifbar ist die Marginalrisiko-Logik selbst: Sie bewertet jede
    Fähigkeitsstufe gegen den Status quo und kann deshalb eine schrittweise Verschlechterung nie als Sprung
    erfassen — der Frosch-im-Wasser-Einwand, den Seger u.a. erheben. Wer eine der beiden Seiten zitiert,
    sollte die andere kennen.

    '
  letzte_pruefung: 2026-08-27
