  - intl
  themenachsen:
  - sicherheit-export
  - grundrechte
  kernthese: Verstoesse gegen den humanitaerrechtlichen Unterscheidungsgrundsatz durch KI-gestuetzte Waffensysteme
    lassen sich ueber die Staatenverantwortlichkeit erfassen, ohne dass es einer neuen Zurechnungsfigur
    fuer autonome Systeme bedarf.
  eigene_bewertung: 'Der einzige einschlaegige Beitrag, den ich in der Israel Law Review gefunden habe;
    die Zeitschrift bringt zu KI ueberraschend wenig. Sachlich ist der Aufsatz gut gearbeitet und fuer
    die Achse sicherheit-export brauchbar, weil er den Zurechnungsstreit entschaerft: Nicht das System
    handelt, sondern der Staat, der es einsetzt. Angesichts der israelischen Praxis - die Berichte ueber
    Zielauswahlsysteme im Gazakrieg ab 2023 - hat der Text nachtraeglich an Gewicht gewonnen, obwohl er
    vor diesen Ereignissen geschrieben wurde und sie nicht behandelt. Die Autorin ist keine Israelin;
    die Zuordnung erfolgt ueber die Fundstelle. Genau hier liegt eine Luecke: Zur israelischen Praxis
    selbst habe ich keine juristische Aufarbeitung in einer begutachteten Zeitschrift gefunden.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
