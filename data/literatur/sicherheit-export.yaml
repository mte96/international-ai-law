  kernthese: Technische Werkzeuge können Governance an drei Stellen stützen — Identifikation des Regelungsbedarfs,
    Bewertung von Maßnahmen, Durchsetzung —, und für jede dieser Stellen bestehen benennbare, ungelöste
    technische Probleme.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Aufgenommen als Landkarte: Wer wissen will, welche Rechtspflicht technisch noch gar
    nicht erfüllbar ist — Herkunftsnachweis, Fähigkeitsbewertung, Rechenleistungsverifikation, Datenherkunft
    —, findet hier die vollständigste Übersicht mit Belegen. Für die Auslegung unbestimmter Rechtsbegriffe
    der KI-VO ("Stand der Technik", "angemessene Maßnahmen") ist das unmittelbar verwertbar. Als Argumentationsquelle
    untauglich, weil bewusst neutral gehalten.

    '
