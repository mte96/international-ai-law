  kernthese: Rechenleistungsschwellen sind als Regulierungsinstrument untauglich, weil das Verhältnis
    von Rechenaufwand und Risiko hochgradig unsicher und schnell veränderlich ist und Effizienzgewinne
    die Schwellen fortlaufend entwerten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche Gegenposition zu Sastry u.a. und zugleich die schärfste verfügbare
    Kritik an Art. 51 KI-VO und der inzwischen aufgehobenen amerikanischen Schwelle aus EO 14110. Hookers
    Argument ist technisch und deshalb schwer zu entkräften: Bei gleichbleibendem Rechenaufwand steigt
    die Fähigkeit durch Architektur-, Daten- und Inferenzverbesserungen; ein fester Schwellenwert erfasst
    damit im Zeitverlauf immer schwächere Modelle als "systemisch riskant" und immer stärkere gar nicht.
    Die Reasoning-Modelle, die Rechenleistung von der Trainings- in die Inferenzphase verlagern, haben
    ihr nachträglich recht gegeben — die Schwelle des Art. 51 KI-VO misst eine Größe, die für die Fähigkeit
    nicht mehr allein maßgeblich ist. Angreifbar ist die Konsequenz: Hooker benennt kein Instrument, das
    die Vorzüge der Schwelle — Rechtssicherheit, Messbarkeit, Ex-ante-Anwendbarkeit — ersetzt; Fähigkeitsbewertungen
    sind teurer, langsamer und manipulierbar. Wer die Kritik übernimmt, muss diese Lücke füllen.

    '
  letzte_pruefung: 2026-08-27
