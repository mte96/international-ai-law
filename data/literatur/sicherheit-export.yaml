  titel: La inteligencia artificial aplicada a la robótica en los conflictos armados. Debates sobre los
    sistemas de armas letales autónomas y la (in)suficiencia de los estándares del derecho internacional
    humanitario
  titel_deutsch: Künstliche Intelligenz in der Robotik bewaffneter Konflikte. Debatten über letale autonome
    Waffensysteme und die (Un-)Zulänglichkeit des humanitären Völkerrechts
  fundstelle: Estudios Socio-Jurídicos 23 (2021), Nr. 1
  jahr: 2021
  sprache: es
  url: https://revistas.urosario.edu.co/index.php/sociojuridicos/article/view/9269
  doi: 10.12804/revistas.urosario.edu.co/sociojuridicos/a.9269
  zugang: open-access
  jurisdiktionen:
  - ar
  - intl
  themenachsen:
  - sicherheit-export
  - grundrechte
  kernthese: 'Das geltende humanitäre Völkerrecht reicht für letale autonome Waffensysteme nicht aus;
    die Unterscheidungs- und Verhältnismässigkeitsgebote lassen sich nicht in Zielalgorithmen übersetzen.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Die argentinische Autorin (Universidad Nacional de Luján) publiziert in einer kolumbianischen
    Zeitschrift — für die lateinamerikanische Wissenschaftslandschaft typisch und bei der Zuordnung zu
    beachten. Inhaltlich eine gründliche, aber nicht originelle Bestandsaufnahme der LAWS-Debatte: Martens''sche
    Klausel, Art. 36 ZP I, meaningful human control, die Positionen der CCW-Expertengruppe. Wer die Debatte
    kennt, lernt nichts Neues. Ich nehme den Text auf, weil er der einzige belastbare lateinamerikanische
    Beitrag zur Achse sicherheit-export ist und weil Lateinamerika in der CCW-Gruppe (mit Argentinien,
    Brasilien, Chile und Mexiko in der Gruppe der Befürworter eines verbindlichen Instruments) eine geschlossene
    Position vertritt, die man dokumentiert haben will. Über 2.200 Abrufe — für eine lateinamerikanische
    Rechtszeitschrift viel.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-viveros-responsabilidad-internacional
  typ: aufsatz
  autoren:
  - Viveros-Álvarez, Jimena Sofía
  titel: La inteligencia artificial y la responsabilidad internacional de los estados
  titel_deutsch: Künstliche Intelligenz und die völkerrechtliche Verantwortlichkeit der Staaten
  fundstelle: Estudios en Derecho a la Información 14 (2022), Nr. 1, 83–105
  jahr: 2022
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-informacion/article/view/16894
  doi: 10.22201/iij.25940082e.2022.14.16894
  zugang: open-access
  jurisdiktionen:
  - mx
  - intl
  themenachsen:
  - sicherheit-export
  - haftung
  - grundrechte
  kernthese: 'Autonome Waffensysteme erzeugen eine Verantwortungslücke, weil sich die Zurechnung zu einer
    natürlichen Person und damit zum Staat nicht mehr herstellen lässt; die Artikel der ILC zur Staatenverantwortlichkeit
    lassen sich aber ohne Neuregelung anwenden.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Die Autorin ist inzwischen Mitglied des wissenschaftlichen Beirats des UN-Generalsekretärs
    zu künstlicher Intelligenz — das erhöht das Gewicht des Textes über seinen Inhalt hinaus. Die Leistung
    liegt darin, dass Viveros-Álvarez die Verantwortungslücke nicht beklagt, sondern mit dem vorhandenen
    Instrumentarium schliesst: über die Zurechnungsregeln der ILC-Artikel und die Sorgfaltspflicht bei
    der Prüfung nach Art. 36 ZP I. Das ist die juristisch sparsamere Lösung als Porcellis Ruf nach neuem
    Recht und die beiden Texte lesen sich gut gegeneinander. Für einen deutschen Leser der bessere Einstieg
    in die lateinamerikanische LAWS-Position, weil er auf der Zurechnungsebene ansetzt, wo die eigentliche
    Schwierigkeit liegt.

    '
  letzte_pruefung: 2026-09-07
