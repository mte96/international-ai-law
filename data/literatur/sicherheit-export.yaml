  kernthese: Cloud-Anbieter sind der wirksamste regulatorische Intermediär, weil sie Sicherung, Aufzeichnung,
    Verifikation und Durchsetzung an einem Punkt der Wertschöpfungskette bündeln können, an dem der Staat
    ohnehin Zugriff hat.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die praktische Fortsetzung von Sastry u.a. und der Text, der die Know-Your-Customer-Pflichten
    für Rechenanbieter begründet, die inzwischen in amerikanischen Regelungen auftauchen. Für die europäische
    Diskussion ist die Frage offen und drängend, weil die KI-VO Rechenanbieter gar nicht adressiert: Sie
    kennt Anbieter, Betreiber, Importeure und Händler, aber keine Infrastruktur. Wer nach der Lücke im
    europäischen Rechtsrahmen sucht, findet sie hier. Angreifbar ist die Delegationsstruktur: Die Verfasser
    übertragen hoheitliche Kontrollaufgaben an Private, ohne die grundrechtliche Bindung zu klären — im
    deutschen Recht die Frage der Beleihung, im Unionsrecht die der Grundrechtsbindung Privater. Diese
    Frage stellen sie nicht.

    '
