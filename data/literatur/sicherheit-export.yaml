  kernthese: Sprachmodelle und biologische Entwurfswerkzeuge erzeugen verschiedene Risiken — erstere senken
    die Schwelle für Laien, letztere erweitern die Fähigkeiten von Fachleuten — und verlangen deshalb
    getrennte Regulierungsansätze.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die begriffliche Ordnung, die in der Dual-Use-Diskussion meist fehlt, und der Grund,
    warum pauschale Aussagen über "KI und Biowaffen" unbrauchbar sind: Die RAND-Studie misst die eine
    Kategorie und sagt über die andere nichts. Sandbrinks Unterscheidung ist auch regulatorisch folgenreich,
    weil biologische Entwurfswerkzeuge weder von der KI-VO noch von den amerikanischen Schwellenwerten
    erfasst werden — sie sind klein, spezialisiert und rechenarm. Das ist die größte unbeachtete Lücke
    der geltenden Regulierung und eine Publikationsmöglichkeit. Angreifbar ist die Risikoeinschätzung
    selbst, die auf Plausibilität und nicht auf Messung beruht.

    '
  letzte_pruefung: 2026-08-27
