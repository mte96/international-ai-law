  kernthese: Exportbeschränkungen allein reichen nicht; die amerikanische Strategie muss sie mit aktiver
    Exportförderung verbinden, damit amerikanische KI-Infrastruktur zum Standard in Drittmärkten wird.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Aufgenommen als Beleg für die Wende der amerikanischen Debatte von der Beschränkung
    zur Verbreitung, die 2025 politisch vollzogen wurde (Rücknahme der Diffusionsregel, AI Action Plan).
    Für europäische Leser ist der Text unangenehm aufschlussreich, weil Europa in ihm als Absatzmarkt
    und nicht als Akteur vorkommt — das ist die strategische Ausgangslage, vor der die Souveränitätsdiskussion
    geführt wird. Als Analyse dünn, als Positionsbestimmung nützlich.

    '
