  kernthese: Der Schmuggel kontrollierter KI-Chipsätze erreicht bereits Größenordnungen im hohen Hunderter-
    bis niedrigen Tausenderbereich jährlich und ließe sich durch ein Chipregister mit Stichprobenprüfung,
    Endverwenderkontrollen und internationale Koordination zu überschaubaren Kosten eindämmen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Arbeit, aus der die Durchsetzungsvorschläge stammen, die seither in amerikanischen
    Gesetzentwürfen auftauchen (Chip Security Act, Standortverifikation), und die einzige, die die Kosten
    beziffert — rund 57 Millionen Dollar jährlich, was gemessen am Regelungsziel wenig ist und die politische
    Untätigkeit erklärungsbedürftig macht. Für die europäische Arbeit ist der Text der Beleg dafür, dass
    Exportkontrolle ein Vollzugs- und kein Normierungsproblem ist — eine Einsicht, die auf die Dual-Use-Verordnung
    2021/821 übertragbar ist. Angreifbar sind die Mengenschätzungen, die auf Indizien beruhen (Preisdifferenzen,
    Zollstatistiken, Presseberichte), und die implizite Annahme, dass sich der Nachfragedruck durch Kontrolle
    mindern lässt statt nur zu verlagern — Narayanan/Kapoor bestreiten genau das.

    '
  letzte_pruefung: 2026-08-27
