  kernthese: 'KI ist als normale Technologie zu behandeln — wie Elektrizität oder das Internet —, weshalb
    Nichtverbreitungsansätze abzulehnen sind: Sie konzentrieren Macht, schwächen die Widerstandsfähigkeit
    und adressieren spekulative statt reale Risiken.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die grundsätzlichste Gegenposition dieser Akte und der Text, der die gesamte Compute-Governance-Literatur
    an der Wurzel angreift: Nicht die Instrumente seien falsch, sondern das Bedrohungsmodell. Für die
    juristische Arbeit sind zwei Argumente unmittelbar verwertbar. Erstens die Diffusionsschranke: Zwischen
    Fähigkeit und wirtschaftlicher Wirkung liegen Jahrzehnte, weil Anwendung und Übernahme langsamer sind
    als Methodenfortschritt — das entwertet die Dringlichkeitsprämisse, auf der Ex-ante-Regulierung beruht.
    Zweitens die Machtkonzentration: Nichtverbreitungsregime schaffen ein Oligopol und schwächen genau
    die Verteidiger, die Zugang zu leistungsfähigen Werkzeugen brauchen. Das ist auch das stärkste Argument
    gegen Exportkontrolle, das nicht aus der Industrie kommt. Angreifbar ist die Behandlung der katastrophalen
    Risiken als "spekulativ": Die Verfasser begründen das mit epistemischer Unsicherheit, was symmetrisch
    auch gegen ihre eigene Entwarnung spricht. Wer Anderljung u.a. zitiert, muss diesen Text kennen und
    umgekehrt.

    '
  letzte_pruefung: 2026-08-27
