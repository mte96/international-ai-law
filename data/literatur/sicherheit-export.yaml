  kernthese: In einer kontrollierten Red-Team-Studie unterschieden sich Angriffsplanungen mit und ohne
    Zugang zu großen Sprachmodellen nicht statistisch signifikant; die Planung biologischer Angriffe liegt
    jenseits der Fähigkeitsgrenze heutiger Modelle.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die wichtigste empirische Gegenposition zur Biosicherheitsbegründung der Frontier-Regulierung
    und der einzige kontrollierte Versuch dieser Art. Sie ist in der politischen Debatte konsequent unterschlagen
    worden, weil sie das plausibelste Katastrophenszenario entkräftet. Wichtig ist die zeitliche Bindung:
    Gemessen wurde die Modellgeneration von 2023; die Verfasser sagen ausdrücklich, dass der Befund nicht
    fortschreibbar ist, und spätere Herstellerbewertungen kommen für neuere Modelle zu anderen Ergebnissen.
    Wer die Studie gegen die heutige Regulierung wendet, überdehnt sie; wer sie ignoriert, argumentiert
    ohne Empirie. Methodisch angreifbar ist die Aussagekraft des Nullbefunds: Die Stichprobe ist klein,
    und ein nicht signifikanter Unterschied ist kein Nachweis der Gleichheit.

    '
  letzte_pruefung: 2026-08-27
