  kernthese: Modellgewichte sind gegen 38 identifizierte Angriffsvektoren zu sichern; die nötigen Schutzniveaus
    reichen von einfachem Zugriffsschutz bis zu Maßnahmen gegen staatliche Angreifer, die derzeit kein
    Anbieter erreicht.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die technische Grundlage der Sicherheitsanforderungen an Modellgewichte und der Text,
    aus dem die fünfstufige Sicherheitsniveau-Systematik stammt, die inzwischen in Anbieter-Rahmenwerken
    und in amerikanischen Verwaltungsvorgaben auftaucht. Für diese Akte ist er doppelt einschlägig: Er
    beschreibt Modellgewichte als Rechtsgut, das entwendet werden kann — was die Prämisse des Streitstands
    `modellgewichte-kopie` ist —, und er liefert zugleich den Maßstab, an dem sich die Frage messen lässt,
    ob ein Modell, aus dem sich Trainingsdaten extrahieren lassen, überhaupt "gesichert" ist. Angreifbar
    ist der Zuschnitt auf staatliche Angreifer: Das höchste Sicherheitsniveau ist nach eigener Aussage
    von niemandem erreichbar, was den Maßstab für die Rechtsanwendung entwertet. Für europäische Zwecke
    fehlt der Bezug zu Art. 15 KI-VO (Genauigkeit, Robustheit, Cybersicherheit) und zum Cyber Resilience
    Act — diese Verknüpfung ist offen.

    '
