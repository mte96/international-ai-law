  - Withers, Caleb
  titel: 'Secure, Governable Chips: Using On-Chip Mechanisms to Manage National Security Risks from AI
    & Advanced Computing'
  fundstelle: Center for a New American Security (CNAS), Washington D.C., 08.01.2024
  jahr: 2024
  sprache: en
  url: https://www.cnas.org/publications/reports/secure-governable-chips
  zugang: open-access
  jurisdiktionen:
  - us
  themenachsen:
