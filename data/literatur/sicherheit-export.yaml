  kernthese: Bei künftigen, besonders leistungsfähigen Modellen können die Risiken der Veröffentlichung
    der Gewichte so groß sein, dass die Ziele quelloffener Entwicklung auf anderen Wegen — gestufter Zugang,
    strukturierter Forschungszugang, Auditrechte — verfolgt werden sollten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die Gegenposition zu Kapoor u.a. und der Text, der die Alternativen ausbuchstabiert,
    statt nur zu warnen — das unterscheidet ihn von der übrigen Sicherheitsliteratur. Der belastbarste
    Teil ist die Unumkehrbarkeit: Veröffentlichte Gewichte lassen sich nicht zurückholen, und Sicherheitsvorkehrungen
    im Modell lassen sich mit geringem Rechenaufwand entfernen; das ist der Punkt, an dem die Marginalrisiko-Logik
    strukturell versagt, weil sie Zeitpunktbetrachtungen anstellt. Für die KI-VO ist die Arbeit einschlägig,
    weil sie die Ausnahme für freie und quelloffene Modelle in Art. 53 Abs. 2 KI-VO problematisiert, bevor
    es sie gab. Angreifbar ist die Interessenlage — GovAI steht der Sicherheitsforschung nahe, mehrere
    Verfasser sind bei Anbietern geschlossener Modelle tätig oder waren es —, und die Empfehlungen privilegieren
    im Ergebnis das Geschäftsmodell, dem sie nahestehen. Das entwertet die Argumente nicht, verlangt aber
    Offenlegung beim Zitieren.

    '
  letzte_pruefung: 2026-08-27
