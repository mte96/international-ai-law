  kernthese: Für besonders leistungsfähige Modelle braucht es einen eigenen Regulierungspfad aus Standardsetzung,
    Registrierungs- und Meldepflichten sowie Ex-ante-Risikobewertung und externer Prüfung, weil ihre gefährlichen
    Fähigkeiten vor der Verbreitung nicht zuverlässig bekannt sind.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Text, aus dem die Systematik der Frontier-Regulierung stammt — Kapitel V der
    KI-VO, die britische AI Safety Institute-Architektur, die amerikanischen Meldepflichten —, und die
    Quelle des Begriffs "frontier AI" selbst. Für die juristische Arbeit ist das Dreiproblem-Raster maßgeblich
    (unerwartete Fähigkeiten, schwere Missbrauchbarkeit, schnelle Verbreitung); es erklärt, warum die
    KI-VO bei GPAI von der Produktsicherheitslogik abweicht. Angreifbar ist die institutionelle Herkunft:
    Die Verfasserliste umfasst Beschäftigte von OpenAI, DeepMind und Anthropic; der Vorschlag begünstigt
    Marktteilnehmer, die Compliance-Kosten tragen können, und die Kritik der Regulatory Capture ist gegen
    diesen Text erhoben worden, seit es ihn gibt. Außerdem setzt der Ansatz voraus, dass sich gefährliche
    Fähigkeiten vor der Freigabe messen lassen — genau das bestreiten die Evaluationsskeptiker. Gegenposition:
    Narayanan/Kapoor 2025.

    '
  letzte_pruefung: 2026-08-27
