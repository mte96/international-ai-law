  kernthese: Rechenleistung ist wegen ihrer Erkennbarkeit, Ausschliessbarkeit, Quantifizierbarkeit und
    der Konzentration ihrer Lieferkette der wirksamste Ansatzpunkt staatlicher KI-Regulierung, birgt aber
    Risiken für Privatheit, Wettbewerb und Machtkonzentration.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der Referenztext der Compute Governance und die theoretische Grundlage sowohl der
    amerikanischen Exportkontrollpolitik als auch der 10^25-FLOP-Schwelle des Art. 51 KI-VO. Wer Exportkontrolle,
    Meldepflichten oder Rechenzentrumsauflagen bewerten will, braucht die vier Eigenschaften als Prüfraster.
    Bemerkenswert ist die Selbstkritik: Die Verfasser — größtenteils Befürworter — benennen die Kehrseite
    ausdrücklich, nämlich dass eine Infrastruktur zur Überwachung von Rechenleistung zugleich eine Infrastruktur
    zur Überwachung von Berechnungen ist und Marktkonzentration begünstigt. Diese Passage wird in der
    Rezeption fast durchgängig ausgelassen und ist der juristisch interessanteste Teil, weil sie die Grundrechtsfrage
    aufwirft, die weder die KI-VO noch die amerikanischen Regelungen behandeln. Angreifbar ist die Kernprämisse
    — die Kopplung von Rechenleistung an Fähigkeit —, gegen die Hooker 2024 argumentiert.

    '
  letzte_pruefung: 2026-08-27
