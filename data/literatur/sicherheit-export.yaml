  - Pacholska, Magdalena
  titel: 'Military Artificial Intelligence and the Principle of Distinction: A State Responsibility Perspective'
  fundstelle: Israel Law Review 56 (2022), Heft 1, 3-23
  jahr: 2022
  sprache: en
  doi: 10.1017/s0021223722000188
  zugang: bezahlt
  jurisdiktionen:
