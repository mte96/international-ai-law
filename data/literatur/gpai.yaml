  kernthese: Extreme Risiken sind über zwei getrennte Prüfungen zu erfassen — Bewertung gefährlicher Fähigkeiten
    (was kann das Modell?) und Bewertung der Ausrichtung (wozu neigt es?) —; erst beide zusammen tragen
    eine Aussage über das Risiko.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was Art. 55 Abs. 1 lit. a und b KI-VO inhaltlich verlangen —
    der Begriff der "Bewertung gefährlicher Fähigkeiten" stammt aus diesem Text und ist über den GPAI-Verhaltenskodex
    ins Unionsrecht gewandert. Faktisch die Quelle der europäischen und britischen Aufsichtspraxis: Die
    Zweiteilung Fähigkeit/Ausrichtung strukturiert die Sicherheitsrahmen von Anthropic, OpenAI und DeepMind
    ebenso wie die Sicherheitskapitel des GPAI-Verhaltenskodex. Wer die Pflichten des Art. 55 auslegt
    oder eine Modelldokumentation prüft, sollte wissen, woher die Struktur kommt und was sie voraussetzt.
    Der juristisch wichtigste Satz steht am Rand: Die Verfasser betonen, dass Bewertungen NEGATIVE Ergebnisse
    nicht beweisen können — das Ausbleiben einer gefährlichen Fähigkeit im Test belegt nicht ihr Fehlen,
    weil die Elicitation unvollständig sein kann. Für die Beweislast im Aufsichtsverfahren ist das entscheidend:
    Eine bestandene Bewertung ist keine Unbedenklichkeitsbescheinigung, und ein Anbieter, der sie als
    solche anführt, überdehnt sie. ANGREIFBAR: Die Verfasserliste besteht überwiegend aus Angehörigen
    der Labore, deren Modelle bewertet werden sollen; das Papier begründet zugleich ein Verfahren und
    die Zuständigkeit derer, die es entworfen haben. Diese Selbstregulierungs- schleife ist im Papier
    nicht reflektiert und der stärkste Einwand gegen seine Übernahme ins Aufsichtsrecht.

    '
