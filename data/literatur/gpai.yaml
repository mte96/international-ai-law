  kernthese: Die Uneinheitlichkeit der KI-Regulierung ueber Rechtsordnungen hinweg ist kein zu behebender
    Mangel, sondern erzeugt als Rechtspluralismus Lernvorteile und Machtbalancen, die eine Harmonisierung
    zerstoeren wuerde.
  eigene_bewertung: 'Die Gegenthese zu Raso 2026 aus Kanada, und beide zusammen bilden den interessantesten
    Streit, den ich in diesem Konvolut gefunden habe: Raso greift Interoperabilitaet als verdeckte Vereinheitlichungspolitik
    an, Lim verteidigt die Vielfalt als produktiv. Fuer die Beurteilung des Bruesseler Effekts und der
    Frage, ob die KI-VO als globaler Standard wuenschenswert ist, sollte man beide lesen. Lim schreibt
    aus der US-Perspektive (Penn State), publiziert aber in der singapurischen Leitzeitschrift im Rahmen
    eines Sonderteils zu Immaterialgueterrecht und Technologie, den David Tan herausgegeben hat. Das Heft
    ist frei zugaenglich - Singapur ist damit die einzige der hier untersuchten asiatischen Rechtsordnungen
    mit offener Leitzeitschrift.'
  prioritaet: wichtig
