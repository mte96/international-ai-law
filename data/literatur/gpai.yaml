  kernthese: Der Code of Practice begründet Pflichten, die die KI-VO nicht kennt — externe Evaluierung
    vor Markteinführung, robots.txt-Beachtung, Verhinderung nachgelagerter Urheberrechtsverletzungen —
    und überschreitet damit die Grenzen der Durchführungsbefugnis nach Art. 56 Abs. 6.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die kompetenzrechtlich sauberste Kritik am Code of Practice: Ein Durchführungsrechtsakt
    darf den Basisrechtsakt weder ändern noch ergänzen, auch nicht in nicht wesentlichen Elementen. Das
    Argument ist justiziabel — es beschreibt einen Nichtigkeitsgrund, nicht nur eine Unschönheit. Bemerkenswert
    die Frontstellung: Derselbe Autor, der die Verordnung für zu wenig risikobasiert hält (2025-ebers-truly-risk-based),
    hält den Code für zu streng. Das ist keine Inkonsistenz, sondern die Konsequenz einer formalen Position
    — und genau deshalb der beste Einstieg für eine eigene Auseinandersetzung mit der Rechtsnatur des
    Code of Practice.

    '
  letzte_pruefung: 2026-08-27
