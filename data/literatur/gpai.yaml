  kernthese: Modelle, die auf breiten Datenmengen vortrainiert und anschließend für viele Aufgaben angepasst
    werden, bilden eine eigene Technologieklasse, deren Homogenisierungseffekt Fehler und Verzerrungen
    auf alle nachgelagerten Anwendungen überträgt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: warum die KI-VO überhaupt eine eigene Regulierungsschicht für
    Modelle statt für Anwendungen kennt (Art. 51 ff.) — die Homogenisierungsthese dieses Berichts ist
    die technische Begründung dafür. Der Text hat den Begriff "foundation model" geprägt, der über den
    Entwurfsprozess in Art. 3 Nr. 63 KI-VO als "KI-Modell mit allgemeinem Verwendungszweck" eingegangen
    ist; wer die Entstehungsgeschichte der GPAI-Schicht rekonstruieren muss, kommt hier nicht vorbei.
    LESEHINWEIS: 214 Seiten, 177 Verfasser — nicht am Stück lesen. Abschnitt 1 (Einführung, insbesondere
    die Unterscheidung von Emergenz und Homogenisierung) und Abschnitt 5 (Gesellschaft) genügen; Abschnitt
    4.4 zu Rechtsfragen ist von Juristen geschrieben und inzwischen überholt. ANGREIFBAR: Der Bericht
    ist Manifest und Bestandsaufnahme zugleich; die Kritik (Gebru, Bender) lautet, dass die Prägung eines
    neuen Oberbegriffs vor allem der Institution diente, die ihn prägte. Für die juristische Verwendung
    ist das gleichgültig — der Begriff steht im Gesetz.

    '
  letzte_pruefung: 2026-08-27
