  kernthese: Der Entwurf der europaeischen KI-Verordnung erfasst Universalmodelle wie ChatGPT nur unzureichend,
    weil die Risikoklassifikation an den Verwendungszweck anknuepft, den der Anbieter eines Grundmodells
    gerade nicht bestimmt.
  eigene_bewertung: Bemerkenswert, weil ein taiwanischer Beitrag den europaeischen Verordnungsentwurf
    zum Gegenstand macht - das belegt, wie stark der Bruesseler Entwurf auch in Ostasien als Referenz
    gelesen wurde. Der Text stammt aus Juli 2023 und damit aus der Phase vor der Einigung ueber Kapitel
    V; die dort formulierte Kritik ist genau der Punkt, den der Trilog mit den Art. 51 ff. KI-VO und der
    Schwelle von 10 hoch 25 Gleitkommaoperationen zu loesen versuchte. Als Zeitdokument der aussereuropaeischen
    Rezeption nuetzlich, inhaltlich ueberholt.
