  - harmonisierte-normen-jtc21
  kernthese: Eine Auswertung von rund 100 Studien aus zehn Jahren zeigt, dass Benchmarkpraxis durch kulturelle,
    kommerzielle und wettbewerbliche Dynamiken geprägt ist — Datenkontamination, Fehlanreize und Ergebnisoptimierung
    sind strukturell, nicht Einzelfälle.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob quantitative Benchmarks eine taugliche Grundlage für die Konformitätsbewertung
    nach Art. 43 KI-VO und für die harmonisierten Normen des JTC 21 sein können — die Frage, die derzeit
    in der europäischen Normung entschieden wird, ohne dass sie gestellt würde. Der einzige Text des Blocks,
    der aus dem europäischen Regulierungsapparat selbst kommt (JRC-Verfasser) und die Benchmarkkritik
    ausdrücklich an die Regulierung anschließt. Das macht ihn zitierfähig gegenüber Behörden in einer
    Weise, in der ein US-Konferenzpapier es nicht ist. Der für die Praxis wichtigste Einzelbefund ist
    die DATENKONTAMINATION: Wenn Testaufgaben im Trainingskorpus enthalten waren — und bei webweit trainierten
    Modellen sind sie das regelmäßig —, misst der Benchmark Memorisierung statt Fähigkeit. Damit hängen
    zwei Blöcke dieser Akte zusammen, die getrennt diskutiert werden: Das Memorisierungsproblem des Urheberrechts
    ist dasselbe Problem wie das Validitätsproblem der Modellbewertung. Diese Verbindung auszuarbeiten,
    ist eine offene Aufsatzidee. ANGREIFBAR: ein Überblick, keine eigene Messung; die Arbeit trägt zusammen,
    was andere gefunden haben, und ihr normativer Teil bleibt allgemein.

    '
