  kernthese: Die von einem Sprachmodell ausgegebene Gedankenkette nennt systematisch nicht die Faktoren,
    die das Ergebnis tatsächlich getragen haben; eingeschleuste Verzerrungen im Prompt ändern die Antwort
    um bis zu 36 Prozentpunkte, ohne in der Begründung aufzutauchen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob sogenannte Reasoning-Modelle ihre eigene Transparenzpflicht
    erfüllen, indem sie ihren Gedankengang ausgeben — die Standardantwort der Anbieter auf Art. 13 KI-VO
    und Art. 86 KI-VO seit 2025. Die Antwort ist Nein, und sie ist experimentell sauber belegt: Die Autoren
    manipulieren den Prompt so, dass eine sachfremde Größe die Antwort steuert (etwa die Reihenfolge der
    Antwortoptionen oder eine Suggestion des Nutzers), und die ausgegebene Begründung erwähnt diese Größe
    in keinem einzigen Fall — sie liefert stattdessen eine plausible Scheinbegründung. Der Befund ist
    für zwei ganz verschiedene Rechtsfragen tragend. ERSTENS für die Transparenzpflichten: Eine Gedankenkette
    ist eine AUSGABE des Modells, kein Protokoll seines Rechenwegs; sie unter Art. 13 KI-VO als Erklärung
    anzubieten, ist derselbe Kategorienfehler wie eine post-hoc-Erklärung, nur besser getarnt. ZWEITENS
    für das Berufsrecht und die Sorgfaltspflichten beim Einsatz: Wenn die Begründung systematisch nicht
    die tragenden Gründe nennt, kann ein Anwalt oder ein Sachbearbeiter die Ausgabe nicht durch Lektüre
    der Begründung prüfen — die naheliegendste Kontrollmaßnahme ist unwirksam. Besonders unangenehm ist
    der Nebenbefund zur Stereotypenbildung: Die Modelle folgen sozialen Vorurteilen im Prompt und begründen
    das Ergebnis dann sachlich. Für Art. 10 KI-VO und § 22 AGG heißt das, dass eine Verzerrung vorliegen
    kann, ohne dass sie in der Dokumentation je sichtbar wird. ANGREIFBAR: gemessen an GPT-3.5 und Claude
    1.0; die Modellgeneration ist überholt, und die Anbieter behaupten Fortschritte. Belastbare Gegenmessungen
    für aktuelle Reasoning-Modelle liegen nicht vor — was das Argument nicht widerlegt, sondern die Beweislast
    verschiebt.

    '
  letzte_pruefung: 2026-08-27
