  kernthese: 'Der Rechenaufwand, der für eine festgelegte Sprachmodellleistung nötig ist, halbiert sich
    etwa alle acht Monate (95-%-Intervall: fünf bis vierzehn Monate) — deutlich schneller als das mooresche
    Gesetz; den größeren Beitrag zum Fortschritt leistete gleichwohl die schiere Zunahme der Rechenleistung.'
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was die 10^25-FLOP-Schwelle des Art. 51 Abs. 2 KI-VO im Jahr
    ihrer Anwendung tatsächlich erfasst — und dass die Antwort jedes Jahr eine andere ist, ohne dass der
    Wortlaut sich ändert. PFLICHT, weil dies der Text ist, der die verbreitetste juristische Fehlannahme
    dieses Feldes widerlegt: dass eine FLOP-Zahl ein fester Maßstab sei. Sie ist es nicht. Wenn sich der
    Aufwand für eine gegebene Leistung alle acht Monate halbiert, dann bezeichnet dieselbe Zahl nach drei
    Jahren eine rund zwanzigfach höhere Fähigkeit — oder umgekehrt: Ein Modell, das die Fähigkeiten von
    GPT-4 erreicht, unterschreitet die Schwelle nach wenigen Jahren. Die Folgen sind konkret und in mindestens
    drei Richtungen verwendbar. (1) AUSLEGUNG: Art. 51 Abs. 2 in Verbindung mit Art. 51 Abs. 3 KI-VO gibt
    der Kommission die Befugnis, die Schwelle anzupassen; dieser Text ist die Grundlage für die Behauptung,
    dass die Nichtanpassung ermessensfehlerhaft wird, sobald der Zusammenhang zwischen Schwelle und Fähigkeit
    gerissen ist. (2) VERTEIDIGUNG: Ein Anbieter, der unterhalb der Schwelle bleibt, aber vergleichbare
    Fähigkeiten erreicht, kann sich auf die Vermutungswirkung berufen — die Norm privilegiert den effizienteren
    Entwickler, was gesetzgeberisch ersichtlich nicht gewollt ist. (3) WETTBEWERB: Der Effizienzgewinn
    diffundiert, die Schwelle wirkt deshalb zunehmend nur noch gegen die Großen — was die Marktzutrittswirkung
    der Norm über die Zeit umkehrt. Kurz, gut geschrieben, mit einer Abbildung, die man einer Kammer zeigen
    kann. ANGREIFBAR: gestützt auf über 200 Modellauswertungen von 2012 bis 2023 und auf Perplexität als
    Zielgröße, nicht auf Fähigkeiten; die Konfidenzintervalle sind breit, und der Nebenbefund — der größere
    Teil des Fortschritts kam aus mehr Rechenleistung, nicht aus besseren Algorithmen — stützt die Compute-Anknüpfung
    gerade wieder. Beide Seiten stehen in demselben Papier, und beide sind zitierfähig.

    '
