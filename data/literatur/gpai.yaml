  kernthese: Modellfähigkeit lässt sich als Zeithorizont ausdrücken — diejenige Aufgabendauer, die ein
    Mensch braucht und die das Modell noch mit 50 Prozent Erfolgswahrscheinlichkeit bewältigt —; dieser
    Horizont verdoppelt sich seit 2019 etwa alle sieben Monate.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: wie sich Fähigkeitszuwachs in einer Einheit ausdrücken lässt,
    die ein Gericht oder ein Gesetzgeber versteht — nämlich in Zeit statt in Punktzahlen, und damit zugleich,
    wie schnell eine an Fähigkeiten anknüpfende Norm veraltet. Der beste Gegenentwurf zur Benchmarkpunktzahl
    und der Text, den man einer Kammer vorlegen kann: "Das Modell erledigt Aufgaben, für die ein Fachmann
    etwa 50 Minuten braucht" ist eine Aussage, mit der sich arbeiten lässt, und "diese Dauer verdoppelt
    sich alle sieben Monate" ist eine Aussage, die jeden Regulierungsvorschlag mit fester Fähigkeitsschwelle
    in Frage stellt. Zusammen mit 2024-ho-algorithmic-progress bildet der Text die empirische Grundlage
    für das Argument, dass die KI-VO Anknüpfungspunkte gewählt hat, die sich schneller bewegen als ihre
    Änderungsverfahren. Zweiter Nutzen: für die Agenten- und Zurechnungsdiskussion, weil er misst, wie
    lange ein System unbeaufsichtigt arbeiten kann — genau die Größe, die für Aufsichtspflichten maßgeblich
    ist. ANGREIFBAR, und deutlich: gemessen an Softwareentwicklungsaufgaben mit automatischer Erfolgsprüfung;
    die Verallgemeinerung auf Tätigkeiten ohne klares Erfolgskriterium — juristische Arbeit eingeschlossen
    — ist nicht belegt. METR ist zudem eine Organisation, deren Zweck die Warnung vor Fähigkeitszuwachs
    ist; die Aufgabenauswahl ist nicht neutral. Die 50-Prozent-Schwelle ist willkürlich und für rechtliche
    Zwecke zu niedrig.

    '
  letzte_pruefung: 2026-08-27
