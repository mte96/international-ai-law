  kernthese: Die KI-VO verlangt Systemrisikoevaluierungen, liefert aber keine Methodik zur Bestimmung
    des verhältnismäßigen Prüfaufwands; ohne sie können Aufsichtsbehörden die Abwägung nicht führen.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Kurzer Policy-Beitrag in Science (25.02.2026), unterzeichnet von über zwanzig Evaluierungsforschern.
    Rechtlich wenig, aber als Beleg wertvoll: Die technische Community sagt selbst, dass die Evaluierungspflichten
    des Art. 55 ohne Methodik nicht operationalisierbar sind. Science liegt hinter einer Bezahlschranke;
    RAND weist den Beitrag als External Publication nach (EP71258), ebenfalls ohne freien Volltext.

    '
  letzte_pruefung: 2026-08-27
