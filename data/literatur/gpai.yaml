  kernthese: Das systemische Risiko der Art. 51 ff. KI-VO ist keine Rechtskategorie, sondern ein Platzhalter
    für Unwissen; die Verordnung institutionalisiert damit die Ungewissheit, die sie beseitigen soll.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Die schärfste Analyse des GPAI-Kapitels und der einzige Text, der die drei Konstruktionsprobleme
    sauber trennt: (1) institutionalisierte Ungewissheit, (2) Delegation der Risikodefinition an die Risikoverursacher
    über den Code of Practice, (3) die Regelungslücke zwischen Modell und System. Punkt (2) trifft den
    Kern der Legitimationsfrage und lässt sich unmittelbar auf die Normungsdebatte übertragen — es ist
    dieselbe Delegationsstruktur, nur einmal an CEN-CENELEC und einmal an die Modellanbieter. Der 10^25-FLOP-Kritik
    fehlt die technische Tiefe der JRC-Studie (s. 2025-erben-jrc-compute), dafür ist die rechtsdogmatische
    Einordnung dort besser. Als Pflichtlektüre erfasst, weil GPAI der einzige Teil der KI-VO ist, der
    seit 02.08.2025 vollständig gilt und vom Omnibus NICHT verschoben wurde. CC BY-NC.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-51
  - ki-vo-art-55
