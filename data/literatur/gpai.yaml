  kernthese: Modellbewertung darf nicht auf Treffergenauigkeit verengt werden; erst die gleichzeitige
    Messung von sieben Größen — darunter Kalibrierung, Robustheit, Fairness, Verzerrung und Toxizität
    — über 42 standardisierte Szenarien macht Modelle vergleichbar.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: was der Anbieter eines GPAI-Modells nach Art. 55 Abs. 1 lit.
    a KI-VO ("Modellbewertung nach dem Stand der Technik") und nach Anhang XI konkret durchzuführen und
    zu dokumentieren hat. HELM ist der De-facto-Referenzrahmen, auf den sich die europäische Praxis stützt,
    wenn sie "Stand der Technik" bei der Modellbewertung ausfüllen muss; wer die Pflichten des Art. 55
    auslegt, sollte einmal gesehen haben, wie eine vollständige Bewertung aussieht. Der wichtigste Befund
    für Juristen steht in der Einleitung: Vor HELM waren die dreißig untersuchten Modelle nur auf 17,9
    % der Szenarien überhaupt geprüft, und kaum zwei auf denselben — es gab also keine Vergleichbarkeit,
    obwohl alle Anbieter Benchmarkzahlen veröffentlichten. Für die Bewertung von Anbieterangaben in Verfahren
    und Vergabeverfahren ist das der entscheidende Punkt: Eine genannte Benchmarkzahl ohne Angabe von
    Szenario, Prompt und Bedingungen ist keine überprüfbare Behauptung. HELM veröffentlicht sämtliche
    Prompts und Antworten — der Maßstab, an dem sich Transparenzbehauptungen messen lassen. ANGREIFBAR:
    HELM misst, was messbar ist, und die Auswahl der 42 Szenarien ist selbst eine normative Entscheidung
    ohne Verfahren (dazu 2021-raji-everything-benchmark). Zudem veraltet der Rahmen schnell; die 2022er
    Fassung deckt heutige Fähigkeiten nicht ab.

    '
  letzte_pruefung: 2026-08-27
