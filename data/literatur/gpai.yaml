  - dsm-richtlinie-tdm-urheberrecht-ki
  kernthese: Für ein gegebenes Rechenbudget ist ein Modell erst dann optimal trainiert, wenn Parameterzahl
    und Tokenzahl gemeinsam verdoppelt werden; die bis dahin gebauten Modelle waren durchweg zu groß und
    mit zu wenig Daten trainiert.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: gleich zwei Fragen, und die zweite ist in der juristischen Diskussion
    noch nicht angekommen. ERSTENS die Compute-Frage: Wer 10^25 FLOP als Schwelle auslegt, muss wissen,
    dass dieselbe FLOP-Zahl je nach Aufteilung zwischen Parametern und Daten sehr verschiedene Modelle
    ergibt — die Schwelle misst ein Budget, nicht ein Ergebnis. ZWEITENS die Urheberrechtsfrage, und hier
    liegt der eigentliche Wert: Chinchilla verschiebt den Engpass von der Rechenleistung auf die DATENMENGE.
    Seit 2022 ist Trainingsdatenbedarf keine Nebenbedingung mehr, sondern die bindende Restriktion (dazu
    2022-villalobos-run-out-of-data). Das ist die technische Grundlage für zwei juristische Argumente:
    für die Marktschadenanalyse im vierten Fair-Use-Faktor — die Nachfrage nach lizenzierbaren Daten ist
    real und quantifizierbar — und für die Verhältnismässigkeitsprüfung beim Nutzungsvorbehalt nach Art.
    4 DSM-RL, weil sich zeigen lässt, dass der Verzicht auf ein Korpus tatsächlich Leistung kostet und
    nicht bloß Bequemlichkeit. Wer behauptet, es gebe keinen Markt für Trainingsdaten, argumentiert gegen
    dieses Papier. ANGREIFBAR: Die Optimalitätsaussage gilt für das reine Vortraining und ist durch mehrfaches
    Durchlaufen, Destillation, synthetische Daten und Rechenaufwand zur Inferenzzeit inzwischen relativiert;
    die heutige Praxis trainiert bewusst "über-optimal". Für die Anknüpfung an Trainings-FLOP heißt das,
    dass ein wachsender Teil der Fähigkeit gar nicht mehr im Trainingsbudget entsteht — ein Einwand gegen
    Art. 51 Abs. 2, der noch niemandem gehört.

    '
  letzte_pruefung: 2026-08-27
