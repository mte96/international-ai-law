  kernthese: 'Die angeblich sprunghaft auftretenden Fähigkeiten großer Sprachmodelle sind ein Artefakt
    der gewählten Messgröße: Unstetige oder nichtlineare Metriken erzeugen scheinbare Sprünge, stetige
    Metriken zeigen glatte, vorhersagbare Verläufe.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob die Regulierungsprämisse der KI-VO — dass ab einer Schwelle
    plötzlich neue, gefährliche Fähigkeiten auftreten und deshalb eine Schwelle der richtige Anknüpfungspunkt
    ist — technisch trägt. Die zentrale GEGENPOSITION zur Emergenzthese von Wei u.a. (Emergent Abilities
    of Large Language Models, TMLR 2022, arXiv:2206.07682), die ihrerseits die verbreitete Rechtfertigung
    für Schwellenwertregulierung liefert. Wenn Schäffer u.a. recht haben, ist der gesetzgeberische Grundgedanke
    des Art. 51 KI-VO — jenseits von 10^25 FLOP beginne eine qualitativ andere Risikoklasse — nicht bloß
    grob, sondern falsch konstruiert: Fähigkeiten wachsen stetig, und eine Stufe im Recht bildet keine
    Stufe in der Sache ab. Für die Auslegung folgt daraus, dass die Vermutungsregel des Art. 51 Abs. 2
    KI-VO tatsächlich eine reine Verwaltungsvereinfachung ist und nicht, wie Erwägungs- grund 111 nahelegt,
    die Abbildung eines Naturphänomens; das hat Folgen für die Widerlegbarkeit nach Art. 52 Abs. 2. Für
    die Praxis der Anbieter heißt es umgekehrt, dass die Fähigkeiten eines geplanten Modells VORHERSAGBAR
    sind — was die Berufung auf Überraschung als Entlastung entwertet. ANGREIFBAR, und der Streit ist
    nicht entschieden: Die Autoren zeigen, dass die gemessenen Sprünge metrikabhängig sind, nicht dass
    keine relevanten Diskontinuitäten existieren; für sicherheitsrelevante Fähigkeiten ist gerade die
    unstetige Metrik ("schafft es der Angriff oder nicht?") die rechtlich maßgebliche. Wer den Text als
    Beleg dafür zitiert, es gebe keine Fähigkeitssprünge, geht zu weit.

    '
  letzte_pruefung: 2026-08-27
