  kernthese: Gemessen an 46 Anforderungen über den gesamten Lebenszyklus erfüllen die gebräuchlichen KI-Benchmarks
    grundlegende Qualitätsanforderungen nicht; insbesondere fehlt fast durchgängig die Angabe statistischer
    Signifikanz.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: ob ein konkreter Benchmark, auf den sich eine Partei oder eine
    Behörde stützt, methodisch tragfähig ist — und liefert dafür eine Prüfliste, die ein Jurist ohne Statistikkenntnisse
    abarbeiten kann. Der praktisch nützlichste Text des Blocks, weil er das Abstrakte von Raji u.a. in
    46 konkrete Fragen übersetzt und die Ergebnisse für 24 verbreitete Benchmarks öffentlich hinterlegt
    (betterbench.stanford.edu). Wenn ein Anbieter eine Einstufung als Modell mit systemischem Risiko bestreitet
    und dazu Benchmarkzahlen vorlegt, ist dies das Werkzeug, um die Vorlage zu entkräften. Der schärfste
    Einzelbefund: Kaum ein Benchmark gibt Konfidenzintervalle an — die vorgelegten Zahlen sind also nicht
    einmal innerhalb ihres eigenen Rahmens vergleichbar. Für die Beweiswürdigung heißt das, dass Rangunterschiede
    zwischen Modellen regelmäßig nicht signifikant sind, auch wenn sie in Tabellen so aussehen. ANGREIFBAR:
    Die 46 Kriterien sind selbst gesetzt und nicht validiert; die Autoren wenden auf Benchmarks einen
    Maßstab an, den sie ihrerseits nicht begründen. Und die Bewertung ist eine Momentaufnahme von 2024.

    '
