  kernthese: Allgemeine Benchmarks beanspruchen, allgemeine Fähigkeit zu messen, erfüllen aber die Anforderungen
    an Konstruktvalidität nicht — sie messen die Bearbeitung ihrer eigenen Aufgabenmenge, nicht die Eigenschaft,
    deren Namen sie tragen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: welchen Beweiswert ein Benchmarkergebnis im Verfahren hat — und
    ob ein Anbieter, der eine Fähigkeitsschwelle anhand von Benchmarks bestreitet oder behauptet, damit
    etwas belegt. Der Text importiert den Begriff der Konstruktvalidität aus der Testtheorie in die KI-Bewertung,
    und genau dieser Begriff fehlt der juristischen Diskussion. Die Frage lautet nicht "wie hoch ist die
    Punktzahl?", sondern "misst der Test die Eigenschaft, um die es rechtlich geht?" — und für die "Fähigkeiten
    mit hohem Wirkungsgrad" des Art. 51 Abs. 1 lit. a KI-VO ist die Antwort in aller Regel Nein, weil
    niemand die zu messende Eigenschaft je definiert hat. Praktischer Ertrag: Wer eine Anbieterbehauptung
    angreift, die auf Benchmarkergebnissen beruht, sollte nicht die Zahl bestreiten, sondern die Konstruktvalidität
    — das ist der Angriff, gegen den es keine Erwiderung gibt, solange die Norm die Fähigkeit nicht operationalisiert.
    Umgekehrt gilt dasselbe gegen die Aufsicht: Auch das KI-Büro kann eine Einstufung nicht allein auf
    Benchmarkergebnisse stützen. ANGREIFBAR: Die Arbeit ist Kritik ohne Gegenvorschlag; sie sagt, was
    Benchmarks nicht können, nicht, woran man sich stattdessen halten soll. Für die Verwaltungspraxis
    ist das unbefriedigend — ein Regulierer, der nichts messen darf, reguliert nicht.

    '
