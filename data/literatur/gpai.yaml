  kernthese: Kein GPAI-Anbieter berücksichtigt Grundrechts- oder Gesundheitsrisiken in seiner Frontier-Risikoidentifikation,
    weil der Code of Practice nur vier systemische Risiken zwingend vorschreibt und alles Weitere ins
    Ermessen stellt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die erste empirische Auswertung der tatsächlich veröffentlichten Sicherheitsrahmen
    der GPAI-Anbieter — und der Befund ist hart: CBRN, Kontrollverlust, Cyber und schädliche Manipulation
    werden geprüft, Grundrechte von niemandem. Das ist der beste verfügbare Beleg für Careys These, dass
    die Delegation an die Risikoverursacher systematisch unterreguliert. Methodisch begrenzt (Dokumentenanalyse,
    keine Interviews), aber überprüfbar. Für das eigene Publikationsvorhaben zur Legitimation privater
    Regelsetzung der empirische Anker.

    '
  letzte_pruefung: 2026-08-27
