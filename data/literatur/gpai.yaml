  kernthese: Die Schwelle sollte von 10^25 auf 10^26 FLOP angehoben werden, weil 10^25 zu viele Modelle
    erfasst, die kein systemisches Risiko begründen; die kumulierte Rechenleistung ist über das geometrische
    Mittel zweier Schätzverfahren zu bestimmen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die hauseigene Studie der Kommission und damit die Grundlage jeder künftigen Anpassung
    der Schwelle durch delegierten Rechtsakt nach Art. 51 Abs. 3 KI-VO. Sie liefert, was der Rechtsliteratur
    fehlt: eine Messvorschrift (20-%-Bagatellregel, Einbeziehungsregeln, halbjährliche Überprüfung) und
    eine nüchterne Analyse der Verifikationsgrenzen. Politisch brisant: Ein Anheben auf 10^26 würde die
    Zahl der erfassten Modelle drastisch senken — die Deregulierungsdebatte hat hier eine technische Fortsetzung,
    die in der Omnibus-Diskussion unterging.

    '
  letzte_pruefung: 2026-08-27
  normen:
