  kernthese: Systematische Auswertung von 86 aus 1.781 Arbeiten ergibt 13 Kategorien systemischer Risiken
    und 50 Risikoquellen — deutlich mehr als die vier Kategorien, auf die sich die Praxis beschränkt.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der beste verfügbare Beleg dafür, dass der Risikobegriff des Art. 3 Nr. 65 KI-VO
    offen ist und die Verengung auf CBRN, Kontrollverlust, Cyber und Manipulation eine Entscheidung der
    Anbieter ist, keine der Verordnung. Zusammen mit CDT (2026) ergibt das eine belastbare Argumentationskette:
    Die Verordnung lässt dreizehn Risikokategorien zu, der Code of Practice verlangt vier, die Anbieter
    prüfen vier. Methodisch eine Literaturauswertung, keine eigene Risikoanalyse — die Kategorien sind
    entsprechend heterogen.

    '
  letzte_pruefung: 2026-08-27
