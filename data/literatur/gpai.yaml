  kernthese: Der Vorhersagefehler eines Sprachmodells fällt als Potenzgesetz in Modellgröße, Datenmenge
    und eingesetzter Rechenleistung — über mehr als sieben Größenordnungen hinweg und weitgehend unabhängig
    von der Architektur.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: warum das Unionsrecht überhaupt an Rechenleistung anknüpfen KANN
    — die Skalierungsgesetze sind der Grund, aus dem Compute als Stellvertreter für Fähigkeit taugt, und
    zugleich der Grund, aus dem er es nur ungefähr tut. Ohne diesen Text ist Art. 51 Abs. 2 KI-VO nicht
    verständlich: Die Vermutung, dass ein bestimmtes FLOP-Budget eine bestimmte Fähigkeitsklasse indiziert,
    setzt voraus, dass zwischen beidem ein stabiler, monotoner Zusammenhang besteht — und genau diesen
    behauptet Kaplan. Der zweite juristisch erhebliche Befund ist die ARCHITEKTURUNABHÄNGIGKEIT: Breite
    und Tiefe des Netzes spielen kaum eine Rolle. Das trägt die Technikneutralität der Anknüpfung — der
    Gesetzgeber muss nicht wissen, WIE trainiert wurde, sondern nur, WIE VIEL. Für die Praxis: Wer die
    Angemessenheit der Schwelle bestreiten will, muss an der Skalierungsbeziehung ansetzen, nicht an der
    Zahl. ANGREIFBAR: Die konkrete Empfehlung Kaplans — sehr große Modelle auf vergleichsweise wenig Daten
    — ist zwei Jahre später widerlegt worden (2022-hoffmann-chinchilla). Das Potenzgesetz gilt für den
    Vorhersagefehler, nicht für nachgelagerte Fähigkeiten; die Übersetzung von "geringerer Fehler" in
    "gefährlichere Fähigkeit" leistet der Text nicht und niemand sonst. Genau in dieser Lücke steht die
    10^25-Schwelle.

    '
