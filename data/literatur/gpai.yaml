  kernthese: Trainingsrechenaufwand ist ein brauchbares Screening-Kriterium, weil er messbar, verifizierbar
    und früh feststellbar ist — er darf aber nicht isoliert über Schutzmaßnahmen entscheiden.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die begriffliche Grundlage der 10^25-FLOP-Schwelle des Art. 51 Abs. 2 KI-VO, verfasst
    von den Autoren, deren Arbeiten in die Entstehung der Norm eingeflossen sind. Wichtig ist die Einschränkung,
    die der Gesetzgeber nicht übernommen hat: Schwellen sollen Meldepflichten und weitere Prüfung auslösen,
    nicht die Rechtsfolge selbst tragen. Genau das tut Art. 51 aber — die Vermutungsregel knüpft unmittelbar
    an die Schwelle an. Wer die Schwellenkritik führen will, hat hier die Kronzeugen der Gegenseite.

    '
  letzte_pruefung: 2026-08-27
