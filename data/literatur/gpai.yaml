  kernthese: Trainingsrechenleistung einzelner Modelle lässt sich aus öffentlichen Angaben mit angegebener
    Unsicherheit rekonstruieren — die Datenbank kennzeichnet jede Schätzung als gesichert (Faktor 3),
    wahrscheinlich (Faktor 10) oder spekulativ (Faktor 30).
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'MACHT BEANTWORTBAR: die praktische Frage, ob ein bestimmtes Modell die Schwelle des
    Art. 51 Abs. 2 KI-VO überschreitet — und zwar überprüfbar, mit Quellenangabe und beziffertem Fehlerbereich.
    Kein Aufsatz, sondern das Arbeitsmittel, und deshalb hier erfasst: Es gibt keine andere öffentliche
    Quelle, aus der sich die Trainingsrechenleistung konkreter Modelle mit Nachweis entnehmen lässt. Für
    die Beratung heißt das, dass eine Ersteinschätzung, ob ein Anbieter unter Art. 51 ff. KI-VO fällt,
    in Minuten möglich ist. Für das Aufsichtsverfahren ist die Unsicherheitskennzeichnung das Entscheidende:
    Die meisten Schätzungen sind nur auf einen Faktor 3 bis 10 genau, das heißt, für Modelle in der Nähe
    von 10^25 FLOP ist aus öffentlichen Quellen regelmäßig NICHT feststellbar, ob die Schwelle überschritten
    ist. Damit ist die Vermutungsregel des Art. 51 Abs. 2 ohne Mitwirkung des Anbieters kaum vollziehbar
    — ein Befund, der die Meldepflicht des Art. 52 Abs. 1 von einer Formalie zur eigentlichen Durchsetzungsnorm
    macht. Die begleitende Auswertung von 2024 nennt zudem den Befund, dass die Zahl der Modelle oberhalb
    von 10^23 FLOP von zwei (2017) auf über achtzig (Anfang 2024) gestiegen ist, und mahnt ausdrücklich,
    dass Schwellen mitwachsen müssen. ANGREIFBAR: Schätzungen aus Herstellerangaben, Veröffentlichungen
    und Presse; Epoch AI ist privat finanziert und wählt aus, was "bemerkenswert" ist. Für Modelle chinesischer
    Anbieter und für nicht veröffentlichte Modelle ist die Abdeckung lückenhaft.

    '
