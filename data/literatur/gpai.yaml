  kernthese: Foundation Models sollten wie Medizinprodukte der Klasse III behandelt werden — mit Vorabgenehmigung,
    Drittprüfung und verpflichtender Marktbeobachtung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die radikalste marktzugangsrechtliche Position im Feld: Nicht Selbstbewertung, sondern
    Zulassung. Sechzehn konkrete Empfehlungen über drei Ebenen (Daten/Rechenleistung, Modell, Anwendung).
    Die KI-VO ist dem nicht gefolgt — der Text ist damit die Maximalforderung, gegen die man die tatsächliche
    Regelungsintensität abtragen kann. Nützlich auch als Gegenprobe: Wenn schon die Beobachtungspflichten
    des Art. 55 als überzogen gelten, wie realistisch ist dann eine Zulassungslösung?

    '
