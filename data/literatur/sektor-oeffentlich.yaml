  - de-automatisierte-datenanalyse-polizei
  - dsgvo-schnittstelle
  kernthese: Automatisierte Datenanalyse durch Sicherheitsbehörden ist regelmäßig Hochrisiko-KI nach Anhang
    III, und der Gesetzgeber sollte die Anforderungen an Transparenz, Dokumentation und menschliche Aufsicht
    bereits jetzt umsetzen, statt die Übergangsfristen abzuwarten.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Geschrieben aus der Aufsichtsbehörde — Kugelmann ist Landesbeauftragter für den Datenschutz
    in Rheinland-Pfalz —, und das ist der Wert: eine Behördenposition zur Frage, wie KI-VO, DSGVO und
    JI-Richtlinie beim Polizeieinsatz übereinanderliegen. Die stärkste Passage ist die zur menschlichen
    Aufsicht, die nach Auffassung der Autoren mehr verlangt als die Kontrolle des Ergebnisses. Die Empfehlung,
    nicht auf die Fristen zu warten, hat sich nach der Omnibus-Verschiebung auf Dezember 2027 in ihr Gegenteil
    verkehrt: Die Behörden warten. Der Text bleibt lesenswert als Maßstab, nicht als Zeitplan. Ergänzt
    Beck.

    '
  letzte_pruefung: 2026-08-27
