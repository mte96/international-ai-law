  bezug_regelwerke:
  - ki-vo-2024-1689
  kernthese: Die KI-Verordnung überschneidet sich mit den Grundsätzen des Verwaltungsrechts — Ermessen,
    Begründungspflicht, Verhältnismäßigkeit —, ohne sie zu adressieren; der risikobasierte Ansatz bildet
    die verwaltungsrechtliche Verhältnismäßigkeit nur unvollkommen ab.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der beste verfügbare Text zur Schnittstelle von KI-VO und Verwaltungsrecht und ein
    guter Beleg für den Zustand des Feldes: Er kommt aus Griechenland, erscheint in einer kleinen Zeitschrift
    und wird über arXiv verbreitet, weil es keinen etablierten Ort für diese Frage gibt. Inhaltlich am
    wichtigsten ist die Begründungspflicht: Art. 86 KI-VO gewährt ein Recht auf Erläuterung der Einzelfallentscheidung,
    aber nur bei Systemen des Anhangs III und nur bei Entscheidungen mit erheblichen Auswirkungen — der
    deutsche § 39 VwVfG verlangt mehr, was zu der bislang unbeantworteten Frage führt, ob eine Begründung,
    die das Modell nicht erklären kann, formell ordnungsgemäß ist. Für die deutsche Dogmatik zu wenig
    ausgearbeitet, als Ausgangspunkt brauchbar.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-86
