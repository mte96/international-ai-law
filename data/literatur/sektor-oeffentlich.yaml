  kernthese: Automatisierte Systeme zur Erhebung von Stauabgaben werfen in Neuseeland Datenschutz-, Verhaeltnismaessigkeits-
    und Gleichbehandlungsfragen auf, die im Gesetzgebungsverfahren bislang nicht beantwortet sind.
  eigene_bewertung: 'Konkreter Anwendungsfall statt Grundsatzdebatte, und deshalb lehrreich: Kennzeichenerfassung
    im oeffentlichen Raum ist der Standardfall, an dem sich die Verhaeltnismaessigkeit biometrischer und
    quasi-biometrischer Massenerfassung praktisch entscheidet. Tana Pistorius ist Immaterialgueter- und
    Technologierechtlerin (frueher Suedafrika, jetzt Auckland), was dem Beitrag juristische Substanz gibt,
    die andere Policy-Quarterly-Beitraege vermissen lassen. Fuer die Achse sektor-oeffentlich ein brauchbarer
    Fallbezug, mehr nicht.'
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
- id: 2022-zerilli-algorithmische-strafzumessung
