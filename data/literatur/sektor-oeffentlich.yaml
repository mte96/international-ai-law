  - de-automatisierter-verwaltungsakt
  kernthese: Bund und Länder sollten ein rechtlich verbindliches, einheitliches Register aller in der
    Verwaltung eingesetzten KI-Systeme schaffen; die föderale Kompetenzordnung steht dem entgegen und
    macht möglicherweise eine Grundgesetzänderung erforderlich.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige frei zugängliche deutsche Text, der die föderalismusrechtliche Seite
    der KI-Transparenz durchdenkt. Das ist die unterschätzte Frage: Art. 71 KI-VO verlangt eine EU-Datenbank
    für Hochrisiko-Systeme, Art. 49 Abs. 3 KI-VO eine Registrierung durch Behörden als Betreiber — aber
    ein nationales Register über alle Verwaltungsebenen hat im Grundgesetz keine Grundlage, und Art. 91c
    GG trägt es nicht ohne Weiteres. Vieth-Ditlmann sagt das offen und schlägt eine Verfassungsänderung
    vor; das ist mutiger als die Fachliteratur. Als NGO-Papier interessengeleitet, in der Kompetenzanalyse
    aber redlich. Ergänzt Beck.

    '
  letzte_pruefung: 2026-08-27
