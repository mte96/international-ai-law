  bezug_regelwerke:
  - de-automatisierter-verwaltungsakt
  - ki-vo-2024-1689
  kernthese: Der vollautomatisierte Verwaltungsakt nach § 35a VwVfG ist auf gebundene Entscheidungen beschränkt;
    lernende Systeme lassen sich deshalb nur als Entscheidungsvorbereitung einsetzen, was die Frage nach
    der Verantwortung des entscheidenden Amtswalters verschärft statt löst.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die maßgebliche deutsche Verwaltungsrechtlerin zu dieser Frage, und einer der wenigen
    ihrer Beiträge, die frei zugänglich sind — die einschlägigen Aufsätze in DÖV, NVwZ und VerwArch stehen
    hinter beck-online. Der Kern ist die Scheinlösung, die § 35a VwVfG anbietet: Wer das lernende System
    zur Vorbereitung einsetzt und den Menschen entscheiden lässt, hat die Automatisierungsschranke formal
    gewahrt und materiell nichts gewonnen, weil die Übernahme des Vorschlags ohne eigene Sachprüfung genau
    der Fall ist, den die Norm verhindern soll. Das ist dieselbe Struktur wie beim automation bias in
    Art. 14 KI-VO, und die Verbindung zieht Guckelberger nicht. Stand 2023, also vor Anwendbarkeit der
    KI-VO; die dortigen Aussagen zum Unionsrecht sind zu aktualisieren.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - ki-vo-art-14
