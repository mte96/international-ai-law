  bezug_urteile:
  - de-2023-hessendata-bverfg
  kernthese: Wo der Staat seine Analysefähigkeit an private Anbieter auslagert, gibt er die Kontrolle
    darüber ab, wie staatliche Institutionen Wirklichkeit wahrnehmen und Prioritäten setzen — und damit
    eine Frage demokratischer Zurechenbarkeit, nicht bloß des Datenschutzes.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Der Einführungstext zu dem Symposium, das im Spätsommer 2026 die deutsche Debatte
    über automatisierte Datenanalyse strukturiert hat, und zugleich der Zugang zu allen weiteren Beiträgen
    dieser Reihe (Bergemann/Kinz, Rohrbach, Struck/Bürkert). Warum Pflicht: Weil hier die Bundesgesetzgebung
    von 2026 — § 9b BKAG-E, §§ 98d bis 98e StPO-E — zum ersten Mal in einen Zusammenhang gestellt wird,
    der über die Einzelnorm hinausgeht, und weil das Verfassungsblog für dieses Thema die vollständige
    Sammlung der frei zugänglichen deutschen Beiträge bereithält, die es sonst nirgends gibt. Trapp verlagert
    die Frage vom Datenschutz zur Souveränität: Nicht ob die Daten geschützt sind, sondern wer bestimmt,
    wie der Staat sieht. Angreifbar ist genau diese Verlagerung — sie ist rhetorisch stark, dogmatisch
    aber unbestimmt, weil das Grundgesetz für Wahrnehmungshoheit keinen Maßstab bereithält. Ausdrücklich
    zu ergänzen um die Gegenposition, dass die Alternative zu Palantir nicht die analoge Polizei ist,
    sondern eine schlechtere Software; das trägt Struck/Bürkert vor. Ersetzt Beck nicht — es gibt zu diesem
    Gesetzgebungsvorhaben schlicht noch keine Kommentarliteratur, weder frei noch bezahlt.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - hsog-25a
