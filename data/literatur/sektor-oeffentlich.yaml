  kernthese: Prognosesysteme bei Polizei, Staatsanwaltschaften und im Justizvollzug sind in Deutschland
    vielfach ohne Rechtsgrundlage im Einsatz und verstärken Diskriminierung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die einzige frei zugängliche empirische Bestandsaufnahme der in Deutschland tatsächlich
    eingesetzten Prognosesysteme — geographisch wie personenbezogen, einschließlich der Anwendungen im
    Justizvollzug, die in der Rechtsliteratur praktisch nicht vorkommen. Für die Rechtsanwendung ist die
    Bestandsaufnahme wichtiger als die Bewertung: Man kann nicht über die Rechtsgrundlage streiten, wenn
    man nicht weiß, was läuft. Als NGO-Bericht argumentativ einseitig; die Fallbeschreibungen sind aber
    belegt und nachprüfbar. Ergänzt Beck um etwas, das Beck nicht leistet.

