  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  kernthese: Der Einsatz von KI und automatisierter Entscheidungsfindung durch die oeffentliche Verwaltung
    in Kanada braucht keine neuen Prinzipien, sondern die Uebersetzung bestehender verwaltungsrechtlicher
    und menschenrechtlicher Bindungen in nachpruefbare Verfahren - Folgenabschaetzung, Begruendung, Beteiligung
    und gerichtliche Kontrolle.
  eigene_bewertung: 'Der wichtigste kanadische Bericht zum Thema und der Bezugspunkt, an dem sich in Kanada
    alles abarbeitet. Fuer mich ist er deshalb wertvoll, weil die LCO die Frage nicht als Regulierungs-,
    sondern als Verwaltungsrechtsfrage stellt: Was folgt aus den Grundsaetzen der Rechtmaessigkeit, der
    Begruendungspflicht und des fairen Verfahrens, wenn die Behoerde ein Modell einsetzt? Das ist die
    Perspektive, die in der deutschen Debatte um Paragraf 35a VwVfG und Art. 22 DSGVO zu kurz kommt, weil
    wir vom Datenschutz her denken statt vom Verfahrensrecht. Die LCO liefert ausserdem konkretes Material
    zu kanadischen Praxisfaellen (Risikoscores in Einwanderung und Kinderschutz), das man als Anschauungsmaterial
    verwenden kann. Kein dogmatischer Text, aber die Dokumentation, die man zuerst liest.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  letzte_pruefung: 2026-09-07
- id: 2025-garg-lanka-automating-the-state
  typ: aufsatz
  autoren:
  - Garg, Medha
  - Lanka, Shravani Nag
  titel: 'Automating the State: Public Sector AI in India and the Challenge of Rights-Based Regulation'
  fundstelle: Indian Journal of Law and Technology 21 (2025), Heft 1, Beitrag 5
  jahr: 2025
  sprache: en
  url: https://repository.nls.ac.in/ijlt/vol21/iss1/5
  zugang: open-access
  jurisdiktionen:
  - in
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  kernthese: Der Einsatz von KI in der indischen Verwaltung - von Sozialleistungsscoring bis Gesichtserkennung
    - laesst sich mit einem rechtebasierten Regulierungsansatz nur schwer einhegen, weil das indische
    Verwaltungsrecht keine allgemeine Begruendungspflicht und keine wirksame Folgenabschaetzung kennt.
  eigene_bewertung: 'Das indische Gegenstueck zum LCO-Bericht und der beste Ueberblick ueber den staatlichen
    KI-Einsatz in Indien, den ich frei zugaenglich gefunden habe. Was ihn fuer den Rechtsvergleich wertvoll
    macht: Indien setzt Gesichtserkennung und algorithmische Sozialverwaltung in einem Ausmass ein, das
    in Europa nach Art. 5 Abs. 1 lit. h KI-VO grossenteils verboten waere, und tut das ohne Datenschutzaufsicht
    - der Digital Personal Data Protection Act 2023 ist zwar erlassen, die Regeln dazu kamen erst 2025.
    Die Autorinnen zeigen, dass ein rechtebasierter Ansatz institutionelle Voraussetzungen hat, die man
    in Europa fuer selbstverstaendlich haelt. Genau deshalb lesenswert.'
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
