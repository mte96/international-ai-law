  kernthese: Das KIMVG schafft drei neue automatisierte Befugnisse — Training an Asyl- und Aufenthaltsdaten,
    automatisierte Verfahrensbeobachtung und automatisierter Internetdatenabgleich —, ohne die versprochenen
    rechtssicheren, datenschutzkonformen und diskriminierungsfesten Vorkehrungen tatsächlich zu treffen.
  prioritaet: pflicht
  lesestatus: ungelesen
  eigene_bewertung: 'Das KIMVG (Kabinettbeschluss 29.07.2026) ist das erste deutsche Fachgesetz, das KI-Einsatz
    in einem Massenverwaltungsverfahren ausdrücklich regelt, und es betrifft die verletzlichste Betroffenengruppe,
    die das Verwaltungsrecht kennt. Es gibt dazu keine Kommentierung, keine Monografie und keinen Zeitschriftenaufsatz
    — es gibt zwei Verfassungsblog-Beiträge, und dieser ist der vollständigere, weil er alle drei Befugnisse
    und die Änderungen in AufenthG und AsylG durchgeht. Deshalb Pflicht: Wer zum KI-Verwaltungsrecht in
    Deutschland arbeitet, hat derzeit keine Alternative. Die stärkste Passage ist die Verbindung von Art.
    27 KI-VO (Grundrechte-Folgenabschätzung, deren Unterlassung nach § 15 KI-MIG bußgeldbewehrt ist) mit
    Anhang III Nr. 5 und 7 — die Autorinnen zeigen, dass die Behörde als Betreiberin eigene Pflichten
    trifft, die der Entwurf nicht abbildet. Angreifbar: Der Text ist Entwurfskritik, nicht Auslegung;
    er sagt, was fehlt, nicht, wie die vorhandenen Normen zu lesen sind. Und er behandelt die Kernfrage
    — ob das Training an Bestandsdaten überhaupt auf Art. 6 Abs. 1 lit. e DSGVO gestützt werden kann —
    zu knapp. Ersetzt Beck faktisch, weil Beck hier noch nichts hat; das wird sich binnen eines Jahres
    ändern.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - asylg-7
  - dsgvo-art-6-abs-1-lit-e
  - ki-vo-art-27
