  kernthese: Die Gesetzentwürfe zur automatisierten Datenanalyse bei den Bundespolizeibehörden enthalten
    keine wirksamen Vorkehrungen gegen algorithmische Diskriminierung, überschätzen die menschliche Aufsicht
    und geben den Verdachtsbezug preis.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der aktuellste deutsche Text dieser Liste (31.08.2026) und der einzige, der die Diskriminierungsfrage
    im Sicherheitsrecht stellt — dem Bereich, in dem sie praktisch am folgenreichsten und rechtlich am
    schlechtesten geregelt ist, weil die KI-VO für Strafverfolgung weitreichende Ausnahmen kennt und das
    AGG dort ohnehin nicht gilt. Die Kritik an der menschlichen Aufsicht ist der stärkste Punkt und deckt
    sich mit dem, was Kapitel VIII zum Automatisierungsbias sagt: Ein Beamter, der einen Trefferhinweis
    bestätigt, prüft nicht, er nickt ab. Rohrbach ist bei Amnesty International; der Text ist Advocacy
    und als solche zu lesen, aber er benennt die Normen und die Fundstellen. Anschlusspunkt ist die Entscheidung
    des BVerfG vom 16.02.2023 (1 BvR 1547/19), die Rohrbach als Maßstab nimmt und deren Diskriminierungsdimension
    das Gericht selbst nicht ausgeführt hat — dort liegt eine Publikationsmöglichkeit.

    '
  letzte_pruefung: 2026-08-27
