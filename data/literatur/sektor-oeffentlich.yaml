  kernthese: Die deutsche Presseberichterstattung über Palantir verhandelt nur, wie und mit welchem Anbieter
    automatisierte Polizeianalyse stattfindet, nie ob sie stattfinden soll — die Prämisse, dass die Polizei
    solche Software braucht, bleibt unbefragt.
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Diskursanalyse von 21 Presseartikeln, kriminologisch, nicht dogmatisch. Als Rechtsquelle
    wertlos, als Korrektiv wertvoll: Der Text macht sichtbar, dass die Alternative zur Palantir-Software
    in der Debatte nie benannt wird, und liefert damit das Gegenargument zu Trapps Souveränitätsthese.
    Die Stichprobe ist klein und nicht offengelegt begründet. Aufgenommen wegen der Gegenposition, nicht
    wegen der Methode.

    '
