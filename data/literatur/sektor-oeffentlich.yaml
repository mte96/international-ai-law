- id: 2025-freitas-santillan-contratacion-publica
  typ: aufsatz
  autoren:
  - Freitas Cabanillas, Rodrigo Andrés
  - Santillán Crosby, Pedro Eduardo
  titel: 'El Equilibrio Perfecto: Eficiencia Algorítmica vs. Garantías Procedimentales en la Contratación
    Pública Peruana'
  titel_deutsch: 'Das perfekte Gleichgewicht: algorithmische Effizienz gegen Verfahrensgarantien im peruanischen
    Vergaberecht'
  fundstelle: IUS ET VERITAS 71 (2025) — Themenheft "Derecho administrativo y nuevas tecnologías", 222–246
  jahr: 2025
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/iusetveritas/article/view/33512
  doi: 10.18800/iusetveritas.202502.013
  zugang: open-access
  jurisdiktionen:
  - pe
  themenachsen:
  - sektor-oeffentlich
  - marktzugang
  - governance
  kernthese: 'Der Einsatz von KI im peruanischen Vergabeverfahren ist nur in einem hybriden Automatisierungsmodell
    zulässig, das Begründungspflicht, rechtliches Gehör und Verteidigungsrechte erhält.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der beste Text zum peruanischen Verwaltungsverfahren mit KI, und der einzige, der
    die Frage konkret am Vergaberecht durchspielt. Die rechtsvergleichende Auswahl ist ungewöhnlich brauchbar
    — Estland, Frankreich, Singapur, Portugal, Ukraine —, weil sie Rechtsordnungen mit tatsächlich laufender
    Verwaltungsautomation nimmt statt der üblichen Verweise auf die EU. Für einen deutschen Leser ist
    der Anschluss über § 35a VwVfG naheliegend: Freitas und Santillán landen im Ergebnis bei einer ähnlichen
    Grenze (vollautomatisierter Erlass nur ohne Ermessens- und Beurteilungsspielraum), begründen sie aber
    verfassungsrechtlich statt einfachgesetzlich. Schwäche: Der Titel verspricht eine Abwägung, geliefert
    wird eine Aufzählung von Garantien.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-limberger-judges-machines-brazil
  typ: aufsatz
  autoren:
  - Limberger, Têmis
  - Giannakos, Demétrio Beck da Silva
  - Szinvelski, Mártin M.
  titel: Can Judges be Replaced by Machines? The Brazilian Case
  titel_deutsch: Können Richter durch Maschinen ersetzt werden? Der brasilianische Fall
  fundstelle: Mexican Law Review XIV (2022), Nr. 2, 53–81
  jahr: 2022
  sprache: en
  url: https://revistas.juridicas.unam.mx/index.php/mexican-law-review/article/view/16568
  doi: 10.22201/iij.24485306e.2022.2.16568
  zugang: open-access
  jurisdiktionen:
  - br
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  - grundrechte
  kernthese: 'KI senkt die Kosten der Justiz, indem sie einfache Massenvorgänge beschleunigt; eine Ersetzung
    des Richters setzt zwei Bedingungen voraus, die derzeit nicht erfüllt sind — Ergebnisadäquanz und
    die Fähigkeit des Systems, menschliche Korrekturen aufzunehmen.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Auf Englisch und deshalb der leichteste Zugang zur brasilianischen Justizautomatisierung
    — dem weltweit grössten Feldversuch dieser Art. Brasilien setzt über den Conselho Nacional de Justiça
    seit Jahren KI in praktisch allen Landesgerichten ein (Victor beim STF, Sinapses, Elis in Pernambuco);
    wer sich für die praktische Seite von KI in der Justiz interessiert, kommt an Brasilien nicht vorbei.
    Der Text ist rechtsdogmatisch dünn — er formuliert zwei Bedingungen und begründet sie kaum —, aber
    Limberger ist eine etablierte Autorin, und die Bestandsaufnahme der brasilianischen Systeme ist brauchbar.
    Für die deutsche Debatte um KI-Unterstützung bei der Bewältigung von Massenverfahren der beste empirische
    Anknüpfungspunkt. Vorsicht: Der Text ist von 2022 und kennt die 2025 beschlossene Neufassung der CNJ-Resolution
    zum KI-Einsatz in der brasilianischen Justiz noch nicht (Nachfolgerin der Resolução CNJ 332/2020;
    die Nummer der Neufassung vor Zitat prüfen).

    '
  letzte_pruefung: 2026-09-07
- id: 2025-castrillon-garcia-politica-publica-ia-justicia
  typ: aufsatz
  autoren:
  - Castrillón García, Eddison David
  titel: Fortalecimiento institucional del Estado para la implementación de la política pública de Inteligencia
    Artificial en la administración de justicia
  titel_deutsch: Institutionelle Stärkung des Staates für die Umsetzung der KI-Politik in der Justizverwaltung
  fundstelle: Revista de la Facultad de Derecho y Ciencias Políticas (UPB) 55 (2025), Nr. 143, 1–29
  jahr: 2025
  sprache: es
  url: https://revistas.upb.edu.co/index.php/derecho/es/article/view/inteligencia-artificial-administracion-justicia-politica-publica
  doi: 10.18566/rfdcp.v55n143.a1
  zugang: open-access
  jurisdiktionen:
  - co
  themenachsen:
  - sektor-oeffentlich
  - governance
  kernthese: 'Die kolumbianische KI-Politik für die Justiz scheitert nicht am Konzept, sondern an der
    Verwaltungskapazität; erforderlich sind Gegensteuerung zur Rezentralisierung, bessere Governance und
    passende Politikinstrumente.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Verwaltungswissenschaft mehr als Rechtsdogmatik — Neoinstitutio- nalismus, Politikinstrumente,
    territoriale Entwicklung —, und wer eine juristische Argumentation sucht, wird enttäuscht. Der Wert
    liegt in dem, was der Text nebenbei dokumentiert: Kolumbien hat seit dem CONPES 3975 (2019) eine ausgearbeitete
    nationale KI-Politik, die für die Justiz konkrete Vorgaben macht, und trotzdem entscheidet der Kapazitätsmangel
    der Gerichte, was tatsächlich passiert. Das ist der Befund, den man gegen jede Regulierungshoffnung
    halten sollte, und er gilt für Deutschland ebenso. Für die Rechtslage nach der Entscheidung des kolumbianischen
    Verfassungsgerichts T-323/2024 (ChatGPT-Nutzung durch einen Richter in Cartagena) gibt der Text nichts
    her — er erwähnt sie nicht.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-vargas-jaramillo-razonamiento-probatorio
  typ: aufsatz
  autoren:
  - Vargas, Orión
  - Jaramillo Restrepo, Andrés Felipe
  titel: Razonamiento probatorio e inteligencia artificial en la valoración de la prueba judicial
  titel_deutsch: Beweiswürdigendes Schliessen und künstliche Intelligenz bei der richterlichen Beweiswürdigung
  fundstelle: Opinión Jurídica 21 (2022), Nr. 46, 1–25
  jahr: 2022
  sprache: es
  url: https://revistas.udem.edu.co/index.php/opinion/es/article/view/4041
  doi: 10.22395/ojum.v21n46a3
  zugang: open-access
  jurisdiktionen:
  - co
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  kernthese: 'Ein Expertensystem ("Juez Inteligente") kann den Richter beim Aufbau beweisrechtlicher Schlüsse
    unterstützen, indem es dessen Erfahrung mit maschineller Präzision verbindet — ersetzen soll es ihn
    nicht.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der interessanteste kolumbianische Text, den ich frei zugänglich gefunden habe, weil
    er nicht über KI in der Justiz spricht, sondern ein konkretes System beschreibt und dessen Inferenzschritte
    offenlegt. Das erlaubt eine Prüfung, die bei der üblichen Prinzipienliteratur nicht möglich ist. Mein
    Vorbehalt ist grundsätzlicher Art: Die Autoren bauen ein regelbasiertes Expertensystem und nennen
    es künstliche Intelligenz — das ist Technik der achtziger Jahre und hat mit dem, worüber der Gesetzgeber
    heute streitet, wenig zu tun. Genau deshalb ist der Text aber lehrreich: Er zeigt, dass die Formalisierung
    beweisrechtlichen Schliessens auch ohne maschinelles Lernen möglich ist und dass die eigentliche Schwierigkeit
    nicht in der Technik, sondern in der Explizierung der Erfahrungssätze liegt. Für die freie Beweiswürdigung
    nach § 286 ZPO ein instruktiver Kontrast.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-diaz-diez-ia-contratacion-publica
  typ: aufsatz
  autoren:
  - Díaz Díez, Cristian Andrés
  titel: 'Inteligencia artificial en la contratación pública: instrumento y objeto de adquisición'
  titel_deutsch: 'Künstliche Intelligenz im Vergaberecht: Werkzeug und Beschaffungsgegenstand'
  fundstelle: IUS ET VERITAS 71 (2025), 136–159
  jahr: 2025
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/iusetveritas/article/view/33508
  doi: 10.18800/iusetveritas.202502.009
  zugang: open-access
  jurisdiktionen:
  - co
  themenachsen:
  - sektor-oeffentlich
  - marktzugang
  - governance
  kernthese: 'Der Einsatz und die Beschaffung von KI durch die kolumbianische Verwaltung sind bereits
    nach geltendem Recht zulässig — die Normen zur digitalen Transformation des öffentlichen Sektors und
    zu elektronischen Mitteln im Vergabeverfahren tragen sie.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der beste kolumbianische Text der Sammlung, obwohl er in einer peruanischen Zeitschrift
    steht — Díaz Díez lehrt an der EAFIT in Medellín und schreibt über kolumbianisches Recht. Er macht
    die Unterscheidung, an der die meisten anderen vorbeigehen: KI als Instrument des Vergabeverfahrens
    einerseits, KI als beschaffter Gegenstand andererseits. Das sind zwei völlig verschiedene Rechtsfragen,
    und im deutschen Recht liegen sie ebenfalls auseinander (§ 97 GWB und die Verfahrensgestaltung einerseits,
    die Leistungsbeschreibung und die Anforderungen aus Art. 25 ff. KI-VO an den öffentlichen Beschaffer
    andererseits). Er beantwortet die Zulässigkeitsfrage bejahend und ohne den in Lateinamerika üblichen
    Reflex, nach einem neuen Gesetz zu rufen — begründet mit der bestehenden Digitalisierungsgesetzgebung.
    Das ist eine These, an der man sich reiben kann, und der Schlussteil über die "cautelas" zum Schutz
    von Demokratie und Rechtsstaat ist ehrlich genug, die Gegenargumente zu benennen. Als Pflicht eingestuft,
    weil Kolumbien sonst kaum verwertbar vertreten wäre.

    '
  letzte_pruefung: 2026-09-07
- id: 2019-corvalan-prometea-organizaciones-publicas
  typ: monographie
  autoren:
  - Corvalán, Juan Gustavo
  titel: Prometea. Inteligencia artificial para transformar organizaciones públicas
  titel_deutsch: Prometea. Künstliche Intelligenz zur Umgestaltung öffentlicher Organisationen
  fundstelle: Editorial Astrea, Buenos Aires, und Editorial Universidad del Rosario, Bogotá, 1. Auflage
    2019; Volltext frei über UBA IALAB
  jahr: 2019
  sprache: es
  url: https://www.web.ialab.com.ar/webia/wp-content/uploads/2023/03/Libro-Prometea.pdf
  zugang: open-access
  jurisdiktionen:
  - ar
  - co
  themenachsen:
  - sektor-oeffentlich
  - governance
  - arbeit
  kernthese: 'KI kann die aktenzentrierte Bürokratie in eine "intelligente Bürokratie" überführen; Automatisierung
    soll die Arbeit vermenschlichen, indem sie Routine beseitigt und Personal für komplexe Fälle freistellt,
    bei fortdauernder menschlicher Kontrolle.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Das Gründungsdokument der lateinamerikanischen Debatte über KI in der Verwaltung,
    und die einzige Monographie dieser Sammlung, die bei einem klassischen juristischen Verlag (Astrea)
    erschienen und trotzdem frei verfügbar ist. Corvalán leitet das IALAB an der Rechtsfakultät der UBA
    und war zugleich stellvertretender Generalstaatsanwalt der Stadt Buenos Aires, wo Prometea 2017 entstand
    — er beschreibt also ein System, das er selbst gebaut hat, und das ist zugleich die Stärke und die
    Schwäche des Buches. Stärke: Kein anderer Autor kann so genau sagen, was ein KI-System in einer Staatsanwaltschaft
    tatsächlich tut. Schwäche: Es ist eine Werbeschrift. Die Erfolgszahlen sind vom Autor selbst erhoben,
    die Grenzen des Systems werden nicht ernsthaft diskutiert, und die verfassungsrechtlichen Einwände
    gegen automatisierte Antragsbescheidung kommen nur als zu überwindende Bedenken vor. Man liest das
    Buch als Primärquelle für den Prometea-Ansatz und nimmt die Bewertung woanders her — etwa aus dem
    IDB-Bericht von Estevez u.a., der dieselbe Anwendung von aussen untersucht. Für die deutsche Diskussion
    um § 35a VwVfG und um KI im Justizbetrieb ist das der wichtigste lateinamerikanische Referenztext.

    '
  letzte_pruefung: 2026-09-07
- id: 2020-estevez-fillottrani-linares-prometea-bid
  typ: bericht
  autoren:
  - Estevez, Elsa
  - Fillottrani, Pablo
  - Linares Lejarraga, Sebastián
  titel: 'PROMETEA: Transformando la administración de justicia con herramientas de inteligencia artificial'
  titel_deutsch: 'PROMETEA: Die Umgestaltung der Justizverwaltung mit Werkzeugen der künstlichen Intelligenz'
  fundstelle: Banco Interamericano de Desarrollo (BID), Washington D.C., 10.06.2020
  jahr: 2020
  sprache: es
  url: https://publications.iadb.org/es/prometea-transformando-la-administracion-de-justicia-con-herramientas-de-inteligencia-artificial
  doi: 10.18235/0002378
  zugang: open-access
  jurisdiktionen:
  - ar
  themenachsen:
  - sektor-oeffentlich
  - governance
  kernthese: 'Prometea senkte in der Staatsanwaltschaft der Stadt Buenos Aires die Bearbeitungszeit für
    Vertragsgutachten von 90 auf 1 Minute und die Dauer gerichtlicher Anforderungen von 167 auf 38 Tage.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Die externe Gegenprobe zu Corvalán und deshalb der Bericht, den man vor dem Buch
    lesen sollte. Estevez, Fillottrani und Linares Lejarraga sind Informatiker und Politikwissenschaftler
    aus Bahía Blanca und Salamanca, nicht Teil des IALAB, und sie messen die Produktivitätsgewinne selbst.
    Die Zahlen sind spektakulär und werden weltweit zitiert; ich lese sie mit Vorbehalt, weil die Vergleichsbasis
    (die Zeit vor Prometea) aus derselben Behörde stammt, die den Erfolg belegen wollte, und weil "90
    Minuten auf 1 Minute" nur die Erstellungszeit des Entwurfs misst und nicht die Prüfzeit des Staatsanwalts.
    Trotzdem: Es ist die einzige quantifizierte Wirkungsmessung eines KI-Systems in einer Justizbehörde,
    die ich kenne, und wer in Deutschland über Effizienzgewinne durch KI in der Justiz argumentiert —
    in beide Richtungen —, sollte diese Zahlen und ihre Entstehung kennen.

    '
  letzte_pruefung: 2026-09-07
- id: 2026-corvalan-papini-alfonsin-agentes-ia
  typ: monographie
  autoren:
  - Corvalán, Juan Gustavo
  - Papini, Carina M.
  - Alfonsín, Ignacio
  titel: Agentes de IA y derecho administrativo
  titel_deutsch: KI-Agenten und Verwaltungsrecht
  fundstelle: UBA IALAB, Buenos Aires, erste digitale Auflage 24.08.2026
  jahr: 2026
  sprache: es
  url: https://cdn.prod.website-files.com/68a59c363779dabb2e263134/6a90d76d7e82f5ce7e82489f_Corvalan-Papini-Alfonsin%20I%20Agentes%20de%20IA%20y%20Derecho%20Administrativo.pdf
  zugang: open-access
  jurisdiktionen:
  - ar
  themenachsen:
  - sektor-oeffentlich
  - governance
  - haftung
  kernthese: 'Agentische KI verdrängt die Kategorien des Verwaltungsrechts nicht, sondern verlangt ihre
    Neuauslegung; die Agenten sind im "Spiegeldesign" nach Zuständigkeit, Hierarchie und Verantwortung
    der Behörde zu konfigurieren.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der aktuellste Text der ganzen Sammlung (August 2026) und der einzige, der agentische
    Systeme — also KI, die Handlungsketten plant und ausführt — verwaltungsrechtlich durchdenkt. Der Gedanke
    des "Spiegeldesigns" ist der eigentliche Ertrag: Der Agent soll die Zuständigkeitsordnung der Behörde
    nachbilden, damit die Zurechnungskette nicht reisst. Für das deutsche Recht ist das unmittelbar anschlussfähig
    — die Frage, welcher Amtswalter für die Handlung eines autonom planenden Systems einsteht, ist mit
    § 35a VwVfG nicht beantwortet, und die Kategorie der "Shadow AI" (unautorisierte Nutzung durch Bedienstete)
    ist ein Problem, das in der deutschen Literatur bisher nur beiläufig vorkommt. Der Dreistufenaufbau
    (Assistenz, regelbasierte Automatisierung, autonome Agentik) ist eine brauchbare Prüfungsordnung.
    Einschränkung: Corvalán ist Partei — er baut solche Systeme —, der Text ist folglich lösungsoptimistisch
    und die Grenzen des Spiegeldesigns bleiben unerörtert. Und er ist kein Verlagsbuch: keine ISBN, kein
    Peer Review, Selbstverlag des Labors.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-ojeda-guervos-preciado-gestion-tributaria
  typ: aufsatz
  autoren:
  - Ojeda Pérez, Fabián
  - Guervós Maíllo, María Ángeles
  - Preciado Álvarez, Francisco
  titel: Los medios electrónicos y la inteligencia artificial en la gestión tributaria en México
  titel_deutsch: Elektronische Mittel und künstliche Intelligenz in der mexikanischen Steuerverwaltung
  fundstelle: Boletín Mexicano de Derecho Comparado 58 (2025), Nr. 172, Artikel e19577
  jahr: 2025
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-comparado/article/view/19577
  doi: 10.22201/iij.24484873e.2025.172.19577
  zugang: open-access
  jurisdiktionen:
  - mx
  themenachsen:
  - sektor-oeffentlich
  - sektor-finanz
  - datenschutz
  kernthese: 'Das mexikanische Recht der elektronischen Rechnungsstellung (CFDI) trägt den KI-Einsatz
    der Steuerverwaltung bereits; es enthält die Rechtsgrundlagen dafür, dass die Behörde eigene Technologien
    zur Überwachung der Steuerpflichtigen entwickelt.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der praktisch folgenreichste mexikanische Text der Sammlung, auch wenn er sich unscheinbar
    gibt. Mexiko hat mit dem CFDI eines der weltweit dichtesten Systeme elektronischer Rechnungspflicht
    — jede einzelne Rechnung wird in Echtzeit an den SAT übermittelt —, und das ergibt einen Datenbestand,
    mit dem sich Steuerverhalten lückenlos modellieren lässt. Die Autoren stellen fest, dass die Rechtsgrundlage
    dafür bereits besteht, und sie stellen die Grundrechtsfrage nicht. Genau deshalb sollte man den Text
    lesen: Er dokumentiert eine Verwaltungspraxis, die in Deutschland mit der E-Rechnungspflicht seit
    01.01.2025 (§ 14 UStG n.F.) und dem geplanten Meldesystem gerade erst entsteht, und er zeigt, welche
    Fragen dabei ungestellt bleiben. Steuerrechtlich solide, verfassungs- rechtlich blind — und als Beleg
    dafür brauchbar.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-makowiecky-cruz-jurisdiccion-ia
  typ: aufsatz
  autoren:
  - Makowiecky Salles, Bruno
  - Cruz, Paulo Márcio
  titel: 'Jurisdicción e inteligencia artificial: reflexiones y algunas aplicaciones en los tribunales
    brasileños'
  titel_deutsch: 'Rechtsprechung und künstliche Intelligenz: Überlegungen und einige Anwendungen an brasilianischen
    Gerichten'
  fundstelle: Opinión Jurídica 21 (2022), Nr. 46, 1–20
  jahr: 2022
  sprache: es
  url: https://revistas.udem.edu.co/index.php/opinion/es/article/view/3963
  doi: 10.22395/ojum.v21n46a6
  zugang: open-access
  jurisdiktionen:
  - br
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  kernthese: 'Die Rechtsprechungsfunktion verändert sich unter dem Einsatz von KI an den brasilianischen
    Gerichten, ohne dass die Rechtswissenschaft dafür bisher eine Kategorie hätte.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Brasilianische Autoren der UNIVALI, spanische Sprache, kolumbianische Zeitschrift
    — für die Region typisch und ein Grund, bei der Zuordnung nach Autor und Gegenstand zu gehen, nicht
    nach dem Publikationsort. Inhaltlich ist der Text schwächer als Limberger u.a.: Er referiert die Anwendungen
    an den brasilianischen Gerichten, ohne sie zu prüfen, und die "Reflexionen" bleiben allgemein. Ich
    führe ihn als Randlage, brauchbar allenfalls als spanischsprachiger Zugang zum brasilianischen Justizmaterial
    für Leser, die kein Portugiesisch lesen.

    '
  letzte_pruefung: 2026-09-07
- id: 2022-diaz-bustamante-odr-colombia
  typ: aufsatz
  autoren:
  - Díaz Bolívar, Sebastián
  - Bustamante Rúa, Mónica María
  titel: Análisis de los sistemas de solución de conflictos en línea en el mundo y propuesta para su implementación
    en Colombia
  titel_deutsch: Analyse der Online-Streitbeilegungssysteme weltweit und Vorschlag für ihre Einführung
    in Kolumbien
  fundstelle: Revista Chilena de Derecho y Tecnología 11 (2022), Nr. 2, 245–276
  jahr: 2022
  sprache: es
  url: https://rchdt.uchile.cl/index.php/RCHDT/article/view/66688
  doi: 10.5354/0719-2584.2022.66688
  zugang: open-access
  jurisdiktionen:
  - co
  themenachsen:
  - sektor-oeffentlich
  - vertrag
  kernthese: 'ODR-Systeme sind gegen Überlastung und Verzögerung der Justiz wirksam, aber nur, wenn sie
    auf die Bedürfnisse der jeweiligen Gesellschaft zugeschnitten werden; für Kolumbien wird ein eigenes
    Modell vorgeschlagen.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Zwei Autoren der Universidad de Medellín, sauber gearbeitet, und inhaltlich der Punkt,
    an dem sich die lateinamerikanische Debatte von der europäischen unterscheidet: In Kolumbien ist ODR
    keine Verbraucherschutzfrage, sondern eine Antwort auf einen Justizrückstand, der die Rechtsschutzgarantie
    faktisch aushöhlt. Der Vergleichsteil (Alibaba, Rechtwijzer, British Columbia CRT, staatliche Programme)
    ist gründlich, das kolumbianische Modell am Ende eher skizziert. Für die deutsche Diskussion um Online-Verfahren
    nach dem Gesetz zur Einführung eines Online-Verfahrens in der Zivilgerichtsbarkeit ist die lateinamerikanische
    Begründungsfigur — Zugang zum Recht statt Verfahrensökonomie — der interessantere Gedanke. KI kommt
    nur am Rande vor; ich führe den Text als Kontextliteratur.

    '
  letzte_pruefung: 2026-09-07
- id: 2023-sanroman-aranda-juez-ia
  typ: aufsatz
  autoren:
  - Sanromán Aranda, Roberto
  titel: ¿Viabilidad del cambio de un juez por la inteligencia artificial?
  titel_deutsch: Ist die Ersetzung eines Richters durch künstliche Intelligenz möglich?
  fundstelle: Revista de Derecho Privado (UNAM) 1 (2023), Nr. 23, 61–80
  jahr: 2023
  sprache: es
  url: https://revistas.juridicas.unam.mx/index.php/derecho-privado/article/view/18922
  doi: 10.22201/iij.24487902e.2023.23.18922
  zugang: open-access
  jurisdiktionen:
  - mx
  themenachsen:
  - sektor-oeffentlich
  - berufsrecht
  kernthese: 'KI kann alltägliche, nicht wertungsbedürftige Streitigkeiten und die alternative Streitbeilegung
    übernehmen; die eigentliche richterliche Entscheidung bleibt vorerst dem Menschen vorbehalten.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der Autor sagt selbst, das Ziel sei, dem Leser den Einfluss der KI bewusst zu machen
    — das ist ein Sensibilisierungstext, kein wissenschaftlicher Beitrag, und er liest sich auch so. Ich
    nehme ihn nur auf, weil er in der Revista de Derecho Privado der UNAM steht und damit den Stand der
    mexikanischen Zivilrechtsdebatte dokumentiert: Sie ist über die Frage "kann die Maschine den Richter
    ersetzen" noch nicht hinaus. Wer Argumente sucht, liest Becerril Torres; wer den Diskussionsstand
    belegen will, zitiert diesen Text.

    '
  letzte_pruefung: 2026-09-07
- id: 2023-carvalho-viana-camara-tj-maranhao
  typ: aufsatz
  autoren:
  - Porto de Carvalho, Márcia Haydée
  - Moreira Viana, Pedro Nilson
  - Cardoso Câmara, David Elias
  titel: Software de decisão automatizada como ferramenta de compliance no Tribunal de Justiça do Maranhão
  titel_deutsch: Software für automatisierte Entscheidungen als Compliance-Werkzeug am Gerichtshof von
    Maranhão
  fundstelle: Revista de Direito, Governança e Novas Tecnologias 9 (2023), Nr. 1, 57–73
  jahr: 2023
  sprache: pt
  url: https://www.indexlaw.org/index.php/revistadgnt/article/view/9601
  doi: 10.26668/IndexLawJournals/2526-0049/2023.v9i1.9601
  zugang: open-access
  jurisdiktionen:
  - br
  themenachsen:
  - sektor-oeffentlich
  - governance
  - berufsrecht
  kernthese: 'Automatisierte Entscheidungssoftware lässt sich am Gerichtshof von Maranhão als Instrument
    des digitalen Compliance einsetzen, um Konflikte zwischen Rechten und technischen Möglichkeiten zu
    entschärfen.

    '
  prioritaet: optional
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der Titel verspricht eine Fallstudie zu einem konkreten Landgerichtshof; das Abstract
    liefert stattdessen eine Erörterung von Kybernetik, Legaltech und digitalem Compliance, in der der
    Tribunal de Justiça do Maranhão kaum vorkommt. Ich erfasse den Text als Randlage und ausdrücklich
    mit dieser Warnung: Wer die brasilianische Gerichtsautomatisierung an einem Einzelfall untersuchen
    will, sollte hier nicht anfangen. Belegwert hat er dafür, dass die brasilianische Landesjustiz solche
    Systeme tatsächlich betreibt — die belastbaren Zahlen dazu stehen aber in den Berichten des Conselho
    Nacional de Justiça, nicht hier.

    '
  letzte_pruefung: 2026-09-07
- id: 2021-cetys-preparacion-sector-judicial-ia
  typ: bericht
  autoren:
  - Aguerre, Carolina (Leitung)
  - Bustos, Lex (stellv. Leitung)
  - Gorgone, Bruno
  - Amunátegui, Carlos
  - Aranguis, Matías
  - Madrid, Raúl
  - Castaño, Daniel
  - Moreno González, Jimena
  - Maqueo, María Solange
  - Rentería Marín, César
  - Mendoza Enríquez, Olivia Andrea
  - Lens, Julio
  - Segredo, Sandra
  - Vargas, Fernando
  titel: Preparación del sector judicial para la inteligencia artificial en América Latina
  titel_deutsch: Die Vorbereitung des Justizsektors auf die künstliche Intelligenz in Lateinamerika
  fundstelle: CETyS (Centro de Estudios en Tecnología y Sociedad, Universidad de San Andrés), Buenos Aires
    2021; Kompendium plus fünf Länderstudien zu Argentinien, Chile, Kolumbien, Mexiko und Uruguay; gefördert
    von der Tinker Foundation
  jahr: 2021
  sprache: es
  url: https://cetys.lat/wp-content/uploads/2021/10/CompiladoV4.pdf
  zugang: open-access
  jurisdiktionen:
  - latam
  - ar
  - cl
  - co
  - mx
  - uy
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  kernthese: 'Der Justizsektor der fünf untersuchten Länder wird anhand von sechs Dimensionen und fünfzig
    Indikatoren vermessen; die digitale Transformation der Gerichte läuft überall deutlich langsamer als
    die der Exekutive, und funktionierende KI-Vorhaben entstehen nur dort, wo mehrere Akteursgruppen zusammenwirken.

    '
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Von allen Fundstellen dieser Datei ist das die, mit der ich anfangen würde. Es ist
    die einzige systematische, mit einem offengelegten Indikatorenraster arbeitende Fünfländerstudie zur
    KI in der lateinamerikanischen Justiz, sie ist frei zugänglich, und die Länderstudien sind von jeweils
    einheimischen Autoren geschrieben — Castaño (Externado) für Kolumbien, Amunátegui und Madrid für Chile,
    Maqueo und Rentería (CIDE) für Mexiko. Die kolumbianische Studie allein umfasst rund 92 Seiten und
    dokumentiert Prometea und Pretoria am Verfassungsgericht, Siarelis bei der Superintendencia de Sociedades
    und Fiscal Watson bei der Staatsanwaltschaft — das ist die einzige zusammenhängende Bestandsaufnahme
    dieser Systeme, die ich gefunden habe, und sie ersetzt für Kolumbien das, was die blockierten Externado-Zeitschriften
    geliefert hätten. Zwei Einschränkungen: Der Stand ist 2021, also vor der generativen Wende und vor
    der kolumbianischen Entscheidung T-323/2024; und es ist ein Politikbericht, keine Dogmatik — Normen
    kommen als Kontext vor, nicht als Prüfungsmassstab. Trotzdem Pflichtlektüre, weil es die Faktenbasis
    ist, auf der alles andere aufsetzt.

    '
  letzte_pruefung: 2026-09-07
- id: 2021-simon-castellano-valoracion-prueba
  typ: aufsatz
  autoren:
  - Simón Castellano, Pere
  titel: 'Inteligencia Artificial y valoración de la prueba: las garantías jurídico-constitucionales del
    órgano de control'
  titel_deutsch: 'Künstliche Intelligenz und Beweiswürdigung: die verfassungsrechtlichen Garantien der
    Kontrollinstanz'
  fundstelle: THEMIS Revista de Derecho 79 (2021), 283–297
  jahr: 2021
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/themis/article/view/24878
  doi: 10.18800/themis.202101.015
  zugang: open-access
  jurisdiktionen:
  - pe
  - es
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  kernthese: 'KI kann die freie richterliche Beweiswürdigung stützen — gerade dort, wo das menschliche
    Urteil nachweislich unzuverlässig ist, etwa bei der Bewertung von Bestätigungsindizien —, sie aber
    nicht ersetzen.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Spanischer Autor (UNIR) in einer peruanischen Zeitschrift; der Gegenstand ist überwiegend
    spanisches Prozessrecht, die Rezeption aber peruanisch, und deshalb steht der Text in der peruanischen
    Debatte. Der Gedanke, der ihn von der übrigen Justizliteratur abhebt: Simón Castellano argumentiert
    nicht defensiv (KI gefährdet die Beweiswürdigung), sondern offensiv (die menschliche Beweiswürdigung
    ist an bestimmten Stellen erratisch, und dort kann KI korrigieren). Für die deutsche Diskussion um
    § 261 StPO und § 286 ZPO ist das die produktivere Fragestellung, und sie ist bei uns selten. Der Text
    ist von 2021 und pandemiegeprägt — die Effizienzargumente sind zeitgebunden —, der Kerngedanke aber
    nicht.

    '
  letzte_pruefung: 2026-09-07
- id: 2025-barrenechea-certificacion-ambiental
  typ: aufsatz
  autoren:
  - Barrenechea Sangama, Jaquelin
  titel: Una aproximación a los retos para la implementación de la inteligencia artificial en el proceso
    de certificación ambiental
  titel_deutsch: Annäherung an die Herausforderungen der KI-Einführung im Umweltzertifizierungsverfahren
  fundstelle: IUS ET VERITAS 71 (2025), 201–221
  jahr: 2025
  sprache: es
  url: https://revistas.pucp.edu.pe/index.php/iusetveritas/article/view/33511
  doi: 10.18800/iusetveritas.202502.012
  zugang: open-access
  jurisdiktionen:
  - pe
  themenachsen:
  - sektor-oeffentlich
  - governance
  kernthese: 'Vertrauenswürdige KI im peruanischen Umweltzertifizierungsverfahren scheitert nicht an der
    Technik, sondern an fehlender behördenübergreifender Koordination, an einer nicht systematisierten
    Umweltdatenbank, an veralteter Infrastruktur und an verstreuter Regelung.

    '
  prioritaet: wichtig
  lesestatus: ungelesen
  verifiziert: true
  eigene_bewertung: 'Der handfesteste Text der peruanischen Auswahl, weil er ein konkretes Verwaltungsverfahren
    nimmt (die Umweltverträglichkeits- prüfung nach dem SEIA) und die Vorbedingungen der Automatisierung
    benennt statt ihrer Chancen. Die Reihenfolge der Hindernisse — erst Datenlage, dann Infrastruktur,
    dann Recht — ist die richtige und in der Literatur ungewöhnlich; die meisten Beiträge fangen beim
    Recht an und tun so, als sei der Rest gelöst. Für die deutsche Diskussion um die Beschleunigung von
    Genehmigungsverfahren durch KI ist das eine nützliche Ernüchterung. Keine Grundrechtsprüfung, keine
    Rechtsprechung; Verwaltungspraxis pur.

    '
  letzte_pruefung: 2026-09-07
