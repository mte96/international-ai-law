  fundstelle: Gutachten im Auftrag von AlgorithmWatch, Berlin, 15.10.2025
  jahr: 2025
  sprache: de
  url: https://algorithmwatch.org/de/gutachten-datenbank-biometrie-gesichtserkennung/
