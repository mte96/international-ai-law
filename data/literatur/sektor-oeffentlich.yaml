  kernthese: Algorithmische Strafzumessung ist nicht schon deshalb unzulaessig, weil sie statistisch arbeitet;
    entscheidend sind die Bedingungen, unter denen der Richter das Ergebnis noch verantworten kann.
  eigene_bewertung: 'Zerilli fuehrt hier sein Kontrollproblem-Argument in das Strafzumessungsrecht ueber,
    und das ist die praktisch wichtigste Anwendung: Wenn menschliche Aufsicht durch Automatisierungsverzerrung
    entwertet wird, dann trifft das die Strafzumessung haerter als jeden anderen Bereich. Fuer die deutsche
    Diskussion um Paragraf 46 StGB und den Einsatz von Zumessungsdatenbanken unmittelbar anschlussfaehig.
    Der Beitrag steht in einem Sammelband, der insgesamt die beste Zusammenstellung zum Thema ist. Neuseelandbezug
    nur ueber den Autor.'
