  kernthese: Der Beschluss des OLG Koblenz zur MonoCam begrenzt den KI-gestützten Handyverstoßabgleich,
    verbietet KI-gestützte Ermittlungen aber nicht kategorisch — verfassungsrechtlich entscheidend ist
    nicht, ob KI eingesetzt wird, sondern wie sie im konkreten Kontext funktioniert.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der einzige frei zugängliche deutsche Text, der eine obergerichtliche Entscheidung
    zum KI-Einsatz im Ordnungswidrigkeitenrecht bespricht — und damit die einzige Entscheidungsbesprechung
    dieser Akte, die praktisch unmittelbar relevant ist. Die dogmatische Pointe ist die Verdachtslosigkeit:
    § 100h StPO über § 46 OWiG trägt eine anlasslose Massenerfassung nicht, auch nicht bei Bagatellverstößen.
    Wer den Fall in einem Bußgeldverfahren führt, braucht diesen Text. Angreifbar ist die Verallgemeinerung
    "nicht ob, sondern wie" — sie stimmt für MonoCam, verdeckt aber, dass Art. 5 KI-VO manche Verfahren
    eben kategorisch verbietet. Ergänzt Beck; die Entscheidungsanmerkungen in den Beck-Zeitschriften dürften
    inzwischen weiter sein.

    '
  letzte_pruefung: 2026-08-27
