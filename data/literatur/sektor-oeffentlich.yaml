  titel: 'Accountable AI: Final Report'
  fundstelle: Law Commission of Ontario, Toronto, Juni 2022
  jahr: 2022
  sprache: en
  url: https://lco-cdo.org/en/publications/accountable-ai-final-report/
  zugang: open-access
  jurisdiktionen:
