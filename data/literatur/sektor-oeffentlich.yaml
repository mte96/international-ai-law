  - sektor-oeffentlich
  - grundrechte
  bezug_regelwerke:
  - de-automatisierte-datenanalyse-polizei
  - ki-vo-2024-1689
  kernthese: Es ist technisch nicht möglich, frei verfügbare Internetbilder praktikabel durchsuchbar zu
    machen, ohne eine Datenbank anzulegen — der geplante biometrische Internetabgleich setzt damit zwingend
    eine nach Art. 5 KI-VO verbotene Datenbank voraus.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Das inhaltlich stärkste Einzelstück dieser Akte, und es ist kein juristischer Text.
    Lewandowski (HAW Hamburg, Suchmaschinenforschung) beantwortet die technische Vorfrage, an der die
    gesamte deutsche Debatte um § 98d StPO-E hängt: Der Gesetzgeber behauptet, kein Datenbankaufbau, sondern
    ein Abgleich mit dem offenen Netz; Lewandowski zeigt, dass die Unterscheidung technisch nicht existiert,
    weil Indexierung und Vorverarbeitung notwendig sind. Wenn das stimmt, kollidiert die Norm mit Art.
    5 Abs. 1 lit. e KI-VO, und zwar nicht graduell, sondern kategorisch. Angreifbar ist der Auftraggeberbezug
    — ein Gutachten für AlgorithmWatch ist Parteivortrag — und die Frage, ob eine flüchtige, nicht persistierte
    Indexierung anders zu beurteilen wäre. Genau dieses Gutachten würde ich einem Beck-Aufsatz vorziehen;
    es liefert die Prämisse, die die Juristen sich sonst ausdenken.

    '
