  kernthese: § 24e ASOG erlaubt an kriminalitätsbelasteten Orten KI-gestützte Verhaltenserkennung, deren
    Diskriminierungsschutz sich in unbestimmten Programmsätzen erschöpft und deren Wirksamkeit nicht belegt
    ist.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der interessanteste Befund ist technischer Art und wird juristisch unterschätzt:
    Die Software erfasst Personen als Strichmännchen mit Knotenpunkten, arbeitet also formal ohne biometrische
    Identifizierung und entgeht damit Art. 5 KI-VO, erzeugt aber dieselben Verhaltensinferenzen. Das ist
    die Umgehungsfigur, die die Kategorien der KI-VO nicht fassen, und Sußner ist die einzige, die sie
    in der frei zugänglichen deutschen Literatur benennt. Angreifbar: Sußner leitet aus Art. 3 Abs. 3
    GG mehr ab, als die Rechtsprechung bisher hergibt, und die Verhältnismäßigkeitsprüfung bleibt behauptend.
    Ergänzt Beck, hat aber bei der Skelett-Erkennungs-Lücke einen Vorsprung.

    '
