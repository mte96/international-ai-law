  kernthese: Das KIMVG erlaubt BAMF, Ausländerbehörden und Auswärtigem Amt, personenbezogene Daten aus
    Asylverfahren zum Training von Entscheidungsunterstützungsmodellen zu verwenden, ohne die menschliche
    Entscheidungsautonomie und die algorithmische Nachvollziehbarkeit wirksam zu sichern.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die erste Analyse des Kabinettsentwurfs, drei Wochen vor Priebe/Känner, und in einem
    Punkt schärfer: Henning konzentriert sich auf die Trainingsbefugnis und die Frage, was mit der Zweckbindung
    geschieht, wenn Asylakten zu Trainingsdaten werden. Das ist die datenschutzrechtliche Kernfrage, die
    auch beim KIMVG über die Rechtmäßigkeit entscheidet. Wer die Automatisierungsbias-Frage bearbeitet,
    findet hier die verwaltungsrechtliche Anschlussstelle zu Lehners medizinrechtlicher These. Schwächer
    bei der Diskriminierungsdimension, die Priebe/Känner besser abdecken. Beide zusammen lesen.

    '
