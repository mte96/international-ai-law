  - de-automatisierte-datenanalyse-polizei
  kernthese: Die KI-VO greift nicht unzulässig in die mitgliedstaatliche Zuständigkeit für die nationale
    Sicherheit ein, weil sie auf Art. 114 und Art. 16 Abs. 2 AEUV gestützt ist, und sie lässt den Mitgliedstaaten
    über Art. 5 Abs. 5 Raum für strengere Standards.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die kompetenzrechtliche Grundfrage des deutschen Sicherheitsrechts unter der KI-VO,
    in der frei zugänglichen Literatur sonst nirgends so knapp beantwortet. Wichtig, weil die Gegenposition
    — Art. 4 Abs. 2 EUV sperre die Unionsregelung — in Anhörungen zu den Landespolizeigesetzen immer wieder
    vorgetragen wird. Schöndorf-Haubold entkräftet sie mit der Binnenmarkt- und Datenschutzkompetenz;
    das ist dogmatisch solide, aber sie unterschätzt, wie weit die Bereichsausnahme des Art. 2 Abs. 3
    KI-VO für die nationale Sicherheit tatsächlich trägt. Der Text ist vom Dezember 2024 und kennt weder
    das KI-MIG noch die Omnibus-Fristen. Ergänzt Beck; ersetzt es nicht, weil die Kompetenzdiskussion
    in den Kommentaren seither weitergegangen ist.

    '
  letzte_pruefung: 2026-08-27
