  kernthese: Der Einsatz offensichtlich rechtswidriger Gesichtserkennungssoftware wie PimEyes im Strafverfahren
    begründet ein Beweisverwertungsverbot mit Fernwirkung.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die schärfste These der deutschen KI-Beweisrechtsdebatte, und sie ist bewusst weit:
    Fernwirkung ist im deutschen Strafprozessrecht der Ausnahmefall, Thönnes (MPI Freiburg) will sie hier
    zur Regel machen, weil die Umgehung der Richtervorbehalte systematisch sei. Das ist angreifbar und
    soll es sein. Wer zum Verwertungsverbot bei KI-gestützter Beweisgewinnung arbeitet, muss diesen Text
    kennen und widerlegen oder sich ihm anschließen — eine dritte Möglichkeit gibt es nicht, weil es in
    der freien Literatur keine Alternativposition gibt. Das ist zugleich die Schwäche der Akte: Die Gegenposition
    steht in den Beck-Zeitschriften.

    '
  letzte_pruefung: 2026-08-27
