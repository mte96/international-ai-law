  - vwvfg-35a
  - vwvfg-39
- id: 2019-zalnieriute-bennettmoses-williams-rule-of-law
  typ: aufsatz
  autoren:
  - Zalnieriute, Monika
  - Bennett Moses, Lyria
  - Williams, George
  titel: The Rule of Law and Automation of Government Decision-Making
  fundstelle: The Modern Law Review 82 (2019), 425
  jahr: 2019
  sprache: en
  doi: 10.1111/1468-2230.12412
  ssrn_id: '3348831'
  zugang: open-access
  jurisdiktionen:
  - au
  - uk
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  kernthese: 'Automatisierung staatlicher Entscheidungen wirkt auf die Rechtsstaatlichkeit ambivalent:
    Sie erhöht Konsistenz und Vorhersehbarkeit, senkt aber Transparenz, Begründbarkeit und Anfechtbarkeit
    — die Bilanz hängt vom Systemtyp ab, nicht von der Automatisierung als solcher.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der begrifflich sauberste Text des Kapitels und der einzige, der die Rechtsstaatlichkeitsfrage
    in prüfbare Einzelkriterien zerlegt, statt sie zu beschwören. Er ist vor Robodebts Aufarbeitung geschrieben
    und liest sich rückblickend als Prognose. Für den deutschen Leser wertvoll wegen der Unterscheidung
    zwischen regelbasierten Systemen (Konsistenzgewinn, geringes Transparenzproblem) und lernenden Systemen
    (umgekehrt) — eine Unterscheidung, die § 35a VwVfG nicht trifft und die KI-VO nur über den Risikobegriff
    annähert. Zeitschrift bei Wiley (Verlagsseite beantwortet automatisierte Abrufe mit 403); SSRN-Fassung
    frei, nicht maschinell abrufbar.

    '
  letzte_pruefung: 2026-08-27
- id: 2026-ameen-judicial-review-algorithmic
  typ: aufsatz
  autoren:
  - Ameen, Khalid Saleem
  - Towfiq, Tavga Abbas
  - Mousa, Kawar Mohammed
  - Pooyanmehr, Mahrokh
  titel: 'Judicial Review of Algorithmic Administrative Systems: Legality, Evidence and Remedies in the
    Smart City State'
  fundstelle: Frontiers in Artificial Intelligence 9 (2026), Art. 1802986, 13.04.2026
  jahr: 2026
  sprache: en
  doi: 10.3389/frai.2026.1802986
  url: https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2026.1802986/full
  zugang: open-access
  jurisdiktionen:
  - eu
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  kernthese: 'Der Rechtsschutz gegen algorithmische Verwaltungsentscheidungen scheitert weniger an der
    Klagebefugnis als am Beweisrecht: Ohne Zugang zu Modell, Trainingsdaten und Schwellenwerten kann der
    Kläger die Rechtswidrigkeit nicht darlegen.'
  prioritaet: optional
  lesestatus: ungelesen
  eigene_bewertung: 'Aufgenommen, weil es der aktuellste Text zur Rechtsschutzfrage ist und die richtige
    Diagnose stellt — die Parallele zum Haftungsrecht (Kap. I: Beweisnot bei opaken Systemen) ist exakt,
    und beide Debatten laufen unverbunden nebeneinander. Wer die Verbindung herstellt, hat einen Aufsatz.
    Der brauchbarste Einzelvorschlag ist die abgestufte Offenlegung ("tiered access") — Modellzugang für
    das Gericht, nicht für die Öffentlichkeit —, was strukturell dem in-camera-Verfahren des § 99 Abs.
    2 VwGO entspricht und dessen Übertragung auf Modellparameter naheliegt. Einschränkung: Die Verfasser
    sind Völkerrechtler und Betriebswirte an Universitäten in Nordzypern, das Bezugsrecht ist common law,
    und Frontiers hat eine umstrittene Begutachtungspraxis. Als Ideengeber brauchbar, als Autorität nicht.

    '
  letzte_pruefung: 2026-08-27
