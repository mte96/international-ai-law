  - de-2023-hessendata-bverfg
  kernthese: Das BVerfG hat in HessenDATA zwei Stellschrauben zur Steuerung der Eingriffsintensität benannt
    — Analysemethode und Datenbestand —, und die Entwürfe von 2026 nutzen die zweite gar nicht, weil sie
    Zeugen-, Opfer- und Verkehrsdaten sowie Beweismittelakten einbeziehen.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Aus dem Haus des Bundesbeauftragten für den Datenschutz geschrieben und deshalb doppelt
    zu lesen: als Analyse und als Signal, wie die Aufsicht die Entwürfe bewerten wird. Der Beitrag leistet,
    was der Rest der Debatte nicht leistet — er nimmt die Zweckbindung ernst und zeigt, dass die Datenbestandsfrage
    (§ 483 StPO, §§ 100g, 161, 163 StPO) die eigentliche Weichenstellung ist, nicht die Methodenfrage,
    um die sich alles dreht. Der Begriff der "Superdatenbank" ist polemisch, die Herleitung aber sauber.
    Angreifbar: Die Autoren sagen nicht, welcher Datenbestand zulässig wäre; die Kritik bleibt negativ.
    Ergänzt Beck, ersetzt es hier faktisch, weil es zu §§ 98d f. StPO-E noch keine Kommentierung gibt.

    '
  letzte_pruefung: 2026-08-27
