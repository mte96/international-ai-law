- id: 2021-vanbekkum-borgesius-syri
  typ: aufsatz
  autoren:
  - van Bekkum, Marvin
  - Zuiderveen Borgesius, Frederik
  titel: Digital Welfare Fraud Detection and the Dutch SyRI Judgment
  fundstelle: European Journal of Social Security 23 (2021), 323–340; arXiv:2509.23843
  jahr: 2021
  sprache: en
  doi: 10.1177/13882627211031257
  url: https://arxiv.org/abs/2509.23843
  zugang: open-access
  jurisdiktionen:
  - nl
  - eu
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - datenschutz
  kernthese: Das SyRI-Urteil erklärt die niederländische Sozialbetrugsaufdeckung wegen Verstoßes gegen
    Art. 8 EMRK für rechtswidrig, weil es an Transparenz und Nachprüfbarkeit fehlte; der Rechtssatz ist
    schmal, die Signalwirkung erheblich.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der maßgebliche Aufsatz zum ersten europäischen Urteil, das ein staatliches Risikoprofilierungssystem
    gestoppt hat, und die notwendige Ergänzung zur deutschen Debatte um § 35a VwVfG: Das Gericht stützte
    sich nicht auf Datenschutzrecht, sondern auf Art. 8 EMRK, und die tragende Erwägung war die fehlende
    Erkennbarkeit des Risikomodells. Für Palantir-artige Verbundsysteme in Deutschland ist das der unmittelbare
    Maßstab — der Bezug zur Entscheidung des BVerfG vom 16.02.2023 (1 BvR 1547/19, automatisierte Datenanalyse)
    liegt auf der Hand und wird von den Autoren nicht gezogen, weil sie vorher schreiben. Wichtige Einschränkung,
    die die Autoren selbst betonen: Das Urteil beanstandet nicht die Automatisierung, sondern die Intransparenz.
    Wer es als Verbot algorithmischer Verwaltung liest, überzieht. Zeitschriftenfassung bei Sage (Bot-Sperre),
    geprüft ist die 2025 hinterlegte arXiv-Fassung.

    '
  letzte_pruefung: 2026-08-27
- id: 2025-hannah-botterill-avoiding-the-brakes
  typ: aufsatz
  autoren:
  - Hannah, Adam
  - Botterill, Linda Courtenay
  titel: 'Avoiding the Brakes: Malign Policy and Legal Advice in the Robodebt Scandal'
  fundstelle: Policy and Society 44 (2025), Heft 2, 229–241
  jahr: 2025
  sprache: en
  doi: 10.1093/polsoc/puaf018
  url: https://academic.oup.com/policyandsociety/article/44/2/229/8246832
  zugang: open-access
  jurisdiktionen:
  - au
  themenachsen:
  - sektor-oeffentlich
  - governance
  - grundrechte
  bezug_regelwerke:
  - au-adm-reform-robodebt
  - au-social-security-act-1991
  kernthese: 'Robodebt scheiterte nicht an der Technik, sondern an der Organisation: Rechtsrat wurde von
    Nichtjuristen gefiltert, unterdrückt und umgedeutet, und die Hausjuristen hatten keine institutionelle
    Stellung, um das zu verhindern.'
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Der wichtigste Text zum wichtigsten Fall automatisierten Verwaltungsversagens — und
    der einzige, der die richtige Lehre zieht. Robodebt war kein Algorithmenproblem: Das "Averaging" der
    Einkommensdaten war rechtswidrig, bevor es automatisiert wurde; die Automatisierung hat den Rechtsverstoß
    nur skaliert und die Beweislast faktisch umgekehrt. Für die deutsche Diskussion um § 35a VwVfG folgt
    daraus die unangenehme Frage, die niemand stellt: Die Norm verlangt, dass kein Ermessen und kein Beurteilungsspielraum
    besteht — sie sagt nichts darüber, ob die zugrunde liegende Rechtsauffassung zutrifft. Genau daran
    ist Robodebt gescheitert. Der Aufsatz ist politikwissenschaftlich, nicht rechtsdogmatisch; die juristische
    Übersetzung fehlt und ist eine Publikationsmöglichkeit. Frei zugänglich, CC BY-NC.

    '
  letzte_pruefung: 2026-08-27
  normen:
  - au-social-security-act-1991-s-1223
  - au-social-security-administration-act-1999-s-6a
  - au-public-service-act-1999-s-13
