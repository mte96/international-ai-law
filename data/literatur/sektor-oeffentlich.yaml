  typ: bericht
  autoren:
  - Gavaghan, Colin
  - Knott, Alistair
  - Maclaurin, James
  - Zerilli, John
  - Liddicoat, Joy
  titel: 'Government Use of Artificial Intelligence in New Zealand: Final Report on Phase 1 of the New
    Zealand Law Foundation''s Artificial Intelligence and Law in New Zealand Project'
  fundstelle: New Zealand Law Foundation / University of Otago, Wellington 2019
  jahr: 2019
  sprache: en
  url: https://www.lawfoundation.org.nz/wp-content/uploads/2019/05/2016_ILP_10_AILNZ-Report-released-27.5.2019.pdf
  zugang: open-access
  jurisdiktionen:
  - nz
  themenachsen:
  - sektor-oeffentlich
  - grundrechte
  - governance
  kernthese: Neuseeland gehoert weltweit zu den Vorreitern beim behoerdlichen Algorithmeneinsatz, verfuegt
    aber ueber keine unabhaengige Aufsicht; noetig seien ein Regulator, verbindliche Transparenzpflichten
    und Vorkehrungen gegen Verzerrung und Fehlerfortpflanzung.
  eigene_bewertung: 'Der Gruendungstext der neuseelaendischen Debatte und der einzige umfassende Bestandsaufnahmenbericht,
    den das Land hat. Auf ihm beruht der Algorithm Charter for Aotearoa New Zealand von 2020, also das
    zentrale neuseelaendische Regelwerk - wer den Charter verstehen will, muss diesen Bericht kennen.
    Fuer den Rechtsvergleich ist Neuseeland deshalb interessant, weil es ein Land ohne geschriebene Verfassung
    und ohne Verwaltungsgerichtsbarkeit kontinentaler Praegung ist: Die Kontrolle des Algorithmeneinsatzes
    laeuft ueber judicial review nach Common-Law-Grundsaetzen und ueber den Privacy Act. Der Bericht zeigt
    schonungslos, wie wenig das traegt. Wichtig auch die Ausfuehrungen zu Maori-Daten und zum Vertrag
    von Waitangi - eine Dimension, die kein europaeischer Text hat. Aeltester Text der neuseelaendischen
    Auswahl, aber unverzichtbar.'
  prioritaet: pflicht
  lesestatus: ungelesen
  verifiziert: false
  letzte_pruefung: 2026-09-07
