  kernthese: Der Entwurf des § 98d StPO erlaubt den biometrischen Abgleich mit öffentlich zugänglichen
    Internetdaten, ohne Datenquellen, Trefferschwellen, Qualifikation der Auswerter oder Grenzen der Profilbildung
    zu bestimmen, und verfehlt damit die Anforderungen aus Art. 5 Abs. 1, Art. 14 Abs. 5 und Art. 26 Abs.
    10 KI-VO.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Die genaueste frei zugängliche Auseinandersetzung mit dem zentralen Umsetzungsproblem:
    Art. 5 Abs. 1 lit. e KI-VO verbietet den ungezielten Aufbau von Gesichtserkennungsdatenbanken durch
    Web-Scraping, § 98d StPO-E setzt einen Abgleich mit dem Internet voraus. Hahn zeigt die Spannung,
    ohne sie aufzulösen; die Auflösung liefert erst das Gutachten von Lewandowski für AlgorithmWatch,
    das die technische Unmöglichkeit eines datenbankfreien Abgleichs belegt. Beide zusammen ergeben ein
    belastbares Argument gegen die Norm. Angreifbar ist Hahns Zuspitzung auf den Journalistenvergleich
    im Titel — der Vergleich trägt rechtlich nicht, weil die Presse nicht hoheitlich handelt. Ergänzt
    Beck.

    '
  letzte_pruefung: 2026-08-27
