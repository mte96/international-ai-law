  kernthese: Die §§ 57a, 62a und 62b SächsPVDG-E verlagern die Eingriffsschwelle in das Vorfeld der Gefahr,
    überantworten wesentliche Entscheidungen der Verwaltung statt dem Parlament und begegnen dem Diskriminierungsrisiko
    nur mit einer Programmsatzformel in § 79c Abs. 1 Satz 2.
  prioritaet: wichtig
  lesestatus: ungelesen
  eigene_bewertung: 'Landesrecht, aber exemplarisch: Sachsen zieht die drei Instrumente — automatisierte
    Datenanalyse, intelligente Videoüberwachung, biometrischer Abgleich — in einem Gesetz zusammen, wie
    es die anderen Länder nachziehen werden. Der stärkste Punkt ist der Wesentlichkeitseinwand gegen die
    Verordnungsermächtigungen; das ist eine Argumentationslinie, die vor dem BVerfG tragen könnte und
    in der Datenschutzliteratur untergeht. Schwächer ist die Diskriminierungsanalyse, die über den Verweis
    auf § 79c SächsPVDG-E nicht hinauskommt. Zusammen mit Sußner zu Berlin ergibt sich der Länderquerschnitt,
    den es sonst nirgends frei gibt. Ergänzt Beck.

    '
  letzte_pruefung: 2026-08-27
