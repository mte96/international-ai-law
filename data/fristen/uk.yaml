- id: uk-osa-2023-f1
  datum: 2027-01-10
  beschreibung: 'Äußerstes Ende des gesetzlichen Fensters für den Ofcom-Bericht über die Nutzung von App-Stores
    durch Kinder. Section 161(1) Online Safety Act 2023 verpflichtet Ofcom zu einem Bericht, der insbesondere
    bewertet, welche Rolle App-Stores dabei spielen, dass Kinder auf kinderschädliche Inhalte, kinderschädliche
    Suchinhalte oder regulierte pornografische Inhalte stoßen, wie verbreitet und wie wirksam Altersverifikation
    bei App-Store-Anbietern ist und ob weitergehende Maßnahmen den Kinderschutz verbessern würden. Section
    161(3) bestimmt das Fenster: frühestens zwei, spätestens drei Jahre nach dem Inkrafttreten der Sections
    12 und 29. Beide traten am 10.01.2024 in Kraft (S.I. 2023/1420, reg. 2(d) und 2(j)); das Fenster läuft
    daher vom 10.01.2026 bis zum 10.01.2027. Eine Berechnung ''drei Jahre nach Royal Assent'' (26.10.2026)
    trifft nicht zu; Section 161(3) knüpft an das Inkrafttreten der Sections 12 und 29 an, nicht an den
    Royal Assent. Ofcom hat im Juli 2026 den gesetzlichen Bericht zur Altersverifikation (s. 157) veröffentlicht;
    der App-Store-Bericht steht bei Rechercheschluss aus.

    '
  typ: pruefung
  jurisdiktion: uk
  regelwerk: uk-osa-2023
  adressat: Ofcom, Regierung, Parlament
  handlungsbedarf: null
  quelle: https://www.legislation.gov.uk/ukpga/2023/50/section/161
  verifiziert: true
  fundstelle_norm: s. 161(3) Online Safety Act 2023 i.V.m. der Inkraftsetzung der ss. 12, 29 durch S.I.
    2023/1420, reg. 2(d), 2(j) (10.01.2024)
