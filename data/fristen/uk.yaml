- id: uk-copyright-ai-prozess-f1
  datum: 2026-09-30
  beschreibung: 'Zugesagte Konsultation zu "digital replicas" und Persönlichkeitsrecht. PLATZHALTER, KEIN
    BELEGTES DATUM: Das Written Ministerial Statement HCWS1416 vom 18.03.2026 (Liz Kendall, Secretary
    of State for Science, Innovation and Technology) sagt wörtlich zu: "We will launch a consultation
    in the summer to seek views on how we address these harms, while protecting legitimate innovation"
    — ohne Datum, ohne Ressort, ohne Zeitplan. Der hier geführte 30.09.2026 bildet nur das Ende des zugesagten
    Zeitraums ab. Stand 07.09.2026: Die Konsultation ist nicht eröffnet; der meteorologische Sommer ist
    am 31.08.2026 abgelaufen. Anders als beim Urheberrecht, wo s. 137 Data (Use and Access) Act 2025 die
    Regierung zum Handeln zwingt, besteht hier keine gesetzliche Frist und damit keine Sanktion für die
    Verzögerung.

    '
  typ: konsultation
  jurisdiktion: uk
  regelwerk: uk-copyright-ai-prozess
  adressat: Kreativwirtschaft, Verwertungsgesellschaften, KI-Entwickler, Persönlichkeitsrechtsinhaber
  handlungsbedarf: Beobachten; bei Eröffnung Frist prüfen und Konsultationsdokument auswerten.
  quelle: https://questions-statements.parliament.uk/written-statements/detail/2026-03-18/hcws1416
  verifiziert: false
  kalender_sync: true
  vorwarnung_tage:
  - 30
  - 7
  letzte_pruefung: '2026-09-07'
  pruefvermerk:
  - '07.09.2026: Zweite Prüfung nach dem 27.08.2026. Auf gov.uk ist zum Stichtag keine eröffnete Konsultation
    zu digital replicas, Persönlichkeitsrecht, Likeness oder Leistungsschutzrechten auffindbar; der "Report
    on Copyright and Artificial Intelligence" vom 18.03.2026 formuliert nur die Prüfzusage, ob "it would
    be beneficial to introduce a new digital replica or personality right", und das statement of progress
    nach s. 137 DUAA 2025 erwähnt digital replicas nur als aufkommendes Thema. Zwei fachanwaltliche Beiträge
    vom 06. und 10.08.2026 bestätigen den Negativbefund.'
