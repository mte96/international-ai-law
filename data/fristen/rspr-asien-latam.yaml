  beschreibung: 'CHINA — Interimsmaßnahmen zur Verwaltung anthropomorpher interaktiver KI-Dienste (人工智能拟人化互动服务管理暂行办法),
    am 10.04.2026 gemeinsam von fünf Behörden erlassen (Staatliches Internetinformationsamt, Nationale
    Entwicklungs- und Reformkommission, Ministerium für Industrie und Informationstechnologie, Ministerium
    für öffentliche Sicherheit, Staatliche Marktaufsichtsverwaltung) und nach ihrem Art. 32 seit dem 15.07.2026
    in Kraft. Pflichten: wirksame Hinweise, dass der Nutzer mit einem KI-Dienst und nicht mit einem Menschen
    interagiert; Inhaltssicherheit einschließlich des Verbots von Inhalten, die zu Selbstschädigung anleiten
    oder emotionale Abhängigkeit erzeugen; Risikomanagement mit Erkennung extremer Gefühlslagen und Noteingriffen;
    besonderer Minderjährigenschutz (keine virtuellen Familien- oder Liebesbeziehungen für Minderjährige,
    Einwilligung der Sorgeberechtigten unter 14 Jahren, verpflichtender Minderjährigenmodus mit Nutzungszeitgrenzen);
    Sicherheitsbewertung und Meldung an die Provinzbehörden ab einer Million registrierter oder 100.000
    monatlich aktiver Nutzer. Erste Streitigkeiten zu Begleit-Chatbots sind zu erwarten.

    '
