  beschreibung: 'SÜDKOREA — Das KI-Rahmengesetz (인공지능 발전과 신뢰 기반 조성 등에 관한 기본법, AI Framework Act), Gesetz
    Nr. 20676, wurde am 21.01.2025 verkündet und ist nach seiner Ergänzungsbestimmung ein Jahr später,
    am 22.01.2026, in Kraft getreten; das amtliche Rechtsinformationszentrum führt es mit dem Vermerk
    [시행 2026. 1. 22.]. Die Durchführungsverordnung ist zum selben Tag in Kraft gesetzt worden. Die vielfach
    genannte einjährige Vollzugsschonfrist ohne Bußgelder (계도기간) steht NICHT im Gesetz: Sie beruht auf
    einer Ankündigung des Ministeriums für Wissenschaft und IKT aus dem Dezember 2025 ("mindestens ein
    Jahr") und ließ sich an einer amtlichen Bekanntmachung nicht nachweisen — die einschlägige Pressemitteilung
    verweist auf einen Anhang, der nicht abrufbar war. Erste Vollzugsentscheidungen sind daher frühestens
    2027 zu erwarten, ohne dass dafür ein gesetzlicher Stichtag bestünde.

    '
