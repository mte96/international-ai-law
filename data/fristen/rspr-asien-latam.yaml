  beschreibung: 'CHINA — Maßnahmen für die wissenschaftlich-technische Ethikprüfung und die zugehörigen
    Dienstleistungen im Bereich künstliche Intelligenz (Versuch) (人工智能科技伦理审查与服务办法（试行）), erlassen als 工信部联科〔2026〕75号
    gemeinsam von zehn Stellen unter Federführung des Ministeriums für Industrie und Informationstechnologie.
    DATUM PRÄZISIERT: Die Mitteilung trägt das Ausfertigungsdatum 20.03.2026, die amtlichen Metadaten
    nennen den 30.03.2026 als Erstellungs- und den 02.04.2026 als Veröffentlichungsdatum. Die frühere
    Angabe "in Kraft seit 20.03.2026" verwechselt das Erlassdatum mit einem Inkrafttretenstag; ein gesonderter
    Inkrafttretenstag ist im amtlichen Text der Mitteilung nicht ausgewiesen und ließ sich auch aus den
    amtlichen Erläuterungen nicht ermitteln. Inhalt: Verfahren der Ethikprüfung von KI-Tätigkeiten (Antrag,
    Annahme, allgemeines, vereinfachtes oder Eilverfahren, Expertennachprüfung für die Tätigkeiten der
    Nachprüfungsliste, Entscheidung, Beschwerde, Nachverfolgung in Abständen von höchstens zwölf, bei
    Listentätigkeiten sechs Monaten). Art. 26 nimmt Tätigkeiten aus, die bereits Registrierungs-, Anzeige-
    oder Genehmigungsverfahren zu Deep Synthesis, Algorithmenempfehlung oder generativer KI unterliegen;
    Art. 32 verweist für Verstöße auf Cybersicherheitsgesetz, Datensicherheitsgesetz, Gesetz zum Schutz
    personenbezogener Informationen und Wissenschaftsfortschrittsgesetz.

    '
