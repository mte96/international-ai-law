  beschreibung: 'INDIEN — Entwurf "Regulations for Use of Artificial Intelligence (AI) in Courts, 2026"
    des Supreme Court of India für die eigene Justiz. Der Member Secretary des AI Committee des Supreme
    Court hat den Entwurf mit Bekanntmachung vom 03.06.2026 veröffentlicht und alle Beteiligten sowie
    die Öffentlichkeit um Stellungnahmen an office.regcc@sci.nic.in bis zum 20.06.2026 gebeten; der Entwurf
    beruht ausweislich der Bekanntmachung auf den Grundsätzen menschlichen Vorrangs, der Transparenz,
    der Rechenschaft, des Datenschutzes und der richterlichen Unabhängigkeit. DIE FRIST IST ABGELAUFEN.
    Die Vereinigung der Advocates-on-Record (SCAORA) hat nach eigenen Angaben am 18.07.2026 — also nach
    Fristablauf — eine Eingabe mit Bedenken nachgereicht. Ein Termin für die Verabschiedung der Endfassung
    ist nicht veröffentlicht.

    '
