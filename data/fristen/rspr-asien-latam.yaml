  beschreibung: 'INDIEN — Information Technology (Intermediary Guidelines and Digital Media Ethics Code)
    Amendment Rules 2026, notifiziert als G.S.R. 120(E) mit Datum vom 10.02.2026; die amtliche konsolidierte
    Fassung des MeitY weist alle Neuregelungen mit der Fußnote "Ins. by G.S.R. 120(E), dated 10.02.2026"
    aus. Der Anwendungsbeginn liegt nach übereinstimmenden Kanzleiberichten zehn Tage später, am 20.02.2026;
    Notifizierung und Inkrafttreten fallen nicht zusammen. Inhalt: gesetzliche Definition der "synthetically
    generated information" (künstlich oder algorithmisch erzeugte, veränderte oder bearbeitete Inhalte,
    die von einer echten Person oder einem realen Vorgang nicht zu unterscheiden sind, mit Ausnahmen für
    routinemäßige Bearbeitung und Barrierefreiheit), Kennzeichnungspflicht mit dauerhaften Metadaten oder
    anderen Herkunftsnachweisen einschließlich eindeutiger Kennung, Erklärungspflicht der Nutzer und technische
    Überprüfung durch bedeutende Social-Media-Vermittler sowie Verkürzung der Löschfrist von 36 Stunden
    auf DREI STUNDEN. Eine "automatisierte Prüfung mit mindestens 50 % Trefferquote" enthält die notifizierte
    Fassung nicht; auch die im Entwurf vom Oktober 2025 vorgesehene Kennzeichnung auf mindestens 10 %
    der Anzeigefläche ist durch einen qualitativen Maßstab ersetzt worden. Auswirkungen auf die Verfügungspraxis
    der High Courts sind zu beobachten.

    '
