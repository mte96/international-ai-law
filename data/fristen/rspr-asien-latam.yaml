  beschreibung: 'PERU — Die Durchführungsverordnung zum KI-Rahmengesetz (Ley N.° 31814) wurde mit Decreto
    Supremo N.° 115-2025-PCM vom 08.09.2025 erlassen und am 09.09.2025 im Diario Oficial El Peruano veröffentlicht;
    sie umfasst sechs Titel, 36 Artikel und sechs Schlussbestimmungen. Sie tritt nach ihrer Vigencia-Bestimmung
    NEUNZIG WERKTAGE nach der Veröffentlichung in Kraft ("a partir de los noventa (90) días hábiles siguientes
    de su publicación"); ausgenommen sind die erste, zweite, vierte und fünfte Schlussbestimmung, die
    am Tag nach der Veröffentlichung gelten. DATUM NICHT AMTLICH BESTÄTIGT: Die Neunzig-Werktage-Frist
    führt je nach zugrunde gelegtem Feiertagskalender auf Mitte bis Ende Januar 2026; der überlieferte
    22.01.2026 ließ sich an keiner amtlichen Quelle taggenau nachweisen. Die Nationale KI-Strategie ENIA
    2026-2030 wurde mit Resolución Ministerial N.° 152-2026-PCM am 01.05.2026 gebilligt; auch dieses Datum
    ist nicht amtlich gegengeprüft. Es existiert bis zum 05.09.2026 KEINE peruanische Entscheidung, die
    diese Vorschriften anwendet.

    '
