  datum_hinweis: "Nur das Jahr 2026 ist genannt, im Gesetzgebungsplan des Staatsrats (guobanfa [2026] Nr. 14 vom 08.05.2026)."
  id: asien-latam-termin-t9
  beschreibung: 'CHINA — Der Gesetzgebungsarbeitsplan des Staatsrats für 2026 (国务院2026年度立法工作计划, erlassen
    als 国办发〔2026〕14号 am 08.05.2026) nennt die KI-Gesetzgebung ausdrücklich: Unter der Rubrik zur beschleunigten
    wissenschaftlich-technischen Eigenständigkeit heißt es, die KI-Governance sei zu vervollständigen
    und eine umfassende Gesetzgebung für die gesunde Entwicklung der künstlichen Intelligenz beschleunigt
    voranzutreiben ("完善人工智能治理，加快推进人工智能健康发展综合性立法"); ergänzend soll die Gesetzgebung zu den gemeinsamen
    Elementen Daten, Rechenleistung, Algorithmen, Eigentumsrechte, Netzsicherheit und Lieferkettensicherheit
    sowie zu wichtigen Anwendungsszenarien vervollständigt werden. Ein KI-Gesetz war bereits in den Plänen
    2024 und 2025 vorgesehen, ist aber bis zum 05.09.2026 nicht erlassen. Der Plan setzt keinen Stichtag,
    sondern nur ein Arbeitsziel für das Kalenderjahr.

    '
