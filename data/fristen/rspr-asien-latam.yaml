  beschreibung: 'INDIEN — High Court of Gujarat: Popularklage (PIL) zur Zunahme von Deepfakes und KI-generierten
    Falschinhalten. Das Gericht hat den Vermittlern (Meta, X, Google, Reddit, Scribd) Zustellungen aufgegeben,
    strikte Einhaltung der IT Rules in der Fassung von 2026 verlangt und die Anbindung an das SAHYOG-Portal
    angeordnet; die Sachentscheidung steht aus. Parallel dazu das Verfahren X Corp. zur Zwangsanbindung
    an SAHYOG (Antrag auf Abänderung vom 14.08.2026). NICHT AMTLICH BELEGT: Ein Aktenzeichen der PIL und
    die Beschlussdaten ließen sich am amtlichen Portal des High Court of Gujarat nicht verifizieren; die
    Berichterstattung datiert die Zustellungsanordnung an die Vermittler auf April 2026, andere Ueberlieferung
    auf den 06.03.2026. Beides kann sich auf verschiedene Beschlüsse beziehen — vor Verwendung am Gericht
    klären.

    '
