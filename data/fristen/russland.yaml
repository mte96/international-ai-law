    Anbieter von Modellzugängen
  handlungsbedarf: Nutzungsbedingungen für KI-Dienste mit russischem Nutzerbezug auf die Informationspflicht
    des Art. 10 Abs. 1 prüfen; bei Plattformen die Nutzerzahlschwelle des Art. 9 Abs. 3 (500.000 Tagesnutzer
    in Russland) klären.
