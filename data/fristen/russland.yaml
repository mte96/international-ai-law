- id: ru-1317978-8-markierung-f1
  datum: 2027-03-01
  beschreibung: 'Geplantes Inkrafttreten der obligatorischen Kennzeichnungspflicht nach der Duma-Vorlage
    1317978-8, falls sie verabschiedet wird. Die Vorlage wurde nach übereinstimmenden Berichten am 17.08.2026
    eingebracht und sieht den 01.03.2027 als Inkrafttretenstag vor — damit wäre die bloße Möglichkeit
    der Kennzeichnung nach Art. 9 Abs. 1 und 2 des 243-FZ zeitgleich mit dessen Anwendungsbeginn durch
    eine Pflicht ersetzt. NICHT AMTLICH BELEGT: sozd.duma.gov.ru/bill/1317978-8 war weder über WebFetch
    (robots.txt-Zeitüberschreitung) noch über den Browser (Leseberechtigung für die Domain verweigert)
    erreichbar; je zwei Versuche. Gesetzgebungsstand und Datum vor jeder Verwendung dort prüfen.

    '
