- id: ru-243-fz-ki-f2
  datum: 2032-09-01
  beschreibung: 'Ende der Übergangsfrist des 243-FZ nach dessen Art. 13 Abs. 3: Bis zum 01.09.2032 gelten
    die Anforderungen zur Verwendung souveräner oder nationaler großer fundamentaler Modelle nicht für
    Informationssysteme, die Modelle einsetzen, die vor dem Inkrafttreten des Gesetzes geschaffen wurden
    — vorausgesetzt, die gesamte Datenverarbeitung findet auf russischem Staatsgebiet statt. Danach müssen
    Systeme in den von der Regierung benannten Anwendungsbereichen umgestellt sein.

    '
