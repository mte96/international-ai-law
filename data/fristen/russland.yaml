- id: ru-2025-presnenskij-ki-bilder-f1
  datum: 2026-08-24
  beschreibung: 'GEGENSTANDSLOS — die Berufung ist entschieden. Das Moskauer Stadtgericht hat die Berufung
    im Verfahren 02-4220/2025 nach übereinstimmender Berichterstattung der Rechtsnachrichtenagentur RAPSI
    am 24.08.2026 entschieden, die Entscheidung des Presnenskij-Bezirksgerichts aufgehoben und der Klage
    teilweise stattgegeben (50.000 Rubel). Inhaltlich ist die verbreitete Einordnung als Entscheidung
    über KI-erzeugte Bilder ungenau: Streitgegenständlich waren mit Photoshop bearbeitete Fassungen bekannter
    Werke ("Mona Lisa mit Wein", "Freiheitsstatue mit Wein"). Die erste Instanz hatte die Urheberschaft
    mit der Begründung verneint, technische Bearbeitung sei kein schöpferischer Beitrag; die Berufungsinstanz
    hat die Urheberschaft bejaht und damit die Grenze zwischen menschlicher Gestaltung und bloßer technischer
    oder maschineller Erzeugung gezogen. Der frühere Eintrag führte den 01.10.2026 als bloße Schätzung
    nach üblichen Bearbeitungszeiten. NICHT AMTLICH BELEGT: Die Fallakte bei mos-gorsud.ru ließ sich aus
    dieser Umgebung nicht öffnen (Seite lud auch nach 45 Sekunden nicht, zwei Versuche).

    '
