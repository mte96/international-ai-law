- id: ru-123-fz-moskau-f1
  datum: 2025-07-01
  beschreibung: 'ABGELAUFEN. Das Moskauer KI-Experiment nach dem Föderationsgesetz vom 24.04.2020 Nr.
    123-FZ war nach Art. 1 Abs. 3 auf fünf Jahre ab dem 01.07.2020 befristet ("Экспериментальный правовой
    режим устанавливается на пять лет с 1 июля 2020 года"). Die Frist ist am 01.07.2025 abgelaufen. Die
    letzte Änderung des Gesetzes stammt vom 08.08.2024 (233-FZ); eine Verlängerung des Fünfjahreszeitraums
    ist in den Rechtsdatenbanken nicht verzeichnet. Die Datenbanken führen das Gesetz weiterhin als geltend,
    ohne es als "утратил силу" zu kennzeichnen — die auf seiner Grundlage ergangenen Rechtsakte treten
    nach seinen eigenen Bestimmungen mit Ablauf des Experiments außer Kraft. TEILWEISE UNBELEGT: Die Befristung
    ist bei ConsultantPlus am Normtext nachgewiesen, nicht aber am Primärbestand — pravo.gov.ru war für
    die Fassung von 2020 aus dieser Umgebung nicht abrufbar (Host nicht in der Egress-Freigabe; Browser
    liefert Fehlerseite).

    '
