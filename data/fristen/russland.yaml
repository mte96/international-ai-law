- id: ru-mintsifry-entwurf-2026-f1
  datum: 2027-09-01
  beschreibung: 'Ursprünglich geplantes Inkrafttreten des Mintsifry-Entwurfs zur staatlichen KI-Regulierung.
    Der Entwurf ist in dieser Fassung nicht Gesetz geworden; das verabschiedete 243-FZ enthält weder Risikoklassen
    noch eine Pflichtkennzeichnung, Sperrbefugnis oder ein Anfechtungsrecht gegen KI-gestützte Behördenentscheidungen.
    Das Datum bleibt als Bezugspunkt für eine mögliche Novelle. NICHT AMTLICH BELEGT: Für einen nicht
    eingebrachten Ministeriumsentwurf existiert keine amtliche Fundstelle; die Angabe beruht auf einer
    Agenturmeldung. Ein Abgleich mit sozd.duma.gov.ru war aus dieser Umgebung nicht möglich (Domain nicht
    abrufbar).

    '
