    (robots.txt-Zeitüberschreitung, zwei Versuche)'
- id: ru-265-fz-transfer-f1
  datum: 2026-07-26
  beschreibung: 'Das Föderationsgesetz vom 26.07.2026 Nr. 265-FZ "Über Änderungen des Art. 12 des Föderationsgesetzes
    ''Über personenbezogene Daten'' und einzelner Rechtsakte" ist nach seinem Art. 7 Abs. 1 bereits am
    Tag seiner amtlichen Veröffentlichung in Kraft getreten; amtlich veröffentlicht wurde es am 26.07.2026.
    Die Verschärfung der grenzüberschreitenden Übermittlung gilt also seit dem 26.07.2026 und nicht erst
    ab dem 01.09.2026. Art. 1 formt die Kriterien des Art. 12 Abs. 2 des 152-FZ um: Maßgeblich ist nicht
    mehr die Mitgliedschaft eines Staates im Europaratsübereinkommen über den Schutz bei automatisierter
    Verarbeitung, sondern ob sein nationales Recht dessen Anforderungen inhaltlich entspricht; die entsprechenden
    Vorzugsregeln für Vertragsstaaten in Art. 12 Abs. 5 Nr. 2, Abs. 10 und Abs. 11 entfallen. Die Angemessenheitsliste
    kann auf dieser Grundlage überarbeitet werden. Das Anzeige- und Wartefristverfahren für nicht gelistete
    Staaten folgt weiterhin aus dem unveränderten Art. 12 des 152-FZ und wurde durch den 265-FZ nicht
    neu geschaffen. Art. 2 des 265-FZ betrifft nicht den Datentransfer, sondern fügt dem Gesetz über den
    Status der Hauptstadt einen Art. 23 zu Informationssystemen Moskaus an; er tritt erst am 01.09.2027
    in Kraft (Art. 7 Abs. 2).

    '
