- id: ru-243-fz-ki-f3
  datum: 2026-12-31
  beschreibung: 'Von Duma-Vorsitzendem Wjatscheslaw Wolodin am 09.07.2026 angekündigte Wiedervorlage zentraler
    Bestimmungen des KI-Gesetzes. Kein gesetzlicher Stichtag: Art. 13 des 243-FZ, der die Staffelung des
    Inkrafttretens abschließend regelt (01.09.2026 / 01.03.2027 / 01.09.2032), kennt kein Datum zum Jahresende
    2026. Es handelt sich um eine politische Zusage, hier allein als Beobachtungstermin geführt. NICHT
    AMTLICH BELEGT: Die amtliche Duma-Meldung zur Verabschiedung (duma.gov.ru/news/63849/) war aus dieser
    Umgebung weder über WebFetch noch über den Browser abrufbar (robots.txt-Zeitüberschreitung bzw. Fehlerseite,
    je zwei Versuche).

    '
