- id: ru-243-fz-ki-f1
  datum: 2027-03-01
  beschreibung: 'Zweite Stufe des 243-FZ. Das Gesetz ist nach Art. 13 Abs. 1 im Übrigen bereits am 01.09.2026
    in Kraft getreten; Art. 13 Abs. 2 schiebt einen abschließend aufgezählten Teil auf den 01.03.2027:
    die Punkte 3 bis 5 des Art. 5 Abs. 2, die Absätze 2 bis 5 des Art. 6 sowie die Artikel 8 bis 10. Ab
    diesem Tag gelten: die Pflichten der Entwickler souveräner und nationaler großer fundamentaler Modelle
    (Art. 8); die Kennzeichnungsregeln des Art. 9 — für Nutzer eine bloße Möglichkeit, für Betreiber von
    Seiten mit mehr als 500.000 Tagesnutzern in Russland dagegen die Pflicht, ihren Nutzern die technische
    Möglichkeit zur Kennzeichnung KI-erzeugter Inhalte einzuräumen (Art. 9 Abs. 3); und die Anforderungen
    des Art. 10, dessen Absatz 1 die Anbieter von Zugängen zu großen fundamentalen Modellen verpflichtet,
    die Nutzer über die Zuordnung der Rechte an den Arbeitsergebnissen und über die Bedingungen des Zugangs,
    der Nutzung und der Aufbewahrung dieser Ergebnisse zu unterrichten, während Absatz 2 eine Trainingsschranke
    für rechtmäßig erlangte oder ohne technische Beschränkung offengelegte Werke enthält.

    '
  typ: anwendungsbeginn
  jurisdiktion: ru
  regelwerk: ru-243-fz-ki
