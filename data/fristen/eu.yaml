- id: harmonisierte-normen-jtc21-f1
  datum: 2026-12-31
  beschreibung: 'Zielhorizont Q4 2026 für die Verfügbarkeit der Schlüsselnormen zur KI-VO. CEN und CENELEC
    haben auf der gemeinsamen Sitzung ihrer Technischen Boards vom 14. bis 16.10.2025 ein außergewöhnliches
    Maßnahmenpaket beschlossen (u. a. Direktveröffentlichung nach positiver Umfrage ohne gesonderte Schlussabstimmung),
    ''to ensure these standards are available by Q4 2026''. Kein Rechtsakt und keine gesetzliche Frist.
    Verfügbarkeit ist nicht Zitierung: Die Vermutungswirkung des Art. 40 KI-VO tritt erst mit der Zitierung
    im Amtsblatt ein, die zusätzlich die Bewertung durch die Kommission voraussetzt.

    '
  typ: anwendungsbeginn
  jurisdiktion: eu
  regelwerk: harmonisierte-normen-jtc21
  adressat: CEN-CENELEC JTC 21
  handlungsbedarf: null
  quelle: https://www.cencenelec.eu/news-events/news/2025/brief-news/2025-10-23-ai-standardization/
  verifiziert: true
  fundstelle_norm: 'Kein Rechtsakt — Beschluss der Technischen Boards von CEN und CENELEC vom 14.-16.10.2025,
    veröffentlicht am 23.10.2025; rechtliche Anknüpfung: Art. 40 KI-VO'
  kalender_sync: true
  vorwarnung_tage:
