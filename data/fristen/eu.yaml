- id: durchfuehrungs-und-delegierte-rechtsakte-ki-vo-f1
  datum: 2027-08-02
  beschreibung: 'Der Stichtag folgt aus dem durch die VO (EU) 2026/1744 eingefügten Art. 2 Abs. 13 KI-VO:
    Die Kommission erlässt bis zum 02.08.2027 delegierte Rechtsakte, mit denen die Anwendung der Art.
    9 bis 15 und 17 bis 25 KI-VO auf Anhang-I-Hochrisiko-Systeme beschränkt werden kann, soweit sektorales
    Unionsrecht ein gleichwertiges oder höheres Schutzniveau bietet. Weitere Fristen der Kommission in
    der geltenden Fassung: Leitlinien nach Art. 96 Abs. 1 lit. g KI-VO (praktische Umsetzung von Art.
    8 Abs. 2, Art. 9 Abs. 10, Art. 17 Abs. 3) bis zum 01.08.2027; Leitlinien einschließlich Muster für
    den Plan der Beobachtung nach dem Inverkehrbringen nach Art. 72 Abs. 3 KI-VO bis zum 02.09.2027. Die
    Leitlinien zur Hochrisiko-Einstufung nach Art. 6 Abs. 5 KI-VO waren dagegen ''spätestens bis zum 2.
    Februar 2026'' zu erlassen — diese Frist ist verstrichen.

    '
  typ: anwendungsbeginn
