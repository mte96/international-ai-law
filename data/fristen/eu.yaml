- id: digital-omnibus-ai-2026-1744-f1
  datum: 2028-08-02
  beschreibung: 'Art. 3 Nr. 1 der VO (EU) 2026/1744 fügt Art. 8 der Maschinen-VO (EU) 2023/1230 zwei Absätze
    an: Die Kommission erlässt delegierte Rechtsakte, die Anhang III der Maschinen-VO um Sicherheits-
    und Gesundheitsschutzanforderungen für KI-Systeme ergänzen, die nach Art. 6 Abs. 1 KI-VO als hochriskant
    gelten. Der Verordnungstext bestimmt: ''Diese delegierten Rechtsakte gelten ab dem 2. August 2028.''
    Präzisierung gegenüber der früheren Fassung dieses Eintrags: Der 02.08.2028 ist der Geltungsbeginn
    der delegierten Rechtsakte, nicht eine Erlassfrist der Kommission.

    '
  typ: anwendungsbeginn
