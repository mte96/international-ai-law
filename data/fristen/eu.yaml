- id: ki-vo-2024-1689-f4
  datum: 2028-08-02
  beschreibung: 'Kapitel III Abschnitte 1 bis 3 KI-VO gelten ab diesem Tag für KI-Systeme, die nach Art.
    6 Abs. 1 und Anhang I als hochriskant eingestuft sind, also für KI als Sicherheitsbauteil von Produkten
    unter den Harmonisierungsrechtsvorschriften der Union. Durch die VO (EU) 2026/1744 vom ursprünglichen
    02.08.2027 verschoben. Zum selben Tag gelten die delegierten Rechtsakte zur Maschinen-VO (EU) 2023/1230
    (siehe maschinenverordnung-2023-1230-f2).

    '
