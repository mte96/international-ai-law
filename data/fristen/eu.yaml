- id: ki-vo-2024-1689-f1
  datum: 2026-12-02
  beschreibung: 'Zwei Stichtage fallen zusammen. Erstens gelten ab diesem Tag die durch die VO (EU) 2026/1744
    eingefügten Verbote des Art. 5 Abs. 1 UAbs. 1 lit. ba (KI-erzeugte nicht einvernehmliche intime Darstellungen)
    und lit. bb (Darstellungen sexuellen Kindesmissbrauchs) sowie Art. 5 Abs. 1a und 1b; Art. 113 Abs.
    3 lit. a KI-VO nimmt sie ausdrücklich vom Geltungsbeginn der Kapitel I und II am 02.02.2025 aus. Zweitens
    endet nach Art. 111 Abs. 4 KI-VO die Übergangsfrist für Anbieter von KI-Systemen einschließlich GPAI-Systemen,
    die synthetische Audio-, Bild-, Video- oder Textinhalte erzeugen und vor dem 02.08.2026 in Verkehr
    gebracht wurden: Sie müssen bis zu diesem Tag die maschinenlesbare Kennzeichnung nach Art. 50 Abs.
    2 KI-VO umgesetzt haben.

    '
  typ: anwendungsbeginn
  jurisdiktion: eu
  regelwerk: ki-vo-2024-1689
  adressat: Anbieter und Betreiber von KI-Systemen mit den verbotenen Praktiken; Anbieter generativer
    KI-Systeme und GPAI-Systeme, die vor dem 02.08.2026 in Verkehr gebracht wurden
  handlungsbedarf: null
  quelle: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX%3A02024R1689-20260727
