- id: ki-vo-2024-1689-f2
  datum: 2027-08-02
  beschreibung: 'Zwei Pflichten werden fällig. Erstens müssen Anbieter von KI-Modellen mit allgemeinem
    Verwendungszweck, die vor dem 02.08.2025 in Verkehr gebracht wurden, bis zu diesem Tag die Pflichten
    des Kapitels V erfüllen (Art. 111 Abs. 3 KI-VO). Zweitens muss jeder Mitgliedstaat bis dahin mindestens
    ein nationales KI-Reallabor einsatzbereit haben (Art. 57 Abs. 1 KI-VO i.d.F. der VO (EU) 2026/1744).
    Die Leitlinien der Kommission zur Hochrisiko-Einstufung gehören nicht hierher: Art. 6 Abs. 5 KI-VO
    verlangt sie "spätestens bis zum 2. Februar 2026"; die Frist ist verstrichen, ohne dass eine Endfassung
    vorliegt.

    '
