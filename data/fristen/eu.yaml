  beschreibung: 'Art. 14 CRA wird wirksam: Meldepflichten der Hersteller gegenüber CSIRT und ENISA bei
    aktiv ausgenutzten Schwachstellen und schwerwiegenden Sicherheitsvorfällen (Frühwarnung binnen 24
    Stunden, Meldung binnen 72 Stunden, Abschlussbericht). Die Verordnung im Übrigen gilt erst ab dem
