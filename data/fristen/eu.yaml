- id: produkthaftungsrichtlinie-2024-2853-f1
  datum: 2026-12-09
  beschreibung: 'Umsetzungsfrist der Mitgliedstaaten nach Art. 22 Abs. 1 RL (EU) 2024/2853. Zugleich der
    zeitliche Anwendungsschnitt: Die Richtlinie gilt nach Art. 2 Abs. 1 für Produkte, die nach dem 09.12.2026
    in Verkehr gebracht oder in Betrieb genommen werden; die Richtlinie 85/374/EWG wird nach Art. 21 mit
    Wirkung vom 09.12.2026 aufgehoben, gilt aber für vorher in Verkehr gebrachte Produkte fort. Software
    einschließlich KI-Systemen ist Produkt im Sinne der neuen Richtlinie.

