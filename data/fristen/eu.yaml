- id: ki-vo-2024-1689-f3
  datum: 2027-12-02
  beschreibung: 'Kapitel III Abschnitte 1 bis 3 KI-VO (Anforderungen an Hochrisiko-KI-Systeme und Pflichten
    der Akteure) gelten ab diesem Tag für Systeme, die nach Art. 6 Abs. 2 und Anhang III als hochriskant
    eingestuft sind — Biometrie, kritische Infrastruktur, Bildung, Beschäftigung, wesentliche private
    und öffentliche Dienste, Strafverfolgung, Migration und Grenzkontrolle, Justiz und Demokratie. Durch
    die VO (EU) 2026/1744 vom ursprünglichen 02.08.2026 verschoben. Ausgenommen bleibt Art. 6 Abs. 5.

    '
