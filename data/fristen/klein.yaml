- id: ar-proyectos-ia-congreso-f1
  datum: 2026-02-28
  beschreibung: Ablauf der Frist des Art. 1 Ley 13.640 für die im Jahr 2024 in der Cámara de Diputados
    eingebrachten KI-Gesetzentwürfe. Ein Entwurf, der weder im Jahr seiner Einbringung noch im Folgejahr
    die Zustimmung einer Kammer erhält, gilt als verfallen (caduco). Betroffen sind unter anderem die
    Expedientes 4079-D-2024 (Giudici), 3955-D-2024, 3900-D-2024, 3003-D-2024 und 1013-D-2024. Damit ist
    Argentinien nach zwei Jahren Gesetzgebungsanläufen wieder ohne anhängigen KI-Rahmenentwurf aus 2024.
  typ: sonstiges
  jurisdiktion: ar
  regelwerk: ar-proyectos-ia-congreso
  adressat: Honorable Cámara de Diputados de la Nación
  handlungsbedarf: Prüfen, welche Entwürfe erneut eingebracht (reproducidos) worden sind; die Wiedereinbringung
    ist in Argentinien die Regel, nicht die Ausnahme.
  fundstelle_norm: Art. 1 Ley 13.640 ("Todo proyecto de ley ... que no obtenga sanción en una de sus Cámaras
    durante el año parlamentario en que tuvo entrada en el cuerpo o en el siguiente, se tendrá por caducado")
  quelle: https://www3.hcdn.gob.ar/dependencias/secparl/dgral_info_parlamentaria/dip/archivos/Ley_13640_TA.pdf
