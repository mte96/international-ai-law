- id: tw-ki-basisgesetz-f1
  datum: 2028-01-14
  beschreibung: 'Ablauf der Zweijahresfrist des Art. 18 Abs. 1 KI-Basisgesetz. Bis zu diesem Tag hat die
    Regierung ihr gesamtes Fachrecht und ihre Verwaltungsmassnahmen zu ueberpruefen und, soweit sie dem
    Gesetz widersprechen oder Regelungen fehlen, die Rechtsetzung, -aenderung oder -aufhebung sowie die
    Verbesserung der Verwaltungsmassnahmen abzuschliessen. Der Exekutiv-Yuan hat den Auftrag am 21.05.2026
    dahin konkretisiert, dass saemtliche Fachaufsichten bis Januar 2028 fuer ihren Bereich Verwaltungsvorschriften
    und Branchenleitlinien zu erlassen und die Rechtsanpassung abzuschliessen haben. Betroffen sind insbesondere
