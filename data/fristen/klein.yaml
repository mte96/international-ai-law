  handlungsbedarf: Beobachten, ob ein acuerdo general oder Lineamientos nachgeschoben werden und ob die
    SCJN die vier Mindestelemente der Tesis II.2o.C. J/2 K (12a.) uebernimmt.
  quelle: https://www.cronica.com.mx/jalisco/guadalajara/2026/09/04/ministros-de-la-suprema-corte-usaran-la-inteligencia-artificial-como-herramienta-de-apoyo/
  verifiziert: false
  kalender_sync: true
  vorwarnung_tage:
  - 7
  sekundaerquelle: https://udgtv.com/noticias/la-suprema-corte-usara-ia-sin-regulacion-previa/330625
  letzte_pruefung: 2026-09-07
  pruefvermerk:
  - '07.09.2026: Kein amtlicher Beleg für einen Plenarbeschluss vom 03./04.09.2026. Geprüft: (a) Comunicados-Index
    der SCJN — die zuletzt geführten Comunicados 117 bis 126 betreffen Wahlrecht, Wasserrechte, indigenen
    Justizzugang und Verwaltungsverfahren, kein Comunicado zu KI; (b) Einzel-Comunicados auf internet2.scjn.gob.mx
    antworten mit HTTP 403; (c) eine DOF-Suche nach einem acuerdo general der SCJN zu künstlicher Intelligenz
    ergibt keinen Treffer aus 2026; (d) die Síntesis Informativa der SCJN vom 04.09.2026 nennt nur einen
    Círculo de Estudio zu "Inteligencia artificial y su impacto en la función jurisdiccional"; (e) die
    Síntesis Informativa vom 05.09.2026 gibt als Presseschau wieder, Ministra Loretta Ortiz habe gesagt,
    die Institution "está implementando la IA sin haberla regulado antes". Der Sachverhalt — Einführung
    ohne vorherige normative Regelung — ist damit doppelt sekundär belegt und wird von der eigenen amtlichen
    Presseschau der SCJN wiedergegeben, aber nicht durch ein Rechtsdokument. Das ist genau der berichtete
    Befund: Es gibt keine Regelung, deshalb gibt es nichts zu zitieren. volltext_url bleibt leer, verifiziert
    bleibt false.'
