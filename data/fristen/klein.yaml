  beschreibung: Beginn des KI-Einsatzes als Unterstuetzungswerkzeug in der Rechtsprechungstaetigkeit der
    Ministras und Ministros der SCJN nach dem Plenarbeschluss vom 03./04.09.2026 — ohne vorherige normative
