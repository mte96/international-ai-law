- id: nz-copyright-reform-2026-f1
  datum: 2027-03-31
  beschreibung: 'Frist für die Rückberichterstattung des Minister of Commerce and Consumer Affairs an
    das Kabinett zu einem möglichen urheberrechtlichen Rahmen für generative KI in Neuseeland. Die Kabinettsentscheidung
    vom Juni 2026 hat die KI-Frage aus dem beschlossenen Copyright-Paket ausdrücklich herausgenommen und
    auf diesen Termin vertagt: "Cabinet has invited the Minister of Commerce and Consumer Affairs to report
    back by 31 March 2027 on a possible copyright framework for GenAI in New Zealand." Das ist der einzige
    verbindliche Termin des neuseeländischen KI-Rechts und der Zeitpunkt, an dem über eine TDM-Schranke
    oder ein Lizenzmodell entschieden wird.

    '
  typ: pruefung
  jurisdiktion: nz
  regelwerk: nz-copyright-reform-2026
  adressat: Minister of Commerce and Consumer Affairs; mittelbar Rechteinhaber, Verwertungsgesellschaften,
    Modellanbieter und Nutzer generativer KI in Neuseeland
  handlungsbedarf: Beobachten, ob eine öffentliche Konsultation ausgeschrieben wird; sie wäre die einzige
    Gelegenheit, zur neuseeländischen TDM-Frage Stellung zu nehmen.
  quelle: https://www.beehive.govt.nz/release/creative-and-cultural-sector-gets-further-copyright-support
  verifiziert: true
  kalender_sync: true
  vorwarnung_tage:
