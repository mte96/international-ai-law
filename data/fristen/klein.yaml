    und Technikgestaltung), fuer den im PDPA bislang fehlenden Schutz gegen automatisierte Einzelentscheidungen
    und fuer die Rechtsgrundlage der Verarbeitung zu Trainingszwecken. Zusaetzlich ist die bereits am
    11.11.2025 verkuendete Novelle in Kraft zu setzen, was die Verabschiedung des 個人資料保護委員會組織法 voraussetzt.

