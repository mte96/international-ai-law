- id: de-2026-bgh-schufa-auskunft-f1
  datum: 2026-10-21
  beschreibung: 'Verkündungstermin des I. Zivilsenats des Bundesgerichtshofs um 8.45 Uhr in Sachen I ZR
    227/25 bis I ZR 230/25 (Auskunftsanspruch gegen Wirtschaftsauskunftei). KORREKTUR des Aktenzeichens:
    Nach den Terminhinweisen des BGH ist im Verfahren I ZR 226/25 die Klage zurückgenommen worden; verkündet
    wird nur noch in den vier Verfahren I ZR 227/25 bis I ZR 230/25. Verhandelt wurde am 18.06.2026 (Pressemitteilung
    Nr. 52/2026). Vorinstanzen: Landgerichte Leipzig, Chemnitz und Görlitz, Oberlandesgericht Dresden
    (Urteile vom 07.10.2025). Es geht um Umfang und Tiefe der Auskunft über die Berechnung von Bonitätsscores
    nach Art. 15 Abs. 1 lit. h DSGVO; das Berufungsgericht hatte eine laienverständliche Information verlangt,
    die eine Prüfung des Scorewerts auf Fehler und mangelnde Plausibilität ermöglicht.

    '
  typ: pruefung
  jurisdiktion: de
  verfahren: de-2026-bgh-schufa-auskunft
  adressat: Auskunfteien; Banken und Versicherer; Betreiber algorithmischer Bewertungssysteme; Betroffenenvertreter
  handlungsbedarf: Auskunftstexte zu automatisierten Bewertungen bis zum Termin auf die Formel aus C-203/22
