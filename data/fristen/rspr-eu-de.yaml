- id: de-2026-gema-suno-lg-f1
  datum: 2027-02-01
  beschreibung: 'Gesetzliche Höchstfrist für die Berufung gegen LG München I, Urteil vom 31.07.2026 –
    42 O 763/25 (GEMA ./. Suno Inc.). Die Pressemitteilung des Landgerichts München I (Nr. 16/2026) weist
    das Urteil aus und hält ausdrücklich fest: ''Das Urteil ist nicht rechtskräftig.'' Nach § 517 ZPO
    beträgt die Berufungsfrist einen Monat und beginnt mit der Zustellung des in vollständiger Form abgefassten
    Urteils, spätestens aber mit dem Ablauf von fünf Monaten nach der Verkündung — hier also spätestens
    mit Ablauf des 31.12.2026. Die Monatsfrist endet danach am 31.01.2027; weil das ein Sonntag ist, tritt
    nach § 222 Abs. 2 ZPO der 01.02.2027 an seine Stelle. Der tatsächliche Fristablauf kann früher liegen,
    weil das Zustellungsdatum nicht veröffentlicht ist; eingetragen ist deshalb die Höchstfrist.

    '
  typ: einreichung
  jurisdiktion: de
  verfahren: de-2026-gema-suno-lg
  adressat: Anbieter von Musikgeneratoren; Verwertungsgesellschaften; Musikverlage
  handlungsbedarf: null
  quelle: https://www.justiz.bayern.de/gerichte-und-behoerden/landgericht/muenchen-1/presse/2026/16.php
