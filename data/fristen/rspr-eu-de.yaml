- id: eu-2026-xai-holdings-kommission-f1
  datum: 2026-09-15
  beschreibung: Klärung des Streitgegenstands von EuG, T-120/26 (X.AI Holdings ./. Kommission, Klage v.
    16.02.2026) über den Volltext der ABl-Bekanntmachung C/2026/2391. Bis dahin unverifizierte Spur ohne
    belegten KI-VO-Bezug.
  typ: pruefung
  jurisdiktion: eu
  verfahren: eu-2026-xai-holdings-kommission
  adressat: — (interner Recherchevorbehalt)
  handlungsbedarf: 'ENTSCHEIDUNG DES BEARBEITERS NÖTIG. Zwei Prüfläufe haben den Sachtext der Bekanntmachung
    C/2026/2391 nicht beschaffen können. Amtlich belegt sind nur die Metadaten: CELEX 62026TN0120, Rechtssache
    T-120/26, X.AI Holdings ./. Kommission, Klagedatum 16.02.2026. Angefochtener Rechtsakt, Klagegründe
    und Verfahrensstand bleiben unbelegt, ein Bezug zur KI-VO ist nicht belegt. Entweder Eintrag und Frist
    streichen oder den Prüftermin verlegen und über einen anderen Zugang (Amtsblatt-PDF, Curia mit JavaScript)
    erneut versuchen.'
  quelle: https://eur-lex.europa.eu/eli/C/2026/2391/oj/eng
  verifiziert: false
  kalender_sync: false
  vorwarnung_tage:
  - 7
  letzte_pruefung: 2026-09-07
  pruefvermerk:
  - '07.09.2026: Zweiter Prüflauf ohne Ergebnis. EUR-Lex führt unter CELEX 62026TN0120 die Bekanntmachung
    C/2026/2391 mit Aktenzeichen, Parteien und Dokumentdatum 16.02.2026, liefert aber ausschließlich diese
    Metadaten; die Abschnitte "Form of order sought" und "Pleas in law and main arguments" fehlen. PDF-,
    HTML- und DE-Sprachfassung waren nicht erreichbar, eine Abfrage über Curia oder InfoCuria nach Rechtssachennummer
    ebenfalls nicht. NICHT BELEGT und ausdrücklich nicht übernommen: Dass die Klägerin nach der Fusion
    vom März 2025 Holdinggesellschaft von xAI und X Corp. ist, legt einen DSA- oder DMA-Kontext nahe —
    das ist eine Vermutung ohne Fundstelle.'
