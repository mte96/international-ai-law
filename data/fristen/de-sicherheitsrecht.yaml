- id: de-automatisierte-datenanalyse-polizei-f2
  datum: 2030-12-31
  beschreibung: 'Ende der fünfjährigen Laufzeit des Palantir-Vertrags von Baden-Württemberg, als Jahresendstichtag
    2030 gesetzt. Amtlich belegt sind Laufzeit und Ausstiegsabsicht, nicht das Enddatum: Die Beschlussempfehlung
    und der Bericht des Ausschusses für Inneres, Digitalisierung und Kommunen (LT-BW-Drs. 17/9670, Sitzung
    vom 22.10.2025, ausgegeben am 05.11.2025) hält fest, die Landesregierung bezeichne Palantir als Übergangssoftware,
    wolle die Verlängerungsoption nicht nutzen und nach fünf Jahren unmittelbar auf eine andere Software
    wechseln; er nennt ferner ein Kostenrisiko von fast 25 Millionen Euro, das entstanden wäre, wenn die
    Lizenzkosten Ende März 2026 vertragsgemäß um 100 Prozent gestiegen wären. Ein Vertragsbeginn und damit
    ein exaktes Vertragsende ist amtlich nicht veröffentlicht.

    '
