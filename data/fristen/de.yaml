- id: de-prodhaftg-modernisierung-f1
  datum: 2026-12-09
  beschreibung: 'Ablauf der Umsetzungsfrist der Richtlinie (EU) 2024/2853 (Art. 22 Abs. 1) und vorgesehenes
    Inkrafttreten des neuen deutschen Produkthaftungsgesetzes. Ab diesem Tag haften Hersteller für fehlerhafte
    Software einschließlich KI-Systemen verschuldensunabhängig; für vorher in Verkehr gebrachte Produkte
    gilt das ProdHaftG 1989 fort.

    '
