- id: au-jsc-ai-2026-f1
  datum: 2026-09-14
  beschreibung: 'Einreichungsschluss für Submissions an den Joint Select Committee on Artificial Intelligence
    des Commonwealth-Parlaments. Der Ausschuss wurde am 20.08.2026 durch gleichlautende Beschlüsse von
    Repräsentantenhaus und Senat eingesetzt. Sein Auftrag umfasst nach Abs. 1 der Einsetzungsentschließung
    unter anderem die Angemessenheit des geltenden Rechts und etwaigen Reformbedarf (lit. i), das Verhältnis
    von KI zu Immaterialgüter- und Urheberrecht einschließlich der Nutzung australischer kreativer, kultureller
    und medialer Inhalte für das Modelltraining (lit. j), Datensouveränität und domänenspezifische, auf
    australischen Daten trainierte Modelle (lit. f), Risiken und Schäden einschließlich Betrug, Scams,
    Deepfakes und Kinderschutz (lit. k) sowie Cybersicherheit, Lieferketten und kritische Infrastruktur
    (lit. l). Der Ausschuss bittet um kurze Eingaben von etwa fünf bis sechs Seiten.

    '
  typ: einreichung
  jurisdiktion: au
  regelwerk: au-jsc-ai-2026
  adressat: Jedermann — Einzelpersonen, Unternehmen, Verbände, Wissenschaft
  handlungsbedarf: 'HANDLUNGSBEDARF FÜR DEN BEARBEITER. Dies ist das derzeit wichtigste offene Beteiligungsfenster
    der australischen KI-Regulierung: Der Ausschuss berichtet am 30.11.2026 und wird absehbar die für
    Anfang 2027 erwartete Gesetzgebung prägen. Wer Einfluss nehmen will, muss bis zum 14.09.2026 einreichen
    — das sind neun Tage. Frist und Berichtstermin sind am 05.09.2026 unmittelbar auf aph.gov.au bestätigt;
    die frühere Unsicherheit über das Datum (nur eine Sekundärquelle) besteht nicht mehr. Einreichung
    über das Online-Formular des Ausschusses, Sekretariat ai.joint@aph.gov.au.

    '
