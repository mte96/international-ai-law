- id: au-privacy-act-1988-f1
  datum: 2026-12-10
  beschreibung: 'Anwendungsbeginn der Transparenzpflicht für automatisierte Entscheidungen (APP 1.7 Privacy
    Act 1988). Datenschutzerklärungen müssen offenlegen, welche Arten personenbezogener Daten in automatisierte
    Entscheidungssysteme einfließen und welche Arten von Entscheidungen ausschließlich automatisiert getroffen
    oder durch Computerprogramme maßgeblich vorbereitet werden, soweit sie Rechte oder Interessen erheblich
    berühren können. Der Stichtag ergibt sich aus der Commencement-Tabelle des Änderungsgesetzes: Schedule
    1 Part 15 tritt am Tag nach Ablauf von 24 Monaten seit dem Royal Assent (10.12.2024) in Kraft. Die
    OAIC nennt denselben Tag in ihren APP-Richtlinien zu Kapitel 1.

    '
  typ: anwendungsbeginn
  jurisdiktion: au
  regelwerk: au-privacy-act-1988
  adressat: 'Alle APP-Entitäten: Bundesbehörden sowie Unternehmen ab 3 Mio. AUD Jahresumsatz und bestimmte
    kleinere Unternehmen

    '
  handlungsbedarf: 'Für eine künftige Tätigkeit in Australien praktisch bedeutsam: Jede Kanzlei oder Organisation,
    die KI in entscheidungsnahen Prozessen einsetzt, muss die Datenschutzerklärung bis zu diesem Tag angepasst
    haben. Es ist die ERSTE bundesrechtliche KI-Transparenzpflicht Australiens überhaupt.

    '
  quelle: https://www.legislation.gov.au/C2024A00128/asmade
  verifiziert: true
  kalender_sync: true
  vorwarnung_tage:
  - 90
  - 30
  - 7
  fundstelle_norm: 'Privacy and Other Legislation Amendment Act 2024 (Cth), Nr. 128 von 2024, s 2 (Commencement-Tabelle)
    für Schedule 1 Part 15 "Automated decisions and privacy policies": "The day after the end of the period
    of 24 months beginning on the day this Act receives the Royal Assent"; Royal Assent am 10.12.2024,
    daraus 10.12.2026. Eingefügte Norm: APP 1.7 in Schedule 1 zum Privacy Act 1988 (Cth)'
