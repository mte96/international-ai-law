- id: us-ca-cipa-f1
  datum: 2027-01-01
  beschreibung: 'Geplantes Inkrafttreten der Änderung des California Invasion of Privacy Act durch SB
    690 (Caballero): Wegfall des privaten Klagerechts für pen-register-Ansprüche nach § 638.51 aus Websites,
    Apps und Online-Anwendungen. Stand: Die Legislative hat SB 690 verabschiedet — nach der Pressemitteilung
    des Senatsbüros vom 31.08.2026 mit 39:0 in der Assembly —; das Gesetz lag danach beim Gouverneur zur
    Unterzeichnung. Bei Rechercheschluss am 05.09.2026 ist keine Unterzeichnung belegt. Der 01.01.2027
    folgt aus der allgemeinen Regel für Gesetze ohne Dringlichkeitsklausel und setzt die Unterzeichnung
    voraus; er ist nicht am Gesetzestext belegt.

