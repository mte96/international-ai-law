    (EU) 2021/1772 (DSGVO) neu: ''Die Geltungsdauer dieses Beschlusses endet am 27. Dezember 2031, sofern
    sie nicht nach dem in Artikel 93 Absatz 2 der Verordnung (EU) 2016/679 genannten Verfahren verlängert
    wird.'' Wortgleich für den Bereich der Richtlinie (EU) 2016/680: Art. 4 des Durchführungsbeschlusses
    (EU) 2021/1773 i.d.F. des Durchführungsbeschlusses (EU) 2025/2571. Beide sind im Amtsblatt vom 23.12.2025
    veröffentlicht. Die Kommission überwacht die Anwendung fortlaufend und kann die Beschlüsse aussetzen,
    aufheben oder ändern; Änderungen des britischen Rechts durch Sekundärgesetzgebung nach dem DUAA können
    sie vorher berühren.

