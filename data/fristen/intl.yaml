- id: coe-rahmenkonvention-ki-cets-225-f1
  datum: 2026-05-15
  beschreibung: 'Die amtliche Zeichnungs- und Ratifikationstabelle des Vertragsbüros des Europarats weist
    mit Stand 05.09.2026 für CETS Nr. 225 genau eine Ratifikation aus: die der Europäischen Union, hinterlegt
    am 15.05.2026. Die Spalte ''Entry into Force'' ist für die EU leer, die Zahl der Unterzeichnungen
    ohne Ratifikation beträgt 20. Nach Art. 30 tritt das Übereinkommen erst in Kraft, wenn fünf Unterzeichner,
    darunter mindestens drei Mitgliedstaaten des Europarats, ihre Zustimmung ausgedrückt haben; erst danach
    greift für Nachzügler die Regel des ersten Tages des Monats nach Ablauf von drei Monaten. Das Übereinkommen
    ist damit weder allgemein noch für die EU in Kraft. Der verbreitete Stichtag 01.09.2026 beruht auf
    einer Berechnung von nicfab.eu, die die Eingangsbedingung des Art. 30 übergeht; er ist widerlegt.

    '
  typ: sonstiges
  jurisdiktion: coe
  regelwerk: cö-rahmenkonvention-ki-cets-225
  adressat: Europäische Union und ihre Organe; mittelbar Mitgliedstaaten
  quelle: https://www.coe.int/en/web/conventions/full-list?module=signatures-by-treaty&treatynum=225
  verifiziert: true
  fundstelle_norm: 'Art. 30 CETS Nr. 225 (Inkrafttreten: fünf Ratifikationen, darunter drei Mitgliedstaaten
    des Europarats); Ratifikationstabelle des Vertragsbüros, Stand 05.09.2026'
  kalender_sync: false
  vorwarnung_tage:
  - 30
  - 7
  notiz_erledigt: 'Erledigt am 05.09.2026: Die amtliche Ratifikationstabelle wurde abgerufen. Der Widerspruch
    ist aufgelöst — die Konvention ist nicht in Kraft; nicfab.eu lag falsch. Weiter zu beobachten ist,
    wann vier weitere Ratifikationen erreicht sind.

    '
  handlungsbedarf: null
