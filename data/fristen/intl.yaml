- id: jp-appi-f1
  datum: 2028-07-17
  beschreibung: 'Spätestes Inkrafttreten der japanischen APPI-Novelle. Das 「個人情報の保護に関する法律等の一部を改正する法律」
    wurde nach der Bekanntmachung der Datenschutzkommission (PPC) am 17.07.2026 verkündet. Es tritt —
    mit Ausnahmen — an einem durch Regierungsverordnung (政令) zu bestimmenden Tag innerhalb von zwei Jahren
    nach der Verkündung in Kraft; die äußerste Grenze ist damit der 17.07.2028. Das genaue Datum steht
    noch nicht fest, die PPC arbeitet an Verordnungen, Regeln und Leitlinien. Mit der Novelle entfällt
    das Einwilligungserfordernis für die Weitergabe personenbezogener Daten an Dritte zu Statistik- und
    KI-Entwicklungszwecken, und es beginnt das neue Abschöpfungsregime der Kommission.

    '
  typ: anwendungsbeginn
  jurisdiktion: jp
  regelwerk: jp-appi
  adressat: Verantwortliche mit Datenverarbeitung in Japan; Anbieter, die japanische Trainingsdaten beziehen
  handlungsbedarf: Vor Inkrafttreten prüfen, ob Beschaffungswege für Trainingsdaten über Japan geführt
    werden können, und das Sanktionsrisiko neu bewerten.
  quelle: https://www.ppc.go.jp/personalinfo/legal/r8kaiseihogohou/
  verifiziert: true
  fundstelle_norm: '附則 (Inkrafttretensvorschrift) des Änderungsgesetzes: 公布の日から起算して2年以内において政令で定める日; Verkündung
    17.07.2026 (PPC-Bekanntmachung vom 17.07.2026)'
