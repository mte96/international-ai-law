  beschreibung: 'Zweite Stufe des indischen DPDP-Regimes: Rule 4 der Digital Personal Data Protection
    Rules, 2025 tritt in Kraft — Registrierungspflicht und Pflichten der Consent Manager; das Data Protection
    Board erhält insoweit Untersuchungs- und Sanktionsbefugnisse. Die Rules sind als G.S.R. 846(E) am
    13.11.2025 im Gazette of India veröffentlicht worden. Rule 1 bestimmt, dass Rule 4 ein Jahr nach der
    Veröffentlichung in Kraft tritt; maßgeblich ist danach der 13.11.2026. Wer die Frist einen Tag später
    ansetzt, liest ''one year after'' als Tagesausschluss — für die Kalenderführung ist der frühere Termin
    der sichere.

    '
