- id: kr-ai-framework-act-f1
  datum: 2027-01-22
  beschreibung: 'Voraussichtliches Ende der einjährigen Karenz, in der das Ministerium für Wissenschaft
    und IKT bei Verstößen gegen das koreanische KI-Rahmengesetz beraten statt bußen will. Amtlich belegt
    ist nur der Anknüpfungspunkt: Das 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법 (Gesetz Nr. 20676, verkündet am 21.01.2025)
    ist am 22.01.2026 in Kraft getreten. Die Karenz beruht auf einer Verwaltungsankündigung, nicht auf
    einer Übergangsvorschrift des Gesetzes; ein Enddatum ist rechtlich nirgends fixiert. Das hier eingetragene
    Datum ist deshalb ein abgeleiteter Beobachtungsstichtag (ein Jahr nach Inkrafttreten), kein gesetzlicher
    Stichtag. Ab Ende der Karenz ist mit Bußgeldern bis 30 Mio. KRW und mit Abhilfeanordnungen zu rechnen.

    '
  typ: umsetzungsfrist
  jurisdiktion: kr
  regelwerk: kr-ai-framework-act
  adressat: Alle Anbieter und Betreiber von KI-Systemen mit Wirkung auf den koreanischen Markt, insbesondere
    ausländische Anbieter oberhalb der Schwellen für den inländischen Vertreter
  handlungsbedarf: Prüfen, ob eigene Angebote als hochwirksame KI einzustufen sind und ob die Schwellen
    für die Benennung eines inländischen Vertreters erreicht werden.
  quelle: https://www.law.go.kr/lsInfoP.do?lsiSeq=268543
  verifiziert: false
  fundstelle_norm: 'Inkrafttreten: 부칙 (Addendum) zum Gesetz Nr. 20676, 시행일 22.01.2026 — für das Karenzende
    selbst existiert keine Vorschrift'
  kalender_sync: true
  vorwarnung_tage:
  - 90
  - 30
  - 7
  pruefvermerk: 'Gesetzesdaten am Nationalen Rechtsinformationszentrum (law.go.kr) belegt. Eine amtliche
    MSIT-Bekanntmachung mit dem Enddatum der Karenz war über Suche und Direktabruf nicht auffindbar; die
    frühere Quelle war eine Kanzleiseite.

    '
- id: cn-beijing-ki-vo-f1
  datum: 2026-12-31
  beschreibung: 'Ende des Pekinger Gesetzgebungsjahres 2026 als Beobachtungsstichtag. Die 北京市人工智能产业发展条例
    (Verordnung über die Entwicklung der KI-Industrie) ist im Gesetzgebungsarbeitsplan des Ständigen Ausschusses
    des Pekinger Volkskongresses für 2026 vom 04.03.2026 als 审议项目 (Beratungsgegenstand) geführt und im
    Gesetzgebungsarbeitsplan der Stadtregierung vom 14.05.2026 als 提请审议项目 (zur Beratung einzubringendes
    Vorhaben, Federführung: Kommission für Entwicklung und Reform). Beide Pläne nennen keinen Termin innerhalb
    des Jahres und behalten sich Verschiebungen ausdrücklich vor. Bis Jahresende ist mit einem Entwurfstext
    oder einem Beschluss zu rechnen; andernfalls wandert das Vorhaben in den Plan 2027.

    '
