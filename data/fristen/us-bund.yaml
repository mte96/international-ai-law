- id: us-omb-m-25-21-f1
  datum: 2026-12-31
  beschreibung: 'RICHTWERT, KEIN NORMFESTER STICHTAG. M-25-21 verpflichtet die Behörden in Abschn. 3(b)(v)
    nur dazu, ihre KI-Anwendungsfälle „at least annually“ zu inventarisieren, dem OMB zu übermitteln und
    eine öffentliche Fassung zu veröffentlichen; Abschn. 4(a)(iv) verlangt die Veröffentlichung einer
    Zusammenfassung jeder Risikoeinstufung und jedes Waiver für high-impact AI. Das konkrete Datum setzt
    das OMB jährlich in einer gesonderten Reporting Guidance. Für den Zyklus 2025 galt: Übermittlung an
    das OMB bis 22.12.2025, öffentliche Veröffentlichung bis 28.01.2026; das konsolidierte Inventar 2025
    (3.611 Anwendungsfälle) erschien erst im April 2026. Für 2026 ist eine Reporting Guidance noch nicht
    auffindbar; der 31.12.2026 ist eine Fortschreibung des Vorjahresmusters, keine amtlich gesetzte Frist.

    '
  typ: einreichung
  jurisdiktion: us
  regelwerk: us-omb-m-25-21
  adressat: Bundesbehörden; mittelbar deren KI-Lieferanten
  handlungsbedarf: 'Inventare auswerten: Sie legen offen, welche Systeme welcher Anbieter in Bundesbehörden
    im Einsatz sind, und sind damit zugleich Wettbewerbsinformation und Reputationsrisiko.

    '
  quelle: https://www.whitehouse.gov/wp-content/uploads/2025/02/M-25-21-Accelerating-Federal-Use-of-AI-through-Innovation-Governance-and-Public-Trust.pdf
