- id: us-great-american-ai-act-f1
  datum: null
  beschreibung: 'KEIN KALENDERFÄHIGER STICHTAG. Der am 04.06.2026 von den Abgeordneten Obernolte und Trahan
    vorgelegte Diskussionsentwurf ist bis heute (05.09.2026) nicht als Gesetzentwurf eingebracht. Sec.
    121(d) knüpft das Ende der Verdrängung einzelstaatlicher Gesetze nicht an ein Kalenderdatum, sondern
    an die Verkündung: „This section shall cease to have effect 3 years after the date of enactment of
    this Act, unless Congress acts to reauthorize it prior to that date.“ Das zuvor hier eingetragene
    Datum 31.12.2029 stand in keinem Text; es ist entfernt. Ein Stichtag entsteht erst mit einer Verkündung.

    '
