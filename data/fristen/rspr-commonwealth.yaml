- datum: vierteljährlich ab 06.05.2026
  id: commonwealth-termin-t8
  beschreibung: 'Kanada — In der gemeinsamen Untersuchung der Datenschutzaufsichtsbehörden von Kanada,
    Québec, British Columbia und Alberta zu ChatGPT (PIPEDA Findings #2026-002 vom 06.05.2026) hat OpenAI
    zehn Maßnahmen zugesagt und sich verpflichtet, den Behörden vierteljährlich Bericht zu erstatten:
    "It will provide the Offices with quarterly reports to confirm and demonstrate, with detailed submissions
    and corroborating evidence, compliance with the above commitments until all have been met." Die Berichtspflicht
    endet nicht zu einem festen Datum, sondern mit der vollständigen Umsetzung. Für einzelne Zusagen laufen
    gestufte Fristen von drei Monaten (erweiterte Transparenzangaben, Hinweis vor der Anmeldung) und sechs
    Monaten (verbessertes Datenexportformat, Erprobung von Kinderschutzmaßnahmen, Bestätigung der Aufbewahrungspolitik
    für Altdatenbestände) ab Veröffentlichung der Feststellungen.

    '
