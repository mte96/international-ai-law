  id: commonwealth-termin-t5
  beschreibung: 'Australien — Inkrafttreten der Transparenzpflicht für automatisierte Entscheidungen (APP
    1.7 Privacy Act 1988 (Cth)): Datenschutzerklärungen müssen offenlegen, welche Arten personenbezogener
    Daten in automatisierte Entscheidungen einfließen und welche Arten von Entscheidungen ausschließlich
    automatisiert getroffen oder maßgeblich vorbereitet werden. Der Stichtag folgt aus der Commencement-Tabelle
    des Änderungsgesetzes: Schedule 1 Part 15 des Privacy and Other Legislation Amendment Act 2024 tritt
    am Tag nach Ablauf von 24 Monaten seit dem Royal Assent vom 10.12.2024 in Kraft. Das ist die unmittelbare
    gesetzgeberische Antwort auf Robodebt.

    '
  urteil: au-2023-robodebt-royal-commission
