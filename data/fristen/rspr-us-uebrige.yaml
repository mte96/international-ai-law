  beschreibung: 'Ausschluss- und Widerspruchsfrist im RealPage-Vergleich, jeweils bis 22.09.2026, 23:59
    Uhr EST. Der gerichtlich genehmigte Long Form Notice nennt durchgängig den 22.09.2026; die Dokumentenliste
    der Vergleichsseite führt dazu eine "Court-Approved Extension of Certain Settlement Deadlines" vom
    28.08.2026. Rubrum: In re RealPage, Inc., Rental Software Antitrust Litigation (No. II), Case No.
    3:23-MD-3071, MDL No. 3071, M.D. Tenn., Nashville Division. NICHT AM AMTLICHEN TEXT BELEGT: Das PDF
    der Verlängerungsanordnung war nicht abrufbar; Titel und Datum stammen aus der Dokumentenliste, der
    Inhalt ergibt sich mittelbar aus dem geänderten Long Form Notice. Die Fallseite des Gerichts (tnmd.uscourts.gov)
    führt keine Vergleichstermine, CourtListener ist per robots.txt gesperrt.

    '
