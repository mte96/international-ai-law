  letzte_pruefung: '2026-09-07'
  pruefvermerk:
  - '07.09.2026: Das Koordinationsdekret (JCCP 5431, "Order Re Petition for Coordination", 03.02.2026)
    nennt Gericht, JCCP-Nummer, Dept. 606 und Judge Murphy und stellt den Vorbehalt der späteren Zuweisung
    eines Coordination Trial Judge ausdrücklich klar; der auf den 19.02.2026 terminierte Stay-Antrag der
    Beklagten wurde "off calendar as moot" gesetzt. Zwei Trackerseiten nennen übereinstimmend Judge Ethan
    P. Schulman, Department 304, die CMC vom 24.07.2026, die CMO No. 1 vom 04.08.2026 und eine "further
    case management conference" am 23.09.2026. Der Eintrag hat damit erstmals belastbare Quellen, bleibt
    aber unverifiziert.'
