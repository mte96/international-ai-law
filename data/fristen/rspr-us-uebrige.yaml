- id: us-uebrige-termin-t6
  datum: null
  beschreibung: 'KEIN STICHTAG, PRÄMISSE ÜBERHOLT. Über einen Antrag auf einstweilige Verfügung ist nicht
    entschieden worden; das Docket zeigt stattdessen eine einvernehmliche vorübergehende Aussetzung der
    Durchsetzung: Am 24.04.2026 beantragten die Parteien gemeinsam, die Scheduling Conference aufzuheben,
    die Verfahrensfristen auszusetzen und die Durchsetzung vorläufig zu stoppen (Dkt. 18); der Antrag
    wurde noch am selben Tag an Magistrate Judge Chung verwiesen (Dkt. 20), der Stipulated Order erging
    am 27.04.2026. Damit gibt es auch keinen daran anknüpfenden 14-Tage-Lauf. Hinzu kommt, dass das angegriffene
    Gesetz — der Colorado AI Act (SB 24-205) — am 14.05.2026 durch SB 26-189 aufgehoben und neu erlassen
    wurde; der Streitgegenstand ist damit weitgehend entfallen. Die RECAP-Abdeckung des Dockets endet
    am 27.04.2026; der weitere Gang des Verfahrens ist über CourtListener nicht feststellbar.

    '
  typ: sonstiges
  jurisdiktion: us
  urteil: us-2026-xai-weiser
