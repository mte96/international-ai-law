  pruefvermerk:
  - '07.09.2026: Datum von 01.09.2026 auf 22.09.2026 berichtigt. Der gerichtlich genehmigte Long Form
    Notice lautet wörtlich: Ausschluss "11:59 p.m. EST on September 22, 2026", Widerspruch "11:59 p.m.
    on September 22, 2026", Anmeldung "11:59 p.m. EST on January 29, 2027". WIDERSPRUCH, aufgelöst: Die
    Pressemitteilung der Settlement Class Counsel vom 20.08.2026 nennt noch "no later than September 1,
    2026"; sie gibt den Stand vor der Verlängerung wieder und ist überholt. Wer den Bestand nur an dieser
    Pressemitteilung prüft, übernimmt ein falsches, bereits abgelaufenes Datum.'
- id: us-uebrige-termin-t3
  datum: 2026-09-23
  beschreibung: 'Weitere Case Management Conference in JCCP 5431 (In re: ChatGPT Product Liability Cases)
    am 23.09.2026; nach einer der Quellen ist an diesem Tag zugleich ein Antrag auf Pseudonymisierung
    in Jean Doe v. OpenAI terminiert. Zuständig ist Hon. Ethan P. Schulman, Department 304, als Coordination
    Trial Judge. Das Koordinationsdekret vom 03.02.2026 stammt von Hon. Stephen M. Murphy, Department
    606 — er hat dem Petition for Coordination stattgegeben und zugleich angeordnet, dass alle Verfahren
    "stayed pending the assignment of a Coordination Trial Judge" sind; das Verfahren wurde danach Judge
    Schulman "for all purposes" zugewiesen. Dept. 606 ist danach nicht die zuständige Kammer, auch wenn
    es verbreitet so genannt wird. Verfahrensstand: erste Case Management Conference 24.07.2026, Case
    Management Order No. 1 vom 04.08.2026 (Leadership-Struktur, mit handschriftlichem Vorbehalt zugunsten
    selbstvertretener Kläger), Beitritt eines weiteren Verfahrens durch Beschluss vom 21.07.2026; derzeit
    acht Klägerverfahren. NICHT AMTLICH BELEGT: Der Superior Court of California, County of San Francisco,
    veröffentlicht kein zugängliches Register of Actions zu JCCP 5431; CourtListener und govinfo führen
    einzelstaatliche kalifornische Verfahren nicht. Der Termin beruht auf zwei voneinander unabhängigen
    Trackerquellen mit Stand 02.09.2026.

    '
