  beschreibung: 'Anwendungsbeginn der National Software Testing Guideline 2026 und der Software Testing
    Organisations Licensing Guideline 2026. BEIDE LEITLINIEN SIND UNTERZEICHNET (14.07.2026), IHR ANWENDUNGSBEGINN
    IST ABER NOCH NICHT BESTIMMT: Sie treten "on a date to be determined and communicated by" der NITDA
    in Kraft; die Lizenzierungsleitlinie sieht zusätzlich eine Übergangszeit vor. Ab Wirksamkeit müssen
    sämtliche Software — nach der Legaldefinition der Entwicklungsleitlinie einschließlich KI-Systemen
    und algorithmischer Entscheidungswerkzeuge — vor der Bereitstellung von einer NITDA-lizenzierten Prüforganisation
