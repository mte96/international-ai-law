  beschreibung: 'Das National Digital Infrastructure Assurance Framework 2026 wird wirksam. Ab diesem
    Tag müssen Anbieter von KI-Infrastruktur (Artificial Intelligence Infrastructure Providers) und Sovereign
    Compute Providers in Nigeria die Cloud Infrastructure Provider Certification, die Cloud Service Provider
    Certification oder beide besitzen, samt der von der NITDA vorzuschreibenden KI-Vermerke. Für die öffentliche
    Beschaffung ist das Rahmenwerk zwingend.

    '
