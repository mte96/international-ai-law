- id: ke-data-protection-act-2019-f1
  datum: null
  datum_offen: true
  datum_hinweis: "Wiederkehrende Verfahrensfrist, kein einmaliger Stichtag."
  beschreibung: 'Wiederkehrende Verfahrensfrist, kein einmaliger Stichtag, aber praktisch die wichtigste
    Frist des kenianischen KI-Rechts: Nach s. 31 des Data Protection Act 2019 ist der Bericht über die
    Datenschutz-Folgenabschätzung SECHZIG TAGE VOR Beginn einer Hochrisikoverarbeitung beim ODPC einzureichen.
    Über Regulation 49(1)(c) der General Regulations 2021 gilt das für JEDE Verarbeitung biometrischer
    Daten — also für jede Einführung von Gesichtserkennung oder biometrischer KI in Kenia.

    '
  typ: einreichung
  jurisdiktion: ke
  regelwerk: ke-data-protection-act-2019
  adressat: Verantwortliche und Auftragsverarbeiter in Kenia, öffentlich wie privat
  handlungsbedarf: 'Bei jedem geplanten biometrischen oder sonstigen Hochrisiko-KI-System in Kenia ist
    der Vorlauf von sechzig Tagen einzuplanen.

    '
  quelle: https://www.odpc.go.ke/wp-content/uploads/2025/11/ODPC-–-Guidance-Note-on-Biometric-Data.pdf
  verifiziert: true
  kalender_sync: false
  vorwarnung_tage:
