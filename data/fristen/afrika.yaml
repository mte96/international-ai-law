  datum_offen: true
  datum_hinweis: "Wiederkehrende Überprüfung alle drei Jahre, ohne datierten Stichtag."
  beschreibung: 'Der kenianische Artificial Intelligence Bill 2026 sieht vor, dass der Cabinet Secretary
    das Gesetz ALLE DREI JAHRE überprüft, die Beteiligten konsultiert, neue Risiken bewertet und dem Parlament
    binnen sechs Monaten mit Änderungsvorschlägen berichtet. Die Frist läuft erst ab Inkrafttreten; da
    der Entwurf im Verfahren steckt, ist kein Datum bestimmbar.

    '
  typ: pruefung
  jurisdiktion: ke
  regelwerk: ke-ai-bill-2026
  adressat: Cabinet Secretary für Informations-, Kommunikations- und Digitalwirtschaft; Parlament
  handlungsbedarf: 'Zunächst ist der Verfahrensstand des Entwurfs zu klären; seit der ersten Lesung am
    02.04.2026 ist kein Fortschritt belegt.

    '
  quelle: https://www.parliament.go.ke/sites/default/files/2026-04/Bill%20Digest%20-%20The%20Artificial%20Intelligence%20Bill%2C%20No.4%20of%202026.pdf
