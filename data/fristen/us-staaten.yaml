- id: us-ct-2026-f5
  datum: 2027-12-31
  beschreibung: 'Connecticut: Ende der ermessensabhängigen Heilungsmöglichkeit. Nach Sec. 12 des Public
    Act 26-15 ist ein Verstoß gegen die Secs. 8 bis 11 eine unfaire oder irreführende Geschäftspraxis
    im Sinne von § 42-110b(a) der General Statutes, die allein der Attorney General verfolgt. Vor einer
    Klage wegen eines Verstoßes, der am oder vor dem 31.12.2027 eintritt, kann — nicht muss — der Attorney
    General eine Verletzungsanzeige erteilen, wenn er eine Heilung für möglich hält; wird der Verstoß
    nicht binnen sechzig Tagen nach Zugang geheilt, kann er klagen. Für Verstöße ab dem 01.01.2028 entfällt
    diese Möglichkeit.

    '
  typ: sonstiges
  jurisdiktion: us
  regelwerk: us-ct-2026
  adressat: Arbeitgeber mit Beschäftigten oder Bewerbern in Connecticut; Anbieter von HR-Software
  handlungsbedarf: Die Hinweisprozesse müssen vor diesem Datum belastbar stehen — die Heilungsmöglichkeit
    deckt nur Verstöße bis einschließlich 31.12.2027.
  quelle: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00015-R00SB-00005-PA.PDF
  fundstelle_norm: Connecticut Public Act 26-15, Sec. 12 (Heilungsmöglichkeit nur für Verstöße, die „on
    or before December 31, 2027“ eintreten)
  verifiziert: true
  kalender_sync: true
  vorwarnung_tage:
