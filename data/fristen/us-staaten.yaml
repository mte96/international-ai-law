  beschreibung: 'Connecticut, vierte Stufe: Sec. 39 des Public Act 26-15 wird wirksam. Sie verpflichtet
    „covered operators“ von Plattformen gegenüber erkannten Minderjährigen — unter anderem zu elterlich
    einstellbaren Nutzungszeiten, zur Beschränkung der Sichtbarkeit von Inhalten Minderjähriger gegenüber
    nicht verbundenen Nutzern und zu weiteren Schutzvorkehrungen.

    '
