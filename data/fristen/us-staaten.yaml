- id: us-ca-session-2026-f1
  datum: 2026-08-31
  beschreibung: 'Letzter Tag der Schlussabstimmungen in der kalifornischen Legislative. Cal. Const. Art.
    IV § 10(b)(2) knüpft daran an, ob eine Vorlage „before September 1 of the second calendar year of
    the biennium“ verabschiedet wurde; der letzte mögliche Tag ist damit der 31.08.2026. Für Vorlagen,
    die der Gouverneur am oder nach dem 01.09. in Händen hält, läuft die Entscheidungsfrist bis zum 30.09.2026
    — wird die Vorlage bis dahin nicht zurückgegeben, wird sie ohne Unterschrift Gesetz. Rund 24 KI-Vorlagen
    waren betroffen.

    '
  typ: sonstiges
  jurisdiktion: us
  regelwerk: us-ca-session-2026
  adressat: Beobachter der kalifornischen Gesetzgebung; betroffene Anbieter
  quelle: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CONS&sectionNum=SEC.%2010.&article=IV
  fundstelle_norm: Cal. Const. Art. IV § 10(b)(2)
  verifiziert: true
  kalender_sync: false
  vorwarnung_tage:
  - 7
  notiz_erledigt: 'ERLEDIGT am 31.08.2026: Die Sitzungsperiode ist beendet. Laufend ist jetzt die Frist
    des Gouverneurs bis zum 30.09.2026 (Cal. Const. Art. IV Sec. 10(b)(2)); wird eine Vorlage bis dahin
    nicht zurückgegeben, wird sie ohne Unterschrift Gesetz. Nach dem 30.09.2026 prüfen, welche Vorlagen
    unterzeichnet, mit Veto belegt oder ohne Unterschrift Gesetz geworden sind — belegbar beim Gouverneur
    liegen SB 813, SB 947 und SB 1168; die Liste ist wegen der robots.txt-Sperre von leginfo nicht abschließend.'
  letzte_pruefung: '2026-09-07'
  pruefvermerk:
  - '07.09.2026: Am amtlichen Fristenkalender des kalifornischen Senats für 2026 bestätigt: "Aug. 31 —
    Last day for each house to pass bills (Art. IV, Sec. 10(c)), (J.R. 61(b)(17))" und "Sept. 30 — Last
    day for Governor to sign or veto bills passed by the Legislature before Sept. 1 and in the Governor''s
    possession on or after Sept. 1 (Art. IV, Sec. 10(b)(2))". Die Unterzeichnungsmeldung von gov.ca.gov
    vom 31.08.2026 umfasst dreizehn Vorlagen, darunter keine KI-Vorlage; eine spätere Meldung existiert
    bis 07.09.2026 nicht.'
- id: us-ct-2026-f1
  datum: 2026-10-01
  beschreibung: 'Connecticut, erste materielle Stufe des Public Act 26-15 (Substitute for S.B. No. 5,
    „An Act Concerning Online Safety“, unterzeichnet am 27.05.2026). Zum 01.10.2026 werden wirksam: Offenlegungspflichten
    abonnementbasierter KI-Anbieter (Sec. 1), Pflichten der Frontier-Entwickler zu katastrophenbezogenen
    Risiken samt Repressalienverbot zugunsten der Beschäftigten (Sec. 2), der Rahmen für automatisierte
    beschäftigungsbezogene Entscheidungstechnologie (Secs. 7 bis 12) und die Kennzeichnung synthetischer
    Inhalte durch Anbieter generativer KI-Systeme mit über einer Million Nutzern im Monat (Sec. 15).

    '
  typ: anwendungsbeginn
  jurisdiktion: us
  regelwerk: us-ct-2026
  adressat: Anbieter mit Nutzern in Connecticut; Frontier-Entwickler
  handlungsbedarf: Provenienzpflichten aus Sec. 15 (Anbieter generativer KI mit über 1 Mio. Nutzern/Monat)
    mit den kalifornischen Vorgaben aus Bus. & Prof. Code §§ 22757 ff. abgleichen.
  quelle: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00015-R00SB-00005-PA.PDF
  fundstelle_norm: Connecticut Public Act 26-15 (Substitute for S.B. No. 5, „An Act Concerning Online
    Safety“), Secs. 1, 2, 7 bis 12, 15, 26, 30 und 38 — jeweils „(Effective October 1, 2026)“
  verifiziert: true
  kalender_sync: true
  vorwarnung_tage:
  - 30
  - 7
- id: us-ny-session-2026-f1
  datum: 2026-12-31
  beschreibung: 'RICHTWERT, KEIN NORMFESTER STICHTAG. N.Y. Const. Art. IV § 7 bemisst die Entscheidungsfrist
    der Gouverneurin nach der Zuleitung, nicht nach dem Kalenderjahr: zehn Tage während der Sitzungsperiode,
    dreißig Tage bei Zuleitung nach Sitzungsende. Der 31.12.2026 ist die übliche Praxis, dass alle Vorlagen
    einer Sitzungsperiode bis Jahresende zugeleitet und beschieden werden, kein Datum aus dem Verfassungstext.
    Stand 05.09.2026 sind S 9051-B (Kids Chatbot Safety Act, Senat 04.06.2026, Assembly 05.06.2026) und
    A 6578 (AI Training Data Transparency Act, 04.06.2026) auf nysenate.gov als „Passed Senate & Assembly“
    geführt und der Gouverneurin noch nicht zugeleitet. Erst mit der Zuleitung entsteht ein datierbarer
    Stichtag.

    '
  typ: sonstiges
  jurisdiktion: us
  regelwerk: us-ny-session-2026
  adressat: Modellanbieter, Chatbot-Anbieter, Medienunternehmen mit New-York-Bezug
  handlungsbedarf: Laufend prüfen; bei Unterzeichnung von A 6578 ist eine zweite Trainingsdaten-Zusammenfassung
    nach New Yorker Vorgaben zu erstellen.
  quelle: https://www.nysenate.gov/legislation/bills/2025/S9051
  fundstelle_norm: N.Y. Const. Art. IV § 7 (Entscheidungsfrist von 30 Tagen nach Zuleitung bei nach Sitzungsende
    zugeleiteten Vorlagen)
  verifiziert: false
  kalender_sync: true
  vorwarnung_tage:
  - 90
  - 30
  - 7
- id: us-ca-sb942-ab853-f1
  datum: 2027-01-01
  beschreibung: 'Kalifornien, zweite Stufe des AI Transparency Act. § 22757.3.1 verpflichtet große Online-Plattformen,
    eingebettete Provenienzdaten auszulesen und dem Nutzer anzuzeigen, und zwar nur soweit technisch machbar
    und mit den Spezifikationen einer etablierten Normungsorganisation vereinbar; § 22757.3.2 verbietet
    Hosting-Plattformen für GenKI-Systeme, wissentlich ein System bereitzustellen, das keine Offenlegung
    nach § 22757.3 vornimmt. Beide Vorschriften werden nach ihrem jeweiligen Schlussabsatz zum 01.01.2027
    operativ.

    '
  typ: anwendungsbeginn
  jurisdiktion: us
  regelwerk: us-ca-sb942-ab853
  adressat: Große Online-Plattformen; Hosting-Plattformen (Modell-Hubs, App-Stores)
  handlungsbedarf: Prüfen, ob eigene Verteilungswege als Hosting-Plattform gelten; Provenienz-Auslesefähigkeit
    implementieren.
  quelle: https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=BPC&division=8.&title=&part=&chapter=25.&article=
  fundstelle_norm: Cal. Bus. & Prof. Code § 22757.3.1(c) und § 22757.3.2(b) — jeweils „This section shall
    become operative on January 1, 2027“
  verifiziert: true
  kalender_sync: true
  vorwarnung_tage:
