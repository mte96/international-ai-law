- id: us-ca-cppa-admt-f3
  datum: 2028-04-01
  beschreibung: 'Zwei Stichtage zum 01.04.2028. Nach § 7157(a)(1) sind für die in den Jahren 2026 und
    2027 durchgeführten Risikobewertungen die Angaben nach § 7157(b) bis zum 01.04.2028 an die CPPA zu
    übermitteln; danach jeweils bis zum 01.04. des Folgejahres (§ 7157(a)(2)). Nach § 7121(a)(1) ist bis
    zum 01.04.2028 der erste Cybersicherheits-Auditbericht fertigzustellen, wenn der Jahresbruttoumsatz
    2026 zum 01.01.2027 über 100 Mio. USD lag; der Prüfzeitraum ist der 01.01.2027 bis 01.01.2028. Weitere
    Stufen: 01.04.2029 bei 50 bis 100 Mio. USD Umsatz 2027 (§ 7121(a)(2)) und 01.04.2030 bei unter 50
    Mio. USD Umsatz 2028 (§ 7121(a)(3)).

    '
