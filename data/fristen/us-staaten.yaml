  datum: 2028-03-01
  beschreibung: 'Offenlegungspflicht der Plattformbetreiber aus Sec. 39(e) des Public Act 26-15, keine
    allgemeine Berichtspflicht des Gesetzes: Jeder „covered operator“ hat bis zum 01.03.2028 und danach
    jährlich in der vom Attorney General vorgegebenen Form für das vorangegangene Kalenderjahr offenzulegen,
    unter anderem die Gesamtzahl der Nutzer der Plattform in diesem Jahr. Adressat sind damit Plattformbetreiber,
    nicht die nach anderen Teilen des Gesetzes verpflichteten Stellen.

    '
