- id: us-ct-2026-f4
  datum: 2027-07-01
  beschreibung: 'PRÄZISIERT. Sec. 3 des Public Act 26-15 tritt am 01.07.2027 in Kraft; erst ab diesem
    Tag besteht der Auftrag an den Commissioner of Economic and Community Development, im Benehmen mit
    Banking, Administrative Services, Public Health und Insurance einen Plan für ein KI-Reallabor zu entwickeln,
    der Anbietern die befristete Erprobung unter reduzierten Zulassungs- und Aufsichtsanforderungen erlaubt.
    Der 01.07.2027 ist also kein Vorlagetermin: Die Empfehlungen für die nötige Gesetzgebung sind nach
    Sec. 3 dem Gouverneur und den zuständigen Ausschüssen „not later than January 1, 2028“ vorzulegen.
    Der Commissioner soll dabei die Reallabore anderer Staaten auf ein wechselseitiges Mehrstaatenprogramm
    prüfen. Sec. 33 (ebenfalls zum 01.07.2027) richtet daneben beim Department of Consumer Protection
    ein Pilotprogramm mit unabhängigen Verifizierungsstellen ein.

    '
  typ: umsetzungsfrist
  jurisdiktion: us
  regelwerk: us-ct-2026
  adressat: Connecticut Artificial Intelligence Policy Office; an einer Teilnahme interessierte Anbieter
  handlungsbedarf: Für europäische Anbieter als möglicher Markteintrittspfad beobachten — vergleichbar
    dem Reallabor in Utah und Texas.
  quelle: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00015-R00SB-00005-PA.PDF
  fundstelle_norm: Connecticut Public Act 26-15, Sec. 3 („Effective July 1, 2027“); Vorlage der Empfehlungen
    „not later than January 1, 2028“
  verifiziert: true
  kalender_sync: true
  vorwarnung_tage:
  - 90
