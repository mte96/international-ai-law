- id: us-ca-cppa-admt-f1
  datum: 2027-01-01
  beschreibung: 'Cal. Code Regs. tit. 11, § 7200(b) lautet: „A business that uses ADMT for a significant
    decision prior to January 1, 2027, must be in compliance with the requirements of this Article no
    later than January 1, 2027. A business that uses ADMT on or after January 1, 2027, must be in compliance
    with the requirements of this Article any time it is using ADMT for a significant decision.“ Wer ADMT
    für wesentliche Entscheidungen (Finanzen, Wohnen, Bildung, Beschäftigung, Gesundheit) einsetzt, muss
    Vorabinformation (§ 7220), Opt-out (§ 7221) und Auskunft über die Entscheidungslogik (§ 7222) zu diesem
    Tag umgesetzt haben. Einen ADMT-Stichtag zum 01.04.2027 kennt die Verordnung nicht.

    '
  typ: umsetzungsfrist
  jurisdiktion: us
  regelwerk: us-ca-cppa-admt
  adressat: Jedes 'business' im Sinne des CCPA mit ADMT-Einsatz — einschließlich europäischer Unternehmen
    oberhalb der CCPA-Schwellen
  handlungsbedarf: DSFA-Bestand auf die CPPA-Anforderungen mappen, Opt-out-Mechanismus und Logik-Auskunft
    bis 01.01.2027 bauen, prüfen, ob eigene Systeme eine menschliche Entscheidung „ersetzen oder wesentlich
    ersetzen“.
  quelle: https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf
  fundstelle_norm: Cal. Code Regs. tit. 11, § 7200(b)
  verifiziert: true
  kalender_sync: true
  vorwarnung_tage:
  - 90
  - 30
  - 7
