- id: us-il-sb315-f2
  datum: 2028-01-01
  beschreibung: 'Illinois, Beginn der Kernpflichten. Section 10(a) verlangt ab dem 01.01.2028 vom large
    frontier developer, ein frontier AI framework zu erstellen, umzusetzen, einzuhalten und deutlich sichtbar
    auf der eigenen Website zu veröffentlichen; Änderungen sind nach Section 10(b)(2) binnen 30 Tagen
    zu veröffentlichen. Section 10(d) verpflichtet ab dem 01.01.2028 oder 90 Tage nach erstmaliger Qualifikation
    als large frontier developer — je nachdem, was später eintritt — zum jährlichen unabhängigen Drittaudit;
    die Zusammenfassung des Prüfberichts ist nach Section 10(d)(4)(A) binnen 30 Tagen nach Erhalt zu veröffentlichen.
    Die Transparenzberichte nach Section 10(c) sind vor oder mit dem Deployment eines neuen oder wesentlich
    geänderten Frontier-Modells fällig.

    '
  typ: umsetzungsfrist
  jurisdiktion: us
  regelwerk: us-il-sb315
  adressat: Large frontier developers mit Angebot in Illinois
  handlungsbedarf: Prüferauswahl frühzeitig beginnen — es gibt keinen etablierten Markt für qualifizierte
    Frontier-Safety-Auditoren.
  quelle: https://www.ilga.gov/Legislation/BillStatus/FullText?GAID=18&DocNum=315&DocTypeID=SB&LegId=0&SessionID=114
  fundstelle_norm: Illinois Public Act 104-0538 (SB 315), Section 10(a) („Beginning January 1, 2028“)
    und Section 10(d) (Drittaudit ab 01.01.2028 oder 90 Tage nach erstmaliger Qualifikation, je nachdem
    was später ist); Veröffentlichung der Prüfzusammenfassung nach Section 10(d)(4)(A) binnen 30 Tagen
