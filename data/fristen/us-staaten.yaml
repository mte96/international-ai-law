  beschreibung: 'Connecticut, dritte und für Arbeitgeber wichtigste Stufe. Die Secs. 7 bis 12 des Public
    Act 26-15 sind zwar bereits zum 01.10.2026 wirksam, ihre Pflichten knüpfen aber tatbestandlich an
    den 01.10.2027 an: Sec. 8(a) verpflichtet den Entwickler einer automatisierten beschäftigungsbezogenen
    Entscheidungstechnologie, die „on or after October 1, 2027“ im Staat eingesetzt wird, dem Deployer
    alle für dessen Pflichten nach Secs. 9 und 10 nötigen Informationen zu geben; Sec. 9(a) und Sec. 10
    richten sich an Deployer, die ab diesem Tag solche Systeme im Umgang mit Beschäftigten oder Bewerbern
    einsetzen.

    '
