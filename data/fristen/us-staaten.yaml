  datum: 2028-01-01
  beschreibung: 'Kalifornien, dritte Stufe des AI Transparency Act. § 22757.3.3(a) verpflichtet Hersteller
    von Aufnahmegeräten für Geräte, die sie erstmals am oder nach dem 01.01.2028 zum Verkauf im Staat
    herstellen, dem Nutzer die Aufnahme einer latenten Kennzeichnung anzubieten (Herstellername, Gerätename
    und Versionsnummer, Zeit und Datum) und diese Kennzeichnung standardmäßig einzubetten; nach § 22757.3.3(c)
    wird die Vorschrift zum 01.01.2028 operativ. Die Pflicht gilt nur, soweit technisch machbar und mit
    den Spezifikationen einer etablierten Normungsorganisation vereinbar (§ 22757.3.3(b)).

    '
