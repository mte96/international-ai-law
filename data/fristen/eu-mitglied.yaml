  datum: 2026-12-31
  beschreibung: 'Frist der Banca d''Italia für die Vorlage der Relazione zur digitalen operativen Resilienz
    angesichts fortgeschrittener KI-Modelle. Die Comunicazione al mercato vom 17.07.2026 verlangt, dass
    das Verwaltungsorgan die Mitteilung befasst, einen Verantwortlichen benennt (regelmäßig die Kontrollfunktion
    für IKT-Risiken der zweiten Ebene) und für jeden benannten Risikobereich Exposition, Angemessenheit
    der bestehenden Schutzmaßnahmen, festgestellte Lücken und Interventionsprioritäten darstellt. Der
    Text bestimmt: ''La Relazione, con allegato il piano di lavoro, deve essere trasmessa alla Vigilanza
    entro il 31 dicembre 2026.''

    '
