  datum: 2025-03-31
  beschreibung: 'Ablauf der ursprünglichen Befristung der VSA-Experimentierung nach Art. 10 der LOI n°
    2023-380 vom 19.05.2023. Ab dem 01.04.2025 waren neue präfektorale Genehmigungen nicht mehr möglich,
    weil die Verlängerung durch das Transportsicherheitsgesetz am 24.04.2025 als cavalier législatif zensiert
    worden ist. STAND HEUTE (an Legifrance geprüft): Art. 10 gilt in der seit dem 20.08.2026 geltenden
    Fassung, geändert durch Art. 50 der LOI n° 2026-798 vom 18.08.2026; die Experimentierung mit algorithmischer
    Verarbeitung von Bildern aus Videoüberwachung und Drohnen läuft danach ''à titre expérimental, jusqu''au
    31 décembre 2030''. Das hier eingetragene Datum bleibt als historischer Endpunkt der ersten Befristung
    stehen; sein Wortlaut ist in der aktuellen konsolidierten Fassung nicht mehr sichtbar und daher nicht
    am Normtext belegt.

