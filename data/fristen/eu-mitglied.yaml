    III Abschnitte 1 bis 3). Ab diesem Tag muessen ACN und AgID ihre Aufsichts- und Sanktionsbefugnisse
    gegenueber Anbietern und Betreibern solcher Systeme tatsaechlich ausueben koennen — die dafuer erforderliche
    nationale Ausgestaltung steht im noch nicht veroeffentlichten Dekret AG 421. Die Governance- und die
    Sanktionsvorschriften der KI-VO (Kapitel VII und Kapitel XII, ausgenommen Art. 101) gelten davon unabhaengig
    seit dem 02.08.2025.

