    genererede efterligninger mv.'') mit der Angabe ''Ikrafttrædelsesdato: 31-03-2026'' und einer Stellungnahmefrist
    bis zum 21.08.2025. Folgenlos verstrichen; im notifizierten Entwurf war das Datum bereits auf den
    01.07.2026 verschoben.

    '
