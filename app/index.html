<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>KI-Recht</title>
<meta name="description" content="Internationales KI-Recht — Regelwerke, Verfahren, Rechtsprechung, Fristen">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1729" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KI-Recht">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="kopf">
  <div class="kopf-oben">
    <button class="ikon nur-mobil" id="btn-filter" aria-label="Filter">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
    </button>
    <h1 class="marke">KI&#8209;Recht</h1>
    <button class="ikon" id="btn-thema" aria-label="Darstellung wechseln">
      <svg viewBox="0 0 24 24" class="i-hell"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg viewBox="0 0 24 24" class="i-dunkel"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <div class="suchzeile">
    <svg class="lupe" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="suche" placeholder="Suchen — Norm, Aktenzeichen, Fundstelle, Stichwort" autocomplete="off" spellcheck="false">
    <button class="loeschen" id="btn-loeschen" hidden aria-label="Suche löschen">&times;</button>
  </div>
  <nav class="reiter" id="reiter">
    <button data-ansicht="regelwerke" class="aktiv">Regelwerke</button>
    <button data-ansicht="fristen">Fristen</button>
    <button data-ansicht="zeitstrahl">Zeitstrahl</button>
    <button data-ansicht="urteile">Rechtsprechung</button>
    <button data-ansicht="streit">Streitstände</button>
    <button data-ansicht="literatur">Literatur</button>
    <button data-ansicht="lernen">Lehrplan</button>
    <button data-ansicht="dossiers">Dossiers</button>
    <button data-ansicht="welt">Weltraster</button>
    <button data-ansicht="matrix">Matrix</button>
  </nav>
</header>

<div class="rumpf">
  <aside class="filter" id="filter">
    <div class="filter-kopf nur-mobil">
      <strong>Filter</strong>
      <button class="ikon" id="btn-filter-zu" aria-label="Schließen">&times;</button>
    </div>
    <section class="fgruppe">
      <h2>Rechtsordnung</h2>
      <div id="f-jurisdiktion" class="chips"></div>
    </section>
    <section class="fgruppe">
      <h2>Themenachse</h2>
      <div id="f-thema" class="chips"></div>
    </section>
    <section class="fgruppe" id="fg-norm" hidden>
      <h2>Vorschrift</h2>
      <input type="search" id="f-normsuche" placeholder="Art. 50, § 44b …" autocomplete="off">
      <div id="f-norm" class="chips"></div>
    </section>
    <section class="fgruppe">
      <h2>Status</h2>
      <div id="f-status" class="chips"></div>
    </section>
    <button class="zuruecksetzen" id="btn-reset">Filter zurücksetzen</button>
    <div class="fusszeile">
      <span id="stand"></span>
      <a href="fristen.ics" download>Fristen als Kalender</a>
    </div>
  </aside>

  <main class="inhalt">
    <div class="werkzeuge" id="werkzeuge" hidden>
      <label class="sortlabel">Sortierung
        <select id="sortierung"></select>
      </label>
      <div class="wzr">
        <button class="wzbtn" id="btn-export" hidden>Export</button>
        <button class="wzbtn" id="btn-amtlich" hidden>Nur amtliche Fundstellen</button>
      </div>
    </div>
    <div id="inhalt"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>

<aside class="detail" id="detail" hidden>
  <div class="detail-kopf">
    <button class="ikon" id="btn-detail-zu" aria-label="Schließen">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span id="detail-marke"></span>
  </div>
  <div class="detail-rumpf" id="detail-rumpf"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
