    Gegenueber dem gepruesten Aufruf wurden zwei Dinge geaendert: das Stichwort ist prozentkodiert, und limit steht
    auf 100 statt 5 — beides ist bei der Probe zu bestaetigen. Der allgemeine Endpunkt /api/2/laws liefert die Gesetze
    ohne erkennbare Ordnung und taugt fuer eine Beobachtung nicht. Sprache japanisch, Blaettern ueber next_offset.'
