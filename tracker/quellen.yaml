  intervall: 12h
  zuverlaessigkeit: hoch
  getestet: true
  http_status: 401 (mit abgelaufenem öffentlichem Key)
  aktiv: true
  hinweise: 'WICHTIG — KEY-PROBLEM VERIFIZIERT: Der in vielen GitHub-Repos kursierende öffentliche Key
    ist laut bundesAPI-Repo bis Ende Mai 2026 gültig gewesen — heute (Aug 2026) also ABGELAUFEN. Ein Test mit einem
    älteren kursierenden Key ergab 401. Eigenen Key per E-Mail anfordern: parlamentsdokumentation@bundestag.de Key
    ist 42 Zeichen, per Header ODER Query-Parameter "apikey". Formate: JSON oder XML (Parameter format). Limits
    (offiziell): max. 25 gleichzeitige Requests, max. 100 Entitäten pro Request (10 bei Volltext-Ressourcen). Weitere
    Rate-Limits existieren, werden aber "auch auf Nachfrage nicht veröffentlicht". ~15 Minuten Verzögerung zwischen
    DB-Änderung und API-Sichtbarkeit. Nur lesende Verben (GET/HEAD/OPTIONS). Endpunkte: vorgang, drucksache, drucksache-text,
    plenarprotokoll, aktivitaet, person. OpenAPI-Spec: https://github.com/bundesAPI/dip-bundestag-api

    '
