# Ein Profil je Themenachse (breit, alle 14 Tage) und je Streitstand
# (eng, woechentlich). Die Streitstandprofile sind die wertvollen: Sie
# finden genau das, was die offenen Rechtsfragen betrifft.
#
# Neue Profile einfach anhaengen. `dienste` waehlt die Schnittstellen:
#   openalex  - 250 Mio. Werke, beste Metadaten, Standardwahl
#   crossref  - DOI-Register, faengt Verlagsveroeffentlichungen
#   arxiv     - Preprints an der Schnittstelle Technik/Recht
